<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Law of Native Land Grabs</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Uncial+Antiqua&display=swap">
<style>
:root{--bg:#06071a;--card:rgba(8,9,24,.94);--line:#24264a;--line2:rgba(255,255,255,.07);--ink:#e8e6e1;--mute:#a3a1b4;--accent:#5600DC;--accent-hi:#a99cff}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 'Marcellus','Georgia',serif;overflow:hidden}
#map{position:absolute;inset:0;background:#03040a}
.card{position:absolute;z-index:800;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
.scroll{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
#key{top:12px;left:12px;width:340px;max-height:calc(100% - 46px);overflow:auto;padding:14px 16px;box-sizing:border-box}
#key h1{font:800 21px/1.22 'Uncial Antiqua','Marcellus','Georgia',serif;margin:0 0 5px;letter-spacing:.4px;color:#f0ece4;text-shadow:0 2px 12px rgba(0,0,0,.5);padding-right:30px}
#key .lede{color:var(--mute);margin:0 0 4px;font-size:12.8px}
#key.min .body,#key.min .lede{display:none}
.psec{margin:14px 0 3px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent-hi)}
.row{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-top:1px solid var(--line2)}
.row input{margin-top:4px}
.row label{flex:1;cursor:pointer;font-size:13px}
.row .n{color:var(--mute);font-size:11.5px}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
.bar{height:4px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%}
.sub{margin:4px 0 0;font-size:12px;color:var(--mute)}
.mute{color:var(--mute)}
a{color:var(--accent-hi)}
select,button.btn{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font:inherit;font-size:12.5px;cursor:pointer}
select option{background:#0b0c1e}
button.btn.on{border-color:var(--accent-hi);background:var(--accent);color:#fff}
button.btn:hover,#infoBtn:hover,#worldBtn:hover{border-color:var(--accent-hi);color:#fff}
.tog{display:inline-block;float:right;cursor:pointer;font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:1px 8px}
.chk{display:flex;gap:7px;align-items:center;font-size:12.8px;cursor:pointer;margin:2px 0}
#cnt{font-size:11.5px;color:var(--mute);margin-top:3px}
#wfilter{width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 7px;font:inherit;font-size:12.5px;margin:2px 0 4px}
#cfilter{width:100%;margin:2px 0 4px}
.allrow{display:flex;gap:6px;margin:4px 0 2px}
#olist{max-height:340px;overflow:auto}
.olist{max-height:340px;overflow:auto}
.wf{width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 7px;font:inherit;font-size:12.5px;margin:2px 0 4px}
#info .scope{font-size:14px}
#info .scope .sh{display:block;margin:12px 0 2px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent-hi)}
#info .scope .pct{display:flex;justify-content:space-between;gap:10px;margin:8px 0 2px;color:#f0ece4;border-bottom:1px solid var(--line2)}
#info .scope .pct span:last-child{white-space:nowrap}
.hp-near ul .nn{display:inline;cursor:pointer}
.grp{border-top:1px solid var(--line2)}
.gh{display:flex;gap:7px;align-items:center;width:100%;background:none;border:0;color:#f0ece4;font:inherit;font-size:12.5px;padding:5px 2px;cursor:pointer;text-align:left}
.gh:hover{color:#fff}
.gh .caret{display:inline-block;width:10px;color:var(--accent-hi);transition:transform .15s}
.grp.shut .caret{transform:rotate(-90deg)}
.grp.shut .gb{display:none}
.gb .oi{padding-left:14px}
.seg2{display:flex;gap:4px;flex-wrap:wrap;margin:3px 0}
.seg2 .btn{flex:1 1 auto}
.views{display:flex;gap:6px;margin:8px 0 2px}
.views .btn{flex:1;padding:5px 8px;font-size:13px}
.rng{position:relative;height:26px;margin:2px 4px 0}
.rng .track,.rng .fill{position:absolute;top:11px;height:3px;border-radius:3px}
.rng .track{left:0;right:0;background:rgba(255,255,255,.14)}
.rng .fill{background:var(--accent-hi)}
.rng input{-webkit-appearance:none;appearance:none;position:absolute;left:0;right:0;top:4px;width:100%;margin:0;background:transparent;pointer-events:none}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:14px;height:14px;border-radius:50%;background:#f0ece4;border:2px solid var(--accent);cursor:pointer}
.rng input::-moz-range-thumb{pointer-events:auto;width:12px;height:12px;border-radius:50%;background:#f0ece4;border:2px solid var(--accent);cursor:pointer}
.yrs{display:flex;justify-content:space-between;font-size:13px;color:#f0ece4}
.let{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.1);color:#f0ece4;font:700 9.5px Helvetica,Arial,sans-serif;margin:0 7px 0 0;vertical-align:1px}
.shp{flex:none;display:inline-block;width:11px;height:11px;margin-top:4px;line-height:0}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 6px}
.tags span{font-size:10px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--mute)}
.hp-read{margin:8px 0;padding:6px 0 6px 10px;border-left:2px solid var(--accent-hi);color:#e4e0ea;font-style:italic;font-size:13px}
.hp-edge{margin:8px 0;padding:6px 8px;border:1px solid var(--line);border-radius:4px;font-size:12px;color:#dedbe6}
.hp-src{color:var(--mute);font-size:11.5px;margin-top:10px;border-top:1px solid var(--line2);padding-top:6px}
#net{display:none;position:absolute;z-index:790;left:364px;right:374px;bottom:34px;height:40%;min-height:250px;padding:0;overflow:hidden}
#net.open{display:block}
#net svg{display:block;width:100%;height:100%;cursor:grab}
#netX{position:absolute;top:6px;right:8px;background:none;border:0;color:#bbb;font-size:20px;cursor:pointer;line-height:1;z-index:2}
#netT{position:absolute;top:9px;left:13px;font:400 14px/1.2 'Uncial Antiqua','Marcellus','Georgia',serif;color:#f0ece4;z-index:2;pointer-events:none}
.oi{display:flex;gap:8px;align-items:flex-start;padding:4px 2px;border-top:1px solid var(--line2);font-size:12.8px;cursor:pointer}
.oi:hover{background:rgba(255,255,255,.04)}
.oi.sel{background:rgba(255,255,255,.08)}
.oi .n{color:var(--mute);font-size:11px;display:block}
.dot{flex:none;display:inline-block;width:9px;height:9px;border-radius:50%;margin-top:5px;border:1px solid rgba(240,236,228,.55);box-sizing:border-box}
.lsort{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--mute);margin:4px 0}

#rcol{position:absolute;z-index:800;top:12px;right:12px;bottom:34px;width:350px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#rcol>*{pointer-events:auto;position:relative;box-sizing:border-box}
#infoBtn{position:relative;align-self:flex-end;padding:7px 14px;cursor:pointer;letter-spacing:.2px}
#tr{padding:12px 14px;flex:none}
#tr.min .body{display:none}
#tr.min{align-self:flex-end;padding:6px 10px}
.bases{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12.8px;margin:4px 0 2px}
.bases label{cursor:pointer;white-space:nowrap}
.seg{display:flex;gap:6px;margin:4px 0 2px;flex-wrap:wrap}
.tab{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--mute);font:inherit;font-size:12.5px;padding:3px 8px;border-radius:4px;cursor:pointer;line-height:1.25}
.tab:hover{color:var(--ink)}
.tab.on{color:#f0ece4;border-color:var(--accent-hi);background:rgba(255,255,255,.08)}
#det{display:none;flex:0 1 auto;min-height:0;overflow:auto;padding:13px 15px}
#det.open{display:block}
#detX{position:absolute;top:6px;right:8px;background:none;border:0;color:#bbb;font-size:20px;cursor:pointer;line-height:1}
#detX:hover{color:#fff}
.hp h3{margin:2px 0 5px;font-size:17px;font-weight:700;color:#f0ece4;border-bottom:1px solid var(--line);padding:0 18px 6px 0;line-height:1.3}
.hp-k{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);padding-right:20px}
.hp-sub{color:var(--mute);font-size:12px;margin:0 0 6px}
.hp-desc{margin:8px 0;color:#dedbe6;font-size:13px}
.hp-desc p{margin:0 0 8px}
.hp-desc strong{color:#f0ece4}
.hp-near{margin-top:10px;border-top:1px solid var(--line2);padding-top:6px;font-size:12px}
.hp-near .nn{cursor:pointer;display:block;padding:2px 0}
.hp-near .nn:hover{color:#fff}


#ttip{position:fixed;z-index:5000;pointer-events:none;background:rgba(12,13,20,.97);border:1px solid var(--line);border-radius:3px;padding:4px 8px;font-size:12.5px;display:none;max-width:320px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#worldBtn{position:absolute;z-index:800;right:52px;bottom:34px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 11px;font:13px 'Marcellus','Georgia',serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}
body.detopen #worldBtn{right:372px}
#info{inset:0;z-index:1001;border-radius:0;border:0;display:none;overflow:auto;padding:60px max(28px,calc((100% - 1000px)/2)) 40px;background:rgba(5,6,16,.975)}
#info.open{display:block}
#infoClose{position:fixed;top:12px;right:12px;z-index:1002;display:none}
#info.open+#infoClose{display:block}
#info h2{font:400 17px/1.3 'Uncial Antiqua','Marcellus','Georgia',serif;margin:26px 0 8px;color:#f0ece4;letter-spacing:.3px}
#info h2:first-child{margin-top:0}
#info p,#info li{font-size:14px}
#info ul{padding-left:20px;margin:4px 0}
.maplibregl-map{font-family:'Marcellus','Georgia',serif}
.maplibregl-ctrl-attrib{background:rgba(6,7,16,.8)!important;color:#8f8d9e;font-family:'Marcellus','Georgia',serif}
.maplibregl-ctrl-attrib a{color:#b0aec0!important}
.maplibregl-ctrl-attrib-button{filter:invert(1)}
.maplibregl-ctrl-group{background:var(--card)!important;border:1px solid var(--line);box-shadow:none!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}
.maplibregl-ctrl-bottom-right{bottom:24px}
body.detopen .maplibregl-ctrl-bottom-right{right:360px}
@media (max-width:820px){
  #net{left:12px;right:12px;top:auto;bottom:34px;height:38%;min-height:0}
  #key{width:auto;right:12px;max-height:42%}
  #rcol{top:auto;bottom:34px;left:12px;right:12px;width:auto;max-height:46%}
  #infoBtn{align-self:flex-start}
  #worldBtn{right:12px;bottom:auto;top:112px}
  body.detopen #worldBtn{right:12px}
  body.detopen .maplibregl-ctrl-bottom-right{right:0}
  #info{padding:56px 16px 80px}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="key" class="card scroll">
  <button id="toggleKey" class="tog" type="button" title="Pull the key up or down">−</button>
  <h1>The law of native land grabs</h1>
  <p class="lede">Binding instruments still in force or still decisive, plus the bills and transfers now pending, that claimed, took, and hold the land and lives of native peoples.</p>
  <div class="body" id="keyBody"></div>
</div>

<div id="rcol">
  <div id="infoBtn" class="card" role="button" tabindex="0">About and sources</div>
  <div id="tr" class="card"><button id="toggleTr" class="tog" type="button" title="Pull the basemap box up or down">−</button><div class="body" id="trBody"></div></div>
  <div id="det" class="card scroll hp"><button id="detX" type="button" title="Close">×</button><div id="detBody"></div></div>
</div>

<div id="net" class="card"><span id="netT">Network</span><button id="netX" type="button" title="Close">×</button><svg id="netsvg"></svg></div>
<button id="worldBtn" type="button" title="Zoom back out to the whole world">Whole world</button>
<div id="info" class="card scroll"></div>
<button id="infoClose" class="btn" type="button">Close</button>
<div id="ttip"></div>

<script>
window.LAW = {"DATA":[{"name":"Dum Diversas (papal bull)","year":1452,"where":"Pope Nicholas V — Rome","tier":"international","branch":"executive","lat":41.9022,"lon":12.4533,"flags":["foundational","destructive","invasive"],"field":"land","what":"A papal bull is a formal, legally-binding decree issued by the Pope. This one authorized the King of Portugal to seize the lands of 'pagans' and non-Christians and to reduce those people to permanent slavery. It is the first document in the chain known as the Doctrine of Discovery — the legal idea that Christian European powers automatically gained title to any 'discovered' non-Christian land. The bulls were never formally rescinded; the Vatican only repudiated the underlying mindset in 2023, and the doctrine still surfaces in property law.","read":"The first link in the chain: a religious order that turned conquest into lawful ownership. Almost every land title that follows traces back to the premise that non-Christian land was simply free for the taking.","src":"https://doctrineofdiscovery.org/dum-diversas/","srcname":"Doctrine of Discovery Project"},{"name":"Romanus Pontifex (papal bull)","year":1455,"where":"Pope Nicholas V — Rome","tier":"international","branch":"executive","lat":41.9028,"lon":12.454,"flags":["foundational","invasive","suppressive"],"field":"land","what":"A follow-up bull that broadened Portugal's right to 'invade, capture, vanquish and subdue' non-Christians along the African coast and to take their lands and goods forever. In plain terms: it converted armed conquest into recognized legal title, so long as the people conquered were not Christian. Like the other discovery bulls, it has never been formally annulled and remains a cited root of colonial land law.","read":"A grant of everything one could reach by force, as long as the people reached were the 'wrong' religion. Belief was used to declare inhabited land legally empty.","src":"https://doctrineofdiscovery.org/romanus-pontifex/","srcname":"Doctrine of Discovery Project"},{"name":"Inter Caetera (papal bull)","year":1493,"where":"Pope Alexander VI — Rome","tier":"international","branch":"executive","lat":41.9015,"lon":12.4525,"flags":["foundational","invasive"],"field":"land","what":"Issued the year after Columbus's voyage, this bull drew a line across the globe and granted the newly 'discovered' lands of the Americas to Spain (and the rest to Portugal), provided the inhabitants were converted to Christianity. A whole hemisphere — already home to millions — was assigned to two crowns by decree. It became the foundation later cited by colonial courts to justify European title over Indigenous land.","read":"Two kingdoms handed a hemisphere they had never seen, over the heads of everyone already living on it. The original deed to the Americas was written in Rome.","src":"https://doctrineofdiscovery.org/inter-caetera/","srcname":"Doctrine of Discovery Project"},{"name":"General Act of the Berlin Conference","year":1885,"where":"14 European powers — Berlin","tier":"international","branch":"executive","lat":52.52,"lon":13.405,"flags":["invasive","foundational","suppressive"],"field":"land","what":"At this conference fourteen European states agreed the rules for the 'Scramble for Africa.' Crucially, it held that a power could claim African territory only by 'effective occupation' — physically taking and administering it — which set off a race to seize land. The continent was partitioned with no African ruler present. Most of today's African national borders are the lines drawn in this period, which is why its influence is still everywhere on the map.","read":"A continent of established nations carved into colonies around a conference table in Europe. The borders it produced still cut through peoples and define states more than a century later.","src":"https://en.wikisource.org/wiki/General_Act_of_the_Berlin_Conference_on_West_Africa","srcname":"Wikisource (primary text)"},{"name":"Johnson v. M'Intosh","year":1823,"where":"U.S. Supreme Court — Washington, D.C.","tier":"national","branch":"judicial","lat":38.8906,"lon":-77.0046,"flags":["foundational","invasive","suppressive"],"field":"land","what":"The U.S. Supreme Court adopted the Doctrine of Discovery into American law. 'Title' means full legal ownership; the Court ruled that European 'discovery' gave the discovering nation that title, leaving Native nations only a 'right of occupancy' — permission to live on land they did not own — which only the federal government could buy or cancel. This decision has never been overturned and remains a foundation of U.S. property law taught in every law school.","read":"A 19th-century court turned a 15th-century church decree into binding American property law. Native nations could live on the land but never own it outright; the only permitted buyer was the government that claimed to have 'discovered' it.","src":"https://supreme.justia.com/cases/federal/us/21/543/","srcname":"Justia — U.S. Supreme Court"},{"name":"Cherokee Nation v. Georgia","year":1831,"where":"U.S. Supreme Court — Washington, D.C.","tier":"national","branch":"judicial","lat":38.8901,"lon":-77.006,"flags":["suppressive"],"field":"rule","what":"The Cherokee asked the Court to protect them as a foreign nation. Instead the Court invented a new, lesser category: tribes were 'domestic dependent nations' whose relationship to the United States resembled 'that of a ward to his guardian.' A 'ward' is a person placed under another's legal control. This status — sovereign enough to be bound, not enough to be independent — still defines the legal position of every federally recognized tribe today.","read":"Sovereignty was redefined as guardianship. A nation was made independent enough to be governed, never independent enough to refuse — a status still in force.","src":"https://supreme.justia.com/cases/federal/us/30/1/","srcname":"Justia — U.S. Supreme Court"},{"name":"Lone Wolf v. Hitchcock","year":1903,"where":"U.S. Supreme Court — Washington, D.C.","tier":"national","branch":"judicial","lat":38.891,"lon":-77.005,"flags":["suppressive","invasive"],"field":"rule","what":"The Court held that Congress has 'plenary power' — complete, unchecked authority — to break ('abrogate') treaties with Native nations whenever it chooses, without their consent. In practice this meant treaty-guaranteed land could be opened to settlers by a simple act of Congress. The plenary-power doctrine has been narrowed by later cases but never abolished, and is still cited to uphold federal authority over tribes.","read":"Every treaty was reduced to a piece of paper Congress could tear up at will. A binding promise that bound only the side unable to enforce it — and the rule still stands.","src":"https://supreme.justia.com/cases/federal/us/187/553/","srcname":"Justia — U.S. Supreme Court"},{"name":"Tee-Hit-Ton Indians v. United States","year":1955,"where":"U.S. Supreme Court — Washington, D.C.","tier":"national","branch":"judicial","lat":38.8896,"lon":-77.0038,"flags":["invasive","suppressive"],"field":"land","what":"'Aboriginal title' is the right of a people to land they have used and occupied since before colonization. The Court ruled that this kind of title — unless Congress has specifically recognized it by treaty or statute — is not 'property' under the Constitution. The consequence: the government can take such land without paying any compensation. This remains binding law and is regularly cited when Native land is taken for dams, pipelines, and public projects.","read":"The Court decided that the oldest claim to the land was the one the Constitution need not pay for. Occupancy since time immemorial was ruled to be worth nothing the government owes — and that holding is still on the books.","src":"https://supreme.justia.com/cases/federal/us/348/272/","srcname":"Justia — U.S. Supreme Court"},{"name":"Oliphant v. Suquamish Indian Tribe","year":1978,"where":"U.S. Supreme Court — Washington, D.C.","tier":"national","branch":"judicial","lat":38.8915,"lon":-77.0055,"flags":["suppressive"],"field":"rule","what":"The Court held that tribal courts have no criminal jurisdiction over non-Indians, even for crimes committed on tribal land. In plain terms, a tribe cannot prosecute a non-Native person who commits a crime inside its own reservation. The ruling stripped a core power of self-government and is a major reason for the present crisis of unprosecuted violence (including against Native women) in Indian country. It remains good law, narrowed only slightly by later violence-against-women statutes.","read":"A nation was told it could not enforce its own laws against outsiders on its own land. The gap this opened — outsiders effectively beyond local accountability — is still being felt today.","src":"https://supreme.justia.com/cases/federal/us/435/191/","srcname":"Justia — U.S. Supreme Court"},{"name":"City of Sherrill v. Oneida Indian Nation","year":2005,"where":"U.S. Supreme Court — Washington, D.C.","tier":"national","branch":"judicial","lat":38.892,"lon":-77.0042,"flags":["suppressive"],"field":"land","what":"The Oneida Nation bought back parcels of its historic reservation on the open market and argued its sovereignty over them revived. The Court said no — invoking 'laches' (the idea that waiting too long forfeits a right) and expressly citing the Doctrine of Discovery. The case shows the discovery doctrine is not a museum piece: it was decisive in a 21st-century ruling and continues to limit tribes' ability to restore their lands.","read":"Even buying the land back on the open market did not undo the original taking. A doctrine from 1493 was quoted to settle a case in 2005 — proof the foundation is still load-bearing.","src":"https://supreme.justia.com/cases/federal/us/544/197/","srcname":"Justia — U.S. Supreme Court"},{"name":"Oklahoma v. Castro-Huerta","year":2022,"where":"U.S. Supreme Court — Washington, D.C.","tier":"national","branch":"judicial","lat":38.8924,"lon":-77.0048,"flags":["suppressive","invasive"],"field":"rule","what":"In 2020 (McGirt v. Oklahoma) the Court had confirmed that much of eastern Oklahoma legally remains tribal reservation land. Two years later, Castro-Huerta sharply cut that back: it ruled that states share jurisdiction with the federal government to prosecute non-Indians for crimes against Indians on reservation land — expanding state power over tribal territory against the tribes' wishes. This is a current, active erosion of tribal sovereignty.","read":"A recognition of tribal land won in 2020 was hollowed out two years later by handing the state authority over it. The land grab need not seize the ground when it can quietly seize the jurisdiction over it.","src":"https://supreme.justia.com/cases/federal/us/597/21-429/","srcname":"Justia — U.S. Supreme Court"},{"name":"Indian Appropriations Act — end of treaty-making","year":1871,"where":"U.S. Congress — Washington, D.C.","tier":"national","branch":"legislative","lat":38.8893,"lon":-77.0085,"flags":["suppressive"],"field":"rule","what":"A single clause in a funding bill declared that the United States would no longer recognize any Native nation as an independent power it could deal with by treaty. Before this, tribes negotiated as nations; after it, they were governed by ordinary acts of Congress, which they had no vote in. The clause is still in force (25 U.S.C. § 71): to this day, no new treaties can be made with tribes.","read":"The last day a tribe could sit across the table as a nation. After this the United States wrote the rules alone and called the result law — and that remains the law.","src":"https://en.wikipedia.org/wiki/Indian_Appropriations_Act","srcname":"Indian Appropriations Act (1871)"},{"name":"Major Crimes Act","year":1885,"where":"U.S. Congress — Washington, D.C.","tier":"national","branch":"legislative","lat":38.8887,"lon":-77.0075,"flags":["suppressive"],"field":"rule","what":"This act put a list of serious crimes committed by Native people on reservations under federal — not tribal — jurisdiction, taking authority over those cases away from tribal governments. It was a direct intrusion into a nation's power to police its own members. Still in force today, it is a central piece of the tangled, often-criticized jurisdiction map of modern Indian country.","read":"Even justice over their own people was taken in-house by the federal government. Self-rule was hollowed out one category of authority at a time — and the hollowing has lasted.","src":"https://en.wikipedia.org/wiki/Major_Crimes_Act","srcname":"Major Crimes Act (1885)"},{"name":"Dawes / General Allotment Act","year":1887,"where":"U.S. Congress — Washington, D.C.","tier":"national","branch":"legislative","lat":38.8884,"lon":-77.0102,"flags":["invasive","suppressive"],"field":"land","what":"'Allotment' means breaking up land held in common by a whole community into small parcels owned by individuals. This act split tribal land into individual lots and declared everything 'left over' as 'surplus' to be sold to white settlers. Over the next ~50 years Native nations lost about 90 million acres — roughly two-thirds of their remaining land. The fragmented 'checkerboard' ownership it created still governs reservations and still obstructs tribal land use today.","read":"The enclosure act for a continent: dissolve the shared land into private lots, then sell off the 'surplus.' Ownership was privatized precisely so the land could be drained away — and the broken map it left behind still binds those reservations.","src":"https://www.archives.gov/milestone-documents/dawes-act","srcname":"U.S. National Archives"},{"name":"Public Law 280","year":1953,"where":"U.S. Congress — Washington, D.C.","tier":"national","branch":"legislative","lat":38.8908,"lon":-77.0095,"flags":["suppressive"],"field":"rule","what":"This law transferred broad criminal and civil legal authority over many reservations from tribal and federal hands to certain state governments — without tribal consent. States that had never had power over Native nations suddenly did. Still in force, PL 280 is a leading cause of the confusing, gap-ridden jurisdiction that leaves crimes on affected reservations under-policed and tribal authority weakened to this day.","read":"Authority over whole nations was handed to the states next door, no one asking the nations themselves. Sovereignty was transferred by statute — and the transfer still stands.","src":"https://en.wikipedia.org/wiki/Public_Law_280","srcname":"Public Law 280 (1953)"},{"name":"Royal Proclamation of 1763","year":1763,"where":"British Crown — London","tier":"national","branch":"executive","lat":51.5074,"lon":-0.1278,"flags":["foundational","invasive","suppressive"],"field":"land","what":"Issued by King George III, this royal order reserved western lands for Indian nations but declared that only the Crown could buy Native land — no settler or company could purchase it directly. That gave the Crown a monopoly over all dispossession. It is not a relic: the Proclamation is named in section 25 of Canada's Charter of Rights and remains a living foundation of Aboriginal law in Canada.","read":"A 'protection' that doubled as a deed: if only the Crown may buy the land, then only the Crown may take it. The fence was built facing inward — and it still stands in Canadian constitutional law.","src":"https://avalon.law.yale.edu/18th_century/proc1763.asp","srcname":"Avalon Project, Yale Law"},{"name":"Indian Act","year":1876,"where":"Parliament of Canada — Ottawa","tier":"national","branch":"legislative","lat":45.4215,"lon":-75.6972,"flags":["suppressive","invasive"],"field":"identity","what":"A single sweeping statute that put the federal government in control of nearly every aspect of life for 'status Indians' — a legal category the government itself defines, deciding who counts as Indian and who does not. It replaced traditional governments with government-supervised band councils and controlled land, money, and identity. Remarkably, it is still in force today, amended but never replaced, and still governs who a First Nation may legally recognize as its own member.","read":"One law to administer whole peoples out of self-government. Nearly 150 years on it is still the statute that lets an outside government define who an Indigenous nation is allowed to be.","src":"https://www.thecanadianencyclopedia.ca/en/article/indian-act","srcname":"The Canadian Encyclopedia"},{"name":"Residential schools — compulsory attendance (Indian Act)","year":1894,"where":"Parliament of Canada — Ottawa","tier":"national","branch":"legislative","lat":45.4205,"lon":-75.6985,"flags":["suppressive","destructive"],"field":"culture","what":"Amendments to the Indian Act made attendance at church-run, government-funded 'residential schools' compulsory for Indigenous children. The stated aim was assimilation — to erase Native language and culture. Over the system's century more than 150,000 First Nations, Métis and Inuit children were removed from their families; thousands died and were never returned home. The schools are closed, but their effect is immense and current: Canada's Truth and Reconciliation Commission, ongoing litigation, and the search for unmarked graves all flow directly from this policy.","read":"To take the children is to break the line of the people. Assimilation was written into law as truancy enforcement — and the wound it opened is still being counted today.","src":"https://www.thecanadianencyclopedia.ca/en/article/residential-schools","srcname":"The Canadian Encyclopedia"},{"name":"Terra nullius — claim of New South Wales","year":1788,"where":"British Crown — Sydney Cove","tier":"national","branch":"executive","lat":-33.8599,"lon":151.209,"flags":["foundational","invasive"],"field":"land","what":"'Terra nullius' is Latin for 'land belonging to no one.' Britain claimed the entire Australian continent on this basis — treating a land of hundreds of distinct Aboriginal nations as legally empty and therefore free to settle, with no treaty and no purchase. The fiction was finally overturned by the High Court in 1992, but its 204-year operation is the baseline from which all Australian land law and every present-day native-title claim still works backward.","read":"The most efficient land grab needs neither conquest nor treaty — only a legal fiction that the people already there do not exist. That fiction structured a continent's law for two centuries and still shapes what claimants must now prove.","src":"https://en.wikipedia.org/wiki/Terra_nullius","srcname":"Terra nullius (Australia)"},{"name":"Native Title Act","year":1993,"where":"Parliament of Australia — Canberra","tier":"national","branch":"legislative","lat":-35.308,"lon":149.1245,"flags":["suppressive","invasive"],"field":"land","what":"After the High Court's 1992 Mabo decision finally rejected the fiction of terra nullius and held that a form of 'native title' had survived British settlement, Parliament passed this Act to set the terms on which that title could be claimed and used. Rather than restore land, it largely codified the limits: it confirmed (validated) past government grants that had already extinguished native title, ranked native title below almost every other interest so that a competing freehold or lease wins, and required claimants to prove an unbroken, continuing connection to their country under traditional law and custom. The communities driven off earliest — and therefore least able to show that continuity — are the least able to qualify. Administered through the Federal Court and the National Native Title Tribunal, it is the live, governing framework for every Aboriginal and Torres Strait Islander land claim in Australia today.","read":"A door opened, then narrowed to a crack: prove an unbroken bond to the land you were driven off, or the recognition slips away. The recognition is real; the conditions quietly do the work the old denial used to do.","src":"https://aiatsis.gov.au/explore/native-title","srcname":"AIATSIS"},{"name":"Treaty of Waitangi","year":1840,"where":"The Crown & Māori — Waitangi","tier":"national","branch":"executive","lat":-35.2683,"lon":174.0894,"flags":["foundational","invasive"],"field":"land","what":"New Zealand's founding agreement between the British Crown and Māori chiefs exists in two texts that do not match. The English version has Māori ceding 'sovereignty'; the Māori version cedes only 'kāwanatanga' — governance — while keeping chieftainship over their lands and treasures. The Crown enforced the English reading. This gap is not history: it is the central, actively litigated question of New Zealand constitutional law, examined every day by the standing Waitangi Tribunal.","read":"Two texts, signed in good faith on one side — and the Crown enforced the version Māori never agreed to. That mismatch is still the live fault line running through the country's law.","src":"https://nzhistory.govt.nz/politics/treaty-of-waitangi","srcname":"NZ History (Manatū Taonga)"},{"name":"Native Lands Act","year":1865,"where":"NZ Parliament — Wellington","tier":"national","branch":"legislative","lat":-41.279,"lon":174.777,"flags":["invasive","suppressive"],"field":"land","what":"This act created the Native Land Court, which converted Māori land held collectively by a whole community into individual, sellable shares held by named owners. Once land was sliced into private shares it could be bought off one owner at a time — a highly effective machine for breaking up and alienating Māori land. That court still exists today as the Māori Land Court, so the legal machinery this act built is genuinely still running.","read":"Turn shared land into private slivers and each sliver becomes sellable on its own. The court was the lathe that cut the commons apart — and the lathe is still in the building.","src":"https://teara.govt.nz/en/native-land-court","srcname":"Te Ara — Encyclopedia of NZ"},{"name":"Natives Land Act","year":1913,"where":"Union Parliament — Cape Town / Pretoria","tier":"national","branch":"legislative","lat":-33.9258,"lon":18.4232,"flags":["invasive","suppressive"],"field":"land","what":"This act confined South Africa's African majority to roughly 7% (later 13%) of the country, barred them from buying or leasing land anywhere else, and outlawed sharecropping. It was the cornerstone of territorial segregation and the legal blueprint for apartheid geography. It was repealed in 1991 — but the ownership map it created largely persists, which is why land restitution and expropriation remain among the most charged questions in South Africa today.","read":"A majority was fenced onto a fraction of its own country by a single act. The statute is gone from the books; the map of who owns the ground that it drew is not.","src":"https://www.sahistory.org.za/article/natives-land-act-1913","srcname":"South African History Online"},{"name":"Marco Temporal — Law 14.701/2023","year":2023,"where":"National Congress — Brasília, Brazil","tier":"national","branch":"legislative","lat":-15.799,"lon":-47.864,"flags":["invasive","suppressive"],"field":"land","what":"'Marco temporal' (the 'time-frame thesis') is the idea that Indigenous peoples can only claim land they can prove they physically occupied on 5 October 1988 — the day Brazil's constitution took effect — which ignores the communities driven off their land by the prior military dictatorship. Brazil's Supreme Court ruled the thesis unconstitutional in 2023; within weeks Congress passed Law 14.701/2023 to impose it anyway. The law is under constitutional challenge but has been applied to land demarcations, making it one of the most active fronts in the world for native dispossession.","read":"A cutoff date was drawn so that being forced off your land before it does not count as ever having held it. The taking is laundered through a calendar — and the fight over it is happening right now.","src":"https://www.ohchr.org/en/press-releases/2024/07/brazil-must-protect-indigenous-peoples-lands-territories-and-resources-says","srcname":"UN OHCHR"},{"name":"Indian Forest Act","year":1927,"where":"Colonial India — New Delhi","tier":"national","branch":"legislative","lat":28.6139,"lon":77.209,"flags":["invasive","suppressive"],"field":"extraction","what":"A colonial-era law, still in force across much of India, that lets the state declare any forest a 'reserved' or 'protected' forest and assume control over it — overriding the customary rights of the Adivasi (India's Indigenous tribal peoples) and other forest-dwelling communities who have lived there for generations. Although a 2006 law was meant to restore some of those rights, the 1927 Act remains the backbone of state forest control, and recent amendments have widened the state's hand.","read":"Declare the forest the state's and the people in it become trespassers on their own ground. A law written by colonial administrators still governs who may stay in the forests of India.","src":"https://en.wikipedia.org/wiki/Indian_Forest_Act,_1927","srcname":"Indian Forest Act (1927)"},{"name":"Basic Agrarian Law","year":1960,"where":"Republic of Indonesia — Jakarta","tier":"national","branch":"legislative","lat":-6.1754,"lon":106.8272,"flags":["invasive","suppressive"],"field":"land","what":"Indonesia's foundational land law recognizes customary ('adat') land rights of Indigenous communities only so far as they do not conflict with 'national interest' — a phrase the state reads broadly. On that basis the government claims a vast 'state forest estate' covering much of the country, over the heads of the peoples living in it, opening their territories to logging, plantations, and mining. Reinforced by the 2020 Omnibus 'Job Creation' Law, it remains the live legal basis for dispossession across the archipelago.","read":"Customary rights are honored exactly until the state decides it wants the land — at which point 'national interest' overrides them. Recognition with an off-switch the government alone controls.","src":"https://en.wikipedia.org/wiki/Basic_Agrarian_Law","srcname":"Basic Agrarian Law (1960)"},{"name":"Absentees' Property Law","year":1950,"where":"State of Israel — Jerusalem","tier":"national","branch":"legislative","lat":31.7767,"lon":35.2137,"flags":["invasive","suppressive"],"field":"land","what":"This law defines as 'absentee' anyone who left or was displaced from their property during the 1948 war — overwhelmingly Palestinian refugees and internally displaced people — and vests that property in a state Custodian, who may transfer it onward. The original owners cannot reclaim it. Still in force, it is a continuing legal mechanism by which land and homes pass from a displaced native population to the state, including in contested areas of Jerusalem.","read":"Leave under fire and the law reclassifies your home as 'absentee,' then hands it to the state. Displacement is converted into permanent transfer of title — a mechanism that is still operating.","src":"https://en.wikipedia.org/wiki/Absentees%27_Property_Law","srcname":"Absentees' Property Law (1950)"},{"name":"Numbered Treaties (Treaties 1–11)","year":1871,"where":"The Crown & First Nations — Canadian Prairies & North","tier":"national","branch":"executive","lat":49.8951,"lon":-97.1384,"flags":["foundational","invasive"],"field":"land","what":"Between 1871 and 1921 the Crown signed eleven 'Numbered Treaties' with First Nations across the prairies and the north. In the Crown's reading of the English texts, vast territories were 'surrendered' in exchange for small reserves, modest payments and promises; many First Nations understood the same agreements as a commitment to share the land, not to give it up. These treaties remain the legal foundation of Crown title across much of Canada and are still actively interpreted by the courts today — for example, long-running disputes over the treaty annuities that were never raised from a few dollars a person.","read":"An agreement one side understood as sharing the land became, in the other side's written text, a permanent surrender of it. The gap between the two readings is still the ground every later claim is argued on.","src":"https://www.thecanadianencyclopedia.ca/en/article/numbered-treaties","srcname":"The Canadian Encyclopedia"},{"name":"Regalian Doctrine (jura regalia)","year":1987,"where":"Republic of the Philippines — Manila","tier":"national","branch":"judicial","lat":14.5995,"lon":120.9842,"flags":["foundational","invasive","suppressive"],"field":"land","what":"Inherited from Spanish colonial rule and written into the 1987 Constitution (Article XII), the Regalian Doctrine holds that all land and natural resources of the 'public domain' belong to the State. The practical effect reverses the normal presumption: an Indigenous community must prove its land was never public in order to keep it. A 1997 law (IPRA) carved out a limited 'ancestral domain' exception, but courts still call the Regalian Doctrine the 'iron rule' of Philippine land law — the dominant, in-force framework sitting over every Indigenous territory.","read":"Begin from the rule that the state owns everything, and the burden falls on the first inhabitants to prove otherwise. The default was set against them at the founding, and it still is.","src":"https://www.respicio.ph/commentaries/regalian-doctrine-in-philippine-law","srcname":"Regalian Doctrine — Philippine law"},{"name":"Anti-Terrorism Law (Ley 18.314)","year":1984,"where":"Chile — applied in the Araucanía (Mapuche territory)","tier":"national","branch":"legislative","lat":-38.7359,"lon":-72.5904,"flags":["suppressive"],"field":"rule","what":"Enacted under the Pinochet dictatorship, this law sharply raises penalties for offenses such as arson and 'illicit association,' permits secret 'faceless' witnesses, and extends pre-trial detention. Since 2001 the Chilean state has repeatedly used it against Mapuche activists who occupy or reclaim ancestral land taken during the 19th-century 'Pacification of Araucanía.' By treating land reclamation as terrorism, the still-active law criminalizes the Mapuche land-rights movement itself.","read":"Reframing a people's attempt to recover stolen land as terrorism turns the dispossessed into the criminal. A dictatorship-era statute is still used to keep the original taking in place.","src":"https://www.amnesty.org/en/latest/news/2018/05/chile-autoridades-deben-dejar-de-criminalizar-personas-mapuches-a-traves-de-ley-antiterrorista/","srcname":"Amnesty International"},{"name":"Northern Territory Emergency Response ('the Intervention')","year":2007,"where":"Australia — Northern Territory","tier":"national","branch":"legislative","lat":-23.698,"lon":133.8807,"flags":["suppressive","invasive"],"field":"rule","what":"In 2007 the Australian government rushed through the Northern Territory National Emergency Response — 'the Intervention' — imposing sweeping controls on Aboriginal communities: compulsory five-year government leases over Aboriginal townships, plus restrictions on welfare payments, alcohol and movement. To enact race-specific measures, Parliament expressly suspended the Racial Discrimination Act so the rules could lawfully target Aboriginal people. Extended as 'Stronger Futures' through 2022, it set a template for top-down state control over Aboriginal land and lives.","read":"To impose controls aimed at one race, the government first switched off the law against racial discrimination. The safeguard was suspended precisely so the targeting could proceed.","src":"https://en.wikipedia.org/wiki/Northern_Territory_National_Emergency_Response","srcname":"NT National Emergency Response (2007)"},{"name":"Minerals Act & the Gállok concession","year":1991,"where":"Sweden — Gállok / Jokkmokk (Sápmi)","tier":"national","branch":"legislative","lat":66.6042,"lon":19.8261,"flags":["invasive","suppressive"],"field":"extraction","what":"Sweden's Minerals Act lets the state grant private companies 'exploitation concessions' — exclusive rights to mine — over land that Sámi reindeer-herding communities depend on and hold use-rights to across more than half the country. In 2022 the government granted such a concession for an iron-ore mine at Gállok (Kallak), deep in Sámi territory; the Supreme Administrative Court upheld it in 2024 despite Sámi objections and UN warnings. Sweden has never ratified the main treaty on Indigenous rights (ILO 169), so the Sámi have no legal power to refuse.","read":"The land can be opened to the mine without the people who live from it agreeing, because the law never granted them the right to say no. Consent was designed out of the process from the start.","src":"https://www.government.se/press-releases/2022/03/government-grants-exploitation-concession-for-kallak-k-no-1/","srcname":"Government of Sweden"},{"name":"Pololeti Game Reserve designation (Loliondo)","year":2022,"where":"Tanzania — Loliondo / Ngorongoro (Maasai land)","tier":"national","branch":"executive","lat":-2.05,"lon":35.62,"flags":["invasive","destructive","suppressive"],"field":"extraction","what":"Using conservation and tourism as the justification, the Tanzanian government in 2022 designated 1,500 square kilometres of legally registered Maasai village land in Loliondo as the Pololeti Game Reserve (by Government Notice), barring the pastoralist Maasai from living, grazing, or even drawing water there. Security forces shot and beat residents during the demarcation; in 2024 the High Court dismissed the Maasai legal challenge. Tens of thousands more face eviction from Loliondo and the neighbouring Ngorongoro area — a dispossession still unfolding now.","read":"Conservation supplies the cover story while the land is cleared for safaris and trophy hunting. Protecting the wildlife becomes the official reason for removing the people who lived alongside it.","src":"https://www.hrw.org/news/2023/04/27/tanzania-maasai-forcibly-displaced-game-reserve","srcname":"Human Rights Watch"},{"name":"Central Kalahari hunting ban & San removals","year":2014,"where":"Botswana — Central Kalahari Game Reserve (San land)","tier":"national","branch":"executive","lat":-22.35,"lon":23.5,"flags":["destructive","invasive","suppressive"],"field":"extraction","what":"The San (Bushmen) have lived in the Central Kalahari for thousands of years. From 1997 to 2005 the government forcibly relocated most of them out of the reserve — cutting off water and services — officially in the name of wildlife conservation, though diamonds were later mined inside. A 2006 High Court ruling found the eviction unlawful and affirmed their right to return, but the government read it narrowly (only the named applicants could go back, with no duty to restore their water) and in 2014 imposed a nationwide hunting ban that criminalizes San subsistence hunting while allowing trophy hunting on private ranches. The restrictions remain in force.","read":"Conservation was the stated reason for removing the people — even as mining was permitted in the same reserve. A court win was honored on paper and hollowed out in practice, and a hunting ban now makes the old way of life itself illegal.","src":"https://indigenous.arizona.edu/central-kalahari-game-reserve-0","srcname":"Univ. of Arizona — Indigenous Rights & Protected Areas"},{"name":"Mau Forest evictions (Ogiek)","year":2009,"where":"Kenya — Mau Forest Complex (Ogiek land)","tier":"national","branch":"executive","lat":-0.6,"lon":35.7,"flags":["invasive","destructive","suppressive"],"field":"extraction","what":"The Ogiek, a hunter-gatherer people, have lived in the Mau Forest since long before colonial rule. Under British rule the forest was declared Crown land (1930) and a forest reserve (1954); independent Kenya kept treating it as state land and the Ogiek as illegal 'squatters.' The Kenya Forest Service has issued repeated eviction notices — a 30-day notice in 2009, mass demolitions and home-burnings through 2023 — in the name of protecting the forest's water catchment. The African Court on Human and Peoples' Rights ruled for the Ogiek in 2017 and 2022, ordering recognition and collective title, but the government has not complied and the evictions continue.","read":"A people who have kept the forest for centuries are recast as its destroyers and burned out as squatters. Even two regional-court rulings in their favour have not stopped it — the eviction machinery simply ignores them.","src":"https://news.mongabay.com/2023/11/kenyan-government-again-evicts-ogiek-communities-from-mau-forest/","srcname":"Mongabay"},{"name":"Fosen wind concessions (Storheia & Roan)","year":2021,"where":"Norway — Fosen peninsula (Sámi reindeer land)","tier":"national","branch":"executive","lat":63.75,"lon":10.25,"flags":["invasive","suppressive"],"field":"extraction","what":"Norway granted concessions for the Fosen wind farms — Europe's largest onshore wind project — on the winter grazing lands of South Sámi reindeer herders. The 151 turbines, running since 2021, drive reindeer off pastures the herders have used for generations. In October 2021 Norway's Supreme Court ruled the concessions invalid because they violated the Sámi's cultural rights under international law — yet the turbines kept turning. After years of protest, 2023–24 settlements let them stay in exchange for compensation and replacement grazing. The land use the court itself called unlawful remains in place.","read":"Even a unanimous Supreme Court ruling that the project was illegal did not bring the turbines down. A right that is recognized but never enforced is, on the ground, no different from no right at all.","src":"https://www.loc.gov/item/global-legal-monitor/2021-10-25/norway-supreme-court-rules-windmill-park-in-sami-area-violates-indigenous-rights/","srcname":"Library of Congress"},{"name":"Sarawak Land Code (native customary rights)","year":1958,"where":"Malaysia — Sarawak (Dayak & Penan customary land)","tier":"national","branch":"legislative","lat":1.5533,"lon":110.3592,"flags":["suppressive","invasive"],"field":"land","what":"Sarawak's Land Code recognizes native customary rights only over land that indigenous Dayak and Penan communities had already cleared and cultivated before 1 January 1958. In 2016 Malaysia's Federal Court ruled that the wider customary territory — the communal forest and foraging domain (pemakai menoa and pulau galau) these peoples have always treated as their own — has 'no force of law.' The practical effect: any land a community cannot prove it farmed before 1958 is treated as state land, which the government then leases to logging and oil-palm companies. Hundreds of customary-land lawsuits sit pending while the forest is cleared.","read":"Recognize only the gardens and declare the surrounding forest empty, and the state is free to lease away the rest. A cut-off date and a narrow legal definition do the work the bulldozers finish.","src":"https://iwgia.org/en/malaysia/3429-iw2019-malaysia.html","srcname":"IWGIA"},{"name":"Chittagong Hill Tracts settlement program","year":1979,"where":"Bangladesh — Chittagong Hill Tracts (Jumma land)","tier":"national","branch":"executive","lat":22.6533,"lon":92.1751,"flags":["invasive","suppressive","destructive"],"field":"land","what":"The Chittagong Hill Tracts are home to eleven indigenous peoples collectively called the Jumma, ethnically distinct from the Bengali majority. To counter a Jumma autonomy insurgency, the government ran a transmigration program (1979–1984) that moved roughly 400,000 Bengali settlers into the hills, shifting the Bengali share of the population from about a quarter to nearly half and pushing the Jumma off their land. A 1997 Peace Accord promised a land-dispute commission, demilitarization and Jumma self-government, but more than 60% of it remains unimplemented — the land commission has resolved none of its roughly 27,000 complaints — while land-grabbing and a heavy military presence continue.","read":"Move enough settlers onto the land and the demographic fact becomes the political outcome. A peace accord meant to undo it has sat unimplemented for more than a quarter-century while the taking goes on.","src":"https://iwgia.org/en/news/4971-chittagong-hill-tracts-peace-accord-25-years-later-indigenous-peoples-still-serious-risk.html","srcname":"IWGIA"},{"name":"United States v. Sioux Nation (Black Hills)","year":1980,"where":"U.S. Supreme Court — Washington, D.C.","tier":"national","branch":"judicial","status":"active","lat":43.8791,"lon":-103.4591,"flags":["invasive","suppressive"],"field":"land","what":"The 1868 Fort Laramie Treaty guaranteed the Great Sioux Nation the Black Hills (Hesápa); after gold was found there, the United States seized them in 1877. In 1980 the Supreme Court agreed the taking was unlawful — and awarded money, not the return of the land. The Lakota have refused the payment ever since; the fund now exceeds a billion dollars, sitting untouched, because accepting it would legally extinguish their claim to the Hills. The land remains taken and the refusal stands.","read":"The Court admitted the theft and offered a cheque — anything but the land back. Paying for stolen ground is not returning it, and the Lakota have refused to let the price settle the claim.","src":"https://supreme.justia.com/cases/federal/us/448/371/","srcname":"Justia — U.S. Supreme Court"},{"name":"Forestry Law amendment (Law 31973)","year":2024,"where":"Peru — Congress, Lima (Amazon Indigenous land)","tier":"national","branch":"legislative","status":"active","lat":-12.0464,"lon":-77.0428,"flags":["invasive","suppressive","destructive"],"field":"extraction","what":"Known as the 'anti-forest law,' this January 2024 amendment to Peru's 2011 Forestry and Wildlife Law removes the requirement of state authorization before forest land is converted to farmland and retroactively legalizes ('pardons') deforestation that was carried out illegally before 2024. It was pushed through without the prior consultation of Indigenous peoples that the law requires. The UN warned it could legalize the dispossession of Amazonian communities — about a third of whom still hold no land title — and endanger peoples living in voluntary isolation. It is in force and under constitutional challenge.","read":"Legalize the clearing that was already a crime and the land-grabbers are rewarded rather than prosecuted. A pardon written into statute turns past dispossession into clean title.","src":"https://www.ohchr.org/en/press-releases/2024/02/peru-changes-forestry-law-will-threaten-survival-indigenous-peoples-un","srcname":"UN OHCHR"},{"name":"PEC 48/2023 — Marco Temporal into the Constitution","year":2023,"where":"National Congress — Brasília, Brazil","tier":"national","branch":"legislative","status":"pending","lat":-15.802,"lon":-47.865,"flags":["invasive","suppressive"],"field":"land","what":"A proposed constitutional amendment — called the 'PEC of Death' by Indigenous organizations — that would write the Marco Temporal 'time-frame' rule directly into Brazil's Constitution: Indigenous peoples could claim only land they physically occupied on 5 October 1988. Because the Supreme Court has already struck that rule down in ordinary law, lifting it into the Constitution is an attempt to place it beyond the Court's reach. The Senate approved it in December 2025; it still needs the lower house. If enacted it would let ranchers occupying recognized Indigenous land claim rights over it.","read":"What the courts keep striking down, Congress now tries to bolt into the Constitution itself — above the reach of the judges who blocked it. The cutoff date moves from a contested law to the highest law of the land.","src":"https://amazonwatch.org/news/2025/1210-brazils-senate-rams-through-constitutional-amendment-imperiling-indigenous-lands-and-communities","srcname":"Amazon Watch"},{"name":"Oak Flat land transfer (Resolution Copper)","year":2014,"where":"USA — Oak Flat, Arizona (San Carlos Apache sacred site)","tier":"national","branch":"legislative","status":"pending","lat":33.3097,"lon":-111.0535,"flags":["invasive","destructive","suppressive"],"field":"culture","what":"Oak Flat (Chí'chil Biłdagoteel) is a Western Apache sacred site, protected from mining for decades. A last-minute rider slipped into a must-pass 2014 defense bill ordered the federal government to hand the land to Resolution Copper (owned by Rio Tinto and BHP), whose block-cave mine would collapse the site into a crater nearly two miles wide. The Supreme Court declined in 2025 to hear the Apache religious-freedom challenge; a federal appeals court then halted the transfer pending other lawsuits. The handover is mandated by law but not yet completed — the active edge of the land grab.","read":"Tuck the order into a defense bill no one can vote down, and a sacred site is signed away before anyone notices. The transfer is already law; only the courts, for now, stand between it and the crater.","src":"https://azmirror.com/2025/05/27/supreme-court-refuses-apache-plea-to-save-oak-flat-from-copper-mining-destruction/","srcname":"Arizona Mirror"},{"name":"New Caledonia electoral-roll 'unfreezing'","year":2024,"where":"France — New Caledonia / Kanaky (Nouméa)","tier":"national","branch":"legislative","status":"pending","lat":-22.255,"lon":166.45,"flags":["suppressive"],"field":"rule","what":"New Caledonia's 1998 Nouméa Accord 'froze' the local electoral roll to protect the vote of the indigenous Kanak — already made a minority on their own islands by decades of French settlement. In 2024 France moved to 'unfreeze' it, adding tens of thousands of mostly non-Kanak voters and further diluting Kanak political weight. The bill triggered deadly riots and was suspended, but the push to modify the roll has continued through 2026 over Kanak objections. It is an attempt to lock in settler-majority rule by changing who counts as a voter.","read":"Once the original people have been outnumbered by settlement, the last protection left is who is allowed to vote — so that is what gets changed. The dispossession finishes at the ballot box.","src":"https://www.rnz.co.nz/international/pacific-news/573608/french-constitutional-council-upholds-frozen-electoral-list-in-new-caledonia","srcname":"RNZ Pacific"},{"name":"Ngorongoro relocation & NCA Act amendment (proposed)","year":2024,"where":"Tanzania — Ngorongoro Conservation Area (Maasai land)","tier":"national","branch":"legislative","status":"pending","lat":-3.2,"lon":35.5,"flags":["invasive","suppressive","destructive"],"field":"extraction","what":"Beyond the Loliondo game reserve already imposed, the Tanzanian government is moving to relocate roughly 100,000 Maasai out of the Ngorongoro Conservation Area, where they have held legal residence since the 1950s. Officials have cut services, run a 'voluntary' resettlement sign-up, and in 2024 set up commissions to plan the move — steps the Maasai say are designed to legalize an eviction they reject, including through amendments to the law that governs the area. The relocation is not yet complete; it is an active, looming dispossession.","read":"First strip the services, then offer a 'voluntary' exit, then change the law to make the removal lawful. The eviction is being assembled piece by piece before it is finished.","src":"https://www.aljazeera.com/features/2024/8/5/tanzania-wants-to-evict-maasai-for-wildlife-but-theyre-fighting-back","srcname":"Al Jazeera"},{"name":"Forest (Conservation) Amendment Act","year":2023,"where":"Parliament of India — New Delhi","tier":"national","branch":"legislative","status":"active","lat":28.6139,"lon":77.209,"flags":["invasive","suppressive"],"field":"extraction","what":"In force since December 2023, this amendment to India's 1980 forest law narrows the legal definition of 'forest' and exempts whole categories of projects — defence and infrastructure within 100 km of a border, ecotourism, 'strategic' works — from the forest-clearance process. That clearance was the step that triggered the requirement to obtain the consent of the Gram Sabha (village council) under the 2006 Forest Rights Act. Removing it lets forest land inhabited by Adivasi (India's tribal peoples) be handed to roads, mines and industry without their consent. It is under challenge in the Supreme Court.","read":"Redefine the forest so that millions of hectares no longer legally count as forest, and the consent step simply vanishes. The land is opened for diversion before the people living on it are ever consulted.","src":"https://iprights.org/index.php/en/all-news/diminishing-forest-protection-in-india-indigenous-voices-against-controversial-forest-law-amendment","srcname":"Indigenous Peoples Rights International"},{"name":"Maya Train 'national security' decrees","year":2021,"where":"Mexico — Yucatán Peninsula (Maya territory)","tier":"national","branch":"executive","status":"active","lat":18.5141,"lon":-89.4017,"flags":["invasive","suppressive","destructive"],"field":"extraction","what":"To build the Tren Maya — a 1,500 km tourist railway looping through the Yucatán — Mexico's president issued a 2021 decree declaring the project a matter of 'public interest and national security,' shielding it from the injunctions and environmental reviews that Maya communities and others had won in court. When the Supreme Court struck that decree down in May 2023, a near-identical decree was reissued hours later. The railway was driven across Maya land with a consultation the UN called deeply flawed, displacing over 3,000 households and clearing millions of trees above the region's aquifer.","read":"Label the megaproject 'national security' and the courts can no longer stop it. A decree converts a contested land grab into an untouchable one — and when struck down, it is simply signed again.","src":"https://news.mongabay.com/2023/09/mexico-groups-say-maya-train-construction-has-caused-significant-deforestation/","srcname":"Mongabay"},{"name":"Anti-PIACI bills (PL 3518 & successors)","year":2025,"where":"Peru — Congress / Loreto (peoples in voluntary isolation)","tier":"national","branch":"legislative","status":"pending","lat":-3.7491,"lon":-73.2538,"flags":["destructive","invasive","suppressive"],"field":"extraction","what":"PIACI is the legal protection for Peru's Indigenous peoples living in voluntary isolation or initial contact — roughly 7,500–8,000 people who have little immunity to common diseases and whose reserves bar outsiders and extractive industry. Since 2022 a series of bills (beginning with PL 3518/2022, dubbed the 'genocide bill') have sought to hand control of these reserves to industry-friendly regional governments and to let existing reserves be re-evaluated and dissolved. One was shelved in 2023; successors returned through 2025, alongside officials publicly denying the isolated peoples even exist. Critics call it a slow-motion extermination.","read":"Declare that the uncontacted peoples do not exist, then write a law to dissolve the reserves protecting them. Erasing the protection on paper exposes the most vulnerable people on earth to the diseases and invasions that follow.","src":"https://news.mongabay.com/2025/10/peru-considers-stripping-protections-for-indigenous-people-and-their-territories/","srcname":"Mongabay"},{"name":"Mining on Indigenous lands (PL 191/2020)","year":2020,"where":"National Congress — Brasília, Brazil","tier":"national","branch":"legislative","status":"pending","lat":-15.8,"lon":-47.87,"flags":["invasive","destructive","suppressive"],"field":"extraction","what":"Brazil's Constitution permits mining on Indigenous lands only under a specific law that Congress has never passed. PL 191/2020, introduced under President Bolsonaro and fast-tracked in 2022, would finally authorize commercial mining, oil and gas drilling, and hydroelectric dams inside demarcated Indigenous territories — even over the objections of the peoples who live there. Despite a change of government, the agribusiness-and-mining bloc that controls Congress has kept the proposal and similar 2025 measures alive. If passed it would open the most protected lands in the country to extraction.","read":"The one barrier still standing is that Congress never wrote the law allowing mines on Indigenous land. This bill is the attempt to finally write it — turning the last legally shielded territories into concessions.","src":"https://news.mongabay.com/2025/04/after-outcry-brazil-supreme-court-nixes-proposal-for-mining-on-indigenous-lands/","srcname":"Mongabay"},{"name":"Foreign-agent law & the unregistered land regime","year":2012,"where":"Russian Federation — Moscow","tier":"national","branch":"legislative","status":"active","lat":55.7558,"lon":37.6173,"flags":["suppressive","invasive"],"field":"rule","what":"Russia recognizes about 40 'indigenous small-numbered peoples of the North,' but its law gives them no right of free, prior and informed consent. A 2001 law created 'Territories of Traditional Nature Use' to protect their lands — yet the federal government has never registered a single one, so the 500-plus such territories have no secure legal status and the natural-resources ministry issues oil, gas, mining and logging licences over them. Meanwhile the 2012 'foreign agent' law has been used to brand and shut down the very Indigenous organizations — such as the Centre for Support of Indigenous Peoples of the North — that defended those lands.","read":"Pass a law protecting the land but never enact it, then outlaw the groups who would demand it be enforced. Two engineered silences — one in the land registry, one in civil society — leave the territory open to the drill.","src":"https://www.culturalsurvival.org/news/new-report-highlights-indigenous-rights-violations-russia","srcname":"Cultural Survival"},{"name":"Papua Special Autonomy revision (Law 2/2021)","year":2021,"where":"Indonesia — West Papua (Papuan peoples)","tier":"national","branch":"legislative","status":"active","lat":-2.5337,"lon":140.7181,"flags":["suppressive","invasive"],"field":"rule","what":"Indonesia's 2021 revision of the Papua Special Autonomy Law was passed without the consultation of the Papuan People's Assembly (MRP) that the law itself requires. It abolished Papuans' right to form local political parties and rewrote Article 76 so Jakarta could carve up the territory without the consent of Papuan institutions — which it did in 2022, splitting Papua into new provinces over mass protests. Papuans, made a minority in their own land by decades of state-sponsored transmigration, see it as a tool to recentralize control and open the territory to plantations, mining and military expansion.","read":"Strip the people's assembly of its veto, then redraw the map without asking it. Self-rule is hollowed out so the land can be partitioned, settled, and mined over the objections of those who live on it.","src":"https://humanrightsmonitor.org/news/indonesian-parliament-passes-law-for-the-formation-of-new-provinces-in-west-papua/","srcname":"Human Rights Monitor"},{"name":"'Mine everywhere' minerals executive order","year":2025,"where":"USA — federal executive order (public & ancestral lands)","tier":"national","branch":"executive","status":"active","lat":38.8977,"lon":-77.0365,"flags":["invasive","suppressive","destructive"],"field":"extraction","what":"A March 2025 executive order invokes emergency powers to fast-track mining permits on federal public lands, directs the Interior Department to identify mineral deposits and designate mining as the primary use of those lands, and channels public money into priority projects. Much of that land is the ancestral territory of, or sacred to, Native nations. The administration also rescinded the policy requiring tribes to be notified of mining exploration near their reservations, and used the order to push the Oak Flat transfer forward. It places extraction above every other use, including Indigenous sacred sites.","read":"Declare mining the highest purpose of the land and the sacred places on it become obstacles to be cleared. With tribal notification revoked, the people often learn the drill is coming only once it has arrived.","src":"https://insideclimatenews.org/news/21032025/trump-order-streamlines-mining-permits/","srcname":"Inside Climate News"},{"name":"General Mining Act of 1872","year":1872,"where":"U.S. Congress — Washington, D.C.","tier":"national","branch":"legislative","status":"active","lat":38.8895,"lon":-77.0098,"flags":["invasive","foundational"],"field":"extraction","what":"Passed to settle the West after the Civil War, this law declared that 'all valuable mineral deposits in lands belonging to the United States' are 'free and open to exploration and purchase' — much of that land being Native territory taken by treaty or by force. To this day, anyone can stake a hardrock mining claim on most federal public land, including ancestral and sacred sites, simply by marking it and filing paperwork, and pay no royalty on the gold, copper, uranium or lithium extracted. More than 150 years on it remains the basic law of US hardrock mining and a standing threat to sacred sites like Oak Flat and Thacker Pass.","read":"Declare the public land 'free and open' to whoever stakes it, and the sacred places within it are open too. A frontier statute written to settle the West still hands Native ground to the first miner to plant a claim.","src":"https://en.wikipedia.org/wiki/General_Mining_Act_of_1872","srcname":"General Mining Act of 1872"},{"name":"Coastal GasLink injunction (Wet'suwet'en)","year":2019,"where":"Canada — Wet'suwet'en territory, British Columbia (unceded)","tier":"national","branch":"judicial","status":"active","lat":54.15,"lon":-127.4,"flags":["invasive","suppressive"],"field":"extraction","what":"The Wet'suwet'en hereditary chiefs hold title to 22,000 km² of unceded territory — recognized in the Supreme Court of Canada's 1997 Delgamuukw decision — and refused consent for the Coastal GasLink gas pipeline across it. The company instead secured deals with elected band councils, whose authority under the Indian Act covers only on-reserve matters. A BC Supreme Court injunction (2018, made interlocutory in 2019) was then used to authorize militarized RCMP raids — helicopters, dog units, assault rifles — that arrested more than 70 land defenders, bulldozed structures, and led to criminal-contempt convictions. The pipeline was completed in 2024.","read":"When the people who hold title say no, a court injunction supplies the yes — and the police enforce it. Consent is routed around the hereditary chiefs and through a band council whose authority stops at the reserve line.","src":"https://www.amnesty.org/en/latest/news/2023/03/criminalization-wetsuweten-land-defenders/","srcname":"Amnesty International"},{"name":"Tibet colonial boarding-school & language policy","year":2021,"where":"China — Tibet (Tibetan & other minority peoples)","tier":"national","branch":"executive","status":"active","lat":29.652,"lon":91.1721,"flags":["suppressive","destructive"],"field":"culture","what":"UN experts reported in 2023 that around one million Tibetan children — roughly three of every four Tibetan students — have been placed in a residential boarding-school system designed to assimilate them into majority Han culture. Rural Tibetan schools are closed and replaced by distant boarding schools where instruction is almost entirely in Mandarin (Putonghua) under a 'national common language' policy, with little or no teaching of Tibetan language, religion or tradition, and parents coerced into enrolling their children. The same assimilation logic is applied to Uyghurs and other peoples.","read":"Take the children from their families and teach them only the conqueror's language, and within a generation the people forget how to be themselves. It is the residential-school playbook of the settler colonies, run again at vast scale.","src":"https://www.ohchr.org/en/press-releases/2023/02/china-un-experts-alarmed-separation-1-million-tibetan-children-families-and","srcname":"UN OHCHR"},{"name":"El Estor state of siege (Maya Q'eqchi')","year":2021,"where":"Guatemala — El Estor, Izabal (Maya Q'eqchi' land)","tier":"national","branch":"executive","status":"active","lat":15.56,"lon":-89.349,"flags":["suppressive","invasive","destructive"],"field":"rule","what":"The Fénix nickel mine sits on Maya Q'eqchi' ancestral land near Lake Izabal, its rights first granted after the US-backed 1954 coup with no Indigenous consent. Guatemala's high courts ruled the license illegal and ordered a consultation, but the mine kept operating and the government ran a manipulated process that excluded the legitimate Q'eqchi' Ancestral Council. When the community blockaded the road in 2021, the president declared a 30-day 'state of siege' — martial law suspending the rights to assembly, movement and protest — and security forces raided the homes of leaders and journalists. It is a recurring tool: emergency powers invoked to clear Indigenous resistance for a mine.","read":"When a people stand in the way of the mine, suspend their rights by decree and send in the soldiers. The state of emergency becomes the instrument that turns ancestral land into a worksite.","src":"https://www.culturalsurvival.org/news/guatemalan-president-suspends-civil-rights-facilitate-nickel-mine-demand-battery-minerals","srcname":"Cultural Survival"},{"name":"Thacker Pass / Peehee Mu'huh mine approval","year":2021,"where":"USA — Thacker Pass, Nevada (Paiute-Shoshone sacred & massacre site)","tier":"national","branch":"executive","status":"active","lat":41.71,"lon":-118.05,"flags":["invasive","destructive","suppressive"],"field":"extraction","what":"Peehee Mu'huh ('rotten moon') is sacred to Paiute and Shoshone peoples and the site of an 1865 US Cavalry massacre of dozens of Paiute who were never properly buried. In 2021 the Bureau of Land Management approved the largest lithium mine in the United States there, and federal courts repeatedly upheld the approval, finding the agency's thin consultation legally sufficient. As the tribes' lawyer put it, no law prevents the federal government from issuing permits that destroy Native sacred sites on public land. Construction is underway over the burial ground, marketed as 'green' energy.","read":"A massacre site becomes a lithium pit because 'consultation' was satisfied by a few letters and no law requires consent. The burial ground of the murdered is bulldozed in the name of the clean transition.","src":"https://nevadacurrent.com/2023/12/07/nv-tribes-will-not-appeal-most-recent-lithium-mine-ruling/","srcname":"Nevada Current"},{"name":"Sámi identity control & unratified ILO 169","year":2019,"where":"Finland — Sápmi / Inari (Sámi homeland)","tier":"national","branch":"judicial","status":"active","lat":68.9057,"lon":27.0276,"flags":["suppressive","invasive"],"field":"identity","what":"Finland is the only EU state with a recognized Indigenous people, the Sámi, yet it has never ratified ILO Convention 169 and gives the Sámi no consent veto over logging and land use in their homeland, much of it run by the state forestry agency. For over a decade its Supreme Administrative Court repeatedly overrode the Sámi Parliament's own membership rolls to add people the Sámi did not recognize as Sámi — letting the state, not the people, decide who counts as Sámi. The UN ruled this violated their right to self-determination; a reform Act finally entered force in 2025, but the deeper land and consent questions remain unresolved.","read":"Decide from the outside who is allowed to be Sámi, and the people lose control of their own membership — and with it, their collective voice over the land. Self-determination ends where the state's court redraws the roll.","src":"https://www.saamicouncil.net/news-archive/finland-must-repair-the-human-rights-violations-and-ratify-ilo-169-convention","srcname":"Saami Council"},{"name":"Ayoreo land-titling failure & Chaco clearance licences","year":2001,"where":"Paraguay — Gran Chaco / PNCAT (Ayoreo Totobiegosode, incl. uncontacted)","tier":"national","branch":"executive","status":"active","lat":-20,"lon":-60,"flags":["invasive","destructive","suppressive"],"field":"land","what":"Paraguay's Constitution recognizes Indigenous land rights, but for over 30 years the state has failed to title the Ayoreo Totobiegosode's claimed homeland — even as the environment ministry granted forest-clearance licences to cattle-ranching companies and private land titles were issued overlapping it. The Ayoreo include the only Indigenous people living in voluntary isolation anywhere in the Americas outside the Amazon. Their forest, in the world's fastest-disappearing dry woodland, is bulldozed for beef and leather; a quarter of recent Chaco deforestation fell on their land. The Inter-American human-rights system has ordered protection, ignored.","read":"Leave the Indigenous title unsigned for thirty years while signing ranch titles over the same forest, and the law does its work by omission. The land is cleared out from under an uncontacted people who never agreed to be found.","src":"https://www.survivalinternational.org/peoples/ayoreo","srcname":"Survival International"},{"name":"TIPNIS Law 969 (highway through the reserve)","year":2017,"where":"Bolivia — TIPNIS, Isiboro Sécure (Moxeño, Yuracaré, Tsimané)","tier":"national","branch":"legislative","status":"active","lat":-16,"lon":-65.5,"flags":["invasive","destructive","suppressive"],"field":"extraction","what":"After a 2011 Indigenous march won TIPNIS — a national park and Indigenous territory — protection as an 'intangible zone' barring roads (Law 180), the Bolivian government reversed course. Law 969 of 2017 repealed that protection and authorized a highway through the heart of the territory, opening it to roads, private investment and oil-and-gas concessions. The 'consultation' used to justify it was found by the Catholic Chur
