ch and human-rights observers to be manipulated, not free, prior and informed. The road would split the homeland of the Moxeño, Yuracaré and Tsimané peoples in two and accelerate deforestation.","read":"Win the protection by marching, then watch a single new law repeal it. 'Intangible' lasts exactly as long as the territory holds nothing the state wants to drive a road toward.","src":"https://movementrights.org/international-rights-of-nature-tribunal-presents-judgement-in-tipnis-case-in-bolivia/","srcname":"Movement Rights"},{"name":"Philippine Mining Act of 1995","year":1995,"where":"Philippines — Congress, Manila (ancestral domains nationwide)","tier":"national","branch":"legislative","status":"active","lat":14.5995,"lon":120.9842,"flags":["invasive","suppressive","destructive"],"field":"extraction","what":"Republic Act 7942 opened the Philippines — including the ancestral domains of Indigenous peoples — to large-scale domestic and foreign mining, triggering a rush of permit applications over Indigenous land; up to 60% of ancestral domains have been covered by mining claims. The 1997 Indigenous Peoples' Rights Act later required free, prior and informed consent, but the Mining Act frequently overrides it and the consent process is routinely manipulated. Projects such as Didipio and Tampakan brought displacement, militarization and the killing of Indigenous defenders — the 'green' mineral rush now deepening the pattern.","read":"Throw the whole country 'free and open' to mining first, and the consent law that comes after is reduced to a form to be managed. The signature of the people becomes a box the company learns to tick.","src":"https://globalwitness.org/en/campaigns/land-and-environmental-defenders/how-the-militarisation-of-mining-threatens-indigenous-defenders-in-the-philippines/","srcname":"Global Witness"},{"name":"Kahuzi-Biega Park & fortress conservation","year":1970,"where":"DR Congo — Kahuzi-Biega National Park (Batwa ancestral land)","tier":"national","branch":"executive","status":"active","lat":-2.31,"lon":28.75,"flags":["invasive","destructive","suppressive"],"field":"extraction","what":"When the Democratic Republic of Congo created the Kahuzi-Biega National Park on Batwa ancestral forest in the 1970s, it expelled some 6,000 Batwa without their consent, compensation, or alternative land — the 'fortress conservation' model that treats nature as something protected by removing its original people. When Batwa returned in 2018, park ecoguards and soldiers ran a campaign of killings, rape and village-burning. In 2024 the African Commission ruled the eviction violated their rights and ordered the land returned, but the park and the exclusion still stand.","read":"Protect the forest by throwing out the people who kept it a forest, and call the eviction conservation. The park's boundary becomes the line the original inhabitants are shot for crossing back over.","src":"https://minorityrights.org/batwa-ruling/","srcname":"Minority Rights Group"},{"name":"Decree 1083/2024 (end of the Indigenous land-survey emergency)","year":2024,"where":"Argentina — Patagonia (Mapuche & other Indigenous peoples)","tier":"national","branch":"executive","status":"active","lat":-38.9516,"lon":-68.0591,"flags":["invasive","suppressive","destructive"],"field":"land","what":"Argentina's 2006 Indigenous Territorial Emergency Law (26.160) had suspended evictions of Indigenous communities while the state surveyed their lands — a survey never completed. In December 2024 President Milei's Decree of Necessity and Urgency 1083/2024 repealed the extension of that law, lifting the eviction freeze nationwide, and his government dissolved the National Registry of Indigenous Communities that granted them legal personhood. Evictions followed in Patagonia (Lof Paillako, Lof Quemquemtrew), as the territory is opened to mining and the Vaca Muerta oil frontier under a new large-investment regime.","read":"Remove the one decree that suspended the evictions, dissolve the registry that proves the communities exist, and the dispossession needs no new violence — just the absence of the protection that used to slow it.","src":"https://www.culturalsurvival.org/news/milei-repeals-argentinas-indigenous-territorial-emergency-law","srcname":"Cultural Survival"},{"name":"Bosawás concessions & the unfinished 'saneamiento'","year":2021,"where":"Nicaragua — RACCN / Bosawás (Miskito & Mayangna)","tier":"national","branch":"executive","status":"active","lat":14,"lon":-84.5,"flags":["invasive","destructive","suppressive"],"field":"land","what":"Nicaragua's Law 445 titled the Miskito and Mayangna collective territories of the Caribbean coast and required 'saneamiento' — clearing out non-Indigenous settlers. The state never completed that final step. Instead it granted gold-mining concessions over most of the Bosawás Biosphere Reserve and roughly a fifth of the country, while armed mestizo 'colonos' invaded — burning homes, killing and kidnapping community members, with dozens of Indigenous people killed since 2020 — under the acquiescence of police who instead jail Indigenous forest-rangers. Inter-American precautionary measures have been ignored.","read":"Title the land, then refuse the one step — clearing the invaders — that would make the title real, and grant the mining concessions on top. The deed becomes a document the settlers and the state can both safely ignore.","src":"https://news.mongabay.com/2024/07/activists-ask-for-help-combatting-violence-against-nicaraguas-indigenous-communities/","srcname":"Mongabay"},{"name":"1994 Forestry & Wildlife Law & the Lobéké–Nki–Boumba Bek parks","year":1994,"where":"Cameroon — Lobéké, Nki & Boumba Bek parks (Baka)","tier":"national","branch":"legislative","status":"active","lat":2.3,"lon":15.6,"flags":["invasive","suppressive","destructive"],"field":"extraction","what":"Cameroon's 1994 Forestry and Wildlife Law let the state classify southeast rainforest into protected categories, and on that basis it gazetted the Lobéké, Nki and Boumba Bek national parks — plus surrounding trophy-hunting and logging concessions — over the ancestral forest of the Baka hunter-gatherers, largely without their consent. The Baka were barred from hunting, gathering and sacred sites in their own forest and subjected to beatings, torture and expulsion by WWF-funded ecoguards — what they call 'the war' — while the industrial logging that is the real threat continued around them.","read":"Draw the park boundary around the forest that fed a people, hand the wildlife to trophy hunters and the timber to loggers, and the hunter-gatherers become poachers on their own land — beaten for entering the home that was classified out from under them.","src":"https://www.survivalinternational.org/campaigns/green-genocide","srcname":"Survival International"},{"name":"Block 43-ITT 'national interest' declaration","year":2013,"where":"Ecuador — Yasuní / Block 43-ITT (Waorani, Tagaeri-Taromenane in isolation)","tier":"national","branch":"legislative","status":"active","lat":-0.9,"lon":-75.6,"flags":["invasive","destructive","suppressive"],"field":"extraction","what":"When the plan to leave Yasuní's oil in the ground collapsed in 2013, Ecuador's National Assembly declared drilling in Block 43-ITT — inside the national park — to be in the 'national interest,' the constitutional prerequisite for extraction there, and the government redrew official maps to erase the presence of the isolated Tagaeri and Taromenane, whose territories the Constitution bars from any extraction. Drilling began in 2016, bringing spills, roads and forest loss. A 2023 binding referendum and a 2025 Inter-American Court ruling ordered the wells shut; years on, only a handful of 247 wells have closed and the oil still flows.","read":"Declare the drilling a national interest and quietly delete the uncontacted families from the map, and a constitution that forbids extraction on their land no longer applies — because, on paper, they are no longer there.","src":"https://insideclimatenews.org/news/30082023/ecuador-votes-oil-ban-on-indigenous-land/","srcname":"Inside Climate News"},{"name":"Decree 2,248 — Orinoco Mining Arc","year":2016,"where":"Venezuela — Orinoco Mining Arc (Pemón, Ye'kwana, Yanomami & others)","tier":"national","branch":"executive","status":"active","lat":6,"lon":-62,"flags":["invasive","destructive","suppressive"],"field":"extraction","what":"In February 2016 President Maduro's Decree 2,248 created the 'Orinoco Mining Arc National Strategic Development Zone,' opening some 112,000 km² — about 12% of Venezuela, south of the Orinoco — to mining for gold, coltan, diamonds and bauxite. The zone blankets protected forests and the ancestral territories of the Pemón, Ye'kwana, Yanomami, Kari'ña, Warao and others, who were never consulted, in breach of ILO Convention 169. What followed was mercury poisoning, deforestation, armed-gang and military control of the mines, massacres, and the coercion of Indigenous people — many of them children — into the pits.","read":"Draw one decree across a tenth of the country and the forest south of the Orinoco becomes a 'strategic development zone' — the peoples living in it simply absent from the document that hands their rivers to the gold mafias.","src":"https://www.icj.org/venezuela-indigenous-peoples-face-deteriorating-human-rights-situation-due-to-mining-violence-and-covid-19-pandemic/","srcname":"ICJ"},{"name":"Lower Omo villagization & the Kuraz sugar scheme","year":2011,"where":"Ethiopia — Lower Omo Valley (Mursi, Bodi, Kwegu, Suri & others)","tier":"national","branch":"executive","status":"active","lat":5.5,"lon":36,"flags":["invasive","destructive","suppressive"],"field":"extraction","what":"To feed the Gibe III dam and the state-run Kuraz sugar plantations, Ethiopia enclosed much of the Lower Omo Valley and moved to relocate roughly 150,000–200,000 Indigenous agro-pastoralists — the Mursi, Bodi, Kwegu, Suri, Nyangatom and others — into permanent 'villagization' settlements, with no genuine consultation. The dam ended the river's annual floods that their farming and herds depend on; soldiers enforcing the scheme have been reported beating, raping and jailing those who resisted, and the promised compensation and services largely never came. Hunger followed.","read":"Dam the river, lease the floodplain to a sugar plantation, and call the forced move into fixed villages 'development' — the people who lived by the flood are resettled into dependence on the aid that rarely arrives.","src":"https://www.hrw.org/news/2014/02/18/ethiopia-land-water-grabs-devastate-communities","srcname":"Human Rights Watch"},{"name":"Garífuna coastal land sales & the ZEDE enclaves","year":2015,"where":"Honduras — Caribbean coast & Roatán (Garífuna)","tier":"national","branch":"executive","status":"active","lat":15.767,"lon":-86.791,"flags":["invasive","suppressive","destructive"],"field":"land","what":"Along Honduras's Caribbean coast, the state has let the communal land of the Afro-Indigenous Garífuna be titled and sold to tourism, palm-oil and real-estate investors — and created investor-governed 'special economic zones' (ZEDEs) such as Próspera on Roatán — all without the communities' free, prior and informed consent. The Inter-American Court ordered land restored to Triunfo de la Cruz and Punta Piedra in 2015 (and San Juan in 2023), but a decade on the state has not complied, while Garífuna leaders are criminalized, threatened, disappeared and killed.","read":"Let the coastline be titled and sold out from under a people who live by the beach and the sea, ignore the binding order to give it back, and the dispossession is finished before any court can enforce a word of its ruling.","src":"https://news.mongabay.com/2024/07/garifuna-land-rights-abuses-persist-in-honduras-despite-court-ruling/","srcname":"Mongabay"},{"name":"Economic Land Concessions over Indigenous uplands","year":2005,"where":"Cambodia — Mondulkiri (Bunong & other Indigenous peoples)","tier":"national","branch":"legislative","status":"active","lat":12.5,"lon":107.2,"flags":["invasive","destructive","suppressive"],"field":"extraction","what":"Cambodia's Economic Land Concession regime lets the state lease vast tracts — treated as state property — to private agro-industrial companies for up to 70–90 years. In the Indigenous uplands of Mondulkiri, ELCs cover roughly a sixth of the province; the 2008 concession to the French firm Socfin-KCD turned about 7,000 hectares of Bunong forest, sacred sites and burial grounds into a rubber plantation, displacing hundreds of families without consultation. Indigenous communal title exists on paper but is slow and routinely overridden, leaving the Bunong confined to the leftovers between plantations and protected areas — and arrested for farming their own land.","read":"Declare the ancestral forest 'state land,' then lease it for ninety years to a rubber company, and a people who never bought or sold ground are left squatting on the scraps between the concession and the park.","src":"https://www.mekongeye.com/2022/10/17/indigenous-cambodians-land","srcname":"Mekong Eye"},{"name":"U.S. Indian treaty system (1778–1871)","year":1778,"where":"United States — treaties with Native nations (1778–1871)","tier":"national","branch":"executive","status":"active","lat":38.8899,"lon":-77.0091,"flags":["foundational","invasive","suppressive"],"field":"land","what":"Between 1778 and 1871 the United States made some 374 ratified treaties with Native nations — the legal machinery through which it acquired most of the continent. Negotiated as if between sovereigns but routinely signed under pressure, fraud or after military defeat, the treaties ceded vast territories, confined nations to reservations, and traded land for promises — annuities, services, protected hunting grounds — that were often broken. In 1871 Congress unilaterally ended treaty-making, and the Supreme Court later held (Lone Wolf, 1903) that Congress could abrogate these treaties at will. Yet their words remain live federal law: present-day fishing, water and land rights still turn on them.","read":"Sign as nations, then rule that one side may rewrite or ignore the bargain whenever it wishes — the treaty becomes both the deed that took the land and the receipt the takers keep for the parts they mean to honor.","src":"https://www.archives.gov/research/native-americans/treaties","srcname":"U.S. National Archives"},{"name":"Aboriginal Peoples Act 1954","year":1954,"where":"Malaysia — Parliament, Kuala Lumpur (Orang Asli, Peninsular Malaysia)","tier":"national","branch":"legislative","status":"active","lat":3.1499,"lon":101.6841,"flags":["suppressive","invasive"],"field":"identity","what":"The only Malaysian law written specifically for the Orang Asli, the original peoples of the Peninsula, casts them as wards rather than owners. The state may declare — and at any time revoke — 'aboriginal areas' and 'reserves,' and may order an Orang Asli community to leave and stay out of an area; at best the law leaves them as 'tenants-at-will' on state land, with no secure title. On revocation the state need not provide alternative land and owes compensation only for crops and fruit trees, not the ground itself. Because land is a state matter, even court wins recognizing customary rights have not displaced the state's power to revoke — leaving Orang Asli, in effect, squatters on their own ancestral land.","read":"Write the one law meant to name a people's land, then define their tenure as something the state may cancel at will — recognition becomes a licence to remain, revocable the moment the ground is wanted for something else.","src":"https://foe-malaysia.org/articles/indigenous-customary-land-rights-and-the-modern-legal-system-5/","srcname":"Sahabat Alam Malaysia"},{"name":"Mabo v Queensland (No 2)","kind":"Case law","year":1992,"where":"High Court of Australia — Canberra","tier":"national","branch":"judicial","status":"active","lat":-35.2809,"lon":149.13,"flags":["suppressive","foundational"],"field":"land","edge":"Recognised native title and rejected terra nullius — this map shows its other edge.","what":"Mabo is rightly celebrated for rejecting terra nullius and recognising that a 'native title' survived British settlement. Its limiting edge, shown here, is just as load-bearing: the same judgment confirmed that the Crown acquired 'radical title' and full sovereignty at settlement, held that native title is a fragile, inalienable interest that any valid inconsistent government grant can extinguish — at the time without compensation — and required claimants to prove a continuous connection to country under traditional law. Every later Australian claim runs through these limits.","read":"Concede that the land was never empty, then define the recognition so narrowly — extinguishable, unsellable, conditional on unbroken proof — that the Crown's title is confirmed in the very act of admitting the people were always there.","src":"https://en.wikipedia.org/wiki/Mabo_v_Queensland_(No_2)","srcname":"Wikipedia"},{"name":"Wik Peoples v Queensland","kind":"Case law","year":1996,"where":"High Court of Australia — Canberra","tier":"national","branch":"judicial","status":"active","lat":-35.298,"lon":149.129,"flags":["suppressive","invasive"],"field":"land","edge":"Held native title can survive on pastoral leases — but on subordinate terms, and it triggered a legislative wind-back.","what":"Wik is remembered for holding that native title can coexist with pastoral leases rather than being wiped out by them. Its limiting edge, shown here: where the two conflict, the pastoralist's rights prevail, and native title yields 'to the extent of the inconsistency.' The decision also provoked the Howard government's '10-Point Plan' and the Native Title Amendment Act 1998, which curtailed the right to negotiate and validated past extinguishing acts — using the ruling as the occasion to roll native title back.","read":"Permit the two to share the land, then rank the grazier above the original owner wherever they disagree — and watch the recognition become the trigger for the law that narrows it.","src":"https://en.wikipedia.org/wiki/Wik_Peoples_v_Queensland","srcname":"Wikipedia"},{"name":"Delgamuukw v British Columbia","kind":"Case law","year":1997,"where":"Supreme Court of Canada — Ottawa","tier":"national","branch":"judicial","status":"active","lat":45.4215,"lon":-75.699,"flags":["suppressive","foundational"],"field":"land","edge":"Affirmed Aboriginal title and oral history — but built the test by which the Crown may override it.","what":"Delgamuukw gave Canada its first full account of Aboriginal title and admitted Indigenous oral history as evidence. The limiting edge, shown here: it confirmed that the Crown's underlying title rests on the bare 'assertion of sovereignty' (the Discovery doctrine), and it set out a justification test under which government may infringe Aboriginal title for a sweeping list of objectives — 'agriculture, forestry, mining, hydroelectric power,' general economic development, infrastructure, and even 'the settlement of foreign populations.' Title is recognised, then made overridable for almost any development purpose.","read":"Name the title real and let the people speak their own history into the record — then list the reasons the Crown may override it so broadly that almost any project qualifies.","src":"https://www.firstpeopleslaw.com/public-education/indigenous-rights-in-one-minute/why-is-the-delgamuukw-decision-important","srcname":"First Peoples Law"},{"name":"Tsilhqot'in Nation v British Columbia","kind":"Case law","year":2014,"where":"Supreme Court of Canada — Ottawa","tier":"national","branch":"judicial","status":"active","lat":45.418,"lon":-75.7,"flags":["suppressive","foundational"],"field":"land","edge":"Granted the first declaration of Aboriginal title — while reaffirming the Crown's power to infringe it.","what":"Tsilhqot'in was historic: the first court declaration of Aboriginal title to a defined territory in Canada. The limiting edge, shown here: the same ruling reaffirmed that the Crown can still infringe that title where it shows a 'compelling and substantial public purpose' and acts consistently with its fiduciary duty, that provincial laws still apply on title land, and that title carries an 'inherent limit' barring uses said to deprive future generations. The strongest recognition yet — handed down with the override built in.","read":"Grant the title at last, then keep the key: a 'compelling public purpose' the government itself defines, and the recognised owners can still be lawfully overruled on their own ground.","src":"https://www.bennettjones.com/Insights/Updates/Implications-of-the-Supreme-Court-Decision-on-Aboriginal-Title","srcname":"Bennett Jones"},{"name":"League of Nations mandate system (Art. 22)","kind":"Treaty","year":1919,"where":"League of Nations — Geneva","tier":"international","branch":"executive","status":"active","lat":46.2227,"lon":6.1378,"flags":["foundational","invasive","suppressive"],"field":"rule","what":"Article 22 of the League Covenant placed the former colonies of the defeated empires under the 'tutelage' of the victorious powers, to be governed as a 'sacred trust of civilisation' over peoples deemed 'not yet able to stand by themselves.' It dressed continued colonial rule in the language of trusteeship — internationalising possession rather than ending it — and its categories carried straight into the UN Trusteeship system. Several of the world's longest territorial disputes (Palestine, Namibia and others) trace directly to mandate lines.","read":"Rename conquest 'a sacred trust' and hand the conquered back to the conquerors as wards — colonial title is not dissolved but issued a certificate of good intentions and passed forward.","src":"https://www.ungeneva.org/en/about/league-of-nations/covenant","srcname":"UN Geneva"},{"name":"UN Trusteeship system (Charter Ch. XII–XIII)","kind":"Treaty","year":1945,"where":"United Nations — San Francisco / New York","tier":"international","branch":"executive","status":"active","lat":40.7489,"lon":-73.968,"flags":["foundational","suppressive"],"field":"rule","what":"Chapters XII–XIII of the UN Charter carried the League's mandate territories into the postwar order as 'trust territories,' administered by the same powers under international supervision toward an eventual, indefinitely deferred self-government. It preserved the premise that whole peoples were wards to be administered, and the related Chapter XI on 'non-self-governing territories' set the frame for a decolonisation the administering states largely controlled. The Trusteeship Council only suspended operations in 1994.","read":"Inherit the wards of the old order and keep administering them under a kinder name — self-rule promised as a destination kept always one supervised step away.","src":"https://www.un.org/en/about-us/trusteeship-council","srcname":"United Nations"},{"name":"Statute on the Inorodtsy (Siberian natives)","kind":"Statute","year":1822,"where":"Russian Empire — Siberia (Irkutsk)","tier":"national","branch":"legislative","status":"active","lat":52.287,"lon":104.305,"flags":["foundational","suppressive","invasive"],"field":"identity","edge":"Framed partly as protecting native lands — but it was the instrument that classified and incorporated them.","what":"Mikhail Speransky's 1822 Statute created the legal category 'inorodtsy' ('aliens') for the indigenous peoples of Siberia, sorting them into settled, nomadic and wandering classes and codifying the 'yasak' fur tribute they owed the Crown. Presented partly as shielding native hunting and grazing grounds from settlers, it was also the foundational act by which the empire defined, taxed and absorbed Siberia's native peoples — a classification-and-tribute template the Soviet 'small-numbered peoples of the North' framework later inherited.","read":"Sort the native peoples into legal boxes and fix the tribute they owe, and incorporation arrives wearing the face of protection — the catalogue itself becomes the claim.","src":"https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/inorodtsy","srcname":"Encyclopedia.com"},{"name":"Transmigration regime","kind":"Statute","year":1972,"where":"Indonesia — West Papua & the Outer Islands","tier":"national","branch":"legislative","status":"active","lat":-2.5337,"lon":140.7181,"flags":["invasive","suppressive","destructive"],"field":"land","what":"Begun under Dutch rule and vastly expanded under Suharto, Indonesia's state transmigration programme — backed by transmigration laws and five-year plans — has moved millions of settlers from crowded Java, Bali and Madura into the Outer Islands, including West Papua. There, Papuans went from a clear majority to being outnumbered within decades, their land cleared for settlers and plantations and their self-determination claims diluted; independence advocates call it a slow-motion erasure. Formally paused for Papua in 2015, the existing settlements are maintained and the model persists elsewhere.","read":"Move the settlers in by the million and the demographic arithmetic does the conquest quietly — a homeland becomes a minority's territory without a single border being redrawn.","src":"https://en.wikipedia.org/wiki/Transmigration_program","srcname":"Wikipedia"},{"name":"Hokkaido Former Aborigines Protection Act","kind":"Statute","year":1899,"where":"Empire of Japan — Hokkaido (Sapporo)","tier":"national","branch":"legislative","status":"active","lat":43.0642,"lon":141.3469,"flags":["invasive","suppressive","destructive","foundational"],"field":"culture","what":"Enacted by the Imperial Diet in 1899, this law cast the Ainu of Hokkaido as 'former aborigines' to be assimilated. Under the banner of 'protection' it allotted Ainu families small, often poor farm plots (with the governor keeping control of the land), pushed them from hunting and fishing into Japanese-style farming, forced Japanese-language schooling, and banned the Ainu language and religion — opening the rest of Hokkaido to settlers. It stood for nearly a century until 1997; the laws that replaced it recognise Ainu culture but still grant no return of land.","read":"Title the law 'protection,' then use it to parcel out the poor plots, ban the language, and open the homeland to settlers — the word on the statute is the alibi for what it does.","src":"https://www.culturalsurvival.org/publications/cultural-survival-quarterly/ainu-beyond-politics-cultural-coexistence","srcname":"Cultural Survival"},{"name":"Regional Ethnic Autonomy Law","kind":"Statute","year":1984,"where":"China — National People's Congress, Beijing","tier":"national","branch":"legislative","status":"active","lat":39.9067,"lon":116.3915,"flags":["suppressive","invasive","foundational"],"field":"rule","what":"China's 1984 Regional Ethnic Autonomy Law frames 'autonomy' for the minority regions — Tibet, Xinjiang, Inner Mongolia, Ningxia and Guangxi, about 64% of the country's land — as self-rule exercised 'under the unified leadership' of the state. In practice every autonomous organ sits beneath a Communist Party committee that keeps security and personnel decisions in central, largely Han hands, while Han in-migration reshapes the populations. A 2024 'ethnic unity' law has pushed the system further from autonomy toward outright assimilation.","read":"Write 'autonomy' into the title and then place every autonomous organ under a Party committee above it — self-rule granted in one clause and retrieved in the next.","src":"https://www.cecc.gov/resources/legal-provisions/regional-ethnic-autonomy-law-of-the-peoples-republic-of-china-amended","srcname":"CECC"}],"FLAGMETA":{"invasive":{"color":"#e8a13a","label":"Invasive"},"destructive":{"color":"#d6453d","label":"Eliminatory"},"suppressive":{"color":"#8a6fd1","label":"Suppressive"},"foundational":{"color":"#5ccde8","label":"Foundational"}},"FIELDMETA":{"land":{"color":"#f5b84f","label":"Land & territory"},"rule":{"color":"#5fc6d8","label":"Self-rule & jurisdiction"},"extraction":{"color":"#e8794a","label":"Resources & extraction"},"culture":{"color":"#b388ef","label":"Culture, language & belief"},"identity":{"color":"#c7d36a","label":"Identity & status"}},"FIELDLETTER":{"land":"L","rule":"S","extraction":"E","culture":"C","identity":"I"},"BRANCHMETA":{"legislative":{"color":"#5bb56b","label":"Legislative"},"executive":{"color":"#4f93c4","label":"Executive"},"judicial":{"color":"#db5340","label":"Judicial"}},"CATMETA":{"lawcourt":{"color":"#d6604d","label":"Lawmakers & Courts","desc":"The institutions that issue and uphold the instruments"},"benefit":{"color":"#e0a13a","label":"Beneficiaries & Financial Ties","desc":"Who profits from the land taken, and who finances them"},"lobby":{"color":"#c2185b","label":"Lobbies & Pressure Groups","desc":"Who pushes the laws through and rolls protections back"},"ownership":{"color":"#16a085","label":"Ownership & Title","desc":"Who legally holds the taken land and resources now"},"orbit":{"color":"#7c6cf0","label":"The Orbit","desc":"The doctrines, financiers and bodies that legitimize it"}},"ACTMETA":{"high":{"color":"#5bb56b","label":"Active today"},"force":{"color":"#e0a13a","label":"Still in force"},"dormant":{"color":"#8a96a6","label":"Dormant legacy"}},"ACTORS":[{"id":"usSCOTUS","name":"U.S. Supreme Court","cat":"lawcourt","field":"rule","role":"Apex court · United States","lat":38.8906,"lon":-77.0044,"hq":"Washington, D.C.","inst":["Johnson v. M'Intosh","Lone Wolf v. Hitchcock","Tee-Hit-Ton","Oliphant","City of Sherrill","Oklahoma v. Castro-Huerta","United States v. Sioux Nation"],"ties":["usCongress","doi","vatican"],"src":"https://www.supremecourt.gov/","srcname":"U.S. Supreme Court","desc":"The nine-justice apex of the U.S. federal judiciary, whose word on Native nations binds every lower court. Its foundational anti-sovereignty doctrine came from Chief Justice John Marshall's bench in the 1820s–30s; the modern court has carried it forward, with Justice Brett Kavanaugh writing the 2022 majority that widened state power over tribal land and Justice Neil Gorsuch its sharpest dissenter.","act":"high","today":"still the final word; the discovery doctrine it set in 1823 has never been overruled.","unit":"The full bench — doctrine seeded by the Marshall Court (1823–35) · Most responsible: Chief Justice John Roberts (today)"},{"id":"usCongress","name":"U.S. Congress","cat":"lawcourt","field":"land","role":"Legislature · United States","lat":38.8899,"lon":-77.0091,"hq":"Washington, D.C.","inst":["Indian Appropriations Act 1871","Major Crimes Act","Dawes / General Allotment Act","Public Law 280","General Mining Act of 1872","U.S. Indian treaty system"],"ties":["usSCOTUS","doi","usMiningOil"],"src":"https://www.congress.gov/","srcname":"U.S. Congress","desc":"The federal legislature, which holds constitutional 'plenary power' over Indian affairs and exercises it mainly through the House Natural Resources Committee (Subcommittee on Indian and Insular Affairs) and the Senate Committee on Indian Affairs. Its historic architects include Senator Henry Dawes; it remains the body that can alter tribal land and jurisdiction by statute at will.","act":"high","today":"still legislates Indian affairs; the 1871, 1887 and 1872 acts remain in force.","unit":"House Natural Resources Cmte (Indian & Insular Affairs) · Senate Cmte on Indian Affairs · Most responsible: historically Sen. Henry Dawes, author of the 1887 General Allotment (Dawes) Act"},{"id":"doi","name":"U.S. Dept. of the Interior / BLM","cat":"lawcourt","field":"extraction","role":"Executive · United States","lat":38.8949,"lon":-77.0426,"hq":"Washington, D.C.","inst":["'Mine everywhere' minerals executive order","Thacker Pass","Oak Flat / Resolution Copper"],"ties":["usPublicLands","rio_bhp","lithiumAmericas"],"src":"https://www.doi.gov/","srcname":"U.S. Dept. of the Interior","desc":"The cabinet department managing federal land and the trust relationship with tribes, acting through the Bureau of Land Management (minerals, grazing, leasing), the Bureau of Indian Affairs and the Office of the Solicitor. It is the executive gatekeeper that approves or blocks mines and land transfers; Senators John McCain and Jeff Flake forced its hand on Oak Flat through a 2015 legislative rider.","act":"high","today":"currently advancing the Oak Flat and Thacker Pass projects.","unit":"Bureau of Land Management; Bureau of Indian Affairs; Office of the Solicitor · Most responsible: Secretary Doug Burgum (2025– )"},{"id":"hcAustralia","name":"High Court of Australia","cat":"lawcourt","field":"land","role":"Apex court · Australia","lat":-35.2999,"lon":149.1347,"hq":"Canberra","inst":["Terra nullius (Crown title, 1788)","Mabo v Queensland (No 2)","Wik Peoples v Queensland"],"ties":["auParliament","crownLand"],"src":"https://www.hcourt.gov.au/","srcname":"High Court of Australia","desc":"Australia's highest court, sitting as a Full Court of seven justices whose native-title doctrine binds every court below it. It was the venue where Eddie Koiki Mabo's case ended the fiction of terra nullius in 1992 — though the same bench then defined the resulting 'native title' as a weak, extinguishable interest beneath the Crown's.","act":"force","today":"the Mabo and Wik doctrine governs every native-title claim heard today.","unit":"The Full Court of the High Court · Most responsible: Chief Justice Stephen Gageler (today)"},{"id":"auParliament","name":"Parliament of Australia","cat":"lawcourt","field":"land","role":"Legislature · Australia","lat":-35.3081,"lon":149.1245,"hq":"Canberra","inst":["Native Title Act 1993","Northern Territory Emergency Response"],"ties":["hcAustralia","nff","minCouncilAu"],"src":"https://www.aph.gov.au/","srcname":"Parliament of Australia","desc":"The federal legislature that sets Indigenous land tions and Northern Affairs Canada and Indigenous Services Canada — successors to the old Department of Indian Affairs. These bodies still run the reserve system and define legal 'Indian status'; the Crown also operated the residential schools for which Pope Francis apologized in 2022.","act":"force","today":"the 1876 Indian Act is still law in 2026, amended but never repealed.","unit":"Crown–Indigenous Relations & Northern Affairs (the former Dept. of Indian Affairs) · Most responsible: King Charles III as the Crown; govt today under PM Mark Carney & Crown–Indigenous Relations Minister Rebecca Alty"},{"id":"brSTF","name":"Supremo Tribunal Federal","cat":"lawcourt","field":"land","role":"Apex court · Brazil","lat":-15.802,"lon":-47.8615,"hq":"Brasília","inst":["Marco Temporal land cutoff"],"ties":["brCongress"],"src":"https://portal.stf.jus.br/","srcname":"Supremo Tribunal Federal","desc":"Brazil's Supreme Federal Tribunal, whose eleven justices sit as the Tribunal Pleno on constitutional questions. It is the main judicial check on the land agenda — it struck down the agribusiness-backed marco temporal cutoff in 2023 — but its rulings have been met with open legislative defiance.","act":"high","today":"actively litigating the marco temporal since its 2023 ruling.","unit":"The Tribunal Pleno (full court) · Most responsible: marco temporal rapporteur Justice Edson Fachin"},{"id":"brCongress","name":"National Congress of Brazil","cat":"lawcourt","field":"land","role":"Legislature · Brazil","lat":-15.7997,"lon":-47.8645,"hq":"Brasília","inst":["Marco Temporal land cutoff","PEC 48/2023","Mining on Indigenous lands (PL 191/2020)"],"ties":["brSTF","bancada","jbs"],"src":"https://www.congressonacional.leg.br/","srcname":"Congresso Nacional","desc":"Brazil's National Congress, dominated by the ruralist bloc and its Chamber of Deputies agriculture committee (CAPADR). Led on these issues by figures such as Senator Tereza Cristina, it overrode both the Supreme Court and President Lula to write the marco temporal cutoff into law and keeps advancing bills to open Indigenous land to mining and dams.","act":"high","today":"still advancing anti-demarcation and pro-mining bills.","unit":"Chamber of Deputies — Agriculture, Livestock & Supply Cmte (CAPADR) · Most responsible: the FPA ruralist caucus behind Lei 14.701/2023 (the marco temporal law)"},{"id":"nzCrown","name":"NZ Crown & Parliament","cat":"lawcourt","field":"land","role":"Crown & legislature · Aotearoa NZ","lat":-41.2785,"lon":174.7762,"hq":"Wellington","inst":["Treaty of Waitangi","Native Lands Act 1865"],"ties":["crownLand"],"src":"https://www.parliament.nz/","srcname":"NZ Parliament","desc":"The New Zealand Crown, dealing with Māori land and Treaty claims through the Māori Land Court and the Office for Māori Crown Relations (Te Arawhiti). Its authority traces to the 1840 Treaty of Waitangi signed under Governor William Hobson; the Native Land Court machinery it created converted collective land into saleable individual title.","act":"force","today":"Treaty settlements and debate over its principles are live politics now.","unit":"The Māori Land Court · Office for Māori Crown Relations (Te Arawhiti) · Most responsible: King Charles III as the Crown; govt today under PM Christopher Luxon"},{"id":"inParliament","name":"Parliament of India","cat":"lawcourt","field":"extraction","role":"Legislature · India","lat":28.6172,"lon":77.2082,"hq":"New Delhi","inst":["Indian Forest Act 1927","Forest (Conservation) Amendment Act 2023"],"ties":[],"src":"https://sansad.in/","srcname":"Parliament of India","desc":"India's Parliament and the executive it empowers, acting through the Ministry of Environment, Forest and Climate Change and the state Forest Departments. Under Prime Minister Narendra Modi and Environment Minister Bhupender Yadav it has kept and widened state control of forests over the Adivasi communities who live in them.","act":"high","today":"amended the forest law as recently as 2023.","unit":"Ministry of Environment, Forest & Climate Change; the Forest Dept. · Most responsible: PM Narendra Modi & Environment Minister Bhupender Yadav"},{"id":"idGov","name":"Government of Indonesia","cat":"lawcourt","field":"land","role":"Executive & legislature · Indonesia","lat":-6.17,"lon":106.827,"hq":"Jakarta","inst":["Basic Agrarian Law 1960","Transmigration regime","Papua Special Autonomy revision"],"ties":["wilmar"],"src":"https://www.indonesia.go.id/","srcname":"Government of Indonesia","desc":"The Indonesian state, which treats customary (adat) land as state domain through the Ministry of Agrarian Affairs and its National Land Agency (BPN), and moves settlers through its transmigration ministry. The pattern was set under Suharto's New Order and continues across West Papua today.","act":"high","today":"transmigration and plantation expansion into Papua continue.","unit":"Ministry of Agrarian Affairs / National Land Agency (BPN); the transmigration ministry · Most responsible: President Prabowo Subianto (today); land regime rooted in the Suharto era"},{"id":"rio_bhp","name":"Rio Tinto & BHP — Resolution Copper","cat":"benefit","field":"extraction","role":"Mining majors","lat":51.5074,"lon":-0.1278,"hq":"London / Melbourne","inst":["Oak Flat / Resolution Copper"],"ties":["doi"],"src":"https://en.wikipedia.org/wiki/Resolution_Copper","srcname":"Wikipedia","desc":"The Anglo-Australian mining majors Rio Tinto and BHP, operating through their jointly owned Resolution Copper Company. Rio Tinto's disregard for Indigenous heritage was laid bare when it dynamited the 46,000-year-old Juukan Gorge rock shelters in 2020, costing chief executive Jean-Sébastien Jacques his job; the same partnership is pursuing the Oak Flat copper mine.","act":"high","today":"Resolution Copper is pursuing Oak Flat through the courts in 2026.","unit":"Resolution Copper Company (the Rio Tinto–BHP joint venture) · Most responsible: the 2020 Juukan Gorge blast came under then-Rio Tinto CEO Jean-Sébastien Jacques"},{"id":"lithiumAmericas","name":"Lithium Americas","cat":"benefit","field":"extraction","role":"Lithium developer","lat":49.2827,"lon":-123.1207,"hq":"Vancouver","inst":["Thacker Pass"],"ties":["doi"],"src":"https://en.wikipedia.org/wiki/Thacker_Pass_lithium_mine","srcname":"Wikipedia","desc":"A Vancouver-based lithium company operating in the U.S. through its subsidiary Lithium Nevada Corp and backed by a major General Motors investment. It is building the Thacker Pass mine, sold as critical to the 'green' transition, on a Paiute-Shoshone sacred site opposed by the People of Red Mountain.","act":"high","today":"Thacker Pass is under construction now.","unit":"Lithium Nevada Corp (its U.S. operating subsidiary) · Most responsible: President & CEO Jonathan Evans"},{"id":"tcEnergy","name":"TC Energy","cat":"benefit","field":"extraction","role":"Pipeline operator","lat":51.0447,"lon":-114.0719,"hq":"Calgary","inst":["Coastal GasLink injunction"],"ties":["scCanada"],"src":"https://en.wikipedia.org/wiki/Coastal_GasLink_Pipeline","srcname":"Wikipedia","desc":"A Calgary pipeline company that built Coastal GasLink through its subsidiary Coastal GasLink Pipeline Ltd. It pushed the line across unceded Wet'suwet'en territory against the nation's hereditary chiefs, relying on a court injunction and repeated militarized RCMP raids to clear the route.","act":"high","today":"Coastal GasLink was completed in 2023 and is now operating.","unit":"Coastal GasLink Pipeline Ltd (its subsidiary) · Most responsible: CEO François Poirier"},{"id":"jbs","name":"JBS · Cargill · Bunge","cat":"benefit","field":"extraction","role":"Beef & soy traders · Brazil","lat":-23.5505,"lon":-46.6333,"hq":"São Paulo","inst":["Marco Temporal land cutoff"],"ties":["bancada","brCongress"],"src":"https://news.mongabay.com/2024/01/meet-the-think-tank-behind-the-agribusiness-legislative-wins-in-brazil/","srcname":"Mongabay","desc":"The Batista family's JBS — the world's largest meatpacker, through its beef arm Friboi — together with soy traders Cargill and Bunge. Their cattle-and-soy supply chains, repeatedly tied by watchdogs such as Amazon Watch to illegal deforestation, are the economic engine the ruralist land agenda exists to serve.","act":"high","today":"still the world's largest meat company, and still expanding.","unit":"JBS S.A.'s beef arm (Friboi); traders Cargill & Bunge · Most responsible: the controlling Batista brothers (Joesley & Wesley)"},{"id":"wilmar","name":"Wilmar & palm-oil majors","cat":"benefit","field":"extraction","role":"Agribusiness","lat":1.3521,"lon":103.8198,"hq":"Singapore","inst":["Sarawak Land Code","Basic Agrarian Law 1960"],"ties":["idGov"],"src":"https://en.wikipedia.org/wiki/Wilmar_International","srcname":"Wikipedia","desc":"One of the world's largest palm-oil groups, co-founded by Kuok Khoon Hong and Martua Sitorus and operating through plantation and refining subsidiaries across Sumatra and Borneo. Its expansion has driven deforestation and long-running disputes with Penan, Iban and other customary landholders.","act":"high","today":"still a dominant palm-oil trader; land disputes are ongoing.","unit":"Wilmar's plantation & refining subsidiaries in Sumatra and Borneo · Most responsible: co-founder, chairman & CEO Kuok Khoon Hong"},{"id":"petroEc","name":"Petroecuador","cat":"benefit","field":"extraction","role":"State oil company","lat":-0.1807,"lon":-78.4678,"hq":"Quito","inst":["Block 43-ITT oil drilling"],"ties":["worldBankICSID"],"src":"https://en.wikipedia.org/wiki/Yasuni_National_Park","srcname":"Wikipedia","desc":"Ecuador's state oil company, which runs the Yasuní Block 43-ITT fields through the operations unit it absorbed from Petroamazonas. President Daniel Noboa's government has kept production going past the deadline set by the binding 2023 referendum to leave the oil underground.","act":"high","today":"still extracting from Block 43 past the referendum's deadline.","unit":"The Bloque 43-ITT operations unit (formerly Petroamazonas) · Most responsible: Ecuador's President Daniel Noboa"},{"id":"beowulf","name":"Beowulf Mining & LKAB","cat":"benefit","field":"extraction","role":"Iron-ore developers","lat":65.5848,"lon":22.1567,"hq":"Luleå, Sweden","inst":["Minerals Act & Gállok"],"ties":[],"src":"https://en.wikipedia.org/wiki/G%C3%A1llok","srcname":"Wikipedia","desc":"A London-listed iron-ore developer operating in Sweden through its subsidiary Jokkmokk Iron Mines AB, alongside the state miner LKAB. It holds the contested Kallak (Gállok) concession — granted by Sweden's government in 2022 over Sámi and UN objections — on reindeer-herding land.","act":"high","today":"holds the 2022 Kallak concession; development is contested but live.","unit":"Jokkmokk Iron Mines AB (its Kallak subsidiary)"},{"id":"bancada","name":"Bancada Ruralista (FPA) & Pensar Agro","cat":"lobby","field":"land","role":"Agribusiness caucus + think tank","lat":-15.835,"lon":-47.873,"hq":"Brasília (Lago Sul)","inst":["Marco Temporal land cutoff","PEC 48/2023"],"ties":["brCongress","jbs"],"src":"https://news.mongabay.com/2024/01/meet-the-think-tank-behind-the-agribusiness-legislative-wins-in-brazil/","srcname":"Mongabay","desc":"The agribusiness caucus in Brazil's Congress, formally the Frente Parlamentar da Agropecuária (FPA), now chaired by deputy Pedro Lupion and controlling roughly 60% of the legislature. Its bills are written by the heavily funded Pensar Agro Institute (IPA) and the CNA farm confederation, bankrolled by firms such as JBS, Cargill and BASF.","act":"high","today":"the most powerful bloc in Brazil's Congress today.","unit":"The Pensar Agro Institute (IPA) drafting arm · the CNA confederation · Most responsible: FPA president Dep. Pedro Lupion"},{"id":"minCouncilAu","name":"Minerals Council of Australia","cat":"lobby","field":"extraction","role":"Mining lobby","lat":-35.282,"lon":149.1287,"hq":"Canberra","inst":["Native Title Act 1993"],"ties":["auParliament"],"src":"https://www.minerals.org.au/","srcname":"Minerals Council of Australia","desc":"Australia's peak mining lobby, led by chief executive Tania Constable, whose land-access and native-title advocacy works to keep Indigenous land rights narrow enough to protect mineral projects. It is among the most influential industry bodies in Canberra.","act":"high","today":"Australia's leading mining lobby in current policy fights.","unit":"Its land-access & native-title policy advocacy · Most responsible: long led by CEO Tania Constable"},{"id":"nff","name":"National Farmers' Federation","cat":"lobby","field":"land","role":"Pastoralist lobby · Australia","lat":-35.2785,"lon":149.13,"hq":"Canberra","inst":["Wik Peoples v Queensland"],"ties":["auParliament"],"src":"https://nff.org.au/","srcname":"National Farmers' Federation","desc":"The National Farmers' Federation, a peak body of state pastoralist and farming federations representing grazing interests that overlap heavily with claimed land. It drove the post-Wik political backlash that produced the Howard government's native-title wind-back.","act":"force","today":"the post-Wik settlement it shaped remains the law.","unit":"Its member state pastoralist & farming federations · Most responsible: President David Jochinke"},{"id":"usMiningOil","name":"U.S. Mining & Petroleum lobbies","cat":"lobby","field":"extraction","role":"NMA & API · United States","lat":38.9026,"lon":-77.0349,"hq":"Washington, D.C.","inst":["General Mining Act of 1872","'Mine everywhere' minerals executive order"],"ties":["usCongress"],"src":"https://nma.org/","srcname":"National Mining Association","desc":"The two main U.S. extractive lobbies — the National Mining Association under Rich Nolan and the American Petroleum Institute under Mike Sommers. They spend heavily to defend cheap access to minerals and oil on public and tribal land and to speed federal permitting.","act":"high","today":"defending the 1872 law and pushing faster permitting now.","unit":"The National Mining Association & the American Petroleum Institute · Most responsible: NMA's Rich Nolan & API's Mike Sommers"},{"id":"usPublicLands","name":"U.S. public-land system (BLM & USFS)","cat":"ownership","field":"land","role":"Federal landholder","lat":38.887,"lon":-77.019,"hq":"Washington, D.C.","inst":["General Mining Act of 1872","Oak Flat / Resolution Copper"],"ties":["doi"],"src":"https://www.blm.gov/","srcname":"Bureau of Land Management","desc":"The federal land system run by the Bureau of Land Management and the U.S. Forest Service, which together hold and lease hundreds of millions of acres taken from Native nations. Through BLM's minerals and realty programs it is the institutional container into which most dispossessed land was placed.","act":"force","today":"these agencies hold and lease the land every day.","unit":"BLM's minerals & realty programs; the U.S. Forest Service · Most responsible: the BLM under Interior Secretary Doug Burgum"},{"id":"crownLand","name":"Crown land & 'radical title'","cat":"ownership","field":"land","role":"Sovereign landholder · Commonwealth","lat":51.5014,"lon":-0.1419,"hq":"London","inst":["Terra nullius (Crown title, 1788)","Mabo v Queensland (No 2)","Royal Proclamation of 1763"],"ties":["hcAustralia","scCanada","nzCrown"],"src":"https://en.wikipedia.org/wiki/Radical_title","srcname":"Wikipedia","desc":"The doctrine of Crown ('radical') title — that the sovereign holds underlying ownership of all land, leaving native title a residual interest the Crown may extinguish. It is administered by the Crown-lands departments of each Australian state, Canadian province and New Zealand, and underlies every other land title in those countries.","act":"force","today":"radical/Crown title still underlies all land ownership in these countries.","unit":"The Crown in right of each state/province — its Crown-lands departments · Most responsible: King Charles III as the Crown"},{"id":"fortressNGO","name":"Fortress-conservation NGOs","cat":"ownership"," window.SCOPE_HTML = "Every marker is a binding legal instrument — a papal bull, statute, treaty, royal or executive decree, or court ruling — that claimed, took, or still holds native land and lives. Solid markers are in force or still controlling today; dashed markers are proposed or pending, not yet enacted.\n\n    <span class=\"sh\">What's included<\/span>The load-bearing architecture of the law of native dispossession: the foundational international doctrines and landmark international rulings, plus the load-bearing national statutes, decrees and landmark national rulings that the rest of the field cites, rests on, or repeats. The four double-edged landmark rulings here (Mabo, Wik, Delgamuukw and Tsilhqot'in) are mapped from their limiting side and labelled as such.\n\n    <span class=\"sh\">What's excluded<\/span>The thousands of second-order instruments that borrow their force from these keystones — most individual treaties, echo-statutes in further countries that copy a mechanism already shown, and sub-national or provincial variants; and purely protective or counter-dispossession law — the rights-affirming cases (e.g. Awas Tingni, Saramaka, Worcester v. Georgia) are left out entirely.\n\n    <span class=\"sh\">How whole is this slice?<\/span>\n    <div class=\"pct\"><span>By raw count<\/span><span>~0.2–0.4%<\/span><\/div>\n    The U.S. alone ratified some 374 treaties with Native nations (1778–1871) and fills a whole title of its code, plus hundreds of rulings, with Indian law; Canada's Indian Act carries scores of amendments and eleven Numbered Treaties; dozens of settler and post-colonial states hold comparable bodies — likely tens of thousands of instruments in all. By number, this is a rounding error.\n    <div class=\"pct\"><span>By reach / influence<\/span><span>most of the colonized world<\/span><\/div>\n    These few set the terms of who holds the ground across almost every settler and post-colonial state; nearly the entire field descends from, or repeats, what is mapped here.\n    <div class=\"pct\"><span>By kind<\/span><span>~90%<\/span><\/div>\n    Nearly every <i>kind<\/i> of binding instrument the field runs on is present: discovery doctrine and papal title; the conference that partitioned a continent; treaty cession and its unilateral abrogation; the plenary-power and trust-doctrine ruling; the allotment-and-assimilation statute; terra nullius and its limiting 'native title' sequels; the unenforced court win; protection-by-omission (titling withheld); conservation-as-eviction; the extraction-frontier law (mining, oil, dams, agribusiness, the 'green' mineral rush); the defender-criminalization and emergency-powers law; the settler-transfer regime; the frontier 'autonomy' law; and the internationalized tutelage of mandate and trusteeship.\n    <div class=\"pct\"><span>By how well it mirrors the whole<\/span><span>~80%<\/span><\/div>\n    A reasoned estimate is that something like four-fifths of the structurally decisive law of who holds the ground runs in an invasive, eliminatory, or suppressive direction. That makes these keystones among the load-bearing laws of the field — not a niche sub-collection blown up. (Keep in mind that the ~80% is a reading, not a measurement. it can shift with how the field is defined and whether procedural mechanics count. Two careful people could land a band apart.)\n\n    Are these also the <i>representative<\/i> instruments or cherry-picked extremes? Pick them badly and you get a caricature — the dramatic cases chosen, the ordinary ones dropped. Pick them well and you get the whole reproduced in miniature: roughly the same proportions, falling on the same lands and peoples. Each marker is the clearest specimen of a type that recurs across tiers and jurisdictions — a faithful map of the field's <i>character<\/i>. Representativeness: High.";
window.ARCH_INTRO = "The actors that <b style=\"color:#f0ece4\">write and uphold<\/b> the law of land grabs — the courts and legislatures that issue the instruments, the corporations and financiers who profit, the lobbies that push them through, who holds the land now, and the doctrines that bless it. The <b style=\"color:#f0ece4\">network<\/b> panel shows how they connect; the <b style=\"color:#f0ece4\">map<\/b> shows where they sit. Click any actor to light up its connections; each one links to instruments on the Law map and carries a source.";

  const ink = "#d9d6e2";
  NET.rings.selectAll("circle").data(order).join("circle").attr("cx", cx).attr("cy", cy).attr("r", (f) => rad[f]).attr("fill", "none").attr("stroke", "rgba(255,255,255,.08)");
  NET.rings.selectAll("text").data(order).join("text").attr("x", cx).attr("y", (f) => cy - rad[f] - 6).attr("text-anchor", "middle").attr("font-size", "9px").attr("letter-spacing", "1.2px").attr("fill", "#8f8d9e").text((f) => flab(f).toUpperCase());
  const ties = TIES.filter(([x, y]) => ok(BYID[x]) && ok(BYID[y]));
  NET.links.selectAll("line").data(ties).join("line").attr("x1", (d) => BYID[d[0]].x).attr("y1", (d) => BYID[d[0]].y).attr("x2", (d) => BYID[d[1]].x).attr("y2", (d) => BYID[d[1]].y)
    .attr("stroke", (d) => sel && (d[0] === sel || d[1] === sel) ? ink : "#4a4e66").attr("stroke-opacity", (d) => !sel ? 0.55 : (d[0] === sel || d[1] === sel) ? 0.95 : 0.08).attr("stroke-width", (d) => sel && (d[0] === sel || d[1] === sel) ? 1.8 : 0.9);
  const shown = ACT.filter(ok);
  NET.nodes.selectAll("circle").data(shown, (a) => a.id).join("circle").attr("cx", (a) => a.x).attr("cy", (a) => a.y).attr("r", (a) => a.cat === "lawcourt" ? 6.5 : 5.5)
    .attr("fill", (a) => RCU[a.cat]).attr("fill-opacity", (a) => a.act === "dormant" ? 0.55 : 1).attr("stroke", (a) => a.id === sel ? "#ffffff" : "#0b0c1e").attr("stroke-width", (a) => a.id === sel ? 2 : 1.2)
    .attr("opacity", (a) => lit(a) ? 1 : 0.2).style("cursor", "pointer")
    .on("click", (e, a) => { e.stopPropagation(); selectAct(a.i, true); })
    .on("mousemove", (e, a) => F.tip("<b>" + esc(a.name) + '</b><br><span class="mute">' + esc(L.CATMETA[a.cat].label) + " · " + esc(a.hq) + "</span>", e.clientX, e.clientY)).on("mouseleave", () => F.tip(null));
  NET.labs.selectAll("text").data(shown, (a) => a.id).join("text").attr("x", (a) => a.x + (Math.cos(a._ang) >= 0 ? 10 : -10)).attr("y", (a) => a.y + Math.sin(a._ang) * 3).attr("dominant-baseline", "central")
    .attr("text-anchor", (a) => Math.cos(a._ang) >= 0 ? "start" : "end").attr("font-size", "9.5px").attr("fill", "#e8e6e1").attr("opacity", (a) => lit(a) ? 1 : 0.2)
    .attr("paint-order", "stroke").attr("stroke", "#0b0c1e").attr("stroke-width", 3).style("pointer-events", "none").text((a) => a.name);
}

F = MapCore.frame({
  base: "night",
  ready(Fr) {
    F = Fr; map = F.map; const H = F.H;
    recolour(F.BM.current());
    if (H.get("w") === "arch") VIEW = "arch";
    if (["type", "branch", "field", "century", "az"].includes(H.get("g"))) S.group = H.get("g");
    if (["role", "field", "hq", "az"].includes(H.get("ag"))) R.group = H.get("ag");
    if (H.get("nw") === "0") R.net = false;
    F.hashExtra = () => ({ w: VIEW === "arch" ? "arch" : "", s: VIEW === "law" ? S.sel : R.sel, g: S.group === "type" ? "" : S.group, ag: R.group === "role" ? "" : R.group, nw: R.net ? "" : "0" });
    addLayers(); buildKey();
    F.onBase.push((k) => { recolour(k); if (VIEW === "law") { updateLaw(); if (S.sel != null) selectLaw(S.sel, false); } else { updateArch(); if (R.sel != null) selectAct(R.sel, false); } });
    map.on("zoomend", () => { if (VIEW === "law") drawLaw(); else drawActs(); });
    F.onProj.push(() => { if (VIEW === "law") drawLaw(); else drawActs(); });
    F.onHover = (f, ev) => {
      if (!f) { F.tip(null); return; }
      if (VIEW === "law") { const d = D[f.properties.i]; F.tip("<b>" + esc(d.name) + '</b><br><span class="mute">' + d.year + " · " + esc(kindLabel(d)) + " · " + esc(L.BRANCHMETA[d.branch].label) + (d.st === "pending" ? " · pending" : "") + "</span>", ev.clientX, ev.clientY); }
      else { const a = ACT[f.properties.i]; F.tip("<b>" + esc(a.name) + '</b><br><span class="mute">' + esc(L.CATMETA[a.cat].label) + " · " + esc(a.hq) + "</span>", ev.clientX, ev.clientY); }
    };
    F.onPick = (f) => { if (VIEW === "law") selectLaw(f.properties.i, false); else selectAct(f.properties.i, false); };
    F.onEscape = deselect;
    $("#detX").addEventListener("click", deselect);
    $("#netX").addEventListener("click", () => { R.net = false; netShow(); refit(); F.writeHash(); });
    window.addEventListener("resize", netDraw);
    setView(VIEW);
  },
  after(Fr) { const s = parseInt(Fr.H.get("s"), 10); if (s >= 0) { if (VIEW === "law" && s < D.length) selectLaw(s, false); else if (VIEW === "arch" && s < ACT.length) selectAct(s, false); } },
});

/* ---------- about and sources ---------- */
F.setAbout(
  '<h2>What the map shows</h2>' +
  '<p>Two views of the law of native land grabs, switched with the buttons at the top of the key.</p>' +
  '<ul><li><b>The law</b>: ' + D.length + ' binding instruments — papal bulls, statutes, treaties, royal and executive decrees, and court rulings — still in force or still decisive, plus the bills and transfers now pending. Each mark sits where the instrument was enacted, decreed or adjudicated. Its shape gives the type of instrument and its colour the branch of power; a hollow mark with a dashed outline is not yet enacted.</li>' +
  '<li><b>The architecture</b>: ' + ACT.length + ' actors that write and uphold that law — courts, legislatures, corporations, lobbies, landholders and the bodies that legitimize them — with the ties between them drawn on the map and in the network panel. Choosing an actor lights up its connections.</li></ul>' +
  '<p>Choosing a mark, a line in the list or a node in the network opens its card on the right, with its source. Marks can be chosen with a click, or a tap on a phone.</p>' +
  '<p>The lists under “Entries shown” can be grouped several ways (type, branch, field, century or A to Z for the law; role, field, headquarters or A to Z for the architecture). Every group opens by default; a group\'s title closes it.</p>' +
  '<h2>Scope</h2><div class="scope">' + window.SCOPE_HTML + '</div>' +
  '<h2>Where the marks sit</h2>' +
  '<ul><li>Where several marks share one point (Rome, Washington, Canberra, Brasília), they are spread round a small dot on the point, each tied to it by a thin line. The spread is measured on the screen, so it stays the same size as you zoom in.</li>' +
  '<li>Each basemap has its own set of colours for the marks, taken from that basemap\'s own tones, with an outline that sets the marks off from it. The branches keep their hues across basemaps: green for legislative, blue for executive, red for judicial.</li></ul>' +
  '<h2>The map itself</h2>' +
  '<ul><li>Five basemaps: Jurassic (satellite imagery with relief), Atlas (a painted world chart that gives way to imagery as you zoom in), Bioluminescent (night lights), Hell and Standard (outlines).</li>' +
  '<li>Globe or flat map. On the flat map the world repeats east and west, so the two edges meet in the Pacific and you can pan across it without a break.</li>' +
  '<li>Place names can be switched off in the basemap box. The link in the address bar keeps the view, basemap and chosen entry, so it can be copied and shared.</li></ul>' +
  '<h2>Sources</h2><p>Each card links the source its entry gives.</p>' +
  '<p class="mute">Basemaps (Esri, Maxar, OpenFreeMap and OpenStreetMap, Mapterhorn, AWS Terrain Tiles, NASA Black Marble, CARTO), with credits in the map\'s corner.</p>');
})();
