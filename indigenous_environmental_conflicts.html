<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indigenous Environmental Conflicts</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Uncial+Antiqua&display=swap">
<style>
:root{--bg:#06071a;--card:rgba(8,9,24,.94);--line:#24264a;--line2:rgba(255,255,255,.07);--ink:#e8e6e1;--mute:#a3a1b4;--accent:#5600DC;--accent-hi:#a99cff}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 'Marcellus','Georgia',serif;overflow:hidden}
#map{position:absolute;inset:0;background:#03040a}
.card{position:absolute;z-index:800;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
.scroll{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
#key{top:12px;left:12px;width:346px;max-height:calc(100% - 24px);overflow:auto;padding:14px 16px;box-sizing:border-box}
#key h1{font:800 22px/1.2 'Uncial Antiqua','Marcellus','Georgia',serif;margin:0 0 4px;letter-spacing:.5px;color:#f0ece4;text-shadow:0 2px 12px rgba(0,0,0,.5);padding-right:34px}
#key .lede{color:var(--mute);margin:0 0 10px;font-size:12.8px}
#key.min .body,#key.min .lede{display:none}
.psec{margin:14px 0 3px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent-hi);display:flex;align-items:center;gap:8px}
.psec .sp{flex:1}
.psec button{text-transform:none;letter-spacing:0}
.row{display:flex;gap:9px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line2)}
.row input{margin-top:4px}
.row label{flex:1;cursor:pointer;font-size:13px;line-height:1.35}
.row .n{color:var(--mute);font-size:11.5px;white-space:nowrap;margin-top:2px}
.row .d{display:block;color:var(--mute);font-size:11.5px}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(246,240,236,.45)}
.sw.ring{background:none!important;box-shadow:none;border:1.4px solid;box-sizing:border-box}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
.sub{margin:4px 0 0;font-size:12px;color:var(--mute)}
.mute{color:var(--mute)}
a{color:var(--accent-hi)}
select,button.btn{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font:inherit;font-size:12.5px;cursor:pointer}
select{max-width:100%;width:100%;padding:3px 6px}
select option{background:#14161c}
button.btn.on{border-color:var(--accent-hi);background:var(--accent);color:#fff}
button.btn:hover,#infoBtn:hover,#worldBtn:hover{border-color:var(--accent-hi);color:#fff}
.tog{display:inline-block;float:right;cursor:pointer;font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:1px 8px}
#q{width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font:inherit;font-size:13px;margin:2px 0 4px}
#q::placeholder{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 6px}
.years{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mute)}
.years input[type=number]{width:66px;background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 5px;font:inherit;font-size:12.5px}
#cnt{font-size:12px;color:var(--ink);margin-top:6px}
.dkey{display:grid;grid-template-columns:16px 1fr;gap:5px 8px;align-items:center;font-size:12px;color:var(--mute);margin:4px 0}
.dkey i{width:10px;height:10px;border-radius:50%;display:block;justify-self:center;box-sizing:border-box}
#olist{max-height:300px;overflow:auto}
.oi{padding:4px 2px;border-top:1px solid var(--line2);font-size:12.8px;cursor:pointer;line-height:1.3}
.oi:hover{background:rgba(255,255,255,.04)}
.oi.sel{background:rgba(255,255,255,.08)}
.oi .n{color:var(--mute);font-size:11px;display:block}
#rcol{position:absolute;z-index:800;top:12px;right:12px;width:300px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#rcol>*{pointer-events:auto;position:relative;box-sizing:border-box}
#infoBtn{align-self:flex-end;padding:7px 14px;cursor:pointer;letter-spacing:.2px}
#tr{padding:12px 14px}
#tr.min .body{display:none}
#tr.min{align-self:flex-end;padding:6px 10px}
.bases{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12.8px;margin:4px 0 2px}
.bases label{cursor:pointer;white-space:nowrap}
.seg{display:flex;gap:6px;margin:4px 0 2px;flex-wrap:wrap}
#worldBtn{position:absolute;z-index:800;right:52px;bottom:30px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 11px;font:13px 'Marcellus','Georgia',serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#info{inset:0;z-index:1001;border-radius:0;border:0;display:none;overflow:auto;padding:60px max(28px,calc((100% - 1080px)/2)) 40px;background:rgba(5,6,16,.975)}
#info.open{display:block}
#infoClose{position:fixed;top:12px;right:12px;z-index:1002;display:none}
#info.open~#infoClose{display:block}
#info h2{font:400 17px/1.3 'Uncial Antiqua','Marcellus','Georgia',serif;margin:26px 0 8px;color:#f0ece4;letter-spacing:.3px}
#info h2:first-child{margin-top:0}
#info p,#info li{font-size:14px}
#info ul{padding-left:20px;margin:4px 0}
#info li{margin:4px 0}
#info table{border-collapse:collapse;font-size:13px;margin:6px 0}
#info th,#info td{border-bottom:1px solid var(--line2);padding:3px 10px 3px 0;text-align:left;vertical-align:top}
#info th{color:var(--mute);font-weight:400}
.maplibregl-map{font-family:'Marcellus','Georgia',serif}
.maplibregl-popup{z-index:900}
.maplibregl-popup-content{background:rgba(12,13,20,.97);color:var(--ink);border:1px solid var(--line);border-radius:5px;box-shadow:0 10px 30px rgba(0,0,0,.55);padding:13px 15px;line-height:1.5;font-size:13px;max-height:calc(100vh - 170px);overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent;min-width:220px;box-sizing:border-box}
.maplibregl-popup-anchor-top .maplibregl-popup-tip,.maplibregl-popup-anchor-top-left .maplibregl-popup-tip,.maplibregl-popup-anchor-top-right .maplibregl-popup-tip{border-bottom-color:rgba(12,13,20,.97)}
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip,.maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip,.maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip{border-top-color:rgba(12,13,20,.97)}
.maplibregl-popup-anchor-left .maplibregl-popup-tip{border-right-color:rgba(12,13,20,.97)}
.maplibregl-popup-anchor-right .maplibregl-popup-tip{border-left-color:rgba(12,13,20,.97)}
.maplibregl-popup-close-button{color:#bbb;font-size:18px;padding:0 6px;right:2px;top:2px}
.maplibregl-popup-close-button:hover{background:none;color:#fff}
.tip .maplibregl-popup-content{min-width:0;padding:4px 8px;font-size:12.5px;border-radius:3px;max-height:none}
.tip .maplibregl-popup-tip{display:none}
.tip{pointer-events:none}
.maplibregl-ctrl-attrib{background:rgba(6,7,16,.8)!important;color:#8f8d9e;font-family:'Marcellus','Georgia',serif}
.maplibregl-ctrl-attrib a{color:#b0aec0!important}
.maplibregl-ctrl-attrib-button{filter:invert(1)}
.maplibregl-ctrl-group{background:var(--card)!important;border:1px solid var(--line);box-shadow:none!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}
.hp h3{margin:2px 0 5px;font-size:16px;font-weight:700;color:#f0ece4;border-bottom:1px solid var(--line);padding:0 18px 6px 0;line-height:1.3}
.hp-k{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);padding-right:20px}
.hp-sub{color:var(--mute);font-size:12px;margin:0 0 6px}
.hp table.kv{border-collapse:collapse;font-size:12.5px;width:100%}
.hp table.kv th{text-align:left;color:var(--mute);font-weight:400;vertical-align:top;padding:2px 10px 2px 0;white-space:nowrap}
.hp table.kv td{padding:2px 0;vertical-align:top}
.hp .note{color:var(--mute);font-size:12px;margin:6px 0 0}
.hp-src{color:var(--mute);font-size:11.2px;margin-top:9px;border-top:1px solid var(--line2);padding-top:6px}
.hp ol{margin:4px 0 0;padding-left:20px;max-height:300px;overflow:auto}
.hp li{margin:3px 0}
.hp li span{display:block;color:var(--mute);font-size:11px}
@media (max-width:760px){
  #key{width:auto;right:12px;max-height:45%}
  #rcol{top:auto;bottom:74px;left:12px;right:auto;width:auto;max-width:calc(100% - 24px)}
  #infoBtn{align-self:flex-start}
  #tr.min{align-self:flex-start}
  #worldBtn{bottom:30px}
  #info{padding:56px 16px 80px}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="key" class="card scroll">
  <button id="toggleKey" class="tog" type="button" title="Pull the key up or down">−</button>
  <h1>Indigenous environmental conflicts</h1>
  <p class="lede" id="lede"></p>
  <div class="body" id="keyBody"></div>
</div>

<div id="rcol">
  <div id="infoBtn" class="card" role="button" tabindex="0">About and sources</div>
  <div id="tr" class="card"><button id="toggleTr" class="tog" type="button" title="Pull the basemap box up or down">−</button><div class="body" id="trBody"></div></div>
</div>

<button id="worldBtn" type="button" title="Zoom back out to the whole world">Whole world</button>
<div id="info" class="card scroll"></div>
<button id="infoClose" class="btn" type="button">Close</button>

function panelRight() { try { const r = $("#key").getBoundingClientRect(), w = map.getContainer().clientWidth; if (r.width && r.right < w * 0.6) return r.right + 10; } catch (e) {} return 0; }
function rightBox() { try { const r = $("#rcol").getBoundingClientRect(), w = map.getContainer().clientWidth; if (r.width && r.left > w * 0.5) return w - r.left + 10; } catch (e) {} return 0; }
const popup = new maplibregl.Popup({ maxWidth: "420px", closeOnClick: false, focusAfterOpen: false });
const tip = new maplibregl.Popup({ closeButton: false, closeOnClick: false, className: "tip", offset: 10 });
popup.on("close", () => { if (S.sel != null) { S.sel = null; drawSel(); drawList(); } });
function fitPopup() {
  const el = popup.getElement(); if (!el) return;
  const c = map.getContainer().getBoundingClientRect(), r = el.getBoundingClientRect();
  const L0 = c.left + panelRight() + 8, R0 = c.right - rightBox() - 8, T0 = c.top + 8, B0 = c.bottom - 8;
  let dx = 0, dy = 0;
  if (r.width > R0 - L0) dx = r.left - L0; else if (r.left < L0) dx = r.left - L0; else if (r.right > R0) dx = r.right - R0;
  if (r.top < T0) dy = r.top - T0; else if (r.bottom > B0) dy = Math.min(r.bottom - B0, r.top - T0);
  if (dx || dy) map.panBy([dx, dy], { duration: 300 });
}
function wholeWorld() {
  popup.remove();
  if (proj === "globe") map.flyTo({ center: [-20, 8], zoom: startZoom(), padding: { left: panelRight() / 2, right: rightBox() / 2, top: 0, bottom: 0 } });
  else map.fitBounds([[-170, -56], [180, 76]], { padding: { left: panelRight() + 10, right: rightBox() + 10, top: 20, bottom: 20 } });

const IDS = [];
function order() { const st = map.getStyle(); if (!st) return; const mine = new Set(IDS); const first = st.layers.find((l) => !mine.has(l.id) && (l.type === "symbol" || l.id === "labels")); IDS.forEach((id) => map.moveLayer(id, first ? first.id : undefined)); }

/* the dots: a small filled dot at the place the copy gives; a ring where the copy names only the country */
const RAD = ["interpolate", ["linear"], ["zoom"], 0, 3, 2, 3.6, 4, 4.5, 7, 6, 11, 8];
function addLayers() {
  map.addSource("ej", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addSource("ej-sel", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "ej-dots", type: "circle", source: "ej", paint: {
    "circle-radius": RAD, "circle-color": ["get", "c"],
    "circle-opacity": ["case", ["==", ["get", "ring"], 1], 0.14, 0.92],
    "circle-stroke-color": ["case", ["==", ["get", "ring"], 1], ["get", "c"], "rgba(246,240,236,0.8)"],
    "circle-stroke-width": ["case", ["==", ["get", "ring"], 1], 1.5, 0.9],
    "circle-pitch-alignment": "map" } });
  map.addLayer({ id: "ej-sel", type: "circle", source: "ej-sel", paint: {

    "circle-stroke-color": "#f0ece4", "circle-stroke-width": 1.1, "circle-stroke-opacity": 0.9, "circle-pitch-alignment": "map" } });

let SHOWN = [];
function drawDots() {
  SHOWN = R.filter(passes);

  const nCol = new Map(); SHOWN.forEach((r) => { const c = colourOf(r); nCol.set(c, (nCol.get(c) || 0) + 1); });
  const feats = SHOWN.map((r) => { const c = colourOf(r); return { type: "Feature", geometry: { type: "Point", coordinates: [r.dlon, r.dlat] }, properties: { i: r.idx, c, ring: r.ring ? 1 : 0, o: -nCol.get(c) } }; })
    .sort((a, b) => a.properties.o - b.properties.o);
  const src = map.getSource("ej"); if (src) src.setData({ type: "FeatureCollection", features: feats });
}
function drawSel() {
  const r = S.sel == null ? null : R[S.sel], src = map.getSource("ej-sel");
  if (src) src.setData({ type: "FeatureCollection", features: r ? [{ type: "Feature", geometry: { type: "Point", coordinates: [r.dlon, r.dlat] }, properties: {} }] : [] });

/* ---------- a conflict's box ---------- */
const yearsText = (r) => r.y0 == null ? "" : r.open ? "since " + r.y0 : r.y0 === r.y1 ? String(r.y0) : r.y0 + " to " + r.y1;
function box(r) {
  const place = [r.s, r.p, r.c].filter(Boolean).join(", ");
  const sec = SC[r.k] || { name: r.k }, it = IC[r.i], st = TC[r.t] || TC[""];

  return '<div class="hp"><div class="hp-k">' + esc(sec.name) + '</div><h3>' + esc(r.n) + '</h3>' +
    '<div class="hp-sub">' + esc(place) + '</div>' +

    '<tr><th>Country</th><td>' + esc(r.c) + '</td></tr>' +

    (r.s ? '<tr><th>Site</th><td>' + esc(r.s) + '</td></tr>' : "") +

function listBox(rs) {
  return '<div class="hp"><div class="hp-k">' + rs.length + ' here</div><h3>These overlap at this zoom</h3><p class="note">Choose one, or zoom in to separate them.</p><ol>' +

function open(r, ll) {
  popup.setLngLat(ll || [r.dlon, r.dlat]).setHTML(box(r)).addTo(map);
  S.sel = r.idx; drawSel(); drawList();
  requestAnimationFrame(fitPopup);

function hits(pt, tol) { return map.queryRenderedFeatures([[pt.x - tol, pt.y - tol], [pt.x + tol, pt.y + tol]], { layers: ["ej-dots"] }).map((f) => R[f.properties.i]); }
function select(i) {
  const r = R[i];
  const z = Math.max(map.getZoom(), 5);
  map.flyTo({ center: [r.dlon, r.dlat], zoom: z, padding: { left: panelRight(), right: rightBox(), top: 20, bottom: 20 }, duration: 900 });

/* ---------- the key ---------- */
function rowsHtml(list, set, attr, counts, colOf, sub) {

    '<div class="row"><input type="checkbox" id="' + attr + '_' + list.indexOf(s) + '" data-' + attr + '="' + esc(s[0]) + '"' + (set.has(s[0]) ? " checked" : "") + '>' +
    '<label for="' + attr + '_' + list.indexOf(s) + '"><span class="sw" style="background:' + colOf(s) + '"></span>' + esc(s[1]) + (sub ? '<span class="d">' + esc(sub(s)) + '</span>' : "") + '</label>' +
    '<span class="n" data-n="' + attr + ':' + esc(s[0]) + '"></span></div>').join("");
}
function buildKey() {
  $("#lede").textContent = "Environmental conflicts affecting Indigenous peoples, from the Environmental Justice Atlas (EJAtlas): " + fmt(R.length) + " conflicts in " + COUNTRIES.length + " countries.";
  const countries = [...NC].sort((a, b) => a[0].localeCompare(b[0]));
  $("#keyBody").innerHTML =
    '<input id="q" type="search" placeholder="Find a conflict, place or country" aria-label="Search">' +
    '<div id="cnt"></div>' +
    '<div class="psec">Time</div>' +
    '<div class="chips"><button type="button" class="btn on" data-t="all">All years</button><button type="button" class="btn" data-t="since2000">2000 on</button><button type="button" class="btn" data-t="before">Before 2000</button><button type="button" class="btn" id="play" title="Play: add the conflicts year by year as they began">▶ Play</button></div>' +
    '<div class="years"><span>Under way between</span><input id="y0" type="number" min="' + YMIN + '" max="' + YMAX + '" value="' + YMIN + '"><span>and</span><input id="y1" type="number" min="' + YMIN + '" max="' + YMAX + '" value="' + YMAX + '"></div>' +
    '<div class="sub">A conflict is kept when it was under way at some time in those years: begun by the second year, and not ended before the first. A date given as “since” a year has no end. The ' + fmt(NODATE) + ' conflicts with no date in the copy are always shown.</div>' +
    '<div class="psec">Colour the dots by</div>' +
    '<select id="by"><option value="k">EJAtlas category</option><option value="i">Intensity</option><option value="t">Project status</option><option value="y">Decade it began</option><option value="one">One colour</option></select>' +
    '<div id="byKey" class="dkey"></div>' +
    '<div class="psec">EJAtlas category<span class="sp"></span><button type="button" class="btn" data-allg="k">All on / off</button></div>' +
    rowsHtml(SECTORS, S.k, "k", NK, (s) => s[2]) +
    '<div class="psec">Intensity<span class="sp"></span><button type="button" class="btn" data-allg="i">All on / off</button></div>' +
    rowsHtml(INTENS, S.i, "i", NI, (s) => s[3], (s) => s[2]) +
    '<div class="psec">Project status<span class="sp"></span><button type="button" class="btn" data-allg="t">All on / off</button></div>' +
    rowsHtml(STATUS, S.t, "t", NT, (s) => s[2]) +
    '<div class="psec">How dots are drawn</div>' +
    '<div class="dkey"><i style="background:#c0606f;box-shadow:0 0 0 1px rgba(246,240,236,.7)"></i><span>Filled dot: at the coordinates the copy gives</span>' +
    '<i style="border:1.4px solid #c0606f;background:rgba(192,96,111,.14)"></i><span>Ring: the copy names only the country (' + NRING + ' conflicts)</span></div>' +
    '<div class="sub">Where several conflicts share one spot (' + NSHARED + ' in the copy), they are drawn slightly apart in a small spiral. Where dots overlap at a zoom, a click lists every one under it.</div>' +
    '<div class="psec">The conflicts</div><div id="olist" class="scroll"></div>' +
    '<div class="sub">For Indigenous territories and their names, and for updates beyond this snapshot, see <a href="https://native-land.ca/" target="_blank" rel="noopener">Native Land Digital’s map ↗</a> and <a href="https://ejatlas.org/" target="_blank" rel="noopener">EJAtlas ↗</a>.</div>';
  const body = $("#keyBody");
  body.querySelectorAll("input[type=checkbox]").forEach((cb) => cb.addEventListener("change", () => {
    for (const g of ["k", "i", "t"]) if (cb.dataset[g] != null) { cb.checked ? S[g].add(cb.dataset[g]) : S[g].delete(cb.dataset[g]); }

  body.querySelectorAll("[data-allg]").forEach((b) => b.addEventListener("click", () => {
    const g = b.dataset.allg, boxes = [...body.querySelectorAll("input[data-" + g + "]")], to = !boxes.every((x) => x.checked);
    boxes.forEach((x) => { x.checked = to; to ? S[g].add(x.dataset[g]) : S[g].delete(x.dataset[g]); }); update();
  }));
  let qt; $("#q").addEventListener("input", (e) => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim().toLowerCase(); update(); }, 200); });
  $("#by").addEventListener("change", (e) => { S.by = e.target.value; update(); });
  const y0 = $("#y0"), y1 = $("#y1");
  const chipsOff = () => body.querySelectorAll("[data-t]").forEach((x) => x.classList.remove("on"));
  body.querySelectorAll("[data-t]").forEach((b) => b.addEventListener("click", () => {
    stopPlay(); const t = b.dataset.t;
    [S.a, S.b] = t === "since2000" ? [2000, YMAX] : t === "before" ? [YMIN, 1999] : [YMIN, YMAX];
    y0.value = S.a; y1.value = S.b; chipsOff(); b.classList.add("on"); update();
  }));
  [y0, y1].forEach((el) => el.addEventListener("change", () => { stopPlay(); S.a = +y0.value || YMIN; S.b = +y1.value || YMAX; chipsOff(); update(); }));
  $("#play").addEventListener("click", () => playing ? stopPlay() : startPlay());
}
let playing = null;
function startPlay() {
  S.a = YMIN; S.b = YMIN; $("#y0").value = S.a; $("#keyBody").querySelectorAll("[data-t]").forEach((x) => x.classList.remove("on"));
  $("#play").textContent = "❚❚ Pause"; update();
  playing = setInterval(() => { S.b = Math.min(YMAX, S.b + 1); $("#y1").value = S.b; update(); if (S.b >= YMAX) stopPlay(); }, 70);
}
function stopPlay() { if (playing) clearInterval(playing); playing = null; const b = $("#play"); if (b) b.textContent = "▶ Play"; }
function byKey() {
  let pairs = [];
  if (S.by === "k") pairs = SECTORS.filter((s) => NK.get(s[0])).map((s) => [s[2], s[1]]);
  else if (S.by === "i") pairs = INTENS.filter((s) => NI.get(s[0])).map((s) => [s[3], s[1]]);
  else if (S.by === "t") pairs = STATUS.filter((s) => NT.get(s[0])).map((s) => [s[2], s[1]]);
  else if (S.by === "y") { pairs = DECS.length > 8 ? [DECS[0], DECS[Math.floor(DECS.length / 2)], DECS[DECS.length - 1]].map((d) => [colourOf({ y0: d }), d + "s" + (d === DECS[0] ? " (palest)" : d === DECS[DECS.length - 1] ? " (darkest)" : "")]) : DECS.map((d) => [colourOf({ y0: d }), d + "s"]); pairs.push(["#5f5b55", "no date in the copy"]); }
  if (S.by === "k" || S.by === "i" || S.by === "t") { $("#byKey").innerHTML = '<span></span><span>The colours are those beside each ' + (S.by === "k" ? "category" : S.by === "i" ? "intensity" : "project status") + ' below.</span>'; return; }
  $("#byKey").innerHTML = pairs.map(([c, t]) => '<i style="background:' + c + ';box-shadow:0 0 0 1px rgba(246,240,236,.45)"></i><span>' + esc(t) + '</span>').join("");
}
function counts() {
  const shown = new Map();
  SHOWN.forEach((r) => { for (const [g, v] of [["k", r.k], ["i", r.i], ["t", r.t]]) { const key = g + ":" + v; shown.set(key, (shown.get(key) || 0) + 1); } });
  $("#keyBody").querySelectorAll("[data-n]").forEach((el) => { const [g, ...v] = el.dataset.n.split(":"); const total = (g === "k" ? NK : g === "i" ? NI : NT).get(v.join(":")) || 0, n = shown.get(el.dataset.n) || 0; el.textContent = n === total ? fmt(total) : fmt(n) + " of " + fmt(total); });
  const cs = new Set(SHOWN.map((r) => r.c));
  $("#cnt").textContent = "Showing " + fmt(SHOWN.length) + " of " + fmt(R.length) + " conflicts, in " + cs.size + " of " + COUNTRIES.length + " countries" + (S.a !== YMIN || S.b !== YMAX ? ", under way between " + S.a + " and " + S.b : "") + ".";
}
function drawList() {
  const el = $("#olist"); if (!el) return;
  const list = SHOWN.slice().sort((a, b) => a.c.localeCompare(b.c) || a.n.localeCompare(b.n));
  el.innerHTML = list.slice(0, 300).map((r) => '<div class="oi' + (S.sel === r.idx ? " sel" : "") + '" data-i="' + r.idx + '"><span class="sw' + (r.ring ? " ring" : "") + '" style="' + (r.ring ? "border-color:" : "background:") + colourOf(r) + '"></span>' + esc(r.n) +

document.addEventListener("click", (e) => { const o = e.target.closest && e.target.closest(".oi"); if (o) select(+o.dataset.i); });

function buildTr() {
  const tr = $("#trBody");
  tr.innerHTML = '<div class="psec" style="margin-top:0">Basemap</div><div class="bases">' + CulpritsBasemaps.list.map((b) => '<label><input type="radio" name="basemap" value="' + b[0] + '"' + (b[0] === BM.current() ? " checked" : "") + '> ' + esc(b[1]) + '</label>').join("") + '</div>' +
    '<div class="psec">View</div><div class="seg"><button type="button" class="btn on" data-proj="globe">Globe</button><button type="button" class="btn" data-proj="mercator">Flat map</button></div>';

}

function stars() {
  let seed = 1977; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const W = 1400, H = 1000, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#03040a"; g.fillRect(0, 0, W, H);
  // faint dust clouds, kept dim and cool
  [[.22, .30, 520, "48,58,92", .10], [.78, .68, 600, "70,52,86", .08], [.58, .14, 420, "42,74,84", .06], [.10, .86, 380, "56,60,80", .07]].forEach(([x, y, r, rgb, a]) => {
    for (let k = 0; k < 2; k++) for (let dx = -W; dx <= W; dx += W) for (let dy = -H; dy <= H; dy += H) {
      const gr = g.createRadialGradient(x * W + dx, y * H + dy, 0, x * W + dx, y * H + dy, r);
      gr.addColorStop(0, "rgba(" + rgb + "," + a + ")"); gr.addColorStop(1, "rgba(" + rgb + ",0)");
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
    }
  });
  const tints = ["255,255,255", "214,224,255", "236,232,246", "224,236,240"];
  const dot = (x, y, r, a, t) => { for (const dx of [0, -W, W]) for (const dy of [0, -H, H]) { g.beginPath(); g.arc(x + dx, y + dy, r, 0, 7); g.fillStyle = "rgba(" + t + "," + a + ")"; g.fill(); } };
  for (let i = 0; i < 2600; i++) dot(rnd() * W, rnd() * H, .25 + rnd() * .55, .15 + rnd() * .55, tints[(rnd() * 4) | 0]);
  for (let i = 0; i < 90; i++) {
    const x = rnd() * W, y = rnd() * H, r = .8 + rnd() * .9, t = tints[(rnd() * 4) | 0];
    for (const dx of [0, -W, W]) for (const dy of [0, -H, H]) { const gr = g.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, r * 4); gr.addColorStop(0, "rgba(" + t + ",.35)"); gr.addColorStop(1, "rgba(" + t + ",0)"); g.fillStyle = gr; g.fillRect(x + dx - r * 4, y + dy - r * 4, r * 8, r * 8); }
    dot(x, y, r, .9, t);
  }
  const el = $("#map");
  el.style.background = '#03040a url(' + c.toDataURL("image/jpeg", .9) + ') repeat';
  el.style.backgroundSize = W + "px " + H + "px";
  // the sky drifts a little as the map moves
  const drift = () => { const ct = map.getCenter(), z = map.getZoom(); el.style.backgroundPosition = Math.round(-ct.lng * 3) + "px " + Math.round(ct.lat * 3 + z * 6) + "px"; };
  map.on("move", drift); drift();
}


/* ---------- everything that changes together ---------- */
function update() { drawDots(); drawSel(); byKey(); counts(); drawList(); }

function init() {
  addLayers(); buildKey(); buildTr(); stars();
  map.on("click", (e) => {
    const rs = hits(e.point, 4);
    if (!rs.length) { popup.remove(); return; }
    if (rs.length === 1) { open(rs[0], e.lngLat); return; }
    popup.setLngLat(e.lngLat).setHTML(listBox(rs)).addTo(map); requestAnimationFrame(fitPopup);
    S.sel = null; drawSel(); drawList();
    popup.getElement().querySelector("ol").addEventListener("click", (ev) => { const a = ev.target.closest("a[data-j]"); if (!a) return; ev.preventDefault(); open(rs[+a.dataset.j], e.lngLat); });
  });
  map.on("mousemove", (e) => {
    const rs = hits(e.point, 4); map.getCanvas().style.cursor = rs.length ? "pointer" : "";
    if (rs.length) tip.setLngLat(e.lngLat).setHTML(rs.length === 1 ? "<b>" + esc(rs[0].n) + "</b><br><span class=mute>" + esc(rs[0].c) + (rs[0].d ? " · " + esc(rs[0].d) : "") + "</span>" : rs.length + " conflicts here: click to list them").addTo(map);
    else tip.remove();
  });
  map.on("mouseout", () => tip.remove());
  $("#worldBtn").addEventListener("click", wholeWorld);
  $("#toggleKey").addEventListener("click", () => { const p = $("#key"); p.classList.toggle("min"); $("#toggleKey").textContent = p.classList.contains("min") ? "+" : "−"; });
  $("#toggleTr").addEventListener("click", () => { const p = $("#tr"); p.classList.toggle("min"); $("#toggleTr").textContent = p.classList.contains("min") ? "Basemap +" : "−"; });
  if (innerWidth <= 760) { $("#key").classList.add("min"); $("#toggleKey").textContent = "+"; $("#tr").classList.add("min"); $("#toggleTr").textContent = "Basemap +"; }
  ready = true; order(); update();
  map.jumpTo({ center: [-20, 8], zoom: startZoom(), padding: { left: panelRight() / 2, right: rightBox() / 2, top: 0, bottom: 0 } });
}

/* ---------- about and sources ---------- */
const info = $("#info");
const tbl = (rows, head) => '<table><tr>' + head.map((h) => '<th>' + esc(h) + '</th>').join("") + '</tr>' + rows.map((r) => '<tr>' + r.map((c) => '<td>' + c + '</td>').join("") + '</tr>').join("") + '</table>';
info.innerHTML =
  '<h2>What the map shows</h2>' +
  '<p>' + fmt(R.length) + ' environmental conflicts affecting Indigenous peoples in ' + COUNTRIES.length + ' countries, as recorded by the Environmental Justice Atlas (EJAtlas), a database of social conflicts over the environment kept by communities, activists and researchers. These are the conflicts on the compilation map’s Indigenous Environmental Conflicts layer, from its copy of EJAtlas labelled v1, January 2024, and every one of them is drawn here.</p>' +
  '<p>Each dot is one conflict. Its box gives every field the copy holds: the conflict’s name, country, province or region, site, dates, EJAtlas category, intensity, the state of the project and the coordinates, with a link that searches ejatlas.org for the conflict’s full page (its history, the companies and state bodies involved, the impacts and the groups mobilising).</p>' +
  '<h2>The categories</h2>' +
  '<p>EJAtlas files each conflict under one of ten categories. The copy shortens their names; the map gives them in full.</p>' +
  tbl(SECTORS.map((s) => [esc(s[1]), '“' + esc(s[0]) + '”', fmt(NK.get(s[0]) || 0)]), ["EJAtlas category", "In the copy", "Conflicts"]) +
  '<p class="mute">The fossil fuels and climate justice / energy category covers energy as a whole: wind farms, solar parks, geothermal plants and conflicts over climate change itself are filed under it with oil, gas and coal.</p>' +
  '<h2>Intensity and project status</h2>' +
  '<p>Intensity is EJAtlas’s own scale for how intense the conflict has been at its highest:</p>' +
  tbl(INTENS.map((s) => [esc(s[1]), esc(s[2]), fmt(NI.get(s[0]) || 0)]), ["Intensity", "What it means", "Conflicts"]) +
  '<p>Project status is the state of the project at the centre of the conflict when the case was written up:</p>' +
  tbl(STATUS.map((s) => [esc(s[1]), fmt(NT.get(s[0]) || 0)]), ["Project status", "Conflicts"]) +
  '<h2>Placement and dates</h2>' +
  '<ul><li>Each conflict is drawn at the coordinates in the copy. ' + NRING + ' conflicts give a country but no province, region or site; they are drawn as rings.</li>' +
  '<li>' + NSHARED + ' conflicts share a spot with another in the copy; they are drawn slightly apart on a small spiral, and each box says so.</li>' +
  '<li>The dates are as the copy gives them: “Since” a year (' + fmt(R.filter((r) => r.open).length) + '), a span of years (' + fmt(R.filter((r) => r.y0 != null && !r.open && r.y0 !== r.y1).length) + '), a single year (' + fmt(R.filter((r) => r.y0 != null && r.y0 === r.y1).length) + ') or none (' + fmt(NODATE) + '). The time filter keeps a conflict under way at some time in the years chosen; conflicts with no date are always shown. The earliest year in the copy is ' + YMIN + '.</li>' +
  '<li>The copy carries no list of impacts for any conflict; they are on each conflict’s EJAtlas page.</li></ul>' +
  '<h2>Sources</h2>' +
  '<p>Environmental Justice Atlas (EJAtlas), <a href="https://ejatlas.org/" target="_blank" rel="noopener">ejatlas.org</a>. Temper, L., Del Bene, D. and Martinez-Alier, J. (2015), “Mapping the frontiers and front lines of global environmental justice: the EJAtlas”, <i>Journal of Political Ecology</i> 22: 255–278.</p>' +
  '<p>For the territories and names of Indigenous peoples, and for updates beyond this snapshot: <a href="https://native-land.ca/" target="_blank" rel="noopener">Native Land Digital</a> (and its <a href="https://native-land.ca/maps/reciprocity" target="_blank" rel="noopener">reciprocity page</a>).</p>' +
  '<p class="mute">Basemaps: the compilation (Culprits) map’s basemaps, with their credits in the map’s corner.</p>';
const openInfo = (on) => { info.classList.toggle("open", on); };
$("#infoBtn").addEventListener("click", () => openInfo(true));
$("#infoBtn").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openInfo(true); } });
$("#infoClose").addEventListener("click", () => openInfo(false));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (info.classList.contains("open")) openInfo(false); else popup.remove(); } });
})();
</script>
</body>
</html>
