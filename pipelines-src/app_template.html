</div>
<div id="det" class="card scroll hp"><div id="detGrip" title="Drag to move"></div><button id="detX" type="button" title="Close">×</button><div id="detBody"></div></div>
<div id="patBox" class="card"><div class="bh"><span class="psec">Patterns behind the scenes</span><button id="togglePat" class="tog" type="button">−</button></div><div id="patBody" class="scroll"></div></div>
<div id="legBox" class="card"><div class="bh"><span class="psec">On the map</span><button id="toggleLeg" class="tog" type="button">−</button></div><div id="legBody" class="scroll"></div></div>
<div id="story" class="card scroll"></div>
<button id="storyClose" class="btn" type="button">Close</button>
<button id="worldBtn" type="button" title="Zoom back out to the whole world">Whole world</button>
<div id="info" class="card scroll"></div>
<button id="infoClose" class="btn" type="button">Close</button>
<div id="ttip"></div>

<script>
(function () {
"use strict";
const $ = (s) => document.querySelector(s);

const D = DATA, KINDS = D.kinds, POSN = D.POSN, CTY = D.C, PATS = D.PAT, HYP = D.HYP;

const PE = D.PE.map((p) => [p[0], p[1], p[2] === 1 ? p[0] : p[2], p[3], p[4]]);

const SUBT = { uni: "University or college", sec: "Secondary or boarding school", mil: "Military, police or staff school", rel: "Religious school", oth: "Other institution" };
const where = (s) => s.city ? s.city + (s.c && s.c !== s.city ? ", " + s.c : "") : (s.c || "Country not recorded");
const KI = {}; KINDS.forEach((k, i) => { KI[k[0]] = i; });

const PAT_BY = {}; PATS.forEach((p) => { PAT_BY[p.id] = p; p.set = new Set(p.schools.map((x) => SID[x]).filter((x) => x != null)); });
const ISO_NAME = {}; Object.keys(CTY).forEach((i) => { ISO_NAME[i] = CTY[i].n; });
const NAME_ISO = {}; Object.keys(CTY).forEach((i) => { NAME_ISO[CTY[i].n] = i; });
// links per school and per person
const BYS = SCH.map(() => []), BYP = PE.map(() => []);
LK.forEach((l, i) => { BYS[l[1]].push(i); BYP[l[0]].push(i); });
const RANKL = { 4: "Head of state", 3: "Head of government", 2: "Central bank governor", 1: "Minister" };

/* ---------- palettes: the basemap colours from the house maps; school kinds in muted, earthy tones ---------- */

const PAL = {
  night:     { r: ["#6d8bb8", "#56719b", "#42597c", "#31435d", "#233142"], fo: 0.62, ln: "#a9bdd0", card: "rgba(8,16,26,.94)", edge: "#1d3147", ui: ["#326c9f", "#95c6e4", "#06101c"] },
  outlines:  { r: ["#7e6fa6", "#6a7fb0", "#5b8fa6", "#4f7a8a", "#3d5560"], fo: 0.58, ln: "#e2e5e8", card: "rgba(14,18,20,.94)", edge: "#2c3640", ui: ["#4f6f8f", "#a9c4dc", "#0c1012"] },

/* marker colours per basemap: ten kinds (the last is the record layer), the record dots, and the thin edge drawn round each marker */

  outlines:  { k: ["#8cc0b2", "#a3b5dc", "#cf9c9c", "#bcaed6", "#e8e9ea", "#a9bb98", "#86b4c8", "#c4aa9e", "#aab2bc", "#c9ced4"], rec: "#c9ced4", edge: "#0c1012" },
  atlas:     { k: ["#2f6e5c", "#34507f", "#873a3a", "#5e4e7c", "#3a3530", "#4c5b39", "#2a6178", "#6a4b3d", "#4f5864", "#5a4e40"], rec: "#5a4e40", edge: "#f1e7d0" },
  hell:      { k: ["#9cc2b4", "#a9b6d8", "#efb2a9", "#ccb7d8", "#f3e6e0", "#b8c39d", "#93b8c8", "#dbb3a2", "#c1bbbf", "#ead2cc"], rec: "#ead2cc", edge: "#14080a" },
};
const mkp = () => MK[curBase] || MK.satellite;
const mk = (k) => mkp().k[KI[k]] || "#aaa";
/* swatches in the panels sit on dark cards, so the ink colours of the Atlas map are shown with their Jurassic equivalents */
const kcol = (k) => ((P.light ? MK.satellite : mkp()).k)[KI[k]] || "#aaa";
const halo = () => P.light ? "#f3efe4" : "#05060c";

/* ---------- state ---------- */
const S = { idx: false, kind: {}, rmin: 1, where: "all", y0: 0, y1: 9999, now: false, lens: "all", bandOn: [1, 1, 1, 1, 1],
  schools: true, arcs: true, pat: null, focus: null, sel: null, q: "", open: { kinds: false }, hw: {} };
KINDS.forEach((k) => { S.kind[k[0]] = true; });
const ERAS = [["all", "Any year", 0, 9999], ["now", "Since 2010", 2010, 2100], ["cold", "1945–1991", 1945, 1991], ["early", "Before 1945", 0, 1944]];

/* ---------- which office records pass the filters ---------- */
function offOK(o, s) {
  if (o[1] < S.rmin) return false;
  if (S.now && !o[4]) return false;
  if (S.y0 > 0 || S.y1 < 9999) { const y = o[2]; if (y == null) return false; const e = o[3] || (o[4] ? 2100 : y); if (e < S.y0 || y > S.y1) return false; }
  if (S.where !== "all") { if (!s.iso) return false; const ab = o[0] !== s.iso; if (S.where === "abroad" && !ab) return false; if (S.where === "home" && ab) return false; }
  return true;
}
function schOK(si) { const s = SCH[si]; if (!S.kind[s.k]) return false; if (S.pat && !PAT_BY[S.pat].set.has(si)) return false; return true; }
let AGG = null;
function recompute() {
  const pair = new Map(), cty = {}, sch = SCH.map(() => new Set()), ppl = new Set();
  LK.forEach((l, li) => {
    const si = l[1]; if (!schOK(si)) return;
    const s = SCH[si];
    l[3].forEach((o) => {
      if (!offOK(o, s)) return;
      const iso = o[0], pi = l[0];
      const key = si + "|" + iso; let pr = pair.get(key); if (!pr) { pr = { si, iso, p: new Set() }; pair.set(key, pr); } pr.p.add(pi);
      const c = cty[iso] || (cty[iso] = { all: new Set(), ab: new Set(), heads: new Set(), sch: new Set() });
      c.all.add(pi); if (s.iso && iso !== s.iso) c.ab.add(pi); if (o[1] >= 3) c.heads.add(pi); c.sch.add(si);
      sch[si].add(pi); ppl.add(pi);
    });
  });
  AGG = { pair, cty, sch, ppl };
}
const lensVal = (iso) => { const c = AGG.cty[iso]; if (!c) return 0; return S.lens === "abroad" ? c.ab.size : S.lens === "heads" ? c.heads.size : c.all.size; };
const BANDS = [[50, "50+"], [20, "20–49"], [8, "8–19"], [3, "3–7"], [1, "1–2"]];
const bandOf = (v) => v >= 50 ? 0 : v >= 20 ? 1 : v >= 8 ? 2 : v >= 3 ? 3 : v >= 1 ? 4 : -1;
const LENSES = [["all", "Office-holders trained at these schools", "Every person on the map who held a national office in this country and trained at one of the schools shown."],
  ["abroad", "Office-holders trained abroad", "Only those who trained at a school outside the country where they held office."],
  ["heads", "Heads of state or government", "Only presidents, prime ministers, monarchs and other heads of state or government."]];

/* ---------- map ---------- */
let proj = "globe", ready = false, map = null;
function panelRight() { try { const r = $("#key").getBoundingClientRect(), w = map.getContainer().clientWidth; if (r.width && r.right < w * 0.6) return r.right + 10; } catch (e) {} return 0; }
function rightBox() { try { const r = $("#rcol").getBoundingClientRect(), w = map.getContainer().clientWidth; if (r.width && r.left > w * 0.5) return w - r.left + 10; } catch (e) {} return 0; }
function freeBox() {
  const el = map ? map.getContainer() : $("#map"), W = el.clientWidth || 1200, H = el.clientHeight || 800;
  let L = 0, R = 0; try { L = panelRight(); R = rightBox(); } catch (e) {}
  if (W - L - R < 240) { L = 0; R = 0; }
  return { W, H, L, R, fw: W - L - R };
}
function startZoom() { const fb = freeBox(); return Math.max(0.2, Math.log2(0.86 * Math.max(220, Math.min(fb.H - 40, fb.fw - 20)) * Math.PI / 512)); }
function freeFlat() { try { if (proj === "mercator") map.setTransformConstrain((ll, z) => ({ center: new maplibregl.LngLat(Math.max(-360, Math.min(360, ll.lng)), Math.max(-84, Math.min(84, ll.lat))), zoom: Math.max(0, z) })); else map.setTransformConstrain(null); } catch (e) {} }
const BM = CulpritsBasemaps.create("map", { initial: "satellite", projection: "globe", plate: window.PLATE_IMG, center: [12, 30], zoom: 1.4,
  onApply: (k) => { P = PAL[k] || PAL.night; curBase = k; const u = P.ui, rs = document.documentElement.style; rs.setProperty("--accent", u[0]); rs.setProperty("--accent-hi", u[1]); rs.setProperty("--bg", u[2]); rs.setProperty("--card", P.card); rs.setProperty("--line", P.edge); if (ready) { order(); paint(); buildKey(); if (S.sel) reopen(); } },
  onReady: () => init() });
map = BM.maplibre;
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");
map.once("idle", () => { const a = map.getContainer().querySelector(".maplibregl-ctrl-attrib"); if (a) { a.classList.remove("maplibregl-compact-show"); a.removeAttribute("open"); } });
function wholeWorld() { const fb = freeBox(), padding = { left: fb.L, right: fb.R, top: 0, bottom: 0 };
  if (proj === "globe") map.flyTo({ center: [12, 25], zoom: startZoom(), padding, duration: 1200 });
  else { const z = Math.max(0, Math.log2(Math.min(fb.fw - 20, (fb.H - 40) * 1.55) / 512)); map.flyTo({ center: [10, 22], zoom: z, padding, duration: 1200 }); } }
const IDS = [];
function order() { const st = map.getStyle(); if (!st) return; const mine = new Set(IDS); const first = st.layers.find((l) => !mine.has(l.id) && (l.type === "symbol" || l.id === "labels")); IDS.forEach((id) => { if (map.getLayer(id)) map.moveLayer(id, first ? first.id : undefined); }); }

/* ---------- tooltip and glossary-style hints ---------- */
const tt = $("#ttip");
const QM = (txt) => txt ? '<span class="qm" data-tip="' + esc(txt) + '">?</span>' : '';
document.addEventListener("mouseover", (e) => { const q = e.target.closest && e.target.closest(".qm"); if (q) tip('<span class=mute>' + esc(q.dataset.tip) + '</span>', e.clientX, e.clientY); });
document.addEventListener("mouseout", (e) => { if (e.target.closest && e.target.closest(".qm")) tip(null); });
function tip(html, x, y) { if (!html) { tt.style.display = "none"; return; } tt.innerHTML = html; tt.style.display = "block"; const r = tt.getBoundingClientRect(); let L = x + 14, T = y + 12; if (L + r.width > innerWidth - 6) L = x - r.width - 12; if (T + r.height > innerHeight - 6) T = y - r.height - 10; tt.style.left = L + "px"; tt.style.top = T + "px"; }

/* ---------- arcs: a raised curve from the school to the capital where its former student held office ---------- */
function arc(a, b) {   // a, b as [lng, lat]
  let l1 = a[0], l2 = b[0]; while (l2 - l1 > 180) l2 -= 360; while (l2 - l1 < -180) l2 += 360;
  const dx = l2 - l1, dy = b[1] - a[1], d = Math.hypot(dx, dy);
  if (d < 0.05) return null;
  const mx = (l1 + l2) / 2, my = (a[1] + b[1]) / 2, k = Math.min(0.28, 0.12 + d / 900);
  const cx = mx - dy * k, cy = my + dx * k;

  for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; out.push([u * u * l1 + 2 * u * t * cx + t * t * l2, Math.max(-84, Math.min(84, u * u * a[1] + 2 * u * t * cy + t * t * b[1]))]); }

const FC = (f) => ({ type: "FeatureCollection", features: f });
const BOUND_URL = "https://welcometoyourgalaxy.github.io/culprits/data/boundaries.geojson";
function addLayers() {
  const T = (spec) => { map.addLayer(spec); IDS.push(spec.id); };
  map.addSource("bounds", { type: "geojson", data: BOUND_URL });
  T({ id: "cty-fill", type: "fill", source: "bounds", paint: { "fill-color": "rgba(0,0,0,0)", "fill-opacity": 0.55 } });
  T({ id: "cty-line", type: "line", source: "bounds", paint: { "line-color": "rgba(240,236,228,0.3)", "line-width": 0.5 } });
  T({ id: "cty-sel", type: "line", source: "bounds", filter: ["==", ["get", "iso3"], ""], paint: { "line-color": "#f0ece4", "line-width": 1.6 } });
  map.addSource("arcs", { type: "geojson", data: FC([]) });
  T({ id: "arc-glow", type: "line", source: "arcs", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": ["get", "c"], "line-width": ["*", ["get", "w"], 3], "line-blur": 3, "line-opacity": ["*", ["get", "o"], 0.18] } });
  T({ id: "arc-line", type: "line", source: "arcs", layout: { "line-cap": "round", "line-join": "round", "line-sort-key": ["get", "n"] }, paint: { "line-color": ["get", "c"], "line-width": ["get", "w"], "line-opacity": ["get", "o"] } });
  T({ id: "arc-hit", type: "line", source: "arcs", paint: { "line-color": "#000", "line-width": 12, "line-opacity": 0.001 } });
  map.addSource("caps", { type: "geojson", data: FC([]) });
  T({ id: "cap", type: "circle", source: "caps", paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 1, 1.6, 6, 3], "circle-color": ["get", "c"], "circle-opacity": 0.85, "circle-stroke-width": 0 } });
  map.addSource("schools", { type: "geojson", data: FC([]) });
  const RZ = (f) => ["interpolate", ["linear"], ["zoom"], 1, f(["get", "r"]), 6, f(["*", 1.35, ["get", "r"]])];
  T({ id: "sch-cut", type: "circle", source: "schools", filter: ["==", ["get", "d"], 1], paint: { "circle-radius": RZ((r) => ["+", r, 2.2]), "circle-color": "rgba(0,0,0,0)", "circle-stroke-color": ["get", "h"], "circle-stroke-width": 2.4, "circle-stroke-opacity": ["*", ["get", "o"], 0.5], "circle-pitch-alignment": "map" } });
  T({ id: "sch", type: "circle", source: "schools", layout: { "circle-sort-key": ["-", ["*", 100, ["get", "d"]], ["get", "r"]] }, paint: { "circle-radius": RZ((r) => r), "circle-color": ["get", "c"], "circle-opacity": ["*", ["get", "o"], 0.26], "circle-stroke-color": ["get", "c"], "circle-stroke-width": ["get", "sw"], "circle-stroke-opacity": ["get", "o"], "circle-pitch-alignment": "map" } });
  T({ id: "sch-core", type: "circle", source: "schools", filter: ["==", ["get", "d"], 1], paint: { "circle-radius": RZ((r) => ["max", 1.5, ["*", r, 0.36]]), "circle-color": ["get", "c"], "circle-opacity": ["*", ["get", "o"], 0.95], "circle-stroke-width": 0, "circle-pitch-alignment": "map" } });
  const hover = (id, html) => { map.on("mousemove", id, (e) => { map.getCanvas().style.cursor = "pointer"; tip(html(e.features[0].properties, e), e.originalEvent.clientX, e.originalEvent.clientY); });
    map.on("mouseleave", id, () => { map.getCanvas().style.cursor = ""; tip(null); }); };
  hover("sch", (p) => { const s = SCH[p.i]; return "<b>" + esc(s.n) + "</b><br><span class=mute>" + esc(s.k === "rec" ? SUBT[s.t] : KINDS[KI[s.k]][1]) + " · " + esc(where(s)) + (s.y ? " · since " + s.y : "") + "<br>" + p.n + (p.n === 1 ? " office-holder" : " office-holders") + " under the current filters</span>"; });
  hover("cap", (p) => "<b>" + esc(ISO_NAME[p.iso] || p.iso) + "</b><br><span class=mute>" + (AGG.cty[p.iso] ? AGG.cty[p.iso].all.size : 0) + " office-holders · click for who trained them</span>");
  hover("arc-hit", (p) => { const s = SCH[p.si]; return "<b>" + esc(s.n) + " → " + esc(ISO_NAME[p.iso] || p.iso) + "</b><br><span class=mute>" + p.n + (p.n === 1 ? " office-holder" : " office-holders") + " · click to list them</span>"; });
  map.on("mousemove", "cty-fill", (e) => { if (map.queryRenderedFeatures(e.point, { layers: ["sch", "arc-hit"] }).length) return; const iso = e.features[0].properties.iso3; if (!ISO_NAME[iso]) { tip(null); return; }
    map.getCanvas().style.cursor = "pointer"; const c = AGG.cty[iso];
    tip("<b>" + esc(ISO_NAME[iso]) + "</b><br><span class=mute>" + (c ? c.all.size + " office-holders trained at " + c.sch.size + (c.sch.size === 1 ? " school" : " schools") + " on the map" + (c.ab.size ? " · " + c.ab.size + " abroad" : "") : "No office-holders under the current filters") + "</span>", e.originalEvent.clientX, e.originalEvent.clientY); });
  map.on("mouseleave", "cty-fill", () => { map.getCanvas().style.cursor = ""; tip(null); });

    const f = map.queryRenderedFeatures([[e.point.x - 4, e.point.y - 4], [e.point.x + 4, e.point.y + 4]], { layers: ["sch", "cap", "arc-hit", "cty-fill"] });

function personRec(pi, offs, si) {

  const schools = [...new Set(BYP[pi].map((li) => LK[li][1]))];
  const lists = [...new Set(BYP[pi].filter((li) => LK[li][2]).map((li) => LK[li][2]))];
  return '<div class="rec"><div class="rh"><span class="sw dot" style="background:' + (si != null ? kcol(SCH[si].k) : "var(--mute)") + '"></span><b>' + esc(p[0]) + '</b><span class="n">' + esc(POSN[best[5]]) + (best[2] ? " · " + yrs(best) : "") + '</span></div>' +
    '<div class="rb">' + offs.map((o) => '<div>' + esc(POSN[o[5]]) + (o[2] ? ' <span class="mute">' + yrs(o) + '</span>' : '') + (CTY[o[0]] ? ' · <span class="mute">' + esc(CTY[o[0]].n) + '</span>' : '') + '</div>').join("") +
    '<div class="chips" style="margin-top:4px">' + schools.map((x) => '<span data-sch="' + x + '"><span class="sw dot" style="background:' + kcol(SCH[x].k) + '"></span>' + esc(SCH[x].n) + '</span>').join("") + '</div>' +
    '<div class="mute" style="font-size:11px;margin-top:4px">' + (p[1] ? '<a href="https://www.wikidata.org/wiki/' + p[1] + '" target="_blank" rel="noopener">Wikidata record</a>' : '') + (p[2] ? ' · <a href="https://en.wikipedia.org/wiki/' + encodeURIComponent(p[2].replace(/ /g, "_")) + '" target="_blank" rel="noopener">Wikipedia</a>' : '') + (lists.length ? ' · listed in ' + lists.map((u) => '<a href="' + esc(D.LISTS[u][1]) + '" target="_blank" rel="noopener">' + esc(D.LISTS[u][0]) + '</a>').join(", ") : '') + ' · <span data-per="' + pi + '" style="cursor:pointer;text-decoration:underline">open</span></div></div></div>';
}
function peopleOf(si, iso) {   // [[pi, offices]] for a school, optionally one country
  const m = new Map();
  BYS[si].forEach((li) => { const offs = visOffices(li).filter((o) => !iso || o[0] === iso); if (offs.length) { const pi = LK[li][0]; m.set(pi, (m.get(pi) || []).concat(offs)); } });
  return [...m.entries()].sort((a, b) => Math.max(...b[1].map((o) => o[1])) - Math.max(...a[1].map((o) => o[1])) || Math.max(...b[1].map((o) => o[2] || 0)) - Math.max(...a[1].map((o) => o[2] || 0)));
}
function kindBar(counts) { const t = counts.reduce((a, b) => a + b, 0) || 1; return '<div class="kbar">' + counts.map((n, i) => n ? '<span title="' + esc(KINDS[i][1]) + ': ' + n + '" style="width:' + (100 * n / t) + '%;background:' + kcol(KINDS[i][0]) + '"></span>' : '').join("") + '</div>'; }
function openSchool(si, fly) {
  const s = SCH[si]; recompute();
  const ppl = peopleOf(si), byC = {};
  ppl.forEach(([pi, offs]) => offs.forEach((o) => { (byC[o[0]] = byC[o[0]] || new Set()).add(pi); }));
  const cs = Object.keys(byC).sort((a, b) => byC[b].size - byC[a].size);
  const heads = ppl.filter(([, offs]) => offs.some((o) => o[1] >= 3)).length;
  const rec = s.k === "rec";
  let h = '<div class="hp-k">' + esc(rec ? KINDS[KI.rec][1] + " · " + SUBT[s.t] : KINDS[KI[s.k]][1]) + '</div><h3>' + esc(s.n) + '</h3><div class="hp-sub">' + esc(where(s)) + (s.y ? ' · founded ' + s.y : '') + (s.end ? ' · closed ' + s.end : '') + '</div>';
  if (rec) h += '<div class="hp-desc">This school is on the map because Wikidata records people who studied here and later held national office. There is no writeup for it yet; the list below is the whole of what the record shows.' + (s.lat == null ? ' Wikidata gives no location for it, so it has no dot on the globe.' : '') + '</div>';
  else {
    h += '<table class="kv"><tr><th>Behind it</th><td style="text-align:left">' + esc(s.hand) + '</td></tr><tr><th>How people get in</th><td style="text-align:left">' + esc(s.sel) + '</td></tr></table>';
    h += '<div class="hp-desc">' + esc(s.d) + '</div>';
  }
  const pats = PATS.filter((p) => p.set.has(si));
  if (pats.length) h += '<div class="hp-h">Patterns</div><div class="chips">' + pats.map((p) => '<span class="pchip" data-pat="' + p.id + '">' + esc(p.title) + '</span>').join("") + '</div>';
  h += '<div class="hp-h">Former students in national office' + QM("Under the filters now set. From Wikidata and published lists; see Method.") + '</div>';
  if (!ppl.length) h += '<div class="sub">None recorded under the current filters. Wikidata holds few records of who attended programmes like this one, so this is a gap in the record, not proof that none exist.</div>';
  else {
    h += '<div class="pp">' + ppl.length + (ppl.length === 1 ? ' person' : ' people') + ' in ' + cs.length + (cs.length === 1 ? ' country' : ' countries') + (heads ? ', ' + heads + ' of them heads of state or government' : '') + '.</div>';
    h += '<div class="chips">' + cs.slice(0, 40).map((iso) => '<span data-cty="' + iso + '">' + esc(CTY[iso] ? CTY[iso].n : iso) + ' <span class="n">' + byC[iso].size + '</span></span>').join("") + (cs.length > 40 ? '<span class="est">and ' + (cs.length - 40) + ' more</span>' : '') + '</div>';
    h += '<div style="margin-top:8px">' + ppl.slice(0, 300).map(([pi, offs]) => personRec(pi, offs, si)).join("") + (ppl.length > 300 ? '<div class="sub">' + (ppl.length - 300) + ' more; narrow the filters to see them.</div>' : '') + '</div>';
  }
  h += srcList((s.src || (s.wp ? [["Wikipedia", "https://en.wikipedia.org/wiki/" + encodeURIComponent(s.wp.replace(/ /g, "_"))]] : [])).concat([["Wikidata", "https://www.wikidata.org/wiki/" + (s.q || "")]]).filter((x) => x[1] !== "https://www.wikidata.org/wiki/"));
  show(h, ["s", si], si);
  if (fly && s.lat != null) map.flyTo({ center: [s.lng, s.lat], zoom: Math.max(map.getZoom(), 3), duration: 900 });
}
function openPair(si, iso) {
  const s = SCH[si], ppl = peopleOf(si, iso);
  let h = '<div class="hp-k">Pipeline</div><h3>' + esc(s.n) + ' → ' + esc(CTY[iso] ? CTY[iso].n : iso) + '</h3><div class="hp-sub">' + ppl.length + (ppl.length === 1 ? ' person' : ' people') + ' trained here and later held national office in ' + esc(CTY[iso] ? CTY[iso].n : iso) + '</div>';
  h += '<div class="chips"><span data-sch="' + si + '"><span class="sw dot" style="background:' + kcol(s.k) + '"></span>' + esc(s.n) + '</span><span data-cty="' + iso + '">' + esc(CTY[iso] ? CTY[iso].n : iso) + '</span></div><div style="margin-top:8px">' + ppl.map(([pi, offs]) => personRec(pi, offs, si)).join("") + '</div>';
  show(h, ["a", si, iso], si);
}
function openCountry(iso, fly) {
  recompute();
  const c = CTY[iso], A = AGG.cty[iso], acc = D.ACC[iso], T = D.T[iso];
  let h = '<div class="hp-k">Country</div><h3>' + esc(c ? c.n : iso) + '</h3>';
  if (acc) h += '<div class="hp-h">Behind the scenes</div><div class="bts">' + acc.d.map((x) => '<p>' + esc(x) + '</p>').join("") + '</div>' + (acc.src && acc.src.length ? srcList(acc.src) : '');
  const TMn = (D.TM && D.TM[iso]) || 0;
  if (T) h += '<div class="note">Wikidata records ' + T[0].toLocaleString() + ' people who held national office in ' + esc(c ? c.n : iso) + '. ' + TMn.toLocaleString() + ' of them (' + Math.round(100 * TMn / Math.max(1, T[0])) + '%) went through one of the schools and programmes on this map. The others trained elsewhere or have no training on record.</div>';
  if (!A) { h += '<div class="sub">No office-holders on the map under the current filters. Wikidata records education unevenly, so this can mean the record is thin rather than that no leader trained at these schools.</div>'; show(h, ["c", iso]); return; }
  const groups = []; const kc = KINDS.map(() => 0); h += '<div class="hp-h">The record</div>';
  A.sch.forEach((si) => { const ppl = peopleOf(si, iso); if (ppl.length) { groups.push([si, ppl]); kc[KI[SCH[si].k]] += ppl.length; } });
  groups.sort((a, b) => b[1].length - a[1].length);
  const headsAll = A.heads.size, abroadHeads = [...A.heads].filter((pi) => A.ab.has(pi)).length;
  h += '<div class="hp-sub">' + A.all.size + ' office-holders trained at ' + A.sch.size + (A.sch.size === 1 ? ' school' : ' schools') + ' on the map · ' + A.ab.size + ' of them abroad</div>' + kindBar(kc);
  const top = groups[0], topAb = groups.find(([si]) => SCH[si].iso !== iso);
  let plain = '';
  if (headsAll) plain += 'Of the ' + headsAll + (headsAll === 1 ? ' head of state or government' : ' heads of state or government') + ' on the map for ' + (c ? c.n : iso) + ', ' + abroadHeads + ' trained abroad. ';
  if (topAb) plain += 'The foreign school that appears most often is ' + SCH[topAb[0]].n + ', with ' + topAb[1].length + (topAb[1].length === 1 ? ' former student' : ' former students') + ' in national office. ';
  if (top && (!topAb || top[0] !== topAb[0])) plain += 'At home, the leading pipeline is ' + SCH[top[0]].n + ' (' + top[1].length + '). ';
  if (plain) h += '<div class="imp-box">' + esc(plain.trim()) + '</div>';
  h += '<div class="hp-h">Who trained them</div>' + groups.map(([si, ppl]) => '<div class="grp' + (groups.length <= 3 ? ' open' : '') + '"><div class="gh"><span class="car">▸</span><span class="sw dot" style="background:' + kcol(SCH[si].k) + '"></span><b>' + esc(SCH[si].n) + '</b><span class="n">' + ppl.length + '</span><span class="n" data-sch="' + si + '" style="cursor:pointer;text-decoration:underline">school</span></div><div class="gb">' + ppl.map(([pi, offs]) => personRec(pi, offs, si)).join("") + '</div></div>').join("");
  show(h, ["c", iso]);
  if (fly && c) map.flyTo({ center: [c.lng, c.lat], zoom: Math.max(map.getZoom(), 3), duration: 900 });
}
function openPerson(pi) {
  const p = PE[pi], links = BYP[pi];
  const offs = []; links.forEach((li) => LK[li][3].forEach((o) => { if (!offs.some((x) => x[5] === o[5])) offs.push(o); }));
  offs.sort((a, b) => (a[2] || 0) - (b[2] || 0));
  let h = '<div class="hp-k">Office-holder</div><h3>' + esc(p[0]) + '</h3><div class="hp-sub">' + (p[3] ? 'Born ' + p[3] : '') + (p[4] ? ' · died ' + p[4] : '') + '</div>';
  h += '<div class="hp-h">Trained at</div><div class="chips">' + [...new Set(links.map((li) => LK[li][1]))].map((x) => '<span data-sch="' + x + '"><span class="sw dot" style="background:' + kcol(SCH[x].k) + '"></span>' + esc(SCH[x].n) + '</span>').join("") + '</div>';
  h += '<div class="hp-h">National offices</div>' + offs.map((o) => '<div class="tl"><b>' + esc(yrs(o) || "–") + '</b>' + esc(POSN[o[5]]) + (CTY[o[0]] ? ' · <span data-cty="' + o[0] + '" style="cursor:pointer;text-decoration:underline">' + esc(CTY[o[0]].n) + '</span>' : '') + '</div>').join("");
  h += '<div class="hp-src">Sources: ' + (p[1] ? '<a href="https://www.wikidata.org/wiki/' + p[1] + '" target="_blank" rel="noopener">Wikidata ' + p[1] + '</a>' : '') + (p[2] ? ' · <a href="https://en.wikipedia.org/wiki/' + encodeURIComponent(p[2].replace(/ /g, "_")) + '" target="_blank" rel="noopener">Wikipedia</a>' : '') + '</div>';
  show(h, ["k", pi]);

function openPattern(id) {
  const p = PAT_BY[id]; if (!p) return; recompute();
  const cs = Object.keys(AGG.cty).sort((a, b) => AGG.cty[b].all.size - AGG.cty[a].all.size);

  h += '<div class="hp-h">Where their former students hold or held office</div><div class="chips">' + cs.slice(0, 50).map((iso) => '<span data-cty="' + iso + '">' + esc(CTY[iso] ? CTY[iso].n : iso) + ' <span class="n">' + AGG.cty[iso].all.size + '</span></span>').join("") + (cs.length > 50 ? '<span class="est">and ' + (cs.length - 50) + ' more</span>' : '') + '</div>';

function openHyp(id) {
  const y = HYP.find((x) => x.id === id); if (!y) return;
  let h = '<div class="hp-k">Possible pattern · nothing proved yet</div><h3>' + esc(y.title) + '</h3><div class="note">This is not a finding and not evidence. It describes something that is probably happening but has not been proved, and it is counted in no figure on the map.</div>' + y.story.map((x) => '<div class="hp-desc">' + esc(x) + '</div>').join("");
  h += '<div class="hp-h">Schools it concerns</div><div class="chips">' + y.schools.map((x) => SID[x]).filter((x) => x != null).map((si) => '<span class="est" data-sch="' + si + '">' + esc(SCH[si].n) + '</span>').join("") + '</div>';

function openStack(list) {
  const h = '<div class="hp-k">' + list.length + ' schools here</div><h3>Several schools share this spot</h3>' + list.map((si) => '<div class="rec stk" data-sch="' + si + '"><div class="rh"><span class="sw dot" style="background:' + kcol(SCH[si].k) + '"></span><b>' + esc(SCH[si].n) + '</b><span class="n">' + AGG.sch[si].size + '</span></div></div>').join("");
  show(h, null);

/* ---------- background ---------- */
function stars() {
  let seed = 1977; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const Wd = 1400, H = 1000, c = document.createElement("canvas"); c.width = Wd; c.height = H; const g = c.getContext("2d");
  g.fillStyle = "#03040a"; g.fillRect(0, 0, Wd, H);
  const tints = ["255,255,255", "214,224,255", "236,232,246", "224,236,240"];
  for (let i = 0; i < 2600; i++) { const x = rnd() * Wd, y = rnd() * H, r = .25 + rnd() * .55; g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = "rgba(" + tints[(rnd() * 4) | 0] + "," + (.15 + rnd() * .55) + ")"; g.fill(); }
  const el = $("#map"); el.style.background = '#03040a url(' + c.toDataURL("image/jpeg", .9) + ') repeat'; el.style.backgroundSize = Wd + "px " + H + "px";
  const drift = () => { const ct = map.getCenter(), z = map.getZoom(); el.style.backgroundPosition = Math.round(-ct.lng * 3) + "px " + Math.round(ct.lat * 3 + z * 6) + "px"; };
  map.on("move", drift); drift();
}
function init() {
  recompute();
  PATS.forEach((p) => { const sv = S.pat; S.pat = p.id; recompute(); p.reach = Object.keys(AGG.cty).length; S.pat = sv; }); recompute();
  addLayers(); buildKey(); buildTr(); stars();
  $("#detX").addEventListener("click", deselect);
  $("#worldBtn").addEventListener("click", wholeWorld);
  $("#toggleKey").addEventListener("click", () => { const p = $("#key"); p.classList.toggle("min"); $("#toggleKey").textContent = p.classList.contains("min") ? "+" : "−"; sizeBoxes(); });
  $("#toggleTr").addEventListener("click", () => { const p = $("#tr"); p.classList.toggle("min"); $("#toggleTr").textContent = p.classList.contains("min") ? "Basemap +" : "−"; sizeBoxes(); });
  $("#togglePat").addEventListener("click", () => { const p = $("#patBox"); p.classList.toggle("min"); $("#togglePat").textContent = p.classList.contains("min") ? "+" : "−"; sizeBoxes(); });
  $("#toggleLeg").addEventListener("click", () => { const p = $("#legBox"); p.classList.toggle("min"); $("#toggleLeg").textContent = p.classList.contains("min") ? "+" : "−"; sizeBoxes(); });
  try { const ro = new ResizeObserver(() => stackBoxes()); ["#key", "#tr"].forEach((s) => ro.observe($(s))); } catch (e) {}
  addEventListener("resize", sizeBoxes);
  if (innerWidth <= 820) { $("#key").classList.add("min"); $("#toggleKey").textContent = "+"; $("#tr").classList.add("min"); $("#toggleTr").textContent = "Basemap +"; }
  ready = true; order(); paint();
  map.jumpTo({ center: [12, 25], zoom: startZoom(), padding: { left: freeBox().L, right: freeBox().R, top: 0, bottom: 0 } });
}
window.pipelines = { S, openSchool, openCountry, setPattern, refresh, map: () => map };

/* ---------- about and sources ---------- */
const info = $("#info"); info.innerHTML = __ABOUT__;
const story = $("#story"); story.innerHTML = __STORY__;
const openInfo = (on) => info.classList.toggle("open", on), openStory = (on) => story.classList.toggle("open", on);
$("#storyBtn").addEventListener("click", () => openStory(true));
$("#storyBtn").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openStory(true); } });
$("#storyClose").addEventListener("click", () => openStory(false));
$("#infoBtn").addEventListener("click", () => openInfo(true));
$("#infoBtn").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openInfo(true); } });
$("#infoClose").addEventListener("click", () => openInfo(false));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { openStory(false); openInfo(false); if (S.sel) deselect(); } });
})();
