 {k:"corp",n:"Corporations and employers",  c:"#7e9480", cl:"#4e6650", d:"The firms that set wages directly, or set the price their suppliers can pay."},
 {k:"pers",n:"Owners and individuals",      c:"#a8807a", cl:"#7c524c", d:"Named people whose own holdings or decisions are the mechanism."},
 {k:"state",n:"States and governments",     c:"#8a7f9e", cl:"#5d5273", d:"Governments whose law, tax or land policy produces the distribution."},
 {k:"inst",n:"Agencies and international bodies",c:"#86898f",cl:"#555a61",d:"Lenders, regulators and rule-writers with cross-border reach."},
 {k:"doc", n:"Doctrines and idea factories",c:"#9d8f76", cl:"#6d5f46", d:"Where the argument was written, funded and kept until a government used it."},
 {k:"enab",n:"Enablers: accounting, law, havens",c:"#7b8c8c",cl:"#4a5c5c",d:"The professional machinery that makes a fortune hard to find or tax."},
 {k:"lab", n:"Labour-control systems",      c:"#96707a", cl:"#6a4650", d:"Legal arrangements that remove a worker's ability to leave."}
];
var MECHS=[
 {k:"own",  n:"Ownership concentration"},
 {k:"wage", n:"Wage suppression"},
 {k:"tax",  n:"Tax avoidance and secrecy"},
 {k:"debt", n:"Debt and creditor power"},
 {k:"rent", n:"Rent and land extraction"},
 {k:"price",n:"Price and market power"},
 {k:"law",  n:"Lawmaking capture"},
 {k:"aust", n:"Austerity and public cuts"},
 {k:"mob",  n:"Immobility and coercion"},
 {k:"chain",n:"Supply-chain squeeze"},
 {k:"priv", n:"Privatisation"},
 {k:"inh",  n:"Inheritance and dynasty"},
 {k:"disc", n:"Discrimination and exclusion"}
];
var REACH=[{k:"global",n:"Worldwide",r:7.2},{k:"regional",n:"Regional",r:6},{k:"national",n:"One country",r:5}];
var TY={},MC={},RC={};
TYPES.forEach(function(t){TY[t.k]=t});MECHS.forEach(function(m){MC[m.k]=m});REACH.forEach(function(r){RC[r.k]=r});

/* ---------- state ---------- */
var S={types:{},mechs:{},reach:{},pat:null,q:"",sel:null,light:false};
TYPES.forEach(function(t){S.types[t.k]=true});
MECHS.forEach(function(m){S.mechs[m.k]=true});
REACH.forEach(function(r){S.reach[r.k]=true});

function col(e){return S.light?TY[e.t].cl:TY[e.t].c}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function anyMech(e){for(var i=0;i<e.mx.length;i++){if(S.mechs[e.mx[i]])return true}return false}
function passes(e){
  if(!S.types[e.t])return false;
  if(!S.reach[e.rch])return false;
  if(!anyMech(e))return false;
  if(S.pat&&e.pt.indexOf(S.pat)<0)return false;
  if(S.q){var q=S.q.toLowerCase();
    if((e.n+" "+e.pl+" "+e.ad+" "+e.ro+" "+(e.who||"")).toLowerCase().indexOf(q)<0)return false}
  return true;
}
function shown(){return ENTS.filter(passes)}

/* ---------- map ---------- */
var ESRI="https://services.arcgisonline.com/arcgis/rest/services/";
var E_DARK=[ESRI+"Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}"];
var E_LIGHT=[ESRI+"Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}"];
var E_DLAB=[ESRI+"Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}"];
var E_LLAB=[ESRI+"Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}"];
var E_IMG=["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"];
var E_IMGLAB=[ESRI+"Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"];
var E_HILL=[ESRI+"Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}"];
var ESRI_ATTR='Basemap &copy; <a href="https://www.esri.com/" target="_blank" rel="noopener">Esri</a>, HERE, Garmin, &copy; OpenStreetMap contributors';

var map=new maplibregl.Map({
  container:"map",
  style:{version:8,sources:{
    sat:{type:"raster",tiles:E_IMG,tileSize:256,maxzoom:19,attribution:"Imagery &copy; Esri, Maxar, Earthstar Geographics"},
    dark:{type:"raster",tiles:E_DARK,tileSize:256,maxzoom:16,attribution:ESRI_ATTR},
    lightb:{type:"raster",tiles:E_LIGHT,tileSize:256,maxzoom:16,attribution:ESRI_ATTR},
    hill:{type:"raster",tiles:E_HILL,tileSize:256,maxzoom:16,attribution:"Hillshade &copy; Esri"},
    dlab:{type:"raster",tiles:E_DLAB,tileSize:256,maxzoom:16,attribution:ESRI_ATTR},
    llab:{type:"raster",tiles:E_LLAB,tileSize:256,maxzoom:16,attribution:ESRI_ATTR},
    ilab:{type:"raster",tiles:E_IMGLAB,tileSize:256,maxzoom:16,attribution:ESRI_ATTR}
  },layers:[
    {id:"bg",type:"background",paint:{"background-color":"#070d10"}},
    {id:"l-sat",type:"raster",source:"sat",layout:{visibility:"none"},paint:{"raster-opacity":1,"raster-brightness-max":.93,"raster-saturation":.08,"raster-contrast":.04}},
    {id:"l-dark",type:"raster",source:"dark",layout:{visibility:"visible"},paint:{"raster-opacity":1}},
    {id:"l-light",type:"raster",source:"lightb",layout:{visibility:"none"},paint:{"raster-opacity":1}},
    {id:"l-hill",type:"raster",source:"hill",layout:{visibility:"none"},paint:{"raster-opacity":["interpolate",["linear"],["zoom"],3,.14,8,.3,13,.42]}},
    {id:"l-dlab",type:"raster",source:"dlab",layout:{visibility:"visible"},paint:{"raster-opacity":.85}},
    {id:"l-llab",type:"raster",source:"llab",layout:{visibility:"none"},paint:{"raster-opacity":.9}},
    {id:"l-ilab",type:"raster",source:"ilab",layout:{visibility:"none"},paint:{"raster-opacity":.88}}
  ],projection:{type:"globe"},sky:{"sky-color":"#0a1419","horizon-color":"#1a2a33","fog-color":"#0b1014","sky-horizon-blend":.55,"horizon-fog-blend":.5,"fog-ground-blend":.6,"atmosphere-blend":["interpolate",["linear"],["zoom"],0,.85,5,.4,7,0]}},
  center:[-22,22],zoom:1.8,minZoom:.8,maxZoom:18,attributionControl:{compact:true}
});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
try{map.setProjection({type:"globe"})}catch(e){}
map.on("style.load",function(){try{map.setProjection({type:"globe"})}catch(e){}});

var BASES=[{k:"dark",n:"Dark atlas",lay:"l-dark",light:false},{k:"sat",n:"Satellite",lay:"l-sat",light:false},{k:"light",n:"Light atlas",lay:"l-light",light:true}];
var curBase="dark",showLabels=true,showHill=false;

function applyBase(){
  BASES.forEach(function(b){map.setLayoutProperty(b.lay,"visibility",b.k===curBase?"visible":"none")});
  var b=BASES.filter(function(x){return x.k===curBase})[0];
  S.light=!!b.light;
  document.body.classList.toggle("lightbase",S.light);
  map.setLayoutProperty("l-dlab","visibility",(showLabels&&curBase==="dark")?"visible":"none");
  map.setLayoutProperty("l-llab","visibility",(showLabels&&curBase==="light")?"visible":"none");
  map.setLayoutProperty("l-ilab","visibility",(showLabels&&curBase==="sat")?"visible":"none");
  map.setLayoutProperty("l-hill","visibility",showHill?"visible":"none");
  map.setPaintProperty("bg","background-color",S.light?"#e9e6e0":"#070d10");
  paintDots();drawKey();drawLeg();drawPats();
  if(S.sel)openDet(S.sel);
}

/* ---------- points ---------- */
function fc(list){
  return {type:"FeatureCollection",features:list.map(function(e){
    return {type:"Feature",id:e.i,geometry:{type:"Point",coordinates:[e.lon,e.lat]},
      properties:{id:e.id,n:e.n,t:e.t,pl:e.pl,c:col(e),r:RC[e.rch].r}}
  })};
}
function paintDots(){
  if(!map.getSource("ents"))return;
  map.getSource("ents").setData(fc(shown()));
  map.setPaintProperty("e-dot","circle-stroke-color",S.light?"rgba(255,255,255,.92)":"rgba(255,255,255,.82)");
  map.setPaintProperty("e-halo","circle-color",S.light?"#ffffff":"#000000");
}
map.on("load",function(){
  map.addSource("ents",{type:"geojson",data:fc(shown())});
  map.addLayer({id:"e-halo",type:"circle",source:"ents",paint:{
    "circle-radius":["interpolate",["linear"],["zoom"],1,["+",["get","r"],3.4],6,["+",["get","r"],5],12,["+",["get","r"],7]],
    "circle-color":"#000000","circle-opacity":.3,"circle-blur":.6}});
  map.addLayer({id:"e-sel",type:"circle",source:"ents",filter:["==",["get","id"],"__none__"],paint:{
    "circle-radius":["interpolate",["linear"],["zoom"],1,["+",["get","r"],6],12,["+",["get","r"],11]],
    "circle-color":"rgba(0,0,0,0)","circle-stroke-color":"#9dbdc0","circle-stroke-width":1.6,"circle-stroke-opacity":.95}});
  map.addLayer({id:"e-dot",type:"circle",source:"ents",paint:{
    "circle-radius":["interpolate",["linear"],["zoom"],1,["*",["get","r"],.72],4,["get","r"],10,["*",["get","r"],1.5]],
    "circle-color":["get","c"],"circle-stroke-color":"rgba(255,255,255,.82)","circle-stroke-width":1,"circle-opacity":.96}});

  var tt=document.getElementById("ttip");
  map.on("mousemove","e-dot",function(ev){
    map.getCanvas().style.cursor="pointer";
    var p=ev.features[0].properties;
    tt.innerHTML="<b>"+esc(p.n)+"</b><span class='tm'>"+esc(p.pl)+" &middot; "+esc(TY[p.t].n)+"</span>";
    tt.style.display="block";tt.style.left=(ev.originalEvent.clientX+13)+"px";tt.style.top=(ev.originalEvent.clientY+13)+"px";
  });
  map.on("mouseleave","e-dot",function(){map.getCanvas().style.cursor="";tt.style.display="none"});
  map.on("click","e-dot",function(ev){
    var id=ev.features[0].properties.id;
    var e=ENTS.filter(function(x){return x.id===id})[0];
    if(e){openDet(e);flyTo(e,false)}
  });
  drawKey();drawLeg();drawPats();drawBase();sizeBoxes();
});

function flyTo(e,zoomIn){
  map.flyTo({center:[e.lon,e.lat],zoom:Math.max(map.getZoom(),zoomIn?9:4.2),duration:1300,essential:true});
}
function selectEnt(e){
  S.sel=e;
  if(map.getLayer("e-sel"))map.setFilter("e-sel",["==",["get","id"],e?e.id:"__none__"]);
}

/* ---------- detail card ---------- */
function patChip(pid){
  var p=PATS.filter(function(x){return x.id===pid})[0];
  if(!p)return "";
  return "<span data-pat='"+p.id+"'>"+esc(p.n)+"</span>";
}
function openDet(e){
  selectEnt(e);
  var h="";
  h+="<div class='hp-k'>"+esc(TY[e.t].n)+"</div>";
  h+="<h3>"+esc(e.n)+"</h3>";
  h+="<p class='hp-sub'>"+esc(e.pl)+" &middot; reach: "+esc(RC[e.rch].n.toLowerCase())+"</p>";
  h+="<p class='hp-role'>"+esc(e.ro)+"</p>";
  h+="<div class='hp-h'>Where to find it</div>";
  h+="<div class='addr'><div class='ab'>"+esc(e.ad)+
     (e.who?"<div class='ac'>"+esc(e.who)+"</div>":"")+"</div>"+
     "<button class='btn' data-copy=\""+esc(e.ad)+"\" title='Copy the address'>Copy</button></div>";
  if(e.fg&&e.fg.length){
    h+="<div class='hp-h'>Figures</div><table class='kv'>";
    e.fg.forEach(function(f){h+="<tr><th>"+esc(f[0])+"</th><td>"+esc(f[1])+"</td></tr>"});
    h+="</table>";
  }
  h+="<div class='hp-h'>The rundown</div><div class='bts'>";
  String(e.rd).split("\n").forEach(function(par){if(par.trim())h+="<p>"+esc(par)+"</p>"});
  h+="</div>";
  h+="<div class='imp-box'><span class='ih'>What this means, plainly</span>"+esc(e.mn)+"</div>";
  h+="<div class='hp-h'>Mechanisms</div><div class='chips'>";
  e.mx.forEach(function(m){if(MC[m])h+="<span data-mech='"+m+"'>"+esc(MC[m].n)+"</span>"});
  h+="</div>";
  if(e.pt&&e.pt.length){h+="<div class='hp-h'>Patterns it belongs to</div><div class='chips'>"+e.pt.map(patChip).join("")+"</div>"}
  h+="<div class='hp-src'><b>Sources.</b>";
  e.sr.forEach(function(s){h+="<div><a href='"+esc(s[1])+"' target='_blank' rel='noopener'>"+esc(s[0])+"</a></div>"});
  h+="</div>";
  var d=document.getElementById("det");
  document.getElementById("detBody").innerHTML=h;
  d.classList.add("open");d.scrollTop=0;
  d.style.left="50%";d.style.top="50%";d.style.transform="translate(-50%,-50%)";
}
function closeDet(){document.getElementById("det").classList.remove("open");selectEnt(null)}
document.getElementById("detX").onclick=closeDet;
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"){closeDet();closeOv()}});
document.getElementById("det").addEventListener("click",function(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.copy!==undefined){
    var v=t.dataset.copy;
    if(navigator.clipboard){navigator.clipboard.writeText(v).then(function(){t.textContent="Copied"},function(){t.textContent="Select it"})}
    else{t.textContent="Select it"}
    setTimeout(function(){t.textContent="Copy"},1600);return;
  }
  if(t.dataset&&t.dataset.pat){openPat(t.dataset.pat);return}
  if(t.dataset&&t.dataset.mech){
    MECHS.forEach(function(m){S.mechs[m.k]=(m.k===t.dataset.mech)});
    refresh();return;
  }
});
/* drag */
(function(){
  var d=document.getElementById("det"),g=document.getElementById("detGrip"),drag=false,sx=0,sy=0,ox=0,oy=0;
  function down(ev){drag=true;d.classList.add("dragging");
    var r=d.getBoundingClientRect();d.style.transform="none";d.style.left=r.left+"px";d.style.top=r.top+"px";
    ox=r.left;oy=r.top;var p=ev.touches?ev.touches[0]:ev;sx=p.clientX;sy=p.clientY;ev.preventDefault()}
  function move(ev){if(!drag)return;var p=ev.touches?ev.touches[0]:ev;
    d.style.left=(ox+p.clientX-sx)+"px";d.style.top=(oy+p.clientY-sy)+"px"}
  function up(){drag=false;d.classList.remove("dragging")}
  g.addEventListener("mousedown",down);g.addEventListener("touchstart",down,{passive:false});
  window.addEventListener("mousemove",move);window.addEventListener("touchmove",move,{passive:false});
  window.addEventListener("mouseup",up);window.addEventListener("touchend",up);
})();

/* ---------- left key ---------- */
function cnt(fn){var n=0;ENTS.forEach(function(e){if(fn(e))n++});return n}
function drawKey(){
  var h="";
  h+="<div class='psec'>What kind of culprit</div>";
  TYPES.forEach(function(t){
    var n=cnt(function(e){return e.t===t.k});
    h+="<div class='row"+(S.types[t.k]?"":" off")+"' data-type='"+t.k+"'><span class='sw' style='background:"+(S.light?t.cl:t.c)+"'></span><span>"+esc(t.n)+"</span><span class='n'>"+n+"</span></div>";
  });
  h+="<div style='margin-top:5px'><span class='frst' data-all='types'>all</span> &middot; <span class='frst' data-none='types'>none</span></div>";

  h+="<div class='psec'>How it is done</div><div class='fchips'>";
  MECHS.forEach(function(m){
    var n=cnt(function(e){return e.mx.indexOf(m.k)>=0});
    h+="<span class='fc"+(S.mechs[m.k]?" on":"")+"' data-mech='"+m.k+"'>"+esc(m.n)+"<span class='n'>"+n+"</span></span>";
  });
  h+="</div><div><span class='frst' data-all='mechs'>all</span> &middot; <span class='frst' data-none='mechs'>none</span></div>";

  h+="<div class='psec'>How far it reaches</div><div class='fchips'>";
  REACH.forEach(function(r){
    var n=cnt(function(e){return e.rch===r.k});
    h+="<span class='fc"+(S.reach[r.k]?" on":"")+"' data-reach='"+r.k+"'>"+esc(r.n)+"<span class='n'>"+n+"</span></span>";
  });
  h+="</div>";

  h+="<div class='psec'>Find</div>";
  h+="<input class='inp' id='q' type='text' placeholder='name, city, street, person' value=\""+esc(S.q)+"\">";
  h+="<div id='flist' class='scroll'></div>";
  h+="<div style='margin-top:8px;display:flex;gap:6px;flex-wrap:wrap'><button class='btn' id='csvBtn'>Download this list (CSV)</button><button class='btn' id='rstBtn'>Reset filters</button></div>";
  h+="<p class='hint'>Addresses are registered offices, headquarters and official premises &mdash; the places that answer for the decisions. No private homes.</p>";
  document.getElementById("keyBody").innerHTML=h;

  var q=document.getElementById("q");
  q.oninput=function(){S.q=q.value;refresh(true)};
  document.getElementById("csvBtn").onclick=csv;
  document.getElementById("rstBtn").onclick=function(){
    TYPES.forEach(function(t){S.types[t.k]=true});MECHS.forEach(function(m){S.mechs[m.k]=true});
    REACH.forEach(function(r){S.reach[r.k]=true});S.pat=null;S.q="";refresh()};
  drawFind();
  var n=shown().length;
  document.getElementById("lede2").textContent=n+" of "+ENTS.length+" entries shown"+(S.pat?" — pattern filter on":"");
}
function drawFind(){
  var el=document.getElementById("flist");if(!el)return;
  var list=shown();
  if(!S.q&&!S.pat){el.innerHTML="<p class='hint'>Type to search, or click a point. Showing "+list.length+" entries.</p>";return}
  var h="";
  list.slice(0,60).forEach(function(e){
    h+="<div class='fi' data-go='"+e.id+"'><span class='sw' style='background:"+col(e)+";margin-top:3px'></span><span><b>"+esc(e.n)+"</b><span class='fm'>"+esc(e.pl)+"</span></span></div>";
  });
  if(list.length>60)h+="<p class='hint'>"+(list.length-60)+" more — narrow the search.</p>";
  if(!list.length)h+="<p class='hint'>Nothing matches.</p>";
  el.innerHTML=h;
}
document.getElementById("key").addEventListener("click",function(ev){
  var t=ev.target.closest?ev.target.closest("[data-type],[data-mech],[data-reach],[data-go],[data-all],[data-none]"):null;
  if(!t)return;
  if(t.dataset.type!==undefined){S.types[t.dataset.type]=!S.types[t.dataset.type];refresh()}
  else if(t.dataset.mech!==undefined){S.mechs[t.dataset.mech]=!S.mechs[t.dataset.mech];refresh()}
  else if(t.dataset.reach!==undefined){S.reach[t.dataset.reach]=!S.reach[t.dataset.reach];refresh()}
  else if(t.dataset.all!==undefined){var g=t.dataset.all;
    if(g==="types")TYPES.forEach(function(x){S.types[x.k]=true});else MECHS.forEach(function(x){S.mechs[x.k]=true});refresh()}
  else if(t.dataset.none!==undefined){var g2=t.dataset.none;
    if(g2==="types")TYPES.forEach(function(x){S.types[x.k]=false});else MECHS.forEach(function(x){S.mechs[x.k]=false});refresh()}
  else if(t.dataset.go!==undefined){
    var e=ENTS.filter(function(x){return x.id===t.dataset.go})[0];
    if(e){openDet(e);flyTo(e,true)}
  }
});
document.getElementById("toggleKey").onclick=function(){
  var k=document.getElementById("key");k.classList.toggle("min");
  this.innerHTML=k.classList.contains("min")?"+":"&minus;"};

/* ---------- legend ---------- */
function drawLeg(){
  var h="";
  TYPES.forEach(function(t){
    var n=cnt(function(e){return e.t===t.k&&passes(e)});
    h+="<div class='row"+(S.types[t.k]?"":" off")+"' data-type='"+t.k+"' title=\""+esc(t.d)+"\"><span class='sw' style='background:"+(S.light?t.cl:t.c)+"'></span><span>"+esc(t.n)+"</span><span class='n'>"+n+"</span></div>";
  });
  h+="<div class='flab' style='margin-top:9px'>Dot size &mdash; how far it reaches</div><div class='fchips'>";
  REACH.forEach(function(r){
    h+="<span class='fc"+(S.reach[r.k]?" on":"")+"' data-reach='"+r.k+"' style='cursor:pointer' title='Show only this reach'><span class='sw' style='background:"+(S.light?"#4a5c5c":"#8d9699")+";width:"+(r.r+2)+"px;height:"+(r.r+2)+"px;margin-right:5px'></span>"+esc(r.n)+"</span>";
  });
  h+="</div>";
  document.getElementById("legBody").innerHTML=h;
}
document.getElementById("legBox").addEventListener("click",function(ev){
  var t=ev.target.closest?ev.target.closest("[data-type],[data-reach]"):null;if(!t)return;
  if(t.dataset.type!==undefined){S.types[t.dataset.type]=!S.types[t.dataset.type];refresh()}
  else{
    var k=t.dataset.reach, sole=REACH.every(function(r){return S.reach[r.k]===(r.k===k)});
    REACH.forEach(function(r){S.reach[r.k]=sole?true:(r.k===k)});refresh()}
});
document.getElementById("toggleLeg").onclick=function(){
  var b=document.getElementById("legBox");b.classList.toggle("min");
  this.innerHTML=b.classList.contains("min")?"+":"&minus;";sizeBoxes()};

/* ---------- patterns ---------- */
function patCount(p){return cnt(function(e){return e.pt.indexOf(p.id)>=0})}
function drawPats(){
  var h="";
  if(S.pat)h+="<p class='hint' style='margin:2px 0 6px'>Filtering to one pattern. <span class='frst' id='patClear'>show all</span></p>";
  PATS.forEach(function(p){
    var c=MC[p.mx]?(S.light?"#4a5c5c":"#9dbdc0"):"#9dbdc0";
    h+="<div class='pat"+(S.pat===p.id?" on":"")+"' data-p='"+p.id+"' style='--pc:"+c+"'><div class='pt'>"+esc(p.n)+"</div><div class='pm'>"+esc(p.line)+" &middot; "+patCount(p)+" entries</div></div>";
  });
  document.getElementById("patBody").innerHTML=h;
  var pc=document.getElementById("patClear");
  if(pc)pc.onclick=function(){S.pat=null;refresh()};
}
document.getElementById("patBox").addEventListener("click",function(ev){
  var t=ev.target.closest?ev.target.closest("[data-p]"):null;if(!t)return;
  openPat(t.dataset.p);
});
document.getElementById("togglePat").onclick=function(){
  var b=document.getElementById("patBox");b.classList.toggle("min");
  this.innerHTML=b.classList.contains("min")?"+":"&minus;";sizeBoxes()};

function openPat(pid){
  var p=PATS.filter(function(x){return x.id===pid})[0];if(!p)return;
  S.pat=pid;
  TYPES.forEach(function(t){S.types[t.k]=true});MECHS.forEach(function(m){S.mechs[m.k]=true});
  REACH.forEach(function(r){S.reach[r.k]=true});S.q="";
  refresh();
  var list=ENTS.filter(function(e){return e.pt.indexOf(pid)>=0});
  var h="<h1>"+esc(p.n)+"</h1><p class='hint' style='font-size:12.5px'>"+esc(p.line)+"</p>";
  String(p.rd).split("\n").forEach(function(par){if(par.trim())h+="<p>"+esc(par)+"</p>"});
  h+="<div class='imp-box'><span class='ih'>What this means, plainly</span>"+esc(p.mn)+"</div>";
  h+="<h2>On the map &mdash; "+list.length+" entries in this pattern</h2><div class='chips'>";
  list.forEach(function(e){h+="<span data-go='"+e.id+"'><span class='sw' style='background:"+col(e)+";width:9px;height:9px'></span>"+esc(e.n)+"</span>"});
  h+="</div><p class='hint' style='margin-top:14px'>The map is now filtered to this pattern. Close this and the filter stays on until you clear it in the patterns box.</p>";
  var st=document.getElementById("story");
  st.innerHTML=h;st.classList.add("open");st.scrollTop=0;
}
document.getElementById("story").addEventListener("click",function(ev){
  var t=ev.target.closest?ev.target.closest("[data-go]"):null;if(!t)return;
  var e=ENTS.filter(function(x){return x.id===t.dataset.go})[0];
  if(e){closeOv();openDet(e);flyTo(e,true)}
});

/* ---------- basemap box ---------- */
function drawBase(){
  var h="<div class='psec' style='margin:0 0 3px'>Basemap</div><div class='bases'>";
  BASES.forEach(function(b){
    h+="<label><input type='radio' name='bs' value='"+b.k+"'"+(curBase===b.k?" checked":"")+">"+esc(b.n)+"</label>";
  });
  h+="</div><div class='bases'>";
  h+="<label><input type='checkbox' id='cbLab'"+(showLabels?" checked":"")+">Place names</label>";
  h+="<label><input type='checkbox' id='cbHill'"+(showHill?" checked":"")+">Relief</label>";
  h+="</div>";
  h+="<div class='rng'><span>Dots</span><input type='range' id='opR' min='30' max='100' value='96'></div>";
  document.getElementById("trBody").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll("input[name=bs]"),function(r){
    r.onchange=function(){curBase=r.value;applyBase()}});
  document.getElementById("cbLab").onchange=function(){showLabels=this.checked;applyBase()};
  document.getElementById("cbHill").onchange=function(){showHill=this.checked;applyBase()};
  document.getElementById("opR").oninput=function(){
    var v=+this.value/100;
    map.setPaintProperty("e-dot","circle-opacity",v);
    map.setPaintProperty("e-halo","circle-opacity",v*.3);
  };
}
document.getElementById("toggleTr").onclick=function(){
  var b=document.getElementById("tr");b.classList.toggle("min");
  this.innerHTML=b.classList.contains("min")?"+":"&minus;"};

/* ---------- overlays ---------- */
function closeOv(){document.getElementById("info").classList.remove("open");document.getElementById("story").classList.remove("open")}
document.getElementById("infoClose").onclick=closeOv;
document.getElementById("storyClose").onclick=closeOv;
document.getElementById("infoBtn").onclick=function(){
  document.getElementById("info").innerHTML=METHOD;
  document.getElementById("info").classList.add("open");document.getElementById("info").scrollTop=0};
document.getElementById("storyBtn").onclick=function(){
  var st=document.getElementById("story");
  st.innerHTML=ABOUT;st.classList.add("open");st.scrollTop=0};
document.getElementById("patBtn").onclick=function(){
  var h="<h1>Patterns behind the scenes</h1><p>Twelve write-ups of how the machinery fits together. Tap one to read it and filter the map to the entries involved.</p>";
  PATS.forEach(function(p){
    h+="<div class='pat' data-p2='"+p.id+"' style='--pc:#9dbdc0;margin:9px 0;padding:9px 11px'><div class='pt' style='font-size:14.5px'>"+esc(p.n)+"</div><div class='pm' style='font-size:12px'>"+esc(p.line)+" &middot; "+patCount(p)+" entries</div></div>";
  });
  var st=document.getElementById("story");st.innerHTML=h;st.classList.add("open");st.scrollTop=0;
};
document.getElementById("story").addEventListener("click",function(ev){
  var t=ev.target.closest?ev.target.closest("[data-p2]"):null;if(!t)return;
  openPat(t.dataset.p2);
});
document.getElementById("worldBtn").onclick=function(){map.flyTo({center:[-22,22],zoom:1.8,duration:1200})};

/* ---------- csv ---------- */
function csv(){
  var rows=[["name","type","role","place","address","who","reach","mechanisms","patterns"]];
  shown().forEach(function(e){
    rows.push([e.n,TY[e.t].n,e.ro,e.pl,e.ad,e.who||"",RC[e.rch].n,
      e.mx.map(function(m){return MC[m]?MC[m].n:m}).join("; "),
      e.pt.map(function(p){var x=PATS.filter(function(y){return y.id===p})[0];return x?x.n:p}).join("; ")]);
  });
  var out=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n");
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+out],{type:"text/csv;charset=utf-8"}));
  a.download="inequality-map-list.csv";document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},800);
}

/* ---------- layout ---------- */
function sizeBoxes(){
  var p=document.getElementById("patBox"),l=document.getElementById("legBox");
  var ph=p.classList.contains("min")?44:Math.min(300,Math.round(window.innerHeight*.34));
  var lh=l.classList.contains("min")?44:Math.min(224,Math.round(window.innerHeight*.26));
  document.documentElement.style.setProperty("--patH",ph+"px");
  document.documentElement.style.setProperty("--legH",lh+"px");
  p.style.maxHeight=ph+"px";l.style.maxHeight=lh+"px";
}
window.addEventListener("resize",sizeBoxes);

function refresh(keepFocus){
  paintDots();drawKey();drawLeg();drawPats();
  if(keepFocus){var q=document.getElementById("q");if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}

</script>
</body>
</html>
