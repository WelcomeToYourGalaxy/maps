ll constraints in fifteen countries had blocked the recruitment of more than three million nurses, teachers and other public workers.\nOxfam's 2026 analysis of 161 loans across 81 countries found the required cuts in loans since 2018 were about five times deeper than in the preceding six years.","mn":"The conditions on a rescue loan decide whether a country's recovery is paid for by its richest taxpayers or by the nurses it can no longer hire — and it has almost always been the second.","pt":["p11","p4"],"sr":[["Oxfam: countries locked into IMF austerity programmes (2026)","https://www.oxfam.org/en/press-releases/countries-locked-imf-austerity-programs-are-also-around-twice-vulnerable-economic"],["ActionAid, 'Fifty Years of Failure: The IMF, Debt and Austerity in Africa'","https://actionaid.org/publications/2023/fifty-years-failure-imf-debt-and-austerity-africa"]],"i":36},{"id":"lloyds","n":"Lloyd's of London","t":"debt","lat":51.5129,"lon":-0.0822,"pl":"London, United Kingdom","ad":"One Lime Street, London EC3M 7HA","ro":"The insurance market that underwrote the Atlantic slave trade, and the institution whose archive documents how the trade was financed.","who":"A market of syndicates, overseen by the Council of Lloyd's; chairman at the time of the 2023 report, Bruce Carnegie-Brown.","rch":"global","mx":["cred","rent"],"fg":[["Founded","1688"],["Share of British slaving voyages underwritten through Lloyd's in 1807","at least one third, in whole or in part"],["Commitment announced after the 2023 research","about £52 million"],["Direct reparations","none"]],"rd":"A slaving voyage was a financed, insured commercial venture. Research published in 2023 by the Black Beyond Data project at Johns Hopkins, which Lloyd's commissioned but did not control, found that Lloyd's insured the largest slave-ship owners of the early 1800s and that at least a third of British slaving voyages in 1807 passed through the market. A Lloyd's chairman of 1811-24 himself enslaved people. Lloyd's apologised in 2020 and in 2023 committed about £52 million to racial-equality programmes, while declining to pay reparations.","mn":"The capital accumulated in the City of London in the eighteenth century did not evaporate; it became the endowments, the firms and the inherited estates of the following centuries. Insurance is the part of that machinery that made the voyages financially possible.","pt":["p9","p4"],"sr":[["Guardian: Lloyd's of London slavery review fails to settle question of reparations","https://www.theguardian.com/business/2023/nov/08/lloyds-of-london-slavery-review-reparations"],["RTE: Lloyd's of London to invest after slavery report","https://www.rte.ie/news/business/2023/1108/1415327-lloyds-of-london-on-slave-trade/"]],"i":37},{"id":"navient","n":"Navient","t":"debt","lat":39.756,"lon":-75.549,"pl":"Wilmington, Delaware, United States","ad":"123 Justison Street, Wilmington, DE 19801","ro":"Serviced the student loans of a generation, and was found to have steered borrowers into costlier repayment.","who":"David Yowan, president and chief executive","rch":"national","mx":["cred"],"fg":[["US student debt","about $1.6 trillion owed by roughly 43 million borrowers"],["CFPB settlement (2024)","Navient banned from federal student loan servicing; $120 million in penalties and redress"],["State settlement (2022)","$1.85 billion across 39 states over subprime and forbearance-steering practices"],["Racial gap","Black graduates owe substantially more than white graduates four years after graduation (Brookings)"]],"rd":"American higher education was funded by shifting the cost onto students as debt, and the debt was administered by contractors paid per account. The Consumer Financial Protection Bureau found Navient had steered borrowers who qualified for income-driven repayment into forbearance instead — simpler for the servicer, and more expensive for the borrower, because interest kept accruing. In 2024 it was banned from federal servicing and paid $120 million; in 2022 it settled with 39 states for $1.85 billion.\nStudent debt is a near-perfect inequality machine because its burden is inverse to family wealth: the student whose parents could pay graduates owing nothing, and the one whose parents could not pays interest for thirty years on the same degree.","mn":"Charging people to acquire skills and then charging them interest for thirty years makes education a way of sorting by family wealth rather than a way out of it.","pt":["p4","p12"],"sr":[["CFPB order against Navient (September 2024)","https://www.consumerfinance.gov/about-us/newsroom/cfpb-bans-navient-from-federal-student-loan-servicing-and-orders-the-company-to-pay-120-million-for-wide-ranging-student-lending-failures/"],["Brookings, 'Black-white disparity in student loan debt'","https://www.brookings.edu/articles/black-white-disparity-in-student-loan-debt-more-than-triples-after-graduation/"]],"i":38},{"id":"oecd","n":"OECD","t":"debt","lat":48.8574,"lon":2.2707,"pl":"Paris, France","ad":"2 rue André Pascal, 75775 Paris Cedex 16","ro":"The rich countries' club that writes international tax rules for everyone.","who":"Mathias Cormann, secretary-general","rch":"global","mx":["hide","cap"],"fg":[["Membership","38 countries, overwhelmingly high-income"],["Global minimum tax","15% under Pillar Two, in force in many jurisdictions from 2024"],["UN alternative","in 2023 the UN General Assembly voted 125–48 to begin work on a UN tax convention, against opposition from several OECD members"]],"rd":"For sixty years the rules on how multinational profit is divided between countries have been drafted at the OECD, a body of 38 mostly wealthy states. The two-pillar deal agreed in 2021 introduced a 15% global minimum tax — a real change — but set the rate at roughly the level of the lowest-taxing OECD members, and allocated most of the extra revenue to the countries where companies are headquartered rather than where they operate.\nAfrican governments pushed the matter to the UN instead, where every country has a vote. The 2023 resolution passed 125 to 48; among the states voting against were the UK, the US, Japan, Canada, Australia, South Korea, Israel and New Zealand — the eight that the Tax Justice Network calculates enable 43% of global tax losses.","mn":"Rules made by the countries where the companies live will keep allocating the tax to the countries where the companies live.","pt":["p2","p8"],"sr":[["Tax Justice Network: eight countries blocking UN tax reform","https://taxjustice.net/press/world-losing-half-a-trillion-to-tax-abuse-largely-due-to-8-countries-blocking-un-tax-reform-annual-report-finds/"],["OECD two-pillar solution","https://www.oecd.org/tax/beps/"]],"i":39},{"id":"ustreasury","n":"US Department of the Treasury","t":"debt","lat":38.8977,"lon":-77.0345,"pl":"Washington, DC, United States","ad":"1500 Pennsylvania Avenue NW, Washington, DC 20220","ro":"Enforces the tax code — or does not — and holds the US veto at the IMF.","who":"Secretary of the Treasury; the IRS reports to the department","rch":"global","mx":["hide","cred","cap"],"fg":[["Audit rates","IRS audit rates on millionaires fell sharply over the 2010s as enforcement funding was cut"],["Tax gap","the IRS estimates annual unpaid federal tax of roughly $600–700 billion"],["Beneficial ownership","the Corporate Transparency Act registry was sharply narrowed in 2025 to exclude most US companies"]],"rd":"A tax rate is only as real as the audit behind it. Through the 2010s the IRS lost a quarter of its staff and audits of the highest-income returns fell furthest, because auditing a complex partnership takes specialists and auditing a wage earner takes software. ProPublica's reporting on leaked IRS data showed several of the wealthiest Americans paying nothing in federal income tax in particular years, legally, because wealth that is never sold is never income.\nIn 2025 the beneficial-ownership registry created to identify who really owns American companies was narrowed to exclude domestic ones, leaving the United States again one of the easiest places on earth to own a company anonymously.","mn":"Rules that are not enforced are not rules, and enforcement has been cut hardest exactly where the money is.","pt":["p2","p10"],"sr":[["ProPublica, 'The Secret IRS Files'","https://www.propublica.org/article/the-secret-irs-files-trove-of-never-before-seen-records-reveal-how-the-wealthiest-avoid-income-tax"],["FinCEN beneficial ownership information reporting rule change (2025)","https://www.fincen.gov/boi"]],"i":40},{"id":"uscongress","n":"United States Congress","t":"debt","lat":38.8899,"lon":-77.0091,"pl":"Washington, DC, United States","ad":"US Capitol, First Street SE, Washington, DC 20004","ro":"Writes the tax code that sets how American wealth is taxed, and the labour law that sets how it is contested.","who":"535 members of the House and Senate","rch":"global","mx":["cap","trans","floor"],"fg":[["Federal minimum wage","$7.25 an hour since July 2009 — the longest period without an increase since 1938"],["2017 Tax Cuts and Jobs Act","cut the corporate rate from 35% to 21%, permanently"],["Carried interest","still taxed at capital-gains rates"],["Federal lobbying, 2025","passed $5 billion for the first time (OpenSecrets)"],["Gilens & Page (2014)","economic elites and business groups have substantial independent influence on policy; average citizens have close to none"]],"rd":"Two numbers describe most of American inequality policy. The federal minimum wage has been $7.25 since 2009, which after inflation is worth roughly a third less than it was then. The corporate tax rate was cut from 35% to 21% in 2017, permanently, while the cuts for individuals were written to expire. Carried interest — the mechanism by which private-equity managers have their fee income taxed as capital gains — has survived every administration that promised to end it.\nMartin Gilens and Benjamin Page studied nearly 1,800 policy questions and found that when the preferences of affluent Americans and organised business diverge from those of the median voter, the median voter's preferences have almost no measurable effect on what passes.","mn":"The gap is not an accident of the market: it is a set of specific laws, each with a sponsor, a vote count and a date.","pt":["p3"],"sr":[["Gilens & Page, 'Testing Theories of American Politics' (2014)","https://www.cambridge.org/core/journals/perspectives-on-politics/article/testing-theories-of-american-politics-elites-interest-groups-and-average-citizens/62327F513959D0A304D4893B382B992B"],["OpenSecrets, federal lobbying totals","https://www.opensecrets.org/federal-lobbying"]],"i":41},{"id":"worldbank","n":"World Bank","t":"debt","lat":38.899,"lon":-77.0425,"pl":"Washington, DC, United States","ad":"1818 H Street NW, Washington, DC 20433","ro":"Development lender whose conditions reshaped public services across the global south.","who":"Ajay Banga, president (by convention always an American nominee)","rch":"global","mx":["cond","priv"],"fg":[["Structural adjustment","the dominant lending framework from about 1980 to the late 1990s"],["Doing Business rankings","discontinued in 2021 after an investigation found data had been altered to favour particular countries"],["User fees","cost-recovery conditions in health and education, later partly disavowed by the Bank itself"]],"rd":"For two decades the Bank's loans came with structural adjustment: open the economy, shrink the state, charge fees for services, sell the utilities. The policies were adopted by governments that needed the money, and their effects on school enrolment and clinic attendance are among the best-documented in development economics. The Bank itself eventually retreated from user fees for primary health and education.\nIt also ran Doing Business, an annual ranking that scored countries partly on how light their labour and tax rules were, and so rewarded governments for weakening protections. The Bank shut the ranking down in 2021 after an inquiry found staff had altered data under pressure.","mn":"Advice from a lender you cannot refuse is not advice, and the countries that took it were told to charge their poorest citizens for school and water.","pt":["p11","p8","p15"],"sr":[["World Bank statement on discontinuing Doing Business (2021)","https://www.worldbank.org/en/news/statement/2021/09/16/world-bank-group-to-discontinue-doing-business-report"],["WilmerHale investigation of Doing Business data irregularities","https://thedocs.worldbank.org/en/doc/84a922cc9273b7b120d49ad3b9e9d3f9-0090012021/original/DB-Investigation-Findings-and-Report-to-the-Board-of-Executive-Directors-September-15-2021.pdf"]],"i":42},{"id":"wto","n":"World Trade Organization","t":"debt","lat":46.2243,"lon":6.148,"pl":"Geneva, Switzerland","ad":"Centre William Rappard, Rue de Lausanne 154, 1211 Geneva","ro":"Where the rules on patents, subsidies and tariffs are agreed — and where the TRIPS agreement was written.","who":"Ngozi Okonjo-Iweala, director-general","rch":"global","mx":["cap","cond"],"fg":[["TRIPS (1995)","obliged all members to grant 20-year patents, including on medicines"],["Covid-19 waiver","requested by India and South Africa in October 2020; a narrow vaccine-only decision followed in June 2022"],["Agricultural subsidies","rich-country farm support remains largely intact under the rules"]],"rd":"The TRIPS agreement exported a particular idea of property: that a formula or a seed variety can be owned for twenty years everywhere on earth. Countries that had built generic pharmaceutical industries — India above all — had to change their patent law. During the HIV epidemic that difference was measured in lives, until public pressure forced price concessions; during Covid-19, India and South Africa asked for a waiver and were blocked for eighteen months, mostly by the European Union, the UK and Switzerland.\nThe same rulebook left rich-country farm subsidies substantially untouched while requiring poor countries to open their markets to the crops those subsidies produce.","mn":"The rules decide who may make a medicine or plant a seed, and they were written by the countries whose companies already owned the patents.","pt":["p5","p8"],"sr":[["WTO, TRIPS agreement and public health","https://www.wto.org/english/tratop_e/trips_e/pharmpatent_e.htm"],["WTO ministerial decision on the TRIPS agreement, June 2022","https://www.wto.org/english/thewto_e/minist_e/mc12_e/documents_e.htm"]],"i":43},{"id":"mauritania","n":"Descent-based slavery — Mauritania","t":"bind","lat":18.0858,"lon":-15.9785,"pl":"Nouakchott, Mauritania","ad":"Ministère de la Justice, Avenue Gamal Abdel Nasser, Nouakchott","ro":"The last country in the world to abolish slavery, where status is still inherited at birth in parts of the country.","who":"Abolition by decree in 1981; criminalised in 2007; the 2015 law makes slavery a crime against humanity. Enforcement sits with special tribunals in Nouakchott, Nouadhibou and Néma.","rch":"national","mx":["tied","excl","floor"],"fg":[["Slavery abolished","1981, the last country to do so"],["Criminalised","2007; strengthened in 2015"],["People still enslaved, Global Slavery Index estimate","about 90,000, roughly 2% of the population"],["Haratine estimated by anti-slavery organisations to be enslaved or under former masters' control","up to 500,000"],["Convictions under the 2007 law in its first years","one"]],"rd":"The system is lineage-based: a person born to an enslaved mother is treated as the property of the mother's master's family, and the status passes with the line. Most enslaved people are Haratine, descended from the dark-skinned populations enslaved by Arab-Berber groups. The UN Special Rapporteur on contemporary forms of slavery reported after a 2022 visit that descent-based slavery persists alongside newer forms, and that currently and formerly enslaved people and their descendants face continuing social, economic and political exclusion. Successive presidents have denied that the practice exists.","mn":"This is the mechanism in its plainest form: what you are permitted to own, earn and pass on is decided by who your mother was. Freedom granted by statute does not by itself return land, pay wages owed or admit children to school.","pt":["p14","p7"],"sr":[["UN Special Rapporteur on contemporary forms of slavery: visit to Mauritania (A/HRC/54/30/Add.1)","https://documents.un.org/doc/undoc/gen/g23/138/36/pdf/g2313836.pdf"],["Anti-Slavery International: descent-based slavery in Mauritania","https://www.antislavery.org/wp-content/uploads/2017/01/1_upr_submission_on_mauritania_2015.pdf"]],"i":44},{"id":"h2a","n":"Employer-tied work visas — United States","t":"bind","lat":38.887,"lon":-77.015,"pl":"Washington, DC, United States","ad":"US Department of Labor, 200 Constitution Avenue NW, Washington, DC 20210","ro":"Guest-worker visas that belong to the employer, not the worker.","who":"Employment and Training Administration, US Department of Labor; US Citizenship and Immigration Services","rch":"national","mx":["tied","floor"],"fg":[["H-2A certifications","grew from about 85,000 positions in 2012 to over 370,000 by the mid-2020s"],["Structure","the visa is tied to the petitioning employer; leaving generally means losing legal status"],["Documented abuse","forced labour prosecutions including Operation Blooming Onion (2021), which charged a conspiracy involving over 100 workers"]],"rd":"The American farm and seasonal workforce increasingly arrives on H-2A and H-2B visas, which are issued to the employer for a named worker. A worker who complains about pay, housing or pesticide exposure can be sent home, and the recruiter who got them the job — often paid a fee the worker borrowed — can refuse to place them again. Federal prosecutors in Georgia described a scheme in which workers were held in squalor and made to dig onions with their bare hands.\nThe design is the same as kafala in a different legal language: legal presence attached to one employer.","mn":"Every protection on paper is worth only as much as the worker's ability to walk away, and a visa held by the employer removes that ability.","pt":["p7","p14"],"sr":[["US DOJ, Operation Blooming Onion indictment (2021)","https://www.justice.gov/usao-sdga/pr/24-defendants-indicted-multi-million-dollar-south-georgia-based-human-smuggling-and"],["US Department of Labor, H-2A program data","https://www.dol.gov/agencies/eta/foreign-labor/performance"]],"i":45},{"id":"panamaflag","n":"Flags of convenience — Panama","t":"bind","lat":8.954,"lon":-79.534,"pl":"Panama City, Panama","ad":"Panama Maritime Authority, Edificio PSA, Diablo Heights, Panama City","ro":"The world's largest ship registry: whichever flag a ship flies decides which labour law applies at sea.","who":"Autoridad Marítima de Panamá","rch":"global","mx":["tied","floor"],"fg":[["Registry size","Panama registers the largest share of world tonnage; Liberia and the Marshall Islands follow"],["Abandonment","the ILO/IMO database recorded record numbers of abandoned seafarers in recent years — crews left unpaid on ships in port"],["Owners","beneficial owners are frequently in Greece, Japan, China, Germany or Switzerland, not in the flag state"]],"rd":"A ship is legally a piece of the country whose flag it flies. Register it in Panama, Liberia or the Marshall Islands and the crew's wages, hours and safety are governed by that country's law and inspected by its underfunded administration, while the owner sits in Athens or Hamburg and the cargo belongs to a company in Rotterdam. Crews are typically Filipino, Indian, Ukrainian or Indonesian, on contracts they signed through an agent, at sea for months.\nWhen an owner goes bust, the crew is abandoned — unpaid, aboard, in a foreign port, with no authority clearly responsible. The ILO and IMO keep a database of these cases and it has been setting records.","mn":"Nine-tenths of world trade moves on ships whose workers can be placed, by a paperwork choice, outside the reach of any labour law worth the name.","pt":["p7","p5"],"sr":[["IMO legal affairs — the joint IMO/ILO work on abandonment of seafarers","https://www.imo.org/en/OurWork/Legal/Pages/Default.aspx"],["ITF Seafarers on flags of convenience","https://www.itfseafarers.org/en/focs"]],"i":46},{"id":"hukou","n":"Hukou system — China","t":"bind","lat":39.908,"lon":116.406,"pl":"Beijing, China","ad":"Ministry of Public Security, 14 Dongchang'an Street, Dongcheng District, Beijing","ro":"Household registration that decides where a citizen may claim schooling, healthcare and a pension.","who":"Ministry of Public Security; reform policy set by the State Council","rch":"national","mx":["tied","excl"],"fg":[["Migrant workers","around 300 million people working outside their registered household area"],["Left-behind children","tens of millions of children raised by grandparents in rural areas because they cannot access urban schooling"],["Reform","restrictions eased in smaller cities since 2014; the largest cities retain points-based systems"]],"rd":"A Chinese citizen's hukou records where their household is registered, and most public services are provided by that locality. A worker who moves from Henan to Shenzhen keeps a rural registration: they can work, but their children may not be able to enrol in the local state school, and their health and pension entitlements stay behind. The result is the largest internal migration in human history conducted by people who are, in their own country, treated as temporary.\nThis was not incidental to China's manufacturing boom. It supplied factories with workers who could be paid as individuals rather than as families, because the family stayed in the village.","mn":"Making a worker's rights depend on where they were born, not where they work, is a way of getting the labour without paying for the household it belongs to.","pt":["p7","p14"],"sr":[["Chan, 'The Chinese Hukou System at 50', Eurasian Geography and Economics","https://doi.org/10.2747/1539-7216.50.2.197"],["UNICEF China, children affected by migration","https://www.unicef.cn/en/figures-situation-children-china"]],"i":47},{"id":"indialabour","n":"Informal labour and caste — India","t":"bind","lat":28.618,"lon":77.212,"pl":"New Delhi, India","ad":"Ministry of Labour and Employment, Shram Shakti Bhawan, Rafi Marg, New Delhi 110001","ro":"An economy where most work sits outside any labour law, along lines drawn by caste.","who":"Ministry of Labour and Employment; state governments","rch":"national","mx":["excl","tied","floor"],"fg":[["Informal employment","around 90% of India's workforce"],["Top 1% income share","roughly 22–23%, among the highest recorded globally (World Inequality Lab)"],["Manual scavenging","prohibited by law in 1993 and again in 2013; deaths in sewers and septic tanks continue to be recorded annually"],["Bonded labour","abolished in 1976; still documented in brick kilns, quarries and agriculture"]],"rd":"Roughly nine in ten Indian workers have no written contract, no social insurance and no realistic access to a labour court. Who ends up in which work is still strongly predicted by caste: Dalits are heavily over-represented in sanitation, leather, brick kilns and manual scavenging — work prohibited by statute in 1993 and 2013, and still killing people in sewers every year. At the other end, the World Inequality Lab finds the top 1% taking a larger share of national income than at any point since records began, including the colonial period.\nThe laws against bonded labour, untouchability and manual scavenging are among the strongest on paper anywhere. Enforcement is the variable.","mn":"A law against a practice means nothing to the person doing the practice unless somebody is willing to inspect, prosecute and pay for an alternative.","pt":["p7","p12","p13","p14"],"sr":[["World Inequality Lab, 'Income and Wealth Inequality in India, 1922–2023'","https://halshs.archives-ouvertes.fr/halshs-04563836v1/file/WorldInequalityLab_WP2024_09_Income-and-Wealth-Inequality-in-India-1922-2023_Final.pdf"],["ILO, India Employment Report / informal employment statistics","https://www.ilo.org/publications"]],"i":48},{"id":"qatarkafala","n":"Kafala system — Qatar","t":"bind","lat":25.286,"lon":51.533,"pl":"Doha, Qatar","ad":"Ministry of Labour, Al Bidda Tower, Corniche Street, Doha","ro":"Legal sponsorship that ties a worker's right to stay in the country to one employer.","who":"Ministry of Labour of the State of Qatar","rch":"national","mx":["tied","floor"],"fg":[["Migrant share of the workforce","around 95%"],["Reforms","exit permits removed in 2018; no-objection-certificate requirement for changing jobs removed in 2020; a minimum wage of 1,000 riyals a month plus allowances introduced in 2021"],["Enforcement","HRW documented continued wage theft in December 2025 and labour groups reported the same in 2026"],["Recruitment fees","workers commonly arrive owing $1,000–$4,000 to agents, against monthly pay of a few hundred dollars"]],"rd":"Kafala makes an employer the legal sponsor of a worker's presence in the country. On paper Qatar has dismantled most of it: workers no longer need permission to leave the country or to change jobs, and there is a minimum wage. In practice, Human Rights Watch found in December 2025 that state clients and large businesses were failing to pay contractors on time, leaving labourers unpaid for months, and the same patterns were still being reported through 2026.\nThe decisive feature is the debt. A worker who borrowed four months' wages to get the job, whose passport the employer holds, and whose visa the employer controls, is not in a position to refuse anything — whatever the statute says.","mn":"If leaving your employer means leaving the country, your wage is not set by a labour market; it is set by whatever your employer decides to pay.","pt":["p7","p14"],"sr":[["Human Rights Watch reporting on wage theft and unpaid contractors in Qatar","https://www.hrw.org/middle-east/north-africa/qatar"],["ILO Governing Body document on Qatar's labour reforms","https://www.ilo.org/projects-and-partnerships/projects/ilo-project-office-state-qatar"]],"i":49},{"id":"saudikafala","n":"Kafala system — Saudi Arabia","t":"bind","lat":24.685,"lon":46.721,"pl":"Riyadh, Saudi Arabia","ad":"Ministry of Human Resources and Social Development, King Fahd Road, Riyadh","ro":"The largest tied-labour system in the world, now building the largest construction programme in the world.","who":"Ministry of Human Resources and Social Development","rch":"national","mx":["tied","floor"],"fg":[["Migrant workers","over 13 million, roughly three-quarters of the private-sector workforce"],["HRW (2025)","at least 600 workers of one Mecca contractor unpaid for eight months or more; eleven workers detained after protesting"],["Wage theft survey","of 112 migrant workers HRW asked about wage theft, 69 reported experiencing it"],["Fines","Saudi authorities reduced the size of penalties on employers for wage theft (ILO submission, 2025)"],["2034 World Cup","awarded by FIFA in December 2024; BWI, representing 12 million workers, alleged severe abuses and wage theft under kafala"]],"rd":"Saudi Arabia's giga-projects — NEOM, the Mecca developments, the 2034 World Cup programme — are being built by workers whose legal status is attached to their employer. In November 2025 Human Rights Watch documented at least 600 workers at a Mecca contractor on a multi-billion-dollar project who had not been paid for eight months; eleven were detained when they protested, and then released. The government's own wage protection system flagged one such case and the response was described as corrective action. The ILO received a complaint from construction unions alleging endemic wage theft.\nSaudi authorities also reduced the fines employers face for not paying wages, which tells you how much the enforcement is expected to bite.","mn":"When the penalty for not paying a worker is smaller than the wage, not paying is simply cheaper.","pt":["p7","p14"],"sr":[["Human Rights Watch, 'Saudi Arabia: Migrant Workers in Mecca Arrested for Demanding Unpaid Wages' (6 Nov 2025)","https://www.hrw.org/news/2025/11/06/saudi-arabia-migrant-workers-in-mecca-arrested-for-demanding-unpaid-wages"],["ILO Governing Body, GB.355/INS/16/7 on Saudi Arabia (Nov 2025)","https://www.ilo.org/sites/default/files/2025-11/GB355-INS-16-7-Saudi%20Arabia-EN.pdf"]],"i":50},{"id":"uaekafala","n":"Kafala system — United Arab Emirates","t":"bind","lat":24.453,"lon":54.377,"pl":"Abu Dhabi, United Arab Emirates","ad":"Ministry of Human Resources and Emiratisation, Abu Dhabi","ro":"The same sponsorship model, in the Gulf's financial and logistics centre.","who":"Ministry of Human Resources and Emiratisation","rch":"national","mx":["tied","floor"],"fg":[["Migrant share of population","around 88%"],["Domestic workers","largely excluded from standard labour-law protections across the Gulf"],["Union rights","independent trade unions and strikes are prohibited"]],"rd":"The UAE runs the most diversified Gulf economy and the same labour architecture. Domestic workers — almost all women, mostly from the Philippines, Indonesia, Ethiopia and Nepal — sit furthest outside protection, living in the employer's home, with hours and rest that no inspector sees. There are no independent unions and strikes are illegal, so the only recourse is a complaint to a ministry whose counterparty is the employer.\nDubai is simultaneously one of the world's main destinations for undeclared wealth, which makes the emirate a place where the hiding of fortunes and the tying of labour happen inside the same square mile.","mn":"The same jurisdiction can offer the wealthiest people in the world total discretion and the poorest workers in it no exit.","pt":["p7","p10","p14"],"sr":[["Human Rights Watch, UAE country reporting","https://www.hrw.org/middle-east/north-africa/united-arab-emirates"],["Carnegie Endowment, 'Dubai's Role in Facilitating Corruption and Global Illicit Financial Flows'","https://carnegieendowment.org/2020/07/07/dubai-s-role-in-facilitating-corruption-and-global-illicit-financial-flows-pub-82180"]],"i":51},{"id":"phildmw","n":"Labour export — the Philippines","t":"bind","lat":14.572,"lon":121.022,"pl":"Manila, Philippines","ad":"Department of Migrant Workers, Blas F. Ople Building, Ortigas Avenue, Mandaluyong, Metro Manila","ro":"A state that institutionalised exporting its own workers, and now depends on their remittances.","who":"Department of Migrant Workers (created 2022, from the former POEA)","rch":"national","mx":["tied","floor"],"fg":[["Overseas Filipino workers","around 2 million deployed annually; roughly 10% of the population lives or works abroad"],["Remittances","about $38–40 billion a year, close to 9% of GDP"],["Origins","the overseas employment programme was launched under Marcos in 1974 as a temporary measure"],["Protection","cases of abuse of domestic workers in the Gulf and Hong Kong are recorded in the thousands each year"]],"rd":"In 1974, facing unemployment and debt, the Marcos government set up an agency to place Filipino workers abroad as a temporary measure. Fifty years on it is a pillar of the economy: around a tenth of Filipinos work overseas and their remittances are close to a tenth of GDP, which funds imports and holds up the currency. The state now has a structural interest in continuing to export workers, and a weak position when negotiating their treatment with the countries that receive them.\nThe household cost is not in the statistics: a generation raised by grandparents, with a mother who is a nurse in Riyadh or a caregiver in Hong Kong.","mn":"When a country's main export is its own people, its government cannot afford to be difficult about how they are treated.","pt":["p7","p5","p14"],"sr":[["Bangko Sentral ng Pilipinas, overseas Filipino remittance statistics","https://www.bsp.gov.ph/SitePages/Statistics/External.aspx"],["IOM / Philippine Statistics Authority, Survey on Overseas Filipinos","https://psa.gov.ph/statistics/survey/labor-and-employment/survey-overseas-filipinos"]],"i":52},{"id":"bdwage","n":"Minimum Wage Board — Bangladesh","t":"bind","lat":23.733,"lon":90.41,"pl":"Dhaka, Bangladesh","ad":"Shrom Bhaban, 4 Rajuk Avenue, Dhaka 1000","ro":"The tripartite board that sets the garment wage for roughly four million workers, once every five years.","who":"Convened by the Ministry of Labour and Employment, with employer and worker representatives.","rch":"national","mx":["floor","tied"],"fg":[["Garment workers in Bangladesh","about 4 million"],["Minimum monthly wage set in December 2023","12,500 taka"],["Previous revision","8,000 taka, set in 2018"],["Share of national export earnings from garments","over 80%"]],"rd":"The wage is not bargained factory by factory; it is announced by a board every five years and becomes the floor that nearly every factory pays. In 2023 the board set 12,500 taka a month after protests in which workers were killed and thousands dismissed; unions had asked for roughly double. Buyers abroad place orders at prices negotiated against that floor, and factory owners sit in parliament.","mn":"A wage fixed for five years at a time, in a currency that loses value every year, falls in real terms between revisions. Children in a household at that wage go to work rather than stay in school, which is how one generation's wage becomes the next generation's ceiling.","pt":["p5","p14"],"sr":[["ILO: Bangladesh country programme","https://www.ilo.org/regions-and-countries/asia-and-pacific/bangladesh"],["Clean Clothes Campaign: Bangladesh minimum wage","https://cleanclothes.org/news/2023/bangladesh-minimum-wage-announcement"]],"i":53},{"id":"prisonlabour","n":"Prison labour — United States","t":"bind","lat":30.964,"lon":-91.603,"pl":"Angola, Louisiana, United States","ad":"Louisiana State Penitentiary, 17544 Tunica Trace, Angola, LA 70712","ro":"Work for cents an hour, on a former plantation, under the clause the Thirteenth Amendment left open.","who":"Louisiana Department of Public Safety and Corrections","rch":"national","mx":["tied","excl","floor"],"fg":[["Thirteenth Amendment","prohibits slavery and involuntary servitude 'except as a punishment for crime whereof the party shall have been duly convicted'"],["Wages","incarcerated workers in several states, including Louisiana, are paid a few cents an hour or nothing"],["ACLU/GHRC (2022)","about 800,000 incarcerated people work in US prisons, producing an estimated $11 billion a year in goods and services"],["Angola","18,000 acres, formerly a slave plantation; the farm line still works the fields"]],"rd":"The Thirteenth Amendment abolished slavery with one exception: as punishment for a crime. After 1865 Southern states convicted freed Black men of vagrancy and leased them to planters and mines; Angola prison is itself a former plantation, and incarcerated men still work its fields, supervised on horseback. Across the United States roughly 800,000 incarcerated people work, most for a few cents an hour or nothing, producing an estimated $11 billion a year in goods and services, and refusal can mean solitary confinement.\nSeveral states have voted since 2018 to delete the exception from their own constitutions; the federal clause remains.","mn":"The cheapest labour in the richest country is performed by people who cannot quit, and the exception that allows it has been in the constitution since 1865.","pt":["p7","p14"],"sr":[["ACLU & Global Human Rights Clinic, 'Captive Labor: Exploitation of Incarcerated Workers' (2022)","https://www.aclu.org/report/captive-labor-exploitation-incarcerated-workers"],["US Constitution, Thirteenth Amendment","https://constitution.congress.gov/constitution/amendment-13/"]],"i":54},{"id":"titp","n":"Technical Intern Training Programme — Japan","t":"bind","lat":35.6866,"lon":139.7637,"pl":"Tokyo, Japan","ad":"Organization for Technical Intern Training, Otemachi, Chiyoda-ku, Tokyo","ro":"A training visa under which about half a million workers cannot change employer, whatever the employer does.","who":"Supervised by the Organization for Technical Intern Training (OTIT), set up in 2017 under the Technical Intern Training Act.","rch":"national","mx":["tied","floor"],"fg":[["Technical interns in Japan, end of 2025","about 456,000"],["Trainees who left their workplaces, 2012-2022","about 68,000 (Immigration Services Agency)"],["Introduced","1993, as skills transfer to developing countries"],["Replacement programme","Employment for Skill Development, from April 2027, capped at about 426,000"]],"rd":"The programme was presented as skills transfer, and operates as a labour supply. Interns are recruited abroad, often after paying brokers, and are tied to the employer that accepts them; unpaid wages, illegal overtime, harassment and unsafe work have been documented, and until recently pregnancy was treated as grounds for return. A government panel recommended abolition, and the programme is due to be replaced in April 2027 by a scheme that keeps some restrictions on changing jobs.","mn":"A worker who cannot leave cannot bargain, and an employer who knows this sets the wage accordingly. The debt many interns arrive with, owed to a recruiter at home, is what makes leaving unaffordable even where it is permitted.","pt":["p7","p14"],"sr":[["The Diplomat: Japan wants to improve its foreign worker policy","https://thediplomat.com/2024/07/japan-wants-to-improve-its-foreign-worker-policy-but-xenophobia-prevails/"],["Nippon.com: replacing the Technical Intern Training Program","https://www.nippon.com/en/articles/-/15038"]],"i":55},{"id":"thirteenth","n":"The exception clause, Thirteenth Amendment","t":"bind","lat":38.8929,"lon":-77.0229,"pl":"Washington, DC, United States","ad":"National Archives, 700 Pennsylvania Avenue NW, Washington, DC 20408","ro":"The eleven words that abolished slavery in the United States except as punishment for a crime.","who":"Ratified in 1865; the exception is enforced by every state and federal prison system that requires work.","rch":"national","mx":["tied","excl","floor"],"fg":[["Ratified","6 December 1865"],["Text of the exception","'except as a punishment for crime whereof the party shall have been duly convicted'"],["States that have removed the exception from their own constitutions","several since 2018, including Colorado, Nebraska, Utah, Alabama and Tennessee"]],"rd":"The amendment ended slavery and left a carve-out. Within a decade, convict leasing had put thousands of newly freed people back on the plantations they had left, under criminal sentences obtained through vagrancy laws. The clause still underwrites prison labour, including work that pays nothing in some states, and the convictions it rests on fall unevenly by race.","mn":"A conviction is heritable in effect if not in law: a parent in prison earns nothing a family can live on, and the record that follows release closes off the jobs and the housing that would let the next generation start level.","pt":["p14","p9"],"sr":[["National Archives: 13th Amendment to the US Constitution","https://www.archives.gov/milestone-documents/13th-amendment"],["ACLU: captive labor — exploitation of incarcerated workers","https://www.aclu.org/news/human-rights/captive-labor-exploitation-of-incarcerated-workers"]],"i":56},{"id":"appleby","n":"Appleby","t":"secr","lat":32.2949,"lon":-64.7823,"pl":"Hamilton, Bermuda","ad":"Appleby Global, 22 Victoria Street, Hamilton HM 12","ro":"An offshore law firm whose leaked files showed how the structures are designed and who uses them.","who":"A partnership operating from Bermuda, Cayman, the BVI, Jersey, Guernsey, the Isle of Man, Mauritius, Hong Kong and Shanghai.","rch":"global","mx":["hide","trans"],"fg":[["Documents in the Paradise Papers, 2017","13.4 million, most of them from Appleby"],["Clients identified","multinationals, politicians, royal households and private fortunes"],["Journalists on the investigation","nearly 400, in 67 countries"]],"rd":"The structures on this map do not assemble themselves. Offshore law firms draft them: the chains of companies, the partnerships, the trusts whose beneficiaries are other trusts. The Paradise Papers, leaked in 2017 and mostly from Appleby, documented the work in detail, including arrangements for household-name corporations and the records of the firm's own dealings with regulators. Appleby called the leak a criminal act and denied wrongdoing.","mn":"A professional industry stands between a fortune and the tax authority of the country where it was made. The expertise is legal and the service is bespoke, which is why it is available to the very largest holdings and to almost no one else.","pt":["p10","p2","p12"],"sr":[["ICIJ: Paradise Papers","https://www.icij.org/investigations/paradise-papers/"],["Guardian: Paradise Papers — the key revelations","https://www.theguardian.com/news/2017/nov/05/paradise-papers-leak-reveals-secrets-of-world-elites-hidden-wealth"]],"i":57},{"id":"bvi","n":"British Virgin Islands Financial Services Commission","t":"secr","lat":18.4286,"lon":-64.6185,"pl":"Road Town, Tortola, British Virgin Islands","ad":"Pasea Estate, Road Town, Tortola VG1110","ro":"The registrar of a territory of 30,000 people that has incorporated hundreds of thousands of companies for people living elsewhere.","who":"A statutory regulator; the territory is a British Overseas Territory with its own company law.","rch":"global","mx":["hide"],"fg":[["Population","about 31,000"],["Active BVI companies","in the hundreds of thousands"],["Share of entities in the Panama Papers registered in the BVI","the largest single jurisdiction"],["Public register of beneficial owners","not open to the public"]],"rd":"A BVI company can be formed in a day, needs no local activity, and until recently disclosed nothing about who owned it. When the Panama Papers were analysed, the BVI was the most common place of incorporation among the entities in the files. The territory now holds beneficial ownership data for law enforcement but has not opened a public register. The companies hold property, shares and bank accounts in other countries, where the nominal owner is the company.","mn":"A tax authority cannot assess what it cannot attribute to a person, and a claimant cannot sue an owner they cannot name. The service sold here is not a low tax rate; it is the absence of a name.","pt":["p10","p2"],"sr":[["ICIJ: the Panama Papers — offshore leaks database","https://offshoreleaks.icij.org/"],["BVI Financial Services Commission","https://www.bvifsc.vg/"]],"i":58},{"id":"delaware","n":"Delaware Division of Corporations","t":"secr","lat":39.1582,"lon":-75.5244,"pl":"Dover, Delaware, United States","ad":"John G. Townsend Building, 401 Federal Street, Suite 4, Dover, DE 19901","ro":"The registry where most large American companies legally exist, and where the state's own corporate law is the product.","who":"Part of the Delaware Department of State; corporate disputes are heard by the Court of Chancery.","rch":"global","mx":["hide","cap"],"fg":[["Legal entities registered","more than 2.28 million"],["New entities formed in 2025","334,461"],["Share of the Fortune 500 incorporated in Delaware","over two thirds"],["Residents of the state","about 1 million"]],"rd":"Delaware sells a legal home. Its general corporation law and the Court of Chancery that interprets it are the reason two thirds of the largest US companies are incorporated in a state most of them do not operate in, and fees from this franchise are a large share of state revenue. The same registry makes it straightforward to form an entity whose owner is not named in any public filing, which is why addresses in Wilmington appear on hundreds of thousands of companies.","mn":"Company law decides who a company must answer to. One small state writes the version most large American firms are governed by, and has a direct financial interest in keeping that version attractive to the people forming the companies.","pt":["p10","p1"],"sr":[["Delaware Division of Corporations: 2025 annual report","https://corpfiles.delaware.gov/Annual-Reports/Division-of-Corporations-2025-Annual-Report.pdf"],["Delaware Division of Corporations: statistics","https://corp.delaware.gov/stats/"]],"i":59},{"id":"ireland","n":"Department of Finance, Ireland","t":"secr","lat":53.338,"lon":-6.25,"pl":"Dublin, Ireland","ad":"Government Buildings, Upper Merrion Street, Dublin 2","ro":"The state that built a growth model on being where other countries' profits are booked.","who":"Paschal Donohoe, Minister for Finance","rch":"global","mx":["hide","cap"],"fg":[["Apple ruling","€13 billion plus interest ordered recovered by the EU Court of Justice, 10 September 2024"],["Headline corporate rate","12.5%; 15% minimum for large groups from 2024"],["'Double Irish'","closed to new entrants in 2015, with transition until 2020"]],"rd":"Ireland's low corporate rate and its tolerance for companies that were, for tax purposes, resident nowhere, drew the European headquarters of a large part of the American technology and pharmaceutical industries. The arrangement brought real jobs to Dublin and Cork. It also meant that profits earned from customers in France, Italy and Poland were taxed, if at all, in Ireland. Ireland spent eight years and considerable public money appealing the Apple decision — arguing against receiving €13 billion — because the ruling threatened the model.\nThe state lost in September 2024 and took the money.","mn":"When countries compete to host profits rather than production, the winner collects a small slice of a very large number and everyone else collects nothing.","pt":["p2"],"sr":[["Court of Justice of the EU, Commission v Ireland and Apple (C-465/20 P) — case file","https://curia.europa.eu/juris/liste.jsf?num=C-465/20"],["Tax Justice Network, Corporate Tax Haven Index","https://cthi.taxjustice.net/"]],"i":60},{"id":"jersey","n":"Government of Jersey","t":"secr","lat":49.186,"lon":-2.106,"pl":"St Helier, Jersey","ad":"19–21 Broad Street, St Helier, Jersey JE2 3RR","ro":"A Crown Dependency inside the network of British tax havens.","who":"Government of Jersey; Ministry for Treasury and Resources","rch":"global","mx":["hide","trans"],"fg":[["UK network","the Crown Dependencies and Overseas Territories together account for roughly 23% of global corporate tax losses (Tax Justice Network)"],["Corporate rate","0% for most companies ('zero-ten')"]],"rd":"Jersey, Guernsey and the Isle of Man are not UK territory and not foreign countries; the British Crown is responsible for their defence and foreign relations while their tax law is their own. The arrangement lets London host the services, lawyers and banks while the zero rate sits ninety miles offshore. Add the Overseas Territories — Cayman, BVI, Bermuda — and the Tax Justice Network attributes about a quarter of the world's corporate tax losses to this one network.\nWhen the UK government is asked to intervene, the answer is that these are self-governing jurisdictions.","mn":"A rich country can run the world's largest tax-avoidance network and truthfully say the rules were written somewhere else.","pt":["p10","p2"],"sr":[["Tax Justice Network (research on the UK's network of tax havens)","https://taxjustice.net/"],["House of Lords Library, 'Tax implications of corporate profit shifting'","https://lordslibrary.parliament.uk/tax-implications-of-corporate-profit-shifting/"]],"i":61},{"id":"kpmg","n":"KPMG","t":"secr","lat":51.5045,"lon":-0.018,"pl":"London, United Kingdom","ad":"15 Canada Square, London E14 5GL","ro":"Auditor and adviser at the centre of South Africa's state capture findings.","who":"Bill Thomas, global chairman and chief executive","rch":"global","mx":["hide","cap"],"fg":[["South Africa (2017–22)","withdrew the conclusions of its SARS 'rogue unit' report; named repeatedly in the Zondo Commission on state capture"],["Gupta accounts","audited Gupta-linked companies for 15 years before resigning the work"]],"rd":"KPMG audited the Gupta family's South African businesses for fifteen years and produced a report used to dismantle the senior leadership of the country's tax authority. In 2017 it withdrew the report's conclusions and apologised; the Zondo Commission later described the firm's role in the hollowing out of the South African state. The revenue service it helped damage was the body responsible for collecting tax from the wealthy.\nAcross the Big Four the pattern repeats — EY and Wirecard in Germany, Deloitte and multiple audit failures in Britain — because the client pays for the audit.","mn":"If the institution that collects tax from the rich can be broken with the help of an accounting firm, everything downstream — schools, clinics, pensions — is paid for by everyone else.","pt":["p2","p10"],"sr":[["Judicial Commission of Inquiry into State Capture (Zondo Commission) reports","https://www.statecapture.org.za/site/information/reports"],["KPMG withdraws findings of its SARS report and apologises (Guardian, Sept 2017)","https://www.theguardian.com/world/2017/sep/15/kpmg-south-africa-gupta-report"]],"i":62},{"id":"luxembourg","n":"Luxembourg Ministry of Finance","t":"secr","lat":49.61,"lon":6.129,"pl":"Luxembourg City, Luxembourg","ad":"3 rue de la Congrégation, L-1352 Luxembourg","ro":"An EU member state that sold private tax rulings to hundreds of multinationals.","who":"Gilles Roth, Minister of Finance","rch":"global","mx":["hide","cap"],"fg":[["LuxLeaks","548 advance tax agreements for 340+ companies, 2002–2010"],["Effective rates obtained","under 1% on profits routed through Luxembourg in some arrangements"],["Fiat / Amazon / Engie","all subjects of EU state aid decisions on Luxembourg rulings"]],"rd":"Luxembourg has 680,000 people and one of the largest investment-fund industries on earth. For years its tax authority issued confidential advance rulings telling companies in writing that their internal loan and royalty structures would be accepted, which converted an aggressive scheme into a certainty. Jean-Claude Juncker was prime minister and finance minister through most of that period and went on to become President of the European Commission — the body that then ruled against several of those arrangements.\nThe losses fall on the countries where the sales and the staff actually are.","mn":"One small EU country can offer the whole continent's profits a near-zero tax rate, and the hospitals that lose the money are in the countries that lost the profit.","pt":["p2","p10"],"sr":[["ICIJ, Luxembourg Leaks","https://www.icij.org/investigations/luxembourg-leaks/"],["European Commission state aid decisions (Fiat, Amazon, Engie)","https://competition-cases.ec.europa.eu/search?caseInstrument=SA"]],"i":63},{"id":"netherlands","n":"Ministry of Finance, Netherlands","t":"secr","lat":52.081,"lon":4.317,"pl":"The Hague, Netherlands","ad":"Korte Voorhout 7, 2511 CW The Hague","ro":"The conduit: a dense treaty network that lets money pass through almost untaxed on its way out.","who":"Minister of Finance of the Netherlands","rch":"global","mx":["hide","cap"],"fg":[["Treaty network","among the world's largest, historically with very low or zero withholding on outbound royalties and interest"],["Conduit role","identified in academic network analysis as one of the main global conduit jurisdictions"],["Withholding tax","a conditional withholding tax on interest and royalties to low-tax jurisdictions introduced from 2021"]],"rd":"A conduit country does not need to be the final destination. Through a Dutch holding company, a royalty paid by a subsidiary in Nigeria or Brazil can leave for a zero-tax jurisdiction without being taxed on the way, because the treaty with the source country cuts the withholding tax that would otherwise apply. For developing countries this is the quieter and larger loss: not evasion, but treaties their own governments signed.\nThe Netherlands has since introduced withholding taxes on payments to low-tax jurisdictions and renegotiated some treaties, and remains a central node in the network.","mn":"A tax treaty signed decades ago can quietly hand away a poor country's right to tax the profits made inside its own borders.","pt":["p2","p9"],"sr":[["Garcia-Bernardo et al., 'Uncovering Offshore Financial Centers: Conduits and Sinks', Scientific Reports (2017)","https://www.nature.com/articles/s41598-017-06322-9"],["SOMO research on Dutch tax treaties and developing countries","https://www.somo.nl/"]],"i":64},{"id":"singapore","n":"Monetary Authority of Singapore","t":"secr","lat":1.276,"lon":103.849,"pl":"Singapore","ad":"10 Shenton Way, MAS Building, Singapore 079117","ro":"Asia's wealth-management hub and the regional centre for family offices.","who":"Chia Der Jiun, managing director","rch":"global","mx":["hide","trans"],"fg":[["Single family offices","grew from a few dozen in 2018 to well over 1,000 by the mid-2020s"],["Assets under management","Singapore manages trillions in cross-border wealth"],["Estate duty","abolished in 2008"]],"rd":"Singapore has no inheritance tax, no capital gains tax, territorial taxation of foreign income for many structures, and an incentive regime that has pulled more than a thousand single family offices into the city in under a decade. Much of the money arriving is from elsewhere in Asia, including from countries whose public finances badly need it.\nThe state also runs one of the most effective public housing systems in the world, which is a reminder that these mechanisms are choices rather than laws of nature: the same government that houses 80% of its citizens also hosts the region's untaxed fortunes.","mn":"A country can give the very wealthy a permanent exemption from inheritance tax and still call itself meritocratic, because the exemption only shows up a generation later.","pt":["p12","p10"],"sr":[["MAS family office incentive schemes","https://www.mas.gov.sg/development/wealth-management"],["Tax Justice Network, Financial Secrecy Index — Singapore","https://fsi.taxjustice.net/country-detail/#country=SG"]],"i":65},{"id":"genevafreeport","n":"Ports Francs et Entrepôts de Genève (Geneva Freeport)","t":"secr","lat":46.193,"lon":6.124,"pl":"Geneva, Switzerland","ad":"Route du Grand-Lancy 6, 1227 Les Acacias, Geneva","ro":"A bonded warehouse where art and valuables sit untaxed and, in effect, nowhere.","who":"A company majority-owned by the Canton of Geneva.","rch":"global","mx":["hide","trans"],"fg":[["Works of art estimated to be stored there","over a million, by past estimates"],["Customs status","goods in transit; no import duty or VAT while stored"],["Change of ownership inside the warehouse","possible without the goods moving or entering Switzerland"]],"rd":"Goods in a freeport are legally in transit, however long they stay. Storage is indefinite, tax falls due only on import, and a painting can be sold several times without leaving the building or being declared anywhere. A 2014 Swiss audit prompted tighter inventory rules after looted antiquities were found in storage. The warehouse's clientele is the part of the art market in which value is stored rather than displayed.","mn":"A freeport turns a painting into an untaxed bearer asset. Nothing about this is secret in principle; the point is that no tax authority has an event to attach a charge to.","pt":["p10","p12"],"sr":[["Ports Francs et Entrepôts de Genève","https://www.geneva-freeports.ch/en/"],["Guardian: Switzerland's freeports and the art stored in them","https://www.theguardian.com/world/2016/jan/27/switzerland-freeports-art-storage-tax-haven"]],"i":66},{"id":"pwc","n":"PwC","t":"secr","lat":51.507,"lon":-0.123,"pl":"London, United Kingdom","ad":"1 Embankment Place, London WC2N 6RH","ro":"One of four accounting firms that design, sell and audit the structures that move profit out of reach.","who":"Mohamed Kande, global chairman","rch":"global","mx":["hide","cap"],"fg":[["LuxLeaks (2014)","548 leaked private tax rulings PwC obtained from Luxembourg for over 340 companies"],["Australia (2023)","confidential government tax-law briefings leaked to clients; the Australian consulting arm was sold for $1 to settle the crisis"]],"rd":"In 2014 a PwC employee leaked 28,000 pages showing the firm had obtained 548 private rulings from Luxembourg's tax authority for more than 340 multinationals, confirming in advance that elaborate internal loans and licence fees would be accepted. The companies paid, in some cases, under 1% on profits routed through the Grand Duchy. The whistleblower, Antoine Deltour, was prosecuted in Luxembourg; the firm was not.\nIn 2023 the Australian Senate found PwC partners had taken confidential briefings on new anti-avoidance law and used them to help clients get ahead of it.","mn":"The same small group of firms audits the accounts that governments rely on and sells the schemes that empty them, and it is paid far better for the second job.","pt":["p2","p10"],"sr":[["ICIJ, Luxembourg Leaks","https://www.icij.org/investigations/luxembourg-leaks/"],["Australian Senate inquiry into the PwC tax leaks scandal","https://www.aph.gov.au/Parliamentary_Business/Committees/Senate/Finance_and_Public_Administration/Consultingservices"]],"i":67},{"id":"switzerland","n":"Swiss Federal Department of Finance","t":"secr","lat":46.948,"lon":7.442,"pl":"Bern, Switzerland","ad":"Bundesgasse 3, 3003 Bern","ro":"The state that made banking secrecy a criminal-law protection and the global standard for hidden wealth.","who":"Karin Keller-Sutter, head of the Federal Department of Finance","rch":"global","mx":["hide","trans"],"fg":[["Banking Act 1934","made disclosure of client identity a criminal offence"],["Offshore household wealth","Switzerland remains the single largest host of foreign-owned private wealth"],["Automatic exchange","joined the OECD common reporting standard from 2017, with gaps for non-participating countries"]],"rd":"Article 47 of the 1934 Banking Act turned discretion into a criminal protection, and for seventy years Switzerland was where a fortune went to be unfindable. Automatic exchange of account information since 2017 has changed a great deal for residents of participating countries, and very little for residents of countries not in the system — which include many of the poorest, and those whose elites most need hiding.\nThe commodity traders in Geneva, Zug and Baar sit in the same jurisdiction, so the money and the trades that produce it are governed by the same discreet law.","mn":"Secrecy is not a neutral service: it decides whether a country can tax its own richest residents, and most poor countries still cannot.","pt":["p10"],"sr":[["Alstadsæter, Johannesen & Zucman, 'Who Owns the Wealth in Tax Havens?'","https://gabriel-zucman.eu/files/AJZ2018.pdf"],["Tax Justice Network, Financial Secrecy Index — Switzerland","https://fsi.taxjustice.net/country-detail/#country=CH"]],"i":68},{"id":"csc","n":"The Corporation Trust Center","t":"secr","lat":39.747,"lon":-75.549,"pl":"Wilmington, Delaware, United States","ad":"1209 North Orange Street, Wilmington, DE 19801","ro":"A single-storey building that is the legal address of hundreds of thousands of companies.","who":"Operated by CSC (Corporation Service Company)","rch":"global","mx":["hide"],"fg":[["Companies registered at this address","reported at more than 285,000"],["Delaware incorporations","around two-thirds of Fortune 500 companies are incorporated in the state"]],"rd":"Delaware's business is law. Its courts are fast and predictable, its corporate statute is written with the advice of the corporate bar, and until recently it required almost nothing about who actually owns a company. 1209 North Orange Street is the registered agent's address for hundreds of thousands of entities, which is why it has appeared on filings next to the names of multinationals, shell companies and sanctioned fortunes alike.\nThe state collects fees rather than taxes on this traffic: franchise taxes and incorporation fees fund a large share of Delaware's budget, paid by companies whose profits are earned and whose workers live somewhere else.","mn":"A company can be a legal resident of a filing cabinet in Delaware while its profits come from your town, which is how it stops owing your town anything.","pt":["p10","p2"],"sr":[["Tax Justice Network, Financial Secrecy Index — United States","https://fsi.taxjustice.net/country-detail/#country=US"],["Delaware Division of Corporations annual reports","https://corp.delaware.gov/stats/"]],"i":69},{"id":"ubs","n":"UBS","t":"secr","lat":47.3698,"lon":8.539,"pl":"Zurich, Switzerland","ad":"Bahnhofstrasse 45, 8001 Zurich","ro":"The bank at the centre of private wealth management, and of the fight over banking secrecy.","who":"Sergio Ermotti, group chief executive; Colm Kelleher, chairman","rch":"global","mx":["hide","trans","conc"],"fg":[["US deferred prosecution (2009)","$780 million; names of 4,450 US account holders disclosed"],["French conviction (2019, reduced 2021/2025)","initial €4.5 billion penalty for illegal client solicitation and laundering of tax fraud proceeds"],["Assets after Credit Suisse rescue (2023)","roughly $6.9 trillion invested assets"]],"rd":"For most of the twentieth century Swiss law made it a crime for a banker to reveal who a client was, and that single rule built an industry. UBS was prosecuted in the United States in 2009 for helping Americans hide money and paid $780 million while handing over thousands of names — the moment bank secrecy began to crack. France convicted it in 2019 of soliciting clients illegally and laundering the proceeds of tax fraud. After the Swiss state engineered its absorption of Credit Suisse in 2023 it became one bank managing close to $7 trillion for the world's wealthiest households.\nWhat secrecy buys is not the money itself but the gap between the tax a fortune owes and the tax it pays.","mn":"If the richest households can keep their holdings out of sight, everyone else pays the share that was missed — usually through taxes on wages and spending, which fall hardest on the people with the least.","pt":["p10"],"sr":[["UBS deferred prosecution agreement (US DOJ, 2009)","https://www.justice.gov/opa/pr/ubs-enters-deferred-prosecution-agreement"],["Tax Justice Network, State of Tax Justice 2025","https://taxjustice.net/wp-content/uploads/2025/11/State-of-Tax-Justice-2025-report-Tax-Justice-Network.pdf"]],"i":70},{"id":"ugland","n":"Ugland House","t":"secr","lat":19.292,"lon":-81.384,"pl":"George Town, Cayman Islands","ad":"121 South Church Street, George Town, Grand Cayman KY1-1104","ro":"A five-storey office that is the registered address of tens of thousands of companies.","who":"Offices of the law firm Maples Group","rch":"global","mx":["hide"],"fg":[["Companies registered at the address","around 19,000 at the time of a 2008 US GAO review"],["Cayman Islands","consistently near the top of the Corporate Tax Haven Index"],["Corporate tax rate","zero"]],"rd":"The Cayman Islands charge no corporate income tax, no capital gains tax and no inheritance tax, and host more registered investment funds than almost anywhere. Ugland House became famous when a US president named it in a speech about tax avoidance; the firm's answer was that having a registered address is not the same as doing business there, which is exactly the point. A fund can be managed in New York, invest in Germany and be resident in Cayman.\nThe territory is a British Overseas Territory, which places it inside the network the Tax Justice Network calls the UK's second empire — responsible, with the Crown Dependencies, for a large share of global corporate tax losses.","mn":"Profit made by people working in one country can be legally located in a building where nobody works, and the tax that would have paid for their roads and schools goes nowhere.","pt":["p10","p2"],"sr":[["US GAO, 'Cayman Islands: Business and Tax Advantages' (GAO-08-778)","https://www.gao.gov/products/gao-08-778"],["Tax Justice Network, Corporate Tax Haven Index","https://cthi.taxjustice.net/"]],"i":71},{"id":"cha","n":"Chicago Housing Authority — the Plan for Transformation","t":"pub","lat":41.8768,"lon":-87.6258,"pl":"Chicago, Illinois, United States","ad":"Chicago Housing Authority, 60 East Van Buren Street, Chicago, IL 60605","ro":"The demolition of 18,000 public housing units in one city, and the vouchers that were meant to replace them.","who":"The Chicago Housing Authority, under a 2000 agreement with the US Department of Housing and Urban Development.","rch":"national","mx":["priv","excl","rent"],"fg":[["Units slated for demolition from 2000","about 18,000"],["Plan commitment","25,000 units rebuilt or rehabilitated"],["Residents who returned to redeveloped units","a minority of those displaced"],["High-rises cleared","including Cabrini-Green and the Robert Taylor Homes"]],"rd":"The towers were in poor condition, and the authority had let them get that way. The Plan for Transformation cleared them and issued vouchers; residents were to return to mixed-income developments built on the land. Tracking studies found that most did not return, that many moved into neighbourhoods about as segregated and poor as the ones they left, and that the cleared land in some cases carried higher-value development. Parallel programmes ran in other cities under HOPE VI.","mn":"Public housing is the one form of housing whose rent does not rise with the market. Replacing it with a voucher hands the subsidy to a private landlord and leaves the tenant exposed to the market the voucher is spent in.","pt":["p15","p6"],"sr":[["MacArthur Foundation: the CHA's Plan for Transformation — what does the research show?","https://www.macfound.org/media/article_pdfs/valegraves_cha_pft_final-report.pdf"],["National Low Income Housing Coalition: outcomes for relocated Chicago residents","https://nlihc.org/resource/study-assesses-outcomes-relocated-chicago-public-housing-residents"]],"i":72},{"id":"chilepensions","n":"Private pensions — Chile","t":"pub","lat":-33.443,"lon":-70.654,"pl":"Santiago, Chile","ad":"Palacio de La Moneda, Moneda s/n, Santiago","ro":"The world's first fully privatised pension system, exported to a dozen countries.","who":"Imposed by decree in 1981 under the military government; administered by private AFP fund managers","rch":"regional","mx":["priv","cond"],"fg":[["1981","state pay-as-you-go pensions replaced by compulsory individual accounts run by private AFPs"],["Replacement rates","median pensions have come in far below the 70% of final salary originally promised; a large share of pensioners receive less than the minimum wage"],["Protests","the 'No+AFP' movement brought hundreds of thousands into the streets from 2016"],["Reform","a 2025 law introduced a larger employer contribution and a strengthened public pillar"]],"rd":"Chile's 1981 reform replaced a collective pension with a personal savings account managed by a private firm for a fee. It was designed by the Chicago-trained economists working for the junta, exempted the armed forces from the new system, and was presented to the world as a model — adopted in whole or part by Peru, Mexico, Colombia, Poland, Hungary and others. Forty years of data arrived: because contributions require continuous formal employment and women live longer and work informally more often, median pensions came in far below what was promised, and the fund managers collected fees regardless of returns.\nAfter a decade of mass protest, Chile legislated a substantial reform in 2025. Several of the countries that copied the model reversed it earlier.","mn":"An individual savings account can only pay a pension if you had steady formal work for forty years, which most people in most countries did not.","pt":["p8","p11","p15"],"sr":[["OECD Pensions at a Glance, Chile","https://www.oecd.org/pensions/pensions-at-a-glance.htm"],["ILO, 'Reversing pension privatization' (2018)","https://www.ilo.org/publications/reversing-pension-privatization-rebuilding-public-pension-systems-eastern"]],"i":73},{"id":"russiaprivat","n":"Privatisation — Russia","t":"pub","lat":55.754,"lon":37.578,"pl":"Moscow, Russia","ad":"Government House, Krasnopresnenskaya naberezhnaya 2, Moscow 103274","ro":"The fastest transfer of public assets to private hands in modern history.","who":"The 1992–96 Russian government; privatisation led by Anatoly Chubais, advised by Western economists and institutions","rch":"national","mx":["priv","conc"],"fg":[["Voucher privatisation","1992–94: every citizen received a voucher; most were sold cheaply within months"],["Loans-for-shares","1995–96: major oil, metals and media assets transferred to a small group of bankers at prices far below value"],["Outcome","Russia moved from one of the world's most equal recorded income distributions to one of the least equal within a decade"],["Offshore wealth","Novokmet, Piketty & Zucman estimate Russian offshore holdings at roughly the size of all officially recorded household financial assets"]],"rd":"In 1991 the Soviet state owned everything. By 1996 its oil, nickel, aluminium and television had been transferred to a few dozen men, partly through a scheme in which the state borrowed from private banks and pledged shares in its best companies as collateral, then defaulted. Novokmet, Piketty and Zucman reconstructed what happened to the distribution: the top 1% share roughly tripled, the bottom half's income fell in absolute terms, male life expectancy dropped by years, and an amount of wealth comparable to all recorded household financial assets ended up offshore.\nIt is the clearest natural experiment available on how fast a distribution can be remade, and on how durable the result is: thirty years later the same families hold the same assets.","mn":"A distribution of wealth can be rewritten in four years and then last for generations, which is why who gets the assets at the moment of transfer matters more than any policy afterwards.","pt":["p8","p12","p15"],"sr":[["Novokmet, Piketty & Zucman, 'From Soviets to Oligarchs' (2018)","https://wid.world/document/soviets-oligarchs-inequality-property-russia-1905-2016/"],["Novokmet, Piketty & Zucman, 'From Soviets to Oligarchs' (NBER Working Paper 23712)","https://www.nber.org/papers/w23712"]],"i":74},{"id":"righttobuy","n":"Right to Buy","t":"pub","lat":51.495,"lon":-0.13,"pl":"London, United Kingdom","ad":"Ministry of Housing, Communities and Local Government, 2 Marsham Street, London SW1P 4DF","ro":"The policy that sold off a third of Britain's public housing at a discount and did not replace it.","who":"Enacted in the Housing Act 1980; administered by the housing ministry and local councils.","rch":"national","mx":["priv","rent"],"fg":[["Homes sold in England since 1980","2,052,813 to 31 March 2026"],["Sold across the UK by March 2025","about 2.8 million"],["Average discount to market value","about 44%"],["Households in social housing, UK","31% in 1981, 17% now"],["Right to Buy homes now privately rented","about 40%"]],"rd":"Tenants bought their council homes at large discounts, and councils were restricted in how the receipts could be spent, so the stock was not rebuilt. The number of social homes in the UK fell from 6.8 million to 5.2 million. About two in five of the homes sold are now let by private landlords, often to tenants on housing benefit, so public money that once maintained public housing now pays rent to the owner of a house the state sold at a discount.","mn":"The first buyers gained a real asset, which many have passed on. The households that came after them found neither a council house nor an affordable purchase, and rent to a landlord who bought one of the houses that was sold. One generation's windfall was the next generation's rent.","pt":["p15","p6"],"sr":[["Right to Buy sales and replacements, England, 2025 to 2026 (official statistics)","https://www.gov.uk/government/statistics/right-to-buy-sales-and-replacements-england-2025-to-2026/right-to-buy-sales-and-replacements-england-april-2025-to-march-2026"],["Chartered Institute of Housing: UK Housing Review 2026 on Right to Buy","https://www.cih.org/news/2026-uk-housing-review-highlights-continued-impact-of-right-to-buy-on-housing-pressures/"]],"i":75},{"id":"rodriguez","n":"San Antonio ISD v. Rodriguez","t":"pub","lat":38.8906,"lon":-77.0044,"pl":"Washington, DC, United States","ad":"Supreme Court of the United States, 1 First Street NE, Washington, DC 20543","ro":"The 1973 decision that education is not a fundamental right under the US Constitution, which left school funding tied to local property wealth.","who":"Decided 5-4; Justice Powell wrote the majority opinion, two years after writing the memorandum that launched the US Chamber's legal campaign.","rch":"national","mx":["excl","cap"],"fg":[["Decided","21 March 1973, 5-4"],["Holding","wealth is not a suspect class and education is not a fundamental right"],["Consequence","funding disparities between districts raise no federal constitutional question"],["Where the litigation moved instead","state courts, under state constitutions"]],"rd":"Parents in a poor district of San Antonio argued that funding schools from local property taxes gave their children less than children a few miles away. The Court held that the Constitution does not require otherwise. Property-tax funding remained the norm, which means the quality of a school is a function of the value of the houses around it, and the value of those houses reflects, among other things, who was permitted to buy them in the decades when federal mortgage insurance was conditioned on race.","mn":"Two mechanisms lock together here. Housing decided who owned property; this decision made property the basis of school funding, and declared that no federal court could hear a complaint about it.","pt":["p3","p9"],"sr":[["San Antonio Independent School District v. Rodriguez, 411 U.S. 1 (1973)","https://supreme.justia.com/cases/federal/us/411/1/"],["Oyez: San Antonio Independent School District v. Rodriguez","https://www.oyez.org/cases/1972/71-1332"]],"i":76},{"id":"adia","n":"Abu Dhabi Investment Authority (ADIA)","t":"own","lat":24.487,"lon":54.357,"pl":"Abu Dhabi, United Arab Emirates","ad":"211 Corniche Street, P.O. Box 3600, Abu Dhabi","ro":"One of the largest pools of investment capital in the world, which publishes no figure for its own size.","who":"Chaired by the ruler of Abu Dhabi; managing director Sheikh Hamed bin Zayed Al Nahyan.","rch":"global","mx":["conc","hide","rent"],"fg":[["Assets under management","estimated about $1.1-1.2 trillion; ADIA does not publish a figure"],["Established","1976"],["Share held outside the UAE","the great majority"]],"rd":"ADIA has been investing oil revenue abroad since 1976 and is among the handful of funds holding more than a trillion dollars. It does not disclose its assets, its holdings or its returns in the way a pension fund must, so rankings of it are estimates. It is a landlord, lender and shareholder across dozens of countries, including in housing and infrastructure.","mn":"Very large investors move prices in the markets they enter, including housing. When the investor publishes nothing, the people whose rent or water bill is affected have no way to see who the owner is.","pt":["p1","p6","p10"],"sr":[["ADIA: about us","https://www.adia.ae/en/about"],["Global SWF rankings via Gulf Business: three GCC funds above $1tn","https://gulfbusiness.com/3-gcc-swfs-aum-over-1tn-global-swf/"]],"i":77},{"id":"blackrock","n":"BlackRock","t":"own","lat":40.7555,"lon":-74.001,"pl":"New York, United States","ad":"50 Hudson Yards, New York, NY 10001","ro":"The largest asset manager in history; votes other people's savings at almost every big company on earth.","who":"Laurence (Larry) Fink, chairman and chief executive","rch":"global","mx":["conc","cap","rent"],"fg":[["Assets under management","$15.49 trillion (30 Sep 2026)"],["Net inflows, 12 months","$869 billion"],["Q3 2026 revenue","$7.75 billion"]],"rd":"BlackRock does not usually own factories or employ the workers whose pay is at stake. It owns the shares. Money from pension funds, 401(k)s and insurance savings flows into its index funds, and with that money comes the right to vote at shareholder meetings — which is the right to approve or block executive pay packages, buybacks, board slates and mergers. By September 2026 it held $15.49 trillion, more than the annual output of every country except the United States and China.\nThe effect is quiet and structural. A single firm, answering to its own executives, casts votes across competing companies in the same industry at once, and it almost always votes with management. It also runs Aladdin, the risk software that other managers rent to watch their own portfolios, so a large share of the world's investable money is read through one lens.","mn":"The savings of ordinary workers are pooled into a block of voting power that those workers never exercise, and it is used to approve the pay packages and buybacks that widen the gap between them and the people at the top.","pt":["p1"],"sr":[["BlackRock Q3 2026 results (company release)","https://www.blackrock.com/corporate/newsroom/media/press-releases/blackrock-reports-third-quarter-2026"],["Fichtner, Heemskerk & Garcia-Bernardo, 'These three firms own corporate America'","https://theconversation.com/these-three-firms-own-corporate-america-77072"]],"i":78},{"id":"blackstone","n":"Blackstone","t":"own","lat":40.7589,"lon":-73.9712,"pl":"New York, United States","ad":"345 Park Avenue, New York, NY 10154","ro":"The largest private-equity firm and, through Invitation Homes, the firm that turned ordinary family houses into a traded asset class.","who":"Stephen A. Schwarzman, co-founder, chairman and chief executive","rch":"global","mx":["conc","rent","priv"],"fg":[["UN communication","OL OTH 17/2019, sent 22 March 2019"],["Invitation Homes","largest single-family landlord in the US after the 2017 Starwood Waypoint merger"]],"rd":"After the 2008 crash, when millions of American families lost houses to foreclosure, Blackstone bought those houses in bulk, cheaply, and rented them back. The vehicle became Invitation Homes, the biggest single-family landlord in the country. In March 2019 the UN Special Rapporteur on the right to housing, Leilani Farha, and the chair of the UN working group on business and human rights wrote directly to Schwarzman, saying the firm's model was ‘pushing low-income, and increasingly middle-income people from their homes’ and that its practices were inconsistent with international human rights law. Blackstone replied that the letter contained false claims and factual errors.\nThe mechanism is simple enough to say in a sentence: a house that used to be a family's main asset becomes somebody else's yield.","mn":"Housing is where most families either build wealth or lose it; when the house becomes a financial product, the rent paid by one household becomes the asset growth of another.","pt":["p6","p15"],"sr":[["UN letter to Blackstone, 22 March 2019","https://www.business-humanrights.org/en/letter-to-blackstone-ceo-from-the-un-special-rapporteur-on-the-right-to-adequate-housing-un-working-group-on-business-human-rights"],["UN experts: tenants 'forced out their homes' by global investment firms","https://news.un.org/en/node/1035441"]],"i":79},{"id":"musk","n":"Elon Musk","t":"own","lat":30.222,"lon":-97.617,"pl":"Austin, Texas, United States","ad":"Tesla Inc., 1 Tesla Road, Austin, TX 78725","ro":"The first person to hold a trillion dollars, and the test case for whether one fortune can be bigger than a state.","who":"Chief executive of Tesla; founder of SpaceX and xAI; owner of X","rch":"global","mx":["conc","cap"],"fg":[["Net worth","about $896 billion (Forbes real-time, 17 November 2026); first passed $1 trillion in June 2026 aft
