al recorded income distributions to one of the least equal within a decade"],["Offshore wealth","Novokmet, Piketty & Zucman estimate Russian offshore holdings at roughly the size of all officially recorded household financial assets"]],"rd":"In 1991 the Soviet state owned everything. By 1996 its oil, nickel, aluminium and television had been transferred to a few dozen men, partly through a scheme in which the state borrowed from private banks and pledged shares in its best companies as collateral, then defaulted. Novokmet, Piketty and Zucman reconstructed what happened to the distribution: the top 1% share roughly tripled, the bottom half's income fell in absolute terms, male life expectancy dropped by years, and an amount of wealth comparable to all recorded household financial assets ended up offshore.\nIt is the clearest natural experiment available on how fast a distribution can be remade, and on how durable the result is: thirty years later the same families hold the same assets.","mn":"A distribution of wealth can be rewritten in four years and then last for generations, which is why who gets the assets at the moment of transfer matters more than any policy afterwards.","pt":["p8","p12"],"sr":[["Novokmet, Piketty & Zucman, 'From Soviets to Oligarchs' (2018)","https://wid.world/document/soviets-oligarchs-inequality-property-russia-1905-2016/"],["Novokmet, Piketty & Zucman, 'From Soviets to Oligarchs' (NBER Working Paper 23712)","https://www.nber.org/papers/w23712"]],"i":79},{"id":"chilepensions","n":"Private pensions — Chile","t":"state","lat":-33.443,"lon":-70.654,"pl":"Santiago, Chile","ad":"Palacio de La Moneda, Moneda s/n, Santiago","ro":"The world's first fully privatised pension system, exported to a dozen countries.","who":"Imposed by decree in 1981 under the military government; administered by private AFP fund managers","rch":"regional","mx":["priv","aust"],"fg":[["1981","state pay-as-you-go pensions replaced by compulsory individual accounts run by private AFPs"],["Replacement rates","median pensions have come in far below the 70% of final salary originally promised; a large share of pensioners receive less than the minimum wage"],["Protests","the 'No+AFP' movement brought hundreds of thousands into the streets from 2016"],["Reform","a 2025 law introduced a larger employer contribution and a strengthened public pillar"]],"rd":"Chile's 1981 reform replaced a collective pension with a personal savings account managed by a private firm for a fee. It was designed by the Chicago-trained economists working for the junta, exempted the armed forces from the new system, and was presented to the world as a model — adopted in whole or part by Peru, Mexico, Colombia, Poland, Hungary and others. Forty years of data arrived: because contributions require continuous formal employment and women live longer and work informally more often, median pensions came in far below what was promised, and the fund managers collected fees regardless of returns.\nAfter a decade of mass protest, Chile legislated a substantial reform in 2025. Several of the countries that copied the model reversed it earlier.","mn":"An individual savings account can only pay a pension if you had steady formal work for forty years, which most people in most countries did not.","pt":["p8","p11"],"sr":[["OECD Pensions at a Glance, Chile","https://www.oecd.org/pensions/pensions-at-a-glance.htm"],["ILO, 'Reversing pension privatization' (2018)","https://www.ilo.org/publications/reversing-pension-privatization-rebuilding-public-pension-systems-eastern"]],"i":80},{"id":"unitedhealth","n":"UnitedHealth Group","t":"corp","lat":44.922,"lon":-93.465,"pl":"Minnetonka, Minnesota, United States","ad":"1 UnitedHealth Group Centre, 9900 Bren Road East, Minnetonka, MN 55343","ro":"The largest health insurer in the country where illness is a leading cause of bankruptcy.","who":"Stephen Hemsley, chief executive","rch":"national","mx":["price","rent"],"fg":[["Revenue","over $400 billion a year — among the largest companies in the world by revenue"],["Medical debt","roughly $220 billion in medical debt held by US adults (KFF); about 14 million owe over $1,000"],["Claim denial","a 2024 US Senate subcommittee report found prior-authorisation denial rates for post-acute care rising sharply at the largest Medicare Advantage insurers, UnitedHealth included"],["Physicians employed or affiliated","around 90,000, through Optum"]],"rd":"In most rich countries a serious illness is a medical event. In the United States it is also a financial one: Americans hold roughly $220 billion in medical debt, and the mechanism that creates it runs through insurers who decide what is covered. A US Senate subcommittee examined the largest Medicare Advantage plans in 2024 and found denial rates for post-acute care — nursing homes, rehabilitation after a stroke — climbing steeply while the companies moved to automated review. UnitedHealth also owns Optum, which employs or affiliates roughly 90,000 doctors, so it increasingly sits on both sides of the transaction.\nThe distributional effect is sharp and specific: the same diagnosis costs a low-income household its savings and a wealthy one an inconvenience.","mn":"If getting treated can bankrupt you, then health insurance is not protection against illness — it is the thing deciding who is allowed to stay solvent.","pt":["p6","p5"],"sr":[["US Senate Permanent Subcommittee on Investigations, 'Refusal of Recovery' (Oct 2024)","https://www.hsgac.senate.gov/wp-content/uploads/2024.10.17-PSI-Majority-Staff-Report-on-Medicare-Advantage.pdf"],["KFF, 'The Burden of Medical Debt in the United States'","https://www.kff.org/health-costs/issue-brief/the-burden-of-medical-debt-in-the-united-states/"]],"i":81},{"id":"lilly","n":"Eli Lilly","t":"corp","lat":39.768,"lon":-86.176,"pl":"Indianapolis, Indiana, United States","ad":"Lilly Corporate Center, 893 Delaware Street, Indianapolis, IN 46225","ro":"One of three companies that set the price of insulin for a century-old, patent-free discovery.","who":"David Ricks, chair and chief executive","rch":"global","mx":["price"],"fg":[["Insulin list price","Humalog rose from about $21 a vial in 1996 to about $275 by 2017"],["The patent","Banting and Best sold the insulin patent to the University of Toronto for $1 in 1923, intending it to be freely available"],["2023","Lilly cut US list prices by 70% and capped out-of-pocket costs at $35 after years of litigation, hearings and state lawsuits"],["Rationing","a 2019 Yale study found about 1 in 4 US patients had rationed insulin because of cost"]],"rd":"Insulin was discovered in 1921 and its patent given away for a dollar so that no one would profit from a drug people die without. Three companies — Lilly, Novo Nordisk and Sanofi — came to supply almost the entire market, and between 1996 and 2017 the list price of Lilly's Humalog rose roughly thirteenfold. The chemistry had not changed. A Yale study found a quarter of American patients rationing doses, which for a type 1 diabetic is a medical emergency with a predictable outcome.\nIn 2023, after congressional hearings, state lawsuits and a federal cap, Lilly cut list prices by 70%. That the price could fall that far on command is the proof that it was never about the cost of making it.","mn":"A price that can be cut by 70% in a single announcement was never a cost — it was a decision about what people would pay to stay alive.","pt":["p5"],"sr":[["Herkert et al., 'Cost-Related Insulin Underuse Among Patients with Diabetes', JAMA Internal Medicine (2019)","https://jamanetwork.com/journals/jamainternalmedicine/fullarticle/2717499"],["Eli Lilly announcement cutting insulin prices (March 2023)","https://investor.lilly.com/news-releases/news-release-details/lilly-cuts-insulin-prices-70-and-caps-patient-insulin-out-pocket"]],"i":82},{"id":"navient","n":"Navient","t":"corp","lat":39.756,"lon":-75.549,"pl":"Wilmington, Delaware, United States","ad":"123 Justison Street, Wilmington, DE 19801","ro":"Serviced the student loans of a generation, and was found to have steered borrowers into costlier repayment.","who":"David Yowan, president and chief executive","rch":"national","mx":["debt","rent"],"fg":[["US student debt","about $1.6 trillion owed by roughly 43 million borrowers"],["CFPB settlement (2024)","Navient banned from federal student loan servicing; $120 million in penalties and redress"],["State settlement (2022)","$1.85 billion across 39 states over subprime and forbearance-steering practices"],["Racial gap","Black graduates owe substantially more than white graduates four years after graduation (Brookings)"]],"rd":"American higher education was funded by shifting the cost onto students as debt, and the debt was administered by contractors paid per account. The Consumer Financial Protection Bureau found Navient had steered borrowers who qualified for income-driven repayment into forbearance instead — simpler for the servicer, and more expensive for the borrower, because interest kept accruing. In 2024 it was banned from federal servicing and paid $120 million; in 2022 it settled with 39 states for $1.85 billion.\nStudent debt is a near-perfect inequality machine because its burden is inverse to family wealth: the student whose parents could pay graduates owing nothing, and the one whose parents could not pays interest for thirty years on the same degree.","mn":"Charging people to acquire skills and then charging them interest for thirty years makes education a way of sorting by family wealth rather than a way out of it.","pt":["p4","p12"],"sr":[["CFPB order against Navient (September 2024)","https://www.consumerfinance.gov/about-us/newsroom/cfpb-bans-navient-from-federal-student-loan-servicing-and-orders-the-company-to-pay-120-million-for-wide-ranging-student-lending-failures/"],["Brookings, 'Black-white disparity in student loan debt'","https://www.brookings.edu/articles/black-white-disparity-in-student-loan-debt-more-than-triples-after-graduation/"]],"i":83},{"id":"kkr","n":"KKR","t":"fin","lat":40.754,"lon":-74.0003,"pl":"New York, United States","ad":"30 Hudson Yards, New York, NY 10001","ro":"Invented the leveraged buyout, and applied it to housing, hospitals and care homes.","who":"Joseph Bae and Scott Nuttall, co-chief executives; Henry Kravis and George Roberts, co-founders","rch":"global","mx":["rent","wage","own"],"fg":[["RJR Nabisco (1989)","$25 billion buyout, the model for the industry"],["US nursing homes","a 2021 NBER study of private-equity ownership found a 10% relative increase in short-term mortality among residents"],["Care homes","private equity now owns a large share of US nursing home beds and UK children's social care placements"]],"rd":"A leveraged buyout works by borrowing against the company you are buying, so the company carries the debt and the buyer carries the upside. Applied to a manufacturer it tends to produce cost cuts. Applied to a nursing home it produces a measurable change in how many residents die: economists studying US Medicare records found that private-equity ownership was associated with about a 10% relative increase in short-term mortality, through lower nurse staffing per resident.\nThe same structure has been applied to rental housing in Dublin, Berlin and Madrid, to GP surgeries, veterinary clinics, dentistry and children's care — that is, to the services where the customer cannot leave.","mn":"The logic that makes a factory more efficient makes a care home more dangerous, because in a care home the cost being cut is the person who checks on you.","pt":["p6","p1"],"sr":[["Gupta, Howell, Yannelis & Gupta, 'Does Private Equity Investment in Healthcare Benefit Patients?' NBER WP 28474","https://www.nber.org/papers/w28474"],["US GAO on private equity in nursing homes","https://www.gao.gov/products/gao-23-105617"]],"i":84},{"id":"vonovia","n":"Vonovia","t":"corp","lat":51.478,"lon":7.218,"pl":"Bochum, Germany","ad":"Universitätsstraße 133, 44803 Bochum","ro":"Europe's largest listed landlord, built from privatised public housing.","who":"Rolf Buch, chief executive","rch":"regional","mx":["rent","priv"],"fg":[["Apartments owned","around 550,000 across Germany, Sweden and Austria"],["Origin","assembled from large sales of municipal and state-owned housing stock in the 2000s"],["Berlin referendum (Sept 2021)","59.1% voted to expropriate large landlords' holdings; the result was not implemented"],["Berlin rent cap","passed in 2020, struck down by the Federal Constitutional Court in 2021 on competence grounds"]],"rd":"German cities sold enormous quantities of public housing in the 2000s to close budget gaps — Dresden sold its entire stock; Berlin sold around 200,000 units. The buyers consolidated into Vonovia and Deutsche Wohnen, which Vonovia then absorbed. Rents in Berlin roughly doubled over the following decade. In September 2021, 59.1% of Berliners voted in a binding-in-principle referendum to socialise the holdings of landlords owning more than 3,000 apartments; the city government did not carry it out.\nIt is the clearest case anywhere of a city selling the asset that controlled its own cost of living, and then being unable to buy it back or regulate it.","mn":"Once public housing is sold, the rent it used to hold down becomes somebody's income, and winning a referendum is not enough to get it back.","pt":["p6","p8"],"sr":[["Berlin referendum results, Deutsche Wohnen & Co. enteignen (September 2021)","https://www.berlin.de/wahlen/volksentscheide/"],["Federal Constitutional Court ruling on the Berlin rent cap (2021)","https://www.bundesverfassungsgericht.de/SharedDocs/Pressemitteilungen/EN/2021/bvg21-028.html"]],"i":85},{"id":"shell","n":"Shell","t":"corp","lat":51.503,"lon":-0.115,"pl":"London, United Kingdom","ad":"Shell Centre, 2 York Road, London SE1 7NA","ro":"Sixty-five years of oil from the Niger Delta, and the state of the Delta.","who":"Wael Sawan, chief executive","rch":"global","mx":["chain","disc","own"],"fg":[["Bodo spills (2008–09)","Shell settled for £55 million in 2015 with the Bodo community in Nigeria"],["UNEP Ogoniland assessment (2011)","found contamination requiring the largest clean-up operation in history, estimated at 25–30 years"],["Dutch court (2021)","the Hague Court of Appeal held Shell Nigeria liable for spills in Oruma and Goi"],["UK Supreme Court (2021)","allowed Nigerian communities to sue the parent company in England"],["Poverty","the oil-producing Niger Delta states remain among Nigeria's poorest on most measures"]],"rd":"The Niger Delta has produced oil since 1958 and has gas flares burning beside villages with no mains electricity. The UN Environment Programme's survey of Ogoniland found drinking water with benzene at hundreds of times the WHO guideline and a clean-up that would take a generation. Dutch and British courts have now held that Nigerian communities can sue the parent company, and Shell has settled with Bodo for £55 million. In 2024–25 it sold its onshore Nigerian business, transferring the remaining liabilities to a local consortium.\nThe revenue from the oil went to the federal government and the company; the water went to the people who live there.","mn":"Resource wealth makes a country rich on paper and the people standing on top of it poorer, unless somebody forces the revenue and the damage to land in the same place.","pt":["p9","p5"],"sr":[["UNEP, Environmental Assessment of Ogoniland (2011)","https://www.unep.org/explore-topics/disasters-conflicts/where-we-work/nigeria/environmental-assessment-ogoniland-report"],["Okpabi v Royal Dutch Shell, UK Supreme Court [2021] UKSC 3","https://www.supremecourt.uk/cases/uksc-2018-0068.html"]],"i":86},{"id":"wilmar","n":"Wilmar International","t":"corp","lat":1.277,"lon":103.851,"pl":"Singapore","ad":"56 Neil Road, Singapore 088830","ro":"The largest palm oil trader; sits between smallholders, plantations and most of the world's packaged food.","who":"Kuok Khoon Hong, chairman and chief executive","rch":"global","mx":["chain","wage","rent"],"fg":[["Market position","handles a very large share of globally traded palm oil"],["Labour findings","Amnesty International (2016) documented forced and child labour on plantations supplying Wilmar; later investigations found continuing abuses"],["Land conflict","hundreds of unresolved land disputes between Indonesian communities and plantation concessions"],["Smallholders","around 40% of Indonesian palm oil comes from smallholders who are price takers"]],"rd":"Palm oil is in roughly half the packaged products in a supermarket, and most of it passes through a handful of traders. Amnesty International's 2016 investigation of plantations supplying Wilmar found workers paid below the legal minimum once impossible quotas were applied, women hired as casual day labour for decades without benefits, and children carrying sacks. Wilmar adopted a no-deforestation, no-peat, no-exploitation policy in 2013, which changed its public commitments more than its supply base.\nUnderneath sits land: Indonesian communities whose customary claims were converted into concessions, and smallholders selling into a market with few buyers.","mn":"Any commodity that passes through only a few hands on its way to you has its price set there, not on the farm and not at the till.","pt":["p5","p9"],"sr":[["Amnesty International, 'The Great Palm Oil Scandal' (2016)","https://www.amnesty.org/en/documents/asa21/5184/2016/en/"],["Chain Reaction Research / Rainforest Action Network monitoring of palm oil supply chains","https://chainreactionresearch.com/"]],"i":87},{"id":"bayer","n":"Bayer (Monsanto)","t":"corp","lat":51.021,"lon":6.979,"pl":"Leverkusen, Germany","ad":"Kaiser-Wilhelm-Allee 1, 51373 Leverkusen","ro":"Owns the patents on the seeds a large share of the world's farmers plant.","who":"Bill Anderson, chief executive","rch":"global","mx":["price","law","chain"],"fg":[["Seed market","Bayer, Corteva, ChemChina/Syngenta and BASF control the large majority of the global commercial seed and agrochemical market"],["Saved seed","patented varieties are generally sold under agreements prohibiting replanting the harvest"],["Bowman v Monsanto (2013)","the US Supreme Court held unanimously that patent exhaustion does not permit a farmer to replant patented seed"],["Price","US maize seed prices roughly tripled in real terms over 1995–2014 (USDA data)"]],"rd":"For ten thousand years a farmer kept part of the harvest to plant next season. Patented seed ends that: the agreement signed at purchase prohibits replanting, and in Bowman v Monsanto the US Supreme Court agreed unanimously that it may. Combine that with consolidation — four firms now supply most commercial seed and the chemicals it is engineered to tolerate — and the farmer's single largest input cost is set annually by a company with few competitors. US maize seed prices roughly tripled in real terms in two decades.\nIn India the same dynamic ran through Bt cotton; in Latin America through soy. In each case the technology worked and the margin moved from the farm to the patent holder.","mn":"Making seed something you have to buy again every year moves the farmer's savings, permanently, to whoever holds the patent.","pt":["p5","p8"],"sr":[["Bowman v. Monsanto Co., 569 U.S. 278 (2013)","https://supreme.justia.com/cases/federal/us/569/278/"],["USDA Economic Research Service (farm input costs and seed market concentration data)","https://www.ers.usda.gov/"]],"i":88},{"id":"alphabet","n":"Alphabet (Google)","t":"corp","lat":37.422,"lon":-122.0841,"pl":"Mountain View, California, United States","ad":"1600 Amphitheatre Parkway, Mountain View, CA 94043","ro":"Built the 'Double Irish, Dutch sandwich' into a standard of corporate tax engineering.","who":"Sundar Pichai, chief executive","rch":"global","mx":["tax","price","own"],"fg":[["Bermuda","€19.9 billion in royalties shifted through a Dutch entity to Bermuda in 2017 alone, per Dutch filings"],["Structure","closed in 2019–20 after Irish law changed"],["No-poach settlement (2015)","$415 million paid by Google, Apple, Intel and Adobe over agreements not to recruit each other's engineers"],["Ad market","US and EU authorities have both brought monopolisation cases over the advertising technology stack"]],"rd":"The Double Irish moved profits from a trading company in Ireland to an Irish-registered company managed in Bermuda, with a Dutch entity in between so that no withholding tax applied. Dutch filings show €19.9 billion routed this way in 2017 alone. The structure was legal, widely copied, and closed only when Ireland changed its law.\nGoogle also sat at the centre of the Silicon Valley no-poach agreements — private undertakings between the biggest employers of engineers not to recruit each other's staff, which suppressed wages for tens of thousands of highly paid workers. The firms paid $415 million in 2015. If this is what the best-paid workers in the world needed a class action to discover, it is worth asking what is happening in labour markets with no lawyers.","mn":"Employers agreeing among themselves not to bid for each other's workers is the quiet mirror image of unions, and it has been found at the top of the wage scale as well as the bottom.","pt":["p2","p1"],"sr":[["In re High-Tech Employee Antitrust Litigation settlement","https://www.hightechemployeelawsuit.com/"],["Google shifted €19.9bn to Bermuda through a Dutch entity in 2017 (Guardian, Jan 2019)","https://www.theguardian.com/technology/2019/jan/03/google-tax-haven-bermuda-netherlands"]],"i":89},{"id":"eucommission","n":"European Commission","t":"inst","lat":50.843,"lon":4.38,"pl":"Brussels, Belgium","ad":"Berlaymont, Rue de la Loi 200, 1049 Brussels","ro":"Runs the farm subsidies that pay most to the largest landowners, and co-authored the austerity programmes.","who":"College of Commissioners; DG AGRI administers the Common Agricultural Policy","rch":"regional","mx":["rent","aust","law"],"fg":[["CAP budget","roughly €55–60 billion a year, about a third of the EU budget"],["Distribution","around 80% of direct payments go to about 20% of recipients, because payments are made per hectare"],["Recipients","investigations have found payments flowing to oligarch-linked holdings in Hungary, the Czech Republic and Slovakia"],["Troika","the Commission sat with the ECB and IMF in the Greek, Irish, Portuguese and Cypriot programmes"]],"rd":"The Common Agricultural Policy pays per hectare, so the more land you already own, the more public money you receive. Roughly four-fifths of direct payments go to a fifth of recipients. A New York Times investigation traced payments to holdings connected to the Hungarian prime minister's circle and to the Czech prime minister's own conglomerate. It is the largest single transfer programme in the European Union and it is regressive by construction.\nThe Commission was also one third of the Troika, co-signing the programmes that cut Greek pensions and Portuguese public wages while bondholders were paid.","mn":"A subsidy paid per acre is a subsidy paid in proportion to how much land you already have, which makes it a machine for widening the gap it claims to close.","pt":["p12","p11"],"sr":[["New York Times, 'The Money Farmers: How Oligarchs and Populists Milk the E.U. for Millions' (2019)","https://www.nytimes.com/2019/11/03/world/europe/eu-farm-subsidy-hungary.html"],["European Court of Auditors reports on CAP distribution","https://www.eca.europa.eu/en/publications"]],"i":90},{"id":"keidanren","n":"Keidanren and non-regular work — Japan","t":"lab","lat":35.686,"lon":139.76,"pl":"Tokyo, Japan","ad":"Keidanren Kaikan, 1-3-2 Otemachi, Chiyoda-ku, Tokyo 100-8188","ro":"The employers' federation behind the two-tier labour market that split a generation in half.","who":"Japan Business Federation (Nippon Keidanren)","rch":"national","mx":["wage","law"],"fg":[["Non-regular share of employment","around 37% of Japanese employees"],["Pay gap","non-regular workers earn substantially less per hour than regular employees doing comparable work, with weaker pension and bonus entitlements"],["Deregulation","successive relaxations of the Worker Dispatch Law from 1999 and 2004 opened most occupations to agency work"],["Relative poverty","Japan's relative poverty rate is among the higher ones in the OECD, concentrated among single mothers and older women"]],"rd":"Japan's postwar settlement offered lifetime employment, seniority pay and a company pension — to men hired directly out of university. When the economy stalled in the 1990s, firms did not cut that; they created a second category beside it. Keidanren's 1995 report proposed exactly this segmentation, and the dispatch-labour laws were relaxed to allow it. Non-regular workers — part-time, fixed-term, agency — are now around 37% of employees, doing similar work for substantially less, and the category is disproportionately women and anyone who graduated into a bad year.\nTwo workers at adjacent desks, one with a pension and one without, is inequality in its most legible form.","mn":"The cheapest way to cut labour costs without touching existing employees is to create a second class of worker beside them, and the dividing line is usually the year you were born.","pt":["p7"],"sr":[["OECD Economic Surveys: Japan, on labour market duality","https://www.oecd.org/economy/japan-economic-snapshot/"],["JILPT, research on non-regular employment in Japan","https://www.jil.go.jp/english/"]],"i":91},{"id":"phildmw","n":"Labour export — the Philippines","t":"state","lat":14.572,"lon":121.022,"pl":"Manila, Philippines","ad":"Department of Migrant Workers, Blas F. Ople Building, Ortigas Avenue, Mandaluyong, Metro Manila","ro":"A state that institutionalised exporting its own workers, and now depends on their remittances.","who":"Department of Migrant Workers (created 2022, from the former POEA)","rch":"national","mx":["mob","wage"],"fg":[["Overseas Filipino workers","around 2 million deployed annually; roughly 10% of the population lives or works abroad"],["Remittances","about $38–40 billion a year, close to 9% of GDP"],["Origins","the overseas employment programme was launched under Marcos in 1974 as a temporary measure"],["Protection","cases of abuse of domestic workers in the Gulf and Hong Kong are recorded in the thousands each year"]],"rd":"In 1974, facing unemployment and debt, the Marcos government set up an agency to place Filipino workers abroad as a temporary measure. Fifty years on it is a pillar of the economy: around a tenth of Filipinos work overseas and their remittances are close to a tenth of GDP, which funds imports and holds up the currency. The state now has a structural interest in continuing to export workers, and a weak position when negotiating their treatment with the countries that receive them.\nThe household cost is not in the statistics: a generation raised by grandparents, with a mother who is a nurse in Riyadh or a caregiver in Hong Kong.","mn":"When a country's main export is its own people, its government cannot afford to be difficult about how they are treated.","pt":["p7","p5"],"sr":[["Bangko Sentral ng Pilipinas, overseas Filipino remittance statistics","https://www.bsp.gov.ph/SitePages/Statistics/External.aspx"],["IOM / Philippine Statistics Authority, Survey on Overseas Filipinos","https://psa.gov.ph/statistics/survey/labor-and-employment/survey-overseas-filipinos"]],"i":92},{"id":"nnpc","n":"NNPC and the oil rent — Nigeria","t":"state","lat":9.057,"lon":7.49,"pl":"Abuja, Nigeria","ad":"NNPC Towers, Herbert Macaulay Way, Central Business District, Abuja","ro":"A state whose revenue arrives as oil money, which makes citizens optional.","who":"Nigerian National Petroleum Company Limited; Federal Ministry of Finance","rch":"national","mx":["own","aust","disc"],"fg":[["Oil share of exports","historically around 90% of export earnings"],["Fuel subsidy","removed in 2023; transport and food prices rose sharply, with inflation above 30% in 2024"],["Poverty","the World Bank and Nigerian statistics office have put over 100 million Nigerians below the national poverty line"],["Audits","NNPC's accounts were not published in full for decades; the first audited statements came in 2020"]],"rd":"A government funded by taxing its citizens has to answer to them, because they can stop paying. A government funded by selling oil does not. Nigeria has earned hundreds of billions of dollars from crude since the 1970s while its schools, clinics and power supply decayed, and for most of that period the national oil company published no audited accounts. When the fuel subsidy — the one benefit ordinary Nigerians could point to — was removed in 2023 at the IMF's and World Bank's urging, transport and food costs rose immediately and inflation went past 30%.\nThis is the resource curse stated precisely: it is not that oil makes a country poor, it is that oil makes a government independent of its people.","mn":"Where the state's money comes from decides who it has to listen to, and oil money means it does not have to listen to you.","pt":["p9","p11"],"sr":[["Extractive Industries Transparency Initiative — Nigeria","https://eiti.org/countries/nigeria"],["World Bank Nigeria Development Update","https://www.worldbank.org/en/country/nigeria/publication/nigeria-development-update-ndu"]],"i":93},{"id":"hancock","n":"Mining royalties — Australia","t":"pers","lat":-31.951,"lon":115.86,"pl":"Perth, Western Australia","ad":"Hancock Prospecting, 28 The Esplanade, Perth, WA 6000","ro":"A private fortune from iron ore in publicly owned ground, and the campaign that killed the tax on it.","who":"Gina Rinehart, executive chairman of Hancock Prospecting","rch":"national","mx":["own","law","rent"],"fg":[["Fortune","Australia's largest, from iron ore royalties and mining"],["Resource Super Profits Tax","proposed 2010; a reported A$22 million industry advertising campaign followed and the prime minister was removed by his own party within weeks"],["Replacement","the weakened Minerals Resource Rent Tax raised a small fraction of forecasts and was repealed in 2014"],["Ownership","minerals in Australia are legally vested in the Crown — that is, in the public"]],"rd":"Australian minerals belong, in law, to the public. In 2010 the federal government proposed taxing the extraordinary profits being made from the China-driven iron ore boom. The industry ran one of the most expensive advertising campaigns in Australian political history, Kevin Rudd was removed as prime minister by his own party within weeks, the replacement tax was negotiated with the three largest miners and raised almost nothing, and it was repealed in 2014.\nNorway taxed its North Sea oil at a high rate and built a sovereign fund now worth well over a trillion dollars. Australia had the same opportunity in iron ore and did not. The difference is not geology.","mn":"The same resource can fund a country's pensions for a century or a few private fortunes, and which one happens is decided by one tax fight.","pt":["p3","p9"],"sr":[["Australian Parliamentary Library, 'The Minerals Resource Rent Tax'","https://www.aph.gov.au/About_Parliament/Parliamentary_departments/Parliamentary_Library/pubs/rp/BudgetReview201415/MRRT"],["Norges Bank Investment Management (the comparison case)","https://www.nbim.no/"]],"i":94},{"id":"dangote","n":"Aliko Dangote","t":"pers","lat":6.431,"lon":3.423,"pl":"Lagos, Nigeria","ad":"Dangote Group, Union Marble House, 1 Alfred Rewane Road, Ikoyi, Lagos","ro":"Africa's largest fortune, built with import licences, tariff protection and cement.","who":"President and chief executive of the Dangote Group","rch":"regional","mx":["price","law","own"],"fg":[["Fortune","the largest in Africa for over a decade"],["Cement","Dangote Cement has held a dominant share of the Nigerian market; Nigerian cement prices have run well above those in comparable markets"],["Policy","the group has benefited from import bans and tariff protection on cement, sugar and rice"],["Refinery","the 650,000 barrel-a-day Lekki refinery opened in 2023–24 with substantial public financing from the Nigerian state oil company"]],"rd":"Dangote's businesses are in the things everyone must buy: cement, sugar, flour, salt, and now fuel. The pattern across them is the same — a domestic producer protected by import bans or tariffs the government put in place, operating in a market with few competitors, in a country where most people live on very little. Nigerian cement has been among the most expensive in the world relative to local incomes, in a country with an enormous housing shortfall.\nIt is genuinely industrialisation, and that matters: the refinery and the cement plants are real productive capacity in a country that badly needs it. It is also a demonstration that the first fortune in a poor country is usually made from a government decision rather than from a product.","mn":"Where governments decide who is allowed to import, the biggest fortune in a country will belong to whoever gets the licence.","pt":["p3","p1"],"sr":[["Premium Times Nigeria — reporting on cement pricing and import policy","https://www.premiumtimesng.com/"],["Dangote Cement annual reports and investor disclosures","https://www.dangotecement.com/"]],"i":95}];
var PATS=[{"id":"p1","n":"Three firms vote the shares","mx":"own","line":"Ownership concentration — savings pooled into a bloc that votes against the saver","rd":"Start with a fact that sounds technical and is not. When you pay into a pension or a retirement account, the money is handed to a fund manager, and with it goes the vote attached to those shares. Because index funds took over, three firms in New York, Malvern and Boston now hold roughly $33 trillion between them and are the largest shareholder in the great majority of the companies in the S&P 500, casting about a quarter of all the votes at their annual meetings. The same three are the largest shareholder of airlines that compete with each other, banks that compete with each other and meatpackers that compete with each other.\nThe votes they cast are on specific things: the executive pay package, the share buyback, the board slate. They almost always vote with management, and management is paid in stock, which rises when labour costs fall. So the money a bus driver in Ohio saves for retirement is voted, by somebody she will never meet, in favour of the pay structure that rewards holding her wages down.\nThe pattern is not only American. India's and Mexico's largest fortunes sit on top of companies that dominate telecoms and retail in their countries; Australia's sits on iron ore. Concentrated ownership behaves the same way everywhere — it turns the question 'what should this company do?' into 'what raises the share price?'","mn":"Your savings have been turned into a voting bloc that is used against your wages, and there is no mechanism by which you were ever asked."},{"id":"p2","n":"Profit moves, the tax bill does not","mx":"tax","line":"Profit shifting — the work happens in one country and the taxable profit in another","rd":"A company sells software in France, employs the engineers in India, and books the profit in Ireland or Luxembourg, where a licence fee paid to its own subsidiary absorbs most of the margin. Nothing physical moves. The Tax Justice Network's annual accounting puts the loss at around half a trillion dollars a year, split between corporate profit shifting and offshore private wealth, and its 2025 report found that over $475 billion in corporate tax went uncollected between 2016 and 2021 simply because the country-by-country reports that would have identified the companies were kept confidential.\nThe European Commission eventually proved one case all the way: Apple's European profits were taxed in Ireland at rates that fell as low as 0.005%, and in September 2024 the EU's highest court ordered €13 billion recovered. Ireland had spent eight years arguing against receiving the money, because the arrangement was the national growth strategy.\nThe damage is not evenly spread. Rich countries lose more in absolute dollars; poor countries lose far more as a share of what they collect, and they lose it from budgets where the marginal item is a nurse's salary. The OECD writes the rules, and when African governments moved the question to the UN in 2023, where every country votes, the resolution passed 125 to 48 — with eight of the no votes coming from countries that between them enable about 43% of the world's tax losses.","mn":"The tax that pays for your local school is calculated on a profit figure that was moved somewhere else by an accountant, legally, before anyone counted it."},{"id":"p3","n":"The gap is legislated","mx":"law","line":"Lawmaking capture — the rules that set pay and tax are written by the people they tax","rd":"Economic inequality is often described as something that happens to a society, like weather. It is closer to a legislative record. The US federal minimum wage has been $7.25 since July 2009 — a specific decision, repeated every year by not acting. The corporate rate was cut from 35% to 21% in 2017, permanently, while the individual cuts were written to expire. Carried interest survives.\nThe machinery behind that is visible and has addresses. Lewis Powell's 1971 memo to the US Chamber of Commerce laid out the plan: fund scholars, build institutes, litigate, be patient. The Chamber is now the largest lobbying spender in Washington with over $746 million in cumulative reported spending. ALEC, in Arlington, drafts model state bills with corporate members in the room and about two hundred become law each year — right-to-work statutes, bans on cities raising their own minimum wage, caps on liability. Atlas Network supplies the same arguments to about 500 local think tanks in 100 countries, so that in Lima or Lagos they arrive as local opinion.\nMartin Gilens and Benjamin Page tested this against nearly 1,800 American policy questions and found that where affluent preferences and business groups diverge from the median voter's, the median voter has close to no measurable influence. And where this fails, there is a backstop: a company can sue a government at ICSID in Washington for passing a law it dislikes, which means many governments never pass it.","mn":"Nothing about the distribution is natural; every piece of it has a bill number, a sponsor and a vote you can look up."},{"id":"p4","n":"Creditors are paid first","mx":"debt","line":"Debt and creditor power — interest has priority over clinics, schools and pensions","rd":"When a country cannot pay everything, the order matters more than the amount, and the order is almost always bondholders first. Argentina defaulted in 2001; 93% of creditors accepted a restructuring; one fund in New York refused, spent fifteen years in court, had an Argentine naval ship impounded in Ghana, and walked away in 2016 with about $2.4 billion in profit on bonds bought at a fraction of face value. The lesson taken by every finance ministry was that a restructuring can be defeated by a single holdout, which makes future rescues dearer and slower.\nThe discipline arrives earlier than any courtroom. Three private rating agencies in New York set what a government pays to borrow, so finance ministers cut budgets pre-emptively to protect a grade. In Europe the European Central Bank sat on both sides of the table — central bank to the countries it was negotiating with, and creditor — and in 2015 capped the emergency liquidity keeping Greek cash machines running during a referendum.\nAnd some debts were never loans at all. Haiti paid France for the crime of having freed itself: 150 million francs demanded in 1825 under the guns of French warships, borrowed from French banks to pay French planters, roughly 112 million francs paid across seven decades, with the last related interest settled to a New York bank in 1947.","mn":"A country's budget has a queue, and the people who hold its bonds are always in front of the people who use its hospitals."},{"id":"p5","n":"The floor is set in the purchase order","mx":"chain","line":"Supply-chain squeeze — the wage is decided by the buyer, not the employer","rd":"A garment worker in Gazipur earns the Bangladeshi minimum of 12,500 taka a month, about $101, set in December 2023 and worth less every month since as inflation runs above 8%. She does not work for H&M, Zara, Gap, Primark or Walmart; she works for a factory that supplies them. In November 2026 she and thousands of others blocked roads in Dhaka asking for 30,000 taka, and Reuters found workers cutting back on food and medicine. The brands sign living-wage commitments and place orders at prices calculated on the legal minimum, and the wage board that sets that minimum knows the orders can move to Vietnam.\nThe same shape appears wherever a few buyers meet many sellers. A cocoa farmer in Côte d'Ivoire receives something like 6–8% of what the finished chocolate bar sells for; the Ivorian farmgate price was cut to 1,200 CFA francs a kilo in 2026 against Fairtrade's calculation of 1,758 as a living income. Foxconn's margins on an iPhone are thin because the purchase order says so, and what absorbs the pressure is overtime and the pace of the line. Palm oil, coffee, bananas, seafood, cobalt: all the same geometry.\nAnd in the rich countries the squeeze runs on the same logic internally — Walmart was in the top four employers of food-stamp and Medicaid recipients in all fifteen US state agencies the Government Accountability Office asked, with about 70% of those workers employed full time.","mn":"Nobody in the chain has to decide to pay you badly; the price was fixed several companies above your employer, and your wage is what is left."},{"id":"p6","n":"Shelter as an asset class","mx":"rent","line":"Housing financialisation — the main asset of ordinary families becomes somebody's yield","rd":"For most households that own anything, the thing they own is a home, and the rent they pay if they do not own one is their largest monthly cost. That makes housing the single most powerful lever on the distribution of wealth, and over the last twenty years it has been pulled hard.\nAfter the 2008 crash, Blackstone bought foreclosed American family houses in bulk and rented them back; the vehicle became the country's largest single-family landlord, and in March 2019 the UN Special Rapporteur on housing wrote to Stephen Schwarzman saying the model was pushing low- and middle-income people out of their homes. German cities sold their public housing in the 2000s — Dresden all of it, Berlin around 200,000 units — and the buyers consolidated into Vonovia; Berlin rents roughly doubled, and when 59.1% of Berliners voted in 2021 to socialise large landlords' holdings, the result was not implemented.\nBehind both sits a rule almost nobody has heard of. The Basel capital standards, written by central bankers in Switzerland, make lending against existing property cheap for a bank to hold and lending to a new business expensive. So credit flows to bidding up the houses that exist rather than building more, and the price of shelter rises faster than wages in almost every rich country at once.","mn":"When houses are priced as investments rather than as places to live, the gap between people who own one and people who rent one widens every single year by itself."},{"id":"p7","n":"Leaving is what gets taken away","mx":"mob","line":"Immobility and coercion — every protection on paper depends on being able to walk out","rd":"A wage is only negotiated if the worker can refuse. Most of the deepest inequality in the world is produced by removing that one ability, usually by law.\nIn Qatar, Saudi Arabia and the UAE, kafala attaches a worker's right to be in the country to the employer. Qatar removed exit permits and job-change certificates and set a minimum wage; Human Rights Watch still documented contractors on Qatari state projects leaving labourers unpaid for months in December 2025, and in Mecca in November 2025 found at least 600 workers unpaid for eight months, eleven of them detained for protesting. Saudi authorities meanwhile reduced the fines for wage theft. FIFA awarded the 2034 World Cup to Saudi Arabia anyway.\nThe design recurs in different legal clothes. China's hukou leaves a migrant worker's children, schooling and pension registered in the village they left, so around 300 million people work where they have no rights. American H-2A visas are issued to the employer. Nine-tenths of world trade moves on ships flagged in Panama or Liberia, which decides which labour law applies to a Filipino crew. In the United States the Thirteenth Amendment's exception for punishment lets roughly 800,000 incarcerated people work for cents an hour, on a former plantation in Louisiana among other places. Japan simply built a second category of worker beside the protected one — about 37% of employees. And in the US, right-to-work laws and the Janus ruling attack the same capacity collectively: union density has fallen from a third of workers to about one in ten.","mn":"Ask of any labour arrangement one question — what happens to this person if they walk out today? The answer is their real wage."},{"id":"p8","n":"The doctrine arrived before the policy","mx":"priv","line":"Idea factories — the arguments were written and funded decades before they were enacted","rd":"In April 1947 thirty-nine people met at a hotel above Lake Geneva at Hayek's invitation, convinced that planning, strong unions and progressive taxation led to tyranny. They were politically irrelevant for thirty years, and they were funded anyway — journals, institutes, chairs, prizes, a trained cadre. When stagflation hit in the 1970s and governments went looking for another theory, this one was the only complete alternative on the shelf.\nIt arrived first where nobody could vote on it. From 1956 the University of Chicago trained Chilean economists; days after the 1973 coup they handed the junta a finished programme, and by 1981 Chile had replaced its state pension with private individual accounts — a model then copied by Peru, Mexico, Colombia, Poland and Hungary, and reformed in Chile itself in 2025 after a decade of mass protest. John Williamson wrote the ten points down in Washington in 1989 and the list became the conditions attached to lending across Latin America, Africa and the former Soviet bloc. Michael Jensen's agency theory redefined a company as something owed entirely to its shareholders, and once executives were paid in stock, chief executive pay rose 1,316% between 1978 and 2025 while typical worker pay rose 28%.\nThe infrastructure is still running and has addresses in Arlington, Washington, London and Fairfax. Atlas Network alone supplies about 500 think tanks in 100 countries.","mn":"The policies that widened the gap were not discoveries; they were a position that lost for thirty years, kept funded until a crisis made someone reach for it."},{"id":"p9","n":"The bill for having been conquered","mx":"disc","line":"Colonial and extractive legacies — debts, borders and contracts written by the people who took the place","rd":"Some countries are poor for reasons with dates and signatures. Haiti was made to pay France 150 million francs in 1825 for recognition of the independence it had already won, borrowing from French banks to pay French planters; the New York Times' reconstruction found 112 million francs actually paid over seven decades and estimated the cost in forgone growth at around $115 billion. Fourteen African countries kept half their foreign reserves in an account at the French Treasury until reforms in 2019–21.\nThe contracts outlive the empires. Grasberg, one of the largest gold deposits on earth, was signed over in 1967 on Amungme and Kamoro land in West Papua, and the provinces around it are the poorest in Indonesia. Shell has pumped oil from the Niger Delta since 1958; UNEP's survey of Ogoniland found benzene in drinking water at hundreds of times the WHO guideline and a clean-up that would take a generation, and Nigeria's oil-producing states remain among its poorest. Brazil's 1850 Land Law made land purchasable in cash exactly as slavery was ending, which guaranteed the people being freed could not buy any; the top 1% of holdings still occupy nearly half the farmland. South Africa abolished the pass laws in the 1990s and kept the geography — and the richest 1% now hold nearly 55% of national wealth, more than in 1994.\nAnd the extraction continues in the present tense: Glencore was fined over $1.1 billion in the US and £281 million in London in 2022 for bribery that got it cheaper African oil.","mn":"A great deal of today's inequality between countries was set by specific documents signed by people who had just won a war, and nothing since has undone them."},{"id":"p10","n":"Secrecy decides who can be taxed","mx":"tax","line":"Havens, trusts and registries — a fortune that cannot be found cannot be taxed","rd":"A tax rate is a number; whether it is paid depends on whether the asset can be located. Switzerland made disclosure of a client's identity a criminal offence in 1934 and built an industry on it. Automatic information exchange since 2017 changed that for residents of participating countries and changed nothing for residents of the countries not in the system — which include most of the poorest.\nThe network has moved onshore. 1209 North Orange Street in Wilmington, Delaware is the registered address of hundreds of thousands of companies. Ugland House in George Town, Cayman, holds thousands more. And in 1983 South Dakota deleted the rule against perpetuities, so a trust in Sioux Falls can hold wealth indefinitely, tax-free at state level, with its court records sealed forever. Assets in South Dakota trusts rose from $57 billion to about $360 billion in a decade, and the Pandora Papers found 81 of its trusts holding money linked to families accused of fraud, bribery and the abuse of sugar-cane workers, alongside American dynasties. The laws were drafted by an industry task force and passed, year after year, by a legislature answerable to 900,000 people.\nThe United Kingdom is the keystone: its Crown Dependencies and Overseas Territories together account for roughly 23% of global corporate tax losses, and could be changed by Order in Council. In 2025 the United States narrowed its own beneficial-ownership registry to exclude domestic companies.","mn":"Any tax on wealth works only if someone can see the wealth, and an entire industry exists to make sure nobody can."},{"id":"p11","n":"Austerity arrives as a condition","mx":"aust","line":"Conditionality — a rescue loan that requires cutting the things poor households depend on","rd":"When a country runs out of foreign currency the IMF is usually the only lender left, and the loan has terms. Oxfam's 2026 analysis of 161 loans to 81 countries found that of 28 countries with ongoing programmes, 24 were required to implement austerity, and that the cuts demanded in loans since 2018 have been about five times deeper than in the six years before — a median consolidation of 1.7% of GDP against 0.3%.\nThe terms are specific and they land on specific people. ActionAid examined IMF documents for ten African countries and found eight recently told to cut or freeze the public-sector wage bill, which in practice means not hiring nurses and teachers; across fifteen countries it calculated that wage-bill constraints had blocked more than three million such posts. Subsidy removal raises the price of fuel and bread for households that have no alternative — Nigeria removed its fuel subsidy in 2023 and inflation went past 30%. VAT increases take a larger share of a poor household's spending than a rich one's.\nEurope got the same medicine from its own institutions: the Commission, the ECB and the IMF cut Greek pensions and public wages while bondholders were paid in full, and Greek output fell by a quarter. The one group almost never asked to contribute is the one with the most — wealth taxes, capital gains and enforcement against high earners appear in these programmes far less often than fuel prices and nurses' pay.","mn":"The conditions on a loan decide who pays for a crisis, and they have almost always chosen the nurse over the bondholder."},{"id":"p12","n":"Wealth that never has to pass","mx":"inh","line":"Dynasty — structures that carry a fortune across generations without a taxable moment","rd":"Income inequality in a single year is unpleasant. Inequality that compounds across generations is a different kind of society, and the instruments for producing it are mostly quiet legal ones.\nInheritance tax only bites when wealth passes from one person to another. A perpetual trust — legal in South Dakota since 1983 and copied by several US states — means it never passes, because the trust itself is the owner, forever. Singapore abolished estate duty in 2008 and has pulled in over a thousand single family offices in under a decade. Family holding-company chains, like the one through which Bernard Arnault's children hold LVMH, keep control intact while the underlying shares are never sold, and an asset that is never sold is never taxed as income — which is how ProPublica's leaked IRS files showed several of the richest Americans paying no federal income tax in particular years, legally.\nThe other half of the inheritance is land and position. Brazil's top 1% of holdings occupy nearly half its farmland; the EU's farm subsidies pay per hectare, so roughly 80% of the money goes to about 20% of recipients; India's caste system still predicts who does sanitation work; South Africa's townships are still an hour from the jobs. And debt inherits too — the student who graduates owing $40,000 is the one whose parents could not pay, on the same degree.\nThe World Inequality Report 2026 states the result: fewer than 60,000 people in the top 0.001% own three times the wealth of the poorest half of humanity, and in almost every region the top 1% hold more than the bottom 90% combined.","mn":"If wealth never has a taxable moment and land never changes hands, then where your grandchildren start is decided today — and it has already been decided."}];
var ABOUT="\n<h1>About this map<\/h1>\n<p>Economic inequality is usually described the way weather is described &mdash; as something that happens, with trends and forecasts and nobody to call. This map takes the opposite view. It treats the gap between the richest and the rest as the sum of decisions that have authors, dates, documents and street addresses, and it puts those addresses on a globe.<\/p>\n<p>There are 96 entries. Each one is a person, a company, a government, an agency, a doctrine, a professional service or a labour system that can be shown, from published sources, to produce or protect economic inequality. Each entry gives you what it is, where it is, who runs it, the figures, a plain rundown of how it works, and a line at the end saying what it means for an ordinary person. Every entry carries its sources so you can check it and quote it.<\/p>\n\n<h2>How to read it<\/h2>\n<ul>\n<li><b>Colour<\/b> is the kind of culprit &mdash; finance, corporations, individuals, states, international bodies, doctrines, enablers, labour systems.<\/li>\n<li><b>Dot size<\/b> is reach: worldwide, regional, or one country.<\/li>\n<li><b>How it is done<\/b> in the left panel filters by mechanism &mdash; wage suppression, tax avoidance, creditor power, rent extraction, lawmaking capture, austerity, immobility, supply-chain squeeze, privatisation, inheritance, discrimination.<\/li>\n<li><b>Patterns behind the scenes<\/b>, bottom left, is the part worth reading first. Twelve write-ups of how the machinery actually fits together, each one filtering the map to the entries involved.<\/li>\n<li><b>Download this list (CSV)<\/b> exports whatever you have filtered to, with names and addresses, as a spreadsheet.<\/li>\n<\/ul>\n\n<h2>The rule about addresses<\/h2>\n<p class=\"warn\">Every address here is a registered office, a headquarters, a ministry, a campus or an official premises &mdash; the place that answers for the decision. There are no private homes on this map and there never will be. This is not squeamishness. A corporate headquarters is where the decision is made, where the registered agent accepts service of legal papers, where a shareholder meeting happens, where a picket is lawful and a journalist can ask a question. A private residence is where somebody's children live, and going there converts a case about a policy into a case about harassment &mdash; which is the fastest way to lose the argument and hand the other side the story.<\/p>\n<p>For the same reason, individuals appear in their official role at their institution, with conduct that is documented and sourced.<\/p>\n\n<h2>What is covered, and what is not<\/h2>\n<p>The map follows the facets of economic inequality set out in the suppression section of this site: income inequality, wealth inequality, inequality of opportunity and access to lawmakers, consumption and purchasing power, access to credit, social immobility, regional and spatial inequality, gender and racial economic inequality, and access to public services. You will find entries behind each of those.<\/p>\n<p>What it does not do is rank the entries against each other. There is no score claiming BlackRock is 1.4 times worse than the kafala system, because no honest measure gives you that number. What the map offers instead is the mechanism in each case, so you can judge the weight yourself.<\/p>\n<p>Coverage is uneven, and it is uneven in a direction worth naming. The documentation is best where the press is free, the courts publish, and researchers can work &mdash; so the United States, the United Kingdom and the European Union are heavily represented, partly because that is where the money is concentrated and partly because that is where the records are. China, Russia, the Gulf states and much of Central Asia are under-represented relative to what is almost certainly happening there, because far less of it can be sourced to a document.<\/p>\n\n<h2>What this map is for<\/h2>\n<p>Three practical uses. First, a name and an address: who to write to, where to file, where to stand, which annual meeting to attend, which minister's department actually holds the file. Second, the figures with their sources attached, so an argument can be made without anyone having to take your word for it. Third, the patterns &mdash; so that a campaign against one landlord, one tax ruling or one wage board can be made legible as part of something larger, which is usually what turns a local fight into a movement.<\/p>\n<p>The last thing to say is that nothing here is inevitable. The strongest evidence of that is on the map itself. Chile replaced the private pension system in 2025 after a decade of protest. The European Court ordered Ireland to collect &euro;13 billion from Apple in 2024 after eight years of appeals. Eli Lilly cut the insulin price by 70% in a single announcement once the hearings and lawsuits arrived. Over 300 cities have taken their water systems back. Michigan repealed its right-to-work law in 2024. Berlin voted 59% to socialise its largest landlords &mdash; and that one has not been honoured yet, which tells you both things at once: these arrangements can be reversed, and they do not reverse themselves.<\/p>\n";
var METHOD="\n<h1>Method and sources<\/h1>\n<p>Last built 17 November 2026. 96 entries, 12 patterns.<\/p>\n\n<h2>How an entry gets on the map<\/h2>\n<p>An entry has to meet three tests. It must have a documented mechanism connecting it to economic inequality &mdash; not an association, a mechanism, stated in a sentence. It must have a verifiable location that is an official premises. And every figure attached to it must come from a source that can be linked and checked: a court judgment, a regulator's order, a company filing, a statistical agency, a parliamentary inquiry, a peer-reviewed study, or an investigation by a named organisation.<\/p>\n<p>Nothing on this map is inferred, estimated or filled in. Where an allegation is contested, it is marked as contested and the denial is stated. Where a figure moves &mdash; a market valuation, a net worth, an exchange rate &mdash; the date is given with it. If a claim could not be sourced, it is not here, even where there is little doubt about it.<\/p>\n\n<h2>What the categories mean<\/h2>\n<table>\n<tr><th>Category<\/th><th>What it holds<\/th><th>Entries<\/th><\/tr>\n<tr><td>Finance and asset managers<\/td><td>Owners of the shares, holders of the debt, setters of the price of money.<\/td><td>10<\/td><\/tr>\n<tr><td>Corporations and employers<\/td><td>Firms that set wages directly, or set the price their suppliers can pay.<\/td><td>23<\/td><\/tr>\n<tr><td>Owners and individuals<\/td><td>Named people whose own holdings or decisions are the mechanism.<\/td><td>7<\/td><\/tr>\n<tr><td>States and governments<\/td><td>Governments whose law, tax, land or revenue model produces the distribution.<\/td><td>16<\/td><\/tr>\n<tr><td>Agencies and international bodies<\/td><td>Lenders, regulators and rule-writers with cross-border reach.<\/td><td>11<\/td><\/tr>\n<tr><td>Doctrines and idea factories<\/td><td>Where the argument was written, funded and kept until a government used it.<\/td><td>14<\/td><\/tr>\n<tr><td>Enablers<\/td><td>Accounting, law, trusts, registries and havens &mdash; the machinery that makes a fortune hard to find or tax.<\/td><td>6<\/td><\/tr>\n<tr><td>Labour-control systems<\/td><td>Legal arrangements that remove a worker's ability to leave.<\/td><td>9<\/td><\/tr>\n<\/table>\n\n<h2>The anchor figures<\/h2>\n<p>A few numbers recur across the entries. These are the sources for them.<\/p>\n<ul>\n<li><b>Global distribution.<\/b> World Inequality Report 2026 (World Inequality Lab, Paris School of Economics): the top 0.001% &mdash; fewer than 60,000 people &mdash; own three times the wealth of the poorest half of humanity; in almost every region the top 1% hold more than the bottom 90% combined; the top 10% account for 77% of emissions linked to private capital ownership against 3% for the poorest half; education spending per child runs &euro;200 a year in sub-Saharan Africa against &euro;9,000 in North America and Oceania. The 2022 edition is the source for the long-standing figures of 52% of global income to the top 10% and 76% of global wealth. <a href=\"https://prod.wid.world/www-site/uploads/2025/12/World_Inequality_Report_2026.pdf\" target=\"_blank\" rel=\"noopener\">Report<\/a><\/li>\n<li><b>Wealth concentration.<\/b> Oxfam, <i>Resisting the Rule of the Rich<\/i> (January 2026): billionaire wealth of $18.3 trillion; the richest 1% own 43.8% of global wealth against 0.52% for the poorest half; the twelve richest people hold more than the poorest half of humanity. <a href=\"https://www.oxfam.de/system/files/documents/2026-01/20260119-resisting-rule-rich-methodology-note.pdf\" target=\"_blank\" rel=\"noopener\">Methodology note<\/a><\/li>\n<li><b>Tax losses.<\/b> Tax Justice Network, <i>State of Tax Justice<\/i> (2024 and 2025 editions): about $492 billion lost a year to multinational profit shifting and offshore private wealth; $1.42 trillion of profit shifted into havens annually; $475 billion in corporate tax uncollected over 2016&ndash;21 because country-by-country reports are kept confidential; the UK's dependencies and territories account for roughly 23% of global corporate tax losses. <a href=\"https://taxjustice.net/wp-content/uploads/2025/11/State-of-Tax-Justice-2025-report-Tax-Justice-Network.pdf\" target=\"_blank\" rel=\"noopener\">2025 report<\/a><\/li>\n<li><b>Executive pay.<\/b> Economic Policy Institute (2026): CEO pay at the top 350 US firms rose 14% in 2025 to an average of $27.9 million, a ratio of 325 to 1 against the typical worker, from 21 to 1 in 1965; CEO pay up 1,316% since 1978 against 28% for typical workers. Institute for Policy Studies, <i>Executive Excess 2026<\/i>: 614 to 1 at the 100 lowest-paying S&amp;P 500 firms. <a href=\"https://www.epi.org/blog/ceo-pay-surged-in-2025-ceos-are-paid-325-times-as-much-as-the-typical-worker/\" target=\"_blank\" rel=\"noopener\">EPI<\/a><\/li>\n<li><b>Austerity.<\/b> Oxfam (2026) analysis of 161 IMF loans to 81 countries: 24 of 28 countries with ongoing programmes required to implement austerity; median required cuts five times deeper in loans since 2018 than in 2012&ndash;17. ActionAid, <i>Fifty Years of Failure<\/i>: public-sector wage bill constraints in 15 countries blocked over three million nurse, teacher and public worker posts. <a href=\"https://www.oxfam.org/en/press-releases/countries-locked-imf-austerity-programs-are-also-around-twice-vulnerable-economic\" target=\"_blank\" rel=\"noopener\">Oxfam<\/a><\/li>\n<li><b>Political influence.<\/b> Gilens and Page, <i>Testing Theories of American Politics<\/i> (2014), on nearly 1,800 policy questions: economic elites and organised business groups have substantial independent influence on US policy outcomes; average citizens have close to none. <a href=\"https://www.cambridge.org/core/journals/perspectives-on-politics/article/testing-theories-of-american-politics-elites-interest-groups-and-average-citizens/62327F513959D0A304D4893B382B992B\" target=\"_blank\" rel=\"noopener\">Paper<\/a><\/li>\n<\/ul>\n\n<h2>Coordinates and addresses<\/h2>\n<p>Coordinates are placed on the named building, not on a country centroid, so that zooming in shows you the actual premises. Addresses are given as the entity itself publishes them &mdash; in filings, on its contact page, or in a public register. Several are large campuses where the registered address and the working offices differ; in those cases the registered address is used, because that is the one that matters legally. Leadership names are as of November 2026 and will go out of date; the institution is the entry, not the individual holding the post.<\/p>\n\n<h2>What is missing, and known weaknesses<\/h2>\n<ul>\n<li><b>Documentation bias.<\/b> Coverage follows the paper trail, which means free-press, open-court jurisdictions are over-represented relative to authoritarian ones. Absence from this map is not evidence of innocence.<\/li>\n<li><b>No ranking.<\/b> There is deliberately no composite score. Any number claiming to rank a doctrine against a landlord would be invented.<\/li>\n<li><b>Sector gaps.<\/b> Tobacco, alcohol, gambling, payday lending, private water in South Asia, Chinese platform labour, Gulf sovereign wealth and the arms trade all belong here and are not yet entered.<\/li>\n<li><b>The counter-side.<\/b> Unions, tax authorities, investigative outlets, tenant movements and the researchers whose work this map is built on are not mapped. They are the obvious companion piece.<\/li>\n<li><b>Moving figures.<\/b> Net worths, valuations and assets under management change daily. Each is dated where it is given.<\/li>\n<\/ul>\n\n<h2>Corrections<\/h2>\n<p>If an entry is wrong &mdash; a figure, an address, a leadership name, a characterisation, a denial that should be recorded &mdash; the correction will be made, with the source. An entity that disputes a characterisation will have its response stated in its own entry, as several already do.<\/p>\n\n<h2>Credit where it is owed<\/h2>\n<p>Almost nothing on this map was discovered here. It is assembled from the work of the World Inequality Lab, the Tax Justice Network, Oxfam, the Economic Policy Institute, the Institute for Policy Studies, ActionAid, Human Rights Watch, Amnesty International, the International Consortium of Investigative Journalists, the Center for Media and Democracy, ProPublica, the Serious Fraud Office, the US Department of Justice, the European Commission, the Government Accountability Office, Fairtrade International, the New York Times, Reuters, and the researchers cited in each entry. Where their links are given, follow them.<\/p>\n";
/* ---------- taxonomy ---------- */
