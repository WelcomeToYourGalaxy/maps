self-interested actors, which converts the case for democratic decision-making into a case for constraining it.","who":"James Buchanan and Gordon Tullock developed public choice theory from the 1960s; Buchanan's centre moved to George Mason University in 1983.","rch":"global","mx":["supp","cap"],"rd":"Public choice applies the assumptions of economics to politics: officials maximise budgets and re-election prospects, voters have little incentive to be informed, and organised minorities extract benefits that dispersed majorities pay for. Much of this is useful and some of it is obviously true, and the Nobel committee recognised Buchanan in 1986.\nThe policy conclusion drawn from it is that majorities cannot be trusted with fiscal decisions, and that the remedy is constitutional: balanced budget requirements, supermajority rules for taxation, independent central banks, and limits on what legislatures may do. Nancy MacLean's history of Buchanan's work traced its early application to resisting court-ordered school desegregation in Virginia, where the proposal was vouchers for private schools; her account is contested in detail by other scholars, though the Virginia episode itself is documented.\nThe constitutional devices the school recommended are now widespread. State balanced-budget rules, tax and expenditure limits and supermajority requirements for raising taxes constrain what a legislature can do about inequality regardless of what its electorate votes for, and they are far harder to repeal than the ordinary legislation they displaced.","sr":[["Buchanan and Tullock, 'The Calculus of Consent'","https://oll.libertyfund.org/title/buchanan-the-calculus-of-consent"],["MacLean, 'Democracy in Chains'","https://www.penguinrandomhouse.com/books/212004/democracy-in-chains-by-nancy-maclean/"]],"i":65},{"id":"model_bills","n":"Writing the bills that legislators introduce","t":"doct","lat":38.847,"lon":-77.0523,"pl":"Arlington, Virginia, United States","ad":"American Legislative Exchange Council, 2900 Crystal Drive, 6th Floor, Arlington, VA 22202","ro":"Drafting model legislation outside any legislature and supplying it to members who introduce it as their own, which lets one text pass in many states.","who":"The American Legislative Exchange Council convenes state legislators and corporate members in task forces that approve model bills.","rch":"national","mx":["supp","cap","floor"],"rd":"State legislatures are part-time, thinly staffed and responsible for most of the law that touches wages, housing, schooling and local government. ALEC supplies drafts. Legislators and corporate members sit together on task forces, approve model bills, and members introduce them at home; researchers at Brookings and elsewhere have traced the resulting near-identical texts across many states.\nThe subjects are consistent: preemption of local minimum wage and paid leave ordinances, right-to-work provisions, limits on public sector collective bargaining, restrictions on tort claims, and tax and expenditure limitations. Preemption statutes are the clearest in effect. When a city raises its own minimum wage, a preemption law passed in the state capital voids it, as happened to Birmingham's ordinance in Alabama in 2016.\nThe mechanism works because of asymmetry in capacity. A corporate member can afford to draft, and a part-time legislator with one staffer cannot. The organisation has lost corporate members after public campaigns, and the model operates regardless, since the bills already drafted remain in circulation.","sr":[["ALEC Exposed: library of model bills (Center for Media and Democracy)","https://www.alecexposed.org/"],["Brookings: ALEC's influence over lawmaking in state legislatures","https://www.brookings.edu/articles/alecs-influence-over-lawmaking-in-state-legislatures/"]],"i":66},{"id":"ten_points","n":"Writing the list of conditions down","t":"doct","lat":38.907,"lon":-77.041,"pl":"Washington, DC, United States","ad":"Peterson Institute for International Economics, 1750 Massachusetts Avenue NW, Washington, DC 20036","ro":"Summarising a policy programme as a short list, which made it portable and allowed it to become the standard content of lending conditions.","who":"John Williamson set out ten policy prescriptions in 1989 at what became the Peterson Institute; he later objected to the use made of the term Washington Consensus.","rch":"global","mx":["supp","cond","priv"],"rd":"Williamson's 1989 paper listed ten measures he believed Washington institutions could agree were needed in Latin America: fiscal discipline, redirected public spending, tax reform, market interest rates, competitive exchange rates, trade liberalisation, openness to foreign investment, privatisation, deregulation and secure property rights. He intended a description of existing agreement, not a manifesto, and spent years afterwards objecting that the phrase had been taken to mean market fundamentalism.\nThe list travelled anyway. In the form it took in lending practice, it became the standard content of conditions attached to loans across Latin America, Africa and the former Soviet bloc through the 1990s. Joseph Stiglitz, who was chief economist at the World Bank during part of this period, published a detailed criticism of how the programme was sequenced and of the costs borne by the countries that followed it.\nWhat a short list does is remove the need for judgement about a particular country. The same ten items could be applied in Bolivia, Ghana and Russia by officials with limited local knowledge and a template, which is what made the programme fast and what made its failures repetitive.","sr":[["Williamson, 'What Washington Means by Policy Reform'","https://www.piie.com/commentary/speeches-papers/what-washington-means-policy-reform"],["Stiglitz, 'Globalization and Its Discontents'","https://wwnorton.com/books/9780393324396"]],"i":67}];
var GLOSS={"inheritance tax":"A tax on what a person leaves behind when they die, paid before the estate reaches the heirs.","death duty":"An older name for inheritance tax: a charge on an estate when its owner dies.","estate duty":"A tax on the total value of what someone leaves at death.","periodic charge":"A smaller tax a trust pays every ten years, instead of the one-off charge an estate pays at death.","dynasty trust":"A trust designed to hold a family's wealth for many generations, so it is never inherited and never taxed as an inheritance.","perpetual trust":"A trust with no end date, so the wealth inside it never has to pass to anybody.","trusts":"Legal arrangements where trustees hold property for named beneficiaries, so no one person owns it outright.","trust":"A legal arrangement where one party holds property for the benefit of others, so no single person owns it outright.","foundation":"An entity that holds assets for a stated purpose and has no owner or shareholders.","step-up in basis":"A US rule that resets an inherited asset's purchase price to its value at the owner's death, erasing the gain for tax.","cost base":"The price originally paid for an asset, used to work out the taxable gain when it is sold.","capital gains":"The profit made when an asset is sold for more than it cost.","unrealised gains":"Increases in the value of something you still own; untaxed in most countries until you sell.","tax expenditure":"Money a government gives up by granting an exemption or relief, counted as if it were spending.","agricultural property relief":"A UK rule that removes farmland from inheritance tax.","business property relief":"A UK rule that removes private company shares and business assets from inheritance tax.","nil-rate band":"The slice of an estate that passes free of UK inheritance tax before the charge begins.","family office":"A private firm that manages the money of a single wealthy family.","holding company":"A company whose purpose is to own shares in other companies rather than trade itself.","primogeniture":"The rule that the eldest child, historically the eldest son, inherits the whole estate.","index fund":"A fund that buys every company in a market index rather than picking shares, so it ends up owning a slice of almost everything.","asset manager":"A firm that invests other people's money, such as pension savings, and votes the shares it buys.","assets under management":"The total value of the money a firm invests on other people's behalf.","share buyback":"A company buying its own shares back, which raises the price of the remaining ones.","shareholder primacy":"The doctrine that a company's only duty is to make money for its shareholders.","fiduciary duty":"A legal duty to act in someone else's financial interest rather than your own.","sovereign wealth fund":"A state-owned investment fund, usually built from oil or export earnings.","private equity":"Firms that buy whole companies with borrowed money, restructure them and sell them on.","single-family rental":"An ordinary house, of the kind families used to buy, owned by a company and rented out.","securitisation":"Bundling loans or rents and selling the income stream to investors as a bond.","foreclosure":"A lender taking a house because the mortgage has not been paid.","collateral":"Property a lender can seize if a loan is not repaid.","mortgage insurance":"Government or private cover that pays the lender if a borrower defaults, which is what makes long, low-deposit mortgages possible.","market capitalisation":"The stock market's price for a whole company: share price times number of shares.","redlining":"Refusing loans or insurance in a neighbourhood because of who lives there, named after the red lines drawn on lending maps.","racial covenant":"A clause in a property deed forbidding sale or rental to people of a named race.","allotment":"The US policy of cutting tribal land into individual parcels and selling the rest as surplus.","fractionated title":"Ownership split among so many inherited shares that no one can use, sell or mortgage the land.","trust land":"Land whose legal title is held by a government for the benefit of its occupants, who cannot sell or mortgage it.","customary land":"Land held under community rules recognised locally but often not registered in any state system.","land audit":"A government count of who owns the land in a country.","restitution":"Returning property to the people it was taken from, or paying them its value.","expropriation":"A state taking private property, with or without compensation.","sharecropping":"Farming someone else's land for a share of the crop rather than a wage.","enclosure":"The legal conversion of land held in common into private property.","dunam":"A unit of land used across the Middle East, about a tenth of a hectare.","hectare":"Ten thousand square metres, about two and a half acres.","concession":"A government grant of the right to use land or resources, usually to a company, for a set period.","absentee property":"Property declared to belong to owners who are absent, and transferred to a state custodian.","farmgate price":"The price a farmer is actually paid at the farm, before anything downstream is added.","living income":"The income a household needs for a decent standard of living, calculated for a specific place.","monopsony":"A market with one buyer or very few, so sellers, including workers, have no alternative to go to.","piece rate":"Pay per item produced rather than per hour worked.","wage floor":"The lowest wage anyone in a market is paid, set by law or by the largest employer.","preemption":"A state law that forbids cities from setting their own rules, such as a higher local minimum wage.","right-to-work":"US laws that stop a union contract from requiring all covered workers to pay for representation.","collective bargaining":"Workers negotiating pay and conditions together through a union rather than one by one.","informal sector":"Work with no contract, no registration and no legal protection.","caste":"A hereditary social rank, fixed at birth, that in practice still shapes work and marriage in parts of South Asia.","hukou":"China's household registration, inherited from a parent, which ties schooling and health care to a place.","kafala":"The Gulf sponsorship system that ties a migrant worker's legal residence to one employer.","tied visa":"A work permit valid only for one named employer, so leaving the job means leaving the country.","debt bondage":"Being held in work to pay off a debt that the work never clears.","descent-based slavery":"Slavery in which status passes down a family line, usually through the mother.","convict leasing":"The practice of hiring out prisoners to private employers, used widely in the US South after 1865.","involuntary servitude":"Being forced to work for another person against your will.","flag of convenience":"Registering a ship in a country with light rules, so its labour and safety law applies instead of the owner's.","non-regular work":"Jobs classed as temporary or part-time, carrying lower pay and fewer rights than permanent ones.","pari passu":"A bond clause requiring all holders to be treated equally, used by holdout creditors to block a restructuring.","vulture fund":"An investor that buys distressed government debt cheaply and sues for the full amount.","odious debt":"Debt argued to be unenforceable because it was imposed on a population by force or against its interests.","indemnity":"A payment demanded as compensation, here from a former colony to its former ruler.","conditionality":"The policy changes a lender requires before it will release money.","structural adjustment":"The package of cuts, privatisations and deregulation lenders required of indebted countries, mainly from the 1980s.","austerity":"Cutting public spending to reduce a deficit or satisfy a lender.","plan of adjustment":"The court-approved settlement that sets who gets paid what in a public bankruptcy.","non-dischargeable":"A debt that bankruptcy will not cancel.","undue hardship":"The high legal test a US borrower must meet to have a student loan cancelled in bankruptcy.","garnishment":"Taking money directly from someone's wages or benefits to pay a debt.","creditor priority":"The rule that decides whose claim gets paid first when there is not enough to go round.","debt service":"The interest and principal a government or household must pay each year on what it owes.","sovereign debt":"Money borrowed by a government.","replacement rate":"A pension expressed as a share of what the person used to earn.","defined contribution":"A pension that pays out only what the individual's own savings and investment returns produced, with no guaranteed amount.","voucher":"A payment given to an individual to buy a service privately, instead of the state providing it.","means test":"A check on income or savings to decide whether someone qualifies for support.","user fee":"A charge for a public service such as a clinic or a school.","privatisation":"Selling a publicly owned asset or service into private hands.","social housing":"Housing let at below-market rents by a council or non-profit landlord.","property tax":"A tax on the value of land and buildings, which in the US funds local schools.","transfer pricing":"The prices a company charges its own subsidiaries, which decide where its profit appears.","profit shifting":"Moving recorded profit into a low-tax country while the work stays elsewhere.","base erosion":"The shrinking of a country's taxable profits as companies move them offshore.","double irish":"A structure using two Irish companies to route profits to a tax haven, closed to new users in 2015.","participation exemption":"A rule exempting dividends received from foreign subsidiaries, which makes a country useful as a conduit.","withholding tax":"Tax deducted at source when money is paid abroad.","beneficial owner":"The real person who ultimately owns or controls a company, as opposed to the name on the register.","shell company":"A company with no staff or operations, used to hold assets or move money.","registered agent":"A firm that provides a legal address for companies, so thousands can share one building.","secrecy jurisdiction":"A place that sells the legal means to keep ownership and income hidden from other countries.","nominee":"A person or firm named as owner or director in place of the real one.","freeport":"A warehouse where goods count as in transit, so no import tax falls due however long they stay.","bearer asset":"Something that belongs to whoever holds it, with no register of ownership.","automatic exchange of account information":"The system under which banks report foreign-held accounts to the account holder's own tax authority.","financial secrecy index":"The Tax Justice Network's ranking of how much secrecy each jurisdiction supplies.","gini":"A single number from 0 to 1 summarising how unequally income or wealth is spread.","decile":"One tenth of a population, ranked from poorest to richest.","public choice":"A school of economics that treats officials and voters as self-interested, used to argue for limiting government.","neoliberal":"The policy programme of privatisation, deregulation, low taxes on capital and weakened unions.","think tank":"A funded research organisation that produces policy arguments.","model bill":"Draft legislation written outside a legislature and handed to members to introduce as their own.","investor-state arbitration":"Private tribunals where a foreign investor can sue a government over a law that cost it money.","isds":"Investor-state dispute settlement: the treaty system letting companies sue governments in private tribunals.","laffer curve":"The claim, drawn as a curve, that cutting tax rates can raise revenue.","index funds":"Funds that buy every company in a market index, so they end up owning a slice of almost everything.","aladdin":"BlackRock's risk-analysis software, rented by other investors to monitor their own portfolios.","icsid":"The World Bank's arbitration centre, where foreign investors sue governments.","country-by-country":"Reporting that shows where a multinational books its profit, staff and tax, country by country.","sponsorship":"The requirement that a migrant worker be held on an employer's permit to remain lawfully in the country.","deportation":"Removal from a country by the state.","wage theft":"Not paying wages that are legally owed, by withholding overtime, deductions, or final pay.","buyback":"A company buying its own shares, which raises the price of the ones left.","buybacks":"Companies buying their own shares, which raises the price of the ones left.","cost of capital":"What it costs a buyer to raise the money for a purchase; large investors pay far less than households.","state aid":"Government support to a company, restricted under EU law because it distorts competition.","rule against perpetuities":"The old common-law rule that a trust must eventually end, repealed in several US states.","leveraged buyout":"Buying a company mostly with borrowed money, then loading the debt onto the company itself.","holdout":"A creditor that refuses a restructuring deal and sues for the full amount instead.","deregulation":"Removing rules that constrain what a business may do.","tax haven":"A place that offers low or no tax, and often secrecy, to money earned elsewhere.","net worth":"Everything a person owns minus everything they owe.","hedge fund":"A lightly regulated fund for wealthy and institutional investors, free to use debt and derivatives.","bank secrecy":"Laws making it a crime for a bank to tell another country's tax authority about an account.","liberalisation":"Opening a market to private and foreign competition by removing restrictions.","regressive":"A tax or charge that takes a larger share of a poor person's income than a rich person's.","dynasty":"A family that holds wealth or power across generations.","restructuring":"Rewriting the terms of a debt that cannot be paid as agreed.","default":"Failing to make a payment a debt contract requires.","monopoly":"A market with one seller, which can therefore set the price.","franchise":"Here, the right to run a business under another company's name and rules; also a state's revenue from company registrations.","informal":"Work or housing with no contract, registration or legal protection.","union":"An organisation of workers that bargains collectively with an employer.","unions":"Organisations of workers that bargain collectively with employers.","lobbying":"Paid, organised persuasion of lawmakers and officials.","minimum wage":"The lowest hourly or monthly pay an employer may lawfully give.","offshore":"Held in another country, usually one chosen for its secrecy or low tax.","secrecy":"Rules that stop other countries' authorities from finding out who owns what.","income tax":"A tax on money earned from work or investments.","visa":"Permission to enter or work in a country, often tied to one employer.","subsidy":"A government payment that supports a price, an industry or a landowner.","royalties":"Payments to the owner of land or a resource for the right to extract it.","tribunal":"A panel that decides disputes outside the ordinary courts.","withholding":"Deducting money at source, from a wage or a payment abroad, before it reaches the recipient.","right to buy":"The UK policy giving council tenants the right to buy their home at a discount.","farmgate":"At the farm itself: the price a grower is actually paid, before anything downstream is added.","fractionated":"Split by inheritance into many tiny shares, so the land cannot be used or sold.","pension":"Income paid after retirement, either guaranteed by an employer or state, or drawn from a pot of savings."};
var ABOUT="\n<h1>About this map<\/h1>\n<p>Economic inequality is usually described as a condition rather than a practice, with trends, forecasts and nobody to write to. This map takes the opposite approach. Each point is a mechanism that moves advantage from one generation to the next, placed at the address of the institution that operates it. There are 68 of them.<\/p>\n<p>The distinction matters for what the map contains. A company that pays badly is not a mechanism, and neither is a fortune, however large. The mechanism is the rule, the statute, the contract or the doctrine that determines who may own, who may leave, who may be taxed and who inherits. Those are the things that produce inequality which persists after the people involved are dead, and they are the things that can be changed by other rules.<\/p>\n\n<h2>What qualifies<\/h2>\n<p>An entry has to do one of four things. It carries wealth across a death without a taxable moment, through a trust, a foundation, a holding structure or a relief written into a tax code. It holds or withholds land, so that a dispossession is inherited by people who were not alive when it happened. It fixes a person's legal status at birth, at a border or by sentence, in a way that determines what they can earn and whether they may leave. Or it is the doctrine, drafted somewhere and funded for as long as it took, that produced one of the first three.<\/p>\n<p>Firms and individuals appear here as anchors rather than as subjects. The entry on index-fund voting sits at an asset manager's headquarters because that is where the mechanism runs from, not because the firm is uniquely responsible for it; the same mechanism operates at its competitors. Where a company is the clearest documented instance of something, it is used as the instance.<\/p>\n\n<h2>How to read it<\/h2>\n<p>Colour marks the family a mechanism belongs to, and the colours change with the basemap because each basemap has a palette drawn from its own tones. Dot size shows reach. The filters in the left panel narrow by family, by the specific mechanism at work and by how far it extends. Underlined words carry a definition, which appears when you hover over them or tap them. The button marked All mechanisms lists every entry grouped by family, and the basemap selector offers the five maps used across this site. Whatever you have filtered to can be exported as a spreadsheet with the names and addresses in it.<\/p>\n\n<h2>The rule about addresses<\/h2>\n<p class=\"warn\">Every address here is a registered office, a headquarters, a ministry, a courthouse, a campus or an official premises. There are no private homes on this map and there never will be. A corporate headquarters is where the decision is made, where legal papers are served, where a shareholder meeting happens, where a picket is lawful and a journalist can ask a question. A private residence is where somebody's children live, and going there turns an argument about policy into a case about harassment.<\/p>\n\n<h2>What is covered, and what is not<\/h2>\n<p>The map follows the facets of economic inequality set out in the suppression section of this site, and reads them through a single question: what gets transmitted. It does not rank the entries against each other, because no honest measure would place a land statute above a tax provision on a common scale. What it offers instead is the mechanism in each case, with the sources, so that the weight can be judged.<\/p>\n<p>Coverage follows the documentation, which is uneven in a direction worth naming. The United States, the United Kingdom and the European Union are heavily represented because that is where both the money and the records are concentrated. China, Russia, the Gulf states and much of Central Asia are under-represented relative to what is almost certainly happening there, because far less of it can be sourced to a document. Absence from this map is not evidence that nothing is happening.<\/p>\n\n<h2>What it is for<\/h2>\n<p>A mechanism has an address, which means it has a legislature that can repeal it, a regulator that can reinterpret it, a court where it can be challenged and a public that can be told about it. Several entries here describe arrangements that were reversed: Chile rebuilt a public pension system in 2025 after a decade of protest, the United Kingdom capped two inheritance tax reliefs in April 2026, Michigan repealed its right-to-work law, and more than three hundred cities have taken their water systems back into public hands. Berlin voted by 59 per cent to expropriate its largest corporate landlords and the result has not been implemented, which is the other half of the picture. These arrangements can be changed, and they do not change by themselves.<\/p>\n";
var METHOD="\n<h1>Method and sources<\/h1>\n<p>Built 18 November 2026. 68 mechanisms, about 14,145 words of write-up, 157 defined terms.<\/p>\n\n<h2>How an entry gets on the map<\/h2>\n<p>Four tests. The entry has to be a mechanism rather than an actor, which means it has to be describable as a rule, an instrument or a practice that someone else could also use. It has to transmit advantage or disadvantage between generations, demonstrably rather than plausibly. It has to have a verifiable location that is an official premises. And every figure in the write-up has to come from a source that can be linked and checked: a court judgment, a statute, a regulator's order, a company filing, a statistical agency, a parliamentary inquiry, a peer-reviewed paper or a named investigation.<\/p>\n<p>The first test is what changed this map most. An earlier version listed companies and individuals on the grounds that they were large, profitable or badly behaved. Most of those have gone, because a firm that pays poorly is doing something that ends when the firm does, while the arrangement that determines what it may pay outlasts it. Where a company remains, the entry is about the practice and the company is where that practice is anchored.<\/p>\n<p>Nothing here is inferred or estimated. Contested claims are marked as contested and the denial is stated. Figures that move are dated. Where an argument is disputed within the relevant literature, the dispute is noted rather than resolved, which applies to common ownership and competition, to the long-run effects of the redlining maps, and to the historiography of public choice.<\/p>\n\n<h2>The eight families<\/h2>\n<table>\n<tr><th>Family<\/th><th>What it holds<\/th><th>Entries<\/th><\/tr>\n<tr><td>Inheritance and dynastic transmission<\/td><td>Instruments that carry wealth across a death without a taxable transfer.<\/td><td>7<\/td><\/tr>\n<tr><td>Land, title and dispossession<\/td><td>Rules determining who may own land, on what terms, and what happens to those excluded.<\/td><td>9<\/td><\/tr>\n<tr><td>Debt, indemnity and conditionality<\/td><td>Arrangements that decide whose claims are paid first and what must be cut to pay them.<\/td><td>9<\/td><\/tr>\n<tr><td>Legal status that binds labour<\/td><td>Categories, inherited or imposed, that remove a worker's ability to leave and therefore to bargain.<\/td><td>10<\/td><\/tr>\n<tr><td>Secrecy and the architecture of tax<\/td><td>Registries, jurisdictions and professional structures that determine which wealth can be found.<\/td><td>9<\/td><\/tr>\n<tr><td>Public provision withdrawn<\/td><td>Pensions, housing and schooling moved out of collective hands or funded by local property wealth.<\/td><td>5<\/td><\/tr>\n<tr><td>Ownership concentrated<\/td><td>Arrangements under which a few holders make decisions for markets that millions depend on.<\/td><td>5<\/td><\/tr>\n<tr><td>Doctrine and rule-writing<\/td><td>Where the argument was written, funded and maintained until a government could use it.<\/td><td>14<\/td><\/tr>\n<\/table>\n\n<h2>Definitions<\/h2>\n<p>Technical terms are underlined wherever they appear, in the entries and in these pages, and hovering or tapping gives a one-line definition in plain language. There are 157 of them, covering trusts, land tenure, sovereign debt, tax structuring and labour status. They are deliberately short. Where a term carries a genuine dispute, the entry it appears in sets the dispute out.<\/p>\n\n<h2>Anchor figures used across the map<\/h2>\n<ul>\n<li><b>Global distribution.<\/b> The World Inequality Report 2026, from the World Inequality Lab at the Paris School of Economics, finds that fewer than 60,000 people in the top 0.001 per cent hold three times the wealth of the poorest half of humanity, and that in almost every region the top 1 per cent hold more than the bottom 90 per cent combined. <a href=\"https://prod.wid.world/www-site/uploads/2025/12/World_Inequality_Report_2026.pdf\" target=\"_blank\" rel=\"noopener\">Report<\/a><\/li>\n<li><b>Tax losses.<\/b> The Tax Justice Network's State of Tax Justice 2025 estimates annual losses of about $492 billion to corporate profit shifting and offshore private wealth, with $1.42 trillion of profit shifted into low-tax jurisdictions each year. <a href=\"https://taxjustice.net/wp-content/uploads/2025/11/State-of-Tax-Justice-2025-report-Tax-Justice-Network.pdf\" target=\"_blank\" rel=\"noopener\">Report<\/a><\/li>\n<li><b>Inherited wealth.<\/b> The Joint Committee on Taxation, reported by the Congressional Research Service, puts the cost of excluding capital gains at death at roughly $40 billion a year. HM Treasury records 117 UK estates taking &pound;219 million in agricultural property relief in 2021-22, two-fifths of that relief's entire cost. <a href=\"https://www.congress.gov/crs_external_products/IF/PDF/IF11812/IF11812.2.pdf\" target=\"_blank\" rel=\"noopener\">CRS<\/a><\/li>\n<li><b>Executive pay.<\/b> The Economic Policy Institute's series puts chief executive pay at the largest 350 US firms at 325 times that of a typical worker in 2025, against about 21 times in 1965. <a href=\"https://www.epi.org/blog/ceo-pay-surged-in-2025-ceos-are-paid-325-times-as-much-as-the-typical-worker/\" target=\"_blank\" rel=\"noopener\">EPI<\/a><\/li>\n<li><b>Austerity.<\/b> Oxfam's 2026 analysis of 161 IMF loans to 81 countries found 24 of 28 countries with ongoing programmes required to implement austerity, with median cuts about five times deeper in loans agreed since 2018 than in the preceding period. <a href=\"https://www.oxfam.org/en/press-releases/countries-locked-imf-austerity-programs-are-also-around-twice-vulnerable-economic\" target=\"_blank\" rel=\"noopener\">Oxfam<\/a><\/li>\n<li><b>Political influence.<\/b> Gilens and Page, examining nearly 1,800 US policy questions, found that economic elites and organised business groups have substantial independent influence on policy outcomes while average citizens have close to none. <a href=\"https://www.cambridge.org/core/journals/perspectives-on-politics/article/testing-theories-of-american-politics-elites-interest-groups-and-average-citizens/62327F513959D0A304D4893B382B992B\" target=\"_blank\" rel=\"noopener\">Paper<\/a><\/li>\n<\/ul>\n\n<h2>Coordinates, addresses and basemaps<\/h2>\n<p>Coordinates sit on the named building rather than on a country centroid, so zooming in shows the premises. Addresses are given as the institution publishes them, in filings, on contact pages or in public registers. Where a registered address and the working offices differ, the registered address is used, because that is the one with legal effect. Names of office-holders are current as of November 2026 and will date; the mechanism is the entry, not the person administering it.<\/p>\n<p>The five basemaps are the ones built for the Culprits map and used across this site, with point colours matched to each. Imagery and elevation come from Esri and its suppliers, place names from CARTO and OpenStreetMap, night lights from NASA's VIIRS Black Marble.<\/p>\n\n<h2>Known gaps<\/h2>\n<ul>\n<li>Dowry and bride-price systems, hereditary occupational closure outside South Asia, inherited water rights in the American West, church and crown landholdings, and citizenship itself as an inherited income are all mechanisms of this kind and are not yet entered.<\/li>\n<li>The counter-mechanisms are missing entirely: land restitution commissions, wealth registers, collective bargaining law, universal provision, and the litigation and organising that has reversed several of the arrangements described here. That is the obvious companion map.<\/li>\n<li>Coverage follows the paper trail, so jurisdictions with free courts and a free press are over-represented.<\/li>\n<li>Figures that move, including assets under management and portfolio sizes, are dated where they appear and will go out of date.<\/li>\n<\/ul>\n\n<h2>Corrections<\/h2>\n<p>If an entry is wrong in a figure, an address, a characterisation or a denial that should have been recorded, the correction will be made with the source attached. An institution that disputes a characterisation will have its response stated in its own entry, as several already do.<\/p>\n\n<h2>Credit<\/h2>\n<p>Almost nothing here was discovered on this map. It is assembled from the work of the World Inequality Lab, the Tax Justice Network, Oxfam, the Economic Policy Institute, Anti-Slavery International, the UN Special Rapporteur on contemporary forms of slavery, Human Rights Watch, the Indian Land Tenure Foundation, Africa Check, the International Consortium of Investigative Journalists, the Black Beyond Data project, the Center for Media and Democracy, ProPublica, the Government Accountability Office, the Congressional Research Service, the Urban Institute, the MacArthur Foundation, Fairtrade International, and the researchers cited in each entry.<\/p>\n";

var GRX=null;
(function(){
  var keys=Object.keys(GLOSS).sort(function(a,b){return b.length-a.length});
  var pat=keys.map(function(k){return k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}).join("|");
  GRX=new RegExp("\\b("+pat+")\\b","gi");
})();
function glMark(t,used){
  return t.replace(GRX,function(m){
    var k=m.toLowerCase();
    if(!GLOSS[k]||used[k])return m;
    used[k]=1;
    return "<span class='gl' data-d=\""+esc(GLOSS[k])+"\">"+m+"</span>";
  });
}
function gl(s){return glMark(esc(s),{})}
/* for text that is already HTML: only touch the text between tags */
function glHTML(h){
  var used={};

}

  g.addEventListener("mousedown",down);g.addEventListener("touchstart",down,{passive:false});
  window.addEventListener("mousemove",move);window.addEventListener("touchmove",move,{passive:false});
  window.addEventListener("mouseup",up);window.addEventListener("touchend",up);
})();

/* ---------- left key ---------- */
function cnt(fn){var n=0;ENTS.forEach(function(e){if(fn(e))n++});return n}
function drawKey(){
  var h="";
  h+="<div class='psec'>What it works through</div>";
  TYPES.forEach(function(t){
    var n=cnt(function(e){return e.t===t.k});
    h+="<div class='row"+(S.types[t.k]?"":" off")+"' data-type='"+t.k+"'><span class='sw' style='background:"+tcol(t.k)+"'></span><span>"+esc(t.n)+"</span><span class='n'>"+n+"</span></div>";
  });
  h+="<div style='margin-top:5px'><span class='frst' data-all='types'>all</span> &middot; <span class='frst' data-none='types'>none</span></div>";

  h+="<div class='psec'>The mechanism at work</div><div class='fchips'>";
  MECHS.forEach(function(m){
    var n=cnt(function(e){return e.mx.indexOf(m.k)>=0});
    h+="<span class='fc"+(S.mechs[m.k]?" on":"")+"' data-mech='"+m.k+"'>"+esc(m.n)+"<span class='n'>"+n+"</span></span>";
  });
  h+="</div><div><span class='frst' data-all='mechs'>all</span> &middot; <span class='frst' data-none='mechs'>none</span></div>";

  h+="<div class='psec'>How far it reaches</div><div class='fchips'>";
  REACH.forEach(function(r){
    var n=cnt(function(e){return e.rch===r.k});
    h+="<span class='fc"+(S.reach[r.k]?" on":"")+"' data-reach='"+r.k+"'>"+esc(r.n)+"<span class='n'>"+n+"</span></span>";
  });
  h+="</div>";

  h+="<div class='psec'>Find</div>";
  h+="<input class='inp' id='q' type='text' placeholder='mechanism, city, street, institution' value=\""+esc(S.q)+"\">";
  h+="<div id='flist' class='scroll'></div>";
  h+="<div style='margin-top:8px;display:flex;gap:6px;flex-wrap:wrap'><button class='btn' id='csvBtn'>Download this list (CSV)</button><button class='btn' id='rstBtn'>Reset filters</button></div>";
  h+="<p class='hint'>Each point is a mechanism, placed at the address of the institution that runs it. Registered offices, ministries, courts and campuses only; no private homes.</p>";
  document.getElementById("keyBody").innerHTML=h;

  var q=document.getElementById("q");
  q.oninput=function(){S.q=q.value;refresh(true)};
  document.getElementById("csvBtn").onclick=csv;
  document.getElementById("rstBtn").onclick=function(){
    TYPES.forEach(function(t){S.types[t.k]=true});MECHS.forEach(function(m){S.mechs[m.k]=true});
    REACH.forEach(function(r){S.reach[r.k]=true});S.q="";refresh()};
  drawFind();
  var n=shown().length;
  document.getElementById("lede2").textContent=n+" of "+ENTS.length+" mechanisms shown";
}
function drawFind(){
  var el=document.getElementById("flist");if(!el)return;
  var list=shown();
  if(!S.q){el.innerHTML="<p class='hint'>Type to search, or click a point. Showing "+list.length+" mechanisms.</p>";return}
  var h="";
  list.slice(0,60).forEach(function(e){
    h+="<div class='fi' data-go='"+e.id+"'><span class='sw' style='background:"+col(e)+";margin-top:3px'></span><span><b>"+esc(e.n)+"</b><span class='fm'>"+esc(e.pl)+"</span></span></div>";
  });
  if(list.length>60)h+="<p class='hint'>"+(list.length-60)+" more — narrow the search.</p>";
  if(!list.length)h+="<p class='hint'>Nothing matches.</p>";
  el.innerHTML=h;
}
document.getElementById("key").addEventListener("click",function(ev){
  var t=ev.target.closest?ev.target.closest("[data-type],[data-mech],[data-reach],[data-go],[data-all],[data-none]"):null;
  if(!t)return;
  if(t.dataset.type!==undefined){S.types[t.dataset.type]=!S.types[t.dataset.type];refresh()}
  else if(t.dataset.mech!==undefined){S.mechs[t.dataset.mech]=!S.mechs[t.dataset.mech];refresh()}
  else if(t.dataset.reach!==undefined){S.reach[t.dataset.reach]=!S.reach[t.dataset.reach];refresh()}
  else if(t.dataset.all!==undefined){var g=t.dataset.all;
    if(g==="types")TYPES.forEach(function(x){S.types[x.k]=true});else MECHS.forEach(function(x){S.mechs[x.k]=true});refresh()}
  else if(t.dataset.none!==undefined){var g2=t.dataset.none;
    if(g2==="types")TYPES.forEach(function(x){S.types[x.k]=false});else MECHS.forEach(function(x){S.mechs[x.k]=false});refresh()}
  else if(t.dataset.go!==undefined){
    var e=ENTS.filter(function(x){return x.id===t.dataset.go})[0];
    if(e){openDet(e);flyTo(e,true)}
  }
});
document.getElementById("toggleKey").onclick=function(){
  var k=document.getElementById("key");k.classList.toggle("min");
  this.innerHTML=k.classList.contains("min")?"+":"&minus;"};

/* ---------- legend ---------- */
function drawLeg(){
  var h="";
  TYPES.forEach(function(t){
    var n=cnt(function(e){return e.t===t.k&&passes(e)});
    h+="<div class='row"+(S.types[t.k]?"":" off")+"' data-type='"+t.k+"' title=\""+esc(t.d)+"\"><span class='sw' style='background:"+tcol(t.k)+"'></span><span>"+esc(t.n)+"</span><span class='n'>"+n+"</span></div>";
  });
  h+="<div class='flab' style='margin-top:9px'>Dot size &mdash; how far it reaches</div><div class='fchips'>";
  REACH.forEach(function(r){
    h+="<span class='fc"+(S.reach[r.k]?" on":"")+"' data-reach='"+r.k+"' style='cursor:pointer' title='Show only this reach'><span class='sw' style='background:"+(S.light?"#4a5c5c":"#8d9699")+";width:"+(r.r+2)+"px;height:"+(r.r+2)+"px;margin-right:5px'></span>"+esc(r.n)+"</span>";
  });
  h+="</div>";
  document.getElementById("legBody").innerHTML=h;
}
document.getElementById("legBox").addEventListener("click",function(ev){
  var t=ev.target.closest?ev.target.closest("[data-type],[data-reach]"):null;if(!t)return;
  if(t.dataset.type!==undefined){S.types[t.dataset.type]=!S.types[t.dataset.type];refresh()}
  else{
    var k=t.dataset.reach, sole=REACH.every(function(r){return S.reach[r.k]===(r.k===k)});
    REACH.forEach(function(r){S.reach[r.k]=sole?true:(r.k===k)});refresh()}
});
document.getElementById("toggleLeg").onclick=function(){
  var b=document.getElementById("legBox");b.classList.toggle("min");
  this.innerHTML=b.classList.contains("min")?"+":"&minus;";sizeBoxes()};

/* ---------- entry links inside an overlay ---------- */
document.getElementById("story").addEventListener("click",function(ev){
  var t=ev.target.closest?ev.target.closest("[data-go]"):null;if(!t)return;
  var e=ENTS.filter(function(x){return x.id===t.dataset.go})[0];
  if(e){closeOv();openDet(e);flyTo(e,true)}
});

/* ---------- basemap box ---------- */
function drawBase(){
  var h="<div class='psec' style='margin:0 0 3px'>Basemap</div><div class='bases'>";
  CulpritsBasemaps.list.forEach(function(b){
    h+="<label><input type='radio' name='bs' value='"+b[0]+"'"+(BM.current()===b[0]?" checked":"")+">"+esc(b[1])+"</label>";
  });
  h+="</div>";
  h+="<div class='rng'><span>Dots</span><input type='range' id='opR' min='30' max='100' value='"+Math.round(S.dots*100)+"'></div>";
  h+="<p class='hint' style='margin-top:5px'>Point colours change with the basemap, so each set is drawn from the tones of the map underneath it.</p>";
  document.getElementById("trBody").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll("input[name=bs]"),function(r){
    r.onchange=function(){BM.set(r.value)}});
  document.getElementById("opR").oninput=function(){
    S.dots=+this.value/100;
    map.setPaintProperty("e-dot","circle-opacity",S.dots);
    map.setPaintProperty("e-halo","circle-opacity",S.dots*.3);
  };
}
document.getElementById("toggleTr").onclick=function(){
  var b=document.getElementById("tr");b.classList.toggle("min");
  this.innerHTML=b.classList.contains("min")?"+":"&minus;"};

/* ---------- overlays ---------- */
function closeOv(){document.getElementById("info").classList.remove("open");document.getElementById("story").classList.remove("open")}
document.getElementById("infoClose").onclick=closeOv;
document.getElementById("storyClose").onclick=closeOv;
document.getElementById("infoBtn").onclick=function(){
  document.getElementById("info").innerHTML=glHTML(METHOD);
  document.getElementById("info").classList.add("open");document.getElementById("info").scrollTop=0};
document.getElementById("storyBtn").onclick=function(){
  var st=document.getElementById("story");
  st.innerHTML=glHTML(ABOUT);st.classList.add("open");st.scrollTop=0};
document.getElementById("patBtn").onclick=function(){
  var h="<h1>Every mechanism on the map</h1><p>"+ENTS.length+" of them, grouped by what they work through. Choose one to read it and go to the place it runs from.</p>";
  TYPES.forEach(function(t){
    var list=ENTS.filter(function(e){return e.t===t.k});
    if(!list.length)return;
    h+="<h2>"+esc(t.n)+"</h2><p class='hint' style='margin:-4px 0 8px'>"+gl(t.d)+"</p><div class='chips'>";
    list.forEach(function(e){h+="<span data-go='"+e.id+"'><span class='sw' style='background:"+col(e)+";width:9px;height:9px'></span>"+esc(e.n)+"</span>"});
    h+="</div>";
  });
  var st=document.getElementById("story");st.innerHTML=h;st.classList.add("open");st.scrollTop=0;
};
document.getElementById("worldBtn").onclick=function(){map.flyTo({center:[-22,22],zoom:1.8,duration:1200})};
var proj="globe";
function setProj(p){
  proj=p;
  try{map.setProjection({type:p})}catch(e){}
  var b=document.getElementById("flatBtn");
  b.textContent=(p==="globe")?"Flat map":"Globe";
  b.title=(p==="globe")?"Switch to a flat map":"Switch back to the globe";
  map.flyTo({center:map.getCenter(),zoom:p==="globe"?Math.max(map.getZoom(),1.4):Math.max(map.getZoom(),1.1),duration:700});
}
document.getElementById("flatBtn").onclick=function(){setProj(proj==="globe"?"mercator":"globe")};

/* ---------- csv ---------- */
function csv(){
  var rows=[["mechanism","family","what it is","place","address","anchor","reach","mechanisms"]];
  shown().forEach(function(e){
    rows.push([e.n,TY[e.t].n,e.ro,e.pl,e.ad,e.who||"",RC[e.rch].n,
      e.mx.map(function(m){return MC[m]?MC[m].n:m}).join("; ")]);
  });
  var out=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n");
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+out],{type:"text/csv;charset=utf-8"}));
  a.download="inequality-mechanisms.csv";document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},800);
}

/* ---------- layout ---------- */
function sizeBoxes(){
  var l=document.getElementById("legBox");
  var lh=l.classList.contains("min")?44:Math.min(250,Math.round(window.innerHeight*.30));
  document.documentElement.style.setProperty("--legH",lh+"px");
  l.style.maxHeight=lh+"px";
}
window.addEventListener("resize",sizeBoxes);

function refresh(keepFocus){
  paintDots();drawKey();drawLeg();
  if(keepFocus){var q=document.getElementById("q");if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}

</script>
</body>
</html>
