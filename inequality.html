er the SpaceX listing"],["Tesla pay package","a package potentially worth up to roughly $1 trillion approved by shareholders in November 2025"],["2025 reported compensation","$158 billion as reported by Tesla — excluded from EPI's CEO pay series as an outlier"],["Comparison","his personal wealth exceeds the annual GDP of all but about twenty countries"]],"rd":"One person's holdings in two companies now exceed the annual output of most countries. It is worth being precise about where it came from: Tesla's rise was financed in part by public money — a $465 million US Department of Energy loan in 2010, California zero-emission-vehicle credits, consumer tax credits — and SpaceX's by NASA and Department of Defense contracts. The gains were private; the early risk was substantially public.\nMusk has also fought union organising at Tesla (the NLRB found violations at the Fremont plant), spent heavily in US elections, and used his ownership of X to shape the political conversation directly. A fortune of this size is not only consumption capacity; it is the ability to buy a platform, a party's ground game and a satellite network.","mn":"Past a certain size a fortune stops being money and becomes a form of government that nobody elected.","pt":["p1","p3","p12"],"sr":[["Forbes Real-Time Billionaires","https://www.forbes.com/real-time-billionaires/"],["EPI, 'CEO pay surged in 2025' (note on Tesla's reported package)","https://www.epi.org/blog/ceo-pay-surged-in-2025-ceos-are-paid-325-times-as-much-as-the-typical-worker/"]],"i":80},{"id":"invitation","n":"Invitation Homes","t":"own","lat":32.78,"lon":-96.797,"pl":"Dallas, Texas, United States","ad":"1717 Main Street, Suite 2000, Dallas, TX 75201","ro":"The largest corporate owner of single-family rental houses in the United States, assembled out of the foreclosure crisis.","who":"A listed company (NYSE: INVH); created by Blackstone, which took it public in 2017 and exited in 2019.","rch":"national","mx":["rent","conc"],"fg":[["Homes in the portfolio, Q3 2026","85,961"],["Average occupancy","96.4%"],["Renewal rent growth, Q3 2026","4.3%"]],"rd":"After 2008, houses taken in foreclosure were sold in bulk, at scale and for cash, to investors who could buy without a mortgage. Those houses are now rented back to households in the same neighbourhoods. The company raises renewal rents at a steady rate each year, and in the markets it operates in a family bidding for one of those houses is bidding against a buyer with a lower cost of capital than any household can obtain.","mn":"A house is the asset through which most families in the United States have accumulated anything at all. Each house moved from owner-occupation into a rental portfolio removes one rung from that ladder and converts it into an income stream for a shareholder.","pt":["p6","p1"],"sr":[["Invitation Homes Q3 2026 results","https://s28.q4cdn.com/264003623/files/doc_earnings/2026/q3/earnings-result/Q3-2026-Press_Release.pdf"],["Invitation Homes: investor relations","https://www.invh.com/investor-relations"]],"i":81},{"id":"kkr","n":"KKR","t":"own","lat":40.754,"lon":-74.0003,"pl":"New York, United States","ad":"30 Hudson Yards, New York, NY 10001","ro":"Invented the leveraged buyout, and applied it to housing, hospitals and care homes.","who":"Joseph Bae and Scott Nuttall, co-chief executives; Henry Kravis and George Roberts, co-founders","rch":"global","mx":["conc","rent","priv"],"fg":[["RJR Nabisco (1989)","$25 billion buyout, the model for the industry"],["US nursing homes","a 2021 NBER study of private-equity ownership found a 10% relative increase in short-term mortality among residents"],["Care homes","private equity now owns a large share of US nursing home beds and UK children's social care placements"]],"rd":"A leveraged buyout works by borrowing against the company you are buying, so the company carries the debt and the buyer carries the upside. Applied to a manufacturer it tends to produce cost cuts. Applied to a nursing home it produces a measurable change in how many residents die: economists studying US Medicare records found that private-equity ownership was associated with about a 10% relative increase in short-term mortality, through lower nurse staffing per resident.\nThe same structure has been applied to rental housing in Dublin, Berlin and Madrid, to GP surgeries, veterinary clinics, dentistry and children's care — that is, to the services where the customer cannot leave.","mn":"The logic that makes a factory more efficient makes a care home more dangerous, because in a care home the cost being cut is the person who checks on you.","pt":["p6","p1","p15"],"sr":[["Gupta, Howell, Yannelis & Gupta, 'Does Private Equity Investment in Healthcare Benefit Patients?' NBER WP 28474","https://www.nber.org/papers/w28474"],["US GAO on private equity in nursing homes","https://www.gao.gov/products/gao-23-105617"]],"i":82},{"id":"pif","n":"Public Investment Fund (PIF)","t":"own","lat":24.7625,"lon":46.642,"pl":"Riyadh, Saudi Arabia","ad":"PIF Tower, King Abdullah Financial District, Riyadh 13519","ro":"A state fund that converts oil revenue into permanent global shareholdings, directed by the head of state.","who":"Chaired by Crown Prince Mohammed bin Salman; governor Yasir Al-Rumayyan.","rch":"global","mx":["conc","rent"],"fg":[["Assets under management, end 2025","SAR 3,396 billion, reported as over $900 billion"],["Target for 2030","$2 trillion"],["Share of assets held domestically","about 60%"]],"rd":"Oil is a finite rent. A sovereign fund turns it into a claim on other people's future output: equities, infrastructure, sports, technology. The fund answers to the chair rather than to a parliament or a published mandate, and the Saudi labour market it sits on top of runs on the kafala system, in which a migrant worker's legal status is tied to an employer.","mn":"Where a fund of this kind buys, the income from an asset leaves the country it is in and does not come back. The decisions are made by very few people, and the workers who built the fund's domestic projects cannot change employers at will.","pt":["p1","p7"],"sr":[["PIF 2025 annual report","https://www.pif.gov.sa/en/news-and-insights/press-releases/2026/pif-announces-2025-annual-results/"],["Global SWF rankings via Gulf Business: three GCC funds above $1tn","https://gulfbusiness.com/3-gcc-swfs-aum-over-1tn-global-swf/"]],"i":83},{"id":"statestreet","n":"State Street Global Advisors","t":"own","lat":42.3637,"lon":-71.0576,"pl":"Boston, Massachusetts, United States","ad":"One Congress Street, Boston, MA 02114","ro":"Third of the ‘Big Three’ index managers, and custodian of tens of trillions more in other people's assets.","who":"Yie-Hsin Hung, president and chief executive of the asset management arm","rch":"global","mx":["conc","cap"],"fg":[["Assets under management","$6.31 trillion (30 Sep 2026)"],["Share of US equity ETF assets","about 14%"]],"rd":"State Street launched the first American exchange-traded fund and still runs SPY, the fund that tracks the S&P 500. Together with BlackRock and Vanguard it forms the bloc that research has found to be the largest shareholder in the great majority of S&P 500 companies, casting roughly a quarter of the votes at their annual meetings.\nThat bloc is also the reason the three firms are studied as a competition problem. When the same owners sit atop rival airlines, rival banks and rival meatpackers, the incentive to undercut each other on price — or to bid against each other for workers — weakens.","mn":"When the same three owners hold your employer and its competitors, the bidding war for your labour that is supposed to raise your pay never quite happens.","pt":["p1"],"sr":[["Largest asset manager statistics (2026)","https://walnutinvest.com/stats/largest-asset-manager-statistics"],["Fichtner et al., 'These three firms own corporate America'","https://theconversation.com/these-three-firms-own-corporate-america-77072"]],"i":84},{"id":"vanguard","n":"The Vanguard Group","t":"own","lat":40.0456,"lon":-75.5272,"pl":"Malvern, Pennsylvania, United States","ad":"100 Vanguard Boulevard, Malvern, PA 19355","ro":"Second-largest asset manager; structurally owned by its own funds, controlled by its own executives.","who":"Salim Ramji, chief executive","rch":"global","mx":["conc","cap"],"fg":[["Assets under management","roughly $11.6 trillion (Sep 2026)"],["Share of US equity ETF assets","about 29%"]],"rd":"Vanguard is formally owned by the funds it runs, which means it is owned by its investors — tens of millions of them, none of whom can direct it. Decisions sit with its executives in Malvern, a town of 3,000 people west of Philadelphia. It is the largest single holder of a great many of the companies that set wages across the American economy.\nIts low fees are real and have saved savers a lot of money. The same machinery also concentrates the vote. Where a company's largest shareholder is a fund manager with no stake in that industry beyond the share price, the pressure it transmits is for margin.","mn":"Cheap index funds were a genuine gain for small savers, and the same arrangement handed three firms a veto over how the companies they hold treat the people who work there.","pt":["p1"],"sr":[["Largest asset manager statistics (2026)","https://walnutinvest.com/stats/largest-asset-manager-statistics"],["Fichtner et al., 'These three firms own corporate America'","https://theconversation.com/these-three-firms-own-corporate-america-77072"]],"i":85},{"id":"vonovia","n":"Vonovia","t":"own","lat":51.478,"lon":7.218,"pl":"Bochum, Germany","ad":"Universitätsstraße 133, 44803 Bochum","ro":"Europe's largest listed landlord, built from privatised public housing.","who":"Rolf Buch, chief executive","rch":"regional","mx":["rent","priv","conc"],"fg":[["Apartments owned","around 550,000 across Germany, Sweden and Austria"],["Origin","assembled from large sales of municipal and state-owned housing stock in the 2000s"],["Berlin referendum (Sept 2021)","59.1% voted to expropriate large landlords' holdings; the result was not implemented"],["Berlin rent cap","passed in 2020, struck down by the Federal Constitutional Court in 2021 on competence grounds"]],"rd":"German cities sold enormous quantities of public housing in the 2000s to close budget gaps — Dresden sold its entire stock; Berlin sold around 200,000 units. The buyers consolidated into Vonovia and Deutsche Wohnen, which Vonovia then absorbed. Rents in Berlin roughly doubled over the following decade. In September 2021, 59.1% of Berliners voted in a binding-in-principle referendum to socialise the holdings of landlords owning more than 3,000 apartments; the city government did not carry it out.\nIt is the clearest case anywhere of a city selling the asset that controlled its own cost of living, and then being unable to buy it back or regulate it.","mn":"Once public housing is sold, the rent it used to hold down becomes somebody's income, and winning a referendum is not enough to get it back.","pt":["p6","p8","p15"],"sr":[["Berlin referendum results, Deutsche Wohnen & Co. enteignen (September 2021)","https://www.berlin.de/wahlen/volksentscheide/"],["Federal Constitutional Court ruling on the Berlin rent cap (2021)","https://www.bundesverfassungsgericht.de/SharedDocs/Pressemitteilungen/EN/2021/bvg21-028.html"]],"i":86},{"id":"walmart","n":"Walmart","t":"own","lat":36.364,"lon":-94.218,"pl":"Bentonville, Arkansas, United States","ad":"702 SW 8th Street, Bentonville, AR 72716","ro":"The world's largest private employer, and the largest employer of workers who need public assistance to get by.","who":"John Furner, president and chief executive (since 1 February 2026); Greg Penner, chairman; the Walton family holds roughly 45% of the shares","rch":"global","mx":["floor","conc","cap"],"fg":[["Employees worldwide","about 2.1 million"],["GAO finding (2020)","Walmart was among the top four employers of Medicaid and SNAP recipients in all 15 state agencies that reported"],["Walton family wealth","the largest family fortune in the world"]],"rd":"In 2020 the US Government Accountability Office asked fifteen state agencies which employers had the most workers on Medicaid and food stamps. Walmart was in the top four in every single one. About 70% of the adults in those programmes were working full time. The company's answer was that it is the country's largest employer, so of course it appears at the top of any list.\nBoth things are true, and that is the point. The business model is a wage low enough that the public topside — food assistance, Medicaid, housing vouchers — fills the gap, while the savings pass to shoppers as low prices and to the Walton family as dividends. Walmart's buying power then pushes the same squeeze down its suppliers, and from them to the factories in Bangladesh, Vietnam and China where the goods are made.","mn":"When a profitable company pays less than it costs to live, the taxpayer quietly tops up the wage and the owners keep the difference.","pt":["p5","p2"],"sr":[["GAO, 'Federal Social Safety Net Programs: Millions of Full-Time Workers Rely on Federal Health Care and Food Assistance Programs' (GAO-21-45)","https://www.gao.gov/products/gao-21-45"],["Walmart, McDonald's among largest employers of SNAP and Medicaid recipients","https://www.cbsnews.com/news/millions-of-full-time-u-s-workers-receive-federal-health-care-and-food-assistance"]],"i":87},{"id":"alec","n":"American Legislative Exchange Council","t":"doct","lat":38.847,"lon":-77.0523,"pl":"Arlington, Virginia, United States","ad":"2900 Crystal Drive, 6th Floor, Arlington, VA 22202","ro":"Writes draft state laws with corporate members, then hands them to legislators to introduce.","who":"Lisa Nelson, chief executive; corporate and legislative members sit on task forces together","rch":"national","mx":["supp","cap","floor"],"fg":[["Model bills becoming law","around 200 US state laws a year originate as ALEC models"],["ALEC Exposed","over 800 model bills published by the Center for Media and Democracy in 2011"],["Reach","ALEC model language appeared in bills in 34 states in the 2011–12 session alone (Brookings)"],["Revenue (2023)","$11.3 million"]],"rd":"ALEC's method is unglamorous and extremely effective. Corporate members and state legislators sit on the same task forces, vote separately, and approve model bills; legislators then take them home and introduce them as their own. Among the recurring subjects: right-to-work laws, state preemption of city minimum wages and paid sick leave, limits on public pensions, voter identification, charter-school expansion, and liability caps. Roughly two hundred state laws a year begin here.\nState legislatures pass tens of thousands of laws with small staffs and little research capacity, which is precisely the gap a drafting service fills.","mn":"Most of the laws that set what work pays are state laws, and a drafting service funded by employers has been supplying them for fifty years.","pt":["p3"],"sr":[["Center for Media and Democracy, ALEC Exposed","https://www.alecexposed.org/"],["Brookings, 'ALEC's influence over lawmaking in state legislatures'","https://www.brookings.edu/articles/alecs-influence-over-lawmaking-in-state-legislatures/"]],"i":88},{"id":"atlas","n":"Atlas Network","t":"doct","lat":38.883,"lon":-77.095,"pl":"Arlington, Virginia, United States","ad":"Two Liberty Center, 4075 Wilson Boulevard, Suite 310, Arlington, VA 22203","ro":"The think tank that creates think tanks — about 500 of them, in 100 countries.","who":"Founded 1981 by Sir Antony Fisher; board drawn from DonorsTrust, the Sarah Scaife Foundation and others","rch":"global","mx":["supp","cap"],"fg":[["Partner organisations","around 500 in roughly 100 countries (581 members reported in 2024)"],["Growth","from 15 think tanks in 9 countries in the mid-1980s to 457 in 96 countries by 2020"],["Funders","includes Koch foundations, DonorsTrust, the Sarah Scaife Foundation"],["Founder's aim","Fisher's stated goal, in his lieutenant's words, was 'to litter the world with free-market think tanks'"]],"rd":"Antony Fisher made money in chicken farming, founded Britain's Institute of Economic Affairs in 1955, and concluded that the model was repeatable. Atlas supplies seed grants, training, fundraising help and a network to local organisations in a hundred countries, which then appear in national debates as homegrown voices. In Latin America its partners were central to the campaigns that unseated left governments in Brazil and to Argentina's and Chile's reform movements; reporting by The New Republic has traced partner campaigns to criminalise climate protest.\nThe design is the clever part. A policy argued for by a local institute in Lima or Lagos reads differently from the same argument made by a foreign foundation.","mn":"The same handful of ideas can arrive in a hundred countries as if each country had thought of them independently.","pt":["p8","p3"],"sr":[["Atlas Network FAQ (partner numbers, address)","https://atlasnetwork.org/faq"],["The New Republic, 'Meet the Shadowy Global Network of Right-Wing Think Tanks'","https://newrepublic.com/article/175488/atlas-shadowy-global-network-right-wing-think-tanks"]],"i":89},{"id":"brt","n":"Business Roundtable","t":"doct","lat":38.88,"lon":-77.023,"pl":"Washington, DC, United States","ad":"1000 Maine Avenue SW, Suite 500, Washington, DC 20024","ro":"The chief executives of the largest US companies, lobbying as a bloc.","who":"Membership of around 200 chief executives of major US corporations","rch":"national","mx":["supp","conc"],"fg":[["1997 statement","formally adopted shareholder primacy: 'the paramount duty of management and of boards of directors is to the corporation's stockholders'"],["2019 statement","181 chief executives signed a revised 'purpose of a corporation' committing to all stakeholders"],["After 2019","academic follow-ups found no significant change in governance documents or practice at signatory firms"],["Lobbying, 2025","about $33.5 million"]],"rd":"The Roundtable is where chief executives act politically as a class rather than as competitors. In 1997 it wrote shareholder primacy into its official statement of corporate purpose. In 2019, after a decade of criticism, 181 of them signed a new statement promising to serve employees, suppliers, communities and the environment too. Lucian Bebchuk and Roberto Tallarita checked: almost none of the signatories had put the commitment to their boards, and corporate governance guidelines at the same companies continued to state that directors act for shareholders.\nMeanwhile the Roundtable lobbied hard for the 2017 corporate tax cut and against the Protecting the Right to Organize Act.","mn":"A public promise to care about workers costs nothing if the governance documents, the pay formulas and the lobbying all still point the other way.","pt":["p1","p3"],"sr":[["Bebchuk & Tallarita, 'The Illusory Promise of Stakeholder Governance' (2020)","https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3544978"],["Business Roundtable statement on the purpose of a corporation (2019)","https://www.businessroundtable.org/business-roundtable-redefines-the-purpose-of-a-corporation-to-promote-an-economy-that-serves-all-americans"]],"i":90},{"id":"chicago","n":"Chicago School of Economics","t":"doct","lat":41.79,"lon":-87.597,"pl":"Chicago, Illinois, United States","ad":"Saieh Hall for Economics, 5757 South University Avenue, Chicago, IL 60637","ro":"The department that trained the economists who ran the experiments — starting with Chile.","who":"Milton Friedman, Arnold Harberger, George Stigler, Gary Becker and colleagues","rch":"global","mx":["supp","cap"],"fg":[["Chile Project","from 1956, a US-funded programme brought Chilean students to Chicago; about 100 trained by 1970"],["El Ladrillo (1973)","the economic programme the 'Chicago Boys' handed the junta within days of the coup"],["Chile's pension system","the 1981 switch to private individual accounts; replacement rates have run far below the promised levels"]],"rd":"From 1956 the University of Chicago, with US State Department and Ford Foundation money, trained a cohort of Chilean economists. After the 1973 coup they presented General Pinochet with a ready-made programme: privatise, deregulate, open to trade, replace the state pension with private accounts. Friedman visited in 1975 and recommended shock treatment. Wages fell sharply, unemployment reached a quarter of the workforce, and the share of income going to the top decile rose to levels Chile has still not undone. The 1981 pension reform is the single most exported piece of it, copied across Latin America and Eastern Europe, and the one Chileans have protested about most since.\nThe laboratory was a country where nobody could vote on the experiment.","mn":"The clearest proof that this was a policy choice rather than economic destiny is that it was first imposed by a dictatorship on people who were given no vote.","pt":["p8"],"sr":[["Valdes, 'Pinochet's Economists: The Chicago School in Chile' (Cambridge University Press)","https://www.cambridge.org/core/books/pinochets-economists/0DB2B8F6C3C1E1B4A5BE34C1CA1FE4C1"],["OECD Pensions at a Glance, Chile country profile","https://www.oecd.org/pensions/pensions-at-a-glance.htm"]],"i":91},{"id":"iea","n":"Institute of Economic Affairs","t":"doct","lat":51.497,"lon":-0.127,"pl":"London, United Kingdom","ad":"2 Lord North Street, Westminster, London SW1P 3LB","ro":"The original free-market think tank, and the one Margaret Thatcher credited.","who":"Founded 1955 by Antony Fisher on Hayek's advice; Tom Clougherty, executive director","rch":"national","mx":["supp","priv"],"fg":[["Founded","1955"],["Thatcher","described the IEA as having created the climate of opinion that made her programme possible"],["Funding transparency","rated poorly by Transparify; has accepted tobacco industry funding, which it has defended"]],"rd":"Hayek told Fisher that the way to change politics was not to enter it but to change what the people who advise politicians consider thinkable. The IEA spent twenty years publishing pamphlets almost nobody read, and then found itself the intellectual supplier to a government that privatised the utilities, sold the council houses, broke the miners' strike and cut the top rate of income tax from 83% to 40%. British inequality rose faster in the 1980s than in any comparable decade.\nIts funding has never been fully disclosed.","mn":"The argument that lost for twenty years and then won for forty did not get more correct in between — it got better funded and better organised.","pt":["p8","p15"],"sr":[["Who Funds You? transparency ratings of UK think tanks","https://whofundsyou.org/"],["Institute for Fiscal Studies, UK income inequality since 1979","https://ifs.org.uk/inequality/"]],"i":92},{"id":"koch","n":"Koch Industries","t":"doct","lat":37.724,"lon":-97.242,"pl":"Wichita, Kansas, United States","ad":"4111 East 37th Street North, Wichita, KS 67220","ro":"A private company that built a political machine to match a party.","who":"Charles Koch, chairman; the late David Koch, co-owner until 2019","rch":"national","mx":["supp","cap"],"fg":[["Network spending","the Koch donor network has set spending targets in the hundreds of millions per election cycle"],["Americans for Prosperity","chapters in dozens of states, with paid organisers"],["Academic funding","grants to hundreds of US universities, including the Mercatus Center at George Mason"],["Company","one of the largest privately held companies in the US; no outside shareholders"]],"rd":"The Koch brothers' contribution was infrastructure rather than ideas: a donor network that pooled hundreds of millions, a grassroots organisation with paid staff in most states, funded chairs and centres at universities, and a pipeline that moved people between all three. The targets were specific — state-level right-to-work laws, opposition to climate regulation and to public transit, resistance to Medicaid expansion, and the 2017 tax cut.\nBecause the company is private, almost none of this had to be disclosed to shareholders, and much of the giving ran through entities that do not disclose donors.","mn":"A few very large fortunes can build something that behaves like a political party, with none of a party's obligations to publish what it raises or who it answers to.","pt":["p3","p8"],"sr":[["Jane Mayer, 'Dark Money' (Doubleday, 2016) — overview","https://en.wikipedia.org/wiki/Dark_Money_(book)"],["OpenSecrets, Koch Industries profile","https://www.opensecrets.org/orgs/koch-industries/summary?id=D000000186"]],"i":93},{"id":"montpelerin","n":"Mont Pelerin Society (founding site)","t":"doct","lat":46.466,"lon":6.845,"pl":"Mont Pèlerin, Vaud, Switzerland","ad":"Hôtel du Parc, Mont Pèlerin, 1801 Le Mont-Pèlerin","ro":"Where thirty-nine people met in 1947 and began rebuilding economics around markets rather than states.","who":"Convened by Friedrich Hayek; attendees included Milton Friedman, Ludwig von Mises, Karl Popper, Lionel Robbins","rch":"global","mx":["supp"],"fg":[["Founded","10 April 1947, 39 participants"],["Nobel laureates among members","Hayek (1974), Friedman (1976), Buchanan (1986), Becker (1992), Coase (1991), Vernon Smith (2002)"],["Funding","early support from the Volker Fund and sympathetic businessmen; later from corporate foundations"]],"rd":"In April 1947, in a hotel above Lake Geneva, Hayek gathered thirty-nine economists, historians and journalists who believed the postwar consensus — planning, strong unions, public ownership, progressive taxation — was a road to tyranny. They had almost no influence for thirty years. Then stagflation arrived in the 1970s and governments went looking for a different theory, and this one was ready, with journals, textbooks, institutes and a trained cadre.\nThat is the useful lesson, whatever you think of the content: the ideas that remade the world economy were kept alive by patient funding for a generation while they were politically dead.","mn":"The policies that widened the gap did not appear from nowhere; they were written, funded and kept on a shelf for thirty years until a crisis made a government reach for them.","pt":["p8"],"sr":[["Mont Pelerin Society statement of aims (1947)","https://www.montpelerin.org/statement-of-aims/"],["Mirowski & Plehwe, 'The Road from Mont Pèlerin' (Harvard University Press, 2009)","https://www.hup.harvard.edu/books/9780674059764"]],"i":94},{"id":"nrtw","n":"National Right to Work Committee","t":"doct","lat":38.807,"lon":-77.187,"pl":"Springfield, Virginia, United States","ad":"8001 Braddock Road, Springfield, VA 22160","ro":"Seventy years of campaigning to make union membership optional where unions bargain.","who":"National Right to Work Committee and its Legal Defense Foundation","rch":"national","mx":["supp","floor","cap"],"fg":[["States with right-to-work laws","26 (Michigan repealed its law in 2024)"],["US union density","about 10% of wage and salary workers in 2025, from roughly a third in the 1950s"],["Janus v. AFSCME (2018)","extended the rule to all US public-sector workers by constitutional ruling"],["Wage effect","EPI estimates wages in right-to-work states average several percent lower, controlling for other factors"]],"rd":"The Taft-Hartley Act of 1947 let states ban contracts that require workers covered by a union agreement to pay for it. The committee has pushed those laws state by state ever since, and in 2018 the Supreme Court made the rule universal for public employees in Janus. The mechanism is not a ban on unions; it is a free-rider problem engineered on purpose — the union must bargain for everyone and may charge only those who volunteer.\nAmerican union density has fallen from about a third of workers to roughly one in ten, and the economic literature links that decline directly to the share of national income going to labour rather than capital.","mn":"The strongest single predictor of whether ordinary pay rises with productivity is whether workers can bargain together, which is why so much effort has gone into making that harder.","pt":["p3","p7"],"sr":[["Janus v. AFSCME, 585 U.S. 878 (2018)","https://supreme.justia.com/cases/federal/us/585/16-1466/"],["Economic Policy Institute on unions and wage inequality","https://www.epi.org/publication/unions-and-wage-inequality/"]],"i":95},{"id":"gmu","n":"Public choice theory (George Mason)","t":"doct","lat":38.83,"lon":-77.308,"pl":"Fairfax, Virginia, United States","ad":"Buchanan House, George Mason University, 4400 University Drive, Fairfax, VA 22030","ro":"The school that taught a generation how to insulate economic rules from majorities.","who":"James M. Buchanan and Gordon Tullock; later the Mercatus Center, substantially funded by Charles Koch","rch":"global","mx":["supp","cap"],"fg":[["Nobel","Buchanan, 1986"],["Chile","Buchanan advised on constitutional design in Chile in 1980, the year of the Pinochet constitution"],["Mercatus Center","among the largest recipients of Koch foundation funding at a US university"]],"rd":"Public choice begins from a reasonable observation — politicians and civil servants have interests of their own — and arrives at a programme: since majorities will vote themselves other people's money, the rules on tax, spending and debt should be put beyond ordinary majority decision, written into constitutions, supermajority requirements and independent agencies. Buchanan advised in Chile in 1980 while a constitution doing exactly that was being drafted. Nancy MacLean's history of the movement argues this was the point rather than a side effect; critics of her book dispute the emphasis, not the advisory record.\nThe institutional residue is everywhere: balanced-budget amendments, debt brakes, tax-and-expenditure limits, state preemption of city minimum wages.","mn":"If the rules about money are moved out of reach of elections, then voting can continue without threatening anybody's wealth.","pt":["p3","p8"],"sr":[["MacLean, 'Democracy in Chains' (Viking, 2017)","https://www.penguinrandomhouse.com/books/212004/democracy-in-chains-by-nancy-maclean/"],["Buchanan & Tullock, 'The Calculus of Consent'","https://oll.libertyfund.org/title/buchanan-the-calculus-of-consent"]],"i":96},{"id":"rochester","n":"Shareholder primacy (Jensen & Meckling)","t":"doct","lat":43.128,"lon":-77.629,"pl":"Rochester, New York, United States","ad":"Simon Business School, University of Rochester, Rochester, NY 14627","ro":"The paper that redefined a company as a bundle of contracts owing everything to its shareholders.","who":"Michael Jensen and William Meckling (1976); Jensen & Murphy on stock-based pay (1990)","rch":"global","mx":["supp","conc"],"fg":[["1976","'Theory of the Firm: Managerial Behavior, Agency Costs and Ownership Structure' — one of the most cited economics papers ever written"],["1990","Jensen & Murphy argue executives are paid 'like bureaucrats' and should be paid in stock"],["CEO pay since","up 1,316% from 1978 to 2025, against 28% for typical workers (EPI)"],["Business Roundtable","adopted shareholder primacy formally in 1997; revised the statement in 2019"]],"rd":"Before the 1970s a large American company described itself as balancing the claims of shareholders, employees, customers and communities. Jensen and Meckling's agency theory recast the manager as a hired agent who would shirk unless his pay was tied to the share price. The prescription — pay executives in stock — was adopted enthusiastically, and it worked exactly as designed: executives maximised the share price. Buybacks, layoffs, offshoring and thin staffing all raise it. So, mechanically, does holding wages down.\nThe Economic Policy Institute's series shows the result: chief executive pay at the top 350 US firms rose 1,316% between 1978 and 2025 while typical worker pay rose 28%, and the ratio reached 325 to 1 in 2025, against 21 to 1 in 1965.","mn":"Once a manager's own fortune moves with the share price, cutting your pay is not a hard decision he avoids — it is the decision he is paid to make.","pt":["p1","p8"],"sr":[["Economic Policy Institute, 'CEO pay surged in 2025' ","https://www.epi.org/blog/ceo-pay-surged-in-2025-ceos-are-paid-325-times-as-much-as-the-typical-worker/"],["Jensen & Meckling (1976), Journal of Financial Economics","https://doi.org/10.1016/0304-405X(76)90026-X"]],"i":97},{"id":"chicagoboys","n":"The Chicago Boys and Chile","t":"doct","lat":-33.5,"lon":-70.615,"pl":"Santiago, Chile","ad":"Instituto de Economía, Pontificia Universidad Católica de Chile, Avenida Vicuña Mackenna 4860, Macul, Santiago","ro":"The economics faculty, built by a US exchange programme, whose graduates rewrote a country's pensions, schools, health care and labour law under a dictatorship.","who":"Economists trained at the University of Chicago under a 1956 agreement between Chicago and the Catholic University; in government from 1975 under Augusto Pinochet.","rch":"national","mx":["supp","priv","cond"],"fg":[["Exchange programme with the University of Chicago","from 1956"],["Programme document ('El Ladrillo') completed","before the 1973 coup"],["In office","from 1975, under a government that had banned trade unions"],["Changes made","pensions, health, schooling, water rights and the labour code"]],"rd":"A faculty was built over two decades with US funding, and its graduates had a full economic programme written before the government that would implement it existed. After 1975 they held the finance and economy ministries. The pension system was replaced with individual private accounts, schooling with vouchers, water with tradable rights. The labour code was rewritten while unions were banned and their leaders were in exile, prison or dead, so none of it was negotiated.","mn":"Doctrine on its own changes nothing. What made this the most complete programme of its kind anywhere was a government that could impose it without a vote and without a union able to object. The pension system it created is still there, and the first full generation to retire under it is retiring now.","pt":["p8","p11","p15"],"sr":[["National Security Archive: Chile documentation project","https://nsarchive.gwu.edu/project/chile-documentation-project"],["Library of Congress of Chile (BCN): the 1980 pension reform, Decree Law 3,500","https://www.bcn.cl/leychile/navegar?idNorma=7147"]],"i":98},{"id":"hiid","n":"The Harvard advisers to Russian privatisation","t":"doct","lat":42.371,"lon":-71.122,"pl":"Cambridge, Massachusetts, United States","ad":"former Harvard Institute for International Development, One Eliot Street, Cambridge, MA 02138","ro":"The US-funded advisory project that helped design the transfer of Soviet state assets, and was sued by the US government over its conduct.","who":"The Harvard Institute for International Development, under contract to USAID; the institute was closed in 2000.","rch":"regional","mx":["supp","priv","conc"],"fg":[["Funder","the US Agency for International Development"],["US government suit","filed 2000 for false claims arising from the project"],["Settlement, 2005","Harvard and the individuals paid about $31 million in total"],["Outcome in Russia","state assets concentrated in a small number of hands within a decade"]],"rd":"Western advisers were embedded in the Russian privatisation agency, drafting the rules by which an entire industrial economy changed hands. The US government later sued, alleging that the project's leaders had used their positions to invest in the markets they were advising on; Harvard, Andrei Shleifer and a colleague settled in 2005 for about $31 million without admitting liability. The privatisation itself transferred mines, oil fields and metals plants into the hands of a few dozen people, and Russian wealth concentration has been at the top of international rankings ever since.","mn":"The design of a privatisation decides who ends up owning a country. Here it was drafted in part by advisers with a stake in the outcome, and the distribution it produced has lasted longer than the government that commissioned it.","pt":["p8","p15","p1"],"sr":[["Harvard Magazine: Russia case (and dust) settle — the $26.5 million settlement","https://harvardmagazine.com/2005/11/russia-case-and-dust-set.html"],["Chronicle of Higher Education: Harvard to pay $26.5 million to settle the Russia suit","https://www.chronicle.com/article/harvard-u-will-pay-26-5-million-to-settle-lawsuit-alleging-fraud-in-russia-development-program/"]],"i":99},{"id":"heritage","n":"The Heritage Foundation","t":"doct","lat":38.892,"lon":-77.003,"pl":"Washington, DC, United States","ad":"214 Massachusetts Avenue NE, Washington, DC 20002","ro":"Supplies ready-made policy and staffed personnel lists to incoming administrations.","who":"Kevin Roberts, president","rch":"national","mx":["supp","cap","trans"],"fg":[["Mandate for Leadership","first published 1981; the 2023 edition (Project 2025) ran to around 900 pages"],["1981 edition","the Reagan administration claimed to have adopted a majority of its recommendations in year one"],["Revenue","over $100 million a year"]],"rd":"Heritage's innovation was to stop writing for academics. It produces short briefs timed to votes, and every few years a complete governing programme with named candidates for the jobs. The 1981 Mandate for Leadership shaped the first Reagan budget; the 2023 edition, co-ordinated with dozens of allied organisations, covered the tax code, labour regulation, public-sector staffing and welfare administration in detail.\nFor the questions on this map — who pays tax, what work pays, which agencies enforce anything — the content matters less than the mechanism: an organisation funded by private donors arriving on day one with the legislation already drafted and the appointees already vetted.","mn":"Whoever shows up with the plan already written tends to get their plan, because governments arrive with ambitions and no text.","pt":["p3","p8"],"sr":[["Heritage Foundation, Mandate for Leadership series","https://www.heritage.org/conservatism/report/mandate-leadership-the-conservative-promise"],["Heritage Foundation IRS Form 990 filings","https://projects.propublica.org/nonprofits/organizations/237327730"]],"i":100},{"id":"laffer","n":"The Laffer curve (where it was drawn)","t":"doct","lat":38.8965,"lon":-77.0335,"pl":"Washington, DC, United States","ad":"Former Two Continents restaurant, Hotel Washington, 515 15th Street NW, Washington, DC 20004","ro":"A napkin sketch that became forty years of tax-cut justification.","who":"Arthur Laffer, with Donald Rumsfeld and Dick Cheney, 1974","rch":"global","mx":["supp","trans"],"fg":[["US top marginal income tax rate","91% in 1963; 70% in 1980; 28% by 1988; 37% today"],["Kansas, 2012–17","the deepest state-level test; revenues fell, schools were cut, and the legislature reversed the cuts over a governor's veto"],["Evidence","no consensus finding that rate cuts in this range raise revenue; CBO and Treasury analyses of the 2017 cuts found they did not pay for themselves"]],"rd":"Laffer's point is trivially true at the ends — a 0% rate and a 100% rate both raise nothing — and says nothing about where real tax rates sit. That did not matter. The sketch gave governments a respectable-sounding reason to cut top rates and promise the revenue would come back. It did not come back in the United States in 1981, in Kansas in 2012, or after the 2017 corporate cut, each of which was followed by larger deficits and pressure to cut spending.\nThe spending that gets cut is the spending that poor households depend on, which is how a tax cut for the top becomes a service cut at the bottom.","mn":"A tax cut that does not pay for itself has to be paid for by somebody, and it is usually paid for by whatever the budget can cut most quietly.","pt":["p8","p11"],"sr":[["Congressional Budget Office analyses of the 2017 Tax Cuts and Jobs Act","https://www.cbo.gov/publication/53651"],["Center on Budget and Policy Priorities, 'Kansas' tax cut experiment'","https://www.cbpp.org/research/state-budget-and-tax/kansas-provides-compelling-evidence-of-failure-of-supply-side-tax-cuts"]],"i":101},{"id":"uschamber","n":"US Chamber of Commerce (Powell Memorandum)","t":"doct","lat":38.8995,"lon":-77.038,"pl":"Washington, DC, United States","ad":"1615 H Street NW, Washington, DC 20062","ro":"The building where the plan to rebuild business political power was delivered in 1971.","who":"Lewis F. Powell Jr., two months before his nomination to the US Supreme Court; Suzanne Clark, current president and chief executive","rch":"national","mx":["supp","cap"],"fg":[["Powell Memorandum","'Attack on American Free Enterprise System', 23 August 1971, confidential memo to the Chamber"],["Lobbying","the top federal lobbying spender in most years since 2015; over $746 million in cumulative reported spending"],["2025","about $72 million in reported federal lobbying"],["Litigation","the Chamber's Institute for Legal Reform files in hundreds of cases a year"]],"rd":"Powell's memo told American business that it had surrendered the universities, the courts, the media and the textbooks to its critics, and that the answer was sustained, organised, funded counter-pressure — scholars on retainer, speakers' bureaus, litigation, and above all patience. Within a decade the Business Roundtable, Heritage, Cato, Manhattan and the state think-tank networks were operating, and the Chamber had become the largest lobbying operation in Washington.\nIts cumulative reported federal lobbying is over $746 million — more than any other single organisation — and that counts only what the law requires it to disclose.","mn":"A single memo laid out how to convert money into durable political advantage, and the people it was written for spent fifty years and billions of dollars doing it.","pt":["p3"],"sr":[["Powell Memorandum, 1971 (Washington and Lee University archive)","https://scholarlycommons.law.wlu.edu/powellmemo/"],["OpenSecrets, US Chamber of Commerce lobbying profile","https://www.opensecrets.org/federal-lobbying/clients/summary?id=D000019798"]],"i":102},{"id":"washconsensus","n":"Washington Consensus (Peterson Institute)","t":"doct","lat":38.907,"lon":-77.041,"pl":"Washington, DC, United States","ad":"1750 Massachusetts Avenue NW, Washington, DC 20036","ro":"Where the ten-point programme imposed on indebted countries was written down and named.","who":"John Williamson, 1989, at the Institute for International Economics (now the Peterson Institute)","rch":"global","mx":["supp","cond"],"fg":[["1989","Williamson's list of ten reforms he believed Washington institutions agreed on"],["The ten","fiscal discipline, spending reprioritisation, tax reform, market interest rates, competitive exchange rates, trade liberalisation, open FDI, privatisation, deregulation, secure property rights"],["Latin America","per-capita growth over 1980–2000 was far below the 1960–80 period"]],"rd":"Williamson meant to describe what Washington already believed, not to issue a manifesto, and he spent the rest of his life objecting to how the phrase was used. It did not matter. The list became the template for the conditions attached to lending across Latin America, Africa and the former Soviet bloc. Three items — fiscal discipline, privatisation, deregulation — did most of the work, and the distributional consequences were not part of the list at all.\nThe 1980s and 1990s in Latin America are sometimes called the lost decades: in several countries income per person was lower at the end than at the start, while the top decile's share rose.","mn":"A list written on one street in Washington became the terms of life for a billion people who never saw it.","pt":["p8","p11"],"sr":[["Williamson, 'What Washington Means by Policy Reform' (1990)","https://www.piie.com/commentary/speeches-papers/what-washington-means-policy-reform"],["Stiglitz, 'Globalization and Its Discontents'","https://wwnorton.com/books/9780393324396"]],"i":103}];
var PATS=[{"id":"p1","n":"Three firms vote the shares","mx":"conc","line":"Ownership concentration — savings pooled into a bloc that votes against the saver","rd":"Start with a fact that sounds technical and is not. When you pay into a pension or a retirement account, the money is handed to a fund manager, and with it goes the vote attached to those shares. Because index funds took over, three firms in New York, Malvern and Boston now hold roughly $33 trillion between them and are the largest shareholder in the great majority of the companies in the S&P 500, casting about a quarter of all the votes at their annual meetings. The same three are the largest shareholder of airlines that compete with each other, banks that compete with each other and meatpackers that compete with each other.\nThe votes they cast are on specific things: the executive pay package, the share buyback, the board slate. They almost always vote with management, and management is paid in stock, which rises when labour costs fall. So the money a bus driver in Ohio saves for retirement is voted, by somebody she will never meet, in favour of the pay structure that rewards holding her wages down.\nThe pattern is not only American. India's and Mexico's largest fortunes sit on top of companies that dominate telecoms and retail in their countries; Australia's sits on iron ore. Concentrated ownership behaves the same way everywhere — it turns the question 'what should this company do?' into 'what raises the share price?'","mn":"Your savings have been turned into a voting bloc that is used against your wages, and there is no mechanism by which you were ever asked."},{"id":"p2","n":"Profit moves, the tax bill does not","mx":"hide","line":"Profit shifting — the work happens in one country and the taxable profit in another","rd":"A company sells software in France, employs the engineers in India, and books the profit in Ireland or Luxembourg, where a licence fee paid to its own subsidiary absorbs most of the margin. Nothing physical moves. The Tax Justice Network's annual accounting puts the loss at around half a trillion dollars a year, split between corporate profit shifting and offshore private wealth, and its 2025 report found that over $475 billion in corporate tax went uncollected between 2016 and 2021 simply because the country-by-country reports that would have identified the companies were kept confidential.\nThe European Commission eventually proved one case all the way: Apple's European profits were taxed in Ireland at rates that fell as low as 0.005%, and in September 2024 the EU's highest court ordered €13 billion recovered. Ireland had spent eight years arguing against receiving the money, because the arrangement was the national growth strategy.\nThe damage is not evenly spread. Rich countries lose more in absolute dollars; poor countries lose far more as a share of what they collect, and they lose it from budgets where the marginal item is a nurse's salary. The OECD writes the rules, and when African governments moved the question to the UN in 2023, where every country votes, the resolution passed 125 to 48 — with eight of the no votes coming from countries that between them enable about 43% of the world's tax losses.","mn":"The tax that pays for your local school is calculated on a profit figure that was moved somewhere else by an accountant, legally, before anyone counted it."},{"id":"p3","n":"The gap is legislated","mx":"cap","line":"Lawmaking capture — the rules that set pay and tax are written by the people they tax","rd":"Economic inequality is often described as something that happens to a society, like weather. It is closer to a legislative record. The US federal minimum wage has been $7.25 since July 2009 — a specific decision, repeated every year by not acting. The corporate rate was cut from 35% to 21% in 2017, permanently, while the individual cuts were written to expire. Carried interest survives.\nThe machinery behind that is visible and has addresses. Lewis Powell's 1971 memo to the US Chamber of Commerce laid out the plan: fund scholars, build institutes, litigate, be patient. The Chamber is now the largest lobbying spender in Washington with over $746 million in cumulative reported spending. ALEC, in Arlington, drafts model state bills with corporate members in the room and about two hundred become law each year — right-to-work statutes, bans on cities raising their own minimum wage, caps on liability. Atlas Network supplies the same arguments to about 500 local think tanks in 100 countries, so that in Lima or Lagos they arrive as local opinion.\nMartin Gilens and Benjamin Page tested this against nearly 1,800 American policy questions and found that where affluent preferences and business groups diverge from the median voter's, the median voter has close to no measurable influence. And where this fails, there is a backstop: a company can sue a government at ICSID in Washington for passing a law it dislikes, which means many governments never pass it.","mn":"Nothing about the distribution is natural; every piece of it has a bill number, a sponsor and a vote you can look up."},{"id":"p4","n":"Creditors are paid first","mx":"cred","line":"Debt and creditor power — interest has priority over clinics, schools and pensions","rd":"When a country cannot pay everything, the order matters more than the amount, and the order is almost always bondholders first. Argentina defaulted in 2001; 93% of creditors accepted a restructuring; one fund in New York refused, spent fifteen years in court, had an Argentine naval ship impounded in Ghana, and walked away in 2016 with about $2.4 billion in profit on bonds bought at a fraction of face value. The lesson taken by every finance ministry was that a restructuring can be defeated by a single holdout, which makes future rescues dearer and slower.\nThe discipline arrives earlier than any courtroom. Three private rating agencies in New York set what a government pays to borrow, so finance ministers cut budgets pre-emptively to protect a grade. In Europe the European Central Bank sat on both sides of the table — central bank to the countries it was negotiating with, and creditor — and in 2015 capped the emergency liquidity keeping Greek cash machines running during a referendum.\nAnd some debts were never loans at all. Haiti paid France for the crime of having freed itself: 150 million francs demanded in 1825 under the guns of French warships, borrowed from French banks to pay French planters, roughly 112 million francs paid across seven decades, with the last related interest settled to a New York bank in 1947.","mn":"A country's budget has a queue, and the people who hold its bonds are always in front of the people who use its hospitals."},{"id":"p5","n":"The floor is set in the purchase order","mx":"floor","line":"Supply-chain squeeze — the wage is decided by the buyer, not the employer","rd":"A garment worker in Gazipur earns the Bangladeshi minimum of 12,500 taka a month, about $101, set in December 2023 and worth less every month since as inflation runs above 8%. She does not work for H&M, Zara, Gap, Primark or Walmart; she works for a factory that supplies them. In November 2026 she and thousands of others blocked roads in Dhaka asking for 30,000 taka, and Reuters found workers cutting back on food and medicine. The brands sign living-wage commitments and place orders at prices calculated on the legal minimum, and the wage board that sets that minimum knows the orders can move to Vietnam.\nThe same shape appears wherever a few buyers meet many sellers. A cocoa farmer in Côte d'Ivoire receives something like 6–8% of what the finished chocolate bar sells for; the Ivorian farmgate price was cut to 1,200 CFA francs a kilo in 2026 against Fairtrade's calculation of 1,758 as a living income. Foxconn's margins on an iPhone are thin because the purchase order says so, and what absorbs the pressure is overtime and the pace of the line. Palm oil, coffee, bananas, seafood, cobalt: all the same geometry.\nAnd in the rich countries the squeeze runs on the same logic internally — Walmart was in the top four employers of food-stamp and Medicaid recipients in all fifteen US state agencies the Government Accountability Office asked, with about 70% of those workers employed full time.","mn":"Nobody in the chain has to decide to pay you badly; the price was fixed several companies above your employer, and your wage is what is left."},{"id":"p6","n":"Shelter as an asset class","mx":"rent","line":"Housing financialisation — the main asset of ordinary families becomes somebody's yield","rd":"For most households that own anything, the thing they own is a home, and the rent they pay if they do not own one is their largest monthly cost. That makes housing the single most powerful lever on the distribution of wealth, and over the last twenty years it has been pulled hard.\nAfter the 2008 crash, Blackstone bought foreclosed American family houses in bulk and rented them back; the vehicle became the country's largest single-family landlord, and in March 2019 the UN Special Rapporteur on housing wrote to Stephen Schwarzman saying the model was pushing low- and middle-income people out of their homes. German cities sold their public housing in the 2000s — Dresden all of it, Berlin around 200,000 units — and the buyers consolidated into Vonovia; Berlin rents roughly doubled, and when 59.1% of Berliners voted in 2021 to socialise large landlords' holdings, the result was not implemented.\nBehind both sits a rule almost nobody has heard of. The Basel capital standards, written by central bankers in Switzerland, make lending against existing property cheap for a bank to hold and lending to a new business expensive. So credit flows to bidding up the houses that exist rather than building more, and the price of shelter rises faster than wages in almost every rich country at once.","mn":"When houses are priced as investments rather than as places to live, the gap between people who own one and people who rent one widens every single year by itself."},{"id":"p7","n":"Leaving is what gets taken away","mx":"tied","line":"Immobility and coercion — every protection on paper depends on being able to walk out","rd":"A wage is only negotiated if the worker can refuse. Most of the deepest inequality in the world is produced by removing that one ability, usually by law.\nIn Qatar, Saudi Arabia and the UAE, kafala attaches a worker's right to be in the country to the employer. Qatar removed exit permits and job-change certificates and set a minimum wage; Human Rights Watch still documented contractors on Qatari state projects leaving labourers unpaid for months in December 2025, and in Mecca in November 2025 found at least 600 workers unpaid for eight months, eleven of them detained for protesting. Saudi authorities meanwhile reduced the fines for wage theft. FIFA awarded the 2034 World Cup to Saudi Arabia anyway.\nThe design recurs in different legal clothes. China's hukou leaves a migrant worker's children, schooling and pension registered in the village they left, so around 300 million people work where they have no rights. American H-2A visas are issued to the employer. Nine-tenths of world trade moves on ships flagged in Panama or Liberia, which decides which labour law applies to a Filipino crew. In the United States the Thirteenth Amendment's exception for punishment lets roughly 800,000 incarcerated people work for cents an hour, on a former plantation in Louisiana among other places. Japan simply built a second category of worker beside the protected one — about 37% of employees. And in the US, right-to-work laws and the Janus ruling attack the same capacity collectively: union density has fallen from a third of workers to about one in ten.","mn":"Ask of any labour arrangement one question — what happens to this person if they walk out today? The answer is their real wage."},{"id":"p8","n":"The doctrine arrived before the policy","mx":"supp","line":"Idea factories — the arguments were written and funded decades before they were enacted","rd":"In April 1947 thirty-nine people met at a hotel above Lake Geneva at Hayek's invitation, convinced that planning, strong unions and progressive taxation led to tyranny. They were politically irrelevant for thirty years, and they were funded anyway — journals, institutes, chairs, prizes, a trained cadre. When stagflation hit in the 1970s and governments went looking for another theory, this one was the only complete alternative on the shelf.\nIt arrived first where nobody could vote on it. From 1956 the University of Chicago trained Chilean economists; days after the 1973 coup they handed the junta a finished programme, and by 1981 Chile had replaced its state pension with private individual accounts — a model then copied by Peru, Mexico, Colombia, Poland and Hungary, and reformed in Chile itself in 2025 after a decade of mass protest. John Williamson wrote the ten points down in Washington in 1989 and the list became the conditions attached to lending across Latin America, Africa and the former Soviet bloc. Michael Jensen's agency theory redefined a company as something owed entirely to its shareholders, and once executives were paid in stock, chief executive pay rose 1,316% between 1978 and 2025 while typical worker pay rose 28%.\nThe infrastructure is still running and has addresses in Arlington, Washington, London and Fairfax. Atlas Network alone supplies about 500 think tanks in 100 countries.","mn":"The policies that widened the gap were not discoveries; they were a position that lost for thirty years, kept funded until a crisis made someone reach for it."},{"id":"p9","n":"The bill for having been conquered","mx":"excl","line":"Colonial and extractive legacies — debts, borders and contracts written by the people who took the place","rd":"Some countries are poor for reasons with dates and signatures. Haiti was made to pay France 150 million francs in 1825 for recognition of the independence it had already won, borrowing from French banks to pay French planters; the New York Times' reconstruction found 112 million francs actually paid over seven decades and estimated the cost in forgone growth at around $115 billion. Fourteen African countries kept half their foreign reserves in an account at the French Treasury until reforms in 2019–21.\nThe contracts outlive the empires. Grasberg, one of the largest gold deposits on earth, was signed over in 1967 on Amungme and Kamoro land in West Papua, and the provinces around it are the poorest in Indonesia. Shell has pumped oil from the Niger Delta since 1958; UNEP's survey of Ogoniland found benzene in drinking water at hundreds of times the WHO guideline and a clean-up that would take a generation, and Nigeria's oil-producing states remain among its poorest. Brazil's 1850 Land Law made land purchasable in cash exactly as slavery was ending, which guaranteed the people being freed could not buy any; the top 1% of holdings still occupy nearly half the farmland. South Africa abolished the pass laws in the 1990s and kept the geography — and the richest 1% now hold nearly 55% of national wealth, more than in 1994.\nAnd the extraction continues in the present tense: Glencore was fined over $1.1 billion in the US and £281 million in London in 2022 for bribery that got it cheaper African oil.","mn":"A great deal of today's inequality between countries was set by specific documents signed by people who had just won a war, and nothing since has undone them."},{"id":"p10","n":"Secrecy decides who can be taxed","mx":"hide","line":"Havens, trusts and registries — a fortune that cannot be found cannot be taxed","rd":"A tax rate is a number; whether it is paid depends on whether the asset can be located. Switzerland made disclosure of a client's identity a criminal offence in 1934 and built an industry on it. Automatic information exchange since 2017 changed that for residents of participating countries and changed nothing for residents of the countries not in the system — which include most of the poorest.\nThe network has moved onshore. 1209 North Orange Street in Wilmington, Delaware is the registered address of hundreds of thousands of companies. Ugland House in George Town, Cayman, holds thousands more. And in 1983 South Dakota deleted the rule against perpetuities, so a trust in Sioux Falls can hold wealth indefinitely, tax-free at state level, with its court records sealed forever. Assets in South Dakota trusts rose from $57 billion to about $360 billion in a decade, and the Pandora Papers found 81 of its trusts holding money linked to families accused of fraud, bribery and the abuse of sugar-cane workers, alongside American dynasties. The laws were drafted by an industry task force and passed, year after year, by a legislature answerable to 900,000 people.\nThe United Kingdom is the keystone: its Crown Dependencies and Overseas Territories together account for roughly 23% of global corporate tax losses, and could be changed by Order in Council. In 2025 the United States narrowed its own beneficial-ownership registry to exclude domestic companies.","mn":"Any tax on wealth works only if someone can see the wealth, and an entire industry exists to make sure nobody can."},{"id":"p11","n":"Austerity arrives as a condition","mx":"cond","line":"Conditionality — a rescue loan that requires cutting the things poor households depend on","rd":"When a country runs out of foreign currency the IMF is usually the only lender left, and the loan has terms. Oxfam's 2026 analysis of 161 loans to 81 countries found that of 28 countries with ongoing programmes, 24 were required to implement austerity, and that the cuts demanded in loans since 2018 have been about five times deeper than in the six years before — a median consolidation of 1.7% of GDP against 0.3%.\nThe terms are specific and they land on specific people. ActionAid examined IMF documents for ten African countries and found eight recently told to cut or freeze the public-sector wage bill, which in practice means not hiring nurses and teachers; across fifteen countries it calculated that wage-bill constraints had blocked more than three million such posts. Subsidy removal raises the price of fuel and bread for households that have no alternative — Nigeria removed its fuel subsidy in 2023 and inflation went past 30%. VAT increases take a larger share of a poor household's spending than a rich one's.\nEurope got the same medicine from its own institutions: the Commission, the ECB and the IMF cut Greek pensions and public wages while bondholders were paid in full, and Greek output fell by a quarter. The one group almost never asked to contribute is the one with the most — wealth taxes, capital gains and enforcement against high earners appear in these programmes far less often than fuel prices and nurses' pay.","mn":"The conditions on a loan decide who pays for a crisis, and they have almost always chosen the nurse over the bondholder."},{"id":"p12","n":"Wealth that never has to pass","mx":"trans","line":"Dynasty — structures that carry a fortune across generations without a taxable moment","rd":"Income inequality in a single year is unpleasant. Inequality that compounds across generations is a different kind of society, and the instruments for producing it are mostly quiet legal ones.\nInheritance tax only bites when wealth passes from one person to another. A perpetual trust — legal in South Dakota since 1983 and copied by several US states — means it never passes, because the trust itself is the owner, forever. Singapore abolished estate duty in 2008 and has pulled in over a thousand single family offices in under a decade. Family holding-company chains, like the one through which Bernard Arnault's children hold LVMH, keep control intact while the underlying shares are never sold, and an asset that is never sold is never taxed as income — which is how ProPublica's leaked IRS files showed several of the richest Americans paying no federal income tax in particular years, legally.\nThe other half of the inheritance is land and position. Brazil's top 1% of holdings occupy nearly half its farmland; the EU's farm subsidies pay per hectare, so roughly 80% of the money goes to about 20% of recipients; India's caste system still predicts who does sanitation work; South Africa's townships are still an hour from the jobs. And debt inherits too — the student who graduates owing $40,000 is the one whose parents could not pay, on the same degree.\nThe World Inequality Report 2026 states the result: fewer than 60,000 people in the top 0.001% own three times the wealth of the poorest half of humanity, and in almost every region the top 1% hold more than the bottom 90% combined.","mn":"If wealth never has a taxable moment and land never changes hands, then where your grandchildren start is decided today — and it has already been decided."},{"id":"p13","n":"The title was written by the conqueror and never rewritten","mx":"disp","line":"Dispossession — land taken under an old law, still held under the new one","rd":"Almost every large inequality of land in the world today was produced by a law that has since been repealed. South Africa's Natives Land Act of 1913 confined African ownership to about 7% of the country; it went in 1991, and the state's own 2017 audit still found white individuals holding 22% of all land and 72% of individually owned farmland. The US General Allotment Act of 1887 cut tribal holdings from 138 million acres to 48 million in under fifty years; allotment ended in 1934, and the 90 million acres did not come back. Canada's Indian Act of 1876 is still in force, and reserve land still cannot be mortgaged, because the Crown holds the title.\nRepeal does not reverse. A family removed from land does not merely lose that year's harvest; it loses the asset its children would have inherited, the collateral they would have borrowed against and the address that would have decided their school. Restitution programmes exist in several of these countries and move slowly: the Philippine agrarian reform law of 1988 permitted landowners to hand out company shares instead of land, and the courts took until 2012 to order one 4,900-hectare estate divided.\nThe same shape appears where the dispossession is recent and commercial rather than colonial: plantation concessions over customary land in Indonesia, cattle and soy frontiers in Brazil, mining leases over West Papua.","mn":"Land that was taken stays taken unless somebody actively gives it back. That is why a law abolished thirty or a hundred years ago still decides who owns a country."},{"id":"p14","n":"Status at birth sets the wage","mx":"excl","line":"Tied status — a legal category, inherited or stamped on arrival, that fixes what a person can earn","rd":"In several large labour markets, what you are paid is decided less by what you do than by which legal category you were born into or admitted under.\nChina's hukou registration, inherited from a parent, determines where a family can access schooling and health care; roughly 300 million people work in cities where their children cannot fully enrol. India's informal sector covers the great majority of workers, with no written contract, and caste still predicts who does the most dangerous and worst-paid work. Under kafala in the Gulf, a worker's residence is tied to one employer, so leaving is deportation. Japan's technical interns, about 456,000 of them, cannot change employers, whatever the employer does. In Mauritania, descent-based slavery passes down the maternal line, and anti-slavery organisations estimate that up to 500,000 Haratine are still enslaved or under a former master's control.\nThe United States has its own version in two forms: an employer-tied agricultural visa, and the Thirteenth Amendment's exception clause, which permits involuntary servitude as punishment for a crime.\nIn each case the employer knows the worker cannot leave, and sets the wage accordingly. That is the whole mechanism. The wage is not the result of a negotiation, because there is no negotiation available.","mn":"Where the law decides what category you are in, your wage is set before you turn up to work — and your children start in the same category."},{"id":"p15","n":"The public asset is sold once and rented back forever","mx":"priv","line":"Privatisation — a one-off sale of something collective, followed by a permanent charge for its use","rd":"A privatisation is a single transaction and a permanent flow. Britain sold more than two million council homes at an average discount of 44%; the stock of social housing fell from 6.8 million to 5.2 million, and about two in five of the homes sold are now let by private landlords, frequently to tenants whose rent is paid by the state. The first buyers gained a real asset. Everyone who came after pays rent on it.\nChile replaced its state pension with individual private accounts in 1980, under a government that had banned trade unions, and the first full generation to retire under that system is retiring now on replacement rates well below what was promised. Russia's privatisation, designed with Western advisers, moved an industrial economy into a few dozen hands in under a decade. Germany's largest landlord, Vonovia, was assembled out of former public and company housing. Chicago demolished about 18,000 public housing units and issued vouchers; most of the displaced residents did not return.\nThe pattern holds because the sale is justified by the condition of the asset, and the condition of the asset was produced by the owner that is selling it.","mn":"Once something collective has been sold, using it costs money forever, and buying it back costs more than it was sold for."}];
var GLOSS={"inheritance tax":"A tax on what a person leaves behind when they die, paid before the estate reaches the heirs.","death duty":"An older name for inheritance tax: a charge on an estate when its owner dies.","estate duty":"A tax on the total value of what someone leaves at death.","periodic charge":"A smaller tax a trust pays every ten years, instead of the one-off charge an estate pays at death.","dynasty trust":"A trust designed to hold a family's wealth for many generations, so it is never inherited and never taxed as an inheritance.","perpetual trust":"A trust with no end date, so the wealth inside it never has to pass to anybody.","trusts":"Legal arrangements where trustees hold property for named beneficiaries, so no one person owns it outright.","trust":"A legal arrangement where one party holds property for the benefit of others, so no single person owns it outright.","foundation":"An entity that holds assets for a stated purpose and has no owner or shareholders.","step-up in basis":"A US rule that resets an inherited asset's purchase price to its value at the owner's death, erasing the gain for tax.","cost base":"The price originally paid for an asset, used to work out the taxable gain when it is sold.","capital gains":"The profit made when an asset is sold for more than it cost.","unrealised gains":"Increases in the value of something you still own; untaxed in most countries until you sell.","tax expenditure":"Money a government gives up by granting an exemption or relief, counted as if it were spending.","agricultural property relief":"A UK rule that removes farmland from inheritance tax.","business property relief":"A UK rule that removes private company shares and business assets from inheritance tax.","nil-rate band":"The slice of an estate that passes free of UK inheritance tax before the charge begins.","family office":"A private firm that manages the money of a single wealthy family.","holding company":"A company whose purpose is to own shares in other companies rather than trade itself.","primogeniture":"The rule that the eldest child, historically the eldest son, inherits the whole estate.","index fund":"A fund that buys every company in a market index rather than picking shares, so it ends up owning a slice of almost everything.","asset manager":"A firm that invests other people's money, such as pension savings, and votes the shares it buys.","assets under management":"The total value of the money a firm invests on other people's behalf.","share buyback":"A company buying its own shares back, which raises the price of the remaining ones.","shareholder primacy":"The doctrine that a company's only duty is to make money for its shareholders.","fiduciary duty":"A legal duty to act in someone else's financial interest rather than your own.","sovereign wealth fund":"A state-owned investment fund, usually built from oil or export earnings.","private equity":"Firms that buy whole companies with borrowed money, restructure them and sell them on.","single-family rental":"An ordinary house, of the kind families used to buy, owned by a company and rented out.","securitisation":"Bundling loans or rents and selling the income stream to investors as a bond.","foreclosure":"A lender taking a house because the mortgage has not been paid.","collateral":"Property a lender can seize if a loan is not repaid.","mortgage insurance":"Government or private cover that pays the lender if a borrower defaults, which is what makes long, low-deposit mortgages possible.","market capitalisation":"The stock market's price for a whole company: share price times number of shares.","redlining":"Refusing loans or insurance in a neighbourhood because of who lives there, named after the red lines drawn on lending maps.","racial covenant":"A clause in a property deed forbidding sale or rental to people of a named race.","allotment":"The US policy of cutting tribal land into individual parcels and selling the rest as surplus.","fractionated title":"Ownership split among so many inherited shares that no one can use, sell or mortgage the land.","trust land":"Land whose legal title is held by a government for the benefit of its occupants, who cannot sell or mortgage it.","customary land":"Land held under community rules recognised locally but often not registered in any state system.","land audit":"A government count of who owns the land in a country.","restitution":"Returning property to the people it was taken from, or paying them its value.","expropriation":"A state taking private property, with or without compensation.","sharecropping":"Farming someone else's land for a share of the crop rather than a wage.","enclosure":"The legal conversion of land held in common into private property.","dunam":"A unit of land used across the Middle East, about a tenth of a hectare.","hectare":"Ten thousand square metres, about two and a half acres.","concession":"A government grant of the right to use land or resources, usually to a company, for a set period.","absentee property":"Property declared to belong to owners who are absent, and transferred to a state custodian.","farmgate price":"The price a farmer is actually paid at the farm, before anything downstream is added.","living income":"The income a household needs for a decent standard of living, calculated for a specific place.","monopsony":"A market with one buyer or very few, so sellers, including workers, have no alternative to go to.","piece rate":"Pay per item produced rather than per hour worked.","wage floor":"The lowest wage anyone in a market is paid, set by law or by the largest employer.","preemption":"A state law that forbids cities from setting their own rules, such as a higher local minimum wage.","right-to-work":"US laws that stop a union contract from requiring all covered workers to pay for representation.","collective bargaining":"Workers negotiating pay and conditions together through a union rather than one by one.","informal sector":"Work with no contract, no registration and no legal protection.","caste":"A hereditary social rank, fixed at birth, that in practice still shapes work and marriage in parts of South Asia.","hukou":"China's household registration, inherited from a parent, which ties schooling and health care to a place.","kafala":"The Gulf sponsorship system that ties a migrant worker's legal residence to one employer.","tied visa":"A work permit valid only for one named employer, so leaving the job means leaving the country.","debt bondage":"Being held in work to pay off a debt that the work never clears.","descent-based slavery":"Slavery in which status passes down a family line, usually through the mother.","convict leasing":"The practice of hiring out prisoners to private employers, used widely in the US South after 1865.","involuntary servitude":"Being forced to work for another person against your will.","flag of convenience":"Registering a ship in a country with light rules, so its labour and safety law applies instead of the owner's.","non-regular work":"Jobs classed as temporary or part-time, carrying lower pay and fewer rights than permanent ones.","pari passu":"A bond clause requiring all holders to be treated equally, used by holdout creditors to block a restructuring.","vulture fund":"An investor that buys distressed government debt cheaply and sues for the full amount.","odious debt":"Debt argued to be unenforceable because it was imposed on a population by force or against its interests.","indemnity":"A payment demanded as compensation, here from a former colony to its former ruler.","conditionality":"The policy changes a lender requires before it will release money.","structural adjustment":"The package of cuts, privatisations and deregulation lenders required of indebted countries, mainly from the 1980s.","austerity":"Cutting public spending to reduce a deficit or satisfy a lender.","plan of adjustment":"The court-approved settlement that sets who gets paid what in a public bankruptcy.","non-dischargeable":"A debt that bankruptcy will not cancel.","undue hardship":"The high legal test a US borrower must meet to have a student loan cancelled in bankruptcy.","garnishment":"Taking money directly from someone's wages or benefits to pay a debt.","creditor priority":"The rule that decides whose claim gets paid first when there is not enough to go round.","debt service":"The interest and principal a government or household must pay each year on what it owes.","sovereign debt":"Money borrowed by a government.","replacement rate":"A pension expressed as a share of what the person used to earn.","defined contribution":"A pension that pays out only what the individual's own savings and investment returns produced, with no guaranteed amount.","voucher":"A payment given to an individual to buy a service privately, instead of the state providing it.","means test":"A check on income or savings to decide whether someone qualifies for support.","user fee":"A charge for a public service such as a clinic or a school.","privatisation":"Selling a publicly owned asset or service into private hands.","social housing":"Housing let at below-market rents by a council or non-profit landlord.","property tax":"A tax on the value of land and buildings, which in the US funds local schools.","transfer pricing":"The prices a company charges its own subsidiaries, which decide where its profit appears.","profit shifting":"Moving recorded profit into a low-tax country while the work stays elsewhere.","base erosion":"The shrinking of a country's taxable profits as companies move them offshore.","double irish":"A structure using two Irish companies to route profits to a tax haven, closed to new users in 2015.","participation exemption":"A rule exempting dividends received from foreign subsidiaries, which makes a country useful as a conduit.","withholding tax":"Tax deducted at source when money is paid abroad.","beneficial owner":"The real person who ultimately owns
