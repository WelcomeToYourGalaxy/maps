or controls a company, as opposed to the name on the register.","shell company":"A company with no staff or operations, used to hold assets or move money.","registered agent":"A firm that provides a legal address for companies, so thousands can share one building.","secrecy jurisdiction":"A place that sells the legal means to keep ownership and income hidden from other countries.","nominee":"A person or firm named as owner or director in place of the real one.","freeport":"A warehouse where goods count as in transit, so no import tax falls due however long they stay.","bearer asset":"Something that belongs to whoever holds it, with no register of ownership.","automatic exchange of account information":"The system under which banks report foreign-held accounts to the account holder's own tax authority.","financial secrecy index":"The Tax Justice Network's ranking of how much secrecy each jurisdiction supplies.","gini":"A single number from 0 to 1 summarising how unequally income or wealth is spread.","decile":"One tenth of a population, ranked from poorest to richest.","public choice":"A school of economics that treats officials and voters as self-interested, used to argue for limiting government.","neoliberal":"The policy programme of privatisation, deregulation, low taxes on capital and weakened unions.","think tank":"A funded research organisation that produces policy arguments.","model bill":"Draft legislation written outside a legislature and handed to members to introduce as their own.","investor-state arbitration":"Private tribunals where a foreign investor can sue a government over a law that cost it money.","isds":"Investor-state dispute settlement: the treaty system letting companies sue governments in private tribunals.","laffer curve":"The claim, drawn as a curve, that cutting tax rates can raise revenue.","index funds":"Funds that buy every company in a market index, so they end up owning a slice of almost everything.","aladdin":"BlackRock's risk-analysis software, rented by other investors to monitor their own portfolios.","icsid":"The World Bank's arbitration centre, where foreign investors sue governments.","country-by-country":"Reporting that shows where a multinational books its profit, staff and tax, country by country.","sponsorship":"The requirement that a migrant worker be held on an employer's permit to remain lawfully in the country.","deportation":"Removal from a country by the state.","wage theft":"Not paying wages that are legally owed, by withholding overtime, deductions, or final pay.","buyback":"A company buying its own shares, which raises the price of the ones left.","buybacks":"Companies buying their own shares, which raises the price of the ones left.","cost of capital":"What it costs a buyer to raise the money for a purchase; large investors pay far less than households.","state aid":"Government support to a company, restricted under EU law because it distorts competition.","rule against perpetuities":"The old common-law rule that a trust must eventually end, repealed in several US states.","leveraged buyout":"Buying a company mostly with borrowed money, then loading the debt onto the company itself.","holdout":"A creditor that refuses a restructuring deal and sues for the full amount instead.","deregulation":"Removing rules that constrain what a business may do.","tax haven":"A place that offers low or no tax, and often secrecy, to money earned elsewhere.","net worth":"Everything a person owns minus everything they owe.","hedge fund":"A lightly regulated fund for wealthy and institutional investors, free to use debt and derivatives.","bank secrecy":"Laws making it a crime for a bank to tell another country's tax authority about an account.","liberalisation":"Opening a market to private and foreign competition by removing restrictions.","regressive":"A tax or charge that takes a larger share of a poor person's income than a rich person's.","dynasty":"A family that holds wealth or power across generations.","restructuring":"Rewriting the terms of a debt that cannot be paid as agreed.","default":"Failing to make a payment a debt contract requires.","monopoly":"A market with one seller, which can therefore set the price.","franchise":"Here, the right to run a business under another company's name and rules; also a state's revenue from company registrations.","informal":"Work or housing with no contract, registration or legal protection.","union":"An organisation of workers that bargains collectively with an employer.","unions":"Organisations of workers that bargain collectively with employers.","lobbying":"Paid, organised persuasion of lawmakers and officials.","minimum wage":"The lowest hourly or monthly pay an employer may lawfully give.","offshore":"Held in another country, usually one chosen for its secrecy or low tax.","secrecy":"Rules that stop other countries' authorities from finding out who owns what.","income tax":"A tax on money earned from work or investments.","visa":"Permission to enter or work in a country, often tied to one employer.","subsidy":"A government payment that supports a price, an industry or a landowner.","royalties":"Payments to the owner of land or a resource for the right to extract it.","tribunal":"A panel that decides disputes outside the ordinary courts.","withholding":"Deducting money at source, from a wage or a payment abroad, before it reaches the recipient.","right to buy":"The UK policy giving council tenants the right to buy their home at a discount.","farmgate":"At the farm itself: the price a grower is actually paid, before anything downstream is added.","fractionated":"Split by inheritance into many tiny shares, so the land cannot be used or sold.","pension":"Income paid after retirement, either guaranteed by an employer or state, or drawn from a pot of savings."};
var ABOUT="\n<h1>About this map<\/h1>\n<p>Economic inequality is usually described the way weather is described &mdash; as something that happens, with trends and forecasts and nobody to call. This map takes the opposite view. It treats the gap between the richest and the rest as the sum of decisions that have authors, dates, documents and street addresses, and it puts those addresses on a globe.<\/p>\n<p>There are 104 entries, grouped by the mechanism each one works through rather than by what kind of organisation it is. A bank, a ministry, a university faculty and a prison can appear in the same group, because what they have in common is how they move advantage from one generation to the next.<\/p>\n\n<h2>The test an entry has to pass<\/h2>\n<p>Being large, profitable or unpleasant is not enough to be here, and a great many well-known companies are therefore absent. To earn a place, an entity has to do one of four things:<\/p>\n<ul>\n<li><b>Carry wealth across a death<\/b> without a taxable moment &mdash; a trust, a foundation, a holding company, a relief written into a tax code.<\/li>\n<li><b>Hold or withhold land<\/b> that was taken, or that cannot be owned by the people who live on it, so the loss is inherited.<\/li>\n<li><b>Fix a person's legal status<\/b> at birth, at a border or by sentence, in a way that decides what they can earn and whether they may leave.<\/li>\n<li><b>Write or enforce the rule<\/b> that does one of the above &mdash; the doctrine, the statute, the loan condition, the court decision, the registry.<\/li>\n<\/ul>\n<p>A firm that pays badly but whose workers can quit, a monopoly that charges too much, a polluter: these produce hardship, and they are not what this map is about. The question asked of every entry is narrower &mdash; does this make the position of one generation the starting position of the next?<\/p>\n\n<h2>How to read it<\/h2>\n<ul>\n<li><b>Colour<\/b> is the mechanism family: inheritance, land, debt, labour binding, secrecy, public goods, ownership, doctrine. The colours change with the basemap, because each basemap has its own set drawn from its own tones.<\/li>\n<li><b>Dot size<\/b> is reach: worldwide, regional, or one country.<\/li>\n<li><b>How it is done<\/b>, in the left panel, filters by the specific mechanism &mdash; transmission at death, dispossession, creditor priority, conditionality, tied status, the wage floor, secrecy, rent, privatisation, exclusion by birth, lawmaking capture, ownership concentration, doctrine supply.<\/li>\n<li><b>Patterns behind the scenes<\/b>, bottom left, is the part worth reading first: 15 write-ups of how the machinery fits together, each one filtering the map to the entries involved.<\/li>\n<li><b>Underlined words<\/b> have a definition attached. Hover over one, or tap it on a phone.<\/li>\n<li><b>Basemap<\/b>, top right, switches between the five maps &mdash; Jurassic, Atlas, Bioluminescent, Hell and Standard.<\/li>\n<li><b>Download this list (CSV)<\/b> exports whatever you have filtered to, with names and addresses, as a spreadsheet.<\/li>\n<\/ul>\n\n<h2>The rule about addresses<\/h2>\n<p class=\"warn\">Every address here is a registered office, a headquarters, a ministry, a campus or an official premises &mdash; the place that answers for the decision. There are no private homes on this map and there never will be. This is not squeamishness. A corporate headquarters is where the decision is made, where the registered agent accepts service of legal papers, where a shareholder meeting happens, where a picket is lawful and a journalist can ask a question. A private residence is where somebody's children live, and going there converts a case about a policy into a case about harassment &mdash; which is the fastest way to lose the argument and hand the other side the story.<\/p>\n<p>For the same reason, individuals appear in their official role at their institution, with conduct that is documented and sourced.<\/p>\n\n<h2>What is covered, and what is not<\/h2>\n<p>The map follows the facets of economic inequality set out in the suppression section of this site: income and wealth inequality, inequality of opportunity and access to lawmakers, consumption and purchasing power, access to credit, social immobility, regional and spatial inequality, gender and racial economic inequality, and access to public services. It reads all of them through one question: what is transmitted.<\/p>\n<p>It does not rank the entries against each other. There is no score claiming an index fund is 1.4 times worse than a land act, because no honest measure gives you that number. What the map offers instead is the mechanism in each case, so you can judge the weight yourself.<\/p>\n<p>Coverage is uneven, and it is uneven in a direction worth naming. The documentation is best where the press is free, the courts publish, and researchers can work &mdash; so the United States, the United Kingdom and the European Union are heavily represented, partly because that is where the money is concentrated and partly because that is where the records are. China, Russia, the Gulf states and much of Central Asia are under-represented relative to what is almost certainly happening there, because far less of it can be sourced to a document.<\/p>\n\n<h2>What this map is for<\/h2>\n<p>Three practical uses. First, a name and an address: who to write to, where to file, where to stand, which annual meeting to attend, which minister's department actually holds the file. Second, the figures with their sources attached, so an argument can be made without anyone having to take your word for it. Third, the patterns &mdash; so that a campaign against one landlord, one tax ruling or one wage board can be made legible as part of something larger, which is usually what turns a local fight into a movement.<\/p>\n<p>Nothing here is inevitable, and the map itself is the evidence. Chile replaced its private pension system in 2025 after a decade of protest. The European Court ordered Ireland to collect &euro;13 billion from Apple in 2024 after eight years of appeals. The United Kingdom capped agricultural and business property relief from April 2026, after forty years in which farmland passed untaxed. Over 300 cities have taken their water systems back. Michigan repealed its right-to-work law in 2024. Berlin voted 59% to socialise its largest landlords &mdash; and that one has not been honoured yet, which tells you both things at once: these arrangements can be reversed, and they do not reverse themselves.<\/p>\n";
var METHOD="\n<h1>Method and sources<\/h1>\n<p>Last built 18 November 2026. 104 entries, 15 patterns, grouped by mechanism.<\/p>\n\n<h2>How an entry gets on the map<\/h2>\n<p>An entry has to meet four tests. It must work through a mechanism that transmits advantage or disadvantage between generations, stated in a sentence. The mechanism must be documented, not inferred. It must have a verifiable location that is an official premises. And every figure attached to it must come from a source that can be linked and checked: a court judgment, a regulator's order, a company filing, a statistical agency, a parliamentary inquiry, a peer-reviewed study, or an investigation by a named organisation.<\/p>\n<p>The generational test is what decides most of the inclusions and all of the exclusions. Large employers with low pay, dominant platforms, high-margin monopolies and heavy polluters were considered and left off unless something in the arrangement reaches the next generation. Where a company is here, it is for a specific reason: a dynastic holding structure, a price set for a million smallholders, a portfolio of houses that will not return to owner-occupation.<\/p>\n<p>Nothing on this map is inferred, estimated or filled in. Where an allegation is contested, it is marked as contested and the denial is stated. Where a figure moves &mdash; a market valuation, a net worth, an exchange rate &mdash; the date is given with it. If a claim could not be sourced, it is not here, even where there is little doubt about it.<\/p>\n\n<h2>What the categories mean<\/h2>\n<table>\n<tr><th>Category<\/th><th>What it holds<\/th><th>Entries<\/th><\/tr>\n<tr><td>Inheritance and dynastic machinery<\/td><td>Trusts, foundations, holding companies and tax reliefs that carry a fortune to the next generation without a taxable moment.<\/td><td>13<\/td><\/tr>\n<tr><td>Land and dispossession<\/td><td>Land taken, titled or withheld under law, and the bodies that set what the people working it are paid.<\/td><td>14<\/td><\/tr>\n<tr><td>Debt, indemnity and conditionality<\/td><td>Lenders, courts and treasuries that decide whose claim is paid first and what must be cut to pay it.<\/td><td>17<\/td><\/tr>\n<tr><td>Labour binding<\/td><td>Legal statuses &mdash; inherited, stamped on arrival or imposed by sentence &mdash; that remove a worker's ability to leave.<\/td><td>13<\/td><\/tr>\n<tr><td>Secrecy and tax architecture<\/td><td>Registries, havens and professional firms that decide which fortunes can be found and taxed.<\/td><td>15<\/td><\/tr>\n<tr><td>Public goods withdrawn<\/td><td>Pensions, housing, schooling and services moved out of collective hands, or funded by the wealth of the surrounding streets.<\/td><td>5<\/td><\/tr>\n<tr><td>Concentrated ownership<\/td><td>Holders large enough that their decision is the market's decision, in shares, housing and land.<\/td><td>11<\/td><\/tr>\n<tr><td>Doctrine and rule-writing<\/td><td>Where the argument was written, funded and kept until a government was in a position to use it.<\/td><td>16<\/td><\/tr>\n<\/table>\n\n<h2>Definitions<\/h2>\n<p>Technical terms are underlined wherever they appear. Hovering over one, or tapping it on a phone, gives a one-line definition in plain language. There are 157 of them, covering the vocabulary of trusts, land tenure, sovereign debt, tax structuring and labour status. The definitions are deliberately short; where a term carries a real dispute, the entry it appears in sets out the dispute.<\/p>\n\n<h2>The anchor figures<\/h2>\n<p>A few numbers recur across the entries. These are the sources for them.<\/p>\n<ul>\n<li><b>Global distribution.<\/b> World Inequality Report 2026 (World Inequality Lab, Paris School of Economics): the top 0.001% &mdash; fewer than 60,000 people &mdash; own three times the wealth of the poorest half of humanity; in almost every region the top 1% hold more than the bottom 90% combined; education spending per child runs &euro;200 a year in sub-Saharan Africa against &euro;9,000 in North America and Oceania. <a href=\"https://prod.wid.world/www-site/uploads/2025/12/World_Inequality_Report_2026.pdf\" target=\"_blank\" rel=\"noopener\">Report<\/a><\/li>\n<li><b>Wealth concentration.<\/b> Oxfam, <i>Resisting the Rule of the Rich<\/i> (January 2026): billionaire wealth of $18.3 trillion; the richest 1% own 43.8% of global wealth against 0.52% for the poorest half. <a href=\"https://www.oxfam.de/system/files/documents/2026-01/20260119-resisting-rule-rich-methodology-note.pdf\" target=\"_blank\" rel=\"noopener\">Methodology note<\/a><\/li>\n<li><b>Tax losses.<\/b> Tax Justice Network, <i>State of Tax Justice<\/i> (2025): about $492 billion lost a year to multinational profit shifting and offshore private wealth; $1.42 trillion of profit shifted into havens annually; the UK's dependencies and territories account for roughly 23% of global corporate tax losses. <a href=\"https://taxjustice.net/wp-content/uploads/2025/11/State-of-Tax-Justice-2025-report-Tax-Justice-Network.pdf\" target=\"_blank\" rel=\"noopener\">2025 report<\/a><\/li>\n<li><b>Inherited wealth.<\/b> Joint Committee on Taxation, via the Congressional Research Service: the exclusion of capital gains at death costs the US Treasury about $40 billion a year. HM Treasury: in 2021-22, 117 UK estates took &pound;219 million in agricultural property relief, two-fifths of the whole cost of that relief. <a href=\"https://www.congress.gov/crs_external_products/IF/PDF/IF11812/IF11812.2.pdf\" target=\"_blank\" rel=\"noopener\">CRS<\/a><\/li>\n<li><b>Executive pay.<\/b> Economic Policy Institute (2026): CEO pay at the top 350 US firms rose 14% in 2025 to an average of $27.9 million, a ratio of 325 to 1 against the typical worker, from 21 to 1 in 1965. <a href=\"https://www.epi.org/blog/ceo-pay-surged-in-2025-ceos-are-paid-325-times-as-much-as-the-typical-worker/\" target=\"_blank\" rel=\"noopener\">EPI<\/a><\/li>\n<li><b>Austerity.<\/b> Oxfam (2026) analysis of 161 IMF loans to 81 countries: 24 of 28 countries with ongoing programmes required to implement austerity; median required cuts five times deeper in loans since 2018 than in 2012&ndash;17. <a href=\"https://www.oxfam.org/en/press-releases/countries-locked-imf-austerity-programs-are-also-around-twice-vulnerable-economic\" target=\"_blank\" rel=\"noopener\">Oxfam<\/a><\/li>\n<li><b>Political influence.<\/b> Gilens and Page, <i>Testing Theories of American Politics<\/i> (2014), on nearly 1,800 policy questions: economic elites and organised business groups have substantial independent influence on US policy outcomes; average citizens have close to none. <a href=\"https://www.cambridge.org/core/journals/perspectives-on-politics/article/testing-theories-of-american-politics-elites-interest-groups-and-average-citizens/62327F513959D0A304D4893B382B992B\" target=\"_blank\" rel=\"noopener\">Paper<\/a><\/li>\n<\/ul>\n\n<h2>Coordinates, addresses and basemaps<\/h2>\n<p>Coordinates are placed on the named building, not on a country centroid, so that zooming in shows the actual premises. Addresses are given as the entity itself publishes them &mdash; in filings, on its contact page, or in a public register. Several are large campuses where the registered address and the working offices differ; in those cases the registered address is used, because that is the one that matters legally. Leadership names are as of November 2026 and will go out of date; the institution is the entry, not the individual holding the post.<\/p>\n<p>The five basemaps are the ones built for the Culprits map and used across this site, and the point colours are matched to each. Imagery and elevation are from Esri and its suppliers, place names from CARTO and OpenStreetMap, night lights from NASA's VIIRS Black Marble.<\/p>\n\n<h2>What is missing, and known weaknesses<\/h2>\n<ul>\n<li><b>Documentation bias.<\/b> Coverage follows the paper trail, which means free-press, open-court jurisdictions are over-represented relative to authoritarian ones. Absence from this map is not evidence of innocence.<\/li>\n<li><b>No ranking.<\/b> There is deliberately no composite score. Any number claiming to rank a doctrine against a landlord would be invented.<\/li>\n<li><b>Gaps in the frame.<\/b> Dowry and bride-price systems, hereditary caste occupations outside India, land registries in Central Asia, inherited water rights in the American West, church and crown landholdings, Gulf citizenship as an inherited income, and the Chinese household-registration reforms now under way all belong here and are not yet entered.<\/li>\n<li><b>The counter-side.<\/b> Unions, tax authorities, land-restitution commissions, investigative outlets, tenant movements and the researchers whose work this map is built on are not mapped. They are the obvious companion piece.<\/li>\n<li><b>Moving figures.<\/b> Net worths, valuations and assets under management change daily. Each is dated where it is given.<\/li>\n<\/ul>\n\n<h2>Corrections<\/h2>\n<p>If an entry is wrong &mdash; a figure, an address, a leadership name, a characterisation, a denial that should be recorded &mdash; the correction will be made, with the source. An entity that disputes a characterisation will have its response stated in its own entry, as several already do.<\/p>\n\n<h2>Credit where it is owed<\/h2>\n<p>Almost nothing on this map was discovered here. It is assembled from the work of the World Inequality Lab, the Tax Justice Network, Oxfam, the Economic Policy Institute, Anti-Slavery International, the UN Special Rapporteur on contemporary forms of slavery, Human Rights Watch, the Indian Land Tenure Foundation, Africa Check, the International Consortium of Investigative Journalists, the Black Beyond Data project at Johns Hopkins, ProPublica, the Government Accountability Office, the Congressional Research Service, the Urban Institute, Fairtrade International, the New York Times, Reuters, and the researchers cited in each entry. Where their links are given, follow them.<\/p>\n";

var GRX=null;
(function(){
  var keys=Object.keys(GLOSS).sort(function(a,b){return b.length-a.length});
  var pat=keys.map(function(k){return k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}).join("|");
  GRX=new RegExp("\\b("+pat+")\\b","gi");
})();
function glMark(t,used){
  return t.replace(GRX,function(m){
    var k=m.toLowerCase();
    if(!GLOSS[k]||used[k])return m;
    used[k]=1;
    return "<span class='gl' data-d=\""+esc(GLOSS[k])+"\">"+m+"</span>";
  });
}
function gl(s){return glMark(esc(s),{})}
/* for text that is already HTML: only touch the text between tags */
function glHTML(h){
  var used={};
  return String(h).replace(/>([^<>]+)</g,function(m,t){return ">"+glMark(t,used)+"<"});
}
(function(){

    tip.textContent=d;tip.style.display="block";
    var r=el.getBoundingClientRect(),w=Math.min(300,window.innerWidth-24),h=tip.offsetHeight;
    tip.style.width=w+"px";
    var L=Math.max(10,Math.min(window.innerWidth-w-10,r.left-8));
    var T=r.top-h-9;if(T<8)T=r.bottom+9;
    tip.style.left=L+"px";tip.style.top=T+"px";
  }

  document.addEventListener("mouseover",function(ev){
    var el=ev.target.closest?ev.target.closest(".gl"):null;if(el)show(el);});
  document.addEventListener("mouseout",function(ev){
    if(ev.target.closest&&ev.target.closest(".gl"))hide();});
  document.addEventListener("click",function(ev){
    var el=ev.target.closest?ev.target.closest(".gl"):null;

    var p=ev.features[0].properties;
    tt.innerHTML="<b>"+esc(p.n)+"</b><span class='tm'>"+esc(p.pl)+" &middot; "+esc(TY[p.t].n)+"</span>";
    tt.style.display="block";tt.style.left=(ev.originalEvent.clientX+13)+"px";tt.style.top=(ev.originalEvent.clientY+13)+"px";
  });
  map.on("mouseleave","e-dot",function(){map.getCanvas().style.cursor="";tt.style.display="none"});
  map.on("click","e-dot",function(ev){
    var id=ev.features[0].properties.id;
    var e=ENTS.filter(function(x){return x.id===id})[0];
    if(e){openDet(e);flyTo(e,false)}
  });
  ready=true;
  paintDots();drawKey();drawLeg();drawPats();drawBase();sizeBoxes();
}

function flyTo(e,zoomIn){
  map.flyTo({center:[e.lon,e.lat],zoom:Math.max(map.getZoom(),zoomIn?9:4.2),duration:1300,essential:true});
}
function selectEnt(e){
  S.sel=e;
  if(map.getLayer("e-sel"))map.setFilter("e-sel",["==",["get","id"],e?e.id:"__none__"]);
}

/* ---------- detail card ---------- */
function patChip(pid){
  var p=PATS.filter(function(x){return x.id===pid})[0];
  if(!p)return "";
  return "<span data-pat='"+p.id+"'>"+esc(p.n)+"</span>";
}
function openDet(e){
  selectEnt(e);
  var h="";
  h+="<div class='hp-k'>"+esc(TY[e.t].n)+"</div>";
  h+="<h3>"+esc(e.n)+"</h3>";
  h+="<p class='hp-sub'>"+esc(e.pl)+" &middot; reach: "+esc(RC[e.rch].n.toLowerCase())+"</p>";
  h+="<p class='hp-role'>"+gl(e.ro)+"</p>";
  h+="<div class='hp-h'>Where to find it</div>";
  h+="<div class='addr'><div class='ab'>"+esc(e.ad)+
     (e.who?"<div class='ac'>"+gl(e.who)+"</div>":"")+"</div>"+
     "<button class='btn' data-copy=\""+esc(e.ad)+"\" title='Copy the address'>Copy</button></div>";
  if(e.fg&&e.fg.length){
    h+="<div class='hp-h'>Figures</div><table class='kv'>";
    e.fg.forEach(function(f){h+="<tr><th>"+gl(f[0])+"</th><td>"+gl(f[1])+"</td></tr>"});
    h+="</table>";
  }
  h+="<div class='hp-h'>The rundown</div><div class='bts'>";
  String(e.rd).split("\n").forEach(function(par){if(par.trim())h+="<p>"+gl(par)+"</p>"});
  h+="</div>";
  h+="<div class='imp-box'><span class='ih'>What this means, plainly</span>"+gl(e.mn)+"</div>";
  h+="<div class='hp-h'>Mechanisms</div><div class='chips'>";
  e.mx.forEach(function(m){if(MC[m])h+="<span data-mech='"+m+"'>"+esc(MC[m].n)+"</span>"});
  h+="</div>";
  if(e.pt&&e.pt.length){h+="<div class='hp-h'>Patterns it belongs to</div><div class='chips'>"+e.pt.map(patChip).join("")+"</div>"}
  h+="<div class='hp-src'><b>Sources.</b>";
  e.sr.forEach(function(s){h+="<div><a href='"+esc(s[1])+"' target='_blank' rel='noopener'>"+esc(s[0])+"</a></div>"});
  h+="</div>";
  var d=document.getElementById("det");
  document.getElementById("detBody").innerHTML=h;
  d.classList.add("open");d.scrollTop=0;
  d.style.left="50%";d.style.top="50%";d.style.transform="translate(-50%,-50%)";
}
function closeDet(){document.getElementById("det").classList.remove("open");selectEnt(null)}
document.getElementById("detX").onclick=closeDet;
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"){closeDet();closeOv()}});
document.getElementById("det").addEventListener("click",function(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.copy!==undefined){
    var v=t.dataset.copy;
    if(navigator.clipboard){navigator.clipboard.writeText(v).then(function(){t.textContent="Copied"},function(){t.textContent="Select it"})}
    else{t.textContent="Select it"}
    setTimeout(function(){t.textContent="Copy"},1600);return;
  }
  if(t.dataset&&t.dataset.pat){openPat(t.dataset.pat);return}
  if(t.dataset&&t.dataset.mech){
    MECHS.forEach(function(m){S.mechs[m.k]=(m.k===t.dataset.mech)});
    refresh();return;
  }
});
/* drag */
(function(){
  var d=document.getElementById("det"),g=document.getElementById("detGrip"),drag=false,sx=0,sy=0,ox=0,oy=0;
  function down(ev){drag=true;d.classList.add("dragging");
    var r=d.getBoundingClientRect();d.style.transform="none";d.style.left=r.left+"px";d.style.top=r.top+"px";
    ox=r.left;oy=r.top;var p=ev.touches?ev.touches[0]:ev;sx=p.clientX;sy=p.clientY;ev.preventDefault()}
  function move(ev){if(!drag)return;var p=ev.touches?ev.touches[0]:ev;
    d.style.left=(ox+p.clientX-sx)+"px";d.style.top=(oy+p.clientY-sy)+"px"}
  function up(){drag=false;d.classList.remove("dragging")}
  g.addEventListener("mousedown",down);g.addEventListener("touchstart",down,{passive:false});
  window.addEventListener("mousemove",move);window.addEventListener("touchmove",move,{passive:false});
  window.addEventListener("mouseup",up);window.addEventListener("touchend",up);
})();

/* ---------- left key ---------- */
function cnt(fn){var n=0;ENTS.forEach(function(e){if(fn(e))n++});return n}
function drawKey(){
  var h="";
  h+="<div class='psec'>What kind of culprit</div>";
  TYPES.forEach(function(t){
    var n=cnt(function(e){return e.t===t.k});
    h+="<div class='row"+(S.types[t.k]?"":" off")+"' data-type='"+t.k+"'><span class='sw' style='background:"+tcol(t.k)+"'></span><span>"+esc(t.n)+"</span><span class='n'>"+n+"</span></div>";
  });
  h+="<div style='margin-top:5px'><span class='frst' data-all='types'>all</span> &middot; <span class='frst' data-none='types'>none</span></div>";

  h+="<div class='psec'>How it is done</div><div class='fchips'>";
  MECHS.forEach(function(m){
    var n=cnt(function(e){return e.mx.indexOf(m.k)>=0});
    h+="<span class='fc"+(S.mechs[m.k]?" on":"")+"' data-mech='"+m.k+"'>"+esc(m.n)+"<span class='n'>"+n+"</span></span>";
  });
  h+="</div><div><span class='frst' data-all='mechs'>all</span> &middot; <span class='frst' data-none='mechs'>none</span></div>";

  h+="<div class='psec'>How far it reaches</div><div class='fchips'>";
  REACH.forEach(function(r){
    var n=cnt(function(e){return e.rch===r.k});
    h+="<span class='fc"+(S.reach[r.k]?" on":"")+"' data-reach='"+r.k+"'>"+esc(r.n)+"<span class='n'>"+n+"</span></span>";
  });
  h+="</div>";

  h+="<div class='psec'>Find</div>";
  h+="<input class='inp' id='q' type='text' placeholder='name, city, street, person' value=\""+esc(S.q)+"\">";
  h+="<div id='flist' class='scroll'></div>";
  h+="<div style='margin-top:8px;display:flex;gap:6px;flex-wrap:wrap'><button class='btn' id='csvBtn'>Download this list (CSV)</button><button class='btn' id='rstBtn'>Reset filters</button></div>";
  h+="<p class='hint'>Addresses are registered offices, headquarters and official premises &mdash; the places that answer for the decisions. No private homes.</p>";
  document.getElementById("keyBody").innerHTML=h;

  var q=document.getElementById("q");
  q.oninput=function(){S.q=q.value;refresh(true)};
  document.getElementById("csvBtn").onclick=csv;
  document.getElementById("rstBtn").onclick=function(){
    TYPES.forEach(function(t){S.types[t.k]=true});MECHS.forEach(function(m){S.mechs[m.k]=true});
    REACH.forEach(function(r){S.reach[r.k]=true});S.pat=null;S.q="";refresh()};
  drawFind();
  var n=shown().length;
  document.getElementById("lede2").textContent=n+" of "+ENTS.length+" entries shown"+(S.pat?" — pattern filter on":"");
}
function drawFind(){
  var el=document.getElementById("flist");if(!el)return;
  var list=shown();
  if(!S.q&&!S.pat){el.innerHTML="<p class='hint'>Type to search, or click a point. Showing "+list.length+" entries.</p>";return}
  var h="";
  list.slice(0,60).forEach(function(e){
    h+="<div class='fi' data-go='"+e.id+"'><span class='sw' style='background:"+col(e)+";margin-top:3px'></span><span><b>"+esc(e.n)+"</b><span class='fm'>"+esc(e.pl)+"</span></span></div>";
  });
  if(list.length>60)h+="<p class='hint'>"+(list.length-60)+" more — narrow the search.</p>";
  if(!list.length)h+="<p class='hint'>Nothing matches.</p>";
  el.innerHTML=h;
}
document.getElementById("key").addEventListener("click",function(ev){
  var t=ev.target.closest?ev.target.closest("[data-type],[data-mech],[data-reach],[data-go],[data-all],[data-none]"):null;
  if(!t)return;
  if(t.dataset.type!==undefined){S.types[t.dataset.type]=!S.types[t.dataset.type];refresh()}
  else if(t.dataset.mech!==undefined){S.mechs[t.dataset.mech]=!S.mechs[t.dataset.mech];refresh()}
  else if(t.dataset.reach!==undefined){S.reach[t.dataset.reach]=!S.reach[t.dataset.reach];refresh()}
  else if(t.dataset.all!==undefined){var g=t.dataset.all;
    if(g==="types")TYPES.forEach(function(x){S.types[x.k]=true});else MECHS.forEach(function(x){S.mechs[x.k]=true});refresh()}
  else if(t.dataset.none!==undefined){var g2=t.dataset.none;
    if(g2==="types")TYPES.forEach(function(x){S.types[x.k]=false});else MECHS.forEach(function(x){S.mechs[x.k]=false});refresh()}
  else if(t.dataset.go!==undefined){
    var e=ENTS.filter(function(x){return x.id===t.dataset.go})[0];
    if(e){openDet(e);flyTo(e,true)}
  }
});
document.getElementById("toggleKey").onclick=function(){
  var k=document.getElementById("key");k.classList.toggle("min");
  this.innerHTML=k.classList.contains("min")?"+":"&minus;"};

/* ---------- legend ---------- */
function drawLeg(){
  var h="";
  TYPES.forEach(function(t){
    var n=cnt(function(e){return e.t===t.k&&passes(e)});
    h+="<div class='row"+(S.types[t.k]?"":" off")+"' data-type='"+t.k+"' title=\""+esc(t.d)+"\"><span class='sw' style='background:"+tcol(t.k)+"'></span><span>"+esc(t.n)+"</span><span class='n'>"+n+"</span></div>";
  });
  h+="<div class='flab' style='margin-top:9px'>Dot size &mdash; how far it reaches</div><div class='fchips'>";
  REACH.forEach(function(r){
    h+="<span class='fc"+(S.reach[r.k]?" on":"")+"' data-reach='"+r.k+"' style='cursor:pointer' title='Show only this reach'><span class='sw' style='background:"+(S.light?"#4a5c5c":"#8d9699")+";width:"+(r.r+2)+"px;height:"+(r.r+2)+"px;margin-right:5px'></span>"+esc(r.n)+"</span>";
  });
  h+="</div>";
  document.getElementById("legBody").innerHTML=h;
}
document.getElementById("legBox").addEventListener("click",function(ev){
  var t=ev.target.closest?ev.target.closest("[data-type],[data-reach]"):null;if(!t)return;
  if(t.dataset.type!==undefined){S.types[t.dataset.type]=!S.types[t.dataset.type];refresh()}
  else{
    var k=t.dataset.reach, sole=REACH.every(function(r){return S.reach[r.k]===(r.k===k)});
    REACH.forEach(function(r){S.reach[r.k]=sole?true:(r.k===k)});refresh()}
});
document.getElementById("toggleLeg").onclick=function(){
  var b=document.getElementById("legBox");b.classList.toggle("min");
  this.innerHTML=b.classList.contains("min")?"+":"&minus;";sizeBoxes()};

/* ---------- patterns ---------- */
function patCount(p){return cnt(function(e){return e.pt.indexOf(p.id)>=0})}
function drawPats(){
  var h="";
  if(S.pat)h+="<p class='hint' style='margin:2px 0 6px'>Filtering to one pattern. <span class='frst' id='patClear'>show all</span></p>";
  PATS.forEach(function(p){
    var c=P.t[({conc:"own",hide:"secr",cap:"doct",cred:"debt",floor:"bind",rent:"own",tied:"bind",supp:"doct",excl:"land",cond:"debt",trans:"inh",disp:"land",priv:"pub"})[p.mx]]||P.ui[1];
    h+="<div class='pat"+(S.pat===p.id?" on":"")+"' data-p='"+p.id+"' style='--pc:"+c+"'><div class='pt'>"+esc(p.n)+"</div><div class='pm'>"+gl(p.line)+" &middot; "+patCount(p)+" entries</div></div>";
  });
  document.getElementById("patBody").innerHTML=h;
  var pc=document.getElementById("patClear");
  if(pc)pc.onclick=function(){S.pat=null;refresh()};
}
document.getElementById("patBox").addEventListener("click",function(ev){
  var t=ev.target.closest?ev.target.closest("[data-p]"):null;if(!t)return;
  openPat(t.dataset.p);
});
document.getElementById("togglePat").onclick=function(){
  var b=document.getElementById("patBox");b.classList.toggle("min");
  this.innerHTML=b.classList.contains("min")?"+":"&minus;";sizeBoxes()};

function openPat(pid){
  var p=PATS.filter(function(x){return x.id===pid})[0];if(!p)return;
  S.pat=pid;
  TYPES.forEach(function(t){S.types[t.k]=true});MECHS.forEach(function(m){S.mechs[m.k]=true});
  REACH.forEach(function(r){S.reach[r.k]=true});S.q="";
  refresh();
  var list=ENTS.filter(function(e){return e.pt.indexOf(pid)>=0});
  var h="<h1>"+esc(p.n)+"</h1><p class='hint' style='font-size:12.5px'>"+gl(p.line)+"</p>";
  String(p.rd).split("\n").forEach(function(par){if(par.trim())h+="<p>"+gl(par)+"</p>"});
  h+="<div class='imp-box'><span class='ih'>What this means, plainly</span>"+gl(p.mn)+"</div>";
  h+="<h2>On the map &mdash; "+list.length+" entries in this pattern</h2><div class='chips'>";
  list.forEach(function(e){h+="<span data-go='"+e.id+"'><span class='sw' style='background:"+col(e)+";width:9px;height:9px'></span>"+esc(e.n)+"</span>"});
  h+="</div><p class='hint' style='margin-top:14px'>The map is now filtered to this pattern. Close this and the filter stays on until you clear it in the patterns box.</p>";
  var st=document.getElementById("story");
  st.innerHTML=h;st.classList.add("open");st.scrollTop=0;
}
document.getElementById("story").addEventListener("click",function(ev){
  var t=ev.target.closest?ev.target.closest("[data-go]"):null;if(!t)return;
  var e=ENTS.filter(function(x){return x.id===t.dataset.go})[0];
  if(e){closeOv();openDet(e);flyTo(e,true)}
});

/* ---------- basemap box ---------- */
function drawBase(){
  var h="<div class='psec' style='margin:0 0 3px'>Basemap</div><div class='bases'>";
  CulpritsBasemaps.list.forEach(function(b){
    h+="<label><input type='radio' name='bs' value='"+b[0]+"'"+(BM.current()===b[0]?" checked":"")+">"+esc(b[1])+"</label>";
  });
  h+="</div>";
  h+="<div class='rng'><span>Dots</span><input type='range' id='opR' min='30' max='100' value='"+Math.round(S.dots*100)+"'></div>";
  h+="<p class='hint' style='margin-top:5px'>Point colours change with the basemap, so each set is drawn from the tones of the map underneath it.</p>";
  document.getElementById("trBody").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll("input[name=bs]"),function(r){
    r.onchange=function(){BM.set(r.value)}});
  document.getElementById("opR").oninput=function(){
    S.dots=+this.value/100;
    map.setPaintProperty("e-dot","circle-opacity",S.dots);
    map.setPaintProperty("e-halo","circle-opacity",S.dots*.3);
  };
}
document.getElementById("toggleTr").onclick=function(){
  var b=document.getElementById("tr");b.classList.toggle("min");
  this.innerHTML=b.classList.contains("min")?"+":"&minus;"};

/* ---------- overlays ---------- */
function closeOv(){document.getElementById("info").classList.remove("open");document.getElementById("story").classList.remove("open")}
document.getElementById("infoClose").onclick=closeOv;
document.getElementById("storyClose").onclick=closeOv;
document.getElementById("infoBtn").onclick=function(){
  document.getElementById("info").innerHTML=glHTML(METHOD);
  document.getElementById("info").classList.add("open");document.getElementById("info").scrollTop=0};
document.getElementById("storyBtn").onclick=function(){
  var st=document.getElementById("story");
  st.innerHTML=glHTML(ABOUT);st.classList.add("open");st.scrollTop=0};
document.getElementById("patBtn").onclick=function(){
  var h="<h1>Patterns behind the scenes</h1><p>"+PATS.length+" write-ups of how the machinery fits together. Tap one to read it and filter the map to the entries involved.</p>";
  PATS.forEach(function(p){
    h+="<div class='pat' data-p2='"+p.id+"' style='--pc:"+P.ui[1]+";margin:9px 0;padding:9px 11px'><div class='pt' style='font-size:14.5px'>"+esc(p.n)+"</div><div class='pm' style='font-size:12px'>"+gl(p.line)+" &middot; "+patCount(p)+" entries</div></div>";
  });
  var st=document.getElementById("story");st.innerHTML=h;st.classList.add("open");st.scrollTop=0;
};
document.getElementById("story").addEventListener("click",function(ev){
  var t=ev.target.closest?ev.target.closest("[data-p2]"):null;if(!t)return;
  openPat(t.dataset.p2);
});
document.getElementById("worldBtn").onclick=function(){map.flyTo({center:[-22,22],zoom:1.8,duration:1200})};

/* ---------- csv ---------- */
function csv(){
  var rows=[["name","type","role","place","address","who","reach","mechanisms","patterns"]];
  shown().forEach(function(e){
    rows.push([e.n,TY[e.t].n,e.ro,e.pl,e.ad,e.who||"",RC[e.rch].n,
      e.mx.map(function(m){return MC[m]?MC[m].n:m}).join("; "),
      e.pt.map(function(p){var x=PATS.filter(function(y){return y.id===p})[0];return x?x.n:p}).join("; ")]);
  });
  var out=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n");
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+out],{type:"text/csv;charset=utf-8"}));
  a.download="inequality-map-list.csv";document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},800);
}

/* ---------- layout ---------- */
function sizeBoxes(){
  var p=document.getElementById("patBox"),l=document.getElementById("legBox");
  var ph=p.classList.contains("min")?44:Math.min(300,Math.round(window.innerHeight*.34));
  var lh=l.classList.contains("min")?44:Math.min(224,Math.round(window.innerHeight*.26));
  document.documentElement.style.setProperty("--patH",ph+"px");
  document.documentElement.style.setProperty("--legH",lh+"px");
  p.style.maxHeight=ph+"px";l.style.maxHeight=lh+"px";
}
window.addEventListener("resize",sizeBoxes);

function refresh(keepFocus){
  paintDots();drawKey();drawLeg();drawPats();
  if(keepFocus){var q=document.getElementById("q");if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}

</script>
</body>
</html>
