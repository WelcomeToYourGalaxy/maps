<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inequality Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cinzel:wght@500;600&display=swap">
<style>
:root{
  --bg:#0b1014;--card:rgba(12,18,22,.94);--line:#27363d;--line2:rgba(255,255,255,.07);
  --ink:#e6e4de;--mute:#9aa4a6;--accent:#3f6470;--accent-hi:#9dbdc0;--head:#f0ece4;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 'Marcellus',Georgia,serif;overflow:hidden}
#map{position:absolute;inset:0;background:#070d10}
.card{position:absolute;z-index:800;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.55);backdrop-filter:blur(6px)}
.scroll{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
body.lightbase{--card:rgba(248,246,241,.95);--line:#c7ccc9;--line2:rgba(0,0,0,.08);--ink:#1d2426;--mute:#5d6a6c;--accent:#3f6470;--accent-hi:#2b4b55;--head:#131a1c}
body.lightbase .card{box-shadow:0 10px 30px rgba(0,0,0,.18)}

/* left key */
#key{top:12px;left:12px;width:338px;max-height:calc(100% - var(--patH,290px) - 48px);overflow:auto;padding:14px 16px;box-sizing:border-box}
#key h1{font:600 21px/1.15 'Cinzel','Marcellus',serif;margin:0 0 5px;letter-spacing:.6px;color:var(--head)}
#key .lede{color:var(--mute);margin:0 0 3px;font-size:12.6px}
#key .lede2{color:var(--mute);margin:0 0 10px;font-size:11.4px}
#key.min .body,#key.min .lede,#key.min .lede2{display:none}
.tog{display:inline-block;float:right;cursor:pointer;font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:1px 8px}
.tog:hover{border-color:var(--accent-hi)}
.psec{margin:15px 0 4px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent-hi)}
.flab{font-size:11.4px;color:var(--mute);margin:9px 0 2px;letter-spacing:.3px}
.fchips{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 2px}
.fc{display:inline-flex;align-items:center;font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:1px 6px;cursor:pointer;opacity:.45;user-select:none}
.fc.on{opacity:1;border-color:rgba(157,189,192,.45)}
.fc:hover{border-color:var(--accent-hi)}
.fc .n{margin-left:5px;color:var(--mute);font-size:10.8px}
.row{display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--line2);font-size:12.9px;cursor:pointer}
.row:hover{color:var(--head)}
.row.off{opacity:.38}
.row .n{margin-left:auto;color:var(--mute);font-size:11.4px;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.35)}
body.lightbase .sw{border-color:rgba(0,0,0,.3)}
input.inp{background:rgba(127,140,145,.12);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font:inherit;font-size:12.6px;box-sizing:border-box;width:100%}
input.inp:focus{outline:none;border-color:var(--accent-hi)}
.btn{background:rgba(127,140,145,.12);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 9px;font:inherit;font-size:12.2px;cursor:pointer}
.btn:hover{border-color:var(--accent-hi);color:var(--head)}
.frst{color:var(--accent-hi);cursor:pointer;font-size:11.8px}
#flist{max-height:230px;overflow:auto;margin-top:5px}
.fi{padding:5px 3px;border-top:1px solid var(--line2);font-size:12.7px;cursor:pointer;display:flex;gap:7px;align-items:flex-start}
.fi:hover{background:rgba(157,189,192,.1)}
.fi .fm{color:var(--mute);font-size:11px;display:block}
.hint{font-size:11px;color:var(--mute);line-height:1.45;margin:4px 0 0}

/* right column */
#rcol{position:absolute;z-index:800;top:12px;right:12px;bottom:calc(var(--legH,210px) + 48px);width:300px;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:flex-end}
#rcol>*{pointer-events:auto;position:relative;box-sizing:border-box}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btnrow .card{position:relative;padding:7px 13px;cursor:pointer;letter-spacing:.2px;font-size:12.8px}
#patBtn{display:none}
.btnrow .card:hover{border-color:var(--accent-hi);color:var(--head)}
#tr{padding:11px 14px;width:100%}
#tr.min .body{display:none}
.bases{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12.6px;margin:4px 0 2px}
.bases label{cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
.rng{display:flex;align-items:center;gap:7px;font-size:11.6px;color:var(--mute);margin-top:6px}
.rng input{flex:1}

/* bottom boxes */
#patBox{left:12px;bottom:12px;width:338px;max-height:var(--patH,290px);display:flex;flex-direction:column;box-sizing:border-box}
#legBox{right:12px;bottom:12px;width:300px;max-height:var(--legH,210px);display:flex;flex-direction:column;box-sizing:border-box}
#patBox .bh,#legBox .bh{display:flex;align-items:center;padding:9px 14px 4px}
#patBox .bh .psec,#legBox .bh .psec{margin:0;flex:1}
#patBody,#legBody{overflow:auto;padding:0 14px 12px}
#patBox.min #patBody,#legBox.min #legBody{display:none}
.pat{padding:6px 9px;margin:4px 0;border-left:3px solid var(--pc);border-radius:0 4px 4px 0;background:rgba(157,189,192,.06);cursor:pointer}
.pat:hover{background:rgba(157,189,192,.14)}
.pat.on{background:rgba(157,189,192,.2)}
.pat .pt{font-size:12.9px;color:var(--head);line-height:1.3}
.pat .pm{font-size:10.7px;color:var(--mute);margin-top:1px;line-height:1.35}

/* detail */
#det{display:none;position:fixed;z-index:950;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 32px));max-height:min(82vh,840px);overflow:auto;padding:16px 22px 20px;box-sizing:border-box;box-shadow:0 24px 70px rgba(0,0,0,.72)}
#det.open{display:block}
#detGrip{position:sticky;top:-16px;margin:-16px -22px 4px;height:18px;cursor:grab;display:flex;justify-content:center;align-items:center;background:var(--card);z-index:2;touch-action:none}
#detGrip::after{content:"";width:42px;height:4px;border-radius:2px;background:rgba(140,150,155,.4)}
#det.dragging,#det.dragging #detGrip{cursor:grabbing;user-select:none}
#detX{position:absolute;z-index:3;top:5px;right:9px;background:none;border:0;color:var(--mute);font-size:21px;cursor:pointer;line-height:1}
#detX:hover{color:var(--head)}
.hp-k{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);padding-right:22px}
.hp h3{margin:3px 0 5px;font:600 19px/1.25 'Cinzel','Marcellus',serif;color:var(--head);border-bottom:1px solid var(--line);padding:0 18px 7px 0}
.hp-sub{color:var(--mute);font-size:12.2px;margin:0 0 4px}
.hp-role{margin:8px 0;color:var(--ink);font-size:13.6px;line-height:1.5}
.hp-h{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);margin:14px 0 4px}
.addr{display:flex;gap:9px;align-items:flex-start;background:rgba(157,189,192,.07);border-left:3px solid var(--accent);padding:8px 10px;border-radius:0 4px 4px 0;font-size:13px;line-height:1.45}
.addr .ab{flex:1}
.addr .ac{font-size:11.4px;color:var(--mute);margin-top:3px}
table.kv{border-collapse:collapse;font-size:12.6px;width:100%;margin:2px 0}
table.kv th{text-align:left;color:var(--mute);font-weight:400;vertical-align:top;padding:3px 12px 3px 0;white-space:normal;width:38%}
table.kv td{padding:3px 0;vertical-align:top}
.bts{margin:10px 0;padding:2px 0}
.bts p{margin:0 0 9px;font-size:13.4px;color:var(--ink);line-height:1.6}
.imp-box{margin:12px 0 4px;padding:10px 12px;background:rgba(157,189,192,.08);border-left:3px solid var(--accent-hi);border-radius:0 5px 5px 0;font-size:13.3px;line-height:1.55}
.imp-box .ih{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);display:block;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chips span{font-size:11.6px;border:1px solid var(--line);border-radius:3px;padding:1px 7px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chips span:hover{border-color:var(--accent-hi);color:var(--head)}
.chips .sw{width:9px;height:9px;border-radius:50%}
.hp-src{color:var(--mute);font-size:11.6px;margin-top:12px;border-top:1px solid var(--line2);padding-top:7px;line-height:1.5}
.hp-src a{color:var(--accent-hi)}
.hp-src div{margin:3px 0}
a{color:var(--accent-hi)}
.tag{display:inline-block;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--mute);margin-left:6px;vertical-align:2px}

/* overlays */
#info,#story{inset:0;z-index:1001;border-radius:0;border:0;display:none;overflow:auto;padding:58px max(26px,calc((100% - 940px)/2)) 46px;background:rgba(8,12,15,.978)}
body.lightbase #info,body.lightbase #story{background:rgba(246,244,239,.985)}
#info.open,#story.open{display:block}
#infoClose,#storyClose{position:fixed;top:12px;right:12px;z-index:1002;display:none}
#info.open~#infoClose,#story.open~#storyClose{display:block}
#info h1,#story h1{font:600 24px/1.25 'Cinzel','Marcellus',serif;margin:0 0 14px;color:var(--head)}
#info h2,#story h2{font:600 16px/1.3 'Cinzel','Marcellus',serif;margin:26px 0 8px;color:var(--head);letter-spacing:.3px}
#info p,#story p,#info li,#story li{font-size:14.2px;line-height:1.65}
#info ul,#story ul{padding-left:20px;margin:6px 0}
#info table{border-collapse:collapse;width:100%;font-size:13.2px;margin:10px 0}
#info table th{text-align:left;color:var(--mute);font-weight:400;border-bottom:1px solid var(--line);padding:5px 12px 6px 0}
#info table td{vertical-align:top;padding:7px 12px 7px 0;border-bottom:1px solid var(--line2)}
.warn{border-left:3px solid var(--accent);padding:6px 0 6px 13px;color:var(--ink)}

#ttip{position:fixed;z-index:2000;pointer-events:none;background:rgba(10,14,17,.97);border:1px solid var(--line);color:#e6e4de;border-radius:3px;padding:5px 9px;font-size:12.4px;display:none;max-width:300px;box-shadow:0 6px 18px rgba(0,0,0,.5);line-height:1.4}
#ttip .tm{color:#9aa4a6;font-size:11px;display:block}
#worldBtn{position:absolute;z-index:800;right:12px;bottom:calc(var(--legH,210px) + 20px);padding:6px 11px}
.maplibregl-ctrl-attrib{background:rgba(8,12,15,.78)!important;color:#8b9496;font-family:'Marcellus',Georgia,serif;font-size:10.5px}
.maplibregl-ctrl-attrib a{color:#a6aeb0!important}
.maplibregl-ctrl-group{background:var(--card)!important;border:1px solid var(--line);box-shadow:none!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}
body.lightbase .maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:none}
.maplibregl-ctrl-bottom-right{bottom:0}
.maplibregl-ctrl-top-right{top:auto;bottom:calc(var(--legH,210px) + 58px);right:12px}
@media (max-width:900px){
  #key{width:auto;right:12px;max-height:40%}
  #rcol{top:auto;bottom:12px;left:12px;right:12px;width:auto;max-height:44%;align-items:stretch}
  #patBox,#legBox{display:none}
  #patBtn{display:block!important}
  #worldBtn{display:none}
  #info,#story{padding:54px 16px 70px}
  .maplibregl-ctrl-top-right{display:none}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="key" class="card scroll">
  <button id="toggleKey" class="tog" type="button" title="Pull the key up or down">&minus;</button>
  <h1>Inequality Map</h1>
  <p class="lede">Who and what produces economic inequality worldwide &mdash; by type, with the addresses.</p>
  <p class="lede2" id="lede2"></p>
  <div class="body" id="keyBody"></div>
</div>

<div id="rcol">
  <div class="btnrow">
    <div id="patBtn" class="card" role="button" tabindex="0">Patterns</div><div id="storyBtn" class="card" role="button" tabindex="0">About this map</div>
    <div id="infoBtn" class="card" role="button" tabindex="0">Method and sources</div>
  </div>
  <div id="tr" class="card"><button id="toggleTr" class="tog" type="button" title="Pull the basemap box up or down">&minus;</button><div class="body" id="trBody"></div></div>
</div>

<div id="patBox" class="card"><div class="bh"><span class="psec">Patterns behind the scenes</span><button id="togglePat" class="tog" type="button">&minus;</button></div><div id="patBody" class="scroll"></div></div>
<div id="legBox" class="card"><div class="bh"><span class="psec">On the map</span><button id="toggleLeg" class="tog" type="button">&minus;</button></div><div id="legBody" class="scroll"></div></div>

<div id="det" class="card scroll hp"><div id="detGrip" title="Drag to move"></div><button id="detX" type="button" title="Close">&times;</button><div id="detBody"></div></div>

<button id="worldBtn" class="btn card" type="button" title="Zoom back out to the whole world">Whole world</button>
<div id="info" class="card scroll"></div><button id="infoClose" class="btn" type="button">Close</button>
<div id="story" class="card scroll"></div><button id="storyClose" class="btn" type="button">Close</button>
<div id="ttip"></div>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
var ENTS=[{"id":"blackrock","n":"BlackRock","t":"fin","lat":40.7555,"lon":-74.001,"pl":"New York, United States","ad":"50 Hudson Yards, New York, NY 10001","ro":"The largest asset manager in history; votes other people's savings at almost every big company on earth.","who":"Laurence (Larry) Fink, chairman and chief executive","rch":"global","mx":["own","rent","law"],"fg":[["Assets under management","$15.49 trillion (30 Sep 2026)"],["Net inflows, 12 months","$869 billion"],["Q3 2026 revenue","$7.75 billion"]],"rd":"BlackRock does not usually own factories or employ the workers whose pay is at stake. It owns the shares. Money from pension funds, 401(k)s and insurance savings flows into its index funds, and with that money comes the right to vote at shareholder meetings — which is the right to approve or block executive pay packages, buybacks, board slates and mergers. By September 2026 it held $15.49 trillion, more than the annual output of every country except the United States and China.\nThe effect is quiet and structural. A single firm, answering to its own executives, casts votes across competing companies in the same industry at once, and it almost always votes with management. It also runs Aladdin, the risk software that other managers rent to watch their own portfolios, so a large share of the world's investable money is read through one lens.","mn":"The savings of ordinary workers are pooled into a block of voting power that those workers never exercise, and it is used to approve the pay packages and buybacks that widen the gap between them and the people at the top.","pt":["p1"],"sr":[["BlackRock Q3 2026 results (company release)","https://www.blackrock.com/corporate/newsroom/media/press-releases/blackrock-reports-third-quarter-2026"],["Fichtner, Heemskerk & Garcia-Bernardo, 'These three firms own corporate America'","https://theconversation.com/these-three-firms-own-corporate-america-77072"]],"i":0},{"id":"vanguard","n":"The Vanguard Group","t":"fin","lat":40.0456,"lon":-75.5272,"pl":"Malvern, Pennsylvania, United States","ad":"100 Vanguard Boulevard, Malvern, PA 19355","ro":"Second-largest asset manager; structurally owned by its own funds, controlled by its own executives.","who":"Salim Ramji, chief executive","rch":"global","mx":["own","law"],"fg":[["Assets under management","roughly $11.6 trillion (Sep 2026)"],["Share of US equity ETF assets","about 29%"]],"rd":"Vanguard is formally owned by the funds it runs, which means it is owned by its investors — tens of millions of them, none of whom can direct it. Decisions sit with its executives in Malvern, a town of 3,000 people west of Philadelphia. It is the largest single holder of a great many of the companies that set wages across the American economy.\nIts low fees are real and have saved savers a lot of money. The same machinery also concentrates the vote. Where a company's largest shareholder is a fund manager with no stake in that industry beyond the share price, the pressure it transmits is for margin.","mn":"Cheap index funds were a genuine gain for small savers, and the same arrangement handed three firms a veto over how the companies they hold treat the people who work there.","pt":["p1"],"sr":[["Largest asset manager statistics (2026)","https://walnutinvest.com/stats/largest-asset-manager-statistics"],["Fichtner et al., 'These three firms own corporate America'","https://theconversation.com/these-three-firms-own-corporate-america-77072"]],"i":1},{"id":"statestreet","n":"State Street Global Advisors","t":"fin","lat":42.3637,"lon":-71.0576,"pl":"Boston, Massachusetts, United States","ad":"One Congress Street, Boston, MA 02114","ro":"Third of the ‘Big Three’ index managers, and custodian of tens of trillions more in other people's assets.","who":"Yie-Hsin Hung, president and chief executive of the asset management arm","rch":"global","mx":["own"],"fg":[["Assets under management","$6.31 trillion (30 Sep 2026)"],["Share of US equity ETF assets","about 14%"]],"rd":"State Street launched the first American exchange-traded fund and still runs SPY, the fund that tracks the S&P 500. Together with BlackRock and Vanguard it forms the bloc that research has found to be the largest shareholder in the great majority of S&P 500 companies, casting roughly a quarter of the votes at their annual meetings.\nThat bloc is also the reason the three firms are studied as a competition problem. When the same owners sit atop rival airlines, rival banks and rival meatpackers, the incentive to undercut each other on price — or to bid against each other for workers — weakens.","mn":"When the same three owners hold your employer and its competitors, the bidding war for your labour that is supposed to raise your pay never quite happens.","pt":["p1"],"sr":[["Largest asset manager statistics (2026)","https://walnutinvest.com/stats/largest-asset-manager-statistics"],["Fichtner et al., 'These three firms own corporate America'","https://theconversation.com/these-three-firms-own-corporate-america-77072"]],"i":2},{"id":"blackstone","n":"Blackstone","t":"fin","lat":40.7589,"lon":-73.9712,"pl":"New York, United States","ad":"345 Park Avenue, New York, NY 10154","ro":"The largest private-equity firm and, through Invitation Homes, the firm that turned ordinary family houses into a traded asset class.","who":"Stephen A. Schwarzman, co-founder, chairman and chief executive","rch":"global","mx":["rent","own","wage"],"fg":[["UN communication","OL OTH 17/2019, sent 22 March 2019"],["Invitation Homes","largest single-family landlord in the US after the 2017 Starwood Waypoint merger"]],"rd":"After the 2008 crash, when millions of American families lost houses to foreclosure, Blackstone bought those houses in bulk, cheaply, and rented them back. The vehicle became Invitation Homes, the biggest single-family landlord in the country. In March 2019 the UN Special Rapporteur on the right to housing, Leilani Farha, and the chair of the UN working group on business and human rights wrote directly to Schwarzman, saying the firm's model was ‘pushing low-income, and increasingly middle-income people from their homes’ and that its practices were inconsistent with international human rights law. Blackstone replied that the letter contained false claims and factual errors.\nThe mechanism is simple enough to say in a sentence: a house that used to be a family's main asset becomes somebody else's yield.","mn":"Housing is where most families either build wealth or lose it; when the house becomes a financial product, the rent paid by one household becomes the asset growth of another.","pt":["p6"],"sr":[["UN letter to Blackstone, 22 March 2019","https://www.business-humanrights.org/en/letter-to-blackstone-ceo-from-the-un-special-rapporteur-on-the-right-to-adequate-housing-un-working-group-on-business-human-rights"],["UN experts: tenants 'forced out their homes' by global investment firms","https://news.un.org/en/node/1035441"]],"i":3},{"id":"elliott","n":"Elliott Investment Management","t":"fin","lat":26.712,"lon":-80.053,"pl":"West Palm Beach, Florida, United States","ad":"360 South Rosemary Avenue, West Palm Beach, FL 33401","ro":"The hedge fund that proved a country in default can be made to pay a single creditor in full.","who":"Paul Singer, founder and co-chief executive","rch":"global","mx":["debt","law"],"fg":[["Profit on Argentine bonds","about $2.4 billion"],["Return on original stake","roughly 10–15 times"],["Total paid to holdout funds","$4.65 billion (2016 settlement)"]],"rd":"Argentina defaulted in 2001 on $132 billion. Output fell by more than a quarter, over half the country was in poverty, and 93% of bondholders eventually accepted a restructuring at about a third of face value. Elliott's fund NML Capital had bought the debt cheaply and refused, then spent fifteen years in the US courts. In 2012 Judge Thomas Griesa ruled Argentina had to pay the holdouts in full; at one point Elliott persuaded a court in Ghana to impound an Argentine naval training ship. The 2016 settlement paid the holdout funds $4.65 billion, of which Elliott's share was a profit of roughly $2.4 billion.\nThe case did not only move money. It established that a restructuring agreed by almost every creditor can be defeated by one, which raises the price of every future rescue.","mn":"A country that needs to write down its debts to pay for hospitals now has to buy off whoever refuses, and that money comes out of the same budget.","pt":["p4"],"sr":[["Guzman & Stiglitz, 'How Hedge Funds Held Argentina for Ransom' (NYT)","https://cgt.columbia.edu/news/stiglitz-hedge-funds-held-argentina-ransom"],["Argentina pays Paul Singer's 'vulture fund' $2.4 billion (Democracy Now)","https://www.democracynow.org/2016/3/4/headlines/argentina_pays_paul_singer_s_vulture_fund_24_billion"]],"i":4},{"id":"goldman","n":"Goldman Sachs","t":"fin","lat":40.7146,"lon":-74.0144,"pl":"New York, United States","ad":"200 West Street, New York, NY 10282","ro":"Investment bank whose alumni have run the US Treasury, the Bank of England, the ECB and more.","who":"David Solomon, chairman and chief executive","rch":"global","mx":["law","own","debt"],"fg":[["Greek currency swaps","arranged from 2001, kept debt off the recorded books"],["1MDB settlement (2020)","about $3.9 billion with Malaysia; guilty plea by a subsidiary"]],"rd":"Goldman's role in inequality is less about its own pay packets than about the revolving door. Robert Rubin went from the firm to the US Treasury, where the repeal of Glass-Steagall and the deregulation of derivatives were signed. Mario Draghi went to the ECB, Mark Carney to the Bank of England. The bank also helped Greece use currency swaps from 2001 to keep borrowing off its reported books — debt that later became the austerity programme imposed on Greek pensions and hospitals.\nNone of that is secret or, mostly, illegal. It is the ordinary circulation of people between the institutions that set financial rules and the institutions that profit from them.","mn":"The people writing the rules for finance and the people paid by finance are often the same people at different points in a career, which is why reform tends to stop short of the thing that makes the money.","pt":["p3","p4"],"sr":[["Goldman Sachs 1MDB resolution (US DOJ, 2020)","https://www.justice.gov/archives/opa/pr/goldman-sachs-charged-foreign-bribery-scheme-and-agrees-pay-over-29-billion"]],"i":5},{"id":"ubs","n":"UBS","t":"fin","lat":47.3698,"lon":8.539,"pl":"Zurich, Switzerland","ad":"Bahnhofstrasse 45, 8001 Zurich","ro":"The bank at the centre of private wealth management, and of the fight over banking secrecy.","who":"Sergio Ermotti, group chief executive; Colm Kelleher, chairman","rch":"global","mx":["tax","own"],"fg":[["US deferred prosecution (2009)","$780 million; names of 4,450 US account holders disclosed"],["French conviction (2019, reduced 2021/2025)","initial €4.5 billion penalty for illegal client solicitation and laundering of tax fraud proceeds"],["Assets after Credit Suisse rescue (2023)","roughly $6.9 trillion invested assets"]],"rd":"For most of the twentieth century Swiss law made it a crime for a banker to reveal who a client was, and that single rule built an industry. UBS was prosecuted in the United States in 2009 for helping Americans hide money and paid $780 million while handing over thousands of names — the moment bank secrecy began to crack. France convicted it in 2019 of soliciting clients illegally and laundering the proceeds of tax fraud. After the Swiss state engineered its absorption of Credit Suisse in 2023 it became one bank managing close to $7 trillion for the world's wealthiest households.\nWhat secrecy buys is not the money itself but the gap between the tax a fortune owes and the tax it pays.","mn":"If the richest households can keep their holdings out of sight, everyone else pays the share that was missed — usually through taxes on wages and spending, which fall hardest on the people with the least.","pt":["p10"],"sr":[["UBS deferred prosecution agreement (US DOJ, 2009)","https://www.justice.gov/opa/pr/ubs-enters-deferred-prosecution-agreement"],["Tax Justice Network, State of Tax Justice 2025","https://taxjustice.net/wp-content/uploads/2025/11/State-of-Tax-Justice-2025-report-Tax-Justice-Network.pdf"]],"i":6},{"id":"sandp","n":"S&P Global Ratings","t":"fin","lat":40.703,"lon":-74.009,"pl":"New York, United States","ad":"55 Water Street, New York, NY 10041","ro":"One of three private firms whose letter grades decide what it costs a country to borrow.","who":"Martina Cheung, president and chief executive of S&P Global","rch":"global","mx":["debt","aust"],"fg":[["Market share","S&P, Moody's and Fitch issue the large majority of all sovereign and corporate ratings"]],"rd":"A downgrade by three private companies in New York and London raises the interest a government pays on every future bond. For a wealthy state that means slightly costlier debt. For a low-income country it can mean the difference between funding a health service and funding the interest on past loans. The same agencies rated subprime mortgage bundles AAA before 2008, and were paid by the banks that issued them.\nRatings also discipline policy in advance. Finance ministers cut budgets to protect a grade, which is austerity arriving before any lender has said a word.","mn":"Three unelected companies set the price of a country's borrowing, and the cheapest way for a government to please them is to spend less on its own people.","pt":["p4","p11"],"sr":[["UN Development Programme, 'Lowering the Cost of Borrowing in Africa: The Role of Sovereign Credit Ratings'","https://www.undp.org/africa/publications/lowering-cost-borrowing-africa-role-sovereign-credit-ratings"]],"i":7},{"id":"westernunion","n":"Western Union","t":"fin","lat":39.6195,"lon":-104.907,"pl":"Denver, Colorado, United States","ad":"7001 East Belleview Avenue, Denver, CO 80237","ro":"The largest money-transfer network, taking a cut of the wages migrants send home.","who":"Devin McGranahan, president and chief executive","rch":"global","mx":["price"],"fg":[["Global average cost to send $200","around 6% (World Bank Remittance Prices Worldwide)"],["UN target","3% by 2030 (Sustainable Development Goal 10.c)"],["Recorded remittances to low- and middle-income countries","over $650 billion a year"]],"rd":"Remittances are larger than foreign aid and foreign direct investment combined for many countries, and they go directly to households rather than through governments. The average cost of sending $200 has hovered around 6%, double the target the UN set, and the cost is highest on the poorest corridors — sending money within sub-Saharan Africa is the most expensive of all. Exclusive agreements with banks and post offices in receiving countries keep competitors out.\nThe money being taxed here is the lowest-margin money in the world economy: a cleaner in Dubai sending part of a monthly wage to Kerala, or a farmworker in California sending to Oaxaca.","mn":"A few percent skimmed off the money that migrant workers send home adds up to tens of billions a year taken from exactly the households with the least to spare.","pt":["p5"],"sr":[["World Bank, Remittance Prices Worldwide","https://remittanceprices.worldbank.org/"],["World Bank Migration and Development Brief","https://www.knomad.org/publication/migration-and-development-brief-41"]],"i":8},{"id":"walmart","n":"Walmart","t":"corp","lat":36.364,"lon":-94.218,"pl":"Bentonville, Arkansas, United States","ad":"702 SW 8th Street, Bentonville, AR 72716","ro":"The world's largest private employer, and the largest employer of workers who need public assistance to get by.","who":"John Furner, president and chief executive (since 1 February 2026); Greg Penner, chairman; the Walton family holds roughly 45% of the shares","rch":"global","mx":["wage","chain","price"],"fg":[["Employees worldwide","about 2.1 million"],["GAO finding (2020)","Walmart was among the top four employers of Medicaid and SNAP recipients in all 15 state agencies that reported"],["Walton family wealth","the largest family fortune in the world"]],"rd":"In 2020 the US Government Accountability Office asked fifteen state agencies which employers had the most workers on Medicaid and food stamps. Walmart was in the top four in every single one. About 70% of the adults in those programmes were working full time. The company's answer was that it is the country's largest employer, so of course it appears at the top of any list.\nBoth things are true, and that is the point. The business model is a wage low enough that the public topside — food assistance, Medicaid, housing vouchers — fills the gap, while the savings pass to shoppers as low prices and to the Walton family as dividends. Walmart's buying power then pushes the same squeeze down its suppliers, and from them to the factories in Bangladesh, Vietnam and China where the goods are made.","mn":"When a profitable company pays less than it costs to live, the taxpayer quietly tops up the wage and the owners keep the difference.","pt":["p5","p2"],"sr":[["GAO, 'Federal Social Safety Net Programs: Millions of Full-Time Workers Rely on Federal Health Care and Food Assistance Programs' (GAO-21-45)","https://www.gao.gov/products/gao-21-45"],["Walmart, McDonald's among largest employers of SNAP and Medicaid recipients","https://www.cbsnews.com/news/millions-of-full-time-u-s-workers-receive-federal-health-care-and-food-assistance"]],"i":9},{"id":"amazon","n":"Amazon","t":"corp","lat":47.6225,"lon":-122.337,"pl":"Seattle, Washington, United States","ad":"410 Terry Avenue North, Seattle, WA 98109","ro":"Retail, logistics and cloud giant; sets the pace of warehouse work for the whole industry.","who":"Andy Jassy, president and chief executive; Jeff Bezos, founder and executive chair","rch":"global","mx":["wage","price","tax","own"],"fg":[["Employees","about 1.5 million worldwide"],["Injury rate","warehouse injury rates consistently above the industry average in US OSHA data"],["Senate committee finding (2024)","internal data showed Amazon's injury rates roughly double the warehouse industry average"]],"rd":"Amazon raised its US starting wage to $15 an hour in 2018, ahead of most of its competitors, and simultaneously built the most closely measured workplace in modern retail: rates tracked by the minute, time-off-task flagged automatically, and injury rates that a 2024 US Senate committee investigation found ran at roughly double the warehouse industry average using the company's own internal records. It has also fought union drives hard, and uses a web of delivery subcontractors who carry the employment risk.\nSeparately it was for years the standard example in the European tax debate, routing EU sales through Luxembourg.","mn":"A higher hourly wage can still come with a body that wears out faster and no collective way to push back, which is why pay alone is a poor measure of what work costs you.","pt":["p5","p2"],"sr":[["US Senate HELP Committee majority staff report on Amazon warehouse injuries (2024)","https://www.help.senate.gov/imo/media/doc/amazon_investigation.pdf"],["NPR on the Senate HELP committee's Amazon injury findings (Dec 2024)","https://www.npr.org/2024/12/16/nx-s1-5230240/amazon-injury-warehouse-senate-investigation"]],"i":10},{"id":"mcdonalds","n":"McDonald's","t":"corp","lat":41.8865,"lon":-87.653,"pl":"Chicago, Illinois, United States","ad":"110 North Carpenter Street, Chicago, IL 60607","ro":"The franchise model that keeps wage liability at arm's length from the brand that sets the terms.","who":"Chris Kempczinski, president and chief executive","rch":"global","mx":["wage","law"],"fg":[["GAO finding (2020)","among the top five employers of Medicaid and SNAP recipients in 13 of 15 reporting state agencies"],["US restaurants","around 30,000 of its US outlets are franchises, not company-owned"]],"rd":"McDonald's dictates the recipes, the uniforms, the prices on the board and the layout of the kitchen, but roughly nine in ten of its American restaurants are owned by franchisees — and franchisees, not McDonald's, are the legal employer. When workers have tried to bargain with the company that actually controls the work, the answer has been that it is not their employer. The industry fought the ‘joint employer’ standard that would have changed this through three US administrations.\nThe company has also been one of the steadiest funders of the campaign against minimum-wage increases, through the National Restaurant Association.","mn":"Franchising lets the company that decides how the work is done avoid being responsible for what the work pays.","pt":["p3","p5"],"sr":[["GAO-21-45 (2020)","https://www.gao.gov/products/gao-21-45"],["National Labor Relations Board (joint-employer standard rulemaking and litigation)","https://www.nlrb.gov/"]],"i":11},{"id":"nestle","n":"Nestlé","t":"corp","lat":46.459,"lon":6.852,"pl":"Vevey, Switzerland","ad":"Avenue Nestlé 55, 1800 Vevey","ro":"The world's largest food company; a principal buyer in the cocoa, coffee and dairy chains where farm incomes are set.","who":"Philipp Navratil, chief executive (since September 2025)","rch":"global","mx":["chain","price","wage"],"fg":[["Farmer share of a chocolate bar","roughly 6–8% of retail value"],["Côte d'Ivoire farmgate price","1,200 CFA francs/kg after the 2026 cut, against a living-income reference price of 1,758 CFA francs/kg"],["Fairtrade finding (2025)","76% of Ivorian cocoa farmers studied still earned below a living income"]],"rd":"Cocoa grows in Côte d'Ivoire and Ghana, which between them supply around 60% of the world's beans, and is eaten mostly in Europe and North America. The farmer receives something on the order of 6–8% of what the finished bar sells for. In 2025 Côte d'Ivoire set a record farmgate price of 2,800 CFA francs a kilo on the back of a global price spike; by 2026, as prices fell, it cut that to 1,200 — while Fairtrade's own calculation of what a farming household needs stood at 1,758.\nNestlé does not set the Ivorian farmgate price; the state does. But the handful of companies that buy nearly all the crop set the price the state can afford to pay, and they have resisted binding commitments to a living income for three decades.","mn":"The gap between what a cocoa farmer earns and what a chocolate bar costs is not a mystery of distance or shipping — it is a price negotiated between a few very large buyers and farmers who have no one else to sell to.","pt":["p5"],"sr":[["Fairtrade International, new Living Income Reference Prices for cocoa (2026)","https://www.fairtrade.net/uk-en/get-involved/resources/media-centre/fairtrade-announces-new-living-income-reference-prices-for-cocoa.html"],["Fairtrade cocoa household income study 2025","https://www.fairtrade.net/content/dam/fairtrade/fairtrade-international/library/2025/cocoa-household-income/Fairtrade-cocoa-household-income-study-2025-at-a-glance.pdf"]],"i":12},{"id":"cargill","n":"Cargill","t":"corp","lat":44.969,"lon":-93.473,"pl":"Wayzata, Minnesota, United States","ad":"15407 McGinty Road West, Wayzata, MN 55391","ro":"The largest privately held company in America; stands between most of the world's farmers and most of the world's food buyers.","who":"Brian Sikes, president and chief executive; owned by about 160 members of the Cargill and MacMillan families","rch":"global","mx":["chain","price","own"],"fg":[["Ownership","private; roughly 90% held by the Cargill–MacMillan family"],["Role","one of the small group of traders handling the bulk of global grain, oilseed and cocoa flows"]],"rd":"Cargill publishes almost nothing it is not required to publish, because it has no outside shareholders to answer to. It buys grain, soy, palm oil, cocoa and meat from farmers and sells to processors and retailers, and in most of those markets only a few firms do the same job. That position lets it see the whole market — harvests, freight, demand — while the farmer at one end and the shopper at the other see only their own price.\nIt has been a defendant in US litigation over child labour in Ivorian cocoa supply chains (the Supreme Court held in 2021 that the specific claims could not be brought under the Alien Tort Statute, without ruling on the underlying conduct) and a repeated subject of deforestation findings in Brazil and Indonesia.","mn":"When a handful of private firms stand between every farmer and every buyer, they set both the price the farmer gets and the price you pay, and neither of you can see the other's number.","pt":["p5"],"sr":[["Nestlé USA v. Doe / Cargill v. Doe, 593 U.S. ___ (2021)","https://www.supremecourt.gov/opinions/20pdf/19-416_i4dj.pdf"],["Mighty Earth, reports on Cargill supply chains","https://www.mightyearth.org/"]],"i":13},{"id":"glencore","n":"Glencore","t":"corp","lat":47.195,"lon":8.52,"pl":"Baar, Switzerland","ad":"Baarermattstrasse 3, 6340 Baar","ro":"Mining and commodity trading house convicted of bribery on three continents.","who":"Gary Nagle, chief executive (to 2026); Kalidas Madhavpeddi, chairman","rch":"global","mx":["price","chain","law"],"fg":[["US resolutions (2022)","over $1.1 billion in fines, forfeiture and disgorgement; guilty pleas to FCPA conspiracy and market manipulation"],["UK sentence (3 Nov 2022)","£280,965,092 — the largest penalty ever ordered in a UK corporate criminal conviction"],["Bribes proven in the UK case","$29 million paid for preferential access to African oil"]],"rd":"In 2022 Glencore pleaded guilty in the United States to conspiring to violate the Foreign Corrupt Practices Act and to manipulating fuel-oil prices, paying more than $1.1 billion. In November the same year a London court fined it £281 million after the Serious Fraud Office proved it had paid $29 million in bribes to officials in five African countries to get cheaper crude — the first time a company was convicted in Britain of authorising bribery rather than merely failing to prevent it. The judge called the corruption endemic. US prosecutors said the payments were made with the approval and encouragement of top executives.\nThe commodities in question — copper and cobalt from the Democratic Republic of the Congo, oil from West Africa — come from countries whose public revenues depend on exactly the prices and terms that were being rigged.","mn":"Corruption at this scale is not a side effect of resource wealth; it is how a country with minerals under its soil ends up with the minerals gone and the money somewhere else.","pt":["p5","p9"],"sr":[["Glencore fined £281m after the Serious Fraud Office prosecution (November 2022)","https://www.theguardian.com/business/2022/nov/03/glencore-fined-281m-bribery-oil-africa"],["US DOJ: Glencore entered guilty pleas to foreign bribery and market manipulation schemes","https://www.justice.gov/opa/pr/glencore-entered-guilty-pleas-foreign-bribery-and-market-manipulation-schemes"]],"i":14},{"id":"apple","n":"Apple","t":"corp","lat":37.3349,"lon":-122.009,"pl":"Cupertino, California, United States","ad":"One Apple Park Way, Cupertino, CA 95014","ro":"The most valuable company in the world; the standard case study in both contract manufacturing and corporate tax structuring.","who":"Tim Cook, chief executive","rch":"global","mx":["tax","chain","wage"],"fg":[["EU Court of Justice (10 Sep 2024)","final ruling that Ireland granted Apple unlawful state aid; €13 billion plus interest recovered"],["Effective tax rate found by the Commission","as low as 0.005% on European profits in 2014"]],"rd":"Apple designs in California, manufactures through contractors in China, Vietnam and India, and for years booked the profits in Ireland through two companies that were, for tax purposes, resident nowhere. The European Commission found this amounted to illegal state aid; after eight years of appeals the EU's highest court agreed in September 2024, and Ireland collected about €13 billion plus interest. The Commission's finding was that the arrangement had at one point taxed European profits at 0.005%.\nAt the other end of the chain, the assembly work sits with firms like Foxconn, where wages, hours and dormitory conditions are set by the price Apple pays per unit.","mn":"The most profitable company on earth paid a smaller share of its European profits in tax than a cashier pays on a sandwich, and it was legal until a court said otherwise.","pt":["p2","p5"],"sr":[["Court of Justice of the EU, Commission v Ireland and Apple (C-465/20 P) — case file","https://curia.europa.eu/juris/liste.jsf?num=C-465/20"],["European Commission state aid decision on Apple","https://ec.europa.eu/commission/presscorner/detail/en/IP_16_2923"]],"i":15},{"id":"foxconn","n":"Hon Hai Precision (Foxconn)","t":"corp","lat":24.991,"lon":121.445,"pl":"New Taipei City, Taiwan","ad":"No. 66, Zhongshan Road, Tucheng District, New Taipei City 236","ro":"The world's largest contract manufacturer; where the brand's price per unit becomes somebody's shift.","who":"Young Liu, chairman and chief executive","rch":"global","mx":["wage","mob","chain"],"fg":[["Workforce","over a million workers at peak production in China"],["Reported practice","heavy reliance on student and dispatch (agency) workers, documented repeatedly by China Labor Watch and SACOM"]],"rd":"Foxconn assembles for Apple, Dell, HP, Sony and Nintendo. Its factories are cities — Zhengzhou's iPhone plant has housed hundreds of thousands of workers — and its margins are thin, because the brands bid the assembly price down. What absorbs that pressure is overtime, agency hiring and the pace of the line. A cluster of worker suicides at Shenzhen in 2010 drew global attention and nets were strung between buildings; auditors and labour groups have continued to document excessive overtime and large use of temporary workers since.\nThe decisive numbers are not set in Taiwan. They are set in the purchase order.","mn":"The company whose logo is on the phone decides what the phone can cost to build, and the company that builds it can only meet that number through the hours and bodies of the people on the line.","pt":["p5"],"sr":[["China Labor Watch, investigations of Foxconn facilities","https://chinalaborwatch.org/"],["World Bank StAR asset recovery database — Glencore case","https://star.worldbank.org/asset-recovery-watch-database/glencore-case"]],"i":16},{"id":"inditex","n":"Inditex (Zara)","t":"corp","lat":43.306,"lon":-8.508,"pl":"Arteixo, Galicia, Spain","ad":"Avenida de la Diputación s/n, 15142 Arteixo, A Coruña","ro":"The largest fashion retailer; a lead buyer in the garment countries where the industry's wage floor is set.","who":"Óscar García Maceiras, chief executive; Amancio Ortega, founder and largest shareholder","rch":"global","mx":["chain","wage"],"fg":[["Bangladesh RMG minimum wage","12,500 taka a month (about $101) since December 2023"],["Worker demand, November 2026","30,000 taka a month"],["Industry scale","garments are over 80% of Bangladesh's export earnings and employ more than 4 million people"]],"rd":"Bangladesh's garment minimum wage was set at 12,500 taka a month in December 2023 after protests. By November 2026, with inflation above 8% and the taka down to about 125 to the dollar, that wage was worth roughly $101 a month and workers were back in the streets of Dhaka demanding 30,000. Brands including Zara's owner Inditex, H&M, Gap, Primark and Walmart buy from these factories; a Reuters investigation in November 2026 found workers cutting back on food and medical care.\nBrands sign codes of conduct on living wages and then place orders at prices that assume the legal minimum. The wage board that sets the minimum is a national body, but it negotiates against the certainty that orders move to Vietnam or Cambodia if the number rises too far.","mn":"The price of a t-shirt is held down by a wage that a government sets while watching whether the orders will leave, which means the brands never have to be the ones who say no.","pt":["p5"],"sr":[["'Going hungry': Garment workers in Bangladesh say wages barely cover needs (Al Jazeera, Nov 2026)","https://aljazeera.com/news/2026/11/3/going-hungry-garment-workers-in-bangladesh-say-wages-barely-cover-needs"],["Behind Bangladesh's garment boom, workers cut food, healthcare as wages fall short (Reuters)","https://en.prothomalo.com/bangladesh/jl3ui1r286"]],"i":17},{"id":"uber","n":"Uber","t":"corp","lat":37.77,"lon":-122.389,"pl":"San Francisco, California, United States","ad":"1725 Third Street, San Francisco, CA 94158","ro":"Wrote the legal category that lets a company direct your work without employing you — and then bought it into law.","who":"Dara Khosrowshahi, chief executive","rch":"global","mx":["wage","law","mob"],"fg":[["California Proposition 22 (2020)","about $200 million spent by Uber, Lyft, DoorDash, Instacart and Postmates — the most expensive ballot measure campaign in state history"],["UK Supreme Court (2021)","ruled unanimously that Uber drivers are workers entitled to minimum wage and holiday pay"],["EU Platform Work Directive (2024)","adopted, introducing a presumption of employment"]],"rd":"Uber's drivers are told where demand is, what the fare will be, and are rated and deactivated by the company — but are classified as independent contractors, so they carry the costs of the car, the fuel, the insurance and the empty hours. California's legislature closed that gap in 2019; the platforms spent roughly $200 million on Proposition 22 in 2020 to reopen it, and won. The UK Supreme Court went the other way in 2021, and the EU adopted a directive presuming employment in 2024.\nThe model has since spread well beyond ride-hailing — to delivery, care work, warehousing and translation.","mn":"If a company can control how you work without being your employer, every protection attached to employment — minimum wage, sick pay, a pension, the right to organise — simply does not apply to you.","pt":["p3","p7"],"sr":[["Uber BV v Aslam, UK Supreme Court [2021] UKSC 5","https://www.supremecourt.uk/cases/uksc-2019-0029.html"],["California Proposition 22 (2020) — result and campaign spending","https://ballotpedia.org/California_Proposition_22,_App-Based_Drivers_as_Contractors_and_Labor_Policies_Initiative_(2020)"]],"i":18},{"id":"dollargeneral","n":"Dollar General","t":"corp","lat":36.323,"lon":-86.713,"pl":"Goodlettsville, Tennessee, United States","ad":"100 Mission Ridge, Goodlettsville, TN 37072","ro":"The retail form that follows poverty into places other shops have left.","who":"Todd Vasos, chief executive","rch":"national","mx":["wage","price"],"fg":[["Stores","more than 20,000 across the United States"],["OSHA enforcement","over $21 million in proposed penalties since 2017 for repeated store safety violations, including blocked exits"],["Executive Excess 2026 (IPS)","CEO-to-worker pay ratio at the 100 lowest-paying S&P 500 firms averaged 614 to 1 in 2025"]],"rd":"Dollar General opens where grocery stores have closed, in rural counties and poor urban neighbourhoods, with small staffs and narrow aisles. Federal safety inspectors have cited it repeatedly for blocked fire exits and stock piled in walkways, with proposed penalties passing $21 million. Research on ‘dollar store’ expansion has found it can crowd out independent grocers, which leaves a community with more shelf space and less fresh food.\nIt sits near the top of the list of American employers whose median worker pay is lowest, in an economy where the Institute for Policy Studies found the lowest-paying large firms averaged a 614-to-1 gap between chief executive and median worker in 2025.","mn":"Shops built around poverty make poverty cheaper to live in and harder to leave, because the alternative — a grocer with fresh food — cannot survive next door.","pt":["p5"],"sr":[["US Department of Labor OSHA enforcement against Dollar General","https://www.dol.gov/newsroom/releases/osha"],["Institute for Policy Studies, Executive Excess 2026","https://ips-dc.org/report-executive-excess-2026/"]],"i":19},{"id":"anglo","n":"Anglo American / De Beers","t":"corp","lat":51.52,"lon":-0.103,"pl":"London, United Kingdom","ad":"17 Charterhouse Street, London EC1N 6RA","ro":"The company built on South African mineral wealth and the migrant labour system that supplied it.","who":"Duncan Wanblad, chief executive of Anglo American","rch":"global","mx":["wage","mob","disc"],"fg":[["South Africa's Gini coefficient","about 0.63 — the highest recorded of any sizeable country"],["Richest 1% of South Africans","held 54.9% of national wealth in 2024, up from just under half in 1994 (Oxfam South Africa)"]],"rd":"South Africa's mining industry was built on a system that recruited Black workers from distant rural areas and the neighbouring protectorates, housed them in single-sex compounds, paid them a fraction of white wages and required a pass to move. Anglo American and De Beers were at the centre of it. Apartheid ended in 1994; the geography it created — labour-sending districts with no economy of their own, townships an hour's commute from the work — did not. In 2012 police shot 34 striking platinum miners at Marikana, at a mine then owned by Lonmin.\nToday South Africa has the most unequal measured distribution of income in the world, and Oxfam South Africa found in 2026 that the richest 1% hold nearly 55% of the country's wealth, more than in 1994.","mn":"A wage system designed to make labour cheap can be abolished by law and still decide, two generations later, who lives near the work and who spends a fifth of their wage getting to it.","pt":["p7","p12"],"sr":[["Oxfam South Africa, 'Hoarded Wealth, Dignity Denied' (2026)","https://www.oxfam.org.za/hoarded-wealth-dignity-denied-confronting-the-countrys-extreme-wealth-and-inequality-emergency/"],["Marikana Commission of Inquiry report","https://www.gov.za/sites/default/files/gcis_document/201506/marikana-report-1.pdf"]],"i":20},{"id":"bechtel","n":"Bechtel","t":"corp","lat":38.954,"lon":-77.351,"pl":"Reston, Virginia, United States","ad":"12011 Sunset Hills Road, Reston, VA 20190","ro":"The engineering firm whose Bolivian water contract became the textbook case of privatising a necessity.","who":"Brendan Bechtel, chairman and chief executive; privately held by the Bechtel family","rch":"global","mx":["priv","price"],"fg":[["Cochabamba, 1999–2000","water system leased to Aguas del Tunari, a Bechtel-led consortium; bills rose sharply within weeks"],["ICSID claim","$50 million sought from Bolivia; withdrawn in 2006 for a token payment after international campaigning"]],"rd":"In 1999 Bolivia, under World Bank pressure to privatise, leased Cochabamba's water to a consortium led by Bechtel. Water bills rose immediately, in some households to a fifth of a minimum wage, and a law was passed that even appeared to cover rainwater collection. The city rose; after months of protest and one death, the contract was cancelled in April 2000. Bechtel then sued Bolivia for $50 million at the World Bank's own arbitration tribunal, ICSID, and dropped the claim in 2006 after a global campaign.\nThe episode is the clearest illustration of a wider pattern: a necessity is handed to a private operator on terms that guarantee a return, and when citizens overturn it, the state pays for the overturning.","mn":"Privatising water, power or transport turns a thing you cannot refuse to buy into someone's guaranteed income, and the contract is usually written so that undoing it costs the public too.","pt":["p8","p4"],"sr":[["Aguas del Tunari v. Bolivia (ICSID Case No. ARB/02/3)","https://icsid.worldbank.org/cases/case-database/case-detail?CaseNo=ARB/02/3"],["The Democracy Center (Cochabamba water revolt archive)","https://democracyctr.org/"]],"i":21},{"id":"veolia","n":"Veolia","t":"corp","lat":48.907,"lon":2.387,"pl":"Aubervilliers, France","ad":"30 rue Madeleine Vionnet, 93300 Aubervilliers","ro":"The largest private water operator; the firm on the other side of most municipal water contracts.","who":"Estelle Brachlianoff, chief executive","rch":"global","mx":["priv","price"],"fg":[["Remunicipalisations","more than 300 cities worldwide have taken water services back into public hands since 2000 (TNI/PSIRU count)"],["Paris","returned its water to public operation in 2010 and cut bills"]],"rd":"Veolia and its French rival Suez (which Veolia largely absorbed in 2022) run water and waste systems for cities across Europe, Africa, Asia and the Americas. The pattern researchers have documented is consistent: a long concession, tariff formulas indexed to guarantee a return, capital spending deferred, and a dispute when the city wants out. Paris, Berlin, Buenos Aires, Jakarta and Atlanta are among the places that took services back, usually citing price rises and underinvestment.\nWater is the hardest case for market logic because you cannot consume less of it than you need.","mn":"Services everyone must buy and nobody can shop around for are exactly the services where a private owner can raise the price without losing a customer.","pt":["p8"],"sr":[["Transnational Institute, 'Reclaiming Public Services' (remunicipalisation database)","https://www.tni.org/en/publication/reclaiming-public-services"],["Transnational Institute research on public services and remunicipalisation","https://www.tni.org/en/topic/public-services"]],"i":22},{"id":"freeport","n":"Freeport-McMoRan","t":"corp","lat":33.45,"lon":-112.074,"pl":"Phoenix, Arizona, United States","ad":"333 North Central Avenue, Phoenix, AZ 85004","ro":"Operator of the Grasberg mine in West Papua, one of the largest gold and copper deposits on earth.","who":"Kathleen Quirk, president and chief executive","rch":"global","mx":["chain","disc","own"],"fg":[["Grasberg","among the world's largest gold reserves; mined since 1973 under a contract signed with the Suharto government"],["Papua","the provinces containing the mine remain among the poorest in Indonesia on most development measures"]],"rd":"Grasberg sits in the highlands of West Papua, on land belonging to the Amungme and Kamoro peoples, who were not meaningfully consulted when the contract was signed in 1967 with a government that had taken the territory by a vote the UN registered and most Papuans dispute. Since then the mine has produced extraordinary quantities of copper and gold, dumped tailings into the Ajkwa river system, and been protected by Indonesian security forces that Freeport has acknowledged paying. The surrounding provinces remain the poorest in the country.\nIndonesia has since taken a majority stake, so the revenue split has changed. The distribution on the ground has not.","mn":"Mineral wealth under a community's land does not become that community's wealth unless somebody writes it into the contract, and in 1967 nobody did.","pt":["p9"],"sr":[["Amnesty International reporting on Grasberg and West Papua","https://www.amnesty.org/en/location/asia-and-the-pacific/south-east-asia-and-the-pacific/indonesia/"],["Freeport-McMoRan disclosures on payments to Indonesian security forces (SEC filings)","https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=FCX"]],"i":23},{"id":"pwc","n":"PwC","t":"enab","lat":51.507,"lon":-0.123,"pl":"London, United Kingdom","ad":"1 Embankment Place, London WC2N 6RH","ro":"One of four accounting firms that design, sell and audit the structures that move profit out of reach.","who":"Mohamed Kande, global chairman","rch":"global","mx":["tax","law"],"fg":[["LuxLeaks (2014)","548 leaked private tax rulings PwC obtained from Luxembourg for over 340 companies"],["Australia (2023)","confidential government tax-law briefings leaked to clients; the Australian consulting arm was sold for $1 to settle the crisis"]],"rd":"In 2014 a PwC employee leaked 28,000 pages showing the firm had obtained 548 private rulings from Luxembourg's tax authority for more than 340 multinationals, confirming in advance that elaborate internal loans and licence fees would be accepted. The companies paid, in some cases, under 1% on profits routed through the Grand Duchy. The whistleblower, Antoine Deltour, was prosecuted in Luxembourg; the firm was not.\nIn 2023 the Australian Senate found PwC partners had taken confidential briefings on new anti-avoidance law and used them to help clients get ahead of it.","mn":"The same small group of firms audits the accounts that governments rely on and sells the schemes that empty them, and it is paid far better for the second job.","pt":["p2","p10"],"sr":[["ICIJ, Luxembourg Leaks","https://www.icij.org/investigations/luxembourg-leaks/"],["Australian Senate inquiry into the PwC tax leaks scandal","https://www.aph.gov.au/Parliamentary_Business/Committees/Senate/Finance_and_Public_Administration/Consultingservices"]],"i":24},{"id":"kpmg","n":"KPMG","t":"enab","lat":51.5045,"lon":-0.018,"pl":"London, United Kingdom","ad":"15 Canada Square, London E14 5GL","ro":"Auditor and adviser at the centre of South Africa's state capture findings.","who":"Bill Thomas, global chairman and chief executive","rch":"global","mx":["tax","priv"],"fg":[["South Africa (2017–22)","withdrew the conclusions of its SARS 'rogue unit' report; named repeatedly in the Zondo Commission on state capture"],["Gupta accounts","audited Gupta-linked companies for 15 years before resigning the work"]],"rd":"KPMG audited the Gupta family's South African businesses for fifteen years and produced a report used to dismantle the senior leadership of the country's tax authority. In 2017 it withdrew the report's conclusions and apologised; the Zondo Commission later described the firm's role in the hollowing out of the South African state. The revenue service it helped damage was the body responsible for collecting tax from the wealthy.\nAcross the Big Four the pattern repeats — EY and Wirecard in Germany, Deloitte and multiple audit failures in Britain — because the client pays for the audit.","mn":"If the institution that collects tax from the rich can be broken with the help of an accounting firm, everything downstream — schools, clinics, pensions — is paid for by everyone else.","pt":["p2","p10"],"sr":[["Judicial Commission of Inquiry into State Capture (Zondo Commission) reports","https://www.statecapture.org.za/site/information/reports"],["KPMG withdraws findings of its SARS report and apologises (Guardian, Sept 2017)","https://www.theguardian.com/world/2017/sep/15/kpmg-south-africa-gupta-report"]],"i":25},{"id":"mckinsey","n":"McKinsey & Company","t":"enab","lat":40.7555,"lon":-73.9995,"pl":"New York, United States","ad":"1 Manhattan West, 395 9th Avenue, New York, NY 10001","ro":"The consultancy that turns ‘cut labour cost’ into a board-approved plan.","who":"Bob Sternfels, global managing partner","rch":"global","mx":["wage","priv","law"],"fg":[["South Africa","repaid about R1 billion (roughly $70m) in Eskom and Transnet fees after state capture findings"],["ICE contract (2018)","internal proposals to cut spending on detainees' food and medical care, reported by ProPublica and the New York Times"]],"rd":"McKinsey's product is advice, which makes its footprint hard to trace and its influence easy to underestimate. Its recommendations have shaped restructurings, offshoring programmes and public-sector ‘efficiency’ drives across dozens of countries. It repaid about a billion rand to South Africa's power and rail utilities after inquiries into contracts arranged through a Gupta-linked partner. In the United States it advised Immigration and Customs Enforcement on detention spending, including proposals to reduce outlays on food and medical care for detainees.\nWhat a consultancy supplies to a board is not only a method but cover: an outside name on the decision to cut.","mn":"Decisions that fall on workers are easier for executives to make when a respected outside firm has already written them down as best practice.","pt":["p8","p11"],"sr":[["Judicial Commission of Inquiry into State Capture (Zondo Commission) reports","https://www.statecapture.org.za/site/information/reports"],["ProPublica and the New York Times, 'How McKinsey Helped the Trump Administration Carry Out Its Immigration Policies'","https://www.propublica.org/article/how-mckinsey-helped-the-trump-administration-implement-its-immigration-policies"]],"i":26},{"id":"csc","n":"The Corporation Trust Center","t":"enab","lat":39.747,"lon":-75.549,"pl":"Wilmington, Delaware, United States","ad":"1209 North Orange Street, Wilmington, DE 19801","ro":"A single-storey building that is the legal address of hundreds of thousands of companies.","who":"Operated by CSC (Corporation Service Company)","rch":"global","mx":["tax","law"],"fg":[["Companies registered at this address","reported at more than 285,000"],["Delaware incorporations","around two-thirds of Fortune 500 companies are incorporated in the state"]],"rd":"Delaware's business is law. Its courts are fast and predictable, its corporate statute is written with the advice of the corporate bar, and until recently it required almost nothing about who actually owns a company. 1209 North Orange Street is the registered agent's address for hundreds of thousands of entities, which is why it has appeared on filings next to the names of multinationals, shell companies and sanctioned fortunes alike.\nThe state collects fees rather than taxes on this traffic: franchise taxes and incorporation fees fund a large share of Delaware's budget, paid by companies whose profits are earned and whose workers live somewhere else.","mn":"A company can be a legal resident of a filing cabinet in Delaware while its profits come from your town, which is how it stops owing your town anything.","pt":["p10","p2"],"sr":[["Tax Justice Network, Financial Secrecy Index — United States","https://fsi.taxjustice.net/country-detail/#country=US"],["Delaware Division of Corporations annual reports","https://corp.delaware.gov/stats/"]],"i":27},{"id":"sdtrusts","n":"South Dakota trust industry","t":"enab","lat":43.5468,"lon":-96.7295,"pl":"Sioux Falls, South Dakota, United States","ad":"South Phillips Avenue, Sioux Falls, SD 57104","ro":"The place that abolished the time limit on inherited wealth.","who":"Trust companies including Trident Trust's Sioux Falls office; trust law drafted with industry task-force input and passed by the state legislature","rch":"global","mx":["inh","tax"],"fg":[["Perpetual trusts","South Dakota abolished the rule against perpetuities in 1983, the first US state to do so"],["Trust assets held in the state","about $360 billion, more than quadrupled in a decade (Pandora Papers)"],["Pandora Papers","81 of the trusts identified in the leak were in South Dakota; 206 US trusts held over $1 billion linked to 41 countries"]],"rd":"For centuries English and American law said a trust had to end — the ‘rule against perpetuities’ meant a dynasty could tie up property for a few generations, not forever. In 1983 South Dakota deleted it. A trust set up in Sioux Falls can now hold assets indefinitely, pays no state income tax, seals its court records permanently, and in some circumstances protects assets from creditors and ex-spouses. Year after year the legislature has passed refinements drafted by the industry itself.\nThe Pandora Papers found trusts there linked to families accused of fraud, bribery and abuse of sugar-cane workers, alongside American dynasties including Pritzker and Wrigley heirs. Assets in state trusts rose from $57 billion to about $360 billion in a decade.","mn":"An inheritance tax only works if the wealth has to pass to somebody; a perpetual trust means it never passes at all, so it never gets taxed again.","pt":["p12","p10"],"sr":[["ICIJ, Pandora Papers: US trusts and South Dakota","https://www.icij.org/investigations/pandora-papers/us-trusts-offshore-south-dakota-tax-havens/"],["Axios, 'How South Dakota became a global tax haven'","https://www.axios.com/2021/10/06/south-dakota-global-tax-haven"]],"i":28},{"id":"sdcapitol","n":"South Dakota State Capitol","t":"state","lat":44.368,"lon":-100.336,"pl":"Pierre, South Dakota, United States","ad":"500 East Capitol Avenue, Pierre, SD 57501","ro":"Where the trust laws are actually written and passed.","who":"South Dakota Legislature; Governor Larry Rhoden","rch":"global","mx":["inh","law"],"fg":[["Trust Task Force","a standing industry group whose draft bills are reliably enacted"],["Court secrecy","trust records sealed permanently"]],"rd":"The reason South Dakota matters is not its banks but its statute book. A small legislature in a state of under a million people passes, almost without dissent, the provisions that an industry task force brings it, and those provisions then govern fortunes from São Paulo to Hong Kong. There is no state income tax to lose and a few hundred financial-services jobs to gain.\nIt is the clearest working example of a wider mechanism: when capital can choose which jurisdiction's law applies to it, the jurisdiction with the fewest residents and the least to lose sets the rules for everyone.","mn":"Any one state can sell a loophole to the whole world, and the people who lose the tax revenue never get to vote in that state's elections.","pt":["p12","p3"],"sr":[["ICIJ, Pandora Papers: South Dakota","https://www.icij.org/investigations/pandora-papers/us-trusts-offshore-south-dakota-tax-havens/"],["South Dakota Codified Laws, Title 55 (Fiduciaries and Trusts)","https://sdlegislature.gov/Statutes/55"]],"i":29},{"id":"ugland","n":"Ugland House","t":"enab","lat":19.292,"lon":-81.384,"pl":"George Town, Cayman Islands","ad":"121 South Church Street, George Town, Grand Cayman KY1-1104","ro":"A five-storey office that is the registered address of tens of thousands of companies.","who":"Offices of the law firm Maples Group","rch":"global","mx":["tax"],"fg":[["Companies registered at the address","around 19,000 at the time of a 2008 US GAO review"],["Cayman Islands","consistently near the top of the Corporate Tax Haven Index"],["Corporate tax rate","zero"]],"rd":"The Cayman Islands charge no corporate income tax, no capital gains tax and no inheritance tax, and host more registered investment funds than almost anywhere. Ugland House became famous when a US president named it in a speech about tax avoidance; the firm's answer was that having a registered address is not the same as doing business there, which is exactly the point. A fund can be managed in New York, invest in Germany and be resident in Cayman.\nThe territory is a British Overseas Territory, which places it inside the network the Tax Justice Network calls the UK's second empire — responsible, with the Crown Dependencies, for a large share of global corporate tax losses.","mn":"Profit made by people working in one country can be legally located in a building where nobody works, and the tax that would have paid for their roads and schools goes nowhere.","pt":["p10","p2"],"sr":[["US GAO, 'Cayman Islands: Business and Tax Advantages' (GAO-08-778)","https://www.gao.gov/products/gao-08-778"],["Tax Justice Network, Corporate Tax Haven Index","https://cthi.taxjustice.net/"]],"i":30},{"id":"luxembourg","n":"Luxembourg Ministry of Finance","t":"state","lat":49.61,"lon":6.129,"pl":"Luxembourg City, Luxembourg","ad":"3 rue de la Congrégation, L-1352 Luxembourg","ro":"An EU member state that sold private tax rulings to hundreds of multinationals.","who":"Gilles Roth, Minister of Finance","rch":"global","mx":["tax"],"fg":[["LuxLeaks","548 advance tax agreements for 340+ companies, 2002–2010"],["Effective rates obtained","under 1% on profits routed through Luxembourg in some arrangements"],["Fiat / Amazon / Engie","all subjects of EU state aid decisions on Luxembourg rulings"]],"rd":"Luxembourg has 680,000 people and one of the largest investment-fund industries on earth. For years its tax authority issued confidential advance rulings telling companies in writing that their internal loan and royalty structures would be accepted, which converted an aggressive scheme into a certainty. Jean-Claude Juncker was prime minister and finance minister through most of that period and went on to become President of the European Commission — the body that then ruled against several of those arrangements.\nThe losses fall on the countries where the sales and the staff actually are.","mn":"One small EU country can offer the whole continent's profits a near-zero tax rate, and the hospitals that lose the money are in the countries that lost the profit.","pt":["p2","p10"],"sr":[["ICIJ, Luxembourg Leaks","https://www.icij.org/investigations/luxembourg-leaks/"],["European Commission state aid decisions (Fiat, Amazon, Engie)","https://competition-cases.ec.europa.eu/search?caseInstrument=SA"]],"i":31},{"id":"ireland","n":"Department of Finance, Ireland","t":"state","lat":53.338,"lon":-6.25,"pl":"Dublin, Ireland","ad":"Government Buildings, Upper Merrion Street, Dublin 2","ro":"The state that built a growth model on being where other countries' profits are booked.","who":"Paschal Donohoe, Minister for Finance","rch":"global","mx":["tax"],"fg":[["Apple ruling","€13 billion plus interest ordered recovered by the EU Court of Justice, 10 September 2024"],["Headline corporate rate","12.5%; 15% minimum for large groups from 2024"],["'Double Irish'","closed to new entrants in 2015, with transition until 2020"]],"rd":"Ireland's low corporate rate and its tolerance for companies that were, for tax purposes, resident nowhere, drew the European headquarters of a large part of the American technology and pharmaceutical industries. The arrangement brought real jobs to Dublin and Cork. It also meant that profits earned from customers in France, Italy and Poland were taxed, if at all, in Ireland. Ireland spent eight years and considerable public money appealing the Apple decision — arguing against receiving €13 billion — because the ruling threatened the model.\nThe state lost in September 2024 and took the money.","mn":"When countries compete to host profits rather than production, the winner collects a small slice of a very large number and everyone else collects nothing.","pt":["p2"],"sr":[["Court of Justice of the EU, Commission v Ireland and Apple (C-465/20 P) — case file","https://curia.europa.eu/juris/liste.jsf?num=C-465/20"],["Tax Justice Network, Corporate Tax Haven Index","https://cthi.taxjustice.net/"]],"i":32},{"id":"netherlands","n":"Ministry of Finance, Netherlands","t":"state","lat":52.081,"lon":4.317,"pl":"The Hague, Netherlands","ad":"Korte Voorhout 7, 2511 CW The Hague","ro":"The conduit: a dense treaty network that lets money pass through almost untaxed on its way out.","who":"Minister of Finance of the Netherlands","rch":"global","mx":["tax"],"fg":[["Treaty network","among the world's largest, historically with very low or zero withholding on outbound royalties and interest"],["Conduit role","identified in academic network analysis as one of the main global conduit jurisdictions"],["Withholding tax","a conditional withholding tax on interest and royalties to low-tax jurisdictions introduced from 2021"]],"rd":"A conduit country does not need to be the final destination. Through a Dutch holding company, a royalty paid by a subsidiary in Nigeria or Brazil can leave for a zero-tax jurisdiction without being taxed on the way, because the treaty with the source country cuts the withholding tax that would otherwise apply. For developing countries this is the quieter and larger loss: not evasion, but treaties their own governments signed.\nThe Netherlands has since introduced withholding taxes on payments to low-tax jurisdictions and renegotiated some treaties, and remains a central node in the network.","mn":"A tax treaty signed decades ago can quietly hand away a poor country's right to tax the profits made inside its own borders.","pt":["p2","p9"],"sr":[["Garcia-Bernardo et al., 'Uncovering Offshore Financial Centers: Conduits and Sinks', Scientific Reports (2017)","https://www.nature.com/articles/s41598-017-06322-9"],["SOMO research on Dutch tax treaties and developing countries","https://www.somo.nl/"]],"i":33},{"id":"switzerland","n":"Swiss Federal Department of Finance","t":"state","lat":46.948,"lon":7.442,"pl":"Bern, Switzerland","ad":"Bundesgasse 3, 3003 Bern","ro":"The state that made banking secrecy a criminal-law protection and the global standard for hidden wealth.","who":"Karin Keller-Sutter, head of the Federal Department of Finance","rch":"global","mx":["tax","inh"],"fg":[["Banking Act 1934","made disclosure of client identity a criminal offence"],["Offshore household wealth","Switzerland remains the single largest host of foreign-owned private wealth"],["Automatic exchange","joined the OECD common reporting standard from 2017, with gaps for non-participating countries"]],"rd":"Article 47 of the 1934 Banking Act turned discretion into a criminal protection, and for seventy years Switzerland was where a fortune went to be unfindable. Automatic exchange of account information since 2017 has changed a great deal for residents of participating countries, and very little for residents of countries not in the system — which include many of the poorest, and those whose elites most need hiding.\nThe commodity traders in Geneva, Zug and Baar sit in the same jurisdiction, so the money and the trades that produce it are governed by the same discreet law.","mn":"Secrecy is not a neutral service: it decides whether a country can tax its own richest residents, and most poor countries still cannot.","pt":["p10"],"sr":[["Alstadsæter, Johannesen & Zucman, 'Who Owns the Wealth in Tax Havens?'","https://gabriel-zucman.eu/files/AJZ2018.pdf"],["Tax Justice Network, Financial Secrecy Index — Switzerland","https://fsi.taxjustice.net/country-detail/#country=CH"]],"i":34},{"id":"singapore","n":"Monetary Authority of Singapore","t":"state","lat":1.276,"lon":103.849,"pl":"Singapore","ad":"10 Shenton Way, MAS Building, Singapore 079117","ro":"Asia's wealth-management hub and the regional centre for family offices.","who":"Chia Der Jiun, managing director","rch":"global","mx":["tax","inh"],"fg":[["Single family offices","grew from a few dozen in 2018 to well over 1,000 by the mid-2020s"],["Assets under management","Singapore manages trillions in cross-border wealth"],["Estate duty","abolished in 2008"]],"rd":"Singapore has no inheritance tax, no capital gains tax, territorial taxation of foreign income for many structures, and an incentive regime that has pulled more than a thousand single family offices into the city in under a decade. Much of the money arriving is from elsewhere in Asia, including from countries whose public finances badly need it.\nThe state also runs one of the most effective public housing systems in the world, which is a reminder that these mechanisms are choices rather than laws of nature: the same government that houses 80% of its citizens also hosts the region's untaxed fortunes.","mn":"A country can give the very wealthy a permanent exemption from inheritance tax and still call itself meritocratic, because the exemption only shows up a generation later.","pt":["p12","p10"],"sr":[["MAS family office incentive schemes","https://www.mas.gov.sg/development/wealth-management"],["Tax Justice Network, Financial Secrecy Index — Singapore","https://fsi.taxjustice.net/country-detail/#country=SG"]],"i":35},{"id":"jersey","n":"Government of Jersey","t":"state","lat":49.186,"lon":-2.106,"pl":"St Helier, Jersey","ad":"19–21 Broad Street, St Helier, Jersey JE2 3RR","ro":"A Crown Dependency inside the network of British tax havens.","who":"Government of Jersey; Ministry for Treasury and Resources","rch":"global","mx":["tax"],"fg":[["UK network","the Crown Dependencies and Overseas Territories together account for roughly 23% of global corporate tax losses (Tax Justice Network)"],["Corporate rate","0% for most companies ('zero-ten')"]],"rd":"Jersey, Guernsey and the Isle of Man are not UK territory and not foreign countries; the British Crown is responsible for their defence and foreign relations while their tax law is their own. The arrangement lets London host the services, lawyers and banks while the zero rate sits ninety miles offshore. Add the Overseas Territories — Cayman, BVI, Bermuda — and the Tax Justice Network attributes about a quarter of the world's corporate tax losses to this one network.\nWhen the UK government is asked to intervene, the answer is that these are self-governing jurisdictions.","mn":"A rich country can run the world's largest tax-avoidance network and truthfully say the rules were written somewhere else.","pt":["p10","p2"],"sr":[["Tax Justice Network (research on the UK's network of tax havens)","https://taxjustice.net/"],["House of Lords Library, 'Tax implications of corporate profit shifting'","https://lordslibrary.parliament.uk/tax-implications-of-corporate-profit-shifting/"]],"i":36},{"id":"imf","n":"International Monetary Fund","t":"inst","lat":38.8988,"lon":-77.0435,"pl":"Washington, DC, United States","ad":"700 19th Street NW, Washington, DC 20431","ro":"Lender of last resort to governments, and the author of the conditions attached.","who":"Kristalina Georgieva, managing director; the United States holds the only single-country veto over major decisions","rch":"global","mx":["aust","debt","priv"],"fg":[["Oxfam analysis (2026)","of 28 countries with ongoing IMF programmes, 24 were required to implement austerity"],["Depth of cuts","median required consolidation of 1.7% of GDP for 2018–2025 loans, against 0.3% for 2012–2017"],["ActionAid (2023)","in 10 African countries studied, 8 had recently been told to cut or freeze public sector wage bills"],["Voting","the US holds about 16.5% of votes; an 85% supermajority is required for major changes"]],"rd":"When a country runs out of foreign currency, the IMF is usually the only lender left, and it attaches conditions. Those conditions are where inequality is manufactured at scale: caps on
