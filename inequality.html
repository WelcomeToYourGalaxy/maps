<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inequality Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cinzel:wght@500;600&display=swap">
<style>
:root{
  --bg:#0b1014;--card:rgba(12,18,22,.94);--line:#27363d;--line2:rgba(255,255,255,.07);
  --ink:#e6e4de;--mute:#9aa4a6;--accent:#3f6470;--accent-hi:#9dbdc0;--head:#f0ece4;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 'Marcellus',Georgia,serif;overflow:hidden}
#map{position:absolute;inset:0;background:#070d10}
.card{position:absolute;z-index:800;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.55);backdrop-filter:blur(6px)}
.scroll{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
body.lightbase{--card:rgba(248,246,241,.95);--line:#c7ccc9;--line2:rgba(0,0,0,.08);--ink:#1d2426;--mute:#5d6a6c;--accent:#3f6470;--accent-hi:#2b4b55;--head:#131a1c}
body.lightbase .card{box-shadow:0 10px 30px rgba(0,0,0,.18)}

/* glossary */
.gl{border-bottom:1px dotted var(--accent-hi);cursor:help}
.gl:hover{color:var(--head);border-bottom-style:solid}
#gtip{position:fixed;z-index:1400;max-width:300px;padding:7px 10px;font:13px/1.45 'Marcellus',Georgia,serif;
  background:var(--card);border:1px solid var(--line);border-radius:5px;color:var(--ink);
  box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;backdrop-filter:blur(6px)}
body.lightbase #gtip{box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* left key */
#key{top:12px;left:12px;width:338px;max-height:calc(100% - 24px);overflow:auto;padding:14px 16px;box-sizing:border-box}
#key h1{font:600 21px/1.15 'Cinzel','Marcellus',serif;margin:0 0 5px;letter-spacing:.6px;color:var(--head)}
#key .lede{color:var(--mute);margin:0 0 3px;font-size:12.6px}
#key .lede2{color:var(--mute);margin:0 0 10px;font-size:11.4px}
#key.min .body,#key.min .lede,#key.min .lede2{display:none}
.tog{display:inline-block;float:right;cursor:pointer;font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:1px 8px}
.tog:hover{border-color:var(--accent-hi)}
.psec{margin:15px 0 4px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent-hi)}
.flab{font-size:11.4px;color:var(--mute);margin:9px 0 2px;letter-spacing:.3px}
.fchips{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 2px}
.fc{display:inline-flex;align-items:center;font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:1px 6px;cursor:pointer;opacity:.45;user-select:none}
.fc.on{opacity:1;border-color:rgba(157,189,192,.45)}
.fc:hover{border-color:var(--accent-hi)}
.fc .n{margin-left:5px;color:var(--mute);font-size:10.8px}
.row{display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--line2);font-size:12.9px;cursor:pointer}
.row:hover{color:var(--head)}
.row.off{opacity:.38}
.row .n{margin-left:auto;color:var(--mute);font-size:11.4px;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.35)}
body.lightbase .sw{border-color:rgba(0,0,0,.3)}
input.inp{background:rgba(127,140,145,.12);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font:inherit;font-size:12.6px;box-sizing:border-box;width:100%}
input.inp:focus{outline:none;border-color:var(--accent-hi)}
.btn{background:rgba(127,140,145,.12);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 9px;font:inherit;font-size:12.2px;cursor:pointer}
.btn:hover{border-color:var(--accent-hi);color:var(--head)}
.frst{color:var(--accent-hi);cursor:pointer;font-size:11.8px}
#flist{max-height:230px;overflow:auto;margin-top:5px}
.fi{padding:5px 3px;border-top:1px solid var(--line2);font-size:12.7px;cursor:pointer;display:flex;gap:7px;align-items:flex-start}
.fi:hover{background:rgba(157,189,192,.1)}
.fi .fm{color:var(--mute);font-size:11px;display:block}
.hint{font-size:11px;color:var(--mute);line-height:1.45;margin:4px 0 0}

/* right column */
#rcol{position:absolute;z-index:800;top:12px;right:12px;bottom:calc(var(--legH,210px) + 48px);width:300px;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:flex-end}
#rcol>*{pointer-events:auto;position:relative;box-sizing:border-box}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btnrow .card{position:relative;padding:7px 13px;cursor:pointer;letter-spacing:.2px;font-size:12.8px}

.btnrow .card:hover{border-color:var(--accent-hi);color:var(--head)}
#tr{padding:11px 14px;width:100%}
#tr.min .body{display:none}
.bases{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12.6px;margin:4px 0 2px}
.bases label{cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
.rng{display:flex;align-items:center;gap:7px;font-size:11.6px;color:var(--mute);margin-top:6px}
.rng input{flex:1}

/* bottom boxes */
#legBox{right:12px;bottom:12px;width:300px;max-height:var(--legH,210px);display:flex;flex-direction:column;box-sizing:border-box}
#legBox .bh{display:flex;align-items:center;padding:9px 14px 4px}
#legBox .bh .psec{margin:0;flex:1}
#patBody,#legBody{overflow:auto;padding:0 14px 12px}
#legBox.min #legBody{display:none}
.pat{padding:6px 9px;margin:4px 0;border-left:3px solid var(--pc);border-radius:0 4px 4px 0;background:rgba(157,189,192,.06);cursor:pointer}
.pat:hover{background:rgba(157,189,192,.14)}
.pat.on{background:rgba(157,189,192,.2)}
.pat .pt{font-size:12.9px;color:var(--head);line-height:1.3}
.pat .pm{font-size:10.7px;color:var(--mute);margin-top:1px;line-height:1.35}

/* detail */
#det{display:none;position:fixed;z-index:950;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 32px));max-height:min(82vh,840px);overflow:auto;padding:16px 22px 20px;box-sizing:border-box;box-shadow:0 24px 70px rgba(0,0,0,.72)}
#det.open{display:block}
#detGrip{position:sticky;top:-16px;margin:-16px -22px 4px;height:18px;cursor:grab;display:flex;justify-content:center;align-items:center;background:var(--card);z-index:2;touch-action:none}
#detGrip::after{content:"";width:42px;height:4px;border-radius:2px;background:rgba(140,150,155,.4)}
#det.dragging,#det.dragging #detGrip{cursor:grabbing;user-select:none}
#detX{position:absolute;z-index:3;top:5px;right:9px;background:none;border:0;color:var(--mute);font-size:21px;cursor:pointer;line-height:1}
#detX:hover{color:var(--head)}
.hp-k{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);padding-right:22px}
.hp h3{margin:3px 0 5px;font:600 19px/1.25 'Cinzel','Marcellus',serif;color:var(--head);border-bottom:1px solid var(--line);padding:0 18px 7px 0}
.hp-sub{color:var(--mute);font-size:12.2px;margin:0 0 4px}
.hp-role{margin:8px 0;color:var(--ink);font-size:13.6px;line-height:1.5}
.hp-h{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);margin:14px 0 4px}
.addr{display:flex;gap:9px;align-items:flex-start;background:rgba(157,189,192,.07);border-left:3px solid var(--accent);padding:8px 10px;border-radius:0 4px 4px 0;font-size:13px;line-height:1.45}
.addr .ab{flex:1}
.addr .ac{font-size:11.4px;color:var(--mute);margin-top:3px}
table.kv{border-collapse:collapse;font-size:12.6px;width:100%;margin:2px 0}
table.kv th{text-align:left;color:var(--mute);font-weight:400;vertical-align:top;padding:3px 12px 3px 0;white-space:normal;width:38%}
table.kv td{padding:3px 0;vertical-align:top}
.bts{margin:10px 0;padding:2px 0}
.bts p{margin:0 0 9px;font-size:13.4px;color:var(--ink);line-height:1.6}
.imp-box{margin:12px 0 4px;padding:10px 12px;background:rgba(157,189,192,.08);border-left:3px solid var(--accent-hi);border-radius:0 5px 5px 0;font-size:13.3px;line-height:1.55}
.imp-box .ih{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);display:block;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chips span{font-size:11.6px;border:1px solid var(--line);border-radius:3px;padding:1px 7px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chips span:hover{border-color:var(--accent-hi);color:var(--head)}
.chips .sw{width:9px;height:9px;border-radius:50%}
.hp-src{color:var(--mute);font-size:11.6px;margin-top:12px;border-top:1px solid var(--line2);padding-top:7px;line-height:1.5}
.hp-src a{color:var(--accent-hi)}
.hp-src div{margin:3px 0}
a{color:var(--accent-hi)}
.tag{display:inline-block;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--mute);margin-left:6px;vertical-align:2px}

/* overlays */
#info,#story{inset:0;z-index:1001;border-radius:0;border:0;display:none;overflow:auto;padding:58px max(26px,calc((100% - 940px)/2)) 46px;background:rgba(8,12,15,.978)}
body.lightbase #info,body.lightbase #story{background:rgba(246,244,239,.985)}
#info.open,#story.open{display:block}
#infoClose,#storyClose{position:fixed;top:12px;right:12px;z-index:1002;display:none}
#info.open~#infoClose,#story.open~#storyClose{display:block}
#info h1,#story h1{font:600 24px/1.25 'Cinzel','Marcellus',serif;margin:0 0 14px;color:var(--head)}
#info h2,#story h2{font:600 16px/1.3 'Cinzel','Marcellus',serif;margin:26px 0 8px;color:var(--head);letter-spacing:.3px}
#info p,#story p,#info li,#story li{font-size:14.2px;line-height:1.65}
#info ul,#story ul{padding-left:20px;margin:6px 0}
#info table{border-collapse:collapse;width:100%;font-size:13.2px;margin:10px 0}
#info table th{text-align:left;color:var(--mute);font-weight:400;border-bottom:1px solid var(--line);padding:5px 12px 6px 0}
#info table td{vertical-align:top;padding:7px 12px 7px 0;border-bottom:1px solid var(--line2)}
.warn{border-left:3px solid var(--accent);padding:6px 0 6px 13px;color:var(--ink)}

#ttip{position:fixed;z-index:2000;pointer-events:none;background:rgba(10,14,17,.97);border:1px solid var(--line);color:#e6e4de;border-radius:3px;padding:5px 9px;font-size:12.4px;display:none;max-width:300px;box-shadow:0 6px 18px rgba(0,0,0,.5);line-height:1.4}
#ttip .tm{color:#9aa4a6;font-size:11px;display:block}
#worldBtn{position:absolute;z-index:800;right:12px;bottom:calc(var(--legH,210px) + 54px);padding:6px 11px}
#flatBtn{position:absolute;z-index:800;right:12px;bottom:calc(var(--legH,210px) + 20px);padding:6px 11px}
.maplibregl-ctrl-attrib{background:rgba(8,12,15,.78)!important;color:#8b9496;font-family:'Marcellus',Georgia,serif;font-size:10.5px}
.maplibregl-ctrl-attrib a{color:#a6aeb0!important}
.maplibregl-ctrl-group{background:var(--card)!important;border:1px solid var(--line);box-shadow:none!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}
body.lightbase .maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:none}
.maplibregl-ctrl-bottom-right{bottom:0}
.maplibregl-ctrl-top-right{top:auto;bottom:calc(var(--legH,210px) + 58px);right:12px}
@media (max-width:900px){
  #key{width:auto;right:12px;max-height:40%}
  #rcol{top:auto;bottom:12px;left:12px;right:12px;width:auto;max-height:44%;align-items:stretch}
  #legBox{display:none}
  #patBtn{display:block!important}
  #worldBtn,#flatBtn{display:none}
  #info,#story{padding:54px 16px 70px}
  .maplibregl-ctrl-top-right{display:none}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="key" class="card scroll">
  <button id="toggleKey" class="tog" type="button" title="Pull the key up or down">&minus;</button>
  <h1>Inequality Map</h1>
  <p class="lede">The mechanisms that carry economic inequality from one generation to the next, placed where each one runs from.</p>
  <p class="lede2" id="lede2"></p>
  <div class="body" id="keyBody"></div>
</div>

<div id="rcol">
  <div class="btnrow">
    <div id="patBtn" class="card" role="button" tabindex="0">All mechanisms</div><div id="storyBtn" class="card" role="button" tabindex="0">About this map</div>
    <div id="infoBtn" class="card" role="button" tabindex="0">Method and sources</div>
  </div>
  <div id="tr" class="card"><button id="toggleTr" class="tog" type="button" title="Pull the basemap box up or down">&minus;</button><div class="body" id="trBody"></div></div>
</div>

<div id="legBox" class="card"><div class="bh"><span class="psec">On the map</span><button id="toggleLeg" class="tog" type="button">&minus;</button></div><div id="legBody" class="scroll"></div></div>

<div id="det" class="card scroll hp"><div id="detGrip" title="Drag to move"></div><button id="detX" type="button" title="Close">&times;</button><div id="detBody"></div></div>

<button id="worldBtn" class="btn card" type="button" title="Zoom back out to the whole world">Whole world</button>
<button id="flatBtn" class="btn card" type="button" title="Switch to a flat map">Flat map</button>
<div id="info" class="card scroll"></div><button id="infoClose" class="btn" type="button">Close</button>
<div id="story" class="card scroll"></div><button id="storyClose" class="btn" type="button">Close</button>
<div id="ttip"></div>
<div id="gtip"></div>

// OpenFreeMap's place, water, river, road and peak names in a basemap's own type.

                tileSize: 256, maxzoom: 18, attribution: "Imagery © Esri, Maxar" },

                  tileSize: 256, attribution: "Labels © CARTO, © OpenStreetMap" },
        "plate-base": { type: "raster", tiles: ["plate://{z}/{x}/{y}"], tileSize: 256, maxzoom: 3,
                        bounds: [-180, PLATE.bottom, 180, PLATE.top] },
      },
      layers: [
        // The flat Culprits map's world-sized sheet (its "world-fill").
        { id: "world-fill", type: "fill", source: "world", paint: { "fill-color": "#0B1017" } },
        { id: "base", type: "raster", source: "base", layout: { visibility: "none" }, paint: Object.assign({ "raster-opacity": 1 }, BASE_GRADE.atlas) },
        { id: "hillshade", type: "raster", source: "hillshade", layout: { visibility: "none" },
          paint: { "raster-opacity": zs(4, .18, 9, .34, 13, .46) } },

  });
  map.addControl(new maplibregl.AttributionControl({ compact: true }), "bottom-right");

  const vig = document.createElement("div");

  map.getCanvasContainer().appendChild(vig);
  const share = (id, spec) => { if (!map.getSource(id)) map.addSource(id, Object.assign({}, spec)); };
  const add = (layers, before) => layers.forEach((l) => map.addLayer(Object.assign({}, l, { layout: Object.assign({}, l.layout || {}, { visibility: "none" }) }), before));
  const afterPlate = () => { const all = map.getStyle().layers, at = all.findIndex((l) => l.id === "plate-base"); return all[at + 1] && all[at + 1].id; };
  // Each stack is added the first time it is chosen, where Culprits puts it.

    hell() { share("boundaries", BOUNDARIES); share("osm", OSM_SOURCE); share("outline-dem", RELIEF_SOURCE); share("sea-dem", TERRAIN_SOURCE);
      add(hellLayers(), afterPlate()); add(nameLayers("hell")); return hellLayers().concat(nameLayers("hell")); },
    wood() { share("boundaries", BOUNDARIES); share("osm", OSM_SOURCE); share("outline-dem", RELIEF_SOURCE); share("sea-dem", TERRAIN_SOURCE);
      share("outline-wood-paint", { type: "raster", tiles: ["woodpaint://{z}/{x}/{y}"], tileSize: 256, maxzoom: 18, attribution: WOOD.attribution });
      share("outline-wood-photo", { type: "raster", tiles: ["woodphoto://{z}/{x}/{y}"], tileSize: 256, minzoom: 15, maxzoom: 18, attribution: WOOD.photoAttribution });
      add(woodLayers(), afterPlate()); add(nameLayers("wood")); return woodLayers().concat(nameLayers("wood")); },
    night() { share("boundaries", BOUNDARIES); share("osm", OSM_SOURCE); share("outline-dem", RELIEF_SOURCE); share("sea-dem", TERRAIN_SOURCE);
      share("outline-night-lights", { type: "raster", tiles: ["nightlights://{z}/{y}/{x}"], tileSize: 256, maxzoom: 8, attribution: NIGHT.attribution });
      add(nightLayers(), afterPlate()); return nightLayers(); },
    atlas() { return []; },
  };
  const ids = (k) => (state.stacks[k] || (state.stacks[k] = build[k]())).map((l) => l.id);
  const show = (id, on) => { if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", on ? "visible" : "none"); };

  function apply(k) {

    state.kind = k;
    for (const o of Object.keys(state.stacks)) for (const id of state.stacks[o].map((l) => l.id)) show(id, o === k);
    show("base", k === "atlas" || k === "satellite");

<script>
var ENTS=[{"id":"holding_chain","n":"Control held through a chain of companies","t":"inh","lat":48.8663,"lon":2.3041,"pl":"Paris, France","ad":"Agache, 11 rue François 1er, 75008 Paris","ro":"Stacking holding companies so that a family keeps voting control of a listed business while the underlying shares are never sold.","who":"Agache is the holding company through which the Arnault family controls LVMH; five of Bernard Arnault's children hold positions within the structure.","rch":"global","mx":["trans","conc"],"rd":"A listed company can be bought by anyone with the money, in principle. In practice, control of many of Europe's largest firms sits with families who hold their stakes through a chain of private holding companies, often with double voting rights for long-term holders, which French law grants automatically to shares held for two years or more. The family's economic interest can be a minority while its voting power is decisive.\nThe arrangement matters for inheritance because the structure, not the individual, is the owner. Shares in the operating company are not sold, so no capital gains arise. Interests in the holding company can be given away gradually during the parents' lifetime, at valuations that reflect a minority stake in an unlisted entity rather than a proportion of the listed company's market value. Succession becomes a series of small transfers inside a private structure rather than one taxable event.\nThe same pattern is visible in family-controlled groups in India, Mexico, South Korea and much of continental Europe. What it produces is a form of corporate ownership in which the decisive shareholder is a family that will still be the decisive shareholder in fifty years, and the firm's workforce, suppliers and minority investors have no mechanism for changing that.","sr":[["LVMH: investor relations and shareholding structure","https://www.lvmh.com/en/investors"],["French Commercial Code, article L225-123 on double voting rights","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000039367826"]],"i":0},{"id":"trust_land","n":"Land held by trustees, which never passes at death","t":"inh","lat":51.5118,"lon":-0.1479,"pl":"Mayfair, London, United Kingdom","ad":"Grosvenor, 70 Grosvenor Street, London W1K 3JP","ro":"Holding land through family trusts, so that a succession is a change of trustees rather than a transfer of property.","who":"The Grosvenor estate, about 300 acres of Mayfair and Belgravia acquired by marriage in 1677 and held through a series of family trusts, is the clearest documented example in Britain.","rch":"national","mx":["trans","rent"],"rd":"When the sixth Duke of Westminster died in 2016, his heir inherited an estate valued at around £9 billion without a corresponding inheritance tax charge. The land was not his father's personal property. It is held by trustees under settlements established decades earlier, so there was no transfer on death for the 40 per cent charge to apply to. Trusts of this type pay instead a periodic charge of 6 per cent of value every ten years, a liability the Guardian and other reporting at the time estimated to be a small fraction of the £3.6 billion that a direct bequest would have produced.\nThe holding began as farmland outside London, acquired through a marriage in 1677. The city expanded around it, and ground rents on Mayfair and Belgravia turned agricultural land into one of the most valuable urban estates in Europe. Successive dukes sold portions to meet earlier death duties, and the family then reorganised around trusts, which is how the remaining core survived the period in which other aristocratic estates were broken up.\nThe mechanism is not unusual, only unusually visible. Land held in trust does not come to market on a death, does not generate a tax charge and does not change the identity of the landlord. For tenants and leaseholders on such an estate, the practical consequence is that the terms of their occupation are set by an owner that has no succession event and therefore no moment at which anything is likely to change.","sr":[["Guardian: why the new Duke of Westminster will not pay billions in inheritance tax","https://www.theguardian.com/business/2016/aug/11/inheritance-tax-why-the-new-duke-of-westminster-will-not-pay-billions"],["Grosvenor: our history","https://www.grosvenor.com/about-us/our-history"]],"i":1},{"id":"land_relief","n":"Taking land and private companies out of the death duty","t":"inh","lat":51.5032,"lon":-0.127,"pl":"London, United Kingdom","ad":"HM Revenue & Customs, 100 Parliament Street, London SW1A 2BQ","ro":"Exempting farmland and unlisted company shares from inheritance tax, which makes them the assets a large estate holds.","who":"HM Revenue & Customs administers agricultural property relief and business property relief; the rates are set by the Treasury and voted by Parliament.","rch":"national","mx":["trans","rent"],"rd":"Britain charges inheritance tax at 40 per cent above a threshold, but since March 1992 two reliefs have removed up to the whole value of qualifying farmland and unlisted business assets from the charge. An estate consisting of a house and savings pays. An estate of the same value consisting of a farm or a private company may pay nothing.\nThe reliefs are defended as protecting family farms and firms from being broken up to meet a tax bill, and most claims are small: the government's own policy paper records a median value of £486,000 for estates claiming agricultural relief and £200,000 for business relief. The concentration sits at the top of the distribution. In 2021-22, according to the same paper, 117 estates accounted for £219 million of relief, two-fifths of the entire cost of the agricultural provision.\nA tax exemption attached to an asset raises the price of that asset. Farmland in England has been bought for years by purchasers who do not intend to farm it, and the reliefs are among the reasons tenant farmers and new entrants have found themselves bidding against estates for whom the land is a shelter. The government capped both reliefs with a £1 million allowance from April 2026 and estimates that up to 185 estates a year will pay more as a result, leaving the structure intact for everyone below that line.","sr":[["HM Treasury: agricultural property relief and business property relief reforms","https://www.gov.uk/government/publications/reforms-to-agricultural-property-relief-and-business-property-relief/agricultural-property-relief-and-business-property-relief-reforms"],["Tax Justice UK: who claims the inheritance tax reliefs","https://taxjustice.uk/blog/inheritance-tax-breaks-give-billions-to-the-uks-wealthiest-families/"]],"i":2},{"id":"ownerless_foundation","n":"The entity with no owner","t":"inh","lat":47.141,"lon":9.5215,"pl":"Vaduz, Liechtenstein","ad":"Amt für Justiz (Office of Justice), Äulestrasse 70, 9490 Vaduz","ro":"Placing assets in a foundation, which has a purpose rather than an owner, so that no one can be taxed on holding them or inheriting them.","who":"The Office of Justice registers and supervises Liechtenstein foundations; they are administered locally by professional trustees on behalf of families abroad.","rch":"global","mx":["trans","hide"],"rd":"A foundation is an endowment with a stated purpose and a board to carry it out. Liechtenstein adapted the form in 1926 for private family wealth, and comparable vehicles exist in Panama, Austria and the Netherlands. Assets inside one are not owned by the family that established it, which removes them from the estate of the founder and from the reach of the taxes and claims that attach to ownership.\nFor most of the twentieth century the structure was combined with banking secrecy, and the combination made the principality a destination for undeclared money. That changed in stages after 2008, when stolen bank records led to prosecutions in Germany and elsewhere, and Liechtenstein subsequently signed up to the automatic exchange of account information. Reporting is not the same as abolition. The structure still functions as intended for wealth that is declared: a declared foundation is still an entity without an owner.\nWhat the form offers is permanence. A family can set out, in the founding documents, how the assets are to be used and who may benefit, and then die without the arrangement being disturbed. Courts in other countries have at times looked through such structures, particularly in divorce and creditor cases, but the starting position is that the assets belong to the foundation and the family is merely among those it benefits.","sr":[["Tax Justice Network: Financial Secrecy Index country profiles","https://fsi.taxjustice.net/"],["OECD: Liechtenstein peer review of information exchange","https://www.oecd.org/en/topics/global-forum-on-transparency-and-exchange-of-information-for-tax-purposes.html"]],"i":3},{"id":"stepup_basis","n":"The gain that death erases","t":"inh","lat":38.894,"lon":-77.026,"pl":"Washington, DC, United States","ad":"Internal Revenue Service, 1111 Constitution Avenue NW, Washington, DC 20224","ro":"Resetting the purchase price of an inherited asset to its value on the day its owner died, so a lifetime of growth is never taxed.","who":"The rule is section 1014 of the Internal Revenue Code, written by Congress and administered by the Internal Revenue Service from this building.","rch":"national","mx":["trans","hide"],"rd":"Capital gains tax falls on the difference between what an asset cost and what it sold for. Under section 1014 of the US tax code, an asset passing at death is treated as though the heir had bought it on the day of the death, at that day's value. The growth that accumulated while the original owner held it is not taxed then, and it cannot be taxed later, because as far as the tax system is concerned it never happened.\nThe effect depends on what a household's wealth consists of. Wages are taxed in the year they are earned, with no equivalent provision. A shareholding, a building or a stake in a private company can appreciate for fifty years, support borrowing against its value in the meantime, and pass to the next generation with the gain wiped clean. The Joint Committee on Taxation, as reported by the Congressional Research Service, puts the cost of the exclusion at roughly $40 billion a year, and the Tax Policy Center estimated that taxpayers worth more than $100 million held $13.4 trillion in unrealised gains as of 2025.\nThe rule also shapes behaviour while its beneficiaries are alive. Selling an appreciated asset triggers tax; holding it until death does not. Wealthy households are advised accordingly, borrowing against assets rather than selling them, which is lawful and well documented. Attempts to replace the provision with carryover basis, in 1976 and again in 2021, were abandoned after objections about the difficulty of establishing what assets originally cost.","sr":[["Congressional Research Service: tax treatment of capital gains at death","https://www.congress.gov/crs_external_products/IF/PDF/IF11812/IF11812.2.pdf"],["US Treasury: step-up in basis tax expenditure estimate","https://home.treasury.gov/system/files/131/Step-Up-Basis-2014.pdf"]],"i":4},{"id":"family_office","n":"The private firm that manages one family's money","t":"inh","lat":1.28,"lon":103.85,"pl":"Singapore","ad":"Monetary Authority of Singapore, 10 Shenton Way, MAS Building, Singapore 079117","ro":"Granting tax exemptions and light regulation to firms that invest a single family's wealth, which draws that wealth into the jurisdiction and keeps it undivided.","who":"The Monetary Authority of Singapore administers the fund tax incentives that single family offices use, and supervises the sector; Singapore abolished estate duty in 2008.","rch":"global","mx":["trans","hide","conc"],"rd":"A single family office is a private company that exists to run one family's investments, employ its advisers and coordinate its affairs across generations. Because it manages no outside money, it escapes most of the regulation that applies to funds, and in the United States it is expressly exempt from registering as an investment adviser. Singapore combined that lightness with specific tax exemptions for the funds such offices manage, and abolished estate duty in 2008.\nThe number of family offices in Singapore rose from a few dozen in the mid-2010s to well over a thousand by the middle of this decade, on the Monetary Authority's own figures, with similar growth in Hong Kong, Dubai and Zurich. Jurisdictions compete for them, and the competition is explicit: minimum assets, local hiring requirements and spending conditions are published and adjusted.\nThe institution matters beyond tax. A family office is how a fortune acquires a staff, a legal department and an investment strategy that outlive the person who made it. It buys private companies, property and farmland directly rather than through intermediaries, and it is structured so that the next generation inherits an organisation rather than a sum of money. That is a difference in kind: money is spent, and an organisation continues to invest.","sr":[["Monetary Authority of Singapore: single family offices and tax incentives","https://www.mas.gov.sg/development/wealth-management"],["US Securities and Exchange Commission: family offices rule under the Advisers Act","https://www.sec.gov/rules/final/2011/ia-3220.pdf"]],"i":5},{"id":"perpetual_trust","n":"The trust that never ends","t":"inh","lat":44.3683,"lon":-100.336,"pl":"Pierre, South Dakota, United States","ad":"South Dakota State Capitol, 500 East Capitol Avenue, Pierre, SD 57501","ro":"Repealing the limit on how long a trust may last, so that wealth inside it is never inherited and never taxed as an inheritance.","who":"The South Dakota legislature, which abolished the state's rule against perpetuities in 1983 and has amended its trust code repeatedly since on the advice of a standing task force drawn from the trust industry.","rch":"global","mx":["trans","hide"],"rd":"English and American law contained, for several centuries, a rule that no private trust could tie up property indefinitely. A trust had to vest within the lifetime of someone alive when it was created plus twenty-one years, which meant that every few generations the assets became somebody's outright property and entered the tax system. South Dakota repealed that limit in 1983. Nevada, Alaska, Delaware and roughly half the states followed, each adjusting its statute when another state offered something more attractive.\nA trust with no expiry date changes what inheritance means. Wealth placed inside it is owned by the trust, and the family members who benefit from it are beneficiaries rather than owners. Estate and gift taxes are charges on transfers, so a structure in which nothing is transferred gives them nothing to attach to. The same structure limits what creditors, divorcing spouses and claimants can reach, because the beneficiary does not own the assets they live on.\nThe state is small, and the business is not. Trust assets administered in South Dakota have grown from a few billion dollars in the 1980s into the hundreds of billions, held for families who mostly live elsewhere and whose own states still apply older rules. Nothing about this is hidden: the statutes are public and the law firms that use them advertise. What it produces is a category of wealth that is no longer attached to any living person, and so is never redistributed by the one event that historically redistributed it.","sr":[["South Dakota Codified Law 43-5-8, abolition of the rule against perpetuities","https://sdlegislature.gov/Statutes/43-5-8"],["Bloomberg: the dynasty trust industry in South Dakota","https://www.bloomberg.com/news/features/2019-10-09/how-south-dakota-became-a-tax-haven-for-the-world-s-wealthy"]],"i":6},{"id":"allotment","n":"Dividing collective land into parcels that can be lost","t":"land","lat":38.8938,"lon":-77.0432,"pl":"Washington, DC, United States","ad":"Bureau of Indian Affairs, 1849 C Street NW, Washington, DC 20240","ro":"Breaking communal landholding into individual allotments held in federal trust, selling the remainder, and leaving the surviving parcels split among heirs until they cannot be used.","who":"The General Allotment Act of 1887 was administered by the Office of Indian Affairs, now the Bureau of Indian Affairs, which still holds the remaining land in trust.","rch":"national","mx":["disp","excl"],"rd":"The General Allotment Act of 1887 divided reservations into parcels assigned to individuals and declared what was left over to be surplus, available for sale to settlers and companies. Allottees were deemed incompetent to manage their own property, so the United States held legal title in trust while the beneficial owner farmed it. According to the Indian Land Tenure Foundation, tribal holdings fell from 138 million acres in 1887 to 48 million by 1934, when allotment ended; roughly 60 million acres were sold as surplus and a further 27 million were lost through sales of deceased owners' allotments and through tax foreclosure.\nThe arrangement continues to operate through inheritance. An allotment passes to all of an owner's heirs as undivided fractional interests, and after four or five generations a single parcel may have hundreds of co-owners, each holding a share too small to produce income and none able to lease, sell, mortgage or build without the agreement of the rest. The Bureau administers these interests, which is why a substantial portion of trust land generates almost nothing for the people who own it.\nCongress has addressed the problem twice, through the Indian Land Consolidation Act and through the buy-back programme funded by the Cobell settlement, which repurchased fractional interests and returned them to tribal ownership. Both operate at a scale far below the original loss.","sr":[["Indian Land Tenure Foundation: land tenure history","https://iltf.org/land-issues/history/"],["National Archives: the Dawes Act (1887)","https://www.archives.gov/milestone-documents/dawes-act"]],"i":7},{"id":"state_leasehold","n":"Land leased by the state rather than sold","t":"land","lat":31.7767,"lon":35.2054,"pl":"Jerusalem","ad":"Knesset, Kiryat Ben-Gurion, Jerusalem 9195016","ro":"Holding almost all land in public ownership and allocating it by lease, which places decisions about who may build and farm in administrative hands.","who":"Basic Law: Israel Lands was enacted by the Knesset in 1960; the land is administered by the Israel Land Authority, whose council includes members appointed by the Jewish National Fund.","rch":"national","mx":["disp","excl","rent"],"rd":"About 93 per cent of the land in Israel, some 19.5 million dunams, is held by the state, the Development Authority or the Jewish National Fund, and is leased rather than sold, typically for 49 or 98 years. Much of it entered state hands after 1948 under the Absentees' Property Law, which vested the property of Palestinians who had fled or been expelled in a custodian, and under subsequent legislation that converted custodial holdings into state land.\nThe Jewish National Fund owns roughly 13 per cent of the total under a charter directing it to develop and lease land for Jewish settlement, and holds close to half the seats on the Land Authority's governing council. In 2000 the High Court held in the Qaadan case that the state may not allocate land on the basis of religion or nationality, including indirectly through a third party. Human Rights Watch and Israeli civil rights organisations have documented continuing disparities in allocation, and estimated in 2017 that less than 3 per cent of land falls under the jurisdiction of Palestinian municipalities, whose residents make up about a fifth of the population.\nA leasehold system concentrates authority over land use in whoever administers it. Where that authority has been exercised unevenly, the consequence for families is not only a lost dwelling but the absence of an asset that could have been built on, borrowed against and left to children.","sr":[["Human Rights Watch: Israel's discriminatory land policies","https://www.hrw.org/news/2020/05/12/israel-discriminatory-land-policies-hem-palestinians"],["Israel Land Authority","https://www.gov.il/en/departments/israel_land_authority"]],"i":8},{"id":"cash_land_law","n":"Making land purchasable only for cash, at the moment of emancipation","t":"land","lat":-15.799,"lon":-47.864,"pl":"Brasília, Brazil","ad":"Esplanada dos Ministérios, Brasília, DF 70000","ro":"Replacing grants of land with cash sale just as slavery ended, which excluded the newly freed from ownership and fixed a concentration that has lasted.","who":"The Land Law of 1850 was enacted by the Imperial Parliament; land policy is now administered from the federal ministries in Brasília, with INCRA responsible for agrarian reform.","rch":"national","mx":["disp","excl","rent"],"rd":"Until 1850, land in Brazil was acquired principally by royal grant and by occupation. The Land Law of that year ended both routes and made purchase for cash the only lawful means of acquiring public land. It was passed in the same period in which the Atlantic slave trade was suppressed and abolition was being prepared, and its practical effect was that the people who became free in 1888 had no money, no grant and therefore no means of obtaining land, while existing holders were able to register claims over large areas.\nThe resulting distribution has proved durable. Successive agricultural censuses conducted by IBGE have shown the largest properties occupying close to half of all farmland while the smallest holdings, which are the great majority of establishments, occupy a small fraction of it. Conflict over land remains routine: the Comissão Pastoral da Terra records hundreds of disputes a year involving occupations, evictions and killings, concentrated in the agricultural frontier states.\nAgrarian reform has operated since the 1960s and expanded after 1985 through expropriation of unproductive estates and settlement of landless families. It has resettled hundreds of thousands of households without altering the overall concentration, partly because new land has been opened at the frontier faster than existing estates have been divided.","sr":[["IBGE: agricultural census statistics","https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria.html"],["Comissão Pastoral da Terra: conflicts in the countryside, annual reports","https://www.cptnacional.org.br/publicacoes/conflitos-no-campo-brasil"]],"i":9},{"id":"redline","n":"Mortgage insurance conditioned on the race of a neighbourhood","t":"land","lat":38.8841,"lon":-77.022,"pl":"Washington, DC, United States","ad":"US Department of Housing and Urban Development, 451 7th Street SW, Washington, DC 20410","ro":"Underwriting the long fixed-rate mortgage, and withholding it from neighbourhoods rated by racial composition.","who":"The Federal Housing Administration, created in 1934 and now part of the Department of Housing and Urban Development, wrote the underwriting manuals that set the terms.","rch":"national","mx":["excl","rent","trans"],"rd":"Federal mortgage insurance is the reason an ordinary American household could buy a house with a modest deposit and repay it over thirty years at a fixed rate. The Federal Housing Administration guaranteed the lender against loss, and by the late 1940s it was involved in more than a third of new residential construction. The agency's underwriting manuals of the 1930s treated the racial composition of a neighbourhood as a determinant of risk, advised against lending where populations were mixed, and recommended restrictive covenants as a way of maintaining a favourable rating.\nThe effect was to channel the cheapest credit in American history into new, all-white suburbs and away from existing urban neighbourhoods. Black households that wanted to buy were pushed towards contract sales and other arrangements in which the buyer accumulated no equity until the final payment and could be evicted for one missed instalment. Scholarship on the colour-coded maps produced by the Home Owners' Loan Corporation continues to debate how much of the subsequent divergence those maps caused, but there is little dispute that federal insurance itself operated on racial criteria.\nHousing equity is the principal asset most American families hold and the principal thing they transmit. A generation excluded from the programme that built that equity had correspondingly less to pass on, and the measured gap between white and Black household wealth has not closed in the decades since the Fair Housing Act of 1968 made the exclusion unlawful.","sr":[["National Community Reinvestment Coalition: the HOLC redlining maps","https://ncrc.org/holc/"],["NBER working paper 28146: the effects of the 1930s HOLC maps","https://www.nber.org/system/files/working_papers/w28146/revisions/w28146.rev0.pdf"]],"i":10},{"id":"racial_land_law","n":"Reserving the land by race","t":"land","lat":-33.9268,"lon":18.4175,"pl":"Cape Town, South Africa","ad":"Parliament of South Africa, Plein Street, Cape Town 8001","ro":"Confining the land ownership of a majority population to a fraction of the country, and leaving the resulting distribution in place after repeal.","who":"The Natives Land Act was passed by the Union Parliament in 1913 and extended in 1936; restitution is now handled by the Commission on Restitution of Land Rights.","rch":"national","mx":["disp","excl","rent"],"rd":"The Natives Land Act of 1913 restricted African land ownership to scheduled areas covering roughly 7 per cent of South Africa, a figure raised to about 13 per cent in 1936, and outlawed sharecropping and cash tenancy on land outside them. Families who had been farming for themselves became wage labourers on land they had worked, or moved to reserves that could not support them. The Act was one component of a larger system, but it was the component that determined who could own a productive asset.\nRepeal in 1991 removed the prohibition without redistributing anything. The state's land audit of 2017 recorded white individuals holding 26.7 million hectares, 22 per cent of all land in the country and, among land owned by individuals, 72 per cent of farmland. Restitution and redistribution programmes have been running since 1994 against a target, set in the National Development Plan, of transferring 30 per cent of farmland; progress has been slowed by budget limits, disputed valuations and the administrative difficulty of proving dispossession that occurred decades ago.\nThe durability of the pattern is the point. Land that is taken does not return when the law that took it is repealed, because the people who hold it have good title under the new legal order and no obligation to sell. Where restitution does occur, it typically transfers land without the capital, water rights or infrastructure that made it productive, which is one reason a substantial share of restored farms have struggled.","sr":[["Africa Check: who owns the land in South Africa","https://africacheck.org/fact-checks/factsheets/frequently-asked-questions-about-land-ownership-and-demand-south-africa"],["South African History Online: the Natives Land Act of 1913","https://www.sahistory.org.za/article/natives-land-act-1913"]],"i":11},{"id":"shares_for_land","n":"Satisfying land reform with company shares","t":"land","lat":14.6509,"lon":121.0458,"pl":"Quezon City, Philippines","ad":"Department of Agrarian Reform, Elliptical Road, Diliman, Quezon City 1100","ro":"Allowing landowners to give farmworkers shares in a corporation instead of title to the land, which satisfies a redistribution law without redistributing anything.","who":"The Department of Agrarian Reform administers the Comprehensive Agrarian Reform Program of 1988, which contained the stock distribution option used at Hacienda Luisita.","rch":"national","mx":["disp","excl","floor"],"rd":"The Comprehensive Agrarian Reform Program of 1988 required large estates to be distributed to the people who worked them, and permitted an alternative: the owner could incorporate the estate and issue shares to the farmworkers in proportion to the land they would otherwise have received. At Hacienda Luisita in Tarlac, some 4,900 hectares owned by the family of two later presidents, shares were issued in 1989 and the estate remained intact.\nShares in a company that does not pay dividends provide no income, and the workers could not sell, farm or borrow against a share certificate as they could against land. A strike at the estate in 2004 ended with police and soldiers firing on the picket line, killing seven people. The Presidential Agrarian Reform Council revoked the stock arrangement in 2005, the company litigated, and the Supreme Court ordered the land distributed in 2012, twenty-three years after the shares were issued.\nThe wider programme has distributed several million hectares, but exemptions, conversions to non-agricultural use and disputes over valuation have kept much of the largest holdings out of it. The pattern is what the stock option makes visible: where a redistribution statute leaves an alternative that preserves ownership, the alternative is the one that is used, and the time that passes while it is litigated is itself the transfer of a generation.","sr":[["Philippine Supreme Court: Hacienda Luisita Inc. v. PARC (2012)","https://lawphil.net/judjuris/juri2012/apr2012/gr_171101_2012.html"],["Department of Agrarian Reform: the agrarian reform programme","https://www.dar.gov.ph/about-us/"]],"i":12},{"id":"concession","n":"The mining concession over customary land","t":"land","lat":-4.053,"lon":137.116,"pl":"Grasberg, Central Papua, Indonesia","ad":"Grasberg mine, Mimika Regency, Central Papua","ro":"Granting rights over land that its inhabitants hold by custom rather than by registered title, so that the revenue leaves and the costs stay.","who":"The contract of work covering Grasberg was signed with the Indonesian government in 1967, before the territory's incorporation was settled; the mine is operated by PT Freeport Indonesia on Amungme and Kamoro land.","rch":"regional","mx":["disp","rent","excl"],"rd":"Grasberg is among the largest gold and copper deposits in the world. The agreement covering it was signed with the Indonesian government in 1967, before the vote that formalised Indonesian control of the territory, and without the consent of the Amungme and Kamoro communities on whose land the deposit sits. Customary tenure of that kind is recognised in Indonesian law in principle and is frequently unregistered in practice, which leaves communities without the documents a court requires.\nThe mine has operated since the 1970s. Tailings have been discharged into the river system, communities have been relocated, and the security arrangements around the site have been the subject of repeated human rights reporting, including by Amnesty International. The provinces around it remain among the poorest in Indonesia on the national statistical agency's own measures, while the revenue accrues to the operator, its shareholders and the central government.\nThe same structure appears wherever a resource lies under land held by custom: in the Congolese copper belt, in the Niger Delta, in the Amazon. The concession is a legal instrument that converts collective occupation into a licence granted elsewhere, and the people displaced by it generally receive compensation calculated on what the surface was worth before anyone knew what lay beneath it.","sr":[["Amnesty International: Indonesia country reporting","https://www.amnesty.org/en/location/asia-and-the-pacific/south-east-asia-and-the-pacific/indonesia/"],["Freeport-McMoRan: filings with the US Securities and Exchange Commission","https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=FCX"]],"i":13},{"id":"farmgate_board","n":"The state board that fixes the farmgate price","t":"land","lat":5.3245,"lon":-4.019,"pl":"Abidjan, Côte d'Ivoire","ad":"Le Conseil du Café-Cacao, Abidjan-Plateau, Abidjan","ro":"Announcing by decree what a million growers will be paid for the year, at a level set by world prices and state revenue rather than by the cost of living.","who":"Le Conseil du Café-Cacao, a public body under the Ministry of Agriculture, sets the guaranteed producer price at the opening of each season.","rch":"national","mx":["floor","rent"],"rd":"Côte d'Ivoire produces more cocoa than any other country, and the price its growers receive is not negotiated between buyer and seller. It is announced, usually at the opening of the main crop in October, and applies nationally. For the 2025-26 main crop the figure was 2,800 CFA francs a kilogram. For 2026-27 it was set at 1,200, a reduction of more than half, which seven producer unions responded to by demanding emergency measures. Fairtrade International calculates that a farmgate price of 1,758 CFA francs is what a living income for an Ivorian cocoa household requires.\nThe board exists because world commodity prices are volatile and growers are not in a position to bear that volatility. In practice it transmits the volatility with a lag and takes a margin, and it negotiates with a small number of international grinders and chocolate manufacturers whose purchasing is concentrated enough to influence what the market will bear. More than a million registered producers face that arrangement individually.\nA year of low prices has effects that outlast the year. Households withdraw children from school, defer replanting and take on debt against the next harvest, and child labour on cocoa farms, documented repeatedly by researchers at Tulane University and others, rises when prices fall. The sector's productive base ages and yields decline, which is one reason the following season's crop is often smaller.","sr":[["Fairtrade International: living income reference prices for cocoa","https://www.fairtrade.net/uk-en/get-involved/resources/media-centre/fairtrade-announces-new-living-income-reference-prices-for-cocoa.html"],["Global Agriculture: Ivorian and Ghanaian farmgate prices for 2026-27","https://www.global-agriculture.com/farming-agriculture/cocoa-price-gap-between-ivory-coast-and-ghana-widens-sharply-for-new-season/"]],"i":14},{"id":"crown_title","n":"Title held by the state, so the occupant cannot borrow against it","t":"land","lat":45.4253,"lon":-75.7141,"pl":"Gatineau, Quebec, Canada","ad":"Crown-Indigenous Relations and Northern Affairs Canada, 10 Wellington Street, Gatineau, QC K1A 0H4","ro":"Vesting reserve land in the Crown, which prevents its residents from using their homes as security and prevents creditors from seizing them.","who":"The Indian Act of 1876, still in force, is administered by Crown-Indigenous Relations and Northern Affairs Canada together with Indigenous Services Canada.","rch":"national","mx":["disp","tied","excl"],"rd":"Reserve land in Canada is held by the Crown for the use and benefit of a band. People live on it, build on it and pass houses to their children, but they do not own it in the sense that a mortgage requires, because section 89 of the Indian Act protects reserve property from seizure by anyone who is not a First Nations person or band. A lender cannot take the security, so ordinary mortgage lending does not function on reserve, and housing is financed instead through ministerial loan guarantees and federal programmes with their own limits and waiting lists.\nThe Act did other things that shaped who could hold anything at all. Until 1985 a woman with Indian status who married a man without it lost her status, and so did her children, which removed families from band membership and from any claim to reserve housing or benefits. Amendments in 1985 and 2019 restored status to many of those affected, after litigation that ran for decades, but entitlement remains a matter of federal registration rather than community decision.\nThe same statute authorised the residential school system and the permit system that controlled the sale of produce from reserves. What survives is a tenure arrangement in which the most common route to household wealth in Canada, owning a home whose value rises, is unavailable to the people it formally protects.","sr":[["Indian Act, R.S.C. 1985, c. I-5","https://laws-lois.justice.gc.ca/eng/acts/i-5/"],["The Canadian Encyclopedia: the Indian Act","https://www.thecanadianencyclopedia.ca/en/article/indian-act"]],"i":15},{"id":"conditionality","n":"Attaching policy conditions to a loan","t":"debt","lat":38.8992,"lon":-77.0444,"pl":"Washington, DC, United States","ad":"International Monetary Fund, 700 19th Street NW, Washington, DC 20431","ro":"Making emergency lending conditional on changes to taxation, public employment, subsidies and state ownership that the borrower's electorate did not vote for.","who":"The International Monetary Fund negotiates conditions with finance ministries; its largest shareholder holds an effective veto over major decisions.","rch":"global","mx":["cond","priv"],"rd":"A country that cannot pay its external debts has few places to go. The Fund lends when others will not, and attaches conditions to the loan: targets for the fiscal balance, ceilings on the public sector wage bill, changes to subsidies, tax measures and commitments to privatise. The conditions are negotiated with a finance ministry and set out in a letter of intent, and they are enforced by releasing the money in tranches.\nThe content has shifted over time. The structural adjustment programmes of the 1980s and 1990s required extensive privatisation and trade liberalisation, and the Fund's own evaluation office has acknowledged that fiscal targets were often set too tight and that social spending suffered. Oxfam's analysis of 161 loans to 81 countries, published in 2026, found 24 of 28 countries with ongoing programmes required to implement austerity measures, and median required cuts about five times deeper in loans agreed since 2018 than in the preceding period. ActionAid has documented public sector wage bill constraints in 15 countries that blocked the hiring of more than three million teachers, nurses and other public workers.\nThe generational element is in what gets cut. A deferred teacher post is a cohort that is not taught, and a clinic that does not open is a cohort whose health is worse for the rest of its life. Conditions are negotiated in months and their effects are measured in decades.","sr":[["Oxfam: countries locked into IMF austerity programmes","https://www.oxfam.org/en/press-releases/countries-locked-imf-austerity-programs-are-also-around-twice-vulnerable-economic"],["IMF Independent Evaluation Office: evaluation reports on conditionality","https://ieo.imf.org/en/our-work/Evaluations"]],"i":16},{"id":"indemnity","n":"Charging a colony for its own independence","t":"debt","lat":48.839,"lon":2.376,"pl":"Paris, France","ad":"Ministère de l'Économie et des Finances, 139 rue de Bercy, 75012 Paris","ro":"Requiring a former colony to compensate its former owners as the price of recognition, and lending it the money to do so.","who":"The French Treasury received the Haitian indemnity imposed by the ordinance of Charles X in 1825; the loans that financed it were arranged by French banks.","rch":"regional","mx":["cred","cond"],"rd":"Haiti won its independence in 1804. In 1825 a French squadron appeared off Port-au-Prince and France offered recognition on condition that Haiti pay 150 million francs to compensate former slaveholders for the loss of their plantations and the people they had held on them. The sum was several times Haiti's annual revenue, and it was reduced to 90 million in 1838. To make the first instalment the government borrowed from French banks, which is the origin of what historians call the double debt: the indemnity itself, and the loans taken to pay it.\nThe New York Times assembled the payment records in 2022 and found that Haiti transferred about 112 million francs over roughly seventy years, equivalent to around $560 million in current money, and estimated the loss to Haitian economic growth over the period at between $21 billion and $115 billion depending on the assumptions used. Payments continued, through successive refinancings, until 1947. For long stretches a large share of government revenue serviced them, and schools, ports and roads were not built.\nThe mechanism is not confined to Haiti. Britain compensated slave owners rather than enslaved people at abolition in 1833, financing the payment with a loan that the Treasury finished repaying in 2015. The underlying principle in both cases was that property in people was a legitimate interest requiring compensation, and that the cost of compensating it should fall on the formerly enslaved or on the public.","sr":[["New York Times: the Haitian double debt, payment dataset","https://github.com/nytimes/haiti-debt"],["UN News: how Haiti paid for its freedom, twice over","https://news.un.org/en/story/2025/04/1162406"]],"i":17},{"id":"reserve_account","n":"Holding another country's reserves","t":"debt","lat":48.8637,"lon":2.341,"pl":"Paris, France","ad":"Banque de France, 31 rue Croix des Petits Champs, 75001 Paris","ro":"Requiring former colonies to deposit a share of their foreign exchange with the former colonial power, which governs the terms on which they can trade and borrow.","who":"The operations accounts for the two CFA franc zones were held at the French Treasury, with the Banque de France acting as the technical counterpart.","rch":"regional","mx":["cond","cred"],"rd":"Fourteen African countries use currencies, the two CFA francs, that were created in 1945 and pegged first to the French franc and then to the euro. Under the arrangements that governed them, each central bank deposited half of its foreign exchange reserves in an operations account at the French Treasury, and French representatives sat on the central bank boards. The guarantee of convertibility was real, and so was the loss of control: monetary policy was set to defend a peg, and the reserves backing it were held abroad.\nThe West African arrangement was revised in 2019 and 2020. The currency was renamed the eco, the reserve deposit requirement was ended, and French representatives left the board of the regional central bank, though the peg to the euro and the French guarantee remain. The Central African zone retained the operations account longer and has been negotiating its own revision. Critics within the region, including economists and parliamentarians, have argued for years that the peg suited exporters of raw commodities and French firms operating in the zone more than it suited industrialisation.\nWhat the arrangement illustrates is that formal independence and monetary independence are separate things, and that the institutions created at the end of empire often outlived it by decades with their mechanics intact.","sr":[["Banque de France: the monetary cooperation agreements with the franc zone","https://www.banque-france.fr/en/financial-stability/international-role/franc-zone"],["IMF: West African Economic and Monetary Union, country reports","https://www.imf.org/en/Countries/ResRep/WAEMU"]],"i":18},{"id":"slavery_finance","n":"Insuring and financing the trade in people","t":"debt","lat":51.5129,"lon":-0.0822,"pl":"London, United Kingdom","ad":"Lloyd's of London, One Lime Street, London EC3M 7HA","ro":"Providing the insurance and credit without which the Atlantic slave trade could not have operated as a commercial enterprise.","who":"Lloyd's, founded in 1688, was the principal marine insurance market; research into its own archive was published in 2023 by the Black Beyond Data project at Johns Hopkins University.","rch":"global","mx":["cred","rent"],"rd":"A slaving voyage was a financed, insured venture with investors, underwriters and a return calculated in advance. The research Lloyd's commissioned and did not control found that the market insured the largest slave-ship owners of the early nineteenth century, that at least a third of British slaving voyages in 1807 were underwritten in whole or in part through Lloyd's, and that a chairman of the market between 1811 and 1824 was himself an enslaver.\nInsurance treated the people aboard as cargo, which is what made the Zong case of 1783 a dispute about an insurance claim rather than a murder trial. Lloyd's apologised in 2020 and committed about £52 million to racial equality programmes in 2023, declining to pay reparations; historians including Kehinde Andrews responded that the market's role had long been a matter of record.\nThe capital accumulated in this period did not disappear when abolition came. It was reinvested in railways, in banks, in country estates and in endowments, and the compensation paid to British slave owners in 1834, traced by the Legacies of British Slavery project at University College London, distributed a further £20 million among them. The institutions and family fortunes built on it still exist, which is the sense in which an eighteenth-century trade is a present-day mechanism.","sr":[["Guardian: Lloyd's of London slavery review and reparations","https://www.theguardian.com/business/2023/nov/08/lloyds-of-london-slavery-review-reparations"],["UCL: Legacies of British Slavery database","https://www.ucl.ac.uk/lbs/"]],"i":19},{"id":"creditor_first","n":"Paying creditors before pensioners","t":"debt","lat":18.4253,"lon":-66.0661,"pl":"San Juan, Puerto Rico","ad":"Financial Oversight and Management Board, World Plaza, 268 Avenida Muñoz Rivera, San Juan, PR 00918","ro":"Deciding, in advance and outside any election, that bondholders have a stronger claim on public revenue than the people who worked for the government.","who":"The Financial Oversight and Management Board, created by the US Congress in 2016 under PROMESA, represents Puerto Rico in its own bankruptcy and controls its budget.","rch":"regional","mx":["cred","cond"],"rd":"Puerto Rico accumulated more than $70 billion of debt and over $50 billion of unfunded pension obligations, and as a territory it was excluded from the chapter of the US bankruptcy code that cities use. Congress responded in 2016 with PROMESA, which created a restructuring process and a board of seven appointees with authority over the island's budget that overrides the elected government. Residents of Puerto Rico do not vote for that Congress.\nThe restructuring reduced liabilities to about $37 billion. Bondholders received cash and new securities in the settlement. Retirees received a cut and a freeze on benefits which an analysis of the plan of adjustment valued at $12.5 billion over forty years, about 19 per cent of what had been promised. Over the same period more than a hundred schools closed and the University of Puerto Rico's budget was reduced substantially, while the professional fees of the restructuring itself ran past a billion dollars.\nThe order of payment in a public insolvency is not a technical matter. It is a decision about which obligations are real, and it is usually taken before the people affected know the question is being asked. A teacher's pension is a deferred wage, earned and not yet paid; treating it as adjustable and a bond as fixed transfers the loss from one group to the other.","sr":[["Financial Oversight and Management Board: Puerto Rico's debt restructuring","https://oversightboard.pr.gov/debt/"],["Center for Popular Democracy and ACRE: PROMESA has failed","https://populardemocracy.org/wp-content/uploads/2025/01/ENGLISH-PROMESA-Has-Failed-Report-CPD-ACRE-9-14-2021-FINAL.pdf"]],"i":20},{"id":"isds","n":"Suing a government in a private tribunal","t":"debt","lat":38.899,"lon":-77.0426,"pl":"Washington, DC, United States","ad":"International Centre for Settlement of Investment Disputes, 1818 H Street NW, Washington, DC 20433","ro":"Allowing a foreign investor to claim compensation from a state, outside its courts, for laws that reduce the value of an investment.","who":"ICSID, housed at the World Bank, administers most investor-state arbitrations; the right to bring them comes from investment treaties and from contracts.","rch":"global","mx":["cap","cred"],"rd":"Investment treaties signed from the 1960s onward give foreign investors a right to arbitration against the host state. A claim is heard by a tribunal of three arbitrators, usually sitting in private, and an award is enforceable in most countries under the ICSID and New York conventions. Awards have run into billions of dollars, and the largest have arisen from measures such as the cancellation of a mining permit, the reversal of a privatisation and the regulation of tobacco packaging.\nThe asymmetry is structural. States can be respondents and cannot be claimants, and the system has no appeal on the merits. Developing countries have paid substantial sums and, more often, have faced the prospect of paying, which is where the effect on policy sits. The threat of a claim has been cited in the withdrawal or weakening of measures on mining, water and public health, a phenomenon the UN Conference on Trade and Development and academic researchers have examined under the heading of regulatory chill.\nA country that loses an award pays it out of current revenue. The amount is set by reference to the profits an investor expected to earn over the life of a project, which means a state can be required to compensate a company for decades of forgone income out of a single year's budget.","sr":[["UNCTAD: investment dispute settlement navigator","https://investmentpolicy.unctad.org/investment-dispute-settlement"],["ICSID: caseload statistics","https://icsid.worldbank.org/resources/publications/icsid-caseload-statistics"]],"i":21},{"id":"wage_ceiling","n":"The ceiling on the public payroll","t":"debt","lat":38.899,"lon":-77.0426,"pl":"Washington, DC, United States","ad":"World Bank, 1818 H Street NW, Washington, DC 20433","ro":"Capping what a government may spend on public employees as a condition of lending, which limits how many teachers, nurses and inspectors a country can hire.","who":"Wage bill ceilings appear in World Bank operations and IMF programmes, negotiated with finance ministries rather than with the ministries that employ the staff.","rch":"global","mx":["cond","priv","excl"],"rd":"A ceiling on the public sector wage bill is an attractive condition for a lender because it is simple to monitor and produces immediate savings. It is expressed as a share of GDP or of revenue, and it binds the whole public workforce at once, so it is met by freezing recruitment, leaving posts vacant and holding salaries below inflation rather than by any assessment of which services are needed.\nResearch by ActionAid, the Public Services International federation and others has traced the consequences in health and education systems across sub-Saharan Africa and South Asia: trained nurses unemployed while clinics are understaffed, teachers hired on short contracts outside the public payroll at a fraction of the salary, and class sizes that rise as enrolment grows. Countries have recruited community health workers and volunteer teachers precisely because they do not count against the ceiling, which produces a second tier of public employment without security, pension or training.\nThe effect compounds through the people who depend on those services. A child in a class of ninety, taught by someone with a few weeks of preparation, does not recover the arithmetic that was not taught. The lender's objective, a sustainable fiscal path, is defensible on its own terms; the instrument chosen reaches the next generation more reliably than it reaches the deficit.","sr":[["ActionAid, Education International and Public Services International: The Public Versus Austerity","https://actionaid.org/publications/2021/public-versus-austerity-why-public-sector-wage-bill-constraints-must-end"],["World Bank: public sector employment and compensation data","https://www.worldbank.org/en/topic/governance/brief/worldwide-bureaucracy-indicators"]],"i":22},{"id":"undischargeable","n":"The debt that bankruptcy will not clear","t":"debt","lat":38.8866,"lon":-77.0167,"pl":"Washington, DC, United States","ad":"US Department of Education, 400 Maryland Avenue SW, Washington, DC 20202","ro":"Exempting student loans from ordinary bankruptcy discharge, so that a debt taken on at eighteen can follow a person into retirement.","who":"The Office of Federal Student Aid holds the portfolio; the discharge restriction is in section 523(a)(8) of the Bankruptcy Code, enacted by Congress and tightened in 2005.","rch":"national","mx":["cred","excl"],"rd":"Bankruptcy exists so that a debt which cannot be paid stops being paid. Student loans are the large exception in the United States: since the 1970s, and more firmly since the 2005 amendments, they are discharged only if a court finds that repayment imposes undue hardship, a test that in practice very few borrowers meet. Collection is also easier than for other debts. The government can take wages, tax refunds and part of a Social Security payment administratively, without first going to court.\nThe portfolio stood at more than $1.6 trillion owed by about 43 million borrowers as of September 2025, according to the Government Accountability Office. In March 2026 the administration announced that management would move to the Treasury. A senior department official said at the time that 9.2 million borrowers were in default, with a further 2.4 million in late-stage delinquency.\nThe transmission across generations runs in both directions. Parents borrow through the Parent PLUS programme on behalf of children, and carry the balance into their sixties. Students whose families can pay the same tuition in cash begin working life without the debt, which affects when they can buy a house and what they can accumulate. The borrowing is required because the credential is required, and the price of the credential is set by institutions that know the loan is available.","sr":[["GAO-26-107780: federal student loans and loan servicers","https://files.gao.gov/assets/gao-26-107780.pdf"],["NPR: federal student loans move to the Treasury","https://www.npr.org/2026/03/19/nx-s1-5753906/student-loans-trump-treasury"]],"i":23},{"id":"holdout","n":"The holdout creditor and the equal treatment clause","t":"debt","lat":40.714,"lon":-74.002,"pl":"New York, United States","ad":"US District Court for the Southern District of New York, 500 Pearl Street, New York, NY 10007","ro":"Allowing an investor who bought defaulted government debt cheaply to block a restructuring that the great majority of creditors accepted.","who":"The Southern District of New York hears most sovereign bond litigation, because New York law governs most emerging market bonds; the Argentine case was decided here between 2012 and 2016.","rch":"global","mx":["cred","cap"],"rd":"When Argentina defaulted in 2001, it restructured by offering new bonds worth roughly a third of the originals. More than 90 per cent of creditors eventually accepted. A small group, led by funds that had bought the defaulted bonds at a steep discount, refused and sued in New York for payment in full, relying on a clause in the bond contracts requiring the issuer to treat creditors equally. The court read that clause to mean Argentina could not pay the creditors who had accepted the restructuring unless it also paid those who had not.\nThe ruling was enforceable because the payment system runs through New York. Argentina was effectively excluded from international capital markets for years, and in 2016 settled with the holdouts for about $4.65 billion, a return of several times what they had paid. Contract terms have since changed, with collective action clauses now standard in sovereign bonds so that a qualified majority can bind a minority, but the older stock of debt remains and the precedent stands in the case law.\nWhat the episode established is where sovereign debt is actually decided. A country can vote to restructure, and its creditors can agree, and a court in another jurisdiction can still determine what is paid and in what order.","sr":[["Cornell Legal Information Institute: Republic of Argentina v. NML Capital","https://www.law.cornell.edu/supct/cert/12-842"],["IMF: strengthening the contractual framework for sovereign debt restructuring","https://www.imf.org/en/Publications/Policy-Papers/Issues/2016/12/31/Strengthening-the-Contractual-Framework-to-Address-Collective-Action-Problems-in-Sovereign-PP4911"]],"i":24},{"id":"wage_board","n":"A wage fixed once every five years","t":"bind","lat":23.733,"lon":90.41,"pl":"Dhaka, Bangladesh","ad":"Minimum Wage Board, Shrom Bhaban, 4 Rajuk Avenue, Dhaka 1000","ro":"Setting the garment wage by board every few years rather than by bargaining, so that it falls in real terms between revisions.","who":"The Minimum Wage Board is convened by the Ministry of Labour and Employment with employer and worker representatives; the garment sector employs around four million people.","rch":"national","mx":["floor","tied"],"rd":"Bangladesh's garment industry supplies a large share of the clothing sold in Europe and North America and provides more than 80 per cent of the country's export earnings. The wage floor for it is set by a board, not negotiated factory by factory, and revisions come roughly every five years. The figure set in December 2023 was 12,500 taka a month, up from 8,000 in 2018. Unions had sought roughly double, and the protests that preceded the decision ended with deaths, mass dismissals and criminal cases against organisers.\nBetween revisions the floor does not move while prices do, so the real wage declines for several years and is then partially restored. Factory owners negotiate against buyers whose purchasing decisions are made on price and lead time, and a significant number of owners sit in parliament, which places employers on both sides of the process that sets the wage.\nWhat follows in the households is predictable and has been documented since the 1990s: long overtime, children leaving school early to add an income, and no capacity to save. The industry has changed building safety substantially since the collapse of Rana Plaza in 2013, under an accord signed by brands and unions. Wages were not part of that agreement.","sr":[["Clean Clothes Campaign: the Bangladesh minimum wage decision","https://cleanclothes.org/news/2023/bangladesh-minimum-wage-announcement"],["International Labour Organization: Bangladesh country programme","https://www.ilo.org/regions-and-countries/asia-and-pacific/bangladesh"]],"i":25},{"id":"flag_registry","n":"Choosing which country's law applies at sea","t":"bind","lat":8.954,"lon":-79.534,"pl":"Panama City, Panama","ad":"Panama Maritime Authority, Edificio PSA, Diablo Heights, Panama City","ro":"Registering a ship in a state with no connection to its owners or crew, which selects the labour, tax and safety law that will govern it.","who":"The Panama Maritime Authority operates the largest open registry; Liberia and the Marshall Islands operate the next largest.","rch":"global","mx":["tied","hide","floor"],"rd":"A ship is governed by the law of the state whose flag it flies. An open registry will flag a vessel regardless of where its owners live or where it trades, for a fee, which lets an owner choose the wage rules, the tax treatment and the inspection regime that will apply. Panama, Liberia and the Marshall Islands between them account for a large share of world tonnage, and none has a merchant fleet of its own in any meaningful sense.\nThe consequence for crews is that an owner can be difficult to identify and harder to sue. The International Transport Workers' Federation campaigns against the practice for that reason, negotiating collective agreements vessel by vessel because there is no national framework to bargain within. Abandonment, where a shipowner stops paying and leaves a crew aboard in a foreign port without wages, food or a flight home, is recorded in the hundreds of cases a year in the joint database maintained by the ILO and the International Maritime Organization.\nThe same logic of choosing the applicable law appears in corporate registration and in the tax treatment of profits. At sea it is unusually visible, because the vessel itself is physically present and the jurisdiction governing it is somewhere the crew has never been.","sr":[["IMO and ILO: database on abandonment of seafarers","https://www.imo.org/en/OurWork/Legal/Pages/Default.aspx"],["ITF Seafarers: flags of convenience","https://www.itfseafarers.org/en/focs"]],"i":26},{"id":"registration","n":"Household registration inherited from a parent","t":"bind","lat":39.908,"lon":116.406,"pl":"Beijing, China","ad":"Ministry of Public Security, 14 Dongchang'an Street, Dongcheng District, Beijing","ro":"Attaching schooling, health care and pensions to a registered place of origin that passes from parent to child, so that moving for work means losing them.","who":"The hukou system, established in 1958, is administered by the Ministry of Public Security; eligibility reform is decided province by province and city by city.","rch":"national","mx":["tied","excl"],"rd":"Every Chinese citizen has a household registration tied to a place and classified, historically, as agricultural or non-agricultural. Public services are provided where a person is registered rather than where they live. A worker who moves from a rural county to a coastal city can work there for twenty years and still be entitled to schooling and health care only in the place of origin, and the registration passes to the children.\nThe scale is what distinguishes it. Several hundred million people work outside the place they are registered. Their children eit
