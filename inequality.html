the public-sector wage bill, which means fewer nurses and teachers; subsidy removal, which raises the price of fuel and bread for people who have no alternative; VAT increases, which take a larger share of a poor household's spending than a rich one's; and privatisation of state enterprises. ActionAid found that in ten African countries, eight had been told to cut or freeze the public wage bill, and that wage-bill constraints in fifteen countries had blocked the recruitment of more than three million nurses, teachers and other public workers.\nOxfam's 2026 analysis of 161 loans across 81 countries found the required cuts in loans since 2018 were about five times deeper than in the preceding six years.","mn":"The conditions on a rescue loan decide whether a country's recovery is paid for by its richest taxpayers or by the nurses it can no longer hire — and it has almost always been the second.","pt":["p11","p4"],"sr":[["Oxfam: countries locked into IMF austerity programmes (2026)","https://www.oxfam.org/en/press-releases/countries-locked-imf-austerity-programs-are-also-around-twice-vulnerable-economic"],["ActionAid, 'Fifty Years of Failure: The IMF, Debt and Austerity in Africa'","https://actionaid.org/publications/2023/fifty-years-failure-imf-debt-and-austerity-africa"]],"i":37},{"id":"worldbank","n":"World Bank","t":"inst","lat":38.899,"lon":-77.0425,"pl":"Washington, DC, United States","ad":"1818 H Street NW, Washington, DC 20433","ro":"Development lender whose conditions reshaped public services across the global south.","who":"Ajay Banga, president (by convention always an American nominee)","rch":"global","mx":["priv","aust","debt"],"fg":[["Structural adjustment","the dominant lending framework from about 1980 to the late 1990s"],["Doing Business rankings","discontinued in 2021 after an investigation found data had been altered to favour particular countries"],["User fees","cost-recovery conditions in health and education, later partly disavowed by the Bank itself"]],"rd":"For two decades the Bank's loans came with structural adjustment: open the economy, shrink the state, charge fees for services, sell the utilities. The policies were adopted by governments that needed the money, and their effects on school enrolment and clinic attendance are among the best-documented in development economics. The Bank itself eventually retreated from user fees for primary health and education.\nIt also ran Doing Business, an annual ranking that scored countries partly on how light their labour and tax rules were, and so rewarded governments for weakening protections. The Bank shut the ranking down in 2021 after an inquiry found staff had altered data under pressure.","mn":"Advice from a lender you cannot refuse is not advice, and the countries that took it were told to charge their poorest citizens for school and water.","pt":["p11","p8"],"sr":[["World Bank statement on discontinuing Doing Business (2021)","https://www.worldbank.org/en/news/statement/2021/09/16/world-bank-group-to-discontinue-doing-business-report"],["WilmerHale investigation of Doing Business data irregularities","https://thedocs.worldbank.org/en/doc/84a922cc9273b7b120d49ad3b9e9d3f9-0090012021/original/DB-Investigation-Findings-and-Report-to-the-Board-of-Executive-Directors-September-15-2021.pdf"]],"i":38},{"id":"icsid","n":"ICSID (investor–state arbitration)","t":"inst","lat":38.8982,"lon":-77.0412,"pl":"Washington, DC, United States","ad":"1818 H Street NW (MSN J2-200), Washington, DC 20433","ro":"The tribunal where a company sues a country for passing a law.","who":"International Centre for Settlement of Investment Disputes, hosted by the World Bank Group","rch":"global","mx":["law","debt","priv"],"fg":[["Cases registered","over 900 since 1966, the large majority since 2000"],["Largest award","$50 billion against Russia in the Yukos arbitrations (under a related treaty regime)"],["Who can sue","investors can sue states; states cannot sue investors"]],"rd":"Thousands of trade and investment treaties give foreign companies the right to bypass a country's courts and sue the government itself before a private tribunal of three arbitrators, claiming compensation for measures that reduce the value of their investment. Raising a minimum wage, cancelling a water concession, denying a mining permit after a community referendum, introducing plain-packaging rules — all have been litigated. Awards can run into billions and are enforceable against state assets abroad.\nThe deeper effect is the one that never reaches a hearing: governments drop or water down measures because of the risk of a claim. Lawyers call it regulatory chill.","mn":"A government can be made to pay a foreign company for the privilege of protecting its own citizens, and so it often decides not to protect them.","pt":["p3","p8"],"sr":[["ICSID caseload statistics","https://icsid.worldbank.org/resources/publications/icsid-caseload-statistics"],["UNCTAD Investment Dispute Settlement Navigator","https://investmentpolicy.unctad.org/investment-dispute-settlement"]],"i":39},{"id":"wto","n":"World Trade Organization","t":"inst","lat":46.2243,"lon":6.148,"pl":"Geneva, Switzerland","ad":"Centre William Rappard, Rue de Lausanne 154, 1211 Geneva","ro":"Where the rules on patents, subsidies and tariffs are agreed — and where the TRIPS agreement was written.","who":"Ngozi Okonjo-Iweala, director-general","rch":"global","mx":["price","law","chain"],"fg":[["TRIPS (1995)","obliged all members to grant 20-year patents, including on medicines"],["Covid-19 waiver","requested by India and South Africa in October 2020; a narrow vaccine-only decision followed in June 2022"],["Agricultural subsidies","rich-country farm support remains largely intact under the rules"]],"rd":"The TRIPS agreement exported a particular idea of property: that a formula or a seed variety can be owned for twenty years everywhere on earth. Countries that had built generic pharmaceutical industries — India above all — had to change their patent law. During the HIV epidemic that difference was measured in lives, until public pressure forced price concessions; during Covid-19, India and South Africa asked for a waiver and were blocked for eighteen months, mostly by the European Union, the UK and Switzerland.\nThe same rulebook left rich-country farm subsidies substantially untouched while requiring poor countries to open their markets to the crops those subsidies produce.","mn":"The rules decide who may make a medicine or plant a seed, and they were written by the countries whose companies already owned the patents.","pt":["p5","p8"],"sr":[["WTO, TRIPS agreement and public health","https://www.wto.org/english/tratop_e/trips_e/pharmpatent_e.htm"],["WTO ministerial decision on the TRIPS agreement, June 2022","https://www.wto.org/english/thewto_e/minist_e/mc12_e/documents_e.htm"]],"i":40},{"id":"bis","n":"Bank for International Settlements","t":"inst","lat":47.5478,"lon":7.5898,"pl":"Basel, Switzerland","ad":"Centralbahnplatz 2, 4051 Basel","ro":"The central bank of central banks; writes the capital rules that govern who gets credit.","who":"Pablo Hernández de Cos, general manager","rch":"global","mx":["debt","own"],"fg":[["Basel accords","Basel I (1988) through Basel III and its 2023–30 endgame revisions"],["Immunity","the BIS premises and archives enjoy immunity from Swiss jurisdiction under a headquarters agreement"]],"rd":"The Basel rules decide how much capital a bank must hold against each kind of loan, which in practice decides which loans get made. Mortgages and government bonds are treated as safe and are cheap to hold; small business loans and lending to poorer countries are treated as risky and are expensive. The result is a banking system structurally tilted towards lending against existing assets rather than financing new production — which pushes up the price of houses and land while small firms queue.\nThe rules are made by central bankers and supervisors in closed committee, with no legislature voting on them.","mn":"Technical capital rules written in Basel are a large part of why it is easy to borrow to buy a house and hard to borrow to start a business.","pt":["p6","p4"],"sr":[["Basel Committee on Banking Supervision, Basel III framework","https://www.bis.org/bcbs/basel3.htm"],["BIS headquarters agreement with Switzerland","https://www.bis.org/about/legal.htm"]],"i":41},{"id":"wef","n":"World Economic Forum","t":"inst","lat":46.2272,"lon":6.179,"pl":"Cologny, Geneva, Switzerland","ad":"Route de la Capite 91–93, 1223 Cologny","ro":"The annual meeting where the people who own the economy and the people who regulate it talk privately.","who":"Founded by Klaus Schwab (chairman until 2024); governance restructured after 2025 investigations","rch":"global","mx":["law","own"],"fg":[["Membership","strategic partner fees in the hundreds of thousands of Swiss francs a year"],["Davos","around 2,500–3,000 participants annually, including heads of state and central bankers"],["Oxfam timing","Oxfam has released its annual inequality report to coincide with Davos since 2014"]],"rd":"Davos is not a decision-making body and does not need to be. It is where a chief executive can spend a week in the same small town as the finance ministers and central bankers who regulate them, with no minutes and no obligation to register as a lobbyist. The Forum's own framing — ‘stakeholder capitalism’, public-private partnership, multi-stakeholder governance — proposes that global problems be solved by exactly this mix of people rather than by governments answerable to voters.\nOxfam has published its inequality figures each January in Davos precisely because the audience is there; the 2026 edition put billionaire wealth at $18.3 trillion.","mn":"Access is the quietest form of power: being in the room for a week each year does more than any single piece of lobbying.","pt":["p3"],"sr":[["Oxfam, 'Resisting the Rule of the Rich' methodology note (January 2026)","https://www.oxfam.de/system/files/documents/2026-01/20260119-resisting-rule-rich-methodology-note.pdf"],["World Economic Forum partnership structure","https://www.weforum.org/partners/"]],"i":42},{"id":"oecd","n":"OECD","t":"inst","lat":48.8574,"lon":2.2707,"pl":"Paris, France","ad":"2 rue André Pascal, 75775 Paris Cedex 16","ro":"The rich countries' club that writes international tax rules for everyone.","who":"Mathias Cormann, secretary-general","rch":"global","mx":["tax","law"],"fg":[["Membership","38 countries, overwhelmingly high-income"],["Global minimum tax","15% under Pillar Two, in force in many jurisdictions from 2024"],["UN alternative","in 2023 the UN General Assembly voted 125–48 to begin work on a UN tax convention, against opposition from several OECD members"]],"rd":"For sixty years the rules on how multinational profit is divided between countries have been drafted at the OECD, a body of 38 mostly wealthy states. The two-pillar deal agreed in 2021 introduced a 15% global minimum tax — a real change — but set the rate at roughly the level of the lowest-taxing OECD members, and allocated most of the extra revenue to the countries where companies are headquartered rather than where they operate.\nAfrican governments pushed the matter to the UN instead, where every country has a vote. The 2023 resolution passed 125 to 48; among the states voting against were the UK, the US, Japan, Canada, Australia, South Korea, Israel and New Zealand — the eight that the Tax Justice Network calculates enable 43% of global tax losses.","mn":"Rules made by the countries where the companies live will keep allocating the tax to the countries where the companies live.","pt":["p2","p8"],"sr":[["Tax Justice Network: eight countries blocking UN tax reform","https://taxjustice.net/press/world-losing-half-a-trillion-to-tax-abuse-largely-due-to-8-countries-blocking-un-tax-reform-annual-report-finds/"],["OECD two-pillar solution","https://www.oecd.org/tax/beps/"]],"i":43},{"id":"fed","n":"US Federal Reserve Board","t":"inst","lat":38.8925,"lon":-77.0455,"pl":"Washington, DC, United States","ad":"20th Street and Constitution Avenue NW, Washington, DC 20551","ro":"Sets the price of money, and with it the balance between wages and assets.","who":"Board of Governors of the Federal Reserve System","rch":"global","mx":["own","debt","wage"],"fg":[["Quantitative easing","the Fed's balance sheet grew from under $1 trillion in 2007 to about $9 trillion by 2022"],["Who owns assets","the wealthiest 10% of US households own the large majority of corporate equities and mutual fund shares"],["Dual mandate","maximum employment and stable prices, under the Federal Reserve Act"]],"rd":"Two decisions by central banks moved more wealth upward than most tax policies of the same period. The first was buying trillions in bonds after 2008 and again after 2020, which lifted the price of shares, bonds and property — assets held overwhelmingly by the richest tenth of households. The second is raising rates to control inflation, which works mainly by slowing hiring and weakening workers' bargaining power; the Fed's own framework once described this in terms of loosening the labour market.\nNeither choice is a conspiracy. Both are the predictable result of giving one instrument to an institution whose tools act on asset prices first and wages last.","mn":"The cheapest way to fight inflation with interest rates is to make jobs harder to get, and the cheapest way to rescue an economy with bond-buying is to make the already-wealthy wealthier.","pt":["p1","p6"],"sr":[["Federal Reserve, Distributional Financial Accounts","https://www.federalreserve.gov/releases/z1/dataviz/dfa/"],["Federal Reserve balance sheet (H.4.1)","https://www.federalreserve.gov/releases/h41/"]],"i":44},{"id":"ecb","n":"European Central Bank","t":"inst","lat":50.1093,"lon":8.7033,"pl":"Frankfurt, Germany","ad":"Sonnemannstrasse 20, 60314 Frankfurt am Main","ro":"The institution that enforced austerity on Europe's periphery as a condition of keeping the banks open.","who":"Christine Lagarde, president","rch":"regional","mx":["aust","debt"],"fg":[["Troika","the ECB sat with the European Commission and the IMF in the Greek, Irish, Portuguese and Cypriot programmes"],["Greece","pensions cut repeatedly; unemployment peaked above 27%, youth unemployment above 50%"],["2015","emergency liquidity to Greek banks capped during the referendum standoff, forcing bank closures"]],"rd":"In 2010–15 the ECB was simultaneously the central bank of the countries it was negotiating with and a creditor demanding terms. In Ireland it pressed the government not to write down bank bondholders. In Greece it froze the emergency liquidity that kept cash machines working while a referendum was under way. The programmes that followed cut pensions, public wages and health budgets; Greek output fell by a quarter and has never fully recovered.\nIn each case the bondholders were paid in full and the adjustment fell on pensioners, public employees and the unemployed.","mn":"When a central bank can switch off a country's banking system, the negotiation over who absorbs a crisis is already over.","pt":["p11","p4"],"sr":[["European Parliament inquiry into the role of the Troika","https://www.europarl.europa.eu/doceo/document/A-7-2014-0149_EN.html"],["Eurostat, Greek macroeconomic series","https://ec.europa.eu/eurostat/web/national-accounts"]],"i":45},{"id":"uscongress","n":"United States Congress","t":"state","lat":38.8899,"lon":-77.0091,"pl":"Washington, DC, United States","ad":"US Capitol, First Street SE, Washington, DC 20004","ro":"Writes the tax code that sets how American wealth is taxed, and the labour law that sets how it is contested.","who":"535 members of the House and Senate","rch":"global","mx":["law","tax","wage"],"fg":[["Federal minimum wage","$7.25 an hour since July 2009 — the longest period without an increase since 1938"],["2017 Tax Cuts and Jobs Act","cut the corporate rate from 35% to 21%, permanently"],["Carried interest","still taxed at capital-gains rates"],["Federal lobbying, 2025","passed $5 billion for the first time (OpenSecrets)"],["Gilens & Page (2014)","economic elites and business groups have substantial independent influence on policy; average citizens have close to none"]],"rd":"Two numbers describe most of American inequality policy. The federal minimum wage has been $7.25 since 2009, which after inflation is worth roughly a third less than it was then. The corporate tax rate was cut from 35% to 21% in 2017, permanently, while the cuts for individuals were written to expire. Carried interest — the mechanism by which private-equity managers have their fee income taxed as capital gains — has survived every administration that promised to end it.\nMartin Gilens and Benjamin Page studied nearly 1,800 policy questions and found that when the preferences of affluent Americans and organised business diverge from those of the median voter, the median voter's preferences have almost no measurable effect on what passes.","mn":"The gap is not an accident of the market: it is a set of specific laws, each with a sponsor, a vote count and a date.","pt":["p3"],"sr":[["Gilens & Page, 'Testing Theories of American Politics' (2014)","https://www.cambridge.org/core/journals/perspectives-on-politics/article/testing-theories-of-american-politics-elites-interest-groups-and-average-citizens/62327F513959D0A304D4893B382B992B"],["OpenSecrets, federal lobbying totals","https://www.opensecrets.org/federal-lobbying"]],"i":46},{"id":"ustreasury","n":"US Department of the Treasury","t":"state","lat":38.8977,"lon":-77.0345,"pl":"Washington, DC, United States","ad":"1500 Pennsylvania Avenue NW, Washington, DC 20220","ro":"Enforces the tax code — or does not — and holds the US veto at the IMF.","who":"Secretary of the Treasury; the IRS reports to the department","rch":"global","mx":["tax","aust"],"fg":[["Audit rates","IRS audit rates on millionaires fell sharply over the 2010s as enforcement funding was cut"],["Tax gap","the IRS estimates annual unpaid federal tax of roughly $600–700 billion"],["Beneficial ownership","the Corporate Transparency Act registry was sharply narrowed in 2025 to exclude most US companies"]],"rd":"A tax rate is only as real as the audit behind it. Through the 2010s the IRS lost a quarter of its staff and audits of the highest-income returns fell furthest, because auditing a complex partnership takes specialists and auditing a wage earner takes software. ProPublica's reporting on leaked IRS data showed several of the wealthiest Americans paying nothing in federal income tax in particular years, legally, because wealth that is never sold is never income.\nIn 2025 the beneficial-ownership registry created to identify who really owns American companies was narrowed to exclude domestic ones, leaving the United States again one of the easiest places on earth to own a company anonymously.","mn":"Rules that are not enforced are not rules, and enforcement has been cut hardest exactly where the money is.","pt":["p2","p10"],"sr":[["ProPublica, 'The Secret IRS Files'","https://www.propublica.org/article/the-secret-irs-files-trove-of-never-before-seen-records-reveal-how-the-wealthiest-avoid-income-tax"],["FinCEN beneficial ownership information reporting rule change (2025)","https://www.fincen.gov/boi"]],"i":47},{"id":"bercy","n":"French Ministry for the Economy and Finance","t":"state","lat":48.84,"lon":2.376,"pl":"Paris, France","ad":"139 rue de Bercy, 75572 Paris Cedex 12","ro":"Collector of the Haitian indemnity, and for sixty years the guarantor of the CFA franc.","who":"Minister for the Economy and Finance; the Banque de France operated the CFA reserve accounts","rch":"global","mx":["debt","priv"],"fg":[["Haiti, 1825","France demanded 150 million francs for recognition of independence, later reduced to 90 million"],["Actually paid","about 112 million francs over seven decades — roughly $560 million in 2022 dollars; the NYT estimated $115 billion in lost growth"],["Final payment","1947, to National City Bank of New York (now Citibank)"],["CFA franc","until 2019–21 reforms, African member states deposited half their foreign reserves with the French Treasury"]],"rd":"In April 1825, with French warships off Port-au-Prince, Haiti agreed to pay 150 million francs — compensation to the slaveholders it had defeated — in exchange for being recognised as a country. The first instalment alone was about six times Haiti's annual revenue, so Haiti borrowed from French banks to pay French planters: the double debt. The New York Times' reconstruction of the payments found 112 million francs paid across seven decades, with the last related interest settled in 1947, and estimated the cost in forgone growth at around $115 billion.\nA related arrangement ran into living memory. Under the CFA franc, fourteen African countries kept half their foreign exchange reserves in an operations account at the French Treasury, and France held a veto on the central banks' boards. The reserve requirement was ended in 2019–21 for West Africa; France's guarantee and influence remain.","mn":"Some countries are poor because of a bill they were made to pay for being free, and the bill has a date, an amount and an address.","pt":["p9","p4"],"sr":[["The Ransom (New York Times series on Haiti's double debt), data repository","https://github.com/nytimes/haiti-debt"],["UN News, 'How Haiti paid for its freedom — twice over'","https://news.un.org/en/story/2025/04/1162406"]],"i":48},{"id":"ukhmt","n":"HM Treasury","t":"state","lat":51.502,"lon":-0.127,"pl":"London, United Kingdom","ad":"1 Horse Guards Road, London SW1A 2HQ","ro":"Sovereign over the world's largest network of tax havens, and architect of a decade of austerity.","who":"Chancellor of the Exchequer","rch":"global","mx":["tax","aust"],"fg":[["UK network","Crown Dependencies and Overseas Territories account for about 23% of global corporate tax losses"],["Austerity 2010–19","IFS and ONS data show the deepest sustained real cuts to local government and benefits since the war"],["Non-dom regime","abolished from April 2025 after two centuries"]],"rd":"Britain holds two distinct positions in the architecture of inequality. Abroad, it is the constitutional parent of Jersey, Guernsey, the Isle of Man, Cayman, the BVI and Bermuda — jurisdictions whose combined effect the Tax Justice Network puts at roughly a quarter of global corporate tax losses, and which the UK could change by Order in Council and does not. At home, the austerity programme after 2010 cut local government funding by around 40% in real terms per person, with the largest cuts falling on the poorest councils.\nThe non-domiciled tax status, which let residents keep foreign income untaxed, lasted from 1799 to 2025.","mn":"The same government can run a serious anti-poverty strategy at home and host the system that drains the tax base of every other country, because the two live in different departments.","pt":["p10","p11"],"sr":[["Institute for Fiscal Studies on local government funding cuts","https://ifs.org.uk/publications/english-local-government-funding-trends-and-challenges-2019-and-beyond"],["Tax Justice Network (research on the UK's network of tax havens)","https://taxjustice.net/"]],"i":49},{"id":"fifa","n":"FIFA","t":"inst","lat":47.381,"lon":8.574,"pl":"Zurich, Switzerland","ad":"FIFA-Strasse 20, 8044 Zurich","ro":"Awards tournaments — and the construction booms that follow — to states that run tied-labour systems.","who":"Gianni Infantino, president","rch":"global","mx":["mob","wage"],"fg":[["Qatar 2022","a decade of construction by migrant workers under kafala; thousands of unexplained deaths and widespread wage theft documented by HRW and Amnesty"],["Saudi Arabia 2034","awarded in December 2024; the Building and Wood Workers' International, representing 12 million members, had alleged severe abuses and wage theft under kafala"],["Remedy","no comprehensive compensation fund for Qatar's migrant workers was established"]],"rd":"A World Cup is a construction programme with a deadline, and in the Gulf that programme is built by workers whose legal right to stay is attached to the employer they cannot leave. Human Rights Watch and Amnesty documented thousands of unexplained migrant deaths in Qatar, recruitment debts of a thousand dollars or more carried by workers earning a few hundred a month, and widespread non-payment of wages. Reforms were legislated and, as Human Rights Watch found again in 2025 and 2026, largely not enforced. No comprehensive remedy fund followed.\nIn December 2024 FIFA awarded the 2034 tournament to Saudi Arabia, where the same sponsorship system operates and where it continues to document unpaid wages on multi-billion-dollar projects.","mn":"A body that can choose where the money goes can set labour conditions as a price of hosting, and has chosen not to.","pt":["p7"],"sr":[["Human Rights Watch, 'Saudi Arabia: Migrant Workers in Mecca Arrested for Demanding Unpaid Wages' (Nov 2025)","https://www.hrw.org/news/2025/11/06/saudi-arabia-migrant-workers-in-mecca-arrested-for-demanding-unpaid-wages"],["Amnesty International reporting on Qatar's labour reforms and remedy","https://www.amnesty.org/en/location/middle-east-and-north-africa/qatar/"]],"i":50},{"id":"montpelerin","n":"Mont Pelerin Society (founding site)","t":"doc","lat":46.466,"lon":6.845,"pl":"Mont Pèlerin, Vaud, Switzerland","ad":"Hôtel du Parc, Mont Pèlerin, 1801 Le Mont-Pèlerin","ro":"Where thirty-nine people met in 1947 and began rebuilding economics around markets rather than states.","who":"Convened by Friedrich Hayek; attendees included Milton Friedman, Ludwig von Mises, Karl Popper, Lionel Robbins","rch":"global","mx":["law","priv","aust"],"fg":[["Founded","10 April 1947, 39 participants"],["Nobel laureates among members","Hayek (1974), Friedman (1976), Buchanan (1986), Becker (1992), Coase (1991), Vernon Smith (2002)"],["Funding","early support from the Volker Fund and sympathetic businessmen; later from corporate foundations"]],"rd":"In April 1947, in a hotel above Lake Geneva, Hayek gathered thirty-nine economists, historians and journalists who believed the postwar consensus — planning, strong unions, public ownership, progressive taxation — was a road to tyranny. They had almost no influence for thirty years. Then stagflation arrived in the 1970s and governments went looking for a different theory, and this one was ready, with journals, textbooks, institutes and a trained cadre.\nThat is the useful lesson, whatever you think of the content: the ideas that remade the world economy were kept alive by patient funding for a generation while they were politically dead.","mn":"The policies that widened the gap did not appear from nowhere; they were written, funded and kept on a shelf for thirty years until a crisis made a government reach for them.","pt":["p8"],"sr":[["Mont Pelerin Society statement of aims (1947)","https://www.montpelerin.org/statement-of-aims/"],["Mirowski & Plehwe, 'The Road from Mont Pèlerin' (Harvard University Press, 2009)","https://www.hup.harvard.edu/books/9780674059764"]],"i":51},{"id":"chicago","n":"Chicago School of Economics","t":"doc","lat":41.79,"lon":-87.597,"pl":"Chicago, Illinois, United States","ad":"Saieh Hall for Economics, 5757 South University Avenue, Chicago, IL 60637","ro":"The department that trained the economists who ran the experiments — starting with Chile.","who":"Milton Friedman, Arnold Harberger, George Stigler, Gary Becker and colleagues","rch":"global","mx":["priv","aust","wage"],"fg":[["Chile Project","from 1956, a US-funded programme brought Chilean students to Chicago; about 100 trained by 1970"],["El Ladrillo (1973)","the economic programme the 'Chicago Boys' handed the junta within days of the coup"],["Chile's pension system","the 1981 switch to private individual accounts; replacement rates have run far below the promised levels"]],"rd":"From 1956 the University of Chicago, with US State Department and Ford Foundation money, trained a cohort of Chilean economists. After the 1973 coup they presented General Pinochet with a ready-made programme: privatise, deregulate, open to trade, replace the state pension with private accounts. Friedman visited in 1975 and recommended shock treatment. Wages fell sharply, unemployment reached a quarter of the workforce, and the share of income going to the top decile rose to levels Chile has still not undone. The 1981 pension reform is the single most exported piece of it, copied across Latin America and Eastern Europe, and the one Chileans have protested about most since.\nThe laboratory was a country where nobody could vote on the experiment.","mn":"The clearest proof that this was a policy choice rather than economic destiny is that it was first imposed by a dictatorship on people who were given no vote.","pt":["p8"],"sr":[["Valdes, 'Pinochet's Economists: The Chicago School in Chile' (Cambridge University Press)","https://www.cambridge.org/core/books/pinochets-economists/0DB2B8F6C3C1E1B4A5BE34C1CA1FE4C1"],["OECD Pensions at a Glance, Chile country profile","https://www.oecd.org/pensions/pensions-at-a-glance.htm"]],"i":52},{"id":"rochester","n":"Shareholder primacy (Jensen & Meckling)","t":"doc","lat":43.128,"lon":-77.629,"pl":"Rochester, New York, United States","ad":"Simon Business School, University of Rochester, Rochester, NY 14627","ro":"The paper that redefined a company as a bundle of contracts owing everything to its shareholders.","who":"Michael Jensen and William Meckling (1976); Jensen & Murphy on stock-based pay (1990)","rch":"global","mx":["wage","own"],"fg":[["1976","'Theory of the Firm: Managerial Behavior, Agency Costs and Ownership Structure' — one of the most cited economics papers ever written"],["1990","Jensen & Murphy argue executives are paid 'like bureaucrats' and should be paid in stock"],["CEO pay since","up 1,316% from 1978 to 2025, against 28% for typical workers (EPI)"],["Business Roundtable","adopted shareholder primacy formally in 1997; revised the statement in 2019"]],"rd":"Before the 1970s a large American company described itself as balancing the claims of shareholders, employees, customers and communities. Jensen and Meckling's agency theory recast the manager as a hired agent who would shirk unless his pay was tied to the share price. The prescription — pay executives in stock — was adopted enthusiastically, and it worked exactly as designed: executives maximised the share price. Buybacks, layoffs, offshoring and thin staffing all raise it. So, mechanically, does holding wages down.\nThe Economic Policy Institute's series shows the result: chief executive pay at the top 350 US firms rose 1,316% between 1978 and 2025 while typical worker pay rose 28%, and the ratio reached 325 to 1 in 2025, against 21 to 1 in 1965.","mn":"Once a manager's own fortune moves with the share price, cutting your pay is not a hard decision he avoids — it is the decision he is paid to make.","pt":["p1","p8"],"sr":[["Economic Policy Institute, 'CEO pay surged in 2025' ","https://www.epi.org/blog/ceo-pay-surged-in-2025-ceos-are-paid-325-times-as-much-as-the-typical-worker/"],["Jensen & Meckling (1976), Journal of Financial Economics","https://doi.org/10.1016/0304-405X(76)90026-X"]],"i":53},{"id":"washconsensus","n":"Washington Consensus (Peterson Institute)","t":"doc","lat":38.907,"lon":-77.041,"pl":"Washington, DC, United States","ad":"1750 Massachusetts Avenue NW, Washington, DC 20036","ro":"Where the ten-point programme imposed on indebted countries was written down and named.","who":"John Williamson, 1989, at the Institute for International Economics (now the Peterson Institute)","rch":"global","mx":["priv","aust","law"],"fg":[["1989","Williamson's list of ten reforms he believed Washington institutions agreed on"],["The ten","fiscal discipline, spending reprioritisation, tax reform, market interest rates, competitive exchange rates, trade liberalisation, open FDI, privatisation, deregulation, secure property rights"],["Latin America","per-capita growth over 1980–2000 was far below the 1960–80 period"]],"rd":"Williamson meant to describe what Washington already believed, not to issue a manifesto, and he spent the rest of his life objecting to how the phrase was used. It did not matter. The list became the template for the conditions attached to lending across Latin America, Africa and the former Soviet bloc. Three items — fiscal discipline, privatisation, deregulation — did most of the work, and the distributional consequences were not part of the list at all.\nThe 1980s and 1990s in Latin America are sometimes called the lost decades: in several countries income per person was lower at the end than at the start, while the top decile's share rose.","mn":"A list written on one street in Washington became the terms of life for a billion people who never saw it.","pt":["p8","p11"],"sr":[["Williamson, 'What Washington Means by Policy Reform' (1990)","https://www.piie.com/commentary/speeches-papers/what-washington-means-policy-reform"],["Stiglitz, 'Globalization and Its Discontents'","https://wwnorton.com/books/9780393324396"]],"i":54},{"id":"gmu","n":"Public choice theory (George Mason)","t":"doc","lat":38.83,"lon":-77.308,"pl":"Fairfax, Virginia, United States","ad":"Buchanan House, George Mason University, 4400 University Drive, Fairfax, VA 22030","ro":"The school that taught a generation how to insulate economic rules from majorities.","who":"James M. Buchanan and Gordon Tullock; later the Mercatus Center, substantially funded by Charles Koch","rch":"global","mx":["law","aust"],"fg":[["Nobel","Buchanan, 1986"],["Chile","Buchanan advised on constitutional design in Chile in 1980, the year of the Pinochet constitution"],["Mercatus Center","among the largest recipients of Koch foundation funding at a US university"]],"rd":"Public choice begins from a reasonable observation — politicians and civil servants have interests of their own — and arrives at a programme: since majorities will vote themselves other people's money, the rules on tax, spending and debt should be put beyond ordinary majority decision, written into constitutions, supermajority requirements and independent agencies. Buchanan advised in Chile in 1980 while a constitution doing exactly that was being drafted. Nancy MacLean's history of the movement argues this was the point rather than a side effect; critics of her book dispute the emphasis, not the advisory record.\nThe institutional residue is everywhere: balanced-budget amendments, debt brakes, tax-and-expenditure limits, state preemption of city minimum wages.","mn":"If the rules about money are moved out of reach of elections, then voting can continue without threatening anybody's wealth.","pt":["p3","p8"],"sr":[["MacLean, 'Democracy in Chains' (Viking, 2017)","https://www.penguinrandomhouse.com/books/212004/democracy-in-chains-by-nancy-maclean/"],["Buchanan & Tullock, 'The Calculus of Consent'","https://oll.libertyfund.org/title/buchanan-the-calculus-of-consent"]],"i":55},{"id":"uschamber","n":"US Chamber of Commerce (Powell Memorandum)","t":"doc","lat":38.8995,"lon":-77.038,"pl":"Washington, DC, United States","ad":"1615 H Street NW, Washington, DC 20062","ro":"The building where the plan to rebuild business political power was delivered in 1971.","who":"Lewis F. Powell Jr., two months before his nomination to the US Supreme Court; Suzanne Clark, current president and chief executive","rch":"national","mx":["law","wage"],"fg":[["Powell Memorandum","'Attack on American Free Enterprise System', 23 August 1971, confidential memo to the Chamber"],["Lobbying","the top federal lobbying spender in most years since 2015; over $746 million in cumulative reported spending"],["2025","about $72 million in reported federal lobbying"],["Litigation","the Chamber's Institute for Legal Reform files in hundreds of cases a year"]],"rd":"Powell's memo told American business that it had surrendered the universities, the courts, the media and the textbooks to its critics, and that the answer was sustained, organised, funded counter-pressure — scholars on retainer, speakers' bureaus, litigation, and above all patience. Within a decade the Business Roundtable, Heritage, Cato, Manhattan and the state think-tank networks were operating, and the Chamber had become the largest lobbying operation in Washington.\nIts cumulative reported federal lobbying is over $746 million — more than any other single organisation — and that counts only what the law requires it to disclose.","mn":"A single memo laid out how to convert money into durable political advantage, and the people it was written for spent fifty years and billions of dollars doing it.","pt":["p3"],"sr":[["Powell Memorandum, 1971 (Washington and Lee University archive)","https://scholarlycommons.law.wlu.edu/powellmemo/"],["OpenSecrets, US Chamber of Commerce lobbying profile","https://www.opensecrets.org/federal-lobbying/clients/summary?id=D000019798"]],"i":56},{"id":"alec","n":"American Legislative Exchange Council","t":"doc","lat":38.847,"lon":-77.0523,"pl":"Arlington, Virginia, United States","ad":"2900 Crystal Drive, 6th Floor, Arlington, VA 22202","ro":"Writes draft state laws with corporate members, then hands them to legislators to introduce.","who":"Lisa Nelson, chief executive; corporate and legislative members sit on task forces together","rch":"national","mx":["law","wage"],"fg":[["Model bills becoming law","around 200 US state laws a year originate as ALEC models"],["ALEC Exposed","over 800 model bills published by the Center for Media and Democracy in 2011"],["Reach","ALEC model language appeared in bills in 34 states in the 2011–12 session alone (Brookings)"],["Revenue (2023)","$11.3 million"]],"rd":"ALEC's method is unglamorous and extremely effective. Corporate members and state legislators sit on the same task forces, vote separately, and approve model bills; legislators then take them home and introduce them as their own. Among the recurring subjects: right-to-work laws, state preemption of city minimum wages and paid sick leave, limits on public pensions, voter identification, charter-school expansion, and liability caps. Roughly two hundred state laws a year begin here.\nState legislatures pass tens of thousands of laws with small staffs and little research capacity, which is precisely the gap a drafting service fills.","mn":"Most of the laws that set what work pays are state laws, and a drafting service funded by employers has been supplying them for fifty years.","pt":["p3"],"sr":[["Center for Media and Democracy, ALEC Exposed","https://www.alecexposed.org/"],["Brookings, 'ALEC's influence over lawmaking in state legislatures'","https://www.brookings.edu/articles/alecs-influence-over-lawmaking-in-state-legislatures/"]],"i":57},{"id":"atlas","n":"Atlas Network","t":"doc","lat":38.883,"lon":-77.095,"pl":"Arlington, Virginia, United States","ad":"Two Liberty Center, 4075 Wilson Boulevard, Suite 310, Arlington, VA 22203","ro":"The think tank that creates think tanks — about 500 of them, in 100 countries.","who":"Founded 1981 by Sir Antony Fisher; board drawn from DonorsTrust, the Sarah Scaife Foundation and others","rch":"global","mx":["law","priv"],"fg":[["Partner organisations","around 500 in roughly 100 countries (581 members reported in 2024)"],["Growth","from 15 think tanks in 9 countries in the mid-1980s to 457 in 96 countries by 2020"],["Funders","includes Koch foundations, DonorsTrust, the Sarah Scaife Foundation"],["Founder's aim","Fisher's stated goal, in his lieutenant's words, was 'to litter the world with free-market think tanks'"]],"rd":"Antony Fisher made money in chicken farming, founded Britain's Institute of Economic Affairs in 1955, and concluded that the model was repeatable. Atlas supplies seed grants, training, fundraising help and a network to local organisations in a hundred countries, which then appear in national debates as homegrown voices. In Latin America its partners were central to the campaigns that unseated left governments in Brazil and to Argentina's and Chile's reform movements; reporting by The New Republic has traced partner campaigns to criminalise climate protest.\nThe design is the clever part. A policy argued for by a local institute in Lima or Lagos reads differently from the same argument made by a foreign foundation.","mn":"The same handful of ideas can arrive in a hundred countries as if each country had thought of them independently.","pt":["p8","p3"],"sr":[["Atlas Network FAQ (partner numbers, address)","https://atlasnetwork.org/faq"],["The New Republic, 'Meet the Shadowy Global Network of Right-Wing Think Tanks'","https://newrepublic.com/article/175488/atlas-shadowy-global-network-right-wing-think-tanks"]],"i":58},{"id":"heritage","n":"The Heritage Foundation","t":"doc","lat":38.892,"lon":-77.003,"pl":"Washington, DC, United States","ad":"214 Massachusetts Avenue NE, Washington, DC 20002","ro":"Supplies ready-made policy and staffed personnel lists to incoming administrations.","who":"Kevin Roberts, president","rch":"national","mx":["law","aust","priv"],"fg":[["Mandate for Leadership","first published 1981; the 2023 edition (Project 2025) ran to around 900 pages"],["1981 edition","the Reagan administration claimed to have adopted a majority of its recommendations in year one"],["Revenue","over $100 million a year"]],"rd":"Heritage's innovation was to stop writing for academics. It produces short briefs timed to votes, and every few years a complete governing programme with named candidates for the jobs. The 1981 Mandate for Leadership shaped the first Reagan budget; the 2023 edition, co-ordinated with dozens of allied organisations, covered the tax code, labour regulation, public-sector staffing and welfare administration in detail.\nFor the questions on this map — who pays tax, what work pays, which agencies enforce anything — the content matters less than the mechanism: an organisation funded by private donors arriving on day one with the legislation already drafted and the appointees already vetted.","mn":"Whoever shows up with the plan already written tends to get their plan, because governments arrive with ambitions and no text.","pt":["p3","p8"],"sr":[["Heritage Foundation, Mandate for Leadership series","https://www.heritage.org/conservatism/report/mandate-leadership-the-conservative-promise"],["Heritage Foundation IRS Form 990 filings","https://projects.propublica.org/nonprofits/organizations/237327730"]],"i":59},{"id":"iea","n":"Institute of Economic Affairs","t":"doc","lat":51.497,"lon":-0.127,"pl":"London, United Kingdom","ad":"2 Lord North Street, Westminster, London SW1P 3LB","ro":"The original free-market think tank, and the one Margaret Thatcher credited.","who":"Founded 1955 by Antony Fisher on Hayek's advice; Tom Clougherty, executive director","rch":"national","mx":["priv","law"],"fg":[["Founded","1955"],["Thatcher","described the IEA as having created the climate of opinion that made her programme possible"],["Funding transparency","rated poorly by Transparify; has accepted tobacco industry funding, which it has defended"]],"rd":"Hayek told Fisher that the way to change politics was not to enter it but to change what the people who advise politicians consider thinkable. The IEA spent twenty years publishing pamphlets almost nobody read, and then found itself the intellectual supplier to a government that privatised the utilities, sold the council houses, broke the miners' strike and cut the top rate of income tax from 83% to 40%. British inequality rose faster in the 1980s than in any comparable decade.\nIts funding has never been fully disclosed.","mn":"The argument that lost for twenty years and then won for forty did not get more correct in between — it got better funded and better organised.","pt":["p8"],"sr":[["Who Funds You? transparency ratings of UK think tanks","https://whofundsyou.org/"],["Institute for Fiscal Studies, UK income inequality since 1979","https://ifs.org.uk/inequality/"]],"i":60},{"id":"brt","n":"Business Roundtable","t":"doc","lat":38.88,"lon":-77.023,"pl":"Washington, DC, United States","ad":"1000 Maine Avenue SW, Suite 500, Washington, DC 20024","ro":"The chief executives of the largest US companies, lobbying as a bloc.","who":"Membership of around 200 chief executives of major US corporations","rch":"national","mx":["law","tax","wage"],"fg":[["1997 statement","formally adopted shareholder primacy: 'the paramount duty of management and of boards of directors is to the corporation's stockholders'"],["2019 statement","181 chief executives signed a revised 'purpose of a corporation' committing to all stakeholders"],["After 2019","academic follow-ups found no significant change in governance documents or practice at signatory firms"],["Lobbying, 2025","about $33.5 million"]],"rd":"The Roundtable is where chief executives act politically as a class rather than as competitors. In 1997 it wrote shareholder primacy into its official statement of corporate purpose. In 2019, after a decade of criticism, 181 of them signed a new statement promising to serve employees, suppliers, communities and the environment too. Lucian Bebchuk and Roberto Tallarita checked: almost none of the signatories had put the commitment to their boards, and corporate governance guidelines at the same companies continued to state that directors act for shareholders.\nMeanwhile the Roundtable lobbied hard for the 2017 corporate tax cut and against the Protecting the Right to Organize Act.","mn":"A public promise to care about workers costs nothing if the governance documents, the pay formulas and the lobbying all still point the other way.","pt":["p1","p3"],"sr":[["Bebchuk & Tallarita, 'The Illusory Promise of Stakeholder Governance' (2020)","https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3544978"],["Business Roundtable statement on the purpose of a corporation (2019)","https://www.businessroundtable.org/business-roundtable-redefines-the-purpose-of-a-corporation-to-promote-an-economy-that-serves-all-americans"]],"i":61},{"id":"koch","n":"Koch Industries","t":"doc","lat":37.724,"lon":-97.242,"pl":"Wichita, Kansas, United States","ad":"4111 East 37th Street North, Wichita, KS 67220","ro":"A private company that built a political machine to match a party.","who":"Charles Koch, chairman; the late David Koch, co-owner until 2019","rch":"national","mx":["law","tax","aust"],"fg":[["Network spending","the Koch donor network has set spending targets in the hundreds of millions per election cycle"],["Americans for Prosperity","chapters in dozens of states, with paid organisers"],["Academic funding","grants to hundreds of US universities, including the Mercatus Center at George Mason"],["Company","one of the largest privately held companies in the US; no outside shareholders"]],"rd":"The Koch brothers' contribution was infrastructure rather than ideas: a donor network that pooled hundreds of millions, a grassroots organisation with paid staff in most states, funded chairs and centres at universities, and a pipeline that moved people between all three. The targets were specific — state-level right-to-work laws, opposition to climate regulation and to public transit, resistance to Medicaid expansion, and the 2017 tax cut.\nBecause the company is private, almost none of this had to be disclosed to shareholders, and much of the giving ran through entities that do not disclose donors.","mn":"A few very large fortunes can build something that behaves like a political party, with none of a party's obligations to publish what it raises or who it answers to.","pt":["p3","p8"],"sr":[["Jane Mayer, 'Dark Money' (Doubleday, 2016) — overview","https://en.wikipedia.org/wiki/Dark_Money_(book)"],["OpenSecrets, Koch Industries profile","https://www.opensecrets.org/orgs/koch-industries/summary?id=D000000186"]],"i":62},{"id":"nrtw","n":"National Right to Work Committee","t":"doc","lat":38.807,"lon":-77.187,"pl":"Springfield, Virginia, United States","ad":"8001 Braddock Road, Springfield, VA 22160","ro":"Seventy years of campaigning to make union membership optional where unions bargain.","who":"National Right to Work Committee and its Legal Defense Foundation","rch":"national","mx":["wage","law"],"fg":[["States with right-to-work laws","26 (Michigan repealed its law in 2024)"],["US union density","about 10% of wage and salary workers in 2025, from roughly a third in the 1950s"],["Janus v. AFSCME (2018)","extended the rule to all US public-sector workers by constitutional ruling"],["Wage effect","EPI estimates wages in right-to-work states average several percent lower, controlling for other factors"]],"rd":"The Taft-Hartley Act of 1947 let states ban contracts that require workers covered by a union agreement to pay for it. The committee has pushed those laws state by state ever since, and in 2018 the Supreme Court made the rule universal for public employees in Janus. The mechanism is not a ban on unions; it is a free-rider problem engineered on purpose — the union must bargain for everyone and may charge only those who volunteer.\nAmerican union density has fallen from about a third of workers to roughly one in ten, and the economic literature links that decline directly to the share of national income going to labour rather than capital.","mn":"The strongest single predictor of whether ordinary pay rises with productivity is whether workers can bargain together, which is why so much effort has gone into making that harder.","pt":["p3","p7"],"sr":[["Janus v. AFSCME, 585 U.S. 878 (2018)","https://supreme.justia.com/cases/federal/us/585/16-1466/"],["Economic Policy Institute on unions and wage inequality","https://www.epi.org/publication/unions-and-wage-inequality/"]],"i":63},{"id":"laffer","n":"The Laffer curve (where it was drawn)","t":"doc","lat":38.8965,"lon":-77.0335,"pl":"Washington, DC, United States","ad":"Former Two Continents restaurant, Hotel Washington, 515 15th Street NW, Washington, DC 20004","ro":"A napkin sketch that became forty years of tax-cut justification.","who":"Arthur Laffer, with Donald Rumsfeld and Dick Cheney, 1974","rch":"global","mx":["tax","aust"],"fg":[["US top marginal income tax rate","91% in 1963; 70% in 1980; 28% by 1988; 37% today"],["Kansas, 2012–17","the deepest state-level test; revenues fell, schools were cut, and the legislature reversed the cuts over a governor's veto"],["Evidence","no consensus finding that rate cuts in this range raise revenue; CBO and Treasury analyses of the 2017 cuts found they did not pay for themselves"]],"rd":"Laffer's point is trivially true at the ends — a 0% rate and a 100% rate both raise nothing — and says nothing about where real tax rates sit. That did not matter. The sketch gave governments a respectable-sounding reason to cut top rates and promise the revenue would come back. It did not come back in the United States in 1981, in Kansas in 2012, or after the 2017 corporate cut, each of which was followed by larger deficits and pressure to cut spending.\nThe spending that gets cut is the spending that poor households depend on, which is how a tax cut for the top becomes a service cut at the bottom.","mn":"A tax cut that does not pay for itself has to be paid for by somebody, and it is usually paid for by whatever the budget can cut most quietly.","pt":["p8","p11"],"sr":[["Congressional Budget Office analyses of the 2017 Tax Cuts and Jobs Act","https://www.cbo.gov/publication/53651"],["Center on Budget and Policy Priorities, 'Kansas' tax cut experiment'","https://www.cbpp.org/research/state-budget-and-tax/kansas-provides-compelling-evidence-of-failure-of-supply-side-tax-cuts"]],"i":64},{"id":"musk","n":"Elon Musk","t":"pers","lat":30.222,"lon":-97.617,"pl":"Austin, Texas, United States","ad":"Tesla Inc., 1 Tesla Road, Austin, TX 78725","ro":"The first person to hold a trillion dollars, and the test case for whether one fortune can be bigger than a state.","who":"Chief executive of Tesla; founder of SpaceX and xAI; owner of X","rch":"global","mx":["own","wage","law"],"fg":[["Net worth","about $896 billion (Forbes real-time, 17 November 2026); first passed $1 trillion in June 2026 after the SpaceX listing"],["Tesla pay package","a package potentially worth up to roughly $1 trillion approved by shareholders in November 2025"],["2025 reported compensation","$158 billion as reported by Tesla — excluded from EPI's CEO pay series as an outlier"],["Comparison","his personal wealth exceeds the annual GDP of all but about twenty countries"]],"rd":"One person's holdings in two companies now exceed the annual output of most countries. It is worth being precise about where it came from: Tesla's rise was financed in part by public money — a $465 million US Department of Energy loan in 2010, California zero-emission-vehicle credits, consumer tax credits — and SpaceX's by NASA and Department of Defense contracts. The gains were private; the early risk was substantially public.\nMusk has also fought union organising at Tesla (the NLRB found violations at the Fremont plant), spent heavily in US elections, and used his ownership of X to shape the political conversation directly. A fortune of this size is not only consumption capacity; it is the ability to buy a platform, a party's ground game and a satellite network.","mn":"Past a certain size a fortune stops being money and becomes a form of government that nobody elected.","pt":["p1","p3","p12"],"sr":[["Forbes Real-Time Billionaires","https://www.forbes.com/real-time-billionaires/"],["EPI, 'CEO pay surged in 2025' (note on Tesla's reported package)","https://www.epi.org/blog/ceo-pay-surged-in-2025-ceos-are-paid-325-times-as-much-as-the-typical-worker/"]],"i":65},{"id":"arnault","n":"Bernard Arnault","t":"pers","lat":48.866,"lon":2.305,"pl":"Paris, France","ad":"LVMH, 22 avenue Montaigne, 75008 Paris","ro":"Europe's largest fortune, built by buying the brands that signal status.","who":"Chairman and chief executive of LVMH; family holding through Agache and Financière Agache","rch":"global","mx":["own","inh","tax"],"fg":[["Fortune","the largest in Europe; topped the global list in 2023"],["Structure","family control through a chain of holding companies, with five children in senior group roles"],["French tax debate","the 'Zucman tax' proposal of a 2% minimum levy on fortunes above €100 million was rejected by the Senate in 2025 after heavy opposition"]],"rd":"LVMH owns Louis Vuitton, Dior, Moët, Hennessy, Tiffany, Sephora and about seventy other houses. Its margins come from scarcity and the price people will pay to signal where they stand, which makes it a fortune built directly on the existence of a very wealthy class. The group is controlled through a chain of family holding companies, and the succession has been arranged so that control passes without the holding being broken up.\nArnault was among the most prominent opponents of the economist Gabriel Zucman's proposal for a 2% minimum tax on fortunes above €100 million, calling it an attack on the French economy. France's National Assembly passed a version; the Senate rejected it.","mn":"The structures that keep a family's control of a company intact across generations are the same structures that keep its wealth out of the tax base.","pt":["p12"],"sr":[["Zucman, 'A Blueprint for a Coordinated Minimum Effective Taxation Standard for Ultra-High-Net-Worth Individuals' (G20 report, 2024)","https://gabriel-zucman.eu/files/report-g20.pdf"],["LVMH annual report and shareholding structure","https://www.lvmh.com/investors/"]],"i":66},{"id":"ambani","n":"Mukesh Ambani","t":"pers","lat":18.926,"lon":72.822,"pl":"Mumbai, India","ad":"Reliance Industries, Maker Chambers IV, Nariman Point, Mumbai 400021","ro":"India's largest fortune, in an economy where the top 1% take a larger share than almost anywhere.","who":"Chairman and managing director of Reliance Industries","rch":"regional","mx":["own","price","law"],"fg":[["India's top 1% income share","around 22–23% — among the highest recorded anywhere (World Inequality Lab)"],["India's top 1% wealth share","over 40%"],["Reliance","oil refining, petrochemicals, telecoms (Jio) and retail"],["Jio","entered Indian telecoms in 2016 with free service, then consolidated the market"]],"rd":"The World Inequality Lab's Indian series shows the top 1% taking a larger share of national income than in the United States, Brazil or South Africa, and a larger share than under British rule. Reliance's growth is a study in how that happens: a refining business built with state-allocated resources, then a telecoms entrant that gave service away until competitors collapsed, then retail. Jio's arrival genuinely cut the price of data for hundreds of millions of people and left a market with far fewer sellers.\nAmbani's home in Mumbai, Antilia, is twenty-seven storeys tall and stands a few kilometres from settlements without reliable water.","mn":"Cheap data and extreme concentration arrived together, which is why 'did it benefit consumers?' is the wrong question to stop at.","pt":["p1","p12"],"sr":[["World Inequality Lab, 'Income and Wealth Inequality in India, 1922–2023'","https://halshs.archives-ouvertes.fr/halshs-04563836v1/file/WorldInequalityLab_WP2024_09_Income-and-Wealth-Inequality-in-India-1922-2023_Final.pdf"],["World Inequality Report 2026","https://prod.wid.world/www-site/uploads/2025/12/World_Inequality_Report_2026.pdf"]],"i":67},{"id":"adani","n":"Gautam Adani","t":"pers","lat":23.124,"lon":72.539,"pl":"Ahmedabad, Gujarat, India","ad":"Adani Corporate House, Shantigram, S G Highway, Khodiyar, Ahmedabad 382421","ro":"A fortune built almost entirely on infrastructure the public uses and the state awarded.","who":"Chairman of the Adani Group","rch":"regional","mx":["own","priv","law"],"fg":[["Group assets","ports, airports, power generation and transmission, coal, cement, data centres"],["Airports","won the right to operate six Indian airports in a single 2019 privatisation round, after the rules were changed to drop prior experience requirements"],["Hindenburg (2023)","short-seller report alleging stock manipulation and accounting fraud; about $150 billion in market value was lost before a partial recovery; the group denies the allegations"],["US indictment (2024)","US prosecutors charged executives over an alleged bribery scheme relating to solar contracts; the group denies wrongdoing"]],"rd":"Almost everything Adani owns is something a government decided to hand over: ports, airports, transmission lines, coal blocks. In 2019 India's airport privatisation rules were amended to remove the requirement of prior airport experience, and the group won all six airports on offer. The Hindenburg report in 2023 alleged long-running stock manipulation through offshore vehicles; the group denies it, and Indian regulators' examination has been contested ever since. In 2024 US prosecutors brought bribery charges against group executives over solar contracts, which the group also denies.\nWhether or not those allegations are proven, the structural fact is not in dispute: public infrastructure concentrated in one family's hands by administrative decision.","mn":"Privatisation moves an asset the public already paid for into private ownership, and the decision is usually made by a few officials rather than by any vote.","pt":["p3","p8"],"sr":[["US Department of Justice indictment press release (November 2024)","https://www.justice.gov/usao-edny/pr/indian-energy-company-executives-and-canadian-institutional-investment-fund-former"],["Financial Times reporting on the 2019 Indian airport privatisation rules","https://www.ft.com/content/0d3cbc6e-6b39-11ea-89df-41bea055720b"]],"i":68},{"id":"slim","n":"Carlos Slim","t":"pers","lat":19.441,"lon":-99.204,"pl":"Mexico City, Mexico","ad":"América Móvil, Lago Zurich 245, Colonia Ampliación Granada, 11529 Mexico City","ro":"The fortune made from a privatised national telephone monopoly.","who":"Honorary chairman of América Móvil and Grupo Carso","rch":"regional","mx":["priv","price","own"],"fg":[["Telmex","privatised in 1990; Slim's consortium acquired control with a period of protection from competition"],["OECD finding (2012)","Mexico's telecoms market dysfunction cost consumers an estimated $129 billion over 2005–2009, about 1.8% of GDP a year"],["Market share","Telmex/Telcel held around 70–80% of Mexican fixed and mobile markets for years after privatisation"]],"rd":"Mexico sold its state telephone company in 1990 as part of a privatisation programme urged by its creditors. The buyer got a national network, a captive customer base and several years without real competition. The OECD examined the result and concluded that Mexican consumers and businesses lost about $129 billion over five years to high prices and poor coverage — a transfer from an entire population to one balance sheet. Slim was for several years the richest person in the world, in a country where around a third of people live in poverty.\nMexico's 2013 telecoms reform finally forced prices down, which is the clearest proof the prices had been a policy choice.","mn":"Selling a national utility without first building a referee creates a private tax on everyone who needs to make a phone call.","pt":["p8","p1"],"sr":[["OECD Review of Telecommunication Policy and Regulation in Mexico (2012)","https://www.oecd.org/mexico/oecdreviewoftelecommunicationpolicyandregulationinmexico.htm"],["Mexican telecoms reform, 2013 (Federal Telecommunications Institute)","https://www.ift.org.mx/"]],"i":69},{"id":"qatarkafala","n":"Kafala system — Qatar","t":"lab","lat":25.286,"lon":51.533,"pl":"Doha, Qatar","ad":"Ministry of Labour, Al Bidda Tower, Corniche Street, Doha","ro":"Legal sponsorship that ties a worker's right to stay in the country to one employer.","who":"Ministry of Labour of the State of Qatar","rch":"national","mx":["mob","wage"],"fg":[["Migrant share of the workforce","around 95%"],["Reforms","exit permits removed in 2018; no-objection-certificate requirement for changing jobs removed in 2020; a minimum wage of 1,000 riyals a month plus allowances introduced in 2021"],["Enforcement","HRW documented continued wage theft in December 2025 and labour groups reported the same in 2026"],["Recruitment fees","workers commonly arrive owing $1,000–$4,000 to agents, against monthly pay of a few hundred dollars"]],"rd":"Kafala makes an employer the legal sponsor of a worker's presence in the country. On paper Qatar has dismantled most of it: workers no longer need permission to leave the country or to change jobs, and there is a minimum wage. In practice, Human Rights Watch found in December 2025 that state clients and large businesses were failing to pay contractors on time, leaving labourers unpaid for months, and the same patterns were still being reported through 2026.\nThe decisive feature is the debt. A worker who borrowed four months' wages to get the job, whose passport the employer holds, and whose visa the employer controls, is not in a position to refuse anything — whatever the statute says.","mn":"If leaving your employer means leaving the country, your wage is not set by a labour market; it is set by whatever your employer decides to pay.","pt":["p7"],"sr":[["Human Rights Watch reporting on wage theft and unpaid contractors in Qatar","https://www.hrw.org/middle-east/north-africa/qatar"],["ILO Governing Body document on Qatar's labour reforms","https://www.ilo.org/projects-and-partnerships/projects/ilo-project-office-state-qatar"]],"i":70},{"id":"saudikafala","n":"Kafala system — Saudi Arabia","t":"lab","lat":24.685,"lon":46.721,"pl":"Riyadh, Saudi Arabia","ad":"Ministry of Human Resources and Social Development, King Fahd Road, Riyadh","ro":"The largest tied-labour system in the world, now building the largest construction programme in the world.","who":"Ministry of Human Resources and Social Development","rch":"national","mx":["mob","wage"],"fg":[["Migrant workers","over 13 million, roughly three-quarters of the private-sector workforce"],["HRW (2025)","at least 600 workers of one Mecca contractor unpaid for eight months or more; eleven workers detained after protesting"],["Wage theft survey","of 112 migrant workers HRW asked about wage theft, 69 reported experiencing it"],["Fines","Saudi authorities reduced the size of penalties on employers for wage theft (ILO submission, 2025)"],["2034 World Cup","awarded by FIFA in December 2024; BWI, representing 12 million workers, alleged severe abuses and wage theft under kafala"]],"rd":"Saudi Arabia's giga-projects — NEOM, the Mecca developments, the 2034 World Cup programme — are being built by workers whose legal status is attached to their employer. In November 2025 Human Rights Watch documented at least 600 workers at a Mecca contractor on a multi-billion-dollar project who had not been paid for eight months; eleven were detained when they protested, and then released. The government's own wage protection system flagged one such case and the response was described as corrective action. The ILO received a complaint from construction unions alleging endemic wage theft.\nSaudi authorities also reduced the fines employers face for not paying wages, which tells you how much the enforcement is expected to bite.","mn":"When the penalty for not paying a worker is smaller than the wage, not paying is simply cheaper.","pt":["p7"],"sr":[["Human Rights Watch, 'Saudi Arabia: Migrant Workers in Mecca Arrested for Demanding Unpaid Wages' (6 Nov 2025)","https://www.hrw.org/news/2025/11/06/saudi-arabia-migrant-workers-in-mecca-arrested-for-demanding-unpaid-wages"],["ILO Governing Body, GB.355/INS/16/7 on Saudi Arabia (Nov 2025)","https://www.ilo.org/sites/default/files/2025-11/GB355-INS-16-7-Saudi%20Arabia-EN.pdf"]],"i":71},{"id":"uaekafala","n":"Kafala system — United Arab Emirates","t":"lab","lat":24.453,"lon":54.377,"pl":"Abu Dhabi, United Arab Emirates","ad":"Ministry of Human Resources and Emiratisation, Abu Dhabi","ro":"The same sponsorship model, in the Gulf's financial and logistics centre.","who":"Ministry of Human Resources and Emiratisation","rch":"national","mx":["mob","wage"],"fg":[["Migrant share of population","around 88%"],["Domestic workers","largely excluded from standard labour-law protections across the Gulf"],["Union rights","independent trade unions and strikes are prohibited"]],"rd":"The UAE runs the most diversified Gulf economy and the same labour architecture. Domestic workers — almost all women, mostly from the Philippines, Indonesia, Ethiopia and Nepal — sit furthest outside protection, living in the employer's home, with hours and rest that no inspector sees. There are no independent unions and strikes are illegal, so the only recourse is a complaint to a ministry whose counterparty is the employer.\nDubai is simultaneously one of the world's main destinations for undeclared wealth, which makes the emirate a place where the hiding of fortunes and the tying of labour happen inside the same square mile.","mn":"The same jurisdiction can offer the wealthiest people in the world total discretion and the poorest workers in it no exit.","pt":["p7","p10"],"sr":[["Human Rights Watch, UAE country reporting","https://www.hrw.org/middle-east/north-africa/united-arab-emirates"],["Carnegie Endowment, 'Dubai's Role in Facilitating Corruption and Global Illicit Financial Flows'","https://carnegieendowment.org/2020/07/07/dubai-s-role-in-facilitating-corruption-and-global-illicit-financial-flows-pub-82180"]],"i":72},{"id":"hukou","n":"Hukou system — China","t":"lab","lat":39.908,"lon":116.406,"pl":"Beijing, China","ad":"Ministry of Public Security, 14 Dongchang'an Street, Dongcheng District, Beijing","ro":"Household registration that decides where a citizen may claim schooling, healthcare and a pension.","who":"Ministry of Public Security; reform policy set by the State Council","rch":"national","mx":["mob","disc"],"fg":[["Migrant workers","around 300 million people working outside their registered household area"],["Left-behind children","tens of millions of children raised by grandparents in rural areas because they cannot access urban schooling"],["Reform","restrictions eased in smaller cities since 2014; the largest cities retain points-based systems"]],"rd":"A Chinese citizen's hukou records where their household is registered, and most public services are provided by that locality. A worker who moves from Henan to Shenzhen keeps a rural registration: they can work, but their children may not be able to enrol in the local state school, and their health and pension entitlements stay behind. The result is the largest internal migration in human history conducted by people who are, in their own country, treated as temporary.\nThis was not incidental to China's manufacturing boom. It supplied factories with workers who could be paid as individuals rather than as families, because the family stayed in the village.","mn":"Making a worker's rights depend on where they were born, not where they work, is a way of getting the labour without paying for the household it belongs to.","pt":["p7"],"sr":[["Chan, 'The Chinese Hukou System at 50', Eurasian Geography and Economics","https://doi.org/10.2747/1539-7216.50.2.197"],["UNICEF China, children affected by migration","https://www.unicef.cn/en/figures-situation-children-china"]],"i":73},{"id":"h2a","n":"Employer-tied work visas — United States","t":"lab","lat":38.887,"lon":-77.015,"pl":"Washington, DC, United States","ad":"US Department of Labor, 200 Constitution Avenue NW, Washington, DC 20210","ro":"Guest-worker visas that belong to the employer, not the worker.","who":"Employment and Training Administration, US Department of Labor; US Citizenship and Immigration Services","rch":"national","mx":["mob","wage"],"fg":[["H-2A certifications","grew from about 85,000 positions in 2012 to over 370,000 by the mid-2020s"],["Structure","the visa is tied to the petitioning employer; leaving generally means losing legal status"],["Documented abuse","forced labour prosecutions including Operation Blooming Onion (2021), which charged a conspiracy involving over 100 workers"]],"rd":"The American farm and seasonal workforce increasingly arrives on H-2A and H-2B visas, which are issued to the employer for a named worker. A worker who complains about pay, housing or pesticide exposure can be sent home, and the recruiter who got them the job — often paid a fee the worker borrowed — can refuse to place them again. Federal prosecutors in Georgia described a scheme in which workers were held in squalor and made to dig onions with their bare hands.\nThe design is the same as kafala in a different legal language: legal presence attached to one employer.","mn":"Every protection on paper is worth only as much as the worker's ability to walk away, and a visa held by the employer removes that ability.","pt":["p7"],"sr":[["US DOJ, Operation Blooming Onion indictment (2021)","https://www.justice.gov/usao-sdga/pr/24-defendants-indicted-multi-million-dollar-south-georgia-based-human-smuggling-and"],["US Department of Labor, H-2A program data","https://www.dol.gov/agencies/eta/foreign-labor/performance"]],"i":74},{"id":"prisonlabour","n":"Prison labour — United States","t":"lab","lat":30.964,"lon":-91.603,"pl":"Angola, Louisiana, United States","ad":"Louisiana State Penitentiary, 17544 Tunica Trace, Angola, LA 70712","ro":"Work for cents an hour, on a former plantation, under the clause the Thirteenth Amendment left open.","who":"Louisiana Department of Public Safety and Corrections","rch":"national","mx":["wage","disc","mob"],"fg":[["Thirteenth Amendment","prohibits slavery and involuntary servitude 'except as a punishment for crime whereof the party shall have been duly convicted'"],["Wages","incarcerated workers in several states, including Louisiana, are paid a few cents an hour or nothing"],["ACLU/GHRC (2022)","about 800,000 incarcerated people work in US prisons, producing an estimated $11 billion a year in goods and services"],["Angola","18,000 acres, formerly a slave plantation; the farm line still works the fields"]],"rd":"The Thirteenth Amendment abolished slavery with one exception: as punishment for a crime. After 1865 Southern states convicted freed Black men of vagrancy and leased them to planters and mines; Angola prison is itself a former plantation, and incarcerated men still work its fields, supervised on horseback. Across the United States roughly 800,000 incarcerated people work, most for a few cents an hour or nothing, producing an estimated $11 billion a year in goods and services, and refusal can mean solitary confinement.\nSeveral states have voted since 2018 to delete the exception from their own constitutions; the federal clause remains.","mn":"The cheapest labour in the richest country is performed by people who cannot quit, and the exception that allows it has been in the constitution since 1865.","pt":["p7"],"sr":[["ACLU & Global Human Rights Clinic, 'Captive Labor: Exploitation of Incarcerated Workers' (2022)","https://www.aclu.org/report/captive-labor-exploitation-incarcerated-workers"],["US Constitution, Thirteenth Amendment","https://constitution.congress.gov/constitution/amendment-13/"]],"i":75},{"id":"panamaflag","n":"Flags of convenience — Panama","t":"lab","lat":8.954,"lon":-79.534,"pl":"Panama City, Panama","ad":"Panama Maritime Authority, Edificio PSA, Diablo Heights, Panama City","ro":"The world's largest ship registry: whichever flag a ship flies decides which labour law applies at sea.","who":"Autoridad Marítima de Panamá","rch":"global","mx":["mob","wage","tax"],"fg":[["Registry size","Panama registers the largest share of world tonnage; Liberia and the Marshall Islands follow"],["Abandonment","the ILO/IMO database recorded record numbers of abandoned seafarers in recent years — crews left unpaid on ships in port"],["Owners","beneficial owners are frequently in Greece, Japan, China, Germany or Switzerland, not in the flag state"]],"rd":"A ship is legally a piece of the country whose flag it flies. Register it in Panama, Liberia or the Marshall Islands and the crew's wages, hours and safety are governed by that country's law and inspected by its underfunded administration, while the owner sits in Athens or Hamburg and the cargo belongs to a company in Rotterdam. Crews are typically Filipino, Indian, Ukrainian or Indonesian, on contracts they signed through an agent, at sea for months.\nWhen an owner goes bust, the crew is abandoned — unpaid, aboard, in a foreign port, with no authority clearly responsible. The ILO and IMO keep a database of these cases and it has been setting records.","mn":"Nine-tenths of world trade moves on ships whose workers can be placed, by a paperwork choice, outside the reach of any labour law worth the name.","pt":["p7","p5"],"sr":[["IMO legal affairs — the joint IMO/ILO work on abandonment of seafarers","https://www.imo.org/en/OurWork/Legal/Pages/Default.aspx"],["ITF Seafarers on flags of convenience","https://www.itfseafarers.org/en/focs"]],"i":76},{"id":"indialabour","n":"Informal labour and caste — India","t":"lab","lat":28.618,"lon":77.212,"pl":"New Delhi, India","ad":"Ministry of Labour and Employment, Shram Shakti Bhawan, Rafi Marg, New Delhi 110001","ro":"An economy where most work sits outside any labour law, along lines drawn by caste.","who":"Ministry of Labour and Employment; state governments","rch":"national","mx":["wage","disc","mob"],"fg":[["Informal employment","around 90% of India's workforce"],["Top 1% income share","roughly 22–23%, among the highest recorded globally (World Inequality Lab)"],["Manual scavenging","prohibited by law in 1993 and again in 2013; deaths in sewers and septic tanks continue to be recorded annually"],["Bonded labour","abolished in 1976; still documented in brick kilns, quarries and agriculture"]],"rd":"Roughly nine in ten Indian workers have no written contract, no social insurance and no realistic access to a labour court. Who ends up in which work is still strongly predicted by caste: Dalits are heavily over-represented in sanitation, leather, brick kilns and manual scavenging — work prohibited by statute in 1993 and 2013, and still killing people in sewers every year. At the other end, the World Inequality Lab finds the top 1% taking a larger share of national income than at any point since records began, including the colonial period.\nThe laws against bonded labour, untouchability and manual scavenging are among the strongest on paper anywhere. Enforcement is the variable.","mn":"A law against a practice means nothing to the person doing the practice unless somebody is willing to inspect, prosecute and pay for an alternative.","pt":["p7","p12"],"sr":[["World Inequality Lab, 'Income and Wealth Inequality in India, 1922–2023'","https://halshs.archives-ouvertes.fr/halshs-04563836v1/file/WorldInequalityLab_WP2024_09_Income-and-Wealth-Inequality-in-India-1922-2023_Final.pdf"],["ILO, India Employment Report / informal employment statistics","https://www.ilo.org/publications"]],"i":77},{"id":"brazilland","n":"Land concentration — Brazil","t":"state","lat":-15.799,"lon":-47.864,"pl":"Brasília, Brazil","ad":"Esplanada dos Ministérios, Brasília, DF 70000","ro":"One of the most unequal distributions of farmland on earth, and the politics that protects it.","who":"Ministry of Agrarian Development; INCRA; the agribusiness caucus in Congress","rch":"national","mx":["rent","own","disc"],"fg":[["Land Gini","about 0.73 in the agricultural census — among the highest in the world"],["Largest 1% of holdings","occupy nearly half of all farmland"],["Agrarian reform","constitutionally mandated since 1988; largely stalled"],["Rural violence","the Pastoral Land Commission records dozens of killings in land conflicts each year"]],"rd":"Brazil's land distribution is a direct inheritance of the sesmaria grants of the colonial period and the 1850 Land Law, which made land purchasable in cash at the moment slavery was ending — ensuring that the people being freed could not acquire any. The 1988 constitution requires land to serve a social function and permits expropriation of unproductive estates; the agribusiness bloc in Congress has made that largely unusable. The Landless Workers' Movement occupies estates to force the issue, and the Pastoral Land Commission counts the killings that follow.\nBrazil is also one of the few countries to have measurably narrowed income inequality through policy — cash transfers, minimum wage rises, pension expansion — which makes the persistence of its land inequality all the more pointed.","mn":"Who owns the land was usually settled by force generations ago, and almost nothing in modern economics disturbs it.","pt":["p12","p9"],"sr":[["IBGE Censo Agropecuário (land distribution)","https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria.html"],["Comissão Pastoral da Terra, Conflitos no Campo Brasil (annual)","https://www.cptnacional.org.br/publicacoes/conflitos-no-campo-brasil"]],"i":78},{"id":"russiaprivat","n":"Privatisation — Russia","t":"state","lat":55.754,"lon":37.578,"pl":"Moscow, Russia","ad":"Government House, Krasnopresnenskaya naberezhnaya 2, Moscow 103274","ro":"The fastest transfer of public assets to private hands in modern history.","who":"The 1992–96 Russian government; privatisation led by Anatoly Chubais, advised by Western economists and institutions","rch":"national","mx":["priv","own","inh"],"fg":[["Voucher privatisation","1992–94: every citizen received a voucher; most were sold cheaply within months"],["Loans-for-shares","1995–96: major oil, metals and media assets transferred to a small group of bankers at prices far below value"],["Outcome","Russia moved from one of the world's most equ
