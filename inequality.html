her accompany them and attend fee-charging private schools or sit entrance examinations back in the home province, or they remain in the village with grandparents. UNICEF's China programme has documented the health, schooling and mental health consequences for those left behind, measured in tens of millions of children.\nReform has been continuous and partial. Smaller cities have relaxed registration substantially; the largest, where the work is, operate points systems weighted towards education, property ownership and social insurance contributions, which admits graduates and excludes the construction and service workers the city depends on. The result is a labour force that can be hired cheaply because the cost of raising and educating the next generation of it sits elsewhere.","sr":[["Chan, 'The Chinese Hukou System at 50', Eurasian Geography and Economics","https://doi.org/10.2747/1539-7216.50.2.197"],["UNICEF China: children affected by migration","https://www.unicef.cn/en/figures-situation-children-china"]],"i":27},{"id":"caste_informality","n":"Inherited rank and work without a contract","t":"bind","lat":28.618,"lon":77.212,"pl":"New Delhi, India","ad":"Ministry of Labour and Employment, Shram Shakti Bhawan, Rafi Marg, New Delhi 110001","ro":"Combining a hereditary social order with an economy in which most work has no contract, so that birth predicts occupation and nothing accrues from the work.","who":"The labour ministry administers the codes that cover the formal sector; the great majority of Indian workers fall outside them.","rch":"national","mx":["excl","tied","floor"],"rd":"Caste discrimination has been unlawful in India since the constitution came into force in 1950, and reservations in education and public employment have produced a substantial Dalit and Adivasi professional class. Outside those channels the correspondence between birth and work has proved durable. Manual scavenging and sewer cleaning, which remain lethal occupations, are performed almost entirely by particular Dalit communities, and deaths in sewers are recorded in the hundreds over recent years.\nThe second element is informality. Most Indian workers have no written contract, no social insurance and no mechanism for collective bargaining; the ILO and the Indian government's own surveys put informal employment at around nine in ten workers. Informal work produces no record, which means no pension, no credit history and no claim against an employer who does not pay.\nResearch by the World Inequality Lab on India from 1922 to 2023 found income and wealth concentration at or above the levels of the colonial period, with the top 1 per cent holding a greater share of income than in almost any comparable economy. The two mechanisms reinforce each other: an inherited social position determines which work is available, and the nature of that work ensures it accumulates nothing to pass on.","sr":[["World Inequality Lab: income and wealth inequality in India, 1922-2023","https://halshs.archives-ouvertes.fr/halshs-04563836v1/file/WorldInequalityLab_WP2024_09_Income-and-Wealth-Inequality-in-India-1922-2023_Final.pdf"],["International Labour Organization: publications on informal employment","https://www.ilo.org/publications"]],"i":28},{"id":"labour_export","n":"Labour export as national policy","t":"bind","lat":14.572,"lon":121.022,"pl":"Metro Manila, Philippines","ad":"Department of Migrant Workers, Blas F. Ople Building, Ortigas Avenue, Mandaluyong, Metro Manila","ro":"Organising the export of workers as a development strategy, so that remittances substitute for domestic employment and families are separated for a generation.","who":"The Department of Migrant Workers, created in 2021 from the overseas employment administration established under Ferdinand Marcos in 1974, regulates recruitment and deployment.","rch":"national","mx":["tied","floor"],"rd":"The Philippines began organising overseas employment in 1974 as a temporary response to unemployment. It became permanent. Around two million Filipinos depart for work each year, and remittances recorded by the central bank run at roughly a tenth of national income, which stabilises the currency and funds household consumption, schooling and housing.\nThe state's role is administrative rather than coercive: it licenses recruiters, sets contract standards, negotiates bilateral agreements and provides legal assistance abroad. What it cannot control is the law of the receiving country, where a domestic worker in the Gulf or a nurse in Europe is subject to that state's rules on residence and employment. Deaths, unpaid wages and abuse cases are handled case by case through embassies.\nThe generational cost is in the separation. The Philippine Statistics Authority and migration researchers have tracked what happens to households in which one or both parents work abroad for long periods: better material provision, and measurable effects on schooling and emotional development of the children who stay. The arrangement also removes trained nurses, teachers and engineers from the domestic system that educated them, so the public services the remittances pay for privately are the ones losing the staff.","sr":[["Bangko Sentral ng Pilipinas: overseas Filipino remittance statistics","https://www.bsp.gov.ph/SitePages/Statistics/External.aspx"],["Philippine Statistics Authority: Survey on Overseas Filipinos","https://psa.gov.ph/statistics/survey/labor-and-employment/survey-overseas-filipinos"]],"i":29},{"id":"descent_status","n":"Status inherited through the mother","t":"bind","lat":18.0858,"lon":-15.9785,"pl":"Nouakchott, Mauritania","ad":"Ministère de la Justice, Avenue Gamal Abdel Nasser, Nouakchott","ro":"Treating servitude as a condition passed down a family line, which survives abolition because the land, the wages and the schooling were never returned.","who":"Mauritania abolished slavery by decree in 1981, criminalised it in 2007 and made it a crime against humanity in 2015; special tribunals sit in Nouakchott, Nouadhibou and Néma.","rch":"national","mx":["tied","excl","floor"],"rd":"Mauritania was the last state in the world to abolish slavery. The practice it abolished is lineage-based: a child born to an enslaved mother is treated as belonging to her master's family, and the status descends with the line. Most of those affected are Haratine, descended from the Black African populations enslaved by Arab-Berber groups. Estimates of how many people remain in that condition vary widely, from around 90,000 in the Global Slavery Index to the figure of up to 500,000 Haratine still enslaved or under a former master's control cited by Mauritanian anti-slavery organisations.\nThe UN Special Rapporteur on contemporary forms of slavery reported after visiting in 2022 that descent-based slavery persists alongside newer forms, and that currently and formerly enslaved people face continuing exclusion from land, education and political office. Prosecutions have been rare, and successive presidents have denied that the practice continues while activists who document it have been imprisoned.\nWhat makes the case instructive is the gap between a legal act and a social fact. Abolition ended the lawful ownership of people without transferring land to those who had worked it, paying wages for the work already done, or admitting their children to schools on equal terms. Freedom was conferred on people who had no asset, no record of employment and no recognised claim to anything.","sr":[["UN Special Rapporteur on contemporary forms of slavery: visit to Mauritania","https://documents.un.org/doc/undoc/gen/g23/138/36/pdf/g2313836.pdf"],["Anti-Slavery International: descent-based slavery in Mauritania","https://www.antislavery.org/wp-content/uploads/2017/01/1_upr_submission_on_mauritania_2015.pdf"]],"i":30},{"id":"tied_farm_visa","n":"The agricultural visa held by the employer","t":"bind","lat":38.887,"lon":-77.015,"pl":"Washington, DC, United States","ad":"US Department of Labor, 200 Constitution Avenue NW, Washington, DC 20210","ro":"Granting temporary farm visas to the employer rather than the worker, so that complaining about conditions ends the right to stay.","who":"The Department of Labor certifies H-2A positions and sets the adverse effect wage rate; the visa itself is issued by the State Department and tied to the certified employer.","rch":"national","mx":["tied","floor"],"rd":"The H-2A programme admits seasonal agricultural workers, mostly from Mexico and Central America, on visas valid only for the employer who petitioned for them. Use of the programme has grown steadily and now covers several hundred thousand certified positions a year. Workers are housed by the employer, transported by the employer and may not take other work, and a worker who is dismissed loses lawful status.\nFederal prosecutions have documented what that dependency permits at its worst. The indictment in Operation Blooming Onion in 2021 alleged a conspiracy in South Georgia in which workers were held in conditions the Justice Department described as modern slavery, including forced labour, confiscated documents and deaths on the job. Cases of that severity are not typical; the ordinary condition is a wage set by formula, housing of a standard the worker cannot refuse, and no practical route to complain.\nThe programme exists because agricultural employers cannot recruit domestically at the wages offered, and the wage is low in part because the programme supplies labour that cannot bargain. Children in the families that supply it grow up in the sending country or in migrant streams, with schooling interrupted in both cases.","sr":[["US Department of Justice: Operation Blooming Onion indictment","https://www.justice.gov/usao-sdga/pr/24-defendants-indicted-multi-million-dollar-south-georgia-based-human-smuggling-and"],["US Department of Labor: H-2A programme data","https://www.dol.gov/agencies/eta/foreign-labor/performance"]],"i":31},{"id":"punishment_clause","n":"The exception written into abolition","t":"bind","lat":38.8929,"lon":-77.0229,"pl":"Washington, DC, United States","ad":"National Archives, 700 Pennsylvania Avenue NW, Washington, DC 20408","ro":"Abolishing slavery except as punishment for crime, which left a lawful route back to unpaid forced labour through the criminal law.","who":"The Thirteenth Amendment was ratified in December 1865; the exception is relied on by state and federal prison systems that require work.","rch":"national","mx":["tied","excl","floor"],"rd":"The Thirteenth Amendment prohibits slavery and involuntary servitude except as a punishment for crime whereof the party shall have been duly convicted. Within a decade of ratification, southern states had passed vagrancy and contract-enforcement laws under which Black men were convicted in large numbers and leased to plantations, mines and railways. Convict leasing persisted into the twentieth century, and historians including Douglas Blackmon have documented its mechanics in detail.\nThe clause still underwrites prison labour. Work is compulsory in most US prison systems, pay ranges from a few cents an hour to nothing in several states, and the ACLU's survey of incarcerated workers documented the absence of workplace protections, the use of disciplinary sanctions for refusal, and deductions that leave very little of what is earned. The convictions behind it fall unevenly, with Black Americans imprisoned at several times the rate of white Americans.\nThe generational effect runs through the household rather than the prison. A parent inside earns nothing a family can live on, and families pay for phone calls and commissary. On release, a criminal record restricts access to employment, public housing, occupational licences and in some states the vote. Several states, beginning with Colorado in 2018, have removed the equivalent exception from their own constitutions.","sr":[["National Archives: the 13th Amendment","https://www.archives.gov/milestone-documents/13th-amendment"],["ACLU: captive labor, the exploitation of incarcerated workers","https://www.aclu.org/news/human-rights/captive-labor-exploitation-of-incarcerated-workers"]],"i":32},{"id":"trainee_visa","n":"The training visa that forbids changing employer","t":"bind","lat":35.6866,"lon":139.7637,"pl":"Tokyo, Japan","ad":"Organization for Technical Intern Training, Otemachi, Chiyoda-ku, Tokyo","ro":"Admitting workers under a training category that bars them from moving to another employer, which removes the one response available to mistreatment.","who":"The Organization for Technical Intern Training supervises the programme introduced in 1993; legislation passed in 2024 replaces it from April 2027.","rch":"national","mx":["tied","floor"],"rd":"Japan's Technical Intern Training Programme was presented as skills transfer to developing countries and functioned as a labour supply for agriculture, construction, food processing and care. Around 456,000 people were working under it at the end of 2025. Interns are recruited abroad, often through brokers whose fees are paid with borrowed money, and are placed with a single employer they cannot leave.\nJapan's Immigration Services Agency recorded roughly 68,000 interns leaving their workplaces between 2012 and 2022, which is the measure usually cited for how the system functioned in practice. Documented complaints include unpaid overtime, wage deductions for accommodation, industrial injuries and, until the practice was formally prohibited, dismissal or forced return on pregnancy. A government panel recommended abolition, and the replacement programme, Employment for Skill Development, is due to begin in April 2027 with a cap of about 426,000 and with restrictions on changing jobs retained in modified form.\nThe arrangement is a bet that a receiving country can take the working years of a person's life without taking responsibility for the rest of it. The worker's schooling was paid for elsewhere, their children are raised elsewhere, and their old age is somewhere else again.","sr":[["The Diplomat: Japan's foreign worker policy and the trainee programme","https://thediplomat.com/2024/07/japan-wants-to-improve-its-foreign-worker-policy-but-xenophobia-prevails/"],["Nippon.com: replacing the Technical Intern Training Program","https://www.nippon.com/en/articles/-/15038"]],"i":33},{"id":"sponsorship","n":"Tying a worker's legal residence to one employer","t":"bind","lat":25.286,"lon":51.533,"pl":"Doha, Qatar","ad":"Ministry of Labour, Al Bidda Tower, Corniche Street, Doha","ro":"Making a migrant worker's right to remain in the country depend on a single employer, so that leaving the job means leaving the country.","who":"Qatar's labour ministry administers the sponsorship system and the reforms made to it from 2018, under an agreement with the International Labour Organization that placed an ILO office in Doha.","rch":"regional","mx":["tied","floor"],"rd":"Under sponsorship, usually called kafala, a migrant worker enters on a permit held by an employer and may not transfer to another without permission. Qatar removed the exit permit requirement for most workers from 2018 and, in 2020, introduced a non-discriminatory minimum wage and the right to change jobs without the employer's consent, changes the ILO describes as significant. Enforcement is the open question: researchers and the ILO's own reporting record employers who refuse to sign transfer paperwork, withhold passports or file absconding charges against workers who leave, which exposes them to detention and deportation.\nThe wage effect does not depend on cruelty. An employer who knows a worker cannot leave has no reason to match another offer, and a worker who has borrowed to pay a recruitment agent at home cannot afford to be deported before the debt is cleared. Recruitment fees charged in Nepal, Bangladesh and India are frequently equivalent to a year's wages and are the reason many workers arrive already in debt.\nThe system covers tens of millions of people across the Gulf, in construction, logistics and domestic work, and domestic workers have the fewest protections because they fall outside the labour code in several states. The money sent home is substantial and supports a generation of children's schooling. It also substitutes for the local employment and public provision that would have kept the families together.","sr":[["Human Rights Watch: Qatar country reporting","https://www.hrw.org/middle-east/north-africa/qatar"],["ILO project office in Qatar: progress reports on the labour reforms","https://www.ilo.org/projects-and-partnerships/projects/ilo-project-office-state-qatar"]],"i":34},{"id":"asymmetric_exchange","n":"Collecting information without supplying it","t":"secr","lat":38.8977,"lon":-77.0345,"pl":"Washington, DC, United States","ad":"US Department of the Treasury, 1500 Pennsylvania Avenue NW, Washington, DC 20220","ro":"Requiring foreign banks to report on American account holders while declining to join the equivalent multilateral system, which makes the country a destination for other countries' undeclared money.","who":"The Treasury administers FATCA and the intergovernmental agreements made under it; the United States has not adopted the OECD Common Reporting Standard.","rch":"global","mx":["hide","cap"],"rd":"The Foreign Account Tax Compliance Act of 2010 requires financial institutions worldwide to identify accounts held by US persons and report them to the Internal Revenue Service, on pain of withholding on their US-source income. It worked. More than a hundred jurisdictions now report, and the OECD built a multilateral equivalent, the Common Reporting Standard, under which participating countries exchange account information with each other automatically.\nThe United States has not joined that standard. It supplies information on a narrower basis under its bilateral agreements, which in practice means foreign tax authorities learn considerably less about accounts their residents hold in the United States than the IRS learns about accounts Americans hold abroad. The Tax Justice Network ranks the United States among the largest suppliers of financial secrecy for that reason, and advisers in several countries market US trust jurisdictions on exactly this basis.\nAsymmetry of this kind determines which governments can collect tax from their own wealthy residents. A country whose elite can hold assets in a jurisdiction that will not report them has a revenue base that stops at the border, and the services it can fund are limited accordingly.","sr":[["Tax Justice Network: financial secrecy index, United States profile","https://fsi.taxjustice.net/country-detail/#country=US"],["OECD: automatic exchange of information and the Common Reporting Standard","https://www.oecd.org/en/topics/automatic-exchange-of-information.html"]],"i":35},{"id":"freeport_storage","n":"Goods that are legally in transit for decades","t":"secr","lat":46.193,"lon":6.124,"pl":"Geneva, Switzerland","ad":"Ports Francs et Entrepôts de Genève, Route du Grand-Lancy 6, 1227 Les Acacias","ro":"Storing valuables in customs limbo, where no import duty falls due and ownership can change without the goods moving or being declared.","who":"Ports Francs et Entrepôts de Genève is majority-owned by the Canton of Geneva; comparable facilities operate in Luxembourg, Singapore and Delaware.","rch":"global","mx":["hide","trans"],"rd":"A freeport treats stored goods as not yet imported. Duty and value added tax fall due when something enters the country's economy, so an object that stays inside the warehouse is never taxed, however long it remains. Ownership can change while it sits there, which allows a work of art to be bought and sold several times without a declaration in any jurisdiction.\nThe Geneva facility has held, on past estimates, more than a million works of art alongside wine, gold and antiquities. A Swiss federal audit in 2014 found weaknesses in the inventory system after looted Roman and Etruscan antiquities were discovered in storage, and the rules were tightened to require clearer records of what is held and for whom. Switzerland has also brought parts of the art trade within its anti-money-laundering framework.\nWhat the arrangement produces is a class of asset that functions like a bearer instrument: valuable, transferable, and unattached to any tax event or public record. The same effect is pursued in other forms by holding art through companies and by borrowing against collections rather than selling them.","sr":[["Ports Francs et Entrepôts de Genève","https://www.geneva-freeports.ch/en/"],["Guardian: Switzerland's freeports and the art stored in them","https://www.theguardian.com/world/2016/jan/27/switzerland-freeports-art-storage-tax-haven"]],"i":36},{"id":"bank_secrecy","n":"Making disclosure a criminal offence","t":"secr","lat":47.3698,"lon":8.539,"pl":"Zurich, Switzerland","ad":"UBS, Bahnhofstrasse 45, 8001 Zurich","ro":"Criminalising the disclosure of bank customer information, which for most of a century made undeclared wealth safe from the country where it was earned.","who":"Swiss banking secrecy was codified in 1934; the system was dismantled in stages after the 2009 deferred prosecution agreement between UBS and the US Department of Justice.","rch":"global","mx":["hide","trans","conc"],"rd":"Swiss law made it a criminal offence for a bank employee to disclose client information, which meant that a foreign tax authority asking about one of its own residents received nothing. Combined with numbered accounts and a tradition of discretion, this made Switzerland the principal destination for European wealth that its owners did not wish to declare, and Zucman's estimates put the sums held offshore in the trillions.\nThe structure broke after 2008. UBS entered a deferred prosecution agreement with the US Department of Justice in 2009, paid $780 million and handed over client names; other Swiss banks followed, several hundred entered a disclosure programme, and Switzerland eventually signed up to automatic exchange of account information. Secrecy against tax authorities in participating countries is substantially gone.\nWhat remains is the industry that grew up around it. Private banking, trust administration and family office services in Zurich and Geneva continue to manage a large share of the world's cross-border wealth, now declared, and the professional capacity to structure holdings across jurisdictions survived the end of the secrecy that built it. The money did not leave; the reporting changed.","sr":[["US Department of Justice: the UBS deferred prosecution agreement","https://www.justice.gov/archive/tax/UBS_Signed_Deferred_Prosecution_Agreement.pdf"],["Alstadsæter, Johannesen and Zucman, 'Tax evasion and inequality'","https://gabriel-zucman.eu/files/AJZ2018.pdf"]],"i":37},{"id":"charter_market","n":"States competing to write company law","t":"secr","lat":39.1582,"lon":-75.5244,"pl":"Dover, Delaware, United States","ad":"Delaware Division of Corporations, John G. Townsend Building, 401 Federal Street, Dover, DE 19901","ro":"Letting companies choose which jurisdiction's law governs them, which gives the winning jurisdiction a financial interest in writing law that managers and controlling shareholders prefer.","who":"The Delaware Division of Corporations administers the register; the Court of Chancery decides the disputes and its judgments are the body of American corporate law.","rch":"global","mx":["hide","cap","conc"],"rd":"An American company may incorporate in any state regardless of where it operates. Delaware has won that competition: its 2025 annual report records more than 2.28 million registered entities and over two-thirds of the Fortune 500, with 334,461 new entities formed in that year alone. Franchise fees are a substantial share of the state's revenue.\nWhat Delaware sells is predictability and a specialist court. The Court of Chancery sits without juries, decides quickly and has produced a century of precedent on directors' duties, takeovers and shareholder suits. Critics have argued since William Cary's work in the 1970s that a state funded by incorporation fees will tend to resolve doubts in favour of the people who choose where to incorporate, who are managers and controlling shareholders rather than employees or minority investors. Recent amendments to the Delaware code, passed after several large companies threatened to reincorporate elsewhere, have narrowed shareholder litigation and controlling-shareholder scrutiny.\nThe rules that result decide how a company may be governed, what directors owe and to whom. Employees and suppliers are not parties to that choice and have no standing in the court that interprets it, which is one reason the obligations corporate law recognises are owed to shareholders and not to anybody else.","sr":[["Delaware Division of Corporations: 2025 annual report","https://corpfiles.delaware.gov/Annual-Reports/Division-of-Corporations-2025-Annual-Report.pdf"],["Delaware Division of Corporations: statistics","https://corp.delaware.gov/stats/"]],"i":38},{"id":"registered_address","n":"The company that is only an address","t":"secr","lat":39.747,"lon":-75.549,"pl":"Wilmington, Delaware, United States","ad":"The Corporation Trust Center, 1209 North Orange Street, Wilmington, DE 19801","ro":"Allowing a company to exist at a service address with no staff and no disclosed owner, which breaks the link between an asset and a person.","who":"The Corporation Trust Center is a registered agent office that serves as the legal address of hundreds of thousands of companies; US beneficial ownership reporting is administered by FinCEN.","rch":"global","mx":["hide"],"rd":"A registered agent provides the address at which a company can be served with legal papers. It does not provide offices, employees or any activity, so a single two-storey building in Wilmington is the legal home of several hundred thousand entities. The arrangement is lawful and ordinary; what makes it consequential is that for most of their history US states required no record of who actually owned the company registered there.\nThe Corporate Transparency Act of 2021 required companies to report their beneficial owners to the Financial Crimes Enforcement Network. Implementation has been contested in litigation and narrowed by rulemaking, and the register is not public in the way the European equivalents were designed to be. The Tax Justice Network has for years ranked the United States near the top of its financial secrecy index on the strength of this combination: extensive information collected from other countries under reporting agreements, and limited information supplied in return.\nThe practical effect is that a property, a bank account or a shareholding can be held by an entity whose owner cannot be identified from any public record. Tax authorities, divorcing spouses, creditors and journalists all encounter the same wall, and the people who do not encounter it are those whose assets are wages and a house in their own name.","sr":[["Tax Justice Network: financial secrecy index, United States profile","https://fsi.taxjustice.net/country-detail/#country=US"],["FinCEN: beneficial ownership information reporting","https://www.fincen.gov/boi"]],"i":39},{"id":"anonymous_company","n":"The company with no name attached","t":"secr","lat":18.4286,"lon":-64.6185,"pl":"Road Town, Tortola, British Virgin Islands","ad":"BVI Financial Services Commission, Pasea Estate, Road Town VG1110","ro":"Incorporating in a jurisdiction that keeps ownership out of public view, so that property and accounts elsewhere are held by an entity whose owner is undisclosed.","who":"The Financial Services Commission registers BVI companies; the territory is a British Overseas Territory with its own company law.","rch":"global","mx":["hide"],"rd":"The British Virgin Islands has a population of about 31,000 and has incorporated companies for people living everywhere else since the 1980s. A company can be formed quickly, needs no local activity, and until recently disclosed nothing publicly about who owned it. When the International Consortium of Investigative Journalists analysed the Panama Papers, the BVI was the single most common place of incorporation among the entities in the files.\nSince then the territory has built a register of beneficial owners accessible to law enforcement, and the United Kingdom legislated in 2018 to require its overseas territories to introduce public registers. Implementation has been repeatedly delayed, and a 2022 ruling of the European Court of Justice striking down general public access in the EU was taken up by several jurisdictions as a reason to narrow their own plans.\nThe service being sold is not a tax rate. It is the separation of an asset from a name: a London flat, a yacht, a shareholding or a bank account held by a BVI company whose directors are professional nominees. For a tax authority this removes the person to assess; for a claimant it removes the defendant to sue; and for a journalist it removes the sentence that would otherwise identify who benefits.","sr":[["ICIJ: offshore leaks database","https://offshoreleaks.icij.org/"],["BVI Financial Services Commission","https://www.bvifsc.vg/"]],"i":40},{"id":"conduit","n":"The country that money passes through","t":"secr","lat":52.081,"lon":4.317,"pl":"The Hague, Netherlands","ad":"Ministerie van Financiën, Korte Voorhout 7, 2511 CW The Hague","ro":"Combining an extensive treaty network with exemptions on outgoing payments, so that profit can leave a country where it was earned without being taxed on the way out.","who":"The Dutch finance ministry negotiates the treaty network; research at the University of Amsterdam identified the Netherlands as one of the largest conduit jurisdictions.","rch":"global","mx":["hide","cap"],"rd":"Most countries tax payments of interest, royalties and dividends leaving for a foreign parent. Tax treaties reduce those rates to encourage genuine cross-border investment, and a country with a large treaty network and no withholding of its own becomes a useful place to route a payment through. A network analysis of global corporate ownership published in Scientific Reports in 2017 identified the Netherlands as the largest single conduit, with the United Kingdom, Ireland, Singapore and Switzerland also prominent.\nThe entities doing the routing are frequently letterbox companies with no employees. Dutch research organisations such as SOMO have documented the scale of the flows and the effect on the countries at the other end, which are often low-income states whose treaty with the Netherlands limits what they may charge on money leaving. Several of those treaties have been renegotiated, and the Netherlands introduced a conditional withholding tax on payments to low-tax jurisdictions in 2021.\nThe mechanism matters because corporate tax is where many governments would otherwise collect from the most profitable activity in their economies. The Tax Justice Network's 2025 estimate puts annual losses to profit shifting and offshore wealth at around $492 billion, a sum that bears most heavily on states whose administrations are least able to contest a structure designed in Amsterdam and Luxembourg.","sr":[["Garcia-Bernardo et al., 'Uncovering offshore financial centers', Scientific Reports","https://www.nature.com/articles/s41598-017-06322-9"],["SOMO: research on the Netherlands as a conduit country","https://www.somo.nl/"]],"i":41},{"id":"offshore_firm","n":"The firm that designs the structure","t":"secr","lat":32.2949,"lon":-64.7823,"pl":"Hamilton, Bermuda","ad":"Appleby, 22 Victoria Street, Hamilton HM 12","ro":"Providing the legal engineering that assembles companies, trusts and partnerships into an arrangement no single jurisdiction can see whole.","who":"Appleby is one of the offshore law firms whose files were leaked in 2017 as the Paradise Papers; it operates from Bermuda, Cayman, the BVI, Jersey, Guernsey, the Isle of Man, Mauritius, Hong Kong and Shanghai.","rch":"global","mx":["hide","trans"],"rd":"Offshore structures are drafted. A chain of companies in three jurisdictions, a trust whose beneficiary is another trust, a partnership interest that converts on a defined event: these are the work product of law firms that specialise in them, and the expertise is expensive enough to be available only above a certain level of wealth.\nThe Paradise Papers, 13.4 million documents of which most came from Appleby, were examined by nearly 400 journalists in 67 countries and published in 2017. They set out arrangements used by multinational corporations, politicians, universities and private fortunes, together with the firm's own exchanges with regulators. Appleby described the leak as a criminal act, said it was a law firm advising on lawful structures, and denied wrongdoing. Very little of what was disclosed was unlawful, which is the point most often missed about the disclosures.\nA system in which the lawful minimisation of tax and liability requires bespoke legal engineering is a system that treats large fortunes differently from small ones in practice while treating them identically in form. The household whose income is a wage cannot restructure it in Bermuda.","sr":[["ICIJ: the Paradise Papers","https://www.icij.org/investigations/paradise-papers/"],["Guardian: Paradise Papers, the key revelations","https://www.theguardian.com/news/2017/nov/05/paradise-papers-leak-reveals-secrets-of-world-elites-hidden-wealth"]],"i":42},{"id":"tax_ruling","n":"The private tax ruling","t":"secr","lat":49.61,"lon":6.129,"pl":"Luxembourg City, Luxembourg","ad":"Ministère des Finances, 3 rue de la Congrégation, L-1352 Luxembourg","ro":"Agreeing in advance, in private, what tax a multinational will pay, which allows profit earned elsewhere to be booked where it is barely taxed.","who":"The Luxembourg tax administration issued the rulings disclosed in 2014 as LuxLeaks; the European Commission's competition directorate has examined several as unlawful state aid.","rch":"global","mx":["hide","cap"],"rd":"An advance tax ruling tells a company how its proposed structure will be taxed before it puts the structure in place. The practice is normal and in itself unobjectionable. What the LuxLeaks disclosures of 2014 showed was its use at scale: hundreds of rulings, negotiated by accountancy firms on behalf of multinationals, confirming arrangements under which profits routed through Luxembourg entities were taxed at effective rates of a few per cent or less.\nThe European Commission pursued several such arrangements as state aid, with mixed results in the courts. The Apple case, in which Ireland was ordered to recover about €13 billion, was annulled by the General Court and then restored by the Court of Justice in 2024. Other decisions, including those concerning Starbucks and Amazon, were annulled. The rulings themselves are not published, so the cases that have been examined are those that leaked or were investigated.\nA multinational's taxable profit is determined by the prices its subsidiaries charge one another for goods, loans, brands and services. Those prices are set internally, and a ruling confirms in advance that the tax authority will accept them. The result is that where a company earns its money and where it declares it are separate questions, and the revenue a country loses is revenue its own schools and hospitals do not receive.","sr":[["ICIJ: Luxembourg Leaks","https://www.icij.org/investigations/luxembourg-leaks/"],["European Commission: state aid cases database","https://competition-cases.ec.europa.eu/search?caseInstrument=SA"]],"i":43},{"id":"demolition_voucher","n":"Demolishing public housing and issuing vouchers","t":"pub","lat":41.8768,"lon":-87.6258,"pl":"Chicago, Illinois, United States","ad":"Chicago Housing Authority, 60 East Van Buren Street, Chicago, IL 60605","ro":"Clearing public housing and replacing it with rent subsidies spent in the private market, which hands the subsidy to landlords and exposes tenants to market rents.","who":"The Chicago Housing Authority's Plan for Transformation, agreed with the federal housing department in 2000, followed the national HOPE VI programme.","rch":"national","mx":["priv","excl","rent"],"rd":"Chicago demolished its high-rise public housing from 2000 onward, including Cabrini-Green and the Robert Taylor Homes, under a plan to rebuild or rehabilitate 25,000 units and rehouse residents in mixed-income developments or private rentals using vouchers. The buildings were in poor condition, which the authority itself had allowed to happen over decades of deferred maintenance.\nThe MacArthur Foundation's review of more than eighty studies found a mixed record: better housing quality and lower reported fear of crime for many who moved, alongside weak employment outcomes, lost social networks and relocation into neighbourhoods about as segregated and poor as those left behind. The Urban Institute's ten-year panel found that of 381 households tracked, seven were living in areas it classified as high opportunity. A minority of displaced residents returned to the redeveloped sites.\nA voucher is portable and a public unit is not, which is the argument for it. The difference is that a public unit is insulated from the rental market and a voucher is spent inside it, so the subsidy follows rents upward and lands with private landlords, who may decline to accept it. The land cleared in Chicago, close to the centre, was redeveloped at values the former residents could not meet.","sr":[["MacArthur Foundation: the CHA's Plan for Transformation, review of the research","https://www.macfound.org/media/article_pdfs/valegraves_cha_pft_final-report.pdf"],["National Low Income Housing Coalition: outcomes for relocated Chicago residents","https://nlihc.org/resource/study-assesses-outcomes-relocated-chicago-public-housing-residents"]],"i":44},{"id":"property_schools","n":"Funding schools from the property wealth around them","t":"pub","lat":38.8906,"lon":-77.0044,"pl":"Washington, DC, United States","ad":"Supreme Court of the United States, 1 First Street NE, Washington, DC 20543","ro":"Tying school budgets to local property values and holding that the federal constitution has nothing to say about the result.","who":"San Antonio Independent School District v. Rodriguez was decided 5-4 in 1973; the majority opinion was written by Justice Lewis Powell.","rch":"national","mx":["excl","cap"],"rd":"Parents in a poor district of San Antonio argued that funding schools principally from local property taxes gave their children less than children a few miles away received. The Supreme Court held in 1973 that education is not a fundamental right under the federal constitution and that wealth is not a suspect classification, so disparities of this kind raise no federal question. Litigation moved to state courts under state constitutions, where it has had mixed success for fifty years.\nThe mechanism survives because it compounds with housing. School quality is capitalised into house prices, so families pay for the school when they buy the house, and the families excluded from buying in those neighbourhoods, historically by federal mortgage underwriting and racial covenants, are excluded from the schools as well. Research by EdBuild and others has repeatedly found substantial funding gaps between predominantly white and predominantly non-white districts.\nJustice Powell wrote the majority opinion two years after drafting the confidential memorandum for the US Chamber of Commerce that argued business should organise systematically in the courts and in public argument. The connection is not conspiratorial; it illustrates how far a single appointment can carry a view of what courts should decline to decide.","sr":[["San Antonio Independent School District v. Rodriguez, 411 U.S. 1 (1973)","https://supreme.justia.com/cases/federal/us/411/1/"],["Oyez: San Antonio Independent School District v. Rodriguez","https://www.oyez.org/cases/1972/71-1332"]],"i":45},{"id":"private_pensions","n":"Replacing a public pension with individual accounts","t":"pub","lat":-33.443,"lon":-70.654,"pl":"Santiago, Chile","ad":"Palacio de La Moneda, Moneda s/n, Santiago","ro":"Converting a shared pension into a personal savings account, which transfers investment risk and the cost of interrupted work to the individual.","who":"Decree Law 3,500 of 1980 created the AFP system under the military government; the reform passed in 2025 restores a contributory public element.","rch":"global","mx":["priv","cond"],"rd":"Chile replaced its pay-as-you-go pension system in 1981 with mandatory individual accounts managed by private administrators, the AFPs. Each worker's pension became a function of their own contributions and the returns earned on them. The design was exported, with variations, to Peru, Colombia, Mexico, Bolivia, Poland, Hungary and elsewhere, frequently with World Bank support.\nThe outcomes depended on how continuous a person's working life was. Chilean women, people in informal employment and anyone with gaps for unemployment or care accumulated little, and by the 2010s a large share of pensions paid under the system fell below the minimum wage, which produced sustained protests. The ILO documented reversals in roughly eighteen countries that had adopted versions of the model, and Chile legislated a substantial reform in 2025 that rebuilds a public contributory component alongside the accounts.\nA pension is where a working life is converted into old age. A collective system pools the risk that an individual career is interrupted; an individual account does not, and it also hands the management fee to an administrator for forty years. Children of parents with inadequate pensions carry the difference, in support they provide and in inheritance they do not receive.","sr":[["OECD: Pensions at a Glance","https://www.oecd.org/pensions/pensions-at-a-glance.htm"],["ILO: reversing pension privatisation","https://www.ilo.org/publications/reversing-pension-privatization-rebuilding-public-pension-systems-eastern"]],"i":46},{"id":"discount_sale","n":"Selling public housing at a discount without replacing it","t":"pub","lat":51.495,"lon":-0.13,"pl":"London, United Kingdom","ad":"Ministry of Housing, Communities and Local Government, 2 Marsham Street, London SW1P 4DF","ro":"Transferring public housing into private ownership at below market value while restricting the use of the proceeds, which shrinks the stock permanently.","who":"The Right to Buy was created by the Housing Act 1980 and is administered by the housing ministry and local councils.","rch":"national","mx":["priv","rent"],"rd":"Council tenants in England have bought 2,052,813 homes under the Right to Buy up to 31 March 2026, on the government's own figures, at an average discount of roughly 44 per cent. Across the United Kingdom the total reached about 2.8 million by March 2025. Councils were restricted in how they could spend the receipts, and central funding for council housebuilding ended in 2007, so the stock was not rebuilt: the number of social homes in the UK fell from 6.8 million to 5.2 million, and the share of households renting socially fell from 31 per cent to 17 per cent.\nAbout two in five of the homes sold are now let by private landlords, according to the Chartered Institute of Housing's 2026 review, frequently at rents well above social levels and frequently to tenants whose rent is met by housing benefit. Public money that once maintained public housing now pays the rent on houses the state sold at a discount.\nThe first generation of buyers gained a real asset which many have since passed on. The households that followed found neither a council tenancy nor an affordable purchase. That is the transfer: one cohort received a subsidy in the form of a discounted house, and the cohort after it pays market rent for the same building.","sr":[["Right to Buy sales and replacements, England, 2025 to 2026","https://www.gov.uk/government/statistics/right-to-buy-sales-and-replacements-england-2025-to-2026/right-to-buy-sales-and-replacements-england-april-2025-to-march-2026"],["Chartered Institute of Housing: UK Housing Review 2026","https://www.cih.org/news/2026-uk-housing-review-highlights-continued-impact-of-right-to-buy-on-housing-pressures/"]],"i":47},{"id":"mass_privatisation","n":"Transferring a whole economy at once","t":"pub","lat":55.754,"lon":37.578,"pl":"Moscow, Russia","ad":"Government House, Krasnopresnenskaya naberezhnaya 2, Moscow 103274","ro":"Privatising state industry rapidly and by voucher, which concentrates ownership in whoever can buy the vouchers up and lend against the assets.","who":"The Russian privatisation programme of 1992-96 was run by the State Property Committee, advised by Western consultants funded by USAID and others.","rch":"regional","mx":["priv","conc"],"rd":"Russia distributed vouchers to citizens in 1992 and used them to privatise state enterprises, then transferred its most valuable resource companies through the loans-for-shares auctions of 1995 and 1996, in which banks lent to the government against shares that were later sold to the lenders themselves at low prices. Within five years, mines, oil fields and metals plants that had been state property were held by a few dozen people.\nThe speed was deliberate and defended at the time as the only way to make the change irreversible before a political reaction could stop it. The World Inequality Lab's reconstruction of Russian wealth from 1905 to 2016 shows the result: a shift from one of the world's more equal recorded distributions to one of its least equal, with offshore holdings of Russian households estimated at roughly the size of all declared domestic financial assets.\nThe design of a privatisation determines who ends up owning a country, and Russia's distributed vouchers to everyone and assets to very few. Most citizens sold their vouchers within a year, at prices set by people who knew what the underlying enterprises were worth.","sr":[["World Inequality Lab: from Soviets to oligarchs, inequality and property in Russia","https://wid.world/document/soviets-oligarchs-inequality-property-russia-1905-2016/"],["NBER working paper 23712 on Russian privatisation and inequality","https://www.nber.org/papers/w23712"]],"i":48},{"id":"bulk_purchase","n":"Buying family houses in bulk","t":"own","lat":32.78,"lon":-96.797,"pl":"Dallas, Texas, United States","ad":"Invitation Homes, 1717 Main Street, Suite 2000, Dallas, TX 75201","ro":"Converting owner-occupied housing into a rental asset class, with purchases made in cash against households that need a mortgage.","who":"Invitation Homes, created by Blackstone out of post-2008 foreclosure sales and listed in 2017, is the largest corporate owner of single-family rental houses in the United States.","rch":"national","mx":["rent","conc"],"rd":"After the 2008 crisis, houses taken in foreclosure were sold in bulk, at auction and for cash, to investors able to buy without financing. Those houses were repaired, let and assembled into portfolios. Invitation Homes reported 85,961 homes at the end of the third quarter of 2026, with average occupancy of 96.4 per cent and renewal rent growth of 4.3 per cent.\nThe advantage in the purchase is structural rather than predatory. A corporate buyer pays cash, closes quickly, waives inspection and does not need an appraisal to match the offer, which a household with a mortgage cannot do. In the metropolitan areas where these portfolios are concentrated, a family bidding for a starter house is bidding against that.\nHome equity is how most American households have accumulated anything, and a house converted from owner-occupation to a rental is removed from that process permanently; the rent paid on it accrues to shareholders instead. The company's own earnings materials note that renting one of its homes now costs around a thousand dollars a month less than owning, which is accurate and describes the position of households who are not accumulating the equity that the owner is.","sr":[["Invitation Homes: Q3 2026 results","https://s28.q4cdn.com/264003623/files/doc_earnings/2026/q3/earnings-result/Q3-2026-Press_Release.pdf"],["Invitation Homes: investor relations","https://www.invh.com/investor-relations"]],"i":49},{"id":"listed_rental","n":"Housing as a listed asset class","t":"own","lat":51.478,"lon":7.218,"pl":"Bochum, Germany","ad":"Vonovia SE, Universitätsstraße 133, 44803 Bochum","ro":"Consolidating formerly public and company-owned housing into listed corporations answerable to shareholders for rental growth.","who":"Vonovia is Europe's largest residential landlord, assembled from privatised municipal, state and company housing stock, principally in Germany.","rch":"regional","mx":["rent","priv","conc"],"rd":"German cities, federal states and industrial companies sold large housing portfolios in the 1990s and 2000s to close budget gaps. The buyers were private equity funds, which consolidated the stock and floated it. Vonovia now owns hundreds of thousands of apartments, and a tenant's landlord is a company whose shareholders expect rental income to grow each year.\nTenants responded politically. Berlin introduced a rent cap in 2020 which the Federal Constitutional Court struck down in 2021 on the ground that the federal legislature, not the state, holds the competence. In September 2021 a city-wide referendum on expropriating the largest corporate landlords, with compensation, passed with about 59 per cent of the vote. The result was advisory, and successive city governments have not implemented it; an expert commission appointed to examine it reported that such a law could be constitutional.\nThe sale of public housing is a one-off receipt and a permanent change in who sets the rent. Tenants whose parents held a secure municipal tenancy now hold a tenancy from a listed company, and the share of income going to rent in German cities has risen accordingly.","sr":[["Berlin referendum results, Deutsche Wohnen & Co. enteignen","https://www.berlin.de/wahlen/volksentscheide/"],["Federal Constitutional Court: ruling on the Berlin rent cap","https://www.bundesverfassungsgericht.de/SharedDocs/Pressemitteilungen/EN/2021/bvg21-028.html"]],"i":50},{"id":"stock_pay","n":"Paying executives in shares","t":"own","lat":38.88,"lon":-77.023,"pl":"Washington, DC, United States","ad":"Business Roundtable, 1000 Maine Avenue SW, Suite 500, Washington, DC 20024","ro":"Tying executive pay to the share price, which makes labour costs a direct deduction from the pay of the people deciding them.","who":"The Business Roundtable, an association of chief executives of large US corporations, has defended stock-based pay and the shareholder model since the 1970s; its 2019 restatement of corporate purpose left pay practice unchanged.","rch":"global","mx":["conc","cap","floor"],"rd":"Agency theory proposed in the 1970s that managers would act in shareholders' interests if they were paid like shareholders. American companies adopted the prescription, and the composition of executive pay shifted from salary and bonus to stock and options. The Economic Policy Institute's series records chief executive pay at the largest 350 US firms rising by more than 1,300 per cent since 1978, against roughly 28 per cent for typical workers, with the ratio moving from about 21 to 1 in 1965 to 325 to 1 in 2025.\nThe design does what it was meant to do. Anything that raises the share price raises the executive's pay, including buybacks, cost reduction and the outsourcing of work to contractors and suppliers. Wages appear in that calculation as an expense, and decisions about them are taken by people whose own compensation moves in the opposite direction. Bebchuk and Tallarita's analysis of the Business Roundtable's 2019 statement found that signatory companies made no corresponding changes to governance documents or pay arrangements.\nThe pay packages are approved by shareholder votes, which are cast largely by the index managers described elsewhere on this map.","sr":[["Economic Policy Institute: CEO pay series","https://www.epi.org/blog/ceo-pay-surged-in-2025-ceos-are-paid-325-times-as-much-as-the-typical-worker/"],["Bebchuk and Tallarita, 'The Illusory Promise of Stakeholder Governance'","https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3544978"]],"i":51},{"id":"sovereign_conversion","n":"Turning a finite resource into a permanent claim","t":"own","lat":24.487,"lon":54.357,"pl":"Abu Dhabi, United Arab Emirates","ad":"Abu Dhabi Investment Authority, 211 Corniche Street, Abu Dhabi","ro":"Converting oil revenue into shareholdings, property and infrastructure abroad, which transfers income from the countries where those assets sit.","who":"The Abu Dhabi Investment Authority, founded in 1976, is among the largest sovereign funds; it does not publish its assets, which outside estimates place above a trillion dollars.","rch":"global","mx":["conc","rent","hide"],"rd":"A state with a finite resource and a small population faces a genuine problem: the revenue will stop and the obligations will not. Sovereign funds answer it by converting the resource into a diversified claim on other economies, held for the long term. Abu Dhabi has been doing this since 1976, Norway since the 1990s, Saudi Arabia at scale more recently.\nThe difference between these funds lies in disclosure and in what they buy. Norway's fund publishes its holdings, its voting and its ethical exclusions. ADIA publishes no figure for its assets, so the trillion-dollar estimates reported by Global SWF and others are inferences. Gulf funds have also moved into housing, utilities, ports and water in other countries, where the income they collect is rent paid by households and firms in those countries.\nThe mechanism is not the fund's existence but its scale and its opacity. When a single investor of this size enters a housing or infrastructure market, prices move and the resulting income leaves the country, and the people paying the rent have no means of identifying the owner. The labour that built the domestic projects is supplied under the sponsorship arrangements described elsewhere on this map.","sr":[["Abu Dhabi Investment Authority: about us","https://www.adia.ae/en/about"],["Global SWF rankings reported by Gulf Business","https://gulfbusiness.com/3-gcc-swfs-aum-over-1tn-global-swf/"]],"i":52},{"id":"index_vote","n":"Voting other people's savings","t":"own","lat":40.7555,"lon":-74.001,"pl":"New York, United States","ad":"BlackRock, 50 Hudson Yards, New York, NY 10001","ro":"Pooling household savings into index funds whose managers hold the voting rights, which concentrates corporate control in a handful of firms.","who":"BlackRock, Vanguard and State Street together manage the largest share of indexed equity and are the largest shareholder in most large listed US companies.","rch":"global","mx":["conc","cap"],"rd":"Index investing is cheap and sensible for the saver, and it separates two things that used to travel together. The household supplies the money and bears the investment risk; the fund manager holds the shares and casts the votes attached to them. Research by Fichtner, Heemskerk and Garcia-Bernardo found the big three managers constituting the largest shareholder in close to ninety per cent of S&P 500 companies and casting roughly a quarter of the votes at their meetings.\nThose votes decide executive pay, board composition, buybacks and mergers, and they are generally cast with management. The same manager is also the largest shareholder of firms that compete with each other, which a body of economics literature argues reduces the incentive for aggressive competition between them, though the empirical claim is contested.\nThe saver is never consulted. A teacher paying into a retirement plan has no mechanism to express a view on the remuneration package of a company in that plan, and the people whose wages are the cost line in those decisions are frequently the same people. Some managers have begun offering pass-through voting to large clients, which addresses the institutional part of the problem and not the household part.","sr":[["Fichtner, Heemskerk and Garcia-Bernardo on common ownership","https://theconversation.com/these-three-firms-own-corporate-america-77072"],["BlackRock: quarterly results and assets under management","https://www.blackrock.com/corporate/newsroom/media/press-releases/blackrock-reports-third-quarter-2026"]],"i":53},{"id":"programme_before_coup","n":"A finished programme waiting for a government","t":"doct","lat":-33.5,"lon":-70.615,"pl":"Santiago, Chile","ad":"Instituto de Economía, Pontificia Universidad Católica de Chile, Avenida Vicuña Mackenna 4860, Macul, Santiago","ro":"Preparing a complete economic programme in advance, and implementing it under a government that could not be voted out.","who":"Economists trained at Chicago under the 1956 exchange agreement; their programme document, known as El Ladrillo, was complete before the coup of September 1973.","rch":"national","mx":["supp","priv","cond"],"rd":"A faculty built over two decades with American funding produced a group of Chilean economists who had written a full economic programme before there was a government willing to implement it. The document circulated among military officers in the weeks around the coup of 1973. From 1975 its authors held the finance and economy ministries.\nWhat followed was the most complete application of the programme anywhere: pensions replaced by individual accounts under Decree Law 3,500, schooling funded by voucher, health insurance partly privatised, water rights made tradable, and the labour code rewritten. The sequencing mattered. The labour code was rewritten while trade unions were banned and their leaders were in prison, in exile or dead, so none of it was bargained over.\nDemocracy returned in 1990 and most of the structure stayed, partly because the constitution written in 1980 required supermajorities to change it. The pension system produced a generation of inadequate pensions, protests from 2016 onward, and a reform passed in 2025. The episode is the clearest demonstration available that the obstacle to programmes of this kind is not technical but political, and that removing the political obstacle is what allows them to be implemented whole.","sr":[["National Security Archive: Chile documentation project","https://nsarchive.gwu.edu/project/chile-documentation-project"],["Library of Congress of Chile: Decree Law 3,500 of 1980","https://www.bcn.cl/leychile/navegar?idNorma=7147"]],"i":54},{"id":"transition_advice","n":"Advising a country on who should own it","t":"doct","lat":42.371,"lon":-71.122,"pl":"Cambridge, Massachusetts, United States","ad":"former Harvard Institute for International Development, One Eliot Street, Cambridge, MA 02138","ro":"Embedding foreign advisers inside the agency distributing a country's assets, with consequences that outlast the advice.","who":"The Harvard Institute for International Development ran a USAID-funded programme advising Russian privatisation; the institute was closed in 2000 after the US government sued.","rch":"regional","mx":["supp","priv","conc"],"rd":"USAID paid Harvard to provide disinterested advice to the Russian government on securities law and privatisation in the 1990s, and the institute's staff worked inside the agencies drafting the rules. The United States subsequently sued, alleging that the project's leaders had invested in the Russian markets they were advising on, in breach of the contract. Harvard settled in 2005 for $26.5 million without admitting liability, Andrei Shleifer paid $2 million, and the total recovered across the defendants came to roughly $31 million of USAID's original $40 million outlay.\nThe settlement is not the main consequence. The privatisation that the programme advised on transferred Russian industry to a small number of people within a decade, and the distribution produced then is substantially the distribution today. The episode also discredited the broader project of Western technical assistance in Russian domestic politics, where it is still cited.\nTechnical assistance of this kind is offered constantly, by multilateral institutions, bilateral agencies and consultancies, on tax codes, mining regimes, procurement rules and privatisation design. The advisers leave when the contract ends. The ownership structure they helped write stays.","sr":[["Harvard Magazine: the Russia case and its settlement","https://harvardmagazine.com/2005/11/russia-case-and-dust-set.html"],["Chronicle of Higher Education: Harvard to pay $26.5 million","https://www.chronicle.com/article/harvard-u-will-pay-26-5-million-to-settle-lawsuit-alleging-fraud-in-russia-development-program/"]],"i":55},{"id":"institute_franchise","n":"Exporting the think tank as a franchise","t":"doct","lat":38.883,"lon":-77.095,"pl":"Arlington, Virginia, United States","ad":"Atlas Network, Two Liberty Center, 4075 Wilson Boulevard, Suite 310, Arlington, VA 22203","ro":"Funding and training local policy institutes in other countries, which gives an argument a domestic voice wherever it is needed.","who":"Atlas Network, founded by Antony Fisher in 1981 after he established the Institute of Economic Affairs in London, supports a partner network it describes as around 500 organisations in 100 countries.","rch":"global","mx":["supp","cap"],"rd":"Antony Fisher's insight, after founding the Institute of Economic Affairs in 1955, was that the model could be replicated. Atlas Network provides seed grants, training, fundraising support and prizes to independent local institutes rather than opening branches, so the argument in each country is made by people from that country, publishing in its language and appearing in its media.\nThe network's reach is its own claim, around 500 partners in 100 countries, and journalists have traced its grants to organisations active in particular national debates, including pension privatisation and labour regulation in Latin America and anti-union litigation in the United States. Funding is partly from foundations that do not disclose grantees in detail, which is the main criticism made of the structure.\nFor people campaigning on these questions, the practical consequence is that opposition arrives domestically rather than from abroad, already fluent in local politics and already in the press. The arguments are not imported in any visible sense; what is imported is the capacity to make them continuously.","sr":[["Atlas Network: frequently asked questions and partner network","https://atlasnetwork.org/faq"],["New Republic: reporting on the Atlas Network","https://newrepublic.com/article/175488/atlas-shadowy-global-network-right-wing-think-tanks"]],"i":56},{"id":"founding_network","n":"Funding a doctrine until a government needs it","t":"doct","lat":46.466,"lon":6.845,"pl":"Mont Pèlerin, Vaud, Switzerland","ad":"Hôtel du Parc, Mont Pèlerin, 1801 Le Mont-Pèlerin","ro":"Maintaining an unpopular economic programme through decades of irrelevance by funding journals, chairs and institutes, so that it is ready when a crisis arrives.","who":"Thirty-nine people met here in April 1947 at Friedrich Hayek's invitation and founded the Mont Pelerin Society, which still meets.","rch":"global","mx":["supp"],"rd":"The people who gathered above Lake Geneva in 1947 shared a conviction that economic planning, strong trade unions and steeply progressive taxation led towards tyranny. The postwar consensus went the other way for thirty years, and their ideas had little purchase on policy anywhere. What their supporters did instead was build an institutional base: journals, research institutes, endowed chairs, student programmes, prizes and a network of economists who knew one another.\nWhen stagflation discredited the prevailing framework in the 1970s and governments went looking for an alternative, this one had been developed in detail, had a trained cadre available to staff ministries, and had institutions ready to explain it. The Nobel prizes awarded to Hayek in 1974 and Friedman in 1976 conferred authority at the moment it was useful.\nThe lesson that network drew, and has since taught the organisations it funded, is that a doctrine does not need majority support while it waits. It needs maintenance, personnel and a crisis. Philip Mirowski and Daniel Stedman Jones have documented the funding and the organisational history in detail, and the Society still meets, its membership lists partly public and its proceedings private.","sr":[["Mont Pelerin Society: statement of aims","https://www.montpelerin.org/statement-of-aims/"],["Mirowski and Plehwe (eds), 'The Road from Mont Pelerin', Harvard University Press","https://www.degruyterbrill.com/document/doi/10.4159/9780674054264-005/html"]],"i":57},{"id":"transition_plan","n":"Having the personnel list ready","t":"doct","lat":38.892,"lon":-77.003,"pl":"Washington, DC, United States","ad":"The Heritage Foundation, 214 Massachusetts Avenue NE, Washington, DC 20002","ro":"Preparing detailed policy and staffing plans before an election, so that an incoming administration can act immediately and without drafting anything.","who":"The Heritage Foundation has published its Mandate for Leadership series since 1981; the 2023 edition was prepared with a coalition of allied organisations.","rch":"national","mx":["supp","cap","trans"],"rd":"Heritage's contribution to the method was logistical. Beginning with the first Mandate for Leadership in 1981, it prepared comprehensive policy manuals keyed to each federal agency, together with lists of people ready to be appointed. An administration arriving in January with a drafted programme and a staffing roster does not spend its first year deciding what it wants.\nThe institution is funded as a charity, which limits electoral activity and not policy work, and its tax filings are public. Its proposals on taxation have been consistent for four decades: lower marginal rates, lower taxes on capital gains and estates, and the repeal of the federal estate tax, which is the single measure most directly aimed at the transmission of wealth between generations.\nThe transition manual has been imitated by other organisations and in other countries, because the underlying observation is correct. Policy is made in the first year of an administration by whoever has already written it down, and the capacity to write it in advance belongs to organisations with permanent funding and no election to win.","sr":[["Heritage Foundation: Mandate for Leadership","https://www.heritage.org/conservatism/report/mandate-leadership-the-conservative-promise"],["ProPublica Nonprofit Explorer: Heritage Foundation filings","https://projects.propublica.org/nonprofits/organizations/237327730"]],"i":58},{"id":"union_law","n":"Making collective representation hard to fund","t":"doct","lat":38.807,"lon":-77.187,"pl":"Springfield, Virginia, United States","ad":"National Right to Work Committee, 8001 Braddock Road, Springfield, VA 22160","ro":"Requiring unions to represent workers who do not pay for representation, which drains their finances and weakens bargaining across an economy.","who":"The National Right to Work Committee and its legal foundation have campaigned and litigated on this since 1955; the Supreme Court extended the principle to all US public employees in Janus in 2018.","rch":"national","mx":["supp","floor","cap"],"rd":"American labour law requires a union to represent everyone in a bargaining unit, members and non-members alike. Right-to-work laws prohibit requiring non-members to contribute to the cost of that representation, which creates a straightforward incentive not to pay. Around half the states have such laws, and the Supreme Court's decision in Janus v. AFSCME applied the principle to every public employee in the country in 2018.\nThe effect on union density is well documented, and union density is closely associated with the wage distribution. Economic Policy Institute research attributes a substantial share of the rise in US wage inequality since 1979 to the decline of collective bargaining, particularly for workers without a degree, and the effect extends to non-union employers who once matched union rates to stay unorganised.\nA union is also the institution through which workers acquire pensions, training and a voice in how work is organised. Its decline removes the counterparty in wage setting, which leaves the wage to be determined by the employer and by whatever floor the state sets. Several of the other mechanisms on this map, from state preemption to the wage board, operate in the space that absence creates.","sr":[["Janus v. American Federation of State, County, and Municipal Employees (2018)","https://supreme.justia.com/cases/federal/us/585/16-1466/"],["Economic Policy Institute: unions and wage inequality","https://www.epi.org/publication/unions-and-wage-inequality/"]],"i":59},{"id":"business_mobilisation","n":"Organising business as a permanent political actor","t":"doct","lat":38.8995,"lon":-77.038,"pl":"Washington, DC, United States","ad":"US Chamber of Commerce, 1615 H Street NW, Washington, DC 20062","ro":"Building a standing capacity for business to litigate, lobby and shape public argument, rather than responding to each policy as it arises.","who":"Lewis Powell wrote a confidential memorandum for the Chamber in 1971, two months before his nomination to the Supreme Court; the Chamber has since been among the largest lobbying spenders in the United States.","rch":"national","mx":["supp","cap"],"rd":"Powell's memorandum argued that American business was losing the argument in universities, media and courts, and that the response should be organised, sustained and funded: scholars on retainer, textbooks reviewed, speakers placed, and a litigation programme to pursue business interests through the courts as civil rights organisations had done.\nWhat followed over the next decade was the construction of much of the apparatus that still operates: litigation centres, new think tanks, campus programmes and a greatly expanded lobbying presence. The Chamber itself has reported lobbying expenditure at or near the top of federal totals for most of this century, and its litigation centre participates in a substantial share of the Supreme Court's business cases.\nThe memorandum was not a conspiracy; it was a strategy document, and it was circulated privately before becoming public in 1972. Its significance is in the model it set out, in which business interests are represented continuously, across institutions, by organisations whose existence does not depend on any particular bill. Opposing interests, principally trade unions, have declined over the same period in both membership and expenditure.","sr":[["The Powell Memorandum (Washington and Lee archive)","https://scholarlycommons.law.wlu.edu/powellmemo/"],["OpenSecrets: US Chamber of Commerce lobbying","https://www.opensecrets.org/federal-lobbying/clients/summary?id=D000019798"]],"i":60},{"id":"shareholder_primacy","n":"Redefining what a company owes and to whom","t":"doct","lat":43.128,"lon":-77.629,"pl":"Rochester, New York, United States","ad":"Simon Business School, University of Rochester, Rochester, NY 14627","ro":"Recasting the company as a bundle of contracts owing its returns to shareholders, which makes every other claim on it a cost.","who":"Michael Jensen and William Meckling published 'Theory of the Firm' in 1976 at the University of Rochester; Jensen's later work argued for paying executives in equity.","rch":"global","mx":["supp","conc","floor"],"rd":"Jensen and Meckling's 1976 paper treated the firm as a set of contracts and the central problem of corporate governance as the risk that managers would pursue their own interests rather than the owners'. The solution proposed was to align the two by paying managers in equity. The paper is among the most cited in the discipline, and the prescription was adopted widely from the 1980s.\nThe framework has a consequence that follows directly from its premises. If the company's purpose is the return to its shareholders, then wages, supplier margins, maintenance and training are costs to be minimised, and the long-term interests of employees have no standing except insofar as they affect that return. Decisions that would once have been weighed against obligations to a workforce or a town became matters of calculation.\nThe Business Roundtable restated corporate purpose in 2019 to include employees, customers and communities. Bebchuk and Tallarita examined whether signatories changed their governance documents or pay structures and found that they had not. The doctrine persists because the mechanisms built around it, executive equity compensation and shareholder voting by index funds, continue to operate whatever is said about purpose.","sr":[["Jensen and Meckling, 'Theory of the Firm' (1976)","https://doi.org/10.1016/0304-405X(76)90026-X"],["Economic Policy Institute: CEO pay series","https://www.epi.org/blog/ceo-pay-surged-in-2025-ceos-are-paid-325-times-as-much-as-the-typical-worker/"]],"i":61},{"id":"curve_argument","n":"The argument that tax cuts pay for themselves","t":"doct","lat":38.8965,"lon":-77.0335,"pl":"Washington, DC, United States","ad":"Hotel Washington, 515 15th Street NW, Washington, DC 20004","ro":"Supplying a simple theoretical claim that cutting taxes raises revenue, which removes the apparent trade-off between tax cuts and public spending.","who":"Arthur Laffer sketched the curve for Dick Cheney and Donald Rumsfeld at a restaurant in this building in 1974; the argument has been used in US federal and state tax policy ever since.","rch":"global","mx":["supp","trans"],"rd":"The curve itself is unobjectionable: a tax rate of zero and a tax rate of one hundred per cent both raise nothing, so somewhere between them revenue peaks. The policy claim attached to it is that actual rates are above that peak, so cutting them will raise revenue. That claim is empirical, and it has been tested.\nKansas cut income taxes sharply in 2012 on an explicit version of this argument. Revenue fell, school funding was cut, the state's highways programme was raided and the legislature reversed most of the cuts in 2017 over the governor's veto. The Congressional Budget Office's analyses of federal tax cuts have consistently found substantial revenue losses rather than gains, and surveys of economists find very little support for the strong form of the proposition.\nThe argument persists because of what it does politically rather than analytically. It allows a reduction in taxes on high incomes, capital gains and estates to be presented as costless, which removes the need to name what will be cut to pay for it. The cuts are enacted and the revenue does not arrive, and the spending reductions follow a few years later under a different heading.","sr":[["Congressional Budget Office: analyses of tax legislation","https://www.cbo.gov/publication/53651"],["Center on Budget and Policy Priorities: Kansas and supply-side tax cuts","https://www.cbpp.org/research/state-budget-and-tax/kansas-provides-compelling-evidence-of-failure-of-supply-side-tax-cuts"]],"i":62},{"id":"first_institute","n":"The policy institute as a permanent campaign","t":"doct","lat":51.497,"lon":-0.127,"pl":"London, United Kingdom","ad":"Institute of Economic Affairs, 2 Lord North Street, Westminster, London SW1P 3LB","ro":"Establishing a research institute to make an unpopular case continuously for decades, with funding that need not be disclosed.","who":"The Institute of Economic Affairs was founded in 1955 by Antony Fisher on Hayek's advice; its funders are not published, and transparency campaigners rate its disclosure poorly.","rch":"national","mx":["supp","priv"],"rd":"Fisher asked Hayek how to change British politics and was advised not to stand for Parliament but to influence the people who shape opinion. The Institute of Economic Affairs published for twenty-five years on privatisation, monetary policy, trade union law and the sale of council housing, while none of it was politically plausible, and several of its proposals became policy after 1979.\nThe model has three components: a permanent institution, an output of short accessible publications, and close contact with journalists and politicians. The third is where its effectiveness lies, and it is also why the question of who pays matters. The institute does not disclose its donors and is rated poorly by the Who Funds You project; tobacco industry funding has been documented from archives, and the Charity Commission has previously found that one of its publications breached rules on political neutrality.\nFor anyone trying to understand why a particular argument appears in several newspapers in the same week, the institutional answer is usually more useful than a conspiratorial one. Organisations of this kind exist to supply comment, and they have the staff and the funding to supply it continuously.","sr":[["Who Funds You: transparency ratings for UK think tanks","https://whofundsyou.org/"],["Institute for Fiscal Studies: inequality research programme","https://ifs.org.uk/inequality/"]],"i":63},{"id":"chicago_school","n":"Training the economists who would staff the ministries","t":"doct","lat":41.79,"lon":-87.597,"pl":"Chicago, Illinois, United States","ad":"Department of Economics, University of Chicago, 5757 South University Avenue, Chicago, IL 60637","ro":"Producing a coherent body of theory and a supply of economists trained in it, which gave governments both a programme and the people to administer it.","who":"The Chicago department under Milton Friedman, George Stigler, Gary Becker and Arnold Harberger; the exchange programme with the Catholic University of Chile ran from 1956.","rch":"global","mx":["supp","cap"],"rd":"The Chicago department did serious work on monetary history, price theory and the economics of regulation, and its influence rests on that as well as on its politics. The policy programme that travelled under its name held that inflation is a monetary phenomenon, that regulators are captured by the industries they regulate, that unions raise some wages at the expense of others, and that most things the state does are done worse than the market would do them.\nIts reach came from training. The Chile programme from 1956 produced the economists who ran that country's ministries after 1975. Graduates staffed central banks and finance ministries across Latin America and later in eastern Europe, and the department's alumni dominated the economics of deregulation in the United States. Gary Becker extended price theory to crime, marriage and education, which recast schooling as an investment in human capital rather than a public provision, an argument that underpins charging students for it.\nThe body of work is contested within economics itself, and several of its empirical claims about regulation and inequality have been substantially revised. Its institutional legacy is less contested: a generation of officials who shared a framework and applied it.","sr":[["Valdes, 'Pinochet's Economists: the Chicago School in Chile'","https://press.princeton.edu/books/paperback/9780691181714/pinochets-economists"],["OECD: Pensions at a Glance","https://www.oecd.org/pensions/pensions-at-a-glance.htm"]],"i":64},{"id":"public_choice","n":"Treating public service as self-interest","t":"doct","lat":38.83,"lon":-77.308,"pl":"Fairfax, Virginia, United States","ad":"Buchanan House, George Mason University, 4400 University Drive, Fairfax, VA 22030","ro":"Modelling officials and voters as
