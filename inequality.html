<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inequality Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cinzel:wght@500;600&display=swap">
<style>
:root{
  --bg:#0b1014;--card:rgba(12,18,22,.94);--line:#27363d;--line2:rgba(255,255,255,.07);
  --ink:#e6e4de;--mute:#9aa4a6;--accent:#3f6470;--accent-hi:#9dbdc0;--head:#f0ece4;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 'Marcellus',Georgia,serif;overflow:hidden}
#map{position:absolute;inset:0;background:#070d10}
.card{position:absolute;z-index:800;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.55);backdrop-filter:blur(6px)}
.scroll{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
body.lightbase{--card:rgba(248,246,241,.95);--line:#c7ccc9;--line2:rgba(0,0,0,.08);--ink:#1d2426;--mute:#5d6a6c;--accent:#3f6470;--accent-hi:#2b4b55;--head:#131a1c}
body.lightbase .card{box-shadow:0 10px 30px rgba(0,0,0,.18)}

/* glossary */
.gl{border-bottom:1px dotted var(--accent-hi);cursor:help}
.gl:hover{color:var(--head);border-bottom-style:solid}
#gtip{position:fixed;z-index:1400;max-width:300px;padding:7px 10px;font:13px/1.45 'Marcellus',Georgia,serif;
  background:var(--card);border:1px solid var(--line);border-radius:5px;color:var(--ink);
  box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;backdrop-filter:blur(6px)}
body.lightbase #gtip{box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* left key */
#key{top:12px;left:12px;width:338px;max-height:calc(100% - var(--patH,290px) - 48px);overflow:auto;padding:14px 16px;box-sizing:border-box}
#key h1{font:600 21px/1.15 'Cinzel','Marcellus',serif;margin:0 0 5px;letter-spacing:.6px;color:var(--head)}
#key .lede{color:var(--mute);margin:0 0 3px;font-size:12.6px}
#key .lede2{color:var(--mute);margin:0 0 10px;font-size:11.4px}
#key.min .body,#key.min .lede,#key.min .lede2{display:none}
.tog{display:inline-block;float:right;cursor:pointer;font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:1px 8px}
.tog:hover{border-color:var(--accent-hi)}
.psec{margin:15px 0 4px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent-hi)}
.flab{font-size:11.4px;color:var(--mute);margin:9px 0 2px;letter-spacing:.3px}
.fchips{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 2px}
.fc{display:inline-flex;align-items:center;font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:1px 6px;cursor:pointer;opacity:.45;user-select:none}
.fc.on{opacity:1;border-color:rgba(157,189,192,.45)}
.fc:hover{border-color:var(--accent-hi)}
.fc .n{margin-left:5px;color:var(--mute);font-size:10.8px}
.row{display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--line2);font-size:12.9px;cursor:pointer}
.row:hover{color:var(--head)}
.row.off{opacity:.38}
.row .n{margin-left:auto;color:var(--mute);font-size:11.4px;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.35)}
body.lightbase .sw{border-color:rgba(0,0,0,.3)}
input.inp{background:rgba(127,140,145,.12);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font:inherit;font-size:12.6px;box-sizing:border-box;width:100%}
input.inp:focus{outline:none;border-color:var(--accent-hi)}
.btn{background:rgba(127,140,145,.12);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 9px;font:inherit;font-size:12.2px;cursor:pointer}
.btn:hover{border-color:var(--accent-hi);color:var(--head)}
.frst{color:var(--accent-hi);cursor:pointer;font-size:11.8px}
#flist{max-height:230px;overflow:auto;margin-top:5px}
.fi{padding:5px 3px;border-top:1px solid var(--line2);font-size:12.7px;cursor:pointer;display:flex;gap:7px;align-items:flex-start}
.fi:hover{background:rgba(157,189,192,.1)}
.fi .fm{color:var(--mute);font-size:11px;display:block}
.hint{font-size:11px;color:var(--mute);line-height:1.45;margin:4px 0 0}

/* right column */
#rcol{position:absolute;z-index:800;top:12px;right:12px;bottom:calc(var(--legH,210px) + 48px);width:300px;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:flex-end}
#rcol>*{pointer-events:auto;position:relative;box-sizing:border-box}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btnrow .card{position:relative;padding:7px 13px;cursor:pointer;letter-spacing:.2px;font-size:12.8px}
#patBtn{display:none}
.btnrow .card:hover{border-color:var(--accent-hi);color:var(--head)}
#tr{padding:11px 14px;width:100%}
#tr.min .body{display:none}
.bases{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12.6px;margin:4px 0 2px}
.bases label{cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
.rng{display:flex;align-items:center;gap:7px;font-size:11.6px;color:var(--mute);margin-top:6px}
.rng input{flex:1}

/* bottom boxes */
#patBox{left:12px;bottom:12px;width:338px;max-height:var(--patH,290px);display:flex;flex-direction:column;box-sizing:border-box}
#legBox{right:12px;bottom:12px;width:300px;max-height:var(--legH,210px);display:flex;flex-direction:column;box-sizing:border-box}
#patBox .bh,#legBox .bh{display:flex;align-items:center;padding:9px 14px 4px}
#patBox .bh .psec,#legBox .bh .psec{margin:0;flex:1}
#patBody,#legBody{overflow:auto;padding:0 14px 12px}
#patBox.min #patBody,#legBox.min #legBody{display:none}
.pat{padding:6px 9px;margin:4px 0;border-left:3px solid var(--pc);border-radius:0 4px 4px 0;background:rgba(157,189,192,.06);cursor:pointer}
.pat:hover{background:rgba(157,189,192,.14)}
.pat.on{background:rgba(157,189,192,.2)}
.pat .pt{font-size:12.9px;color:var(--head);line-height:1.3}
.pat .pm{font-size:10.7px;color:var(--mute);margin-top:1px;line-height:1.35}

/* detail */
#det{display:none;position:fixed;z-index:950;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 32px));max-height:min(82vh,840px);overflow:auto;padding:16px 22px 20px;box-sizing:border-box;box-shadow:0 24px 70px rgba(0,0,0,.72)}
#det.open{display:block}
#detGrip{position:sticky;top:-16px;margin:-16px -22px 4px;height:18px;cursor:grab;display:flex;justify-content:center;align-items:center;background:var(--card);z-index:2;touch-action:none}
#detGrip::after{content:"";width:42px;height:4px;border-radius:2px;background:rgba(140,150,155,.4)}
#det.dragging,#det.dragging #detGrip{cursor:grabbing;user-select:none}
#detX{position:absolute;z-index:3;top:5px;right:9px;background:none;border:0;color:var(--mute);font-size:21px;cursor:pointer;line-height:1}
#detX:hover{color:var(--head)}
.hp-k{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);padding-right:22px}
.hp h3{margin:3px 0 5px;font:600 19px/1.25 'Cinzel','Marcellus',serif;color:var(--head);border-bottom:1px solid var(--line);padding:0 18px 7px 0}
.hp-sub{color:var(--mute);font-size:12.2px;margin:0 0 4px}
.hp-role{margin:8px 0;color:var(--ink);font-size:13.6px;line-height:1.5}
.hp-h{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);margin:14px 0 4px}
.addr{display:flex;gap:9px;align-items:flex-start;background:rgba(157,189,192,.07);border-left:3px solid var(--accent);padding:8px 10px;border-radius:0 4px 4px 0;font-size:13px;line-height:1.45}
.addr .ab{flex:1}
.addr .ac{font-size:11.4px;color:var(--mute);margin-top:3px}
table.kv{border-collapse:collapse;font-size:12.6px;width:100%;margin:2px 0}
table.kv th{text-align:left;color:var(--mute);font-weight:400;vertical-align:top;padding:3px 12px 3px 0;white-space:normal;width:38%}
table.kv td{padding:3px 0;vertical-align:top}
.bts{margin:10px 0;padding:2px 0}
.bts p{margin:0 0 9px;font-size:13.4px;color:var(--ink);line-height:1.6}
.imp-box{margin:12px 0 4px;padding:10px 12px;background:rgba(157,189,192,.08);border-left:3px solid var(--accent-hi);border-radius:0 5px 5px 0;font-size:13.3px;line-height:1.55}
.imp-box .ih{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);display:block;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chips span{font-size:11.6px;border:1px solid var(--line);border-radius:3px;padding:1px 7px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chips span:hover{border-color:var(--accent-hi);color:var(--head)}
.chips .sw{width:9px;height:9px;border-radius:50%}
.hp-src{color:var(--mute);font-size:11.6px;margin-top:12px;border-top:1px solid var(--line2);padding-top:7px;line-height:1.5}
.hp-src a{color:var(--accent-hi)}
.hp-src div{margin:3px 0}
a{color:var(--accent-hi)}
.tag{display:inline-block;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--mute);margin-left:6px;vertical-align:2px}

/* overlays */
#info,#story{inset:0;z-index:1001;border-radius:0;border:0;display:none;overflow:auto;padding:58px max(26px,calc((100% - 940px)/2)) 46px;background:rgba(8,12,15,.978)}
body.lightbase #info,body.lightbase #story{background:rgba(246,244,239,.985)}
#info.open,#story.open{display:block}
#infoClose,#storyClose{position:fixed;top:12px;right:12px;z-index:1002;display:none}
#info.open~#infoClose,#story.open~#storyClose{display:block}
#info h1,#story h1{font:600 24px/1.25 'Cinzel','Marcellus',serif;margin:0 0 14px;color:var(--head)}
#info h2,#story h2{font:600 16px/1.3 'Cinzel','Marcellus',serif;margin:26px 0 8px;color:var(--head);letter-spacing:.3px}
#info p,#story p,#info li,#story li{font-size:14.2px;line-height:1.65}
#info ul,#story ul{padding-left:20px;margin:6px 0}
#info table{border-collapse:collapse;width:100%;font-size:13.2px;margin:10px 0}
#info table th{text-align:left;color:var(--mute);font-weight:400;border-bottom:1px solid var(--line);padding:5px 12px 6px 0}
#info table td{vertical-align:top;padding:7px 12px 7px 0;border-bottom:1px solid var(--line2)}
.warn{border-left:3px solid var(--accent);padding:6px 0 6px 13px;color:var(--ink)}

#ttip{position:fixed;z-index:2000;pointer-events:none;background:rgba(10,14,17,.97);border:1px solid var(--line);color:#e6e4de;border-radius:3px;padding:5px 9px;font-size:12.4px;display:none;max-width:300px;box-shadow:0 6px 18px rgba(0,0,0,.5);line-height:1.4}
#ttip .tm{color:#9aa4a6;font-size:11px;display:block}
#worldBtn{position:absolute;z-index:800;right:12px;bottom:calc(var(--legH,210px) + 20px);padding:6px 11px}
.maplibregl-ctrl-attrib{background:rgba(8,12,15,.78)!important;color:#8b9496;font-family:'Marcellus',Georgia,serif;font-size:10.5px}
.maplibregl-ctrl-attrib a{color:#a6aeb0!important}
.maplibregl-ctrl-group{background:var(--card)!important;border:1px solid var(--line);box-shadow:none!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}
body.lightbase .maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:none}
.maplibregl-ctrl-bottom-right{bottom:0}
.maplibregl-ctrl-top-right{top:auto;bottom:calc(var(--legH,210px) + 58px);right:12px}
@media (max-width:900px){
  #key{width:auto;right:12px;max-height:40%}
  #rcol{top:auto;bottom:12px;left:12px;right:12px;width:auto;max-height:44%;align-items:stretch}
  #patBox,#legBox{display:none}
  #patBtn{display:block!important}
  #worldBtn{display:none}
  #info,#story{padding:54px 16px 70px}
  .maplibregl-ctrl-top-right{display:none}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="key" class="card scroll">
  <button id="toggleKey" class="tog" type="button" title="Pull the key up or down">&minus;</button>
  <h1>Inequality Map</h1>
  <p class="lede">Who and what carries economic inequality from one generation to the next &mdash; grouped by mechanism, with the addresses.</p>
  <p class="lede2" id="lede2"></p>
  <div class="body" id="keyBody"></div>
</div>

<div id="rcol">
  <div class="btnrow">
    <div id="patBtn" class="card" role="button" tabindex="0">Patterns</div><div id="storyBtn" class="card" role="button" tabindex="0">About this map</div>
    <div id="infoBtn" class="card" role="button" tabindex="0">Method and sources</div>
  </div>
  <div id="tr" class="card"><button id="toggleTr" class="tog" type="button" title="Pull the basemap box up or down">&minus;</button><div class="body" id="trBody"></div></div>
</div>

<div id="patBox" class="card"><div class="bh"><span class="psec">Patterns behind the scenes</span><button id="togglePat" class="tog" type="button">&minus;</button></div><div id="patBody" class="scroll"></div></div>
<div id="legBox" class="card"><div class="bh"><span class="psec">On the map</span><button id="toggleLeg" class="tog" type="button">&minus;</button></div><div id="legBody" class="scroll"></div></div>

<div id="det" class="card scroll hp"><div id="detGrip" title="Drag to move"></div><button id="detX" type="button" title="Close">&times;</button><div id="detBody"></div></div>

<button id="worldBtn" class="btn card" type="button" title="Zoom back out to the whole world">Whole world</button>
<div id="info" class="card scroll"></div><button id="infoClose" class="btn" type="button">Close</button>
<div id="story" class="card scroll"></div><button id="storyClose" class="btn" type="button">Close</button>
<div id="ttip"></div>
<div id="gtip"></div>

"ad":"LVMH, 22 avenue Montaigne, 75008 Paris","ro":"Europe's largest fortune, built by buying the brands that signal status.","who":"Chairman and chief executive of LVMH; family holding through Agache and Financière Agache","rch":"global","mx":["trans","conc"],"fg":[["Fortune","the largest in Europe; topped the global list in 2023"],["Structure","family control through a chain of holding companies, with five children in senior group roles"],["French tax debate","the 'Zucman tax' proposal of a 2% minimum levy on fortunes above €100 million was rejected by the Senate in 2025 after heavy opposition"]],"rd":"LVMH owns Louis Vuitton, Dior, Moët, Hennessy, Tiffany, Sephora and about seventy other houses. Its margins come from scarcity and the price people will pay to signal where they stand, which makes it a fortune built directly on the existence of a very wealthy class. The group is controlled through a chain of family holding companies, and the succession has been arranged so that control passes without the holding being broken up.\nArnault was among the most prominent opponents of the economist Gabriel Zucman's proposal for a 2% minimum tax on fortunes above €100 million, calling it an attack on the French economy. France's National Assembly passed a version; the Senate rejected it.","mn":"The structures that keep a family's control of a company intact across generations are the same structures that keep its wealth out of the tax base.","pt":["p12"],"sr":[["Zucman, 'A Blueprint for a Coordinated Minimum Effective Taxation Standard for Ultra-High-Net-Worth Individuals' (G20 report, 2024)","https://gabriel-zucman.eu/files/report-g20.pdf"],["LVMH annual report and shareholding structure","https://www.lvmh.com/investors/"]],"i":1},{"id":"slim","n":"Carlos Slim","t":"inh","lat":19.441,"lon":-99.204,"pl":"Mexico City, Mexico","ad":"América Móvil, Lago Zurich 245, Colonia Ampliación Granada, 11529 Mexico City","ro":"The fortune made from a privatised national telephone monopoly.","who":"Honorary chairman of América Móvil and Grupo Carso","rch":"regional","mx":["trans","conc","rent"],"fg":[["Telmex","privatised in 1990; Slim's consortium acquired control with a period of protection from competition"],["OECD finding (2012)","Mexico's telecoms market dysfunction cost consumers an estimated $129 billion over 2005–2009, about 1.8% of GDP a year"],["Market share","Telmex/Telcel held around 70–80% of Mexican fixed and mobile markets for years after privatisation"]],"rd":"Mexico sold its state telephone company in 1990 as part of a privatisation programme urged by its creditors. The buyer got a national network, a captive customer base and several years without real competition. The OECD examined the result and concluded that Mexican consumers and businesses lost about $129 billion over five years to high prices and poor coverage — a transfer from an entire population to one balance sheet. Slim was for several years the richest person in the world, in a country where around a third of people live in poverty.\nMexico's 2013 telecoms reform finally forced prices down, which is the clearest proof the prices had been a policy choice.","mn":"Selling a national utility without first building a referee creates a private tax on everyone who needs to make a phone call.","pt":["p8","p1"],"sr":[["OECD Review of Telecommunication Policy and Regulation in Mexico (2012)","https://www.oecd.org/mexico/oecdreviewoftelecommunicationpolicyandregulationinmexico.htm"],["Mexican telecoms reform, 2013 (Federal Telecommunications Institute)","https://www.ift.org.mx/"]],"i":2},{"id":"adani","n":"Gautam Adani","t":"inh","lat":23.124,"lon":72.539,"pl":"Ahmedabad, Gujarat, India","ad":"Adani Corporate House, Shantigram, S G Highway, Khodiyar, Ahmedabad 382421","ro":"A fortune built almost entirely on infrastructure the public uses and the state awarded.","who":"Chairman of the Adani Group","rch":"regional","mx":["trans","conc","cap"],"fg":[["Group assets","ports, airports, power generation and transmission, coal, cement, data centres"],["Airports","won the right to operate six Indian airports in a single 2019 privatisation round, after the rules were changed to drop prior experience requirements"],["Hindenburg (2023)","short-seller report alleging stock manipulation and accounting fraud; about $150 billion in market value was lost before a partial recovery; the group denies the allegations"],["US indictment (2024)","US prosecutors charged executives over an alleged bribery scheme relating to solar contracts; the group denies wrongdoing"]],"rd":"Almost everything Adani owns is something a government decided to hand over: ports, airports, transmission lines, coal blocks. In 2019 India's airport privatisation rules were amended to remove the requirement of prior airport experience, and the group won all six airports on offer. The Hindenburg report in 2023 alleged long-running stock manipulation through offshore vehicles; the group denies it, and Indian regulators' examination has been contested ever since. In 2024 US prosecutors brought bribery charges against group executives over solar contracts, which the group also denies.\nWhether or not those allegations are proven, the structural fact is not in dispute: public infrastructure concentrated in one family's hands by administrative decision.","mn":"Privatisation moves an asset the public already paid for into private ownership, and the decision is usually made by a few officials rather than by any vote.","pt":["p3","p8"],"sr":[["US Department of Justice indictment press release (November 2024)","https://www.justice.gov/usao-edny/pr/indian-energy-company-executives-and-canadian-institutional-investment-fund-former"],["Financial Times reporting on the 2019 Indian airport privatisation rules","https://www.ft.com/content/0d3cbc6e-6b39-11ea-89df-41bea055720b"]],"i":3},{"id":"grosvenor","n":"Grosvenor Estate (Duke of Westminster)","t":"inh","lat":51.5118,"lon":-0.1479,"pl":"Mayfair, London, United Kingdom","ad":"70 Grosvenor Street, London W1K 3JP","ro":"Three hundred acres of central London, held by the same family since 1677 and passed down through trusts rather than by will.","who":"Hugh Grosvenor, 7th Duke of Westminster, who inherited in 2016 aged 25; the estate is run by Grosvenor Group under its own chief executive.","rch":"national","mx":["trans","rent"],"fg":[["Central London land held","about 300 acres, Mayfair and Belgravia"],["Estate value reported at the 2016 succession","about £9 billion"],["In the family since","1677"],["Inheritance tax on the succession","none; the trusts instead pay a periodic charge"]],"rd":"The land came into the family through a marriage in 1677, when it was farmland outside London. The city grew around it. Because the bulk of the estate is held in family trusts rather than owned personally, the 2016 succession was not a transfer of a dead man's property, and the 40% inheritance tax that applies to an estate passing on death did not fall due. Trusts of this kind instead pay a periodic charge of 6% of value every ten years. Tax campaigners put the avoided bill at roughly £3.6 billion.","mn":"A death duty only works on wealth that has to pass. Held in trust, land does not pass; the beneficiaries change and the asset stays where it is. This is the oldest mechanism on the map and the least contested: the rule that lets it work is public, and has been for decades.","pt":["p12","p6"],"sr":[["Guardian: Inheritance tax — why the new Duke of Westminster will not pay billions","https://www.theguardian.com/business/2016/aug/11/inheritance-tax-why-the-new-duke-of-westminster-will-not-pay-billions"],["Grosvenor: our history","https://www.grosvenor.com/about-us/our-history"]],"i":4},{"id":"mars","n":"Mars, Incorporated","t":"inh","lat":38.9342,"lon":-77.1775,"pl":"McLean, Virginia, United States","ad":"6885 Elm Street, McLean, VA 22101","ro":"One of the largest private companies in the world, wholly owned by one family for four generations, and a major buyer of cocoa.","who":"Owned by the Mars family; no shares are publicly traded and no accounts are published.","rch":"global","mx":["trans","conc","floor"],"fg":[["Ownership","private; the family holds the whole company"],["Founded","1911"],["Position in cocoa","among the largest buyers of West African cocoa"]],"rd":"A privately held company does not publish accounts, is not valued daily and is not obliged to answer shareholders. The family has kept the firm whole across four generations. On the buying side, the company's scale in chocolate makes it one of a small group of purchasers facing more than a million West African cocoa growers, which is the structure that holds farmgate prices where they are.","mn":"Private ownership and concentrated buying power compound in the same direction: the gains stay inside one family and are never disclosed, while the price paid at the other end of the chain is set by a handful of buyers.","pt":["p5","p12"],"sr":[["Mars: our history","https://www.mars.com/about/our-history"],["Fairtrade: new living income reference prices for cocoa","https://www.fairtrade.net/uk-en/get-involved/resources/media-centre/fairtrade-announces-new-living-income-reference-prices-for-cocoa.html"]],"i":5},{"id":"hancock","n":"Mining royalties — Australia","t":"inh","lat":-31.951,"lon":115.86,"pl":"Perth, Western Australia","ad":"Hancock Prospecting, 28 The Esplanade, Perth, WA 6000","ro":"A private fortune from iron ore in publicly owned ground, and the campaign that killed the tax on it.","who":"Gina Rinehart, executive chairman of Hancock Prospecting","rch":"national","mx":["trans","rent","cap"],"fg":[["Fortune","Australia's largest, from iron ore royalties and mining"],["Resource Super Profits Tax","proposed 2010; a reported A$22 million industry advertising campaign followed and the prime minister was removed by his own party within weeks"],["Replacement","the weakened Minerals Resource Rent Tax raised a small fraction of forecasts and was repealed in 2014"],["Ownership","minerals in Australia are legally vested in the Crown — that is, in the public"]],"rd":"Australian minerals belong, in law, to the public. In 2010 the federal government proposed taxing the extraordinary profits being made from the China-driven iron ore boom. The industry ran one of the most expensive advertising campaigns in Australian political history, Kevin Rudd was removed as prime minister by his own party within weeks, the replacement tax was negotiated with the three largest miners and raised almost nothing, and it was repealed in 2014.\nNorway taxed its North Sea oil at a high rate and built a sovereign fund now worth well over a trillion dollars. Australia had the same opportunity in iron ore and did not. The difference is not geology.","mn":"The same resource can fund a country's pensions for a century or a few private fortunes, and which one happens is decided by one tax fight.","pt":["p3","p9"],"sr":[["Australian Parliamentary Library, 'The Minerals Resource Rent Tax'","https://www.aph.gov.au/About_Parliament/Parliamentary_departments/Parliamentary_Library/pubs/rp/BudgetReview201415/MRRT"],["Norges Bank Investment Management (the comparison case)","https://www.nbim.no/"]],"i":6},{"id":"ambani","n":"Mukesh Ambani","t":"inh","lat":18.926,"lon":72.822,"pl":"Mumbai, India","ad":"Reliance Industries, Maker Chambers IV, Nariman Point, Mumbai 400021","ro":"India's largest fortune, in an economy where the top 1% take a larger share than almost anywhere.","who":"Chairman and managing director of Reliance Industries","rch":"regional","mx":["trans","conc","cap"],"fg":[["India's top 1% income share","around 22–23% — among the highest recorded anywhere (World Inequality Lab)"],["India's top 1% wealth share","over 40%"],["Reliance","oil refining, petrochemicals, telecoms (Jio) and retail"],["Jio","entered Indian telecoms in 2016 with free service, then consolidated the market"]],"rd":"The World Inequality Lab's Indian series shows the top 1% taking a larger share of national income than in the United States, Brazil or South Africa, and a larger share than under British rule. Reliance's growth is a study in how that happens: a refining business built with state-allocated resources, then a telecoms entrant that gave service away until competitors collapsed, then retail. Jio's arrival genuinely cut the price of data for hundreds of millions of people and left a market with far fewer sellers.\nAmbani's home in Mumbai, Antilia, is twenty-seven storeys tall and stands a few kilometres from settlements without reliable water.","mn":"Cheap data and extreme concentration arrived together, which is why 'did it benefit consumers?' is the wrong question to stop at.","pt":["p1","p12"],"sr":[["World Inequality Lab, 'Income and Wealth Inequality in India, 1922–2023'","https://halshs.archives-ouvertes.fr/halshs-04563836v1/file/WorldInequalityLab_WP2024_09_Income-and-Wealth-Inequality-in-India-1922-2023_Final.pdf"],["World Inequality Report 2026","https://prod.wid.world/www-site/uploads/2025/12/World_Inequality_Report_2026.pdf"]],"i":7},{"id":"sdcapitol","n":"South Dakota State Capitol","t":"inh","lat":44.368,"lon":-100.336,"pl":"Pierre, South Dakota, United States","ad":"500 East Capitol Avenue, Pierre, SD 57501","ro":"Where the trust laws are actually written and passed.","who":"South Dakota Legislature; Governor Larry Rhoden","rch":"global","mx":["trans","cap"],"fg":[["Trust Task Force","a standing industry group whose draft bills are reliably enacted"],["Court secrecy","trust records sealed permanently"]],"rd":"The reason South Dakota matters is not its banks but its statute book. A small legislature in a state of under a million people passes, almost without dissent, the provisions that an industry task force brings it, and those provisions then govern fortunes from São Paulo to Hong Kong. There is no state income tax to lose and a few hundred financial-services jobs to gain.\nIt is the clearest working example of a wider mechanism: when capital can choose which jurisdiction's law applies to it, the jurisdiction with the fewest residents and the least to lose sets the rules for everyone.","mn":"Any one state can sell a loophole to the whole world, and the people who lose the tax revenue never get to vote in that state's elections.","pt":["p12","p3"],"sr":[["ICIJ, Pandora Papers: South Dakota","https://www.icij.org/investigations/pandora-papers/us-trusts-offshore-south-dakota-tax-havens/"],["South Dakota Codified Laws, Title 55 (Fiduciaries and Trusts)","https://sdlegislature.gov/Statutes/55"]],"i":8},{"id":"sdtrusts","n":"South Dakota trust industry","t":"inh","lat":43.5468,"lon":-96.7295,"pl":"Sioux Falls, South Dakota, United States","ad":"South Phillips Avenue, Sioux Falls, SD 57104","ro":"The place that abolished the time limit on inherited wealth.","who":"Trust companies including Trident Trust's Sioux Falls office; trust law drafted with industry task-force input and passed by the state legislature","rch":"global","mx":["trans","hide"],"fg":[["Perpetual trusts","South Dakota abolished the rule against perpetuities in 1983, the first US state to do so"],["Trust assets held in the state","about $360 billion, more than quadrupled in a decade (Pandora Papers)"],["Pandora Papers","81 of the trusts identified in the leak were in South Dakota; 206 US trusts held over $1 billion linked to 41 countries"]],"rd":"For centuries English and American law said a trust had to end — the ‘rule against perpetuities’ meant a dynasty could tie up property for a few generations, not forever. In 1983 South Dakota deleted it. A trust set up in Sioux Falls can now hold assets indefinitely, pays no state income tax, seals its court records permanently, and in some circumstances protects assets from creditors and ex-spouses. Year after year the legislature has passed refinements drafted by the industry itself.\nThe Pandora Papers found trusts there linked to families accused of fraud, bribery and abuse of sugar-cane workers, alongside American dynasties including Pritzker and Wrigley heirs. Assets in state trusts rose from $57 billion to about $360 billion in a decade.","mn":"An inheritance tax only works if the wealth has to pass to somebody; a perpetual trust means it never passes at all, so it never gets taxed again.","pt":["p12","p10"],"sr":[["ICIJ, Pandora Papers: US trusts and South Dakota","https://www.icij.org/investigations/pandora-papers/us-trusts-offshore-south-dakota-tax-havens/"],["Axios, 'How South Dakota became a global tax haven'","https://www.axios.com/2021/10/06/south-dakota-global-tax-haven"]],"i":9},{"id":"stepup","n":"Step-up in basis (26 U.S.C. §1014)","t":"inh","lat":38.894,"lon":-77.026,"pl":"Washington, DC, United States","ad":"Internal Revenue Service, 1111 Constitution Avenue NW, Washington, DC 20224","ro":"A rule of the US tax code that erases a lifetime of untaxed gains at the moment of death.","who":"Written by Congress, administered by the IRS; the cost is scored by the Joint Committee on Taxation.","rch":"national","mx":["trans","hide"],"fg":[["Cost to the US Treasury","about $40 billion a year (Joint Committee on Taxation)"],["Unrealised gains held by taxpayers worth over $100m, 2025","$13.4 trillion (Tax Policy Center estimate)"]],"rd":"If you buy an asset for $1m and sell it for $50m, you owe tax on the $49m gain. If you never sell it and it passes to your child at your death, the child's cost base is reset to its value on that date. The $49m is never taxed, by anyone. Hold and wait is therefore the cheapest strategy available to anyone whose wealth is in assets rather than wages, and the incentive is strongest for the largest holdings.","mn":"Wages are taxed as they are earned. The growth in a large shareholding can be taxed never, if its owner simply holds it until death. That difference, repeated across a generation, is a tax system that treats inherited capital more gently than work.","pt":["p12","p3"],"sr":[["Congressional Research Service: Tax Treatment of Capital Gains at Death (IF11812)","https://www.congress.gov/crs_external_products/IF/PDF/IF11812/IF11812.2.pdf"],["US Treasury: Step-Up in Basis tax expenditure estimate","https://home.treasury.gov/system/files/131/Step-Up-Basis-2014.pdf"]],"i":10},{"id":"liechtenstein","n":"The Liechtenstein foundation (Stiftung)","t":"inh","lat":47.141,"lon":9.5215,"pl":"Vaduz, Liechtenstein","ad":"Amt für Justiz (Office of Justice), Äulestrasse 70, 9490 Vaduz","ro":"A legal form with no owner and no shareholders, used to hold a family's wealth indefinitely.","who":"Registered and supervised by the Office of Justice; the foundations themselves are administered by local trustees.","rch":"global","mx":["trans","hide"],"fg":[["Resident population","about 40,000"],["Legal form","foundation: assets have a purpose, not an owner"]],"rd":"A foundation holds assets for a stated purpose. Once wealth is inside it, there is no owner to die and no shares to inherit, so the events that trigger a death duty do not occur. Liechtenstein built a professional industry around the form and for decades combined it with banking secrecy; the principality has since signed up to automatic exchange of account information, which addresses reporting but not the structure itself.","mn":"The question a wealth tax or a death duty asks is: whose is this, and when did it change hands? A foundation is designed so that neither question has an answer.","pt":["p12","p10"],"sr":[["Tax Justice Network: Financial Secrecy Index — Liechtenstein","https://fsi.taxjustice.net/country-detail/#country=LI"],["Liechtenstein Office of Justice: Foundations","https://www.llv.li/en/national-administration/office-of-justice"]],"i":11},{"id":"walton","n":"Walton Enterprises LLC","t":"inh","lat":36.3729,"lon":-94.2088,"pl":"Bentonville, Arkansas, United States","ad":"P.O. Box 1860, Bentonville, AR 72712 (address as filed with the SEC)","ro":"The family holding company through which three generations of one family have held control of the largest private employer in the United States.","who":"Owned and directed by the Walton family; Walmart's board is chaired by Greg Penner, a Walton son-in-law.","rch":"global","mx":["trans","conc","floor"],"fg":[["Walmart stock held through family vehicles","about 45% of the company"],["Walmart employees worldwide","about 2.1 million"],["Shares moved into the Walton Family Holdings Trust, 2015","about 6% of Walmart"]],"rd":"Walmart is a public company, but control of it is not for sale. The founder's children put their shares into a single holding company in the 1950s, before the firm went public, so the stake passed to the next generation without ever being split among heirs or sold to pay a death duty. In 2015 Walmart announced that roughly 6% of its shares were being distributed to a newly formed Walton Family Holdings Trust. Two vehicles now hold the family's position, and the family's voting bloc is large enough that no other shareholder or coalition can outvote it.","mn":"The same family has set the terms of employment for about two million people for sixty years, and nothing in the law required the fortune to be broken up when its founder died. The holding company is the mechanism: it converts one generation's ownership into permanent control.","pt":["p1","p12","p5"],"sr":[["Walmart: Walton Enterprises, LLC statement (2015)","https://corporate.walmart.com/news/2015/04/10/walton-enterprises-llc-statement"],["Walmart SEC filings, including the annual proxy statement","https://stock.walmart.com/financials/sec-filings/default.aspx"]],"i":12},{"id":"dar","n":"Agrarian reform and Hacienda Luisita","t":"land","lat":14.6509,"lon":121.0458,"pl":"Quezon City, Philippines","ad":"Department of Agrarian Reform, Elliptical Road, Diliman, Quezon City 1100","ro":"The agency charged since 1988 with breaking up the largest estates, and the estate that showed how long that can be delayed.","who":"The Department of Agrarian Reform; the Comprehensive Agrarian Reform Program was enacted in 1988.","rch":"national","mx":["disp","rent","excl"],"fg":[["Programme began","1988"],["Hacienda Luisita","about 4,900 hectares in Tarlac, owned by the Cojuangco family"],["Stock distribution option","shares issued to farmworkers in 1989 in place of land"],["Supreme Court final ruling ordering distribution","2012"]],"rd":"The 1988 law let landowners hand farmworkers shares in a corporation instead of title to land. At Hacienda Luisita, the estate of the family of two later presidents, the workers received shares in 1989 and the land stayed in one piece. In 2004 a strike at the estate ended with seven people shot dead. The Supreme Court finally ordered the land distributed in 2012, twenty-three years after the shares were issued.","mn":"A statute that redistributes land can be satisfied on paper by giving people a certificate instead. The gap between the two is measured in generations: a farmworker who was handed shares in 1989 was of retirement age before the land was ordered divided.","pt":["p13","p9"],"sr":[["Philippine Supreme Court: Hacienda Luisita Inc. v. PARC, G.R. No. 171101 (2012)","https://lawphil.net/judjuris/juri2012/apr2012/gr_171101_2012.html"],["Department of Agrarian Reform: the agrarian reform programme","https://www.dar.gov.ph/about-us/"]],"i":13},{"id":"bia","n":"Allotment and the Bureau of Indian Affairs","t":"land","lat":38.8938,"lon":-77.0432,"pl":"Washington, DC, United States","ad":"Bureau of Indian Affairs, 1849 C Street NW, Washington, DC 20240","ro":"The agency that administered the division of tribal land into individual parcels, and still holds what is left in trust.","who":"Part of the Department of the Interior; allotment was authorised by Congress in the General Allotment (Dawes) Act of 1887.","rch":"national","mx":["disp","excl"],"fg":[["Tribal land holdings, 1887","138 million acres"],["Tribal land holdings, 1934","48 million acres"],["Land lost in the allotment era","about 90 million acres"],["Land declared surplus and sold to settlers and companies","about 60 million acres"]],"rd":"The 1887 Act divided reservations into individual allotments and declared the remainder surplus, to be sold. Allottees were declared incompetent to manage their own land, so title was held in trust by the government; land was then lost through surplus sales, through sales of deceased owners' allotments, and through tax foreclosure. Holdings fell from 138 million acres in 1887 to 48 million by 1934, when allotment ended. Remaining allotments were split among heirs over generations into fractions too small to use, a problem the Bureau still administers.","mn":"Two thirds of a land base was removed in under fifty years, and the mechanism was paperwork rather than war. Fractionated title is the part that keeps working: an inherited one-hundredth share of a parcel cannot be farmed, mortgaged or sold without the agreement of ninety-nine other heirs.","pt":["p9","p13"],"sr":[["Indian Land Tenure Foundation: land tenure history","https://iltf.org/land-issues/history/"],["National Archives: Dawes Act (1887)","https://www.archives.gov/milestone-documents/dawes-act"]],"i":14},{"id":"anglo","n":"Anglo American / De Beers","t":"land","lat":51.52,"lon":-0.103,"pl":"London, United Kingdom","ad":"17 Charterhouse Street, London EC1N 6RA","ro":"The company built on South African mineral wealth and the migrant labour system that supplied it.","who":"Duncan Wanblad, chief executive of Anglo American","rch":"global","mx":["disp","rent","excl"],"fg":[["South Africa's Gini coefficient","about 0.63 — the highest recorded of any sizeable country"],["Richest 1% of South Africans","held 54.9% of national wealth in 2024, up from just under half in 1994 (Oxfam South Africa)"]],"rd":"South Africa's mining industry was built on a system that recruited Black workers from distant rural areas and the neighbouring protectorates, housed them in single-sex compounds, paid them a fraction of white wages and required a pass to move. Anglo American and De Beers were at the centre of it. Apartheid ended in 1994; the geography it created — labour-sending districts with no economy of their own, townships an hour's commute from the work — did not. In 2012 police shot 34 striking platinum miners at Marikana, at a mine then owned by Lonmin.\nToday South Africa has the most unequal measured distribution of income in the world, and Oxfam South Africa found in 2026 that the richest 1% hold nearly 55% of the country's wealth, more than in 1994.","mn":"A wage system designed to make labour cheap can be abolished by law and still decide, two generations later, who lives near the work and who spends a fifth of their wage getting to it.","pt":["p7","p12","p13"],"sr":[["Oxfam South Africa, 'Hoarded Wealth, Dignity Denied' (2026)","https://www.oxfam.org.za/hoarded-wealth-dignity-denied-confronting-the-countrys-extreme-wealth-and-inequality-emergency/"],["Marikana Commission of Inquiry report","https://www.gov.za/sites/default/files/gcis_document/201506/marikana-report-1.pdf"]],"i":15},{"id":"ilands","n":"Basic Law: Israel Lands and the Israel Land Authority","t":"land","lat":31.7767,"lon":35.2054,"pl":"Jerusalem","ad":"Knesset, Kiryat Ben-Gurion, Jerusalem 9195016","ro":"The statutory basis on which 93% of the land is held by the state and leased rather than sold.","who":"Enacted by the Knesset in 1960; the land is administered by the Israel Land Authority, whose council includes members of the Jewish National Fund.","rch":"national","mx":["disp","excl","rent"],"fg":[["Land held by the state, the Development Authority and the JNF","93%, about 19.5 million dunams"],["JNF share","about 13% of the land, under a mandate to settle Jews"],["Palestinian citizens of Israel","about 21% of the population"],["Land under the jurisdiction of Palestinian municipalities, 2017 estimate","under 3%"]],"rd":"Most land in Israel cannot be bought. It is leased from the Israel Land Authority, usually for 49 or 98 years. Much of the land entered the state's hands after 1948 under the Absentees' Property Law, which vested the property of Palestinians who had fled or been expelled in a state custodian. Almost half the Land Authority's governing council is appointed by the Jewish National Fund, whose own mandate is to develop and lease land for Jews. In 2000 the High Court held that the state may not allocate land on the basis of religion or nationality, including through a third party.","mn":"Where land is leased and not sold, the body that grants the lease decides who can build, farm and pass on a home. Families expelled from property in 1948 did not merely lose a house; their descendants inherited the loss, while the land itself was reallocated.","pt":["p9","p13"],"sr":[["Human Rights Watch: Israel — discriminatory land policies hem in Palestinians","https://www.hrw.org/news/2020/05/12/israel-discriminatory-land-policies-hem-palestinians"],["Israel Land Authority","https://www.gov.il/en/departments/israel_land_authority"]],"i":16},{"id":"cargill","n":"Cargill","t":"land","lat":44.969,"lon":-93.473,"pl":"Wayzata, Minnesota, United States","ad":"15407 McGinty Road West, Wayzata, MN 55391","ro":"The largest privately held company in America; stands between most of the world's farmers and most of the world's food buyers.","who":"Brian Sikes, president and chief executive; owned by about 160 members of the Cargill and MacMillan families","rch":"global","mx":["floor","rent"],"fg":[["Ownership","private; roughly 90% held by the Cargill–MacMillan family"],["Role","one of the small group of traders handling the bulk of global grain, oilseed and cocoa flows"]],"rd":"Cargill publishes almost nothing it is not required to publish, because it has no outside shareholders to answer to. It buys grain, soy, palm oil, cocoa and meat from farmers and sells to processors and retailers, and in most of those markets only a few firms do the same job. That position lets it see the whole market — harvests, freight, demand — while the farmer at one end and the shopper at the other see only their own price.\nIt has been a defendant in US litigation over child labour in Ivorian cocoa supply chains (the Supreme Court held in 2021 that the specific claims could not be brought under the Alien Tort Statute, without ruling on the underlying conduct) and a repeated subject of deforestation findings in Brazil and Indonesia.","mn":"When a handful of private firms stand between every farmer and every buyer, they set both the price the farmer gets and the price you pay, and neither of you can see the other's number.","pt":["p5"],"sr":[["Nestlé USA v. Doe / Cargill v. Doe, 593 U.S. ___ (2021)","https://www.supremecourt.gov/opinions/20pdf/19-416_i4dj.pdf"],["Mighty Earth, reports on Cargill supply chains","https://www.mightyearth.org/"]],"i":17},{"id":"fha","n":"Federal mortgage underwriting and redlining","t":"land","lat":38.8841,"lon":-77.022,"pl":"Washington, DC, United States","ad":"US Department of Housing and Urban Development, 451 7th Street SW, Washington, DC 20410","ro":"The federal insurance programme that made the thirty-year mortgage possible, and made it conditional on the race of the neighbourhood.","who":"The Federal Housing Administration, established 1934, now part of HUD.","rch":"national","mx":["excl","disp","rent"],"fg":[["FHA share of new US residential construction by 1949","more than one third"],["Underwriting Manual guidance","neighbourhoods were rated on racial homogeneity"],["Racial covenants","recommended by the manual as a means of maintaining ratings"]],"rd":"Government mortgage insurance is why an ordinary American household could buy a house with a small deposit and a long fixed loan. The FHA's Underwriting Manual of the 1930s treated the entry of another race into a neighbourhood as a risk to property values, and rated accordingly. Loans flowed to new white suburbs and away from existing mixed and Black neighbourhoods, and the programme's scale meant that this judgment set the shape of the postwar housing market.","mn":"House equity is the main asset most American families hold and the main thing they pass on. A generation locked out of the cheapest mortgage credit in history had nothing of that kind to pass on, and the gap that followed is the measured racial wealth gap.","pt":["p9","p6","p13"],"sr":[["National Community Reinvestment Coalition: the HOLC redlining maps","https://ncrc.org/holc/"],["NBER working paper 28146: the effects of the 1930s HOLC redlining maps","https://www.nber.org/system/files/working_papers/w28146/revisions/w28146.rev0.pdf"]],"i":18},{"id":"freeport","n":"Freeport-McMoRan","t":"land","lat":33.45,"lon":-112.074,"pl":"Phoenix, Arizona, United States","ad":"333 North Central Avenue, Phoenix, AZ 85004","ro":"Operator of the Grasberg mine in West Papua, one of the largest gold and copper deposits on earth.","who":"Kathleen Quirk, president and chief executive","rch":"global","mx":["disp","rent"],"fg":[["Grasberg","among the world's largest gold reserves; mined since 1973 under a contract signed with the Suharto government"],["Papua","the provinces containing the mine remain among the poorest in Indonesia on most development measures"]],"rd":"Grasberg sits in the highlands of West Papua, on land belonging to the Amungme and Kamoro peoples, who were not meaningfully consulted when the contract was signed in 1967 with a government that had taken the territory by a vote the UN registered and most Papuans dispute. Since then the mine has produced extraordinary quantities of copper and gold, dumped tailings into the Ajkwa river system, and been protected by Indonesian security forces that Freeport has acknowledged paying. The surrounding provinces remain the poorest in the country.\nIndonesia has since taken a majority stake, so the revenue split has changed. The distribution on the ground has not.","mn":"Mineral wealth under a community's land does not become that community's wealth unless somebody writes it into the contract, and in 1967 nobody did.","pt":["p9","p13"],"sr":[["Amnesty International reporting on Grasberg and West Papua","https://www.amnesty.org/en/location/asia-and-the-pacific/south-east-asia-and-the-pacific/indonesia/"],["Freeport-McMoRan disclosures on payments to Indonesian security forces (SEC filings)","https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=FCX"]],"i":19},{"id":"glencore","n":"Glencore","t":"land","lat":47.195,"lon":8.52,"pl":"Baar, Switzerland","ad":"Baarermattstrasse 3, 6340 Baar","ro":"Mining and commodity trading house convicted of bribery on three continents.","who":"Gary Nagle, chief executive (to 2026); Kalidas Madhavpeddi, chairman","rch":"global","mx":["rent","floor"],"fg":[["US resolutions (2022)","over $1.1 billion in fines, forfeiture and disgorgement; guilty pleas to FCPA conspiracy and market manipulation"],["UK sentence (3 Nov 2022)","£280,965,092 — the largest penalty ever ordered in a UK corporate criminal conviction"],["Bribes proven in the UK case","$29 million paid for preferential access to African oil"]],"rd":"In 2022 Glencore pleaded guilty in the United States to conspiring to violate the Foreign Corrupt Practices Act and to manipulating fuel-oil prices, paying more than $1.1 billion. In November the same year a London court fined it £281 million after the Serious Fraud Office proved it had paid $29 million in bribes to officials in five African countries to get cheaper crude — the first time a company was convicted in Britain of authorising bribery rather than merely failing to prevent it. The judge called the corruption endemic. US prosecutors said the payments were made with the approval and encouragement of top executives.\nThe commodities in question — copper and cobalt from the Democratic Republic of the Congo, oil from West Africa — come from countries whose public revenues depend on exactly the prices and terms that were being rigged.","mn":"Corruption at this scale is not a side effect of resource wealth; it is how a country with minerals under its soil ends up with the minerals gone and the money somewhere else.","pt":["p5","p9"],"sr":[["Glencore fined £281m after the Serious Fraud Office prosecution (November 2022)","https://www.theguardian.com/business/2022/nov/03/glencore-fined-281m-bribery-oil-africa"],["US DOJ: Glencore entered guilty pleas to foreign bribery and market manipulation schemes","https://www.justice.gov/opa/pr/glencore-entered-guilty-pleas-foreign-bribery-and-market-manipulation-schemes"]],"i":20},{"id":"brazilland","n":"Land concentration — Brazil","t":"land","lat":-15.799,"lon":-47.864,"pl":"Brasília, Brazil","ad":"Esplanada dos Ministérios, Brasília, DF 70000","ro":"One of the most unequal distributions of farmland on earth, and the politics that protects it.","who":"Ministry of Agrarian Development; INCRA; the agribusiness caucus in Congress","rch":"national","mx":["disp","rent","excl"],"fg":[["Land Gini","about 0.73 in the agricultural census — among the highest in the world"],["Largest 1% of holdings","occupy nearly half of all farmland"],["Agrarian reform","constitutionally mandated since 1988; largely stalled"],["Rural violence","the Pastoral Land Commission records dozens of killings in land conflicts each year"]],"rd":"Brazil's land distribution is a direct inheritance of the sesmaria grants of the colonial period and the 1850 Land Law, which made land purchasable in cash at the moment slavery was ending — ensuring that the people being freed could not acquire any. The 1988 constitution requires land to serve a social function and permits expropriation of unproductive estates; the agribusiness bloc in Congress has made that largely unusable. The Landless Workers' Movement occupies estates to force the issue, and the Pastoral Land Commission counts the killings that follow.\nBrazil is also one of the few countries to have measurably narrowed income inequality through policy — cash transfers, minimum wage rises, pension expansion — which makes the persistence of its land inequality all the more pointed.","mn":"Who owns the land was usually settled by force generations ago, and almost nothing in modern economics disturbs it.","pt":["p12","p9","p13"],"sr":[["IBGE Censo Agropecuário (land distribution)","https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria.html"],["Comissão Pastoral da Terra, Conflitos no Campo Brasil (annual)","https://www.cptnacional.org.br/publicacoes/conflitos-no-campo-brasil"]],"i":21},{"id":"cocoa","n":"Le Conseil du Café-Cacao","t":"land","lat":5.3245,"lon":-4.019,"pl":"Abidjan, Côte d'Ivoire","ad":"Le Conseil du Café-Cacao, Abidjan-Plateau, Abidjan","ro":"The state body that fixes, by decree, the price a million cocoa growers are paid.","who":"A public body under the Ministry of Agriculture; the season price is announced by the minister.","rch":"national","mx":["floor","rent"],"fg":[["Registered cocoa producers","more than 1.1 million"],["Farmgate price, 2025-26 main crop","2,800 CFA francs per kilogram"],["Farmgate price set for 2026-27","1,200 CFA francs per kilogram, about $2.07"],["Fairtrade living income reference price, from autumn 2026","1,758 CFA francs per kilogram"]],"rd":"Côte d'Ivoire grows more cocoa than any other country, and the price its farmers receive is not negotiated but announced, at the start of the main crop each October. For 2026-27 the price was set at 1,200 CFA francs a kilogram, down from 2,800 the season before, a cut of more than half. The figure calculated by Fairtrade as the farmgate price consistent with a living income for an Ivorian cocoa household is 1,758 CFA francs. Seven producer unions demanded emergency measures after the cut.","mn":"The children of a cocoa household inherit the price their parents were paid, in the form of schooling not completed and land not improved. The price is set in Abidjan, in response to a world market in which a handful of grinders and chocolate makers are the buyers.","pt":["p5","p14"],"sr":[["Fairtrade International: new living income reference prices for cocoa","https://www.fairtrade.net/uk-en/get-involved/resources/media-centre/fairtrade-announces-new-living-income-reference-prices-for-cocoa.html"],["Global Agriculture: Ivorian and Ghanaian farmgate prices for 2026-27","https://www.global-agriculture.com/farming-agriculture/cocoa-price-gap-between-ivory-coast-and-ghana-widens-sharply-for-new-season/"]],"i":22},{"id":"nestle","n":"Nestlé","t":"land","lat":46.459,"lon":6.852,"pl":"Vevey, Switzerland","ad":"Avenue Nestlé 55, 1800 Vevey","ro":"The world's largest food company; a principal buyer in the cocoa, coffee and dairy chains where farm incomes are set.","who":"Philipp Navratil, chief executive (since September 2025)","rch":"global","mx":["floor","rent"],"fg":[["Farmer share of a chocolate bar","roughly 6–8% of retail value"],["Côte d'Ivoire farmgate price","1,200 CFA francs/kg after the 2026 cut, against a living-income reference price of 1,758 CFA francs/kg"],["Fairtrade finding (2025)","76% of Ivorian cocoa farmers studied still earned below a living income"]],"rd":"Cocoa grows in Côte d'Ivoire and Ghana, which between them supply around 60% of the world's beans, and is eaten mostly in Europe and North America. The farmer receives something on the order of 6–8% of what the finished bar sells for. In 2025 Côte d'Ivoire set a record farmgate price of 2,800 CFA francs a kilo on the back of a global price spike; by 2026, as prices fell, it cut that to 1,200 — while Fairtrade's own calculation of what a farming household needs stood at 1,758.\nNestlé does not set the Ivorian farmgate price; the state does. But the handful of companies that buy nearly all the crop set the price the state can afford to pay, and they have resisted binding commitments to a living income for three decades.","mn":"The gap between what a cocoa farmer earns and what a chocolate bar costs is not a mystery of distance or shipping — it is a price negotiated between a few very large buyers and farmers who have no one else to sell to.","pt":["p5"],"sr":[["Fairtrade International, new Living Income Reference Prices for cocoa (2026)","https://www.fairtrade.net/uk-en/get-involved/resources/media-centre/fairtrade-announces-new-living-income-reference-prices-for-cocoa.html"],["Fairtrade cocoa household income study 2025","https://www.fairtrade.net/content/dam/fairtrade/fairtrade-international/library/2025/cocoa-household-income/Fairtrade-cocoa-household-income-study-2025-at-a-glance.pdf"]],"i":23},{"id":"indianact","n":"The Indian Act","t":"land","lat":45.4253,"lon":-75.7141,"pl":"Gatineau, Quebec, Canada","ad":"Crown-Indigenous Relations and Northern Affairs Canada, 10 Wellington Street, Gatineau, QC K1A 0H4","ro":"An 1876 statute, still in force, under which reserve land is held by the Crown and residents cannot own it outright.","who":"Administered by Crown-Indigenous Relations and Northern Affairs Canada and Indigenous Services Canada.","rch":"national","mx":["disp","excl","tied"],"fg":[["In force since","1876"],["Reserve land tenure","held by the Crown for the use and benefit of the band"],["Consequence","land on reserve cannot normally be mortgaged or seized"]],"rd":"Reserve land is not owned by the people who live on it. Title sits with the Crown, which means a house on reserve cannot be used as security for an ordinary loan, because a lender cannot take the land if the loan fails. Under the same Act, status and band membership were historically lost by Indigenous women who married non-status men, with the loss passed to their children. The Act also authorised the residential school system.","mn":"Ownership is what turns a house into capital. Where the law withholds it, families can live somewhere for a century without accumulating anything transferable, and the band cannot borrow against its own territory to build.","pt":["p9","p13"],"sr":[["Indian Act, R.S.C. 1985, c. I-5 (Justice Laws Canada)","https://laws-lois.justice.gc.ca/eng/acts/i-5/"],["The Canadian Encyclopedia: the Indian Act","https://www.thecanadianencyclopedia.ca/en/article/indian-act"]],"i":24},{"id":"sa1913","n":"The Natives Land Act 1913 and after","t":"land","lat":-33.9268,"lon":18.4175,"pl":"Cape Town, South Africa","ad":"Parliament of South Africa, Plein Street, Cape Town 8001","ro":"The law that reserved most of the country's land for a tenth of its people, and the thirty years of restitution that have not reversed it.","who":"Passed by the Union Parliament in 1913; restitution is now run by the Commission on Restitution of Land Rights.","rch":"national","mx":["disp","excl","rent"],"fg":[["Land reserved for African occupation, 1913","about 7% of the country, later 13%"],["Land privately owned by white individuals, 2017 state audit","26.7 million hectares, 22% of all land"],["Farmland owned by white individuals","72% of individually owned farmland"],["Land reform target set by the National Development Plan","30% of farmland transferred"]],"rd":"The 1913 Act confined African land ownership to scheduled areas amounting to about 7% of the country, later raised to 13%, and made sharecropping and tenancy on white-owned farms unlawful. Families who were removed did not simply lose a field; they lost the asset their descendants would have inherited. The state's own 2017 land audit found white individuals still holding 26.7 million hectares, 22% of all land in the country and 72% of individually owned farmland.","mn":"This is what a multigenerational mechanism looks like when it is written down. The law was repealed in 1991. The distribution it produced is still the distribution, because land that was taken stays taken unless someone transfers it back.","pt":["p9","p13"],"sr":[["Africa Check: who owns the land in South Africa (2017 state land audit)","https://africacheck.org/fact-checks/factsheets/frequently-asked-questions-about-land-ownership-and-demand-south-africa"],["South African History Online: Natives Land Act of 1913","https://www.sahistory.org.za/article/natives-land-act-1913"]],"i":25},{"id":"wilmar","n":"Wilmar International","t":"land","lat":1.277,"lon":103.851,"pl":"Singapore","ad":"56 Neil Road, Singapore 088830","ro":"The largest palm oil trader; sits between smallholders, plantations and most of the world's packaged food.","who":"Kuok Khoon Hong, chairman and chief executive","rch":"global","mx":["disp","floor"],"fg":[["Market position","handles a very large share of globally traded palm oil"],["Labour findings","Amnesty International (2016) documented forced and child labour on plantations supplying Wilmar; later investigations found continuing abuses"],["Land conflict","hundreds of unresolved land disputes between Indonesian communities and plantation concessions"],["Smallholders","around 40% of Indonesian palm oil comes from smallholders who are price takers"]],"rd":"Palm oil is in roughly half the packaged products in a supermarket, and most of it passes through a handful of traders. Amnesty International's 2016 investigation of plantations supplying Wilmar found workers paid below the legal minimum once impossible quotas were applied, women hired as casual day labour for decades without benefits, and children carrying sacks. Wilmar adopted a no-deforestation, no-peat, no-exploitation policy in 2013, which changed its public commitments more than its supply base.\nUnderneath sits land: Indonesian communities whose customary claims were converted into concessions, and smallholders selling into a market with few buyers.","mn":"Any commodity that passes through only a few hands on its way to you has its price set there, not on the farm and not at the till.","pt":["p5","p9","p13"],"sr":[["Amnesty International, 'The Great Palm Oil Scandal' (2016)","https://www.amnesty.org/en/documents/asa21/5184/2016/en/"],["Chain Reaction Research / Rainforest Action Network monitoring of palm oil supply chains","https://chainreactionresearch.com/"]],"i":26},{"id":"bis","n":"Bank for International Settlements","t":"debt","lat":47.5478,"lon":7.5898,"pl":"Basel, Switzerland","ad":"Centralbahnplatz 2, 4051 Basel","ro":"The central bank of central banks; writes the capital rules that govern who gets credit.","who":"Pablo Hernández de Cos, general manager","rch":"global","mx":["cred","cond"],"fg":[["Basel accords","Basel I (1988) through Basel III and its 2023–30 endgame revisions"],["Immunity","the BIS premises and archives enjoy immunity from Swiss jurisdiction under a headquarters agreement"]],"rd":"The Basel rules decide how much capital a bank must hold against each kind of loan, which in practice decides which loans get made. Mortgages and government bonds are treated as safe and are cheap to hold; small business loans and lending to poorer countries are treated as risky and are expensive. The result is a banking system structurally tilted towards lending against existing assets rather than financing new production — which pushes up the price of houses and land while small firms queue.\nThe rules are made by central bankers and supervisors in closed committee, with no legislature voting on them.","mn":"Technical capital rules written in Basel are a large part of why it is easy to borrow to buy a house and hard to borrow to start a business.","pt":["p6","p4"],"sr":[["Basel Committee on Banking Supervision, Basel III framework","https://www.bis.org/bcbs/basel3.htm"],["BIS headquarters agreement with Switzerland","https://www.bis.org/about/legal.htm"]],"i":27},{"id":"cic","n":"Crédit Industriel et Commercial (CIC)","t":"debt","lat":48.873,"lon":2.333,"pl":"Paris, France","ad":"6 avenue de Provence, 75009 Paris","ro":"The French bank that took over Haiti's national bank and lent it the money to pay France for its own independence.","who":"Now part of the Crédit Mutuel group.","rch":"regional","mx":["cred","cond"],"fg":[["Indemnity demanded by France, 1825","150 million francs, later reduced to 90 million"],["Actually paid by Haiti","about 112 million francs, roughly $560 million in 2022 terms"],["Haiti's first national bank, set up by CIC","1880"],["Final payment of the associated debt","1947"]],"rd":"France recognised Haitian independence in 1825 on condition that Haiti compensate the former slaveholders, with fourteen warships off the coast to make the point. To pay, Haiti borrowed, and the loans outlasted the indemnity. From 1880 CIC ran Haiti's national bank, taking a cut of the country's revenue; the New York Times calculated Haitian payments at about 112 million francs, and estimated the loss to Haitian growth at between $21 billion and $115 billion. The last of the associated interest was paid in 1947, to a bank in New York.","mn":"The first country to abolish slavery by revolution spent 122 years paying the people who had owned the slaves, and then paying the banks that lent it the money to do so. Every year of that is a year of schools and roads not built.","pt":["p9","p4"],"sr":[["New York Times: Haiti's double debt, historical payment dataset","https://github.com/nytimes/haiti-debt"],["UN News: how Haiti paid for its freedom, twice over","https://news.un.org/en/story/2025/04/1162406"]],"i":28},{"id":"elliott","n":"Elliott Investment Management","t":"debt","lat":26.712,"lon":-80.053,"pl":"West Palm Beach, Florida, United States","ad":"360 South Rosemary Avenue, West Palm Beach, FL 33401","ro":"The hedge fund that proved a country in default can be made to pay a single creditor in full.","who":"Paul Singer, founder and co-chief executive","rch":"global","mx":["cred"],"fg":[["Profit on Argentine bonds","about $2.4 billion"],["Return on original stake","roughly 10–15 times"],["Total paid to holdout funds","$4.65 billion (2016 settlement)"]],"rd":"Argentina defaulted in 2001 on $132 billion. Output fell by more than a quarter, over half the country was in poverty, and 93% of bondholders eventually accepted a restructuring at about a third of face value. Elliott's fund NML Capital had bought the debt cheaply and refused, then spent fifteen years in the US courts. In 2012 Judge Thomas Griesa ruled Argentina had to pay the holdouts in full; at one point Elliott persuaded a court in Ghana to impound an Argentine naval training ship. The 2016 settlement paid the holdout funds $4.65 billion, of which Elliott's share was a profit of roughly $2.4 billion.\nThe case did not only move money. It established that a restructuring agreed by almost every creditor can be defeated by one, which raises the price of every future rescue.","mn":"A country that needs to write down its debts to pay for hospitals now has to buy off whoever refuses, and that money comes out of the same budget.","pt":["p4"],"sr":[["Guzman & Stiglitz, 'How Hedge Funds Held Argentina for Ransom' (NYT)","https://cgt.columbia.edu/news/stiglitz-hedge-funds-held-argentina-ransom"],["Argentina pays Paul Singer's 'vulture fund' $2.4 billion (Democracy Now)","https://www.democracynow.org/2016/3/4/headlines/argentina_pays_paul_singer_s_vulture_fund_24_billion"]],"i":29},{"id":"eucommission","n":"European Commission","t":"debt","lat":50.843,"lon":4.38,"pl":"Brussels, Belgium","ad":"Berlaymont, Rue de la Loi 200, 1049 Brussels","ro":"Runs the farm subsidies that pay most to the largest landowners, and co-authored the austerity programmes.","who":"College of Commissioners; DG AGRI administers the Common Agricultural Policy","rch":"regional","mx":["cond","priv"],"fg":[["CAP budget","roughly €55–60 billion a year, about a third of the EU budget"],["Distribution","around 80% of direct payments go to about 20% of recipients, because payments are made per hectare"],["Recipients","investigations have found payments flowing to oligarch-linked holdings in Hungary, the Czech Republic and Slovakia"],["Troika","the Commission sat with the ECB and IMF in the Greek, Irish, Portuguese and Cypriot programmes"]],"rd":"The Common Agricultural Policy pays per hectare, so the more land you already own, the more public money you receive. Roughly four-fifths of direct payments go to a fifth of recipients. A New York Times investigation traced payments to holdings connected to the Hungarian prime minister's circle and to the Czech prime minister's own conglomerate. It is the largest single transfer programme in the European Union and it is regressive by construction.\nThe Commission was also one third of the Troika, co-signing the programmes that cut Greek pensions and Portuguese public wages while bondholders were paid.","mn":"A subsidy paid per acre is a subsidy paid in proportion to how much land you already have, which makes it a machine for widening the gap it claims to close.","pt":["p12","p11"],"sr":[["New York Times, 'The Money Farmers: How Oligarchs and Populists Milk the E.U. for Millions' (2019)","https://www.nytimes.com/2019/11/03/world/europe/eu-farm-subsidy-hungary.html"],["European Court of Auditors reports on CAP distribution","https://www.eca.europa.eu/en/publications"]],"i":30},{"id":"usdoe","n":"Federal student loans — US Department of Education","t":"debt","lat":38.8866,"lon":-77.0167,"pl":"Washington, DC, United States","ad":"US Department of Education, 400 Maryland Avenue SW, Washington, DC 20202","ro":"The largest consumer lender in the United States, holding a debt that bankruptcy will not discharge.","who":"The Office of Federal Student Aid; in March 2026 the administration announced the portfolio would move to the Treasury.","rch":"national","mx":["cred","excl"],"fg":[["Outstanding federal student loans, September 2025","over $1.6 trillion"],["Borrowers","about 43 million"],["Borrowers in default, March 2026","9.2 million, with 2.4 million in late-stage delinquency"],["Discharge in bankruptcy","only on a showing of undue hardship"]],"rd":"A student loan is the one large consumer debt that ordinary bankruptcy does not clear: since the 1970s, and more firmly since 2005, discharge requires proving undue hardship to a court. The government can also collect by taking wages, tax refunds and part of a Social Security payment without going to court. The result is a debt that follows a person for decades, and which parents increasingly carry on behalf of their children through Parent PLUS loans.","mn":"A debt that cannot be discharged is a claim on a person's whole working life. Because it is taken on at eighteen to buy the credential that employers require, the people who most need to borrow are the ones who end up paying for the longest.","pt":["p4","p3"],"sr":[["GAO-26-107780: federal student loans and servicers (September 2025 figures)","https://files.gao.gov/assets/gao-26-107780.pdf"],["NPR: federal student loans will move to Treasury","https://www.npr.org/2026/03/19/nx-s1-5753906/student-loans-trump-treasury"]],"i":31},{"id":"promesa","n":"Financial Oversight and Management Board for Puerto Rico","t":"debt","lat":18.4253,"lon":-66.0661,"pl":"San Juan, Puerto Rico","ad":"World Plaza, 268 Avenida Muñoz Rivera, San Juan, PR 00918","ro":"An unelected board, appointed under a 2016 US statute, with authority over the budget of 3 million people who cannot vote for the Congress that created it.","who":"Seven members appointed under PROMESA; the board represents Puerto Rico in its own bankruptcy.","rch":"regional","mx":["cred","cond"],"fg":[["Debt at the time PROMESA was enacted","more than $70 billion"],["Unfunded pension liabilities","more than $50 billion"],["Liabilities after restructuring","about $37 billion"],["Pension cut and benefit freeze in the plan of adjustment","valued at $12.5 billion over 40 years, about 19.3%"]],"rd":"Puerto Rico could not restructure its debt under US bankruptcy law because, as a territory, it was excluded from Chapter 9. Congress's answer in 2016 was PROMESA, which created both a bankruptcy route and a board with power over the island's budget that overrides the elected government. The board cut liabilities from over $70 billion to about $37 billion. Bondholders were paid in the settlement; retirees took a cut and a freeze on benefits, which an analysis of the plan valued at 19.3% over forty years. Schools were closed and the university's budget reduced across the same period.","mn":"When a government's debts are restructured, the order in which claims are met is a political decision taken in advance. Here it was taken by people the affected population did not elect, and the pension of a retired teacher was treated as more adjustable than a bond.","pt":["p4","p11"],"sr":[["Financial Oversight and Management Board: Puerto Rico's debt restructuring","https://oversightboard.pr.gov/debt/"],["Center for Popular Democracy and ACRE: PROMESA has failed","https://populardemocracy.org/wp-content/uploads/2025/01/ENGLISH-PROMESA-Has-Failed-Report-CPD-ACRE-9-14-2021-FINAL.pdf"]],"i":32},{"id":"bercy","n":"French Ministry for the Economy and Finance","t":"debt","lat":48.84,"lon":2.376,"pl":"Paris, France","ad":"139 rue de Bercy, 75572 Paris Cedex 12","ro":"Collector of the Haitian indemnity, and for sixty years the guarantor of the CFA franc.","who":"Minister for the Economy and Finance; the Banque de France operated the CFA reserve accounts","rch":"global","mx":["cred","cond"],"fg":[["Haiti, 1825","France demanded 150 million francs for recognition of independence, later reduced to 90 million"],["Actually paid","about 112 million francs over seven decades — roughly $560 million in 2022 dollars; the NYT estimated $115 billion in lost growth"],["Final payment","1947, to National City Bank of New York (now Citibank)"],["CFA franc","until 2019–21 reforms, African member states deposited half their foreign reserves with the French Treasury"]],"rd":"In April 1825, with French warships off Port-au-Prince, Haiti agreed to pay 150 million francs — compensation to the slaveholders it had defeated — in exchange for being recognised as a country. The first instalment alone was about six times Haiti's annual revenue, so Haiti borrowed from French banks to pay French planters: the double debt. The New York Times' reconstruction of the payments found 112 million francs paid across seven decades, with the last related interest settled in 1947, and estimated the cost in forgone growth at around $115 billion.\nA related arrangement ran into living memory. Under the CFA franc, fourteen African countries kept half their foreign exchange reserves in an operations account at the French Treasury, and France held a veto on the central banks' boards. The reserve requirement was ended in 2019–21 for West Africa; France's guarantee and influence remain.","mn":"Some countries are poor because of a bill they were made to pay for being free, and the bill has a date, an amount and an address.","pt":["p9","p4"],"sr":[["The Ransom (New York Times series on Haiti's double debt), data repository","https://github.com/nytimes/haiti-debt"],["UN News, 'How Haiti paid for its freedom — twice over'","https://news.un.org/en/story/2025/04/1162406"]],"i":33},{"id":"ukhmt","n":"HM Treasury","t":"debt","lat":51.502,"lon":-0.127,"pl":"London, United Kingdom","ad":"1 Horse Guards Road, London SW1A 2HQ","ro":"Sovereign over the world's largest network of tax havens, and architect of a decade of austerity.","who":"Chancellor of the Exchequer","rch":"global","mx":["cond","hide"],"fg":[["UK network","Crown Dependencies and Overseas Territories account for about 23% of global corporate tax losses"],["Austerity 2010–19","IFS and ONS data show the deepest sustained real cuts to local government and benefits since the war"],["Non-dom regime","abolished from April 2025 after two centuries"]],"rd":"Britain holds two distinct positions in the architecture of inequality. Abroad, it is the constitutional parent of Jersey, Guernsey, the Isle of Man, Cayman, the BVI and Bermuda — jurisdictions whose combined effect the Tax Justice Network puts at roughly a quarter of global corporate tax losses, and which the UK could change by Order in Council and does not. At home, the austerity programme after 2010 cut local government funding by around 40% in real terms per person, with the largest cuts falling on the poorest councils.\nThe non-domiciled tax status, which let residents keep foreign income untaxed, lasted from 1799 to 2025.","mn":"The same government can run a serious anti-poverty strategy at home and host the system that drains the tax base of every other country, because the two live in different departments.","pt":["p10","p11"],"sr":[["Institute for Fiscal Studies on local government funding cuts","https://ifs.org.uk/publications/english-local-government-funding-trends-and-challenges-2019-and-beyond"],["Tax Justice Network (research on the UK's network of tax havens)","https://taxjustice.net/"]],"i":34},{"id":"icsid","n":"ICSID (investor–state arbitration)","t":"debt","lat":38.8982,"lon":-77.0412,"pl":"Washington, DC, United States","ad":"1818 H Street NW (MSN J2-200), Washington, DC 20433","ro":"The tribunal where a company sues a country for passing a law.","who":"International Centre for Settlement of Investment Disputes, hosted by the World Bank Group","rch":"global","mx":["cred","cap"],"fg":[["Cases registered","over 900 since 1966, the large majority since 2000"],["Largest award","$50 billion against Russia in the Yukos arbitrations (under a related treaty regime)"],["Who can sue","investors can sue states; states cannot sue investors"]],"rd":"Thousands of trade and investment treaties give foreign companies the right to bypass a country's courts and sue the government itself before a private tribunal of three arbitrators, claiming compensation for measures that reduce the value of their investment. Raising a minimum wage, cancelling a water concession, denying a mining permit after a community referendum, introducing plain-packaging rules — all have been litigated. Awards can run into billions and are enforceable against state assets abroad.\nThe deeper effect is the one that never reaches a hearing: governments drop or water down measures because of the risk of a claim. Lawyers call it regulatory chill.","mn":"A government can be made to pay a foreign company for the privilege of protecting its own citizens, and so it often decides not to protect them.","pt":["p3","p8"],"sr":[["ICSID caseload statistics","https://icsid.worldbank.org/resources/publications/icsid-caseload-statistics"],["UNCTAD Investment Dispute Settlement Navigator","https://investmentpolicy.unctad.org/investment-dispute-settlement"]],"i":35},{"id":"imf","n":"International Monetary Fund","t":"debt","lat":38.8988,"lon":-77.0435,"pl":"Washington, DC, United States","ad":"700 19th Street NW, Washington, DC 20431","ro":"Lender of last resort to governments, and the author of the conditions attached.","who":"Kristalina Georgieva, managing director; the United States holds the only single-country veto over major decisions","rch":"global","mx":["cond","cred"],"fg":[["Oxfam analysis (2026)","of 28 countries with ongoing IMF programmes, 24 were required to implement austerity"],["Depth of cuts","median required consolidation of 1.7% of GDP for 2018–2025 loans, against 0.3% for 2012–2017"],["ActionAid (2023)","in 10 African countries studied, 8 had recently been told to cut or freeze public sector wage bills"],["Voting","the US holds about 16.5% of votes; an 85% supermajority is required for major changes"]],"rd":"When a country runs out of foreign currency, the IMF is usually the only lender left, and it attaches conditions. Those conditions are where inequality is manufactured at scale: caps on the public-sector wage bill, which means fewer nurses and teachers; subsidy removal, which raises the price of fuel and bread for people who have no alternative; VAT increases, which take a larger share of a poor household's spending than a rich one's; and privatisation of state enterprises. ActionAid found that in ten African countries, eight had been told to cut or freeze the public wage bill, and that wage-bi
