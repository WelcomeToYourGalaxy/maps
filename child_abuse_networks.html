<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Child Abuse Networks Worldwide</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Uncial+Antiqua&display=swap">
<style>

:root{--bg:#06071a;--card:rgba(8,9,24,.94);--line:#24264a;--line2:rgba(255,255,255,.07);--ink:#e8e6e1;--mute:#a3a1b4;--accent:#5600DC;--accent-hi:#a99cff}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 'Marcellus','Georgia',serif;overflow:hidden}
#map{position:absolute;inset:0;background:#03040a}
.card{position:absolute;z-index:800;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
.scroll{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
#key{top:12px;left:12px;width:344px;max-height:calc(100% - 46px);overflow:auto;padding:14px 16px;box-sizing:border-box}
#key h1{font:800 22px/1.2 'Uncial Antiqua','Marcellus','Georgia',serif;margin:0 0 4px;letter-spacing:.5px;color:#f0ece4;text-shadow:0 2px 12px rgba(0,0,0,.5)}
#key .lede{color:var(--mute);margin:0 0 10px;font-size:12.8px}
#key.min .body,#key.min .lede{display:none}
.psec{margin:14px 0 3px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent-hi)}
.tog{display:inline-block;float:right;cursor:pointer;font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:1px 8px}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
select,button.btn{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 8px;font:inherit;font-size:12.5px;cursor:pointer}
select option,select optgroup{background:#14161c;color:var(--ink)}
button.btn.on{border-color:var(--accent-hi);background:var(--accent);color:#fff}
button.btn:hover,#infoBtn:hover,#worldBtn:hover{border-color:var(--accent-hi);color:#fff}
#layer{width:100%;font-size:13px;padding:5px 6px;margin:2px 0 4px}
.ldesc{font-size:12.3px;color:#d6d3df;margin:4px 0 6px}
.lsrc{font-size:11.2px;color:var(--mute)}
.ramp{display:flex;margin-top:8px;border-radius:2px;overflow:hidden;height:9px}
.ramp span{flex:1}
.rampl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:2px}
.lg{display:flex;align-items:center;gap:8px;font-size:12.6px;padding:3px 0;border-top:1px solid var(--line2)}
.lg .n{margin-left:auto;color:var(--mute);font-size:11.5px}
.sw{display:inline-block;width:12px;height:10px;border-radius:2px;flex:none}
.sw.ln{height:2px;width:16px;border-radius:0}
.sw.dash{height:0;width:16px;border-top:2px dashed;background:none!important;border-radius:0}
.tline{display:flex;align-items:center;gap:8px;margin:8px 0 2px}
.tline input[type=range]{flex:1}
.tline b{font-weight:400;min-width:44px;text-align:right;font-size:15px;color:#f0ece4}
.chk{display:flex;gap:7px;align-items:center;font-size:12.8px;cursor:pointer;margin:3px 0}
.lrow{display:flex;align-items:center;gap:6px}
.lrow .chk{flex:1}
.ib{flex:none;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--accent-hi);font:italic 11px/15px Georgia,serif;text-align:center;cursor:pointer;padding:0}
.ib:hover,.ib.on{border-color:var(--accent-hi);color:#fff}
.ipop{display:none;font-size:12px;color:#d6d3df;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:4px;padding:6px 8px;margin:2px 0 6px}
.ipop.open{display:block}
.mean{font-size:11.6px;color:#d6d3df;margin:6px 0 0;line-height:1.4}
.comp{font-size:11.3px;color:var(--mute);margin:3px 0 0}
#cnt{font-size:11.5px;color:var(--mute);margin-top:6px}
#find{width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 7px;font:inherit;font-size:12.5px;margin:2px 0 4px}
#plist{max-height:260px;overflow:auto}
.pi{display:flex;gap:8px;align-items:center;padding:3px 2px;border-top:1px solid var(--line2);font-size:12.8px;cursor:pointer}
.pi:hover{background:rgba(255,255,255,.04)}
.pi.sel{background:rgba(255,255,255,.08)}
.pi .v{margin-left:auto;color:var(--mute);font-size:11.5px;white-space:nowrap}

#rcol{position:absolute;z-index:800;top:12px;right:12px;bottom:34px;width:350px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#rcol>*{pointer-events:auto;position:relative;box-sizing:border-box}
#infoBtn{align-self:flex-end;padding:7px 14px;cursor:pointer;letter-spacing:.2px}
#tr{padding:12px 14px;flex:none}
#tr.min .body{display:none}
#tr.min{align-self:flex-end;padding:6px 10px}
.bases{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12.8px;margin:4px 0 2px}
.bases label{cursor:pointer;white-space:nowrap}
.seg{display:flex;gap:6px;margin:4px 0 2px;flex-wrap:wrap}
#dock{padding:10px 14px 12px;flex:none}
#dockBtns{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.tab{text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--mute);font:inherit;font-size:12.3px;padding:3px 8px;border-radius:4px;cursor:pointer;line-height:1.25}
.tab:hover{color:var(--ink)}
.tab.on{color:#f0ece4;border-color:var(--accent-hi);background:rgba(255,255,255,.08)}
#det{display:none;position:fixed;z-index:950;left:50%;top:calc(50% + 70px);transform:translate(-50%,-50%);width:min(440px,calc(100vw - 24px));max-height:min(58vh,620px);overflow:auto;padding:13px 15px;box-sizing:border-box;background:rgba(8,9,24,.97)}
#det.open{display:block}
#detX{position:absolute;top:6px;right:8px;background:none;border:0;color:#bbb;font-size:20px;cursor:pointer;line-height:1}
#detX:hover{color:#fff}

.hp h3{margin:2px 0 4px;font-size:17px;font-weight:700;color:#f0ece4;border-bottom:1px solid var(--line);padding:0 18px 6px 0;line-height:1.3}
.hp-k{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);padding-right:20px}
.hp-sub{color:var(--mute);font-size:12px;margin:0 0 6px}
.hp-h{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);margin:14px 0 4px}
.hp p{margin:4px 0;font-size:12.8px}
.hp .big{font-size:20px;color:#f0ece4}
.hp .note{font-size:11.6px;color:var(--mute)}
.bars{display:grid;grid-template-columns:150px 1fr 34px;gap:3px 8px;align-items:center;font-size:12px;margin:4px 0}
.bars .b{height:7px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.bars .b i{display:block;height:100%;background:var(--accent-hi);border-radius:2px}
.bars span:nth-child(3n){text-align:right;color:var(--mute)}
.hp details{margin:6px 0;border:1px solid var(--line2);border-radius:3px;padding:4px 7px}
.hp summary{cursor:pointer;font-size:12.3px}
.hp table.kv{border-collapse:collapse;font-size:12.2px;width:100%}
.hp table.kv th{text-align:left;color:var(--mute);font-weight:400;vertical-align:top;padding:2px 10px 2px 0}
.hp table.kv td{padding:2px 0;vertical-align:top;text-align:right;white-space:nowrap}
.hp ul{margin:4px 0;padding-left:16px;font-size:12.3px}
.hp li{margin:3px 0}
.spk svg{display:block;width:100%;height:52px}
.hp-src{color:var(--mute);font-size:11.2px;margin-top:12px;border-top:1px solid var(--line2);padding-top:6px}
.hp-src a{word-break:break-word}

.win{position:fixed;z-index:900;display:flex;flex-direction:column;resize:both;overflow:hidden;min-width:300px;min-height:200px;background:rgba(8,9,22,.97);box-shadow:0 18px 50px rgba(0,0,0,.65)}
.wh{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 13px;border-bottom:1px solid var(--line2);cursor:move;user-select:none;flex:none;touch-action:none}
.wt{font:400 14px/1.2 'Uncial Antiqua','Marcellus','Georgia',serif;color:#f0ece4;letter-spacing:.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wx,.wm{background:none;border:0;color:#bbb;font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.wx:hover,.wm:hover{color:#fff}
.wb{flex:1;min-height:0;position:relative;overflow:auto}
.wfoot{flex:none;font-size:10.8px;color:var(--mute);padding:4px 14px 7px;border-top:1px solid var(--line2)}
table.all{border-collapse:collapse;font-size:11.8px;width:100%}
table.all th{position:sticky;top:0;background:#0b0c1e;color:var(--mute);font-weight:400;text-align:right;padding:5px 6px;border-bottom:1px solid var(--line);cursor:pointer;line-height:1.2;vertical-align:bottom}
table.all th:first-child,table.all td:first-child{text-align:left}
table.all th:hover,table.all th.on{color:#fff}
table.all td{padding:3px 6px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
table.all tr.r{cursor:pointer}
table.all tr.r:hover td{background:rgba(255,255,255,.04)}
table.all tr.sel td{background:rgba(255,255,255,.09)}
.mult{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px 26px;padding:12px 16px}
.mult h4{margin:0 0 2px;font-weight:400;font-size:12.5px;color:#f0ece4}
.mult .u{font-size:11px;color:var(--mute);margin-bottom:5px}
.hb{display:grid;grid-template-columns:88px 1fr 52px;gap:3px 8px;align-items:center;font-size:11.8px}
.hb .b{height:9px;position:relative}
.hb .b i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.hb span:nth-child(3n){text-align:right;color:var(--mute)}
.hb .row{display:contents;cursor:default}
.lc{position:absolute;inset:0}
.lc svg{display:block;width:100%;height:100%}
.lc text{font-family:'Marcellus','Georgia',serif;fill:var(--mute);font-size:10.5px}
.lc .gl{stroke:rgba(255,255,255,.07)}
#ttip{position:fixed;z-index:5000;pointer-events:none;background:rgba(12,13,20,.97);border:1px solid var(--line);border-radius:3px;padding:4px 8px;font-size:12.5px;display:none;max-width:320px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#ttip .m{color:var(--mute);font-size:11.5px}

#worldBtn{position:absolute;z-index:800;right:52px;bottom:34px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 11px;font:13px 'Marcellus','Georgia',serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#info{inset:0;z-index:1001;border-radius:0;border:0;display:none;overflow:auto;padding:60px max(28px,calc((100% - 1000px)/2)) 40px;background:rgba(5,6,16,.975)}
#info.open{display:block}
#infoClose{position:fixed;top:12px;right:12px;z-index:1002;display:none}
#info.open+#infoClose{display:block}
#info h2{font:400 17px/1.3 'Uncial Antiqua','Marcellus','Georgia',serif;margin:26px 0 8px;color:#f0ece4;letter-spacing:.3px}
#info h2:first-child{margin-top:0}
#info p,#info li{font-size:14px}
#info ul{padding-left:20px;margin:4px 0}
#info li{margin:4px 0}
.mute{color:var(--mute)}
a{color:var(--accent-hi)}
.maplibregl-map{font-family:'Marcellus','Georgia',serif}
.maplibregl-ctrl-attrib{background:rgba(6,7,16,.8)!important;color:#8f8d9e;font-family:'Marcellus','Georgia',serif}
.maplibregl-ctrl-attrib a{color:#b0aec0!important}
.maplibregl-ctrl-attrib-button{filter:invert(1)}
.maplibregl-ctrl-group{background:var(--card)!important;border:1px solid var(--line);box-shadow:none!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}
.maplibregl-ctrl-bottom-right{bottom:24px}
@media (max-width:820px){
  #key{width:auto;right:12px;max-height:42%}
  #rcol{top:auto;bottom:34px;left:12px;right:12px;width:auto;max-height:50%}
  #infoBtn{align-self:flex-start}
  #worldBtn{top:108px;bottom:auto;right:12px}
  #info{padding:56px 16px 80px}
}

.yrs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.8px}
.yrs input{width:64px;background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font:inherit;font-size:12.5px}
.seg .era{font-size:11.5px;padding:2px 7px}
.sw.pt{width:9px;height:9px;border-radius:50%}
#setList .lg input{margin:0}
.hp .flag{border-left:2px solid var(--accent-hi);padding:3px 0 3px 8px;background:rgba(255,255,255,.035);font-size:12.3px}
.hp details.cs{padding:3px 7px}
.hp details.cs summary{font-size:12.4px;line-height:1.35}
.hp details.cs[open]{background:rgba(255,255,255,.025)}
.hp .bts{border-top:1px solid var(--line2);padding:5px 0 3px}
.hp .bts p{font-size:12.1px;color:#d6d3df;margin:3px 0 0}
details.pd{margin:6px 0;border:1px solid var(--line2);border-radius:3px;padding:4px 7px}
details.pd summary{cursor:pointer;font-size:12.3px;color:#d6d3df}
.means{border-left:2px solid var(--accent-hi);padding:2px 0 2px 10px;margin:4px 0 6px}
.means p{font-size:12.6px;color:#ebe8f0;margin:0 0 7px;line-height:1.5}
.wctl{padding:8px 14px 0}
.wctl select{max-width:100%}
.dsvg text{font-family:'Marcellus','Georgia',serif;fill:var(--mute);font-size:10.5px}
.dsvg .gl{stroke:rgba(255,255,255,.07)}
.dsvg .dr:hover text{fill:#fff}

</style>
</head>
<body>
<div id="map"></div>

<div id="key" class="card scroll">
  <button id="toggleKey" class="tog" type="button" title="Pull the key up or down">−</button>
  <h1>Child abuse networks worldwide</h1>
  <p class="lede">Where children have been abused, sold and trafficked by organised groups and inside institutions, who shielded the people responsible, and the patterns that repeat across countries and decades.</p>
  <div class="body" id="keyBody"></div>
</div>

<div id="rcol">
  <div id="infoBtn" class="card" role="button" tabindex="0">About and sources</div>
  <div id="tr" class="card"><button id="toggleTr" class="tog" type="button" title="Pull the basemap box up or down">−</button><div class="body" id="trBody"></div></div>
  <div id="dock" class="card"><div class="psec" style="margin-top:0">Charts</div><div id="dockBtns"></div></div>
</div>
<div id="det" class="card scroll hp" role="dialog" aria-label="Details"><button id="detX" type="button" title="Close">×</button><div id="detBody"></div></div>

<button id="worldBtn" type="button" title="Zoom back out to the whole world">Whole world</button>
<div id="info" class="card scroll"></div>
<button id="infoClose" class="btn" type="button">Close</button>
<div id="ttip"></div>

:9,"ht21":8.5,"sea":8,"res":1.92,"vws":1.5,"tip":"SC","prev":6.0,"gsin":180000,"ncm":149727,"ncmpc":368.9}},"ZAF":{"n":"South Africa","pt":[23.666,-29.709],"ind":{"ht25":4.5,"ht23":4.5,"ht21":4.5,"sea":8,"res":5.67,"vws":4,"tip":"2W","prev":2.7,"gsin":158000,"ncm":111729,"ncmpc":174.6}},"ZMB":{"n":"Zambia","pt":[26.395,-14.661],"ind":{"ht25":5,"ht23":5,"ht21":5,"sea":6.5,"res":4.67,"vws":3,"tip":"2","prev":5.1,"gsin":94000,"ncm":7318,"ncmpc":34.3}},"ZWE":{"n":"Zimbabwe","pt":[29.925,-18.912],"ind":{"ht25":5.5,"ht23":5.5,"ht21":5.5,"sea":8,"res":3.04,"vws":2,"tip":"2W","prev":5.0,"gsin":74000,"ncm":5923,"ncmpc":35.6}}},"C":[{"id":"gbr-north-wales-waterhouse","n":"North Wales children's homes — Waterhouse Inquiry 'Lost in Care'","iso":"GBR","also":[],"place":"Clwyd and Gwynedd, North Wales (Bryn Estyn, Wrexham, among others)","ll":[-2.9631,53.039],"llc":false,"y0":1974,"y1":1990,"yf":2000,"fr":null,"set":"care","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":null,"who":"Clwyd and Gwynedd county councils' children's homes, incl. Bryn Estyn; North Wales Police criticised","offc":true,"cover":"The earlier Jillings report (commissioned 1994, completed 1996) was shelved and only released in redacted form in 2012 after a BBC Freedom of Information request. North Wales Police investigated allegations against its own officers rather than having them independently investigated.","d":"Sir Ronald Waterhouse's tribunal took evidence from about 650 people who had been in care and published 'Lost in Care' in February 2000, finding widespread abuse over about 20 years in children's homes in North Wales. Allegations were reported across almost 40 homes, with the report concentrating on seven. Seven former care workers were convicted after a 1991 police inquiry, five of them from Bryn Estyn. The report found responses were 'too little and too late' and that children's interests were sacrificed to protect professional positions; officers of North Wales Police were among those accused.","cite":"Waterhouse Tribunal, 'Lost in Care', February 2000, as summarised by CRIN","url":"https://archive.crin.org/en/library/news-archive/united-kingdom-report-finds-extensive-abuse-childrens-care-homes-wales.html","url2":"https://childrenshomes.org.uk/NorthWales/","net":null},{"id":"gbr-kincora","n":"Kincora Boys' Home, Belfast — Hart Inquiry findings","iso":"GBR","also":[],"place":"Kincora Boys' Home, east Belfast, Northern Ireland","ll":[-5.86,54.6],"llc":false,"y0":null,"y1":null,"yf":2017,"fr":null,"set":"care","kind":"sexual abuse","st":"inquiry","v":38,"vn":"","off":3,"who":"Kincora Boys' Home (Belfast Welfare Authority / Eastern Health and Social Services Board); RUC investigations; MI5","offc":true,"cover":"Hart found MI5 'consistently obstructed a proper line of inquiry' during the 1980s RUC Caskey Phase Three investigation, and found numerous missed opportunities to detect and stop the abuse.","d":"The Historical Institutional Abuse Inquiry chaired by Sir Anthony Hart reported on 20 January 2017. It confirmed that 38 boys at Kincora were sexually abused; three staff members, Joseph Mains, Raymond Semple and William McGrath, were convicted. Hart found that Kincora was not a homosexual brothel, that no security agency used it to entrap or blackmail men, and that there was 'no credible evidence' that prominent people such as civil servants, businessmen or Sir Maurice Oldfield were involved; he called the honey-trap claims 'unfounded myths'. He did criticise MI5 for obstructing the 1980s police investigation. Some former residents rejected the conclusions.","cite":"Historical Institutional Abuse Inquiry (Hart Report), 20 January 2017, as reported by The Irish Times","url":"https://www.irishtimes.com/news/crime-and-law/kincora-was-not-a-homosexual-brothel-abuse-inquiry-finds-1.2945364","url2":"","net":null},{"id":"gbr-ni-hia-overall","n":"Northern Ireland Historical Institutional Abuse Inquiry (22 institutions, 1922–1995)","iso":"GBR","also":[],"place":"Northern Ireland","ll":[-6.4923,54.7877],"llc":true,"y0":1922,"y1":1995,"yf":2017,"fr":null,"set":"care","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":null,"who":"22 children's homes and institutions run by the state, voluntary bodies and religious orders in Northern Ireland","offc":false,"cover":"","d":"The Hart Inquiry's 10-volume, roughly 2,300-page report, published 20 January 2017, examined abuse in 22 residential institutions in Northern Ireland between 1922 and 1995, reviewing hundreds of government and intelligence files. It found systemic failings and abuse including sexual abuse across state, voluntary and church-run homes and recommended redress and a public apology.","cite":"Historical Institutional Abuse Inquiry report, 20 January 2017, as reported by The Irish Times","url":"https://www.irishtimes.com/news/crime-and-law/kincora-was-not-a-homosexual-brothel-abuse-inquiry-finds-1.2945364","url2":"","net":null},{"id":"jey-care-inquiry","n":"Jersey care system and Haut de la Garenne — Independent Jersey Care Inquiry","iso":"JEY","also":[],"place":"Haut de la Garenne, St Martin, Jersey","ll":[-2.0335,49.2011],"llc":false,"y0":1945,"y1":null,"yf":2017,"fr":null,"set":"care","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":null,"who":"States of Jersey children's services; Haut de la Garenne children's home","offc":true,"cover":"The inquiry found the authorities failed to build a culture of transparency, feeding perceptions of collusion and cover-up, and a 'small island culture' that was not countered.","d":"The Independent Jersey Care Inquiry reported in July 2017 after hearing from about 450 people connected with Jersey's care system since 1945. It found the States of Jersey had been 'an ineffectual and neglectful substitute parent', that its child-welfare law was decades behind, and that some children in care might still be at risk. Haut de la Garenne, centre of the 2007–2010 police investigation Operation Rectangle, was described as a symbol of the turmoil and the inquiry recommended its buildings be demolished. Chief Minister Ian Gorst apologised: 'We failed children who needed our care.'","cite":"Independent Jersey Care Inquiry report, July 2017, as reported by LocalGov","url":"https://www.localgov.co.uk/Jersey-child-abuse-inquiry-says-children-still-at-risk/43353","url2":"https://www.gov.je/News/2017/Pages/ChiefMinisterAssemblyCare.aspx","net":null},{"id":"gbr-lambeth-iicsa","n":"Lambeth Council children's homes (Shirley Oaks, South Vale, Angell Road) — IICSA","iso":"GBR","also":[],"place":"Lambeth, London (Shirley Oaks home located near Croydon)","ll":[-0.1149,51.4613],"llc":false,"y0":1960,"y1":1990,"yf":2021,"fr":null,"set":"care","kind":"sexual abuse","st":"inquiry","v":705,"vn":"705 former residents had made sexual abuse complaints to the council by June 2020; the inquiry said the true scale is likely much higher. At Shirley Oaks alone, allegations against 177 staff or associated people involving at least 529 former residents.","off":null,"who":"London Borough of Lambeth; Shirley Oaks, South Vale and Angell Road children's homes","offc":true,"cover":"Over 40 years only one senior employee was disciplined. The council did not tell a coroner that a boy found dead at Shirley Oaks in 1977 had alleged sexual abuse by his 'house father' Donald Hosegood; the inquiry asked the Metropolitan Police to consider a criminal investigation into this.","d":"The Independent Inquiry into Child Sexual Abuse reported on 27 July 2021 that children in Lambeth's care were subjected to decades of cruelty and sexual abuse from the 1960s. By June 2020 the council had complaints from 705 former residents; at Shirley Oaks, allegations were made against 177 staff or associated people involving at least 529 former residents. At Angell Road, children including some under five were systematically exposed to sexual abuse. The inquiry found racism, nepotism, corruption and mismanagement in the council, and that most children at Shirley Oaks (1980) and South Vale (1990–91) were Black.","cite":"IICSA, Children in the care of Lambeth Council investigation report, 27 July 2021","url":"https://www.iicsa.org.uk/news/children-care-lambeth-council-subjected-decades-cruelty-and-sexual-abuse-inquiry-report-finds","url2":"https://assets.publishing.service.gov.uk/media/616d627fd3bf7f5604d83c8c/Lambeth-care-IICSA-investigation.pdf","net":null},{"id":"gbr-nottinghamshire-iicsa","n":"Nottinghamshire and Nottingham councils (incl. Beechwood) — IICSA","iso":"GBR","also":[],"place":"Nottingham and Nottinghamshire (Beechwood Children's Home, Mapperley)","ll":[-1.11,52.98],"llc":false,"y0":1960,"y1":2019,"yf":2019,"fr":null,"set":"care","kind":"sexual abuse","st":"inquiry","v":350,"vn":"About 350 people reported sexual abuse in the councils' care; the inquiry said the true number is likely much higher.","off":26,"who":"Nottinghamshire County Council and Nottingham City Council residential and foster care; Beechwood Children's Home","offc":true,"cover":"Only two disciplinary actions, both inadequate, followed the many allegations at Beechwood; known perpetrators were allowed to continue fostering and abused again.","d":"IICSA reported on 31 July 2019 that sexual abuse was widespread in the two councils' residential and foster care in the 1970s–1990s. About 350 people reported abuse. From the late 1970s to 2019, 16 residential staff and 10 foster carers were convicted of sexually abusing children in their care, plus 12 convictions for harmful sexual behaviour by children against other children. The inquiry concluded that 'neither of the Councils learned from their mistakes'.","cite":"IICSA, Children in the care of the Nottinghamshire Councils investigation report, 31 July 2019","url":"https://www.iicsa.org.uk/news/inquiry-publishes-report-nottinghamshire-councils","url2":"","net":null},{"id":"gbr-medomsley","n":"Medomsley Detention Centre, County Durham — Neville Husband and staff","iso":"GBR","also":[],"place":"Medomsley, near Consett, County Durham","ll":[-1.809,54.882],"llc":false,"y0":1961,"y1":1988,"yf":2025,"fr":2003,"set":"care","kind":"sexual abuse","st":"convicted","v":1848,"vn":"Durham Constabulary's Operation Seabrook recorded 1,848 men reporting physical or sexual abuse; later reports say over 2,000 came forward.","off":8,"who":"Medomsley Detention Centre for young offenders (Home Office Prison Service)","offc":true,"cover":"The Prisons and Probation Ombudsman (November 2025) found that knowledge of the abuse held by the Prison Service, police and Home Office was 'ignored and dismissed', families' complaints led to no action, and successive wardens were 'either complicit or incompetent'.","d":"Medomsley held young male offenders from 1961 to 1988. Neville Husband, an officer who ran the kitchens, was convicted of sexual offences in 2003 and again in 2005 and died in 2010; the Ombudsman called him 'possibly the most prolific sex offender in British history'. Operation Seabrook (from 2013) identified 32 living suspects; five former officers were convicted in 2019 and another in 2023, eight former staff jailed in total. The Ombudsman's report of 12 November 2025, based on 8,000 documents and 74 witnesses, found the authorities failed in their duty to keep detainees safe.","cite":"Prisons and Probation Ombudsman, Operation Deerness report on Medomsley, 12 November 2025; ITV News, 28 Feb 2024; LBC","url":"https://www.jordanssolicitors.co.uk/insights/abuse-and-redress-schemes/ppo-report-former-detainees-of-medomsley-were-subject-to-systemic-failings-by-authorities","url2":"https://itv.com/news/tyne-tees/2024-02-28/what-happened-at-medomsley-detention-centre","net":null},{"id":"gbr-islington","n":"Islington Council children's homes, London","iso":"GBR","also":[],"place":"Islington, London","ll":[-0.103,51.538],"llc":false,"y0":1960,"y1":1999,"yf":2018,"fr":1992,"set":"care","kind":"sexual abuse + sexual exploitation","st":"acknowledged","v":null,"vn":"","off":null,"who":"London Borough of Islington children's homes and foster placements (42 homes)","offc":true,"cover":"A 2018 report by Sarah Morgan QC found that councillor Sandy Marks knew of abuse allegations before the Evening Standard published them in 1992; the council leadership publicly denied the newspaper's reports at the time.","d":"Survivors say children in Islington's 42 children's homes and in foster care were abused between the 1960s and 1990s; the Evening Standard exposed abuse in the homes in 1992. A 2018 independent report by Sarah Morgan QC into former councillor Sandy Marks found evidence linking her to the 'Fallen Angels' group (which she denies) but no evidence it affected her council duties or that she learned of organised abuse. Islington later set up a support payment scheme for survivors.","cite":"Leigh Day on Sarah Morgan QC report for Islington Council, 7 November 2018","url":"https://www.leighday.co.uk/news/news/2018-news/islington-council-publishes-sandy-marks-report/","url2":"https://www.islingtoncitizen.co.uk/?p=2353","net":null},{"id":"gbr-kendall-house","n":"Kendall House girls' home, Gravesend — Proctor review","iso":"GBR","also":[],"place":"Gravesend, Kent","ll":[0.37,51.442],"llc":false,"y0":1967,"y1":null,"yf":2016,"fr":1980,"set":"care","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":null,"who":"Kendall House, a Church of England children's home taking girls placed by social services","offc":false,"cover":"","d":"An independent review chaired by Dr Sue Proctor, commissioned by the Bishop of Rochester and published in July 2016, found that from 1967 girls as young as 11 were routinely given antidepressants, sedatives and antipsychotics, sometimes without medical assessment. Former residents were physically, emotionally and sometimes sexually abused, including two rapes while girls were held in isolation. The review heard from 20 former residents and examined records of 44. A 1980 television programme had already exposed the home.","cite":"Kendall House Review (Proctor), July 2016, as reported by Church Times and the National Secular Society","url":"https://www.churchtimes.co.uk/articles/2016/15-july/news/uk/girls-in-c-of-e-childrens-home-were-drugged-and-abused-review-finds","url2":"https://secularism.org.uk/news/2016/07/cruelty-was-normalised-at-church-of-england-childrens-home-says-report","net":null},{"id":"gbr-scotland-qab","n":"Quarriers, Aberlour and Barnardo's homes — Scottish Child Abuse Inquiry","iso":"GBR","also":[],"place":"Scotland (Quarriers Village, Bridge of Weir, and other homes)","ll":[-4.59,55.867],"llc":false,"y0":1921,"y1":1991,"yf":2020,"fr":null,"set":"care","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":null,"who":"Quarriers, Aberlour Child Care Trust and Barnardo's residential homes in Scotland","offc":false,"cover":"","d":"The Scottish Child Abuse Inquiry's third case study findings, published 7 January 2020, concluded that children in residential care run by Quarriers, Aberlour and Barnardo's between 1921 and 1991 suffered physical, emotional and sexual abuse. These voluntary providers cared for children placed by local authorities across Scotland.","cite":"Scottish Child Abuse Inquiry, Case Study no. 3 findings (Quarriers, Aberlour, Barnardo's), 7 January 2020","url":"https://www.childabuseinquiry.scot/news/scottish-child-abuse-inquiry-publishes-third-case-study-findings-quarriers-aberlour-and","url2":"https://childabuseinquiry.scot/sites/default/files/2023-03/qab-case-study-findings.pdf","net":null},{"id":"gbr-iicsa-final","n":"Independent Inquiry into Child Sexual Abuse — final report (England and Wales)","iso":"GBR","also":[],"place":"England and Wales (inquiry based in London)","ll":[-0.1276,51.5072],"llc":true,"y0":1945,"y1":null,"yf":2022,"fr":null,"set":"care","kind":"sexual abuse + sexual exploitation","st":"inquiry","v":6200,"vn":"More than 6,200 victims and survivors shared accounts with the Truth Project; this is not a total of victims.","off":null,"who":"Institutions across England and Wales: local authority care, churches, schools, custodial institutions, political parties, police","offc":true,"cover":"","d":"IICSA published its final report in October 2022 after 19 investigation reports, 325 days of public hearings, more than 700 live witnesses and almost 1,000 written statements, and over 200,000 documents. More than 6,200 victims and survivors took part in its Truth Project. It made 107 recommendations, including mandatory reporting of child sexual abuse. Its investigations found institutional failures by councils, police, churches and government departments.","cite":"IICSA Final Report, October 2022, Part A.2 'The Inquiry's activities'","url":"https://www.iicsa.org.uk/reports-recommendations/publications/inquiry/final-report/ii-inquirys-conclusions-and-recommendations-change/part-scope-inquiry/a2-inquirys-activities.html","url2":"","net":null},{"id":"gbr-child-migration-iicsa","n":"British child migration programmes — IICSA","iso":"GBR","also":["AUS","CAN","NZL","ZWE"],"place":"Sent from the UK to Australia, Canada, New Zealand and Southern Rhodesia","ll":[-0.1276,51.5072],"llc":true,"y0":1869,"y1":1970,"yf":2018,"fr":null,"set":"care","kind":"sexual abuse + child removal","st":"inquiry","v":4000,"vn":"About 4,000 children migrated after the Second World War, mostly to Australia; earlier migration (from the 19th century) was much larger.","off":null,"who":"UK government; Fairbridge Society, Barnardo's, Sisters of Nazareth, Catholic Church agencies and others; receiving institutions incl. Christian Brothers","offc":true,"cover":"Successive governments continued the policy despite years of evidence that children were suffering, including sexual abuse. Fairbridge failed to respond properly to a series of sexual abuse allegations at its schools.","d":"IICSA's report of 1 March 2018 found that the child migration programmes were 'a deeply flawed government policy' and that successive UK governments failed to ensure protections against abuse. It found a catalogue of evidence that migrated children suffered ill-treatment and abuse including sexual abuse; Barnardo's suspended migration after sexual abuse came to light at its Picton school, and the Fairbridge Society failed to respond to allegations at its schools in Canada and Australia. It recommended an immediate financial redress scheme for surviving child migrants.","cite":"IICSA, Child Migration Programmes Investigation Report, 1 March 2018","url":"https://www.iicsa.org.uk/reports-recommendations/publications/investigation/child-migration/executive-summary.html","url2":"https://www.iicsa.org.uk/news/inquiry-publishes-child-migration-programmes-report","net":3},{"id":"irl-ryan-industrial-schools","n":"Ryan Commission — state-funded industrial schools and reformatories, Ireland","iso":"IRL","also":[],"place":"Ireland (216 institutions incl. Letterfrack, Artane)","ll":[-8.2439,53.4129],"llc":true,"y0":1914,"y1":2000,"yf":2009,"fr":null,"set":"care","kind":"sexual abuse","st":"inquiry","v":500,"vn":"More than 500 of the 1,090 witnesses who gave private evidence said they were sexually abused; total victims unknown.","off":800,"who":"State-funded and state-inspected industrial schools and reformatories run by Catholic religious congregations (Christian Brothers, Sisters of Mercy and others); Department of Education","offc":true,"cover":"The Department of Education's inspections were too few and limited and it showed a 'deferential and submissive attitude' to the congregations; the Christian Brothers' efforts to avoid scandal protected perpetrators.","d":"The Commission to Inquire into Child Abuse, chaired by Mr Justice Seán Ryan, reported on 20 May 2009 on abuse in 216 schools, homes and other settings from 1914 to 2000, mostly 1930–1990. It heard from 1,090 people; more than 500 reported sexual abuse and over 90% physical abuse, and more than 800 people were identified as abusers. Abuse was 'endemic' in the congregation-run industrial schools, which were licensed, funded and inspected by the state. The Christian Brothers received more allegations than all other male orders combined.","cite":"Commission to Inquire into Child Abuse (Ryan Report), 20 May 2009, as reported by The Irish Times","url":"https://www.irishtimes.com/news/physical-emotional-and-sexual-abuse-was-widespread-in-state-institutions-1.766938","url2":"","net":null},{"id":"irl-mother-baby-homes","n":"Mother and Baby Homes Commission — Ireland","iso":"IRL","also":[],"place":"Ireland (14 mother and baby homes and 4 county homes, incl. Tuam, Bessborough)","ll":[-8.8564,53.5155],"llc":false,"y0":1922,"y1":1998,"yf":2021,"fr":null,"set":"care","kind":"child removal","st":"inquiry","v":9000,"vn":"About 9,000 children died in the institutions investigated (about 15% of the 57,000 children admitted).","off":null,"who":"Mother and baby homes and county homes run by religious orders and local health authorities, funded by the state","offc":true,"cover":"","d":"The Commission of Investigation's final report, published 12 January 2021, covered 14 mother and baby homes and four county homes from 1922 to 1998, which held about 56,000 unmarried mothers and 57,000 children. About 9,000 children died; in 1945–46 the infant death rate was nearly double the national average for children born outside marriage. The Commission said it found no evidence of sexual abuse of children in the homes and little of physical abuse of women, but found emotional abuse and said the state and churches supported and condoned harsh treatment. Some of the worst conditions were in homes run by local health authorities.","cite":"Commission of Investigation into Mother and Baby Homes, Final Report, 12 January 2021","url":"https://www.bishop-accountability.org/?p=136692","url2":"https://www.rte.ie/news/2021/0112/1189187-mother-and-baby-report","net":null},{"id":"deu-kentler-experiment","n":"'Kentler experiment' — Berlin youth office placed children with paedophile foster fathers","iso":"DEU","also":[],"place":"West Berlin (network nodes also in Göttingen, Hannover, Lüneburg, Tübingen, Heppenheim)","ll":[13.405,52.52],"llc":false,"y0":1967,"y1":null,"yf":2024,"fr":null,"set":"care","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":null,"who":"Berlin Senate youth administration and state youth office (Landesjugendamt); sexologist Helmut Kentler (Pädagogisches Zentrum Berlin, later TU Hannover); network incl. Gerold Becker of the Odenwaldschule","offc":true,"cover":"University of Hildesheim researchers found the abuse was carried out and institutionalised under the responsibility of the Landesjugendamt and the Berlin Senate administration; Kentler died in 2008 without prosecution.","d":"From the late 1960s (Kentler held a post at the Senate's Pädagogisches Zentrum from 1967 to 1976) West Berlin youth authorities, on the advice of Helmut Kentler, placed homeless boys and other children with men known to be paedophiles as foster fathers, as a form of 'resocialisation'. University of Hildesheim reports (2020 and final report 22 February 2024) reconstructed a nationwide network in science, youth welfare and administration that supported, legitimised or tolerated paedophile positions and sexual violence, continuing beyond 2000. Some children were about five years old when placed. Berlin says known victims have received compensation.","cite":"University of Hildesheim final report on the Kentler network, presented by Berlin Senator Katharina Günther-Wünsch, 22 February 2024 (epd/evangelisch.de; News4teachers)","url":"https://www.news4teachers.de/2024/02/ganzes-netzwerk-wie-pflegekinder-jahrzehntelang-an-paedokriminelle-vermittelt-wurden/","url2":"https://www.evangelisch.de/inhalte/227316/22-02-2024/abschlussbericht-zu-missbrauch-west-berliner-jugendhilfe","net":0},{"id":"deu-odenwaldschule","n":"Odenwaldschule, Heppenheim — abuse by headmaster Gerold Becker and teachers","iso":"DEU","also":[],"place":"Ober-Hambach, Heppenheim, Hesse","ll":[8.6847,49.6537],"llc":false,"y0":1965,"y1":1998,"yf":2010,"fr":1998,"set":"care","kind":"sexual abuse","st":"inquiry","v":132,"vn":"At least 132 pupils according to the 2010 lawyers' report, which said documentation was incomplete.","off":null,"who":"Odenwaldschule (private, state-recognised progressive boarding school); headmaster Gerold Becker, music teacher Wolfgang Held","offc":false,"cover":"After victims came forward in 1998 and the Frankfurter Rundschau reported it in November 1999, a promised review did not take place; prosecutors in Darmstadt dropped the case under the statute of limitations. Becker died in 2010 without facing legal consequences.","d":"A final report by lawyers Claudia Burgsmüller and Brigitte Tilmann, released 17 December 2010, found that at least 132 pupils were abused by teachers between 1965 and 1998. Former headmaster Gerold Becker and music teacher Wolfgang Held were named as the main perpetrators; the victims' association says at least 20 teachers were involved. The abuse became widely public in 2010; the school closed in September 2015 after insolvency. Becker also appears in the Hildesheim research as a figure in the Kentler network.","cite":"Burgsmüller & Tilmann, Abschlussbericht Odenwaldschule, 17 Dec 2010 (via Wikipedia index); News4teachers 2014","url":"https://en.wikipedia.org/wiki/Odenwaldschule","url2":"https://www.news4teachers.de/?p=39261","net":0},{"id":"deu-luegde","n":"Lügde campsite abuse — youth office placed foster child with offender","iso":"DEU","also":[],"place":"Lügde, Lippe district, North Rhine-Westphalia","ll":[9.2486,51.9583],"llc":false,"y0":1998,"y1":2018,"yf":2019,"fr":null,"set":"care","kind":"sexual abuse + abuse material","st":"convicted","v":32,"vn":"","off":2,"who":"Two men at a permanent campsite; youth welfare offices of Lippe and Hameln-Pyrmont; Lippe police","offc":true,"cover":"Welfare authorities placed a foster girl with the main offender despite allegations about him. Police failed to act on repeated complaints, evidence disappeared from police archives, and a case worker manipulated and deleted files. The NRW parliamentary inquiry found 'authority failure' and said the men could have been stopped two years earlier.","d":"On 5 September 2019 the Detmold regional court sentenced Andreas V. to 13 years and Mario S. to 12 years, both followed by preventive detention, for abusing 32 children at a campsite in Lügde from 1998 to 2018; police found 32,000 files of abuse material. Youth welfare authorities had placed a foster daughter with Andreas V. The North Rhine-Westphalia Landtag inquiry (interim report 24 March 2022) found failures by police and the youth offices of Lippe and Hameln-Pyrmont.","cite":"Irish Times, 5 Sep 2019; NRW Landtag Untersuchungsausschuss interim report, 24 March 2022 (epd)","url":"https://www.irishtimes.com/news/world/europe/two-men-jailed-in-germany-for-decades-of-child-abuse-1.4009268","url2":"https://www.evangelisch.de/inhalte/198974/24-03-2022/missbrauchsfaelle-von-luegde-ausschuss-wirft-behoerden-versagen-vor","net":null},{"id":"deu-heimkinder-round-table","n":"Round Table on Residential Care (Runder Tisch Heimerziehung) — West German children's homes 1950s–70s","iso":"DEU","also":[],"place":"West Germany","ll":[10.4515,51.1657],"llc":true,"y0":1949,"y1":1975,"yf":2010,"fr":null,"set":"care","kind":"sexual abuse + forced labour","st":"acknowledged","v":800000,"vn":"About 800,000 children grew up in church and state homes; this is the number in care, not the number abused. About one in three people contacting the Round Table's contact point reported sexual abuse.","off":null,"who":"State and church-run children's homes in West Germany","offc":false,"cover":"","d":"The Bundestag-appointed Round Table on residential care in the 1950s and 1960s presented its final report in December 2010. It found brutal discipline, humiliation, beatings and forced labour were common, and about one in three of those who contacted it reported sexual abuse. It recommended a fund of at least €120 million to be paid in equal thirds by the federal government, the states and the churches.","cite":"Runder Tisch Heimerziehung, final report, December 2010 (epd/evangelisch.de, 10 Dec 2010)","url":"https://www.evangelisch.de/inhalte/102766/10-12-2010/runder-tisch-empfiehlt-entschaedigungsfonds","url2":"https://www.blja.bayern.de/imperia/md/content/blvf/bayerlandesjugendamt/anlauf-beratungsstellen/runder_tisch_heimerzeihung_abschlussbericht.pdf","net":null},{"id":"nld-de-winter","n":"De Winter Commission — violence in Dutch youth care since 1945","iso":"NLD","also":[],"place":"Netherlands","ll":[5.2913,52.1326],"llc":true,"y0":1945,"y1":2018,"yf":2019,"fr":null,"set":"care","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":null,"who":"Dutch residential youth care, foster care, juvenile justice institutions, closed youth care, shelters for unaccompanied asylum-seeking minors, institutions for disabled children","offc":true,"cover":"","d":"The commission led by Professor Micha de Winter published 'Onvoldoende beschermd' on 14 June 2019 after interviewing about 1,000 people who had lived in foster families or youth institutions. It found that a considerable share of children in Dutch youth care since 1945 were not adequately protected from physical, psychological and sexual violence, that supervisors did not intervene enough, and that the government did too little to prevent it. The cabinet said the violence 'should never have happened' and set up a payment scheme for victims.","cite":"Commissie Onderzoek naar geweld in de jeugdzorg (De Winter), final report, 14 June 2019 (Leiden University)","url":"https://www.universiteitleiden.nl/nieuws/2019/06/eindrapport-commissie-onderzoek---de-winter-kinderen-werden-vanaf-1945-in-de-jeugdzorg-onvoldoende-beschermd-tegen-geweld","url2":"https://www.rijksoverheid.nl/actueel/nieuws/2019/06/12/reactie-kabinet-op-het-rapport-van-commissie-de-winter","net":null},{"id":"nld-samson","n":"Samson Commission — sexual abuse of children in Dutch state care","iso":"NLD","also":[],"place":"Netherlands","ll":[5.2913,52.1326],"llc":true,"y0":1945,"y1":2012,"yf":2012,"fr":null,"set":"care","kind":"sexual abuse","st":"inquiry","v":800,"vn":"800 claims received (65% care homes, 30% foster families); not a total.","off":null,"who":"Dutch children's homes and foster care (Jeugdzorg)","offc":false,"cover":"","d":"The commission chaired by former procurator-general Rieke Samson reported in October 2012 on sexual abuse of children in state-arranged care since 1945. It received 800 claims, 65% about children's homes and 30% about foster families, and passed 42 files to the public prosecutor. It found the government, care homes and foster care services did not do enough to protect children and, once aware, lacked professionalism and courage to act.","cite":"Samson Commission final report, October 2012 (DutchNews, 8 Oct 2012)","url":"https://www.dutchnews.nl/2012/10/children_in_care_not_protected","url2":"","net":null},{"id":"che-administrative-detention","n":"Swiss administrative detention and forced placements (incl. Verdingkinder)","iso":"CHE","also":[],"place":"Switzerland (about 650 institutions)","ll":[8.2275,46.8182],"llc":true,"y0":1930,"y1":1981,"yf":2019,"fr":null,"set":"care","kind":"sexual abuse + forced labour + child removal","st":"acknowledged","v":60000,"vn":"More than 60,000 people interned without judicial order in the 20th century; not all were children and not all suffered sexual abuse.","off":null,"who":"Swiss cantonal and municipal authorities; about 650 institutions","offc":true,"cover":"","d":"The Independent Expert Commission on Administrative Detention, set up under the Federal Act of 21 March 2014, presented its final report on 2 September 2019. It found more than 60,000 people were interned in about 650 institutions without court order, mainly from 1930 to 1981, and that victims were abused physically, psychologically and sexually. The Swiss government had apologised in 2010; a 2016 law created a CHF 25,000 'solidarity contribution' for victims of compulsory measures, including children placed as indentured farm labourers (Verdingkinder).","cite":"Independent Expert Commission on Administrative Detention (UEK), final report, 2 September 2019 (JusticeInfo.net)","url":"https://www.justiceinfo.net/en/42559-raw-truth-swiss-administrative-detention-finally-made-public.html","url2":"https://swissinfo.ch/eng/society/forced-internment_report-uncovers-troubling-chapter-of-swiss-social-history/45200924","net":null},{"id":"aut-wilhelminenberg","n":"Wilhelminenberg children's home, Vienna — commission report","iso":"AUT","also":[],"place":"Schloss Wilhelminenberg, Ottakring, Vienna","ll":[16.2876,48.2186],"llc":false,"y0":1948,"y1":1977,"yf":2013,"fr":1960,"set":"care","kind":"sexual abuse + sexual exploitation","st":"inquiry","v":null,"vn":"","off":null,"who":"City of Vienna children's home at Wilhelminenberg","offc":true,"cover":"Municipal staff in the overseeing department knew of widespread abuse and did not act; city politicians who learned of it in the 1960s also ignored it.","d":"A commission set up by the City of Vienna presented a 344-page report on 12 June 2013, based on 217 interviews including 140 former residents. It found children at the city-run home (1948–1977, girls only from 1962) were rampantly abused, including rape and sexual exploitation by caregivers and outside men, with girls as young as about six. Findings were sent to prosecutors. Some former residents received payments of up to €35,000.","cite":"Wilhelminenberg Commission report, 12 June 2013 (AP via CBS News)","url":"https://www.cbsnews.com/news/report-rampant-child-abuse-at-ex-home-in-vienna","url2":"","net":null},{"id":"dnk-godhavn","n":"Godhavn Report — Danish state children's homes 1945–1976","iso":"DNK","also":[],"place":"Godhavn boys' home, Tisvilde, North Zealand (and 18 other state homes)","ll":[12.0667,56.05],"llc":false,"y0":1945,"y1":1976,"yf":2011,"fr":null,"set":"care","kind":"sexual abuse","st":"acknowledged","v":null,"vn":"","off":null,"who":"Danish state-run children's homes incl. Godhavn boys' home","offc":false,"cover":"","d":"The Godhavn Report, published 9 May 2011, examined Godhavn boys' home and 18 other state homes from 1945 to 1976, finding neglect, physical and sexual abuse, and that about 22% of Godhavn residents had been given psychiatric drugs by psychiatrist Ib Ostenfeld. No prosecutions followed. Prime Minister Mette Frederiksen apologised to hundreds of victims in 2019.","cite":"Godhavn Report, 9 May 2011; SBS News on PM apology, August 2019","url":"https://www.sbs.com.au/news/article/sorry-for-the-injustice-danish-pm-apologises-to-children-abused-during-post-wwii-era/wuyo57r7s","url2":"https://en.wikipedia.org/wiki/Godhavn_inquiry","net":null},{"id":"swe-vanvard","n":"Swedish inquiry into abuse in children's homes and foster care (Vanvårdsutredningen)","iso":"SWE","also":[],"place":"Sweden","ll":[18.0686,59.3293],"llc":true,"y0":1920,"y1":1980,"yf":2011,"fr":null,"set":"care","kind":"sexual abuse","st":"acknowledged","v":null,"vn":"","off":null,"who":"Swedish municipal children's homes and foster care","offc":false,"cover":"","d":"The government inquiry into abuse and neglect in Swedish children's homes and foster care from 1920 to 1980 reported in February 2011, recommending a public apology and SEK 250,000 for each person who suffered serious abuse; the apology ceremony was held at Stockholm City Hall in 2011. A compensation board set up on 1 January 2013 had decided just over 4,000 applications by July 2015 and rejected 53% of them, with no right of appeal.","cite":"Vanvårdsutredningen, February 2011 (The Local, 10 Feb 2011); SVT Nyheter, 4 July 2015","url":"https://www.thelocal.se/20110210/31968","url2":"https://www.svt.se/nyheter/over-halften-av-de-vanvardare-barnen-utan-ersattning","net":null},{"id":"nor-barnehjem","n":"Norwegian children's homes and special schools 1945–1980 (NOU 2004:23)","iso":"NOR","also":[],"place":"Norway (Bergen led municipal investigations)","ll":[5.3221,60.3913],"llc":false,"y0":1945,"y1":1980,"yf":2004,"fr":null,"set":"care","kind":"sexual abuse","st":"acknowledged","v":null,"vn":"","off":null,"who":"Norwegian municipal children's homes and state special schools","offc":false,"cover":"","d":"The official report NOU 2004:23 'Barnehjem og spesialskoler under lupen' found neglect and abuse, in part of a serious nature and including sexual abuse, in children's homes and special schools between 1945 and 1980. Bergen and other municipalities ran their own investigations and compensation schemes; in 2005 the Storting committee recommended adapting the state 'rettferdsvederlag' scheme with payments up to NOK 300,000 and a lower burden of proof.","cite":"Stortinget, Innst. S. nr. 217 (2004–2005), on NOU 2004:23","url":"https://www.stortinget.no/no/Saker-og-publikasjoner/Publikasjoner/Innstillinger/Stortinget/2004-2005/inns-200405-217/2/","url2":"","net":null},{"id":"fin-substitute-care","n":"Finland — maltreatment in child welfare substitute care 1937–1983","iso":"FIN","also":[],"place":"Finland","ll":[24.9384,60.1699],"llc":true,"y0":1937,"y1":1983,"yf":2016,"fr":null,"set":"care","kind":"sexual abuse","st":"acknowledged","v":null,"vn":"","off":null,"who":"Finnish child welfare institutions and foster care","offc":false,"cover":"","d":"A Ministry of Social Affairs and Health study interviewed about 300 people who had been in child welfare substitute care between 1937 and 1983 and found maltreatment and violence in all forms of care. The Finnish government made an official apology on 20 November 2016, Universal Children's Day.","cite":"Finnish Ministry of Social Affairs and Health, official apology, 20 November 2016","url":"https://stm.fi/en/-/lastensuojelun-sijaishuollossa-kaltoin-kohdelluilta-pyydettiin-anteeksi","url2":"","net":null},{"id":"fra-ase-prostitution","n":"France — children in state child welfare (ASE) exploited in prostitution","iso":"FRA","also":[],"place":"France (cases raised in Bouches-du-Rhône and Essonne)","ll":[2.2137,46.2276],"llc":true,"y0":null,"y1":2025,"yf":2025,"fr":null,"set":"care","kind":"sexual exploitation","st":"inquiry","v":15000,"vn":"Parliamentary commission estimate of children in ASE care who are victims of prostitution (as reported by RFI/AFP).","off":null,"who":"Aide sociale à l'enfance (departmental child welfare services)","offc":true,"cover":"","d":"A French parliamentary commission of inquiry report published in April 2025 estimated that about 15,000 children in the care of the departmental child welfare services (ASE), which hold about 396,900 minors, are victims of prostitution. Lawyers asked the Bouches-du-Rhône and Essonne departments for administrative reviews over children in care who were prostituted; teenagers are often housed in hotels with little supervision. A complaint was filed with the UN Committee on the Rights of the Child.","cite":"RFI/AFP report on French child welfare and prostitution, 2025, citing National Assembly commission of inquiry","url":"https://www.inkl.com/news/french-child-welfare-service-accused-of-allowing-kids-to-fall-into-prostitution","url2":"","net":null},{"id":"fra-betharram","n":"Notre-Dame de Bétharram school — National Assembly commission of inquiry","iso":"FRA","also":[],"place":"Lestelle-Bétharram, Pyrénées-Atlantiques","ll":[-0.2117,43.1225],"llc":false,"y0":1957,"y1":2004,"yf":2025,"fr":null,"set":"care","kind":"sexual abuse","st":"inquiry","v":200,"vn":"About 200 complaints filed since early 2025.","off":null,"who":"Notre-Dame de Bétharram, a Catholic private school under contract with the state; Ministry of Education inspection","offc":true,"cover":"The commission wrote that 'in the absence of action from a minister who was informed and in a position to intervene', abuse continued for years; it found state inspection of private schools under contract was weak and sanctioned teachers could move between schools undetected.","d":"Priests, teachers and staff are accused of sexual and physical abuse of pupils from 1957 to 2004, with about 200 complaints filed in 2025. The National Assembly commission of inquiry (rapporteurs Violette Spillebout and Paul Vannier) published its report on 2 July 2025 with 50 recommendations, including rebuilding state inspections. It did not directly implicate François Bayrou, who said he had not grasped the seriousness of information he received; Vannier separately accused him of misleading parliament.","cite":"Assemblée nationale commission of inquiry report, 2 July 2025 (AP via BishopAccountability; Le Club des Juristes)","url":"https://www.bishop-accountability.org/?p=323378","url2":"https://www.leclubdesjuristes.com/en-bref/affaire-betharram-publication-du-rapport-de-la-commission-denquete-de-lassemblee-nationale-11361/","net":null},{"id":"can-indian-residential-schools","n":"Indian Residential Schools — Truth and Reconciliation Commission and abuse claims","iso":"CAN","also":[],"place":"Canada (schools in every province and territory except NB, PEI and NL)","ll":[-106.3468,56.1304],"llc":true,"y0":null,"y1":1997,"yf":2015,"fr":null,"set":"care","kind":"sexual abuse + child removal","st":"acknowledged","v":37951,"vn":"37,951 claims for injuries from physical and sexual abuse were made by end-2014 (TRC figure); the Independent Assessment Process ultimately received 38,276 claims. About 150,000 First Nations, Métis and Inuit children attended.","off":null,"who":"Government of Canada; schools operated by the Catholic, Anglican, United and Presbyterian churches","offc":true,"cover":"Under the settlement, claimants' IAP records are to be destroyed after 19 September 2027 unless the claimant asks to keep or share them.","d":"About 150,000 First Nations, Métis and Inuit children attended federally funded, church-run residential schools; the last closed in 1997. The Truth and Reconciliation Commission's final report (December 2015) documented 3,200 deaths and said the true number is much higher. By the end of 2014, 37,951 claims had been made for injuries from physical and sexual abuse and 30,939 resolved. The Independent Assessment Process received 38,276 claims in total; adjudicators awarded $2.14 billion to 23,431 claimants and the government compensated 4,415 more directly.","cite":"Truth and Reconciliation Commission of Canada, Final Report, December 2015 (CBC 'By the numbers'); Globe and Mail on IAP totals","url":"https://www.bishop-accountability.org/2015/12/by-the-numbers-truth-and-reconciliation-commission-final-report/","url2":"https://www.theglobeandmail.com/canada/toronto/article-more-than-3-billion-paid-to-compensate-28000-victims-of-residential/","net":1},{"id":"can-mount-cashel","n":"Mount Cashel Orphanage, St John's — Hughes Royal Commission","iso":"CAN","also":[],"place":"Mount Cashel Orphanage, St John's, Newfoundland","ll":[-52.7126,47.5615],"llc":false,"y0":1898,"y1":1990,"yf":1991,"fr":1974,"set":"care","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":9,"who":"Mount Cashel Orphanage run by the Irish Christian Brothers, with privileged foster-home status from Newfoundland Social Services; Royal Newfoundland Constabulary; provincial Department of Justice","offc":true,"cover":"In December 1975 the police chief and assistant chief ordered Detective Robert Hillier to end his investigation after two Brothers admitted molestation; references to sexual assault were removed and the first report destroyed. The Justice Department laid no charges, and four Brothers were moved out of the province instead.","d":"Complaints of abuse at Mount Cashel surfaced in 1974 and 1975 but neither led to charges. Police reopened the case in February 1989; nine Christian Brothers were convicted. The Hughes Royal Commission (156 hearing days, over 200 witnesses, report 31 May 1991) found neither the police nor the Justice Department handled the 1975–76 files normally, and that child welfare director Frank Simms insisted on special treatment for the Brothers. The province paid $11 million to more than 40 victims in 1997.","cite":"Royal Commission of Inquiry into the Response of the Newfoundland Criminal Justice System to Complaints (Hughes), 31 May 1991, as summarised by Heritage Newfoundland and Labrador","url":"https://www.heritage.nf.ca/articles/politics/wells-government-mt-cashel.php","url2":"https://bishop-accountability.org/reports/1991_Hughes_Mount_Cashel/1991_Hughes_Volume_1_Royal_Commission_of_Inquiry_Report.pdf","net":null},{"id":"can-ns-home-colored-children","n":"Nova Scotia Home for Colored Children — Restorative Inquiry","iso":"CAN","also":[],"place":"Dartmouth (Westphal), Nova Scotia","ll":[-63.5249,44.6844],"llc":false,"y0":1921,"y1":2015,"yf":2019,"fr":null,"set":"care","kind":"sexual abuse","st":"acknowledged","v":null,"vn":"","off":null,"who":"Nova Scotia Home for Colored Children (provincially funded orphanage for Black children)","offc":true,"cover":"","d":"Former residents of the home, which operated from 1921, described neglect and emotional, physical and sexual abuse. A class action was settled and the provincial government apologised in 2014 to former residents and the African Nova Scotian community for harm caused by systemic racism. The Restorative Inquiry delivered its final report on 28 November 2019 in Halifax.","cite":"Government of Nova Scotia news release on Restorative Inquiry final report, 28 November 2019","url":"https://news.novascotia.ca/en/2019/11/28/final-report-calls-shift-toward-human-centred-care","url2":"","net":null},{"id":"can-cornwall-inquiry","n":"Cornwall Public Inquiry — institutional responses to historical abuse","iso":"CAN","also":[],"place":"Cornwall, Ontario","ll":[-74.7303,45.0213],"llc":false,"y0":null,"y1":null,"yf":2009,"fr":null,"set":"care","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":null,"who":"Cornwall Community Police Service, Ontario Provincial Police (Project Truth), local probation office, Roman Catholic Diocese of Alexandria-Cornwall","offc":true,"cover":"Commissioner Glaude found the Diocese's $32,000 settlement with complainant David Silmser contained an illegal clause, and called Cornwall police's investigation of his complaint 'deeply flawed', though he found no conspiracy between police and diocese.","d":"The Cornwall Public Inquiry under Commissioner G. Normand Glaude reported in December 2009 at a cost of over $50 million. It found systemic failures by police, probation and the Catholic diocese in responding to historical sexual abuse allegations against adults in positions of trust in Cornwall. On the long-rumoured paedophile 'clan', Glaude made no finding, saying no investigation had provided conclusive evidence.","cite":"Report of the Cornwall Inquiry (Glaude), December 2009, as reported by the Standard-Freeholder via BishopAccountability","url":"https://www.bishop-accountability.org/news2009/11_12/2009_12_16_Lajoie_SystemicFailures.htm","url2":"","net":null},{"id":"can-grandview","n":"Grandview Training School for Girls, Galt, Ontario","iso":"CAN","also":[],"place":"Galt (now Cambridge), Ontario","ll":[-80.3123,43.3601],"llc":false,"y0":1933,"y1":1976,"yf":1999,"fr":1991,"set":"care","kind":"sexual abuse","st":"acknowledged","v":300,"vn":"The survivors' group grew to over 300 women.","off":null,"who":"Ontario provincial training school for girls (juvenile reformatory)","offc":true,"cover":"Complaints of serious sexual abuse made by girls while at the school were reportedly ignored and never investigated.","d":"Former residents of this provincial reform school for girls aged 12–18 alleged physical, sexual and psychological abuse by staff. The abuse became public in 1991, prompting a joint Ontario Provincial Police and Waterloo Regional Police investigation; a survivors' group of more than 300 women sought collective compensation. In 1999 MPP Jim Flaherty apologised in the Ontario legislature on the province's behalf.","cite":"Wikipedia (index), citing Legislative Assembly of Ontario Hansard, 19 Nov 1999, and Kaufman report 'Searching for Justice'","url":"https://en.wikipedia.org/wiki/Grandview_Training_School_for_Girls","url2":"https://www.novascotia.ca/just/kaufmanreport/chapter16.htm","net":null},{"id":"usa-indian-boarding-schools","n":"Federal Indian Boarding Schools — Interior Department investigation","iso":"USA","also":[],"place":"United States (417 schools in 37 states or territories)","ll":[-98.5795,39.8283],"llc":true,"y0":1819,"y1":1969,"yf":2024,"fr":null,"set":"care","kind":"sexual abuse + child removal","st":"acknowledged","v":973,"vn":"At least 973 children's deaths confirmed — an undercount; not a count of abuse victims.","off":null,"who":"US Department of the Interior / federal government; many schools run by churches with federal funding","offc":true,"cover":"","d":"The Federal Indian Boarding School Initiative's Volume I (May 2022) and Volume II (July 2024) identified 417 federal Indian boarding schools in 37 states or then-territories between 1819 and 1969, at least 973 children's deaths, and at least 74 marked and unmarked burial sites at 65 schools. The report states that many Indian children suffered 'physical, sexual, and emotional abuse' at the schools and recommended a formal US apology.","cite":"US Department of the Interior, Federal Indian Boarding School Initiative Investigative Report Vol. II, July 2024 (Equal Justice Initiative summary)","url":"https://eji.org/news/federal-investigation-finds-at-least-973-children-died-in-federal-indian-boarding-schools/","url2":"https://sourcenm.com/2024/07/30/at-least-973-native-american-children-died-at-u-s-run-boarding-schools-between-1871-1969/","net":2},{"id":"usa-boy-scouts","n":"Boy Scouts of America — 82,000+ abuse claims and bankruptcy settlement","iso":"USA","also":[],"place":"Irving, Texas (BSA HQ); abuse nationwide","ll":[-96.9489,32.814],"llc":false,"y0":null,"y1":null,"yf":2020,"fr":null,"set":"care","kind":"sexual abuse","st":"settled","v":82000,"vn":"More than 82,000 claims filed in the bankruptcy by the November 2020 deadline.","off":null,"who":"Boy Scouts of America (now Scouting America) and local councils","offc":false,"cover":"BSA kept internal 'ineligible volunteer' files on suspected abusers; 1,247 files from 1965–1985 were ordered released by the Oregon Supreme Court in June 2012 after a 2010 civil jury award of nearly $20 million.","d":"BSA filed for Chapter 11 bankruptcy in February 2020. By the November 2020 claims deadline more than 82,000 people had filed sexual abuse claims, which lawyers said was larger than all Catholic Church cases combined. A $2.46 billion settlement trust pays survivors between $3,500 and $2.7 million; the US Supreme Court declined to review the plan in January 2026. BSA's internal 'ineligible volunteer' files, which the Oregon Supreme Court ordered largely released in 2012, recorded suspected abusers over decades.","cite":"JURIST, Nov 2020; KSL/AP on settlement; ABA Journal on Oregon Supreme Court ruling, 14 June 2012","url":"https://www.jurist.org/news/2020/11/boy-scouts-subject-to-more-than-82000-sexual-abuse-claims-report","url2":"https://www.abajournal.com/news/article/top_oregon_court","net":4},{"id":"usa-la-county-juvenile","n":"Los Angeles County juvenile halls and MacLaren Children's Center — $4bn settlement","iso":"USA","also":[],"place":"Los Angeles County, California (MacLaren Children's Center, El Monte, and juvenile halls)","ll":[-118.0275,34.0686],"llc":false,"y0":1980,"y1":null,"yf":2025,"fr":null,"set":"care","kind":"sexual abuse","st":"settled","v":6800,"vn":"More than 6,800 claims.","off":null,"who":"Los Angeles County Probation Department juvenile facilities; MacLaren Children's Center (closed 2003); county foster care","offc":true,"cover":"","d":"On 29 April 2025 the Los Angeles County Board of Supervisors unanimously approved a $4 billion settlement of more than 6,800 claims of sexual abuse, mostly in Probation Department juvenile facilities and at the MacLaren Children's Center in El Monte, plus foster care, dating back to the 1980s. It was the costliest such payout in county history.","cite":"ABC7 Los Angeles, 29 April 2025","url":"https://abc7.com/post/4-billion-settlement-sexual-abuse-claims-juvenile-facilities-is-expected-approved-today-la-county-supervisors/16277247/","url2":"","net":null},{"id":"usa-nh-ydc","n":"New Hampshire Youth Development Center, Manchester","iso":"USA","also":[],"place":"Manchester, New Hampshire","ll":[-71.4548,42.9956],"llc":false,"y0":null,"y1":null,"yf":2024,"fr":2017,"set":"care","kind":"sexual abuse","st":"charged","v":1100,"vn":"More than 1,100 former residents had filed lawsuits by May 2024.","off":11,"who":"State of New Hampshire Youth Development Center (juvenile detention)","offc":true,"cover":"","d":"More than 1,100 former residents of New Hampshire's state youth detention centre have sued over physical, sexual and emotional abuse spanning six decades, and 11 former state workers have been arrested. In the first trial, on 3 May 2024, a jury found the state negligent and awarded David Meehan, who went to police in 2017, $38 million. The state argued it was not liable for 'rogue' employees. A state settlement fund had paid $102 million on 206 claims by October 2024, with 448 more pending.","cite":"Concord Monitor/AP, 3 May 2024","url":"https://www.concordmonitor.com/New-Hampshire-jury-finds-state-liable-for-abuse-at-youth-detention-center-and-awards-victim-38M-54997779","url2":"https://indepthnh.org/?p=4348291","net":null},{"id":"usa-bjs-nsyc-2018","n":"US juvenile facilities — BJS National Survey of Youth in Custody 2018","iso":"USA","also":[],"place":"United States (327 juvenile facilities)","ll":[-98.5795,39.8283],"llc":true,"y0":2018,"y1":2018,"yf":2019,"fr":null,"set":"care","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":null,"who":"State and locally run juvenile detention and correctional facilities","offc":true,"cover":"","d":"The Bureau of Justice Statistics surveyed 6,049 youth in 327 juvenile facilities between March and December 2018. 7.1% reported sexual victimisation in the previous 12 months, and 5.8% reported sexual misconduct by staff (down from 7.7% in 2012). Youth-on-youth forced or coerced victimisation was reported by 1.9%.","cite":"Bureau of Justice Statistics, Sexual Victimization Reported by Youth in Juvenile Facilities, 2018 (released 11 Dec 2019)","url":"https://bjs.ojp.gov/press-release/sexual-victimization-reported-youth-juvenile-facilities-2018","url2":"","net":null},{"id":"usa-texas-foster-care","n":"Texas foster care — federal court finds 'rape and over-medication were the norm'","iso":"USA","also":[],"place":"Texas (case heard in Corpus Christi federal court)","ll":[-97.3964,27.8006],"llc":false,"y0":2011,"y1":null,"yf":2015,"fr":null,"set":"care","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":null,"who":"Texas Department of Family and Protective Services; Health and Human Services Commission","offc":true,"cover":"Judge Jack held Texas in contempt three times (2019, 2020, April 2024) for failing to investigate abuse complaints and protect children; in 2019 she said she could no longer find the department credible.","d":"In a class action filed in 2011 on behalf of children in long-term state care, US District Judge Janis Graham Jack ruled in December 2015 that Texas violated foster children's constitutional rights by placing them in a system where 'rape and over-medication were the norm'. She later ordered 24-hour awake supervision and flagging of children who were victims or perpetrators of sexual violence. In April 2024 she found the state in contempt for a third time and fined it $100,000 a day over failures to investigate abuse reports.","cite":"KUT, 5 Nov 2019; AP via KTVZ, 16 Apr 2024","url":"https://www.kut.org/texas/2019-11-05/federal-judge-hammers-texas-officials-over-failures-to-improve-foster-care-system","url2":"https://ktvz.com/news/ap-national-news/2024/04/16/texas-fined-100000-per-day-for-failing-to-act-on-foster-care-abuse-allegations/","net":null},{"id":"usa-troubled-teen-gao","n":"'Troubled teen' residential programmes — GAO 2007 investigation","iso":"USA","also":[],"place":"United States","ll":[-98.5795,39.8283],"llc":true,"y0":1990,"y1":2007,"yf":2007,"fr":null,"set":"care","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":null,"who":"Private residential treatment programmes, boot camps and wilderness programmes for youth","offc":false,"cover":"","d":"In testimony to Congress on 10 October 2007 (GAO-08-146T), the Government Accountability Office reported it had found thousands of allegations of abuse, some involving death, at residential treatment programmes for troubled youth, reviewing closed cases back to 1990. GAO did not verify each allegation.","cite":"GAO-08-146T, Residential Treatment Programs: Concerns Regarding Abuse and Death in Certain Programs for Troubled Youth, 10 Oct 2007","url":"https://www.gao.gov/products/GAO-08-146T","url2":"","net":null},{"id":"usa-rtf-senate-2024","n":"Youth residential treatment facilities — US Senate Finance Committee 2024","iso":"USA","also":[],"place":"United States","ll":[-98.5795,39.8283],"llc":true,"y0":null,"y1":null,"yf":2024,"fr":null,"set":"care","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":null,"who":"Universal Health Services, Acadia Healthcare, Devereux Advanced Behavioral Health, Vivant Behavioral Healthcare (incl. former Sequel facilities); funded by Medicaid and child welfare agencies","offc":false,"cover":"","d":"A two-year Senate Finance Committee investigation released on 12 June 2024 found that 'horrific instances of sexual abuse persist unremediated' inside residential treatment facilities for children run by four large companies, along with physical abuse, overuse of restraints and overmedication. Facilities often receive more than $1,200 per child per day from Medicaid; states including Oregon sent foster children to out-of-state facilities.","cite":"US Senate Finance Committee (Chairman Wyden), 'Warehouses of Neglect', 12 June 2024","url":"https://finance.senate.gov/chairmans-news/wyden-investigation-exposes-systemic-taxpayer-funded-child-abuse-and-neglect-in-youth-residential-treatment-facilities","url2":"https://www.opb.org/article/2024/06/12/senate-report-us-taxpayers-fund-residential-treatment-facilities-that-put-vulnerable-kids-at-risk/","net":null},{"id":"usa-illinois-youth-detention","n":"Illinois state youth detention centres and Cook County JTDC — mass abuse lawsuits","iso":"USA","also":[],"place":"Illinois (incl. Illinois Youth Center St. Charles and Cook County Juvenile Temporary Detention Center, Chicago)","ll":[-88.3118,41.9139],"llc":false,"y0":1996,"y1":2021,"yf":2024,"fr":null,"set":"care","kind":"sexual abuse","st":"alleged","v":667,"vn":"667 people had sued over abuse at state and county youth facilities between May and September 2024 (allegations by plaintiffs).","off":null,"who":"Illinois Department of Juvenile Justice (nine state youth detention centres, five since closed); Cook County Juvenile Temporary Detention Center","offc":true,"cover":"","d":"Between May and September 2024, 667 former detainees sued alleging sexual abuse by staff at Illinois state youth detention centres and the Cook County Juvenile Temporary Detention Center; three suits filed on 23 September 2024 alone covered 272 plaintiffs and abuse from 1996 to 2021. The lawsuits name repeat alleged abusers, including a chaplain at St. Charles, and say at least one accused employee still worked for the state. These are allegations not yet tested in court.","cite":"AP via BishopAccountability, 24 September 2024","url":"https://www.bishop-accountability.org/?p=309731","url2":"","net":null},{"id":"can-ontario-training-schools","n":"Ontario training schools class action (Brown v. Ontario)","iso":"CAN","also":[],"place":"Ontario (13 training schools incl. Pine Ridge, Bowmanville; Hillcrest, Guelph; Brookside, Cobourg; Cecil Facer, Sudbury)","ll":[-78.6878,43.9126],"llc":false,"y0":1953,"y1":1984,"yf":2026,"fr":null,"set":"care","kind":"sexual abuse","st":"settled","v":null,"vn":"","off":null,"who":"Government of Ontario provincial training schools (juvenile reformatories)","offc":true,"cover":"","d":"In the class action Brown v. Ontario, the province agreed to a settlement of up to CAD 60 million, signed 21 January 2026 and approved by the Ontario Superior Court on 21 May 2026, for former residents of 13 provincial training schools between 1953 and 1984. It covers physical and sexual assault and solitary confinement. Ontario denies liability and the court did not decide the merits.","cite":"Brown v. Ontario settlement notice (Open Class Actions), 2026","url":"https://openclassactions.com/settlements/ontario-training-schools-class-action-settlement.php","url2":"","net":null},{"id":"gbr-rotherham-jay","n":"Rotherham — Jay inquiry (1,400 children, 1997–2013)","iso":"GBR","also":[],"place":"Rotherham, South Yorkshire","ll":[-1.3568,53.4302],"llc":false,"y0":1997,"y1":2013,"yf":2014,"fr":null,"set":"organized","kind":"sexual exploitation + trafficking","st":"inquiry","v":1400,"vn":"conservative estimate, Jay report","off":null,"who":"Group-based exploitation networks; Rotherham Metropolitan Borough Council; South Yorkshire Police","offc":true,"cover":"Three earlier reports (2002, 2003, 2013) on exploitation were effectively suppressed or ignored; police did not treat the abuse as a priority.","d":"Professor Alexis Jay's independent inquiry, published 26 August 2014, estimated that about 1,400 children were sexually exploited in Rotherham between 1997 and 2013, some as young as 11. It described the collective failures of the council and South Yorkshire Police as 'blatant'. The report said most known perpetrators were of Pakistani heritage, and that frontline staff were confused about what might be seen as racist. The council leader resigned within hours of publication.","cite":"Independent Inquiry into Child Sexual Exploitation in Rotherham 1997–2013 (Alexis Jay), 26 August 2014; Al Jazeera, 26 Aug 2014","url":"https://www.aljazeera.com/news/2014/8/26/uk-town-ignored-abuse-of-1400-children","url2":"https://content.govdelivery.com/attachments/UKLGIU/2014/09/11/file_attachments/323357/Child+Sexual+Exploitation+in+Rotherham+-+Alexis+Jay+report.pdf","net":null},{"id":"gbr-stovewood","n":"Operation Stovewood — NCA Rotherham investigation","iso":"GBR","also":[],"place":"Rotherham, South Yorkshire","ll":[-1.3568,53.4302],"llc":false,"y0":1997,"y1":2013,"yf":2025,"fr":null,"set":"organized","kind":"sexual exploitation","st":"convicted","v":1150,"vn":"potential victims identified by the NCA","off":39,"who":"National Crime Agency investigation into non-recent exploitation in Rotherham","offc":true,"cover":"","d":"The National Crime Agency took over the Rotherham investigation in 2014. Its page reports about 1,150 potential victims identified, more than 220 people arrested or interviewed voluntarily, and 39 people convicted with about 470 years of prison sentences. On 8 August 2025 the NCA agreed to take over an investigation, directed by the Independent Office for Police Conduct, into allegations of child sexual abuse by former South Yorkshire Police officers (allegations; no finding yet).","cite":"National Crime Agency, Operation Stovewood page and statement of 8 August 2025","url":"https://www.nationalcrimeagency.gov.uk/what-we-do/crime-threats/operation-stovewood-rotherham-child-sexual-abuse-investigation","url2":"https://www.nationalcrimeagency.gov.uk/news/statement-on-the-national-crime-agency-s-adoption-of-south-yorkshire-child-sexual-abuse-investigation","net":null},{"id":"gbr-rochdale","n":"Rochdale — Operation Span convictions and 2024 review","iso":"GBR","also":[],"place":"Rochdale, Greater Manchester","ll":[-2.1561,53.6097],"l
