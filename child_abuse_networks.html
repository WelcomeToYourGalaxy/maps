lc":false,"y0":2004,"y1":2013,"yf":2024,"fr":2008,"set":"organized","kind":"sexual exploitation + trafficking","st":"convicted","v":null,"vn":"","off":9,"who":"Grooming network linked to two takeaway restaurants; Greater Manchester Police; Rochdale Council","offc":true,"cover":"Police identified ring-leaders in 2007 but did not pursue them; Operation Span launched over two years after the first reports.","d":"In May 2012 nine men were convicted after Operation Span, which Greater Manchester Police began in December 2010, more than two years after it was first told of abuse linked to two takeaways. Girls as young as 12 were plied with drink and drugs and passed between men for cash. A 173-page review published 15 January 2024 found children were 'left at the mercy' of gangs between 2004 and 2013 through a 'lamentable strategic failure' of senior police and council leaders; it identified hundreds of potential victims, mainly white girls from poor backgrounds, abused by Asian men, and said 96 men were still a potential risk to children.","cite":"Greater Manchester Combined Authority, Operation Span review (Spicer/Woodhouse), January 2024; ITV News, 15 Jan 2024","url":"https://www.itv.com/news/granada/2024-01-15/children-left-at-mercy-of-grooming-gangs-in-rochdale-report-says","url2":"https://www.greatermanchester-ca.gov.uk/media/9148/operation-span-report-january-2024-v3.pdf","net":null},{"id":"gbr-oxford-bullfinch","n":"Oxford — Operation Bullfinch and 2015 Serious Case Review","iso":"GBR","also":[],"place":"Oxford, Oxfordshire","ll":[-1.2577,51.752],"llc":false,"y0":1999,"y1":2014,"yf":2015,"fr":null,"set":"organized","kind":"sexual exploitation + trafficking","st":"convicted","v":373,"vn":"Serious Case Review estimate: more than 350, possibly 373, over 16 years","off":7,"who":"Grooming network; Thames Valley Police; Oxfordshire County Council","offc":true,"cover":"","d":"Seven men were jailed in May 2013 for a combined minimum of 95 years after Operation Bullfinch; the trial judge said police and social services missed tell-tale signs. The Oxfordshire Serious Case Review, published 3 March 2015, estimated that more than 350 young people were sexually exploited in the county from 1999 to 2014. It found police did not believe the girls and treated them as if they had chosen their situation, and social services knew of grooming but failed to protect them. Both the police and council apologised.","cite":"Oxfordshire Safeguarding Children Board Serious Case Review (Bullfinch), March 2015; Public Sector Executive, 2 March 2015","url":"https://www.publicsectorexecutive.com/News/serious-review-shows-over-350-young-people-sexually-abused-in-oxfordshire/99442","url2":"https://news.oxfordshire.gov.uk/council-accepts-findings-of-bullfinch-serious-case-review/","net":null},{"id":"gbr-telford-iicset","n":"Telford — Independent Inquiry into Child Sexual Exploitation","iso":"GBR","also":[],"place":"Telford, Shropshire","ll":[-2.4472,52.6766],"llc":false,"y0":1989,"y1":2022,"yf":2022,"fr":null,"set":"organized","kind":"sexual exploitation + trafficking","st":"inquiry","v":1000,"vn":"'more than 1,000' children over at least 30 years","off":7,"who":"Group-based exploitation networks; West Mercia Police; Telford & Wrekin Council","offc":true,"cover":"Concerns raised by officers, youth workers and teachers in the 1990s were not taken seriously; specialist CSE teams were cut to near zero after Operation Chalice.","d":"The inquiry chaired by Tom Crowther QC, published 12 July 2022, found more than 1,000 children were sexually exploited in Telford over at least 30 years. Agencies dismissed the abuse as 'child prostitution', blamed children for 'lifestyle choices', and failed to investigate partly from nervousness about race. Seven men were jailed in 2013 after Operation Chalice. West Mercia Police and the council apologised; the inquiry found no evidence of corruption.","cite":"Independent Inquiry Telford Child Sexual Exploitation (Tom Crowther QC), 12 July 2022; ITV News, 12 Jul 2022","url":"https://itv.com/news/central/2022-07-12/what-is-the-telford-sexual-exploitation-independent-inquiry-who-is-tom-crowther","url2":"","net":null},{"id":"gbr-newcastle-sanctuary","n":"Newcastle — Operation Sanctuary","iso":"GBR","also":[],"place":"Newcastle upon Tyne","ll":[-1.6178,54.9783],"llc":false,"y0":2010,"y1":2017,"yf":2018,"fr":null,"set":"organized","kind":"sexual exploitation","st":"convicted","v":700,"vn":"about 700 across the Northumbria Police area, 108 in Newcastle (Joint Serious Case Review)","off":18,"who":"Grooming networks; Northumbria Police","offc":false,"cover":"","d":"Operation Sanctuary began in 2014 and led to 18 people being jailed for sexually abusing girls and young women they had groomed in Newcastle. The Joint Serious Case Review, published 23 February 2018, put the number of victims at about 700 across the Northumbria area, 108 of them in Newcastle. It found no evidence that concerns about political correctness or accusations of racism made police reluctant to investigate, and called for law changes on sexual exploitation.","cite":"Newcastle Safeguarding Children Board, Joint Serious Case Review concerning sexual exploitation (David Spicer), February 2018; Euronews, 23 Feb 2018","url":"https://www.euronews.com/2018/02/23/operation-sanctuary-uk-told-to-change-its-laws-on-sex-exploitation","url2":"https://www.northumberland.gov.uk/NorthumberlandCountyCouncil/media/Child-Families/Safeguarding/Final-JSCR-Report-160218.pdf","net":null},{"id":"gbr-huddersfield-tendersea","n":"Huddersfield — Operation Tendersea","iso":"GBR","also":[],"place":"Huddersfield, West Yorkshire","ll":[-1.785,53.6458],"llc":false,"y0":1995,"y1":2013,"yf":2023,"fr":null,"set":"organized","kind":"sexual exploitation","st":"convicted","v":null,"vn":"","off":42,"who":"Grooming networks; West Yorkshire Police investigation","offc":false,"cover":"","d":"In October 2018, 20 men were convicted at Leeds Crown Court of abusing girls as young as 11 in Huddersfield between 2004 and 2011; the ringleader's convictions involved 11 girls. By April 2023 Operation Tendersea had convicted 42 men in several trials for abuse between 1995 and 2013, with 505 years and six months of sentences.","cite":"ITV News, 19 Oct 2018; Pocklington Post/Yorkshire Post, April 2023","url":"https://www.pocklingtonpost.co.uk/news/crime/child-sex-abuse-yorkshire-more-than-500-years-of-jail-time-given-to-sex-offenders-as-part-of-operation-tendersea-4104200","url2":"https://itv.com/news/2018-10-19/huddersfield-gang-jailed-for-inhuman-campaign-of-rape-and-grooming","net":null},{"id":"gbr-derby-retriever","n":"Derby — Operation Retriever","iso":"GBR","also":[],"place":"Derby","ll":[-1.4746,52.9225],"llc":false,"y0":null,"y1":null,"yf":2010,"fr":null,"set":"organized","kind":"sexual exploitation","st":"convicted","v":26,"vn":"","off":9,"who":"Grooming network; Derbyshire Police investigation","offc":false,"cover":"","d":"Derbyshire Police's Operation Retriever led to the conviction of nine men in 2010 for grooming and sexually abusing 26 girls, one aged 12. Thirteen men had been charged and eleven stood trial.","cite":"Heart East Midlands, 2010; BBC News 'Derby sex gang convicted of grooming and abusing girls', 24 Nov 2010","url":"https://www.heart.co.uk/eastmids/news/local/gang-guilty-abusing-vulnerable-girls/","url2":"","net":null},{"id":"gbr-calderdale","n":"Halifax/Calderdale — West Yorkshire grooming trials","iso":"GBR","also":[],"place":"Halifax, Calderdale","ll":[-1.8636,53.7248],"llc":false,"y0":2001,"y1":2010,"yf":2024,"fr":null,"set":"organized","kind":"sexual exploitation","st":"convicted","v":4,"vn":"","off":20,"who":"Grooming networks; West Yorkshire Police","offc":false,"cover":"","d":"On 6 November 2024, 20 men were jailed for more than 200 years combined for raping and abusing four girls aged 12 to 16 in Calderdale between 2001 and 2010, after three West Yorkshire Police investigations. In May 2026 six more men were convicted over the abuse of one girl from 2006 to 2009, which she reported to police in 2019.","cite":"ITV Calendar, 6 Nov 2024; Crown Prosecution Service, May 2026","url":"https://itv.com/news/calendar/2024-11-06/20-men-jailed-for-rape-and-abuse-of-four-girls","url2":"https://www.cps.gov.uk/cy/node/29168","net":null},{"id":"gbr-keighley","n":"Keighley — 2016 convictions","iso":"GBR","also":[],"place":"Keighley, West Yorkshire","ll":[-1.9064,53.8679],"llc":false,"y0":null,"y1":null,"yf":2016,"fr":null,"set":"organized","kind":"sexual exploitation","st":"convicted","v":1,"vn":"","off":12,"who":"Grooming network","offc":false,"cover":"","d":"In February 2016 twelve men were jailed, with sentences of up to 20 years, for sexually exploiting a vulnerable teenage girl in Keighley. A further six men were jailed in 2022 for the systematic rape of another teenage girl in the town.","cite":"BBC News 'Keighley abuse: Twelve men jailed for sexually exploiting girl', 8 Feb 2016; Yorkshire Evening Post 2022","url":"https://innertemplelibrary.com/2016/02/keighley-abuse-twelve-men-jailed-for-sexually-exploiting-girl-bbc-news","url2":"https://www.yorkshireeveningpost.co.uk/news/crime/keighley-grooming-six-men-jailed-for-rape-of-girl-who-was-robbed-of-childhood-3575753","net":null},{"id":"gbr-oldham-review","n":"Oldham — 2022 assurance review","iso":"GBR","also":[],"place":"Oldham, Greater Manchester","ll":[-2.1183,53.5409],"llc":false,"y0":2005,"y1":2014,"yf":2022,"fr":null,"set":"organized","kind":"sexual exploitation","st":"inquiry","v":null,"vn":"","off":null,"who":"Oldham Council; Greater Manchester Police; shisha bars, residential homes and taxis","offc":true,"cover":"","d":"The review published 20 June 2022 found 'serious failings' by Oldham Council and Greater Manchester Police: police and council knew of risks from shisha bars by late 2010 yet children of 13 and 14 still visited them in 2013, and multi-agency child-protection procedures were often not started. It criticised how a former council welfare rights officer, later convicted of rape and trafficking, was investigated. The review found no evidence of a cover-up by senior managers or councillors. Oldham is the first confirmed area for local investigation under the 2025 national inquiry.","cite":"Greater Manchester Combined Authority, Review into historic safeguarding practices in Oldham, June 2022","url":"https://www.greatermanchester-ca.gov.uk/news/the-review-into-historic-safeguarding-practices-in-oldham","url2":"https://www.greatermanchester-ca.gov.uk/media/6198/final-oldham-assurance-report-8-june-2022-14-digital-version.pdf","net":null},{"id":"gbr-casey-audit","n":"Casey national audit on group-based child sexual exploitation","iso":"GBR","also":[],"place":"England and Wales (London)","ll":[-0.1276,51.5072],"llc":false,"y0":null,"y1":null,"yf":2025,"fr":null,"set":"organized","kind":"sexual exploitation","st":"inquiry","v":null,"vn":"","off":null,"who":"Home Office; police forces in England and Wales","offc":true,"cover":"","d":"Baroness Casey's audit, published 16 June 2025, found that data flaws meant the scale of group-based exploitation could not be assessed, and that perpetrator ethnicity was not recorded for about two-thirds of cases. Local data from three police force areas showed 'disproportionate numbers of men from Asian ethnic backgrounds amongst suspects', which she said warranted further examination; she said flawed data had been used to dismiss concerns. The government accepted all 12 recommendations, including mandatory ethnicity and nationality data for suspects, charging adult sex with under-16s as rape, an NCA-led national operation, and a national inquiry with statutory powers.","cite":"National Audit on Group-based Child Sexual Exploitation and Abuse (Baroness Casey), 16 June 2025","url":"https://www.gov.uk/government/publications/national-audit-on-group-based-child-sexual-exploitation-and-abuse","url2":"https://www.celcis.org/news/news-pages/uk-government-publishes-national-audit-group-based-child-sexual-exploitation-and-abuse","net":null},{"id":"gbr-homeoffice-2020","n":"Home Office paper on group-based CSE characteristics (2020)","iso":"GBR","also":[],"place":"London","ll":[-0.1276,51.5072],"llc":false,"y0":null,"y1":null,"yf":2020,"fr":null,"set":"organized","kind":"sexual exploitation","st":"inquiry","v":null,"vn":"","off":null,"who":"Home Office","offc":false,"cover":"","d":"The Home Office paper published 15 December 2020 reviewed the evidence on group-based child sexual exploitation. It said research found group-based offenders were 'most commonly White' and that available data did not support conclusions that any one ethnic group was over-represented, while stressing that data were poor and inconsistently recorded. The Home Secretary's foreword said community and cultural factors were 'clearly relevant'. The 2025 Casey audit later said such flawed data had been used to dismiss concerns.","cite":"Home Office, Group-based child sexual exploitation: characteristics of offending, 15 Dec 2020; UCL analysis, Dec 2020","url":"https://www.gov.uk/government/publications/group-based-child-sexual-exploitation-characteristics-of-offending","url2":"https://www.ucl.ac.uk/news/2020/dec/analysis-new-home-office-report-admits-grooming-gangs-are-not-muslim-problem","net":null},{"id":"gbr-national-inquiry","n":"Independent Inquiry into Grooming Gangs (2025–)","iso":"GBR","also":[],"place":"England and Wales (London)","ll":[-0.1276,51.5072],"llc":false,"y0":null,"y1":null,"yf":2025,"fr":null,"set":"organized","kind":"sexual exploitation","st":"inquiry","v":null,"vn":"","off":null,"who":"National panel overseeing local investigations","offc":false,"cover":"","d":"On 9 December 2025 the Home Secretary named Baroness Anne Longfield, former Children's Commissioner, as chair of a national inquiry with full statutory powers overseeing local investigations into grooming gangs, following Casey's recommendation. It is time-limited to three years with a £65m budget, will hold individuals and institutions to account, and Oldham is the first confirmed local investigation. Final terms of reference were due by March 2026.","cite":"Local Government Lawyer, 9 Dec 2025; GOV.UK Independent inquiry into grooming gangs collection","url":"https://localgovernmentlawyer.co.uk/community-safety/393-community-safety-news/99236-home-secretary-names-chair-of-grooming-gangs-inquiry-and-publishes-terms-of-reference","url2":"https://www.gov.uk/government/collections/independent-inquiry-into-grooming-gangs","net":null},{"id":"usa-backpage","n":"Backpage.com — seizure, CEO plea and owners' convictions","iso":"USA","also":[],"place":"Phoenix, Arizona / Dallas, Texas","ll":[-112.074,33.4484],"llc":false,"y0":2004,"y1":2018,"yf":2024,"fr":null,"set":"organized","kind":"sexual exploitation + trafficking","st":"convicted","v":null,"vn":"","off":null,"who":"Backpage.com classified advertising website","offc":false,"cover":"","d":"US authorities seized Backpage.com in April 2018. On 12 April 2018 CEO Carl Ferrer pleaded guilty to conspiracy to facilitate prostitution and money laundering; the Justice Department said the site earned hundreds of millions of dollars from 'escort' ads and that traffickers used it to advertise children and adults alike. In November 2023 a Phoenix jury convicted co-owners Scott Spear and John Brunst on Travel Act and money-laundering counts and Michael Lacey on one count of international concealment money laundering; co-founder James Larkin died on 31 July 2023 before trial. On 28 August 2024 Spear and Brunst were sentenced to 10 years and Lacey to five; DOJ said the scheme earned more than $500 million.","cite":"US Department of Justice press releases, 12 April 2018 and 28 August 2024","url":"https://www.justice.gov/opa/pr/three-owners-notorious-prostitution-website-backpagecom-sentenced","url2":"https://www.justice.gov/archives/opa/pr/backpage-s-co-founder-and-ceo-well-several-backpage-related-corporate-entities-enter-guilty","net":5},{"id":"usa-craigslist-2010","n":"Craigslist adult services closure (2010)","iso":"USA","also":[],"place":"San Francisco, California","ll":[-122.4194,37.7749],"llc":false,"y0":null,"y1":null,"yf":2010,"fr":null,"set":"organized","kind":"sexual exploitation + trafficking","st":"acknowledged","v":null,"vn":"","off":null,"who":"Craigslist","offc":false,"cover":"","d":"In September 2010 Craigslist removed its 'adult services' section from its US site, replacing it with a 'censored' label, after a letter from 18 state attorneys general led by Connecticut's Richard Blumenthal. The letter said the section carried rampant prostitution ads and facilitated human trafficking, including ads involving children. Blumenthal estimated the section could generate over $36 million in revenue. Much of the advertising later moved to Backpage, which AGs urged to close its own section that month.","cite":"JURIST, Sept 2010; Illinois Attorney General, 21 Sept 2010","url":"https://www.jurist.org/news/2010/09/craigslist-removes-adult-services-section-under-pressure-from-state-ags","url2":"https://illinoisattorneygeneral.gov/News-Room/2006-2018-Press-Archive/201009-21 URGES BACKPAGEdotCOM TO REMOVE ADULT SERVICES SECTION.pdf","net":null},{"id":"usa-aylo-dpa-ftc","n":"Pornhub/MindGeek (Aylo) — card cut-off, DOJ agreement and FTC/Utah settlement","iso":"USA","also":["CAN"],"place":"Brooklyn, New York (EDNY); Salt Lake City (FTC/Utah)","ll":[-73.9442,40.6782],"llc":false,"y0":2017,"y1":2021,"yf":2025,"fr":null,"set":"organized","kind":"abuse material + trafficking","st":"settled","v":null,"vn":"","off":null,"who":"Aylo Holdings (formerly MindGeek), owner of Pornhub","offc":false,"cover":"","d":"After a New York Times column by Nicholas Kristof on 4 December 2020 reported child sexual abuse material and non-consensual videos on Pornhub, the site banned uploads from unverified users and Mastercard (10 Dec 2020) and Visa stopped card acceptance. On 21 December 2023 Aylo entered a deferred prosecution agreement in Brooklyn over unlawful monetary transactions involving sex-trafficking proceeds (linked to GirlsDoPorn, whose victims were adult women), paying over $1.8 million plus victim compensation and accepting a three-year monitor; Aylo did not plead guilty. On 3 September 2025 Aylo agreed to pay $5 million to the FTC and Utah, which alleged it knowingly profited from child sexual abuse material and that its fingerprinting system was ineffective from at least 2017 to August 2021.","cite":"TechSpot 11 Dec 2020; AP via WOWT 22 Dec 2023; TechCrunch 3 Sept 2025 (FTC and Utah Division of Consumer Protection settlement)","url":"https://techcrunch.com/2025/09/03/pornhub-owner-pays-5m-settlement-to-ftc-over-historic-failure-to-block-abusive-content","url2":"https://www.wowt.com/2023/12/22/pornhub-owner-agrees-pay-18-million-resolve-sex-trafficking-related-charge/","net":6},{"id":"usa-fbi-cross-country-2023","n":"FBI Operation Cross Country XIII (2023)","iso":"USA","also":[],"place":"Nationwide (Washington DC)","ll":[-77.0369,38.9072],"llc":false,"y0":2023,"y1":2023,"yf":2023,"fr":null,"set":"organized","kind":"sexual exploitation + trafficking","st":"charged","v":59,"vn":"59 minor victims of child sex trafficking/exploitation identified or located; 200 victims in total","off":126,"who":"FBI and partner agencies","offc":false,"cover":"","d":"During a two-week operation in July 2023, announced 1 August 2023, the FBI and partners identified and located 200 sex-trafficking victims, including 59 minor victims of child sex trafficking and sexual exploitation, and located 59 actively missing children. 68 trafficking suspects and 126 suspects of child sexual exploitation and trafficking offences were identified or arrested.","cite":"US Department of Justice, 'Operation Cross Country XIII', 1 Aug 2023","url":"https://www.justice.gov/opa/pr/operation-cross-country-xiii-leads-identificationlocation-adolescent-victims","url2":"","net":null},{"id":"mex-usa-carreto","n":"Carreto family — Tenancingo to New York trafficking","iso":"USA","also":["MEX"],"place":"Queens and Brooklyn, New York","ll":[-73.7949,40.7282],"llc":false,"y0":1991,"y1":2004,"yf":2008,"fr":null,"set":"organized","kind":"trafficking + sexual exploitation","st":"convicted","v":null,"vn":"","off":4,"who":"Carreto family pimping network based in Tenancingo, Tlaxcala","offc":false,"cover":"","d":"From 1991 to 2004 the Carreto family, based in San Miguel de Tenancingo, Tlaxcala, recruited young, poor women and girls in Mexico by deception and forced them into prostitution in brothels in Queens and Brooklyn, using rape, threats and forced abortion. Josue and Gerardo Flores Carreto were sentenced to 50 years each in April 2006 and Daniel Perez Alonso to 25 years. Their mother Consuelo Carreto Valencia was extradited in January 2007 and pleaded guilty to sex trafficking on 22 July 2008.","cite":"US Department of Justice press release, 22 July 2008; UNODC SHERLOC, United States v. Carreto et al.","url":"https://www.justice.gov/archive/opa/pr/2008/July/08-crt-641.html","url2":"https://www.unodc.org/cld/case-law-doc/traffickingpersonscrimetype/usa/2009/united_states_v._carreto_et_al.html","net":7},{"id":"mex-usa-rendon-reyes","n":"Rendon-Reyes trafficking organization (Tenancingo)","iso":"USA","also":["GTM","HND","MEX"],"place":"Eastern District of New York","ll":[-73.9442,40.6782],"llc":false,"y0":2004,"y1":2015,"yf":2019,"fr":null,"set":"organized","kind":"trafficking + sexual exploitation","st":"convicted","v":null,"vn":"at least 8 victims named in five sentencings, including one minor","off":8,"who":"Rendon-Reyes Trafficking Organization, Tenancingo, Tlaxcala","offc":false,"cover":"","d":"From December 2004 to November 2015 the Tenancingo-based Rendon-Reyes organization smuggled women and girls from Mexico and Central America into the US, forced them into prostitution and laundered proceeds back to Mexico. In January 2019 five members were sentenced in Brooklyn to between 15 and 25 years; others had pleaded guilty to racketeering and sex trafficking.","cite":"US Attorney's Office EDNY press release, 7 January 2019","url":"https://www.justice.gov/usao-edny/pr/five-members-mexican-sex-trafficking-organization-sentenced-prison","url2":"","net":7},{"id":"arg-marita-veron","n":"Marita Verón case — Tucumán brothel network","iso":"ARG","also":[],"place":"San Miguel de Tucumán","ll":[-65.2226,-26.8083],"llc":false,"y0":2002,"y1":null,"yf":2013,"fr":null,"set":"organized","kind":"trafficking + sexual exploitation","st":"convicted","v":null,"vn":"","off":10,"who":"Brothel and trafficking ring in Tucumán province","offc":true,"cover":"Campaigners and the victim's family's lawyers said police were often paid to protect prostitution rings; trial court acquitted all 13 in 2012.","d":"Marita Verón, aged 23, disappeared in Tucumán in 2002, allegedly abducted into forced prostitution. In December 2012 a Tucumán court acquitted all 13 defendants, provoking national protests and calls to impeach the judges. In December 2013 Tucumán's Supreme Court reversed the acquittals and found 10 of the 13 guilty. Her mother's foundation, created in 2008, says it has helped free hundreds of women and girls from brothels. (Verón was an adult; the case is included because it exposed the national network that also trafficked minors.)","cite":"Al Jazeera, 13 Dec 2012; AP via Fox News, 17 Dec 2013","url":"https://www.aljazeera.com/news/2012/12/13/outrage-over-argentina-sex-slavery-acquittals","url2":"https://www.foxnews.com/world/argentine-court-overturns-acquittals-in-notorious-sex-slavery-trial-finds-10-of-13-guilty","net":null},{"id":"nld-rapporteur-2017","n":"Netherlands — National Rapporteur estimate of exploited Dutch girls","iso":"NLD","also":[],"place":"The Hague","ll":[4.3007,52.0705],"llc":false,"y0":2012,"y1":2016,"yf":2017,"fr":null,"set":"organized","kind":"sexual exploitation + trafficking","st":"inquiry","v":1320,"vn":"at least 1,320 Dutch girls aged 12–17 per year (estimate, 2012–2016 data)","off":null,"who":"Domestic pimps and 'loverboy' recruiters","offc":false,"cover":"","d":"A report by National Rapporteur Corinne Dettmeijer, prepared with UNODC and published 18 October 2017, estimated that at least 1,320 underage Dutch girls aged 12 to 17 fall victim to sexual exploitation in the Netherlands each year, using 2012–2016 data. Underage girls made up nearly half of female victims in the Dutch sex industry. In October 2025 the current rapporteur reported reported exploitation cases rising from 868 (2023) to 944 (2024), with more teenage victims.","cite":"National Rapporteur on Trafficking in Human Beings and Sexual Violence against Children, report of 18 Oct 2017 (Reuters via Arab News); DutchNews 17 Oct 2025","url":"https://www.arabnews.com/node/1179656","url2":"https://www.dutchnews.nl/2025/10/more-minors-foreign-workers-are-victims-of-human-traffickers","net":null},{"id":"can-statcan-trafficking","n":"Canada — police-reported trafficking 2013–2023 (Ontario hub)","iso":"CAN","also":[],"place":"Ontario (Toronto)","ll":[-79.3832,43.6532],"llc":false,"y0":2013,"y1":2023,"yf":2024,"fr":null,"set":"organized","kind":"trafficking + sexual exploitation","st":"inquiry","v":null,"vn":"about 23% of 3,558 police-reported victims were under 18","off":null,"who":"Mostly domestic traffickers known to victims","offc":false,"cover":"","d":"Statistics Canada reported on 1 November 2024 that police recorded 4,543 trafficking incidents from 2013 to 2023; about 23% of 3,558 victims were under 18 and 93% were women and girls. Ontario accounted for roughly two-thirds of incidents and Toronto alone for 20%. 91% of victims knew their trafficker and 34% were trafficked by an intimate partner; only 10% of completed adult court cases with a trafficking charge ended in a guilty decision.","cite":"Statistics Canada, The Daily, 'Trafficking in persons in Canada, 2023', 1 Nov 2024","url":"https://www150.statcan.gc.ca/n1/daily-quotidien/241101/dq241101a-eng.pdf","url2":"","net":null},{"id":"aus-phl-flight-attendant-2020","n":"Melbourne flight attendant jailed for abusing 26 girls in the Philippines","iso":"PHL","also":["AUS"],"place":"Philippines (offender from Melbourne)","ll":[121.774,12.8797],"llc":true,"y0":2010,"y1":2017,"yf":2020,"fr":null,"set":"tourism","kind":"sexual abuse + abuse material","st":"convicted","v":26,"vn":"","off":1,"who":"Australian travelling offender (airline flight attendant)","offc":false,"cover":"","d":"On 30 March 2020 a 52-year-old Melbourne flight attendant was sentenced in Australia to 18.5 years' imprisonment (14 years non-parole) for sexually abusing 26 girls aged 12 to 17 in the Philippines on 25 occasions between 2010 and 2017. He was prosecuted in Australia under Commonwealth laws covering child sexual offences committed overseas.","cite":"Commonwealth Director of Public Prosecutions / AFP joint media release, 30 March 2020","url":"https://www.cdpp.gov.au/news/joint-media-release-australian-flight-attendant-jailed-abuse-children-overseas","url2":"","net":null},{"id":"aus-phl-sydney-2021a","n":"Sydney man sentenced after rescue of three children in the Philippines","iso":"PHL","also":["AUS"],"place":"Philippines (offender from Sydney)","ll":[121.774,12.8797],"llc":true,"y0":null,"y1":null,"yf":2021,"fr":null,"set":"tourism","kind":"sexual abuse + abuse material","st":"convicted","v":3,"vn":"","off":1,"who":"Australian offender abusing children in the Philippines","offc":false,"cover":"","d":"A 64-year-old Sydney man was sentenced on 3 December 2021 to eight years and 10 months for sexual activity with children under 16 outside Australia and producing child abuse material overseas, among other charges. The AFP investigation led to three children being removed from harm in the Philippines in May 2020.","cite":"Australian Federal Police media release, 4 Dec 2021","url":"https://afp.gov.au/news-centre/media-release/sydney-man-sentenced-after-investigation-led-rescue-three-children","url2":"","net":null},{"id":"aus-phl-sydney-2021b","n":"Sydney man jailed for persistent abuse of a child in the Philippines","iso":"PHL","also":["AUS"],"place":"Philippines (offender from Sydney)","ll":[121.774,12.8797],"llc":true,"y0":null,"y1":null,"yf":2021,"fr":null,"set":"tourism","kind":"sexual abuse + abuse material","st":"convicted","v":1,"vn":"","off":1,"who":"Australian offender procuring a child in the Philippines","offc":false,"cover":"","d":"On 17 December 2021 a Sydney man was sentenced to nine years and one month for procuring a child to engage in sexual activity outside Australia and persistent sexual abuse of a child outside Australia, plus abuse-material offences. One child was rescued in the Philippines.","cite":"Australian Federal Police media release, 17 Dec 2021","url":"https://afp.gov.au/news-centre/media-release/sydney-man-jailed-and-child-rescued-philippines","url2":"","net":null},{"id":"aus-phl-brisbane-2022","n":"Brisbane man jailed for abusing children in the Visayas, Philippines","iso":"PHL","also":["AUS"],"place":"Visayas, Philippines","ll":[123.8854,10.3157],"llc":false,"y0":null,"y1":null,"yf":2022,"fr":null,"set":"tourism","kind":"sexual abuse","st":"convicted","v":5,"vn":"five children rescued in December 2019","off":1,"who":"Australian offender abusing children in the Philippines","offc":false,"cover":"","d":"A 57-year-old Brisbane man was sentenced on 31 January 2022 to eight years' imprisonment (four non-parole) for abusing children overseas. Five children were rescued in the Visayas region of the Philippines in December 2019 as a result of the investigation.","cite":"Australian Federal Police media release, 1 Feb 2022","url":"https://www.afp.gov.au/news-centre/media-release/brisbane-man-jailed-8-years-abusing-children-overseas","url2":"","net":null},{"id":"aus-passport-law-2017","n":"Australia — passport ban for registered child sex offenders (2017)","iso":"AUS","also":[],"place":"Canberra","ll":[149.13,-35.2809],"llc":false,"y0":2016,"y1":null,"yf":2017,"fr":null,"set":"tourism","kind":"sexual abuse","st":"acknowledged","v":null,"vn":"","off":null,"who":"Australian Government","offc":false,"cover":"","d":"Laws taking effect on 13 December 2017 allow Australia to cancel the passports of up to 20,000 registered child sex offenders to stop them travelling to abuse children. The Foreign Minister said about 800 registered offenders travelled overseas in 2016, often to developing countries in Asia, and about 40% did so without notifying police. Reporting at the time said about half of the trips were to Southeast Asia.","cite":"Jakarta Post, 13 Dec 2017; WGBH/NPR, 30 May 2017","url":"https://www.thejakartapost.com/news/2017/12/13/australia-introduces-tough-new-laws-on-child-sex-tourism","url2":"https://wgbh.org/news/2017-05-30/australia-plans-to-deny-passports-to-child-sex-offenders","net":null},{"id":"phl-naia-intercept-2013","n":"Philippines blacklists Australian sex offender after AFP warning (2013)","iso":"PHL","also":["AUS"],"place":"Ninoy Aquino International Airport, Manila","ll":[121.0198,14.5086],"llc":false,"y0":null,"y1":null,"yf":2013,"fr":null,"set":"tourism","kind":"sexual abuse","st":"acknowledged","v":null,"vn":"","off":1,"who":"Philippine Bureau of Immigration; Australian Federal Police","offc":false,"cover":"","d":"In April 2013 Philippine immigration officers at Manila airport intercepted and blacklisted an Australian convicted in Perth in 2010 of indecent assault on children, travelling on a New Zealand passport and planning to stay in Iloilo, after an Australian police warning that he posed a risk to Filipino children. It is an example of offender travel notifications between countries.","cite":"Philippine Daily Inquirer (Global Nation), 26 April 2013","url":"https://globalnation.inquirer.net/?p=73171","url2":"","net":null},{"id":"irl-ferns-report","n":"Ferns Report — Diocese of Ferns","iso":"IRL","also":[],"place":"Diocese of Ferns, Co. Wexford","ll":[-6.499,52.59],"llc":false,"y0":1962,"y1":2002,"yf":2005,"fr":1962,"set":"religious","kind":"sexual abuse","st":"inquiry","v":null,"vn":"More than 100 allegations made between 1962 and 2002","off":21,"who":"Catholic Diocese of Ferns","offc":true,"cover":"Bishop Herlihy moved accused priests to other posts or dioceses for a period, then reinstated them; Gardaí failed to record or properly investigate some pre-1988 complaints","d":"The state Ferns Inquiry, published 25 October 2005, examined more than 100 allegations of child sexual abuse made between 1962 and 2002 against 21 priests of the diocese. Bishop Donal Herlihy moved accused priests temporarily and then reinstated them, and ordained men he knew or should have known posed a risk. Bishop Brendan Comiskey never got a priest to stand aside from ministry. The report found Garda handling of one of eight formal complaints 'wholly inadequate' and some pre-1988 complaints were not recorded.","cite":"Ferns Inquiry report, 25 October 2005, as reported by RTÉ News","url":"https://www.rte.ie/news/2005/1025/ferns.html","url2":"https://Bishop-Accountability.org/reports/2005_10_Ferns/ferns_8_0_conclusions.pdf","net":null},{"id":"irl-murphy-dublin","n":"Murphy Report — Archdiocese of Dublin","iso":"IRL","also":[],"place":"Dublin","ll":[-6.2603,53.3498],"llc":false,"y0":1975,"y1":2004,"yf":2009,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":320,"vn":"320 people complained of abuse 1975–2004; a further 130 complaints after May 2004","off":46,"who":"Catholic Archdiocese of Dublin","offc":true,"cover":"Abuse 'covered up' 1975–2004; bishops generally did not report to Gardaí before 1996; archdiocese took out insurance against abuse litigation from 1987; Gardaí knew of complaints against Fr Tony Walsh in 1990–91 and took no action","d":"The Commission of Investigation into the Catholic Archdiocese of Dublin reported on 26 November 2009. It examined a sample of 46 priests out of 102 within its remit; 320 people complained of abuse between 1975 and 2004. It found Archbishops McQuaid, Ryan, McNamara and Connell handled complaints badly and that the archdiocese had insured itself against abuse litigation from 1987. It also criticised the Gardaí, and the Garda Commissioner apologised.","cite":"Commission of Investigation, Report into the Catholic Archdiocese of Dublin (Murphy Report), 26 November 2009","url":"https://en.wikipedia.org/wiki/Murphy_Report","url2":"https://s3.documentcloud.org/documents/243712/4-murphy-report-entire-ireland.pdf","net":null},{"id":"irl-cloyne-report","n":"Cloyne Report — Diocese of Cloyne","iso":"IRL","also":[],"place":"Cloyne, Co. Cork","ll":[-8.1222,51.8625],"llc":false,"y0":1996,"y1":2009,"yf":2011,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":19,"who":"Catholic Diocese of Cloyne; Bishop John Magee","offc":false,"cover":"Nine complaints that should have gone to the Gardaí were not reported; none of the 1996–2008 complaints reported to the health service; Vatican's reaction to Irish guidelines described as 'entirely unhelpful'","d":"The Cloyne Report, published 13 July 2011, examined the diocese's handling of allegations against 19 clerics from 1996 to February 2009, after the Irish church had adopted reporting procedures. Nine complaints that should have been reported to the Gardaí were not, and none were reported to the health authorities. Bishop John Magee was found to have shown little interest in applying the guidelines for 12 years. The report said the Vatican's response to the Irish procedures allowed bishops to ignore them.","cite":"Commission of Investigation, Report into the Catholic Diocese of Cloyne, July 2011, as summarised by the Irish Times","url":"https://www.irishtimes.com/news/main-points-commission-of-investigation-into-the-catholic-diocese-of-cloyne-1.599164","url2":"","net":null},{"id":"irl-ryan-report","n":"Ryan Commission — industrial schools run by religious orders","iso":"IRL","also":[],"place":"Ireland (more than 250 church-run institutions)","ll":[-7.6921,53.1424],"llc":true,"y0":1936,"y1":1999,"yf":2009,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":null,"vn":"More than 30,000 children were sent to the institutions; redress scheme paid about 12,000 people","off":null,"who":"Christian Brothers (most boys' institutions), Sisters of Mercy (most girls' institutions) and other Catholic orders","offc":true,"cover":"Christian Brothers sued the commission in 2004 to keep members' names out; no real names of perpetrators published; findings not to be used for prosecutions; state Department of Education inspections failed","d":"The Commission to Inquire into Child Abuse reported on 20 May 2009 after a nine-year investigation of more than 250 church-run institutions that held over 30,000 children from the 1930s to the 1990s. It found sexual abuse 'endemic' in boys' institutions run mainly by the Christian Brothers; the Sisters of Mercy ran most girls' institutions. The 2,600-page report names no perpetrators after a Christian Brothers lawsuit. A parallel state redress scheme paid about 12,000 people an average of €65,000.","cite":"Commission to Inquire into Child Abuse (Ryan Report), 20 May 2009, as reported by CBS News/AP","url":"https://cbsnews.com/news/irish-report-details-catholic-child-abuse","url2":"https://industrialmemories.ucd.ie/","net":null},{"id":"irl-scoping-schools-2024","n":"Scoping Inquiry — abuse in religious-run schools","iso":"IRL","also":[],"place":"Ireland (308 schools)","ll":[-7.6921,53.1424],"llc":true,"y0":1960,"y1":1999,"yf":2024,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":null,"vn":"2,395 allegations recorded; report says true number likely higher","off":884,"who":"42 religious orders that ran day and boarding schools","offc":false,"cover":"","d":"The state Scoping Inquiry, published 3 September 2024, recorded 2,395 allegations of sexual abuse against 884 alleged abusers at 308 schools run by 42 religious orders, mostly from the 1960s to the 1990s. 590 allegations involving 190 alleged abusers concerned 17 special schools. More than half of the alleged abusers are dead. The government announced a full Commission of Investigation.","cite":"Report of the Scoping Inquiry into Historical Sexual Abuse in Day and Boarding Schools Run by Religious Orders, 3 September 2024","url":"https://www.bishop-accountability.org/2024/09/shocking-abuse-in-irelands-religious-schools/","url2":"https://www.bishop-accountability.org/reports-2024-09-03-Ireland-Scoping-Report-1-Executive-Summary","net":null},{"id":"usa-boston-ma-ag-2003","n":"Archdiocese of Boston — Spotlight 2002 and Massachusetts AG report 2003","iso":"USA","also":[],"place":"Boston, Massachusetts","ll":[-71.0589,42.3601],"llc":false,"y0":1940,"y1":2002,"yf":2003,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":789,"vn":"At least 789 minors; AG estimated the true number probably exceeds 1,000","off":250,"who":"Roman Catholic Archdiocese of Boston; Cardinal Bernard Law","offc":false,"cover":"Accused priests reassigned with Cardinal Law's personal involvement; church alerted law enforcement only twice in six decades; bishops sought leniency for priests and withheld information from prosecutors","d":"After the Boston Globe Spotlight series beginning January 2002, Cardinal Law resigned in December 2002. The Massachusetts Attorney General's report of 23 July 2003 found at least 237 priests and 13 other church workers accused of abusing at least 789 minors over six decades, and 'overwhelming evidence' that Law knew and took part in reassigning abusers. No criminal statute allowed charging church leaders.","cite":"Office of the Massachusetts Attorney General, 'The Sexual Abuse of Children in the Roman Catholic Archdiocese of Boston', 23 July 2003, as reported by the Boston Globe","url":"https://graphics.boston.com/globe/spotlight/abuse/print4/072403_report.htm","url2":"","net":null},{"id":"usa-pennsylvania-grand-jury-2018","n":"Pennsylvania grand jury — six dioceses","iso":"USA","also":[],"place":"Pittsburgh, Harrisburg, Allentown, Scranton, Greensburg, Erie","ll":[-76.8867,40.2732],"llc":false,"y0":1947,"y1":2018,"yf":2018,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":1000,"vn":"'At least 1,000' identified; grand jury believed there were more","off":301,"who":"Six Pennsylvania Catholic dioceses","offc":false,"cover":"Abusers moved and protected, some later promoted; reports brushed aside; most crimes beyond statute of limitations","d":"A 23-member statewide grand jury report released by Attorney General Josh Shapiro on 14 August 2018 identified 301 'predator priests' and at least 1,000 child victims over about 70 years in six dioceses. The roughly 1,400-page report found bishops 'went to great lengths to keep it secret' and moved abusers. Most crimes were too old to prosecute.","cite":"40th Statewide Investigating Grand Jury report, 14 August 2018, as reported by America magazine","url":"https://www.americamagazine.org/faith/2018/08/15/report-details-rape-children-culture-secrecy-fanned-it","url2":"","net":null},{"id":"usa-illinois-ag-2023","n":"Illinois Attorney General — clergy abuse report","iso":"USA","also":[],"place":"Chicago and Illinois' six dioceses","ll":[-87.6298,41.8781],"llc":false,"y0":1950,"y1":2019,"yf":2023,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":1997,"vn":"","off":451,"who":"Six Catholic dioceses of Illinois","offc":false,"cover":"Before the investigation the dioceses had publicly listed only 103 substantiated abusers","d":"Attorney General Kwame Raoul's report of 23 May 2023, from an investigation opened in 2018, named 451 Catholic clerics and religious brothers who abused at least 1,997 children in Illinois' six dioceses over decades. Before the inquiry the dioceses had publicly listed 103 substantiated abusers.","cite":"Illinois Attorney General, Report on Catholic Clergy Child Sex Abuse in Illinois, 23 May 2023","url":"https://illinoisattorneygeneral.gov/news/story/attorney-general-raoul-releases-report-concluding-multi-year-investigation-into-child-sex-abuse-by-members-of-catholic-clergy-in-illinois","url2":"","net":null},{"id":"usa-john-jay-2004","n":"John Jay College study — US Catholic clergy 1950–2002","iso":"USA","also":[],"place":"United States (commissioned by US bishops, Washington DC)","ll":[-77.0369,38.9072],"llc":false,"y0":1950,"y1":2002,"yf":2004,"fr":null,"set":"religious","kind":"sexual abuse","st":"acknowledged","v":10667,"vn":"10,667 individuals reported abuse to bishops; authors say true number likely higher","off":4392,"who":"US Conference of Catholic Bishops (commissioned study)","offc":false,"cover":"Of accused priests whose cases reached police, only one in three was charged; 3% served prison time","d":"The John Jay College of Criminal Justice study, commissioned by the US bishops and released 27 February 2004, counted 4,392 priests and deacons (about 4% of clergy) accused of abusing 10,667 minors between 1950 and 2002. Reported abuse peaked in the 1970s; one-third of allegations were made only in 2002–03. 149 priests with more than 10 allegations each accounted for 27% of allegations. Costs to the church were put at $472 million at the time.","cite":"John Jay College, 'The Nature and Scope of Sexual Abuse of Minors by Catholic Priests and Deacons in the United States 1950–2002', 2004, as summarised by America magazine","url":"https://www.americamagazine.org/from-our-archives/2004/03/22/facts-myths-and-questions/","url2":"https://www.bishop-accountability.org/reports/2004_02_27_JohnJay_original/exec.pdf","net":null},{"id":"usa-maryland-ag-2023","n":"Maryland Attorney General — Archdiocese of Baltimore","iso":"USA","also":[],"place":"Baltimore, Maryland","ll":[-76.6122,39.2904],"llc":false,"y0":1940,"y1":2002,"yf":2023,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":600,"vn":"'Over 600' children; report says true number 'likely far higher'","off":156,"who":"Roman Catholic Archdiocese of Baltimore","offc":false,"cover":"Archdiocese often failed to report to authorities or remove abusers; some accused allowed to retire with support; post-2002 public list omitted known abusers","d":"The Maryland Attorney General's report, released in redacted form on 5 April 2023, identified 156 priests and others associated with the Archdiocese of Baltimore who abused more than 600 children over 80 years. Attorney General Anthony Brown described 'repeated coverup' by the church. A judge ordered the names and titles of 37 people redacted.","cite":"Maryland Office of the Attorney General, Report on Child Sexual Abuse in the Archdiocese of Baltimore, 5 April 2023, as reported by Fortune/AP","url":"https://fortune.com/2023/04/05/baltimore-catholic-church-sex-abuse-maryland-attorney-general-report","url2":"","net":null},{"id":"usa-missouri-ag-2019","n":"Missouri Attorney General — four Catholic dioceses","iso":"USA","also":[],"place":"St. Louis, Missouri","ll":[-90.1994,38.627],"llc":false,"y0":1945,"y1":2018,"yf":2019,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":163,"who":"Archdiocese of St. Louis and dioceses of Kansas City–St. Joseph, Jefferson City, Springfield–Cape Girardeau","offc":false,"cover":"","d":"Attorney General Eric Schmitt reported on 13 September 2019 on a review, opened in August 2018, of records of more than 2,000 priests who served in Missouri since 1945. It found 163 credible allegations of abuse or misconduct against minors by diocesan priests and deacons; 83 of the accused had died and the statute of limitations had expired for 46 alleged crimes. Twelve former priests were referred for prosecution.","cite":"Missouri Attorney General's Office, clergy abuse report, 13 September 2019, as reported by NPR/KPBS","url":"https://www.kpbs.org/news/2019/09/13/missouri-ag-refers-12-ex-priests-for-prosecution","url2":"","net":null},{"id":"usa-michigan-ag-2019","n":"Michigan Attorney General — clergy abuse investigation","iso":"USA","also":[],"place":"Michigan (seven dioceses)","ll":[-84.5555,42.7325],"llc":false,"y0":1950,"y1":2019,"yf":2019,"fr":null,"set":"religious","kind":"sexual abuse","st":"charged","v":552,"vn":"552 victims identified by December 2019; AG expected 'several thousand' by the end","off":270,"who":"Catholic dioceses of Michigan","offc":false,"cover":"","d":"Attorney General Dana Nessel said on 23 December 2019 that the state investigation had identified 270 priests alleged to have abused 552 victims. Seven priests had been charged in 2019, two of whom had pleaded guilty. Most cases could not be prosecuted because of statutes of limitations.","cite":"Detroit News, 23 December 2019, reposted by BishopAccountability.org; Michigan AG press releases","url":"https://www.bishop-accountability.org/?p=131938","url2":"https://www.michigan.gov/ag/news/press-releases/2019/12/27/ag-nessel-seven-priests-charged-in-2019-more-to-come","net":null},{"id":"gum-apuron-agana","n":"Archdiocese of Agaña — Archbishop Apuron and bankruptcy","iso":"GUM","also":[],"place":"Hagåtña, Guam","ll":[144.7502,13.4745],"llc":false,"y0":1950,"y1":2016,"yf":2019,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":null,"vn":"More than 220 former altar boys, students and Boy Scouts sued","off":35,"who":"Archdiocese of Agaña; former Archbishop Anthony Apuron","offc":false,"cover":"","d":"A Vatican tribunal of the Congregation for the Doctrine of the Faith found former Archbishop Anthony Apuron guilty of some charges including sexual abuse of minors in March 2018; the appeal was rejected in February 2019. He was barred from office and from living in Guam but not laicised; he denies the allegations. The archdiocese filed for bankruptcy in January 2019 facing more than 200 lawsuits naming 35 clergy, teachers and scoutmasters. Guam lifted the civil statute of limitations in 2016.","cite":"Catholic News Agency/EWTN News, 8 August 2019; America magazine, 9 November 2018","url":"https://www.ewtnnews.com/world/us/guam-archdiocese-faces-more-than-200-lawsuits-amid-bankruptcy","url2":"https://www.americamagazine.org/faith/2018/11/09/guams-agana-archdiocese-file-bankruptcy","net":null},{"id":"can-mount-cashel-hughes","n":"Mount Cashel Orphanage — Hughes Royal Commission","iso":"CAN","also":[],"place":"St. John's, Newfoundland","ll":[-52.7126,47.5615],"llc":false,"y0":null,"y1":1989,"yf":1992,"fr":null,"set":"religious","kind":"sexual abuse","st":"convicted","v":null,"vn":"","off":11,"who":"Congregation of Christian Brothers, Mount Cashel Orphanage","offc":true,"cover":"Inquiry found officials transferred offenders and covered up the abuse; insufficient evidence to charge church and government officials with obstruction","d":"The provincial Royal Commission led by Samuel Hughes (begun 1 June 1989, reported 1991–92) examined abuse of boys by Christian Brothers at Mount Cashel orphanage, which closed in 1990, and the justice system's response. It found officials had transferred offenders and covered up the abuse. Eleven Christian Brothers were convicted, with sentences from 4 months to 11 years. The Brothers apologised in April 1992; the Newfoundland government paid $11.5 million in 1996.","cite":"Royal Commission of Inquiry into the Response of the Newfoundland Criminal Justice System to Complaints (Hughes Inquiry), 1991–92","url":"https://en.wikipedia.org/wiki/Hughes_Inquiry","url2":"https://bishop-accountability.org/reports/1991_Hughes_Mount_Cashel/1991_Hughes_Volume_1_Royal_Commission_of_Inquiry_Report.pdf","net":null},{"id":"can-winter-commission","n":"Winter Commission — Archdiocese of St. John's","iso":"CAN","also":[],"place":"St. John's, Newfoundland","ll":[-52.7126,47.5615],"llc":false,"y0":null,"y1":null,"yf":1990,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":null,"who":"Roman Catholic Archdiocese of St. John's; Archbishop Alphonsus Penney","offc":false,"cover":"Report assigned Archbishop Penney part of the blame for covering up abuse","d":"Archbishop Alphonsus Penney commissioned former Lieutenant Governor Gordon Winter in May 1989 to inquire into sexual abuse of children by clergy of the archdiocese. The 1990 report assigned Penney part of the blame for covering up abuse, and he resigned after its release.","cite":"Report of the Archdiocesan Commission of Enquiry into the Sexual Abuse of Children by Members of the Clergy (Winter Report), 1990","url":"https://en.wikipedia.org/wiki/Winter_Commission","url2":"https://bishop-accountability.org/reports/1990_06_Winter_St_Johns/1990_Winter_Volume_1.pdf","net":null},{"id":"aus-royal-commission-catholic","n":"Royal Commission — Catholic Church data, Australia","iso":"AUS","also":[],"place":"Sydney (Royal Commission hearings)","ll":[151.2093,-33.8688],"llc":false,"y0":1950,"y1":2015,"yf":2017,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":4444,"vn":"4,444 people reported abuse at more than 1,000 Catholic institutions (claims 1980–2015)","off":1880,"who":"Catholic Church in Australia, incl. St John of God Brothers (40.4% of brothers accused)","offc":false,"cover":"","d":"Data presented to the Royal Commission into Institutional Responses to Child Sexual Abuse on 6 February 2017 showed 4,444 people reported abuse to Catholic authorities between 1980 and 2015, at more than 1,000 institutions, naming 1,880 alleged perpetrators. About 7% of priests who served between 1950 and 2010 were alleged perpetrators; 40.4% of St John of God Brothers were accused. Religious brothers (32%) and priests (30%) were the largest groups. The commission referred 309 cases to police.","cite":"Royal Commission into Institutional Responses to Child Sexual Abuse, Case Study 50 data, 6 February 2017, as reported by NPR","url":"https://www.kpbs.org/news/2017/02/06/australian-catholic-church-alleges-7-of-priests","url2":"","net":null},{"id":"aus-ballarat-ridsdale","n":"Diocese of Ballarat — Gerald Ridsdale and Royal Commission Case Study 28","iso":"AUS","also":[],"place":"Ballarat, Victoria","ll":[143.8503,-37.5622],"llc":false,"y0":1961,"y1":1988,"yf":2017,"fr":1975,"set":"religious","kind":"sexual abuse","st":"convicted","v":null,"vn":"Convicted of abusing more than 70 children; advocates estimate hundreds","off":1,"who":"Catholic Diocese of Ballarat; Bishop Ronald Mulkearns","offc":true,"cover":"Ridsdale moved through about 13 postings 1962–1991; Mulkearns knew by late 1975; a senior police officer in 1972 offered a detective promotion to stop investigating Monsignor John Day","d":"Gerald Ridsdale, ordained 1961, was convicted in a series of trials from 1993 of abusing more than 70 children; he died in prison in 2025. He was moved between parishes including Mildura, Swan Hill, Warrnambool, Apollo Bay, Edenhope and Mortlake, then to Sydney. The Royal Commission's Ballarat report of 6 December 2017 found Bishop Mulkearns knew of his offending by late 1975 and still reappointed him, a 'catastrophic' failure. It also found police obstruction of a 1972 investigation of Monsignor John Day.","cite":"Royal Commission into Institutional Responses to Child Sexual Abuse, Report of Case Study 28 (Ballarat), December 2017; The Courier (Ballarat)","url":"https://www.bishop-accountability.org/2017/12/ballarat-catholic-diocese-catastrophic-abuse-royal-commission-finds/","url2":"https://www.thecourier.com.au/story/4596451/the-dark-history-of-ballarats-worst-paedophile-priest/","net":null},{"id":"aus-pell-acquitted","n":"Cardinal George Pell — convicted 2018, acquitted 2020","iso":"AUS","also":[],"place":"St Patrick's Cathedral, Melbourne","ll":[144.9758,-37.81],"llc":false,"y0":1996,"y1":1996,"yf":2020,"fr":null,"set":"religious","kind":"sexual abuse","st":"acquitted","v":null,"vn":"","off":null,"who":"Cardinal George Pell (former Archbishop of Melbourne, Vatican treasurer)","offc":false,"cover":"","d":"A Melbourne jury convicted Cardinal George Pell in December 2018 on five charges relating to two choirboys at St Patrick's Cathedral in 1996. On 7 April 2020 the High Court of Australia unanimously quashed the convictions and entered acquittals; he had served more than 400 days in prison. Separately, Royal Commission findings released in May 2020 said Pell was aware of abuse by clergy in the 1970s; he disputed this. He died in 2023.","cite":"Pell v The Queen [2020] HCA 12, 7 April 2020, as reported by 1News","url":"https://www.1news.co.nz/2020/04/07/australias-high-court-quashes-cardinal-george-pells-child-sexual-abuse-convictions/","url2":"https://www.standard.net.au/story/6748441/royal-commission-finds-pell-knew-about-notorious-pedophile/","net":null},{"id":"nzl-abuse-in-care-catholic","n":"Royal Commission into Abuse in Care — Catholic institutions","iso":"NZL","also":[],"place":"New Zealand (incl. Marylands School, Christchurch)","ll":[172.6362,-43.5321],"llc":false,"y0":1950,"y1":1999,"yf":2024,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":null,"vn":"About 200,000 abused across all state and faith-based care 1950–2019 (not Catholic alone); church data showed 14% of NZ clergy accused 1950–1999","off":null,"who":"Catholic Church in Aotearoa New Zealand; St John of God Brothers at Marylands School","offc":false,"cover":"Church relied on psychiatrists' opinions to transfer abusers to other ministries where they reoffended; commission recommended investigating priests transferred to Papua New Guinea","d":"The Royal Commission's final report, Whanaketia, published 24 July 2024, found about 200,000 people were abused in state and faith-based care from 1950 to 2019. It found Catholic responses inadequate, noting a 2020 church briefing that 14% of clergy were accused over 1950–1999, and singled out Marylands School in Christchurch for some of the highest levels of sexual abuse. It found abusers were transferred to other ministries and recommended an inquiry into priests sent to Papua New Guinea.","cite":"Royal Commission of Inquiry into Abuse in Care, Whanaketia, 24 July 2024, as reported by EWTN/CNA","url":"https://www.ewtnnews.com/world/asia-pacific/new-zealand-commission-finds-catholic-church-guilty-of-inadequate-responses-to-abuse-and-neglect","url2":"https://www.aljazeera.com/news/2024/7/24/new-zealand-probe-finds-200000-children-vulnerable-adults-abused-in-care","net":null},{"id":"gbr-iicsa-catholic-2020","n":"IICSA — Roman Catholic Church in England and Wales","iso":"GBR","also":[],"place":"London (England and Wales)","ll":[-0.1276,51.5072],"llc":false,"y0":1970,"y1":2015,"yf":2020,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":null,"vn":"More than 900 complaints involving over 3,000 instances of abuse, 1970–2015","off":null,"who":"Catholic Church in England and Wales; Cardinal Vincent Nichols","offc":false,"cover":"Accused priests reassigned to other parishes; Holy See and Apostolic Nuncio refused to provide a witness statement","d":"The Independent Inquiry into Child Sexual Abuse reported on 10 November 2020 that the Church in England and Wales received more than 900 complaints involving over 3,000 instances of child sexual abuse between 1970 and 2015, with more than 100 allegations a year since 2016. It found the church put its reputation before children and criticised Cardinal Nichols. The Holy See declined to provide a witness statement.","cite":"IICSA, The Roman Catholic Church: Safeguarding in the Roman Catholic Church in England and Wales, 10 November 2020","url":"https://www.iicsa.org.uk/news/inquiry-finds-catholic-church-prioritised-reputation-over-welfare-children","url2":"","net":null},{"id":"gbr-iicsa-ampleforth-downside","n":"IICSA — Ampleforth and Downside Benedictine schools","iso":"GBR","also":[],"place":"Ampleforth, North Yorkshire; Downside, Somerset","ll":[-1.1056,54.2016],"llc":false,"y0":1960,"y1":2010,"yf":2018,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":10,"who":"English Benedictine Congregation — Ampleforth Abbey and Downside Abbey schools","offc":false,"cover":"Both institutions for decades avoided giving police and social services information; 'tell them nothing' approach after 2001","d":"The IICSA report of 9 August 2018 found a culture of acceptance of abuse at Ampleforth and Downside, where children as young as seven and eleven were abused over about four decades. Ten people linked to the schools, mostly monks, were convicted or cautioned for sexual or indecent-image offences. Both abbeys tried for decades to avoid passing information to police and social services.","cite":"IICSA, Ampleforth and Downside (English Benedictine Congregation case study), 9 August 2018; RTÉ","url":"https://www.iicsa.org.uk/news/inquiry-publishes-report-ampleforth-and-downside","url2":"https://www.rte.ie/news/uk/2018/0809/984037-uk-abuse-report","net":null},{"id":"gbr-iicsa-birmingham","n":"IICSA — Archdiocese of Birmingham","iso":"GBR","also":[],"place":"Birmingham","ll":[-1.8904,52.4862],"llc":false,"y0":1930,"y1":2018,"yf":2019,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":null,"vn":"More than 130 allegations","off":78,"who":"Roman Catholic Archdiocese of Birmingham","offc":false,"cover":"Fr James Robinson moved parish after 1980s complaints, police not told; he fled to the US in 1985 and received archdiocesan payments for seven years; the Vicar General helped Fr Samuel Penney avoid arrest and leave the UK","d":"The IICSA case study report of 20 June 2019 found more than 130 allegations against 78 people associated with the archdiocese since the 1930s. It examined priests James Robinson, Samuel Penney and John Tolkien. Robinson was moved to another parish after complaints in the 1980s without police being told, then fled to the US in 1985 while still receiving archdiocesan support; he was later extradited and jailed for 21 years.","cite":"IICSA, Archdiocese of Birmingham Investigation Report, 20 June 2019","url":"https://www.iicsa.org.uk/news/inquiry-publishes-report-archdiocese-birmingham-case-study.html","url2":"","net":null},{"id":"nld-deetman-2011","n":"Deetman Commission — Catholic Church in the Netherlands","iso":"NLD","also":[],"place":"Utrecht (Dutch Bishops' Conference)","ll":[5.1214,52.0907],"llc":false,"y0":1945,"y1":1985,"yf":2011,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":null,"vn":"'Several tens of thousands' of children had unwanted sexual contact with church officials (survey estimate; other coverage cites 10,000–20,000)","off":800,"who":"Catholic dioceses and religious orders in the Netherlands","offc":false,"cover":"Policy of 'not hanging out the dirty washing'; bishops and officials knew and did not act","d":"The commission led by former minister Wim Deetman, set up by the church in March 2010, reported on 16 December 2011. It identified at least 800 priests, monks and other religious who abused children between 1945 and 1985, 105 of them still alive, and estimated tens of thousands of victims. It found bishops and officials knew of the abuse and followed a policy of avoiding scandal.","cite":"Commissie-Deetman, 'Seksueel misbruik van minderjarigen in de Rooms-Katholieke Kerk', 16 December 2011, as reported by DutchNews.nl","url":"https://www.dutchnews.nl/news/2011/12/commission_identifies_800_prie/","url2":"https://www.irishtimes.com/news/dutch-priests-abused-up-to-20-000-children-1.12577","net":null},{"id":"bel-adriaenssens-2010","n":"Adriaenssens commission and Vangheluwe resignation, Belgium","iso":"BEL","also":[],"place":"Brussels / Bruges","ll":[4.3517,50.8503],"llc":false,"y0":1950,"y1":1989,"yf":2010,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":475,"vn":"475 complaints in the first half of 2010; 13 suicides reported","off":102,"who":"Catholic Church in Belgium, about 29 religious orders; Bishop Roger Vangheluwe of Bruges","offc":false,"cover":"Judicial raid in June 2010 seized the commission's files (later ruled disproportionate); commission members resigned","d":"Bishop Roger Vangheluwe of Bruges resigned in April 2010 after admitting he abused his nephew from 1973 to 1986. The church-backed commission led by psychiatrist Peter Adriaenssens received 475 complaints in six months; its report of 10 September 2010 recorded 13 suicides linked to clerical abuse and 102 verified alleged abusers in about 29 orders. In June 2010 police raided church premises and seized the commission's files (Operation Chalice/Kelk); an appeals court later ruled the raids disproportionate.","cite":"Commission for the Treatment of Complaints of Sexual Abuse in a Pastoral Relationship (Adriaenssens report), 10 September 2010, as reported by RTÉ","url":"https://www.rte.ie/news/2010/0910/135472-church_belgium","url2":"","net":null},{"id":"deu-mhg-study-2018","n":"MHG study — German Bishops' Conference","iso":"DEU","also":[],"place":"Germany (presented in Fulda)","ll":[9.6755,50.5558],"llc":false,"y0":1946,"y1":2014,"yf":2018,"fr":null,"set":"religious","kind":"sexual abuse","st":"acknowledged","v":3677,"vn":"","off":1670,"who":"German Catholic dioceses","offc":false,"cover":"Researchers found personnel files had been destroyed or manipulated","d":"The study by researchers from Mannheim, Heidelberg and Giessen, commissioned by the German Bishops' Conference and presented on 25 September 2018, found 1,670 clerics (4.4% of clergy) accused of abusing 3,677 minors between 1946 and 2014. The authors called the figures conservative and found that personnel files had been destroyed or manipulated.","cite":"MHG study, 'Sexueller Missbrauch an Minderjährigen durch katholische Priester, Diakone und männliche Ordensangehörige', 25 September 2018, as reported by JURIST","url":"https://www.jurist.org/news/2018/09/germany-bishops-conference-study-finds-reports-of-sexual-abuse-against-1670-clerics","url2":"https://www.npr.org/2018/09/25/651528211/german-bishops-report-at-least-3-677-minors-were-abused-by-clerics","net":null},{"id":"gbr-iicsa-anglican","n":"IICSA — Anglican Church investigation report","iso":"GBR","also":[],"place":"England and Wales (Church of England, Church in Wales)","ll":[-0.1276,51.5072],"llc":false,"y0":1940,"y1":2018,"yf":2020,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":390,"who":"Church of England; Church in Wales","offc":false,"cover":"Inquiry found the Church gave 'excessive attention' to alleged perpetrators over victims, ignored safeguarding advice, and used forgiveness to justify failing to respond to allegations.","d":"The Independent Inquiry into Child Sexual Abuse published its Anglican Church investigation report on 6 October 2020. It counted 390 convicted offenders associated with the Church of England from the 1940s to 2018 and warned the true scale cannot be known. In 2018 alone, dioceses received 2,504 safeguarding concerns, 449 of them about recent child sexual abuse. It found deference to authority, clericalism and taboos about sexuality kept victims from disclosing, and that bishops kept safeguarding decision-making power.","cite":"IICSA, The Anglican Church: Safeguarding in the Church of England and the Church in Wales, 6 October 2020; Church Times, 9 October 2020","url":"https://www.churchtimes.co.uk/articles/2020/9-october/news/uk/iicsa-report-church-was-a-hiding-place-for-abusers","url2":"https://southwell.anglican.org/wp-content/uploads/2021/11/Summary-and-Recommendations-anglican-church-investigation-report-6-oct-2020.pdf","net":null},{"id":"gbr-chichester-diocese","n":"Diocese of Chichester — clergy abuse (IICSA case study)","iso":"GBR","also":[],"place":"Chichester, West Sussex","ll":[-0.7799,50.8365],"llc":false,"y0":1960,"y1":2011,"yf":null,"fr":1997,"set":"religious","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":null,"who":"Church of England, Diocese of Chichester","offc":true,"cover":"Clergy with known concerns (Rideout, Cotton, Graves, House) were given or kept permission to officiate; Cotton's prior conviction for indecent exposure involving a child sat in his diocesan file but was not shared with police; an archdeacon declined to report a serious indecent assault; Sussex Police dropped a 1997–98 investigation and later destroyed its records.","d":"IICSA found the Diocese of Chichester had more child sexual abuse convictions than any other Church of England diocese. Roy Cotton had been ordained in the 1960s despite a prior conviction involving a child. Sussex Police investigated Cotton and Colin Pritchard in 1997–98 without charges; when Northamptonshire Police revived the case in 2006, Sussex Police had destroyed its records. The diocese's 2008–09 Past Cases Review missed the scale of abuse, and real action against abusers began only with Operation Perry in 2011.","cite":"IICSA, Anglican Church Case Studies: Chichester/Peter Ball, conclusions","url":"https://www.iicsa.org.uk/reports/anglican-chichester-peter-ball/conclusions-and-recommendations/conclusions","url2":"","net":null},{"id":"gbr-peter-ball","n":"Bishop Peter Ball — conviction and Church collusion","iso":"GBR","also":[],"place":"Lewes and Gloucester dioceses","ll":[-2.2431,51.8642],"llc":false,"y0":1977,"y1":1992,"yf":2015,"fr":1992,"set":"religious","kind":"sexual abuse","st":"convicted","v":18,"vn":"18 young men at sentencing (2015); IICSA describes 17 teenagers and young men, 1977–1992","off":1,"who":"Church of England; 'Give a Year to God' scheme","offc":true,"cover":"Lambeth Palace received seven letters supporting complainant Neil Todd's allegations in 1992 but passed only the least incriminating one to police; Archbishop George Carey wrote to the Gloucestershire Chief Constable; Ball's twin brother, also a bishop, phoned potential complainants to dissuade them; Ball accepted a caution in 1992 and was soon returned to ministry, including work in schools.","d":"Peter Ball, former Bishop of Lewes and of Gloucester, ran a 'Give a Year to God' scheme for young men that the Church did not monitor. Gloucestershire police investigated in 1992 and he accepted a caution for one offence; IICSA found the Crown Prosecution Service advice to caution was wrong and other charges were possible. He pleaded guilty in 2015 and on 7 October 2015 was jailed for 32 months for offences against 18 young men over 15 years. Dame Moira Gibb's review 'An Abuse of Faith' (June 2017) found the Church colluded with Ball; Lord Carey stepped back from ministry. IICSA also noted the Duchy of Cornwall bought a property rented to Ball and his brother.","cite":"IICSA Chichester/Peter Ball conclusions; Gibb, An Abuse of Faith (GS Misc 1172), June 2017; sentencing coverage 7 October 2015","url":"https://www.iicsa.org.uk/reports/anglican-chichester-peter-ball/conclusions-and-recommendations/conclusions","url2":"https://www.churchofengland.org/sites/default/files/2018-01/gs-misc-1172-an-abuse-of-faith.pdf","net":null},{"id":"gbr-zwe-zaf-smyth","n":"John Smyth — Iwerne camps, Zimbabwe and South Africa (Makin Review)","iso":"GBR","also":["ZAF","ZWE"],"place":"Iwerne camps (Dorset) and Winchester College; later Zambesi Ministries camps, Zimbabwe; Cape Town","ll":[-2.1897,50.93],"llc":false,"y0":1973,"y1":2018,"yf":2024,"fr":1982,"set":"religious","kind":"sexual abuse","st":"inquiry","v":115,"vn":"Makin Review: between 115 and 130 boys and young men; at least 85 of them in Zimbabwe and South Africa (Church Times, citing the review)","off":1,"who":"Iwerne Trust (evangelical camps), Church of England; Zambesi Ministries (Zimbabwe); Anglican Church of Southern Africa","offc":false,"cover":"A 1982 internal Iwerne Trust report (the Ruston Report) described the beatings; the Makin Review found an 'active cover-up' by its recipients; police were not told until 2013. The review called Smyth 'a problem solved and exported to Africa' and found no evidence of proactive attempts to alert Zimbabwean authorities.","d":"John Smyth QC, chair of the Iwerne Trust 1974–81, beat and abused boys and young men he met through the evangelical Iwerne camps and Winchester College's Christian Forum. After the 1982 Ruston Report he moved to Zimbabwe in 1984, founding Zambesi Ministries camps for boys in 1986; a 16-year-old died at one of his camps in December 1992 and Smyth was arrested in 1997 but never charged anywhere. Refused re-entry to Zimbabwe, he moved to South Africa in 2001 and the review found abuse likely continued until his death in Cape Town on 11 August 2018. Keith Makin's review was published on 7 November 2024; Archbishop Justin Welby resigned on 12 November 2024.","cite":"Makin, Independent Learning Lessons Review: John Smyth QC (Church of England), published 7 November 2024; Church Times, 15 November 2024","url":"https://churchtimes.co.uk/articles/2024/15-november/news/world/archbishop-of-cape-town-makes-urgent-request-for-details-of-smyth-s-activities-in-south-africa","url2":"https://en.wikipedia.org/wiki/Makin_Review","net":null},{"id":"aus-anglican-rc","n":"Royal Commission data — Anglican Church of Australia","iso":"AUS","also":[],"place":"Australia (all 23 dioceses)","ll":[133.7751,-25.2744],"llc":true,"y0":1950,"y1":2015,"yf":2017,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":1082,"vn":"1,082 complainants about 1,115 alleged incidents reported 1980–2015; some incidents dated back to 1950","off":702,"who":"Anglican Church of Australia","offc":false,"cover":"","d":"Data released at the Royal Commission into Institutional Responses to Child Sexual Abuse in March 2017 showed 1,082 people lodged complaints of child sexual abuse about 1,115 incidents in the Anglican Church of Australia between 1980 and 2015. The complaints identified 569 alleged perpetrators who were clergy, teachers or volunteers, plus 133 whose church roles were unknown (702 in total).","cite":"Royal Commission into Institutional Responses to Child Sexual Abuse, Case Study 52 data, March 2017; Gulf News/AP","url":"https://gulfnews.com/world/oceania/report-says-1100-complaints-of-child-abuse-made-against-australias-anglican-church-1.1995624","url2":"","net":null},{"id":"can-residential-protestant","n":"Canada residential schools run by Anglican, United and Presbyterian churches","iso":"CAN","also":[],"place":"Canada (residential schools nationwide)","ll":[-106.3468,56.1304],"llc":true,"y0":null,"y1":null,"yf":null,"fr":null,"set":"religious","kind":"sexual abuse + child removal","st":"inquiry","v":null,"vn":"About 37,000 of roughly 80,000 Common Experience Payment applicants also claimed sexual abuse, serious physical abuse or other wrongful acts (all churches combined); about 180,000 First Nations, Inuit and Métis children attended over 150 years","off":null,"who":"Anglican Church of Canada (ran over 30 schools), United Church, Presbyterian Church, with the Catholic Church and federal government","offc":true,"cover":"The schools were a federal government system run by churches.","d":"Canada's Indian residential schools were run for the federal government by the Anglican, Catholic, Presbyterian and United churches; the Anglican Church of Canada operated more than 30. In April 2013 Truth and Reconciliation Commission chair Justice Murray Sinclair said about 37,000 former students had filed claims for sexual abuse, serious physical abuse or other wrongful acts, and asked the public to imagine 'a school where half of the students suffered sexual and physical abuse'. The TRC's final report followed in 2015.","cite":"Anglican Journal, 25 April 2013 (TRC Quebec National Event)","url":"https://anglicanjournal.com/half-of-residential-school-students-abused-says-sinclair/","url2":"","net":null},{"id":"usa-sbc-abuse-of-faith","n":"Southern Baptist Convention — 'Abuse of Faith' investigation","iso":"USA","also":[],"place":"Southern Baptist churches nationwide (most convicted offenders in Texas)","ll":[-95.3698,29.7604],"llc":false,"y0":1998,"y1":2018,"yf":2019,"fr":null,"set":"religious","kind":"sexual abuse","st":"reported","v":700,"vn":"'more than 700' victims over about 20 years","off":380,"who":"Southern Baptist Convention churches","offc":false,"cover":"","d":"The Houston Chronicle and San Antonio Express-News published 'Abuse of Faith' on 10–11 February 2019. They found about 380 Southern Baptist ministers and volunteers had faced allegations of sexual misconduct over the previous 20 years, with more than 700 victims. Many pleaded guilty or were convicted, more from Texas than any other state.","cite":"Houston Chronicle / San Antonio Express-News, 'Abuse of Faith', February 2019; Baptist Standard, 11 February 2019","url":"https://baptiststandard.com/news/baptists/abuse-of-faith-investigation-reveals-700-victims","url2":"","net":null},{"id":"usa-sbc-guidepost","n":"Southern Baptist Convention — Guidepost report and secret list of accused ministers","iso":"USA","also":[],"place":"SBC Executive Committee, Nashville, Tennessee","ll":[-86.7816,36.1627],"llc":false,"y0":2000,"y1":2021,"yf":2022,"fr":null,"set":"religious","kind":"sexual abuse","st":"acknowledged","v":null,"vn":"The list released on 26 May 2022 had 703 entries of accused ministers, mostly 2000–2019","off":703,"who":"Southern Baptist Convention Executive Committee","offc":false,"cover":"Former Executive Committee officials D. August Boto and Roger Oldham kept a private list of abusive ministers, but no one acted to keep them out of SBC pulpits; survivors met 'resistance, stonewalling, and even outright hostility' and were told church autonomy prevented action; a few senior leaders and outside counsel focused on avoiding liability.","d":"Guidepost Solutions, hired after SBC delegates demanded an outside probe in 2021, released its report on 22 May 2022. It found a few senior Executive Committee leaders had for about two decades controlled the response to abuse reports to limit legal liability, ignoring or disbelieving survivors. The Executive Committee then published the previously secret list, 205 pages and 703 entries, on 26 May 2022.","cite":"Guidepost Solutions report, 22 May 2022; AP (Spokesman-Review), 23 May 2022; WSOC-TV/AP, 27 May 2022","url":"https://www.spokesman.com/stories/2022/may/23/report-top-southern-baptists-stonewalled-sex-abuse/","url2":"https://www.wsoctv.com/news/local/southern-baptist-convention-release-names-703-ministers-accused-sexual-abuse/KQF4ACJLZVGQ3MQL4S5BDFESCQ/","net":null},{"id":"aus-hillsong-frank-houston","n":"Frank Houston — Royal Commission Case Study 18 (Assemblies of God / Hillsong)","iso":"AUS","also":["NZL"],"place":"Sydney, NSW","ll":[151.2093,-33.8688],"llc":false,"y0":1970,"y1":null,"yf":2015,"fr":1999,"set":"religious","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":null,"who":"Assemblies of God in Australia (now Australian Christian Churches); Hillsong Church","offc":false,"cover":"When allegations surfaced in 1999, Brian Houston, then National President of the Assemblies of God and Frank Houston's son, confronted his father, who confessed; Brian Houston and the National Executive did not refer the matter to police.","d":"Pastor Frank Houston sexually abused a young boy in the 1970s. The Royal Commission's Case Study 18 findings (November 2015) found that Brian Houston and the national executive did not report the allegations to police when they emerged in 1999, and that Brian Houston had a conflict of interest as both national president and the son of the alleged perpetrator. Frank Houston died in 2004 without being charged.","cite":"Royal Commission into Institutional Responses to Child Sexual Abuse, Case Study 18 findings, November 2015","url":"https://www.childabuseroyalcommission.gov.au/media-releases/findings-released-australian-christian-churches-and-affiliated-pentecostal-churches","url2":"","net":null},{"id":"aus-brian-houston-acquitted","n":"Brian Houston acquitted of concealing father's abuse","iso":"AUS","also":[],"place":"Downing Centre Local Court, Sydney","ll":[151.2069,-33.8774],"llc":false,"y0":null,"y1":null,"yf":2023,"fr":null,"set":"religious","kind":"sexual abuse","st":"acquitted","v":null,"vn":"","off":null,"who":"Hillsong Church","offc":false,"cover":"","d":"Hillsong founder Brian Houston was charged with concealing a serious indictable offence of another person, namely his father Frank Houston's abuse of a boy in the 1970s, which court papers said he knew of by 1999. On 17 August 2023 Magistrate Gareth Christofi found him not guilty, ruling he had a reasonable excuse for not reporting.","cite":"Religion News Service, 16–17 August 2023","url":"https://religionnews.com/2023/08/16/brian-houston-acquitted-by-australian-court-in-sexual-abuse-cover-up-case/","url2":"","net":null},{"id":"deu-ekd-forum","n":"ForuM study — German Protestant Church (EKD)","iso":"DEU","also":[],"place":"EKD, Hanover (all regional churches and Diakonie)","ll":[9.732,52.3759],"llc":false,"y0":1946,"y1":2020,"yf":2024,"fr":null,"set":"religious","kind":"sexual abuse","st":"acknowledged","v":2225,"vn":"2,225 documented victims in files reviewed; researchers estimated up to 9,355 minors","off":1259,"who":"Evangelische Kirche in Deutschland (EKD) and Diakonie","offc":false,"cover":"Researchers said regional churches delivered documents slowly despite a contract, so the study could not be completed; co-author Martin Wazlawik called the figures 'the tip of the tip of the iceberg'.","d":"The ForuM study, commissioned by the EKD in 2020 and led by Hanover University of Applied Sciences and Arts, was released on 25 January 2024. Files reviewed showed 2,225 victims and 1,259 potential perpetrators among ministers, employees and volunteers since 1946, with a projected estimate of up to 9,355 abused minors. EKD head Kirsten Fehrs called it a 'massive failure' toward victims.","cite":"ForuM research network, 25 January 2024; AFP (Citizen Digital), 25 January 2024","url":"https://citizen.digital/article/thousands-of-minors
