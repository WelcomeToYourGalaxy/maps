-abused-by-german-protestant-church-study-n335532","url2":"https://www.fh-potsdam.de/en/news-media/news/forum-research-network-presents-research-findings-sexualised-violence-protestant-churches","net":null},{"id":"aus-jw-rc-cs29","n":"Jehovah's Witnesses — Royal Commission Case Study 29","iso":"AUS","also":[],"place":"Watchtower Australia branch, Sydney region","ll":[150.8667,-34.0],"llc":false,"y0":1950,"y1":2015,"yf":2016,"fr":null,"set":"religious","kind":"sexual abuse","st":"inquiry","v":null,"vn":"","off":1006,"who":"Watch Tower Bible and Tract Society of Australia (Jehovah's Witnesses)","offc":false,"cover":"None of the 1,006 alleged perpetrators recorded since 1950 was reported to police by the church. The 'two-witness rule' required two witnesses before elders' judicial committees could act, blocking 125 allegations; 401 members were expelled after internal hearings and 230 later readmitted.","d":"At hearings in July–August 2015, the Royal Commission was told the Watch Tower Society's files held 1,006 alleged perpetrators of child sexual abuse since 1950, including 579 confessions, and that none had been reported to secular authorities. The Commission referred 514 alleged perpetrators to police. Its November 2016 report found the organisation did not respond adequately to child sexual abuse and that its two-witness rule showed a serious lack of understanding of abuse.","cite":"Royal Commission into Institutional Responses to Child Sexual Abuse, Case Study 29 report, November 2016; AFP (News24), 27 July 2015","url":"https://www.news24.com/world/news/jehovahs-witnesses-hid-a-1-000-child-sex-abuse-cases-20150727-2","url2":"https://en.wikipedia.org/wiki/Jehovah%27s_Witnesses%27_handling_of_child_sex_abuse","net":null},{"id":"usa-jw-conti","n":"Conti v. Watchtower — Fremont congregation, California","iso":"USA","also":[],"place":"Fremont / Alameda County, California","ll":[-121.9886,37.5485],"llc":false,"y0":null,"y1":null,"yf":2015,"fr":null,"set":"religious","kind":"sexual abuse","st":"settled","v":1,"vn":"","off":null,"who":"Watchtower Bible and Tract Society (Jehovah's Witnesses)","offc":false,"cover":"","d":"In June 2012 an Alameda County jury found the Watchtower Society liable for abuse of a girl by a congregation member and awarded punitive damages, later reduced. In April 2015 the California appeals court reversed punitive damages but upheld $2.8 million in compensatory damages; the case settled during further appeal. Other US civil cases followed, including a $13.5 million San Diego judgment in 2014 (vacated 2016, settled 2018) and a $35 million Montana verdict in 2018 reversed in 2020.","cite":"Doe (Conti) v. Watchtower, California Court of Appeal, April 2015 (summarised in Wikipedia with citations)","url":"https://en.wikipedia.org/wiki/Jehovah%27s_Witnesses%27_handling_of_child_sex_abuse","url2":"","net":null},{"id":"usa-flds-warren-jeffs","n":"Warren Jeffs — FLDS child 'marriages' conviction","iso":"USA","also":[],"place":"Yearning For Zion ranch, Eldorado, Texas; Short Creek (Colorado City AZ / Hildale UT)","ll":[-100.6009,30.8602],"llc":false,"y0":2002,"y1":2008,"yf":2011,"fr":null,"set":"religious","kind":"sexual abuse","st":"convicted","v":2,"vn":"Texas conviction concerned girls aged 12 and 15","off":1,"who":"Fundamentalist Church of Jesus Christ of Latter-Day Saints (FLDS)","offc":false,"cover":"","d":"FLDS president Warren Jeffs was added to the FBI Ten Most Wanted list on 6 May 2006 and arrested in Nevada on 28 August 2006. A 2007 Utah conviction for accomplice to rape was reversed in 2010, and Arizona charges were dismissed in 2010. In August 2011 a Texas jury convicted him of two counts of sexual assault of a child, girls aged 12 and 15 he had taken as 'spiritual wives', and he was sentenced to life plus 20 years. Texas authorities had raided the YFZ ranch on 7 April 2008 and taken custody of about 416 children, who were later returned after courts found the removal unjustified.","cite":"AP, 4–9 August 2011; Wikipedia 'Warren Jeffs' (index)","url":"https://www.washingtontimes.com/news/2011/aug/9/polygamist-leader-jeffs-faces-possible-life-prison/","url2":"https://en.wikipedia.org/wiki/Warren_Jeffs","net":null},{"id":"can-bountiful-blackmore-child-bride","n":"Bountiful, B.C. — parents convicted of taking 13-year-old to marry Warren Jeffs","iso":"CAN","also":["USA"],"place":"Bountiful, near Creston, British Columbia","ll":[-116.55,49.07],"llc":false,"y0":2004,"y1":2004,"yf":2017,"fr":null,"set":"religious","kind":"trafficking + sexual exploitation","st":"convicted","v":1,"vn":"","off":2,"who":"FLDS, Bountiful community","offc":false,"cover":"","d":"In February 2017 a B.C. Supreme Court judge in Cranbrook convicted Brandon James Blackmore and Emily Gail Blackmore of removing a child from Canada for sexual purposes: in 2004 they took their 13-year-old daughter to the Utah–Arizona line to be married to Warren Jeffs, then 48. Both were jailed in August 2017. In the same trial James Oler was acquitted of a related charge.","cite":"Salt Lake Tribune, 7 February 2017; AP, 11 August 2017","url":"https://sltrib.com/news/polygamy/2017/02/07/canadian-parents-convicted-of-taking-daughter-to-marry-warren-jeffs-receive-mix-of-sympathy-and-scorn","url2":"https://www.washingtontimes.com/news/2017/aug/11/jail-sentence-for-2-members-of-polygamous-sect-in-/","net":null},{"id":"can-oler-child-removal","n":"James Oler — removing a 15-year-old from Canada to marry","iso":"CAN","also":["USA"],"place":"Bountiful, British Columbia","ll":[-116.55,49.07],"llc":false,"y0":2004,"y1":2004,"yf":2019,"fr":null,"set":"religious","kind":"trafficking + sexual exploitation","st":"convicted","v":1,"vn":"","off":1,"who":"FLDS, Bountiful community","offc":false,"cover":"","d":"Former FLDS Bountiful bishop James Oler was first acquitted in 2017; the B.C. Court of Appeal ordered a new trial. In May 2019 he was found guilty of removing a child from Canada, having taken a 15-year-old girl to the United States in 2004 to be married to an older FLDS member. On 29 August 2019 he was sentenced to 12 months in jail and 18 months' probation. Separately, Oler (5 wives) and Winston Blackmore (24 wives, 1990–2014) were convicted of polygamy in July 2017.","cite":"CBC News, 29 August 2019; RNZ/AFP, 25 July 2017","url":"https://www.cbc.ca/lite/story/1.5264098","url2":"https://www.rnz.co.nz/news/world/335801/man-with-24-wives-found-guilty-of-polygamy","net":null},{"id":"aus-isr-malka-leifer","n":"Malka Leifer — Adass Israel School, Melbourne","iso":"AUS","also":["ISR"],"place":"Adass Israel School, Elsternwick, Melbourne","ll":[145.0005,-37.8847],"llc":false,"y0":2003,"y1":2007,"yf":2023,"fr":2008,"set":"religious","kind":"sexual abuse","st":"convicted","v":null,"vn":"Warrant listed at least eight pupils; convicted over abuse of two sisters","off":1,"who":"Adass Israel School (ultra-Orthodox community school)","offc":true,"cover":"In March 2008, after a teacher confronted her, the school arranged and paid for a 1:20 a.m. flight to Israel for Leifer and four of her children without telling police. In Israel, then deputy health minister Yaakov Litzman pressured ministry staff to alter psychiatric evaluations so she would appear unfit for extradition; her lawyers sought more than 70 hearings and appeals.","d":"Headmistress Malka Leifer abused pupils at Melbourne's ultra-Orthodox Adass Israel School between about 2003 and 2007. The school flew her to Israel in March 2008. Australia issued a warrant in 2014 for 74 offences involving at least eight pupils; she was arrested in Israel in August 2014, found in 2019 to have faked mental illness, and extradited on 25 January 2021. On 3 April 2023 a Melbourne jury found her guilty of 18 charges including rape, and in August 2023 she was sentenced to 15 years. In 2015 the Supreme Court of Victoria had ordered the school and Leifer to pay a former pupil about AU$1.27 million.","cite":"County Court of Victoria verdict 3 April 2023 (Al Jazeera); Wikipedia 'Malka Leifer affair' (index)","url":"https://www.aljazeera.com/news/2023/4/3/australian-school-principal-malka-leifer-guilty-of-sexual-abuse","url2":"https://en.wikipedia.org/wiki/Malka_Leifer_affair","net":null},{"id":"isr-litzman-leifer","n":"Yaakov Litzman — breach of trust for shielding Malka Leifer","iso":"ISR","also":["AUS"],"place":"Jerusalem Magistrate's Court","ll":[35.2137,31.7683],"llc":false,"y0":2017,"y1":null,"yf":2022,"fr":null,"set":"religious","kind":"sexual abuse","st":"convicted","v":null,"vn":"","off":1,"who":"Israeli Ministry of Health; ultra-Orthodox Agudat Yisrael party","offc":true,"cover":"A government minister pressured ministry psychiatrists to alter evaluations of an extradition suspect.","d":"Former Israeli health minister Yaakov Litzman signed a plea deal in January 2022 admitting breach of trust for pressuring Health Ministry employees to change psychiatric evaluations so that Malka Leifer would appear unfit to stand extradition trial. He resigned from the Knesset in June 2022 and on 8 August 2022 the Jerusalem Magistrate's Court sentenced him to eight months' probation and a fine of about US$900. Australian Jewish groups condemned the deal as lenient.","cite":"AP, 8 August 2022","url":"https://krdo.com/news/ap-national-news/2022/08/08/israeli-ex-minister-sentenced-over-australia-sex-abuse-case/","url2":"https://www.timesofisrael.com/litzman-gets-minor-fine-no-jail-for-shielding-alleged-pedophile-leifer-from-justice/amp/","net":null}],"N":[{"k":"kentler-network","n":"Kentler network (West German youth welfare and pedagogy)","type":"care","iso":"DEU","hq":"Berlin","ll":[13.405,52.52],"y0":1967,"y1":null,"status":"dissolved","d":"A network of academics, youth welfare officials and educators around sexologist Helmut Kentler who supported, legitimised or tolerated paedophile positions. Berlin youth authorities placed children with paedophile foster fathers from the late 1960s into the 2000s.","cite":"University of Hildesheim final report, February 2024","url":"https://www.news4teachers.de/2024/02/ganzes-netzwerk-wie-pflegekinder-jahrzehntelang-an-paedokriminelle-vermittelt-wurden/","reach":["DEU"],"reach_est":[],"reach_note":"University of Hildesheim research names Berlin, Göttingen, Hannover, Lüneburg, Tübingen and Heppenheim (Odenwaldschule) as central nodes."},{"k":"canada-residential-schools","n":"Indian Residential School system (Canada)","type":"state","iso":"CAN","hq":"Ottawa","ll":[-75.6972,45.4215],"y0":null,"y1":1997,"status":"dissolved","d":"Federally funded schools run by churches to assimilate First Nations, Métis and Inuit children; about 150,000 attended. Tens of thousands of claims of sexual and serious physical abuse were compensated under the 2007 settlement.","cite":"TRC Final Report 2015","url":"https://www.bishop-accountability.org/2015/12/by-the-numbers-truth-and-reconciliation-commission-final-report/","reach":["CAN"],"reach_est":[],"reach_note":""},{"k":"us-indian-boarding-schools","n":"Federal Indian boarding school system (US)","type":"state","iso":"USA","hq":"Washington, DC","ll":[-77.0369,38.9072],"y0":1819,"y1":1969,"status":"dissolved","d":"417 federal Indian boarding schools in 37 states or territories, 1819–1969, documented by the Department of the Interior with at least 973 child deaths and physical, sexual and emotional abuse.","cite":"DOI Federal Indian Boarding School Initiative Vol. II, 2024","url":"https://eji.org/news/federal-investigation-finds-at-least-973-children-died-in-federal-indian-boarding-schools/","reach":["USA"],"reach_est":[],"reach_note":""},{"k":"uk-child-migration","n":"British child migration programmes","type":"state","iso":"GBR","hq":"London","ll":[-0.1276,51.5072],"y0":1869,"y1":1970,"status":"dissolved","d":"UK government-backed schemes run by Barnardo's, the Fairbridge Society, Catholic agencies and others that sent children to Canada, Australia, New Zealand and Southern Rhodesia; IICSA found sexual abuse and failure to protect   el.querySelector(".wm").addEventListener("click", () => { if (w.prev) { Object.assign(el.style, w.prev); w.prev = null; } else { w.prev = { left: el.style.left, top: el.style.top, width: el.style.width, height: el.style.height }; Object.assign(el.style, { left: "8px", top: "8px", width: (innerWidth - 16) + "px", height: (innerHeight - 16) + "px" }); } });
  const head = el.querySelector(".wh");
  head.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;
    const r = el.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top; head.setPointerCapture(e.pointerId);
    const mv = (ev) => { el.style.left = Math.max(-r.width + 80, Math.min(innerWidth - 80, ev.clientX - dx)) + "px"; el.style.top = Math.max(0, Math.min(innerHeight - 36, ev.clientY - dy)) + "px"; };
    const up = () => { head.removeEventListener("pointermove", mv); head.removeEventListener("pointerup", up); };
    head.addEventListener("pointermove", mv); head.addEventListener("pointerup", up);
  });
  let last = ""; w.ro = new ResizeObserver(() => { const kk = w.body.clientWidth + "x" + w.body.clientHeight; if (kk !== last) { last = kk; if (id === "time" || id === "delay") drawWin(id); } }); w.ro.observe(w.body);
  $('#dockBtns [data-w="' + id + '"]').classList.add("on");
  drawWin(id);
}
function closeWin(id) { const w = WINS[id]; if (!w) return; w.ro.disconnect(); w.el.remove(); delete WINS[id]; tip(null); $('#dockBtns [data-w="' + id + '"]').classList.remove("on"); }
function drawCharts() { Object.keys(WINS).forEach(drawWin); }
function drawWin(id) { const w = WINS[id]; if (!w) return; if (id === "table") drawTable(w); else if (id === "time") drawTime(w); else if (id === "delay") drawDelay(w); else drawNetWin(w); }

const TCOLS = [["n", "Place"], ["all", "Combined (0–100)"], ["doc", "Documented (0–100)"], ["cases", "Cases"], ["offc", "Officials involved"], ["delay", "Median delay, years"], ["market", "Size of trade (0–100)"], ["shield", "Little in the way (0–100)"], ["ht25", "Trafficking (GI-TOC)"], ["tip", "US ranking"], ["prev", "Slavery /1,000"], ["ncm", "Online reports /100k"], ["sea", "Officials w/ criminals"], ["pats", "Patterns"]];
function cellVal(id, k) {
  const p = P[k];
  if (id === "n") return p.n;
  if (id === "cases") return casesOf(k).length || null;
  if (id === "pats") return PAT.filter((pt) => pt.countries.some((c) => c.iso3 === k)).length || null;
  if (id === "tip") return p.ind && p.ind.tip ? TIPL[p.ind.tip].replace("Special case (not ranked)", "Special") : null;
  const l = L.find((x) => x.id === id), r = l && l.get(p);
  return r && r.v != null ? r.v : null;
}
function drawTable(w) {
  const keys = ISOS.slice(), s = w.sort;
  if (s) keys.sort((a, b) => { const x = cellVal(s, a), y = cellVal(s, b); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * w.dir; });
  const cell = (id, k) => { const v = cellVal(id, k); if (v == null) return '<span class="mute">–</span>'; if (typeof v !== "number") return esc(v); const r = id === "all" ? allScore(P[k]) : null; return fmt(v, /^(all|doc|market|shield|delay|cases|offc|pats|ncm)$/.test(id) ? 0 : 1) + (r && r.est ? '<span class="mute">*</span>' : ''); };
  w.body.innerHTML = '<table class="all"><thead><tr>' + TCOLS.map((c) => '<th data-c="' + c[0] + '"' + (s === c[0] ? ' class="on"' : '') + '>' + esc(c[1]) + (s === c[0] ? (w.dir > 0 ? " ▲" : " ▼") : "") + '</th>').join("") + '</tr></thead><tbody>' +
    keys.map((k) => '<tr class="r' + (S.sel === k ? " sel" : "") + '" data-k="' + k + '">' + TCOLS.map((c) => '<td>' + cell(c[0], k) + '</td>').join("") + '</tr>').join("") + '</tbody></table>';
  w.body.querySelectorAll("th").forEach((th) => th.addEventListener("click", () => { const c = th.dataset.c; if (w.sort === c) w.dir = -w.dir; else { w.sort = c; w.dir = c === "n" ? 1 : -1; } drawTable(w); }));
  w.body.querySelectorAll("tr.r").forEach((tr) => tr.addEventListener("click", () => select(tr.dataset.k, true)));
  w.foot.textContent = "Click a heading to sort, a row to open the place. * the combined score is an estimate: nothing documented there in the chosen years. Case counts follow the years and kinds ticked in the key.";
}
function drawTime(w) {
  const Wd = w.body.clientWidth || 800, Ht = Math.max(220, (w.body.clientHeight || 400) - 44), m = { l: 40, r: 16, t: 14, b: 26 };
  const sers = D.SER || [];
  if (w.ser == null) w.ser = "cases";
  let ctl = '<div class="wctl"><select id="serSel"><option value="cases">Cases on this map, by decade and setting</option>' + sers.map((s, i) => '<option value="' + i + '"' + (String(w.ser) === String(i) ? " selected" : "") + '>' + esc(s.title) + '</option>').join("") + '</select></div>';
  let g = "", foot = "";
  if (w.ser === "cases") {
    const dec = {}, sel = S.sel;
    C.forEach((c) => { if (!caseOn(c)) return; if (sel && c.iso !== sel && !(c.also || []).includes(sel)) return; const y = c.y0 || c.yf || c.y1; if (!y) return; const d = Math.floor(y / 10) * 10; dec[d] = dec[d] || {}; dec[d][c.set] = (dec[d][c.set] || 0) + 1; });
    const ds = Object.keys(dec).map(Number).sort((a, b) => a - b);
    if (!ds.length) { w.body.innerHTML = ctl + '<p class="mean" style="padding:12px">No dated cases for this selection.</p>'; wireSer(w); return; }
    const d0 = ds[0], d1 = ds[ds.length - 1], n = (d1 - d0) / 10 + 1, bw = (Wd - m.l - m.r) / n;
    const tot = (d) => Object.values(dec[d] || {}).reduce((a, b) => a + b, 0), mx = Math.max(...ds.map(tot), 1);
    const Y = (v) => m.t + (Ht - m.t - m.b) * (1 - v / mx);
    [0, 0.5, 1].forEach((f) => { const v = Math.round(mx * f); g += '<line class="gl" x1="' + m.l + '" x2="' + (Wd - m.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text x="' + (m.l - 6) + '" y="' + (Y(v) + 3) + '" text-anchor="end">' + v + '</text>'; });
    for (let i = 0; i < n; i++) {
      const d = d0 + i * 10; let acc = 0;
      SETK.forEach((s) => { const v = (dec[d] || {})[s] || 0; if (!v) return; const y1 = Y(acc + v), y0 = Y(acc); g += '<rect x="' + (m.l + i * bw + 1).toFixed(1) + '" y="' + y1.toFixed(1) + '" width="' + Math.max(1, bw - 2).toFixed(1) + '" height="' + (y0 - y1).toFixed(1) + '" fill="' + setColor(s) + '"><title>' + d + 's · ' + esc(setLabel(s)) + ': ' + v + '</title></rect>'; acc += v; });
      if (n <= 16 || i % 2 === 0) g += '<text x="' + (m.l + i * bw + bw / 2) + '" y="' + (Ht - 8) + '" text-anchor="middle">' + d + 's</text>';
    }
    foot = (sel ? esc(P[sel].n) + ": " : "") + "Cases by the decade they began, colored by setting. Follows the years and kinds ticked in the key" + (sel ? "; close the country box to see every country." : "; open a country to see its own.") + " The rise in recent decades is partly the rise in looking: most inquiries are recent.";
  } else {
    const s = sers[+w.ser]; const rows = s.rows.filter((r) => r[1] != null);
    const x0 = rows[0][0], x1 = rows[rows.length - 1][0], mx = Math.max(...rows.map((r) => r[1]), 1), n = rows.length, bw = (Wd - m.l - m.r) / n;
    const Y = (v) => m.t + (Ht - m.t - m.b) * (1 - v / mx);
    [0, 0.5, 1].forEach((f) => { const v = mx * f; g += '<line class="gl" x1="' + m.l + '" x2="' + (Wd - m.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text x="' + (m.l - 6) + '" y="' + (Y(v) + 3) + '" text-anchor="end">' + (v >= 1e6 ? fmt(v / 1e6, 1) + "m" : v >= 1e3 ? fmt(v / 1e3, 0) + "k" : fmt(v, 0)) + '</text>'; });
    rows.forEach((r, i) => { g += '<rect x="' + (m.l + i * bw + 1).toFixed(1) + '" y="' + Y(r[1]).toFixed(1) + '" width="' + Math.max(1, bw - 2).toFixed(1) + '" height="' + (Y(0) - Y(r[1])).toFixed(1) + '" fill="var(--accent-hi)"><title>' + esc(r[0]) + ': ' + fmt(r[1], 0) + '</title></rect>'; if (n <= 24 || i % Math.ceil(n / 14) === 0) g += '<text x="' + (m.l + i * bw + bw / 2) + '" y="' + (Ht - 8) + '" text-anchor="middle">' + esc(r[0]) + '</text>'; });
    foot = esc(s.note || "") + ' Source: ' + link(s.src, s.url);
  }
  w.body.innerHTML = ctl + '<div class="lc" style="top:40px"><svg>' + g + '</svg></div>';
  w.foot.innerHTML = foot;
  wireSer(w);
}
function wireSer(w) { const s = w.body.querySelector("#serSel"); if (s) { s.value = String(w.ser); s.addEventListener("change", (e) => { w.ser = e.target.value === "cases" ? "cases" : +e.target.value; drawTime(w); }); } }
function drawDelay(w) {
  const rows = C.map((c, i) => [c, i]).filter(([c]) => c.fr && c.yf && c.yf >= c.fr && S.sets.has(c.set)).sort((a, b) => (b[0].yf - b[0].fr) - (a[0].yf - a[0].fr));
  if (!rows.length) { w.body.innerHTML = '<p class="mean" style="padding:12px">No case has both dates yet.</p>'; return; }
  const x0 = Math.min(...rows.map((r) => r[0].fr)), x1 = Math.max(...rows.map((r) => r[0].yf));
  const Wd = w.body.clientWidth || 800, rowH = 15, m = { l: 260, r: 50, t: 22 }, H = m.t + rows.length * rowH + 10;
  const X = (y) => m.l + (Wd - m.l - m.r) * (y - x0) / Math.max(1, x1 - x0);
  let g = "";
  for (let y = Math.ceil(x0 / 10) * 10; y <= x1; y += 10) g += '<line class="gl" x1="' + X(y) + '" x2="' + X(y) + '" y1="' + (m.t - 6) + '" y2="' + H + '"/><text x="' + X(y) + '" y="' + (m.t - 9) + '" text-anchor="middle">' + y + '</text>';
  rows.forEach(([c, i], j) => { const y = m.t + j * rowH + 8, col = setColor(c.set);
    g += '<g class="dr" data-i="' + i + '" style="cursor:pointer"><text x="' + (m.l - 8) + '" y="' + (y + 3.5) + '" text-anchor="end" style="fill:#d6d3df">' + esc(c.n.length > 44 ? c.n.slice(0, 42) + "…" : c.n) + '</text><line x1="' + X(c.fr) + '" x2="' + X(c.yf) + '" y1="' + y + '" y2="' + y + '" stroke="' + col + '" stroke-width="2.4"/><circle cx="' + X(c.fr) + '" cy="' + y + '" r="3" fill="none" stroke="' + col + '"/><circle cx="' + X(c.yf) + '" cy="' + y + '" r="3" fill="' + col + '"/><text x="' + (X(c.yf) + 6) + '" y="' + (y + 3.5) + '">' + (c.yf - c.fr) + ' yrs</text><rect x="0" y="' + (y - 7) + '" width="' + Wd + '" height="' + rowH + '" fill="transparent"><title>' + esc(c.n) + ': first complaint ' + c.fr + ', action ' + c.yf + '</title></rect></g>'; });
  const ds = rows.map((r) => r[0].yf - r[0].fr);
  w.body.innerHTML = '<div style="padding:8px 14px 0"><p class="mean" style="margin:0">' + rows.length + ' cases whose sources date both the first complaint and the first conviction, charge or official finding. Median wait: ' + fmt(median(ds), 0) + ' years; ' + ds.filter((d) => d >= 10).length + ' waited ten years or more. Hollow dot: first complaint. Filled dot: first action. Click a row to open the case.</p></div><svg style="display:block;width:100%;height:' + H + 'px" class="dsvg">' + g + '</svg>';
  w.body.querySelectorAll(".dr").forEach((el) => el.addEventListener("click", () => openCase(+el.dataset.i, true)));
  w.foot.textContent = "Only the kinds ticked in the key. A complaint 'on record' means the sources say it reached police, an employer, a church, a school or officials, not that it was acted on.";
}
function drawNetWin(w) {
  const rows = N.map((n, i) => [n, i, C.filter((c) => c.net === i)]).sort((a, b) => (b[0].reach || []).length - (a[0].reach || []).length || b[2].length - a[2].length);
  w.body.innerHTML = '<table class="all"><thead><tr><th>Network or institution</th><th>Setting</th><th>Headquarters</th><th>Years</th><th>Status</th><th>Documented in</th><th>Likely in</th><th>Cases here</th></tr></thead><tbody>' +
    rows.map(([n, i, cs]) => '<tr class="r' + (S.selNet === i ? " sel" : "") + '" data-n="' + i + '"><td style="white-space:normal;min-width:180px;max-width:320px">' + esc(n.n) + '</td><td>' + esc(setLabel(n.type === "state" ? "conflict" : n.type)) + '</td><td style="white-space:normal">' + esc([n.hq, P[n.iso] && P[n.iso].n].filter(Boolean).join(", ")) + '</td><td>' + esc(n.y0 ? n.y0 + "–" + (n.y1 || "") : "") + '</td><td>' + esc(n.status || "") + '</td><td>' + (n.reach || []).length + '</td><td>' + (n.reach_est || []).length + '</td><td>' + cs.length + '</td></tr>').join("") + '</tbody></table>';
  w.body.querySelectorAll("tr.r").forEach((tr) => tr.addEventListener("click", () => openNet(+tr.dataset.n, true)));
  w.foot.textContent = "Sorted by the number of countries each is documented in. Click a row to draw its reach on the map.";
}

/* ---------- the sky ---------- */
function stars() {
  let seed = 1977; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const W = 1400, H = 1000, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"); g.fillStyle = "#03040a"; g.fillRect(0, 0, W, H);
  [[.22, .30, 520, "48,58,92", .10], [.78, .68, 600, "70,52,86", .08], [.58, .14, 420, "42,74,84", .06]].forEach(([x, y, r, rgb, a]) => { const gr = g.createRadialGradient(x * W, y * H, 0, x * W, y * H, r); gr.addColorStop(0, "rgba(" + rgb + "," + a + ")"); gr.addColorStop(1, "rgba(" + rgb + ",0)"); g.fillStyle = gr; g.fillRect(0, 0, W, H); });
  const tints = ["255,255,255", "214,224,255", "236,232,246", "224,236,240"];
  for (let i = 0; i < 2600; i++) { g.beginPath(); g.arc(rnd() * W, rnd() * H, .25 + rnd() * .55, 0, 7); g.fillStyle = "rgba(" + tints[(rnd() * 4) | 0] + "," + (.15 + rnd() * .55) + ")"; g.fill(); }
  const el = $("#map"); el.style.background = '#03040a url(' + c.toDataURL("image/jpeg", .9) + ') repeat'; el.style.backgroundSize = W + "px " + H + "px";
  const drift = () => { const ct = map.getCenter(), z = map.getZoom(); el.style.backgroundPosition = Math.round(-ct.lng * 3) + "px " + Math.round(ct.lat * 3 + z * 6) + "px"; };
  map.on("move", drift); drift();
}

function update() { computeDoc(); drawLegend(); drawSwatches(); paint(); drawList(); drawCharts(); if (S.sel) detail(S.sel); }
function init() {
  buildKey(); buildTr(); buildDock(); stars(); computeDoc(); drawSwatches();
  fetch(BOUND_URL).then((r) => r.json()).then((geo) => { addLayers(geo); ready = true; update(); }).catch((e) => { console.warn("boundaries", e); });
  $("#detX").addEventListener("click", deselect);
  $("#worldBtn").addEventListener("click", wholeWorld);
  $("#toggleKey").addEventListener("click", () => { const p = $("#key"); p.classList.toggle("min"); $("#toggleKey").textContent = p.classList.contains("min") ? "+" : "−"; });
  $("#toggleTr").addEventListener("click", () => { const p = $("#tr"); p.classList.toggle("min"); $("#toggleTr").textContent = p.classList.contains("min") ? "Basemap +" : "−"; });
  if (innerWidth <= 820) { $("#key").classList.add("min"); $("#toggleKey").textContent = "+"; $("#tr").classList.add("min"); $("#toggleTr").textContent = "Basemap +"; }
  drawLegend(); drawList();
  map.jumpTo({ center: [12, 22], zoom: startZoom(), padding: { left: freeBox().L, right: freeBox().R, top: 0, bottom: 0 } });
}

/* ---------- about and sources ---------- */
const info = $("#info");
info.innerHTML = D.ABOUT;
const btn = $("#infoBtn");
const toggle = (open) => { const on = info.classList.toggle("open", typeof open === "boolean" ? open : undefined); btn.textContent = on ? "Close" : "About and sources"; };
document.addEventListener("keydown", (e) => { if (e.key !== "Escape") return; if (info.classList.contains("open")) toggle(false); else if (S.sel || S.selCase != null || S.selNet != null) deselect(); });
btn.addEventListener("click", toggle);
$("#infoClose").addEventListener("click", () => toggle(false));
btn.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
})();
