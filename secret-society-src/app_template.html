<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Society Infiltration Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Uncial+Antiqua&display=swap">
<style>
:root{--bg:#06071a;--card:rgba(8,9,24,.94);--line:#24264a;--line2:rgba(255,255,255,.07);--ink:#e8e6e1;--mute:#a3a1b4;--accent:#5a4a9c;--accent-hi:#b3a8e0}
#ttip{z-index:5000!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 'Marcellus','Georgia',serif;overflow:hidden}
#map{position:absolute;inset:0;background:#03040a}
.card{position:absolute;z-index:800;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
.scroll{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
#key{top:12px;left:12px;width:346px;max-height:calc(100% - var(--patH,300px) - 46px);overflow:auto;padding:14px 16px;box-sizing:border-box}
#key h1{font:800 22px/1.2 'Uncial Antiqua','Marcellus','Georgia',serif;margin:0 0 4px;letter-spacing:.5px;color:#f0ece4;text-shadow:0 2px 12px rgba(0,0,0,.5)}
#key .lede{color:var(--mute);margin:0 0 4px;font-size:12.8px}
#key .lede2{color:var(--mute);margin:0 0 10px;font-size:11.5px}
.psec{margin:16px 0 4px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent-hi)}
.row{display:flex;gap:9px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line2)}
.row input{margin-top:4px}
.row label{flex:1;cursor:pointer;font-size:13px}
.row .n,.n{color:var(--mute);font-size:11.5px}
.row.sub2{padding-left:22px;font-size:12.5px}
.row.sub2 label{font-size:12.5px}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
.sub{margin:4px 0 0;font-size:12px;color:var(--mute)}
.mute{color:var(--mute)}
a{color:var(--accent-hi)}
select,button.btn,input.inp{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font:inherit;font-size:12.5px;cursor:pointer}
select{width:100%;padding:4px 6px}
select option{background:#0b0c1e}
input.inp{cursor:text;box-sizing:border-box}
button.btn.on{border-color:var(--accent-hi);background:var(--accent);color:#fff}
button.btn:hover,#infoBtn:hover,#worldBtn:hover{border-color:var(--accent-hi);color:#fff}
.tog{display:inline-block;float:right;cursor:pointer;font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:1px 8px}
#key.min .body,#key.min .lede,#key.min .lede2{display:none}
.chk{display:flex;gap:7px;align-items:center;font-size:12.8px;cursor:pointer;margin:2px 0}
.car{display:inline-block;width:12px;color:var(--mute);cursor:pointer;font-size:10px;user-select:none}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:6px;flex:none}
.sw.dia{transform:rotate(45deg) scale(.82);border-radius:1px}
.sw.dot{border-radius:50%}
.sw.ring{border-radius:50%;background:transparent!important;border:1.4px solid}
.sw.bar{width:16px;height:3px;border-radius:1px;vertical-align:3px}
.leg{margin:6px 0 2px}
.leg .li{display:flex;align-items:center;gap:6px;font-size:12.3px;padding:2px 0;cursor:pointer}
.leg .li.off{opacity:.35}
.leg .li .n{margin-left:auto}
.desc{font-size:11.5px;color:var(--mute);line-height:1.45;margin:3px 0 6px}
/* patterns */
.pat{padding:6px 8px;margin:4px 0;border-left:3px solid var(--pc);border-radius:0 4px 4px 0;background:rgba(255,255,255,.03);cursor:pointer}
.pat:hover{background:rgba(255,255,255,.07)}
.pat.on{background:rgba(255,255,255,.1)}
.pat .pt{font-size:13px;color:#f0ece4;line-height:1.3}
.pat .pm{font-size:10.8px;color:var(--mute);margin-top:1px}
/* time */
#tchart svg{display:block;width:100%}
#tchart rect.b{cursor:pointer}
#tchart text{fill:var(--mute);font-size:8.5px;font-family:'Marcellus',Georgia,serif}
.tline{display:flex;align-items:center;gap:6px;font-size:12.3px;margin:4px 0}
.tline input{width:62px;padding:2px 5px}
.tline .rst{margin-left:auto;cursor:pointer;color:var(--accent-hi);font-size:12px}
/* find */
#flist{max-height:260px;overflow:auto;margin-top:4px}
.fi{padding:4px 3px;border-top:1px solid var(--line2);font-size:12.8px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.fi:hover{background:rgba(255,255,255,.05)}
.fi .n{display:block}
/* right column */
#rcol{position:absolute;z-index:800;top:12px;right:12px;bottom:calc(var(--legH,200px) + 46px);width:340px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#rcol>*{pointer-events:auto;position:relative;box-sizing:border-box}
#infoBtn{position:relative;align-self:flex-end;padding:7px 14px;cursor:pointer;letter-spacing:.2px}
#tr{padding:12px 14px;flex:none}
#tr.min .body{display:none}
#tr.min{align-self:flex-end;padding:6px 10px}
.bases{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12.8px;margin:4px 0 2px}
.bases label{cursor:pointer;white-space:nowrap}
.seg{display:flex;gap:6px;margin:4px 0 2px;flex-wrap:wrap}
#wire{padding:10px 14px;flex:0 1 auto;min-height:0;display:flex;flex-direction:column}
#wire.min #wireBody{display:none}
#wire .wh{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
#wireBody{overflow:auto;min-height:0;margin-top:6px}
#wireBody select{margin:2px 0}
.wi{padding:6px 0;border-top:1px solid var(--line2);font-size:12.3px;line-height:1.38}
.wi a{color:#e8e4dc;text-decoration:none}.wi a:hover{text-decoration:underline;color:#fff}
.wi .wm{font-size:10.6px;color:var(--mute);margin-top:2px}
#det{display:none;position:fixed;z-index:950;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 40px));max-height:min(80vh,820px);overflow:auto;padding:18px 22px 20px;box-sizing:border-box;box-shadow:0 24px 70px rgba(0,0,0,.75)}
#det.open{display:block}
#det .hp-desc,#det .bts p{font-size:14px}
#det h3{font-size:20px}
#detX{position:absolute;top:6px;right:8px;background:none;border:0;color:#bbb;font-size:20px;cursor:pointer;line-height:1}
#detX:hover{color:#fff}
/* card contents */
.hp h3{margin:2px 0 5px;font-size:17px;font-weight:700;color:#f0ece4;border-bottom:1px solid var(--line);padding:0 18px 6px 0;line-height:1.3}
.hp-k{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);padding-right:20px}
.hp-sub{color:var(--mute);font-size:12px;margin:0 0 6px}
.hp-desc{margin:8px 0;color:#dedbe6;font-size:13px}
.hp-h{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);margin:14px 0 4px}
.hp table.kv{border-collapse:collapse;font-size:12.5px;width:100%}
.hp table.kv th{text-align:left;color:var(--mute);font-weight:400;vertical-align:top;padding:2px 10px 2px 0;white-space:nowrap}
.hp table.kv td{padding:2px 0;vertical-align:top;text-align:right;font-variant-numeric:tabular-nums}
.hp .bt{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin:2px 0 6px}
.hp .bt i{display:block;height:100%}
.hp-src{color:var(--mute);font-size:11.2px;margin-top:8px;border-top:1px solid var(--line2);padding-top:6px}
.hp-src a{color:var(--accent-hi)}
.bts{margin:10px 0;padding:9px 11px;border-left:3px solid var(--accent);background:rgba(255,255,255,.035);border-radius:0 5px 5px 0}
.bts p{margin:0 0 7px;font-size:13px;color:#e2dfe8;line-height:1.55}
.bts .imp{margin-top:8px;padding-top:8px;border-top:1px solid var(--line2)}
.tag{display:inline-block;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--mute);margin-left:6px;vertical-align:2px}
.note{font-size:12px;color:#cfcbe0;background:rgba(255,255,255,.04);border-left:2px solid var(--accent-hi);padding:6px 9px;margin:8px 0;border-radius:0 4px 4px 0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chips span{font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:0 6px;cursor:pointer}
.chips span:hover{border-color:var(--accent-hi);color:#fff}
.chips span.est{border-style:dashed;color:var(--mute)}
.rec{border-top:1px solid var(--line2);padding:5px 0}
.rec .rh{display:flex;gap:7px;align-items:baseline;cursor:pointer;font-size:12.6px}
.rec .rh b{font-weight:400;color:#f0ece4;flex:1}
.rec .rh .n{white-space:nowrap}
.rec .rb{display:none;font-size:12.3px;color:#d8d5e0;margin:4px 0 2px 18px;line-height:1.5}
.rec.open .rb{display:block}
.st{font-size:9.6px;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap}
.pc{margin:6px 0}
.pc .pr{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);margin-left:4px}
.pc .pn{font-size:12.2px;color:#d8d5e0;margin:2px 0 0 0;line-height:1.45}
.pchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--line);border-radius:3px;padding:1px 7px;cursor:pointer}
.pchip:hover{border-color:var(--accent-hi);color:#fff}
.tl{font-size:12px;line-height:1.45;margin:3px 0;color:#d8d5e0}
.tl b{font-weight:400;color:var(--accent-hi);margin-right:6px;font-variant-numeric:tabular-nums}
.imp-box{margin:10px 0;padding:9px 11px;background:rgba(255,255,255,.045);border-left:3px solid var(--accent-hi);border-radius:0 5px 5px 0;font-size:13px;color:#e8e4ec;line-height:1.55}
#ttip{position:fixed;z-index:2000;pointer-events:none;background:rgba(12,13,20,.97);border:1px solid var(--line);border-radius:3px;padding:4px 8px;font-size:12.5px;display:none;max-width:320px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#worldBtn{position:absolute;z-index:800;right:52px;bottom:34px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 11px;font:13px 'Marcellus','Georgia',serif;cursor:pointer}
#info{inset:0;z-index:1001;border-radius:0;border:0;display:none;overflow:auto;padding:60px max(28px,calc((100% - 1000px)/2)) 40px;background:rgba(5,6,16,.975)}
#info.open{display:block}
#infoClose{position:fixed;top:12px;right:12px;z-index:1002;display:none}
#info.open+#infoClose{display:block}
#info h2{font:400 17px/1.3 'Uncial Antiqua','Marcellus','Georgia',serif;margin:26px 0 8px;color:#f0ece4;letter-spacing:.3px}
#info h2:first-child{margin-top:0}
#info p,#info li{font-size:14px}
#info ul{padding-left:20px;margin:4px 0}
#info .warn{border-left:2px solid var(--accent);padding:4px 0 4px 12px;color:#d8d5e0}
.maplibregl-map{font-family:'Marcellus','Georgia',serif}
.maplibregl-ctrl-attrib{background:rgba(6,7,16,.8)!important;color:#8f8d9e;font-family:'Marcellus','Georgia',serif}
.maplibregl-ctrl-attrib a{color:#b0aec0!important}
.maplibregl-ctrl-attrib-button{filter:invert(1)}
.maplibregl-ctrl-group{background:var(--card)!important;border:1px solid var(--line);box-shadow:none!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}
.maplibregl-ctrl-bottom-right{bottom:24px}
@media (max-width:820px){
  #key{width:auto;right:12px;max-height:42%}
  #rcol{top:auto;bottom:34px;left:12px;right:12px;width:auto;max-height:46%}
  #infoBtn{align-self:flex-start}
  #info{padding:56px 16px 80px}
}

.btnrow{display:flex;gap:6px;align-self:flex-end}
.btnrow .card{position:relative;padding:7px 14px;cursor:pointer;letter-spacing:.2px}
.btnrow .card:hover{border-color:var(--accent-hi);color:#fff}
#patBox{left:12px;bottom:34px;width:346px;max-height:40%;display:flex;flex-direction:column;padding:12px 14px;box-sizing:border-box}
#patBox .bh{display:flex;justify-content:space-between;align-items:center}
#patBox .psec{margin:0}
#patBody{overflow:auto;min-height:0;margin-top:6px}
#patBox.min #patBody{display:none}
#legBox{right:12px;bottom:34px;width:340px;max-height:46%;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 14px 12px;box-sizing:border-box}
#legBody{overflow:auto;min-height:0}
#legBox.min #legBody{display:none}
#legBox .bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
#legBox .psec{margin:0}
.up{border-left:1px solid var(--line2);margin-left:6px;padding-left:4px}
.presets{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.presets .btn{font-size:11.8px;padding:2px 8px}
#story{inset:0;z-index:1001;border-radius:0;border:0;display:none;overflow:auto;padding:60px max(28px,calc((100% - 760px)/2)) 50px;background:rgba(5,6,16,.975)}
#story.open{display:block}
#story p{font-size:15.5px;line-height:1.75;color:#e4e0e8;margin:0 0 16px}
#story h2{font:400 22px/1.3 'Uncial Antiqua','Marcellus','Georgia',serif;margin:0 0 18px;color:#f0ece4}
#story h3{font:400 15px/1.3 'Uncial Antiqua','Marcellus','Georgia',serif;margin:26px 0 10px;color:var(--accent-hi);letter-spacing:.3px}
#storyClose{position:fixed;top:12px;right:12px;z-index:1002;display:none}
#story.open+#storyClose{display:block}
.maplibregl-ctrl-bottom-right{right:362px!important;bottom:30px!important}
#worldBtn{right:410px!important;bottom:34px!important}
@media (max-width:820px){#patBox,#legBox{position:absolute;width:auto;left:12px;right:12px;max-height:30%}#legBox{bottom:auto;top:46%}.maplibregl-ctrl-bottom-right{right:0!important}#worldBtn{right:52px!important}}
</style>
</head>

</div>

<div id="legBox" class="card"><div class="bh"><span class="psec">On the map</span><button id="toggleLeg" class="tog" type="button">−</button></div><div id="legBody" class="scroll"></div></div>
<div id="story" class="card scroll"></div>
<button id="storyClose" class="btn" type="button">Close</button>

<button id="worldBtn" type="button" title="Zoom back out to the whole world">Whole world</button>
<div id="info" class="card scroll"></div>
<button id="infoClose" class="btn" type="button">Close</button>
<div id="ttip"></div>

  if (p.confirmed_by && p.confirmed_by.length) h += '<div class="hp-src">Sources: ' + p.confirmed_by.map((c) => c.url ? '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.title) + '</a>' : esc(c.title)).join(" · ") + '</div>';
  show(h, ["p", id]);
}
function setPattern(id) {
  S.pat = id || null; paint(); buildKey();
  if (S.pat) { openPattern(S.pat); wholeWorld(); } else if (S.sel && S.sel[0] === "p") deselect();
}

/* ---------- live wire ---------- */
const W = { all: [], iso: "", lang: "", age: "" };
const LANG = { en: "English", es: "Spanish", fr: "French", pt: "Portuguese", de: "German", it: "Italian", tr: "Turkish", ja: "Japanese", ko: "Korean", ar: "Arabic", ru: "Russian" };
function ts(it) { const d = Date.parse(it.date || ""); return isFinite(d) ? d : 0; }
function ago(ms) { const m = Math.max(0, (Date.now() - ms) / 60000); return m < 60 ? Math.round(m) + "m ago" : m < 1440 ? Math.round(m / 60) + "h ago" : Math.round(m / 1440) + "d ago"; }
function drawWire() {
  const items = W.all.filter((it) => (!W.iso || it.iso === W.iso) && (!W.lang || (it.lang || "en") === W.lang) && (!W.age || !ts(it) || Date.now() - ts(it) <= +W.age * 864e5)).sort((a, b) => ts(b) - ts(a));
  $("#wireN").textContent = W.all.length ? "· " + items.length : "";
  const isos = {}, langs = {}; W.all.forEach((it) => { if (it.iso) isos[it.iso] = it.country || it.iso; langs[it.lang || "en"] = 1; });
  $("#wireBody").innerHTML = '<div class="desc" style="margin-top:0">Headlines from Google News in eleven languages, collected every six hours and kept only when they name a tracked organisation, a public office and an act tying the two. They are leads, not findings: nothing here enters the scores or cases.</div>' +
    '<select id="wIso"><option value="">All countries</option>' + Object.keys(isos).sort((a, b) => isos[a].localeCompare(isos[b])).map((k) => '<option value="' + k + '"' + (W.iso === k ? " selected" : "") + '>' + esc(isos[k]) + '</option>').join("") + '</select>' +
    '<select id="wLang"><option value="">All languages</option>' + Object.keys(langs).sort().map((k) => '<option value="' + k + '"' + (W.lang === k ? " selected" : "") + '>' + esc(LANG[k] || k) + '</option>').join("") + '</select>' +
    '<select id="wAge"><option value="">Any date</option><option value="2"' + (W.age === "2" ? " selected" : "") + '>Last 48 hours</option><option value="7"' + (W.age === "7" ? " selected" : "") + '>Last week</option><option value="30"' + (W.age === "30" ? " selected" : "") + '>Last month</option></select>' +
    (items.length ? items.slice(0, 120).map((it) => '<div class="wi"><a href="' + esc(it.link) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a><div class="wm">' + esc(it.source || "") + (it.country ? ' · ' + esc(it.country) : '') + (ts(it) ? ' · ' + ago(ts(it)) : '') + '</div></div>').join("") : '<div class="sub">' + (W.all.length ? "Nothing for this filter." : "No archive reachable yet.") + '</div>');
  $("#wIso").onchange = (e) => { W.iso = e.target.value; drawWire(); }; $("#wLang").onchange = (e) => { W.lang = e.target.value; drawWire(); }; $("#wAge").onchange = (e) => { W.age = e.target.value; drawWire(); };
}
async function loadWire() {
  for (const u of ["secret_society_wire.json", "https://welcometoyourgalaxy.github.io/maps/secret_society_wire.json"]) {
    try { const r = await fetch(u + "?_=" + Date.now(), { cache: "no-store" }); if (!r.ok) continue; const j = await r.json(); if (Array.isArray(j) && j.length) { W.all = j; break; } } catch (e) {}
  }
  drawWire();
}

/* ---------- the sky behind the globe and the flat map ---------- */
function stars() {
  let seed = 1977; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const Wd = 1400, H = 1000, c = document.createElement("canvas"); c.width = Wd; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#03040a"; g.fillRect(0, 0, Wd, H);
  [[.22, .30, 520, "48,58,92", .10], [.78, .68, 600, "70,52,86", .08], [.58, .14, 420, "42,74,84", .06], [.10, .86, 380, "56,60,80", .07]].forEach(([x, y, r, rgb, a]) => {
    for (let k = 0; k < 2; k++) for (let dx = -Wd; dx <= Wd; dx += Wd) for (let dy = -H; dy <= H; dy += H) {
      const gr = g.createRadialGradient(x * Wd + dx, y * H + dy, 0, x * Wd + dx, y * H + dy, r);
      gr.addColorStop(0, "rgba(" + rgb + "," + a + ")"); gr.addColorStop(1, "rgba(" + rgb + ",0)");
      g.fillStyle = gr; g.fillRect(0, 0, Wd, H);
    }
  });
  const tints = ["255,255,255", "214,224,255", "236,232,246", "224,236,240"];
  const dot = (x, y, r, a, t) => { for (const dx of [0, -Wd, Wd]) for (const dy of [0, -H, H]) { g.beginPath(); g.arc(x + dx, y + dy, r, 0, 7); g.fillStyle = "rgba(" + t + "," + a + ")"; g.fill(); } };
  for (let i = 0; i < 2600; i++) dot(rnd() * Wd, rnd() * H, .25 + rnd() * .55, .15 + rnd() * .55, tints[(rnd() * 4) | 0]);
  for (let i = 0; i < 90; i++) {
    const x = rnd() * Wd, y = rnd() * H, r = .8 + rnd() * .9, t = tints[(rnd() * 4) | 0];
    for (const dx of [0, -Wd, Wd]) for (const dy of [0, -H, H]) { const gr = g.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, r * 4); gr.addColorStop(0, "rgba(" + t + ",.35)"); gr.addColorStop(1, "rgba(" + t + ",0)"); g.fillStyle = gr; g.fillRect(x + dx - r * 4, y + dy - r * 4, r * 8, r * 8); }
    dot(x, y, r, .9, t);
  }
  const el = $("#map");
  el.style.background = '#03040a url(' + c.toDataURL("image/jpeg", .9) + ') repeat';
  el.style.backgroundSize = Wd + "px " + H + "px";
  const drift = () => { const ct = map.getCenter(), z = map.getZoom(); el.style.backgroundPosition = Math.round(-ct.lng * 3) + "px " + Math.round(ct.lat * 3 + z * 6) + "px"; };
  map.on("move", drift); drift();
}

function init() {
  addLayers(); buildKey(); buildTr(); stars();
  $("#detX").addEventListener("click", deselect);
  $("#worldBtn").addEventListener("click", wholeWorld);
  $("#toggleKey").addEventListener("click", () => { const p = $("#key"); p.classList.toggle("min"); $("#toggleKey").textContent = p.classList.contains("min") ? "+" : "−"; });
  $("#toggleTr").addEventListener("click", () => { const p = $("#tr"); p.classList.toggle("min"); $("#toggleTr").textContent = p.classList.contains("min") ? "Basemap +" : "−"; });
  $("#togglePat").addEventListener("click", () => { const p = $("#patBox"); p.classList.toggle("min"); $("#togglePat").textContent = p.classList.contains("min") ? "+" : "−"; sizeBoxes(); });
  $("#toggleLeg").addEventListener("click", () => { const p = $("#legBox"); p.classList.toggle("min"); $("#toggleLeg").textContent = p.classList.contains("min") ? "+" : "−"; sizeBoxes(); });
  window.addEventListener("resize", sizeBoxes);
  $("#wire .wh").addEventListener("click", () => { const w = $("#wire"); w.classList.toggle("min"); $("#wireTog").textContent = w.classList.contains("min") ? "open +" : "close −"; });
  if (innerWidth <= 820) { $("#key").classList.add("min"); $("#toggleKey").textContent = "+"; $("#tr").classList.add("min"); $("#toggleTr").textContent = "Basemap +"; }
  ready = true; order(); paint();
  map.jumpTo({ center: [12, 25], zoom: startZoom(), padding: { left: freeBox().L, right: freeBox().R, top: 0, bottom: 0 } });
  loadWire(); setInterval(loadWire, 15 * 60 * 1000);
}
window.societies = { setPattern, openCountry, openCase, openOrg, S };

/* ---------- about and sources ---------- */
const info = $("#info");
info.innerHTML = __ABOUT__;
function openInfo(on) { info.classList.toggle("open", on); }
const story = $("#story");
story.innerHTML = __STORY__;
function openStory(on) { story.classList.toggle("open", on); }
$("#storyBtn").addEventListener("click", () => openStory(true));
$("#storyBtn").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openStory(true); } });

document.addEventListener("keydown", (e) => { if (e.key === "Escape") { openStory(false); openInfo(false); if (S.sel) deselect(); } });
$("#infoBtn").addEventListener("click", () => openInfo(true));

$("#infoBtn").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openInfo(true); } });
$("#infoClose").addEventListener("click", () => openInfo(false));
})();
</script>
