<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Sacrifice Worldwide</title>
<meta name="description" content="206 entries in 80 countries where animals are sacrificed in religious and ritual practice, in fifteen traditions. Welcome to Your Galaxy.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Uncial+Antiqua&display=swap">
<style>
:root{--bg:#06071a;--card:rgba(8,9,24,.94);--line:#24264a;--line2:rgba(255,255,255,.07);--ink:#e8e6e1;--mute:#a3a1b4;--accent:#5600DC;--accent-hi:#a99cff;--chh:-10px}
#ttip{z-index:5000!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 'Marcellus','Georgia',serif;overflow:hidden}
#map{position:absolute;inset:0;background:#03040a}
.card{position:absolute;z-index:800;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
.scroll{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
#key{top:12px;left:12px;width:336px;max-height:calc(100% - var(--chh) - 46px);overflow:auto;padding:14px 16px;box-sizing:border-box}
#key h1{font:800 22px/1.2 'Uncial Antiqua','Marcellus','Georgia',serif;margin:0 0 4px;letter-spacing:.5px;color:#f0ece4;text-shadow:0 2px 12px rgba(0,0,0,.5)}
#key .lede{color:var(--mute);margin:0 0 4px;font-size:12.8px}
#key .lede2{color:var(--mute);margin:0 0 10px;font-size:11.5px}
.psec{margin:14px 0 3px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent-hi)}
.row{display:flex;gap:9px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line2)}
.row input{margin-top:4px}
.row label{flex:1;cursor:pointer;font-size:13px}
.row .n{color:var(--mute);font-size:11.5px}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
.bar{height:4px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%}
.sub{margin:4px 0 0;font-size:12px;color:var(--mute)}
.mute{color:var(--mute)}
a{color:var(--accent-hi)}
select,button.btn{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font:inherit;font-size:12.5px;cursor:pointer}
button.btn.on{border-color:var(--accent-hi);background:var(--accent);color:#fff}
button.btn:hover,#infoBtn:hover,#worldBtn:hover{border-color:var(--accent-hi);color:#fff}
.tog{display:inline-block;float:right;cursor:pointer;font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:1px 8px}
#key.min .body,#key.min .lede,#key.min .lede2{display:none}
.tline{display:flex;align-items:center;gap:8px;margin:4px 0 2px}
.tline input[type=range]{flex:1}
.tline b{font-weight:400;min-width:38px;text-align:right;font-size:15px;color:#f0ece4}
.chk{display:flex;gap:7px;align-items:center;font-size:12.8px;cursor:pointer;margin:2px 0}
#cnt{font-size:11.5px;color:var(--mute);margin-top:3px}
#wfilter{width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 7px;font:inherit;font-size:12.5px;margin:2px 0 4px}
#olist{max-height:300px;overflow:auto}
.oi{display:flex;gap:8px;align-items:flex-start;padding:4px 2px;border-top:1px solid var(--line2);font-size:12.8px;cursor:pointer}
.oi:hover{background:rgba(255,255,255,.04)}
.oi.off{opacity:.38}
.oi.sel{background:rgba(255,255,255,.07)}
.oi .n{color:var(--mute);font-size:11px;display:block}
.oi .pin{flex:none;margin-top:4px}

/* the marks on the map */
.mk{cursor:pointer;line-height:0;pointer-events:none}
.mk svg{pointer-events:none}
.mk .hit{pointer-events:all}
.mk:hover svg{filter:brightness(1.35)}
.hub{width:3px;height:3px;border-radius:50%;background:#f0ece4;opacity:.7;pointer-events:none}
.mks{display:inline-block;vertical-align:-3px;margin-right:6px;line-height:0}
.mks svg{display:inline-block!important}
.lg .mks{margin:0 6px 0 0;vertical-align:-3px}
.oi .mks{flex:none;margin:3px 0 0}

/* right column: basemap box and the organization's card */
#rcol{position:absolute;z-index:800;top:12px;right:12px;bottom:calc(var(--chh) + 34px);width:340px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#rcol>*{pointer-events:auto;position:relative;box-sizing:border-box}
#infoBtn{position:relative;align-self:flex-end;padding:7px 14px;cursor:pointer;letter-spacing:.2px}
#tr{padding:12px 14px;flex:none}
#tr.min .body{display:none}
#tr.min{align-self:flex-end;padding:6px 10px}
.bases{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12.8px;margin:4px 0 2px}
.bases label{cursor:pointer;white-space:nowrap}
.seg{display:flex;gap:6px;margin:4px 0 2px;flex-wrap:wrap}
#det{display:none;flex:0 1 auto;min-height:0;overflow:auto;padding:13px 15px}
#det.open{display:block}
#detX{position:absolute;top:6px;right:8px;background:none;border:0;color:#bbb;font-size:20px;cursor:pointer;line-height:1}
#detX:hover{color:#fff}

/* the card's contents */
.hp h3{margin:2px 0 5px;font-size:17px;font-weight:700;color:#f0ece4;border-bottom:1px solid var(--line);padding:0 18px 6px 0;line-height:1.3}
.hp-k{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);padding-right:20px}
.hp-sub{color:var(--mute);font-size:12px;margin:0 0 6px}
.hp-desc{margin:8px 0;color:#dedbe6;font-size:13px}
.hp-h{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);margin:12px 0 3px}
.hp table.kv{border-collapse:collapse;font-size:12.5px;width:100%}
.hp table.kv th{text-align:left;color:var(--mute);font-weight:400;vertical-align:top;padding:2px 10px 2px 0;white-space:nowrap}
.hp table.kv td{padding:2px 0;vertical-align:top}
.hp details{margin:8px 0;border:1px solid var(--line2);border-radius:3px;padding:4px 7px}
.hp summary{cursor:pointer;font-size:12.5px}
.hp table.rec{border-collapse:collapse;font-size:11.5px;width:100%;margin-top:4px}
.hp table.rec th,.hp table.rec td{border-bottom:1px solid var(--line2);padding:2px 5px;text-align:right}
.hp table.rec th:first-child,.hp table.rec td:first-child{text-align:left}
.hp table.rec th{color:var(--mute);font-weight:400}
.hp-src{color:var(--mute);font-size:11.2px;margin-top:10px;border-top:1px solid var(--line2);padding-top:6px}
.spk{display:grid;grid-template-columns:72px 1fr;gap:4px 8px;align-items:center;font-size:11.5px;color:var(--mute)}
.spk svg{display:block;width:100%;height:44px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chips span{font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:0 6px}
.pg{margin:4px 0 8px}
.pgl{font-size:12px;margin:0 0 3px;line-height:1.35}
.pgn{margin-top:4px}
.tsw{display:inline-block;width:10px;height:8px;border-radius:1px;margin-right:6px;vertical-align:0;opacity:.9}
.tsw.ring{width:9px;height:9px;border-radius:50%;border:1.2px solid;box-sizing:border-box}
.tsw.light{opacity:.4;outline:1px dashed rgba(240,236,228,.6);outline-offset:-1px}

/* the chart buttons */
#dock{padding:10px 14px 12px;flex:none}
#dockBtns{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
#dockBtns .tab{text-align:left;border-color:var(--line);background:rgba(255,255,255,.03);font-size:12.5px;padding:3px 8px;white-space:normal;line-height:1.25}
#dockBtns .tab.on{border-color:var(--accent-hi);background:rgba(255,255,255,.08)}
.tab{background:none;border:1px solid transparent;color:var(--mute);font:inherit;font-size:12.5px;padding:2px 9px;border-radius:4px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:#f0ece4;border-color:var(--accent-hi);background:rgba(255,255,255,.06)}

/* chart windows */
.win{position:fixed;z-index:900;display:flex;flex-direction:column;resize:both;overflow:hidden;min-width:300px;min-height:200px;background:rgba(8,9,22,.96);box-shadow:0 18px 50px rgba(0,0,0,.65)}
.wh{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 13px;border-bottom:1px solid var(--line2);cursor:move;user-select:none;flex:none;touch-action:none}
.wt{font:400 14px/1.2 'Uncial Antiqua','Marcellus','Georgia',serif;color:#f0ece4;letter-spacing:.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr{display:flex;gap:4px}
.ztools{display:flex;align-items:center;gap:2px;margin-right:8px}
.zb{width:26px;height:24px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:4px;cursor:pointer;padding:0}
.zb svg{width:15px;height:15px;fill:none;stroke:#cfcbe0;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.zb:hover{border-color:var(--accent-hi)}.zb:hover svg{stroke:#fff}
.zsep{width:1px;height:16px;background:var(--line);margin:0 4px}
.zlev{font-size:11px;color:var(--mute);margin-left:6px;min-width:44px}
.fw{position:relative;width:100%;height:100%;overflow:hidden}
.yax{position:absolute;left:0;top:0;bottom:0;overflow:hidden;z-index:2;background:rgba(8,9,22,.96)}
.yax svg,.ovl svg{display:block}
.yax text,.ovl text{font-family:'Marcellus','Georgia',serif;fill:var(--mute);font-size:10.5px}
.yax text.ln{font-size:11px;cursor:pointer}
.yax text.ln:hover,.yax text.ln.sel{fill:#f0ece4}
.ovl{position:absolute;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none;z-index:2}
.ovl text.ot{fill:#d8d5e0;font-size:11.5px;paint-order:stroke;stroke:rgba(8,9,22,.85);stroke-width:3px}
.psc{position:absolute;top:0;right:0;bottom:0}
.psc .csvg{width:auto;height:auto}
.psc.canDrag{cursor:grab}
.psc.canDrag .csvg{cursor:inherit}
.psc.dragging,.psc.dragging *{cursor:grabbing!important;user-select:none}
.wm{background:none;border:0;color:#bbb;font-size:15px;line-height:1;cursor:pointer;padding:0 4px}
.wm:hover{color:#fff}
.win.max{resize:none}
.csvg .band{fill:rgba(255,255,255,.018)}
.csvg .band.alt{fill:rgba(255,255,255,.045)}
.wr .btn{font-size:11.5px;padding:1px 7px}
.wx{background:none;border:0;color:#bbb;font-size:20px;line-height:1;cursor:pointer;padding:0 4px}
.wx:hover{color:#fff}
.wb{flex:1;min-height:0;position:relative;overflow:auto}
.wb:has(> .fw),.wb:has(.lw),.wb:has(.cwrap){overflow:hidden}
.lw{display:flex;height:100%}
.plot{flex:1;min-width:0;position:relative}
.leg{width:200px;flex:none;border-left:1px solid var(--line2);overflow:auto;padding:6px 8px;font-size:11.5px}
@media (max-width:620px){.leg{display:none}}
.li{display:flex;gap:7px;align-items:baseline;padding:2px 3px;cursor:pointer;border-radius:3px;line-height:1.25}
.li i{flex:none;width:10px;height:2px;transform:translateY(-3px)}
.li:hover,.li.hov{background:rgba(255,255,255,.06);color:#fff}
.li.sel{color:#fff;background:rgba(255,255,255,.09)}
.li.off{opacity:.35}
.csvg{display:block;width:100%;height:100%}
.csvg text{font-family:'Marcellus','Georgia',serif;fill:var(--mute);font-size:10.5px}
.csvg .gl{stroke:rgba(255,255,255,.07)}
.csvg .ser{fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.csvg .sg{opacity:.85;cursor:pointer}
.csvg.has-sel .sg,.csvg.has-hov .sg{opacity:.16}
.csvg .sg.sel{opacity:1}.csvg .sg.sel .ser{stroke-width:2.8}
.csvg .sg.hov{opacity:1}.csvg .sg.hov .ser{stroke-width:2.4}
.csvg .yl{stroke:var(--accent-hi);stroke-dasharray:3 3}
.csvg .ylt{fill:var(--accent-hi)}
.csvg .xh{stroke:rgba(255,255,255,.4);stroke-width:1}
.csvg .ar{fill:var(--accent-hi);fill-opacity:.12}
.csvg .cl{fill:none;stroke:var(--accent-hi);stroke-width:1.5;stroke-linejoin:round}
.csvg text.pt{fill:#d8d5e0;font-size:11.5px}
.csvg.life .hit{fill:transparent;cursor:pointer}
.csvg.life .lr:hover .hit{fill:rgba(255,255,255,.04)}
.csvg.life .lr.sel .hit{fill:rgba(255,255,255,.08)}
.csvg.life .lr.sel .ln,.csvg.life .lr:hover .ln{fill:#f0ece4}
.csvg.life .ln{font-size:11px}
.cnote{position:absolute;left:48px;top:4px;font-size:11px;color:var(--mute);pointer-events:none}
.cwrap{display:flex;flex-direction:column;height:100%}
.cmain{flex:1;min-height:0;position:relative}
.cfoot{flex:none;font-size:10.5px;color:var(--mute);padding:4px 14px 7px;line-height:1.35;border-top:1px solid var(--line2)}
.kwrap{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 18px;padding:12px 14px}
.ring{display:flex;gap:14px;align-items:center;flex:none}
.ring text{font-family:'Marcellus','Georgia',serif;fill:var(--mute);font-size:10.5px}
.ring text.big{fill:#f0ece4;font-size:26px}
.ring .arc{cursor:default}
.ring .arc:hover{filter:brightness(1.25)}
.rl div{font-size:12.5px;margin:4px 0;display:flex;gap:8px;align-items:center}
.rl i{width:10px;height:10px;border-radius:2px;border:1px solid;flex:none}
.kinds{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 22px}
.kinds .h{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);margin:0 0 4px}
.mini{display:grid;grid-template-columns:118px 1fr 26px;gap:7px;align-items:center;font-size:12px;margin:3px 0}
.mini .b{height:8px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden}
.mini .b i{display:block;height:100%}
.mini span:last-child{text-align:right;color:var(--mute)}
table.all{border-collapse:collapse;font-size:11.5px;width:100%;table-layout:auto}
table.all th{position:sticky;top:0;background:#0b0c1e;color:var(--mute);font-weight:400;text-align:left;padding:4px 5px;border-bottom:1px solid var(--line);cursor:pointer;line-height:1.2;vertical-align:bottom}
table.all th:hover{color:#fff}
table.all td{padding:3px 5px;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.3}
table.all td:first-child{min-width:150px}
table.all td:nth-child(8){min-width:100px}
table.all td:last-child{min-width:150px}
table.all td:nth-child(3),table.all td:nth-child(7){min-width:80px}
table.all tr.r{cursor:pointer}
table.all tr.r:hover td{background:rgba(255,255,255,.04)}
table.all tr.sel td{background:rgba(255,255,255,.08)}
table.all td.num{text-align:right;white-space:nowrap}
#ttip{position:fixed;z-index:2000;pointer-events:none;background:rgba(12,13,20,.97);border:1px solid var(--line);border-radius:3px;padding:4px 8px;font-size:12.5px;display:none;max-width:320px;box-shadow:0 6px 18px rgba(0,0,0,.5)}

#worldBtn{position:absolute;z-index:800;right:52px;bottom:calc(var(--chh) + 34px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 11px;font:13px 'Marcellus','Georgia',serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}
body.detopen #worldBtn{right:362px}
#info{inset:0;z-index:1001;border-radius:0;border:0;display:none;overflow:auto;padding:60px max(28px,calc((100% - 1080px)/2)) 40px;background:rgba(5,6,16,.975)}
#info.open{display:block}
#infoClose{position:fixed;top:12px;right:12px;z-index:1002;display:none}
#info.open+#infoClose{display:block}
#info h2{font:400 17px/1.3 'Uncial Antiqua','Marcellus','Georgia',serif;margin:26px 0 8px;color:#f0ece4;letter-spacing:.3px}
#info h2:first-child{margin-top:0}
#info p,#info li{font-size:14px}
#info ul{padding-left:20px;margin:4px 0}
#info blockquote{margin:6px 0;padding:4px 0 4px 12px;border-left:2px solid var(--accent);color:#d8d5e0}
.maplibregl-map{font-family:'Marcellus','Georgia',serif}
.maplibregl-ctrl-attrib{background:rgba(6,7,16,.8)!important;color:#8f8d9e;font-family:'Marcellus','Georgia',serif}
.maplibregl-ctrl-attrib a{color:#b0aec0!important}
.maplibregl-ctrl-attrib-button{filter:invert(1)}
.maplibregl-ctrl-group{background:var(--card)!important;border:1px solid var(--line);box-shadow:none!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}
.maplibregl-ctrl-bottom-right{bottom:calc(var(--chh) + 24px)}
body.detopen .maplibregl-ctrl-bottom-right{right:350px}
@media (max-width:820px){
  #key{width:auto;right:12px;max-height:42%}
  #rcol{top:auto;bottom:calc(var(--chh) + 34px);left:12px;right:12px;width:auto;max-height:46%}
  #infoBtn{align-self:flex-start}
  #dock{padding:10px 14px 12px;flex:none}
  body.detopen #worldBtn{right:52px}
  body.detopen .maplibregl-ctrl-bottom-right{right:0}
  #info{padding:56px 16px 80px}
}

/* this map's own pieces */
.dt{display:inline-block;border-radius:50%;margin-right:7px;vertical-align:0;flex:none}
.oi .dt{margin-top:6px}
.allbtns{float:right;letter-spacing:0;text-transform:none}
.allbtns .btn{font-size:11px;padding:0 7px}
.crow{display:grid;grid-template-columns:190px 1fr 34px 96px;gap:10px;align-items:center;padding:4px 4px;border-top:1px solid var(--line2);font-size:12.8px;cursor:pointer}
.crow:hover{background:rgba(255,255,255,.04)}
.crow.off{opacity:.4}
.crow .cl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cb{display:flex;height:9px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden}
.crow .cb i{display:block;height:100%}
.crow .cn{text-align:right}
.crow .cn2{color:var(--mute);font-size:11.5px}
[data-c].crow{grid-template-columns:150px 1fr 34px}
table.all td:nth-child(8),table.all td:nth-child(3),table.all td:nth-child(7){min-width:0}
.hp .oi{cursor:pointer}
.cites{margin:5px 0 0;padding-left:16px}.cites li{margin:3px 0}
.chg{margin-top:7px;padding:5px 7px;border-left:2px solid var(--accent-hi);background:rgba(255,255,255,.03);color:var(--ink)}
</style>
</head>
<body>
<div id="map"></div>

<div id="key" class="card scroll">
  <button id="toggleKey" class="tog" type="button" title="Pull the key up or down">−</button>
  <h1>Animal sacrifice</h1>
  <p class="lede">Where animals are killed as offerings in religious and ritual practice, worldwide.</p>
  <p class="lede2">206 entries · 80 countries · 15 traditions</p>
  <div class="body" id="keyBody"></div>
</div>

<div id="rcol">
  <div id="infoBtn" class="card" role="button" tabindex="0">About and sources</div>
  <div id="tr" class="card"><button id="toggleTr" class="tog" type="button" title="Pull the basemap box up or down">−</button><div class="body" id="trBody"></div></div>
  <div id="dock" class="card"><div class="psec" style="margin-top:0">Charts</div><div id="dockBtns"></div></div>
  <div id="det" class="card scroll hp"><button id="detX" type="button" title="Close">×</button><div id="detBody"></div></div>
</div>

<button id="worldBtn" type="button" title="Zoom back out to the whole world">Whole world</button>
<div id="info" class="card scroll"></div>
<button id="infoClose" class="btn" type="button">Close</button>

ral Hanoi. The documented killing near Hanoi is a pig offering to a village guardian god at La Phù; the point was moved there (OpenStreetMap). Vietnam's spirit-medium (shamanic) rites themselves use no animal sacrifice, so the \"shamanic\" label does not fit this entry."},"Shamanic Practices|Nam Giao Esplanade, Huế":{"cites":[["Huế holds prayer ceremony mimicking imperial ritual, Việt Nam News, 2018","https://vietnamnews.vn/life-style/427084/hue-holds-prayer-ceremony-mimicking-imperial-ritual.html","a young buffalo, a goat and two pigs sacrificed, as in the kings' time"]],"changed":"The file gave \"Academic sources\" and central Huế. The documented sacrifice is the revived Nguyễn imperial Nam Giao rite (2018); the point was moved to the Nam Giao Esplanade (OpenStreetMap). It is a state rite to Heaven and Earth, not a shamanic one."},"Shamanic Practices|Mekong Delta":{"cites":[["Dom Long Neak Ta festival of the Khmer in Tra Vinh, VOV5","https://vov5.vov.gov.vn/colorful-vietnam-vietnams-54-ethnic-groups/dom-long-neak-ta-festival-of-the-khmer-in-tra-vinh-2231456.vov5","offerings to Khmer guardian spirits include roast pig and chicken"],["Nguyễn Quang Hùng, Quản lý Nhà nước, 2024","https://www.quanlynhanuoc.vn/2024/09/05/phat-huy-gia-tri-tin-nguong-tho-neak-ta-cua-nguoi-khmer-nam-bo-tai-tinh-tra-vinh","a pig's head or boiled chicken or duck offered to Neak Ta"]],"changed":"The file gave \"Academic sources\". The sources found describe cooked meat offered to spirits (roast pig, boiled chicken); none says an animal is killed as part of the rite. This entry is weakly supported."},"Shamanic Practices|Central Highlands":{"cites":[["Buffalo stabbing, an essential Bahnar ritual, Ta Thi Tam (Institute of Ethnology), Vietnam Law Magazine, 2014","https://vietnamlawmagazine.vn/buffalo-stabbing-an-essential-bahnar-ritual-4211.html","the buffalo is an offering; how its head falls shows if the gods accepted it"],["Buffalo sacrifice ceremony in Xơ Đăng New Year festival, Vietnam Law M   const W = small ? innerWidth - 16 : Math.min(id === "table" ? 1100 : 760, innerWidth - 60), H = small ? Math.min(520, innerHeight - 90) : Math.min(id === "kinds" ? 520 : 680, innerHeight - 90);
  el.style.width = W + "px"; el.style.height = H + "px";
  el.style.left = (small ? 8 : Math.max(8, (innerWidth - W) / 2 + (cascade - 1) * 26)) + "px";
  el.style.top = (small ? 50 : Math.max(8, Math.min(innerHeight - H - 60, 40 + cascade * 26))) + "px";
  cascade = (cascade + 1) % 4;
  const w = WINS[id] = { id, el, body: el.querySelector(".wb") };
  front(el);
  el.addEventListener("pointerdown", () => front(el));
  el.querySelector(".wx").addEventListener("click", () => closeWin(id));
  el.querySelector(".wm").addEventListener("click", () => {
    if (w.prev) { Object.assign(el.style, w.prev); w.prev = null; el.classList.remove("max"); }
    else { w.prev = { left: el.style.left, top: el.style.top, width: el.style.width, height: el.style.height }; Object.assign(el.style, { left: "8px", top: "8px", width: (innerWidth - 16) + "px", height: (innerHeight - 16) + "px" }); el.classList.add("max"); }
  });
  const head = el.querySelector(".wh");
  head.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;
    const r = el.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    head.setPointerCapture(e.pointerId);
    const mv = (ev) => { el.style.left = Math.max(-r.width + 80, Math.min(innerWidth - 80, ev.clientX - dx)) + "px"; el.style.top = Math.max(0, Math.min(innerHeight - 36, ev.clientY - dy)) + "px"; };
    const up = () => { head.removeEventListener("pointermove", mv); head.removeEventListener("pointerup", up); };
    head.addEventListener("pointermove", mv); head.addEventListener("pointerup", up);
  });
  let last = "";
  w.ro = new ResizeObserver(() => { const k = w.body.clientWidth + "x" + w.body.clientHeight; if (k !== last) { last = k; drawWin(id); } });
  w.ro.observe(w.body);
  $('#dockBtns [data-w="' + id + '"]').classList.add("on");
  drawWin(id);
}
function closeWin(id) { const w = WINS[id]; if (!w) return; w.ro.disconnect(); w.el.remove(); delete WINS[id]; tip(null); $('#dockBtns [data-w="' + id + '"]').classList.remove("on"); }
function topWin() { let best = null; Object.values(WINS).forEach((w) => { if (!best || +w.el.style.zIndex > +best.el.style.zIndex) best = w; }); return best; }
function drawCharts() { Object.keys(WINS).forEach(drawWin); }
function drawWin(id) { const w = WINS[id]; if (!w) return; if (id === "kinds") drawKinds(w.body); else if (id === "countries") drawCountriesChart(w.body); else drawTable(w.body); }

// one bar per tradition; the number of countries each is placed in beside it
function drawKinds(el) {
  const rows = KINDS.map(([id, lab]) => { const ls = locations.filter((l) => l.category === id); return { id, lab, n: ls.length, c: new Set(ls.map((l) => l.country)).size }; });
  const max = Math.max(...rows.map((r) => r.n));
  el.innerHTML = '<div class="kwrap" style="display:block">' + rows.map((r) =>
    '<div class="crow' + (S.kinds.has(r.id) ? "" : " off") + '" data-k="' + r.id + '"><span class="cl">' + dot(r.id) + esc(r.lab) + '</span><span class="cb"><i style="width:' + (r.n / max * 100) + '%;background:' + KC[r.id] + '"></i></span><span class="cn">' + r.n + '</span><span class="cn2">' + r.c + (r.c === 1 ? " country" : " countries") + '</span></div>').join("") +
    '<div class="sub" style="margin-top:10px">' + N + ' places in ' + COUNTRIES.length + ' countries. Click a tradition to show only it; click it again to show every tradition.</div></div>';
  el.querySelectorAll("[data-k]").forEach((d) => d.addEventListener("click", () => {
    const k = d.dataset.k;
    if (S.kinds.size === 1 && S.kinds.has(k)) KINDS.forEach((x) => S.kinds.add(x[0])); else { S.kinds.clear(); S.kinds.add(k); }
    buildKey(); update();
  }));
}
// one bar per country, split by tradition
function drawCountriesChart(el) {
  const rows = COUNTRIES.map((c) => { const ls = locations.filter((l) => l.country === c); const by = {}; ls.forEach((l) => { by[l.category] = (by[l.category] || 0) + 1; }); return { c, n: ls.length, by }; })
    .sort((a, b) => b.n - a.n || a.c.localeCompare(b.c));
  const max = rows[0].n;
  el.innerHTML = '<div class="kwrap" style="display:block">' + rows.map((r) =>
    '<div class="crow" data-c="' + esc(r.c) + '" title="' + esc(KINDS.filter((k) => r.by[k[0]]).map((k) => k[1] + " " + r.by[k[0]]).join(", ")) + '"><span class="cl">' + esc(r.c) + '</span><span class="cb">' +
    KINDS.filter((k) => r.by[k[0]]).map((k) => '<i style="width:' + (r.by[k[0]] / max * 100) + '%;background:' + KC[k[0]] + ';opacity:' + (S.kinds.has(k[0]) ? 1 : .25) + '"></i>').join("") +
    '</span><span class="cn">' + r.n + '</span></div>').join("") +
    '<div class="sub" style="margin-top:10px">Bars are split by tradition, in the colours of the key. Click a country to fly to its places.</div></div>';
  el.querySelectorAll("[data-c]").forEach((d) => d.addEventListener("click", () => {
    const ls = locations.filter((l) => l.country === d.dataset.c), fb = freeBox();
    const b = new maplibregl.LngLatBounds(); ls.forEach((l) => b.extend([l.lng, l.lat]));
    map.fitBounds(b, { padding: { left: fb.L + 60, right: fb.R + 60, top: 80, bottom: 80 }, maxZoom: 6, duration: 1100 });
  }));
}
const COLS = [["name", "Name"], ["city", "Place"], ["country", "Country"], ["category", "Tradition"], ["source", "Source, as given"]];
function drawTable(el) {
  const [k, dir] = S.sort, val = (l) => k === "category" ? LABEL[l.category] : l[k];
  const rows = locations.map((l, i) => [l, i]).sort((a, b) => dir * String(val(a[0])).localeCompare(String(val(b[0]))) || a[0].country.localeCompare(b[0].country) || a[0].name.localeCompare(b[0].name));
  el.innerHTML = '<table class="all"><thead><tr>' + COLS.map((c) => '<th data-s="' + c[0] + '">' + c[1] + (k === c[0] ? (dir > 0 ? " ▴" : " ▾") : "") + '</th>').join("") + '</tr></thead><tbody>' +
    rows.map(([l, i]) => '<tr class="r' + (S.sel === i ? " sel" : "") + '" data-i="' + i + '"' + (onMap(l) ? "" : ' style="opacity:.45"') + '><td>' + dot(l.category, 8) + esc(l.name) + '</td><td>' + esc(l.city) + '</td><td>' + esc(l.country) + '</td><td>' + esc(LABEL[l.category]) + '</td><td>' + esc(l.source) + '</td></tr>').join("") + '</tbody></table>';
  el.querySelectorAll("[data-s]").forEach((th) => th.addEventListener("click", () => { S.sort = [th.dataset.s, S.sort[0] === th.dataset.s ? -S.sort[1] : 1]; drawTable(el); }));
  el.querySelectorAll("[data-i]").forEach((tr) => tr.addEventListener("click", () => select(+tr.dataset.i, true)));
}

/* ---------- the sky behind the globe and the flat map ---------- */
function stars() {
  let seed = 1977; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const W = 1400, H = 1000, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#03040a"; g.fillRect(0, 0, W, H);
  [[.22, .30, 520, "48,58,92", .10], [.78, .68, 600, "70,52,86", .08], [.58, .14, 420, "42,74,84", .06], [.10, .86, 380, "56,60,80", .07]].forEach(([x, y, r, rgb, a]) => {
    for (let k = 0; k < 2; k++) for (let dx = -W; dx <= W; dx += W) for (let dy = -H; dy <= H; dy += H) {
      const gr = g.createRadialGradient(x * W + dx, y * H + dy, 0, x * W + dx, y * H + dy, r);
      gr.addColorStop(0, "rgba(" + rgb + "," + a + ")"); gr.addColorStop(1, "rgba(" + rgb + ",0)");
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
    }
  });
  const tints = ["255,255,255", "214,224,255", "236,232,246", "224,236,240"];
  const pt = (x, y, r, a, t) => { for (const dx of [0, -W, W]) for (const dy of [0, -H, H]) { g.beginPath(); g.arc(x + dx, y + dy, r, 0, 7); g.fillStyle = "rgba(" + t + "," + a + ")"; g.fill(); } };
  for (let i = 0; i < 2600; i++) pt(rnd() * W, rnd() * H, .25 + rnd() * .55, .15 + rnd() * .55, tints[(rnd() * 4) | 0]);
  for (let i = 0; i < 90; i++) {
    const x = rnd() * W, y = rnd() * H, r = .8 + rnd() * .9, t = tints[(rnd() * 4) | 0];
    for (const dx of [0, -W, W]) for (const dy of [0, -H, H]) { const gr = g.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, r * 4); gr.addColorStop(0, "rgba(" + t + ",.35)"); gr.addColorStop(1, "rgba(" + t + ",0)"); g.fillStyle = gr; g.fillRect(x + dx - r * 4, y + dy - r * 4, r * 8, r * 8); }
    pt(x, y, r, .9, t);
  }
  const el = $("#map");
  el.style.background = '#03040a url(' + c.toDataURL("image/jpeg", .9) + ') repeat';
  el.style.backgroundSize = W + "px " + H + "px";
  const drift = () => { const ct = map.getCenter(), z = map.getZoom(); el.style.backgroundPosition = Math.round(-ct.lng * 3) + "px " + Math.round(ct.lat * 3 + z * 6) + "px"; };
  map.on("move", drift); drift();
}

/* ---------- everything that changes together ---------- */
function update() {
  const s = shown(), cs = new Set(s.map((l) => l.country)).size;
  const c = $("#cnt"); if (c) c.textContent = "Shown: " + s.length + " of " + N + " places, in " + cs + " of " + COUNTRIES.length + " countries.";
  drawMap(); drawList(); drawCharts();
  if (S.sel != null && $("#det").classList.contains("open")) detail(S.sel);
}

function init() {
  addLayers(); buildKey(); buildTr(); buildDock(); stars();
  $("#detX").addEventListener("click", deselect);
  $("#worldBtn").addEventListener("click", wholeWorld);
  $("#toggleKey").addEventListener("click", () => { const p = $("#key"); p.classList.toggle("min"); $("#toggleKey").textContent = p.classList.contains("min") ? "+" : "−"; });
  $("#toggleTr").addEventListener("click", () => { const p = $("#tr"); p.classList.toggle("min"); $("#toggleTr").textContent = p.classList.contains("min") ? "Basemap +" : "−"; });
  if (innerWidth <= 820) { $("#key").classList.add("min"); $("#toggleKey").textContent = "+"; $("#tr").classList.add("min"); $("#toggleTr").textContent = "Basemap +"; }
  ready = true; order(); update();
  map.jumpTo({ center: [30, 20], zoom: startZoom(), padding: { left: freeBox().L, right: freeBox().R, top: 0, bottom: 0 } });
}

/* ---------- about and sources ---------- */
const info = $("#info");
info.innerHTML =
  '<h2>What the map shows</h2>' +
  '<p>' + N + ' entries in ' + COUNTRIES.length + ' countries where animals are sacrificed in religious or ritual practice, in fifteen traditions: ' + KINDS.map((k) => esc(k[1]) + ' (' + kc(k[0]) + ')').join(", ") + '. Each is a point, or an area where the entry names a whole region; its colour is its tradition.</p>' +
  '<p>Click a point (or a name in the list on the left) to open its card. The Charts box opens three windows that can be moved, resized and kept open together: the places by tradition, the places by country, and all ' + N + ' entries in a table that can be sorted by any column.</p>' +
  '<h2>Points and areas</h2><ul>' +
  '<li>Entries that name a province, region or country rather than one site (for example West Bengal, KwaZulu-Natal, the Mekong Delta, "Greek Villages", "Nationwide" in Madagascar) are drawn as that area, lightly shaded in the tradition\'s colour, not as a point. Their cards name the area drawn. Outlines: Natural Earth (public domain).</li>' +
  '<li>Two entries in Lagos, Nigeria (one Islamic, one Yoruba) share one point. They are drawn side by side, a few pixels apart, so both can be seen and clicked.</li>' +
  '<li>Shading countries counts this map\'s entries in each country. It shows where entries were gathered, not how much sacrifice takes place: the United States has 17 entries and Pakistan 2, though Eid al-Adha sacrifice takes place across Pakistan. Kosovo is matched by name; Eswatini, missing from the boundaries file, is drawn from Natural Earth.</li>' +
  '<li>A few points stand for a town rather than the site itself, because no published location for the site was found: the Church of Lukumi Babalu Aye (Hialeah), Durgabari (Agartala), Kandhen Budhi Temple and Saut d\'Eau. Their cards say so.</li></ul>' +
  '<h2>Changes from the original file</h2>' +
  '<p>Every change is also written on the entry\'s own card. The tradition the original file called "shamanic" is named "Asian folk and shamanic" here, because several of its entries are village-god, imperial or Yàng rites rather than shamanic ones.</p><ul>' +
  Object.keys(NOTES).filter((k) => !/^No published/.test(NOTES[k].changed)).map((k) => '<li><b>' + esc(k.replace("|", ", ")) + ':</b> ' + esc(NOTES[k].changed) + '</li>').join("") + '</ul>' +
  '<h2>Sources</h2>' +
  '<p>Each card gives the source as recorded for the entry. Entries listed above also link to the sources found and read for this version.</p>' +
  '<p class="mute">Country shapes: the Culprits map\'s boundaries file. Basemaps: the Culprits map\'s basemaps, with credits in the map\'s corner.</p>';
const openInfo = (on) => { info.classList.toggle("open", on); };
$("#infoBtn").addEventListener("click", () => openInfo(true));
$("#infoBtn").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openInfo(true); } });
$("#infoClose").addEventListener("click", () => openInfo(false));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { const tw = topWin(); if (info.classList.contains("open")) openInfo(false); else if (tw) closeWin(tw.id); else if (S.sel != null) deselect(); } });
})();

</script>
