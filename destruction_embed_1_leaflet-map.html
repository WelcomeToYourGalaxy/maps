<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Fighting Map</title>
<meta name="description" content="Arenas, markets and regions where animals are made to fight, by kind of animal. Welcome to Your Galaxy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
:root{
  --bg:#110f0f; --panel:#181515; --panel2:#211d1c; --line:#38302e; --ink:#ebe5de; --mute:#a99f98; --faint:#80766f;
  --on:#3a2f2f; --onl:#6a5654; --link:#bfb0c6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 "Marcellus",Georgia,serif}
#app{position:fixed;inset:0;display:flex}
#side{width:360px;max-width:100%;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:500}
#side header{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
#side h1{font:400 23px/1.15 "Uncial Antiqua","Marcellus",Georgia,serif;margin:0 0 6px;letter-spacing:.5px}
#side .lede{margin:0;color:var(--mute);font-size:13px}
#scroll{overflow:auto;flex:1;padding:6px 16px 24px}
#mapwrap{flex:1;position:relative;min-width:0}
#mapwrap #map{position:absolute;inset:0}
#map{background:#0c0a0a}
#globe{position:absolute;inset:0;z-index:450;background:#0c0a0a}
#globe[hidden]{display:none}
#mapwrap.globe .leaflet-control-attribution{display:none}
.maplibregl-ctrl-attrib{background:rgba(17,15,15,.8)!important;color:var(--mute)!important}
.maplibregl-ctrl-attrib-inner{color:var(--mute)}
.maplibregl-ctrl-attrib a{color:var(--mute)!important}
.maplibregl-ctrl-attrib-button{filter:invert(1)}
.maplibregl-ctrl-group{background:#1d1918!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}
#worldbtn{position:absolute;left:10px;top:84px;z-index:700;display:flex;align-items:center;gap:6px;background:#1d1918;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:13px "Marcellus",Georgia,serif;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.4)}
#worldbtn:hover{background:#272120}
#tr{position:absolute;right:10px;top:10px;z-index:800;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;align-items:flex-start;max-width:calc(100% - 380px)}
.bm{flex:none;display:flex;gap:4px;background:rgba(24,21,21,.9);border:1px solid var(--line);border-radius:999px;padding:3px}
.bm button{background:none;border:0;color:var(--mute);padding:4px 10px;border-radius:999px;font:12px "Marcellus",Georgia,serif;cursor:pointer}
.bm button.on{background:var(--on);color:var(--ink)}
h2{font:600 12px/1 "Marcellus",Georgia,serif;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin:18px 0 8px}
#q{width:100%;margin-top:10px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:14px "Marcellus",Georgia,serif}
#q::placeholder{color:var(--faint)}
#shown{color:var(--faint);font-size:12px;margin:8px 2px 0}
#shown b{color:var(--ink);font-weight:400}
.kd{border-top:1px solid var(--line);margin-top:12px}
.grp{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.grp button[data-all]{background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:3px 10px;font:12px "Marcellus",Georgia,serif;cursor:pointer}
.grp button[data-all]:hover{color:var(--ink);border-color:var(--onl)}
.kfold{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;font:400 17px "Marcellus",Georgia,serif;color:var(--ink);flex:1}
.kfold .ar{color:var(--mute);width:12px;font-size:12px}
.kfold .kn{color:var(--faint);font-size:12px;margin-left:6px}
.row{display:flex;align-items:flex-start;gap:9px;padding:6px 4px;border-radius:6px;cursor:pointer}
.row:hover{background:var(--panel2)}
.row input{margin:3px 0 0;accent-color:#8a7472}
.sw{flex:0 0 10px;height:10px;border-radius:50%;margin-top:5px;box-shadow:0 0 0 1px rgba(246,240,236,.35)}
.row .t{flex:1}
.row .n{color:var(--faint);font-variant-numeric:tabular-nums;font-size:12px;margin-top:1px}
.row small{display:block;color:var(--faint);font-size:12px}
.key{display:grid;grid-template-columns:16px 1fr;gap:6px 8px;align-items:center;font-size:12px;color:var(--mute);margin:6px 0}
.key i{width:12px;height:12px;border-radius:50%;display:block;justify-self:center}
.note{color:var(--mute);font-size:12.5px}
.note p{margin:6px 0}
#aboutbtn{margin-top:10px;width:100%;background:#231e1d;border:1px solid #463c39;color:var(--ink);border-radius:8px;padding:8px 10px;font:14px "Marcellus",Georgia,serif;cursor:pointer;text-align:left}
#aboutbtn:hover{background:#2b2524}
#toggle{display:none}
#info{position:fixed;inset:0;z-index:2000;background:rgba(8,6,6,.62);display:flex;align-items:center;justify-content:center;padding:20px}
#info[hidden]{display:none}
#infobox{width:min(760px,96vw);max-height:88vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.6)}
.ihead{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
.ihead h2{margin:0;font:400 19px "Uncial Antiqua","Marcellus",Georgia,serif;text-transform:none;letter-spacing:.3px;color:var(--ink)}
#infoclose{background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;width:30px;height:30px;cursor:pointer;font-size:13px}
.ibody{padding:14px 22px 22px;overflow:auto}
.ibody .note{font-size:13.5px}
.ibody table{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0 4px}
.ibody td,.ibody th{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);color:var(--mute);font-weight:400}
.ibody th{color:var(--ink)}
.ibody .n{text-align:right;font-variant-numeric:tabular-nums}
/* popups */
.leaflet-popup-content-wrapper{background:#1d1918;color:var(--ink);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.leaflet-popup-tip{background:#1d1918}
.leaflet-popup-content{margin:14px 16px;font:13.5px/1.5 "Marcellus",Georgia,serif;max-height:min(60vh,480px);overflow:auto}
.leaflet-container a.leaflet-popup-close-button{color:var(--mute)}
.gpop .maplibregl-popup-content{background:#1d1918;color:var(--ink);border-radius:10px;padding:14px 16px;font:13.5px/1.5 "Marcellus",Georgia,serif;max-height:min(60vh,480px);overflow:auto;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.gpop .maplibregl-popup-tip{border-top-color:#1d1918;border-bottom-color:#1d1918}
.gpop .maplibregl-popup-close-button{color:var(--mute);font-size:18px;padding:2px 8px}
.af-pop h3{font:600 15.5px/1.3 "Marcellus",Georgia,serif;margin:0 0 4px}
.af-pop .meta{color:var(--mute);font-size:12px;margin-bottom:8px}
.af-pop .tag{display:inline-block;border:1px solid #5e4f4c;border-radius:999px;padding:0 7px;font-size:11px;color:#ddd3cc;margin:0 4px 2px 0}
.af-pop .tag.il{border-color:#8a5560;color:#e0c6cb}
.af-pop p{margin:6px 0}
.af-pop .fig{color:#e6dfd8;background:#272120;border-radius:6px;padding:6px 8px;font-size:12.5px}
.af-pop .where{font-size:12px;color:var(--faint)}
.af-pop .src{font-size:12px;color:var(--mute);border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
.af-list ol{margin:6px 0 0;padding-left:20px;max-height:300px;overflow:auto}
.af-list li{margin:3px 0}
.af-list li span{display:block;color:var(--faint);font-size:11px}
.af-pop a,.af-list a{color:var(--link)}
.leaflet-control-attribution{background:rgba(17,15,15,.75)!important;color:var(--faint)!important}
.leaflet-control-attribution a{color:var(--mute)!important}
.leaflet-bar a{background:#1d1918;color:var(--ink);border-color:var(--line)}
.leaflet-bar a:hover{background:#272120}
.relief{filter:grayscale(1) invert(1) brightness(.62) contrast(1.15)}
.jurimg{filter:brightness(.94) contrast(1.06) saturate(1.12)}
.atlasplate{z-index:5}
.atlasimg{filter:saturate(1.15) brightness(1.06) hue-rotate(-6deg)}
@media (max-width:760px){
  #app{flex-direction:column-reverse}
  #side{width:100%;height:46%;border-right:0;border-top:1px solid var(--line)}
  #side.min{height:58px}
  #toggle{display:block;position:absolute;right:12px;top:12px;background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:3px 10px;font:12px "Marcellus",Georgia,serif}
  #side header{position:relative}
  #tr{max-width:calc(100% - 60px)}
}
</style>
</head>
<body>

    <header>
      <h1>Animal Fighting Map</h1>
      <p class="lede">Arenas, markets and regions where animals are made to fight one another or are baited, by kind of animal.</p>
      <button id="aboutbtn" type="button">About this map</button>
      <button id="toggle" type="button">Hide</button>

      <input id="q" type="search" placeholder="Search a name, city, country or kind of fight" aria-label="Search">

</div>
<div id="tr">
<div class="bm" id="bm"><button type="button" data-b="atlas" class="on">Atlas</button><button type="button" data-b="jurassic">Jurassic</button><button type="button" data-b="night">Bioluminescent</button><button type="button" data-b="relief">Relief</button><button type="button" data-b="hell">Hell</button></div>
<div class="bm" id="viewsw"><button type="button" data-v="globe" class="on">Globe</button><button type="button" data-v="flat">Flat map</button></div>
</div>
<div id="info" hidden>
  <div id="infobox" role="dialog" aria-modal="true" aria-labelledby="infoh">
    <div class="ihead"><h2 id="infoh">About this map</h2><button type="button" id="infoclose" aria-label="Close">✕</button></div>

  </div>
</div>

na Cañaveralejo)","city":"Cali","country":"Colombia","lat":3.4107,"lon":-76.5488,"type":"bullfighting","size":"Arena (14,368)","region":false,"v":"corrected","st":"active","ey":null,"note":"Cali's bullring, opened in 1957 and renamed Arena Cañaveralejo in 2017. It still holds the late-December bullfighting fair, which will end when Colombia's national ban takes effect in July 2027.","src":[{"title":"Plaza de Toros Cañaveralejo","publisher":"Wikipedia","date":"","url":"https://en.wikipedia.org/wiki/Plaza_de_Toros_Ca%C3%B1averalejo"},{"title":"Contra viento y marea, Cali y Manizales ponen en marcha sus ferias taurinas en la antesala de su prohibición","publisher":"Portafolio","date":"2025-12-24","url":"https://www.portafolio.co/tendencias/contra-viento-y-marea-cali-y-manizales-ponen-en-marcha-sus-ferias-taurinas-en-la-antesala-de-su-prohibicion-485257"}]},{"name":"Plaza de Toros de Manizales","city":"Manizales","country":"Colombia","lat":5.0639,"lon":-75.525,"type":"bullfighting","size":"Arena (designed for 12,000)","region":false,"v":"corrected","st":"active","ey":null,"note":"Bullring opened in 1951 that hosts bullfights during the Manizales Fair each January. Bullfighting there will end when Colombia's national ban takes effect in July 2027.","src":[{"title":"Plaza de Toros de Manizales","publisher":"Wikipedia","date":"","url":"https://en.wikipedia.org/wiki/Plaza_de_Toros_de_Manizales"},{"title":"Contra viento y marea, Cali y Manizales ponen en marcha sus ferias taurinas en la antesala de su prohibición","publisher":"Portafolio","date":"2025-12-24","url":"https://www.portafolio.co/tendencias/contra-viento-y-marea-cali-y-manizales-ponen-en-marcha-sus-ferias-taurinas-en-la-antesala-de-su-prohibicion-485257"}]},{"name":"Plaza de toros de Acho","city":"Lima","country":"Peru","lat":-12.0414,"lon":-77.0233,"type":"bullfighting","size":"Historic Arena (13,700)","region":false,"v":"corrected","st":"active","ey":null,"note":"Lima's bullring in the Rímac district, opened in map.org/way/335254231"}]},{"name":"Coliseo Gallistico de Isla Verde","city":"Carolina","country":"Puerto Rico","lat":18.4339,"lon":-66.0015,"type":"cockfighting","size":"Major Arena (4,500)","region":false,"v":"unverified","st":"unknown","ey":null,"note":"No source names a \"Coliseo Gallístico de Isla Verde\"; searches for that name and for galleras in Isla Verde/Carolina found only the Club Gallístico de Puerto Rico (entry 68), so this is likely a duplicate.","src":[{"title":"Pedro Pierluisi defiende su presencia en gallera de Isla Verde","publisher":"El Nuevo Día","date":"2024-04-29","url":"https://www.elnuevodia.com/noticias/politica/notas/pedro-pierluisi-defiende-su-presencia-en-gallera-de-isla-verde-la-pase-bien"}]},{"name":"Club Gallistico de Ponce","city":"Ponce","country":"Puerto Rico","lat":18.0111,"lon":-66.6141,"type":"cockfighting","size":"Regional Arena (3,000)","region":true,"v":"unverified","st":"unknown","ey":null,"note":"Searched in Spanish for galleras and 'Club Gallístico' in Ponce; none found. A May 2026 report says over 70 cockpits still operate across Puerto Rico despite the federal ban, but names none in Ponce.","src":[{"title":"Defienden las peleas de gallos en Puerto Rico tras reportaje sobre Edwin Díaz y los hermanos José Luis e Irad Ortiz","publisher":"Primera Hora","date":"2026-05-16","url":"https://www.primerahora.com/deportes/otros/notas/defienden-las-peleas-de-gallos-en-puerto-rico-tras-reportaje-sobre-edwin-diaz-y-los-hermanos-jose-luis-e-irad-ortiz/"}]},{"name":"Wantilan of Pura Pangrebongan (Pura Petilan), Kesiman","city":"Denpasar","country":"Indonesia","lat":-8.6461,"lon":115.2448,"type":"cockfighting","size":"Temple pavilion (capacity not published)","region":false,"v":"corrected","st":"active","ey":null,"note":"No source names a standing cockfighting arena in Denpasar. A 2021 law journal article documents tajen held once a year at the wantilan (pavilion) of Pura Pangrebongan in Desa Kesiman, East Denpasar, on the temple's festival day; the temple, also called Pura Petilan, is on Jalan WR Supratman. Gambling cockfights are illegal in Indonesia.","src":[{"title":"Bali mulls legalizing cockfighting","publisher":"The Jakarta Post","date":"2025-06-24","url":"https://www.thejakartapost.com/indonesia/2025/06/25/bali-mulls-legalizing-cockfighting"},{"title":"Tabuh Rah dan Tajen: Antara Tradisi dan Hukum","publisher":"Jurnal Hukum dan Kebudayaan, Universitas Hindu Indonesia","date":"2021-05","url":"https://ejournal.unhi.ac.id/index.php/hkb/article/download/1729/1039"},{"title":"Pura Petilan Pengerebongan","publisher":"Denpasar Tourism","date":"2023-04-04","url":"https://ebooks.denpasartourism.com/en/?p=3799"},{"title":"Pura Agung Petilan (OpenStreetMap way/486135887)","publisher":"OpenStreetMap","date":"","url":"https://www.openstreetmap.org/way/486135887"}]},{"name":"Ubud area village cockfights (tajen)","city":"Ubud","country":"Indonesia","lat":-8.5069,"lon":115.2625,"type":"cockfighting","size":"Documented activity region","region":true,"v":"corrected","st":"illegal_documented","ey":null,"note":"No permanent cockpit in Ubud was found. A 2014 report describes a gambling cockfight in Dukuh village south of Ubud. Such fights have been banned since 1981; cockfights held as temple rituals (tabuh rah) are exempt.","src":[{"title":"The surviving Balinese cockfighting rituals","publisher":"The Jakarta Post","date":"2014-08-15","url":"https://www.thejakartapost.com/news/2014/08/15/the-surviving-balinese-cockfighting-rituals"},{"title":"Wantilan","publisher":"Wikipedia","date":"","url":"https://en.wikipedia.org/wiki/Wantilan"}]},{"name":"Chonburi Buffalo Fighting Stadium","city":"Chonburi","country":"Thailand","lat":13.3611,"lon":100.9847,"type":"buffalo","size":"Major Arena (5,000)","region":false,"v":"unverified","st":"unknown","ey":null,"note":"No source was found for buffalo fighting in Chonburi; searches in English and Thai (ชนควาย ชลบุรี) only turned up the province's buffalo races, which are racing, not fighting.","src":[{"title":"Chonburi province","publisher":"Wikipedia","date":"","url":"https://en.wikipedia.org/wiki/Chonburi_province"},{"title":"สังคมภูมิภาคตะวันออก (buffalo races at Bo Thong and Nong Yai, Chonburi)","publisher":"Daily News (Thailand)","date":"2025-10-21","url":"https://www.dailynews.co.th/articles/5223027/"}]},{"name":"Ban Sao Thong bullfighting stadium","city":"Ron Phibun, Nakhon Si Thammarat","country":"Thailand","lat":8.277,"lon":99.9092,"type":"bullbull","size":"Stadium","region":false,"v":"corrected","st":"unknown","ey":null,"note":"Bull-fighting ground (bull against bull) at Hin Tok, Ron Phibun district, Nakhon Si Thammarat province, as mapped in OpenStreetMap. Thai-language searches for the ground's name found no news on whether fights are still held there.","src":[{"title":"สนามกีฬาชนโคบ้านเสาธง (node 13252028316)","publisher":"OpenStreetMap","date":"","url":"https://www.openstreetmap.org/node/13252028316"}]},{"name":"Rattaphum International Bull Fighting Stadium","city":"Rattaphum, Songkhla","country":"Thailand","lat":7.135,"lon":100.2733,"type":"bullbull","size":"Arena","region":false,"v":"corrected","st":"unknown","ey":null,"note":"The fights recorded in Songkhla are bull against bull (wua chon), not buffalo. The main venue is the International Bull Fighting Stadium in Rattaphum district, which held 20-million and 24-million-baht matches in 2017 and a 10-million-baht match in 2018, with close to 10,000 people at the 2017 match. In 2017 Songkhla had 12 of the South's 28 bullfighting rings. The province closed all of them indefinitely in January 2021 because of COVID, and no source from 2023–2026 was found. The point marks Rattaphum district, not the stadium itself.","src":[{"title":"สนามชนโคภาคใต้บูมกว่า28แห่ง สงขลาครองแชมป์","publisher":"Krungthep Turakij (Bangkok Biz News)","date":"2017-02-27","url":"https://www.bangkokbiznews.com/news/742630"},{"title":"ศึกวัวชนนัดแห่งศักดิ์ศรี โคโหนดหลังขาว ล้ม โคแดงพลังสิงห์ ทุบสถิติเดิมพันสูงสุด 24 ล้าน","publisher":"Matichon","date":"2017-03-26","url":"https://www.matichon.co.th/local/news_508728"},{"title":"ฮือฮา! วัวชนคู่เอกเมืองสงขลา เดิมพัน 10 ล้าน","publisher":"Thai Post","date":"2018-11-19","url":"https://www.thaipost.net/main/detail/22288"},{"title":"Bullfighting reigns supreme in Songkhla","publisher":"The Star TV","date":"2017-03-17","url":"https://thestartv.com/v/bullfighting-reigns-supreme-in-songkhla"},{"title":"สงขลา คุมเข้มสกัดโควิด ปิดสนามวัวชน-ไก่ชน-กัดปลา ไม่มีกำหนด","publisher":"Thansettakij","date":"2021-01-06","url":"https://www.thansettakij.com/general-news/463204"},{"title":"Rattaphum district","publisher":"Wikipedia","date":"","url":"https://en.wikipedia.org/wiki/Rattaphum_district"}]},{"name":"Pattani Buffalo Arena","city":"Pattani","country":"Thailand","lat":6.8686,"lon":101.2508,"type":"buffalo","size":"Regional Arena (2,000)","region":true,"v":"unverified","st":"unknown","ey":null,"note":"No source found for buffalo fighting in Pattani. Thai searches (ชนควาย ปัตตานี, บ่อนชนควาย, สนามชนควาย) returned only unrelated Pattani news and a buffalo beauty contest in Kalasin.","src":[]},{"name":"Cockfighting arenas of Bangkok (unnamed)","city":"Bangkok","country":"Thailand","lat":13.7563,"lon":100.5018,"type":"cockfighting","size":"Documented activity region","region":true,"v":"corrected","st":"unknown","ey":null,"note":"No single named stadium was found. Bangkok's city government ordered its cockfighting arenas and practice rings closed during COVID-19 in August 2020 and Dec 2020–Jan 2021, which shows they exist; no named venue or capacity is given, so the point marks the city, not a site.","src":[{"title":"Gambling in Thailand","publisher":"Wikipedia","date":"","url":"https://en.wikipedia.org/wiki/Gambling_in_Thailand"},{"title":"ขยาย พ.ร.ก.ฉุกเฉิน กทม.สั่งปิดสนามชนไก่-ชนโค-กัดปลา ถึง 31 ส.ค.","publisher":"Sanook","date":"2020","url":"https://www.sanook.com/news/8220910/"},{"title":"ด่วน ! กทม.มีมติปิด 5 สถานที่เสี่ยงโควิด สนามม้า -สนามชนไก่ -สถานบริการ","publisher":"Matichon","date":"2020-12-28","url":"https://www.matichon.co.th/local/news_2504663"},{"title":"ด่วน! กทม.ปิด 'สนามม้า-ชนไก่-ชนโค อาบอบนวด' เตรียมโรงพยาบาลสนาม 1,000 เตียง","publisher":"The Bangkok Insight","date":"2020-12-28","url":"https://www.thebangkokinsight.com/514592/"}]},{"name":"Chiang Mai cockfighting venue","city":"Chiang Mai","country":"Thailand","lat":18.7883,"lon":98.9853,"type":"cockfighting","size":"Venue (8 rings, 2 stadiums; largest seats hundreds)","region":false,"v":"corrected","st":"unknown","ey":null,"note":"A 2011 travel report describes a cockfighting venue in Chiang Mai with eight rings and two stadiums, the largest seating hundreds; a separate cockfighting museum and exhibition arena opened about 12 km north of the city in 2009. No more recent source on whether fights continue there was found. Coordinates mark the city, not the venue.","src":[{"title":"Cockfighting in Chiang Mai (Tales of Asia)","publisher":"Tales of Asia","date":"2011-01-24","url":"https://talesofasia.com/rs-290-pcm.htm"},{"title":"New Cockfighting Learning & Exhibition Centre Opened","publisher":"ASEAN Now forum","date":"2010-01-05","url":"https://aseannow.com/topic/327184-new-cockfighting-learing-exhibition-centre-opened/"}]},{"name":"Pamucak Arena (Efes Selçuk Camel Wrestling Festival)","city":"Selçuk","country":"Turkey","lat":37.9493,"lon":27.3689,"type":"camel","size":"Arena","region":false,"v":"corrected","st":"active","ey":null,"note":"The Efes Selçuk Camel Wrestling Festival holds its bouts at the Pamucak wrestling ground near Selçuk, İzmir province; the 42nd festival in January 2024 had about 160 camels. No source gives a seating capacity; spectators watch from the surrounding slopes. Coordinates mark Selçuk town.","src":[{"title":"42. Efes Selçuk Deve Güreşleri Festivali yapıldı","publisher":"Bengütürk","date":"2024-01-21","url":"https://www.benguturk.com/kultur-sanat/42-efes-selcuk-deve-guresleri-festivali-yapildi-141703h"},{"title":"Pamucak Arena heyecanlı güreşlere ev sahipliği yapacak","publisher":"Mynet / İHA","date":"2016-01-15","url":"https://www.mynet.com/pamucak-arena-heyecanli-gureslere-ev-sahipligi-yapacak-180102279730"}]},{"name":"Ayter Wrestling Arena (Ilıcabaşı, Efeler)","city":"Aydın","country":"Turkey","lat":37.856,"lon":27.8416,"type":"camel","size":"Arena (crowds near 10,000)","region":false,"v":"corrected","st":"active","ey":null,"note":"Aydın Metropolitan Municipality holds camel wrestling at the Ayter arena in Ilıcabaşı, Efeler district; about 10,000 people watched 195 camels in December 2019, and the event was held again in December 2023. Turkey's culture ministry says camel wrestling is most popular in Aydın province.","src":[{"title":"Aydın'da deve güreşi festivali büyük ilgi gördü","publisher":"TRT Haber","date":"2019-12-22","url":"https://www.trthaber.com/haber/guncel/aydinda-deve-guresi-festivali-buyuk-ilgi-gordu-448487.html"},{"title":"Çerçioğlu deve güreşi şenliğini iptal etmedi","publisher":"Yeni Asır","date":"2023-12-25","url":"https://www.yeniasir.com.tr/ege/aydin/2023/12/25/cercioglu-deve-guresi-senligini-iptal-etmedi"},{"title":"Camel Wrestling","publisher":"Republic of Türkiye Ministry of Culture and Tourism","date":"","url":"https://www.ktb.gov.tr/EN-98585/camel-wrestling.html"}]},{"name":"Özbey Arena (Torbalı Camel Wrestling Festival)","city":"Torbalı","country":"Turkey","lat":38.1619,"lon":27.3583,"type":"camel","size":"Arena (about 30,000 spectators reported)","region":false,"v":"corrected","st":"unknown","ey":null,"note":"No arena in İzmir city was found; the documented İzmir-province venue here is Özbey Arena in Torbalı district, where the 12th Torbalı camel wrestling festival drew a reported 30,000 people in February 2020. Coordinates mark Torbalı town, not the arena.","src":[{"title":"İzmir'de deve güreşlerini 30 bin kişi izledi","publisher":"Karar","date":"2020-02-03","url":"https://www.karar.com/izmirde-deve-gureslerini-30-bin-kisi-izledi-1463732"},{"title":"Torbalı","publisher":"Wikipedia","date":"","url":"https://en.wikipedia.org/wiki/Torbal%C4%B1"}]},{"name":"Traditional Turkish Sport Games Complex (Denizli)","city":"Denizli","country":"Turkey","lat":37.7765,"lon":29.0864,"type":"camel","size":"Arena","region":false,"v":"corrected","st":"active","ey":null,"note":"Denizli held camel wrestling with 120 camels at its Traditional Turkish Sport Games Complex in January 2024; Sarayköy district in the same province also holds a long-running festival (about 5,000 spectators in 2017). No source gives a seating capacity. Coordinates mark Denizli city.","src":[{"title":"120 Pehlivan Deve Denizli Arenasında Buluştu","publisher":"Haberler.com","date":"2024-01-21","url":"https://www.haberler.com/120-pehlivan-deve-denizli-arenasinda-bulustu-16765773-haberi/"},{"title":"Sarayköy'de -2 derecede deve güreşi keyfi","publisher":"Hürriyet","date":"2017-01-08","url":"https://www.hurriyet.com.tr/yerel-haberler/denizli/saraykoyde-2-derecede-deve-guresi-keyfi-40330314"}]},{"name":"Kabul Ram Fighting Arena","city":"Kabul","country":"Afghanistan","lat":34.5553,"lon":69.2075,"type":"ram","size":"Regional Arena (2,000)","region":true,"v":"unverified","st":"unknown","ey":null,"note":"No source found for a ram fighting arena in Kabul. Searches in English and Dari/Persian (jang-e quch, quch-e jangi) found Kabul reporting on Friday dog fights (RFE/RL, 2002) and partridge fights (2013), but nothing on rams.","src":[{"title":"Afghanistan: Friday Dog Fights Resume In Kabul","publisher":"Radio Free Europe/Radio Liberty","date":"2002-01-18","url":"https://www.rferl.org/a/1098517.html"}]},{"name":"Herat Ram Fighting Ground","city":"Herat","country":"Afghanistan","lat":34.3482,"lon":62.1997,"type":"ram","size":"Arena (1,500)","region":false,"v":"unverified","st":"unknown","ey":null,"note":"No source was found for a ram-fighting ground in Herat. News sources mention ram fights in Afghanistan only in general terms; searches in English and Persian (جنگ قوچ هرات) found nothing tied to Herat.","src":[]},{"name":"Asrlar Sadosi festival ram fights, Ichan-Qala","city":"Khiva","country":"Uzbekistan","lat":41.3783,"lon":60.3639,"type":"ram","size":"Festival event","region":false,"v":"corrected","st":"unknown","ey":null,"note":"No ram-fighting arena in Tashkent was found. Ram and rooster fights were held near the Said Alauddin Mausoleum in Khiva's Ichan-Qala during the May 2010 Asrlar Sadosi festival and drew hundreds of people. The festival moves to a different town each year (it was in Tashkent Region in 2009), and ram fights were on the programme again in Navoi Region in 2013. No source from 2023–2026 was found.","src":[{"title":"Asrlar Sadosi: Day 1. Meetings","publisher":"UzDaily","date":"2010-05-10","url":"https://www.uzdaily.uz/en/post/9994"},{"title":"Asrlar Sadosi: Day 2. Spectacular events","publisher":"UzDaily","date":"2010-05-11","url":"https://www.uzdaily.uz/en/post/10007"},{"title":"Asrlar Sadosi Festival of Traditional Culture","publisher":"Wikipedia","date":"","url":"https://en.wikipedia.org/wiki/Asrlar_Sadosi_Festival_of_Traditional_Culture"},{"title":"Itchan Kala","publisher":"Wikipedia","date":"","url":"https://en.wikipedia.org/wiki/Itchan_Kala"}]},{"name":"Dushanbe Ram Fighting","city":"Dushanbe","country":"Tajikistan","lat":38.5598,"lon":68.7738,"type":"ram","size":"Regional Arena (1,500)","region":true,"v":"unverified","st":"unknown","ey":null,"note":"No source found for ram fighting in Dushanbe. Russian and Tajik searches (бои баранов Душанбе/Навруз, ҷанги қӯчқорҳо) returned nothing on ram fights in Tajikistan.","src":[]},{"name":"Bab El Oued ram fights","city":"Algiers","country":"Algeria","lat":36.7907,"lon":3.0497,"type":"ram","size":"Documented activity (neighbourhood)","region":true,"v":"corrected","st":"unknown","ey":null,"note":"The 2017 documentary Of Sheep and Men (Karim Sayad) follows ram fights in the Bab El Oued neighbourhood of Algiers, arranged through Facebook pages with betting. A 2003 report says Algerian ram fights before Eid are unofficial but tolerated by authorities. There is no fixed arena.","src":[{"title":"TIFF Review: 'Of Sheep and Men' Explores Algeria's Ram Ecosystem","publisher":"The Film Stage","date":"2017-09-22","url":"https://thefilmstage.com/reviews/tiff-review-of-sheep-and-men-explores-algerias-ram-ecosystem/"},{"title":"Les combats de moutons de l'Aïd El Kébir","publisher":"Afrik.com","date":"2003-02-11","url":"https://www.afrik.com/les-combats-de-moutons-de-l-aid-el-kebir"},{"title":"Bab El Oued","publisher":"Wikipedia","date":"","url":"https://en.wikipedia.org/wiki/Bab_El_Oued"}]},{"name":"Casablanca Ram Fighting","city":"Casablanca","country":"Morocco","lat":33.5731,"lon":-7.5898,"type":"ram","size":"Regional Arena (2,000)","region":true,"v":"unverified","st":"unknown","ey":null,"note":"Searched in English, French and Arabic for ram fighting in Casablanca and Morocco; no source found.","src":[]},{"name":"Tehran Ram Fighting Arena","city":"Tehran","country":"Iran","lat":35.6892,"lon":51.389,"type":"ram","size":"Regional Arena (2,500)","region":true,"v":"unverified","st":"unknown","ey":null,"note":"No source found for a ram fighting arena in Tehran. Searches in English and Persian (jang-e quch, quch-e jangi, quch-bazi with Tehran) returned nothing on ram fights there.","src":[]},{"name":"Shilihe Tianjiao Culture City cricket market","city":"Beijing","country":"China","lat":39.9042,"lon":116.4074,"type":"cricket","size":"Market","region":false,"v":"corrected","st":"active","ey":null,"note":"Fighting crickets are sold at Beijing street markets including Shilihe Tianjiao Culture City and Tianqiao Market, and fights are held in the city each September; Beijing also hosts the National Cricket Fighting Championships. Gambling on the fights is illegal in China. Coordinates mark central Beijing, not the market.","src":[{"title":"Inside the jaw-clenching world of cricket fighting in China","publisher":"NPR","date":"2021-10-23","url":"https://www.npr.org/2021/10/23/1045988512/china-cricket-fighting"},{"title":"Cricket fighting","publisher":"Wikipedia","date":"","url":"https://en.wikipedia.org/wiki/Cricket_fighting"}]},{"name":"Flower, Bird, Fish & Insect Market (Xizang Road South)","city":"Shanghai","country":"China","lat":31.2018,"lon":121.4896,"type":"cricket","size":"Market","region":false,"v":"corrected","st":"unknown","ey":null,"note":"Shanghai has more than a dozen cricket markets; this one on South Xizang Road in Huangpu sells crickets, most as cheap souvenirs. A 2016 listing called it fast-disappearing, and no newer source on its status was found. It is a market, not a fighting arena.","src":[{"title":"Flower, Bird, Fish & Insect Market","publisher":"Atlas Obscura","date":"2016-06-20","url":"https://www.atlasobscura.com/places/shanghais-bird-flower-insect-market"},{"title":"Cricket fighting","publisher":"Wikipedia","date":"","url":"https://en.wikipedia.org/wiki/Cricket_fighting"}]},{"name":"Tianjin cricket fighting contests","city":"Tianjin","country":"China","lat":39.3434,"lon":117.3616,"type":"cricket","size":"Documented activity (city)","region":true,"v":"corrected","st":"active","ey":null,"note":"Tianjin hosts annual cricket fighting face-offs, according to NPR in 2021, and had established cricket clubs in the Qing dynasty. No specific market or venue is named in the sources. Coordinates mark the city.","src":[{"title":"Inside the jaw-clenching world of cricket fighting in China","publisher":"NPR","date":"2021-10-23","url":"https://www.npr.org/2021/10/23/1045988512/china-cricket-fighting"},{"title":"The Fighting Cricket","publisher":"Wikipedia","date":"","url":"https://en.wikipedia.org/wiki/The_Fighting_Cricket"}]},{"name":"Nanjing Cricket Fighting","city":"Nanjing","country":"China","lat":32.0603,"lon":118.7969,"type":"cricket","size":"Arena (500)","region":false,"v":"unverified","st":"unknown","ey":null,"note":"No source was found for a cricket-fighting venue in Nanjing. Searches in English and Chinese (南京 斗蟋蟀) found cricket fighting documented in Shanghai, Hangzhou and Shandong, but not Nanjing.","src":[]},{"name":"Hangzhou cricket fighting contests","city":"Hangzhou","country":"China","lat":30.2741,"lon":120.1551,"type":"cricket","size":"Documented activity (city)","region":true,"v":"corrected","st":"active","ey":null,"note":"Hangzhou hosts annual cricket fighting face-offs that NPR described in 2021 as splashy, televised events. No specific arena is named. Coordinates mark the city.","src":[{"title":"Inside the jaw-clenching world of cricket fighting in China","publisher":"NPR","date":"2021-10-23","url":"https://www.npr.org/2021/10/23/1045988512/china-cricket-fighting"}]},{"name":"Tokyo beetle wrestling matches","city":"Tokyo","country":"Japan","lat":35.6895,"lon":139.6917,"type":"beetle","size":"Documented events (city)","region":false,"v":"corrected","st":"unknown","ey":null,"note":"A 2000 news report describes a beetle wrestling match in Tokyo won by a beetle named Sumatra Hirata. No permanent arena or venue is named, and no newer source was found. Coordinates mark the city.","src":[{"title":"Japanese are going buggy","publisher":"Deseret News","date":"2000-06-30","url":"https://www.deseret.com/2000/6/30/19515471/japanese-are-going-buggy"}]},{"name":"Osaka Beetle Fighting","city":"Osaka","country":"Japan","lat":34.6937,"lon":135.5023,"type":"beetle","size":"Arena (400)","region":false,"v":"unverified","st":"unknown","ey":null,"note":"No source found for beetle fighting in Osaka. Searched in Japanese for beetle sumo (カブトムシ相撲), insect battles (昆虫バトル) and Osaka beetle events. The Osaka events found (Keihan City Mall 2026, Namba Jutaku-haku July 2025) are beetle displays and collecting days, not fights.","src":[{"title":"凄いぞカブクワ展 (Keihan City Mall, Osaka)","publisher":"iko-yo","date":"2026","url":"https://report.iko-yo.net/articles/33048"}]},{"name":"Nagoya Beetle Arena","city":"Nagoya","country":"Japan","lat":35.1815,"lon":136.9066,"type":"beetle","size":"Arena (300)","region":false,"v":"unverified","st":"unknown","ey":null,"note":"No source found for beetle fighting in Nagoya. The beetle events found there (Aeon Mall Nagoya Noritake Garden 2024; Hoshigaoka Mitsukoshi 2025 and 2026) were touch-and-view exhibits with no fights.","src":[{"title":"夏休み！わくわく昆虫ランド","publisher":"iko-yo","date":"2024","url":"https://report.iko-yo.net/articles/19858"},{"title":"夏休みの自由研究に！名古屋でカブトムシとふれあえる昆虫展","publisher":"iko-yo","date":"2025","url":"https://report.iko-yo.net/articles/25755"}]},{"name":"Dubai Quail Fighting Arena","city":"Dubai","country":"UAE","lat":25.2048,"lon":55.2708,"type":"quail","size":"Arena (500)","region":false,"v":"unverified","st":"unknown","ey":null,"note":"Searched in English and Arabic for quail fighting in Dubai and the UAE; no source found. Results only showed quail fighting in Pakistan.","src":[]},{"name":"Riyadh Quail Fighting","city":"Riyadh","country":"Saudi Arabia","lat":24.7136,"lon":46.6753,"type":"quail","size":"Arena (600)","region":false,"v":"unverified","st":"unknown","ey":null,"note":"No source found for quail fighting in Riyadh. Searches in English and Arabic found only a 2014 report of weekly cockfights at the bird market in Najran, in southern Saudi Arabia, where the practice is banned.","src":[{"title":"You'll never guess which wacky sport is popular in Saudi Arabia","publisher":"Al Bawaba","date":"2014-04-28","url":"https://www.albawaba.com/editorchoice/saudi-arabia-cock-fighting-572217"}]},{"name":"Abu Dhabi Quail Arena","city":"Abu Dhabi","country":"UAE","lat":24.4539,"lon":54.3773,"type":"quail","size":"Arena (400)","region":false,"v":"unverified","st":"unknown","ey":null,"note":"No source was found for quail fighting in Abu Dhabi or the UAE; searches in English and Arabic returned only falconry.","src":[]},{"name":"Bangkok Betta Fighting Market","city":"Bangkok","country":"Thailand","lat":13.7563,"lon":100.5018,"type":"betta","size":"Market Area (500)","region":false,"v":"unverified","st":"unknown","ey":null,"note":"No source names a betta-fighting market or den in Bangkok. Thai searches for fighting-fish dens (บ่อนปลากัด, กัดปลา) and police raids in Bangkok found only raids on dice and card dens. The nearest documented case is a June 2021 police raid on a fighting-fish betting shed on Ko Samui in Surat Thani province.","src":[{"title":"Thailand to Honor Beautiful, Violent Siamese Fighting Fish","publisher":"Khaosod English (AP)","date":"2018-12-22","url":"https://www.khaosodenglish.com/life/arts/2018/12/22/thailand-to-honor-beautiful-violent-siamese-fighting-fish/"},{"title":"บุกจับ บ่อนปลากัด กลางเกาะสมุย ลอบเล่นพนัน ฝ่าฝืนพรก.ฉุกเฉิน","publisher":"Khaosod","date":"2021-06-17","url":"https://www.khaosod.co.th/crime/news_6459148"}]},{"name":"Chatuchak Market fighting-fish shops","city":"Bangkok","country":"Thailand","lat":13.7997,"lon":100.5523,"type":"betta","size":"Market","region":false,"v":"corrected","st":"unknown","ey":null,"note":"Chatuchak Market is a main Bangkok hub for shops selling Siamese fighting fish. Sources describe trade in the fish here, not organized fights or betting at the market. A June 2024 fire in the adjacent ornamental-fish zone killed about 1,000 animals, including fighting fish.","src":[{"title":"Something in the water","publisher":"Bangkok Post","date":"","url":"https://www.bangkokpost.com/life/social-and-lifestyle/1638798/something-in-the-water"},{"title":"Chatuchak Weekend Market","publisher":"Wikipedia","date":"","url":"https://en.wikipedia.org/wiki/Chatuchak_Weekend_Market"}]},{"name":"Chiang Mai Betta Arena","city":"Chiang Mai","country":"Thailand","lat":18.7883,"lon":98.9853,"type":"betta","size":"Arena (200)","region":false,"v":"unverified","st":"unknown","ey":null,"note":"No source found for betta fighting in Chiang Mai. Thai and English searches (กัดปลา/บ่อนกัดปลา เชียงใหม่, betta betting arrest) found only gambling raids on card games and casinos.","src":[]},{"name":"Pattaya Betta Fighting","city":"Pattaya","country":"Thailand","lat":12.9236,"lon":100.8825,"type":"betta","size":"Arena (150)","region":false,"v":"unverified","st":"unknown","ey":null,"note":"Searched in English and Thai for betta fish fighting in Pattaya and Chon Buri; no source found. Gambling raids found there were for cards and cockfighting, not fish.","src":[]},{"name":"United States - South Region","city":"Atlanta, GA","country":"USA","lat":33.749,"lon":-84.388,"type":"dogfighting","size":"Documented activity region","region":true,"v":"verified","st":"illegal_documented","ey":null,"note":"Dogfighting is documented by police in metro Atlanta. In DeKalb County, two people were arrested on dogfighting charges and 17 dogs rescued (Dec 2017); in Paulding County, 106 dogs were seized from an alleged dogfighting operation (2022).","src":[{"title":"Dog-fighting ring busted in DeKalb County","publisher":"FOX 5 Atlanta","date":"2018-01-05","url":"https://www.fox5atlanta.com/news/dog-fighting-ring-busted-in-dekalb-county"},{"title":"Georgia man arrested, 106 dogs rescued from dog fighting operation","publisher":"Atlanta News First","date":"2022-11-12","url":"https://www.atlantanewsfirst.com/2022/11/12/georgia-man-arrested-106-dogs-rescued-dog-fighting-operation/"}]},{"name":"United States - South Region","city":"Memphis, TN","country":"USA","lat":35.1495,"lon":-90.049,"type":"dogfighting","size":"Documented activity region","region":true,"v":"verified","st":"illegal_documented","ey":null,"note":"A 2011 Rotary Club report to the Memphis mayor said dogfighters were operating within the city animal shelter. In 2026 a Memphis Animal Services officer was charged with aggravated cruelty after police found 17 dogs and evidence of possible dogfighting; in 2024, 35 dogs were seized from an alleged ring across the river in Crittenden County, Arkansas.","src":[{"title":"Rotary Club investigation finds links to dogfighting at Memphis Animal Shelter","publisher":"Animal People","date":"2011-11-01","url":"https://newspaper.animalpeopleforum.org/?p=631"},{"title":"Memphis Animal Services officer charged with aggravated animal cruelty","publisher":"Daily Memphian","date":"2026-06-08","url":"https://dailymemphian.com/article/63695"},{"title":"2 men accused of running dogfighting ring; West Memphis Animal Shelter director bitten seizing 35 dogs","publisher":"Action News 5","date":"2024-10-23","url":"https://www.actionnews5.com/2024/10/23/2-men-accused-dogfighting-ring-west-memphis-animal-shelter-director-bitten-while-seizing-35-dogs/"}]},{"name":"United States - South Region","city":"Houston, TX","country":"USA","lat":29.7604,"lon":-95.3698,"type":"dogfighting","size":"Documented activity region","region":true,"v":"verified","st":"illegal_documented","ey":null,"note":"A November 2008 federal and local bust of a Harris County dogfighting ring seized 118 dogs, with up to 55 people charged. Officials called the Eastex Freeway area near Little York a dumping ground for fighting dogs.","src":[{"title":"Major Dog-Fighting Ring Busted Here","publisher":"Houston Press","date":"2008-11-14","url":"https://www.houstonpress.com/?p=282522"},{"title":"Cleaning the 'Corridor of Cruelty'","publisher":"ABC13 Houston","date":"","url":"https://abc13.com/archive/6625778"}]},{"name":"United States - South Region","city":"Miami, FL","country":"USA","lat":25.7617,"lon":-80.1918,"type":"dogfighting","size":"Documented activity region","region":true,"v":"verified","st":"illegal_documented","ey":null,"note":"Police watched a dogfight off Krome Avenue in Miami-Dade in November 2007 and arrested eight men; the organizer got a ten-year sentence. In January 2025 the FBI arrested two Broward County men, one described as a top South Florida dogfighter, and seized dozens of dogs.","src":[{"title":"South Florida dogfighting rages on despite tough laws","publisher":"Miami New Times","date":"","url":"https://www.miaminewtimes.com/?p=40390732"},{"title":"2 South Florida men arrested for dog fighting in FBI raids","publisher":"CBS News Miami","date":"2025-01-18","url":"https://www.cbsnews.com/miami/news/south-florida-dog-fighters-fbi-arrests"}]},{"name":"United States - South Region","city":"New Orleans, LA","country":"USA","lat":29.9511,"lon":-90.0715,"type":"dogfighting","size":"Documented activity region","region":true,"v":"verified","st":"illegal_documented","ey":null,"note":"New Orleans police found seven pit bulls with signs of fighting during a drug raid in Algiers and arrested two men on dogfighting charges. A federal grand jury in New Orleans indicted a Louisiana man on seven animal-fighting counts in 2022.","src":[{"title":"Police find possible dog fighting ring during drug raid in Algiers","publisher":"WWL-TV","date":"","url":"https://wwltv.com/article/news/crime/police-find-possible-dog-fighting-ring-during-drug-raid-in-algiers/289-519505601"},{"title":"Louisiana man indicted for dog fighting ventures","publisher":"U.S. Attorney's Office, Eastern District of Louisiana","date":"2022-07-01","url":"https://www.justice.gov/usao-edla/pr/louisiana-man-indicted-dog-fighting-ventures-0"}]},{"name":"United States - East Coast","city":"Baltimore, MD","country":"USA","lat":39.2904,"lon":-76.6122,"type":"dogfighting","size":"Documented activity region","region":true,"v":"verified","st":"illegal_documented","ey":null,"note":"In November 2013 Baltimore police raided two West Baltimore properties in a dogfighting case, finding 26 dogs and arresting five people. A local rescuer told reporters that dogfighting happens every night in the city.","src":[{"title":"Report on a West Baltimore dog fighting bust","publisher":"CBS Baltimore (WJZ)","date":"2013-11-19","url":"https://www.cbsnews.com/baltimore/news/1-arrested-15-dogs-rescued-in-west-baltimore-dog-fighting-bust"},{"title":"Dog fighting occurs every single night and day of the week in Baltimore","publisher":"Baltimore Fishbowl","date":"2013-11-21","url":"https://baltimorefishbowl.com/stories/dog-fighting-occurs-every-single-night-and-day-of-the-week-in-baltimore/"}]},{"name":"United States - East Coast","city":"Philadelphia, PA","country":"USA","lat":39.9526,"lon":-75.1652,"type":"dogfighting","size":"Documented activity region","region":true,"v":"verified","st":"illegal_documented","ey":null,"note":"Pennsylvania SPCA officers have rescued dogs from suspected dogfighting rings in Philadelphia, including 11 dogs from a North Philadelphia home on W. Lehigh Avenue in March 2012.","src":[{"title":"SPCA: 11 dogs rescued from suspected dog fighting ring in North Philadelphia","publisher":"CBS Philadelphia","date":"2012-03-23","url":"https://www.cbsnews.com/philadelphia/news/spca-11-dogs-rescued-from-suspected-dog-fighting-ring-in-north-philadelphia/"}]},{"name":"United States - Midwest","city":"Detroit, MI","country":"USA","lat":42.3314,"lon":-83.0458,"type":"dogfighting","size":"Documented activity region","region":true,"v":"verified","st":"illegal_documented","ey":null,"note":"Dogfighting is a felony in Michigan. In March 2019 Detroit police raided four properties in the city, rescued 35 injured dogs and charged a Detroit man with animal fighting and weapons offenses.","src":[{"title":"Detroit man charged after police bust large dogfighting ring","publisher":"WDIV ClickOnDetroit","date":"2019-03-10","url":"https://www.clickondetroit.com/news/detroit-man-charged-after-police-bust-large-dogfighting-ring"},{"title":"Michigan Humane Society Teams With Feds, Detroit Police to Stop Dog Fighting Ring","publisher":"Michigan Humane","date":"","url":"https://michiganhumane.org/michigan-humane-society-teams-with-feds-detroit-police-to-stop-dog-fighting-ring/"}]},{"name":"United States - Midwest","city":"Chicago, IL","country":"USA","lat":41.8781,"lon":-87.6298,"type":"dogfighting","size":"Documented activity region","region":true,"v":"verified","st":"illegal_documented","ey":null,"note":"In January 2015 Chicago police found a dogfighting ring at a home in the 6600 block of South Winchester, took four wounded pit bulls into custody and charged eight people.","src":[{"title":"Eight Charged With Dog Fighting on South Side","publisher":"NBC Chicago","date":"2015-01-19","url":"https://www.nbcchicago.com/news/local/eight-charged-with-dog-fighting/1976167/"},{"title":"Eight Charged with Dog Fighting (press release)","publisher":"Chicago Police Department","date":"2015-01-19","url":"https://www.chicagopolice.org/wp-content/uploads/legacy/2015/01/19Jan15-Eight-Charged-with-Dog-Fighting.pdf"}]},{"name":"United States - West Coast","city":"Los Angeles, CA","country":"USA","lat":34.0522,"lon":-118.2437,"type":"dogfighting","size":"Documented activity region","region":true,"v":"verified","st":"illegal_documented","ey":null,"note":"Dogfighting cases are prosecuted across Los Angeles County. In 2007 the LAPD charged two South Los Angeles men after finding 17 scarred pit bulls, and in March 2026 federal prosecutors charged a Hacienda Heights man with running a dog fighting venture from his home.","src":[{"title":"Hacienda Heights Man Arrested and Charged with Running Dog Fighting Venture and with Illegal Firearms Possession","publisher":"U.S. Attorney's Office, Central District of California","date":"2026-03-04","url":"https://www.justice.gov/usao-cdca/pr/hacienda-heights-man-arrested-and-charged-running-dog-fighting-venture-and-illegal"},{"title":"Men Arrested for Dog Fighting","publisher":"Los Angeles Police Department","date":"2007-05-03","url":"https://www.lapdonline.org/newsroom/men-arrested-for-dog-fighting/"}]},{"name":"Mexico Border Region","city":"Tijuana","country":"Mexico","lat":32.5149,"lon":-117.0382,"type":"dogfighting","size":"Documented Activity Region","region":true,"v":"unverified","st":"unknown","ey":null,"note":"No source found that documents dog fights in Tijuana. Spanish-language searches (peleas de perros Tijuana) found 2024–2026 animal cruelty raids in Tijuana, but none described fighting; a 2010 report of pit bulls seized in Buena Park, California said they were bound for fights in Mexico without naming a city.","src":[{"title":"Denuncian criadero clandestino de perros pitbull; hay un detenido","publisher":"Uniradio Informa","date":"2016-03-22","url":"https://www.uniradioinforma.com/tijuana/denuncian-criadero-clandestino-perros-pitbull-hay-detenido-n352136"}]},{"name":"Mexico Border Region","city":"Ciudad Juárez","country":"Mexico","lat":31.6904,"lon":-106.4245,"type":"dogfighting","size":"Documented activity region","region":true,"v":"verified","st":"illegal_documented","ey":null,"note":"A 2013 El Diario de Juárez report described clandestine dog fights in rented walled houses and lots in Ciudad Juárez, with bets up to 50,000 pesos; local vets said they treated injured fighting dogs every week. Officials reported no complaints or arrests at the time.","src":[{"title":"Clandestinas y toleradas, peleas de perros","publisher":"Zócalo (from El Diario de Juárez)","date":"2013-11-24","url":"https://www.zocalo.com.mx/clandestinas-y-toleradas-peleas-de-perros-2/"}]},{"name":"Mexico Central","city":"Mexico City","country":"Mexico","lat":19.4326,"lon":-99.1332,"type":"dogfighting","size":"Documented activity region","region":true,"v":"verified","st":"illegal_documented","ey":null,"note":"Mexico City's police (SSP) warned in 2015 of a rise in dog fights in the city and in 2016 announced efforts to end them.","src":[{"title":"Alertan SSPDF tras el aumento de peleas de perros","publisher":"El Universal","date":"2015-11-17","url":"https://www.eluniversal.com.mx/articulo/metropoli/df/2015/11/17/alertan-sspdf-tras-el-aumento-de-peleas-de-perros/"},{"title":"SSP busca acabar con peleas de perros","publisher":"El Universal","date":"2016-07-19","url":"https://www.eluniversal.com.mx/articulo/metropoli/cdmx/2016/07/19/ssp-busca-acabar-con-peleas-de-perros/"}]},{"name":"Russia - Southern Region","city":"Dagestan (Kizlyar, Buynaksk, Izberbash)","country":"Russia","lat":42.9849,"lon":47.5047,"type":"dogfighting","size":"Documented activity region","region":true,"v":"verified","st":"illegal_documented","ey":null,"note":"Organized fights of Caucasian shepherd dogs are held in Dagestan from October to April, in Kizlyar, Buynaksk and near Izberbash. Russia's 2018 animal law bans animal fights; breeders call the events 'tests', and a Makhachkala activist has asked police to stop them.","src":[{"title":"Кровь с молоком: про бои собак в Дагестане (republished from Takie Dela)","publisher":"STENA.ee","date":"2021-03-31","url":"https://www.stena.ee/blog/krov-s-molokom-pro-boi-sobak-v-dagestane"}]},{"name":"Russia - Central","city":"Moscow","country":"Russia","lat":55.7558,"lon":37.6173,"type":"dogfighting","size":"Documented activity region","region":true,"v":"verified","st":"illegal_documented","ey":null,"note":"Underground dog fights began in Moscow in the 1990s and were reported in 2013 at cottages near the Moscow Ring Road. Animal fights are banned in Russia and are prosecuted as animal cruelty.","src":[{"title":"Кто, где и как в Москве устраивает собачьи бои","publisher":"Moskovsky Komsomolets (MK.ru)","date":"2013-05-04","url":"https://www.mk.ru/moscow/2013/05/04/850068-kto-gde-i-kak-v-moskve-ustraivaet-sobachi-boi.html"},{"title":"Кто зарабатывает на подпольных собачьих боях в России","publisher":"Lenta.ru","date":"2017-10-06","url":"https://lenta.ru/articles/2017/10/06/dogs/"}]},{"name":"Pakistan - Punjab","city":"Bahawalnagar district","country":"Pakistan","lat":29.9928,"lon":73.2536,"type":"dogfighting","size":"Traditional Activity Region","region":true,"v":"verified","st":"illegal_documented","ey":null,"note":"Marker stands for Pakistan's Punjab province. No source places dog fights in Lahore itself, but illegal dog fights are documented elsewhere in Punjab: Gujar Khan (2019) and Jattanwala village near Bahawalnagar, where police booked 24 people in February 2026. The ring is placed at Bahawalnagar, the district town nearest the documented case; no source places dog fights in Lahore.","src":[{"title":"Dog fighting becomes costly hobby in Potohar","publisher":"Dawn","date":"2019-01-15","url":"https://www.dawn.com/news/1457567"},{"title":"24 booked for holding dog fight, betting","publisher":"Dawn","date":"2026-02-02","url":"https://www.dawn.com/news/amp/1970516"},{"title":"Bahawalnagar","publisher":"Wikipedia","date":"","url":"https://en.wikipedia.org/wiki/Bahawalnagar"}]},{"name":"Pakistan - Punjab","city":"Pir Mahal, Toba Tek Singh district (Faisalabad Division)","country":"Pakistan","lat":30.7639,"lon":72.4311,"type":"dogfighting","size":"Documented activity region","region":true,"v":"corrected","st":"illegal_documented","ey":null,"note":"In July 2021 Pir Mahal police raided a dog fight tournament at Chak 721/GB and arrested 13 people for betting. Dog fighting is banned in Pakistan under animal cruelty law.","src":[{"title":"13 arrested for betting on dogfight","publisher":"The News International","date":"2021-07-26","url":"https://www.thenews.com.pk/print/868847-13-arrested-for-betting-on-dogfight"},{"title":"Pir Mahal","publisher":"Wikipedia","date":"","url":"https://en.wikipedia.org/wiki/Pir_Mahal"}]},{"name":"Afghanistan","city":"Kabul","country":"Afghanistan","lat":34.5553,"lon":69.2075,"type":"dogfighting","size":"Documented activity region","region":true,"v":"verified","st":"unknown","ey":null,"note":"Dogfighting was banned under the first Taliban government, then returned as weekend entertainment in an earthen arena on the outskirts of Kabul, as reported in 2011. Its status since the Taliban's return in 2021 was not checked.","src":[{"title":"In Afghanistan, Dogfighting Is a Popular Weekend Entertainment","publisher":"TIME","date":"2011-03-04","url":"https://time.com/archive/6956676/in-afghanistan-dogfighting-is-a-popular-weekend-entertainment/"},{"title":"Bloodsport","publisher":"Foreign Policy","date":"2015-06-19","url":"https://foreignpolicy.com/2015/06/19/bloodsport-afghanistan-taliban-fighting-war/"}]},{"name":"Japan - Kanto","ci const stOf = (l) => (l.v === "unverified" ? "unverified" : l.st || "unknown");

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
/* A place is a ring when the earlier map gives a city only to stand for a region
   ("Documented Activity Region", "ILLEGAL - Documented Activity") or names a province. */

${l.size ? `<p class="fig">${esc(l.size)}</p>` : ""}${l.note ? `<p>${esc(l.note)}</p>` : ""}
<p class="where">${isRegion(l) ? "Placed at a city standing for a region: there is no single site" : "Placed at the site or town"}</p>${src}</div>`;

/* ---------- map ---------- */
const map = L.map("map", { preferCanvas: true, worldCopyJump: false, zoomControl: true, minZoom: 1, zoomSnap: 0.5,
  maxBounds: [[-89, -330], [89, 330]], maxBoundsViscosity: 0.6 }).setView([25, 10], 2);
const renderer = L.canvas({ padding: 0.3 });
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";
const TILE = { noWrap: true, bounds: [[-85.05, -180], [85.05, 180]] };
const BASES = {
  relief: L.tileLayer(ESRI + "World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}", { ...TILE, maxZoom: 13, className: "relief", attribution: "Relief: Esri" }),

};
/* Bioluminescent, as on the Culprits map: NASA's Black Marble night lights (2016)
   recoloured through the Culprits ramp, with a soft blue glow along every shore
   taken from the sea-floor depth (AWS Terrain Tiles). */
const NIGHT_RAMP = [[0, "#02040C"], [14, "#050918"], [34, "#0B1430"], [62, "#17295A"], [100, "#2E5390"],
  [145, "#5E8DC2"], [190, "#A5C7E2"], [230, "#DCE8F0"], [255, "#F1F4F6"]];
const NIGHT_GLOW = [[-150, [31, 79, 126, 0]], [-60, [31, 79, 126, .28]], [-15, [31, 79, 126, .55]], [-3, [74, 154, 182, .85]], [0, [74, 154, 182, 0]]];
const NIGHT_TABLE = (() => {
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const t = new Uint8Array(768);
  for (let v = 0; v < 256; v++) {
    let k = 0; while (k < NIGHT_RAMP.length - 2 && v > NIGHT_RAMP[k + 1][0]) k++;
    const [v0, c0] = NIGHT_RAMP[k], [v1, c1] = NIGHT_RAMP[k + 1], f = Math.max(0, Math.min(1, (v - v0) / (v1 - v0))), a = hex(c0), b = hex(c1);
    for (let i = 0; i < 3; i++) t[v * 3 + i] = Math.round(a[i] + (b[i] - a[i]) * f);
  }
  return t;
})();
function glowAt(e) {
  if (e <= -150 || e >= 0) return null;
  let k = 0; while (k < NIGHT_GLOW.length - 2 && e > NIGHT_GLOW[k + 1][0]) k++;
  const [e0, c0] = NIGHT_GLOW[k], [e1, c1] = NIGHT_GLOW[k + 1], f = (e - e0) / (e1 - e0);
  return c0.map((v, i) => v + (c1[i] - v) * f);
}
const loadImg = (u) => new Promise((ok) => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => ok(i); i.onerror = () => ok(null); i.src = u; });
const NightLayer = L.TileLayer.extend({
  createTile(c, done) {
    const cv = document.createElement("canvas"); cv.width = cv.height = 256;
    const g = cv.getContext("2d", { willReadFrequently: true });
    g.fillStyle = "#02040C"; g.fillRect(0, 0, 256, 256);
    Promise.all([loadImg(`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_Black_Marble/default/2016-01-01/GoogleMapsCompatible_Level8/${c.z}/${c.y}/${c.x}.png`),
                 loadImg(`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${c.z}/${c.x}/${c.y}.png`)]).then(([lit, dem]) => {
      try {
        const out = g.getImageData(0, 0, 256, 256), o = out.data;
        let L1 = null, D = null;
        if (lit) { g.drawImage(lit, 0, 0, 256, 256); L1 = g.getImageData(0, 0, 256, 256).data; }
        if (dem) { g.drawImage(dem, 0, 0, 256, 256); D = g.getImageData(0, 0, 256, 256).data; }
        for (let p = 0; p < o.length; p += 4) {
          const v = L1 ? Math.round(0.5 * Math.max(L1[p], L1[p + 1], L1[p + 2]) + 0.5 * (0.3 * L1[p] + 0.59 * L1[p + 1] + 0.11 * L1[p + 2])) : 0;
          let r = NIGHT_TABLE[v * 3], gg = NIGHT_TABLE[v * 3 + 1], b = NIGHT_TABLE[v * 3 + 2];
          if (D) {
            const gl = glowAt(D[p] * 256 + D[p + 1] + D[p + 2] / 256 - 32768);
            if (gl) { const a = gl[3]; r = r + (gl[0] - r) * a; gg = gg + (gl[1] - gg) * a; b = b + (gl[2] - b) * a; }
          }
          o[p] = r; o[p + 1] = gg; o[p + 2] = b; o[p + 3] = 255;
        }
        g.putImageData(out, 0, 0);
      } catch (e) { /* a tile the browser would not let us read stays black */ }
      done(null, cv);
    });
    return cv;
  },
});
BASES.night = new NightLayer("", { ...TILE, maxNativeZoom: 8, maxZoom: 18,
  attribution: '<a href="https://earthobservatory.nasa.gov/features/NightLights" target="_blank" rel="noopener">NASA Black Marble 2016</a> via GIBS; depth: AWS Terrain Tiles' });
/* Jurassic, as on the Culprits map: Esri imagery under a see-through earth-tone
   palette by height, with shaded relief, from the AWS Terrain Tiles heights. */
const JUR_STOPS = [[-8000, [10, 22, 42, .8]], [-3500, [12, 28, 50, .72]], [-1200, [16, 40, 60, .6]], [-200, [26, 70, 86, .38]], [-40, [40, 96, 102, .22]],
  [0, [40, 90, 90, .1]], [1, [46, 52, 34, .32]], [400, [48, 54, 36, .3]], [1000, [64, 70, 44, .28]], [1700, [108, 100, 66, .26]], [2500, [118, 90, 60, .3]],
  [3300, [110, 80, 62, .32]], [4300, [102, 92, 84, .3]], [5500, [132, 128, 122, .2]]];
function jurAt(e) {
  if (e <= JUR_STOPS[0][0]) return JUR_STOPS[0][1];
  for (let k = 0; k < JUR_STOPS.length - 1; k++) {
    const [e0, c0] = JUR_STOPS[k], [e1, c1] = JUR_STOPS[k + 1];
    if (e <= e1) { const f = (e - e0) / (e1 - e0); return c0.map((v, i) => v + (c1[i] - v) * f); }
  }
  return JUR_STOPS[JUR_STOPS.length - 1][1];
}
const JurassicRelief = L.GridLayer.extend({
  createTile(c, done) {
    const cv = document.createElement("canvas"); cv.width = cv.height = 256;
    const g = cv.getContext("2d", { willReadFrequently: true });
    const z = Math.min(c.z, 12), k = 2 ** (c.z - z), x = Math.floor(c.x / k), y = Math.floor(c.y / k);
    loadImg(`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`).then((dem) => {
      try {
        if (!dem) return done(null, cv);
        const sub = 256 / k;
        g.imageSmoothingEnabled = true;
        g.drawImage(dem, (c.x % k) * sub, (c.y % k) * sub, sub, sub, 0, 0, 256, 256);
        const D = g.getImageData(0, 0, 256, 256).data, E = new Float32Array(65536);
        for (let i = 0, p = 0; i < 65536; i++, p += 4) E[i] = D[p] * 256 + D[p + 1] + D[p + 2] / 256 - 32768;
        const out = g.createImageData(256, 256), o = out.data;
        const lat = Math.atan(Math.sinh(Math.PI * (1 - 2 * (c.y + 0.5) / 2 ** c.z)));
        const mpp = 156543.03 * Math.cos(lat) / 2 ** c.z;
        const lift = c.z <= 3 ? 4.5 : c.z <= 6 ? 3 : c.z <= 9 ? 2 : 1.4;
        for (let yy = 0; yy < 256; yy++) for (let xx = 0; xx < 256; xx++) {
          const i = yy * 256 + xx, p = i * 4, e = E[i];
          const l = E[yy * 256 + Math.max(0, xx - 1)], r = E[yy * 256 + Math.min(255, xx + 1)];
          const u = E[Math.max(0, yy - 1) * 256 + xx], d = E[Math.min(255, yy + 1) * 256 + xx];
          const dx = (r - l) / (2 * mpp) * lift, dy = (d - u) / (2 * mpp) * lift;
          const nx = -dx, ny = -dy, nz = 1, nl = Math.hypot(nx, ny, nz);
          const sh = (nx * -0.542 + ny * -0.542 + nz * 0.643) / nl;
          let [cr, cg, cb, ca] = jurAt(e);
          if (e > 0) {
            const dark = Math.max(0, 0.643 - sh) * 1.1, light = Math.max(0, sh - 0.8) * 0.5;
            const a2 = Math.min(0.78, dark);
            cr = cr * ca + 18 * a2 * (1 - ca); cg = cg * ca + 24 * a2 * (1 - ca); cb = cb * ca + 14 * a2 * (1 - ca);
            ca = ca + a2 * (1 - ca);
            if (light > 0) { const a3 = Math.min(0.1, light); cr = cr * (1 - a3) + 240 * a3; cg = cg * (1 - a3) + 236 * a3; cb = cb * (1 - a3) + 222 * a3; ca = Math.min(1, ca + a3 * (1 - ca)); }
            cr /= ca || 1; cg /= ca || 1; cb /= ca || 1;
          }
          o[p] = cr; o[p + 1] = cg; o[p + 2] = cb; o[p + 3] = Math.round(ca * 255);
        }
        g.putImageData(out, 0, 0);
      } catch (e) { g.clearRect(0, 0, 256, 256); }
      done(null, cv);
    });
    return cv;
  },
});

const JUR_REL = new JurassicRelief({ ...TILE, maxZoom: 18, zIndex: 2, attribution: "Relief: AWS Terrain Tiles; Jurassic palette from the Culprits map" });
BASES.jurassic = L.layerGroup([JUR_IMG, JUR_REL]);

/* ---------- marks: colours suited to each basemap ----------

const mix = (hex, to, f) => "#" + [1, 3, 5].map((i) => Math.round(parseInt(hex.slice(i, i + 2), 16) * (1 - f) + to * f).toString(16).padStart(2, "0")).join("");

  if (st === "ended") return { renderer, radius: 4, color: rimFor(), weight: 0.6, opacity: 0.7, fillColor: c, fillOpacity: 0.4 };
  return isRegion(l)
    ? { renderer, radius: 5.5, color: c, weight: 1.4, opacity: 0.95, fillColor: c, fillOpacity: 0.12 }

/* where marks sit on top of each other, a click lists every one there */
const LISTED = [];
function markClick(e) {
  const p = map.latLngToContainerPoint(e.latlng);
  const here = [];
  for (const m of LISTED) {
    if (!m._map) continue;
    const q = map.latLngToContainerPoint(m.getLatLng());
    if (Math.abs(q.x - p.x) <= 9 && Math.abs(q.y - p.y) <= 9) here.push(m);
  }
  if (here.length <= 1) { e.target.openPopup(); return; }
  here.sort((a, b) => (a._afKind + a._afName).localeCompare(b._afKind + b._afName));
  const html = `<div class="af-pop af-list"><h3>${here.length} here</h3><p class="where">These overlap at this zoom. Choose one, or zoom in to separate them.</p><ol>` +
    here.map((m, i) => `<li><a href="#" data-i="${i}">${esc(m._afName)}</a><span>${esc(m._afKind)}</span></li>`).join("") + `</ol></div>`;
  const pop = L.popup({ maxWidth: 360 }).setLatLng(e.latlng).setContent(html).openOn(map);
  pop.getElement().querySelector("ol").addEventListener("click", (ev) => {
    const a = ev.target.closest("a[data-i]"); if (!a) return;

const GLOBE = { on: false, map: null, ready: false };
const tileCanvas = (layer, z, x, y) => new Promise((res) => layer.createTile({ z, x, y }, (err, cv) => res(cv)));
const toPng = (cv) => new Promise((res) => cv.toBlob((b) => b.arrayBuffer().then(res), "image/png"));
let plateImg = null;
function plateTile(z, x, y) {
  plateImg ||= new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = ATLAS_PLATE._url; });
  return plateImg.then((img) => {
    const merc = (lat) => (1 - Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) / Math.PI) / 2;
    const n = 2 ** z, top = merc(85.0511), bot = merc(-80.55), y0 = y / n, y1 = (y + 1) / n;
    const cv = document.createElement("canvas"); cv.width = cv.height = 256;
    const cx = cv.getContext("2d"), a = Math.max(y0, top), b = Math.min(y1, bot);
    if (b > a) { cx.imageSmoothingQuality = "high"; cx.drawImage(img, x / n * img.width, (a - top) / (bot - top) * img.height, img.width / n, (b - a) / (bot - top) * img.height, 0, (a - y0) * n * 256, 256, (b - a) * n * 256); }
    return cv;
  });
}
function globeStyle() {
  const esri = (svc) => [`${ESRI}${svc}/MapServer/tile/{z}/{y}/{x}`];
  return {
    version: 8,
    projection: { type: "globe" },
    glyphs: HELL.glyphs,
    sources: {
      ...HELL_SOURCES,
      img: { type: "raster", tiles: esri("World_Imagery"), tileSize: 256, maxzoom: 18, attribution: "Imagery: Esri, Maxar, Earthstar Geographics" },
      plate: { type: "raster", tiles: ["afplate://{z}/{x}/{y}"], tileSize: 256, maxzoom: 5, attribution: "Atlas plate: the Culprits map" },
      night: { type: "raster", tiles: ["afnight://{z}/{x}/{y}"], tileSize: 256, maxzoom: 8, attribution: "NASA Black Marble 2016 via GIBS; depth: AWS Terrain Tiles" },
      jur: { type: "raster", tiles: ["afjur://{z}/{x}/{y}"], tileSize: 256, maxzoom: 12, attribution: "Relief: AWS Terrain Tiles; Jurassic palette from the Culprits map" },
      relief: { type: "raster", tiles: esri("World_Shaded_Relief"), tileSize: 256, maxzoom: 13, attribution: "Relief: Esri" },
      labels: { type: "raster", tiles: esri("Canvas/World_Dark_Gray_Reference"), tileSize: 256, maxzoom: 16, attribution: "Labels: Esri" },
      pts: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
    },
    layers: [
      { id: "space", type: "background", paint: { "background-color": "#0c0a0a" } },
      { id: "b-img", type: "raster", source: "img", paint: { "raster-saturation": 0.12, "raster-contrast": 0.06, "raster-brightness-max": 0.94 } },
      { id: "b-plate", type: "raster", source: "plate", paint: { "raster-opacity": ["interpolate", ["linear"], ["zoom"], 2.5, 1, 4.5, 0] } },
      { id: "b-jur", type: "raster", source: "jur", layout: { visibility: "none" } },
      { id: "b-night", type: "raster", source: "night", layout: { visibility: "none" } },
      { id: "b-relief", type: "raster", source: "relief", layout: { visibility: "none" }, paint: { "raster-saturation": -1, "raster-brightness-min": 0.38, "raster-brightness-max": 0, "raster-contrast": 0.15 } },
      ...hellLayers().map((l) => ({ ...l, layout: { ...(l.layout || {}), visibility: "none" } })),
      { id: "b-labels", type: "raster", source: "labels", paint: { "raster-opacity": 0.9 } },
      { id: "pts", type: "circle", source: "pts", paint: {
        "circle-radius": ["get", "r"], "circle-color": ["get", "c"], "circle-opacity": ["get", "fo"],
        "circle-stroke-color": ["get", "sc"], "circle-stroke-width": ["get", "sw"], "circle-stroke-opacity": 0.9, "circle-pitch-alignment": "map" } },
    ],
  };
}
const GBASE = { atlas: ["b-img", "b-plate", "b-labels"], jurassic: ["b-img", "b-jur", "b-labels"], night: ["b-night", "b-labels"], relief: ["b-relief", "b-labels"], hell: HELL_IDS };
function globeSetBase() {
  if (!GLOBE.ready) return;
  for (const id of ["b-img", "b-plate", "b-jur", "b-night", "b-relief", "b-labels", ...HELL_IDS]) GLOBE.map.setLayoutProperty(id, "visibility", GBASE[baseName].includes(id) ? "visible" : "none");
}
let GREF = [];
function globeData() {
  GREF = [];
  const pts = [];
  for (const k of marks) {
    const g = groups[k.cat]; if (!map.hasLayer(g) || !g.hasLayer(k.m)) continue;
    const o = k.m.options, ll = k.m.getLatLng(), i = GREF.push(k.m) - 1;
    pts.push({ type: "Feature", geometry: { type: "Point", coordinates: [ll.lng, ll.lat] },
      properties: { i, r: o.radius, c: o.fillColor, fo: o.fillOpacity, sc: o.color, sw: o.weight } });
  }
  GLOBE.map.getSource("pts").setData({ type: "FeatureCollection", features: pts });
}
function globeClick(e) {
  const hits = GLOBE.map.queryRenderedFeatures([[e.point.x - 6, e.point.y - 6], [e.point.x + 6, e.point.y + 6]], { layers: ["pts"] });
  const seen = new Set(), here = [];
  for (const h of hits) { const m = GREF[h.properties.i]; if (m && !seen.has(m)) { seen.add(m); here.push(m); } }
  if (!here.length) return;
  const pop = new maplibregl.Popup({ maxWidth: "380px", className: "gpop" }).setLngLat(e.lngLat);
  const show = (m) => { const c = m.getPopup() && m.getPopup().getContent(); pop.setHTML(typeof c === "string" ? c : ""); };
  if (here.length === 1) { show(here[0]); pop.addTo(GLOBE.map); return; }
  here.sort((a, b) => (a._afKind + a._afName).localeCompare(b._afKind + b._afName));
  pop.setHTML(`<div class="af-pop af-list"><h3>${here.length} here</h3><p class="where">These overlap at this zoom. Choose one, or zoom in to separate them.</p><ol>` +
    here.map((m, i) => `<li><a href="#" data-i="${i}">${esc(m._afName)}</a><span>${esc(m._afKind)}</span></li>`).join("") + `</ol></div>`).addTo(GLOBE.map);
  pop.getElement().addEventListener("click", (ev) => {
    const a = ev.target.closest("a[data-i]"); if (!a) return;
    ev.preventDefault(); show(here[+a.dataset.i]);
  });
}
function globeMake() {
  maplibregl.addProtocol("afplate", async (p) => ({ data: await toPng(await plateTile(...p.url.split("://")[1].split("/").map(Number))) }));
  maplibregl.addProtocol("afnight", async (p) => { const [z, x, y] = p.url.split("://")[1].split("/").map(Number); return { data: await toPng(await tileCanvas(BASES.night, z, x, y)) }; });
  maplibregl.addProtocol("afjur", async (p) => { const [z, x, y] = p.url.split("://")[1].split("/").map(Number); return { data: await toPng(await tileCanvas(JUR_REL, z, x, y)) }; });
  const c = map.getCenter();
  GLOBE.map = new maplibregl.Map({ container: "globe", style: globeStyle(), center: [c.lng, c.lat], zoom: map.getZoom() <= 2 ? 1.7 : map.getZoom() - 1,
    minZoom: 0, maxZoom: 17, attributionControl: false, renderWorldCopies: false });
  GLOBE.map.addControl(new maplibregl.AttributionControl({ compact: true }), "bottom-right");
  GLOBE.map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-left");
  GLOBE.map.on("style.load", () => { GLOBE.ready = true; globeSetBase(); globeData(); });
  GLOBE.map.on("click", globeClick);
  GLOBE.map.on("mouseenter", "pts", () => (GLOBE.map.getCanvas().style.cursor = "pointer"));
  GLOBE.map.on("mouseleave", "pts", () => (GLOBE.map.getCanvas().style.cursor = ""));
}
function setGlobe(on) {
  if (typeof maplibregl === "undefined") on = false;   // MapLibre did not load: stay flat
  GLOBE.on = on;
  document.getElementById("globe").hidden = !on;
  document.getElementById("mapwrap").classList.toggle("globe", on);
  document.querySelectorAll("#viewsw button").forEach((x) => x.classList.toggle("on", (x.dataset.v === "globe") === on));
  if (on) {
    if (!GLOBE.map) globeMake();
    else {
      const c = map.getCenter();
      GLOBE.map.jumpTo({ center: [c.lng, c.lat], zoom: map.getZoom() <= 2 ? 1.7 : map.getZoom() - 1 });
      GLOBE.map.resize(); if (GLOBE.ready) globeData();
    }
  } else if (GLOBE.map) {
    const c = GLOBE.map.getCenter();
    map.setView([Math.max(-80, Math.min(80, c.lat)), c.lng], Math.max(1, GLOBE.map.getZoom() + 1), { animate: false });
    map.invalidateSize();
  }
}
document.getElementById("worldbtn").addEventListener("click", () => {
  map.closePopup();
  if (GLOBE.on && GLOBE.map) { document.querySelectorAll(".maplibregl-popup").forEach((p) => p.remove()); GLOBE.map.easeTo({ center: [HOME.center[1], HOME.center[0]], zoom: 1.7, bearing: 0, pitch: 0, duration: 900 }); }
  else map.flyTo(HOME.center, HOME.zoom, { duration: 0.8 });
});
document.getElementById("viewsw").addEventListener("click", (e) => { const v = e.target.dataset.v; if (v) setGlobe(v === "globe"); });
document.getElementById("bm").addEventListener("click", (e) => { if (e.target.dataset.b) globeSetBase(); });
const applyFlat = apply;
apply = function () { applyFlat(); if (GLOBE.on && GLOBE.ready) globeData(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && GLOBE.map) document.querySelectorAll(".maplibregl-popup").forEach((p) => p.remove()); });
setGlobe(true);

/* small screens: fold the panel */
document.getElementById("toggle").addEventListener("click", (e) => {
  const s = document.getElementById("side"); s.classList.toggle("min");
  e.target.textContent = s.classList.contains("min") ? "Show" : "Hide";
  setTimeout(() => { map.invalidateSize(); if (GLOBE.map) GLOBE.map.resize(); }, 50);
});
</script>
