ctive":true},{"s":"intl","k":"gpe","n":"Global Partnership for Education (GPE)","c":"United States","lat":38.8995,"lng":-77.0421,"y":2002,"ended":null,"status":"active","role":"Hosted at the World Bank, Washington","d":"GPE is the largest fund for education in lower-income countries. It was created by the World Bank in 2002 as the Education for All Fast-Track Initiative and reshaped in 2011 after criticism of its governance. It brings together 79 developing countries and more than twenty donor agencies, and supported 66 countries in 2021, 41 of them in Africa. Its board arithmetic: 42 African countries hold six seats, about a quarter, while 15 Western European countries hold eight, about a third; the secretariat sits inside the World Bank in Washington and has no independent legal status; the World Bank and UNICEF act as grant agents; and between 2011 and 2020 74.58% of its money came from Europe and 14.46% from North America, with the United Kingdom alone providing 18.79%. Two seats are held for the private sector and foundations, filled in 2023 by the Global Business Coalition for Education. A 2019 proposal to fund for-profit private education was dropped after three UN Special Rapporteurs on the right to education objected.","cite":"da Silva, Croso and Mode Magalhaes, Multistakeholderism in Global Education Governance: Losses for democracy, profits for business, Transnational Institute (2023)","url":"https://www.tni.org/en/publication/multistakeholderism-in-global-education-governance","inf":"intlorg","wide":5,"int":5,"rel":"now","reach_list":["United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"intl","k":"gef","n":"Global Education Forum (GEF)","c":"United States","lat":40.7489,"lng":-73.968,"y":2019,"ended":null,"status":"active","role":"Launched at the UN General Assembly, New York","d":"The GEF was proposed by Gordon Brown as UN Special Envoy for Global Education and launched at the UN General Assembly in September 2019. Its five co-chairs were Graca Machel, Tharman Shanmugaratnam, UNESCO's Audrey Azoulay, the World Bank's Mari Pangestu and Brown himself. Counting its members gives the structure: four Global North member states, the United States, the United Kingdom's FCDO, Finland and Canada, and no Global South states; five multilateral bodies; three civil society groups; eight private foundations, private-sector and think-tank bodies; two academic bodies; and five individuals. The researchers who examined it found no clear information on its goals, selection criteria or decision-making procedures, and called the structure opaque. It backed the Save our Future White Paper of September 2020, and its four priority areas match those of the Transforming Education Summit.","cite":"da Silva, Croso and Mode Magalhaes, Multistakeholderism in Global Education Governance, Transnational Institute (2023), Table 4 and Conclusions","url":"https://www.tni.org/files/2023-09/%20Multistakeholderism%20in%20global%20education%20governance%20TNI.pdf","inf":"intlorg","wide":5,"int":5,"rel":"now","reach_list":["United Kingdom","United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":2,"ne":0,"active":true},{"s":"intl","k":"ecw","n":"Education Cannot Wait (ECW)","c":"Switzerland","lat":46.2324,"lng":6.136,"y":2015,"ended":null,"status":"active","role":"Geneva","d":"Education Cannot Wait was proposed by Gordon Brown at the World Economic Forum in Davos in January 2015 and is chaired by him. Its governing body is 13 donor states, two developing-country partners, four international civil-society organisations, eight multilateral bodies and four private-sector or foundation members. There is no seat for the teaching profession and none for a Global South civil-society group. This fund decides schooling for children in war and disaster.","cite":"da Silva, Croso and Mode Magalhaes, Multistakeholderism in Global Education Governance, Transnational Institute (2023)","url":"https://www.tni.org/en/publication/multistakeholderism-in-global-education-governance","inf":"intlorg","wide":4,"int":4,"rel":"now","reach_list":["Switzerland"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"intl","k":"edcomm","n":"Education Commission and IFFed","c":"United Kingdom","lat":51.501,"lng":-0.1246,"y":2015,"ended":null,"status":"active","role":"London","d":"The Education Commission was set up in 2015 and chaired by Gordon Brown with 26 individual commissioners. It hosts the International Financing Facility for Education, launched in September 2022 with a target of 10 billion dollars over five years. Civil-society networks opposed IFFed because it lends: the answer offered to a country short of money for schools is debt it then owes.","cite":"da Silva, Croso and Mode Magalhaes, Multistakeholderism in Global Education Governance, Transnational Institute (2023)","url":"https://www.tni.org/en/publication/multistakeholderism-in-global-education-governance","inf":"intlorg","wide":4,"int":4,"rel":"now","reach_list":["United Kingdom"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"intl","k":"eof","n":"Education Outcomes Fund","c":"United States","lat":40.7498,"lng":-73.969,"y":2018,"ended":null,"status":"active","role":"Hosted by UNICEF, New York","d":"The Education Outcomes Fund was launched in 2018 and hosted by UNICEF, with Amel Karboul as chief executive. It pays providers by results. Civil-society networks opposed it because tying money to measurable outcomes decides in advance which parts of an education count.","cite":"da Silva, Croso and Mode Magalhaes, Multistakeholderism in Global Education Governance, Transnational Institute (2023)","url":"https://www.tni.org/en/publication/multistakeholderism-in-global-education-governance","inf":"intlorg","wide":3,"int":3,"rel":"now","reach_list":["United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"chain","k":"newglobe","n":"NewGlobe Schools / Bridge International Academies","c":"Kenya","lat":-1.3006,"lng":36.782,"y":2009,"ended":null,"status":"active","role":"Nairobi","d":"Bridge was the largest for-profit primary chain in the world, running schools in Kenya, Uganda, Nigeria, Liberia and India from a Delaware parent, NewGlobe Schools. The IFC put 13.5 million dollars of equity into it between 2013 and 2016, when it had 211 schools and over 57,000 pupils in Kenya and a plan to expand into three more countries, and exited on 3 March 2022. By then the IFC's own ombudsman had been handling complaints since April 2018, and 47 civil society organisations responded to its compliance investigation report by noting its grave findings on allegations of child sexual abuse at the chain's schools in Kenya. In Liberia, Bridge entered in 2016 under the Liberian Education Advancement Program, in which eight private companies took over 93 public schools; Bridge started with 23 of them. Pearson had invested in Bridge by June 2012.","cite":"IFC Project Information Portal and Compliance Advisor Ombudsman case files; Oxfam and Education International, 2022; Global Student Forum statement of 47 civil society organisations","url":"https://www.cao-ombudsman.org/case/kenya-bridge-international-academies-01kenya","inf":"chain","wide":3,"int":5,"rel":"now","reach_list":["India","Kenya","Liberia","Nigeria","Uganda"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":5,"ne":0,"active":true},{"s":"chain","k":"omega","n":"Omega Schools","c":"Ghana","lat":5.556,"lng":-0.206,"y":2009,"ended":null,"status":"active","role":"Accra","d":"Omega Schools in Ghana was the first investment made by Pearson's Affordable Learning Fund, in 2013. It charges on a pay-as-you-learn basis, a daily fee that includes the lesson. Research by Curtis Riep found Omega's fees came to about 41% of what one adult earning the lowest official wage took home, and concluded the chain was not extending access to basic education. The fund's stated aim, in the words of its chairman Michael Barber, was a sustainable large chain of branded low-cost private schools in Ghana.","cite":"Riep, in Education, Privatisation and Social Justice, chapter on Omega Schools Franchise Ghana (Education International); Srivastava, response to The Economist, Oxfam From Poverty to Power (2015)","url":"https://download.ei-ie.org/Docs/WebDepot/Omega_Schools_FranchiseGhana_Ch%2014_Riep.pdf","inf":"chain","wide":2,"int":4,"rel":"now","reach_list":["Ghana"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"chain","k":"apec_ph","n":"APEC Schools","c":"Philippines","lat":14.5547,"lng":121.0244,"y":2013,"ended":null,"status":"active","role":"Metro Manila","d":"APEC Schools is a for-profit chain of low-fee private secondary schools set up as a joint venture between Pearson and the Philippine Ayala Group. Riep's study of it described a government failure to provide quality schooling turned into a commercial opportunity, with private firms filling the gap through market-based delivery.","cite":"Riep, study of APEC Schools in the Philippines (2015), reported by HuffPost","url":"https://www.huffpost.com/entry/pearson-germ-in-the-phili_b_8621842","inf":"chain","wide":2,"int":3,"rel":"now","reach_list":["Philippines"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"chain","k":"nordanglia","n":"Nord Anglia Education","c":"United Kingdom","lat":51.5145,"lng":-0.0885,"y":1972,"ended":null,"status":"active","role":"London","d":"Nord Anglia runs more than 80 private international and boarding schools in 33 countries, educating over 90,000 children aged two to eighteen. EQT took it private in 2008 for around 400 million dollars when it had six schools, and sold it in 2024 at a 14.5 billion dollar enterprise value to a consortium including a Canadian public pension fund, Neuberger Berman, Spain's Corporacion Financiera Alba and Dubai Holding Investments.","cite":"EQT press release, 21 October 2024; The PIE News, 24 March 2025; Nord Anglia corporate record","url":"https://thepienews.com/nord-anglia-education-acquired-in-14-5bn-deal/","inf":"chain","wide":4,"int":4,"rel":"now","reach_list":["China","Hungary","Qatar","Spain","Switzerland","Thailand","United Arab Emirates","United Kingdom","United States","Vietnam"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":10,"ne":0,"active":true},{"s":"forprofit","k":"uophoenix","n":"University of Phoenix","c":"United States","lat":33.508,"lng":-112.077,"y":1976,"ended":null,"status":"active","role":"Phoenix, Arizona","d":"The University of Phoenix is the largest for-profit university in the United States. The model is to recruit students who can borrow, bill the federal loan system, and leave the graduate or the drop-out with the debt. Apollo Global Management and the Vistria Group took its parent private for 1.1 billion dollars, completing in 2017, and brought it back to the stock market in 2025 at a valuation of up to 1.2 billion dollars while Apollo kept majority voting control. In 2019 its parent was the third largest higher-education funder of lobbyists in the country.","cite":"Apollo Education Group SEC filings, 2016-2017; Reuters and Bloomberg on the 2025 flotation; Republic Report, 2025","url":"https://www.republicreport.org/2025/university-of-phoenix-reportedly-considering-public-offering-or-new-buyer/","inf":"forprofit","wide":2,"int":4,"rel":"now","reach_list":["United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"forprofit","k":"corinthian","n":"Corinthian Colleges","c":"United States","lat":33.6846,"lng":-117.8265,"y":1995,"ended":2015,"status":"closed","role":"Santa Ana, California","d":"Corinthian ran Everest College, Heald College and WyoTech, more than 110,000 students across about 105 campuses, until it collapsed in 2015 after its federal aid was cut off. The California attorney general sued it over false advertising and misrepresented job-placement rates. In 2022 the United States Department of Education discharged the federal loans of every remaining Corinthian borrower: 5.8 billion dollars for about 560,000 people, the largest student-debt cancellation in American history. The provision used, borrower defence, had drawn five claims in the twenty years to 2015; a student debt strike by the Corinthian 15 revived it and a thousand claims arrived within months.","cite":"U.S. Department of Education announcement, 1 June 2022; NASFAA; American Prospect; Federal Register notice, June 2015","url":"https://www.nasfaa.org/news-item/27409/ED_Discharges_5_8_Billion_in_Borrower_Defense_Claims_for_Borrowers_Who_Attended_Corinthian","inf":"forprofit","wide":2,"int":5,"rel":"legacy","reach_list":["United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":false},{"s":"forprofit","k":"itt","n":"ITT Technical Institute","c":"United States","lat":39.868,"lng":-86.15,"y":1969,"ended":2016,"status":"closed","role":"Carmel, Indiana","d":"ITT Tech closed in 2016 after regulators acted on exaggerated claims about its graduates' success in finding work. In June 2021 the Department of Education cancelled more than 500 million dollars of debt for about 18,000 of its former students, with more than 100,000 claims from for-profit college students still pending at the time.","cite":"U.S. Department of Education announcement, June 2021, reported by Al Jazeera","url":"https://www.aljazeera.com/economy/2021/6/16/biden-admin-forgives-500m-in-debt-for-former-itt-tech-students","inf":"forprofit","wide":2,"int":4,"rel":"legacy","reach_list":["United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":false},{"s":"chain","k":"maarif","n":"Turkish Maarif Foundation","c":"Turkiye","lat":39.9087,"lng":32.7621,"y":2016,"ended":null,"status":"active","role":"Ankara","d":"The Maarif Foundation is a Turkish state education body created by act of parliament in June 2016, weeks before the coup attempt that Turkey blames on the Gulen movement. Its function abroad is to receive schools: by 2024 state broadcaster TRT reported 232 Gulen-linked schools in 21 countries transferred to it, and its chairman Birol Akgun had earlier said 216 schools in 44 countries. A July 2026 report by the group Solidarity with Others counted at least 164 institutions across 29 countries closed, confiscated or transferred, affecting roughly 7,952 staff, of which 131 went to Maarif and 31 were closed or seized without transfer. In November 2025 President Erdogan said Turkey had secured the complete or partial closure of schools linked to the movement in more than 50 countries.","cite":"TRT Haber via Turkish Minute, 16 July 2024; Solidarity with Others, Turkish Maarif Foundation and the Global Attack on Gulen Schools (July 2026); Erdogan remarks at the foundation's tenth anniversary, Ankara","url":"https://solidaritywithothers.com/turkish-maarif-foundation-and-the-global-attack-on-gulen-schools/","inf":"state","wide":4,"int":5,"rel":"now","reach_list":["Afghanistan","Burkina Faso","Guinea","Niger","Pakistan","Senegal","Somalia","Sudan","Turkiye","Venezuela"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":10,"ne":0,"active":true},{"s":"donor","k":"gates_edu","n":"Bill and Melinda Gates Foundation, education programme","c":"United States","lat":47.623,"lng":-122.348,"y":2000,"ended":null,"status":"active","role":"Seattle, Washington","d":"The Gates Foundation paid for the Common Core standards to exist and then paid for them to be adopted. The Washington Post's account in June 2014 traced it to one day in 2008, when Gene Wilhoit of the Council of Chief State School Officers and the consultant David Coleman persuaded Gates to fund the creation and marketing of what became the standards; the foundation then provided the money and structure for states to work together in a way that avoided the usual collision over states' rights. Around 200 million dollars went into development, political advocacy and grants to organisations that then supported the standards, which 45 states and the District of Columbia adopted; the foundation's own grants database returns more than 300 million dollars against the keyword. The federal government then used stimulus money in a contest that rewarded states for accepting them. Whether or not the standards were good, the mechanism is the point: a private fortune set what most American children are taught, and no voter was asked.","cite":"Lyndsey Layton, The Washington Post, 7 June 2014; Valerie Strauss, Washington Post Answer Sheet, 8 June 2014; National Education Policy Center analysis of Gates education grants","url":"https://www.washingtonpost.com/news/answer-sheet/wp/2014/06/08/did-bill-gates-fund-an-educational-coup/","inf":"donor","wide":4,"int":5,"rel":"now","reach_list":["United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"donor","k":"gbce","n":"Global Business Coalition for Education","c":"United States","lat":38.905,"lng":-77.043,"y":2012,"ended":null,"status":"active","role":"Washington, D.C.","d":"The Global Business Coalition for Education was set up in 2012 by Theirworld, the charity chaired by Sarah Brown, who is also its executive chair; Justin van Fleet is its executive director. It holds the two private-sector and foundation seats on the board of the Global Partnership for Education, which means that the formal voice of business in the largest education fund for poorer countries is a coalition convened by a charity run by the family of the UN Special Envoy who proposed several of the other bodies in the same system.","cite":"da Silva, Croso and Mode Magalhaes, Multistakeholderism in Global Education Governance, Transnational Institute (2023)","url":"https://www.tni.org/en/publication/multistakeholderism-in-global-education-governance","inf":"donor","wide":5,"int":4,"rel":"now","reach_list":["United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"donor","k":"palf","n":"Pearson Affordable Learning Fund","c":"United Kingdom","lat":51.5073,"lng":-0.0869,"y":2012,"ended":null,"status":"active","role":"London","d":"Pearson launched the Affordable Learning Fund in July 2012 with 15 million dollars, later raising it, to take stakes in low-fee private schools and education technology across Asia and Africa. Its first investment was Omega Schools in Ghana; the portfolio came to include Bridge International Academies, eAdvance and its Spark Schools chain in South Africa, Zaya, and the APEC joint venture in the Philippines. Pearson's own published response said it is a minority investor, does not supply products or services to the schools it invests in, and does not want to privatise public education. Pearson at the time also owned 50% of The Economist, which ran a cover briefing favourable to low-fee private schooling.","cite":"Pearson, The Pearson Affordable Learning Fund: Myths + Facts (March 2016); EdWeek Market Brief, July 2012; Srivastava, Oxfam From Poverty to Power (2015)","url":"https://www.pearson.com/content/dam/one-dot-com/one-dot-com/global/Files/get-the-facts/PALF_Myths_Facts_March_2016.pdf","inf":"investor","wide":4,"int":4,"rel":"now","reach_list":["Ghana","India","Kenya","Nigeria","Philippines","South Africa","Uganda","United Kingdom"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":8,"ne":0,"active":true},{"s":"ideo","k":"alec_edu","n":"American Legislative Exchange Council, education task force","c":"United States","lat":38.883,"lng":-77.105,"y":1973,"ended":null,"status":"active","role":"Arlington, Virginia","d":"ALEC is a membership body where state legislators and corporate lobbyists sit together and vote as equals on model bills, which members then introduce at home as their own. Its education catalogue runs to dozens of acts covering teacher certification and evaluation, collective bargaining, curriculum, funding, special education and assessment; the ALEC Exposed project counted 69 model education bills and resolutions. Its School Choice Subcommittee, created in 2004, was chaired by legislators alongside K12 Inc., Connections Academy and voucher advocacy groups. The traceability is what makes this a case rather than an opinion: Arizona legislator Debbie Lesko, an ALEC board member, introduced a bill nearly identical to ALEC's School Choice Directory Act, and parent-trigger laws in Indiana, Texas and Mississippi follow the model's text in requiring no public hearings and giving local school boards no authority.","cite":"Molnar and others, 'Privatizing Schooling and Policy Making', Educational Policy (2013); The Intercept, 19 April 2018; Education Week, April 2012; Progress Florida, ALEC v. Kids","url":"https://theintercept.com/2018/04/19/alec-debbie-lesko-arizona-congress/","inf":"ideo","wide":2,"int":4,"rel":"now","reach_list":["United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"faith","k":"canada_irs","n":"Canada's Indian residential school system","c":"Canada","lat":45.4215,"lng":-75.6998,"y":1831,"ended":1996,"status":"inquiry","role":"Run from Ottawa by government and churches","d":"More than 150,000 First Nations, Inuit and Metis children were taken from their families into church and government-run residential schools at over 140 locations, from the 1830s to 1996. The Truth and Reconciliation Commission, created in 2008 out of a court settlement, heard from more than 6,000 witnesses, recorded over 6,000 student deaths, concluded that the schools were an integral part of a conscious policy of cultural genocide, and issued 94 Calls to Action in June 2015. The system was an education system. That is what makes it the hardest case on this map: schooling used as the instrument for ending a people's languages and transmission of knowledge.","cite":"Truth and Reconciliation Commission of Canada, final report and Calls to Action (June 2015); CBC News summary, 2 June 2015; Parks Canada national historic event designation","url":"https://www.cbc.ca/news/indigenous/truth-and-reconciliation-commission-by-the-numbers-1.3096185","inf":"state","wide":2,"int":5,"rel":"legacy","reach_list":["Canada"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":false},{"s":"faith","k":"us_boarding","n":"United States federal Indian boarding school system","c":"United States","lat":38.894,"lng":-77.043,"y":1819,"ended":1969,"status":"inquiry","role":"Run from the Department of the Interior, Washington","d":"The Interior Department's Federal Indian Boarding School Initiative, launched in 2021 under Secretary Deb Haaland, reviewed roughly 103 million pages of federal records. Its two reports, May 2022 and July 2024, listed 417 federal Indian boarding schools across 37 states or then-territories, identified 1,025 further institutions that advanced similar assimilation goals, confirmed at least 973 documented deaths of American Indian, Alaska Native and Native Hawaiian children between 1819 and 1969 while stating the true figure is higher, and identified 74 marked or unmarked burial sites at 65 schools. The report also tallied the federal money paid to run them, including to church-operated schools, and recommended about 23 billion dollars of funding toward healing. Haaland said the department she led took deliberate actions to isolate children from their families, deny them their identities and steal their languages and cultures.","cite":"U.S. Department of the Interior, Federal Indian Boarding School Initiative Investigative Report Vol. II (July 2024) and Vol. I (May 2022)","url":"https://www.bia.gov/sites/default/files/media_document/doi_federal_indian_boarding_school_initiative_investigative_report_vii_final_508_compliant.pdf","inf":"state","wide":2,"int":5,"rel":"legacy","reach_list":["United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":false},{"s":"elite","k":"ygl","n":"Forum of Young Global Leaders","c":"Switzerland","lat":46.2256,"lng":6.166,"y":1992,"ended":null,"status":"active","role":"World Economic Forum, Cologny, Geneva","d":"The World Economic Forum's leadership programme began in 1992 as Global Leaders for Tomorrow and was renamed Young Global Leaders in 2003. Members are nominated and selected under forty, and go through what the Forum calls a curated leadership journey with academic modules at partner institutions. Its own press releases name serving heads of government among its members, including prime ministers of New Zealand and Finland and, in the 2025 class, the prime ministers of Thailand and Montenegro alongside serving ministers of India, Chile and Namibia. Klaus Schwab said in 2017 that the programme's alumni had helped the Forum penetrate the cabinets of countries including France and Argentina. That is a private body saying openly that its training programme places people in governments.","cite":"World Economic Forum press releases, YGL classes of 2021, 2022 and 2025; Klaus Schwab remarks, 2017, as reported","url":"https://www.weforum.org/press/2025/04/from-grammy-award-winning-artist-to-unicorn-founders-meet-the-young-global-leaders-class-of-2025/","inf":"elite","wide":5,"int":4,"rel":"now","reach_list":["Switzerland"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"state","k":"ci_hq","n":"Confucius Institute programme","c":"China","lat":39.912,"lng":116.39,"y":2004,"ended":null,"status":"active","role":"Beijing","d":"A Confucius Institute is a Chinese government-funded language and culture centre placed inside a foreign university, with instructors selected and curriculum defined by bodies linked to the Chinese state. At their height there were as many as 118 in the United States; between 2010 and 2022 nearly all of them ceased operating. Eleven countries have closed some or all of theirs, and Sweden was the first in Europe to remove both institutes and Confucius Classrooms from primary schools. The United States Government Accountability Office surveyed 74 colleges that closed theirs and found political pressure and the possible loss of federal funding behind the closures, with many reporting reduced Chinese language and cultural programming afterwards. The Canadian Association of University Teachers objected that host universities permitted a state agenda in the recruitment and control of academic staff, in the choice of curriculum, and in the restriction of debate. In October 2026 the United States Defense Department designated the institutes a national security threat and said it had dismantled 80 programmes at 30 universities, on the view that the partnerships had reappeared under new names.","cite":"U.S. Government Accountability Office report on Confucius Institute closures (2023); Inside Higher Ed, 9 January 2019; ABC News, 1 April 2025; Department of Defense designation, October 2026, reported by Arab News","url":"https://www.chronicle.com/newsletter/latitudes/2023-11-01","inf":"state","wide":4,"int":4,"rel":"now","reach_list":["Australia","Belgium","Canada","China","Denmark","France","Germany","Netherlands","Sweden","United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":10,"ne":0,"active":true},{"s":"state","k":"nor_trc","n":"Norway's Norwegianisation policy and its school system","c":"Norway","lat":59.9139,"lng":10.7522,"y":1851,"ended":null,"status":"inquiry","role":"Oslo; boarding schools across Finnmark and northern Norway","d":"Norway's assimilation policy, formalised in 1851, worked mainly through schools. The Truth and Reconciliation Commission the Storting set up in 2018 delivered a 700-page report in 2023 covering the Sami, Kven and Norwegian Finnish peoples. In state-run boarding schools minority languages were forbidden and declined steeply. The report named how it worked. Bernt Thomasson, director of schools in Finnmark from 1902 to 1920, worked to prevent Sami languages being used in schools and closed down Sami teacher education, and teachers were rewarded with praise and funding where results in Norwegian were strong. Scholars describe schools as the battlefields and teachers as the frontline soldiers of the policy. The commission found that Norwegianisation did not stop, and that minority-language schooling, now a legal right, is still hard to find. Norway issued a formal apology.","cite":"Sannhets- og forsoningskommisjonen, final report to the Storting (2023); CBC News, 1 June 2023; Minde (2005); Jones, Education in the North 32(1) (2025)","url":"https://www.cbc.ca/news/world/norway-indigenous-sami-truth-commission-final-report-1.6862471","inf":"state","wide":2,"int":5,"rel":"legacy","reach_list":["Norway"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"state","k":"swe_nomad","n":"Sweden's nomad schools for Sami children","c":"Sweden","lat":67.8558,"lng":20.2253,"y":1913,"ended":null,"status":"inquiry","role":"Kiruna and northern Sweden","d":"From 1913 the children of Sami reindeer herders in Sweden were taken from their families at about seven and placed in state-run boarding schools. The schools were founded under a policy officially described as preserving the Sami, and taught in Swedish rather than any Sami language; children were punished for speaking their mother tongue. Sweden's truth commission, which reported in 2023, took testimony on this and on the limited literacy it produced in both languages at once.","cite":"Sweden's Truth Commission for the Sami people, report (2023); AFP via France 24, 10 May 2023; Journal of Language, Identity and Education (2026) on the Norwegian and Swedish commission reports","url":"https://www.france24.com/en/live-news/20230510-sweden-s-truth-commission-delves-into-painful-sami-past","inf":"state","wide":2,"int":5,"rel":"legacy","reach_list":["Sweden"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"state","k":"fin_trc","n":"Finland's assimilation schooling of the Sami","c":"Finland","lat":60.1699,"lng":24.9384,"y":1900,"ended":null,"status":"inquiry","role":"Helsinki; boarding schools in Lapland","d":"Finland's Sami truth and reconciliation commission finalised its report in December 2025 after four years, with testimony from nearly 400 Sami people and dozens of experts. Up until the late twentieth century many Sami children were separated from their families and placed in boarding schools where they were banned from speaking their own languages or practising their culture and traditional livelihoods.","cite":"Finland's Sami Truth and Reconciliation Commission report, 4 December 2025, reported by AFP via France 24","url":"https://www.france24.com/en/live-news/20251204-truth-commission-urges-finland-to-rectify-sami-injustices-1","inf":"state","wide":2,"int":5,"rel":"legacy","reach_list":["Finland"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"state","k":"cn_tutoring","n":"China's double reduction policy","c":"China","lat":39.917,"lng":116.398,"y":2021,"ended":null,"status":"active","role":"Ministry of Education, Beijing","d":"In July 2021 China banned for-profit tutoring in school subjects and cut homework, requiring existing operators to convert to non-profits or leave. Within four months online job postings for tutoring firms fell 89%, firm entry halved and exits tripled; by December 2021 the education ministry reported offline training institutions down 83.8% and online ones down 84.1%. TAL Education and others lost most of their value. It is the fastest and most complete removal of a private education industry anywhere, done by one state in one document, with no more consultation of the families involved than the industry had given them.","cite":"Huang, Liu, Ma and Yang, 'Biting the Hand that Teaches' (SSRN 4758676); China Ministry of Education figures via Global Times, 21 December 2021; South China Morning Post, 2024","url":"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4758676","inf":"state","wide":2,"int":5,"rel":"now","reach_list":["China"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"state","k":"tx_sboe","n":"Texas State Board of Education","c":"United States","lat":30.2751,"lng":-97.7404,"y":1949,"ended":null,"status":"active","role":"Austin, Texas","d":"Texas matters to publishers because of how it buys. It is one of about twenty adoption states, where the state approves the list of materials districts may buy with state money, and it has nearly five million schoolchildren. Fifteen elected board members rewrite the standards about once a decade and publishers then spend two years writing to them. The leverage shows up in both directions. In 2014 the board adopted some 89 social studies items and Houghton Mifflin Harcourt withdrew a United States government textbook at the last minute, saying the book was for a national programme and did not meet all the Texas standards; the board approved health materials after the publisher removed references to gender fluidity and emphasised abstinence. A Scientific American investigation that reviewed 40 hours of board hearings and public records found members of the fossil-fuel industry participating at each stage of the science standard-setting process. Industry people in the state also say the old picture is overstated, because publishers now start from a national text and edit it per state.","cite":"KPBS and Houston Chronicle coverage of the 2014 adoption; APM Research Lab, Required Reading (2021); Scientific American, 'Subverting Climate Science in the Classroom' (2023); Texas Tribune, 26 March 2010","url":"https://www.scientificamerican.com/article/subverting-climate-science-in-the-classroom/","inf":"state","wide":2,"int":4,"rel":"now","reach_list":["United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"forprofit","k":"laureate","n":"Laureate Education, Inc.","c":"United States","lat":39.2904,"lng":-76.6122,"y":1998,"ended":null,"status":"active","role":"Baltimore, Maryland","d":"Laureate was the largest for-profit higher-education company in the world by enrolment, with about a million students signed up across its universities at its 2015 peak, and it built that by buying universities in countries where public places were scarce rather than by opening campuses at home. It has since sold most of the network and now runs institutions in Mexico and Peru. What it proved is the model: a degree is a product that can be sold at national scale, in any country, by a company answering to shareholders somewhere else.","cite":"CNBC, 'The for-profit education company targeting the whole world', 15 December 2015","url":"https://www.cnbc.com/2015/12/15/a-controversial-education-model-us-is-exporting-to-the-world.html","inf":"forprofit","wide":4,"int":4,"rel":"now","reach_list":["Brazil","Chile","Mexico","Peru","United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":5,"ne":0,"active":true},{"s":"forprofit","k":"galileo","n":"Galileo Global Education","c":"France","lat":48.8566,"lng":2.3522,"y":2011,"ended":null,"status":"active","role":"Paris","d":"Galileo is the largest for-profit higher-education group in Europe, with more than 200 private colleges, schools and campuses and roughly 300,000 students across about 20 countries. It was assembled by investment funds buying up art, design, fashion, business and medical schools and putting them under one owner; the American fund Providence Equity sold its majority stake in 2020 at a reported 2.3 billion euro valuation. A student enrolling at one of its schools is generally buying from a brand with a long local history and an owner of recent and financial origin.","cite":"Galileo Global Education company profile; Crunchbase and Wikipedia company records","url":"https://en.wikipedia.org/wiki/Galileo_Global_Education","inf":"forprofit","wide":4,"int":4,"rel":"now","reach_list":["France","Germany","India","Italy","Mexico","Spain"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":6,"ne":0,"active":true},{"s":"forprofit","k":"cogna","n":"Cogna Educação S.A. (formerly Kroton)","c":"Brazil","lat":-23.5505,"lng":-46.6333,"y":1966,"ended":null,"status":"active","role":"São Paulo","d":"Cogna, which traded for most of its life as Kroton, is the largest private education company in Brazil and one of the largest in the world, with more than two million students across higher education, basic education and its schools platform. It merged with its largest competitor, Anhanguera, in 2014. Its schools arm supplies content and systems to thousands of private schools, which means a single listed company sits behind both the degree and the school day for a very large share of a country of 200 million people.","cite":"Cogna Educação corporate record and quarterly results; IFC project disclosure","url":"https://disclosures.ifc.org/project-detail/ESRS/48771/cogna","inf":"forprofit","wide":4,"int":4,"rel":"now","reach_list":["Brazil"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"forprofit","k":"yduqs","n":"YDUQS (formerly Estácio)","c":"Brazil","lat":-22.9068,"lng":-43.1729,"y":2007,"ended":null,"status":"active","role":"Rio de Janeiro","d":"YDUQS, listed on the Brazilian exchange and formerly called Estácio, serves over 750,000 students. With Cogna it forms the pair at the top of Brazilian private higher education; between them the two companies served over three million students in 2025, and the two have twice opened merger talks that would leave roughly a third of the private market in one company's hands.","cite":"YDUQS corporate record; Brazil higher education market reporting, 2025","url":"https://en.wikipedia.org/wiki/YDUQS","inf":"forprofit","wide":3,"int":3,"rel":"now","reach_list":["Brazil"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"forprofit","k":"adtalem","n":"Adtalem Global Education (formerly DeVry)","c":"United States","lat":41.8781,"lng":-87.6298,"y":1973,"ended":null,"status":"active","role":"Chicago, Illinois","d":"Adtalem runs Walden University, Chamberlain University and medical schools in the Caribbean, with total enrolment of about 97,000 students. It was called DeVry Education Group until it paid 100 million dollars to settle a Federal Trade Commission case over deceptive advertising about its graduates' job and earnings outcomes, and renamed itself the year after. It is now the largest provider of nursing degrees in the United States, which means the settlement and the renaming did not shrink the company; they preceded its growth into a profession people's lives depend on.","cite":"Federal Trade Commission settlement with DeVry, 2016; Adtalem corporate record and enrolment reporting","url":"https://en.wikipedia.org/wiki/Covista","inf":"forprofit","wide":3,"int":4,"rel":"now","reach_list":["Barbados","United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":2,"ne":0,"active":true},{"s":"mill","k":"axact","n":"Axact","c":"Pakistan","lat":24.8607,"lng":67.0011,"y":1997,"ended":null,"status":"active","role":"Karachi","d":"Axact ran what investigators called the largest degree mill ever found: several hundred websites presenting themselves as American and British universities and high schools, selling degrees, transcripts and accreditations to people who never attended anything. Between 2009 and 2015 it sold documents to more than 200,000 people across 197 countries, and its call-centre staff later impersonated government officials to charge buyers again for fake legalisation fees. Its founder was jailed. The buyers included nurses, engineers and health service consultants, so the harm did not stop at the people who bought a degree.","cite":"The New York Times investigation, 17 May 2015; Pakistan Federal Investigation Agency case; Gulf News and CBC Marketplace reporting","url":"https://en.wikipedia.org/wiki/Axact","inf":"mill","wide":5,"int":4,"rel":"now","reach_list":["Canada","Pakistan","Saudi Arabia","United Arab Emirates","United Kingdom","United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":6,"ne":0,"active":true},{"s":"publisher","k":"elsevier","n":"Elsevier (RELX)","c":"Netherlands","lat":52.3676,"lng":4.9041,"y":1880,"ended":null,"status":"active","role":"Amsterdam","d":"Elsevier publishes roughly a fifth of the world's academic papers and is the largest of the five companies that between them publish more than half of everything peer-reviewed. The work is written, reviewed and edited by academics who are not paid for it, mostly on public research money, and is then sold back to the universities that produced it; Elsevier has run a profit margin near 37% for years. For a student this is the wall at the end of the system: the research their own country funded is behind a subscription their library may not hold.","cite":"Larivière, Haustein and Mongeon, 'The Oligopoly of Academic Publishers in the Digital Era', PLOS ONE, 2015; Science, 2019","url":"https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0127502","inf":"publisher","wide":5,"int":4,"rel":"now","reach_list":["China","Germany","India","Netherlands","United Kingdom","United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":6,"ne":0,"active":true},{"s":"intl","k":"giga","n":"Giga (UNICEF and ITU)","c":"Switzerland","lat":46.2224,"lng":6.1399,"y":2019,"ended":null,"status":"active","role":"Geneva","d":"Giga is the joint UNICEF and International Telecommunication Union initiative building the first open map of every school on earth, with its internet connection recorded. It has mapped about 2.3 million schools in roughly 140 countries, drawing on data from some fifty governments, OpenStreetMap and its own satellite-imagery model. The number worth sitting with is the one it cannot give: nobody knows how many schools there are in the world, and the working estimate is six to seven million. Giga is the only body on this map whose purpose is to make the system legible rather than to sell into it, and its data is published openly at giga.global.","cite":"Giga (UNICEF and ITU), Giga Maps and Project Connect; UNICEF digital inclusion reporting","url":"https://giga.global/what-we-do/how-we-work/mapping/","inf":"intlorg","wide":5,"int":2,"rel":"now","reach_list":["Brazil","Honduras","India","Kazakhstan","Kenya","Rwanda","Senegal","Switzerland"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":8,"ne":0,"active":true}],"backers":[{"k":"bk_platinum","n":"Platinum Equity (Tom Gores)","kind":"fund","c":"United States","city":"Beverly Hills, California","lat":33.985,"lng":-118.4695,"backs":["mcgraw","platinum"],"how":{"mcgraw":"Acquired 100% of McGraw-Hill Education on 31 July 2021 for $4.713 billion, and after the 2025 flotation retains a stake representing about 86.5% of the voting power, so it continues to nominate the board.","platinum":"Platinum Equity, LLC together with its affiliated investment vehicles, with over $36 billion under management."},"d":"Platinum Equity is the owner of record of the publisher that serves, on the company's own figures, about 91% of United States public K-12 school districts. It bought the business from Apollo Global Management and floated it without giving up control.","lik":"established","cite":"McGraw Hill, Inc. Forms S-1 and 10-Q (2025), U.S. Securities and Exchange Commission","url":"https://www.sec.gov/Archives/edgar/data/1951070/000162828025033247/mcgrawhillinc-sx1.htm"},{"k":"bk_veritas","n":"Veritas Capital (Ramzi Musallam)","kind":"fund","c":"United States","city":"New York","lat":40.759,"lng":-73.9712,"backs":["hmh","nwea","veritas"],"how":{"hmh":"Acquired Houghton Mifflin Harcourt outright in 2022; Musallam said education and technology had both become central to the firm's investing.","nwea":"Bought the non-profit assessment body NWEA through HMH in 2023, a year after taking HMH private, and aligned its tests to HMH's curriculum.","veritas":"Veritas Capital and its affiliates."},"d":"Veritas Capital owns one of the three publishers that supplied nearly 90% of the United States PreK-12 market, and through it the testing body whose MAP Growth test around ten thousand districts used.","lik":"established","cite":"HMH Forms 8-K, February and 2022 completion (SEC); THE Journal and Boston Globe, January 2023","url":"https://www.sec.gov/Archives/edgar/data/1580156/000119312522047535/d304266dex991.htm"},{"k":"bk_apollo","n":"Apollo Global Management","kind":"fund","c":"United States","city":"New York","lat":40.7624,"lng":-73.9738,"backs":["mcgraw","uophoenix","apollo_gm","pearson"],"how":{"mcgraw":"Took McGraw-Hill's education business private in 2012, attempted to relist it in 2015 and 2018, and sold it to Platinum Equity in 2021 for $4.713 billion.","uophoenix":"With the Vistria Group, bought the University of Phoenix's parent for $1.1 billion, completing in 2017, and kept majority voting control through the 2025 flotation.","apollo_gm":"Apollo Global Management, Inc. and its affiliated funds.","pearson":"Bid about 7 billion pounds for Pearson plc in March 2022; the bid was rejected."},"d":"Apollo has owned, bought or bid for a substantial part of the English-speaking education industry inside a decade: McGraw-Hill's education business, the largest for-profit university in the United States, and an attempt on Pearson.","lik":"established","cite":"Apollo Education Group SEC filings 2016-2017; McGraw Hill Form S-1 (2025); Pearson plc disclosure, March 2022","url":"https://www.sec.gov/Archives/edgar/data/0000929887/000119312517026959/d329920dex991.htm"},{"k":"bk_vistria","n":"The Vistria Group (Tony Miller)","kind":"fund","c":"United States","city":"Chicago, Illinois","lat":41.8857,"lng":-87.623,"backs":["uophoenix","vistria"],"how":{"uophoenix":"Co-owner with Apollo; its partner Tony Miller, a former deputy secretary of the United States Department of Education, became chairman of the Apollo Education Group board after the purchase.","vistria":"The Vistria Group, LLC."},"d":"Vistria is the private investment firm whose partner moved from running day-to-day operations at the United States Department of Education to chairing the board of the country's largest for-profit university.","lik":"established","cite":"Apollo Education Group Forms DEFA14A and 8-K, 2016-2017 (SEC)","url":"https://www.sec.gov/Archives/edgar/data/0000929887/000119312516453050/d133358dex991.htm"},{"k":"bk_nexus","n":"Nexus Capital Management","kind":"fund","c":"United States","city":"Los Angeles, California","lat":34.0601,"lng":-118.4136,"backs":["savvas","nexus_cap"],"how":{"savvas":"Bought Pearson's United States K-12 courseware business for $250 million in February 2019, renamed it Savvas Learning Company and installed its chief executive.","nexus_cap":"Nexus Capital Management LP."},"d":"Nexus Capital Management holds the Prentice Hall and Scott Foresman school lists and the district contracts attached to them, bought from Pearson for a quarter of a billion dollars.","lik":"established","cite":"Pearson plc disclosure, February 2019; Savvas Learning Company ownership record","url":"https://en.wikipedia.org/wiki/Savvas_Learning_Company"},{"k":"bk_eqt","n":"EQT AB","kind":"fund","c":"Sweden","city":"Stockholm","lat":59.3326,"lng":18.0649,"backs":["nordanglia","eqt_na"],"how":{"nordanglia":"Took Nord Anglia private in June 2008 for around $400 million when it had six schools, built it to over 80 schools in 33 countries, and in the 2024 transaction at a $14.5 billion valuation returned $5.4 billion to its investors while keeping a stake.","eqt_na":"Invested through its BPEA Private Equity Fund VIII."},"d":"EQT built the largest international school group in the world out of a six-school company and took billions out of it while remaining a shareholder.","lik":"established","cite":"EQT press release, 21 October 2024; Reuters, 21 October 2024; Wealth Club case study","url":"https://eqtgroup.com/news/neuberger-berman-private-markets-eqt-and-cpp-investments-form-consortium-to-acquire-leading-international-schools-organization-nord-anglia-education-2024-10-21"},{"k":"bk_cppib","n":"Canada Pension Plan Investment Board","kind":"pension","c":"Canada","city":"Toronto, Ontario","lat":43.6476,"lng":-79.3818,"backs":["nordanglia","cppib"],"how":{"nordanglia":"An existing owner that remained a shareholder in the consortium that valued the chain at $14.5 billion in October 2024.","cppib":"CPP Investments, which manages the Canada Pension Plan's assets."},"d":"Canadian retirement savings are invested in the fees paid by families at international schools in 33 countries.","lik":"established","cite":"EQT press release, 21 October 2024; Reuters, 21 October 2024","url":"https://www.marketscreener.com/quote/stock/EQT-AB-66480635/news/Sweden-s-EQT-others-to-buy-school-chain-Nord-Anglia-for-14-5-billion-48116985/"},{"k":"bk_omers","n":"OMERS","kind":"pension","c":"Canada","city":"Toronto, Ontario","lat":43.65,"lng":-79.379,"backs":["cengage","apax_omers"],"how":{"cengage":"With Apax Partners, bought Thomson Learning for $7.75 billion in 2007 and renamed it Cengage Learning; the company later filed for Chapter 11.","apax_omers":"OMERS Capital Partners, the investment arm of the Ontario Municipal Employees Retirement System."},"d":"An Ontario municipal pension fund was a principal owner of one of the three large United States higher-education courseware firms, bought in a leveraged deal the company itself then had to service.","lik":"established","cite":"Cengage Group corporate and bankruptcy record","url":"https://en.wikipedia.org/wiki/Cengage_Group"},{"k":"bk_dubai_holding","n":"Dubai Holding Investments","kind":"state","c":"United Arab Emirates","city":"Dubai","lat":25.2048,"lng":55.2708,"backs":["nordanglia","eqt_na"],"how":{"nordanglia":"Part of the consortium that acquired Nord Anglia Education at a $14.5 billion valuation; the chain runs four schools in the United Arab Emirates.","eqt_na":"A member of the acquiring consortium alongside EQT, Neuberger Berman, CPP Investments and Corporacion Financiera Alba."},"d":"A Gulf state holding company is a co-owner of one of the world's largest international school groups.","lik":"established","cite":"Gulf News on Dubai Holding's participation in the Nord Anglia consortium, 2024","url":"https://gulfnews.com/business/markets/dubai-holding-in-consortium-that-buys-uk-school-operator-nord-anglia-education-1.500066990"},{"k":"bk_ifc","n":"International Finance Corporation","kind":"bank","c":"United States","city":"Washington, D.C.","lat":38.9,"lng":-77.043,"backs":["newglobe","ifc_edu"],"how":{"newglobe":"Invested $13.5 million of equity in NewGlobe Schools in 2013 and 2016, and exited on 3 March 2022 while complaints about the investment were still before its own ombudsman.","ifc_edu":"The World Bank Group's private-sector arm; its education portfolio was almost $1.2 billion, of which 15% went to private school chains."},"d":"The IFC is the single largest development-finance investor in private education, and the body whose own ombudsman found grave matters at the chain it had funded.","lik":"established","cite":"IFC Project Information Portal; Compliance Advisor Ombudsman case files; UNESCO GEM Report 2021/2","url":"https://disclosures.ifc.org/project-detail/SII/32171/bridge-international-academies"},{"k":"bk_worldbank","n":"World Bank Group","kind":"bank","c":"United States","city":"Washington, D.C.","lat":38.8993,"lng":-77.0425,"backs":["gpe","worldbank_edu","ifc_edu"],"how":{"gpe":"Created the fund in 2002 as the Education for All Fast-Track Initiative, hosts its secretariat with no independent legal status, and acts with UNICEF as a grant agent.","worldbank_edu":"The Bank's own education lending, which under structural adjustment substituted state funding with fees paid by students and encouraged charges for primary school until the 1990s.","ifc_edu":"The Bank Group's private-sector arm."},"d":"The World Bank both wrote the model that poorer education systems are measured against and hosts the largest fund that pays for them to meet it.","lik":"established","cite":"Bretton Woods Project (2006 and 2011); da Silva, Croso and Mode Magalhaes, Transnational Institute (2023)","url":"https://www.brettonwoodsproject.org/2011/01/art-567384/"},{"k":"bk_gates","n":"Bill and Melinda Gates Foundation","kind":"foundation","c":"United States","city":"Seattle, Washington","lat":47.623,"lng":-122.348,"backs":["gates_edu","gef"],"how":{"gates_edu":"Paid for the Common Core standards to be written and for the organisations that then endorsed them, around $200 million across development, advocacy and grants, with more than $300 million returned against the keyword in its own grants database.","gef":"Named among the foundations and companies appearing in the Global Education Forum's action memos."},"d":"The Gates Foundation is the clearest single case of a private fortune setting what a country's children are taught, and is also present in the global governance bodies that set the agenda for poorer countries.","lik":"probable","cite":"Lyndsey Layton, The Washington Post, 7 June 2014; da Silva, Croso and Mode Magalhaes, Transnational Institute (2023)","url":"https://www.washingtonpost.com/news/answer-sheet/wp/2014/06/08/did-bill-gates-fund-an-educational-coup/"},{"k":"bk_theirworld","n":"Theirworld and the Brown family's education bodies","kind":"coalition","c":"United Kingdom","city":"London","lat":51.501,"lng":-0.1246,"backs":["gbce","gef","ecw","edcomm","eof"],"how":{"gbce":"Theirworld, chaired by Sarah Brown, established the Global Business Coalition for Education in 2012; Sarah Brown is its executive chair and Justin van Fleet its executive director. The coalition holds both private-sector seats on the GPE board.","gef":"Gordon Brown, as UN Special Envoy for Global Education, proposed the forum and is one of its five co-chairs.","ecw":"Gordon Brown proposed Education Cannot Wait at Davos in January 2015 and chairs it.","edcomm":"Gordon Brown chairs the Education Commission, which hosts the International Financing Facility for Education.","eof":"The Education Outcomes Fund is among the post-2015 initiatives the researchers connect to the same set of actors."},"d":"One family sits at the centre of several of the bodies that between them set the global education agenda and hold the private-sector voice inside the largest fund for schools in poorer countries. The researchers who mapped this called the resulting initiatives Trojan horses within multi-stakeholder arrangements.","lik":"probable","cite":"da Silva, Croso and Mode Magalhaes, Multistakeholderism in Global Education Governance, Transnational Institute (2023), Conclusion 2 and Table 4","url":"https://www.tni.org/files/2023-09/%20Multistakeholderism%20in%20global%20education%20governance%20TNI.pdf"},{"k":"bk_wef","n":"World Economic Forum","kind":"coalition","c":"Switzerland","city":"Cologny, Geneva","lat":46.2256,"lng":6.166,"backs":["ygl","ecw"],"how":{"ygl":"Runs the Forum of Young Global Leaders, founded in 1992 as Global Leaders for Tomorrow; its founder said in 2017 that alumni had let the Forum penetrate the cabinets of countries including France and Argentina.","ecw":"Education Cannot Wait was proposed at the Forum's annual meeting in Davos in January 2015."},"d":"The Forum is both a selector of future office-holders through its leadership programme and the venue at which several of the global education funds were proposed.","lik":"probable","cite":"World Economic Forum press releases, YGL classes 2021-2025; Klaus Schwab remarks (2017); Transnational Institute (2023)","url":"https://www.weforum.org/press/2025/04/from-grammy-award-winning-artist-to-unicorn-founders-meet-the-young-global-leaders-class-of-2025/"},{"k":"bk_pearson_corp","n":"Pearson plc as an owner","kind":"company","c":"United Kingdom","city":"London","lat":51.5073,"lng":-0.0869,"backs":["palf","omega","apec_ph","newglobe","pearson"],"how":{"palf":"Launched the Affordable Learning Fund in July 2012 with $15 million to take stakes in low-fee private schools and edtech across Asia and Africa, chaired by its chief education adviser Michael Barber.","omega":"The fund's first investment, in Omega Schools Franchise in Ghana, in 2013.","apec_ph":"A joint venture with the Philippine Ayala Group creating a for-profit chain of low-fee secondary schools.","newglobe":"Reported to have invested in Bridge International Academies by June 2012.","pearson":"Pearson plc itself."},"d":"Pearson's place on this map is less the textbook than the position: a company that sold its United States K-12 courseware business, kept assessment and qualifications, and used a dedicated fund to take stakes in fee-charging schools for poor families in six countries. Its own published answer is that it is a minority investor, supplies the schools nothing, and does not want to privatise public education.","lik":"established","cite":"EdWeek Market Brief, July 2012; Pearson, PALF Myths + Facts (March 2016); Srivastava (2016); Riep (Education International)","url":"https://www.pearson.com/content/dam/one-dot-com/one-dot-com/global/Files/get-the-facts/PALF_Myths_Facts_March_2016.pdf"},{"k":"bk_turkey","n":"The Turkish state","kind":"state","c":"Turkiye","city":"Ankara","lat":39.9334,"lng":32.8597,"backs":["maarif"],"how":{"maarif":"Created the Maarif Foundation by act of parliament in June 2016 and used the foreign ministry and other state institutions to have schools abroad closed or transferred to it; by 2024 state broadcaster TRT reported 232 schools in 21 countries transferred."},"d":"Turkey has run the most geographically extensive campaign on this map to change who owns and runs schools in other countries, securing closures or takeovers in more than fifty of them by the president's own account.","lik":"established","cite":"Erdogan remarks at the Maarif Foundation's tenth anniversary, November 2026; Solidarity with Others (July 2026); TRT Haber via Turkish Minute, 16 July 2024","url":"https://solidaritywithothers.com/at-the-maarif-foundations-tenth-anniversary-erdogan-said-turkey-secured-the-closure-of-gulen-schools-in-over-50-countries/"},{"k":"bk_china_state","n":"The Chinese party-state","kind":"state","c":"China","city":"Beijing","lat":39.912,"lng":116.39,"backs":["ci_hq","cn_tutoring"],"how":{"ci_hq":"Funds the Confucius Institutes and, in the Canadian Association of University Teachers' finding, is permitted a state agenda in the recruitment and control of academic staff, the choice of curriculum and the restriction of debate inside host universities.","cn_tutoring":"Issued the July 2021 double reduction policy, banning for-profit tutoring in school subjects nationwide and closing more than 80% of the institutions."},"d":"The Chinese state appears twice on this map in opposite directions: placing language and culture centres inside other countries' universities, and removing a whole private education industry from its own country in a single policy.","lik":"established","cite":"Canadian Association of University Teachers via Inside Higher Ed (2019); GAO report (2023); China Ministry of Education figures via Global Times, 21 December 2021","url":"https://www.insidehighered.com/news/2019/01/09/colleges-move-close-chinese-government-funded-confucius-institutes-amid-increasing"},{"k":"bk_churches","n":"The churches contracted to run assimilation schooling","kind":"church","c":"Vatican City","city":"Holy See and the Protestant mission societies","lat":41.9029,"lng":12.4534,"backs":["canada_irs","us_boarding"],"how":{"canada_irs":"Churches ran the residential schools alongside the Canadian government; the Truth and Reconciliation Commission's Calls to Action included an apology from the Pope for the Roman Catholic Church's role, and said that for churches, reconciliation requires atoning for harmful actions in the schools.","us_boarding":"The Interior Department's second volume detailed the participation of religious institutions and organisations and the federal money spent on church-operated schools."},"d":"The two largest documented systems of schooling used against Indigenous peoples in North America were run jointly by governments and churches, and both official investigations set out the churches' part in them.","lik":"established","cite":"Truth and Reconciliation Commission of Canada, final report and Calls to Action (2015); U.S. Department of the Interior, Federal Indian Boarding School Initiative Investigative Report Vol. II (2024)","url":"https://www.bia.gov/sites/default/files/media_document/doi_federal_indian_boarding_school_initiative_investigative_report_vii_final_508_compliant.pdf"},{"k":"bk_nordic_states","n":"The Nordic states' assimilation policy","kind":"state","c":"Norway","city":"Oslo, Stockholm and Helsinki","lat":59.9139,"lng":10.7522,"backs":["nor_trc","swe_nomad","fin_trc"],"how":{"nor_trc":"Norway formalised Norwegianisation in 1851 and carried it out largely through schools and boarding schools where only Norwegian was permitted; its commission reported in 2023 and the state apologised.","swe_nomad":"Sweden placed the children of Sami reindeer herders in nomad schools from 1913, taught in Swedish and punishing the children's own language; its commission reported in 2023.","fin_trc":"Finland separated Sami children into boarding schools where they were banned from their languages and livelihoods; its commission finalised its report in December 2025."},"d":"Three Nordic states ran the same policy through their school systems against the same people, and all three have now had truth commissions report on it.","lik":"established","cite":"Truth and reconciliation commission reports, Norway (2023), Sweden (2023) and Finland (2025)","url":"https://www.cbc.ca/news/world/norway-indigenous-sami-truth-commission-final-report-1.6862471"},{"k":"bk_ayala","n":"Ayala Group","kind":"company","c":"Philippines","city":"Makati, Metro Manila","lat":14.5547,"lng":121.0244,"backs":["apec_ph"],"how":{"apec_ph":"Joint-venture partner with Pearson in APEC Schools, a for-profit chain of low-fee private secondary schools."},"d":"A Philippine conglomerate is the local half of the joint venture that turned a shortage of state secondary schools into a fee-charging chain.","lik":"probable","cite":"Riep, study of APEC Schools in the Philippines (2015), reported by HuffPost","url":"https://www.huffpost.com/entry/pearson-germ-in-the-phili_b_8621842"},{"k":"bk_prosus","n":"Prosus, Peak XV and the Chan Zuckerberg Initiative","kind":"fund","c":"Netherlands","city":"Amsterdam","lat":52.3676,"lng":4.9041,"backs":["byjus"],"how":{"byjus":"All three resigned from the board in 2023. Prosus had cut its valuation of the company from a peak of $22 billion to below $3 billion over governance concerns and in June 2024 wrote its 9.6% stake to zero, disclosing a $493 million loss; BlackRock also wrote its stake down."},"d":"The investors who built the world's most valuable education technology company out of a coaching class left its board a year before it collapsed, and wrote off what they had put in.","lik":"established","cite":"Business Standard, 18 October 2024; CNBC, 1 March 2024; The Logical Indian (2025)","url":"https://www.business-standard.com/companies/news/byju-s-worth-zero-now-how-the-cookie-crumbled-for-india-s-edtech-giant-124101800394_1.html"},{"k":"bk_fossil_tx","n":"Fossil fuel industry participants in Texas standard-setting","kind":"company","c":"United States","city":"Austin and Houston, Texas","lat":29.7604,"lng":-95.3698,"backs":["tx_sboe"],"how":{"tx_sboe":"A Scientific American investigation that reviewed 40 hours of board hearings, public records and fifteen interviews found members of the fossil fuel industry participating at each stage of the Texas science standard-setting process."},"d":"The industry whose product the science standards describe took part at every stage of writing them, in a state whose standards publishers write their books to satisfy.","lik":"probable","cite":"Scientific American, 'Subverting Climate Science in the Classroom' (2023)","url":"https://www.scientificamerican.com/article/subverting-climate-science-in-the-classroom/"},{"k":"bk_virtual_cos","n":"K12 Inc., Connections Academy and the voucher advocacy groups","kind":"company","c":"United States","city":"Herndon and Baltimore","lat":38.9696,"lng":-77.3861,"backs":["alec_edu"],"how":{"alec_edu":"Chaired ALEC's School Choice Subcommittee from 2004 alongside legislators, and are named in accounts of the drafting of the model Virtual Public Schools Act; an executive of K12 Inc. chaired the subcommittee's special needs education work."},"d":"The companies paid to run online and voucher-funded schooling sat on the body that wrote the model laws creating it.","lik":"probable","cite":"Progress Florida, ALEC v. Kids; Phi Delta Kappan, 'A Smart ALEC Threatens Public Education' (2012)","url":"https://www.progressflorida.org/sites/all/files/alecvkids.pdf"}],"patterns":[{"id":"three_publishers","title":"Three companies own the lessons","kind":"concentration","summary":"Three companies ended up owning the lessons. By 2010 Houghton Mifflin Harcourt, Pearson and McGraw Hill held nearly 90% of the American market from kindergarten to senior year. There looked like plenty of choice, but the same three firms owned most of the titles.<br><br> Since then they have been passed between investment firms. Apollo took McGraw Hill off the stock market in 2012 and sold it to Platinum Equity for 4.713 billion dollars in 2021. Veritas bought Houghton Mifflin Harcourt in 2022. Pearson sold its whole American school business for 250 million dollars in 2019. Then the companies started buying the tests as well. Houghton Mifflin Harcourt bought NWEA in 2023, the charity behind the MAP test used by around ten thousand districts, and said the test would be aligned with its own curriculum. In 2025 McGraw Hill and Pearson agreed to put Pearson's test inside McGraw Hill's maths programme.","implications":"So the company that sells a school its lessons also sells, or supplies, the test that says whether the lessons worked. If the score is bad, the only people who can tell you whether the problem was the child, the teacher or the book are the people who sold you the book. Where this has loosened at all, it is because states started writing their own material instead of buying it.","roles":["Where the market is","Where the owners sit","Where the material is sold on"],"cmap":{"United States":0,"United Kingdom":1,"Sweden":1,"Canada":2,"Mexico":2,"India":2},"orgs":["pearson","mcgraw","hmh","savvas","cengage","nwea","veritas","platinum","apollo_gm","nexus_cap","apax_omers"],"links":[{"from":"Apollo Global Management, New York","to":"McGraw Hill, Columbus","label":"took the education business private in 2012, sold it in 2021","years":"2012-2021","a":[40.7624,-73.9738],"b":[39.9612,-82.9988]},{"from":"Platinum Equity, Beverly Hills","to":"McGraw Hill, Columbus","label":"bought it for $4.713bn and kept 86.5% of the votes after the 2025 flotation","years":"2021-","a":[33.985,-118.4695],"b":[39.9612,-82.9988]},{"from":"Veritas Capital, New York","to":"Houghton Mifflin Harcourt, Boston","label":"took the publisher private in 2022","years":"2022-","a":[40.759,-73.9712],"b":[42.3509,-71.041]},{"from":"Houghton Mifflin Harcourt, Boston","to":"NWEA, Portland","label":"bought the testing body and aligned its tests to its own curriculum","years":"2023","a":[42.3509,-71.041],"b":[45.5152,-122.6784]},{"from":"Pearson, London","to":"Savvas, Paramus","label":"sold its entire US K-12 courseware business for $250m","years":"2019","a":[51.5073,-0.0869],"b":[40.9445,-74.0754]},{"from":"Pearson, London","to":"McGraw Hill, Columbus","label":"agreed to put its PRoPL assessment inside McGraw Hill's core curriculum","years":"2025-","a":[51.5073,-0.0869],"b":[39.9612,-82.9988]}],"timeline":[{"year":2010,"event":" Three publishers hold nearly 90% of the US PreK-12 market."},{"year":2012,"event":" Apollo takes McGraw-Hill's education business off the stock market."},{"year":2018,"event":" HMH sells its Riverside testing portfolio to Alpine Investors for $140m."},{"year":2019,"event":" Pearson sells its US K-12 courseware business for $250m; the Cengage-McGraw Hill merger is announced, then cancelled."},{"year":2021,"event":" Platinum Equity buys McGraw-Hill Education for $4.713bn."},{"year":2022,"event":" Veritas Capital takes Houghton Mifflin Harcourt private."},{"year":2023,"event":" HMH buys NWEA; the DOJ closes its review without a second request."},{"year":2025,"event":" McGraw Hill floats at $3.25bn with Platinum keeping 86.5% of the votes; Pearson's assessments go inside McGraw Hill's curriculum."}],"uncertain":"Market-share figures for this industry mostly come from research sold to the industry itself, and the companies' own filings give different numbers in different documents: McGraw Hill's registration statement said about 99% of public K-12 districts and its annual report says about 91%. Both are the company's own words, and neither is independently audited for this purpose.","confirmed_by":[{"title":"New America: three publishers held nearly 90% of the PreK-12 market","url":"https://www.newamerica.org/insights/states-driving-curriculum-innovation/"},{"title":"McGraw Hill Form 10-K FY2026 (SEC)","url":"https://www.sec.gov/Archives/edgar/data/0001951070/000195107026000022/mh-20260331.htm"},{"title":"McGraw Hill and Pearson assessment integration, June 2025","url":"https://marketbrief.edweek.org/strategy-operations/in-mega-partnership-mcgraw-hill-adds-pearsons-assessments-to-its-core-curriculum/2025/06"}],"cnotes":{"United States":"The whole of this pattern's documented record sits here, because this is the market the three publishers were built around and the one whose filings are public.","United Kingdom":"Pearson, which sold out of United States K-12 courseware and kept assessment and qualifications, is run from London, as is the fund that bought into low-fee schools abroad."},"root":false,"view":"","cids":[0,1,2,3,4,5,6,7,27,33,45,46,57],"ncases":13,"span":[2010,2026],"series":[[2010,3],[2020,10]]},{"id":"test_governs","title":"The test decides what school is for","kind":"standard-setting","summary":"Somebody writes a test. The test gets scored and countries get ranked. Governments redesign school to climb the ranking. That is the whole chain, and it runs one way.<br><br> The OECD's PISA is the big one. A study the OECD published itself found PISA had changed policy in most of the countries that sit it. Until the 1990s few European countries ran national tests at all; by 2009 only five European systems had none. In Mexico the OECD did not advise on the reform, it signed it. The same shape appears at smaller scale: in America the College Board both sets and marks the SAT and runs the Advanced Placement courses, taking over a billion dollars a year with more than 500 million from AP exams alone. Cambridge International's curriculum and exams run in over 10,000 schools in more than 160 countries. The International Baccalaureate reached 6,123 schools in 2025, and 169 of the schools it authorised that year were state schools.","implications":"A test cannot measure everything, so a school rebuilt around a test stops doing what the test cannot see: the art, the arguing, the physical and moral parts, anything slow. Academics said so in an open letter in 2014. The practical result for a pupil is a narrower day, decided by a body their government did not elect.","roles":["Where the test is written","Where the system was rebuilt around it","Where it runs in schools"],"cmap":{"France":0,"United Kingdom":0,"Switzerland":0,"United States":0,"Mexico":1,"Germany":1,"Italy":1,"Japan":1,"Korea, Rep.":2,"India":2,"China":2,"Canada":2,"Sierra Leone":2,"Brazil":1,"Chile":1,"Indonesia":1},"orgs":["oecd_pisa","collegeboard","ets","camint","ib","nwea","pearson"],"links":[{"from":"OECD, Paris","to":"Mexico City","label":"signed the Alliance for Educational Quality alongside the government and the teachers' union","years":"2008","a":[48.8699,2.2708],"b":[19.4326,-99.1332]},{"from":"Cambridge","to":"schools in more than 160 countries","label":"over 10,000 schools teach the Cambridge curriculum; government partnerships in 75 countries","years":"1988-","a":[52.195,0.137],"b":[1.3521,103.8198]},{"from":"Geneva","to":"public schools in South Korea","label":"state school systems adopting a privately governed curriculum and examination","years":"2025","a":[46.2237,6.137],"b":[37.5665,126.978]}],"timeline":[{"year":1988,"event":" Cambridge IGCSE first examined; it becomes the most used international curriculum for 14- to 16-year-olds."},{"year":2000,"event":" PISA begins; it becomes the largest item in the OECD's education budget."},{"year":2008,"event":" Mexico's reform is agreed between the government, the SNTE union and the OECD."},{"year":2009,"event":" Only five European education systems have no national student assessment, down from most of them in the early 1990s."},{"year":2014,"event":" An open letter from academics argues PISA narrows education to the measurable."},{"year":2023,"event":" HMH buys NWEA and aligns its tests to its own curriculum."},{"year":2025,"event":" Pearson's assessments go inside McGraw Hill's curriculum; the IB authorises 169 new public schools."}],"uncertain":"How much of the reform attributed to PISA was caused by it is contested. One author cautions that PISA's role may have been more to legitimise reforms that governments already intended than to generate them, which would make it a justification rather than a cause.","confirmed_by":[{"title":"Gorur, 'Seeing like PISA' (2016)","url":"https://journals.sagepub.com/doi/10.1177/1474904116658299"},{"title":"The OECD, PISA and the Impacts on Educational Policy (ERIC)","url":"https://files.eric.ed.gov/fulltext/ED532562.pdf"},{"title":"Cambridge International facts and figures","url":"https://www.cambridgeinternational.org/about-us/facts-and-figures/"},{"title":"IB 2025 Annual Impact Report","url":"https://www.ibo.org/news/news-about-the-ib/the-ib-releases-its-2025-annual-impact-report/"}],"cnotes":{},"root":false,"view":"","cids":[2,4,14,15,33,34,35,53],"ncases":8,"span":[2008,2025],"series":[[2000,1],[2010,2],[2020,5]]},{"id":"mstakeholder","title":"A world education policy with no electorate","kind":"governance capture","summary":"Since 2015 a set of bodies has grown up between governments and the UN that decides a great deal about schooling in poorer countries. Researchers at the Transnational Institute went through them and counted the seats, which is why this can be described exactly.<br><br> The Global Education Forum, launched at the UN in 2019, has four rich member states on it and no Global South states at all, and more private foundations and companies than civil society groups. The researchers could find no published goals, no selection criteria and no decision-making rules. Education Cannot Wait, which decides schooling for children in war zones, has thirteen donor states, two developing-country partners and no seat for teachers. The Global Partnership for Education, the biggest fund of all, gives 42 African countries six board seats while 15 Western European countries hold eight; its office sits inside the World Bank in Washington and has no legal existence of its own; and three quarters of its money between 2011 and 2020 came from Europe. Its two private-sector seats are held by a coalition set up and chaired by the family of the UN envoy who proposed several of the other bodies.","implications":"A ministry answers to a parliament, badly and slowly, but it answers. These bodies answer to their donors. So a government in Malawi or Nepal negotiates its own schooling in a room where its citizens have no seat and the companies selling into education have two.","roles":["Where the bodies sit","Where the money comes from","Where the decisions land"],"cmap":{"United States":0,"United Kingdom":1,"Switzerland":0,"Finland":1,"Canada":1,"France":0,"Kenya":2,"Liberia":2,"Ghana":2,"Nigeria":2,"Uganda":2,"Malawi":2,"Rwanda":2,"Ethiopia":2,"Mozambique":2,"Senegal":2,"Sierra Leone":2,"Nepal":2,"Bangladesh":2,"Pakistan":2,"India":2,"Mali":2,"Niger":2,"Chad":2,"Burkina Faso":2,"Tanzania":2,"Zambia":2,"Madagascar":2,"Haiti":2,"Afghanistan":2},"orgs":["gef","gpe","ecw","edcomm","eof","gbce","worldbank_edu","ifc_edu","unesco","oecd_pisa","gates_edu"],"links":[{"from":"London","to":"the GPE board, Washington","label":"the Global Business Coalition for Education, set up by Theirworld, holds both private-sector seats","years":"2012-","a":[51.501,-0.1246],"b":[38.8995,-77.0421]},{"from":"Davos","to":"Education Cannot Wait, Geneva","label":"proposed at the World Economic Forum's annual meeting in January 2015","years":"2015","a":[46.8027,9.836],"b":[46.2324,6.136]},{"from":"World Bank, Washington","to":"66 countries, 41 of them in Africa","label":"the fund it created in 2002 and still hosts","years":"2002-","a":[38.8993,-77.0425],"b":[-1.2921,36.8219]}],"timeline":[{"year":2002,"event":" The World Bank creates the Education for All Fast-Track Initiative, later the Global Partnership for Education."},{"year":2011,"event":" GPE is reshaped after criticism of its governance."},{"year":2012,"event":" Theirworld establishes the Global Business Coalition for Education."},{"year":2015,"event":" Education Cannot Wait is proposed at Davos; the Education Commission is set up."},{"year":2018,"event":" The Education Outcomes Fund is launched, hosted by UNICEF."},{"year":2019,"event":" The Global Education Forum is launched at the UN General Assembly; three UN Special Rapporteurs stop a GPE proposal to fund for-profit private education."},{"year":2022,"event":" The International Financing Facility for Education launches with a $10bn target; civil-society networks oppose it as a lending mechanism."},{"year":2023,"event":" The Transnational Institute publishes its count of the seats."}],"uncertain":"The report's own figures are not always internally consistent: its text gives GPE three multilateral and two private-sector
