<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Uncial+Antiqua&display=swap">
<style>
:root{--bg:#06101c;--card:rgba(8,16,26,.94);--line:#1d3147;--line2:rgba(255,255,255,.07);--ink:#e8e6e1;--mute:#a3a1b4;--accent:#2f5f86;--accent-hi:#8fc0dd}
#ttip{z-index:5000!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 'Marcellus','Georgia',serif;overflow:hidden}
#map{position:absolute;inset:0;background:#040a12}
.card{position:absolute;z-index:800;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
.scroll{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
#key{top:12px;left:12px;width:346px;max-height:calc(100% - var(--patH,300px) - 46px);overflow:auto;padding:14px 16px;box-sizing:border-box}
#key h1{font:800 22px/1.2 'Uncial Antiqua','Marcellus','Georgia',serif;margin:0 0 4px;letter-spacing:.5px;color:#f0ece4;text-shadow:0 2px 12px rgba(0,0,0,.5)}
#key .lede{color:var(--mute);margin:0 0 4px;font-size:12.8px}
#key .lede2{color:var(--mute);margin:0 0 10px;font-size:11.5px}
.psec{margin:16px 0 4px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent-hi)}
.row{display:flex;gap:9px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line2)}
.row input{margin-top:4px}
.row label{flex:1;cursor:pointer;font-size:13px}
.row .n,.n{color:var(--mute);font-size:11.5px}
.row.sub2{padding-left:22px;font-size:12.5px}
.row.sub2 label{font-size:12.5px}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
.sub{margin:4px 0 0;font-size:12px;color:var(--mute)}
.mute{color:var(--mute)}
a{color:var(--accent-hi)}
select,button.btn,input.inp{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font:inherit;font-size:12.5px;cursor:pointer}
select{width:100%;padding:4px 6px}
select option{background:#0b0c1e}
input.inp{cursor:text;box-sizing:border-box}
button.btn.on{border-color:var(--accent-hi);background:var(--accent);color:#fff}
button.btn:hover,#infoBtn:hover,#worldBtn:hover{border-color:var(--accent-hi);color:#fff}
.tog{display:inline-block;float:right;cursor:pointer;font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:1px 8px}
#key.min .body,#key.min .lede,#key.min .lede2{display:none}
.chk{display:flex;gap:7px;align-items:center;font-size:12.8px;cursor:pointer;margin:2px 0}
.car{display:inline-block;width:12px;color:var(--mute);cursor:pointer;font-size:10px;user-select:none}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:6px;flex:none}
.sw.sq{border-radius:1px}
.sw.dia{transform:rotate(45deg) scale(.82);border-radius:1px}
.sw.dot{border-radius:50%}
.sw.ring{border-radius:50%;background:transparent!important;border:1.4px solid}
.sw.bar{width:16px;height:3px;border-radius:1px;vertical-align:3px}
.qm{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;margin-left:5px;border:1px solid var(--line);border-radius:50%;font:10px/1 Georgia,serif;color:var(--mute);cursor:help;vertical-align:1px;text-transform:none;letter-spacing:0;flex:none}
.qm:hover{color:#fff;border-color:var(--accent-hi)}
.gl{text-decoration:underline dotted;text-decoration-color:var(--accent-hi);text-underline-offset:3px;text-decoration-thickness:1px;cursor:help}
.gl:hover{color:#fff}
.hbar{display:flex;height:12px;border-radius:2px;overflow:hidden;margin:7px 0 2px;border:1px solid var(--line2)}
.hbar span{flex:1;cursor:pointer}.hbar span.off{opacity:.18}
.hlab{display:flex;font-size:10.6px;color:var(--mute);margin-bottom:4px}.hlab span{flex:1;text-align:center;cursor:pointer;white-space:nowrap}.hlab span.off{opacity:.4}
.ordrow{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px;align-items:center}.ordrow .flab{margin:0 4px 0 0}
.leg{margin:6px 0 2px}
.leg .li{display:flex;align-items:center;gap:6px;font-size:12.3px;padding:2px 0;cursor:pointer}
.leg .li.off{opacity:.35}
.leg .li .n{margin-left:auto}
.fchips{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 2px}
.fc{display:inline-flex;align-items:center;font-size:11.6px;border:1px solid var(--line);border-radius:3px;padding:1px 6px;cursor:pointer;opacity:.42;user-select:none}
.fc.on{opacity:1;border-color:rgba(255,255,255,.22)}
.fc:hover{border-color:var(--accent-hi)}
.fc .n{margin-left:4px}
.flab{font-size:11.5px;color:#d8d5e0;margin:8px 0 1px}
.fest{font-size:11px;color:var(--mute);line-height:1.4;margin:1px 0 4px}
.fc .fp{margin-left:6px;padding-left:6px;border-left:1px solid currentColor;font-size:11px;opacity:.85}
.frow{display:flex;gap:6px;align-items:center;margin:4px 0}
.frow select{flex:1}
.frst{color:var(--accent-hi);cursor:pointer;font-size:12px}
.desc{font-size:11.5px;color:var(--mute);line-height:1.45;margin:3px 0 6px}
/* patterns */
.pat{padding:6px 8px;margin:4px 0;border-left:3px solid var(--pc);border-radius:0 4px 4px 0;background:rgba(255,255,255,.03);cursor:pointer}
.pat:hover{background:rgba(255,255,255,.07)}
.pat.on{background:rgba(255,255,255,.1)}
.pat .pt{font-size:13px;color:#f0ece4;line-height:1.3}
.pat .pm{font-size:10.8px;color:var(--mute);margin-top:1px}
/* possible patterns: stated, never proved. Dashed, as estimates are elsewhere. */
.hyp{padding:6px 8px;margin:4px 0;border-left:3px dashed var(--mute);border-radius:0 4px 4px 0;background:rgba(255,255,255,.02);cursor:pointer}
.hyp:hover{background:rgba(255,255,255,.06)}
.hyp .ht{font-size:12.6px;color:#ded9d0;line-height:1.3}
.hyp .hm{font-size:10.8px;color:var(--mute);margin-top:1px}
.hypway{font-size:10.6px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:10px 0 2px;cursor:pointer;user-select:none}
.hypway:hover{color:#ded9d0}.hypway .car{width:11px}
.hypnote{font-size:11px;color:var(--mute);line-height:1.45;margin:2px 0 4px;border-left:2px dashed var(--mute);padding-left:7px}
/* time */
#tchart svg{display:block;width:100%}
#tchart rect.b{cursor:pointer}
#tchart text{fill:var(--mute);font-size:8.5px;font-family:'Marcellus',Georgia,serif}
.tline{display:flex;align-items:center;gap:6px;font-size:12.3px;margin:4px 0}
.tline input{width:62px;padding:2px 5px}
.tline .rst{margin-left:auto;cursor:pointer;color:var(--accent-hi);font-size:12px}
/* find */
#flist{max-height:260px;overflow:auto;margin-top:4px}
.fi{padding:4px 3px;border-top:1px solid var(--line2);font-size:12.8px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.fi:hover{background:rgba(255,255,255,.05)}
.fi .n{display:block}
/* right column */
#rcol{position:absolute;z-index:800;top:12px;right:12px;bottom:calc(var(--legH,200px) + 46px);width:340px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#rcol>*{pointer-events:auto;position:relative;box-sizing:border-box}
#infoBtn{position:relative;align-self:flex-end;padding:7px 14px;cursor:pointer;letter-spacing:.2px}
#tr{padding:12px 14px;flex:none}
#tr.min .body{display:none}
#tr.min{align-self:flex-end;padding:6px 10px}
.bases{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12.8px;margin:4px 0 2px}
.bases label{cursor:pointer;white-space:nowrap}
.seg{display:flex;gap:6px;margin:4px 0 2px;flex-wrap:wrap}
#wire{padding:10px 14px;flex:0 1 auto;min-height:0;display:flex;flex-direction:column}
#wire.min #wireBody{display:none}
#wire .wh{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
#wireBody{overflow:auto;min-height:0;margin-top:6px}
#wireBody select{margin:2px 0}
#wireBody.more{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 70px),rgba(0,0,0,.35) calc(100% - 22px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 70px),rgba(0,0,0,.35) calc(100% - 22px),transparent)}
.wi{padding:6px 0;border-top:1px solid var(--line2);font-size:12.3px;line-height:1.38}
.wi a{color:#e8e4dc;text-decoration:none}.wi a:hover{text-decoration:underline;color:#fff}
.wi .wm{font-size:10.6px;color:var(--mute);margin-top:2px}
#det{display:none;position:fixed;z-index:950;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 40px));max-height:min(80vh,820px);overflow:auto;padding:18px 22px 20px;box-sizing:border-box;box-shadow:0 24px 70px rgba(0,0,0,.75)}
#det.open{display:block}
#detGrip{position:sticky;top:-18px;margin:-18px -22px 6px;height:18px;cursor:grab;display:flex;justify-content:center;align-items:center;background:var(--card);z-index:2;touch-action:none}
#detGrip::after{content:"";width:42px;height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
#det.dragging,#det.dragging #detGrip{cursor:grabbing;user-select:none}
#det .hp-k,#det h3{cursor:grab}
#det .hp-desc,#det .bts p{font-size:14px}
#det h3{font-size:20px}
#detBar{position:sticky;top:-18px;margin:-18px -22px 10px;padding:7px 14px 7px 10px;display:flex;align-items:center;gap:7px;background:var(--card);border-bottom:1px solid var(--line);z-index:6}
#detBar #detGrip{position:static;flex:1 1 auto;margin:0;height:16px;min-width:26px;background:none;z-index:auto}
#detBar #detX{position:static;z-index:auto;top:auto;right:auto;font-size:21px;padding:0 2px;flex:0 0 auto}
#detBar button#detBack,#detBar button#detFwd{flex:0 0 auto;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);border-radius:4px;height:23px;padding:0 8px;font:11.5px/1 'Marcellus',Georgia,serif;letter-spacing:.03em;cursor:pointer;white-space:nowrap}
#detBar button#detBack:hover:not(.off),#detBar button#detFwd:hover:not(.off){border-color:var(--accent-hi);color:#fff;background:rgba(255,255,255,.1)}
#detBar button.off{opacity:.3;cursor:default}
@media (max-width:620px){#detBar button#detBack,#detBar button#detFwd{font-size:11px;padding:0 6px}}
#detX:hover{color:#fff}
/* card contents */
.hp h3{margin:2px 0 5px;font-size:17px;font-weight:700;color:#f0ece4;border-bottom:1px solid var(--line);padding:0 18px 6px 0;line-height:1.3}
.hp-k{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);padding-right:20px}
.hp-sub{color:var(--mute);font-size:12px;margin:0 0 6px}
.hp-desc{margin:8px 0;color:#dedbe6;font-size:13px}
.hp-h{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);margin:14px 0 4px}
.hp table.kv{border-collapse:collapse;font-size:12.5px;width:100%}
.hp table.kv th{text-align:left;color:var(--mute);font-weight:400;vertical-align:top;padding:2px 10px 2px 0;white-space:nowrap}
.hp table.kv td{padding:2px 0;vertical-align:top;text-align:right;font-variant-numeric:tabular-nums}
.hp .bt{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin:2px 0 6px}
.hp .bt i{display:block;height:100%}
.hp-src{color:var(--mute);font-size:11.2px;margin-top:8px;border-top:1px solid var(--line2);padding-top:6px}
.hp-src a{color:var(--accent-hi)}
.bts{margin:10px 0;padding:9px 11px;border-left:3px solid var(--accent);background:rgba(255,255,255,.035);border-radius:0 5px 5px 0}
.bts p{margin:0 0 7px;font-size:13px;color:#e2dfe8;line-height:1.55}
.bts .imp{margin-top:8px;padding-top:8px;border-top:1px solid var(--line2)}
.tag{display:inline-block;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--mute);margin-left:6px;vertical-align:2px}
.note{font-size:12px;color:#cfcbe0;background:rgba(255,255,255,.04);border-left:2px solid var(--accent-hi);padding:6px 9px;margin:8px 0;border-radius:0 4px 4px 0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chips span{font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:0 6px;cursor:pointer}
.chips span:hover{border-color:var(--accent-hi);color:#fff}
.chips .sw{width:8px;height:8px;margin-right:4px}
.chips span.est{border-style:dashed;color:var(--mute)}
.rec{border-top:1px solid var(--line2);padding:5px 0}
.rec.stk{cursor:pointer}.rec.stk:hover b{text-decoration:underline}
.rec .rh{display:flex;gap:7px;align-items:baseline;cursor:pointer;font-size:12.6px}
.rec .rh b{font-weight:400;color:#f0ece4;flex:1}
.rec .rh .n{white-space:nowrap}
.rec .rb{display:none;font-size:12.3px;color:#d8d5e0;margin:4px 0 2px 18px;line-height:1.5}
.rec.open .rb{display:block}
.st{font-size:9.6px;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap}
.pc{margin:6px 0}
.pc .pr{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);margin-left:4px}
.pc .pn{font-size:12.2px;color:#d8d5e0;margin:2px 0 0 0;line-height:1.45}
.pchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--line);border-radius:3px;padding:1px 7px;cursor:pointer}
.pchip:hover{border-color:var(--accent-hi);color:#fff}
.tl{font-size:12px;line-height:1.45;margin:3px 0;color:#d8d5e0}
.tl b{font-weight:400;color:var(--accent-hi);margin-right:6px;font-variant-numeric:tabular-nums}
.imp-box{margin:10px 0;padding:9px 11px;background:rgba(255,255,255,.045);border-left:3px solid var(--accent-hi);border-radius:0 5px 5px 0;font-size:13px;color:#e8e4ec;line-height:1.55}
#ttip{position:fixed;z-index:2000;pointer-events:none;background:rgba(12,13,20,.97);border:1px solid var(--line);border-radius:3px;padding:4px 8px;font-size:12.5px;display:none;max-width:320px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#worldBtn{position:absolute;z-index:800;right:52px;bottom:34px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 11px;font:13px 'Marcellus','Georgia',serif;cursor:pointer}
#info{inset:0;z-index:1001;border-radius:0;border:0;display:none;overflow:auto;padding:60px max(28px,calc((100% - 1000px)/2)) 40px;background:rgba(5,6,16,.975)}
#info.open{display:block}
#infoClose{position:fixed;top:12px;right:12px;z-index:1002;display:none}
#info.open+#infoClose{display:block}
#info h2{font:400 17px/1.3 'Uncial Antiqua','Marcellus','Georgia',serif;margin:26px 0 8px;color:#f0ece4;letter-spacing:.3px}
#info h2:first-child{margin-top:0}
#info h3{font:600 14px/1.35 'Marcellus','Georgia',serif;margin:20px 0 6px;color:#e4ded2;letter-spacing:.2px}
#info p,#info li{font-size:14px}
#info ul{padding-left:20px;margin:4px 0}
#info .warn{border-left:2px solid var(--accent);padding:4px 0 4px 12px;color:#d8d5e0}
#info table.cov{border-collapse:collapse;width:100%;font-size:13px;margin:10px 0 4px}
#info table.cov th{text-align:left;font-weight:600;color:var(--mute);border-bottom:1px solid var(--line);padding:4px 10px 5px 0}
#info table.cov td{vertical-align:top;padding:7px 10px 7px 0;border-bottom:1px solid rgba(255,255,255,.06)}
#info table.cov td:nth-child(n+2){text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
#info table.cov .mute{color:var(--mute);font-size:12px}
.maplibregl-map{font-family:'Marcellus','Georgia',serif}
.maplibregl-ctrl-attrib{background:rgba(6,7,16,.8)!important;color:#8f8d9e;font-family:'Marcellus','Georgia',serif}
.maplibregl-ctrl-attrib a{color:#b0aec0!important}
.maplibregl-ctrl-attrib-button{filter:invert(1)}
.maplibregl-ctrl-group{background:var(--card)!important;border:1px solid var(--line);box-shadow:none!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}
.maplibregl-ctrl-bottom-right{bottom:24px}
@media (max-width:820px){
  #key{width:auto;right:12px;max-height:42%}
  #rcol{top:auto;bottom:34px;left:12px;right:12px;width:auto;max-height:46%}
  #infoBtn{align-self:flex-start}
  #info{padding:56px 16px 80px}
}

.btnrow{display:flex;gap:6px;align-self:flex-end}
.btnrow .card{position:relative;padding:7px 14px;cursor:pointer;letter-spacing:.2px}
.btnrow .card:hover{border-color:var(--accent-hi);color:#fff}
#patBox{left:12px;bottom:34px;width:346px;max-height:40%;display:flex;flex-direction:column;padding:12px 14px;box-sizing:border-box}
#patBox .bh{display:flex;justify-content:space-between;align-items:center}
#patBox .psec{margin:0}
#patBody{overflow:auto;min-height:0;margin-top:6px}
#patBox.min #patBody{display:none}
#legBox{right:12px;bottom:34px;width:340px;max-height:46%;display:flex;flex-direction:column;justify-content:flex-start;padding:10px 14px 12px;box-sizing:border-box}
#legBody{overflow:auto;min-height:0}
#legBox.min #legBody{display:none}
#legBox .bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
#legBox .psec{margin:0}
.up{border-left:1px solid var(--line2);margin-left:6px;padding-left:4px}
.presets{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.presets .btn{font-size:11.8px;padding:2px 8px}
#story{inset:0;z-index:1001;border-radius:0;border:0;display:none;overflow:auto;padding:60px max(28px,calc((100% - 760px)/2)) 50px;background:rgba(5,6,16,.975)}
#story.open{display:block}
#story p{font-size:15.5px;line-height:1.75;color:#e4e0e8;margin:0 0 16px}
#story p.big{font-size:18px;line-height:1.6;color:#f0ece4;border-left:2px solid var(--accent-hi);padding-left:14px;margin:0 0 18px}
#story p.mute{color:var(--mute);font-size:13.5px}
#story h2{font:400 22px/1.3 'Uncial Antiqua','Marcellus','Georgia',serif;margin:0 0 18px;color:#f0ece4}
#story h3{font:400 15px/1.3 'Uncial Antiqua','Marcellus','Georgia',serif;margin:26px 0 10px;color:var(--accent-hi);letter-spacing:.3px}
#storyClose{position:fixed;top:12px;right:12px;z-index:1002;display:none}
#story.open+#storyClose{display:block}
.maplibregl-ctrl-bottom-right{right:362px!important;bottom:30px!important}
#worldBtn{right:410px!important;bottom:34px!important}
@media (max-width:820px){#patBox,#legBox{position:absolute;width:auto;left:12px;right:12px;max-height:30%}#legBox{bottom:auto;top:46%}.maplibregl-ctrl-bottom-right{right:0!important}#worldBtn{right:52px!important}}
.whyc{font-weight:600;opacity:.85}
.cov{color:var(--mute)}
</style>
</head>
<body>
<div id="map"></div>

<div id="key" class="card scroll">
  <button id="toggleKey" class="tog" type="button" title="Pull the key up or down">−</button>
  <h1>School Map</h1>
  <p class="lede">Who owns school, who writes what is taught, and what it is for.</p>
  <p class="lede2" id="lede2"></p>
  <div class="body" id="keyBody"></div>
</div>

<div id="rcol">
  <div class="btnrow"><div id="storyBtn" class="card" role="button" tabindex="0">About this map</div><div id="infoBtn" class="card" role="button" tabindex="0">Method and sources</div></div>
  <div id="tr" class="card"><button id="toggleTr" class="tog" type="button" title="Pull the basemap box up or down">−</button><div class="body" id="trBody"></div></div>

rs held nearly 90% of the United States PreK-12 market","c":"United States","lat":38.8951,"lng":-77.0364,"y":2010,"bk":"materials","status":"reported","rank":"the national market in school instructional materials","d":"A run of mergers and takeovers through the 1990s and early 2000s left three publishers, Houghton Mifflin Harcourt, Pearson and McGraw Hill, holding nearly 90% of the PreK-12 market. Districts still saw dozens of curriculum options, but the competition was largely illusory because the same three companies owned the majority of the titles.","cite":"New America, 'States, Not Publishers, Driving Innovation in the Curriculum Marketplace'","url":"https://www.newamerica.org/insights/states-driving-curriculum-innovation/","org":"","on":"","inf":"publisher","who":"Pearson, McGraw Hill and Houghton Mifflin Harcourt","tgt":"system","rel":"legacy","lik":"established","inside":"Three companies owned most of the schoolbooks in the country, under many different brand names, so the choice a school district thought it was making was mostly a choice between the same three firms.","int":4,"wide":2,"undone":"","why":"","i":0,"w":1.44},{"n":"McGraw Hill tells investors it serves about 91% of United States public school districts","c":"United States","lat":39.9612,"lng":-82.9988,"y":2026,"bk":"materials","status":"filing","rank":"public K-12 districts nationwide","d":"In its annual report for the year to March 2026, McGraw Hill describes itself as a top-two provider in the United States K-12 market serving approximately 91% of public K-12 districts, going to market as an end-to-end provider of core, supplemental and intervention curricula. An earlier registration statement put the figure at about 99%. The company also notes that states with large school populations keep centralised approval lists for curriculum, which makes those states predictable to sell to.","cite":"McGraw Hill, Inc., Form 10-K for fiscal year ended 31 March 2026, U.S. Securities and Exchange Commission","url":"https://www.sec.gov/Archives/edgar/data/0001951070/000195107026000022/mh-20260331.htm","org":"mcgraw","on":"McGraw Hill","inf":"publisher","who":"McGraw Hill, Inc.","tgt":"system","rel":"now","lik":"established","inside":"One company's own report to its shareholders says it sells curriculum into about nine out of every ten American public school districts.","int":4,"wide":2,"undone":"","why":"","i":1,"w":1.44},{"n":"Pearson's assessments put inside McGraw Hill's core curriculum","c":"United States","lat":39.9612,"lng":-82.9988,"y":2025,"bk":"tests","status":"contract","rank":"K-12 mathematics in California, then further states and subjects","d":"On 4 June 2025 McGraw Hill and Pearson announced an agreement to integrate Pearson's PRoPL interim assessment directly into McGraw Hill's K-12 curriculum, beginning in California for the 2025-26 school year with California Reveal Math and expanding to further subjects, grades and states. Trade press noted it is not a merger or an acquisition, but that the partnership has a similar effect: it ties the core programme a child is taught from to the test that measures the child, and both come from the same two firms.","cite":"McGraw Hill and Pearson joint press release, 4 June 2025; EdWeek Market Brief, 18 June 2025; THE Journal, 6 June 2025","url":"https://marketbrief.edweek.org/strategy-operations/in-mega-partnership-mcgraw-hill-adds-pearsons-assessments-to-its-core-curriculum/2025/06","org":"pearson","on":"Pearson plc","inf":"publisher","who":"Pearson plc and McGraw Hill","tgt":"system","rel":"now","lik":"established","inside":"The company that sells the lessons and the company that sells the test agreed to join their products, so the test a child sits is built to match the book the same two companies sold the school.","int":3,"wide":2,"undone":"","why":"","i":2,"w":1.16},{"n":"Veritas Capital takes Houghton Mifflin Harcourt private","c":"United States","lat":42.3509,"lng":-71.041,"y":2022,"bk":"ownership","status":"filing","rank":"a publisher serving, on its own figures, 50 million students a day","d":"HMH announced a definitive merger agreement with affiliates of Veritas Capital in February 2022 after a review in which it held discussions with several strategic and financial bidders, and completed the sale the same year. Its own announcement said the deal would let it increase its impact on the four million teachers and fifty million students it supports each day. Veritas' chief executive Ramzi Musallam said education and technology had both become central to the firm's investing.","cite":"Houghton Mifflin Harcourt Form 8-K, 22 February 2022 and completion announcement (SEC)","url":"https://www.sec.gov/Archives/edgar/data/1580156/000119312522047535/d304266dex991.htm","org":"veritas","on":"Veritas Capital","inf":"investor","who":"Veritas Capital","tgt":"system","rel":"now","lik":"established","inside":"A private investment firm bought one of the three big American schoolbook companies outright, so its curriculum decisions now sit inside a fund's plan for the business.","int":4,"wide":2,"undone":"","why":"","i":3,"w":1.44},{"n":"HMH buys the non-profit behind the MAP test","c":"United States","lat":45.5152,"lng":-122.6784,"y":2023,"bk":"tests","status":"contract","rank":"NWEA, whose MAP Growth test served about 10,000 school districts","d":"Houghton Mifflin Harcourt, a year after being taken private by Veritas Capital, acquired virtually all the assets of NWEA, the non-profit behind the MAP Growth assessment used by around ten thousand districts and employing about 1,300 people. NWEA now operates as a division of HMH; its tests were to be aligned with HMH's curriculum, and the sale proceeds funded a separate non-profit foundation run by NWEA's former board. The Department of Justice looked at both horizontal and vertical concerns and closed its investigation without issuing a second request.","cite":"THE Journal, 10 January 2023; Boston Globe, 11 January 2023; EdWeek Market Brief, May 2023; Compass Lexecon note on the DOJ review","url":"https://marketbrief.edweek.org/strategy-operations/houghton-mifflin-harcourt-closes-deal-acquiring-nwea/2023/05","org":"nwea","on":"NWEA","inf":"publisher","who":"Houghton Mifflin Harcourt, owned by Veritas Capital","tgt":"system","rel":"now","lik":"established","inside":"The company that sells a school its lessons bought the charity that sold the same school the test, and said it would line the test up with its own lessons.","int":4,"wide":2,"undone":"","why":"","i":4,"w":1.44},{"n":"Pearson sells its United States K-12 business to a private equity firm for $250 million","c":"United States","lat":40.9445,"lng":-74.0754,"y":2019,"bk":"ownership","status":"filing","rank":"the Prentice Hall and Scott Foresman school lists and their district contracts","d":"In February 2019 Pearson sold its United States K-12 courseware business to Nexus Capital Management for 250 million dollars; the buyer renamed it Savvas Learning Company and installed Bethlam Forsa as chief executive. The transaction moved distribution contracts across thousands of school districts, together with the Prentice Hall and Scott Foresman catalogues, into the hands of a Los Angeles investment firm. Pearson exited the United States K-12 courseware market.","cite":"Pearson plc disclosure, February 2019; MarketResearch.com industry review; Savvas Learning Company ownership record","url":"https://blog.marketresearch.com/13-leading-educational-in-the-prek-12-school-market","org":"nexus_cap","on":"Nexus Capital Management","inf":"investor","who":"Nexus Capital Management","tgt":"system","rel":"now","lik":"established","inside":"The material taught in thousands of American school districts changed owner for $250 million in a private sale, and the schools using it had no part in the deal.","int":3,"wide":2,"undone":"","why":"","i":5,"w":1.16},{"n":"Platinum Equity buys McGraw-Hill Education for $4.7 billion","c":"United States","lat":33.985,"lng":-118.4695,"y":2021,"bk":"ownership","status":"filing","rank":"the publisher serving about 91% of United States public K-12 districts","d":"On 31 July 2021 an investment vehicle of funds controlled by Platinum Equity acquired 100% of the equity in McGraw-Hill Education for 4.713 billion dollars, buying it from Apollo Global Management, which had taken it private in 2012.","cite":"McGraw Hill, Inc., Form S-1 (2025), 'Platinum Acquisition', U.S. Securities and Exchange Commission","url":"https://www.sec.gov/Archives/edgar/data/1951070/000162828025033247/mcgrawhillinc-sx1.htm","org":"platinum","on":"Platinum Equity","inf":"investor","who":"Platinum Equity","tgt":"system","rel":"now","lik":"established","inside":"One investment firm sold the biggest American schoolbook company to another for $4.7 billion.","int":4,"wide":2,"undone":"","why":"","i":6,"w":1.44},{"n":"McGraw Hill floats but its owner keeps 86.5% of the votes","c":"United States","lat":40.7069,"lng":-74.0113,"y":2025,"bk":"ownership","status":"filing","rank":"voting control of the publisher after the flotation","d":"McGraw Hill priced its initial public offering at 17 dollars a share, below its marketed range of 19 to 22, raising about 414.6 million dollars and valuing the company at 3.25 billion dollars. The prospectus set out that Platinum Equity would continue to control the company after the listing through a stake representing about 86.5% of the voting power, and so would continue to nominate board members. The prospectus also commissioned and reported an addressable market of roughly 30 billion dollars, including 9.3 billion in K-12.","cite":"Reuters, 2025; IPOScoop, 'McGraw Hill (MH) Prices IPO at $17'; EdWeek Market Brief, July 2025","url":"https://www.iposcoop.com/the-ipo-buzz-mcgraw-hill-mh-prices-ipo-at-17-2-below-range/","org":"platinum","on":"Platinum Equity","inf":"investor","who":"Platinum Equity","tgt":"system","rel":"now","lik":"established","inside":"The company listed on the stock exchange, but the investment firm that owned it kept almost nine tenths of the voting power, so nothing about who decides changed.","int":3,"wide":2,"undone":"","why":"","i":7,"w":1.16},{"n":"A private foundation paid for the Common Core and for its adoption","c":"United States","lat":47.623,"lng":-122.348,"y":2009,"bk":"curriculum","status":"reported","rank":"English and mathematics standards in 45 states and the District of Columbia","d":"In 2008 Gene Wilhoit of the Council of Chief State School Officers and the consultant David Coleman persuaded Bill Gates to fund the creation and marketing of what became the Common Core State Standards. The Gates Foundation then provided, in the Washington Post's phrase, the money and structure for states to work together on common standards in a way that avoided the usual collision over states' rights, spending around 200 million dollars across development, political advocacy and grants to the organisations that then endorsed them, from teachers' unions to business groups. A search of the foundation's own grants database against the keyword returns more than 300 million dollars. The federal government then designed a contest using economic stimulus funds that rewarded states for accepting the standards; 45 states and the District of Columbia adopted them, at a speed one commentator called the closest thing to an educational coup in American history.","cite":"Lyndsey Layton, The Washington Post, 7 June 2014; Valerie Strauss, Washington Post Answer Sheet, 8 June 2014; National Education Policy Center","url":"https://www.washingtonpost.com/news/answer-sheet/wp/2014/06/08/did-bill-gates-fund-an-educational-coup/","org":"gates_edu","on":"Bill and Melinda Gates Foundation","inf":"donor","who":"Bill and Melinda Gates Foundation","tgt":"system","rel":"legacy","lik":"probable","inside":"One man's foundation paid for a new set of national school standards to be written and then paid the groups that argued for them, and most states adopted them. Nobody voted on it.","int":5,"wide":2,"undone":"","why":"","i":8,"w":1.376},{"n":"India removes the Mughal courts, the Gujarat riots and evolution from school textbooks","c":"India","lat":28.6333,"lng":77.2167,"y":2023,"bk":"curriculum","status":"adopted","rank":"national history, political science and science syllabus","d":"Under what it called rationalisation to reduce pupils' workload after the pandemic, India's National Council of Educational Research and Training deleted the chapter 'Kings and Chronicles: The Mughal Courts' from the Class 12 history textbook, excised pages on the Delhi Sultanate rulers including the Mamluks, Tughlaqs, Khiljis and Lodis from the Class 7 book, removed passages on Hindu extremists' attempts to assassinate Gandhi and on the ban placed on the RSS after his killing, dropped the section on the 2002 Gujarat riots and chapters on federalism and diversity, and moved Darwin's theory of evolution to a later grade; teachers reported evolution being purged entirely by 2022-23. Historians from Indian and foreign universities said no member of the teams that prepared the textbooks had been consulted, and several authors asked for their names to be removed from the books. Kerala's education minister wrote to the prime minister asking for a review. Uttar Pradesh adopted the revised editions in its state schools from 2023-24.","cite":"Al Jazeera, 14 April 2023; CBC News, 2023; Press Trust of India, 8 and 27 April and 3 April 2023; American Historical Association, Perspectives on History, January 2024","url":"https://www.aljazeera.com/news/2023/4/14/mughals-rss-evolution-outrage-as-india-edits-school-textbooks","org":"ncert","on":"NCERT","inf":"state","who":"India's national curriculum council","tgt":"school","rel":"now","lik":"established","inside":"The national body that writes India's school books cut out large parts of the country's Muslim history, a massacre, and the theory of evolution, and said it was reducing pupils' workload.","int":4,"wide":2,"undone":"The historian Romila Thapar, speaking in January 2026 about NCERT's further revision of the Class 7 social science book, called removing the Mughals nonsense and said history has to be continuous.","why":"","i":9,"w":1.44},{"n":"Russia issues a single state history textbook justifying the invasion of Ukraine","c":"Russia","lat":55.7749,"lng":37.6324,"y":2023,"bk":"curriculum","status":"adopted","rank":"the final two years of school history, nationwide","d":"On 7 August 2023 Russia's education ministry presented new history textbooks for the tenth and eleventh grades, co-authored by presidential aide Vladimir Medinsky, a former culture minister. The chapters covering the 1970s to the 2000s were completely rewritten and a new section added on the invasion of Ukraine, which the book calls a special military operation, claims Russia was forced into, likens to the Soviet struggle against the Nazis, and presents as part of a Western attempt to weaken and dismember Russia. Medinsky said the book presents the state's point of view and was the first of its kind since the collapse of the USSR; the education minister said it was written in just under five months and would be in all schools. Amnesty International described it as full of official propaganda. A three-volume Military History of Russia edited by Medinsky followed.","cite":"BBC News, 10 August 2023; Meduza, 7 August 2023; Reuters; RFE/RL, 1 September 2023; Euronews, 1 September 2023","url":"https://meduza.io/en/feature/2023/08/07/such-unique-times-are-rare-in-history","org":"prosv","on":"Prosveshcheniye and the Russian state history textbook","inf":"state","who":"Russia's education ministry and the presidential administration","tgt":"school","rel":"now","lik":"established","inside":"The state wrote one official history book for every school in the country, with a chapter saying the war in Ukraine was forced on Russia.","int":5,"wide":2,"undone":"","why":"","i":10,"w":1.72},{"n":"Hungary nationalises the school textbook market","c":"Hungary","lat":47.4979,"lng":19.0402,"y":2014,"bk":"materials","status":"adopted","rank":"every primary school textbook in the country","d":"Hungary's parliament adopted a law nationalising the school textbook market. From 1 September 2014 a state-owned body created and published school books, supplied free to primary schools, with only two books available per subject per class. The government said the previous system had let publishers profit by over-supplying schools. The Hungarian Publishers' and Booksellers' Association said the publishers deprived of their market would have to close that part of their business; by one trade account two of the big publishers were nationalised and 90% of the available school books came from them. Textbook licences must be renewed every five years, and five publishers ended up in 123 separate trials, one per book, while the licences of state-sponsored textbooks were extended. In 2017 the European Court of Justice found Hungary had given its state distributor a monopoly on school books in breach of European procurement rules. By 2019 the state textbooks carried the prime minister's own speeches as set reading.","cite":"International Publishers Association and IFEX, 2014; Publishing Perspectives, February 2014; CNN, 1 February 2019; Federation of European Publishers","url":"https://internationalpublishers.org/hungary-nationalizes-schoolbook-market-spelling-ruin-for-educational-publishers/","org":"kello","on":"Konyvtarellato (KELLO)","inf":"state","who":"Hungary's government","tgt":"school","rel":"legacy","lik":"established","inside":"The state took over making and selling school books, left two choices per subject, and wrote its own.","int":4,"wide":2,"undone":"","why":"","i":11,"w":1.44},{"n":"Fossil-fuel industry figures took part at each stage of Texas science standard-setting","c":"United States","lat":30.2751,"lng":-97.7404,"y":2023,"bk":"curriculum","status":"reported","rank":"the Texas science standards and the textbooks written to them","d":"A Scientific American investigation that watched forty hours of live and archived Texas State Board of Education hearings, reviewed scores of public records and interviewed fifteen people involved in the standard-setting process found that members of the fossil-fuel industry participated at each stage. Because Texas is among the largest textbook purchasers in the country and its elected fifteen-member board has a record of applying a political lens, publishers pay close attention to Texas standards when writing material they then sell elsewhere.","cite":"Scientific American, 'Subverting Climate Science in the Classroom' (2023)","url":"https://www.scientificamerican.com/article/subverting-climate-science-in-the-classroom/","org":"tx_sboe","on":"Texas State Board of Education","inf":"ideo","who":"fossil fuel industry participants","tgt":"school","rel":"now","lik":"probable","inside":"People from the oil and gas industry took part at every stage of writing the state's science standards, which then shape what the textbooks say about climate.","int":4,"wide":2,"undone":"","why":"","i":12,"w":1.152},{"n":"An Arizona legislator introduced a lobby network's model school-choice bill almost unchanged","c":"United States","lat":33.4484,"lng":-112.074,"y":2013,"bk":"ministry","status":"reported","rank":"state education legislation","d":"State legislative records show that Debbie Lesko, a board member of the American Legislative Exchange Council, routinely sponsored ALEC model bills, often without changing more than a few words. One bill she sponsored was nearly identical to the School Choice Directory Act, an ALEC model bill produced the same year, which called on the state to produce a handbook educating parents about school choice. ALEC's method is that a legislator member introduces text closely resembling, or directly copied from, the model. In Florida the same year, sixty of the state's 160 legislators were identified as having ties to the network.","cite":"The Intercept, 19 April 2018, based on state legislative records","url":"https://theintercept.com/2018/04/19/alec-debbie-lesko-arizona-congress/","org":"alec_edu","on":"American Legislative Exchange Council","inf":"ideo","who":"American Legislative Exchange Council","tgt":"system","rel":"legacy","lik":"established","inside":"A lobby group wrote a law, a legislator who sat on its board introduced it as her own with a few words changed, and the state considered it as ordinary legislation.","int":3,"wide":2,"undone":"","why":"","i":13,"w":1.16},{"n":"PISA results had influenced policy reform in most participating systems","c":"France","lat":48.8699,"lng":2.2708,"y":2012,"bk":"ministry","status":"reported","rank":"national assessment, curriculum standards and performance targets","d":"A study published by the OECD itself found that PISA results had influenced policy reform in the majority of participating countries and economies. PISA is being integrated into national policies on assessment, evaluation, curriculum standards and performance targets; its assessment frameworks and instruments are used as best-practice models for national assessments; and many countries have explicitly written PISA-like competencies into revised national standards and curricula. Until the 1990s few European countries used national tests; by 2009 only five European education systems had none at all. Researchers describe the result as governing by numbers, and as a narrowing of the curriculum to what the test measures; one critical review put it bluntly, that national curricula, values and priorities are pushed aside.","cite":"Breakspear (2012), OECD Education Working Papers; Gorur, 'Seeing like PISA', European Educational Research Journal (2016); Sjoberg, PISA and Global Educational Governance (2015)","url":"https://journals.sagepub.com/doi/10.1177/1474904116658299","org":"oecd_pisa","on":"OECD and PISA","inf":"intlorg","who":"the OECD","tgt":"system","rel":"now","lik":"probable","inside":"A test run by a club of rich governments in Paris became the thing national school systems are redesigned to score well on.","int":5,"wide":5,"undone":"","why":"","i":14,"w":1.376},{"n":"Mexico's school reform was agreed between the government, the teachers' union and the OECD itself","c":"Mexico","lat":19.4326,"lng":-99.1332,"y":2008,"bk":"ministry","status":"reported","rank":"the national Alliance for Educational Quality","d":"Mexico's Alianza por la Calidad de la Educacion was, in the account summarised for the Canadian Teachers' Federation, a reform that not only used PISA as a point of reference but directly involved the OECD in its implementation, and was based for the first time on an agreement between the government, the education union SNTE and the OECD itself. Italy and France also used PISA results to argue for reform.","cite":"Froese-Germain, The OECD, PISA and the Impacts on Educational Policy, citing Figazzolo (ERIC ED532562)","url":"https://files.eric.ed.gov/fulltext/ED532562.pdf","org":"oecd_pisa","on":"OECD and PISA","inf":"intlorg","who":"the OECD","tgt":"system","rel":"legacy","lik":"probable","inside":"An international organisation was not just advising on Mexico's school reform, it was one of the three parties that signed it.","int":4,"wide":2,"undone":"","why":"","i":15,"w":1.152},{"n":"The Global Education Forum seats four rich states and no Global South state","c":"United States","lat":40.7489,"lng":-73.968,"y":2019,"bk":"ministry","status":"inquiry","rank":"a body that, researchers found, greatly influences global education policy","d":"The Global Education Forum, proposed by UN Special Envoy Gordon Brown and launched at the UN General Assembly in September 2019, is co-chaired by Graca Machel, Tharman Shanmugaratnam, UNESCO's Audrey Azoulay, the World Bank's Mari Pangestu and Brown. Researchers at the Transnational Institute counted its membership: four Global North member states, the United States, the United Kingdom's FCDO, Finland and Canada, and no Global South states; five multilateral bodies; three civil society groups; eight private foundations, private-sector and think-tank bodies; two academic bodies; and five individuals. It was meant to include development ministers and aid agencies and the authors found none. They found no clear information on its goals, selection criteria or decision-making procedures and described its structure as opaque, while concluding that it greatly influences global education policy and that the presence of private-sector actors is especially predominant in these post-2015 initiatives.","cite":"da Silva, Croso and Mode Magalhaes, Multistakeholderism in Global Education Governance: Losses for democracy, profits for business, Transnational Institute (2023), Table 4 and Conclusions 7 and 8","url":"https://www.tni.org/files/2023-09/%20Multistakeholderism%20in%20global%20education%20governance%20TNI.pdf","org":"gef","on":"Global Education Forum","inf":"intlorg","who":"the Global Education Forum","tgt":"system","rel":"now","lik":"probable","inside":"A body that shapes education policy for the whole world has four rich countries on it and not one poor country, more private foundations than governments, and no published rules for how it decides anything.","int":5,"wide":5,"undone":"","why":"","i":16,"w":1.376},{"n":"42 African countries hold six board seats at the largest education fund; 15 West European ones hold eight","c":"United States","lat":38.8995,"lng":-77.0421,"y":2023,"bk":"ministry","status":"inquiry","rank":"the board of the Global Partnership for Education","d":"The Global Partnership for Education, created by the World Bank in 2002 and reshaped in 2011 after criticism of its governance, brings together 79 developing countries and more than twenty donor agencies and supported 66 countries in 2021, 41 of them in Africa. Researchers set out the arithmetic of its board: six developing-country seats, six donor seats, three multilateral and regional bank seats, three civil-society seats of which one is for the teaching profession, and two private-sector and foundation seats. That means 42 African countries hold about a quarter of the seats while 15 Western European countries hold about a third. The secretariat sits inside the World Bank in Washington and has no independent legal status; the World Bank and UNICEF act as grant agents; and between 2011 and 2020 74.58% of its funding came from Europe and 14.46% from North America, with the United Kingdom alone providing 18.79%.","cite":"da Silva, Croso and Mode Magalhaes, Multistakeholderism in Global Education Governance, Transnational Institute (2023)","url":"https://www.tni.org/en/publication/multistakeholderism-in-global-education-governance","org":"gpe","on":"Global Partnership for Education","inf":"intlorg","who":"the Global Partnership for Education","tgt":"system","rel":"now","lik":"probable","inside":"The biggest fund for schools in poor countries gives the 42 countries of Africa fewer board seats than the 15 countries of Western Europe, and its office sits inside the World Bank.","int":5,"wide":5,"undone":"","why":"","i":17,"w":1.376},{"n":"Three UN rapporteurs stopped a plan to fund for-profit private schooling from the global education fund","c":"United States","lat":38.8995,"lng":-77.0421,"y":2019,"bk":"ministry","status":"inquiry","rank":"a proposal before the Global Partnership for Education","d":"A 2019 proposal that the Global Partnership for Education fund for-profit private education was rejected after three UN Special Rapporteurs on the right to education, Koumbou Boly Barry, Vernor Munoz and Kishore Singh, objected. It is one of the few occasions on this map where an outside objection stopped a decision inside one of these bodies.","cite":"da Silva, Croso and Mode Magalhaes, Multistakeholderism in Global Education Governance, Transnational Institute (2023)","url":"https://www.tni.org/en/publication/multistakeholderism-in-global-education-governance","org":"gpe","on":"Global Partnership for Education","inf":"intlorg","who":"the Global Partnership for Education","tgt":"system","rel":"legacy","lik":"probable","inside":"The fund nearly started paying for-profit schools out of aid money, and three United Nations experts on the right to education blocked it.","int":3,"wide":5,"undone":"","why":"","i":18,"w":0.928},{"n":"The emergency education fund has thirteen donor seats and no seat for teachers","c":"Switzerland","lat":46.2324,"lng":6.136,"y":2015,"bk":"ministry","status":"inquiry","rank":"the governing body of Education Cannot Wait","d":"Education Cannot Wait was proposed by Gordon Brown at the World Economic Forum in Davos in January 2015 and is chaired by him. Its governing body is 13 donor states, which is 42% of it, two developing-country partners at 6%, four international civil-society organisations at 13%, eight multilateral bodies at 26% and four private-sector or foundation members at 13%. There is no representation of the teaching profession and none of Global South civil society.","cite":"da Silva, Croso and Mode Magalhaes, Multistakeholderism in Global Education Governance, Transnational Institute (2023)","url":"https://www.tni.org/en/publication/multistakeholderism-in-global-education-governance","org":"ecw","on":"Education Cannot Wait","inf":"intlorg","who":"Education Cannot Wait","tgt":"system","rel":"now","lik":"probable","inside":"The fund that decides schooling for children in war zones has thirteen seats for donor governments, two for the countries receiving the money, and none for teachers.","int":4,"wide":5,"undone":"","why":"","i":19,"w":1.152},{"n":"A shortage of money for schools answered with a $10 billion lending facility","c":"United Kingdom","lat":51.501,"lng":-0.1246,"y":2022,"bk":"money","status":"inquiry","rank":"the International Financing Facility for Education","d":"The Education Commission, set up in 2015 and chaired by Gordon Brown with 26 individual commissioners, hosts the International Financing Facility for Education, launched in September 2022 with a target of 10 billion dollars over five years. Civil-society networks opposed it because it is a lending mechanism: the answer offered to countries short of money for schools is debt they then owe.","cite":"da Silva, Croso and Mode Magalhaes, Multistakeholderism in Global Education Governance, Transnational Institute (2023)","url":"https://www.tni.org/en/publication/multistakeholderism-in-global-education-governance","org":"edcomm","on":"Education Commission and IFFed","inf":"intlorg","who":"the Education Commission","tgt":"system","rel":"now","lik":"probable","inside":"Poor countries short of money for schools were offered loans, which means the schools get built and the country owes the cost plus interest.","int":4,"wide":4,"undone":"","why":"","i":20,"w":1.152},{"n":"A charity run by the Special Envoy's family holds the private-sector seats on the global education fund","c":"United States","lat":38.905,"lng":-77.043,"y":2012,"bk":"ministry","status":"inquiry","rank":"the two private-sector and foundation seats on the GPE board","d":"The Global Business Coalition for Education was established in 2012 by Theirworld, whose chair Sarah Brown is also the coalition's executive chair, with Justin van Fleet as executive director. The 2023 board of the Global Partnership for Education lists the coalition in both private-sector seats. The researchers also note individuals holding roles across several of these bodies at once, among them Lawrence Summers, Jim Kim, Michael Barber, Helle Thorning-Schmidt and Ronald Cohen, and corporate figures in the coalition's orbit including Aliko Dangote, Strive Masiyiwa, Jack Ma, Carlos Slim, Ratan Tata, Laurene Powell Jobs and Wendy Kopp of Teach for All.","cite":"da Silva, Croso and Mode Magalhaes, Multistakeholderism in Global Education Governance, Transnational Institute (2023)","url":"https://www.tni.org/en/publication/multistakeholderism-in-global-education-governance","org":"gbce","on":"Global Business Coalition for Education","inf":"donor","who":"the Global Business Coalition for Education","tgt":"system","rel":"now","lik":"probable","inside":"Business speaks to the world's biggest school fund through one coalition, and that coalition was set up and is chaired by the family of the UN envoy who proposed several of the other bodies in the same system.","int":4,"wide":5,"undone":"","why":"","i":21,"w":1.152},{"n":"The World Bank encouraged fees for primary school and funded schooling through the human resources department","c":"United States","lat":38.8993,"lng":-77.0425,"y":1985,"bk":"money","status":"reported","rank":"education budgets under structural adjustment","d":"Under structural adjustment in the 1980s the World Bank's education team moved into the human resources department and education funds for countries diminished in a context of reducing the role of the state, with state funding substituted by fees paid by students. As fees were introduced students dropped out under pressure to contribute to family welfare. Until the 1990s the Bank was actively encouraging the charging of fees for primary education, in direct contradiction to the notion that all children have a right to education irrespective of wealth. Bank officials now say they never talk about conditions, only prior actions. One ministry official who approached the Bank for higher-education funding during adjustment was told it was interested in primary education, because higher education benefits only those who obtain it.","cite":"Bretton Woods Project, 'At issue: The World Bank as a new global education ministry?' (2011) and 'Six reasons why the World Bank should be debarred from education' (2006); Collins and Rhoads, Higher Education 59 (2010)","url":"https://www.brettonwoodsproject.org/2011/01/art-567384/","org":"worldbank_edu","on":"World Bank education lending","inf":"intlorg","who":"the World Bank","tgt":"system","rel":"legacy","lik":"probable","inside":"For years the condition of the Bank's money was that families start paying for primary school, and children left school because their families could not.","int":5,"wide":4,"undone":"","why":"","i":22,"w":1.376},{"n":"Liberia hands 93 public schools to eight private companies","c":"Liberia","lat":6.3005,"lng":-10.797,"y":2016,"bk":"ownership","status":"contract","rank":"93 government primary schools under the Liberian Education Advancement Program","d":"Liberia selected eight private companies to take over 93 public schools under the Liberian Education Advancement Program. Bridge International Academies, the largest for-profit primary chain in the world, started with 23 of them. No other government on this map contracted out the running of a block of its own state schools to foreign companies as a programme.","cite":"Bridge International Academies corporate record on the Liberian Education Advancement Program; Education International reporting","url":"https://en.wikipedia.org/wiki/Bridge_International_Academies","org":"newglobe","on":"NewGlobe Schools / Bridge International Academies","inf":"chain","who":"Bridge International Academies and seven other companies","tgt":"school","rel":"now","lik":"established","inside":"A government handed 93 of its own primary schools to private companies to run, and one foreign chain took 23 of them.","int":5,"wide":2,"undone":"","why":"","i":23,"w":1.72},{"n":"The World Bank's private arm put $13.5 million into the world's largest for-profit primary chain","c":"Kenya","lat":-1.3006,"lng":36.782,"y":2013,"bk":"ownership","status":"filing","rank":"NewGlobe Schools, parent of Bridge International Academies","d":"The IFC invested a total of 13.5 million dollars of equity in NewGlobe Schools in 2013 and 2016. At the time Bridge ran 211 schools serving over 57,000 pupils in Kenya and aimed, in the IFC's words, to provide quality education to families earning less than two dollars per person a day; the investment was to increase the number of schools in Kenya and expand to three new countries. Uganda ordered its Bridge schools closed in 2016 over standards and licensing, Kenyan authorities moved against it the same year, and a British parliamentary committee opened an inquiry into aid money reaching the chain.","cite":"IFC Project Information and Data Portal, project 32171; Compliance Advisor Ombudsman case file Kenya: Bridge International Academies-01","url":"https://disclosures.ifc.org/project-detail/SII/32171/bridge-international-academies","org":"ifc_edu","on":"International Finance Corporation (IFC), education portfolio","inf":"intlorg","who":"the International Finance Corporation","tgt":"school","rel":"legacy","lik":"established","inside":"The World Bank's private lending arm put money into a company charging the world's poorest families for primary school.","int":4,"wide":3,"undone":"","why":"","i":24,"w":1.44},{"n":"The IFC quietly exits Bridge while complaints about child sexual abuse were still open","c":"Kenya","lat":-1.3006,"lng":36.782,"y":2022,"bk":"ownership","status":"filing","rank":"the IFC's equity stake in NewGlobe Schools","d":"The IFC exited its investment in NewGlobe Schools, the parent of Bridge International Academies, effective 3 March 2022. Its own accountability mechanism, the Compliance Advisor Ombudsman, had accepted its first complaint on Bridge in 2018, from the East Africa Centre for Human Rights among others. Forty-seven civil-society organisations responded to the CAO's compliance investigation report by acknowledging its grave findings regarding allegations of child sexual abuse at the company's for-profit schools in Kenya, and called on remaining investors to divest and on the IFC to make its freeze on for-profit private education permanent. The Bank Information Center noted that as of December 2023 the IFC had not publicly disclosed a management action plan.","cite":"IFC Project Information Portal; Compliance Advisor Ombudsman case files; Global Student Forum statement of 47 civil society organisations; Oxfam, 2022; Bank Information Center, 2025","url":"https://www.globalstudentforum.org/civil-society-organisations-call-on-other-investors-in-bridge-international-academies-to-divest-urgently-and-to-address-concerns-raised/","org":"newglobe","on":"NewGlobe Schools / Bridge International Academies","inf":"intlorg","who":"the International Finance Corporation","tgt":"school","rel":"now","lik":"established","inside":"The World Bank's private arm sold its stake in the school chain without announcing it, while its own watchdog was still investigating allegations of children being sexually abused at those schools.","int":5,"wide":3,"undone":"","why":"","i":25,"w":1.72},{"n":"Omega's daily fee came to about 41% of a lowest-wage worker's income","c":"Ghana","lat":5.556,"lng":-0.206,"y":2015,"bk":"money","status":"reported","rank":"families paying pay-as-you-learn fees in Ghana","d":"Pearson's Affordable Learning Fund made its first investment in Omega Schools Franchise in Ghana, a chain charging on a pay-as-you-learn basis. Published fees and costs at the fund's school-chain investments, compared with wages in March 2015, came to about 62% of the income of one adult on the lowest official wage in South Africa for SPARK Schools, 41% for Omega Schools in Ghana and 8% for Bridge in Kenya. Nowhere does the fund state what counts as affordable. Riep's study concluded Omega was not expanding access to basic education.","cite":"Srivastava, response to The Economist, Oxfam From Poverty to Power (2015); Riep, in Education, Privatisation and Social Justice (Education International)","url":"https://oxfamblogs.org/fp2p/its-complicated-or-low-fee-private-schooling-what-do-we-really-know/","org":"omega","on":"Omega Schools","inf":"chain","who":"Omega Schools and the Pearson Affordable Learning Fund","tgt":"school","rel":"now","lik":"probable","inside":"The school was sold as affordable, and the fees took something like two fifths of what one adult on the lowest legal wage brought home.","int":4,"wide":2,"undone":"","why":"","i":26,"w":1.152},{"n":"A consortium buys an international school chain at a $14.5 billion valuation","c":"United Kingdom","lat":51.5145,"lng":-0.0885,"y":2024,"bk":"ownership","status":"filing","rank":"over 80 schools in 33 countries and more than 85,000 pupils","d":"Neuberger Berman Private Markets, EQT and the Canada Pension Plan Investment Board, together with other global institutional investors including Corporacion Financiera Alba and Dubai Holding Investments, signed share purchase agreements for Nord Anglia Education at an enterprise value of 14.5 billion dollars including debt; the deal completed in March 2025. EQT had taken the company private in 2008 for about 400 million dollars when it had six schools, and the transaction returned 5.4 billion dollars to EQT's investors while it kept a stake.","cite":"EQT press release, 21 October 2024; Reuters, 21 October 2024; The PIE News, 24 March 2025; Gulf News","url":"https://eqtgroup.com/news/neuberger-berman-private-markets-eqt-and-cpp-investments-form-consortium-to-acquire-leading-international-schools-organization-nord-anglia-education-2024-10-21","org":"eqt_na","on":"EQT and the Nord Anglia consortium","inf":"investor","who":"EQT, Neuberger Berman and CPP Investments","tgt":"school","rel":"now","lik":"established","inside":"A school system teaching 85,000 children in 33 countries was bought and sold for $14.5 billion, and the sellers took $5.4 billion out of it.","int":4,"wide":4,"undone":"","why":"","i":27,"w":1.44},{"n":"Corinthian Colleges collapses and $5.8 billion of its students' debt is cancelled","c":"United States","lat":33.6846,"lng":-117.8265,"y":2015,"bk":"money","status":"settled","rank":"about 560,000 borrowers across roughly 105 campuses","d":"Corinthian Colleges ran Everest College, Heald College and WyoTech, with more than 110,000 students at about 105 campuses, until its federal aid was cut off and it shut in April 2015. The California attorney general had sued it alleging false advertising, securities fraud and misrepresentation of job-placement rates. On 1 June 2022 the Department of Education discharged all remaining federal student loan debt for Corinthian students: 5.8 billion dollars for 560,000 people, the largest student-debt cancellation in American history. The provision used, borrower defence, had received five claims in the twenty years to 2015; fifteen students who called themselves the Corinthian 15 went on debt strike, the Debt Collective circulated the first applications, and a thousand claims arrived within months. ITT Technical Institute collapsed the following year and 500 million dollars of its former students' debt was cancelled too, so this was not one failing company.","cite":"U.S. Department of Education announcement, 1 June 2022; NASFAA; Federal Register, June 2015; American Prospect; AFT","url":"https://www.aft.org/news/justice-and-relief-defrauded-corinthian-students","org":"corinthian","on":"Corinthian Colleges","inf":"chain","who":"Corinthian Colleges","tgt":"uni","rel":"legacy","lik":"established","inside":"A chain of colleges took federal loan money on the strength of job figures it had misrepresented, collapsed, and the government eventually wrote off $5.8 billion that its students owed.","int":5,"wide":2,"undone":"","why":"","i":28,"w":1.72},{"n":"Google settles for $8.75 million over students' face and voice data in Illinois schools","c":"United States","lat":41.8781,"lng":-87.6298,"y":2025,"bk":"platforms","status":"settled","rank":"pupils with Google Workspace for Education accounts in Illinois schools","d":"A class action, H.K. et al. v. Google LLC, alleged that Google collected and stored Illinois schoolchildren's biometric data, including face and voice models, through Google Workspace for Education and its predecessor G Suite for Education, which came pre-installed on certain school-issued Chromebooks, without the notice and written consent required by the state's Biometric Information Privacy Act. Google denied wrongdoing and agreed to pay 8.75 million dollars; the settlement covered accounts held between 26 March 2015 and 15 May 2025 where Voice Match or Face Match was enabled, and received final approval in October 2025.","cite":"Google Education BIPA settlement, official settlement website; Class Action, 2025; ID Tech, 2025","url":"https://www.googleeducationbipasettlement.com/","org":"google_edu","on":"Google for Education","inf":"platform","who":"Google LLC","tgt":"school","rel":"now","lik":"established","inside":"Children's faces and voices were recorded through the school laptop's built-in accounts without their parents being asked, and the company paid $8.75 million to settle rather than fight it.","int":4,"wide":2,"undone":"","why":"","i":29,"w":1.44},{"n":"Chromebooks reach about 60% of the world's school devices and 72% of United States classrooms","c":"United States","lat":37.422,"lng":-122.0841,"y":2025,"bk":"platforms","status":"reported","rank":"the device, the account and the files of a school day","d":"Chromebooks held 60.1% of the global K-12 education device market in 2025 and, on Futuresource Consulting's tracker, 72% of mobile computing devices in United States public K-12 classrooms, with Google reporting more than 50 million active students and teachers on ChromeOS devices. 93% of United States school districts planned Chromebook purchases in 2025, up from 84% in 2023. Google, Apple and Microsoft together hold over 97% of the K-12 operating-system market. North America accounts for 52.4% of global Chromebook sales, nearly all of it United States schools.","cite":"Mordor Intelligence and Futuresource Consulting EdTech Tracker figures, 2025; Google for Education disclosures; Dataintelo K-12 operating system market report","url":"https://voxbooster.com/blog/chromebook-statistics-2026/","org":"google_edu","on":"Google for Education","inf":"platform","who":"Google LLC","tgt":"school","rel":"now","lik":"probable","inside":"Most school laptops in the world now run one company's system, and almost every American district buys them, so the record of a child's school work sits with that company by default.","int":5,"wide":5,"undone":"","why":"","i":30,"w":1.376},{"n":"The world's most valuable education technology company goes to zero","c":"India","lat":12.9352,"lng":77.6245,"y":2024,"bk":"platforms","status":"ruling","rank":"150 million registered users and 58,000 staff","d":"Byju's was valued at 22 billion dollars in 2022, the most valuable education technology company in the world, with 150 million registered users and 58,000 employees. By January 2024 the valuation had crashed to around 225 million dollars. In June 2024 Prosus wrote the fair value of its 9.6% stake to zero, disclosing a 493 million dollar loss; BlackRock also wrote its stake down. Prosus, Peak XV and the Chan Zuckerberg Initiative had resigned from the board in 2023. An Indian tribunal opened insolvency proceedings in July 2024 on a petition from the cricket board over about 19 million dollars, India's Supreme Court cleared the way for them to continue, and in October 2024 the founder said the company was worth nothing.","cite":"Byju's corporate and insolvency record; CNBC, 1 March 2024; TechCrunch, 16 July 2024; Business Standard, 18 October 2024; The Logical Indian, 2025","url":"https://www.business-standard.com/companies/news/byju-s-worth-zero-now-how-the-cookie-crumbled-for-india-s-edtech-giant-124101800394_1.html","org":"byjus","on":"Byju's (Think and Learn)","inf":"platform","who":"Byju's (Think and Learn)","tgt":"school","rel":"legacy","lik":"established","inside":"A company that taught 150 million registered users was built on investor money, and when the money and the figures stopped adding up it was worth nothing and the teaching stopped with it.","int":4,"wide":3,"undone":"","why":"","i":31,"w":1.44},{"n":"China closes most of a private tutoring industry in one policy","c":"China","lat":39.917,"lng":116.398,"y":2021,"bk":"ownership","status":"adopted","rank":"for-profit tutoring in school subjects, nationwide","d":"In July 2021 China's central government launched the double reduction policy, banning for-profit academic tutoring for school-age children nationwide and requiring existing operators to convert to non-profits or exit, alongside cuts to homework. Within four months online job postings for tutoring-related firms fell 89%, firm entry halved and exits tripled; untargeted arts and sports tutoring was heavily struck too. By December 2021 the education ministry reported offline training institutions down 83.8% and online ones down 84.1%. Listed companies including TAL Education lost most of their value. Demand did not go away: by 2024 the sector had re-emerged in other forms and official rhetoric had softened.","cite":"Huang, Liu, Ma and Yang, 'Biting the Hand that Teaches' (SSRN 4758676); China Ministry of Education figures via Global Times, 21 December 2021; South China Morning Post, 2024; VoxChina","url":"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4758676","org":"cn_tutoring","on":"China's double reduction policy","inf":"state","who":"China's State Council and education ministry","tgt":"school","rel":"now","lik":"established","inside":"One government decision shut most of a whole private tutoring industry in a few months, and the demand for it simply moved somewhere less visible.","int":5,"wide":2,"undone":"","why":"","i":32,"w":1.72},{"n":"One non-profit sets and scores both the SAT and the Advanced Placement exams","c":"United States","lat":38.9586,"lng":-77.357,"y":2023,"bk":"tests","status":"filing","rank":"university admissions testing and advanced school courses in the United States","d":"The College Board both administers the SAT and runs the Advanced Placement programme, which together shape what American secondary schools teach in their hardest courses and what counts as readiness for university. Its own tax documents for 2023 showed more than a billion dollars of revenue, of which about 4 million came from contributions and some 955 million from programme fees including those attached to AP. Critics inside and outside schools describe the arrangement as a monopoly held in a charitable form; the organisation has also been criticised for its exam fees and for selling student data in 2019.","cite":"College Board IRS Form 990 filings as reported by the Washington Examiner (2024); College Board corporate record","url":"https://www.washingtonexaminer.com/restoring-america/3353770/college-board-racing-protect-testing-monopoly-lobbyists-sat/","org":"collegeboard","on":"College Board","inf":"testing","who":"the College Board","tgt":"system","rel":"now","lik":"probable","inside":"One organisation decides the admissions test and the advanced courses, charges for both, and has no real competitor, which means it also decides a lot of what the hardest years of school are spent on.","int":4,"wide":2,"undone":"","why":"","i":33,"w":1.152},{"n":"Over 10,000 schools in more than 160 countries teach a curriculum set in Cambridge","c":"United Kingdom","lat":52.195,"lng":0.137,"y":2025,"bk":"curriculum","status":"filing","rank":"schools in more than 160 countries and governments in 75","d":"Cambridge International Education publishes its own reach: over 10,000 schools in more than 160 countries offer its programmes and qualifications, including state, private and international schools; it works with governments and partners in 75 countries; and it serves nearly two million students annually. Its IGCSE, first examined in 1988, is the most widely used international curriculum for 14- to 16-year-olds, offered by over 7,000 schools in 147 countries. In the June 2025 series, 5,507 Cambridge schools in 149 countries entered candidates and more than 680,000 students received results, up 9% in a year, with United States state-school entries up 15% and Chinese international and bilingual school entries up 11%.","cite":"Cambridge International Education, Facts and Figures; Cambridge press release, 12 August 2025","url":"https://www.cambridgeinternational.org/news/news-details/view/demand-for-cambridge-international-education-soars-20250812/","org":"camint","on":"Cambridge International Education","inf":"testing","who":"Cambridge International Education","tgt":"system","rel":"now","lik":"probable","inside":"A syllabus written in one English city is the working curriculum in more than ten thousand schools across most of the world, and it is spreading into state schools.","int":5,"wide":5,"undone":"","why":"","i":34,"w":1.376},{"n":"A curriculum sold from Geneva reaches 6,123 schools and expands into state systems","c":"Switzerland","lat":46.2237,"lng":6.137,"y":2025,"bk":"curriculum","status":"filing","rank":"8,844 authorised programmes in 157 countries","d":"The International Baccalaureate reported 622 new programmes authorised in 2025, taking the global total to 8,844 across 6,123 IB World Schools, with 327,438 exam candidates and a 98.3% programme retention rate. 202,103 students received Diploma and Career-related Programme results from the May 2025 session, across 157 countries where the programmes are offered. 169 of the newly authorised schools were public or state schools, with rapid expansion of public IB schools in South Korea; the first IB school in Sierra Leone was authorised; and in India the number went from 11 schools in 2003 to 245 in 2025.","cite":"International Baccalaureate 2025 Annual Impact Report; IB results release, May 2025 session; Careers360, 21 September 2025 on India","url":"https://www.ibo.org/news/news-about-the-ib/the-ib-releases-its-2025-annual-impact-report/","org":"ib","on":"International Baccalaureate (IB)","inf":"testing","who":"the International Baccalaureate","tgt":"system","rel":"now","lik":"probable","inside":"A private curriculum and exam system sold out of Geneva now runs in over six thousand schools worldwide, and governments are putting their own state schools onto it.","int":4,"wide":5,"undone":"","why":"","i":35,"w":1.152},{"n":"Canada's truth commission finds the residential schools were cultural genocide","c":"Canada","lat":45.4215,"lng":-75.6998,"y":2015,"bk":"local","status":"inquiry","rank":"more than 150,000 First Nations, Inuit and Metis children","d":"The Truth and Reconciliation Commission of Canada, created in 2008 out of the Indian Residential Schools Settlement Agreement, reported in June 2015 after hearing testimony from more than 6,000 people. More than 150,000 First Nations, Inuit and Metis children had been removed from their families into church and government-run residential schools at over 140 locations between the 1860s and 1996; the commission recorded over 6,000 student deaths and found that residential schooling was always more than an educational programme, that it was an integral part of a conscious policy of cultural genocide. It issued 94 Calls to Action, including a National Council for Reconciliation and an apology from the Pope for the Roman Catholic Church's role.","cite":"Truth and Reconciliation Commission of Canada, final report and Calls to Action, June 2015; CBC News, 2 June 2015; Anglican Journal via Episcopal News Service","url":"https://www.cbc.ca/news/indigenous/truth-and-reconciliation-commission-by-the-numbers-1.3096185","org":"canada_irs","on":"Canada's Indian residential school system","inf":"faith","who":"the Canadian government and the churches that ran the schools","tgt":"school","rel":"legacy","lik":"established","inside":"For more than a century Canada took Indigenous children from their families and put them in church-run boarding schools; its own commission concluded the purpose was to end their peoples' cultures, and recorded over six thousand children dead.","int":5,"wide":2,"undone":"","why":"","i":36,"w":1.72},{"n":"United States investigation confirms at least 973 child deaths across 417 federal Indian boarding schools","c":"United States","lat":38.894,"lng":-77.043,"y":2024,"bk":"local","status":"inquiry","rank":"American Indian, Alaska Native and Native Hawaiian children, 1819 to 1969","d":"The second and final volume of the Interior Department's Federal Indian Boarding School Initiative report, released on 30 July 2024, followed a three-year investigation that reviewed roughly 103 million pages of federal records and held listening sessions with hundreds of survivors. It updated the official list to 417 federal Indian boarding schools across 37 states or then-territories with a profile of each, identified 1,025 further institutions that advanced similar assimilation and education policy goals without meeting the investigation's four criteria, confirmed at least 973 documented child deaths between 1819 and 1969 while stating the actual number is greater, identified 74 marked or unmarked burial sites at 65 schools, and tallied the federal money spent running them, including through religious institutions. It recommended about 23 billion dollars toward healing. Interior Secretary Deb Haaland said the federal government, facilitated by the department she led, took deliberate and strategic actions to isolate children from their families, deny them their identities and steal their languages, cultures and connections.","cite":"U.S. Department of the Interior, Federal Indian Boarding School Initiative Investigative Report Vol. II, July 2024; Equal Justice Initiative; NPR, 30 July 2024; NICWA","url":"https://www.bia.gov/sites/default/files/media_document/doi_federal_indian_boarding_school_initiative_investigative_report_vii_final_508_compliant.pdf","org":"us_boarding","on":"United States federal Indian boarding school system","inf":"state","who":"the United States federal government and contracted churches","tgt":"school","rel":"legacy","lik":"established","inside":"The United States government investigated its own boarding schools for Native children and found 417 of them, nearly a thousand confirmed child deaths, and graves at 65 of the schools.","int":5,"wide":2,"undone":"","why":"","i":37,"w":1.72},{"n":"Norway's truth commission finds minority languages were forbidden in state boarding schools","c":"Norway","lat":69.472,"lng":25.51,"y":2023,"bk":"local","status":"inquiry","rank":"Sami, Kven and Norwegian Finnish children in Finnmark and northern Norway","d":"The commission the Storting established in 2018 to investigate the Norwegianisation policy delivered a 700-page report in 2023 covering Norwegian contact with the Sami and other minorities back to the fourteenth century. In state-run boarding schools minority languages were forbidden, which led to their steep decline. The report named the machinery: Bernt Thomasson, director of schools in Finnmark from 1902 to 1920, worked consistently to prevent Sami languages being used in schools and closed down Sami teacher education, and teachers sent to local schools were under an awarding system that gave more praise and funding where results in Norwegian were strong. Scholars describe the schools as the battlefields and the teachers as the frontline soldiers of the policy. The commission found that Norwegianisation did not stop, and that minority-language schooling, now a right in law, is still hard to find a school for. Norway issued a formal apology.","cite":"Sannhets- og forsoningskommisjonen, final report to the Storting (2023); CBC News, 1 June 2023; Minde (2005); Jones, Education in the North 32(1) (2025); Life in Norway on the apology","url":"https://www.cbc.ca/news/world/norway-indigenous-sami-truth-commission-final-report-1.6862471","org":"nor_trc","on":"Norway's Norwegianisation policy and its school system","inf":"state","who":"the Norwegian state","tgt":"school","rel":"legacy","lik":"established","inside":"Norway used its schools for a century to replace Sami and Kven with Norwegian, banned the children's own languages in the boarding schools, an
