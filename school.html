d rewarded the teachers who got the best Norwegian results.","int":5,"wide":2,"undone":"","why":"","i":38,"w":1.72},{"n":"Sweden's nomad schools taught Sami children in Swedish and punished them for their own language","c":"Sweden","lat":67.8558,"lng":20.2253,"y":1913,"bk":"local","status":"inquiry","rank":"children of Sami reindeer herders, taken from their families at about seven","d":"From 1913 the children of Sami reindeer herders in Sweden were taken from their families at about the age of seven and placed in state-run boarding schools. These nomad schools were founded under a policy officially described as preserving the Sami, and the education was basic and, as one account puts it paradoxically, taught in Swedish rather than in Sami; the children were punished if they spoke their mother tongue. Sweden's truth commission reported in 2023 and took testimony on the limited literacy this produced in both languages at once.","cite":"Sweden's Truth Commission for the Sami people, report (2023); AFP via France 24, 10 May 2023; Journal of Language, Identity and Education (2026)","url":"https://www.france24.com/en/live-news/20230510-sweden-s-truth-commission-delves-into-painful-sami-past","org":"swe_nomad","on":"Sweden's nomad schools for Sami children","inf":"state","who":"the Swedish state","tgt":"school","rel":"legacy","lik":"established","inside":"Sweden set up schools said to be for preserving Sami life, taught in Swedish only, and punished the children for speaking Sami.","int":5,"wide":2,"undone":"","why":"","i":39,"w":1.72},{"n":"Finland's commission finds Sami children were banned from their languages in boarding schools","c":"Finland","lat":68.917,"lng":27.029,"y":2025,"bk":"local","status":"inquiry","rank":"Sami children in Finnish state boarding schools up to the late twentieth century","d":"Finland's Sami truth and reconciliation commission finalised its report on 4 December 2025 after four years, having collected testimony from nearly 400 Sami people and dozens of experts to document discrimination and human rights violations by the Finnish state, including an assimilation policy. Up until the late twentieth century many Sami children were separated from their families and placed in boarding schools where they were banned from speaking their own languages or practising their culture and traditional livelihoods. The commission called on Finland to rectify the injustices.","cite":"Finland's Sami Truth and Reconciliation Commission report, 4 December 2025, reported by AFP via France 24","url":"https://www.france24.com/en/live-news/20251204-truth-commission-urges-finland-to-rectify-sami-injustices-1","org":"fin_trc","on":"Finland's assimilation schooling of the Sami","inf":"state","who":"the Finnish state","tgt":"school","rel":"legacy","lik":"established","inside":"Finland's own commission found the state took Sami children into boarding schools and forbade them their languages and their way of life, and said the country should put it right.","int":5,"wide":2,"undone":"","why":"","i":40,"w":1.72},{"n":"UNESCO puts the share of people with no schooling in a language they understand at 40%","c":"France","lat":48.8495,"lng":2.306,"y":2025,"bk":"local","status":"reported","rank":"more than a quarter of a billion learners worldwide","d":"UNESCO's report Languages matter: Global guidance on multilingual education, released on International Mother Language Day on 21 February 2025, states that 40% of people globally lack access to education in the language they speak and understand fluently, rising to 90% in some low- and middle-income countries, and affecting more than a quarter of a billion learners. The same figure has appeared in UNESCO's Global Education Monitoring reporting since 2016. The gap it makes is measurable: at the end of lower secondary, adolescents who speak the language of instruction are over 40% more likely to read with understanding, a gap of 4% in Canada, around 40% in Germany and the Netherlands and over 60% in Thailand. UNESCO's 2024 mapping found 31 of Africa's countries had moved to bilingual or multilingual policies, and it notes that fewer than 20% of pupils in Francophone Africa are taught in their mother tongue. Testing in Mozambique in 2016 found Portuguese, the language of the test and the classroom, was not the mother tongue of 40% of the pupils sitting it.","cite":"UNESCO, Languages matter: Global guidance on multilingual education, 21 February 2025; UNESCO GEM Report policy paper, 'If you don't understand, how can you learn?' (2016); UNESCO, Learning counts spotlight report (2024)","url":"https://www.unesco.org/en/articles/new-unesco-report-calls-multilingual-education-unlock-learning-and-inclusion","org":"unesco","on":"UNESCO","inf":"intlorg","who":"documented by UNESCO","tgt":"school","rel":"now","lik":"probable","inside":"Four in ten people on earth are taught, or were taught, in a language they do not really speak, which is the single largest way local knowledge is lost at school.","int":5,"wide":5,"undone":"","why":"","i":41,"w":1.376},{"n":"Turkey secures the closure or takeover of Gulen-linked schools in more than 50 countries","c":"Turkiye","lat":39.9087,"lng":32.7621,"y":2026,"bk":"ownership","status":"acknowledged","rank":"at least 164 schools, colleges and residences across 29 countries","d":"Speaking at the tenth anniversary of the Turkish Maarif Foundation in Ankara, President Erdogan said Turkey had secured the complete or partial closure of schools linked to the Gulen movement in more than 50 countries and vowed to continue. A July 2026 report by the human rights group Solidarity with Others documented what that covers: across 29 countries at least 164 educational institutions were closed, confiscated or transferred, affecting roughly 7,952 teachers and administrative staff, of which 131 were handed to the Maarif Foundation and 31 closed or seized without transfer. State broadcaster TRT had reported 232 schools in 21 countries transferred by 2024, and the foundation's chairman Birol Akgun had said 216 schools in 44 countries. Inside Turkey, Solidarity with Others counts 3,492 institutions linked to the movement closed, including about 1,350 schools. Not all the transfers abroad were paperwork: in Herat in 2017 Afghan security forces entered a school and handed it to the Turkish state foundation.","cite":"Erdogan remarks at the Maarif Foundation's tenth anniversary, Ankara, November 2026, reported by Stockholm Center for Freedom; Solidarity with Others, Turkish Maarif Foundation and the Global Attack on Gulen Schools (July 2026); TRT Haber via Turkish Minute, 16 July 2024","url":"https://solidaritywithothers.com/at-the-maarif-foundations-tenth-anniversary-erdogan-said-turkey-secured-the-closure-of-gulen-schools-in-over-50-countries/","org":"maarif","on":"Turkish Maarif Foundation","inf":"state","who":"the Turkish state and the Maarif Foundation","tgt":"school","rel":"now","lik":"established","inside":"Turkey persuaded more than fifty other governments to close or hand over schools it says belong to a movement it calls terrorist, and about eight thousand teachers and staff lost their jobs.","int":5,"wide":4,"undone":"","why":"","i":42,"w":1.72},{"n":"A university teachers' association finds Confucius Institutes let a state pick staff and curriculum","c":"Canada","lat":43.6532,"lng":-79.3832,"y":2013,"bk":"curriculum","status":"reported","rank":"Chinese language and culture teaching inside host universities","d":"The Canadian Association of University Teachers' objection was specific rather than general: North American universities hosting Confucius Institutes permit a state agenda in the recruitment and control of academic staff, in the choice of curriculum, and in the restriction of debate. Later reporting documented host universities being urged to avoid statements or events on politically sensitive topics, and Chinese teachers at the institutes signing contracts pledging not to damage their country's national interests. Institute defenders answered that each institute's curriculum is built and evaluated by its American host university. Nearly all 118 institutes in the United States have since closed under federal pressure, and Chinese-language teaching shrank with them, which left the objection standing and the language provision gone.","cite":"Canadian Association of University Teachers statement, as reported by Inside Higher Ed, 9 January 2019; U.S. Senate office statements, 2020","url":"https://www.insidehighered.com/news/2019/01/09/colleges-move-close-chinese-government-funded-confucius-institutes-amid-increasing","org":"ci_hq","on":"Confucius Institute programme","inf":"state","who":"Chinese state-linked bodies","tgt":"uni","rel":"legacy","lik":"probable","inside":"Teachers' own professional body said universities had let a foreign government help choose who taught, what was taught, and what could be discussed.","int":4,"wide":3,"undone":"","why":"","i":43,"w":1.152},{"n":"The World Economic Forum's founder says the leadership programme penetrated cabinets","c":"Switzerland","lat":46.2256,"lng":6.166,"y":2017,"bk":"ministry","status":"acknowledged","rank":"serving heads of government, ministers and central bank governors","d":"The Forum of Young Global Leaders began in 1992 as Global Leaders for Tomorrow and was renamed in 2003. Members are nominated under forty and go through what the Forum calls a curated leadership journey, with academic modules at partner institutions. The Forum's own press releases name serving heads of government among its members, including prime ministers of New Zealand and Finland and, in the 2025 class, the prime ministers of Thailand and Montenegro alongside serving ministers of India, Chile and Namibia and a First Nations council chairperson in Canada. Klaus Schwab said in 2017 that the programme's alumni had let the Forum penetrate the cabinets of countries including France and Argentina. The claim about mechanism is the Forum's own.","cite":"World Economic Forum press releases, Young Global Leaders classes of 2021, 2022 and 2025; Klaus Schwab remarks (2017) as widely reported","url":"https://www.weforum.org/press/2025/04/from-grammy-award-winning-artist-to-unicorn-founders-meet-the-young-global-leaders-class-of-2025/","org":"ygl","on":"Forum of Young Global Leaders","inf":"elite","who":"the World Economic Forum","tgt":"system","rel":"now","lik":"probable","inside":"A private forum runs a leadership course for people under forty, and its founder said openly that its graduates had got the Forum inside national cabinets.","int":4,"wide":5,"undone":"","why":"","i":44,"w":1.152},{"n":"About 90% of United States schools use programmes from one publisher","c":"United States","lat":42.3509,"lng":-71.041,"y":2023,"bk":"materials","status":"reported","rank":"core, intervention and supplemental reading and curriculum programmes","d":"Industry analysis by Simba Information reported that about 90% of United States K-12 schools use Houghton Mifflin Harcourt core, intervention and supplemental programmes for their students. McGraw Hill was reported at a 22% market share as of 2021. The numbers come from market research sold to the industry, which is worth knowing when reading them, but they are the industry's own picture of its concentration.","cite":"Freedonia Group summary of Simba Information, PreK Reading 2023; Independent Women's Forum summary of market shares","url":"https://www.freedoniagroup.com/blog/top-6-prek-reading-instructional-material-providers","org":"hmh","on":"Houghton Mifflin Harcourt (HMH)","inf":"publisher","who":"Houghton Mifflin Harcourt","tgt":"school","rel":"now","lik":"probable","inside":"Roughly nine in ten American schools use material from one publisher somewhere in their reading or curriculum programmes.","int":4,"wide":2,"undone":"","why":"","i":45,"w":1.152},{"n":"Pearson's fund takes stakes across low-fee chains in six countries","c":"United Kingdom","lat":51.5073,"lng":-0.0869,"y":2012,"bk":"ownership","status":"filing","rank":"low-fee private school chains and edtech in Asia and Africa","d":"Pearson launched the Affordable Learning Fund in July 2012 with 15 million dollars, announcing Omega Schools in Ghana as its first investment; a further 50 million was reported on top of an initial 12 million over the following three years. The portfolio came to include Bridge International Academies, eAdvance and its Spark Schools blended-learning chain in South Africa, Omega's 38 schools in Ghana, Zaya, which was contracted to operate 27 schools, and the APEC joint venture with the Ayala Group in the Philippines. Pearson's own published answer is that it is a minority investor, does not supply products or services to the schools it invests in, and does not want to privatise public education.","cite":"EdWeek Market Brief, July 2012; Pearson, The Pearson Affordable Learning Fund: Myths + Facts (March 2016); Singer, Pearson and the Neo-Liberal Global Assault on Public Education (Education International)","url":"https://marketbrief.edweek.org/strategy-operations/pearson-to-invest-15-million-in-international-private-schools/2012/07","org":"palf","on":"Pearson Affordable Learning Fund","inf":"investor","who":"Pearson plc","tgt":"school","rel":"now","lik":"established","inside":"The world's largest education company set up a fund to buy into chains of fee-charging schools for poor families across Africa and Asia.","int":4,"wide":4,"undone":"","why":"","i":46,"w":1.44},{"n":"Spark Schools fees came to about 62% of a lowest-wage worker's income","c":"South Africa","lat":-26.2041,"lng":28.0473,"y":2015,"bk":"money","status":"reported","rank":"families paying fees at a blended-learning chain in South Africa","d":"A comparison of the published fees and costs at the school chains in Pearson's Affordable Learning Fund portfolio against wages in March 2015 found that fees came to about 62% of the income of one adult earning the lowest official wage in South Africa for SPARK Schools. The researcher's point was that nowhere does the fund state what cut-off makes a school affordable.","cite":"Srivastava, response to The Economist, Oxfam From Poverty to Power (2015)","url":"https://oxfamblogs.org/fp2p/its-complicated-or-low-fee-private-schooling-what-do-we-really-know/","org":"palf","on":"Pearson Affordable Learning Fund","inf":"chain","who":"SPARK Schools and the Pearson fund","tgt":"school","rel":"now","lik":"probable","inside":"At one chain in the portfolio the fees came to nearly two thirds of what one adult on the lowest legal wage earned, and it was still being described as affordable.","int":4,"wide":2,"undone":"","why":"","i":47,"w":1.152},{"n":"An Indian state planned to outsource schooling to a foreign chain at 4,000 schools","c":"India","lat":15.9129,"lng":79.74,"y":2016,"bk":"ownership","status":"alleged","rank":"government schooling in Andhra Pradesh","d":"Education International reported that the government of Andhra Pradesh was in the process of outsourcing education to Bridge International Academies, which planned to operate 4,000 low-fee private schools in the state. The source is a teachers' federation, and the claim is recorded here at that standing.","cite":"Singer, Pearson and the Neo-Liberal Global Assault on Public Education, Education International","url":"https://www.ei-ie.org/file/356","org":"newglobe","on":"NewGlobe Schools / Bridge International Academies","inf":"chain","who":"Bridge International Academies","tgt":"school","rel":"legacy","lik":"possible","inside":"A state government was reported to be preparing to hand four thousand schools' worth of teaching to a foreign company.","int":4,"wide":2,"undone":"","why":"Reported by a teachers' federation opposed to the company; no government document is cited for the figure.","i":48,"w":0.648},{"n":"Fewer than 20% of pupils in Francophone Africa are taught in their mother tongue","c":"Senegal","lat":14.7167,"lng":-17.4677,"y":2024,"bk":"local","status":"reported","rank":"primary pupils across Francophone Africa","d":"UNESCO records that fewer than 20% of pupils in Francophone Africa are taught in their mother tongue, and warns that up to 10% of African languages may vanish within a century, with nearly 428 considered threatened in Africa alone. European colonial regimes imposed language policies favouring their own languages and by the middle of the twentieth century most colonial administrations required proficiency in the colonial language; at independence newly independent states often kept it as the official one. UNESCO's own 1953 report had recommended mother-tongue instruction.","cite":"UNESCO statements on endangered African languages and Francophone Africa; UNESCO report on the use of vernacular languages in education (1953); Albaugh, Language Policies in African Education","url":"https://en.wikipedia.org/wiki/Extinction_of_African_languages_due_to_colonialism","org":"unesco","on":"UNESCO","inf":"state","who":"colonial and post-colonial language policy","tgt":"school","rel":"legacy","lik":"probable","inside":"In the French-speaking countries of Africa more than four in five children are taught in a language they did not grow up speaking, which is how the languages they did grow up speaking are dying.","int":5,"wide":3,"undone":"","why":"","i":49,"w":1.376},{"n":"Thirty-one of Africa's countries have moved to bilingual or multilingual school policies","c":"Ethiopia","lat":9.0192,"lng":38.7525,"y":2024,"bk":"local","status":"adopted","rank":"national language-of-instruction policy","d":"UNESCO's 2024 Learning counts spotlight report mapped Africa's language of instruction policies and found that over half of countries, 31 of them, have shifted to bilingual or multilingual education. It is the clearest countervailing movement on this part of the map: the direction of policy is changing even where the practice has not caught up.","cite":"UNESCO, Learning counts spotlight report (2024), cited in UNESCO's multilingual education release, 21 February 2025","url":"https://www.unesco.org/en/articles/new-unesco-report-calls-multilingual-education-unlock-learning-and-inclusion","org":"unesco","on":"UNESCO","inf":"intlorg","who":"documented by UNESCO","tgt":"system","rel":"now","lik":"probable","inside":"More than half of African countries have now written bilingual or multilingual schooling into policy, which is the opposite of the colonial pattern.","int":2,"wide":3,"undone":"","why":"","i":50,"w":0.704},{"n":"Rwanda changes the language its schools teach in, from French to English","c":"Rwanda","lat":-1.9441,"lng":30.0619,"y":2008,"bk":"local","status":"adopted","rank":"the national language of instruction","d":"Rwanda's government changed the language of instruction from French to English in 2008. It is a reminder that language of instruction is a lever governments pull for reasons of alignment and trade as well as learning, and that the children in school at the time carry the switch. Donors and agencies have since pushed in the other direction, toward mother-tongue instruction, with the World Bank's World Development Report on learning stating that children learn to read most effectively in the language they speak at home.","cite":"Devex, 'Rwanda's education U-turn sparks debate on mother tongue instruction'; World Bank World Development Report on learning","url":"https://www.devex.com/news/rwanda-s-education-u-turn-sparks-debate-on-mother-tongue-instruction-96129","org":"","on":"","inf":"state","who":"Rwanda's government","tgt":"school","rel":"legacy","lik":"probable","inside":"A country switched the language its schools taught in from one European language to another, and the pupils in school at the time had to change with it.","int":3,"wide":2,"undone":"","why":"","i":51,"w":0.928},{"n":"South African pupils' performance drops at the switch from mother tongue to English","c":"South Africa","lat":-25.7479,"lng":28.2293,"y":2016,"bk":"local","status":"reported","rank":"Sepedi-speaking pupils at Grade 5","d":"UNICEF's review of language policy in Eastern and Southern Africa traced the performance of Sepedi-speaking Grade 5 children at the point where they transitioned from their mother tongue to English. For English-speaking children the same policy allows their mother tongue throughout their education, which is the asymmetry the review set out.","cite":"UNICEF, The impact of language policy and practice on children's learning: Evidence from Eastern and Southern Africa (2016)","url":"https://www.unicef.org/esa/sites/unicef.org.esa/files/2018-09/UNICEF-2016-Language-and-Learning-FullReport.pdf","org":"unesco","on":"UNESCO","inf":"state","who":"national language-of-instruction policy","tgt":"school","rel":"now","lik":"probable","inside":"Children who speak English at home get to learn in their own language all the way through school; children who speak Sepedi have to switch, and their results drop when they do.","int":4,"wide":2,"undone":"","why":"","i":52,"w":1.152},{"n":"Academics' open letter says PISA narrows education to the measurable","c":"France","lat":48.8699,"lng":2.2708,"y":2014,"bk":"ministry","status":"reported","rank":"the design and use of the PISA survey","d":"A widely publicised open letter from academics argued that PISA shifts attention to short-term fixes designed to help a country climb the rankings quickly, despite research showing that enduring changes in education practice take decades; that it takes attention away from the less measurable or immeasurable objectives of education, including physical, moral, civic and artistic development, dangerously narrowing the collective view of what school is for; and that it is biased in favour of the economic role of public schools. Over 80% of the countries examined in one review reported some degree of influence from PISA, though one author cautioned that its role may have been more to legitimise reforms already intended than to generate them.","cite":"Open letter on PISA (2014), discussed in 'The OECD and Educational Policy Reform' (ERIC EJ1165322); Raidt (2009)","url":"https://files.eric.ed.gov/fulltext/EJ1165322.pdf","org":"oecd_pisa","on":"OECD and PISA","inf":"intlorg","who":"the OECD","tgt":"system","rel":"now","lik":"probable","inside":"Academics wrote publicly that the test pushes countries toward quick fixes to climb a league table and squeezes out everything school does that cannot be scored.","int":4,"wide":5,"undone":"","why":"","i":53,"w":1.152},{"n":"The same people hold roles across several of the global education bodies at once","c":"United Kingdom","lat":51.501,"lng":-0.1246,"y":2023,"bk":"ministry","status":"inquiry","rank":"the post-2015 global education initiatives","d":"The Transnational Institute's researchers found individuals holding roles across several of these bodies at the same time, among them Lawrence Summers, Jim Kim, Michael Barber, Helle Thorning-Schmidt and Ronald Cohen, with Gordon Brown connected to the Global Education Forum, Education Cannot Wait, the Education Commission and the Education Outcomes Fund. Michael Barber, named here, had also chaired Pearson's Affordable Learning Fund and served as its chief education adviser. Their conclusion was that the multiple post-2015 global education initiatives can act as Trojan horses within multi-stakeholder arrangements, and that donor-established multi-stakeholder bodies can displace intergovernmental leadership.","cite":"da Silva, Croso and Mode Magalhaes, Multistakeholderism in Global Education Governance, Transnational Institute (2023), Conclusions 2 and 6; EdWeek Market Brief, July 2012 on Barber's role at the Pearson fund","url":"https://www.tni.org/files/2023-09/%20Multistakeholderism%20in%20global%20education%20governance%20TNI.pdf","org":"gef","on":"Global Education Forum","inf":"intlorg","who":"the post-2015 global education initiatives","tgt":"system","rel":"now","lik":"probable","inside":"A small group of people sit on several of the bodies that set global education policy at the same time, and some of them also work for the companies selling into it.","int":5,"wide":5,"undone":"","why":"","i":54,"w":1.376},{"n":"The Education Outcomes Fund ties money for schooling to measurable results","c":"United States","lat":40.7498,"lng":-73.969,"y":2018,"bk":"money","status":"inquiry","rank":"providers paid by results, hosted by UNICEF","d":"The Education Outcomes Fund was launched in 2018, hosted by UNICEF, with Amel Karboul as chief executive. Civil-society networks opposed it for tying funding to measurable results, which decides in advance which parts of an education are worth paying for.","cite":"da Silva, Croso and Mode Magalhaes, Multistakeholderism in Global Education Governance, Transnational Institute (2023)","url":"https://www.tni.org/en/publication/multistakeholderism-in-global-education-governance","org":"eof","on":"Education Outcomes Fund","inf":"intlorg","who":"the Education Outcomes Fund","tgt":"system","rel":"now","lik":"probable","inside":"The fund pays schools for results it can measure, which means whatever it cannot measure stops being worth teaching.","int":3,"wide":4,"undone":"","why":"","i":55,"w":0.928},{"n":"For-profit colleges enrol about a tenth of students and account for over a third of loan defaults","c":"United States","lat":38.8899,"lng":-77.015,"y":2024,"bk":"money","status":"reported","rank":"federal student loan borrowers at for-profit colleges","d":"For-profit colleges enrol roughly 10% of United States college students but account for over a third of all student loan defaults. Across Corinthian Colleges and ITT Tech alone the federal government has discharged more than 9.8 billion dollars in loans for defrauded students. The high-profile collapses created a narrative that the industry had been defeated, which the figures do not support.","cite":"Summary of federal discharge totals and default shares, Boomers Broke America (2025); U.S. Department of Education announcements, 2021 and 2022","url":"https://boomersbrokeamerica.com/for-profit-college-predatory-lending/","org":"","on":"","inf":"chain","who":"the for-profit college sector","tgt":"uni","rel":"now","lik":"probable","inside":"One in ten American college students goes to a for-profit college, and more than a third of everyone who defaults on a student loan went to one.","int":4,"wide":2,"undone":"","why":"","i":56,"w":1.152},{"n":"States, not publishers, began producing the curriculum in some United States subjects","c":"United States","lat":38.9072,"lng":-77.0369,"y":2025,"bk":"materials","status":"reported","rank":"state-developed curriculum against the three-publisher market","d":"New America's study of the curriculum marketplace, having set out that three publishers held nearly 90% of the PreK-12 market by 2010 and that the apparent competition was largely illusory, argues that innovation in the marketplace has since come from states rather than publishers. Where the concentration has loosened, it is because public bodies started producing material themselves.","cite":"New America, 'States, Not Publishers, Driving Innovation in the Curriculum Marketplace'","url":"https://www.newamerica.org/insights/states-driving-curriculum-innovation/","org":"","on":"","inf":"publisher","who":"state education agencies","tgt":"system","rel":"now","lik":"probable","inside":"Where the grip of the three big publishers has loosened in America, it is because states started writing their own material instead of buying it.","int":2,"wide":2,"undone":"","why":"","i":57,"w":0.704},{"n":"146 of 164 school learning products were found watching the children using them","c":"United States","lat":40.7484,"lng":-73.9857,"y":2022,"bk":"platforms","status":"inquiry","rank":"children in 49 countries, in products their own governments told them to use","d":"Human Rights Watch took apart 164 learning products that governments endorsed or handed out during the school closures of 2020 and 2021, and found that 146 of them, eighty-nine in every hundred, were watching the children using them. The products sent data to nearly 200 advertising technology companies. Some fingerprinted the device so a child could be recognised again elsewhere; some could reach the camera, the microphone, the contact list or the exact location. Of the 42 governments that built their own learning product rather than buying one, 39 handled children's data in ways that risked or broke their rights. Only one government in the study, Morocco, endorsed nothing that did this.<br><br>A child could not refuse. The product was the lesson, the lesson was compulsory, and no one asked the child or the parents. Several companies replied that their products were not meant for children, which is a strange answer about software a ministry of education sent to schools.","cite":"Human Rights Watch, 'How Dare They Peep into My Private Life?': Children's Rights Violations by Governments that Endorsed Online Learning during the Covid-19 Pandemic, 25 May 2022","url":"https://www.hrw.org/report/2022/05/25/how-dare-they-peep-my-private-life/childrens-rights-violations-governments","org":"","on":"","inf":"platform","who":"164 edtech products endorsed by 49 governments","tgt":"school","rel":"now","lik":"established","inside":"This is the clearest answer on the map to the question of what school does with you. Children in forty-nine countries were required to use software that was tracking them for advertisers, and the requirement came from their own education ministries.","int":5,"wide":5,"undone":"","why":"","i":58,"w":1.72},{"n":"Seven in ten ten-year-olds in low and middle income countries cannot read a simple story","c":"United States","lat":38.8993,"lng":-77.0425,"y":2022,"bk":"curriculum","status":"inquiry","rank":"children at the end of primary school across most of the world","d":"The World Bank, UNESCO, UNICEF, USAID, the British aid department and the Gates Foundation published a joint estimate that 70% of ten-year-olds in low and middle income countries cannot read and understand a simple written text. In South Asia the figure is 78%. The rate was already around 57% before the school closures of 2020, so most of this is not the pandemic; the pandemic made an existing failure worse by about a third.<br><br>Nearly all of those children are enrolled. They go to school, they sit in the room, they are counted in the attendance figures that governments and the funds on this map report as progress. The thing school is for has not happened.","cite":"World Bank, UNESCO, UNICEF, FCDO, USAID and the Bill & Melinda Gates Foundation, 'The State of Global Learning Poverty: 2022 Update', 23 June 2022","url":"https://www.worldbank.org/en/topic/education/publication/state-of-global-learning-poverty","org":"worldbank_edu","on":"World Bank","inf":"intlorg","who":"World Bank, UNESCO, UNICEF and donor governments","tgt":"system","rel":"now","lik":"established","inside":"The bodies that set the global education agenda are also the ones reporting that it is not working. Enrolment is the number they are measured on, and enrolment is the number that went up.","int":5,"wide":5,"undone":"","why":"","i":59,"w":1.72},{"n":"Forty-four million teachers are missing and more than half of the gap is people leaving","c":"France","lat":48.8499,"lng":2.3058,"y":2024,"bk":"ministry","status":"inquiry","rank":"classrooms worldwide, and the 272 million children not in one","d":"UNESCO's global report on teachers puts the shortfall at nearly 44 million primary and secondary teachers needed by 2030, out of a current world teaching force of about 100 million. Sub-Saharan Africa alone needs 15 million of them. Fifty-eight per cent of the gap is not growth; it is replacing teachers who leave. The rate at which primary teachers quit nearly doubled between 2015 and 2022. Alongside this, 272 million children and young people are not in school at all.<br><br>Every other body on this map sells into the classroom: the book, the test, the laptop, the platform, the degree. The person standing in front of the children is the part that is running out, and that is the part nobody is selling.","cite":"UNESCO and the International Task Force on Teachers for Education 2030, Global Report on Teachers, 2024; UNESCO World Summit on Teachers concept note, 2025","url":"https://www.unesco.org/en/articles/global-report-teachers-what-you-need-know","org":"unesco","on":"UNESCO","inf":"intlorg","who":"UNESCO and the Teacher Task Force","tgt":"system","rel":"now","lik":"established","inside":"Money that could pay teachers goes instead to the products in this map's other records. The shortage is the shape of that choice.","int":4,"wide":5,"undone":"","why":"","i":60,"w":1.44},{"n":"350 million children are taught by someone other than the state","c":"France","lat":48.8499,"lng":2.3058,"y":2021,"bk":"ownership","status":"inquiry","rank":"pre-primary, primary, secondary and tertiary enrolment worldwide","d":"UNESCO's global education monitoring report counted 350 million children and students worldwide educated by non-state actors: 40% of all pre-primary pupils, 20% of primary pupils and 30% of secondary and tertiary students. The share of private primary institutions worldwide went from 10% in 2002 to 17% in 2013. In Central and Southern Asia private enrolment now runs at 36% of primary and 48% of secondary.<br><br>The report also found what the enrolment figures hide: in 29 of 96 countries with data, private actors were running schools the state still owned, and governments were financially supporting non-state schools in 171 of 204 countries. So the line between a public school and a private one is not where the sign on the gate puts it, and a family choosing a government school may not be choosing a government operator.","cite":"UNESCO, Global Education Monitoring Report 2021/2, 'Non-state actors in education: Who chooses? Who loses?', December 2021","url":"https://gem-report-2021.unesco.org/non-state-actors-in-education/","org":"unesco","on":"UNESCO","inf":"intlorg","who":"UNESCO Global Education Monitoring Report","tgt":"system","rel":"now","lik":"established","inside":"Wherever a reader of this map goes to school, there is roughly a one in four chance someone other than their government is running it, and a good chance their government is paying that someone.","int":4,"wide":5,"undone":"","why":"","i":61,"w":1.44},{"n":"A Karachi company sold degrees to 200,000 people in 197 countries","c":"Pakistan","lat":24.8607,"lng":67.0011,"y":2015,"bk":"credential","status":"inquiry","rank":"buyers of fake degrees in nearly every country on earth","d":"The New York Times found in May 2015 that a Karachi software company, Axact, was running several hundred websites dressed as American and British universities and high schools, with invented faculty, invented accreditation bodies and stock-photo students. It sold degrees, transcripts and doctorates to more than 200,000 people in 197 countries between 2009 and 2015. Pakistan's investigators raided the offices and recovered thousands of blank degrees and fake student identity cards, along with forged letterhead of the United States State Department. The founder was jailed.<br><br>Among the buyers were nurses, engineers and hospital consultants. Call-centre staff then telephoned their own customers pretending to be government officials and charged them again to have the fake documents legalised. A degree turned out to be a document that can be manufactured, which tells you what the real ones are being bought for.","cite":"The New York Times, 'Fake Diplomas, Real Cash: Pakistani Company Axact Reaps Millions', 17 May 2015; Pakistan Federal Investigation Agency case; BBC Radio 4 and CBC Marketplace investigations","url":"https://www.nytimes.com/2015/05/18/world/asia/fake-diplomas-real-cash-pakistani-company-axact-reaps-millions-columbiana.html","org":"axact","on":"Axact","inf":"mill","who":"Axact and several hundred fictitious universities","tgt":"uni","rel":"legacy","lik":"established","inside":"If a qualification can be printed to order and sold into 197 countries without anyone noticing for six years, then what the real qualification certifies is mostly that you paid.","int":5,"wide":5,"undone":"","why":"","i":62,"w":1.72},{"n":"For-profit colleges take a tenth of American students and produce about half the loan defaults","c":"United States","lat":38.8977,"lng":-77.0365,"y":2024,"bk":"credential","status":"reported","rank":"students who borrowed to attend a college owned by shareholders","d":"For-profit colleges account for roughly a tenth of United States enrolment, a fifth to a quarter of all federal student borrowing, and about half of all loan defaults. Students who attend them default within twelve years at four times the rate of students at public colleges. The Government Accountability Office found 135 for-profit colleges alone behind 54% of defaults. Researchers who compared like with like found the gap is not explained by the students being poorer: for-profit enrolment itself leads to more borrowing, larger loans and a higher chance of default.<br><br>Two of the biggest, Corinthian Colleges and ITT Technical Institute, collapsed, and the government eventually cancelled billions of dollars their former students owed. The pattern is not a scandal at one college. It is what the business model produces when the lender is the state, the product is a credential, and the buyer is eighteen.","cite":"Chicago Booth Review and Journal of Financial Economics, 'Student debt and default: The role of for-profit colleges'; United States Government Accountability Office; Institute for College Access and Success, 'Driving Down Default'","url":"https://www.chicagobooth.edu/review/whos-fault-student-loan-defaults","org":"","on":"","inf":"forprofit","who":"the United States for-profit college sector","tgt":"uni","rel":"now","lik":"established","inside":"This is the clearest price anywhere on the map. One tenth of the students, one half of the ruined credit.","int":5,"wide":3,"undone":"","why":"","i":63,"w":1.72},{"n":"Three quarters of Brazilian higher education is privately owned, and two companies hold much of it","c":"Brazil","lat":-23.5505,"lng":-46.6333,"y":2025,"bk":"credential","status":"reported","rank":"higher education in a country of 200 million people","d":"Private institutions hold 75% of all higher-education enrolment in Brazil. Two listed companies, Cogna and YDUQS, together served over three million students in 2025, and have twice opened talks on a merger that would put roughly a third of the private market under one owner. Cogna's schools arm separately supplies content and systems to thousands of private primary and secondary schools, reaching over 1.5 million younger children.<br><br>This is the fullest working example of the funnel this map describes. One company can supply the textbook a Brazilian child learns from at seven, the system their school runs on at fourteen, and the degree they borrow for at nineteen.","cite":"Brazil higher education market analysis, 2025; Cogna Educação and YDUQS quarterly results; scielo.br, 'A expansão privatista da Educação Superior no nordeste brasileiro (2010-2022)'","url":"https://www.scielo.br/j/ensaio/a/FPF9fHPzpGbd7Fgb94cTYpc/?lang=pt","org":"cogna","on":"Cogna Educação","inf":"forprofit","who":"Cogna and YDUQS","tgt":"uni","rel":"now","lik":"established","inside":"One country shows what the whole arrangement looks like when it is finished: school and university owned by the same handful of listed companies, from first grade to graduation.","int":4,"wide":3,"undone":"","why":"","i":64,"w":1.44},{"n":"Europe's largest college group is 200 schools assembled by investment funds","c":"France","lat":48.8566,"lng":2.3522,"y":2020,"bk":"ownership","status":"reported","rank":"about 300,000 students across roughly 20 countries","d":"Galileo Global Education holds more than 200 private colleges, art schools, fashion schools, business schools and medical schools, with around 300,000 students in about 20 countries, and is the largest for-profit higher-education group in Europe. It was not founded as a university. It was assembled: investment funds bought established schools one by one and put them under a single owner, and in 2020 the American fund Providence Equity sold its majority stake at a reported 2.3 billion euro valuation.<br><br>The names above the doors are old and local. The ownership is recent and financial, and it changes hands without the students being party to the sale.","cite":"Galileo Global Education company record; Providence Equity stake sale, 13 February 2020","url":"https://en.wikipedia.org/wiki/Galileo_Global_Education","org":"galileo","on":"Galileo Global Education","inf":"forprofit","who":"Galileo Global Education and its investors","tgt":"uni","rel":"now","lik":"established","inside":"A school can be bought and sold like a warehouse, and the students inside are told nothing, because they are not the customer in that transaction.","int":3,"wide":3,"undone":"","why":"","i":65,"w":1.16},{"n":"A for-profit college group paid $100 million over what it claimed its graduates earned, then grew","c":"United States","lat":41.8781,"lng":-87.6298,"y":2016,"bk":"credential","status":"settled","rank":"students recruited on published job and salary figures","d":"DeVry Education Group paid 100 million dollars to settle a Federal Trade Commission case over advertising that misrepresented how many of its graduates found jobs in their field and what they earned. It renamed itself Adtalem Global Education the following year. Enrolment across its universities now runs at about 97,000 students, and through Walden and Chamberlain it has become the largest provider of nursing degrees in the United States.<br><br>The settlement did not shrink the company and the renaming removed the name that carried the finding. A student comparing colleges today will not meet the word DeVry.","cite":"Federal Trade Commission settlement with DeVry Education Group, 2016; Adtalem Global Education enrolment reporting","url":"https://www.ftc.gov/news-events/news/press-releases/2016/12/devry-university-agrees-100-million-settlement-ftc","org":"adtalem","on":"Adtalem Global Education","inf":"forprofit","who":"DeVry Education Group, now Adtalem","tgt":"uni","rel":"now","lik":"established","inside":"Renaming is cheaper than changing, and it works, because the record stays attached to the old name and the customers are new every year.","int":3,"wide":2,"undone":"","why":"","i":66,"w":1.16},{"n":"Five companies publish more than half of the world's research, and sell it back to the universities that wrote it","c":"Netherlands","lat":52.3676,"lng":4.9041,"y":2015,"bk":"credential","status":"inquiry","rank":"access to published research worldwide","d":"A study of every article in the Web of Science from 1973 to 2013 found that five publishers, Reed-Elsevier, Springer, Wiley-Blackwell, Taylor & Francis and Sage, published more than half of all papers by 2013, up from about a fifth in 1973. In the social sciences their share reaches 70%. Elsevier alone accounted for about a quarter of papers in the natural and medical sciences. Elsevier's profit margin has run near 37% for years.<br><br>The work is written by academics who are not paid for it, reviewed by other academics who are not paid for it, largely funded by public research money, signed over to the publisher, and then sold back to university libraries at prices that have put some single journals above forty thousand dollars a year. A student looking up the research their own country paid for will often find a paywall, and the money behind that wall is not going to the people who did the work.","cite":"Larivière, Haustein and Mongeon, 'The Oligopoly of Academic Publishers in the Digital Era', PLOS ONE, 10 June 2015; Science, 2019","url":"https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0127502","org":"elsevier","on":"Elsevier (RELX)","inf":"publisher","who":"Elsevier, Springer Nature, Wiley, Taylor & Francis and Sage","tgt":"uni","rel":"now","lik":"established","inside":"School ends at a paywall. Everything a student is taught to go and find out for themselves sits behind a subscription their library may not hold, owned by five companies that did not write any of it.","int":5,"wide":5,"undone":"","why":"","i":67,"w":1.72},{"n":"Nobody knows how many schools there are, and about half of them have no internet","c":"Switzerland","lat":46.2224,"lng":6.1399,"y":2025,"bk":"platforms","status":"reported","rank":"every school on earth, and the children in the ones not on any map","d":"Giga, run jointly by UNICEF and the International Telecommunication Union, has mapped about 2.3 million schools in roughly 140 countries, using data from some fifty governments, OpenStreetMap and its own satellite-imagery model. It states plainly that nobody knows the true total, and that the working estimate is six to seven million. Where it has checked against official records the gaps are large: Senegal's own partners estimate a fifth of school locations are missing from the national dataset, and in Kenya only about 7,000 of an estimated 33,000 schools had correct coordinates. Around half the world's schools have no internet connection, and 1.3 billion children have none at home.<br><br>Every other record on this map is about something being sold into schools. This one is about the schools themselves: a ministry can buy a national platform, a testing contract and a curriculum licence while not knowing where half its own schools are. The map of what reaches children is further along than the map of where the children are.","cite":"Giga (UNICEF and ITU), Giga Maps and Project Connect; UNICEF digital inclusion reporting; 'Large-scale School Mapping using Weakly Supervised Deep Learning', arXiv, 2024","url":"https://giga.global/what-we-do/how-we-work/mapping/","org":"giga","on":"Giga (UNICEF and ITU)","inf":"intlorg","who":"Giga, UNICEF and the ITU","tgt":"system","rel":"now","lik":"established","inside":"The live map of 2.3 million individual schools is published openly by Giga and is worth opening alongside this one: it shows where the children are, and this one shows who is reaching them.","int":4,"wide":5,"undone":"","why":"","i":68,"w":1.44}],"entities":[{"s":"publisher","k":"pearson","n":"Pearson plc","c":"United Kingdom","lat":51.5073,"lng":-0.0869,"y":1844,"ended":null,"status":"active","role":"80 Strand, London","d":"Pearson is the largest education company in the world by reach, selling courseware, English-language teaching, qualifications and testing in most countries. It reported revenue of 3.6 billion pounds in 2025 with about 17,000 staff. Its history on this map is a history of moving: it sold the Financial Times and its stake in The Economist between 2015 and 2020, sold its entire United States K-12 courseware business to the private equity firm Nexus Capital Management in February 2019 for 250 million dollars, and has concentrated since on assessment, qualifications and virtual learning. In June 2025 it agreed to put its PRoPL assessment inside McGraw Hill's core K-12 curriculum, starting in California, so its main products now are the exam and the qualification rather than the book.","cite":"Pearson plc corporate profile and 2025 results; Pearson press release, 4 June 2025","url":"https://plc.pearson.com/en-GB/news-and-insights/news/new-collaboration-pearson-assessment-capabilities-be-integrated-mcgraw-hill","inf":"publisher","wide":5,"int":5,"rel":"now","reach_list":["Brazil","China","Ghana","India","Kenya","Nigeria","Philippines","South Africa","United Kingdom","United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":10,"ne":0,"active":true},{"s":"publisher","k":"mcgraw","n":"McGraw Hill, Inc.","c":"United States","lat":39.9612,"lng":-82.9988,"y":1888,"ended":null,"status":"active","role":"Columbus, Ohio","d":"McGraw Hill tells its own investors that it is a top-two provider in the United States K-12 market, serving about 91% of public K-12 districts. It has been passed between owners: Apollo Global Management bought the education business out of the listed McGraw-Hill company in 2012, sold it to Platinum Equity for 4.713 billion dollars in July 2021, and Platinum floated it on the New York Stock Exchange in 2025 at a 3.25 billion dollar valuation while keeping about 86.5% of the voting power. The prospectus put its addressable market at roughly 30 billion dollars, of which 9.3 billion is K-12. In June 2025 it began putting Pearson's assessments inside its own curriculum, so a school now buys the programme and the test from the same two companies.","cite":"McGraw Hill, Inc. Form 10-K FY2026 and Form S-1 (2025), U.S. Securities and Exchange Commission","url":"https://www.sec.gov/Archives/edgar/data/0001951070/000195107026000022/mh-20260331.htm","inf":"publisher","wide":4,"int":5,"rel":"now","reach_list":["Canada","India","Mexico","United Kingdom","United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":5,"ne":0,"active":true},{"s":"publisher","k":"hmh","n":"Houghton Mifflin Harcourt (HMH)","c":"United States","lat":42.3509,"lng":-71.041,"y":1832,"ended":null,"status":"active","role":"Boston, Massachusetts","d":"HMH is the third of the three publishers that between them held nearly 90% of the United States PreK-12 market by 2010. In 2022 the private equity firm Veritas Capital took it private; HMH's own announcement said it supported four million teachers and fifty million students a day. A year later it bought NWEA, the non-profit behind the MAP Growth test used by about ten thousand school districts, and ran it as a division. The Department of Justice looked at the purchase and closed its inquiry without a second request. The deal put the programme a child is taught from and the test of whether the child learned it under one owner.","cite":"HMH Form 8-K, 22 February 2022 (SEC); Boston Globe, 11 January 2023; Compass Lexecon case note on the DOJ review","url":"https://www.sec.gov/Archives/edgar/data/1580156/000119312522047535/d304266dex991.htm","inf":"publisher","wide":3,"int":5,"rel":"now","reach_list":["Canada","United Kingdom","United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":3,"ne":0,"active":true},{"s":"publisher","k":"savvas","n":"Savvas Learning Company","c":"United States","lat":40.9445,"lng":-74.0754,"y":2019,"ended":null,"status":"active","role":"Paramus, New Jersey","d":"Savvas is what Pearson's United States K-12 courseware business became after the private equity firm Nexus Capital Management bought it in February 2019 for 250 million dollars. It carries the old Prentice Hall and Scott Foresman lists, and with them the district contracts that came attached. The material that millions of American children are taught from changed owner in a private transaction, and the schools using it were not party to it.","cite":"Pearson plc disclosure of the sale, February 2019; Savvas Learning Company corporate record","url":"https://en.wikipedia.org/wiki/Savvas_Learning_Company","inf":"publisher","wide":2,"int":4,"rel":"now","reach_list":["United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"publisher","k":"cengage","n":"Cengage Group","c":"United States","lat":42.3486,"lng":-71.0405,"y":2007,"ended":null,"status":"active","role":"Boston, Massachusetts","d":"Cengage was assembled out of Thomson Learning when Apax Partners and OMERS, the Ontario municipal pension fund, bought it for 7.75 billion dollars in 2007. It went through Chapter 11 bankruptcy and emerged still owned by funds. A merger with McGraw Hill announced in May 2019 would have consolidated two of the three largest higher-education courseware firms; it was abandoned. Pearson told its own investors at the time that the proposed merger would combine its two largest competitors in United States higher education courseware.","cite":"Cengage Group corporate history; Pearson plc Form 6-K FY2020 (SEC) on the proposed Cengage-McGraw Hill merger","url":"https://www.sec.gov/Archives/edgar/data/938323/000165495420002758/a4785g.htm","inf":"publisher","wide":3,"int":4,"rel":"now","reach_list":["Australia","Canada","United Kingdom","United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":4,"ne":0,"active":true},{"s":"publisher","k":"ncert","n":"National Council of Educational Research and Training (NCERT)","c":"India","lat":28.6333,"lng":77.2167,"y":1961,"ended":null,"status":"active","role":"Sri Aurobindo Marg, New Delhi","d":"NCERT writes India's national syllabus and the textbooks most of the country's school boards use, which makes a change to its books a change to what hundreds of millions of children read. In 2022 and 2023, under what it called rationalisation to reduce pupils' workload, it removed the Class 12 chapter 'Kings and Chronicles: The Mughal Courts', pages on the Delhi Sultanate rulers from the Class 7 history book, passages on Hindu extremists' attempts on Gandhi's life and the ban on the RSS after his assassination, the section on the 2002 Gujarat riots, chapters on federalism and diversity, and moved Darwin's theory of evolution to a later grade. Authors asked for their names to be taken off the books. Uttar Pradesh adopted the revised editions in its state schools from 2023-24, and Kerala's education minister wrote to the central government asking for a review.","cite":"Al Jazeera, 14 April 2023; CBC News, 2023; Press Trust of India, 3 and 27 April 2023; American Historical Association, Perspectives on History, January 2024","url":"https://www.aljazeera.com/news/2023/4/14/mughals-rss-evolution-outrage-as-india-edits-school-textbooks","inf":"state","wide":2,"int":4,"rel":"now","reach_list":["India"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"publisher","k":"kello","n":"Konyvtarellato (KELLO)","c":"Hungary","lat":47.4979,"lng":19.0402,"y":1950,"ended":null,"status":"active","role":"Budapest","d":"KELLO is the state library supplier that Hungary made the sole distributor of school textbooks after the government centralised school management in 2011 and 2012. Three private distributors took the state to the European Court of Human Rights, which ruled in 2017 that the measures had imposed an unfair burden on companies deprived of their clientele and had led effectively to a monopolised market in school book distribution. The distributors said KELLO was given a 20% margin against their own 3 to 5%.","cite":"European Court of Human Rights judgment in Konyv-Tar Kft and Others v. Hungary, reported 2017; Budapest Business Journal","url":"https://bbj.hu/politics/polls/issues/hungary-monopolized-school-textbook-distribution-echr-rules/","inf":"state","wide":2,"int":4,"rel":"legacy","reach_list":["Hungary"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"publisher","k":"prosv","n":"Prosveshcheniye and the Russian state history textbook","c":"Russia","lat":55.7749,"lng":37.6324,"y":1930,"ended":null,"status":"active","role":"Moscow","d":"In August 2023 Russia's education ministry unveiled a single state history textbook for the final years of school, co-authored by Vladimir Medinsky, an aide to the president and a former culture minister. The chapters from the 1970s onward were rewritten and a new section added on the invasion of Ukraine, which the book calls a special military operation and presents as forced on Russia by a West trying to dismember it. Medinsky said the book presents the state's point of view. The education minister said it would go into all schools; Amnesty International called it official propaganda. A three-volume Military History of Russia edited by Medinsky followed.","cite":"BBC News, 10 August 2023; Meduza, 7 August 2023; Reuters; RFE/RL, 1 September 2023","url":"https://meduza.io/en/feature/2023/08/07/such-unique-times-are-rare-in-history","inf":"state","wide":2,"int":5,"rel":"now","reach_list":["Russia"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"testing","k":"collegeboard","n":"College Board","c":"United States","lat":38.9586,"lng":-77.357,"y":1899,"ended":null,"status":"active","role":"Reston, Virginia","d":"The College Board is a non-profit that both sets and scores the SAT and runs the Advanced Placement programme, and so decides a large part of what an American secondary school teaches in its hardest courses and what counts as readiness for a university. Its revenue passed a billion dollars; in 2023 its own tax filings showed more than a billion in revenue of which about 4 million came from contributions and some 955 million from programme fees. Critics inside and outside schools describe the position as a monopoly held under a charitable form. It has also been criticised for selling student data.","cite":"College Board IRS Form 990 filings as reported by the Washington Examiner, 2024; College Board corporate record","url":"https://www.washingtonexaminer.com/restoring-america/3353770/college-board-racing-protect-testing-monopoly-lobbyists-sat/","inf":"testing","wide":3,"int":4,"rel":"now","reach_list":["United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"testing","k":"ets","n":"Educational Testing Service (ETS)","c":"United States","lat":40.331,"lng":-74.65,"y":1947,"ended":null,"status":"active","role":"Princeton, New Jersey","d":"ETS builds and administers tests for other people's names, including for years the SAT itself, and runs the TOEFL English test that decides whether a student from outside the English-speaking world can enter a university inside it. A single organisation's judgement about what English competence is therefore operates as a gate on migration for study across most of the world.","cite":"Educational Testing Service corporate record; College Board entry on test construction and administration","url":"https://en.wikipedia.org/wiki/Educational_Testing_Service","inf":"testing","wide":5,"int":3,"rel":"now","reach_list":[],"rsrc":"","nr":0,"ne":0,"active":true},{"s":"testing","k":"camint","n":"Cambridge International Education","c":"United Kingdom","lat":52.195,"lng":0.137,"y":1864,"ended":null,"status":"active","role":"Shaftesbury Road, Cambridge","d":"Cambridge International is the largest provider of international school programmes and qualifications for three- to nineteen-year-olds. Its own figures: over 10,000 schools in more than 160 countries offer its programmes, it works with governments and partners in 75 countries, and it serves nearly two million students a year. Its IGCSE, first examined in 1988, is offered by over 7,000 schools in 147 countries. In June 2025 it released results to more than 680,000 students, up 9% in a year, with 5,507 schools in 149 countries entering candidates. A curriculum written in one English university city is therefore the working syllabus in a large share of the world's fee-paying and bilingual schools, and increasingly in state schools too: its United States state-school entries rose 15% in a year.","cite":"Cambridge International Education, Facts and Figures; Cambridge press release, 12 August 2025","url":"https://www.cambridgeinternational.org/about-us/facts-and-figures/","inf":"testing","wide":5,"int":5,"rel":"now","reach_list":["China","Egypt","India","Kenya","Malaysia","Nigeria","Pakistan","United Arab Emirates","United Kingdom","United States"],"rsrc":"Cambridge International's own published count of schools and countries.","nr":10,"ne":0,"active":true},{"s":"testing","k":"ib","n":"International Baccalaureate (IB)","c":"Switzerland","lat":46.2237,"lng":6.137,"y":1968,"ended":null,"status":"active","role":"Route des Morillons, Geneva","d":"The IB sells a complete curriculum and examination system that schools adopt in place of, or alongside, their national one. Its 2025 figures: 8,844 authorised programmes in 6,123 IB World Schools, 327,438 exam candidates, and 202,103 students receiving Diploma and Career-related Programme results from the May 2025 session across 157 countries. Growth is now partly inside state systems: 169 newly authorised schools in 2025 were public or state schools, and public IB schools are expanding quickly in South Korea. In India it went from 11 schools in 2003 to 245 in 2025.","cite":"International Baccalaureate 2025 Annual Impact Report; IB results release, May 2025 session","url":"https://www.ibo.org/news/news-about-the-ib/the-ib-releases-its-2025-annual-impact-report/","inf":"testing","wide":5,"int":4,"rel":"now","reach_list":["Australia","Canada","China","Germany","India","Japan","Korea, Rep.","Switzerland","United Kingdom","United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":10,"ne":0,"active":true},{"s":"testing","k":"nwea","n":"NWEA and the MAP Growth test","c":"United States","lat":45.5152,"lng":-122.6784,"y":1977,"ended":null,"status":"active","role":"Portland, Oregon","d":"NWEA was a non-profit whose MAP Growth test served about ten thousand school districts and 1,300 staff. In 2023 Houghton Mifflin Harcourt, by then owned by Veritas Capital, bought virtually all of its assets; the brand and the tests became HMH property and the sale proceeds funded a separate foundation run by NWEA's former board. The tests are now aligned to the curriculum of the company that owns them.","cite":"THE Journal, 10 January 2023; Boston Globe, 11 January 2023; National Education Policy Center commentary","url":"https://thejournal.com/articles/2023/01/10/nwea-assets-to-be-acquired-by-houghton-mifflin-harcourt.aspx","inf":"publisher","wide":2,"int":4,"rel":"now","reach_list":["United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"platform","k":"google_edu","n":"Google for Education","c":"United States","lat":37.422,"lng":-122.0841,"y":2006,"ended":null,"status":"active","role":"Mountain View, California","d":"Google reaches school through three things at once: the device, the account and the classroom software. Chromebooks held about 60% of the world's K-12 device market in 2025 and, on one tracker's figures, 72% of mobile computing devices in United States public K-12 classrooms; Google reports more than 50 million active students and teachers on ChromeOS devices. Google, Apple and Microsoft together hold over 97% of the K-12 operating-system market. A school that adopts the accounts gets the files, the mail, the assignments and the identity system in one place, which is also what makes leaving expensive.","cite":"Mordor Intelligence and Futuresource Consulting K-12 device figures, 2025; Google for Education disclosures; Dataintelo K-12 operating system market report","url":"https://www.aboutchromebooks.com/education-sector-chromebook-adoption-statistics/","inf":"platform","wide":5,"int":5,"rel":"now","reach_list":["Australia","Brazil","Canada","Denmark","India","Japan","Netherlands","Sweden","United Kingdom","United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":10,"ne":0,"active":true},{"s":"platform","k":"microsoft_edu","n":"Microsoft Education","c":"United States","lat":47.64,"lng":-122.1296,"y":1997,"ended":null,"status":"active","role":"Redmond, Washington","d":"Microsoft supplies the other main school stack: Windows devices, Microsoft 365 accounts and Teams. With Google and Apple it is part of the three-company hold on more than 97% of the K-12 operating-system market. European data regulators have repeatedly examined whether schools and public bodies can lawfully use its cloud products given what is recorded about users, which is a question about who holds the record of a child's school day.","cite":"Dataintelo K-12 mobile computing operating system market report, 2025","url":"https://dataintelo.com/report/k-12-mobile-computing-shipments-operating-system-market","inf":"platform","wide":5,"int":4,"rel":"now","reach_list":[],"rsrc":"","nr":0,"ne":0,"active":true},{"s":"platform","k":"apple_edu","n":"Apple Education","c":"United States","lat":37.3349,"lng":-122.009,"y":1978,"ended":null,"status":"active","role":"Cupertino, California","d":"Apple's iPad is the smaller of the three school platforms by volume, at roughly 13% of United States school device deployments but about half of school-issued tablets, and its share of United States education fell from 32% to 24% as Chromebooks rose. Its place on this map is the same mechanism in a different brand: a device, an account and an app store that a school's work then lives inside.","cite":"Futuresource Consulting and Mordor Intelligence education device share figures; USA Today reporting on the Chromebook switch","url":"https://www.aboutchromebooks.com/chromebook-vs-ipad-adoption-in-schools-statistics/","inf":"platform","wide":4,"int":3,"rel":"now","reach_list":[],"rsrc":"","nr":0,"ne":0,"active":true},{"s":"platform","k":"byjus","n":"Byju's (Think and Learn)","c":"India","lat":12.9352,"lng":77.6245,"y":2011,"ended":2024,"status":"insolvent","role":"Bengaluru","d":"Byju's was the most valuable education technology company in the world, worth 22 billion dollars in 2022, with 150 million registered users and 58,000 staff. By October 2024 its founder said the company was worth nothing. Prosus wrote its 9.6% stake to zero and disclosed a fair-value loss of 493 million dollars; BlackRock wrote its stake to zero; Prosus, Peak XV and the Chan Zuckerberg Initiative had already left the board. Insolvency proceedings began after it failed to pay about 19 million dollars owed to India's cricket board. It is here because a national tutoring system was built on investor money and stopped when the money left.","cite":"Byju's corporate record and insolvency filings; CNBC, 1 March 2024; Business Standard, 18 October 2024; TechCrunch, 16 July 2024","url":"https://www.cnbc.com/2024/03/01/the-rise-and-fall-of-byjus-once-a-startup-darling-in-india.html","inf":"platform","wide":3,"int":4,"rel":"legacy","reach_list":["India"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":false},{"s":"investor","k":"veritas","n":"Veritas Capital","c":"United States","lat":40.759,"lng":-73.9712,"y":1992,"ended":null,"status":"active","role":"New York","d":"Veritas Capital bought Houghton Mifflin Harcourt in 2022 and, through it, bought the non-profit testing body NWEA the following year. The firm's chief executive Ramzi Musallam said at the time of the HMH purchase that education and technology had both become central to its investing. A firm whose other holdings are defence and government technology now owns one of the three companies that supply American classrooms.","cite":"HMH Form 8-K, February 2022 and completion announcement, 2022 (SEC)","url":"https://www.sec.gov/Archives/edgar/data/1580156/000119312522098302/d512024dex991.htm","inf":"investor","wide":2,"int":4,"rel":"now","reach_list":["United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"investor","k":"platinum","n":"Platinum Equity","c":"United States","lat":33.985,"lng":-118.4695,"y":1995,"ended":null,"status":"active","role":"Beverly Hills, California","d":"Platinum Equity, founded by Tom Gores, bought McGraw-Hill Education from Apollo Global Management for 4.713 billion dollars in July 2021 and floated it in 2025 while keeping about 86.5% of the voting power. Control of the company that supplies about 91% of United States public school districts did not change at the flotation. Only its shareholders did.","cite":"McGraw Hill, Inc. Form S-1 and Form 10-Q (SEC, 2025); Reuters on the IPO pricing, 2025","url":"https://www.sec.gov/Archives/edgar/data/1951070/000162828025033247/mcgrawhillinc-sx1.htm","inf":"investor","wide":2,"int":4,"rel":"now","reach_list":["United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"investor","k":"apollo_gm","n":"Apollo Global Management","c":"United States","lat":40.7624,"lng":-73.9738,"y":1990,"ended":null,"status":"active","role":"New York","d":"Apollo took McGraw-Hill's education business private in 2012 and sold it on in 2021. With the Vistria Group it also bought Apollo Education Group, the parent of the University of Phoenix, for 1.1 billion dollars, completing in 2017, and still held majority voting control when the business returned to the stock market in 2025. In March 2022 Pearson rejected a 7 billion pound takeover bid from Apollo. Within a decade one firm has owned or bid for a large part of the American and British education industry.","cite":"Apollo Education Group Form 8-K, 2017 (SEC); Reuters and Bloomberg on the 2025 flotation; Pearson plc disclosure of the rejected 2022 bid","url":"https://www.sec.gov/Archives/edgar/data/0000929887/000119312517026959/d329920dex991.htm","inf":"investor","wide":3,"int":4,"rel":"now","reach_list":[],"rsrc":"","nr":0,"ne":0,"active":true},{"s":"investor","k":"nexus_cap","n":"Nexus Capital Management","c":"United States","lat":34.0601,"lng":-118.4136,"y":2013,"ended":null,"status":"active","role":"Los Angeles, California","d":"Nexus Capital Management bought Pearson's United States K-12 courseware business for 250 million dollars in February 2019 and renamed it Savvas Learning Company. A private investment firm bought the material taught in thousands of American districts for a quarter of a billion dollars.","cite":"Pearson plc disclosure, February 2019; Savvas Learning Company ownership record","url":"https://en.wikipedia.org/wiki/Savvas_Learning_Company","inf":"investor","wide":2,"int":3,"rel":"now","reach_list":["United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"investor","k":"eqt_na","n":"EQT and the Nord Anglia consortium","c":"Sweden","lat":59.3326,"lng":18.0649,"y":1994,"ended":null,"status":"active","role":"Stockholm","d":"In October 2024 a consortium led by EQT with Neuberger Berman Private Markets and the Canada Pension Plan Investment Board agreed to buy the international school operator Nord Anglia Education at an enterprise value of 14.5 billion dollars including debt; the deal closed in March 2025. EQT had taken Nord Anglia private in 2008 for around 400 million dollars with six schools, and the 2024 transaction returned 5.4 billion dollars to its investors. Corporacion Financiera Alba and Dubai Holding Investments are also in the consortium. A Canadian public pension fund and a Gulf state holding company co-own a school system teaching tens of thousands of children in 33 countries.","cite":"EQT press release, 21 October 2024; The PIE News, 24 March 2025; Reuters; Gulf News on Dubai Holding's participation","url":"https://eqtgroup.com/news/neuberger-berman-private-markets-eqt-and-cpp-investments-form-consortium-to-acquire-leading-international-schools-organization-nord-anglia-education-2024-10-21","inf":"investor","wide":4,"int":4,"rel":"now","reach_list":["United Kingdom"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"investor","k":"vistria","n":"The Vistria Group","c":"United States","lat":41.8857,"lng":-87.623,"y":2013,"ended":null,"status":"active","role":"Chicago, Illinois","d":"Vistria co-owns the University of Phoenix with Apollo Global Management. Its partner Tony Miller, who became chairman of the Apollo Education Group board after the purchase, had been deputy secretary of the United States Department of Education. The regulator and the regulated industry meet here in one career.","cite":"Apollo Education Group Form DEFA14A, 8 February 2016 and Form 8-K, 2017 (SEC)","url":"https://www.sec.gov/Archives/edgar/data/0000929887/000119312516453050/d133358dex991.htm","inf":"investor","wide":2,"int":4,"rel":"now","reach_list":[],"rsrc":"","nr":0,"ne":0,"active":true},{"s":"investor","k":"cppib","n":"Canada Pension Plan Investment Board","c":"Canada","lat":43.6476,"lng":-79.3818,"y":1997,"ended":null,"status":"active","role":"Toronto, Ontario","d":"CPP Investments manages the Canada Pension Plan's money and is a shareholder in Nord Anglia Education, remaining in the consortium that valued the chain at 14.5 billion dollars in 2024. Canadian retirement savings are invested in the fees paid by families at international schools in 33 countries.","cite":"EQT press release, 21 October 2024; Reuters, 21 October 2024","url":"https://www.marketscreener.com/quote/stock/EQT-AB-66480635/news/Sweden-s-EQT-others-to-buy-school-chain-Nord-Anglia-for-14-5-billion-48116985/","inf":"investor","wide":3,"int":3,"rel":"now","reach_list":[],"rsrc":"","nr":0,"ne":0,"active":true},{"s":"investor","k":"apax_omers","n":"Apax Partners and OMERS","c":"United Kingdom","lat":51.5074,"lng":-0.14,"y":1981,"ended":null,"status":"active","role":"London","d":"Apax Partners and OMERS, the Ontario Municipal Employees Retirement System, bought Thomson Learning for 7.75 billion dollars in 2007 and renamed it Cengage Learning. The company later went through Chapter 11. A Canadian municipal pension fund was a principal owner of one of the three large United States university courseware firms.","cite":"Cengage Group corporate history and bankruptcy record","url":"https://en.wikipedia.org/wiki/Cengage_Group","inf":"investor","wide":3,"int":3,"rel":"legacy","reach_list":[],"rsrc":"","nr":0,"ne":0,"active":true},{"s":"intl","k":"oecd_pisa","n":"OECD and PISA","c":"France","lat":48.8699,"lng":2.2708,"y":1961,"ended":null,"status":"active","role":"2 rue Andre Pascal, Paris","d":"PISA is the OECD's test of samples of 15-year-olds, run every three years, and the largest single item in its education budget. What matters is the ranking rather than the score: researchers found PISA results had influenced policy reform in most participating systems, and that assessment frameworks written in Paris are used as models for national assessments, with PISA-like competencies written into revised national standards. Until the 1990s few European countries ran national tests; by 2009 only five European systems had none. Mexico's Alliance for Educational Quality reform was built on an agreement between the government, the teachers' union and the OECD itself. An open letter from academics argued PISA pushes short-term fixes to climb the rankings and narrows education to what can be measured.","cite":"Breakspear (2012) for the OECD; Gorur, 'Seeing like PISA', European Educational Research Journal (2016); Froese-Germain, The OECD, PISA and the Impacts on Educational Policy (ERIC ED532562); Sjoberg, PISA and Global Educational Governance (2015)","url":"https://files.eric.ed.gov/fulltext/ED532562.pdf","inf":"intlorg","wide":5,"int":5,"rel":"now","reach_list":["Brazil","Chile","France","Germany","Indonesia","Italy","Japan","Korea, Rep.","Mexico","United Kingdom"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":10,"ne":0,"active":true},{"s":"intl","k":"unesco","n":"UNESCO","c":"France","lat":48.8495,"lng":2.306,"y":1945,"ended":null,"status":"active","role":"7 place de Fontenoy, Paris","d":"UNESCO is the UN body for education. It is both the best public source on what is wrong and part of the arrangement it describes. Its own reporting is the best public evidence that 40% of people worldwide have no education in a language they speak fluently, rising to 90% in some low- and middle-income countries, affecting more than a quarter of a billion learners. It is also, in the account of the Transnational Institute, one of the bodies around which the post-2015 multi-stakeholder education initiatives formed, with its director-general among the five co-chairs of the Global Education Forum.","cite":"UNESCO, Languages matter: Global guidance on multilingual education, 21 February 2025; da Silva, Croso and Mode Magalhaes, Multistakeholderism in Global Education Governance, Transnational Institute (2023)","url":"https://www.unesco.org/en/articles/new-unesco-report-calls-multilingual-education-unlock-learning-and-inclusion","inf":"intlorg","wide":5,"int":4,"rel":"now","reach_list":["Ethiopia","France","Senegal","South Africa"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":4,"ne":0,"active":true},{"s":"intl","k":"worldbank_edu","n":"World Bank education lending","c":"United States","lat":38.8993,"lng":-77.0425,"y":1944,"ended":null,"status":"active","role":"1818 H Street NW, Washington","d":"The World Bank is the largest single financier of education in poorer countries and the author of the model most of them are measured against. Under structural adjustment in the 1980s its education work moved into the human resources department, funding fell as the role of the state was reduced, and state funding was substituted by fees paid by students; until the 1990s it was actively encouraging charges for primary education, against the principle that every child has a right to schooling regardless of family wealth. Officials now call conditions 'prior actions' rather than conditionality. One ministry official seeking funds for higher education during adjustment was told the Bank was interested in primary education, because higher education benefits only those who get it.","cite":"Bretton Woods Project, 'The World Bank as a new global education ministry?' (2011) and 'Six reasons why the World Bank should be debarred from education' (2006); Collins and Rhoads, Higher Education 59 (2010)","url":"https://www.brettonwoodsproject.org/2011/01/art-567384/","inf":"intlorg","wide":5,"int":5,"rel":"now","reach_list":["United States"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"active":true},{"s":"intl","k":"ifc_edu","n":"International Finance Corporation (IFC), education portfolio","c":"United States","lat":38.9,"lng":-77.043,"y":1956,"ended":null,"status":"active","role":"2121 Pennsylvania Avenue NW, Washington","d":"The IFC is the World Bank Group's private-sector arm and the largest development finance institution investing in private education. Out of an education portfolio of almost 1.2 billion dollars, the 2021/2 Global Education Monitoring Report found 15% went to private school chains. In 2020 the IFC froze all direct and indirect investments in private fee-charging K-12 schools in response to concerns raised about them, and in March 2022 it quietly exited its stake in NewGlobe Schools, the parent of Bridge International Academies, while complaints about that investment were still open before its own ombudsman.","cite":"IFC Project Information Portal disclosure on NewGlobe Schools; Compliance Advisor Ombudsman case files; UNESCO GEM Report 2021/2 on non-state actors; Oxfam and Education International statements, 2022","url":"https://disclosures.ifc.org/project-detail/SII/32171/bridge-international-academies","inf":"intlorg","wide":4,"int":5,"rel":"now","reach_list":["Kenya"],"rsrc":"Countries counted from the records on this map and from the body's own published figures.","nr":1,"ne":0,"a
