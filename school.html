nt":"#6f6a8e","d":"Private equity houses, pension funds and sovereign investors that own the publishers, the testing firms, the platforms and the school chains."},{"k":"chain","label":"School & college chains","accent":"#4f8c80","d":"Operators running schools and colleges across borders: international school groups, low-fee chains in the global South, and for-profit universities."},{"k":"intl","label":"International bodies & education funds","accent":"#7a9a62","d":"The OECD, UNESCO, the World Bank and its private arm, and the multi-stakeholder funds and forums that set the global education agenda."},{"k":"donor","label":"Foundations & donor networks","accent":"#9a8a5e","d":"The private foundations, corporate coalitions and aid agencies whose money decides which reform happens and which does not."},{"k":"ideo","label":"Think tanks & lobby networks","accent":"#a2666f","d":"Networks that draft model legislation, supply classroom material and fight over curriculum content."},{"k":"faith","label":"Churches, missions & religious movements","accent":"#7f6f92","d":"Churches, mission societies and religious movements that run schools, including those contracted by states to run assimilation systems."},{"k":"elite","label":"Elite universities & leadership pipelines","accent":"#5f7f94","d":"The universities and leadership programmes that select and train the people who later staff ministries, central banks and boards."},{"k":"state","label":"State agencies & state foundations","accent":"#8a7a6a","d":"Ministries, national councils, inspectorates and state foundations, including those operating in other countries' school systems."},{"k":"forprofit","label":"For-profit colleges & universities","accent":"#8e6b78","d":"Companies that own universities and colleges and run them for profit: Laureate, Galileo, Cogna, Yduqs, Adtalem and the United States chains whose collapses cancelled billions in student debt."},{"k":"mill","label":"Degree mills & fake accreditation","accent":"#6d6257","d":"Operations selling degrees and accreditations with no teaching behind them, including the Karachi company that sold documents into 197 countries."}],"casebuckets":[["curriculum","What is taught: curriculum & standards","The standards, syllabus and subject content a school must follow. India's national council deleted the chapter on the Mughal courts from the Class 12 history book in 2023."],["materials","Textbooks & teaching materials","The books, workbooks and digital courseware in children's hands. Three publishers held nearly 90% of the United States PreK-12 market by 2010."],["tests","Exams, assessment & accreditation","The exam, the score and the qualification. One body sets and scores both the SAT and the Advanced Placement exams in the United States."],["local","Local & Indigenous knowledge and language","Whether a child is taught in a language they speak, and whether their people's knowledge survives school. UNESCO puts the share of people without education in a language they understand at 40%."],["ministry","Ministries, policy & global governance","Education ministries, inspectorates and the global bodies that set the agenda for them: the OECD, UNESCO, the World Bank, the multi-stakeholder funds."],["platforms","Platforms, devices & student data","The accounts, laptops and software a school runs on, and the record each pupil leaves behind. Chromebooks were about 60% of the world's K-12 school devices in 2025."],["ownership","Ownership of schools & colleges","Who owns the school or the college. A consortium bought one international school chain at a $14.5 billion valuation in 2024."],["money","Fees, debt & what endowments fund","What school costs, what it leaves people owing, and what universities do with the money they hold."],["credential","The degree, and who is sold one","Who is enrolled, what the qualification is worth when they leave, and who sells a qualification with nothing behind it. For-profit colleges are about a tenth of United States enrolment and about half of all loan defaults."]],"inf":[{"k":"publisher","label":"Textbook & curriculum publishers","d":"The companies that write, print and license what is taught: the course, the book, the workbook and now the software that carries them."},{"k":"platform","label":"Tech platforms & edtech","d":"The firms whose devices, accounts and classroom software a school runs on, and which hold the records of what each pupil did."},{"k":"investor","label":"Investors & owners","d":"Private equity houses, pension funds and holding companies that own the publishers, the testing firms, the platforms and the schools themselves."},{"k":"intlorg","label":"International bodies & funds","d":"The bodies that rank, fund, advise and lend: the OECD, UNESCO, the World Bank and its private arm, and the multi-stakeholder education funds."},{"k":"donor","label":"Foundations & donor networks","d":"Private foundations and corporate coalitions whose money decides which reform happens, which standards get written and which organisations argue for them."},{"k":"chain","label":"School & college chains","d":"Companies that run schools and colleges across borders, from fee-charging international schools to low-fee chains and for-profit universities."},{"k":"testing","label":"Testing & accreditation bodies","d":"The organisations that set the exam, score it and decide whose qualification counts, and so decide what is worth teaching."},{"k":"state","label":"Governments reaching abroad","d":"A government, ministry or state foundation shaping what is taught outside its own borders, or inside the schools of a people it governs."},{"k":"faith","label":"Churches, missions & religious movements","d":"Churches, mission societies and religious movements running schools, and the assimilation systems states contracted them to run."},{"k":"ideo","label":"Think tanks & lobby networks","d":"Networks that write model laws, supply classroom material and campaign over what may and may not be taught."},{"k":"elite","label":"Elite universities & leadership pipelines","d":"The small set of universities and leadership programmes that select the people who later run ministries, central banks and companies."},{"k":"forprofit","label":"For-profit colleges & universities","d":"Colleges and universities run to return a profit to shareholders. They are the end of the funnel: the place a school-leaver is sold a degree, usually on borrowed money."},{"k":"mill","label":"Degree mills & fake accreditation","d":"Operations that sell a degree, a diploma or an accreditation outright, with no teaching behind it, often under the name of a university that does not exist."}],"tgt":[["school","Schools and their pupils","Primary and secondary schools: what is in the books, who runs the building, what the pupils are taught and recorded doing."],["uni","Universities and colleges","Higher education: what is taught and researched, who owns the institution, and what students are left owing."],["system","The system itself","Ministries, national curriculum councils, inspectorates, exam boards and the global bodies that set their agenda."]],"rel":[["now","Happening now","Still in force, still being sold, still in court, or the arrangement is still running."],["legacy","Over, but still felt","Finished, but it left a standard, a debt, a language lost, a market shape or an institution that still runs that way."],["past","Historical","Over, with little direct effect on schooling today."]],"lik":[["established","Proven","A court ruling, an official inquiry or commission, a regulator's finding, a company's own filing, a signed contract, or an admission."],["probable","Probable","Documented by reporting or peer-reviewed research with primary material behind it, or under official investigation."],["possible","Suspected","Argued by a credible named source and not yet shown."],["contested","Disputed","Denied, overturned, or widely claimed without the evidence to carry it."]],"intl":["A single contract, book or school","One district, city or institution","A national subject, exam or standard","A whole national system","Many countries at once"],"widel":["One school or one firm","One country","Several countries or a region","A continent or a whole sector","Worldwide"],"typew":{"publisher":1.2,"platform":1.2,"investor":1.0,"intl":1.2,"chain":1.0,"testing":1.1,"donor":1.0,"ideo":0.9,"faith":1.0,"elite":0.9,"state":1.1},"gloss":{"PISA":"The Programme for International Student Assessment, a test the OECD runs every three years on samples of 15-year-olds, used to rank countries against each other.","OECD":"The Organisation for Economic Co-operation and Development, a club of mostly rich governments in Paris that publishes economic and education statistics and policy advice.","UNESCO":"The United Nations Educational, Scientific and Cultural Organization, the UN body for education and culture, based in Paris.","IFC":"The International Finance Corporation, the arm of the World Bank Group that lends to and invests in private companies rather than governments.","CAO":"The Compliance Advisor Ombudsman, the independent body that investigates complaints about projects the IFC has financed.","GPE":"The Global Partnership for Education, the largest fund for education in lower-income countries, created by the World Bank in 2002 and hosted at the Bank in Washington.","GEF":"The Global Education Forum, a body launched at the UN General Assembly in 2019 whose members are mostly rich-country governments, foundations and private bodies.","ECW":"Education Cannot Wait, a fund for education in emergencies proposed at Davos in 2015 and chaired by Gordon Brown.","IFFed":"The International Financing Facility for Education, a lending mechanism launched in 2022 to raise money for schooling in middle-income countries.","multistakeholderism":"An arrangement in which governments, companies, foundations and selected civil-society groups sit together as equals on a body that makes policy, in place of a decision taken by governments answerable to voters.","courseware":"The package a publisher sells a school or a university: the textbook, the exercises, the tests and the software that delivers them.","core curriculum":"The main instructional programme a school teaches a subject from, as opposed to extra material added alongside it.","interim assessment":"A test given during the school year, between the start and the final exam, to predict and steer performance on the final one.","adoption state":"A US state whose own board or agency approves a list of textbooks, so publishers must satisfy the state to sell to any district in it.","private equity":"Firms that buy companies with a mix of investors' money and borrowed money, run them privately for a few years, and sell them on or float them.","assets under management":"The total value of the money a fund or investment firm manages on behalf of its investors.","leveraged buyout":"A purchase of a company funded largely by debt, which the bought company itself then has to service.","IPO":"An initial public offering: the first sale of a private company's shares on a stock exchange.","low-fee private school":"A fee-charging school marketed to poor families, usually run as a chain with scripted lessons and a low per-pupil cost.","public-private partnership":"An arrangement in which a government pays a private company to run a public service, here to run state schools.","vendor lock-in":"The position a school or district is in when the cost of leaving a supplier's software, accounts and files is high enough that leaving is not realistic.","biometric data":"Measurements of the body used to identify a person, such as a face or voice model.","BIPA":"Illinois' Biometric Information Privacy Act, a state law requiring notice and written consent before a company collects face or voice data.","borrower defence":"A provision of United States federal law that cancels a student loan where the college misled the borrower.","accreditation":"Official recognition that an institution's teaching meets a standard, usually the condition for its qualifications and its access to public funds.","diploma mill":"An operation that sells degrees or certificates without the teaching or assessment they are supposed to represent.","residential school":"A boarding institution children were placed in away from their families, in Canada run by the government and churches as part of a policy the country's truth commission called cultural genocide.","Norwegianisation":"Norway's state policy, formalised in 1851, of assimilating Sami and Kven people, carried out largely through schools and boarding schools where only Norwegian was permitted.","mother tongue":"The language a person grows up speaking at home, as opposed to the language a school teaches in.","language of instruction":"The language a school actually teaches in, which in much of the world is not the language the pupils speak at home.","model bill":"A ready-drafted law written by a lobbying network and handed to legislators to introduce as their own.","Common Core":"A set of English and mathematics standards written in the United States from 2009 and taken up by most states, whose development and promotion the Gates Foundation paid for.","double reduction":"China's policy of July 2021, which cut homework and banned for-profit tutoring in school subjects, closing most of the industry.","Confucius Institute":"A Chinese government-funded language and culture centre placed inside a foreign university, with staff and teaching material supplied from China.","Maarif Foundation":"A Turkish state education foundation created in 2016 that has taken over schools abroad previously linked to the Gulen movement.","Gulen movement":"A religious and civic movement founded by the Turkish cleric Fethullah Gulen, which built a large international school network and which the Turkish government designates a terrorist organisation.","NCERT":"India's National Council of Educational Research and Training, the federal body that writes the national syllabus and textbooks.","endowment":"The invested fund a university holds, whose returns pay part of its running costs.","revolving door":"The movement of individuals between a regulator or ministry and the industry it oversees, in either direction."},"groups":[],"quarantine":[],"dupes":[],"qdup":[],"notes":[],"noted":0,"reloc":[],"cnotes":{},"recovered":[],"offpres":{},"orgnames":{"pearson":"Pearson plc","mcgraw":"McGraw Hill, Inc.","hmh":"Houghton Mifflin Harcourt (HMH)","savvas":"Savvas Learning Company","cengage":"Cengage Group","ncert":"National Council of Educational Research and Training (NCERT)","kello":"Konyvtarellato (KELLO)","prosv":"Prosveshcheniye and the Russian state history textbook","collegeboard":"College Board","ets":"Educational Testing Service (ETS)","camint":"Cambridge International Education","ib":"International Baccalaureate (IB)","nwea":"NWEA and the MAP Growth test","google_edu":"Google for Education","microsoft_edu":"Microsoft Education","apple_edu":"Apple Education","byjus":"Byju's (Think and Learn)","veritas":"Veritas Capital","platinum":"Platinum Equity","apollo_gm":"Apollo Global Management","nexus_cap":"Nexus Capital Management","eqt_na":"EQT and the Nord Anglia consortium","vistria":"The Vistria Group","cppib":"Canada Pension Plan Investment Board","apax_omers":"Apax Partners and OMERS","oecd_pisa":"OECD and PISA","unesco":"UNESCO","worldbank_edu":"World Bank education lending","ifc_edu":"International Finance Corporation (IFC), education portfolio","gpe":"Global Partnership for Education (GPE)","gef":"Global Education Forum (GEF)","ecw":"Education Cannot Wait (ECW)","edcomm":"Education Commission and IFFed","eof":"Education Outcomes Fund","newglobe":"NewGlobe Schools / Bridge International Academies","omega":"Omega Schools","apec_ph":"APEC Schools","nordanglia":"Nord Anglia Education","uophoenix":"University of Phoenix","corinthian":"Corinthian Colleges","itt":"ITT Tech or","home":"United States","agg":false,"recs":0,"nc":0,"cs":[]}],"meta":{"dcap":38.24,"rcap":21,"outcap":4,"recvcap":2,"n_orgs":63,"n_cases":69,"n_backers":23,"n_patterns":12,"built":"2026-11-24"},"srcmeta":{"attributed":63,"unattributed":6,"total":69,"fixed":{}},"coverage":{"overall":{"lo":4,"hi":9,"asof":"2026-11-24","basis":"The first figure is research completeness: how much of everything that could be documented about who controls schooling is on this map. It is low because this is a first edition. Whole subjects have had no research round yet, among them credential inflation, teachers' pay and conditions, what university endowments invest in, who is kept out by disability or migration status, and the learning built outside the system entirely. The documented record also comes overwhelmingly from countries whose courts, auditors and regulators publish, which is why the United States and Britain are heavy here and most of the world is empty."},"student":{"lo":20,"hi":35,"note":"The second figure answers a different question: of the machinery behind the school day a reader is actually sitting in, how much of it is on this map at all? It is higher than the first figure, because a small number of records cover an enormous amount of schooling: one line covers over 10,000 Cambridge schools, another the three publishers behind nearly 90% of American classrooms, and several apply wherever you are, including what is done with a child's data, what a ten-year-old can read, and who owns the school. It varies a great deal by where you are, and the regional breakdown is on the Method page. Both numbers are judgements arrived at by listing what a pupil in each region meets in a school day, the book, the exam, the device, the standards, the fees and the language, and asking which of those this map can account for. Neither is a measurement.","regions":[{"name":"United States","lo":60,"hi":75,"has":"the three publishers, the testing bodies, the devices and accounts, the standards and who paid for them, the state approval lists, the owners, and the student debt","lacks":"state-level and district decisions, charter and voucher operators one by one, teacher training"},{"name":"Canada","lo":30,"hi":45,"has":"the residential school system, devices and accounts, the International Baccalaureate, pension-fund ownership of school chains abroad","lacks":"provincial curricula and the Canadian publishers that serve them"},{"name":"Western Europe","lo":25,"hi":40,"has":"PISA and what national systems changed to match it, the devices and accounts, Cambridge and the IB in international and bilingual schools","lacks":"national publishers, national exam boards, ministries and inspectorates, almost everything a state school pupil meets daily"},{"name":"Central and Eastern Europe","lo":20,"hi":40,"has":"Hungary's state textbook monopoly and Russia's single state history book, both in full; PISA; devices","lacks":"every other national system in the region"},{"name":"Latin America","lo":25,"hi":40,"has":"Brazil's private higher education in full, PISA and the reforms built on it, World Bank lending, Cambridge and the IB in private schools","lacks":"national curricula, the large regional publishers, and the private-school sectors that teach a substantial share of pupils"},{"name":"Sub-Saharan Africa","lo":40,"hi":60,"has":"language of instruction, which shapes more of the school day here than anything else on this map; World Bank and IFC lending; the global education funds; the low-fee chains; Cambridge","lacks":"national curriculum bodies, examination councils, and the mission schools that still teach a large share of children"},{"name":"Middle East and North Africa","lo":15,"hi":30,"has":"Cambridge and the IB in private and bilingual schools, the Turkish school transfers, devices and the data taken through them","lacks":"state curricula, religious schooling, and the Gulf's own fast-growing private school markets"},{"name":"South Asia","lo":30,"hi":50,"has":"India's national curriculum council in detail, Cambridge and IB growth, the collapse of Byju's, language of instruction, World Bank and global fund lending","lacks":"state boards, the enormous low-fee private sector outside the chains, coaching and the exam economy around it"},{"name":"East Asia","lo":15,"hi":30,"has":"China's tutoring ban, the Confucius Institutes, the growth of Cambridge and the IB in the region","lacks":"the national examination systems that organise childhood across the region, and the publishers and cram schools built around them"},{"name":"Southeast Asia","lo":15,"hi":30,"has":"Pearson's low-fee school fund and the chains it backed, Cambridge, PISA, Nord Anglia","lacks":"national curricula and publishers, and the religious school systems"},{"name":"Oceania","lo":20,"hi":35,"has":"PISA, the devices and accounts and what is taken through them, Cambridge and the IB","lacks":"national curricula, state publishers, and schooling of Indigenous peoples in Australia and Aotearoa New Zealand, which belongs on this map and is not here yet"},{"name":"Central Asia and the Caucasus","lo":10,"hi":25,"has":"the Turkish school transfers and Cambridge in a few places","lacks":"essentially everything else"}]},"n":0,"registers":[],"benchmarks":[]},"hyp":{"what":"","asof":"2026-11-24","ways":{"own":"Owning the thing that teaches","write":"Writing what is taught","measure":"Deciding what counts as learning","hold":"Holding the record of the learner"},"items":[{"id":"ai_courseware","kind":"potential","way":"write","title":"Generative models writing the course material inside the big publishers","claim":"The three large courseware firms are probably generating a growing share of their instructional text, practice items and assessment questions with language models, without that being disclosed on the material a school buys.","rule":"All three are now owned or controlled by investment firms that bought them as technology businesses; McGraw Hill's prospectus describes a digital personalisation ecosystem; and the economics of writing practice items by hand are poor next to generating them.","conditions":"No jurisdiction requires a publisher to disclose machine-generated instructional content, and procurement documents do not ask.","countries":["United States","United Kingdom"],"held":34,"story":["Nothing in the record on this map shows a publisher generating curriculum with a language model and selling it undisclosed. What the record does show is the three conditions under which that would happen and nobody would find out: ownership by investment firms that bought these companies as technology assets, a stated strategy of digital personalisation at scale, and no disclosure requirement anywhere in school procurement.","The reason to watch it rather than assert it is that the same structure which makes it likely also makes it unverifiable from outside. A school district cannot tell, from the material it receives, how any of it was written.","If it is happening, the thing that changes is not quality in the abstract. It is that nobody, including the publisher, can say where a claim in a textbook came from."]},{"id":"data_resale","kind":"potential","way":"hold","title":"School platform records used to build products the school never agreed to","claim":"Records generated by children in school platform accounts are probably being used for purposes beyond the school's contract, including product development and model training, in ways the families would not recognise as part of schooling.","rule":"The Illinois settlement establishes that face and voice models were collected through a school platform without the notice and consent that state's law required; the platforms hold the record by default; and there is no routine audit of secondary use anywhere.","conditions":"Districts sign the terms the vendor offers; most jurisdictions have no equivalent of the Illinois biometric statute; and the only case that surfaced did so because of one state's unusual law.","countries":["United States","United Kingdom","Netherlands","Sweden","Canada","Australia"],"held":38,"story":["The one case on this map where school platform data use was tested in court happened because Illinois has a biometric privacy statute that most places do not. Google denied wrongdoing and paid 8.75 million dollars rather than contest it, and the facts never had to be established.","What that leaves is a reasonable inference and no way to check it. Every school running on one of the three platforms generates a continuous record of what each child did, and the only reason anyone found out about the face and voice models was an accident of state law.","This is filed as potential rather than as a case because an inference from one settlement is not evidence about the rest, however sound the reasoning feels."]},{"id":"curric_aid_tie","kind":"potential","way":"measure","title":"Curriculum conditions travelling inside education loans and grants","claim":"Conditions on what is taught, and on which assessment a country uses, are probably attached to education lending and grant agreements in forms that are not described as conditions.","rule":"World Bank officials have said on the record that they no longer talk about conditions but about prior actions; the Bank wrote the model poorer systems are measured against and hosts the largest fund paying for them to meet it; and the global funds pay by measurable outcome.","conditions":"Loan and grant documents are long, technical and rarely read against the curriculum that follows; and no body audits whether the assessment a country adopts came with the money.","countries":["Kenya","Ghana","Liberia","Nigeria","Malawi","Nepal","Bangladesh","Pakistan","Rwanda","Ethiopia"],"held":7,"story":["The documented part is that this used to happen openly. Under structural adjustment the Bank's money came with the substitution of state funding by fees paid by students, and until the 1990s it was actively encouraging charges for primary school.","What is not documented is the present-tense version: whether, now that the word conditionality has been replaced by prior actions, obligations about curriculum content and assessment choice ride along with the funding. The Education Outcomes Fund pays by measurable result, which is a curriculum decision whether or not it is written as one.","It stays in this box because showing it would require reading the loan documents against the curriculum changes that followed, country by country, and nobody on this map has done that yet."]},{"id":"chain_fees_ratchet","kind":"potential","way":"own","title":"Fee increases at school chains after an ownership change","claim":"Where an investment firm buys a school chain with debt, fees probably rise faster afterwards than they did before, because the acquired company services the borrowing.","rule":"Nord Anglia was bought at a $14.5 billion enterprise value including debt and $5.4 billion was returned to the previous fund's investors; the same structure in other sectors produces price increases; and school fees are the chain's only revenue.","conditions":"Private companies do not publish fee series, and parents at one school cannot see the chain's finances.","countries":["United Kingdom","China","United Arab Emirates","Switzerland","Thailand","Vietnam","Spain","Hungary","Qatar"],"held":11,"story":["The transaction is documented and so is the debt. What is not documented is the fee series at the schools before and after, because private school chains do not publish one and the individual schools publish only this year's.","The reason to keep watching it is that the mechanism does not require anyone to decide to raise fees for its own sake. A company bought with borrowed money has to service the borrowing out of its revenue, and in a school the revenue is the fee a family pays.","Anyone with fee schedules for the same schools across the 2008 and 2024 ownership changes could move this out of this box in an afternoon."]}]}};

    const x = rnd() * Wd, y = rnd() * H, r = .8 + rnd() * .9, t = tints[(rnd() * 4) | 0];
    for (const dx of [0, -Wd, Wd]) for (const dy of [0, -H, H]) { const gr = g.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, r * 4); gr.addColorStop(0, "rgba(" + t + ",.35)"); gr.addColorStop(1, "rgba(" + t + ",0)"); g.fillStyle = gr; g.fillRect(x + dx - r * 4, y + dy - r * 4, r * 8, r * 8); }
    dot(x, y, r, .9, t);
  }
  const el = $("#map");
  el.style.background = '#03040a url(' + c.toDataURL("image/jpeg", .9) + ') repeat';
  el.style.backgroundSize = Wd + "px " + H + "px";
  const drift = () => { const ct = map.getCenter(), z = map.getZoom(); el.style.backgroundPosition = Math.round(-ct.lng * 3) + "px " + Math.round(ct.lat * 3 + z * 6) + "px"; };
  map.on("move", drift); drift();
}

const info = $("#info");
info.innerHTML = "<h2>What the map shows</h2>\n\n<p>Anywhere a body outside a school system reaches inside it: textbook and curriculum publishers, testing and accreditation houses, platform and edtech companies, the investment firms and pension funds that own them, school and college chains, international bodies and education funds, private foundations and donor networks, model-law networks, churches and mission societies, elite leadership programmes, for-profit colleges and the degree mills that sell the qualification outright, and state agencies operating in other countries' schools or against a people inside their own. It also follows the opposite move: states that removed a private education market rather than regulating it.</p>\n\n<p>A record is one episode, not a trend. Something happened, somewhere, on a date, and a source you can open says so.</p>\n\n<h2>What gets in, and what does not</h2>\n\n<p>Every record rests on at least one of: a court or regulator ruling; an official inquiry or truth commission; a company's own filing to a securities regulator; a signed contract; an organisation's own published figures; a peer-reviewed study; or reporting with primary material behind it. Where the only source is a party to the dispute, the record says so and is marked as reported rather than proven. Where a company has answered, the answer is in the record: Pearson's published reply about its school investment fund, ALEC's chairman rejecting the idea that legislators are pressured, Google's denial of wrongdoing in the Illinois case, and the edtech companies that told Human Rights Watch their products were never meant for children.</p>\n\n<p>Every entry has to pass two questions before it goes on, and both have to be yes.</p>\n\n<p><b>Does it reach a student wherever they are?</b> Not whether it happened in an interesting country, but whether the thing it describes is part of how school works for people who will never go near the place it happened. Three publishers holding nearly 90% of a national market passes, because those three sell into most of the world. A development bank's policy on financing fee-charging schools passes. A particular school board approving a particular video does not.</p>\n\n<p><b>Does it cross a line that matters to them?</b> A transaction is not an injury. A company changing hands is only on this map when something follows from it for the people inside. Software that tracks a child because their ministry told them to use it crosses a line. A college that takes a tenth of the students and produces half the ruined credit crosses a line. School used to take a language off a people crosses a line. Two firms merging, on its own, does not.</p>\n\n<p>That is a diagnostic standard rather than a journalistic one: the question is what is structurally wrong with the industry, not what happened this week. This edition removed roughly forty entries that failed it, mostly single acquisitions, single legislatures and single news stories, and replaced them with findings that hold at world scale.</p>\n\n<h2>The two coverage figures</h2>\n\n<p>The key shows two percentages and both are judgements, not counts.</p>\n\n<p><b>Research so far</b> is how much of everything that could be documented about who controls schooling has been found and put here. It is low because this is an early edition, and because most of what the map describes happens by commercial contract, and a contract between a publisher and an education ministry is not a public document in any country.</p>\n\n<p><b>Of the school day you are actually in</b> answers a different question: of the machinery behind the school day a reader is sitting in right now, how much is on this map at all? It is higher, because a few records cover an enormous amount of schooling. One line covers more than 10,000 Cambridge schools in over 160 countries. One covers the three publishers behind nearly 90% of American classrooms. One covers 417 boarding schools.</p>\n\n<p>The method for both is the same: list what a pupil in a region meets in a normal school day, the book, the exam, the device and account, the standards, the fees and the language of instruction, and ask how much of that this map can account for. The regional figures are below.</p>\n\n<table class=\"cov\">\n<tr><th>Where you are at school</th><th>Share this map can account for</th></tr>\n<tr><td><b>United States</b><div class=\"mute\">Has: the three publishers, the testing bodies, the devices and accounts, the standards and who paid for them, the state approval lists, the owners, and the student debt. Lacks: state-level and district decisions, charter and voucher operators one by one, teacher training.</div></td><td>60\u201375%</td></tr>\n<tr><td><b>Canada</b><div class=\"mute\">Has: the residential school system, devices and accounts, the International Baccalaureate, pension-fund ownership of school chains abroad. Lacks: provincial curricula and the Canadian publishers that serve them.</div></td><td>30\u201345%</td></tr>\n<tr><td><b>Western Europe</b><div class=\"mute\">Has: PISA and what national systems changed to match it, the devices and accounts, Cambridge and the IB in international and bilingual schools. Lacks: national publishers, national exam boards, ministries and inspectorates, almost everything a state school pupil meets daily.</div></td><td>25\u201340%</td></tr>\n<tr><td><b>Central and Eastern Europe</b><div class=\"mute\">Has: Hungary&#x27;s state textbook monopoly and Russia&#x27;s single state history book, both in full; PISA; devices. Lacks: every other national system in the region.</div></td><td>20\u201340%</td></tr>\n<tr><td><b>Latin America</b><div class=\"mute\">Has: Brazil&#x27;s private higher education in full, PISA and the reforms built on it, World Bank lending, Cambridge and the IB in private schools. Lacks: national curricula, the large regional publishers, and the private-school sectors that teach a substantial share of pupils.</div></td><td>25\u201340%</td></tr>\n<tr><td><b>Sub-Saharan Africa</b><div class=\"mute\">Has: language of instruction, which shapes more of the school day here than anything else on this map; World Bank and IFC lending; the global education funds; the low-fee chains; Cambridge. Lacks: national curriculum bodies, examination councils, and the mission schools that still teach a large share of children.</div></td><td>40\u201360%</td></tr>\n<tr><td><b>Middle East and North Africa</b><div class=\"mute\">Has: Cambridge and the IB in private and bilingual schools, the Turkish school transfers, devices and the data taken through them. Lacks: state curricula, religious schooling, and the Gulf&#x27;s own fast-growing private school markets.</div></td><td>15\u201330%</td></tr>\n<tr><td><b>South Asia</b><div class=\"mute\">Has: India&#x27;s national curriculum council in detail, Cambridge and IB growth, the collapse of Byju&#x27;s, language of instruction, World Bank and global fund lending. Lacks: state boards, the enormous low-fee private sector outside the chains, coaching and the exam economy around it.</div></td><td>30\u201350%</td></tr>\n<tr><td><b>East Asia</b><div class=\"mute\">Has: China&#x27;s tutoring ban, the Confucius Institutes, the growth of Cambridge and the IB in the region. Lacks: the national examination systems that organise childhood across the region, and the publishers and cram schools built around them.</div></td><td>15\u201330%</td></tr>\n<tr><td><b>Southeast Asia</b><div class=\"mute\">Has: Pearson&#x27;s low-fee school fund and the chains it backed, Cambridge, PISA, Nord Anglia. Lacks: national curricula and publishers, and the religious school systems.</div></td><td>15\u201330%</td></tr>\n<tr><td><b>Oceania</b><div class=\"mute\">Has: PISA, the devices and accounts and what is taken through them, Cambridge and the IB. Lacks: national curricula, state publishers, and schooling of Indigenous peoples in Australia and Aotearoa New Zealand, which belongs on this map and is not here yet.</div></td><td>20\u201335%</td></tr>\n<tr><td><b>Central Asia and the Caucasus</b><div class=\"mute\">Has: the Turkish school transfers and Cambridge in a few places. Lacks: essentially everything else.</div></td><td>10\u201325%</td></tr>\n</table>\n\n<h2>What is missing</h2>\n\n<p>Subjects with no records here yet: credential inflation and what a degree is now required for; teachers' pay and conditions, and their replacement by software; what university endowments are invested in; ecosystem conditioning and brand loyalty from an early age; who is kept out, by disability, migration status, gender, caste or fees; and the learning being built outside all of it.</p>\n\n<p>The degree mills are the thinnest layer here. One operation is mapped, the Karachi company that sold documents into 197 countries, because it is the only one investigated to the point where its scale is known. There is no world register of the rest; the published lists that exist, such as the unaccredited-institution lists kept by Oregon and Michigan, are national, are compiled from complaints, and give addresses that are mostly mail drops. Mapping those addresses would show where a post box is, not where a harm happened, so they are named here instead of plotted.</p>\n\n<p>Geographically the gaps are larger. Nothing yet from most of Latin America, the Middle East, Central and Southeast Asia or the Pacific, and the African records are concentrated in the handful of countries where the low-fee chains and the language research happen to have been documented. Those are gaps in the research. Nothing here should be read as suggesting those places are unaffected.</p>\n\n<h2>Numbers that stand for many</h2>\n\n<p>A single record often covers a very large number of underlying events, because that is how the source counted them. One covers 417 federal Indian boarding schools and at least 973 confirmed child deaths. One covers more than 150,000 children in Canadian residential schools. One covers over 10,000 Cambridge schools. One covers 232 schools transferred between two governments. One covers 5.8 billion dollars written off for 560,000 people. The number of records is not a measure of scale.</p>\n\n<h2>Possible patterns</h2>\n\n<p>The dashed entries under <b>Potential</b> in the patterns box are not records and are not evidence. Each describes something that is probably happening, sets out what makes it likely and what keeps it from being seen, and names where it would be most likely. None of it counts toward any figure here. They are written down as inferences, where someone can go and check them, rather than asserted or left out.</p>\n\n<h2>Figures, sources and dates</h2>\n\n<p>Money is given as the source gives it, without conversion. Market-share figures in this industry mostly come from research sold to the industry, among them Mordor Intelligence, Futuresource Consulting, Canalys and Simba Information, which do not publish their methods in full and do not always agree; where they are used they are named and the disagreement noted. Company figures come from filings to the United States Securities and Exchange Commission wherever one exists, and where a company's own documents give different numbers in different filings, as McGraw Hill's do on the share of districts it serves, both are reported. Where no figure can be had honestly, none is given: Giga's per-country school counts, for instance, sit behind an API key and are not reproduced here.</p>\n\n<h2>Giga, and why the 2.3 million schools are not drawn here</h2>\n\n<p>Giga is the joint UNICEF and International Telecommunication Union project to map every school on earth with its internet connection recorded. It has about 2.3 million schools in roughly 140 countries, from some fifty governments, OpenStreetMap and its own satellite-imagery model, and it publishes them openly at giga.global.</p>\n\n<p>Those 2.3 million points are not drawn on this map, for two reasons. The file you are reading is a single self-contained page of under a megabyte so it can be embedded anywhere, and a point cloud that size is roughly a hundred times that on its own. And the two maps answer different questions: Giga's shows where the children are, this one shows who is reaching them. Giga is on here as a body, with a record setting out what it has found, including the part worth sitting with, which is that nobody knows how many schools exist and the working estimate is six to seven million. Open its live map alongside this one.</p>\n\n<h2>Reading the map</h2>\n\n<p>Countries are not shaded. Any shading this map could honestly offer would have measured how much has been written down rather than how much is happening, so there is none; the colour only appears when you open a pattern, and then it shows the part each country plays in it. Where several markers sit at the same address, because the records really did happen at the same headquarters, they are fanned out around it by a fixed number of screen pixels so they never cover each other, and the fan closes to a few metres as you zoom in. No stored coordinate is ever changed.</p>\n\n<p>The five basemaps are ported from the Culprits map and each carries its own palette, so the markers are coloured from the tones of the ground beneath them. The globe and the flat map are the same data in two projections.</p>\n\n<h2>Corrections</h2>\n\n<p>If a record here is wrong, or a company's reply is missing, or a figure has been superseded, it should be corrected rather than defended. Every card carries its citation and, where one exists, a link, so any single claim can be checked without taking this map's word for it.</p>\n\n<p class=\"mute\">Built 24 November 2026, second edition. Part of Welcome to Your Galaxy.</p>\n";

story.innerHTML = "<h2>About this map</h2>\n\n<p class=\"big\">Almost everyone on earth goes to school, for about twelve years, starting at an age when you believe what you are told. This map is about who decides what happens in that room.</p>\n\n<p>Not the teacher. The teacher is usually last in the line and has the least say. This map follows the step before: who wrote the book, who set the test the book was written for, who owns the company that owns the publisher, who supplied the laptop and keeps the record of what you did on it, who owns the school building, who lent your government the money for it, and which organisation in Paris or Washington or Geneva your education ministry was answering to when it rewrote the curriculum.</p>\n\n<h3>What you are looking at</h3>\n\n<p>Each diamond is one documented episode. A publisher buying the charity that makes the test. A development bank putting money into a chain that charges the poorest families for primary school. A government deleting a chapter. A country handing ninety-three of its own schools to private companies. One hundred and forty-six of the 164 learning products governments handed out during the school closures, found to be watching the children using them. Each circle is a body that reaches into schooling, placed at its real headquarters: publishers, testing houses, platforms, chains, funds, and now the for-profit college groups and the degree mill at the end of the line. Each small square is whoever stands behind that body, with a thin line running to what it owns or funds.</p>\n\n<p>The box at bottom left holds the patterns: what the individual records add up to when you stand back. Open one and the countries recolour by the part each plays in it. Click anything to open a card in the middle of the screen. The <b>Back</b> and <b>Forward</b> buttons at the top of that card step through everything you have opened, and stay in place as you scroll; Alt and the arrow keys do the same thing.</p>\n\n<h3>What this looks like close up</h3>\n\n<p>A publisher bought the charity that made the test about ten thousand American school districts use, and said it would line the test up with its own lessons. A development bank put 13.5 million dollars into a chain charging families who live on two dollars a day, and sold its stake quietly while its own watchdog was still investigating allegations of child sexual abuse at those schools. One foundation paid around 200 million dollars to write a country's school standards and to fund the organisations that then argued for them, and forty-five states adopted them with no vote. A lobby group handed legislators a finished bill whose own text leaves out the public hearing. Governments are putting their state schools onto a curriculum examined privately in Geneva. A Karachi company sold degrees to more than two hundred thousand people across 197 countries before anyone stopped it. Five publishers hold more than half of all published research and sell it back to the universities that wrote it.</p>\n\n<p>None of that needed anyone to intend harm. Each step was a reasonable commercial or administrative decision for whoever took it. That is also why it is hard to argue with. There is no meeting to point at, and the one person you can actually reach, your teacher or your head, decided none of it.</p>\n\n<h3>The part that was never about money</h3>\n\n<p>The heaviest records here were made by governments, not companies. Canada's own commission found that more than 150,000 First Nations, Inuit and Metis children were taken into church and government schools, recorded over 6,000 student deaths, and concluded the schools were part of a deliberate policy of cultural genocide. The United States went through about 103 million pages of its own records and confirmed 417 federal Indian boarding schools, at least 973 children dead and graves at 65 of them. Norway, Sweden and Finland have all now had commissions report on using their schools to replace Sami languages with their own.</p>\n\n<p>That did not stop. It lost its author. Forty per cent of people worldwide get no education in a language they speak fluently, rising to 90% in some poorer countries, and fewer than one pupil in five in Francophone Africa is taught in their mother tongue. Nobody is ordering those languages out of the classroom. They are simply not the language the school runs in.</p>\n\n<h3>What is also true</h3>\n\n<p>Things on this map have been stopped. Three UN rapporteurs blocked the biggest education fund for poorer countries from financing for-profit schools. The World Bank's private arm froze all investment in fee-charging schools after years of complaints from East African organisations. Nearly all 118 Chinese government language centres in American universities have closed, after a teachers' association set out exactly what the hosting agreements gave away. Thirty-one African countries have shifted policy toward teaching children in languages they actually speak, decided by their own ministries. Fifteen American students went on debt strike and revived a law that had drawn five claims in twenty years; 5.8 billion dollars was eventually written off for 560,000 people.</p>\n\n<p>In every one of those, what worked was a rule forcing disclosure, a body that had to answer locally, or people inside it organising. None of it was the system noticing and correcting itself.</p>\n\n<h3>How to read it honestly</h3>\n\n<p>The countries are not shaded by anything, because every shading this map could honestly offer would have measured how much has been written down rather than how much is happening. The United States and Britain hold most of the records because their filings, courts and press publish, and because that is where the market was built. An empty country here is an empty record.</p>\n\n<p>One body here is not reaching into anything. Giga, run by UNICEF and the International Telecommunication Union, is trying to find out where the world's schools actually are. It has mapped about 2.3 million of them. Nobody knows the true number; the working estimate is six to seven million. A ministry can buy a national platform and a testing contract while not knowing where half its own schools stand.</p>\n\n<p class=\"mute\">This is a first edition. Every entry was tested against one question: does this reach a student wherever they are, and does it cross a line that matters to them? One-time news stories that failed it were taken out. Subjects with no records yet include teachers' own conditions, what university endowments invest in, who is kept out by disability, migration status or caste, and the learning being built outside all of it. The Method page sets out what is missing, how each figure was reached, and roughly how much of your own school day this map can account for depending on where you are.</p>\n";
