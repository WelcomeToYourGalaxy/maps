        // Calculate approximate area for sorting (larger territories rendered first, smaller on top)
        function calcArea(coords) {
            let area = 0;
            for (let i = 0; i < coords.length; i++) {
                const j = (i + 1) % coords.length;
                area += coords[i][1] * coords[j][0];
                area -= coords[j][1] * coords[i][0];
            }
            return Math.abs(area / 2);
        }
        
        // Point in polygon test
        function pointInPolygon(point, polygon) {
            const x = point[1], y = point[0]; // lng, lat
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                const xi = polygon[i][1], yi = polygon[i][0];
                const xj = polygon[j][1], yj = polygon[j][0];
                if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) {
                    inside = !inside;
                }
            }
            return inside;
        }
        
        // Sort by area descending (largest first, so smallest render on top)
        territories.sort((a, b) => calcArea(b.coords) - calcArea(a.coords));
        
        // Store all layers with their data
        const allLayers = [];
        
        let count = 0;
        territories.forEach(t => {
            count++;
            const color = colors[t.cat];
            
            const layer = L.polygon(t.coords, {
                color: color,
                weight: 2,
                opacity: 0.9,
                fillColor: color,
                fillOpacity: 0.4
            }).addTo(map);
            
            // Store reference
            allLayers.push({ layer: layer, data: t, coords: t.coords });
            
            layer.on('mouseover', function() {
                this.setStyle({ fillOpacity: 0.7, weight: 3 });
                this.bringToFront();
            });
            layer.on('mouseout', function() {
                this.setStyle({ fillOpacity: 0.4, weight: 2 });
            });
            
            // Handle click on this layer
            layer.on('click', function(e) {
                L.DomEvent.stopPropagation(e);
                const clickPoint = [e.latlng.lat, e.latlng.lng];
                const matches = [];
                const clickedLayerData = { layer: layer, data: t, coords: t.coords };
                
                // Find all territories containing this point
                allLayers.forEach(item => {
                    if (pointInPolygon(clickPoint, item.coords)) {
                        matches.push(item);
                    }
                });
                
                // Ensure clicked layer is in matches (handles edge cases)
                const clickedInMatches = matches.some(m => m.data.name === t.name);
                if (!clickedInMatches) {
                    matches.push(clickedLayerData);
                }
                
                // Sort matches by area (smallest first)
                matches.sort((a, b) => calcArea(a.coords) - calcArea(b.coords));
                
                if (matches.length === 1) {
                    // Single match - show popup directly
                    L.popup({ maxWidth: 360, minWidth: 280 })
                        .setLatLng(e.latlng)
                        .setContent(popup(matches[0].data))
                        .openOn(map);
                } else {
                    // Multiple matches - show selection menu
                    let menuHtml = '<div class="popup-header"><div class="popup-name">Select Territory</div></div>';
                    menuHtml += '<div class="popup-body" style="padding: 8px 0;">';
                    matches.forEach((item, idx) => {
                        const catColor = colors[item.data.cat];
                        menuHtml += `<div class="territory-option" data-idx="${idx}" style="padding: 8px 14px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center;">
                            <span style="width: 12px; height: 12px; background: ${catColor}; border-radius: 2px; margin-right: 10px; flex-shrink: 0;"></span>
                            <span style="color: #e0e0e0;">${item.data.name}</span>
                        </div>`;
                    });
                    menuHtml += '</div>';
                    
                    const selectionPopup = L.popup({ maxWidth: 300, minWidth: 200 })
                        .setLatLng(e.latlng)
                        .setContent(menuHtml)
                        .openOn(map);
                    
                    // Add click handlers to menu items after popup opens
                    setTimeout(() => {
                        document.querySelectorAll('.territory-option').forEach(opt => {
                            opt.addEventListener('click', function(ev) {
                                ev.stopPropagation();
                                const idx = parseInt(this.getAttribute('data-idx'));
                                map.closePopup();
                                const selected = matches[idx];
                                selected.layer.bringToFront();
                                L.popup({ maxWidth: 360, minWidth: 280 })
                                    .setLatLng(e.latlng)
                                    .setContent(popup(selected.data))
                                    .openOn(map);
                            });
                            opt.addEventListener('mouseover', function() {
                                this.style.background = 'rgba(255,255,255,0.1)';
                            });
                            opt.addEventListener('mouseout', function() {
                                this.style.background = 'transparent';
                            });
                        });
                    }, 50);
                }
            });
        });

        document.getElementById('count').textContent = count;
    </script>
