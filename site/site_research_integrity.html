<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0" />
<title>World Research Integrity 2026 — Who's Breaking Science</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{--bg:#0b0e13;--panel:#10151d;--panel2:#171e28;--line:#262f3b;--ink:#e6ebf1;--ink-dim:#8d99a8;--accent:#7fa8d0}

  .tab{background:transparent;border:0;color:var(--ink-dim);font:inherit;font-size:12px;font-weight:600;letter-spacing:.03em;padding:7px 15px;border-radius:6px;cursor:pointer;transition:color .15s,background .15s}
  .tab:hover{color:var(--ink)}
  .tab.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  .title{position:absolute;top:60px;left:14px;z-index:600;background:rgba(9,12,17,.78);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:12px 15px;max-width:390px;box-shadow:0 2px 18px rgba(0,0,0,.35)}
  .title h1{margin:0;font-size:13.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;line-height:1.3}
  .title p{margin:6px 0 0;font-size:11px;color:var(--ink-dim);line-height:1.5}
  .title .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:0}
  .panel{position:absolute;top:14px;right:14px;z-index:600;width:312px;max-width:calc(100vw - 28px);background:rgba(16,21,29,.93);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 28px);box-shadow:0 2px 18px rgba(0,0,0,.4)}

  .search{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:9px 11px;font-size:13px;outline:none;transition:border-color .15s}

  .search:focus{border-color:#3f5a76}
  .legend{margin-top:11px;display:flex;flex-direction:column;gap:3px}
  .leg{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;font-size:12px;padding:5px 6px;border-radius:6px;transition:background .12s}
  .leg:hover{background:var(--panel2)}
  .leg.off{opacity:.38}
  .leg .dot{width:10px;height:10px;border-radius:2px;flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
  .leg .lab{flex:1;color:var(--ink)}
  .leg .cnt{font-family:ui-monospace,monospace;color:var(--ink-dim);font-size:11px}
  .sizenote{font-size:10.5px;color:#5f6b79;margin-top:10px;line-height:1.5}
  .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-dim);margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
  .meta a{color:var(--accent);text-decoration:none;cursor:pointer}
  .meta a:hover{color:#a9c8e6}
  .listwrap{overflow:auto;border-top:1px solid var(--line);padding:6px 6px 9px}
  .listwrap::-webkit-scrollbar{width:8px}
  .listwrap::-webkit-scrollbar-thumb{background:#2a3543;border-radius:8px}
  .row{display:flex;gap:9px;align-items:flex-start;padding:7px 8px;border-radius:7px;cursor:pointer;transition:background .12s}
  .row:hover{background:var(--panel2)}
  .row .rk{font-family:ui-monospace,monospace;font-size:11px;color:var(--ink-dim);min-width:22px;text-align:right;margin-top:1px}
  .row .bar{width:3px;align-self:stretch;border-radius:2px;flex:0 0 auto;margin-top:1px}
  .row .nm{font-size:12.5px;line-height:1.3;font-weight:600}
  .row .sub{font-size:10.5px;color:var(--ink-dim);margin-top:2px;line-height:1.35}
  .row .sub .mono{font-family:ui-monospace,monospace}
  .leaflet-pane path.mk{filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border-radius:10px;border:1px solid var(--line);box-shadow:0 6px 26px rgba(0,0,0,.5)}
  .leaflet-popup-tip{background:var(--panel);border:1px solid var(--line)}
  .leaflet-popup-content{margin:12px 14px;font-size:12.5px;line-height:1.5;min-width:235px}
  .pop h3{margin:0 0 2px;font-size:14px;line-height:1.3;font-weight:700}
  .pop .rkbig{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--ink-dim);letter-spacing:.04em;text-transform:uppercase}
  .pop .tag{display:inline-block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;margin:7px 0 8px;font-weight:700;color:#0b0e13}
  .pop .kv{margin:3px 0}
  .pop .kv b{color:var(--ink-dim);font-weight:600}
  .pop .note{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);color:#c4cedb;font-size:11.5px}
  .leaflet-bar a{background:#171e28;color:#e6ebf1;border-bottom:1px solid var(--line)}
  .leaflet-bar a:hover{background:#222c39}
  .leaflet-control-attribution{background:rgba(9,12,17,.72)!important;color:#6c7785!important;font-size:10px!important}
  .leaflet-control-attribution a{color:#8fa9c2!important}
  .leaflet-control-layers{background:rgba(16,21,29,.96)!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:8px!important}
  .leaflet-control-layers-expanded{padding:9px 11px!important}
  @media (max-width:640px){
    .title{max-width:calc(100vw - 28px);left:8px;padding:9px 11px}
    .title h1{font-size:12px}
    .panel{width:calc(100vw - 28px);top:auto;bottom:14px;right:14px;max-height:46vh}
    .tabs{top:8px}
  }
</style>
</head>

L.control.layers({"Satellite + labels":gHyb,"Satellite":gSat,"Esri imagery":esri},{},{position:'bottomleft',collapsed:true}).addTo(map);

function popup(d,r,cats){
  const c=cats[d.cat];
  return `<div class="pop"><div class="rkbig">Rank #${r} &middot; documented scale: tier ${d.tier}</div>
  <h3>${d.n}</h3><span class="tag" style="background:${c.color}">${c.label}</span>
  <div class="kv"><b>Based:</b> ${d.hq}</div>
  <div class="kv"><b>Documented scale:</b> ${d.scale}</div>
  <div class="kv"><b>Detail:</b> ${d.detail}</div>
  ${d.note?`<div class="note">${d.note}</div>`:''}</div>`;
}

const CFG = {
  pub:{
    data:DATA_PUB, cats:CATS_PUB,
    h:"Where Compromised Science Gets Published",
    p:'Publishers and journals with documented research-integrity failures — mass retractions, paper-mill infiltration, delistings and sanctions. Sized by documented scale, not total output. By retracted-paper volume (~65,000 verified retractions) the publishers and mills mapped here account for the majority; by raw entity count the predatory long tail (15,000+ journals) is far larger. <span class="mono">(2026)</span>',
    note:"Sources: Retraction Watch, Clarivate Web of Science, COPE, the US FTC, and reporting in Nature and Science. Several listed names are large legitimate publishers whose journals were infiltrated by paper mills and who responded with mass retractions -- that is different from the predatory and sanctioned operators. Megajournals are flagged for documented criticism and delistings, not proven fraud, and dispute the characterisation.",
    sub:d=>`${d.hq} &middot; <span class="mono">${d.scale}</span>`
  },
  make:{
    data:DATA_MAKE, cats:CATS_MAKE,
    h:"Who Manufactures Fake Science",
    p:'The paper mills, predatory operators, serial fabricators and enablers behind fraudulent and ghost-written research. Sized by documented scale. <span class="mono">(2026)</span>',
    note:"Individuals shown are documented cases with official findings, retraction records or convictions (the Retraction Watch leaderboard, university investigations, court rulings). Paper-mill entries come from investigations by Anna Abalkina, Elisabeth Bik, Guillaume Cabanac, Nick Wise, Dorothy Bishop and reporting in Nature/Science. Several 'enabler' entries are categories (cartels, AI text, hijacked journals) rather than single organisations.",
    sub:d=>`${d.hq} &middot; <span class="mono">${d.scale}</span>`
  }
};

const listEl=document.getElementById('list'), legendEl=document.getElementById('legend');
const searchEl=document.getElementById('search'), countEl=document.getElementById('count');
let cur={items:[],active:new Set(),cfg:null,key:null};
function clearCur(){cur.items.forEach(it=>map.removeLayer(it.marker));cur.items=[];listEl.innerHTML='';legendEl.innerHTML='';}

function build(key){
  clearCur();
  const cfg=CFG[key]; cur.cfg=cfg; cur.key=key;
  document.getElementById('title-h').innerHTML=cfg.h;
  document.getElementById('title-p').innerHTML=cfg.p;
  document.getElementById('sizenote').innerHTML=cfg.note;
  cur.active=new Set(Object.keys(cfg.cats));
  Object.entries(cfg.cats).forEach(([k,c])=>{
    const el=document.createElement('div'); el.className='leg';
    el.innerHTML=`<span class="dot" style="background:${c.color}"></span><span class="lab">${c.label}</span><span class="cnt" id="cnt-${k}"></span>`;
    el.addEventListener('click',()=>{if(cur.active.has(k)){cur.active.delete(k);el.classList.add('off');}else{cur.active.add(k);el.classList.remove('off');}applyFilters();});
    legendEl.appendChild(el);
  });
  const rows=[...cfg.data].sort((a,b)=>(a.tier-b.tier)||(b.mag-a.mag));
  rows.forEach((d,i)=>{
    const rank=i+1, c=cfg.cats[d.cat], base=RADIUS[d.tier];
    const marker=L.circleMarker([d.lat,d.lng],{radius:base,color:STROKE,weight:1,fillColor:c.color,fillOpacity:.82,className:'mk'}).bindPopup(popup(d,rank,cfg.cats),{maxWidth:300});
    marker.on('mouseover',()=>marker.setStyle({radius:base+2.5,weight:1.6,color:'rgba(255,255,255,.92)'}));
    marker.on('mouseout',()=>marker.setStyle({radius:base,weight:1,color:STROKE}));
    marker.addTo(map);
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<div class="rk">${rank}</div><div class="bar" style="background:${c.color}"></div><div><div class="nm">${d.n}</div><div class="sub">${cfg.sub(d)}</div></div>`;
    row.addEventListener('click',()=>{map.flyTo([d.lat,d.lng],Math.max(map.getZoom(),5),{duration:.8});marker.openPopup();});
    listEl.appendChild(row);
    cur.items.push({d,marker,row});
  });
  applyFilters();
}
function applyFilters(){
  const q=searchEl.value.trim().toLowerCase(); let shown=0; const per={};
  Object.keys(cur.cfg.cats).forEach(k=>per[k]=0);
  cur.items.forEach(({d,marker,row})=>{
    const ok=cur.active.has(d.cat)&&(!q||(d.n+' '+d.hq+' '+d.scale+' '+d.detail).toLowerCase().includes(q));
    if(ok){if(!map.hasLayer(marker))marker.addTo(map);row.style.display='';shown++;per[d.cat]++;}
    else{if(map.hasLayer(marker))map.removeLayer(marker);row.style.display='none';}
  });
  countEl.textContent=shown+' / '+cur.items.length+' shown';
  Object.keys(cur.cfg.cats).forEach(k=>{const e=document.getElementById('cnt-'+k);if(e)e.textContent=per[k];});
}
searchEl.addEventListener('input',applyFilters);
document.getElementById('reset').addEventListener('click',()=>{searchEl.value='';build(cur.key);map.setView([28,15],2.4);});
const tP=document.getElementById('tab-pub'), tM=document.getElementById('tab-make');
tP.addEventListener('click',()=>{tP.classList.add('on');tM.classList.remove('on');build('pub');});
tM.addEventListener('click',()=>{tM.classList.add('on');tP.classList.remove('on');build('make');});
build('pub');
</script>
</body>
</html>
