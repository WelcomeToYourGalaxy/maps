<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Rodeo & Charreada Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --earth-dark: #2d3436;
            --earth-brown: #6c5448;
            --earth-sand: #d4a574;
            --earth-sage: #8b9474;
            --earth-sky: #7c9eb2;
            --accent-warm: #c9896b;
            --text-light: #f5f5f0;
            --text-dark: #2d2d2d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: var(--earth-dark);
            color: var(--text-light);
            overflow: hidden;
        }

        #map {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .map-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: linear-gradient(180deg, rgba(45,52,54,0.95) 0%, rgba(45,52,54,0.7) 70%, transparent 100%);
            padding: 2rem 3rem 4rem;
            pointer-events: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 2rem;
        }

        .title-section h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 0.02em;
            margin-bottom: 0.5rem;
            color: var(--text-light);
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards;
        }

        .title-section p {
            font-size: 0.95rem;
            color: var(--earth-sand);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-weight: 300;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.2s forwards;
        }

        .filter-panel {
            pointer-events: auto;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.4s forwards;
        }

        .filter-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: var(--text-light);
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            font-family: 'Work Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            letter-spacing: 0.02em;
        }

        .filter-btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: var(--earth-sand);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: var(--earth-sand);
            border-color: var(--earth-sand);
            color: var(--earth-dark);
            font-weight: 500;
        }

        .stats-panel {
            position: absolute;
            bottom: 2rem;
            left: 3rem;
            z-index: 1000;
            background: rgba(45,52,54,0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1rem;
            padding: 1.5rem 2rem;
            pointer-events: none;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.6s forwards;
        }

        .stat-item {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 600;
            color: var(--earth-sand);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-light);
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Custom Leaflet Popup Styling */
        .leaflet-popup-content-wrapper {
            background: rgba(45,52,54,0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 1rem;
            padding: 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .leaflet-popup-content {
            margin: 0;
            min-width: 250px;
        }

        .leaflet-popup-tip {
            background: rgba(45,52,54,0.98);
            border: 1px solid rgba(255,255,255,0.15);
            border-top: none;
            border-right: none;
        }

        .popup-content {
            padding: 1.5rem;
        }

        .popup-category {
            display: inline-block;
            background: var(--earth-sand);
            color: var(--earth-dark);
            padding: 0.3rem 0.8rem;
            border-radius: 1rem;
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
        }

        .popup-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .popup-address {
            font-size: 0.9rem;
            color: var(--earth-sand);
            margin-bottom: 0.25rem;
            opacity: 0.9;
        }

        .popup-country {
            font-size: 0.85rem;
            color: var(--text-light);
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.5rem;
        }

        /* Marker Icons */
        .marker-icon {
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .marker-icon:hover {
            transform: scale(1.2);
            border-width: 3px;
        }

        .marker-rodeo { background: rgba(212, 165, 116, 0.9); }
        .marker-charreada { background: rgba(201, 137, 107, 0.9); }
        .marker-coleo { background: rgba(139, 148, 116, 0.9); }
        .marker-rodeio { background: rgba(124, 158, 178, 0.9); }
        .marker-other { background: rgba(108, 84, 72, 0.9); }

        @media (max-width: 768px) {
            .title-section h1 {
                font-size: 2rem;
            }
            
            .map-overlay {
                padding: 1.5rem;
            }
            
            .stats-panel {
                left: 1.5rem;
                bottom: 1.5rem;
                padding: 1rem 1.5rem;
            }
            
            .filter-panel {
                gap: 0.5rem;
            }
            
            .filter-btn {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

        // Initialize map with satellite view
        const map = L.map('map', {
            zoomControl: true,
            minZoom: 2,
            maxZoom: 18
        }).setView([20, 0], 2);

        // Add Google Satellite layer
        L.tileLayer('http://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '© Google'
        }).addTo(map);

        // Store markers
        let markers = {};

        // Custom icon function
        function getMarkerIcon(category) {
            return L.divIcon({
                className: `marker-icon marker-${category}`,
                iconSize: [20, 20],
                iconAnchor: [10, 10],
                popupAnchor: [0, -10]
            });
        }

        // Create popup content
        function createPopupContent(location) {
            return `
                <div class="popup-content">
                    <div class="popup-category">${location.category}</div>
                    <div class="popup-name">${location.name}</div>
                    <div class="popup-address">${location.address}</div>
                    <div class="popup-address">${location.city}</div>
                    <div class="popup-country">${location.country}</div>
                </div>
            `;
        }

        // Add all markers
        function addMarkers(filter = 'all') {
            // Clear existing markers
            Object.values(markers).forEach(marker => map.removeLayer(marker));
            markers = {};

            // Filter locations
            const filteredLocations = filter === 'all' 
                ? locations 
                : locations.filter(loc => loc.category === filter);

            // Add markers
            filteredLocations.forEach(location => {
                const marker = L.marker([location.lat, location.lng], {
                    icon: getMarkerIcon(location.category)
                })
                .bindPopup(createPopupContent(location), {
                    maxWidth: 300,
                    className: 'custom-popup'
                })
                .addTo(map);

                markers[`${location.lat}-${location.lng}`] = marker;
            });

            // Update stats
            updateStats(filteredLocations);
        }

        // Update statistics
        function updateStats(filteredLocations) {
            const countries = new Set(filteredLocations.map(loc => loc.country));
            
            animateNumber('location-count', filteredLocations.length);
            animateNumber('country-count', countries.size);
        }

        // Animate number counting
        function animateNumber(elementId, targetValue) {
            const element = document.getElementById(elementId);
            const duration = 1000;
            const startValue = parseInt(element.textContent) || 0;
            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3); // Ease out cubic
                const currentValue = Math.floor(startValue + (targetValue - startValue) * easeProgress);
                
                element.textContent = currentValue;

                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }

            requestAnimationFrame(update);
        }

        // Filter button handling
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // Update active state
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Filter markers
                const category = btn.dataset.category;
                addMarkers(category);
            });
        });

        // Initialize map with all markers
        addMarkers();

        // Add smooth zoom on marker click
        map.on('popupopen', function(e) {
            const px = map.project(e.popup._latlng);
            px.y -= e.popup._container.clientHeight / 2;
            map.panTo(map.unproject(px), { animate: true });
        });
    </script>
</body>
</html>
