function coPopup(d,r){
  const c=CATS_CO[d.cat];
  return `<div class="pop"><div class="rkbig">Rank #${r} &middot; entertainment</div>
  <h3>${d.n}</h3><span class="tag" style="background:${c.color}">${c.label}</span>
  <div class="kv"><b>HQ:</b> ${d.hq}</div><div class="kv"><b>Sector:</b> ${d.role}</div>
  <div class="kv"><b>Share of entertainment market:</b> \u2248${d.pct}%</div>
  <div class="kv"><b>Detail:</b> ${d.metric}</div>
  <div class="kv"><b>Owner:</b> ${d.own}</div>
  ${d.note?`<div class="note">${d.note}</div>`:''}</div>`;
}
function ownPopup(d,r){
  const c=CATS_OWN[d.cat];
  return `<div class="pop"><div class="rkbig">Rank #${r} &middot; control weight: tier ${d.tier}</div>
  <h3>${d.n}</h3><span class="tag" style="background:${c.color}">${c.label}</span>
  <div class="kv"><b>HQ:</b> ${d.hq}</div><div class="kv"><b>Controls:</b> ${d.sec}</div>
  <div class="kv"><b>Share of entertainment market:</b> ${d.share}</div>
  ${d.note?`<div class="note">${d.note}</div>`:''}</div>`;
}

const CFG = {
  cos:{
    data:DATA_CO, cats:CATS_CO,
    h:"The World's Largest Entertainment Companies",
    p:'Sized by share of the ~$1.4 trillion global entertainment market — what people spend on film, TV & streaming, video games, music, and live entertainment & theme parks. These entries account for roughly 42% of it; the rest is a long tail of game studios, local broadcasters, cinemas and venues. <span class="mono">(2026)</span>',
    note:"Marker size = share of the ~$1.4T global entertainment market (consumer spending on content & experiences -- film/TV/streaming, games, music, live & parks; PwC E&M 2024 basis, excluding advertising and connectivity). Figures are each company's entertainment revenue (2024-25) from company reports; cross-segment giants (Sony, Tencent, Comcast, Disney) are shown by combined entertainment revenue. Private-company figures (Epic, Valve, HoYoverse, Garena, Chimelong) are estimates.",
    size:d=>entR(d.pct), popup:coPopup,
    sub:d=>`${d.hq} &middot; ${d.role} &middot; <span class="mono">\u2248${d.pct}%</span>`
  },
  own:{
    data:DATA_OWN, cats:CATS_OWN,

    note:"Marker size = approximate breadth of entertainment control. A handful of US conglomerates plus founder-led tech and games firms dominate; sovereign funds (notably Saudi Arabia) and index funds are growing forces; many empires are family- or founder-controlled.",
    size:d=>RADIUS[d.tier], popup:ownPopup,
    sub:d=>`${d.hq} &middot; <span class="mono">${d.pl}</span>`
  }
};

const listEl=document.getElementById('list'), legendEl=document.getElementById('legend');
const searchEl=document.getElementById('search'), countEl=document.getElementById('count');
let cur={items:[],active:new Set(),cfg:null,key:null};
function clearCur(){cur.items.forEach(it=>map.removeLayer(it.marker));cur.items=[];listEl.innerHTML='';legendEl.innerHTML='';}

function build(key){
  clearCur();
  const cfg=CFG[key]; cur.cfg=cfg; cur.key=key;
  document.getElementById('title-h').innerHTML=cfg.h;
  document.getElementById('title-p').innerHTML=cfg.p;
  document.getElementById('sizenote').innerHTML=cfg.note;
  cur.active=new Set(Object.keys(cfg.cats));
  Object.entries(cfg.cats).forEach(([k,c])=>{
    const el=document.createElement('div'); el.className='leg';
    el.innerHTML=`<span class="dot" style="background:${c.color}"></span><span class="lab">${c.label}</span><span class="cnt" id="cnt-${k}"></span>`;
    el.addEventListener('click',()=>{if(cur.active.has(k)){cur.active.delete(k);el.classList.add('off');}else{cur.active.add(k);el.classList.remove('off');}applyFilters();});
    legendEl.appendChild(el);
  });
  const rows=[...cfg.data].sort((a,b)=>(cfg.size(b)-cfg.size(a))||((b.pct||0)-(a.pct||0)));
  rows.forEach((d,i)=>{
    const rank=i+1, c=cfg.cats[d.cat], base=cfg.size(d);
    const marker=L.circleMarker([d.lat,d.lng],{radius:base,color:STROKE,weight:1,fillColor:c.color,fillOpacity:.82,className:'mk'}).bindPopup(cfg.popup(d,rank),{maxWidth:300});
    marker.on('mouseover',()=>marker.setStyle({radius:base+2.5,weight:1.6,color:'rgba(255,255,255,.92)'}));
    marker.on('mouseout',()=>marker.setStyle({radius:base,weight:1,color:STROKE}));
    marker.addTo(map);
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<div class="rk">${rank}</div><div class="bar" style="background:${c.color}"></div><div><div class="nm">${d.n}</div><div class="sub">${cfg.sub(d)}</div></div>`;
    row.addEventListener('click',()=>{map.flyTo([d.lat,d.lng],Math.max(map.getZoom(),6),{duration:.8});marker.openPopup();});
    listEl.appendChild(row);
    cur.items.push({d,marker,row});
  });
  applyFilters();
}
function applyFilters(){
  const q=searchEl.value.trim().toLowerCase(); let shown=0; const per={};
  Object.keys(cur.cfg.cats).forEach(k=>per[k]=0);
  cur.items.forEach(({d,marker,row})=>{
    const ok=cur.active.has(d.cat)&&(!q||(d.n+' '+d.hq+' '+(d.role||d.sec||'')+' '+(d.own||'')).toLowerCase().includes(q));
    if(ok){if(!map.hasLayer(marker))marker.addTo(map);row.style.display='';shown++;per[d.cat]++;}
    else{if(map.hasLayer(marker))map.removeLayer(marker);row.style.display='none';}
  });
  countEl.textContent=shown+' / '+cur.items.length+' shown';
  Object.keys(cur.cfg.cats).forEach(k=>{const e=document.getElementById('cnt-'+k);if(e)e.textContent=per[k];});
}
searchEl.addEventListener('input',applyFilters);
document.getElementById('reset').addEventListener('click',()=>{searchEl.value='';build(cur.key);map.setView([30,-20],2.5);});
const tC=document.getElementById('tab-cos'), tW=document.getElementById('tab-own');
tC.addEventListener('click',()=>{tC.classList.add('on');tW.classList.remove('on');build('cos');});
tW.addEventListener('click',()=>{tW.classList.add('on');tC.classList.remove('on');build('own');});
build('cos');
</script>
