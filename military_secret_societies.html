<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>International Military Secret Societies</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Uncial+Antiqua&display=swap">
<style>
:root{--bg:#06071a;--card:rgba(8,9,24,.94);--line:#24264a;--line2:rgba(255,255,255,.07);--ink:#e8e6e1;--mute:#a3a1b4;--accent:#5600DC;--accent-hi:#a99cff;--chh:38px}
#ttip{z-index:5000!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 'Marcellus','Georgia',serif;overflow:hidden}
#map{position:absolute;inset:0;background:#03040a}
.card{position:absolute;z-index:800;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
.scroll{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
#key{top:12px;left:12px;width:336px;max-height:calc(100% - var(--chh) - 46px);overflow:auto;padding:14px 16px;box-sizing:border-box}
#key h1{font:800 22px/1.2 'Uncial Antiqua','Marcellus','Georgia',serif;margin:0 0 4px;letter-spacing:.5px;color:#f0ece4;text-shadow:0 2px 12px rgba(0,0,0,.5)}
#key .lede{color:var(--mute);margin:0 0 4px;font-size:12.8px}
#key .lede2{color:var(--mute);margin:0 0 10px;font-size:11.5px}
.psec{margin:14px 0 3px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent-hi)}
.row{display:flex;gap:9px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line2)}
.row input{margin-top:4px}
.row label{flex:1;cursor:pointer;font-size:13px}
.row .n{color:var(--mute);font-size:11.5px}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
.bar{height:4px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%}
.sub{margin:4px 0 0;font-size:12px;color:var(--mute)}
.mute{color:var(--mute)}
a{color:var(--accent-hi)}
select,button.btn{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font:inherit;font-size:12.5px;cursor:pointer}
button.btn.on{border-color:var(--accent-hi);background:var(--accent);color:#fff}
button.btn:hover,#infoBtn:hover,#worldBtn:hover{border-color:var(--accent-hi);color:#fff}
.tog{display:inline-block;float:right;cursor:pointer;font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:1px 8px}
#key.min .body,#key.min .lede,#key.min .lede2{display:none}
.tline{display:flex;align-items:center;gap:8px;margin:4px 0 2px}
.tline input[type=range]{flex:1}
.tline b{font-weight:400;min-width:38px;text-align:right;font-size:15px;color:#f0ece4}
.chk{display:flex;gap:7px;align-items:center;font-size:12.8px;cursor:pointer;margin:2px 0}
#cnt{font-size:11.5px;color:var(--mute);margin-top:3px}
#wfilter{width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 7px;font:inherit;font-size:12.5px;margin:2px 0 4px}
#olist{max-height:300px;overflow:auto}
.oi{display:flex;gap:8px;align-items:flex-start;padding:4px 2px;border-top:1px solid var(--line2);font-size:12.8px;cursor:pointer}
.oi:hover{background:rgba(255,255,255,.04)}
.oi.off{opacity:.38}
.oi.sel{background:rgba(255,255,255,.07)}
.oi .n{color:var(--mute);font-size:11px;display:block}
.oi .pin{flex:none;margin-top:4px}

/* the marks on the map */
.mk{cursor:pointer;line-height:0;pointer-events:none}
.mk svg{pointer-events:none}
.mk .hit{pointer-events:all}
.mk:hover svg{filter:brightness(1.35)}
.hub{width:3px;height:3px;border-radius:50%;background:#f0ece4;opacity:.7;pointer-events:none}
.mks{display:inline-block;vertical-align:-3px;margin-right:6px;line-height:0}
.mks svg{display:inline-block!important}
.lg .mks{margin:0 6px 0 0;vertical-align:-3px}
.oi .mks{flex:none;margin:3px 0 0}

/* right column: basemap box and the organization's card */
#rcol{position:absolute;z-index:800;top:12px;right:12px;bottom:calc(var(--chh) + 34px);width:340px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#rcol>*{pointer-events:auto;position:relative;box-sizing:border-box}
#infoBtn{position:relative;align-self:flex-end;padding:7px 14px;cursor:pointer;letter-spacing:.2px}
#tr{padding:12px 14px;flex:none}
#tr.min .body{display:none}
#tr.min{align-self:flex-end;padding:6px 10px}
.bases{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12.8px;margin:4px 0 2px}
.bases label{cursor:pointer;white-space:nowrap}
.seg{display:flex;gap:6px;margin:4px 0 2px;flex-wrap:wrap}
#det{display:none;flex:0 1 auto;min-height:0;overflow:auto;padding:13px 15px}
#det.open{display:block}
#detX{position:absolute;top:6px;right:8px;background:none;border:0;color:#bbb;font-size:20px;cursor:pointer;line-height:1}
#detX:hover{color:#fff}

/* the card's contents */
.hp h3{margin:2px 0 5px;font-size:17px;font-weight:700;color:#f0ece4;border-bottom:1px solid var(--line);padding:0 18px 6px 0;line-height:1.3}
.hp-k{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);padding-right:20px}
.hp-sub{color:var(--mute);font-size:12px;margin:0 0 6px}
.hp-desc{margin:8px 0;color:#dedbe6;font-size:13px}
.hp-h{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);margin:12px 0 3px}
.hp table.kv{border-collapse:collapse;font-size:12.5px;width:100%}
.hp table.kv th{text-align:left;color:var(--mute);font-weight:400;vertical-align:top;padding:2px 10px 2px 0;white-space:nowrap}
.hp table.kv td{padding:2px 0;vertical-align:top}
.hp details{margin:8px 0;border:1px solid var(--line2);border-radius:3px;padding:4px 7px}
.hp summary{cursor:pointer;font-size:12.5px}
.hp table.rec{border-collapse:collapse;font-size:11.5px;width:100%;margin-top:4px}
.hp table.rec th,.hp table.rec td{border-bottom:1px solid var(--line2);padding:2px 5px;text-align:right}
.hp table.rec th:first-child,.hp table.rec td:first-child{text-align:left}
.hp table.rec th{color:var(--mute);font-weight:400}
.hp-src{color:var(--mute);font-size:11.2px;margin-top:10px;border-top:1px solid var(--line2);padding-top:6px}
.spk{display:grid;grid-template-columns:72px 1fr;gap:4px 8px;align-items:center;font-size:11.5px;color:var(--mute)}
.spk svg{display:block;width:100%;height:44px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chips span{font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:0 6px}

/* the chart buttons */
#dock{left:360px;right:12px;bottom:24px;height:38px;display:flex;align-items:center;gap:4px;padding:0 8px;overflow-x:auto;scrollbar-width:none;box-sizing:border-box}
#dock .ttl{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent-hi);margin-right:6px;flex:none}
#dockBtns{display:flex;gap:3px;flex:none}
.tab{background:none;border:1px solid transparent;color:var(--mute);font:inherit;font-size:12.5px;padding:2px 9px;border-radius:4px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:#f0ece4;border-color:var(--accent-hi);background:rgba(255,255,255,.06)}

/* chart windows */
.win{position:fixed;z-index:900;display:flex;flex-direction:column;resize:both;overflow:hidden;min-width:300px;min-height:200px;background:rgba(8,9,22,.96);box-shadow:0 18px 50px rgba(0,0,0,.65)}
.wh{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 13px;border-bottom:1px solid var(--line2);cursor:move;user-select:none;flex:none;touch-action:none}
.wt{font:400 14px/1.2 'Uncial Antiqua','Marcellus','Georgia',serif;color:#f0ece4;letter-spacing:.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr{display:flex;gap:4px}
.whint{font-size:11px;color:var(--mute);white-space:nowrap;margin-right:6px}
@media (max-width:900px){.whint{display:none}}
.wm{background:none;border:0;color:#bbb;font-size:15px;line-height:1;cursor:pointer;padding:0 4px}
.wm:hover{color:#fff}
.win.max{resize:none}
.zoomable{cursor:crosshair}
.grabbing,.grabbing *{cursor:grabbing!important}
.csvg .band{fill:rgba(255,255,255,.018)}
.csvg .band.alt{fill:rgba(255,255,255,.045)}
.wr .btn{font-size:11.5px;padding:1px 7px}
.wx{background:none;border:0;color:#bbb;font-size:20px;line-height:1;cursor:pointer;padding:0 4px}
.wx:hover{color:#fff}
.wb{flex:1;min-height:0;position:relative;overflow:auto}
.lw{display:flex;height:100%}
.plot{flex:1;min-width:0;position:relative}
.leg{width:200px;flex:none;border-left:1px solid var(--line2);overflow:auto;padding:6px 8px;font-size:11.5px}
@media (max-width:620px){.leg{display:none}}
.li{display:flex;gap:7px;align-items:baseline;padding:2px 3px;cursor:pointer;border-radius:3px;line-height:1.25}
.li i{flex:none;width:10px;height:2px;transform:translateY(-3px)}
.li:hover,.li.hov{background:rgba(255,255,255,.06);color:#fff}
.li.sel{color:#fff;background:rgba(255,255,255,.09)}
.li.off{opacity:.35}
.csvg{display:block;width:100%;height:100%}
.csvg text{font-family:'Marcellus','Georgia',serif;fill:var(--mute);font-size:10.5px}
.csvg .gl{stroke:rgba(255,255,255,.07)}
.csvg .ser{fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.csvg .sg{opacity:.85;cursor:pointer}
.csvg.has-sel .sg,.csvg.has-hov .sg{opacity:.16}
.csvg .sg.sel{opacity:1}.csvg .sg.sel .ser{stroke-width:2.8}
.csvg .sg.hov{opacity:1}.csvg .sg.hov .ser{stroke-width:2.4}
.csvg .yl{stroke:var(--accent-hi);stroke-dasharray:3 3}
.csvg .ylt{fill:var(--accent-hi)}
.csvg .xh{stroke:rgba(255,255,255,.4);stroke-width:1}
.csvg .ar{fill:var(--accent-hi);fill-opacity:.12}
.csvg .cl{fill:none;stroke:var(--accent-hi);stroke-width:1.5;stroke-linejoin:round}
.csvg text.pt{fill:#d8d5e0;font-size:11.5px}
.csvg.life .hit{fill:transparent;cursor:pointer}
.csvg.life .lr:hover .hit{fill:rgba(255,255,255,.04)}
.csvg.life .lr.sel .hit{fill:rgba(255,255,255,.08)}
.csvg.life .lr.sel .ln,.csvg.life .lr:hover .ln{fill:#f0ece4}
.csvg.life .ln{font-size:11px}
.cnote{position:absolute;left:48px;top:4px;font-size:11px;color:var(--mute);pointer-events:none}
.cwrap{display:flex;flex-direction:column;height:100%}
.cwrap .csvg{flex:1;min-height:0}
.cfoot{flex:none;font-size:10.5px;color:var(--mute);padding:4px 14px 7px;line-height:1.35;border-top:1px solid var(--line2)}
.kwrap{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 18px;padding:12px 14px}
.ring{display:flex;gap:14px;align-items:center;flex:none}
.ring text{font-family:'Marcellus','Georgia',serif;fill:var(--mute);font-size:10.5px}
.ring text.big{fill:#f0ece4;font-size:26px}
.ring .arc{cursor:default}
.ring .arc:hover{filter:brightness(1.25)}
.rl div{font-size:12.5px;margin:4px 0;display:flex;gap:8px;align-items:center}
.rl i{width:10px;height:10px;border-radius:2px;border:1px solid;flex:none}
.kinds{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 22px}
.kinds .h{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-hi);margin:0 0 4px}
.mini{display:grid;grid-template-columns:118px 1fr 26px;gap:7px;align-items:center;font-size:12px;margin:3px 0}
.mini .b{height:8px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden}
.mini .b i{display:block;height:100%}
.mini span:last-child{text-align:right;color:var(--mute)}
table.all{border-collapse:collapse;font-size:12px;width:100%}
table.all th{position:sticky;top:0;background:#0b0c1e;color:var(--mute);font-weight:400;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
table.all th:hover{color:#fff}
table.all td{padding:3px 6px;border-bottom:1px solid var(--line2);vertical-align:top;min-width:70px}
table.all td:first-child{min-width:210px}
table.all td:nth-child(8),table.all td:last-child{min-width:170px}
table.all tr.r{cursor:pointer}
table.all tr.r:hover td{background:rgba(255,255,255,.04)}
table.all tr.sel td{background:rgba(255,255,255,.08)}
table.all td.num{text-align:right;white-space:nowrap;min-width:0}
#ttip{position:fixed;z-index:2000;pointer-events:none;background:rgba(12,13,20,.97);border:1px solid var(--line);border-radius:3px;padding:4px 8px;font-size:12.5px;display:none;max-width:320px;box-shadow:0 6px 18px rgba(0,0,0,.5)}

#worldBtn{position:absolute;z-index:800;right:52px;bottom:calc(var(--chh) + 34px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 11px;font:13px 'Marcellus','Georgia',serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}
body.detopen #worldBtn{right:362px}
#info{inset:0;z-index:1001;border-radius:0;border:0;display:none;overflow:auto;padding:60px max(28px,calc((100% - 1080px)/2)) 40px;background:rgba(5,6,16,.975)}
#info.open{display:block}
#infoClose{position:fixed;top:12px;right:12px;z-index:1002;display:none}
#info.open+#infoClose{display:block}
#info h2{font:400 17px/1.3 'Uncial Antiqua','Marcellus','Georgia',serif;margin:26px 0 8px;color:#f0ece4;letter-spacing:.3px}
#info h2:first-child{margin-top:0}
#info p,#info li{font-size:14px}
#info ul{padding-left:20px;margin:4px 0}
#info blockquote{margin:6px 0;padding:4px 0 4px 12px;border-left:2px solid var(--accent);color:#d8d5e0}
.maplibregl-map{font-family:'Marcellus','Georgia',serif}
.maplibregl-ctrl-attrib{background:rgba(6,7,16,.8)!important;color:#8f8d9e;font-family:'Marcellus','Georgia',serif}
.maplibregl-ctrl-attrib a{color:#b0aec0!important}
.maplibregl-ctrl-attrib-button{filter:invert(1)}
.maplibregl-ctrl-group{background:var(--card)!important;border:1px solid var(--line);box-shadow:none!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}
.maplibregl-ctrl-bottom-right{bottom:calc(var(--chh) + 24px)}
body.detopen .maplibregl-ctrl-bottom-right{right:350px}
@media (max-width:820px){
  #key{width:auto;right:12px;max-height:42%}
  #rcol{top:auto;bottom:calc(var(--chh) + 34px);left:12px;right:12px;width:auto;max-height:46%}
  #infoBtn{align-self:flex-start}
  #dock{left:12px;right:12px;bottom:12px}
  body.detopen #worldBtn{right:52px}
  body.detopen .maplibregl-ctrl-bottom-right{right:0}
  #info{padding:56px 16px 80px}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="key" class="card scroll">
  <button id="toggleKey" class="tog" type="button" title="Pull the key up or down">−</button>
  <h1>International military secret societies</h1>
  <p class="lede">Global networks and cross-border coordination: 1099–2025 (926 years).</p>
  <p class="lede2">25 organizations · evidence-based analysis</p>
  <div class="body" id="keyBody"></div>
</div>

<div id="rcol">
  <div id="infoBtn" class="card" role="button" tabindex="0">About and sources</div>
  <div id="tr" class="card"><button id="toggleTr" class="tog" type="button" title="Pull the basemap box up or down">−</button><div class="body" id="trBody"></div></div>
  <div id="det" class="card scroll hp"><button id="detX" type="button" title="Close">×</button><div id="detBody"></div></div>
</div>

<div id="dock" class="card"><span class="ttl">Charts</span><span id="dockBtns"></span></div>

<button id="worldBtn" type="button" title="Zoom back out to the whole world">Whole world</button>
<div id="info" class="card scroll"></div>
<button id="infoClose" class="btn" type="button">Close</button>
<div id="ttip"></div>

const UI = { night: ["#5600DC", "#a99cff", "#06071a"], satellite: ["#3f6e69", "#9fc9c1", "#0b1017"], atlas: ["#4b6075", "#b9c8d8", "#0b1017"], wood: ["#465c45", "#b8cdb0", "#0b1017"], hell: ["#82303a", "#e0a3a5", "#1e080b"], outlines: ["#38586b", "#a9c2d6", "#0b1017"] };
function startZoom() { const el = $("#map"); const h = el.clientHeight || 800, w = (el.clientWidth || 1200) - (window.innerWidth > 820 ? 700 : 0); return Math.max(0.3, Math.log2(0.86 * Math.max(260, Math.min(h, w)) * Math.PI / 512)); }
let proj = "globe", ready = false;
function freeFlat() {
  try {
    if (proj === "mercator") map.setTransformConstrain((ll, z) => ({ center: new maplibregl.LngLat(Math.max(-360, Math.min(360, ll.lng)), Math.max(-84, Math.min(84, ll.lat))), zoom: Math.max(0, z) }));
    else map.setTransformConstrain(null);
  } catch (e) {}
}
const BM = CulpritsBasemaps.create("map", { initial: "night", projection: "globe", plate: window.PLATE_IMG, center: [12, 30], zoom: startZoom(),
  onApply: (k) => { const u = UI[k] || UI.night, rs = document.documentElement.style; rs.setProperty("--accent", u[0]); rs.setProperty("--accent-hi", u[1]); rs.setProperty("--bg", u[2]); if (ready) order(); },
  onReady: () => init() });
const map = window.secretMap = BM.maplibre;
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");
map.once("idle", () => { const a = map.getContainer().querySelector(".maplibregl-ctrl-attrib"); if (a) { a.classList.remove("maplibregl-compact-show"); a.removeAttribute("open"); } });

function panelRight() { try { const r = $("#key").getBoundingClientRect(), w = map.getContainer().clientWidth; if (r.width && r.right < w * 0.6) return r.right + 10; } catch (e) {} return 0; }
function rightBox() { try { const r = $("#rcol").getBoundingClientRect(), w = map.getContainer().clientWidth; if (r.width && r.left > w * 0.5) return w - r.left + 10; } catch (e) {} return 0; }
function bottomBox() { return 70; }
function pad() { return { left: panelRight(), right: rightBox(), top: 20, bottom: bottomBox() }; }
function wholeWorld() {
  if (proj === "globe") map.flyTo({ center: [12, 30], zoom: startZoom(), padding: { left: panelRight() / 2, right: rightBox() / 2, top: 0, bottom: bottomBox() / 2 } });
  else map.fitBounds([[-170, -56], [180, 76]], { padding: pad() });
}
const IDS = [];
function order() { const st = map.getStyle(); if (!st) return; const mine = new Set(IDS); const first = st.layers.find((l) => !mine.has(l.id) && (l.type === "symbol" || l.id === "labels")); IDS.forEach((id) => { if (map.getLayer(id)) map.moveLayer(id, first ? first.id : undefined); }); }

/* ---------- tooltip ---------- */
const tt = $("#ttip");
function tip(html, x, y) { if (!html) { tt.style.display = "none"; return; } tt.innerHTML = html; tt.style.display = "block"; const r = tt.getBoundingClientRect(); let L = x + 14, T = y + 12; if (L + r.width > innerWidth - 6) L = x - r.width - 12; if (T + r.height > innerHeight - 6) T = y - r.height - 10; tt.style.left = L + "px"; tt.style.top = T + "px"; }
const years = (o) => o.founded + "–" + (o.dissolved == null ? "present" : o.dissolved);

/* ---------- the marks on the map ---------- */
// A hairline ring sized by power index, with a small core. Evidence sets the core and the ring's line;
// a second faint hairline means the organization is listed as active today.
const MK = new Map(), HUBS = new Map();
function markSVG(o, d, sel, lead, tight) {
  const c = KC[o.category], ev = o.evidenceLevel, act = statusGroup(o) === "Active";
  const R = d / 2, B = tight ? Math.ceil(R + (act ? 3.6 : 1)) : Math.ceil(R + 10), W = B * 2;
  let s = '<svg width="' + W + '" height="' + W + '" viewBox="' + (-B) + ' ' + (-B) + ' ' + W + ' ' + W + '" style="overflow:visible;display:block">';
  if (lead && (lead[0] || lead[1])) s += '<line x1="0" y1="0" x2="' + lead[0] + '" y2="' + lead[1] + '" stroke="' + c.hi + '" stroke-opacity=".4" stroke-width=".8"/>';
  const dash = ev === "Suspected" ? ' stroke-dasharray="1.4 2.2"' : ev === "Contested" ? ' stroke-dasharray="4 2.4"' : "";
  const tint = ev === "Confirmed" ? .26 : ev === "Well-Documented" ? .16 : .06;
  s += '<circle class="hit" r="' + R + '" fill="' + c.col + '" fill-opacity="' + tint + '" stroke="' + (sel ? "#f0ece4" : c.hi) + '" stroke-opacity="' + (sel ? 1 : .9) + '" stroke-width="' + (sel ? 1.5 : 1) + '"' + dash + '/>';
  if (act) s += '<circle r="' + (R + 2.8) + '" fill="none" stroke="' + c.hi + '" stroke-opacity=".38" stroke-width=".7"/>';
  const core = Math.max(2, Math.min(3.2, R * .3));
  if (ev === "Confirmed") s += '<circle r="' + core + '" fill="' + c.hi + '"/>';
  else if (ev === "Well-Documented") s += '<circle r="' + core + '" fill="' + c.hi + '" fill-opacity=".45" stroke="' + c.hi + '" stroke-width=".7"/>';
  else s += '<circle r="' + core + '" fill="none" stroke="' + c.hi + '" stroke-width=".8"/>';
  if (sel) { const q = R + (act ? 5 : 3); s += '<path d="M0 ' + (-q) + 'v-4M0 ' + q + 'v4M' + (-q) + ' 0h-4M' + q + ' 0h4" stroke="#f0ece4" stroke-width="1"/>'; }
  return s + '</svg>';
}
function swatch(o, d) { return '<span class="mks">' + markSVG(o, d || 13, false, null, true) + '</span>'; }
function makeMarkers() {
  orgs.forEach((o, i) => {
    if (NOPIN.has(o.name)) return;
    const el = document.createElement("div"); el.className = "mk";
    el.addEventListener("click", (e) => { e.stopPropagation(); select(i, true); });
    el.addEventListener("mousemove", (e) => tip("<b>" + esc(o.name) + "</b><br><span class=mute>" + esc(o.category) + " · " + years(o) + " · " + esc(o.evidenceLevel) + "</span>", e.clientX, e.clientY));
    el.addEventListener("mouseleave", () => tip(null));
    MK.set(i, { m: new maplibregl.Marker({ element: el, anchor: "center" }).setLngLat([o.origin.lng, o.origin.lat]), el, on: false });
  });
}
function drawMarkers() {
  const groups = new Map();
  MK.forEach((v, i) => {
    const o = orgs[i], show = onMap(o);
    if (show && !v.on) { v.m.addTo(map); v.on = true; } else if (!show && v.on) { v.m.remove(); v.on = false; }
    if (show) { const k = o.origin.lat + "," + o.origin.lng; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(i); }
  });
  // marks that share one point are spread around it, each tied back to the point by a hairline
  const seen = new Set();
  groups.forEach((list, k) => {
    const n = list.length, dmax = Math.max(...list.map((i) => diam(powerNow(orgs[i]))));
    const r = n > 1 ? Math.max(16, (dmax / 2 + 7) / Math.sin(Math.PI / n)) : 0;
    list.forEach((i, j) => {
      const a = -Math.PI / 2 + j * 2 * Math.PI / n, ox = Math.round(r * Math.cos(a)), oy = Math.round(r * Math.sin(a)), v = MK.get(i);
      v.m.setOffset([ox, oy]);
      v.el.innerHTML = markSVG(orgs[i], diam(powerNow(orgs[i])), S.sel === i, n > 1 ? [-ox, -oy] : null);
      v.el.style.zIndex = S.sel === i ? 5 : "";
    });
    if (n > 1) { seen.add(k); if (!HUBS.has(k)) { const el = document.createElement("div"); el.className = "hub"; const [la, ln] = k.split(",").map(Number); HUBS.set(k, new maplibregl.Marker({ element: el, anchor: "center" }).setLngLat([ln, la])); } HUBS.get(k).addTo(map); }
  });
  HUBS.forEach((m, k) => { if (!seen.has(k)) m.remove(); });
}

/* ---------- countries named in the entries ---------- */
const BOUND_URL = "https://welcometoyourgalaxy.github.io/culprits/data/boundaries.geojson";
function addCountryLayers() {
  map.addSource("named-shapes", { type: "geojson", data: BOUND_URL });
  map.addLayer({ id: "named-all-fill", type: "fill", source: "named-shapes", layout: { visibility: "none" }, filter: ["in", ["get", "iso3"], ["literal", []]], paint: { "fill-color": "#55779f", "fill-opacity": 0.5 } });
  map.addLayer({ id: "named-sel-fill", type: "fill", source: "named-shapes", filter: ["in", ["get", "iso3"], ["literal", []]], paint: { "fill-color": "#7a6aa0", "fill-opacity": 0.42 } });
  map.addLayer({ id: "named-sel-line", type: "line", source: "named-shapes", filter: ["in", ["get", "iso3"], ["literal", []]], paint: { "line-color": "#f0ece4", "line-width": 0.9, "line-opacity": 0.75 } });
  IDS.push("named-all-fill", "named-sel-fill", "named-sel-line"); order();
}
const RAMP = ["#33405a", "#4a6185", "#6f88ad", "#a3b6d3"];
function drawCountries() {
  if (!map.getLayer("named-sel-fill")) return;
  const o = S.sel == null ? null : orgs[S.sel], iso = o && NAMED[o.name] ? NAMED[o.name].iso : [];
  const f = ["in", ["get", "iso3"], ["literal", iso]];
  map.setFilter("named-sel-fill", f); map.setFilter("named-sel-line", f);

  const keys = Object.keys(cnt);

  if (keys.length) {
    const col = ["match", ["get", "iso3"]]; keys.forEach((c) => col.push(c, RAMP[Math.min(cnt[c], 4) - 1])); col.push("#33405a");

}

/* ---------- the key ---------- */

  const sample = (k, ev, act) => swatch({ category: k, evidenceLevel: ev, status: act ? "Active" : "Defunct" }, 13);
  $("#keyBody").innerHTML =
    '<div class="psec">Time</div>' +
    '<label class="chk"><input type="checkbox" id="allY" checked> Every year, ' + YMIN + '–' + YMAX + '</label>' +
    '<div class="tline"><button type="button" class="btn" id="play" title="Play through the years">▶</button><input type="range" id="yr" min="' + YMIN + '" max="' + YMAX + '" step="1" value="2025" aria-label="Year"><b id="yrv">all</b></div>' +
    '<div id="cnt"></div>' +
    '<div class="sub">Ring size: power index (0–100) in the chosen year, or the highest it reached when every year is shown.</div>' +
    '<div class="psec">Kind</div>' +
    KINDS.map((k) => '<div class="row"><input type="checkbox" id="k_' + evSlug(k[0]) + '" data-kind="' + esc(k[0]) + '" checked><label for="k_' + evSlug(k[0]) + '" class="lg">' + sample(k[0], "Confirmed") + esc(k[0]) + ' <span class="n">' + kc(k[0]) + '</span><div class="bar"><i style="width:' + (100 * kc(k[0]) / maxK) + '%;background:' + k[1] + '"></i></div></label></div>').join("") +
    '<div class="psec">Evidence</div>' +
    EVID.map((e) => '<div class="row"><input type="checkbox" id="e_' + evSlug(e[0]) + '" data-ev="' + esc(e[0]) + '" checked><label for="e_' + evSlug(e[0]) + '" class="lg">' + sample("Masonic", e[0]) + esc(e[0]) + ' <span class="n">' + evc(e[0]) + ' · ' + e[1] + '</span></label></div>').join("") +
    '<div class="psec">Status today</div>' +
    ["Active", "Defunct"].map((s) => '<div class="row"><input type="checkbox" id="s_' + s + '" data-st="' + s + '" checked><label for="s_' + s + '" class="lg">' + sample("Masonic", "Confirmed", s === "Active") + s + ' <span class="n">' + stc(s) + (s === "Active" ? " · outer hairline" : "") + '</span></label></div>').join("") +
    '<div class="psec">The 25 organizations</div>' +
    '<input id="wfilter" type="search" placeholder="Find by name, person or place">' +
    '<div id="olist" class="scroll"></div>' +
    '<div class="sub">' + [...NOPIN].map(esc).join(", ") + ': the database gives "Multiple locations" as the origin, so they have no mark on the map. Choosing one shows any countries its entry names.</div>';
  $("#keyBody").querySelectorAll("[data-kind]").forEach((c) => c.addEventListener("change", () => { c.checked ? S.kinds.add(c.dataset.kind) : S.kinds.delete(c.dataset.kind); update(); }));
  $("#keyBody").querySelectorAll("[data-ev]").forEach((c) => c.addEventListener("change", () => { c.checked ? S.evid.add(c.dataset.ev) : S.evid.delete(c.dataset.ev); update(); }));
  $("#keyBody").querySelectorAll("[data-st]").forEach((c) => c.addEventListener("change", () => { c.checked ? S.status.add(c.dataset.st) : S.status.delete(c.dataset.st); update(); }));
  $("#allY").addEventListener("change", (e) => { S.all = e.target.checked; stopPlay(); update(); });
  $("#yr").addEventListener("input", (e) => { S.year = +e.target.value; S.all = false; update(); });
  $("#play").addEventListener("click", () => playing ? stopPlay() : startPlay());
  $("#wfilter").addEventListener("input", (e) => { S.q = e.target.value.trim().toLowerCase(); drawList(); });

let playing = null;
function startPlay() {
  if (S.all || S.year >= YMAX) S.year = YMIN;

}

/* small line drawings for the card */
function spark(o, k) {
  const tl = k === "power" ? o.powerTimeline : k === "members" ? o.membershipTimeline : o.secrecyTimeline;
  const key = k === "power" ? "power" : k === "members" ? "members" : "level";
  const W = 240, H = 44, x0 = o.founded, x1 = Math.max(lastYear(o), tl[tl.length - 1].year, x0 + 1);
  const vs = tl.map((p) => p[key]);
  let Y;
  if (k === "members") { const lo = Math.log10(Math.max(1, Math.min(...vs.filter((v) => v > 0)))), hi = Math.log10(Math.max(...vs, 10)); Y = (v) => 36 - (v <= 0 ? 0 : (Math.log10(v) - lo) / Math.max(1e-6, hi - lo)) * 30; }
  else { const mx = k === "power" ? 100 : 5; Y = (v) => 36 - v / mx * 30; }
  const X = (y) => 4 + (y - x0) / (x1 - x0) * (W - 8);
  const c = KC[o.category].hi;
  let d = "";
  tl.forEach((p, j) => { const x = X(p.year), y = Y(p[key]); if (!j) d += "M" + x + " " + y; else if (k === "secrecy") d += "H" + x + "V" + y; else d += "L" + x + " " + y; });
  if (k === "secrecy") d += "H" + X(x1);
  const dots = tl.map((p) => '<circle cx="' + X(p.year) + '" cy="' + Y(p[key]) + '" r="2" fill="' + c + '"><title>' + p.year + ": " + (k === "secrecy" ? SECL[p[key]] : fmt(p[key])) + '</title></circle>').join("");
  const yl = !S.all && alive(o, S.year) ? '<line x1="' + X(S.year) + '" x2="' + X(S.year) + '" y1="2" y2="38" stroke="rgba(255,255,255,.35)" stroke-dasharray="2 2"/>' : "";
  const first = tl[0], last = tl[tl.length - 1], lab = (p) => k === "secrecy" ? SECL[p[key]] : k === "members" ? short(p[key]) : p[key];
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"><line x1="4" x2="' + (W - 4) + '" y1="38" y2="38" stroke="rgba(255,255,255,.08)"/>' + yl + '<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="1.6" vector-effect="non-scaling-stroke"/>' + dots + '</svg>' +
    '<div></div><div style="display:flex;justify-content:space-between;font-size:10.5px;margin-top:-4px"><span>' + first.year + ' · ' + lab(first) + '</span><span>' + last.year + ' · ' + lab(last) + '</span></div>';
}
function detail(i) {
  const o = orgs[i], nm = NAMED[o.name];
  const ys = [...new Set([...o.powerTimeline, ...o.membershipTimeline, ...o.secrecyTimeline].map((p) => p.year))].sort((a, b) => a - b);
  const g = (tl, k, y) => { const p = tl.find((q) => q.year === y); return p ? p[k] : null; };
  const place = NOPIN.has(o.name) ? esc(o.origin.name) + ' <span class="mute">(the database\'s stand-in point, ' + o.origin.lat + '°, ' + o.origin.lng + '°, is not drawn)</span>'
    : esc(o.origin.name) + ' <span class="mute">· ' + Math.abs(o.origin.lat).toFixed(2) + '°' + (o.origin.lat >= 0 ? "N" : "S") + ' ' + Math.abs(o.origin.lng).toFixed(2) + '°' + (o.origin.lng >= 0 ? "E" : "W") + '</span>';
  $("#detBody").innerHTML =
    '<div class="hp-k">' + esc(o.category) + ' · ' + esc(o.type) + '</div>' +
    '<h3>' + esc(o.name) + '</h3>' +
    '<div class="hp-sub">' + years(o) + ' · ' + esc(o.status) + '</div>' +
    '<table class="kv"><tr><th>Origin</th><td>' + place + '</td></tr>' +
    '<tr><th>Founded</th><td>' + o.founded + '</td></tr>' +
    '<tr><th>Dissolved</th><td>' + (o.dissolved == null ? '<span class="mute">—</span>' : o.dissolved) + '</td></tr>' +
    '<tr><th>Reach</th><td>' + esc(o.reach) + '</td></tr>' +
    '<tr><th>Secrecy</th><td>' + esc(o.secrecy) + '</td></tr>' +
    '<tr><th>Evidence</th><td>' + esc(o.evidenceLevel) + '</td></tr>' +
    '<tr><th>Notable figures</th><td>' + esc(o.notableFigures) + '</td></tr></table>' +
    '<p class="hp-desc">' + esc(o.description) + '</p>' +
    '<div class="hp-h">Over its years</div>' +
    '<div class="spk"><span>Power index</span><div>' + spark(o, "power") + '</div>' +
    '<span>Members</span><div>' + spark(o, "members") + '</div>' +
    '<span>Secrecy</span><div>' + spark(o, "secrecy") + '</div></div>' +
    '<details><summary>Every recorded figure</summary><table class="rec"><tr><th>Year</th><th>Power</th><th>Members</th><th>Secrecy</th></tr>' +
    ys.map((y) => { const p = g(o.powerTimeline, "power", y), m = g(o.membershipTimeline, "members", y), s = g(o.secrecyTimeline, "level", y); return '<tr><td>' + y + '</td><td>' + (p == null ? "" : p) + '</td><td>' + (m == null ? "" : fmt(m)) + '</td><td>' + (s == null ? "" : s + " · " + SECL[s]) + '</td></tr>'; }).join("") + '</table></details>' +
    (nm ? '<div class="hp-h">Countries the entry names</div><div class="chips">' + nm.names.split(/, (?![^(]*\))/).map((c) => '<span>' + esc(c) + '</span>').join("") + '</div><div class="sub">Shaded on the map.</div>' : '') +
    '<div class="hp-src">From the International Military Secret Societies database (compiled December 2025). It does not give a source for each entry, or say how the power index and secrecy levels were scored.</div>';
  $("#det").scrollTop = 0;
}
function select(i, fly) {
  S.sel = i; $("#det").classList.add("open"); document.body.classList.add("detopen"); detail(i);
  drawMarkers(); drawCountries(); drawList(); drawCharts();
  if (!fly) return;
  const o = orgs[i];
  if (NOPIN.has(o.name)) { wholeWorld(); return; }
  requestAnimationFrame(() => map.flyTo({ center: [o.origin.lng, o.origin.lat], zoom: Math.max(map.getZoom(), 3.2), padding: pad(), duration: 900 }));

}
function drawCombined(w) {
  const body = w.body;
  body.innerHTML = '<div class="cwrap"><svg class="csvg zoomable"></svg><div class="cfoot">Worked out from the 25 entries; the filters in the key apply. Between an organization\'s recorded years its figure is read off a straight line; before its first or after its last record, the nearest recorded figure is used. Secrecy holds at each recorded level until the next change.</div></div>';
  const svg = body.querySelector("svg"), W = svg.clientWidth, H = svg.clientHeight;
  if (W < 80 || H < 120) return;
  const [x0, x1] = w.range, D = combinedSeries(x0, x1);
  const m = { l: 54, r: 14, t: 6, b: 22 }, gap = 8;
  const X = (y) => m.l + (y - x0) / (x1 - x0) * (W - m.l - m.r), Xi = (px) => x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);
  w.geo = { el: svg, l: m.l, r: W - m.r };
  const P = [
    ["n", "Organizations at work", (v) => String(Math.round(v)), true],
    ["mem", "Combined membership", short, false],
    ["pow", "Average power index of those at work", (v) => v.toFixed(0), false],
    ["sec", "Average secrecy level of those at work (1 Low – 5 Total)", (v) => v.toFixed(1), false],
  ];
  const ph = (H - m.t - m.b - gap * (P.length - 1)) / P.length;
  let h = "";
  const scales = [];
  P.forEach(([k, title, lab, step], j) => {
    const top = m.t + j * (ph + gap), vals = D.map((d) => d[k]).filter((v) => v != null);
    let lo = 0, hi = Math.max(1, ...vals);
    if (k === "pow") hi = 100; if (k === "sec") { lo = 0; hi = 5; }
    if (k === "n") hi = Math.max(1, Math.ceil(hi)); if (k === "mem") hi = niceCeil(hi);
    const Y = (v) => top + 14 + (1 - (v - lo) / (hi - lo)) * (ph - 16);
    scales.push({ k, Y, lab, top });
    h += '<text x="' + m.l + '" y="' + (top + 9) + '" class="pt">' + esc(title) + '</text>';
    h += '<line class="gl" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(lo) + '" y2="' + Y(lo) + '"/><line class="gl" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(hi) + '" y2="' + Y(hi) + '"/>';
    h += '<text x="' + (m.l - 6) + '" y="' + (Y(hi) + 3.5) + '" text-anchor="end">' + lab(hi) + '</text><text x="' + (m.l - 6) + '" y="' + (Y(lo) + 3.5) + '" text-anchor="end">' + lab(lo) + '</text>';
    let d = "", area = "", open = false, first = null, prev = null;
    D.forEach((p) => {
      const v = p[k];
      if (v == null) { if (open) { area += "L" + prev + " " + Y(lo) + "L" + first + " " + Y(lo) + "Z"; open = false; } return; }
      const x = X(p.y), yv = Y(v);
      if (!open) { d += "M" + x + " " + yv; area += "M" + x + " " + Y(lo) + "L" + x + " " + yv; first = x; open = true; }
      else if (step) { d += "H" + x + "V" + yv; area += "H" + x + "V" + yv; }
      else { d += "L" + x + " " + yv; area += "L" + x + " " + yv; }
      prev = x;
    });
    if (open) area += "L" + prev + " " + Y(lo) + "L" + first + " " + Y(lo) + "Z";
    h += '<path d="' + area + '" class="ar"/><path d="' + d + '" class="cl"/>';
  });
  axisYears(x0, x1).forEach((y) => { h += '<text x="' + X(y) + '" y="' + (H - 6) + '" text-anchor="middle">' + y + '</text>'; });
  if (!S.all) h += '<line class="yl" x1="' + X(S.year) + '" x2="' + X(S.year) + '" y1="' + m.t + '" y2="' + (H - m.b) + '"/>';
  h += '<line class="xh" x1="0" x2="0" y1="' + m.t + '" y2="' + (H - m.b) + '" style="display:none"/>';
  svg.innerHTML = h;
  const xh = svg.querySelector(".xh");
  svg.addEventListener("mousemove", (e) => {
    const r = svg.getBoundingClientRect(), mx = e.clientX - r.left;
    if (w.panning || mx < m.l || mx > W - m.r) { xh.style.display = "none"; return tip(null); }
    const y = Math.round(Xi(mx)), p = D.find((d) => d.y === y);
    if (!p) { xh.style.display = "none"; return tip(null); }
    xh.setAttribute("x1", X(y)); xh.setAttribute("x2", X(y)); xh.style.display = "";
    tip('<b>' + y + '</b><br>' + p.n + ' at work<br>' + fmt(Math.round(p.mem)) + ' members combined' + (p.pow == null ? "" : '<br>average power ' + p.pow.toFixed(1) + '<br>average secrecy ' + p.sec.toFixed(2)), e.clientX, e.clientY);
  });
  svg.addEventListener("mouseleave", () => { xh.style.display = "none"; tip(null); });
  svg.addEventListener("click", (e) => { if (w.noClick) return; const r = svg.getBoundingClientRect(), mx = e.clientX - r.left; if (mx >= m.l && mx <= W - m.r) setYearAt(Xi(mx)); });
}

/* organization types: the original ring chart, with the other counts beside it */
function drawKinds(body) {
  const shown = orgs.filter(passes);
  const block = (h, items, fn, colr) => { const mx = Math.max(1, ...items.map((it) => fn(orgs, it))); return '<div><div class="h">' + h + '</div>' + items.map((it) => { const n = fn(orgs, it), ns = fn(shown, it); return '<div class="mini"><span>' + esc(it) + '</span><div class="b"><i style="width:' + (100 * n / mx) + '%;background:' + colr(it) + '"></i></div><span title="' + ns + ' shown">' + n + '</span></div>'; }).join("") + '</div>'; };
  const types = [...new Set(orgs.map((o) => o.type))].sort();
  // ring chart by kind
  const counts = KINDS.map((k) => [k, orgs.filter((o) => o.category === k[0]).length]);
  const R = 74, r0 = 50, cx = 90, cy = 90; let a = -Math.PI / 2, arcs = "";
  counts.forEach(([k, n]) => {
    const da = n / orgs.length * Math.PI * 2, a2 = a + da, g = 0.012, s = a + g, e = a2 - g, big = e - s > Math.PI ? 1 : 0;
    const p = (rr, t) => (cx + rr * Math.cos(t)).toFixed(2) + " " + (cy + rr * Math.sin(t)).toFixed(2);
    arcs += '<path class="arc" data-k="' + esc(k[0]) + '" data-n="' + n + '" d="M' + p(R, s) + 'A' + R + ' ' + R + ' 0 ' + big + ' 1 ' + p(R, e) + 'L' + p(r0, e) + 'A' + r0 + ' ' + r0 + ' 0 ' + big + ' 0 ' + p(r0, s) + 'Z" fill="' + k[1] + '" stroke="' + k[2] + '" stroke-width=".7"/>';
    a = a2;
  });
  body.innerHTML = '<div class="kwrap"><div class="ring"><svg viewBox="0 0 180 180" width="180" height="180">' + arcs + '<text x="90" y="88" text-anchor="middle" class="big">25</text><text x="90" y="104" text-anchor="middle">organizations</text></svg>' +
    '<div class="rl">' + counts.map(([k, n]) => '<div><i style="background:' + k[1] + ';border-color:' + k[2] + '"></i>' + esc(k[0]) + ' <span class="mute">' + n + ' · ' + Math.round(100 * n / orgs.length) + '%</span></div>').join("") + '</div></div>' +
    '<div class="kinds">' +
    block("Evidence", EVID.map((e) => e[0]), (a2, e) => a2.filter((o) => o.evidenceLevel === e).length, () => "#6f7a95") +
    block("Status", [...new Set(orgs.map((o) => o.status))], (a2, s) => a2.filter((o) => o.status === s).length, () => "#6f7a95") +
    block("Secrecy (as listed)", ["Total", "High", "Moderate", "Partial"], (a2, s) => a2.filter((o) => o.secrecy === s).length, () => "#6f7a95") +
    block("Type, as each entry names it", types, (a2, t) => a2.filter((o) => o.type === t).length, (t) => KC[orgs.find((o) => o.type === t).category].col) +
    '</div></div>';
  body.querySelectorAll(".arc").forEach((p) => {
    p.addEventListener("mousemove", (e) => tip('<b>' + esc(p.dataset.k) + '</b><br><span class=mute>' + p.dataset.n + ' of 25</span>', e.clientX, e.clientY));
    p.addEventListener("mouseleave", () => tip(null));
  });
}
const COLS = [["name", "Organization"], ["category", "Kind"], ["type", "Type"], ["founded", "Founded"], ["dissolved", "Dissolved"], ["status", "Status"], ["origin", "Origin"], ["reach", "Reach"], ["secrecy", "Secrecy"], ["evidenceLevel", "Evidence"], ["peakP", "Peak power"], ["peakM", "Peak members"], ["notableFigures", "Notable figures"]];
function cell(o, k) { return k === "origin" ? o.origin.name : k === "peakP" ? peak(o.powerTimeline, "power") : k === "peakM" ? peak(o.membershipTimeline, "members") : o[k]; }
function drawTable(body) {
  const [sk, dir] = S.sort, rows = orgs.map((o, i) => [o, i]).filter(([o]) => passes(o));
  rows.sort((a, b) => { let x = cell(a[0], sk), y = cell(b[0], sk); if (x == null) x = 9999; if (y == null) y = 9999; return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * dir; });
  body.innerHTML = '<table class="all"><tr>' + COLS.map((c) => '<th data-k="' + c[0] + '">' + c[1] + (sk === c[0] ? (dir > 0 ? " ▴" : " ▾") : "") + '</th>').join("") + '</tr>' +
    rows.map(([o, i]) => '<tr class="r' + (S.sel === i ? " sel" : "") + '" data-i="' + i + '">' + COLS.map((c) => { const v = cell(o, c[0]); const num = ["founded", "dissolved", "peakP", "peakM"].includes(c[0]); return '<td' + (num ? ' class="num"' : "") + '>' + (c[0] === "name" ? swatch(o, 13) + " " : "") + (v == null ? '<span class="mute">—</span>' : esc(c[0] === "peakM" ? fmt(v) : v)) + '</td>'; }).join("") + '</tr>').join("") + '</table>' +
    (rows.length < orgs.length ? '<div class="sub" style="padding:6px">' + rows.length + ' of 25 shown; the filters in the key apply here too.</div>' : "");
  body.querySelectorAll("th[data-k]").forEach((th) => th.addEventListener("click", () => { S.sort = [th.dataset.k, S.sort[0] === th.dataset.k ? -S.sort[1] : 1]; drawTable(body); }));
  body.querySelectorAll("tr.r").forEach((tr) => tr.addEventListener("click", () => select(+tr.dataset.i, true)));
}


/* ---------- the sky behind the globe and the flat map ---------- */
function stars() {
  let seed = 1977; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const W = 1400, H = 1000, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#03040a"; g.fillRect(0, 0, W, H);
  // faint dust clouds, kept dim and cool
  [[.22, .30, 520, "48,58,92", .10], [.78, .68, 600, "70,52,86", .08], [.58, .14, 420, "42,74,84", .06], [.10, .86, 380, "56,60,80", .07]].forEach(([x, y, r, rgb, a]) => {
    for (let k = 0; k < 2; k++) for (let dx = -W; dx <= W; dx += W) for (let dy = -H; dy <= H; dy += H) {
      const gr = g.createRadialGradient(x * W + dx, y * H + dy, 0, x * W + dx, y * H + dy, r);
      gr.addColorStop(0, "rgba(" + rgb + "," + a + ")"); gr.addColorStop(1, "rgba(" + rgb + ",0)");
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
    }
  });
  const tints = ["255,255,255", "214,224,255", "236,232,246", "224,236,240"];
  const dot = (x, y, r, a, t) => { for (const dx of [0, -W, W]) for (const dy of [0, -H, H]) { g.beginPath(); g.arc(x + dx, y + dy, r, 0, 7); g.fillStyle = "rgba(" + t + "," + a + ")"; g.fill(); } };
  for (let i = 0; i < 2600; i++) dot(rnd() * W, rnd() * H, .25 + rnd() * .55, .15 + rnd() * .55, tints[(rnd() * 4) | 0]);
  for (let i = 0; i < 90; i++) {
    const x = rnd() * W, y = rnd() * H, r = .8 + rnd() * .9, t = tints[(rnd() * 4) | 0];
    for (const dx of [0, -W, W]) for (const dy of [0, -H, H]) { const gr = g.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, r * 4); gr.addColorStop(0, "rgba(" + t + ",.35)"); gr.addColorStop(1, "rgba(" + t + ",0)"); g.fillStyle = gr; g.fillRect(x + dx - r * 4, y + dy - r * 4, r * 8, r * 8); }
    dot(x, y, r, .9, t);
  }
  const el = $("#map");
  el.style.background = '#03040a url(' + c.toDataURL("image/jpeg", .9) + ') repeat';
  el.style.backgroundSize = W + "px " + H + "px";
  // the sky drifts a little as the map moves
  const drift = () => { const ct = map.getCenter(), z = map.getZoom(); el.style.backgroundPosition = Math.round(-ct.lng * 3) + "px " + Math.round(ct.lat * 3 + z * 6) + "px"; };
  map.on("move", drift); drift();
}

/* ---------- everything that changes together ---------- */
function update() {
  const yr = $("#yr"); if (yr) { yr.value = S.year; $("#yrv").textContent = S.all ? "all" : S.year; $("#allY").checked = S.all; }
  const pinned = orgs.filter((o) => !NOPIN.has(o.name) && onMap(o)).length, other = orgs.filter((o) => NOPIN.has(o.name) && passes(o) && (S.all || alive(o, S.year))).length;
  $("#cnt").textContent = (S.all ? "Every year: " : "In " + S.year + ": ") + (pinned + other) + " of 25 at work" + (other ? " (" + other + " not on the map)" : "") + ".";
  drawMarkers(); drawCountries(); drawList(); drawCharts();
  if (S.sel != null) detail(S.sel);
}
