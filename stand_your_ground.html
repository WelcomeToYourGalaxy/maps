 be unreasonable. The sections of the Canadian criminal code that deal with self-defence or defence of property are sections 34 and 35, respectively. In Ontario, jurors are not permitted &quot;...to consider whether an accused could have retreated from his or her own home in the face of an attack (or threatened attack) by an assailant in assessing the elements of self-defence.&quot; In British Columbia, courts will permit juries to consider available lines of retreat in deciding whether an accused had no other option than to defend himself; the option of retreat is not considered a categorical exclusion from self-defence.</p><div class=\"hp-src\">Wikipedia, \"Stand-your-ground law\", Jurisdictions section (text CC BY-SA 4.0, lightly shortened), read 17 October 2026. Drawn over the jurisdiction the article names.</div></div>"},{"name":"Alberta, Canada","shape":[[[[48.993,-109.999],[48.993,-114.063],[49.038,-114.057],[49.094,-114.133],[49.168,-114.19],[49.211,-114.355],[49.252,-114.386],[49.394,-114.565],[49.42,-114.588],[49.544,-114.577],[49.556,-114.681],[49.587,-114.734],[49.604,-114.737],[49.643,-114.686],[49.73,-114.643],[49.797,-114.638],[49.934,-114.685],[49.985,-114.651],[50.02,-114.652],[50.129,-114.716],[50.359,-114.789],[50.545,-114.993],[50.585,-115.091],[50.554,-115.206],[50.635,-115.305],[50.673,-115.298],[50.729,-115.347],[50.731,-115.399],[50.855,-115.634],[50.869,-115.64],[50.909,-115.588],[50.962,-115.619],[51.07,-115.794],[51.102,-115.94],[51.13,-115.998],[51.23,-116.042],[51.323,-116.25],[51.348,-116.279],[51.448,-116.31],[51.497,-116.377],[51.544,-116.411],[51.651,-116.567],[51.758,-116.634],[51.791,-116.674],[51.8,-116.718],[51.789,-116.758],[51.771,-116.791],[51.715,-116.83],[51.714,-116.913],[51.886,-117.037],[52.047,-117.245],[52.156,-117.32],[52.142,-117.587],[52.233,-117.788],[52.272,-117.822],[52.353,-117.735],[52.383,-117.732],[52.395,-117.758],[52.43,-117.883],[52.486,-118.002],[52.413,-118.06],[52.386,-118.221],[52.409,-118.243],[52.441, sonable. The sections of the Canadian criminal code that deal with self-defence or defence of property are sections 34 and 35, respectively. In Ontario, jurors are not permitted &quot;...to consider whether an accused could have retreated from his or her own home in the face of an attack (or threatened attack) by an assailant in assessing the elements of self-defence.&quot; In British Columbia, courts will permit juries to consider available lines of retreat in deciding whether an accused had no other option than to defend himself; the option of retreat is not considered a categorical exclusion from self-defence.</p><div class=\"hp-src\">Wikipedia, \"Stand-your-ground law\", Jurisdictions section (text CC BY-SA 4.0, lightly shortened), read 17 October 2026. Drawn over the jurisdiction the article names.</div></div>"},{"name":"Czech Republic","shape":[[[[50.858,14.81],[50.859,14.982],[50.959,14.997],[50.993,14.961],[51.021,15.004],[50.981,15.108],[51.012,15.144],[50.978,15.17],[50.977,15.227],[50.953,15.27],[50.9,15.256],[50.855,15.288],[50.832,15.341],[50.775,15.356],[50.8,15.442],[50.756,15.642],[50.731,15.684],[50.743,15.792],[50.675,15.848],[50.688,15.941],[50.679,15.971],[50.636,15.999],[50.604,15.982],[50.609,16.024],[50.647,16.086],[50.624,16.175],[50.661,16.232],[50.644,16.332],[50.568,16.426],[50.559,16.394],[50.522,16.391],[50.493,16.353],[50.493,16.288],[50.451,16.211],[50.437,16.218],[50.44,16.198],[50.424,16.19],[50.406,16.2],[50.403,16.232],[50.364,16.262],[50.37,16.344],[50.318,16.371],[50.298,16.438],[50.208,16.535],[50.142,16.567],[50.093,16.661],[50.095,16.701],[50.187,16.818],[50.192,16.881],[50.217,16.919],[50.213,16.955],[50.232,16.96],[50.218,17.015],[50.285,16.988],[50.319,16.927],[50.408,16.866],[50.422,16.866],[50.433,16.893],[50.377,17.132],[50.378,17.188],[50.336,17.211],[50.313,17.337],[50.308,17.319],[50.26,17.342],[50.273,17.388],[50.241,17.424],[50.266,17.469],[50.262,17.63],[50.312,17.685],[50.311,17.708],[50.289,17.734],[50.253,17.719 4.633],[53.285,-4.677],[53.31,-4.694],[53.324,-4.667],[53.317,-4.619],[53.285,-4.581],[53.242,-4.564]]]],"popup":"<div class=\"hp\"><div class=\"hp-k\">Self-defense law · duty to retreat</div><h3>England and Wales</h3><p>The common law jurisdiction of England and Wales has a stand-your-ground law rooted in the common law defense of using reasonable force in self-defense. There is no duty to retreat before a person may use reasonable force against an attacker, but one who chooses not to retreat, when retreat would be a safe and easy option, might find it harder to justify his use of force as &#x27;reasonable&#x27;. In the home, force used against an intruder is not to be regarded as reasonable if it is &#x27;grossly disproportionate&#x27;.</p><div class=\"hp-src\">Wikipedia, \"Stand-your-ground law\", Jurisdictions section (text CC BY-SA 4.0, lightly shortened), read 17 October 2026. Drawn over the jurisdiction the article names.</div></div>"},{"name":"France","shape":[[[[2.161,-54.189],[2.155,-54.314],[2.197,-54.374],[2.214,-54.477],[2.269,-54.546],[2.279,-54.549],[2.283,-54.526],[2.3,-54.544],[2.326,-54.615],[2.348,-54.585],[2.34,-54.532],[2.417,-54.493],[2.436,-54.423],[2.484,-54.376],[2.678,-54.285],[2.853,-54.17],[2.877,-54.191],[2.956,-54.163],[2.998,-54.185],[3.011,-54.169],[3.059,-54.191],[3.073,-54.177],[3.117,-54.177],[3.131,-54.188],[3.127,-54.211],[3.201,-54.177],[3.31,-54.08],[3.378,-54.056],[3.415,-54.019],[3.611,-53.989],[3.641,-54.018],[3.635,-54.05],[3.789,-54.126],[3.815,-54.187],[4.042,-54.354],[4.132,-54.335],[4.152,-54.339],[4.178,-54.395],[4.209,-54.411],[4.27,-54.394],[4.376,-54.433],[4.484,-54.451],[4.604,-54.423],[4.709,-54.435],[4.755,-54.479],[4.903,-54.487],[4.937,-54.451],[5.024,-54.449],[5.156,-54.344],[5.226,-54.311],[5.348,-54.171],[5.381,-54.107],[5.437,-54.061],[5.558,-54.007],[5.661,-53.992],[5.745,-53.934],[5.715,-53.808],[5.732,-53.832],[5.731,-53.81],[5.572,-53.495],[5.538,-53.277],[5.495,-53.23],[5.502,-53.208],[5.514,-53.208],[ const map = window.sygMap = L.map("map", { worldCopyJump: true, minZoom: 2, maxZoom: 16, zoomControl: false, preferCanvas: true }).setView([38, -60], 3);
L.control.zoom({ position: "bottomright" }).addTo(map);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  attribution: 'Basemap &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors, and the GIS user community', maxZoom: 16
}).addTo(map);
map.createPane("labels"); map.getPane("labels").style.zIndex = 450; map.getPane("labels").style.pointerEvents = "none";
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", { pane: "labels", maxZoom: 16, opacity: 0.85 }).addTo(map);
const cv = L.canvas({ padding: 0.3 });

// Teal for no duty to retreat, deepening blue the more the duty to retreat applies.
const COL = { statute: "#2f8f9d", judicial: "#57aebb", middle: "#8fbfcd", homeveh: "#6b8fcf", homework: "#4568ad", home: "#2c4683", none: "#5b6371", other: "#7a86b8" };
const ORDER = ["statute", "judicial", "middle", "homeveh", "homework", "home", "none"];
const parts = {};
ORDER.forEach((c) => { parts[c] = { g: L.layerGroup(), label: D.sygCats[c] + " (United States)", n: 0 }; });
parts.other = { g: L.layerGroup(), label: "Self-defense and the duty to retreat in other countries", n: 0 };

D.syg.forEach((r) => {
  const l = L.polygon(r.shape, { renderer: cv, color: "#0c1118", weight: 0.8, fillColor: COL[r.cat], fillOpacity: 0.78 });
  l.bindPopup(r.popup, { maxWidth: 420 });
  l.bindTooltip(esc(r.name) + " · " + esc(D.sygCats[r.cat]), { sticky: true });
  parts[r.cat].g.addLayer(l); parts[r.cat].n++;
});
// Alberta after Canada, so its own shape is the one clicked inside it.
D.sd.slice().sort((a, b) => (a.name === "Alberta, Canada") - (b.name === "Alberta, Canada")).forEach((r) => {
  const l = L.polygon(r.shape, { renderer: cv, color: "#0c1118", weight: 0.8, fillColor: COL.other, fillOpacity: r.name === "Alberta, Canada" ? 0.85 : 0.6 });
  l.bindPopup(r.popup, { maxWidth: 420 });
  l.bindTooltip(esc(r.name), { sticky: true });
  parts.other.g.addLayer(l); parts.other.n++;
});

const overlays = {};
Object.keys(parts).forEach((k) => { overlays[parts[k].label] = parts[k].g; parts[k].g.addTo(map); });
const layerControl = L.control.layers(null, overlays, { collapsed: true });

const box = document.getElementById("keyBody");
box.innerHTML = Object.keys(parts).map((k) =>
  '<div class="row"><input type="checkbox" id="p_' + k + '" checked><label for="p_' + k + '"><span class="sw" style="background:' + COL[k] + '"></span>' + esc(parts[k].label) +
  '<div class="n">' + parts[k].n + (k === "other" ? " countries and provinces" : parts[k].n === 1 ? " jurisdiction" : " jurisdictions") + '</div></label></div>').join("");
Object.keys(parts).forEach((k) => document.getElementById("p_" + k).addEventListener("change", (e) => { if (e.target.checked) parts[k].g.addTo(map); else map.removeLayer(parts[k].g); }));
if (window.innerWidth <= 720) { document.getElementById("key").classList.add("min"); document.getElementById("toggleKey").textContent = "+"; }
document.getElementById("toggleKey").addEventListener("click", () => { const p = document.getElementById("key"); p.classList.toggle("min"); document.getElementById("toggleKey").textContent = p.classList.contains("min") ? "+" : "−"; });

const info = document.getElementById("info");
info.innerHTML =
  '<h2>What the colours mean</h2>' +
  '<p>"A stand-your-ground law, sometimes called a “line in the sand” or “no duty to retreat” law, provides that people may use deadly force when they reasonably believe it to be necessary to defend against certain violent crimes. Under such a law, people have no duty to retreat before using deadly force in self-defense, so long as they are in a place where they are lawfully present." Where there is a duty to retreat, "even a person who is unlawfully attacked ... may not use deadly force if it is possible to instead avoid the danger with complete safety by retreating." Even those places generally follow the castle doctrine: no duty to retreat at home, and in some places in a vehicle or workplace. <span class="mute">(Wikipedia, Stand-your-ground law.)</span></p>' +
  '<p>"Every state in the United States allows the use of deadly force against imminent deadly force, great bodily injury, and likely kidnapping or rape; some also allow it against threat of robbery and burglary." <span class="mute">(Same article.)</span></p>' +
  '<h2>From the Destruction page</h2>' +
  '<p>"You\'re not guilty of a crime if you use reasonable force against someone to resist or to aid in resisting an offense against somebody. The legal excuse of self defense though is only available if you\'re acting honestly and in good faith. This includes the duty to retreat or to avoid the danger if reasonably possible. If a defendant\'s use of deadly force or the amount of force is interpreted as unreasonable, the Doctrine of Imperfect Self-Defense may apply. “By negating the element of malice and reducing a murder charge to manslaughter in that way, imperfect self defense is a partial defense”" (footnote 1.12).</p>' +
  '<h2>What studies found</h2>' +
  '<p>A 2020 RAND Corporation review: "There is supportive evidence that stand-your-ground laws are associated with increases in firearm homicides and moderate evidence that they increase the total number of homicides." A 2013 Urban Institute paper on FBI data found that in stand-your-ground states, the defense was found justified 17 percent of the time when a white person shot a black person, and 1 percent of the time when a black person shot a white person. <span class="mute">(As the Wikipedia article reports them.)</span></p>' +
  '<h2>Sources</h2><ul>' +
  '<li>Wikipedia, <a href="https://en.wikipedia.org/wiki/Stand-your-ground_law" target="_blank" rel="noopener">Stand-your-ground law</a>: its United States section and map legend for each state and territory, and its Jurisdictions section for the other countries (text CC BY-SA 4.0), read 17 October 2026. The article cites state statutes, case law and pattern jury instructions.</li>' +
  '<li>Welcome to Your Galaxy, Destruction page, section (1) Of individuals, footnote 1.12.</li>' +
  '<li>Shapes: Natural Earth (public domain). Basemap: Esri World Dark Gray Canvas.</li></ul>' +
  '<p class="mute">Not shown: countries the article does not cover. It has no worldwide map, and the page notes none could be found.</p>';
const btn = document.getElementById("infoBtn");
const toggle = () => info.classList.toggle("open");
btn.addEventListener("click", toggle);
btn.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
})();
</script>
</body>
</html>
