<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Global Sanctions &amp; Designation Lists</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
#wtyg,#wtyg *{margin:0;padding:0;box-sizing:border-box}
#wtyg{position:relative;width:100%;height:88vh;min-height:560px;overflow:hidden;background:#0d1013;
 color:#d7d3cc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.45}
#wtyg #map{position:absolute;inset:0}
#wtyg #pts{position:absolute;inset:0;pointer-events:none}
#wtyg .pnl{position:absolute;top:12px;left:12px;width:330px;max-height:calc(100% - 24px);z-index:20;
 background:rgba(18,21,25,.95);border:1px solid #333a41;border-radius:4px;display:flex;flex-direction:column;backdrop-filter:blur(4px)}
#wtyg .hd{padding:12px 14px 11px;border-bottom:1px solid #2c3339}
#wtyg .hd h2{font-size:14px;font-weight:600;color:#e8e4dc}
#wtyg .idx{display:flex;flex-wrap:wrap;gap:4px 6px;margin:7px 0 2px}
#wtyg .idx a{font-size:10px;color:#8a94a6;cursor:pointer;border-bottom:1px dotted #4a535c;padding-bottom:1px}
#wtyg .idx a:hover{color:#d7d3cc;border-bottom-color:#8a94a6}
#wtyg .res{margin-top:8px}
#wtyg .res:not(:empty){border-top:1px solid #2c3339;padding-top:7px}
#wtyg .rh{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#7f796f;margin-bottom:5px}
#wtyg .ri{padding:5px 6px;margin:0 -6px;border-radius:3px;cursor:pointer;border-bottom:1px solid #22282e}
#wtyg .ri:hover{background:#1d232a}
#wtyg .ri b{display:block;font-size:11.5px;color:#ddd8d0;font-weight:600}
#wtyg .ri span{font-size:10px;color:#847e76}
#wtyg .intro{font-size:11.5px;color:#a49e95;margin:0 0 11px}
#wtyg .intro p{margin-top:6px}
#wtyg .intro b{color:#c6c0b7;font-weight:600}
#wtyg .more{color:#8fa0bf;cursor:pointer;text-decoration:underline;font-size:11px}
#wtyg .stat{font-size:11.5px;color:#9a948b;margin-top:8px}
#wtyg .stat b{color:#d4cec5;font-weight:600}
#wtyg .bd{overflow-y:auto;padding:10px 14px 16px;flex:1}
#wtyg .pnl:after{content:'';position:absolute;left:1px;right:1px;bottom:1px;height:46px;border-radius:0 0 4px 4px;
 pointer-events:none;opacity:1;transition:opacity .25s;
 background:linear-gradient(to bottom,rgba(18,21,25,0) 0%,rgba(18,21,25,.82) 62%,rgba(18,21,25,.97) 100%)}
#wtyg .pnl.atend:after{opacity:0}
#wtyg .pnl:before{content:'more below \25bc';position:absolute;left:0;right:0;bottom:7px;z-index:2;text-align:center;
 font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#8a8379;pointer-events:none;
 opacity:1;transition:opacity .25s}
#wtyg .pnl.atend:before{opacity:0}
#wtyg .bd::-webkit-scrollbar{width:8px}#wtyg .bd::-webkit-scrollbar-thumb{background:#3a4249;border-radius:4px}
#wtyg input[type=text]{width:100%;padding:6px 8px;background:#1b2025;border:1px solid #3a4249;border-radius:3px;color:#ded9d1;font:inherit;font-size:12px}
#wtyg input[type=text]:focus{outline:none;border-color:#5c6d94}
#wtyg .sec{margin-top:15px}
#wtyg .sec>h3{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#7f796f;margin-bottom:7px;font-weight:600}
#wtyg label{display:flex;align-items:flex-start;gap:7px;padding:3px 0;cursor:pointer;font-size:12px;color:#bdb7ae}
#wtyg label:hover{color:#e8e4dc}
#wtyg input[type=checkbox]{accent-color:#5c6d94;width:13px;height:13px;flex:none;margin-top:2px;cursor:pointer}
#wtyg .dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:4px}
#wtyg .n{font-size:10px;color:#6f6a63;margin-left:auto;padding-left:7px;font-variant-numeric:tabular-nums;flex:none}
#wtyg .grp{border-bottom:1px solid #262c32}
#wtyg .gh{display:flex;align-items:center;gap:7px;padding:4px 0;cursor:pointer}
#wtyg .gh .nm{flex:1;font-size:12px;color:#cfc9c0;font-weight:500}
#wtyg .car{font-size:9px;color:#6e6961;width:9px;flex:none}
#wtyg .gl{display:none;padding:2px 0 6px 16px}
#wtyg .grp.open .gl{display:block}
#wtyg .gl label{font-size:11px;color:#a8a29a}
#wtyg .btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#wtyg button{background:#232a30;border:1px solid #3a4249;color:#bdb7ae;padding:4px 9px;border-radius:3px;font:inherit;font-size:11px;cursor:pointer}
#wtyg button:hover{background:#2c343b;color:#e8e4dc}
#wtyg .note{font-size:10.5px;color:#7f796f;margin-top:13px;padding-top:11px;border-top:1px solid #262c32}
#wtyg .note a{color:#8fa0bf}
#wtyg .bm{position:absolute;right:12px;top:12px;z-index:20;background:rgba(18,21,25,.95);border:1px solid #333a41;border-radius:4px;padding:9px 11px}
#wtyg .bm h3{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#7f796f;margin-bottom:5px;font-weight:600}
#wtyg .bm label{font-size:11.5px;padding:2px 0;align-items:center}
#wtyg .bm input{accent-color:#8c6a5b;margin-top:0}
#wtyg .pop{position:absolute;z-index:40;width:370px;max-width:calc(100% - 24px);max-height:70%;background:rgba(16,19,23,.975);
 border:1px solid #3a4249;border-radius:4px;display:none;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#wtyg .ph{padding:10px 34px 10px 13px;border-bottom:1px solid #2c3339;position:relative}
#wtyg .ph strong{font-size:12.5px;color:#e8e4dc}#wtyg .ph span{display:block;font-size:10.5px;color:#8b857c;margin-top:2px}
#wtyg .x{position:absolute;top:6px;right:9px;cursor:pointer;color:#8b857c;font-size:19px;line-height:1}
#wtyg .x:hover{color:#ded9d1}
#wtyg .pb{overflow-y:auto;padding:4px 13px 13px}
#wtyg .ent{padding:10px 0;border-bottom:1px solid #242a30}#wtyg .ent:last-child{border-bottom:none}
#wtyg .en{font-size:12.5px;color:#e8e4dc;font-weight:600}
#wtyg .tags{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0}
#wtyg .tag{font-size:9.5px;padding:2px 6px;border-radius:2px;background:#262d34;color:#b0aaa2;border:1px solid #333a41}
#wtyg .f{font-size:11px;color:#a8a29a;margin:3px 0}#wtyg .f b{color:#857f76;font-weight:500}#wtyg .f a{color:#8fa0bf}
#wtyg .tag.tq{cursor:pointer}
#wtyg .tag.tq:after{content:'?';margin-left:4px;color:#6f6a63;font-size:8.5px;vertical-align:super}
#wtyg .tag.tq:hover{background:#2f373f;color:#e8e4dc}
#wtyg .gi{font-size:10.5px;line-height:1.5;color:#9d978f}
#wtyg .gi:not(:empty){margin:4px 0 6px;padding:7px 8px;background:#191f25;border-left:2px solid #4a535c;border-radius:0 3px 3px 0}
#wtyg .gi b{display:block;color:#ddd8d0;font-size:11px;font-weight:600;margin-bottom:2px}
#wtyg .gi a{color:#8fa0bf}
#wtyg .gx{color:#78726b;font-size:10px;line-height:1.45}
#wtyg .gx i{font-style:normal;color:#9a948c;font-weight:600}
#wtyg .gx a{color:#7e8da8}
#wtyg .gx2{color:#8d877f;font-style:italic}
#wtyg .f code{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;color:#b9b3ab;background:#1d2329;padding:1px 4px;border-radius:2px}
#wtyg .mine{margin:7px 0 2px;padding:6px 0 0;border-top:1px dashed #333a41}
#wtyg .mh{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:#6a645d;margin-bottom:4px}
#wtyg .mine .tag{cursor:pointer}
#wtyg .nb{color:#746e66;font-style:italic}
#wtyg .hint{color:#6f6a63;font-size:10px}
#wtyg .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;
 background:#0d1013;z-index:60;color:#9a948b;font-size:12px}
#wtyg .bar{width:180px;height:2px;background:#2c3339;overflow:hidden}
#wtyg .bar i{display:block;height:100%;width:34%;background:#5c6d94;animation:wb 1.1s infinite ease-in-out}
@keyframes wb{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
#wtyg .tip{position:fixed;z-index:200;max-width:300px;background:#11151a;border:1px solid #434b54;border-radius:4px;
 padding:8px 10px;font-size:11px;line-height:1.5;color:#c6c0b7;box-shadow:0 6px 20px rgba(0,0,0,.6);display:none;pointer-events:none}
#wtyg .tip b{color:#e8e4dc;display:block;margin-bottom:3px;font-size:11.5px}
#wtyg .busy{font-size:10.5px;color:#8fa0bf;margin-top:5px}
#wtyg .qi{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;margin-left:6px;
 border:1px solid #4a525b;border-radius:50%;color:#8b857c;font-size:9px;line-height:1;cursor:help;vertical-align:1px;
 text-transform:none;letter-spacing:0;font-weight:600}
#wtyg .qi:hover,#wtyg .qi:focus{border-color:#8fa0bf;color:#cfd6e4;outline:none}
#wtyg .vsec{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#7f796f;margin:9px 0 5px;font-weight:600}
#wtyg .seg{display:flex;gap:4px}
#wtyg .seg button{flex:1;padding:3px 0}
#wtyg .seg button.on{background:#38424b;color:#e8e4dc;border-color:#55606b}
#wtyg button.wide{width:100%;margin-top:5px}
#wtyg .gh[data-b]{cursor:pointer}
#wtyg .tg{display:none}
@media (max-width:820px){
 #wtyg{height:82vh}
 #wtyg .pnl{width:calc(100% - 24px);max-height:56%}
 #wtyg .pnl.closed .bd{display:none}
 #wtyg .tg{display:block;position:absolute;top:9px;right:10px}
 #wtyg .bm{top:auto;bottom:12px;right:12px;padding:7px 9px}
 #wtyg .pop{width:calc(100% - 24px);left:12px!important;bottom:12px;top:auto!important}
}
</style>
</head>
<body>
<div id="wtyg">
  <div id="map"></div>
  <canvas id="pts"></canvas>
  <div class="pnl" id="pnl">
    <div class="hd">
      <h2>Global Sanctions &amp; Designation Lists</h2>
      <div class="stat" id="stat">Loading…</div>
      <div class="busy" id="busy"></div>
      <button class="tg" id="tg">Filters</button>
    </div>
    <div class="bd" id="bd">
      <div class="intro" id="intro"></div>
      <input type="text" id="q" placeholder="Search name or alias…" autocomplete="off">
      <div class="idx" id="idx"></div>
      <div class="res" id="res"></div>
      <div class="btns"><button id="ball">All lists</button><button id="bnone">No lists</button><button id="breset">Reset view</button></div>
      <div class="sec"><h3 id="h-cat"></h3><div id="cats"></div></div>
      <div class="sec"><h3 id="h-nat"></h3><div id="nats"></div></div>
      <div class="sec"><h3 id="h-sev"></h3><div id="sevs"></div></div>
      <div class="sec"><h3 id="h-auth"></h3><div id="groups"></div></div>
      <div class="sec"><h3 id="h-typ"></h3><div id="types"></div></div>
      <div class="sec"><h3 id="h-prec"></h3><div id="prec"></div></div>
      <div class="note" id="note"></div>
    </div>
  </div>
  <div class="bm"><h3>Basemap</h3><div id="bmlist"></div></div>
  <div class="pop" id="pop"><div class="ph"><span class="x" id="px">&times;</span><strong id="pt"></strong><span id="ps"></span></div><div class="pb" id="pbb"></div></div>
  <div class="ld" id="ld"><div id="ldt">Loading designation data…</div><div class="bar"><i></i></div></div>
  <div class="tip" id="tip"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

/* ---------- plain-language glossary for the wording the lists publish ---------- */

/* multilateral development banks */
[/CROSS[\s-]?DEBARMENT/i,'Cross-debarment','One development bank barred this party and the others applied the same ban. Under an agreement signed in 2010 the World Bank, African Development Bank, Asian Development Bank, EBRD and Inter-American Development Bank recognise each other’s debarments.'],

[/\bADB\b/,'ADB','The Asian Development Bank.'],
[/\bEBRD\b/,'EBRD','The European Bank for Reconstruction and Development, which invests in central and eastern Europe, central Asia and north Africa.'],
[/\bWBG\b|\bWorld Bank\b/i,'World Bank Group','The World Bank and its affiliated institutions.'],
[/Corrupt(?:ion|\s*Practice)/i,'Corruption / corrupt practice','Offering, giving or taking anything of value to sway someone’s part in a bank-funded contract. This is the banks’ own category and a finding by the bank’s own tribunal, not a criminal conviction.'],

[/Coerci(?:on|ve\s*Practice)/i,'Coercion / coercive practice','Harming or threatening a person or their property to influence their part in a project.'],
[/Collu(?:sion|sive\s*Practice)/i,'Collusion / collusive practice','A private arrangement between bidders, or between a bidder and an official, to fix a price or steer an award.'],
[/Obstruct(?:ion|ive\s*Practice)/i,'Obstruction / obstructive practice','Destroying or withholding evidence, or otherwise interfering with the bank’s investigation.'],
[/Conditional Non[\s-]?Debarment/i,'Conditional non-debarment','Not barred, so long as stated conditions — usually a compliance programme — are met by a deadline.'],

[/\bRestitution\b/i,'Restitution','Repayment the institution has ordered.'],
[/Ineligib/i,'Ineligible','May not be awarded contracts or funding by this institution.'],

[/Medicare/i,'Medicare','The US public health insurance programme for people over 65 and some younger disabled people.'],
[/\bIAC\b/,'IAC','The Iowa Administrative Code — the state rule book cited by Iowa’s Medicaid provider exclusions.'],
[/\bR\.?S\.?\s*\d/i,'R.S.','Revised Statutes: the compiled law of a US state. The numbers that follow are the chapter and section.'],
[/\bDSW\b/,'DSW','Direct service worker — a paid care worker. A “DSW finding” is an entry against that person in a state care registry.'],
[/\bCNA\b/,'CNA','Certified nursing assistant. A finding here is an entry in the state register for that role.'],
[/\bNMAP\b/,'NMAP','The Nebraska Medical Assistance Program, that state’s Medicaid programme.'],
[/\bCFR\b/,'CFR','The Code of Federal Regulations, the US federal rule book. The numbers either side are the title and the section.'],

    '<b>'+f(pcts.country+pcts.region)+'%</b> are named for a country-wide programme, a location or an owner, '+
    '<b>'+f(pcts.counter)+'%</b> are retaliation for sanctions imposed on the listing state, and for '+
    '<b>'+f(100*(META.natnone||0)/tot)+'%</b> nothing can be read at all. '+
    '<span style="color:#6f6a63">A listing can count under more than one. Which category a listing falls in is '+
    'this map\u2019s reading of the programme it cites, not a field the lists publish.</span>';
}
/* a short index so the panel can be jumped through rather than scrolled */
var IDX=[['h-cat','Kinds of list'],['h-nat','What for'],['h-sev','How grave'],
         ['h-auth','Authorities'],['h-typ','Entity types'],['h-prec','Precision']];
function buildIndex(){
  $('idx').innerHTML='<span style="color:#6f6a63;font-size:10px;margin-right:2px">Jump to</span>'+
    IDX.map(function(x){return '<a data-go="'+x[0]+'">'+esc(x[1])+'</a>';}).join('');
  $('idx').addEventListener('click',function(e){
    var g=e.target.getAttribute&&e.target.getAttribute('data-go'); if(!g) return;
    var el=$(g),bd=$('bd');
    if(el) bd.scrollTo({top:el.offsetTop-bd.offsetTop-8,behavior:'smooth'});
  });
}
/* the names behind a search, listed, not only plotted */
var RESMAX=60;
function results(){
  var box=$('res');
  if(!query){ box.innerHTML=''; return; }
  if(!actN){ box.innerHTML='<div class="rh">No match</div>'; return; }
  /* one entry per party: the same name in the same country is usually the same
     party carried on several lists, and a wall of repeats hides the rest */
  var seen={},list=[],i,ix,r,k;
  for(i=0;i<actN&&list.length<RESMAX;i++){
    ix=actList[i]; r=rowsAll[ix];
    k=r[5].toLowerCase()+'|'+(r[10]||'');
    if(seen[k]!==undefined){ list[seen[k]][1]++; continue; }
    seen[k]=list.length; list.push([ix,1]);
  }
  var h='<div class="rh">'+fmt(actN)+' listing'+(actN===1?'':'s')+
        (list.length<actN?' \u00b7 '+list.length+' part'+(list.length===1?'y':'ies')+' shown':'')+'</div>';
  for(i=0;i<list.length;i++){
    ix=list[i][0]; r=rowsAll[ix];
    h+='<div class="ri" data-ix="'+ix+'"><b>'+esc(r[5])+
       (list[i][1]>1?' <span style="color:#7f796f;font-weight:400">\u00d7'+list[i][1]+'</span>':'')+'</b><span>'+
       esc(META.sch[r[3]])+(r[10]?' \u00b7 '+esc(r[10].toUpperCase()):'')+
       (r[6]?' \u00b7 '+esc(r[6].slice(0,52)):'')+'</span></div>';
  }
  box.innerHTML=h;
}
function gotoRow(ix){
  var r=rowsAll[ix];
  map.flyTo({center:[r[1],r[0]],zoom:Math.max(map.getZoom(),9),duration:900});
  map.once('moveend',function(){
    var pt=map.project([r[1],r[0]]);
    showPop([ix],pt.x,pt.y);
  });
}
function buildUI(){
  var tot=META.total;
  $('intro').innerHTML=
   '<p>Governments, the UN and financial regulators keep public lists of people, companies, ships and aircraft they have '+
   '<b>designated</b> — named as subject to a penalty such as a freeze on their money, a ban on trading with them, a bar '+
   'from public contracts, or a warrant for their arrest. This map puts <b>'+fmt(tot)+' listings from '+META.nlists+
   ' of those official lists</b> on the ground, at the addresses the lists publish.</p>'+
   '<p><b>How complete that is.</b> No government or body keeps a census of every official list in the world, '+
   'so completeness can only be measured against the fullest public catalogue of them, which is OpenSanctions. '+
   'It carries 228 such lists. This map plots 217 of them \u2014 95%. The other eleven publish entries with no '+
   'place attached at all: crypto wallet addresses, proscribed group names, broadcast equipment. Within the '+
   'lists it does carry, 421,241 of 475,596 listings could be placed; the remaining 54,355 name no country '+
   'or address a map can use.</p>'+
   '<p>'+shares()+'</p>'+
   '<p id="m2" style="display:none"><b>A listing is not a conviction.</b> Most are decisions taken by a government department, '+
   'not a court, and the listed party often has no hearing first. The same party usually appears on several countries’ '+
   'lists at once; each point names every list it is on and links back to them.</p>'+
   '<p id="m3" style="display:none"><b>These are the lists as they stand today.</b> When an authority removes a party, '+
   'that record generally drops out, so the map is a picture of who is listed now, not an archive of everyone ever listed. '+
   'Where a list publishes when the designation began, the dates run from 1951 to this year.</p>'+
   '<p id="m4" style="display:none">Hover a <span class="qi" style="position:static">?</span> or any filter row to read what it means. '+
   'Circle size shows how many listings sit on one spot; click to open them.</p>'+
   '<span class="more" id="mb">What counts as a listing?</span>';
  $('mb').onclick=function(){
    var open=$('m2').style.display!=='none';
    ['m2','m3','m4'].forEach(function(id){$(id).style.display=open?'none':'block';});
    this.textContent=open?'What counts as a listing?':'Show less';};
  function head(id,k){ $(id).innerHTML=esc(T[k][0])+qi(T[k][0],T[k][1]); wire($(id)); }
  buildIndex();
  (function(){var bd=$('bd'),pn=$('pnl');
    function chk(){ pn.classList.toggle('atend', bd.scrollTop+bd.clientHeight >= bd.scrollHeight-6); }
    bd.addEventListener('scroll',chk); setTimeout(chk,400); window.addEventListener('resize',chk);
  })();
  $('res').addEventListener('click',function(e){
    var t=e.target; while(t&&t!==this&&!t.getAttribute('data-ix')) t=t.parentNode;
    if(t&&t.getAttribute) { var ix=t.getAttribute('data-ix'); if(ix!==null&&ix!==undefined) gotoRow(+ix); }
  });
  head('h-cat','cat');head('h-auth','auth');head('h-nat','nat');head('h-sev','sev');head('h-typ','typ');head('h-prec','prec');
  var h='';
  META.cats.forEach(function(c,i){
    h+='<label data-t="'+esc(c[1])+'" data-b="'+esc(c[2])+'"><input type="checkbox" checked data-cat="'+i+'">'+
       '<span>'+esc(c[1])+'</span><span class="n">'+fmt(META.catcnt[i])+' · '+pct(META.catcnt[i],tot)+'</span></label>';});
  $('cats').innerHTML=h;wire($('cats'));
  h='';
  META.grp.forEach(function(g,gi){
    h+='<div class="grp" data-g="'+gi+'"><div class="gh" data-t="'+esc(g[0])+'" data-b="'+esc(g[3]||'')+'">'+
       '<span class="car">&#9656;</span><input type="checkbox" checked data-gchk="'+gi+'">'+
       '<span class="dot" style="background:'+g[1]+'"></span><span class="nm">'+esc(g[0])+'</span>'+
       '<span class="n">'+fmt(META.gcnt[gi]||0)+' · '+pct(META.gcnt[gi]||0,tot)+'</span></div><div class="gl">';
    g[2].slice().sort(function(a,b){return (META.cnt[b]||0)-(META.cnt[a]||0);}).forEach(function(si){
      var m=META.src[si];
      h+='<label data-t="'+esc(m[0])+'" data-b="'+esc((m[1]||'No description published.')+(m[2]?'  Published by '+m[2]+'.':''))+'">'+
         '<input type="checkbox" checked data-src="'+si+'"><span>'+esc(m[0])+'</span><span class="n">'+fmt(META.cnt[si]||0)+'</span></label>';});
    h+='</div></div>';});
  $('groups').innerHTML=h;wire($('groups'));
  h='';
  META.nat.map(function(n,i){return [i,n];}).sort(function(a,b){return META.natcnt[b[0]]-META.natcnt[a[0]];}).forEach(function(p){
    var i=p[0],n=p[1];
    h+='<label data-t="'+esc(n[1])+'" data-b="'+esc(n[3])+'"><input type="checkbox" checked data-nat="'+i+'">'+
       '<span>'+esc(n[1])+'</span><span class="n">'+fmt(META.natcnt[i])+' · '+pct(META.natcnt[i],tot)+'</span></label>';});
  h+='<label data-t="Reason not stated" data-b="Neither the listing nor the list it sits on says what the designation is for."><input type="checkbox" checked data-nat="'+META.nat.length+'">'+
     '<span>Reason not stated</span><span class="n">'+fmt(META.natnone)+' · '+pct(META.natnone,tot)+'</span></label>';
  $('nats').innerHTML=h;wire($('nats'));
  h=META.sev.map(function(s,i){
    return '<label data-t="'+esc(s[0])+'" data-b="'+esc(s[1])+'"><input type="checkbox" checked data-sev="'+i+'">'+
      '<span>'+esc(s[0])+'</span><span class="n">'+fmt(META.sevcnt[i])+' · '+pct(META.sevcnt[i],tot)+'</span></label>';}).join('');
  $('sevs').innerHTML=h;wire($('sevs'));
  h=META.sch.map(function(s,i){
    return '<label data-t="'+esc(s)+'" data-b="'+esc(META.schd[i]||'')+'"><input type="checkbox" checked data-sch="'+i+'">'+
      '<span>'+esc(s)+'</span><span class="n">'+fmt(META.schcnt[i]||0)+'</span></label>';}).join('');
  $('types').innerHTML=h;wire($('types'));
  h=META.prec.map(function(p,i){
    return '<label data-t="'+esc(p[0])+'" data-b="'+esc(p[1])+'"><input type="checkbox" checked data-q="'+i+'">'+
      '<span>'+esc(p[0])+'</span><span class="n">'+fmt(META.precnt[i]||0)+' · '+pct(META.precnt[i]||0,tot)+'</span></label>';}).join('');
  $('prec').innerHTML=h;wire($('prec'));
  $('note').innerHTML='Lists are aggregated from each issuing authority’s own published file through '+
    '<a href="https://www.opensanctions.org/" target="_blank" rel="noopener">OpenSanctions</a>; nothing is added or edited here. '+
    'What a listing is for, and how grave it is, are this map’s readings of the programme each listing cites — the lists publish neither. '+
    fmt(META.unmapped)+' designated targets publish neither an address nor a country and cannot be placed. Built '+esc(META.built)+'.';

  $('cats').addEventListener('change',function(e){
    var t=e.target; if(t.dataset.cat===undefined) return;
    var i=+t.dataset.cat; catOn[i]=t.checked?1:0;
    if(t.checked) loadCat(i);
    refresh();});
  $('groups').addEventListener('click',function(e){
    var t=e.target;
    if(t.dataset.src!==undefined){srcOn[+t.dataset.src]=t.checked?1:0;sync();refresh();return;}
    if(t.dataset.gchk!==undefined){
      var v=t.checked?1:0;
      META.grp[+t.dataset.gchk][2].forEach(function(si){srcOn[si]=v;});
      t.closest('.grp').querySelectorAll('[data-src]').forEach(function(c){c.checked=!!v;});
      refresh();return;}
    var hd=t.closest('.gh'); if(hd) hd.parentNode.classList.toggle('open');});
  $('nats').addEventListener('change',function(e){if(e.target.dataset.nat!==undefined){natOn[+e.target.dataset.nat]=e.target.checked?1:0;refresh();}});
  $('sevs').addEventListener('change',function(e){if(e.target.dataset.sev!==undefined){sevOn[+e.target.dataset.sev]=e.target.checked?1:0;refresh();}});
  $('types').addEventListener('change',function(e){if(e.target.dataset.sch!==undefined){schOn[+e.target.dataset.sch]=e.target.checked?1:0;refresh();}});
  $('prec').addEventListener('change',function(e){if(e.target.dataset.q!==undefined){qOn[+e.target.dataset.q]=e.target.checked?1:0;refresh();}});
  function setAll(v){srcOn.fill(v);document.querySelectorAll('#wtyg [data-src],#wtyg [data-gchk]').forEach(function(c){c.checked=!!v;});refresh();}
  $('ball').onclick=function(){setAll(1);};$('bnone').onclick=function(){setAll(0);};
  $('breset').onclick=wholeWorld;
  var tm;$('q').addEventListener('input',function(e){clearTimeout(tm);var v=e.target.value.trim().toLowerCase();
    tm=setTimeout(function(){query=v;refresh();},220);});
  $('px').onclick=function(){$('pop').style.display='none';};
  $('pbb').addEventListener('click',popTagClick);
  $('pbb').addEventListener('mouseover',function(e){var t=e.target;
    if(!t||!t.className||String(t.className).indexOf('tq')<0){tipOff();return;}
    var d=defOf(t.getAttribute('data-i'));tipShow(d[0],d[1],t.getBoundingClientRect());});
  $('pbb').addEventListener('mouseleave',tipOff);
  $('tg').onclick=function(){$('pnl').classList.toggle('closed');};
  $('bmlist').innerHTML=CulpritsBasemaps.list.map(function(b){
    return '<label><input type="radio" name="wbm" value="'+b[0]+'"'+(b[0]==='atlas'?' checked':'')+'> '+esc(b[1])+'</label>';}).join('')+
    '<div class="vsec">View</div><div class="seg"><button type="button" class="on" data-proj="globe">Globe</button>'+
    '<button type="button" data-proj="mercator">Flat</button></div>'+
    '<button type="button" id="wbtn" class="wide">Whole world</button>';
  $('bmlist').addEventListener('change',function(e){if(e.target.name==='wbm'){BM.set(e.target.value);setTheme(e.target.value);}});
  $('bmlist').addEventListener('click',function(e){
    var b=e.target.closest('[data-proj]'); if(b){setProj(b.dataset.proj);return;}
    if(e.target.id==='wbtn') wholeWorld();});
  wire($('intro').parentNode);
}
function sync(){
  META.grp.forEach(function(g,gi){
    var any=g[2].some(function(si){return srcOn[si];});
    var b=document.querySelector('#wtyg [data-gchk="'+gi+'"]'); if(b) b.checked=any;});
}
function loadCat(i){
  var nm=META.cats[i][0];
  if(loaded[nm]||loading[nm]||!((META.shards[i]||[])[1])) return Promise.resolve();
  $('busy').textContent='Loading '+META.cats[i][1].toLowerCase()+' ('+Math.round(((META.shards[i]||[])[2]||0)/1e6)+' MB)…';
  return fetchShard(nm).then(function(){$('busy').textContent='';refresh();})
    .catch(function(err){$('busy').textContent=err.message;});
}
/* ---------- stars ---------- */
function stars(){
  var seed=1977,rnd=function(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
  var Wd=1400,Hh=1000,c=document.createElement('canvas');c.width=Wd;c.height=Hh;
  var g=c.getContext('2d');g.fillStyle='#03040a';g.fillRect(0,0,Wd,Hh);
  [[.22,.30,520,'48,58,92',.10],[.78,.68,600,'70,52,86',.08],[.58,.14,420,'42,74,84',.06],[.10,.86,380,'56,60,80',.07]]
  .forEach(function(p){var x=p[0],y=p[1],r=p[2],rgb=p[3],al=p[4];
    for(var dx=-Wd;dx<=Wd;dx+=Wd) for(var dy=-Hh;dy<=Hh;dy+=Hh){
      var gr=g.createRadialGradient(x*Wd+dx,y*Hh+dy,0,x*Wd+dx,y*Hh+dy,r);
      gr.addColorStop(0,'rgba('+rgb+','+al+')');gr.addColorStop(1,'rgba('+rgb+',0)');
      g.fillStyle=gr;g.fillRect(0,0,Wd,Hh);}});
  var tints=['255,255,255','214,224,255','236,232,246','224,236,240'];
  function dot(x,y,r,a,t){for(var i=0;i<3;i++)for(var j=0;j<3;j++){
    var dx=[0,-Wd,Wd][i],dy=[0,-Hh,Hh][j];
    g.beginPath();g.arc(x+dx,y+dy,r,0,7);g.fillStyle='rgba('+t+','+a+')';g.fill();}}
  for(var i=0;i<2600;i++) dot(rnd()*Wd,rnd()*Hh,.25+rnd()*.55,.15+rnd()*.55,tints[(rnd()*4)|0]);
  for(var k=0;k<90;k++){var x=rnd()*Wd,y=rnd()*Hh,r=.8+rnd()*.9,t=tints[(rnd()*4)|0];dot(x,y,r,.9,t);}
  var el=$('map');
  el.style.background='#03040a url('+c.toDataURL('image/jpeg',.9)+') repeat';
  el.style.backgroundSize=Wd+'px '+Hh+'px';
}
/* ---------- boot ---------- */
tipEl=$('tip');cv=$('pts');ctx=cv.getContext('2d');
fetch(BASE+'meta.json').then(function(r){
  if(!r.ok) throw new Error('Could not load the map data ('+r.status+').');return r.json();
}).then(function(m){
  META=m; if(m.base) BASE=m.base;
  META.grp.forEach(function(g,gi){g[2].forEach(function(si){g2s[si]=gi;});});
  srcOn=new Uint8Array(META.src.length).fill(1);
  schOn=new Uint8Array(META.sch.length).fill(1);
  catOn=new Uint8Array(META.cats.length).fill(1);
  natOn=new Uint8Array(META.nat.length+1).fill(1);
  sevOn=new Uint8Array(6).fill(1);
  BM=CulpritsBasemaps.create('map',{initial:'atlas',projection:'globe',center:[10,20],zoom:1.4,
    plate:META.plate,onReady:function(){map.setMaxZoom(18);addGlobeLayer();setProj(proj);frameWorld(true);try{setTheme(BM.current());}catch(e){}}});
  map=BM.maplibre;
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
  map.on('render',draw);map.on('move',draw);map.on('resize',resize);
  map.on('moveend',function(){ if(proj==='globe') globeData(); });
  map.on('click',function(e){var l=at(e.point.x,e.point.y);
    if(l) showPop(l,e.point.x,e.point.y); else $('pop').style.display='none';});
  buildUI();stars();resize();
  return fetchShard('sanctions');
}).then(function(){
  refresh();$('ld').style.display='none';
  var rest=META.cats.map(function(c,i){return i;}).filter(function(i){return i>0&&(META.shards[i]||[])[1];});
  (function next(){ if(!rest.length){$('busy').textContent='';refresh();return;}
    loadCat(rest.shift()).then(next); })();
}).catch(function(err){
  $('ld').innerHTML='<div style="max-width:330px;text-align:center;color:#b0aaa2">'+esc(err.message||'Could not load the map.')+'</div>';
});
window.addEventListener('resize',resize);
})();
