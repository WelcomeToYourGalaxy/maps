<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Global Sanctions &amp; Designation Lists</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
#wtyg,#wtyg *{margin:0;padding:0;box-sizing:border-box}
#wtyg{position:relative;width:100%;height:88vh;min-height:560px;overflow:hidden;background:#0d1013;
 color:#d7d3cc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.45}
#wtyg #map{position:absolute;inset:0}
#wtyg #pts{position:absolute;inset:0;pointer-events:none}
#wtyg .pnl{position:absolute;top:12px;left:12px;width:330px;max-height:calc(100% - 24px);z-index:20;
 background:rgba(18,21,25,.95);border:1px solid #333a41;border-radius:4px;display:flex;flex-direction:column;backdrop-filter:blur(4px)}
#wtyg .hd{padding:12px 14px 11px;border-bottom:1px solid #2c3339}
#wtyg .hd h2{font-size:14px;font-weight:600;color:#e8e4dc}
#wtyg .intro{font-size:11.5px;color:#a49e95;margin-top:7px}
#wtyg .intro p{margin-top:6px}
#wtyg .intro b{color:#c6c0b7;font-weight:600}
#wtyg .more{color:#8fa0bf;cursor:pointer;text-decoration:underline;font-size:11px}
#wtyg .stat{font-size:11.5px;color:#9a948b;margin-top:8px}
#wtyg .stat b{color:#d4cec5;font-weight:600}
#wtyg .bd{overflow-y:auto;padding:10px 14px 16px;flex:1}
#wtyg .bd::-webkit-scrollbar{width:8px}#wtyg .bd::-webkit-scrollbar-thumb{background:#3a4249;border-radius:4px}
#wtyg input[type=text]{width:100%;padding:6px 8px;background:#1b2025;border:1px solid #3a4249;border-radius:3px;color:#ded9d1;font:inherit;font-size:12px}
#wtyg input[type=text]:focus{outline:none;border-color:#5c6d94}
#wtyg .sec{margin-top:15px}
#wtyg .sec>h3{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#7f796f;margin-bottom:7px;font-weight:600}
#wtyg label{display:flex;align-items:flex-start;gap:7px;padding:3px 0;cursor:pointer;font-size:12px;color:#bdb7ae}
#wtyg label:hover{color:#e8e4dc}
#wtyg input[type=checkbox]{accent-color:#5c6d94;width:13px;height:13px;flex:none;margin-top:2px;cursor:pointer}
#wtyg .dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:4px}
#wtyg .n{font-size:10px;color:#6f6a63;margin-left:auto;padding-left:7px;font-variant-numeric:tabular-nums;flex:none}
#wtyg .grp{border-bottom:1px solid #262c32}
#wtyg .gh{display:flex;align-items:center;gap:7px;padding:4px 0;cursor:pointer}
#wtyg .gh .nm{flex:1;font-size:12px;color:#cfc9c0;font-weight:500}
#wtyg .car{font-size:9px;color:#6e6961;width:9px;flex:none}
#wtyg .gl{display:none;padding:2px 0 6px 16px}
#wtyg .grp.open .gl{display:block}
#wtyg .gl label{font-size:11px;color:#a8a29a}
#wtyg .btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#wtyg button{background:#232a30;border:1px solid #3a4249;color:#bdb7ae;padding:4px 9px;border-radius:3px;font:inherit;font-size:11px;cursor:pointer}
#wtyg button:hover{background:#2c343b;color:#e8e4dc}
#wtyg .note{font-size:10.5px;color:#7f796f;margin-top:13px;padding-top:11px;border-top:1px solid #262c32}
#wtyg .note a{color:#8fa0bf}
#wtyg .bm{position:absolute;right:12px;top:12px;z-index:20;background:rgba(18,21,25,.95);border:1px solid #333a41;border-radius:4px;padding:9px 11px}
#wtyg .bm h3{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#7f796f;margin-bottom:5px;font-weight:600}
#wtyg .bm label{font-size:11.5px;padding:2px 0;align-items:center}
#wtyg .bm input{accent-color:#8c6a5b;margin-top:0}
#wtyg .pop{position:absolute;z-index:40;width:370px;max-width:calc(100% - 24px);max-height:70%;background:rgba(16,19,23,.975);
 border:1px solid #3a4249;border-radius:4px;display:none;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#wtyg .ph{padding:10px 34px 10px 13px;border-bottom:1px solid #2c3339;position:relative}
#wtyg .ph strong{font-size:12.5px;color:#e8e4dc}#wtyg .ph span{display:block;font-size:10.5px;color:#8b857c;margin-top:2px}
#wtyg .x{position:absolute;top:6px;right:9px;cursor:pointer;color:#8b857c;font-size:19px;line-height:1}
#wtyg .x:hover{color:#ded9d1}
#wtyg .pb{overflow-y:auto;padding:4px 13px 13px}
#wtyg .ent{padding:10px 0;border-bottom:1px solid #242a30}#wtyg .ent:last-child{border-bottom:none}
#wtyg .en{font-size:12.5px;color:#e8e4dc;font-weight:600}
#wtyg .tags{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0}
#wtyg .tag{font-size:9.5px;padding:2px 6px;border-radius:2px;background:#262d34;color:#b0aaa2;border:1px solid #333a41}
#wtyg .f{font-size:11px;color:#a8a29a;margin:3px 0}#wtyg .f b{color:#857f76;font-weight:500}#wtyg .f a{color:#8fa0bf}
#wtyg .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;
 background:#0d1013;z-index:60;color:#9a948b;font-size:12px}
#wtyg .bar{width:180px;height:2px;background:#2c3339;overflow:hidden}
#wtyg .bar i{display:block;height:100%;width:34%;background:#5c6d94;animation:wb 1.1s infinite ease-in-out}
@keyframes wb{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
#wtyg .tip{position:fixed;z-index:200;max-width:300px;background:#11151a;border:1px solid #434b54;border-radius:4px;
 padding:8px 10px;font-size:11px;line-height:1.5;color:#c6c0b7;box-shadow:0 6px 20px rgba(0,0,0,.6);display:none;pointer-events:none}
#wtyg .tip b{color:#e8e4dc;display:block;margin-bottom:3px;font-size:11.5px}
#wtyg .busy{font-size:10.5px;color:#8fa0bf;margin-top:5px}
#wtyg .qi{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;margin-left:6px;
 border:1px solid #4a525b;border-radius:50%;color:#8b857c;font-size:9px;line-height:1;cursor:help;vertical-align:1px;
 text-transform:none;letter-spacing:0;font-weight:600}
#wtyg .qi:hover,#wtyg .qi:focus{border-color:#8fa0bf;color:#cfd6e4;outline:none}
#wtyg .vsec{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#7f796f;margin:9px 0 5px;font-weight:600}
#wtyg .seg{display:flex;gap:4px}
#wtyg .seg button{flex:1;padding:3px 0}
#wtyg .seg button.on{background:#38424b;color:#e8e4dc;border-color:#55606b}
#wtyg button.wide{width:100%;margin-top:5px}
#wtyg .gh[data-b]{cursor:pointer}
#wtyg .tg{display:none}
@media (max-width:820px){
 #wtyg{height:82vh}
 #wtyg .pnl{width:calc(100% - 24px);max-height:56%}
 #wtyg .pnl.closed .bd{display:none}
 #wtyg .tg{display:block;position:absolute;top:9px;right:10px}
 #wtyg .bm{top:auto;bottom:12px;right:12px;padding:7px 9px}
 #wtyg .pop{width:calc(100% - 24px);left:12px!important;bottom:12px;top:auto!important}
}
</style>
</head>
<body>
<div id="wtyg">
  <div id="map"></div>
  <canvas id="pts"></canvas>
  <div class="pnl" id="pnl">
    <div class="hd">
      <h2>Global Sanctions &amp; Designation Lists</h2>
      <div class="intro" id="intro"></div>
      <div class="stat" id="stat">Loading…</div>
      <div class="busy" id="busy"></div>
      <button class="tg" id="tg">Filters</button>
    </div>
    <div class="bd" id="bd">
      <input type="text" id="q" placeholder="Search name or alias…" autocomplete="off">
      <div class="btns"><button id="ball">All lists</button><button id="bnone">No lists</button><button id="breset">Reset view</button></div>
      <div class="sec"><h3 id="h-cat"></h3><div id="cats"></div></div>
      <div class="sec"><h3 id="h-nat"></h3><div id="nats"></div></div>
      <div class="sec"><h3 id="h-sev"></h3><div id="sevs"></div></div>
      <div class="sec"><h3 id="h-auth"></h3><div id="groups"></div></div>
      <div class="sec"><h3 id="h-typ"></h3><div id="types"></div></div>
      <div class="sec"><h3 id="h-prec"></h3><div id="prec"></div></div>
      <div class="note" id="note"></div>
    </div>
  </div>
  <div class="bm"><h3>Basemap</h3><div id="bmlist"></div></div>
  <div class="pop" id="pop"><div class="ph"><span class="x" id="px">&times;</span><strong id="pt"></strong><span id="ps"></span></div><div class="pb" id="pbb"></div></div>
  <div class="ld" id="ld"><div id="ldt">Loading designation data…</div><div class="bar"><i></i></div></div>
  <div class="tip" id="tip"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

  var clat=c.lat*R,clon=c.lng*R,sc=Math.sin(clat),cc=Math.cos(clat);
  var z=map.getZoom(),lim=z>3?-1:0.04;
  for(var a=0;a<actN;a++){
    var i=actList[a];
    if(lim>-1){
      var la=plat[i]*R;
      if(sc*Math.sin(la)+cc*Math.cos(la)*Math.cos(plon[i]*R-clon)<lim) continue;
    }
    var la=Math.round(plat[i]/step),lo=Math.round(plon[i]/step),k=la*100000+lo;
    var e=m[k];
    if(e) e[2]++; else m[k]=[lo*step,la*step,1,grp[i]];
  }
  var f=[];
  for(var k2 in m){var e=m[k2];
    f.push({type:'Feature',geometry:{type:'Point',coordinates:[e[0],e[1]]},properties:{n:e[2],c:META.grp[e[3]][1]}});}
  map.getSource('wpts').setData({type:'FeatureCollection',features:f});
}
function addGlobeLayer(){
  if(map.getSource('wpts')) return;
  map.addSource('wpts',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'wpts',type:'circle',source:'wpts',layout:{visibility:'none'},
    paint:{'circle-color':['get','c'],'circle-opacity':.8,
      'circle-radius':['interpolate',['linear'],['sqrt',['get','n']],1,2.2,6,5,30,9,140,13],
      'circle-stroke-width':0.6,'circle-stroke-color':'rgba(10,12,14,.55)'}});
}
function setProj(p){
  proj=p;
  try{map.setProjection({type:p});}catch(e){}
  freeFlat();
  if(map.getLayer('wpts')) map.setLayoutProperty('wpts','visibility',p==='globe'?'visible':'none');
  cv.style.display=p==='globe'?'none':'block';
  document.querySelectorAll('#wtyg [data-proj]').forEach(function(b){b.classList.toggle('on',b.dataset.proj===p);});
  if(p==='globe') globeData(); else draw();
}
function freeFlat(){
  try{
    if(proj==='mercator') map.setTransformConstrain(function(ll,z){
      return {center:new maplibregl.LngLat(Math.max(-360,Math.min(360,ll.lng)),Math.max(-84,Math.min(84,ll.lat))),zoom:Math.max(0,z)};});
    else map.setTransformConstrain(null);
  }catch(e){}
}
function wholeWorld(){
  var pad={left:Math.min(352,W*0.3),right:0,top:0,bottom:0};
  if(proj==='globe') map.flyTo({center:[12,25],zoom:Math.max(0.2,Math.log2(0.86*Math.max(220,Math.min(H-40,W-380))*Math.PI/512)),padding:pad,duration:1100});
  else map.flyTo({center:[10,22],zoom:Math.max(0,Math.log2(Math.min(W-380,(H-40)*1.55)/512)),padding:pad,duration:1100});
}
/* ---------- hit test ---------- */
function at(sxp,syp){
  if(proj==='globe'){
    var fs=map.queryRenderedFeatures([[sxp-6,syp-6],[sxp+6,syp+6]],{layers:['wpts']});
    if(!fs.length) return null;
    var c=fs[0].geometry.coordinates,step=0.6,out=[];
    for(var a=0;a<actN;a++){var i=actList[a];
      if(Math.abs(plon[i]-c[0])<=step/2+1e-6&&Math.abs(plat[i]-c[1])<=step/2+1e-6) out.push(i);}
    return out.length?out:null;
  }
  var z=map.getZoom(),ws=512*Math.pow(2,z);
  var ce=map.getCenter(),cm=merc(ce.lat,ce.lng),ox=cm[0]*ws-W/2,oy=cm[1]*ws-H/2;
  var bd=1e9,bc=null;
  for(var a2=0;a2<actN;a2++){
    var j=actList[a2];
    var sx=mx[j]*ws-ox; if(sx<sxp-18||sx>sxp+18) continue;
    var sy=my[j]*ws-oy; if(sy<syp-18||sy>syp+18) continue;
    var d=Math.hypot(sx-sxp,sy-syp); if(d<bd){bd=d;bc=[sx,sy];}
  }
  if(!bc||bd>16) return null;
  var best=[];
  for(var a3=0;a3<actN;a3++){
    var k=actList[a3],jx=mx[k]*ws-ox,jy=my[k]*ws-oy;
    if(Math.abs(jx-bc[0])<=4&&Math.abs(jy-bc[1])<=4) best.push(k);
  }
  return best.length?best:null;
}

/* ---------- UI ---------- */

 nat:['What the listing is for','Why the authority says it acted, read from the programme each listing cites. Where a list publishes no reason, the kind of list is used instead. Our reading, not a field the lists publish.'],
 sev:['How grave','A 1-to-5 band we assign from the reason above. The lists do not rank themselves, so this is our scale and nothing in the sources endorses it.'],
 typ:['Entity type','What kind of thing is listed — a person, a company, a ship, an aircraft, a crypto wallet.'],

};

    g[2].slice().sort(function(a,b){return (META.cnt[b]||0)-(META.cnt[a]||0);}).forEach(function(si){
      var m=META.src[si];
      h+='<label data-t="'+esc(m[0])+'" data-b="'+esc((m[1]||'No description published.')+(m[2]?'  Published by '+m[2]+'.':''))+'">'+
         '<input type="checkbox" checked data-src="'+si+'"><span>'+esc(m[0])+'</span><span class="n">'+fmt(META.cnt[si]||0)+'</span></label>';});

  $('groups').innerHTML=h;wire($('groups'));

    var i=p[0],n=p[1];
    h+='<label data-t="'+esc(n[1])+'" data-b="'+esc(n[3])+'"><input type="checkbox" checked data-nat="'+i+'">'+
       '<span>'+esc(n[1])+'</span><span class="n">'+fmt(META.natcnt[i])+' · '+pct(META.natcnt[i],tot)+'</span></label>';});
  h+='<label data-t="Reason not stated" data-b="Neither the listing nor the list it sits on says what the designation is for."><input type="checkbox" checked data-nat="'+META.nat.length+'">'+
     '<span>Reason not stated</span><span class="n">'+fmt(META.natnone)+' · '+pct(META.natnone,tot)+'</span></label>';
  $('nats').innerHTML=h;wire($('nats'));
  h=META.sev.map(function(s,i){
    return '<label data-t="'+esc(s[0])+'" data-b="'+esc(s[1])+'"><input type="checkbox" checked data-sev="'+i+'">'+
      '<span>'+esc(s[0])+'</span><span class="n">'+fmt(META.sevcnt[i])+' · '+pct(META.sevcnt[i],tot)+'</span></label>';}).join('');
  $('sevs').innerHTML=h;wire($('sevs'));
  h=META.sch.map(function(s,i){
    return '<label data-t="'+esc(s)+'" data-b="'+esc(META.schd[i]||'')+'"><input type="checkbox" checked data-sch="'+i+'">'+
      '<span>'+esc(s)+'</span><span class="n">'+fmt(META.schcnt[i]||0)+'</span></label>';}).join('');
  $('types').innerHTML=h;wire($('types'));
  h=META.prec.map(function(p,i){
    return '<label data-t="'+esc(p[0])+'" data-b="'+esc(p[1])+'"><input type="checkbox" checked data-q="'+i+'">'+

  $('prec').innerHTML=h;wire($('prec'));

  $('cats').addEventListener('change',function(e){
    var t=e.target; if(t.dataset.cat===undefined) return;

    if(t.checked) loadCat(i);

  $('groups').addEventListener('click',function(e){
    var t=e.target;
    if(t.dataset.src!==undefined){srcOn[+t.dataset.src]=t.checked?1:0;sync();refresh();return;}

      META.grp[+t.dataset.gchk][2].forEach(function(si){srcOn[si]=v;});

  $('sevs').addEventListener('change',function(e){if(e.target.dataset.sev!==undefined){sevOn[+e.target.dataset.sev]=e.target.checked?1:0;refresh();}});
  $('types').addEventListener('change',function(e){if(e.target.dataset.sch!==undefined){schOn[+e.target.dataset.sch]=e.target.checked?1:0;refresh();}});

  $('ball').onclick=function(){setAll(1);};$('bnone').onclick=function(){setAll(0);};

    tm=setTimeout(function(){query=v;refresh();},220);});

    '<div class="vsec">View</div><div class="seg"><button type="button" data-proj="globe">Globe</button>'+

function sync(){
  META.grp.forEach(function(g,gi){
    var any=g[2].some(function(si){return srcOn[si];});
    var b=document.querySelector('#wtyg [data-gchk="'+gi+'"]'); if(b) b.checked=any;});
}
function loadCat(i){
  var nm=META.cats[i][0];
  if(loaded[nm]||loading[nm]||!((META.shards[i]||[])[1])) return Promise.resolve();
  $('busy').textContent='Loading '+META.cats[i][1].toLowerCase()+' ('+Math.round(((META.shards[i]||[])[2]||0)/1e6)+' MB)…';
  return fetchShard(nm).then(function(){$('busy').textContent='';refresh();})
    .catch(function(err){$('busy').textContent=err.message;});
}
/* ---------- stars ---------- */
function stars(){
  var seed=1977,rnd=function(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
  var Wd=1400,Hh=1000,c=document.createElement('canvas');c.width=Wd;c.height=Hh;
  var g=c.getContext('2d');g.fillStyle='#03040a';g.fillRect(0,0,Wd,Hh);
  [[.22,.30,520,'48,58,92',.10],[.78,.68,600,'70,52,86',.08],[.58,.14,420,'42,74,84',.06],[.10,.86,380,'56,60,80',.07]]
  .forEach(function(p){var x=p[0],y=p[1],r=p[2],rgb=p[3],al=p[4];
    for(var dx=-Wd;dx<=Wd;dx+=Wd) for(var dy=-Hh;dy<=Hh;dy+=Hh){
      var gr=g.createRadialGradient(x*Wd+dx,y*Hh+dy,0,x*Wd+dx,y*Hh+dy,r);
      gr.addColorStop(0,'rgba('+rgb+','+al+')');gr.addColorStop(1,'rgba('+rgb+',0)');
      g.fillStyle=gr;g.fillRect(0,0,Wd,Hh);}});
  var tints=['255,255,255','214,224,255','236,232,246','224,236,240'];
  function dot(x,y,r,a,t){for(var i=0;i<3;i++)for(var j=0;j<3;j++){
    var dx=[0,-Wd,Wd][i],dy=[0,-Hh,Hh][j];
    g.beginPath();g.arc(x+dx,y+dy,r,0,7);g.fillStyle='rgba('+t+','+a+')';g.fill();}}
  for(var i=0;i<2600;i++) dot(rnd()*Wd,rnd()*Hh,.25+rnd()*.55,.15+rnd()*.55,tints[(rnd()*4)|0]);
  for(var k=0;k<90;k++){var x=rnd()*Wd,y=rnd()*Hh,r=.8+rnd()*.9,t=tints[(rnd()*4)|0];dot(x,y,r,.9,t);}
  var el=$('map');
  el.style.background='#03040a url('+c.toDataURL('image/jpeg',.9)+') repeat';
  el.style.backgroundSize=Wd+'px '+Hh+'px';
}
/* ---------- boot ---------- */
tipEl=$('tip');cv=$('pts');ctx=cv.getContext('2d');
fetch(BASE+'meta.json').then(function(r){
  if(!r.ok) throw new Error('Could not load the map data ('+r.status+').');return r.json();
}).then(function(m){
  META=m; if(m.base) BASE=m.base;
  META.grp.forEach(function(g,gi){g[2].forEach(function(si){g2s[si]=gi;});});
  srcOn=new Uint8Array(META.src.length).fill(1);
  schOn=new Uint8Array(META.sch.length).fill(1);
  catOn=new Uint8Array(META.cats.length).fill(1);
  natOn=new Uint8Array(META.nat.length+1).fill(1);
  sevOn=new Uint8Array(6).fill(1);
  BM=CulpritsBasemaps.create('map',{initial:'night',projection:'mercator',center:[10,20],zoom:1.4,
    plate:META.plate,onReady:function(){map.setMaxZoom(18);addGlobeLayer();freeFlat();}});
  map=BM.maplibre;
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
  map.on('render',draw);map.on('move',draw);map.on('resize',resize);

    if(l) showPop(l,e.point.x,e.point.y); else $('pop').style.display='none';});
  buildUI();stars();resize();
  return fetchShard('sanctions');
}).then(function(){
  refresh();$('ld').style.display='none';
  var rest=META.cats.map(function(c,i){return i;}).filter(function(i){return i>0&&(META.shards[i]||[])[1];});
  (function next(){ if(!rest.length){$('busy').textContent='';refresh();return;}
    loadCat(rest.shift()).then(next); })();
}).catch(function(err){
  $('ld').innerHTML='<div style="max-width:330px;text-align:center;color:#b0aaa2">'+esc(err.message||'Could not load the map.')+'</div>';
});
window.addEventListener('resize',resize);
})();
