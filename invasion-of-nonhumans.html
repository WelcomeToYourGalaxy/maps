    // Global Safety Net's layers (round nh11: moved here from the land
    // section and renamed, as they map protected, conserved and important
    // lands, not how much the land has changed; its land-cover layers, from
    // trees to ice, are left out). Each is one colour where it covers, so it
    // is drawn in one colour of this map's, named in words.
    const GSN_PICK = [
      ["Protection", "#1E6FA8", [[1, "Strictly protected areas (IUCN categories Ia and Ib)"], [2, "Other protected areas (IUCN categories II to VI)"],
        [3, "Other effective area-based conservation measures (OECMs)"], [4, "Recognised Indigenous and traditional territories"],
        [5, "Documented conservation areas not in the official databases"], [93, "Every protected area and OECM together"]]],
      ["Important for nature", "#D08A9C", [[44, "Every area important for biodiversity or for nature's services to people"], [45, "Important for biodiversity"], [46, "Important for nature's services to people (such as carbon and water)"],
        [7, "Important areas left unprotected"], [8, "Habitat of rare and threatened species"], [9, "High biodiversity areas (hotspots and high beta diversity)"],
        [10, "Large mammal assemblages and migrations"], [11, "Wild and intact areas"], [12, "Climate stabilisation areas (intact land holding over 50 tonnes of carbon a hectare)"],
        [98, "Top 10% conservation priorities"], [71, "Important areas inside protected areas and OECMs"],
        [70, "Important areas inside conserved but not formally protected land (Indigenous territories and documented conservation areas)"]]],
      ["Changed by people", "#C7B49A", [[27, "Land changed by people, at 90 m (Global Safety Net's cut of the Human Modification index)"],
        [72, "Land changed by people inside protected areas and OECMs"]]],
      ["Critical habitat", "#B9A6C9", [[96, "Critical habitat on land (as the International Finance Corporation defines it)"], [97, "Critical habitat at sea (as the International Finance Corporation defines it)"]]],
      ["Biodiversity intactness (its own colours)", null, [[94, "Biodiversity Intactness Index, 0 to 50%"], [95, "Biodiversity Intactness Index, 51 to 100%"]]],
    ];
    part({
      id: "gsn", sec: "pa", title: "Protected, conserved and Indigenous lands, and land most important for nature (Global Safety Net)", live: true,
      about: `<p>The layers Global Safety Net draws from the world's protected and conserved areas, Indigenous and traditional territories, and the land most important for biodiversity and for climate: one at a time, each in one colour where it covers. Also the land it counts as changed by people, on its own and inside protected areas, critical habitats, and the Biodiversity Intactness Index. Choose a layer; its words under the choice say what it holds. Click the map to see whether the place is inside it.</p>
<p>Source: Global Safety Net (One Earth and Nature Data Lab), after Dinerstein, E. et al. 2020, "A 'Global Safety Net' to reverse biodiversity loss and stabilize Earth's climate", <i>Science Advances</i> 6: eabb2824, read live from its service. Global Safety Net's own land-cover layers are left out. The Biodiversity Intactness Index keeps Global Safety Net's own colours, as its steps have no key in the service.</p>`,
      async build(p) {
        const raw = await json(GSN, 40000);
        const all = (Array.isArray(raw) ? raw : raw.data || raw.layers || []).filter((l) => l && (l.gee_tile_url || l.tile_url));
        const byId = new Map(all.map((l) => [Number(l.id), l]));
        const opts2 = [];
        for (const [g, c, list] of GSN_PICK) for (const [lid, words] of list) if (byId.has(lid)) opts2.push({ g, c, lid, words, l: byId.get(lid) });
        if (!opts2.length) throw new Error("Global Safety Net lists none of these layers just now");
        const tpl = (l) => { const u = String(l.gee_tile_url || l.tile_url || ""); return /\{z\}/.test(u) ? u : `${u.replace(/\/+$/, "")}/tiles/{z}/{x}/{y}`; };
        const box = bodyOf(p);
        const desc = document.createElement("div");
        desc.className = "nh-note";
        const show = (i) => {
          const o = opts2[Number(i)];
          p.cur = o;
          p.url = tpl(o.l);
          raster(p, o.c ? `nhsolid://${o.c.slice(1)}/${p.url}` : p.url, { opacity: 0.8, attribution: "Global Safety Net (One Earth, Nature Data Lab)" });
          keyBox(p).innerHTML = o.c ? keyHtml([[o.c, o.words]]) : keyHtml([["", `${o.words}: Global Safety Net's own colours`, "h"]]);
          desc.textContent = o.l.description ? `Global Safety Net: ${o.l.description}` : "";
        };
        const l = document.createElement("label");
        l.className = "nh-ctl";
        let html = "Layer <select>";
        for (const [g] of GSN_PICK) {
          const inG = opts2.map((o, i) => [o, i]).filter(([o]) => o.g === g);
          if (inG.length) html += `<optgroup label="${esc(g)}">` + inG.map(([o, i]) => `<option value="${i}">${esc(o.words)}</option>`).join("") + `</optgroup>`;
        }
        l.innerHTML = html + "</select>";
        box.appendChild(l);
        box.appendChild(desc);
        l.querySelector("select").addEventListener("change", (e) => show(e.target.value));
        show(0);
        stateOf(p, `${opts2.length} layers from Global Safety Net`);
      },
      async pictureBox(ll) {
        if (!this.cur) return "";
        const z = Math.max(0, Math.min(10, Math.round(map.getZoom())));
        const t = tileOf(ll.lng, ll.lat, z);
        const r = await fetch(this.url.replace("{z}", z).replace("{x}", t.tx).replace("{y}", t.ty));
        if (!r.ok) return "";
        const bmp = await createImageBitmap(await r.blob());
        const cv = typeof OffscreenCanvas !== "undefined" ? new OffscreenCanvas(bmp.width, bmp.height) : Object.assign(document.createElement("canvas"), { width: bmp.width, height: bmp.height });
        const cx = cv.getContext("2d");
        cx.drawImage(bmp, 0, 0);
        const px = cx.getImageData(Math.min(bmp.width - 1, Math.floor((t.x - t.tx) * bmp.width)), Math.min(bmp.height - 1, Math.floor((t.y - t.ty) * bmp.height)), 1, 1).data;
        return `<h3>${px[3] ? "Inside" : "Not inside"}: ${esc(this.cur.words)}</h3><div class="src">Global Safety Net, live</div>`;
      },
    });

    part({
      id: "papress", sec: "pa", title: "How much people have changed the land inside each protected area (Human Modification index)",
      copy: "Worked out monthly by culprits-tiles-more from the Human Modification map and the World Database on Protected Areas; the areas are drawn from Global Forest Watch, live.",
      about: `<p>Each protected and conserved area coloured by how much people have changed the land inside it: the average Human Modification score (0 untouched to 1 completely changed), or the share of its area that is highly or very highly modified. Your footnote 19.5 cites the finding this tests: that a third of protected land is under intense human pressure (Jones et al. 2018, <i>Science</i>). Click an area for its figures.</p>
<p>Sources: Kennedy, C.M. et al. 2019, <i>Global Change Biology</i> 25: 811 to 826, the 1 km Global Human Modification map (about 2016), CC BY 4.0; the World Database on Protected Areas (UNEP-WCMC and IUCN). Classes as Kennedy et al. define them: low under 0.1, moderate 0.1 to 0.4, high 0.4 to 0.7, very high 0.7 and over. Areas the database gives only as a point have no figures.</p>`,
      async build(p) {
        const [d, a] = await Promise.all([json(NH + "pa_pressure.json", 90000), gfwVector("wdpa_licensed_protected_areas")]);
        p.ids = d.ids || {};
        p.measure = "m";
        const layers = ["wdpa_licensed_protected_areas", "default"];
        addSource("papress", { type: "vector", tiles: [a.uri], minzoom: a.minzoom, maxzoom: a.maxzoom, promoteId: Object.fromEntries(layers.map((l) => [l, "wdpaid"])),
          attribution: "Kennedy et al. 2019 (gHM); UNEP-WCMC and IUCN (WDPA) via Global Forest Watch" });
        const MCOL = ["#C6E7F0", "#5FB8D2", "#1E6FA8", "#0C2E5E"];
        const fillFor = () => p.measure === "m"
          ? ["case", ["==", ["feature-state", "m"], null], "rgba(0,0,0,0)", ["step", ["feature-state", "m"], MCOL[0], 0.1, MCOL[1], 0.4, MCOL[2], 0.7, MCOL[3]]]
          : ["case", ["==", ["feature-state", "h"], null], "rgba(0,0,0,0)", ["step", ["feature-state", "h"], RAMP7[0], 10, RAMP7[2], 25, RAMP7[3], 50, RAMP7[5], 75, RAMP7[6]]];
        for (const sl of layers) {
          addLayer(p, { id: `papress-fill-${sl}`, type: "fill", source: "papress", "source-layer": sl, paint: { "fill-color": fillFor(), "fill-opacity": 0.7 } }, firstAbove());
          addLayer(p, { id: `papress-edge-${sl}`, type: "line", source: "papress", "source-layer": sl, paint: { "line-color": EDGE, "line-width": 0.6, "line-opacity": 0.8 } });
        }
        // Each area's figures are joined to it by its id as its squares arrive.
        const done = new Set();
        const join = () => {
          if (!map.getSource(id("papress"))) return;
          for (const sl of layers) {
            let fs = [];
            try { fs = map.querySourceFeatures(id("papress"), { sourceLayer: sl }); } catch (e) { continue; }
            for (const f of fs) {
              if (f.id == null || done.has(`${sl}|${f.id}`)) continue;
              done.add(`${sl}|${f.id}`);
              const v = p.ids[String(f.id)];
              if (v) map.setFeatureState({ source: id("papress"), sourceLayer: sl, id: f.id }, { m: v[0], h: (v[3] || 0) + (v[4] || 0) });
            }
          }
        };
        p.join = join;

          (q.WDPAID ? `<div class="more"><a href="https://www.protectedplanet.net/${esc(q.WDPAID)}" target="_blank" rel="noopener">The protected area on Protected Planet</a></div>` : "") +
          `<div class="more">${allProps(q, /^(_|OBJECTID$)/)}</div>`;
      },
    });

    // A concession dataset's map squares: the fixed squares Global Forest
    // Watch makes when it says which zooms they cover, else the squares it
    // draws on request (round nh11: some fixed sets have zooms missing, such
    // as the world view of GNW Logging concessions, so nothing showed).
    async function gfwConcessionTiles(ds, version) {
      const assets = (await json(`${GFW}/dataset/${ds}/${version}/assets`)).data || [];
      const ok = assets.filter((a) => /saved/i.test(a.status || "") && /^https?:/.test(a.asset_uri || ""));
      const stat = ok.find((a) => /static vector tile cache/i.test(a.asset_type || "") && a.metadata && a.metadata.min_zoom != null && a.metadata.max_zoom != null);
      const dyn = ok.find((a) => /dynamic vector tile cache/i.test(a.asset_type || ""));
      const v = stat || dyn || ok.find((a) => /vector tile cache/i.test(a.asset_type || ""));
      if (!v) return null;
      const m = v.metadata || {};
      return { version, uri: v.asset_uri, minzoom: Number(m.min_zoom) || 0, maxzoom: Math.min(14, Number.isFinite(Number(m.max_zoom)) ? Number(m.max_zoom) : 12), kind: v === stat ? "fixed squares" : "squares drawn on request" };
    }
    part({
      id: "conc", sec: "pa", title: "Land licensed to companies for mining, logging, oil, gas and plantations, beside protected areas (Global Forest Watch)", live: true,
      about: `<p>The concession maps Global Forest Watch publishes, read live: the land governments have licensed or granted to companies for mining, logging, oil and gas, wood fibre and oil palm, drawn so it can be seen against the protected areas. Tick the ones to draw. Most cover only some countries; each says which in its box.</p>
<p>How this differs from the mines and the oil and gas rows above: those show what is physically there, the mines traced from satellite pictures and mapped in OpenStreetMap, and the wells, pipelines and plants in the OGIM database, each measured by its distance from the nearest protected area. This row shows the land handed out on paper, where companies are allowed to work, whether or not anything has been dug, drilled or cut there yet, and it is drawn as the source gives it, without measuring.</p>
<p>Every map is drawn when the row is ticked; untick the ones you do not want. Where Global Forest Watch's catalogue holds two copies of the same map (one marked downloadable) or an older copy under the same name, the newest is drawn. One map is not of licences: the mining land traced from satellite pictures (the pits, waste heaps, ponds and buildings mines have already made, whether or not the land was licensed); it says so under its name. Maps the catalogue lists with no map squares to draw (such as the Congo Basin's logging roads) are named under the list.</p>
<p>For extraction inside protected areas, the row "Oil, gas and coal projects inside protected areas" reads the Protected Carbon project's map live. No live map of concessions inside protected areas was found: Global Forest Watch publishes the concessions and the protected areas separately, and the other overlap maps (WWF-SIGHT, Earth Insight) need a login or are pictures only.</p>
<p>Source: Global Forest Watch (World Resources Institute and partners), each dataset with its own source in its box.</p>`,
      async build(p) {
        const all = [];
        for (let page = 1; page < 30; page++) {
          let j;
          try { j = await json(`${GFW}/datasets?page[size]=100&page[number]=${page}`, 40000); } catch (e) { break; }
          const rows = j.data || [];
          all.push(...rows);
          if (rows.length < 100) break;
        }
        const re = /concession|mining|logging|managed[ _]forest|oil[ _]?(and[ _])?gas|wood[ _]fib|oil[ _]palm/i;
        const cand = all.filter((d) => re.test(`${d.dataset} ${(d.metadata || {}).title || ""}`) && !/alert|loss|emission|deforest/i.test(`${d.dataset} ${(d.metadata || {}).title || ""}`));
        if (!cand.length) throw new Error("Global Forest Watch's catalogue lists no concession maps just now");
        const ver = (d) => (d.versions || []).slice().sort((a, b) => String(a).localeCompare(String(b), "en", { numeric: true })).pop();
        // Round nh13: plainer names for the maps whose catalogue names are
        // missing or unclear, each with a line on what it is.
        const NAMES = {
          pangaea_global_mining: ["Land already dug up by mines, traced from satellite pictures (Maus et al. 2022, PANGAEA)",
            "Not licences: the pits, waste heaps, tailings ponds and buildings mines have already made, traced from satellite pictures, whether or not the land was licensed. The mining concessions map shows the land licensed on paper. The mines row above uses the same tracing, measured against protected areas."],
          osm_congo_basin_logging_roads: ["Logging roads in the Congo Basin (OpenStreetMap)", "Not licences: the roads cut into the forest to reach logging sites, as mapped in OpenStreetMap."],
          gfw_mining_concessions: ["Mining concessions: land licensed for mining", "Land a government has granted for mining, whether or not it has been dug yet."],
        };
        const title = (d) => (NAMES[d.dataset] || [])[0] || String((d.metadata || {}).title || d.dataset).trim();
        // One of each map: the newest version of each name, "(downloadable)" copies folded in.
        const groups = new Map();
        for (const d of cand) {
          const k = title(d).toLowerCase().replace(/\(downloadable\)/, "").replace(/\s+/g, " ").trim();
          (groups.get(k) || groups.set(k, []).get(k)).push(d);
        }
        const hidden = [], list = [];
        for (const g of groups.values()) {
          g.sort((a, b) => String(ver(b)).localeCompare(String(ver(a)), "en", { numeric: true }) || (/download/.test(a.dataset) ? 1 : -1));
          list.push(g[0]);
          for (const d of g.slice(1)) hidden.push(`${title(d)} (${d.dataset}, ${ver(d)}): ${ver(d) === ver(g[0]) ? "the same map as" : "an older copy of"} ${title(g[0])}`);
        }
        const tiles = await Promise.all(list.map((d) => ver(d) ? gfwConcessionTiles(d.dataset, ver(d)).catch(() => null) : null));
        const usable = list.map((d, i) => ({ d, t: tiles[i] })).filter((x) => x.t);
        const none = list.filter((d, i) => !tiles[i]).map((d) => `${title(d) === d.dataset ? d.dataset : `${title(d)} (${d.dataset})`}`);
        if (!usable.length) throw new Error("none of Global Forest Watch's concession maps has map squares just now");
        usable.sort((a, b) => title(a.d).localeCompare(title(b.d)));
        p.list = usable.map((x) => x.d);
        p.titleOf = title;
        const box = bodyOf(p);
        const el = document.createElement("div");
        el.className = "nh-checks";
        el.style.display = "block";
        const yr = (v) => (String(v).match(/\d{4}/) || [""])[0];
        el.innerHTML = usable.map(({ d, t }, i) => `<label style="display:block;margin:3px 0"><input type="checkbox" value="${i}"><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${POINT[(i + 1) % POINT.length]}"></i> ${esc(title(d) === d.dataset ? d.dataset.replace(/_/g, " ") : title(d))}` +
          `<span style="color:#7E8994"> (${esc(yr(t.version) || t.version)}${(d.metadata || {}).geographic_coverage ? `; ${esc(String(d.metadata.geographic_coverage).slice(0, 90))}` : ""})</span>` +
          (NAMES[d.dataset] ? `<span style="display:block;margin-left:19px;font-size:10.5px;color:#8A939D">${esc(NAMES[d.dataset][1])}</span>` : "") + `</label>`).join("");
        box.appendChild(el);
        if (none.length) {
          const n = document.createElement("div");
          n.className = "nh-list";
          n.innerHTML = `<b>In the catalogue with no map squares to draw:</b> ${none.map(esc).join(", ")}`;
          box.appendChild(n);
        }
        p.off = new Set();
        const lids = (sid, ds) => [].concat(...[ds, "default"].map((sl) => ["fill", "edge"].map((k) => id(`${sid}-${k}-${sl}`))));
        el.addEventListener("change", (e) => {
          const i = Number(e.target.value), { d, t: a } = usable[i], sid = `conc-${i}`;
          const mine = lids(sid, d.dataset);
          if (!e.target.checked) { mine.forEach((l) => p.off.add(l)); setVis(p); return; }
          mine.forEach((l) => p.off.delete(l));
          if (map.getSource(id(sid))) { setVis(p); return; }
          addSource(sid, { type: "vector", tiles: [a.uri], minzoom: a.minzoom, maxzoom: a.maxzoom, attribution: "Global Forest Watch" });
          const c = POINT[(i + 1) % POINT.length];
          for (const sl of [d.dataset, "default"]) {
            addLayer(p, { id: `${sid}-fill-${sl}`, type: "fill", source: sid, "source-layer": sl, paint: { "fill-color": c, "fill-opacity": 0.3 } }, firstAbove());
            addLayer(p, { id: `${sid}-edge-${sl}`, type: "line", source: sid, "source-layer": sl, paint: { "line-color": c, "line-width": 1, "line-opacity": 0.9 } });
          }
        });
        // Round nh13: every map drawn when the row is ticked.
        for (const cb of el.querySelectorAll("input")) { cb.checked = true; cb.dispatchEvent(new Event("change", { bubbles: true })); }
        stateOf(p, `${usable.length} maps from Global Forest Watch's catalogue, all drawn`);
      },
      box(f) {
        const sid = (f.layer.id.match(/conc-(\d+)/) || [])[1];
        const d = sid != null ? this.list[Number(sid)] : null;
        return `<h3>${esc(f.properties.name || f.properties.company || f.properties.Name || "Concession")}</h3><div class="src">${esc(d ? this.titleOf(d) : "Global Forest Watch")}${d && (d.metadata || {}).source ? `; ${esc(d.metadata.source)}` : ""}</div>` + allProps(f.properties);
      },
    });

    render();

    const api = {
      parts,
      /** Shows or hides everything this map has drawn (the Culprits row's tick). */
      setVisible(v) {
        shown = !!v;
        for (const p of parts) setVis(p);
        if (!shown && popup) popup.remove();
      },
      /** Every map layer id this map has added so far. */
      layerIds() { return [].concat(...[...layersOf.values()]); },
      open(partId, want = true) { const p = parts.find((x) => x.id === partId); if (p) return toggle(p, want); },
      el: root,
      map,
    };
    G.NonHumanAtlas.last = api;
    return api;
  }

  G.NonHumanAtlas = { create, VERSION: "1.0" };
})(typeof window !== "undefined" ? window : globalThis);
</script>

<script>
(function () {

      "hillshade-accent-color": "rgba(0,1,6,0.15)", "hillshade-exaggeration": 0.8, "hillshade-illumination-anchor": "map" },
    road: ["rgba(150,186,222,0.30)", "rgba(170,202,232,0.45)", "rgba(206,226,240,0.70)"], roadGlow: "#2D5C96",
    seaGlow: ["interpolate", ["linear"], ["elevation"], -9000, "rgba(31,79,126,0)", -150, "rgba(31,79,126,0)", -60, "rgba(31,79,126,0.28)", -15, "rgba(31,79,126,0.55)",
      -3, "rgba(74,154,182,0.85)", 0, "rgba(74,154,182,0)", 9000, "rgba(74,154,182,0)"],
    border: "rgba(120,140,196,0.32)",
  };
  // Hell: the Culprits map's basemap of that name (map/app.js, HELL and

      0, "#131215", 200, "#151215", 600, "#1A1214", 1200, "#1F1416", 2000, "#241418",

    shade: { "hillshade-method": "multidirectional", "hillshade-illumination-direction": [315, 270, 0, 225], "hillshade-illumination-altitude": [40, 35, 35, 50],

      "hillshade-shadow-color": ["rgba(0,0,0,0.8)", "rgba(0,0,0,0.45)", "rgba(0,0,0,0.45)", "rgba(0,0,0,0.25)"],

    grave: "#561519", graveEdge: "#74202A", town: "#1C1719", townWork: "#221C1E",

  // The Jurassic basemap's relief, as the Culprits map has it (SAT_RELIEF).

      -200, "rgba(26,70,86,0.38)", -40, "rgba(40,96,102,0.22)", 0, "rgba(40,90,90,0.1)",

      1700, "rgba(108,100,66,0.26)", 2500, "rgba(118,90,60,0.3)", 3300, "rgba(110,80,62,0.32)",

    sea: ["interpolate", ["linear"], ["elevation"],
      -8000, "rgba(10,22,42,0.6)", -3000, "rgba(12,26,46,0.55)", -1500, "rgba(14,32,52,0.42)",

  const PLATE = { url: "https://welcometoyourgalaxy.github.io/maps/invasion-of-nonhumans-atlas-plate.webp?v=1",
    fallback: "https://welcometoyourgalaxy.github.io/culprits/atlas-plate.webp?v=207", top: 85.05112877980659, bottom: -80.55, fadeIn: 3, fadeOut: 5 };
  const toPng = async (cv) => (cv.convertToBlob ? await cv.convertToBlob({ type: "image/png" }) : await new Promise((r) => cv.toBlob(r, "image/png"))).arrayBuffer();
  const canvas = (w, h) => (typeof OffscreenCanvas !== "undefined" ? new OffscreenCanvas(w, h) : Object.assign(document.createElement("canvas"), { width: w, height: h }));
  // Black Marble's sodium-orange lights redrawn by brightness in navy, cobalt, ice and bone.

    const m = params.url.match(/^nhnight:\/\/(\d+)\/(\d+)\/(\d+)$/);

  const merc = (lat) => (1 - Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) / Math.PI) / 2;

  // The credits start folded into their ⓘ button: with several rows on, the
  // open list covered the bottom of the map (round nh13).
  const foldCredits = () => { const a = document.querySelector(".maplibregl-ctrl-attrib"); if (a) { a.classList.remove("maplibregl-compact-show"); a.removeAttribute("open"); } };
  let creditsAsked = false;
  document.addEventListener("click", (e) => { if (e.target.closest && e.target.closest(".maplibregl-ctrl-attrib-button")) creditsAsked = true; }, true);
  for (const ev of ["idle", "sourcedata"]) map.on(ev, () => { if (!creditsAsked) foldCredits(); });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), "top-right");
  // The "Whole world" button (round nh12: words, not a symbol) takes the
  // map back out to the whole world.
  const HOME = { center: [10, 18], zoom: 2.3 };
  document.getElementById("world").addEventListener("click", () => map.easeTo(Object.assign({ bearing: 0, pitch: 0, duration: 900 }, HOME)));
  const pad = () => map.setPadding({ left: window.innerWidth > 720 ? 396 : 0, top: 0, right: 0, bottom: window.innerWidth > 720 ? 0 : Math.round(window.innerHeight * 0.5) });
  pad();
  window.addEventListener("resize", pad);
  let ready = false;
  map.on("load", () => {
    ready = true;
    const atlas = NonHumanAtlas.create({ map, maplibregl, pmtiles, panel: document.getElementById("nh-panel") });
    window.nonHumanAtlas = atlas;
    window.nonHumanMap = map;
    // Drawn when the map opens (round nh13, asked 19 October); each can be
    // unticked. Only on this page: inside the Culprits map nothing is drawn
    // until it is ticked there.
    for (const pid of ["ghm", "ocean", "papress", "conc", "paxin"]) atlas.open(pid, true);
  });

  // Each basemap's layers, added the first time it is chosen, under every
  // layer the rows draw.
  const OFM = { type: "vector", url: "https://tiles.openfreemap.org/planet", attribution: '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © OpenStreetMap contributors' };
  const RELIEF = { type: "raster-dem", tiles: ["https://tiles.mapterhorn.com/{z}/{x}/{y}.webp"], encoding: "terrarium", tileSize: 512, maxzoom: 12, attribution: '<a href="https://mapterhorn.com/attribution" target="_blank" rel="noopener">© Mapterhorn</a>' };
  const SEA = { type: "raster-dem", tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"], encoding: "terrarium", tileSize: 256, maxzoom: 12, attribution: '<a href="https://registry.opendata.aws/terrain-tiles/" target="_blank" rel="noopener">AWS Terrain Tiles</a>' };
  const ESRI = { type: "raster", tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"], tileSize: 256, maxzoom: 18, attribution: "Imagery © Esri, Maxar, Earthstar Geographics and the GIS user community" };
  const BASES = {
    night: () => {
      const road = (w) => ["interpolate", ["exponential", 1.4], ["zoom"], 6, w * .3, 10, w, 16, w * 5];
      const kind = (list) => ["match", ["get", "class"], list, true, false];
      const fade = (z0, z1, a) => ["interpolate", ["linear"], ["zoom"], z0, 0, z1, a];
      return { sources: { "b-night": { type: "raster", tiles: ["nhnight://{z}/{y}/{x}"], tileSize: 256, maxzoom: 8,
          attribution: '<a href="https://earthobservatory.nasa.gov/features/NightLights" target="_blank" rel="noopener">NASA Black Marble 2016</a> via GIBS' }, "b-relief": RELIEF, "b-sea": SEA, "b-osm": OFM },
        layers: [
          { id: "b-night-sheet", type: "background", paint: { "background-color": "#02040C" } },
          { id: "b-night-lights", type: "raster", source: "b-night", paint: { "raster-fade-duration": 200 } },
          { id: "b-night-shade", type: "hillshade", source: "b-relief", paint: NIGHT.shade },
          { id: "b-night-sea-glow", type: "color-relief", source: "b-sea", paint: { "color-relief-color": NIGHT.seaGlow, "color-relief-opacity": 1 } },
          { id: "b-night-road-glow", type: "line", source: "b-osm", "source-layer": "transportation", minzoom: 7, filter: kind(["motorway", "trunk", "primary"]),
            layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": NIGHT.roadGlow, "line-width": road(3), "line-blur": road(2.5), "line-opacity": fade(7, 10, .35) } },
          { id: "b-night-road-minor", type: "line", source: "b-osm", "source-layer": "transportation", minzoom: 11, filter: kind(["minor", "service", "street", "street_limited"]),
            paint: { "line-color": NIGHT.road[0], "line-width": road(.4), "line-opacity": fade(11, 13, 1) } },
          { id: "b-night-road", type: "line", source: "b-osm", "source-layer": "transportation", minzoom: 9, filter: kind(["secondary", "tertiary"]),
            paint: { "line-color": NIGHT.road[1], "line-width": road(.5), "line-opacity": fade(9, 11, 1) } },
          { id: "b-night-road-major", type: "line", source: "b-osm", "source-layer": "transportation", minzoom: 7, filter: kind(["motorway", "trunk", "primary"]),
            layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": NIGHT.road[2], "line-width": road(.6), "line-opacity": fade(7, 9, 1) } },
          { id: "b-night-border", type: "line", source: "land", paint: { "line-color": NIGHT.border, "line-width": ["interpolate", ["linear"], ["zoom"], 2, .4, 6, .8] } },
        ] };
    },
    atlas: () => ({
      sources: { "b-esri": ESRI,
        "b-hill": { type: "raster", tiles: ["https://services.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}"], tileSize: 256, maxzoom: 16, attribution: "Hillshade © Esri" },
        "b-plate": { type: "raster", tiles: ["nhplate://{z}/{x}/{y}"], tileSize: 256, maxzoom: 3, bounds: [-180, PLATE.bottom, 180, PLATE.top], attribution: "Painted atlas: Welcome to Your Galaxy" },
        "b-labels": { type: "raster", tiles: ["https://a.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}@2x.png?key=cb1_494p_1_eebbbfcb65bc573e54783d42"], tileSize: 256, attribution: "Labels © CARTO, © OpenStreetMap" } },
      layers: [
        { id: "b-atlas-sea", type: "background", paint: { "background-color": "#0B1017" } },
        { id: "b-atlas-img", type: "raster", source: "b-esri", paint: { "raster-brightness-min": .03, "raster-brightness-max": 1, "raster-saturation": .15, "raster-contrast": .05, "raster-hue-rotate": -6 } },
        { id: "b-atlas-hill", type: "raster", source: "b-hill", paint: { "raster-opacity": ["interpolate", ["linear"], ["zoom"], 4, .18, 9, .34, 13, .46] } },
        { id: "b-atlas-plate", type: "raster", source: "b-plate", paint: { "raster-opacity": ["interpolate", ["linear"], ["zoom"], PLATE.fadeIn, 1, PLATE.fadeOut, 0], "raster-fade-duration": 0 } },
        { id: "b-atlas-labels", type: "raster", source: "b-labels", paint: { "raster-opacity": ["interpolate", ["linear"], ["zoom"], PLATE.fadeIn, 0, PLATE.fadeOut, .92] } },
      ] }),
    // Jurassic: the Culprits map's basemap of that name (its Satellite
    // imagery basemap, map/app.js BASE_GRADE.satellite, SAT_RELIEF and
    // addSatelliteRelief): Esri's photographs lightly muted, a see-through
    // palette by height (deep green lowlands, olive, ochre and sienna slopes,
    // grey-brown rock; navy deeps and blue-green shelves at sea), Swiss-style
    // shading from four lights and a second north-west light, a calm navy
    // over the deep sea, and grey place names (round nh12, asked 19 October).
    // Its 3D terrain, grain and frame are not copied.
    jurassic: () => ({
      sources: { "b-esri": ESRI, "b-relief": RELIEF, "b-sea": SEA,
        "b-labels": { type: "raster", tiles: ["https://a.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}@2x.png?key=cb1_494p_1_eebbbfcb65bc573e54783d42"], tileSize: 256, attribution: "Labels © CARTO, © OpenStreetMap" } },
      layers: [
        { id: "b-jur-sea", type: "background", paint: { "background-color": "#0B1017" } },
        { id: "b-jur-img", type: "raster", source: "b-esri", paint: { "raster-brightness-min": 0.02, "raster-brightness-max": 0.92, "raster-saturation": 0.12, "raster-contrast": 0.06, "raster-hue-rotate": 0 } },
        { id: "b-jur-colour", type: "color-relief", source: "b-relief", paint: { "color-relief-color": JURASSIC.colour, "color-relief-opacity": 1 } },
        { id: "b-jur-seabed", type: "color-relief", source: "b-sea", paint: { "color-relief-color": JURASSIC.seabed, "color-relief-opacity": 1 } },
        { id: "b-jur-shade", type: "hillshade", source: "b-relief", paint: JURASSIC.shade },
        { id: "b-jur-depth", type: "hillshade", source: "b-relief", paint: JURASSIC.depth },
        { id: "b-jur-calm", type: "color-relief", source: "b-sea", paint: { "color-relief-color": JURASSIC.sea, "color-relief-opacity": 1 } },
        { id: "b-jur-labels", type: "raster", source: "b-labels", paint: { "raster-opacity": 0.8, "raster-saturation": -1 } },
      ] }),
    hell: () => {
      const road = (w) => ["interpolate", ["exponential", 1.4], ["zoom"], 4, w * .25, 10, w, 16, w * 6];
      const kind = (list) => ["match", ["get", "class"], list, true, false];
      const fade = (z0, z1, a) => ["interpolate", ["linear"], ["zoom"], z0, 0, z1, a];
      const nm = ["coalesce", ["get", "name_en"], ["get", "name:latin"], ["get", "name"]];
      const zs = (...a) => ["interpolate", ["linear"], ["zoom"], ...a];
      const halo = (c, w) => ({ "text-halo-color": c, "text-halo-width": w, "text-halo-blur": 0.6 });
      const N = HELL.name, F = HELL.font;
      return { sources: { "b-relief": RELIEF, "b-sea": SEA, "b-osm": OFM },
        layers: [
          { id: "b-hell-sheet", type: "background", paint: { "background-color": HELL.sheet } },
          { id: "b-hell-ground", type: "color-relief", source: "b-sea", paint: { "color-relief-color": HELL.ground, "color-relief-opacity": 1 } },
          { id: "b-hell-shade", type: "hillshade", source: "b-relief", paint: HELL.shade },
          { id: "b-hell-coast", type: "fill", source: "b-osm", "source-layer": "water", minzoom: 7, filter: ["==", ["get", "class"], "ocean"],
            paint: { "fill-color": HELL.coast, "fill-opacity": fade(7, 9, 1) } },
          { id: "b-hell-lake", type: "fill", source: "b-osm", "source-layer": "water", filter: ["!=", ["get", "class"], "ocean"],
            paint: { "fill-color": HELL.lake, "fill-outline-color": HELL.lakeEdge } },
          { id: "b-hell-town", type: "fill", source: "b-osm", "source-layer": "landuse", minzoom: 6, filter: kind(["residential", "commercial", "industrial", "retail", "suburb", "neighbourhood"]),
            paint: { "fill-color": ["match", ["get", "class"], "industrial", HELL.townWork, HELL.town], "fill-opacity": fade(6, 8, .9) } },
          { id: "b-hell-grave", type: "fill", source: "b-osm", "source-layer": "landuse", minzoom: 9, filter: ["==", ["get", "class"], "cemetery"],
            paint: { "fill-color": HELL.grave, "fill-outline-color": HELL.graveEdge, "fill-opacity": fade(9, 11, .8) } },
          { id: "b-hell-river-glow", type: "line", source: "b-osm", "source-layer": "waterway", minzoom: 3, filter: ["==", ["get", "class"], "river"],
            layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": HELL.riverGlow, "line-width": road(4), "line-blur": road(3), "line-opacity": .45 } },
          { id: "b-hell-river", type: "line", source: "b-osm", "source-layer": "waterway", minzoom: 3, layout: { "line-cap": "round", "line-join": "round" },
            paint: { "line-color": HELL.river,
              "line-width": ["interpolate", ["exponential", 1.4], ["zoom"], 4, ["match", ["get", "class"], "river", .25, .11], 10, ["match", ["get", "class"], "river", 1, .45], 16, ["match", ["get", "class"], "river", 6, 2.7]],
              "line-opacity": ["interpolate", ["linear"], ["zoom"], 8, ["match", ["get", "class"], "river", .9, 0], 11, ["match", ["get", "class"], "river", .9, .7]] } },
          { id: "b-hell-rail", type: "line", source: "b-osm", "source-layer": "transportation", minzoom: 9, filter: kind(["rail", "transit"]),
            paint: { "line-color": HELL.rail, "line-width": 1, "line-dasharray": [3, 2] } },
          { id: "b-hell-road-minor", type: "line", source: "b-osm", "source-layer": "transportation", minzoom: 11, filter: kind(["minor", "service", "track", "street", "street_limited"]),
            paint: { "line-color": HELL.road[0], "line-width": road(.45) } },
          { id: "b-hell-road", type: "line", source: "b-osm", "source-layer": "transportation", minzoom: 7, filter: kind(["secondary", "tertiary"]),
            paint: { "line-color": HELL.road[1], "line-width": road(.6) } },
          { id: "b-hell-road-major", type: "line", source: "b-osm", "source-layer": "transportation", minzoom: 4, filter: kind(["motorway", "trunk", "primary"]),
            paint: { "line-color": HELL.road[2], "line-width": road(.8), "line-opacity": fade(4, 6, 1) } },
          { id: "b-hell-buildings", type: "fill", source: "b-osm", "source-layer": "building", minzoom: 13, paint: { "fill-color": HELL.building, "fill-opacity": .9 } },
          { id: "b-hell-border", type: "line", source: "land", paint: { "line-color": HELL.border, "line-width": ["interpolate", ["linear"], ["zoom"], 2, .5, 5, .9] } },
          { id: "b-hell-name-ocean", type: "symbol", source: "b-osm", "source-layer": "water_name", filter: kind(["ocean", "sea"]),
            layout: { "text-field": nm, "text-font": F.italic, "text-size": zs(1, 11, 6, 16), "text-letter-spacing": 0.22, "text-max-width": 6 },
            paint: Object.assign({ "text-color": N.water }, halo(N.haloWater, 1)) },
          { id: "b-hell-name-water", type: "symbol", source: "b-osm", "source-layer": "water_name", minzoom: 5, filter: ["!", kind(["ocean", "sea"])],
            layout: { "text-field": nm, "text-font": F.italic, "text-size": zs(5, 11, 14, 14), "text-letter-spacing": 0.08, "text-max-width": 7 },
            paint: Object.assign({ "text-color": N.water }, halo(N.haloWater, 1)) },
          { id: "b-hell-name-river", type: "symbol", source: "b-osm", "source-layer": "waterway", minzoom: 9,
            layout: { "text-field": nm, "text-font": F.italic, "text-size": zs(9, 11, 15, 14), "symbol-placement": "line", "text-letter-spacing": 0.1 },
            paint: Object.assign({ "text-color": N.water }, halo(N.haloWater, 1)) },
          { id: "b-hell-name-peak", type: "symbol", source: "b-osm", "source-layer": "mountain_peak", minzoom: 9,
            layout: { "text-field": nm, "text-font": F.italic, "text-size": 12, "text-max-width": 7 },
            paint: Object.assign({ "text-color": N.peak }, halo(N.halo, 1.1)) },
          { id: "b-hell-name-village", type: "symbol", source: "b-osm", "source-layer": "place", minzoom: 11, filter: kind(["village", "hamlet", "suburb", "neighbourhood", "quarter"]),
            layout: { "text-field": nm, "text-font": F.regular, "text-size": zs(11, 11, 16, 14), "text-max-width": 7 },
            paint: Object.assign({ "text-color": N.minor }, halo(N.halo, 1.2)) },
          { id: "b-hell-name-town", type: "symbol", source: "b-osm", "source-layer": "place", minzoom: 7, filter: kind(["town"]),
            layout: { "text-field": nm, "text-font": F.regular, "text-size": zs(7, 11, 14, 16), "text-max-width": 7 },
            paint: Object.assign({ "text-color": N.town }, halo(N.halo, 1.2)) },
          { id: "b-hell-name-state", type: "symbol", source: "b-osm", "source-layer": "place", minzoom: 4, maxzoom: 9, filter: kind(["state", "province"]),
            layout: { "text-field": nm, "text-font": F.italic, "text-size": zs(4, 10, 8, 13), "text-transform": "uppercase", "text-letter-spacing": 0.15, "text-max-width": 8 },
            paint: Object.assign({ "text-color": N.state, "text-opacity": 0.9 }, halo(N.halo, 1)) },
          { id: "b-hell-name-city", type: "symbol", source: "b-osm", "source-layer": "place", minzoom: 3, filter: kind(["city"]),
            layout: { "text-field": nm, "text-font": F.bold, "text-size": zs(3, 11, 8, 15, 14, 20), "text-max-width": 7 },
            paint: Object.assign({ "text-color": N.city }, halo(N.halo, 1.3)) },
          { id: "b-hell-name-country", type: "symbol", source: "b-osm", "source-layer": "place", maxzoom: 8, filter: kind(["country"]),
            layout: { "text-field": nm, "text-font": F.bold, "text-size": zs(1, 10, 3, 13, 6, 17), "text-transform": "uppercase", "text-letter-spacing": 0.26, "text-max-width": 7 },
            paint: Object.assign({ "text-color": N.country }, halo(N.halo, 1.3)) },
        ] };
    },
    sat: () => ({
      sources: { "b-s2": { type: "raster", tiles: ["https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2024_3857/default/g/{z}/{y}/{x}.jpg"], tileSize: 256, maxzoom: 14,
          attribution: '<a href="https://s2maps.eu" target="_blank" rel="noopener">Sentinel-2 cloudless - https://s2maps.eu</a> by EOX IT Services GmbH (Contains modified Copernicus Sentinel data 2024)' }, "b-esri": ESRI },
      layers: [
        { id: "b-sat-s2", type: "raster", source: "b-s2", maxzoom: 13.25, paint: { "raster-brightness-min": 0.02, "raster-brightness-max": 0.92, "raster-saturation": 0.12, "raster-contrast": 0.06 } },
        { id: "b-sat-close", type: "raster", source: "b-esri", minzoom: 12.5, paint: { "raster-brightness-min": 0.02, "raster-brightness-max": 0.92, "raster-saturation": 0.12, "raster-contrast": 0.06,
          "raster-opacity": ["interpolate", ["linear"], ["zoom"], 12.5, 0, 13.25, 1] } },
      ] }),
  };
  const added = new Set();
  const firstRow = () => ((map.getStyle().layers || []).find((l) => /^nh-/.test(l.id)) || {}).id;
  function setBase(kind) {
    if (BASES[kind] && !added.has(kind)) {
      const b = BASES[kind]();
      if (kind === "hell" && map.setGlyphs && !map.getGlyphs()) map.setGlyphs(HELL.glyphs);
      for (const [k, v] of Object.entries(b.sources)) if (!map.getSource(k)) map.addSource(k, v);
      // Names go above the rows (as on the Culprits map); everything else under them.
      for (const l of b.layers) map.addLayer(Object.assign({}, l, { layout: Object.assign({}, l.layout || {}, { visibility: "none" }) }), l.type === "symbol" ? undefined : map.getLayer("land-edge") ? "land-edge" : firstRow());
      added.add(kind);
    }
    for (const k of added) for (const l of BASES[k]().layers) if (map.getLayer(l.id)) map.setLayoutProperty(l.id, "visibility", k === kind ? "visible" : "none");
    map.setLayoutProperty("land", "visibility", kind === "land" ? "visible" : "none");
    map.setLayoutProperty("land-edge", "visibility", kind === "land" || kind === "sat" ? "visible" : "none");
  }
  document.getElementById("basemap").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-base]");
    if (!b) return;
    // Round nh12: the basemap changes as soon as the map has loaded once.
    // isStyleLoaded() is false whenever any row's squares are still coming
    // (the sea runoff row's never all settle), and waiting for "load" then
    // waited for ever, so the buttons did nothing while such a row was on.
    const go = () => setBase(b.dataset.base);
    if (ready) go(); else map.once("load", go);
    for (const x of document.querySelectorAll("#basemap button")) x.classList.toggle("on", x === b);
  });
  document.getElementById("fold").addEventListener("click", (e) => {
    const s = document.getElementById("side");
    s.classList.toggle("folded");
    e.target.textContent = s.classList.contains("folded") ? "Open ▾" : "Fold up ▴";
  });
})();
</script>
