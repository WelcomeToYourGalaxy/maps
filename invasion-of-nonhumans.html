<!--
  nh-core: everything the map does, kept in one script so the Culprits map can
  run this same code as its "Invasion of non-humans" row (it reads this file
  from the maps repo and runs this script, so the boxes there are these boxes).
  It needs only a MapLibre map and an element to put its rows in.
-->
<script id="nh-core">
(function (G) {
  "use strict";
  if (G.NonHumanAtlas && G.NonHumanAtlas.VERSION) return;

  const TILES = "https://welcometoyourgalaxy.github.io/culprits-tiles-more/";
  const NH = TILES + "nonhuman/";
  const GFW = "https://data-api.globalforestwatch.org";
  const GBIF = "https://api.gbif.org";
  const GSN = "https://api.gsn.naturedatalab.org/geo-analysis/layers";
  const BOUNDARIES = "https://raw.githubusercontent.com/WelcomeToYourGalaxy/culprits/main/map/data/boundaries.geojson";

  // Colours: teal to cobalt for amounts, plum, rose and bone for points. No
  // green, yellow or orange anywhere. (Round nh12 tried the Biodiversity
  // Intactness Index's violet to blue throughout; round nh13 went back to
  // these, asked 19 October.)
  const RAMP7 = ["#D6EEF6", "#9CD6E6", "#5FB8D2", "#2E8FBA", "#1E6FA8", "#13447A", "#0C2E5E"];
  const RAMP10 = ["#E4F3F8", "#C6E7F0", "#9CD6E6", "#6FC2DA", "#46AACB", "#2E8FBA", "#2275A8", "#1A5C92", "#13447A", "#0C2E5E"];
  const hex3 = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  // n colours of the ten-step ramp, light to dark (as the copies are made).
  const tealRamp = (n) => n <= 1 ? [RAMP10[5]] : Array.from({ length: n }, (_, i) => RAMP10[Math.round(i * 9 / (n - 1))]);
  const EDGE = "#08203F";
  const IUCN = [
    ["Ia", "#0C2E5E", "Ia: strict nature reserve"],
    ["Ib", "#13447A", "Ib: wilderness area"],
    ["II", "#1E6FA8", "II: national park"],
    ["III", "#2E8FBA", "III: natural monument or feature"],
    ["IV", "#46AACB", "IV: habitat or species management area"],
    ["V", "#7DC6DC", "V: protected landscape or seascape"],
    ["VI", "#B4DFEC", "VI: protected area with sustainable use of natural resources"],
    ["Not Reported", "#8A8F98", "Not reported"],
    ["Not Applicable", "#6E737B", "Not applicable"],
    ["Not Assigned", "#A3A7AD", "Not assigned"],
  ];
  const IUCN_OTHER = "#5E6470";
  const POINT = ["#E9E1D3", "#D08A9C", "#9A5878", "#B9A6C9", "#C7B49A", "#7E92B8", "#E2B8C4", "#8E6C8A", "#A9C4D2", "#C99A8E"];
  // Distance from a protected area, inside to further.
  const BANDCOL = ["#E2B8C4", "#D08A9C", "#9A5878", "#7A4A6E", "#6E6A66"];

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = (v, d = 0) => (v == null || v === "" || !isFinite(Number(v))) ? "—" : Number(v).toLocaleString("en", { maximumFractionDigits: d });
  const money = (v) => {
    if (v == null || !isFinite(v)) return "—";
    const a = Math.abs(v);
    return a >= 1e9 ? `US$${num(v / 1e9, 2)} billion` : a >= 1e6 ? `US$${num(v / 1e6, 1)} million` : `US$${num(v)}`;
  };
  const yearLabel = (y) => (y < 0 ? `${num(-y)} BCE` : `${y} CE`);

  const jsonCache = new Map();
  function json(url, ms = 45000) {
    if (!jsonCache.has(url)) {
      const p = (async () => {
        const ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
        const t = ctl ? setTimeout(() => ctl.abort(), ms) : null;
        try {
          const r = await fetch(url, ctl ? { signal: ctl.signal } : {});
          if (!r.ok) throw new Error(r.status === 404 ? "not built yet" : `answered ${r.status}`);
          return await r.json();
        } catch (e) {
          throw new Error(e && e.name === "AbortError" ? "no answer in time" : (e && e.message) || String(e));
        } finally { if (t) clearTimeout(t); }
      })();
      p.catch(() => jsonCache.delete(url));
      jsonCache.set(url, p);
    }
    return jsonCache.get(url);
  }

  // Classes for country shading: up to seven, cut where the values fall
  // (quantiles), every value kept.
  function classes(values, n = 7) {
    const v = values.filter((x) => isFinite(x) && x > 0).sort((a, b) => a - b);
    if (!v.length) return [];
    const cuts = [];
    for (let i = 1; i < n; i++) cuts.push(v[Math.min(v.length - 1, Math.floor(i * v.length / n))]);
    const uniq = [...new Set(cuts)].filter((c) => c > v[0]);
    return uniq;
  }
  function classOf(x, cuts) { let i = 0; while (i < cuts.length && x >= cuts[i]) i++; return i; }
  function rampFor(k) {
    if (k <= 1) return [RAMP7[4]];
    const out = [];
    for (let i = 0; i < k; i++) out.push(RAMP7[Math.round(i * (RAMP7.length - 1) / (k - 1))]);
    return out;
  }
  function classKey(cuts, values, fmtv) {
    const v = values.filter((x) => isFinite(x) && x > 0);
    if (!v.length) return [];
    const lo = Math.min(...v), hi = Math.max(...v);
    const edges = [lo, ...cuts, hi];
    const cols = rampFor(cuts.length + 1);
    return cols.map((c, i) => [c, i === cols.length - 1 ? `${fmtv(edges[i])} to ${fmtv(edges[i + 1])}` : `${fmtv(edges[i])} to under ${fmtv(edges[i + 1])}`]);
  }

  // Where a point falls in a map square at zoom z.
  function tileOf(lng, lat, z) {
    const n = 2 ** z, r = lat * Math.PI / 180;
    const x = (lng + 180) / 360 * n;
    const y = (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n;
    return { x, y, tx: Math.floor(x), ty: Math.floor(y) };
  }

  // Draws a picture, lets fn change its pixels, and returns it as PNG bytes.
  async function repaint(bmp, fn) {
    const cv = typeof OffscreenCanvas !== "undefined" ? new OffscreenCanvas(bmp.width, bmp.height) : Object.assign(document.createElement("canvas"), { width: bmp.width, height: bmp.height });
    const cx = cv.getContext("2d");
    cx.drawImage(bmp, 0, 0);
    const img = cx.getImageData(0, 0, bmp.width, bmp.height);
    fn(img.data);
    cx.putImageData(img, 0, 0);
    const blob = cv.convertToBlob ? await cv.convertToBlob({ type: "image/png" }) : await new Promise((res) => cv.toBlob(res, "image/png"));
    return blob.arrayBuffer();
  }
  let EMPTY = null;
  function emptyPng() {
    if (!EMPTY) {
      const cv = typeof OffscreenCanvas !== "undefined" ? new OffscreenCanvas(1, 1) : Object.assign(document.createElement("canvas"), { width: 1, height: 1 });
      cv.getContext("2d");
      EMPTY = (cv.convertToBlob ? cv.convertToBlob({ type: "image/png" }) : new Promise((res) => cv.toBlob(res, "image/png"))).then((b) => b.arrayBuffer());
    }
    return EMPTY.then((b) => b.slice(0));
  }
  const pmCache = new Map();
  let PMLIB = null;
  function archiveOf(url) {
    const pmLib = PMLIB || G.pmtiles;
    const u = url.replace(/^pmtiles:\/\//, "");
    if (!pmCache.has(u)) pmCache.set(u, new pmLib.PMTiles(u));
    return pmCache.get(u);
  }

  // An archive's picture with some classes hidden, and, when o.cols is given,
  // its classes given other colours (o.alpha: how solid each). With neither,
  // the archive is drawn as it was made. Returns { key, url(archive, hidden) }.
  function bii(key, o = {}) {
    const rows = (key || []).filter((r) => r[2] !== "h" && /^#[0-9a-f]{6}$/i.test(r[0] || ""));
    const swapping = !!(o.cols || o.alpha);
    const cols = o.cols || rows.map((r) => r[0]);
    const alpha = o.alpha || rows.map(() => 1);
    const map = new Map(rows.map((r, i) => [r[0].toUpperCase(), [cols[i], alpha[i]]]));
    const swap = rows.map((r) => { const [c, a] = map.get(r[0].toUpperCase()); return `${r[0].slice(1)}-${c.slice(1)}${a !== 1 ? `-${Math.round(a * 100)}` : ""}`; }).join(",");
    return {
      key: (key || []).map((r) => { const m = r[2] !== "h" && map.get(String(r[0]).toUpperCase()); return m ? [m[1] === 1 ? m[0] : `rgba(${hex3(m[0]).join(",")},${m[1].toFixed(2)})`, r[1]] : r; }),
      url: (archive, hidden) => (!swapping && !(hidden && hidden.length)) ? archive
        : `nhpm://h/${hidden && hidden.length ? hidden.map((c) => c.slice(1)).join(",") : "-"}/{z}/{x}/{y}?${swapping ? `m=${swap}&` : ""}a=${encodeURIComponent(archive)}`,
      colourOf: (c) => (map.get(String(c).toUpperCase()) || [c])[0],
    };
  }

  // The squares of an nhpm picture (see the protocol in create), each made
  // once and kept, the last 600, so a timeline's next step can be made ahead
  // while the current one shows (round nh12).
  const nhpmCache = new Map();
  function nhpmTile(url) {
    if (nhpmCache.has(url)) { const v = nhpmCache.get(url); nhpmCache.delete(url); nhpmCache.set(url, v); return v; }
    const p = (async () => {
        const m = url.match(/^nhpm:\/\/h\/([^/]*)\/(\d+)\/(\d+)\/(\d+)\?(?:m=([^&]*)&)?a=(.+)$/);
        if (!m) throw new Error("not a class picture");
        const arch = archiveOf(decodeURIComponent(m[6]));
        const got = await arch.getZxy(Number(m[2]), Number(m[3]), Number(m[4]));
        if (!got || !got.data) return emptyPng();
        const rgb = (h) => [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
        const hidden = m[1] === "-" || !m[1] ? [] : m[1].split(",").map(rgb);
        const swap = m[5] ? m[5].split(",").map((x) => { const [f, t, a] = x.split("-"); return [rgb(f), rgb(t), a ? Number(a) / 100 : 1]; }) : [];
        if (!hidden.length && !swap.length) return got.data;
        const bmp = await createImageBitmap(new Blob([got.data]));
        const seen = new Map();
        const near = (px, i, c) => Math.abs(px[i] - c[0]) + Math.abs(px[i + 1] - c[1]) + Math.abs(px[i + 2] - c[2]) < 14;
        return repaint(bmp, (px) => {
          for (let i = 0; i < px.length; i += 4) {
            if (!px[i + 3]) continue;
            const k = (px[i] << 16) | (px[i + 1] << 8) | px[i + 2];
            let to = seen.get(k);
            if (to === undefined) {
              to = null;
              if (hidden.some((h) => near(px, i, h))) to = 0;
              else { const w = swap.find((x) => near(px, i, x[0])); if (w) to = w; }
              seen.set(k, to);
            }
            if (to === 0) px[i + 3] = 0;
            else if (to) { px[i] = to[1][0]; px[i + 1] = to[1][1]; px[i + 2] = to[1][2]; if (to[2] !== 1) px[i + 3] = Math.round(px[i + 3] * to[2]); }
          }
        });
    })();
    p.catch(() => nhpmCache.delete(url));
    nhpmCache.set(url, p);
    while (nhpmCache.size > 600) nhpmCache.delete(nhpmCache.keys().next().value);
    return p;
  }

  const CSS = `

`;

  function create(opts) {
    const map = opts.map;
    const ml = opts.maplibregl || G.maplibregl;
    const pm = opts.pmtiles || G.pmtiles;
    const P = opts.prefix || "nh-";
    const host = opts.panel;
    const boundariesUrl = opts.boundaries || BOUNDARIES;
    const say = typeof opts.onStatus === "function" ? opts.onStatus : () => {};
    if (pm) PMLIB = pm;
    let shown = true;            // the whole map on or off (the Culprits row)
    const parts = [];
    const on = new Set();
    const layersOf = new Map();   // part id -> [layer ids]
    let popup = null;

    if (typeof document !== "undefined" && !document.getElementById("nh-css")) {
      const st = document.createElement("style");
      st.id = "nh-css";
      st.textContent = CSS;
      document.head.appendChild(st);
    }
    if (!opts.embedded && pm && ml && !G.__nhPm) {
      const protocol = new pm.Protocol();
      ml.addProtocol("pmtiles", protocol.tile);
      G.__nhPm = true;
    }
    // Pictures served in another map's colours are redrawn in this map's
    // teal-to-cobalt, light to dark by how light the source pixel was.
    if (ml && !G.__nhRecolour) {
      G.__nhRecolour = true;
      const ramp = RAMP7.map((h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);

        const url = params.url.replace(/^nhrecolour:\/\//, "");
        const r = await fetch(url, { signal: ac && ac.signal });
        if (!r.ok) throw new Error(String(r.status));
        const buf = await r.arrayBuffer();
        let bmp;
        try { bmp = await createImageBitmap(new Blob([buf])); } catch (e) { return { data: buf }; }
        const cv = typeof OffscreenCanvas !== "undefined" ? new OffscreenCanvas(bmp.width, bmp.height) : Object.assign(document.createElement("canvas"), { width: bmp.width, height: bmp.height });

        cx.drawImage(bmp, 0, 0);

        for (let i = 0; i < px.length; i += 4) {

          const l = (Math.max(px[i], px[i + 1], px[i + 2]) + Math.min(px[i], px[i + 1], px[i + 2])) / 510;
          const t = Math.max(0, Math.min(1, 1 - l)) * (ramp.length - 1);
          const a = ramp[Math.floor(t)], b = ramp[Math.min(ramp.length - 1, Math.floor(t) + 1)], f = t - Math.floor(t);
          px[i] = a[0] + (b[0] - a[0]) * f; px[i + 1] = a[1] + (b[1] - a[1]) * f; px[i + 2] = a[2] + (b[2] - a[2]) * f;

    }

    // Pictures that only mark where something is (one colour) are redrawn in
    // one of this map's colours, keeping their edges: nhsolid://RRGGBB/<url>.
    if (ml && !G.__nhSolid) {
      G.__nhSolid = true;
      ml.addProtocol("nhsolid", async (params, ac) => {
        const m = params.url.match(/^nhsolid:\/\/([0-9a-fA-F]{6})\/(.+)$/);
        if (!m) throw new Error("not a solid picture");
        const r = await fetch(m[2], { signal: ac && ac.signal });
        if (!r.ok) throw new Error(String(r.status));
        const buf = await r.arrayBuffer();
        let bmp;
        try { bmp = await createImageBitmap(new Blob([buf])); } catch (e) { return { data: buf }; }
        const c = [parseInt(m[1].slice(0, 2), 16), parseInt(m[1].slice(2, 4), 16), parseInt(m[1].slice(4, 6), 16)];
        return { data: await repaint(bmp, (px) => { for (let i = 0; i < px.length; i += 4) if (px[i + 3]) { px[i] = c[0]; px[i + 1] = c[1]; px[i + 2] = c[2]; } }) };
      });
    }
    // A picture archive with some of its classes taken out (their colours made
    // clear) and its colours swapped for this map's:
    // nhpm://h/<hidden colours, comma-separated, or ->/{z}/{x}/{y}?m=<from-to[-alpha%],...>&a=<archive>.
    // Round nh12: the archives keep the colours they were made in, and are
    // shown here in the Biodiversity Intactness colours, class by class.
    if (ml && pm && !G.__nhPmClasses) {
      G.__nhPmClasses = true;
      ml.addProtocol("nhpm", (params) => nhpmTile(params.url).then((data) => ({ data: data.slice(0) })));
    }

    // Squares asked for again when the server fails or is slow: nhretry://<url>
    // (round nh12: GBIF's squares for busy parts of the world, such as Europe
    // and Asia at the widest views, sometimes fail the first time, and
    // MapLibre does not ask again, so a quarter of the world stayed empty).
    if (ml && !G.__nhRetry) {
      G.__nhRetry = true;
      ml.addProtocol("nhretry", async (params, ac) => {
        const url = params.url.replace(/^nhretry:\/\//, "");
        let last = null;
        for (let i = 0; i < 4; i++) {
          if (ac && ac.signal && ac.signal.aborted) throw new Error("aborted");
          try {
            const r = await fetch(url, { signal: ac && ac.signal });
            if (r.ok) return { data: await r.arrayBuffer() };
            if (r.status === 404 || r.status === 400) return { data: new ArrayBuffer(0) };

          } catch (e) { last = e; if (ac && ac.signal && ac.signal.aborted) throw e; }
          await new Promise((res) => setTimeout(res, 1500 * (i + 1)));
        }
        throw last || new Error("no answer");
      });
    }

    /* ---------- map helpers ---------- */
    const id = (s) => P + s;
    function addSource(s, spec) { if (!map.getSource(id(s))) map.addSource(id(s), spec); }
    function addLayer(part, spec, before) {
      const full = Object.assign({}, spec, { id: id(spec.id) });
      if (spec.source && !spec.source.startsWith(P) && map.getSource(id(spec.source))) full.source = id(spec.source);
      full.layout = Object.assign({}, spec.layout || {}, { visibility: shown && on.has(part.id) && !(part.off && part.off.has(full.id)) ? "visible" : "none" });
      if (map.getLayer(full.id)) map.removeLayer(full.id);
      map.addLayer(full, before && map.getLayer(before) ? before : undefined);
      const list = layersOf.get(part.id) || [];
      if (!list.includes(full.id)) list.push(full.id);
      layersOf.set(part.id, list);
      return full.id;
    }
    function dropLayer(part, lid) {
      const full = id(lid);
      if (map.getLayer(full)) map.removeLayer(full);
      layersOf.set(part.id, (layersOf.get(part.id) || []).filter((x) => x !== full));
    }
    function dropSource(s) { if (map.getSource(id(s))) map.removeSource(id(s)); }
    // A part's own choices can keep some of its layers hidden (part.off).
    function setVis(part) {
      const vis = shown && on.has(part.id) ? "visible" : "none";
      const off = part.off || new Set();
      const mine = layersOf.get(part.id) || [];
      for (const l of mine) if (map.getLayer(l)) map.setLayoutProperty(l, "visibility", vis === "visible" && !off.has(l) ? "visible" : "none");
      // A map this runs inside may add layers of its own beside these (the
      // Culprits map rings small sets of dots, as "<layer>-ring"): they follow.
      const style = map.getStyle && map.getStyle();
      for (const l of (style && style.layers) || []) {
        if (!l.id.startsWith(P) || mine.includes(l.id)) continue;
        const owner = mine.filter((m) => l.id.startsWith(m + "-")).sort((a, b) => b.length - a.length)[0];
        if (owner) map.setLayoutProperty(l.id, "visibility", vis === "visible" && !off.has(owner) ? "visible" : "none");
      }
    }

    // One picture per part. A new picture is laid over the old one unseen,
    // and once its squares in view have arrived it fades in and the old one is
    // taken away, so stepping through years never shows a blank map (round
    // nh11). Returns a promise kept when the new picture is showing.
    function raster(part, url, o = {}) {
      const n = (part._rseq = (part._rseq || 0) + 1);
      const old = (part._rids || []).slice();
      const clear = (list) => {
        for (const r of list) { dropLayer(part, r); dropSource(r); }
        part._rids = (part._rids || []).filter((x) => !list.includes(x));
      };
      if (!url) { clear(old); return Promise.resolve(); }
      const sid = `${part.id}-r${n}`;
      const spec = /^pmtiles:/.test(url) || (/^https?:/.test(url) && /\.pmtiles$/.test(url))
        ? { type: "raster", url: /^pmtiles:/.test(url) ? url : "pmtiles://" + url, tileSize: 256 }
        : { type: "raster", tiles: [url], tileSize: 256, maxzoom: o.maxzoom || 12 };

      addSource(sid, spec);
      const target = o.opacity || 0.86, fade = part._fastFade != null ? part._fastFade : o.fade == null ? 260 : o.fade;
      addLayer(part, { id: sid, type: "raster", source: sid,

        return new Promise((res) => setTimeout(() => { if (part._rseq === n) clear(old); res(); }, fade + 40));
      });
    }
    // Kept when the source's squares in view have arrived (or after ms).
    // Round nh12: MapLibre's own "loaded" flag stayed false for these
    // pictures even once every square had come, so each change waited the
    // full six seconds (the slow switching and playing asked about on 19
    // October). Now: kept once squares have come and none has come for a
    // short spell, or at once if MapLibre says it is loaded.
    function loaded(sid, ms) {
      const full = id(sid);
      return new Promise((res) => {
        let done = false, last = 0;
        const t0 = Date.now();
        const finish = () => { if (done) return; done = true; map.off("sourcedata", on); clearInterval(poll); clearTimeout(t); res(); };
        const on = (e) => { if (e.sourceId === full && e.tile) last = Date.now(); };

          if (v === true) return finish();
          if (v === false) return;

    // page pins MapLibre 5.24), or null where that list cannot be read.

    }
    // A picture from an archive in this map's colours (bii above), drawn to
    // the archive's own deepest zoom and enlarged beyond it.
    async function rasterBii(part, archive, B, o = {}) {

      let head = null;

    }
    // Pictures go under every line and point this map draws.
    function firstAbove() {
      const style = map.getStyle && map.getStyle();
      const ls = (style && style.layers) || [];
      const mine = ls.find((l) => l.id.startsWith(P) && l.type !== "raster" && l.type !== "fill");
      return mine ? mine.id : undefined;
    }

    // The country shapes, loaded once, shared by every shaded part.
    let countriesReady = null;
    function countries() {
      if (!countriesReady) {
        countriesReady = json(boundariesUrl, 60000).then((gj) => {
          addSource("countries", { type: "geojson", data: gj });
          const names = {};
          for (const f of gj.features || []) {
            const p = f.properties || {};
            if (p.iso3) names[p.iso3] = p.name || p.iso3;
          }
          return names;
        }).catch((e) => { countriesReady = null; throw e; });
      }
      return countriesReady;
    }
    // Shades the countries for one part. values: {ISO3: number}.
    function shade(part, values, fmtv, unitWords) {
      const vals = Object.values(values).filter((v) => isFinite(v) && v > 0);
      const cuts = classes(vals);
      const cols = rampFor(cuts.length + 1);
      const expr = ["match", ["get", "iso3"]];
      const seen = new Set();
      for (const [iso, v] of Object.entries(values)) {
        if (seen.has(iso) || !isFinite(v)) continue;
        seen.add(iso);
        expr.push(iso, v > 0 ? cols[classOf(v, cuts)] : "#3A4350");
      }
      expr.push("rgba(0,0,0,0)");
      const fill = expr.length > 3 ? expr : "rgba(0,0,0,0)";
      if (!map.getLayer(id(`${part.id}-fill`))) {

        addLayer(part, { id: `${part.id}-edge`, type: "line", source: "countries", paint: { "line-color": EDGE, "line-width": 0.6, "line-opacity": 0.8 } });
      } else map.setPaintProperty(id(`${part.id}-fill`), "fill-color", fill);
      const key = classKey(cuts, vals, fmtv);
      const zero = Object.values(values).some((v) => isFinite(v) && v <= 0);
      return keyHtml((unitWords ? [["", unitWords, "h"]] : []).concat(key, zero ? [["#3A4350", "none recorded (0)"]] : []));
    }
    function keyHtml(rows, dots) {
      return `<div class="nh-key">` + rows.map(([c, t, h]) => h === "h" ? `<div class="h">${esc(t)}</div>`
        : `<div><i class="${dots ? "dot" : ""}" style="background:${esc(c)};color:${esc(c)}"></i>${esc(t)}</div>`).join("") + `</div>`;
    }

    // only at the top of a curve, so the halo gets a curve of its own).
    function scaled(r, k) {

        const out = r.slice(0, 3);

    }
    // A glowing dot layer: a soft halo and a core, sized by zoom.

      return addLayer(part, Object.assign({ id: `${part.id}-${o.name || "pt"}`, type: "circle",
        paint: { "circle-color": colour, "circle-radius": r, "circle-blur": 0.35, "circle-opacity": 0.95,

    }

    // The class of a picture at a place: the archive's own square at its
    // deepest zoom is read and its pixel matched to the key's colours.
    async function pictureAt(url, lng, lat, key) {
      if (!pm || !url) return null;
      const arch = archiveOf(url);
      const h = await arch.getHeader();
      const t = tileOf(lng, lat, h.maxZoom);
      const got = await arch.getZxy(h.maxZoom, t.tx, t.ty);
      if (!got || !got.data) return null;
      const bmp = await createImageBitmap(new Blob([got.data]));
      const cv = typeof OffscreenCanvas !== "undefined" ? new OffscreenCanvas(bmp.width, bmp.height) : Object.assign(document.createElement("canvas"), { width: bmp.width, height: bmp.height });
      const cx = cv.getContext("2d");
      cx.drawImage(bmp, 0, 0);
      const px = cx.getImageData(Math.min(bmp.width - 1, Math.floor((t.x - t.tx) * bmp.width)), Math.min(bmp.height - 1, Math.floor((t.y - t.ty) * bmp.height)), 1, 1).data;
      if (!px[3]) return null;
      let best = null, bd = 1e9;
      for (const [c, words] of key || []) {
        const r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
        const d = Math.abs(r - px[0]) + Math.abs(g - px[1]) + Math.abs(b - px[2]);
        if (d < bd) { bd = d; best = words; }
      }
      return bd < 30 ? best : `a colour not in the key (rgb ${px[0]}, ${px[1]}, ${px[2]})`;
    }

    /* ---------- the panel ---------- */
    // Sections, each with its rows and its subsections (round nh11). Every
    // section and subsection starts closed.
    const LAYOUT = [
      { sec: "land", t: "Land and sea taken over", items: [
        { sub: "taken", t: "How people have taken over the land", items: ["anthromes", "ghm"] },
        { sub: "sea", t: "How people have changed the ocean", items: ["ocean"] },
        { sub: "future", t: "Where people are projected to build, mine and farm next", items: ["urban", "devpot", "dti"] },
      ] },
      { sec: "inv", t: "Invasive species", items: ["firsts", "griis",
        { sub: "seen", t: "Where non-native and invasive species have been recorded and photographed (GBIF and iNaturalist)", items: ["gbif", "inat"] },
        "invacost"] },
      { sec: "pest", t: "Pesticides", items: [
        // Round nh13 (asked 19 October): the four maps in three subsections.
        { sub: "sprayed", t: "Where pesticides are sprayed", items: ["pestuse", "pestgrid"] },
        { sub: "runoff", t: "Pesticides running off into the ocean", items: ["pestsea"] },
        { sub: "pollution", t: "Pesticide pollution", items: ["pestrisk"] },
        { sub: "makers", t: "Who makes pesticides, and where", items: ["pestco", "plants_us", "plants_eu"] },
        { sub: "trade", t: "Pesticides traded between countries", items: ["pesttrade"] },
        { sub: "bans", t: "Pesticide bans, and banned pesticides sold abroad", items: ["panbans", "bannedexp"] },
      ] },
      { sec: "pa", t: "Protected areas, their undoing and extraction around them", items: [
        { sub: "areas", t: "Protected areas", items: ["pa", "gsn"] },
        { sub: "changed", t: "How much people have changed them, and protection taken away", items: ["papress", "paddd"] },
        { sub: "threats", t: "Threats inside and near protected areas", items: ["mines", "oilgas", "paxin", "conc"] },
      ] },
    ];
    const root = document.createElement("div");
    root.className = "nh";
    host.appendChild(root);

    function part(def) { parts.push(def); return def; }
    function stateOf(p, text, bad) {
      const el = root.querySelector(`[data-part="${p.id}"] .nh-body > .nh-state`);
      if (el) { el.textContent = text; el.classList.toggle("bad", !!bad); }
    }
    function bodyOf(p) { return root.querySelector(`[data-part="${p.id}"] .nh-ctl-box`); }

    // A year slider with a play button and a speed. Play waits for each
    // step's picture to arrive before moving on, so no step is skipped or
    // shown blank.
    // Speeds as multiples (round nh12): a quarter as fast up to sixteen times.
    const SPEEDS = [["0.25", "×¼"], ["0.5", "×½"], ["1", "×1"], ["2", "×2"], ["4", "×4"], ["8", "×8"], ["16", "×16"]];
    function timeline(p, box, steps, start, onChange, labelOf = (v) => String(v)) {
      const el = document.createElement("div");
      el.className = "nh-time";
      el.innerHTML = `<button type="button">Play</button><input type="range" min="0" max="${steps.length - 1}" step="1" value="${Math.max(0, steps.indexOf(start))}"><output></output>` +
        `<select title="How fast Play goes" aria-label="Speed">${SPEEDS.map(([v, t]) => `<option value="${v}"${v === "1" ? " selected" : ""}>${t}</option>`).join("")}</select>`;
      box.appendChild(el);
      const [btn, range, out, speed] = el.children;
      let playing = false, timer = null;
      const fire = () => { const v = steps[Number(range.value)]; out.textContent = labelOf(v); return onChange(v); };
      range.addEventListener("input", () => { fire(); });
      const stop = () => { playing = false; clearTimeout(timer); btn.textContent = "Play"; p._fastFade = null; };
      const tick = async () => {
        if (!playing) return;
        if (!on.has(p.id) || Number(range.value) >= steps.length - 1) return stop();
        range.value = String(Number(range.value) + 1);
        const t0 = Date.now();
        p._fastFade = Number(speed.value) >= 4 ? 90 : Number(speed.value) >= 2 ? 160 : null;
        try { await Promise.race([Promise.resolve(fire()), new Promise((r) => setTimeout(r, 10000))]); } catch (e) { /* the next step still comes */ }
        if (p.warm && Number(range.value) < steps.length - 1) p.warm(steps[Number(range.value) + 1]);
        if (!playing) return;
        const wait = (p.playMs || 900) / Number(speed.value) - (Date.now() - t0);
        timer = setTimeout(tick, Math.max(30, wait));
      };
      btn.addEventListener("click", () => {
        if (playing) return stop();
        if (Number(range.value) >= steps.length - 1) { range.value = "0"; fire(); }
        playing = true;
        btn.textContent = "Pause";
        if (p.warm && Number(range.value) < steps.length - 1) p.warm(steps[Number(range.value) + 1]);
        timer = setTimeout(tick, (p.playMs || 900) / Number(speed.value));
      });
      out.textContent = labelOf(steps[Number(range.value)]);
      return { el, set(v) { const i = steps.indexOf(v); if (i >= 0) { range.value = String(i); fire(); } }, get value() { return steps[Number(range.value)]; }, stop };
    }
    function select(box, label, options, value, onChange) {
      const l = document.createElement("label");
      l.className = "nh-ctl";
      l.innerHTML = `${esc(label)} <select>${options.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(value) ? " selected" : ""}>${esc(t)}</option>`).join("")}</select>`;
      box.appendChild(l);
      l.querySelector("select").addEventListener("change", (e) => onChange(e.target.value));
      return l.querySelector("select");
    }
    function checks(box, items, onChange) {
      const el = document.createElement("div");
      el.className = "nh-checks";
      el.innerHTML = items.map(([v, t, c]) => `<label><input type="checkbox" value="${esc(v)}" checked>${c ? `<i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${esc(c)}"></i>` : ""}${esc(t)}</label>`).join("");
      box.appendChild(el);
      el.addEventListener("change", () => onChange(new Set([...el.querySelectorAll("input:checked")].map((i) => i.value))));
      return el;
    }
    function keyBox(p) { return root.querySelector(`[data-part="${p.id}"] .nh-key-box`); }

    function render() {
      const byId = new Map(parts.map((x) => [x.id, x]));
      const placed = new Set();
      const row = (p) => `<div class="nh-part" data-part="${p.id}">` +
          `<label class="nh-row"><input type="checkbox"><span class="nh-t">${esc(p.title)}</span>` +
          `<span class="nh-mark ${p.live ? "live" : "copy"}" title="${p.live ? "Read from the source itself each time it is ticked" : esc(p.copy || "Drawn from a copy made from the source")}">${p.live ? "LIVE" : "NOT LIVE"}</span>` +
          `<button type="button" class="nh-fold" hidden title="Fold this row's choices up" aria-label="Fold this row's choices up">▾</button>` +
          `<button type="button" class="nh-i" aria-label="About this row">i</button></label>` +
          `<div class="nh-about" hidden>${p.about}${p.live ? "" : `<p><i>${esc(p.copy || "")}</i></p>`}</div>` +
          `<div class="nh-body" hidden><div class="nh-ctl-box"></div><div class="nh-key-box"></div><div class="nh-state"></div></div></div>`;
      const items = (list) => list.map((it) => {
        if (typeof it === "string") { const p = byId.get(it); if (!p) return ""; placed.add(it); return row(p); }
        const inner = items(it.items);
        return inner ? `<div class="nh-sub" data-sub="${esc(it.sub)}"><button type="button"><span class="car">▶</span>${esc(it.t)}</button><div class="nh-parts">${inner}</div></div>` : "";
      }).join("");
      root.innerHTML = LAYOUT.map((S) => {
        const inner = items(S.items) + parts.filter((p) => p.sec === S.sec && !placed.has(p.id)).map((p) => { placed.add(p.id); return row(p); }).join("");
        return `<div class="nh-sec" data-sec="${S.sec}"><button type="button"><span class="car">▶</span>${esc(S.t)}</button><div class="nh-parts">${inner}</div></div>`;
      }).join("");
      root.addEventListener("click", (e) => {
        const sec = e.target.closest(".nh-sec>button, .nh-sub>button");
        if (sec) { sec.parentElement.classList.toggle("open"); return; }
        const fold = e.target.closest(".nh-fold");
        if (fold) {
          e.preventDefault();
          const body = fold.closest(".nh-part").querySelector(".nh-body");
          body.hidden = !body.hidden;
          fold.textContent = body.hidden ? "▸" : "▾";
          fold.title = fold.ariaLabel = body.hidden ? "Open this row's choices" : "Fold this row's choices up";
          return;
        }
        const info = e.target.closest(".nh-i");
        if (info) {
          e.preventDefault();
          const a = info.closest(".nh-part").querySelector(".nh-about");
          a.hidden = !a.hidden;
        }
      });
      root.addEventListener("change", (e) => {
        const cb = e.target.closest(".nh-row input");
        if (!cb) return;
        const p = parts.find((x) => x.id === cb.closest(".nh-part").dataset.part);
        toggle(p, cb.checked);
      });
    }

    async function toggle(p, want) {
      const el = root.querySelector(`[data-part="${p.id}"]`);
      if (el) {
        el.querySelector(".nh-row input").checked = want;
        el.querySelector(".nh-body").hidden = !want;
        const f = el.querySelector(".nh-fold");
        if (f) { f.hidden = !want; f.textContent = "▾"; }
      }
      if (want) on.add(p.id); else on.delete(p.id);
      if (want && !p._built) {
        p._built = true;
        stateOf(p, "loading…");
        try { await p.build(p); }
        catch (e) {
          stateOf(p, `Could not be drawn: ${e.message}. Untick and tick again to retry.`, true);
          console.warn(`[nonhuman] ${p.id}: ${e.message}`);
          p._built = false;
          const box = bodyOf(p), key = keyBox(p);
          if (box) box.innerHTML = "";
          if (key) key.innerHTML = "";
        }
      }
      setVis(p);
      if (p.afterToggle) p.afterToggle(want);
      say(on.size ? `${on.size} part${on.size === 1 ? "" : "s"} drawn` : "tick a part under the row");
    }

    /* ---------- clicks ---------- */
    let clickSeq = 0;
    map.on("click", async (e) => {
      if (!shown || !on.size) return;
      const n = ++clickSeq;
      const ll = e.lngLat.wrap();
      const ids = [];
      for (const p of parts) if (on.has(p.id)) for (const l of layersOf.get(p.id) || []) if (map.getLayer(l) && !/-halo$|-edge$/.test(l)) ids.push(l);
      let feats = ids.length ? map.queryRenderedFeatures(e.point, { layers: ids }) : [];
      const boxes = [];
      for (const f of feats) {
        const p = parts.find((x) => (layersOf.get(x.id) || []).includes(f.layer.id));
        if (p && p.box && !boxes.some((b) => b.p === p)) boxes.push({ p, f });
      }
      // Pictures have no features: a ticked picture part says what is there.
      for (const p of parts) if (on.has(p.id) && p.pictureBox && !boxes.some((b) => b.p === p)) boxes.push({ p, f: null });
      if (!boxes.length) return;
      if (!popup) popup = new ml.Popup({ className: "nh-pop", maxWidth: "380px", closeOnClick: true });
      const holder = document.createElement("div");
      holder.innerHTML = `<div class="note">reading…</div>`;
      popup.setLngLat(e.lngLat).setDOMContent(holder).addTo(map);
      const htmls = await Promise.all(boxes.map(async ({ p, f }) => {
        try { return f ? await p.box(f, ll, holder) : await p.pictureBox(ll, holder); }
        catch (err) { return `<div class="note">${esc(p.title)}: ${esc(err.message)}</div>`; }
      }));
      if (n !== clickSeq) return;          // a newer click has its own box
      const html = htmls.filter(Boolean).join(`<hr style="border:0;border-top:1px solid #28303A;margin:9px 0">`);
      if (!html) { popup.remove(); return; }
      holder.innerHTML = html;
      for (const { p } of boxes) if (p.wire) p.wire(holder);
    });

    function table(rows) {
      return `<table>${rows.filter(([, v]) => v !== undefined && v !== null && v !== "").map(([k, v]) => `<tr><th>${esc(k)}</th><td>${v}</td></tr>`).join("")}</table>`;
    }
    function allProps(p, skip = /^(gfw_|geom|_)/) {
      return table(Object.keys(p || {}).filter((k) => !skip.test(k)).map((k) => [k.replace(/_/g, " "), esc(p[k])]));
    }

    /* =====================================================================
       LAND AND SEA TAKEN OVER
       ===================================================================== */
    // The anthrome classes in two groups (asked 18 October): land people use
    // and live on, and land left remote or wild (and ice).
    const ANTHRO_USED = /urban|mixed|village|residential|populated|inhabited/i;
    part({
      id: "anthromes", sec: "land", title: "How people have taken over the land, 10,000 BCE to 2017 (Anthromes 12K)",
      copy: "Made from the authors' files by culprits-tiles-more; the files are a fixed release, so the copy is made once.",
      about: `<p>Every patch of ice-free land at each of 60 dates from 10,000 BCE to 2017 CE, sorted into the kinds of place people make of it (cities, villages, cropland, rangeland, woodland people live in and use) and the land left wild. Move the slider or press Play to watch it spread; tick the groups or the kinds to show only some of them.</p>
<p>Wider out, where several kinds share one dot of the map, the dot shows the most intensively used of them, so hiding a kind there can leave the dot clear rather than showing what else lies under it; closer in every place is its own kind.</p>
<p>Source: Ellis, E.C. et al. 2021, "People have shaped most of terrestrial nature for at least 12,000 years", <i>PNAS</i> 118(17): e2023483118; data on Harvard Dataverse. This is the timeline your page links to. The classes are the authors'; the colours are this map's.</p>`,
      async build(p) {
        const d = await json(NH + "anthromes.json");
        const steps = d.steps || [];
        if (!steps.length) throw new Error("no time steps in the copy yet");
        p.steps = steps;
        p.key = d.key || [];
        p.hidden = new Set();
        const head = await archiveOf(steps[steps.length - 1].archive).getHeader();
        const usedK = p.key.filter(([, t]) => ANTHRO_USED.test(t)), wildK = p.key.filter(([, t]) => !ANTHRO_USED.test(t));
        const B = bii(p.key);
        const url = (st) => B.url(st.archive, [...p.hidden]);
        const show = (i) => { p.cur = steps[i]; return raster(p, url(steps[i]), { nearest: true, opacity: 0.88, maxzoom: head.maxZoom, attribution: "Ellis et al. 2021 (Anthromes 12K)" }); };
        p.warm = (i) => warm(url(steps[i]), head.maxZoom);
        const box = bodyOf(p);
        p.tl = timeline(p, box, steps.map((_, i) => i), steps.length - 1, show, (i) => steps[i].label);
        // The groups and the kinds, each kind's box its colour in the key.
        const swatch = (c) => `background:${esc(c)}`;
        const used = usedK.map((r, i) => [r[0], r[1], swatch(r[0], i)]), wild = wildK.map((r, i) => [r[0], r[1], swatch(r[0], usedK.length + i)]);
        const el = document.createElement("div");
        el.className = "nh-key nh-groups";
        const grp = (g, title, list) => `<label class="nh-g"><input type="checkbox" data-g="${g}" checked> <b>${esc(title)}</b></label>` +
          list.map(([c, t, st]) => `<label class="nh-k"><input type="checkbox" data-c="${esc(c)}" data-in="${g}" checked><i style="${st}"></i>${esc(t)}</label>`).join("");
        el.innerHTML = grp("used", "Used and lived on: cities, settlements, villages, and populated croplands, rangelands, woodlands and drylands", used) +
          grp("wild", "Remote, wild and ice", wild);
        box.appendChild(el);
        const sync = () => {
          for (const g of ["used", "wild"]) {
            const ks = [...el.querySelectorAll(`input[data-in="${g}"]`)], on2 = ks.filter((k) => k.checked).length;
            const gb = el.querySelector(`input[data-g="${g}"]`);
            gb.checked = on2 === ks.length; gb.indeterminate = on2 > 0 && on2 < ks.length;
          }
          p.hidden = new Set([...el.querySelectorAll("input[data-c]")].filter((k) => !k.checked).map((k) => k.dataset.c));
          show(Math.max(0, steps.indexOf(p.cur)));
        };
        el.addEventListener("change", (e) => {
          const g = e.target.dataset.g;
          if (g) for (const k of el.querySelectorAll(`input[data-in="${g}"]`)) k.checked = e.target.checked;
          sync();
        });
        show(steps.length - 1);
        stateOf(p, `${steps.length} dates, ${steps[0].label} to ${steps[steps.length - 1].label}`);
      },
      playMs: 1100,
      async pictureBox(ll) {
        if (!this.cur) return "";
        const w = await pictureAt(this.cur.archive, ll.lng, ll.lat, this.key);
        return w ? `<h3>${esc(w)}</h3><div class="src">How people used this land in ${esc(this.cur.label)} (Anthromes 12K, Ellis et al. 2021)</div>` : "";

    part({
      id: "ghm", sec: "land", title: "How much people have changed the land, 1990 to 2022, all threats together and each kind (Global Human Modification)",
      copy: "Made from the authors' files on Zenodo by culprits-tiles-more; fixed releases, made once.",
      about: `<p>How much each place has been changed by people, scored from 0 (untouched) to 1 (completely changed), for 1990, 1995, 2000, 2005, 2010, 2015, 2020 and 2022: all threats combined, or each of the eight kinds of threat the score is built from: agriculture; built-up land; energy production and mining; biological resource use (logging, hunting, fishing); human accessibility; natural system modification (dams, reservoirs and water taken); pollution; and transportation and service corridors (roads, railways and power lines). Choose a kind, then move the slider or press Play to watch it change.</p>
<p>This one measure takes in roads, cropland, towns, mines and the other single pressures, including the farms and towns that drained wetlands became, so it stands for them all; the map's separate roads and wetlands rows were taken out for that reason. Every map is coloured in the same tenths of 0 to 1, so years and kinds can be compared; places scored 0 are left clear. The authors' files give no biological resource use before 2005 (every cell 0), so that kind starts in 2005. The study's own classes: under 0.1 low, 0.1 to 0.4 moderate, 0.4 to 0.7 high, 0.7 and over very high.</p>
<p>Source: Theobald, D.M., Oakleaf, J.R., Moncrieff, G., Voigt, M., Kiesecker, J. and Kennedy, C.M. 2025, "Global extent and change in human modification of terrestrial ecosystems from 1990 to 2022", <i>Scientific Data</i> 12: 489; Global Human Modification v3 on Zenodo (records 14449495 and 14502573), CC BY 4.0. Read from the authors' 300 m files at about 2.4 km for all threats combined and about 4.8 km for each kind, each pixel the average of the cells under it.</p>`,
      async build(p) {

          p.cur = steps[at < 0 ? steps.length - 1 : at];
          p.warm = (k) => archiveOf(steps[k].archive).getHeader().then((h) => warm(B.url(steps[k].archive), h.maxZoom)).catch(() => {});
          return rasterBii(p, p.cur.archive, B, { attribution: "Global Human Modification v3 (Theobald et al. 2025), CC BY 4.0" });
        };
        if (kinds.length > 1) select(box, "Show", kinds.map((k, i) => [i, k.label]), 0, showKind);

        p.playMs = 1300;

      },
      async pictureBox(ll) {

    const OCEAN = [
      ["ocean_impacts", "Every human impact on the ocean added up"],
      ["ocean_trawling", "Bottom trawling and dredging"],
      ["ocean_bycatch", "Fishing that kills other animals as bycatch"],

    function oceanPart(def, rows) {

        async build(p) {
          const got = await Promise.all(rows.map(([row, words]) => json(`${TILES}tiles/${row}.choices.json`).then((d) => (d.choices || []).map((c) => ({
            label: /^\d{4}$/.test(c.label) ? `${words}, ${c.label}` : `${words}: ${c.label}`, archive: c.archive, key: c.key || [] }))).catch(() => [])));
          p.choices = [].concat(...got);
          if (!p.choices.length) throw new Error("the ocean copies are not built yet");

          if (p.choices.length > 1) select(bodyOf(p), "Show", p.choices.map((c, i) => [i, c.label]), 0, show);

        async pictureBox(ll) {

        },
      }));
    }
    oceanPart({
      id: "ocean", sec: "land", title: "How people have changed the ocean, 2003 and 2013 (Halpern et al. 2019)",
      copy: "Made from the authors' files on KNB by culprits-tiles-more (the same copies the Culprits map uses).",
      about: `<p>Fourteen human pressures on the sea (kinds of fishing, warming, acidification, sea level rise, shipping, and pollution and nutrients from land) weighed by how much each harms each habitat and added up for 2013, and six of the pressures one by one for 2003 and 2013, at about 1 km. Coloured in tenths, lightest the least.</p>
<p>Source: Halpern, B.S. et al. 2019, "Recent pace of change in human impact on the world's ocean", <i>Scientific Reports</i> 9: 11609; data on the KNB repository, CC0.</p>`,
    }, OCEAN);

    // Roads (GRIP4) and wetlands drained since 1700 (Fluet-Chouinard et al.
    // 2023) left the map in round nh12 (asked 19 October): the Human
    // Modification row above takes in roads (its transportation layer) and

    part({
      id: "urban", sec: "land", title: "Where towns and cities are projected to spread, 2015 to 2100, under five futures (Chen et al. 2020)",
      copy: "Made from the authors' files on PANGAEA by culprits-tiles-more; a fixed release, made once.",
      about: `<p>Every square kilometre the study projects to become urban, coloured by when: urban in 2015 (the authors' starting map), then each ten-year step from 2020 to 2100, so 2050 can be read off the key; land that stays rural is left clear. Choose one of the five Shared Socioeconomic Pathways, the storylines the IPCC uses for how the world could develop (SSP1 a greener path, SSP3 a divided one, SSP5 fossil-fuelled growth, and so on).</p>
<p>Source: Chen, G. et al. 2020, "Global projections of future urban land expansion under shared socioeconomic pathways", <i>Nature Communications</i> 11: 537; data on PANGAEA, doi:10.1594/PANGAEA.905890, CC BY-NC-SA 4.0 (these map files are shared under the same licence).</p>`,
      async build(p) {
        const d = await json(NH + "urban2100.json");
        p.choices = d.choices || [];
        if (!p.choices.length) throw new Error("not built yet");
        const Bof = (c) => bii(c.key || []);
        const show = (i) => {

          const B = Bof(p.cur);
          keyBox(p).innerHTML = keyHtml(B.key);
          return Promise.resolve(rasterBii(p, p.cur.archive, B, { nearest: true, attribution: "Chen et al. 2020 (CC BY-NC-SA 4.0)" })).then(() => {
            for (const c of p.choices) if (c !== p.cur) archiveOf(c.archive).getHeader().then((h) => warm(Bof(c).url(c.archive), h.maxZoom)).catch(() => {});
          });
        };
        // Every future's archive is opened at once, so switching is quick.
        for (const c of p.choices) archiveOf(c.archive).getHeader().catch(() => {});
        select(bodyOf(p), "Future", p.choices.map((c, i) => [i, c.label]), Math.max(0, p.choices.findIndex((c) => c.label === "SSP2")), show);
        show(Math.max(0, p.choices.findIndex((c) => c.label === "SSP2")));
        stateOf(p, `${p.choices.length} futures`);
      },
      async pictureBox(ll) {
        if (!this.cur) return "";
        const w = await pictureAt(this.cur.archive, ll.lng, ll.lat, this.cur.key);
        return w ? `<h3>Here: ${esc(w)}</h3><div class="src">${esc(this.cur.label)} (Chen et al. 2020)</div>` : "";
      },
    });

    part({
      id: "devpot", sec: "land", title: "Where land is most likely to be taken next, sector by sector: solar, wind, hydropower, oil, gas, coal, mining, crops and biofuels (Oakleaf et al. 2019)",
      copy: "Made from the authors' files on figshare by culprits-tiles-more; a fixed release, made once.",
      about: `<p>For each kind of development, how suitable and likely each place is to be developed for it next, from the resources there (sun, wind, oil and gas, ores, soil) and what makes building there feasible (roads, slope, protection, land already used). The higher the value, the more likely it is that nature there will be taken for it. Choose a sector.</p>
<p>Each sector covers only the land its inputs cover: the two solar maps stop at 60°N, the edge of the authors' solar data, so nothing is drawn north of that line (it is not a gap in this copy). The crop and biofuel maps stop at about 64°N for the same reason.</p>
<p>Source: Oakleaf, J.R. et al. 2019, "Mapping global development potential for renewable energy, fossil fuels, mining and agriculture sectors", <i>Scientific Data</i> 6: 101; the development potential indices on figshare (1 km; drawn here at about 10 km, each pixel showing the highest value under it, to keep within GitHub's limits). Coloured in tenths of each sector's own values.</p>`,

    part({

<p>Source: Oakleaf, J.R. et al. 2019, Development Threat Index, v1.00, NASA Socioeconomic Data and Applications Center (SEDAC), doi:10.7927/61jv-th84. The scores are the authors'; drawn here at about 10 km, each pixel showing the highest score under it, in tenths of 0 to 100.</p>`,

        const all = Math.max(0, p.choices.findIndex((c) => /cumulative|combined|all|total/i.test(c.label)));

    /* =====================================================================
       INVASIVE SPECIES
       ===================================================================== */
    // The establishment terms GBIF records carry today (its vocabulary of
    // degree of establishment, and establishment means). Round nh11: the old
    // "INVASIVE" value of establishment means no longer exists in GBIF (no
    // record carries it), so that choice is gone.
    // Round nh12: "introduced" first, as it is the mark most records carry
    // (about 13.5 million with a place, against about half a million marked
    // invasive), so the map opens on the fullest picture.
    const GBIF_KINDS = [
      ["intro", "Recorded as introduced (not native): the most records", "establishmentMeans=introduced&establishmentMeans=introducedAssistedColonisation"],
      ["inv", "Recorded as invasive or widespread invasive", "degreeOfEstablishment=invasive&degreeOfEstablishment=widespreadInvasive"],
      ["spread", "Recorded as spreading on its own (colonising)", "degreeOfEstablishment=spreading&degreeOfEstablishment=colonising"],
      ["est", "Recorded as established or naturalised (living wild without help)", "degreeOfEstablishment=established&degreeOfEstablishment=naturalized"],
    ];
    part({
      id: "gbif", sec: "inv", title: "Records shared with GBIF, any year or a range of years", live: true,
      about: `<p>Every record in the Global Biodiversity Information Facility (GBIF) that its publisher marked as introduced, invasive, spreading, or established or naturalised, counted in hexagons. Choose the kind of record and, if you want, a range of years; Play steps through it decade by decade. Click a hexagon for the species recorded there.</p>
<p>Why there are fewer places than there are invasive species: of GBIF's 3.8 billion records with a place, only about 13.5 million say whether the organism was native or brought in, and only about half a million call it invasive. The rest are records of the same species with no such mark, which this map cannot tell apart from native ones. So this shows where people wrote down that a species was not native, not everywhere it lives. The iNaturalist row below fills much of the gap, as iNaturalist marks every observation from its own lists of where each species is native. Records with no year drop out when a range of years is set.</p>
<p>Source: GBIF.org occurrence data and maps API, read live. Each record keeps its own publisher's licence (CC0, CC BY or CC BY-NC).</p>`,
      async build(p) {
        p.kind = GBIF_KINDS[0];
        p.years = null;
        const box = bodyOf(p);
        select(box, "Records", GBIF_KINDS.map(([k, t]) => [k, t]), p.kind[0], (v) => { p.kind = GBIF_KINDS.find((k) => k[0] === v); refresh(); });
        const yr = document.createElement("label");
        yr.className = "nh-ctl";
        yr.innerHTML = `<input type="checkbox"> Only records from a range of years`;
        box.appendChild(yr);
        const now = new Date().getFullYear();
        const decades = [];
        for (let y = 1700; y <= now; y += 10) decades.push(y);
        if (decades[decades.length - 1] !== now) decades.push(now);
        const tbox = document.createElement("div");
        tbox.hidden = true;
        box.appendChild(tbox);
        // The range always runs from the earlier year to the later, whichever
        // of the two was moved (Play starts the slider from its first decade).
        const span = () => { const a = Number(fromSel.value), b = tl.value; return [Math.min(a, b), Math.max(a, b)]; };
        const fromSel = select(tbox, "From", [[1600, "1600"], [1700, "1700"], [1800, "1800"], [1850, "1850"], [1900, "1900"], [1950, "1950"], [1970, "1970"], [2000, "2000"]], 1700, () => { if (p.years) { p.years = span(); refresh(); } });
        const tl = timeline(p, tbox, decades, now, () => { if (p.years) { p.years = span(); refresh(); } }, (y) => `to ${y}`);
        yr.querySelector("input").addEventListener("change", (e) => {
          tbox.hidden = !e.target.checked;
          p.years = e.target.checked ? span() : null;
          refresh();
        });
        const tiles = () => `nhretry://${GBIF}/v2/map/occurrence/adhoc/{z}/{x}/{y}.mvt?srs=EPSG:3857&bin=hex&hexPerTile=56&${p.kind[2]}` + (p.years ? `&year=${p.years[0]},${p.years[1]}` : "");
        addSource("gbif", { type: "vector", tiles: [tiles()], minzoom: 0, maxzoom: 14, attribution: "GBIF.org" });
        const steps = [1, 10, 100, 1000, 10000, 100000];
        const fill = ["step", ["get", "total"], RAMP7[0]];
        steps.slice(1).forEach((s, i) => fill.push(s, RAMP7[Math.min(RAMP7.length - 1, i + 1 + (i > 2 ? 1 : 0))]));
        addLayer(p, { id: "gbif-fill", type: "fill", source: "gbif", "source-layer": "occurrence", paint: { "fill-color": fill, "fill-opacity": 0.72, "fill-outline-color": EDGE } });
        keyBox(p).innerHTML = keyHtml([["", "records in each hexagon", "h"], [RAMP7[0], "1 to 9"], [RAMP7[1], "10 to 99"], [RAMP7[2], "100 to 999"], [RAMP7[3], "1,000 to 9,999"], [RAMP7[5], "10,000 to 99,999"], [RAMP7[6], "100,000 or more"]]);
        let seq = 0;
        async function refresh() {
          const src = map.getSource(id("gbif"));
          if (src && src.setTiles) src.setTiles([tiles()]);
          const mine = ++seq;
          stateOf(p, "counting…");
          try {
            const q = `${GBIF}/v1/occurrence/search?${p.kind[2]}&hasCoordinate=true&limit=0` + (p.years ? `&year=${p.years[0]},${p.years[1]}` : "");
            const r = await fetch(q);
            if (!r.ok) throw new Error(String(r.status));
            const j = await r.json();
            if (mine === seq) stateOf(p, `${num(j.count)} records with a place ${p.years ? `from ${p.years[0]} to ${p.years[1]}` : "(any year)"}`);
          } catch (e) { if (mine === seq) stateOf(p, "drawn; GBIF did not give a count", true); }
        }
        p.refresh = refresh;
        refresh();
      },
      async box(f, ll, holder) {
        const p = this;
        const ring = f.geometry && f.geometry.type === "Polygon" ? f.geometry.coordinates[0] : null;
        let wkt;
        if (ring) {
          let pts = ring.map(([x, y]) => [Number(x.toFixed(4)), Number(y.toFixed(4))]);
          let area = 0;
          for (let i = 0; i < pts.length - 1; i++) area += pts[i][0] * pts[i + 1][1] - pts[i + 1][0] * pts[i][1];
          if (area < 0) pts = pts.reverse();          // GBIF wants the ring counter-clockwise
          wkt = `POLYGON((${pts.map((q) => q.join(" ")).join(",")}))`;
        } else {
          const d = 0.5;
          wkt = `POLYGON((${ll.lng - d} ${ll.lat - d},${ll.lng + d} ${ll.lat - d},${ll.lng + d} ${ll.lat + d},${ll.lng - d} ${ll.lat + d},${ll.lng - d} ${ll.lat - d}))`;
        }
        const filt = `${p.kind[2]}` + (p.years ? `&year=${p.years[0]},${p.years[1]}` : "");
        const q = `${GBIF}/v1/occurrence/search?${filt}&geometry=${encodeURIComponent(wkt)}&limit=0&facet=speciesKey&speciesKey.facetLimit=60`;
        const j = await (await fetch(q)).json();
        const counts = ((j.facets || [])[0] || {}).counts || [];
        const names = await Promise.all(counts.map((c) => json(`${GBIF}/v1/species/${c.name}`).then((s) => s.scientificName || s.canonicalName || c.name).catch(() => c.name)));
        const link = `https://www.gbif.org/occurrence/search?${filt.replace(/degreeOfEstablishment=/g, "degree_of_establishment=").replace(/establishmentMeans=/g, "establishment_means=")}&geometry=${encodeURIComponent(wkt)}`;
        return `<h3>${num(f.properties.total)} record${f.properties.total === 1 ? "" : "s"} here</h3>` +
          `<div class="src">${esc(p.kind[1])}${p.years ? `, ${p.years[0]} to ${p.years[1]}` : ", any year"} (GBIF, live)</div>` +
          (counts.length ? `<div class="lst">` + counts.map((c, i) => `<div><i>${esc(names[i])}</i> · ${num(c.count)}</div>`).join("") + `</div>` +
            (j.count > counts.reduce((a, c) => a + c.count, 0) ? `<div class="note">Species with the most records first; up to 60 listed, plus records not named to species.</div>` : "")
            : `<div class="note">No species named in these records.</div>`) +
          `<div class="more"><a href="${esc(link)}" target="_blank" rel="noopener">Open these records on GBIF</a></div>`;
      },
    });

    const INAT = "https://api.inaturalist.org/v1";
    part({
      id: "inat", sec: "inv", title: "Photographs of introduced species on iNaturalist, any year or a range of years", live: true,
      about: `<p>Every iNaturalist observation of a species that iNaturalist lists as introduced (not native) where it was seen, counted in squares: photographs and sound recordings people upload, identified by the community. Choose all verifiable observations or only research-grade ones (where the community agrees on the species), and, if you want, a range of years. Click a square for the species seen there.</p>
<p>This adds to the GBIF row beside it rather than repeating it: GBIF's marks come from each dataset's publisher, while here iNaturalist's own list of where each species is native or introduced decides, for every observation, including the many that are not passed on to GBIF (only research-grade ones with open licences are). Like GBIF, it shows where people looked and photographed, not every place a species lives.</p>
<p>Source: iNaturalist (California Academy of Sciences and National Geographic Society), observations API, read live. Each observation keeps its observer's licence.</p>`,
      async build(p) {
        p.grade = "verifiable=true";
        p.years = null;
        const box = bodyOf(p);
        select(box, "Observations", [["verifiable=true", "All verifiable (with a date, place and photo or sound)"], ["quality_grade=research", "Research grade only"]], p.grade, (v) => { p.grade = v; refresh(); });
        const yr = document.createElement("label");
        yr.className = "nh-ctl";
        yr.innerHTML = `<input type="checkbox"> Only observations from a range of years`;
        box.appendChild(yr);
        const now = new Date().getFullYear();
        const years = [];
        for (let y = 1990; y <= now; y++) years.push(y);
        const tbox = document.createElement("div");
        tbox.hidden = true;
        box.appendChild(tbox);
        const fromSel = select(tbox, "From", [[1900, "1900"], [1990, "1990"], [2000, "2000"], [2010, "2010"], [2015, "2015"], [2020, "2020"]], 2000, () => { if (p.years) { p.years = span(); refresh(); } });
        const span = () => { const a = Number(fromSel.value), b = tl.value; return [Math.min(a, b), Math.max(a, b)]; };
        const tl = timeline(p, tbox, years, now, () => { if (p.years) { p.years = span(); return refresh(); } }, (y) => `to ${y}`);
        p.playMs = 1200;
        yr.querySelector("input").addEventListener("change", (e) => { tbox.hidden = !e.target.checked; p.years = e.target.checked ? span() : null; refresh(); });
        const q = () => `introduced=true&${p.grade}` + (p.years ? `&d1=${p.years[0]}-01-01&d2=${p.years[1]}-12-31` : "");
        keyBox(p).innerHTML = keyHtml([["", "observations in each square: the deeper the colour, the more", "h"], ["#E2B8C4", "few"], ["#9A5878", "many"]]);
        let seq = 0;
        async function refresh() {
          const mine = ++seq;
          const done = raster(p, `nhretry://${INAT}/grid/{z}/{x}/{y}.png?${q()}&color=%239A5878`, { maxzoom: 14, opacity: 0.9, attribution: "iNaturalist", fade: 200 });
          stateOf(p, "counting…");
          try {
            const j = await (await fetch(`${INAT}/observations?${q()}&per_page=0`)).json();
            if (mine === seq) stateOf(p, `${num(j.total_results)} observations of introduced species ${p.years ? `from ${p.years[0]} to ${p.years[1]}` : "(any year)"}`);
          } catch (e) { if (mine === seq) stateOf(p, "drawn; iNaturalist did not give a count", true); }
          return done;
        }
        p.q = q;
        refresh();
      },
      async pictureBox(ll) {
        const z = map.getZoom();
        const km = Math.max(2, Math.min(300, 40000 / 2 ** z / 4));
        const j = await (await fetch(`${INAT}/observations/species_counts?${this.q()}&lat=${ll.lat.toFixed(4)}&lng=${ll.lng.toFixed(4)}&radius=${km.toFixed(1)}&per_page=40`)).json();
        const rows = j.results || [];
        if (!rows.length) return "";
        const link = `https://www.inaturalist.org/observations?${this.q()}&lat=${ll.lat.toFixed(4)}&lng=${ll.lng.toFixed(4)}&radius=${km.toFixed(1)}`;
        return `<h3>${num(j.total_results)} introduced species seen within ${num(km, km < 10 ? 1 : 0)} km</h3><div class="src">iNaturalist, live${this.years ? `, ${this.years[0]} to ${this.years[1]}` : ""}</div>` +
          `<div class="lst">` + rows.map((r) => `<div><i>${esc(r.taxon && r.taxon.name)}</i>${r.taxon && r.taxon.preferred_common_name ? ` (${esc(r.taxon.preferred_common_name)})` : ""} · ${num(r.count)}</div>`).join("") + `</div>` +
          (j.total_results > rows.length ? `<div class="note">The 40 most observed shown.</div>` : "") +
          `<div class="more"><a href="${esc(link)}" target="_blank" rel="noopener">Open these observations on iNaturalist</a></div>`;
      },
    });

    // Country shading parts built from one JSON file with a value per country.
    function speciesListButton(btn, url, render) {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        btn.textContent = "Loading…";
        try {
          const d = await json(url);
          const wrap = btn.parentElement;
          wrap.innerHTML = `<input type="search" placeholder="Find a name"><div class="lst"></div>`;
          const lst = wrap.querySelector(".lst"), inp = wrap.querySelector("input");
          const rows = render(d);
          const draw = () => { const q = inp.value.trim().toLowerCase(); lst.innerHTML = rows.filter((r) => !q || r.text.toLowerCase().includes(q)).map((r) => `<div>${r.html}</div>`).join("") || `<div class="note">Nothing matches.</div>`; };
          inp.addEventListener("input", draw);
          draw();
        } catch (e) { btn.textContent = `Could not load the list (${e.message})`; }
      });
    }

    part({
      id: "griis", sec: "inv", title: "Introduced and invasive species, country by country (GRIIS)",
      copy: "Read from the GRIIS checklists on GBIF by culprits-tiles-more, renewed weekly.",
      about: `<p>For each country, how many species its Global Register of Introduced and Invasive Species checklist lists as introduced there, and how many of those it marks as having an invasive impact. Click a country for its numbers and the full list of species.</p>
<p>Source: Pagad, S. et al. 2018, "Introducing the Global Register of Introduced and Invasive Species", <i>Scientific Data</i> 5: 170202; the country checklists published on GBIF by the IUCN SSC Invasive Species Specialist Group, CC BY 4.0. Checklists for places with no country shape here (some islands and territories) are listed under the row.</p>`,
      async build(p) {
        const [d, names] = await Promise.all([json(NH + "griis.json"), countries()]);
        p.d = d;
        p.names = names;
        p.measure = "invasive";
        const box = bodyOf(p);
        select(box, "Shade by", [["invasive", "Species marked invasive"], ["introduced", "All species listed as introduced"]], p.measure, (v) => { p.measure = v; draw(); });
        const draw = () => {
          const vals = {};
          for (const [iso, c] of Object.entries(d.countries || {})) vals[iso] = Number(c[p.measure]) || 0;
          keyBox(p).innerHTML = shade(p, vals, (v) => num(v), p.measure === "invasive" ? "species marked invasive" : "species listed as introduced");
        };
        draw();
        const un = d.unplaced || [];
        if (un.length) {
          const l = document.createElement("div");

          box.appendChild(l);
        }
        stateOf(p, `${Object.keys(d.countries || {}).length} countries${d.made ? `, copied ${String(d.made).slice(0, 10)}` : ""}`);
      },
      box(f) {
        const iso = f.properties.iso3, c = (this.d.countries || {})[iso];
        if (!c) return `<h3>${esc(f.properties.name)}</h3><div class="note">No GRIIS checklist matched to this country.</div>`;
        return `<h3>${esc(f.properties.name)}</h3><div class="src">${esc(c.title || "GRIIS checklist")}</div>` +
          table([["Species listed as introduced", num(c.introduced)], ["Of which marked invasive", num(c.invasive)],
            ["Not marked invasive", c.notInvasive != null ? num(c.notInvasive) : null], ["Invasiveness not given", c.unknown != null ? num(c.unknown) : null],
            ["Invasiveness, as the checklist writes it", c.isInvasiveAsWritten ? Object.entries(c.isInvasiveAsWritten).map(([k, v]) => `${esc(k)}: ${num(v)}`).join("<br>") : null],
            ["Establishment, as the checklist writes it", c.means ? Object.entries(c.means).map(([k, v]) => `${esc(k)}: ${num(v)}`).join("<br>") : null],
            ["Checklist", c.datasetKey ? `<a href="https://www.gbif.org/dataset/${esc(c.datasetKey)}" target="_blank" rel="noopener">on GBIF</a>` : null]]) +
          (c.file ? `<div class="more"><button type="button" data-part="griis" data-list="${esc(c.file)}">List every species</button></div>` : "");
      },
      wire(holder) {
        const btn = holder.querySelector('button[data-list][data-part="griis"]');
        if (btn) speciesListButton(btn, NH + btn.dataset.list, (d) => (d.species || []).map((s) => ({
          text: `${s.n} ${s.k || ""} ${s.h || ""}`,
          html: `<i>${esc(s.n)}</i>${s.inv === true ? " · <b>invasive</b>" : s.inv === false ? "" : " · invasiveness not given"}${s.k ? ` · ${esc(s.k)}` : ""}${s.h ? ` · ${esc(s.h)}` : ""}` })));
      },
    });

    part({
      id: "firsts", sec: "inv", title: "When alien species were first recorded in each country, 1500 to today (First Records database)",
      copy: "Made from the authors' file on Zenodo by culprits-tiles-more, checked weekly for a new version.",
      about: `<p>The year each alien species was first recorded in each country or island, gathered from the published record. Shade by the running total (every alien species recorded there up to the year on the slider) or by new arrivals (only those first recorded in the ten years up to it), and press Play to watch the count climb. Click a country for its figures and every species with its year.</p>
<p>Source: Seebens, H. et al. 2017, "No saturation in the accumulation of alien species worldwide", <i>Nature Communications</i> 8: 14435, and the Alien Species First Records Database on Zenodo (newest version). Places the database names that have no country shape here (islands, states and other parts of countries) are listed under the row with their totals; they are not added into any country.</p>`,
      async build(p) {
        const [d] = await Promise.all([json(NH + "first_records.json"), countries()]);
        p.d = d;
        p.measure = "cum";
        // The slider runs from the earliest record to the latest year that has
        // passed: centuries before 1500, decades after. Years later than this
        // one (a handful the database gives, such as 5856) are counted under
        // the row, not put on the slider (round nh11).
        const now = new Date().getFullYear();
        let to = 0, from = 1500;
        const later = [];
        for (const r of d.regions || []) for (const y of Object.keys(r.byYear || {})) {
          const yy = Number(y);
          if (yy > now) later.push([r.name, yy, r.byYear[y]]); else { to = Math.max(to, yy); from = Math.min(from, yy); }
        }
        if (!to) to = d.to || now;
        const steps = [];
        for (let y = Math.floor(from / 100) * 100; y < 1500; y += 100) steps.push(y);
        for (let y = 1500; y <= to; y += 10) steps.push(y);
        if (steps[steps.length - 1] !== to) steps.push(to);
        p.year = to;
        const box = bodyOf(p);
        // Round nh12: the two choices in plainer words, with a line saying how
        // they differ.
        select(box, "Shade by", [["cum", "Running total: every alien species recorded there up to this year"], ["dec", "New arrivals: species first recorded there in the ten years up to this year"]], p.measure, (v) => { p.measure = v; draw(); });
        const how = document.createElement("div");
        how.className = "nh-note";
        how.textContent = "The running total only grows: a species counted once stays counted. New arrivals counts only the species first found in the ten years before the year on the slider (for 1950, those first found 1941 to 1950), so it shows when arrivals sped up or slowed down.";
        box.appendChild(how);
        timeline(p, box, steps, to, (y) => { p.year = y; draw(); }, (y) => (y < 0 ? `${-y} BCE` : String(y)));
        p.playMs = 450;
        p.byIso = {};
        for (const r of d.regions || []) if (r.iso3) p.byIso[r.iso3] = r;

    // Every feature of an ArcGIS layer, page by page, as GeoJSON.
    async function arcgisAll(layerUrl, where = "1=1") {
      const out = [];
      for (let off = 0; off < 500000;) {
        const u = `${layerUrl}/query?where=${encodeURIComponent(where)}&outFields=*&outSR=4326&f=geojson&resultOffset=${off}&resultRecordCount=2000`;
        const r = await fetch(u);
        if (!r.ok) throw new Error(`answered ${r.status}`);
        const j = await r.json();
        if (j.error) throw new Error(j.error.message || "refused");
        const fs = j.features || [];
        out.push(...fs);
        off += fs.length;
        if (!fs.length || (!j.exceededTransferLimit && !(j.properties && j.properties.exceededTransferLimit) && fs.length < 2000)) break;
      }
      return { type: "FeatureCollection", features: out.filter((f) => f.geometry) };
    }

    /* =====================================================================

    async function gfwVector(ds) {
      let version = null;
      try { version = (await json(`${GFW}/dataset/${ds}/latest`)).data.version; } catch (e) { /* none marked latest */ }
      if (!version) {
        const vs = ((await json(`${GFW}/dataset/${ds}`)).data || {}).versions || [];
        version = vs.slice().sort((a, b) => String(a).localeCompare(String(b), "en", { numeric: true })).pop();
      }
      if (!version) throw new Error("Global Forest Watch lists no version");
      const assets = (await json(`${GFW}/dataset/${ds}/${version}/assets`)).data || [];
      const ok = assets.filter((a) => /saved/i.test(a.status || "saved") && /^https?:/.test(a.asset_uri || ""));
      const vec = ok.find((a) => /static vector tile cache/i.test(a.asset_type || "")) || ok.find((a) => /vector tile cache/i.test(a.asset_type || ""));
      if (!vec) throw new Error("Global Forest Watch publishes no map tiles for it");
      const m = vec.metadata || {};
      return { version, uri: vec.asset_uri, minzoom: Number(m.min_zoom) || 0, maxzoom: Number.isFinite(Number(m.max_zoom)) ? Number(m.max_zoom) : 12 };
    }

    // Ways to colour the protected areas (round nh11: one key that follows

      desig: { words: "Kind of designation", field: ["coalesce", ["get", "desig_type"], ["get", "DESIG_TYPE"], ""],
        rows: [["National", "#1E6FA8", "National: designated by the country's own laws"], ["Regional", "#7DC6DC", "Regional: under a regional agreement (such as the EU's Natura 2000)"],
               ["International", "#D08A9C", "International: under an international convention (World Heritage, Ramsar, UNESCO Man and the Biosphere)"], ["Not Applicable", "#6E737B", "Not applicable"]] },
      site: { words: "Protected area or other conserved area", field: ["coalesce", ["get", "site_type"], ["get", "pa_def"], ""],
        rows: [["PA", "#1E6FA8", "Protected area"], ["OECM", "#D08A9C", "Other effective area-based conservation measure (OECM): conserved, but not designated as protected"]] },

    part({

<p>Source: UNEP-WCMC and IUCN, Protected Planet: the World Database on Protected Areas, as licensed to and served by Global Forest Watch (the same source the Culprits map's protected areas row reads), read live. Non-commercial use; see protectedplanet.net for the terms.</p>`,
      async build(p) {

        const SL = ["wdpa_licensed_protected_areas", "default"];

          addLayer(p, { id: `pa-edge-${sl}`, type: "line", source: "pa", "source-layer": sl, paint: { "line-color": EDGE, "line-width": ["interpolate", ["linear"], ["zoom"], 2, 0.3, 8, 1], "line-opacity": 0.9 } });

          for (const sl of SL) {
