name: Refresh the municipal contact shards

# The registers change under us: between two pulls a month apart, the
# French directory dropped Grenoble's published email address. The page
# asks Wikidata for everything else when a reader opens a place, so the
# shards in muni/ are the only part of it that can go stale, and this is
# what stops them.
#
# Monthly, and on demand from the Actions tab.

on:
  schedule:
    - cron: '41 7 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install what the build needs
        # xlrd reads REL's .xls export, which is the Spanish crosswalk.
        run: pip install --quiet openpyxl xlrd

      - name: Keep the committed counts to compare against
        run: cp muni/index.json "${{ runner.temp }}/index-before.json"

      - name: Rebuild from the national registers
        run: python3 tools/build_muni.py --out muni --work "${{ runner.temp }}"

      - name: Refuse an empty or shrunken build
        # A register that answers with half a file, or a join that quietly
        # stops matching, would otherwise be committed as a loss of data.
        # The test is each country against what it built last month rather
        # than against a fixed floor: the countries here range from 341
        # municipalities to 35,000, so any one number would be either no
        # guard at all for France or a permanent veto on the Netherlands.
        run: |
          python3 - "${{ runner.temp }}/index-before.json" <<'PY'
          import json, sys
          before = json.load(open(sys.argv[1])).get('per_country') or {}
          idx = json.load(open('muni/index.json'))
          now, total = idx.get('per_country') or {}, idx.get('records', 0)
          print('records:', total)
          for iso in sorted(set(before) | set(now)):
              print('  %s  was %-7s now %s' % (iso, before.get(iso, '-'), now.get(iso, '-')))
          if total < 40000:
              sys.exit('built only %d records in all; refusing to commit' % total)
          for iso, was in before.items():
              got = now.get(iso, 0)
              if got < was * 0.8:
                  sys.exit('%s built %d records against %d last time; refusing to commit'
                           % (iso, got, was))
          for iso, got in now.items():
              if got < 50:
                  sys.exit('%s built only %d records; refusing to commit' % (iso, got))
          PY

      - name: Commit if anything changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add muni
          if git diff --cached --quiet; then
            echo 'The registers published nothing new.'
          else
            git commit -m "muni: refresh the contact shards from the national registers

          Rebuilt by tools/build_muni.py from the registers named in
          muni/index.json. Each record is joined to a Wikidata id through a
          code the two sources share, except Spain, which publishes none and
          is matched on the official name inside a fixed province under the
          four conditions set out in that script."
            git push
          fi
