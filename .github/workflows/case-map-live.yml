name: case map live

on:
  schedule:
    - cron: "23 7 * * *"      # once a day
  workflow_dispatch:
  push:
    paths:
      - "case-map-live-src/update_live.py"

permissions:
  contents: write

concurrency:
  group: case-map-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            case-map-live-src
            globalization.html
            case_map_live.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python case-map-live-src/update_live.py
      - name: commit case_map_live.json
        run: |
          git config user.name  "case-map-bot"
          git config user.email "case-map-bot@users.noreply.github.com"
          git add case_map_live.json
          git diff --staged --quiet || git commit -m "case map live: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
