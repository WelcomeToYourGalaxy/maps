name: secret society wire

on:
  schedule:
    - cron: "41 */6 * * *"      # every six hours
  workflow_dispatch:
  push:
    paths:
      - "secret-society-src/harvest_wire.py"
      - "secret-society-src/wire_feeds.json"

permissions:
  contents: write

concurrency:
  group: secret-society-wire
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            secret-society-src
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install feedparser
      - run: python secret-society-src/harvest_wire.py
      - name: commit secret_society_wire.json
        run: |
          git config user.name  "wire-bot"
          git config user.email "wire-bot@users.noreply.github.com"
          git add secret_society_wire.json
          git diff --staged --quiet || git commit -m "secret society wire: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
